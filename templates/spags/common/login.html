<body class="login">
<div id="container" class=" login">

    <div id="login-bg">
        <div id="login-bg-inner" style="position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;min-width:50%;min-height:50%;background-position:center center;background-size:cover;"></div>
    </div>

    <div id="content" class="clearfix">
        <div id="login-logo">
            <a href="/"><img src="/images/{SITE_LOCATION}/logo-login.png" alt="{SITE_NAME}" /></a>
        </div>
        <!--<h1 style="text-transform:capitalize">{SITE_NAME}</h1>-->
        <p class="error">{ERROR}</p>
        <form id="loginForm" method="post" class="clearfix login-form" action="/loginForm.php?{GET_PARAMS}">
            <fieldset>
                <!--<label for="username">Login Name:</label>-->
                <!--[if lt IE 10]>Username:<![endif]-->
                <input type="text" name="username" id="username" placeholder="Username" />
            </fieldset>
            <fieldset>
                <!--<label for="password">Password:</label>-->
                <!--[if lt IE 10]>Password:<![endif]-->
                <input type="password" name="password" id="password" placeholder="Password" />
            </fieldset>
            <input type="hidden" name="page" value="{HIDDEN}" />
            <input class="login submit-btn-plain" type="submit" name="Submit" value="Login" alt="Login" />
            <!-- BEGIN remember_me -->
            <label><input type="checkbox" name="rememberme" value="1" />Remember me</label>
            <!-- END remember_me -->
        </form>
        <!-- <p class="forgotten"><a href="/forgotten-password.php">Parents, forgotten your password?</a></p> -->
    </div>

    <div id="footer" class="login">

<script type="text/javascript" src="/javascript/components/jquery/jquery.min.js"></script>
<script type="text/javascript">
    $(document).ready(function () {
        var images = ['login-1.jpg',
            'login-2.jpg',
            'login-3.jpg'];

        $('#login-bg-inner')
            .css({
                'background-image': 'url(/images/{SITE_LOCATION}/' + images[Math.floor(Math.random() * images.length)] + ')'
            });
    });
</script>
<!-- IF IE - use Placeholder Fallback -->
<!--[if lt IE 10 ]>
<script type="text/javascript">
    $(".login-form").find('[placeholder]').each(function(){
        $(this).val($(this).attr('placeholder'));
        $(this).focus(function() {
            if ($(this).attr('placeholder')==$(this).val()) {
                $(this).val('');
            }
        });
    });
</script>
