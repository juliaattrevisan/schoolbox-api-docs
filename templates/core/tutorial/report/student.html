<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/javascript/jscalendar/calendar-blue2.css" />
<script type="text/javascript" src="/javascript/jscalendar/calendar.js"></script>
<script type="text/javascript" src="/javascript/jscalendar/lang/calendar-en.js"></script>
<script type="text/javascript" src="/javascript/jscalendar/calendar-setup_stripped.js"></script>
<link rel="stylesheet" href="/css/jquery.autocomplete.css" type="text/css" />

<script type="text/javascript" src="/javascript/jquery.autocomplete.js"></script>
<script type="text/javascript">
var $j = jQuery.noConflict();
$j(document).ready(function () {
	$j('.lookup').each(function () {
		var node = $j(this);
		$j(this).autocomplete({
			serviceUrl: '/ajax/user.php?groupID=0',
			minChars: 2,
			maxHeight: 400,
			width: node.width(),
			onSelect: function (value, data) {
				$j("#userID").val(data);
				return false;
			}
		});
	});
});

</script>
<!-- END custom_head -->
<h1>Student Report - {STUDENT}</h1>
<span class="header_option">
    <a href="/search/user/{STUDENT_ID}">View</a>
</span>
<form action="/modules/tutorial/report/student.php" method="get">
  <table style="width: 650px;">
    <tr>
      <td>Student</td>
      <td><input class="lookup" type="text" name="keyword" value="{STUDENT}" /></td>
      <td>From:</td>
      <td style="white-space: nowrap;"><input name="from" id="from" type="text" size="15" maxlength="10" value="{FROM}"/>
        <img src="/images/ico_calendar.gif" width="16" height="13" id="from_trigger" style="cursor: pointer;" title="Date selector" onMouseOver="this.style.background='red';" onMouseOut="this.style.background=''"/>
        <script type="text/javascript">
		Calendar.setup({
			inputField     :    "from",     // id of the input field
			ifFormat       :    "%d/%m/%Y",      // format of the input field
			button         :    "from_trigger",  // trigger for the calendar (button ID)
			align          :    "br",           // alignment (defaults to "Bl")
			singleClick    :    true
		});
		</script></td>
      <td>To:</td>
      <td style="white-space: nowrap;"><input name="to" id="to" type="text" size="15" maxlength="10" value="{TO}"/>
        <img src="/images/ico_calendar.gif" width="16" height="13" id="to_trigger" style="cursor: pointer;" title="Date selector" onMouseOver="this.style.background='red';" onMouseOut="this.style.background=''"/>
        <script type="text/javascript">
		Calendar.setup({
			inputField     :    "to",     // id of the input field
			ifFormat       :    "%d/%m/%Y",      // format of the input field
			button         :    "to_trigger",  // trigger for the calendar (button ID)
			align          :    "br",           // alignment (defaults to "Bl")
			singleClick    :    true
		});
		</script></td>
      <td>
      <input class="userID" type="hidden" name="userID" id="userID" value="{STUDENT_ID}" />
      <input type="submit" name="submit" value="Report" /></td>
    </tr>
  </table>
</form>
<!-- BEGIN has_events -->
<table cellspacing="0" class="ruler">
  <!-- BEGIN class_list -->
  <tr class="obsessive">
    <td colspan="7"><h2>{TUTORIAL} - {CODE} - {TYPE}</h2>
    <span class="header_option">
    	<a href="/modules/tutorial/event/modify.php?eventID={EVENT_ID}">Modify</a>
    </span>
    </td>
  </tr>
  <tr>
    <th style="width: 20%;">Date</th>
    <th style="width: 20%;">Start</th>
    <th style="width: 20%;">Finish</th>
    <th style="width: 20%; text-align: right;">Hours Missed</th>
    <th style="width: 20%; text-align: right;">Hours Attended</th>
  </tr>
  <!-- BEGIN event_list -->
  <tr class="{ON_OFF}">
    <td>{DATE}</td>
    <td>{START}</td>
    <td>{FINISH}</td>
   
    <td style="text-align: right;">{HOURS_MISSED}</td>
     <td style="text-align: right;">{HOURS_ATTENDED}</td>
  </tr>
  <!-- END event_list -->
  <tfoot>
  <tr>
    <td colspan="2" class="bold">Total</td>
    <td class="bold">{ATTENDANCE}% Attendance</td>
    
    <td class="bold" style="text-align: right;">{TOTAL_MISSED}</td>
    <td class="bold" style="text-align: right;">{TOTAL_ATTENDED}</td>
  </tr>
  </tfoot>
  <!-- END class_list -->
</table>
<!-- END has_events -->
