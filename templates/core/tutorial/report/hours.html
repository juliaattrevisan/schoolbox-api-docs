<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<script type="text/javascript">
var $j = jQuery.noConflict();
$j(document).ready(function () {
	$j('#processAll').click(function () {
		var node = $j(this);
		$j('.processed').each(function () {
			$j(this).attr("checked", node.attr("checked"));
		});
		
	});
	
	$j('#from, #to').datepicker({ 
		dateFormat: 'dd/mm/yy',
		showOn:'both',
		buttonImage: '/images/core/calendar/calendar-click.png',
		buttonImageOnly: true,
        constrainInput: false,
        onClose: function (string) {
            var input = $j(this);

            $j.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                input.val(data.time);
            })
        }
	});
	
	
});
</script>
<style type="text/css">
	table.nowrap td {
		white-space: nowrap;
		padding: 4px;
	}

</style>
<!-- END custom_head -->
<h1>Hours Performed</h1>
<span class="header_option">
	<a href="/modules/tutorial/export/hours.php?from={FROM}&amp;to={TO}">Export to CSV</a>
</span>
<form action="/modules/tutorial/report/hours.php" method="get">
  <table class="nowrap">
    <tr class="pedantic">
      <td>From:</td>
      <td><input name="from" id="from" type="text" size="15" maxlength="10" value="{FROM}"/>
       </td>
      <td>To:</td>
      <td><input name="to" id="to" type="text" size="15" maxlength="10" value="{TO}"/>
        </td>
        <td><input type="radio" name="filter" value="unprocessed" {FILTER_UNPROCESSED_SELECTED} /></td>
        <td>Unprocessed</td>
        <td><input type="radio" name="filter" value="processed" {FILTER_PROCESSED_SELECTED} /></td> 
        <td>Processed</td>
        <td><input type="radio" name="filter" value="both" {FILTER_BOTH_SELECTED} /></td>
 		<td>Both</td>     
      <td><input type="submit" name="submit" value="Report" /></td>
    </tr>
  </table>
</form>
<!-- BEGIN has_events -->
<form action="/modules/tutorial/report/hours.php" method="post">
<table>
  <!-- BEGIN tutor_list -->
  <tr class="obsessive">
    <td colspan="11"><h2>{TUTOR_NAME}</h2>
    <span class="header_option">
    	<a href="/modules/tutorial/event/list.php?userID={TUTOR_ID}">View Subjects</a>
    </span></td>
  </tr>
  <tr>
    <th>Processed</th>
    <th>Marked</th>
    <th>Tutorial</th>
    <th>Code</th>
    <th>Type</th>
    <th>Tutorial Date</th>
    <th>Start</th>
    <th>Finish</th>
    <th>Enrolled</th>
    <th>Attended</th>
    <th>Hours</th>
  </tr>
  <!-- BEGIN event_list -->
  <tr class="{ON_OFF}">
    <td><input type="checkbox" name="processed[{EVENT_ID}][{TUTOR_ID}]" class="processed" value="1" {PROCESSED_SELECTED} /></td>
    <td>{MARKED}</td>
    <td><a href="/modules/tutorial/enrolment/list.php?eventID={EVENT_ID}">{TUTORIAL}</a></td>
    <td>{CODE}</td>
    <td>{TYPE}</td>
    <td>{DATE}</td>
    <td>{START}</td>
    <td>{FINISH}</td>
    <td>{ENROLLED}</td>
    <td>{ATTENDED}</td>
    <td style="text-align: right;">{HOURS}</td>
  </tr>
  <!-- END event_list -->
  <tr>
    <td>&nbsp;</td>
    <td colspan="9" class="bold">Total</td>
    <td class="bold" style="text-align: right;">{TOTAL}</td>
  </tr>
  <!-- END tutor_list -->
</table>
<p style="padding: 4px 12px;">
<input type="submit" value="Process checked" class="float-right"/>
<input type="checkbox" id="processAll" /> Check All
</p>
</form>
<!-- END has_events -->
