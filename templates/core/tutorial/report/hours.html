<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/javascript/jscalendar/calendar-blue2.css" />
<script type="text/javascript" src="/javascript/jscalendar/calendar.js"></script>
<script type="text/javascript" src="/javascript/jscalendar/lang/calendar-en.js"></script>
<script type="text/javascript" src="/javascript/jscalendar/calendar-setup_stripped.js"></script>
<!-- END custom_head -->
<h1>Hours Performed</h1>
<span class="header_option">
	<a href="/modules/tutorial/export/hours.php?from={FROM}&amp;to={TO}">Export to CSV</a>
</span>
<form action="/modules/tutorial/report/hours.php" method="get">
  <table style="width: 600px;">
    <tr>
      <td>From:</td>
      <td><input name="from" id="from" type="text" size="15" maxlength="10" value="{FROM}"/>
        <img src="/images/ico_calendar.gif" width="16" height="13" id="from_trigger" style="cursor: pointer;" title="Date selector" onMouseOver="this.style.background='red';" onMouseOut="this.style.background=''"/>
        <script type="text/javascript">
		Calendar.setup({
			inputField     :    "from",     // id of the input field
			ifFormat       :    "%d/%m/%Y",      // format of the input field
			button         :    "from_trigger",  // trigger for the calendar (button ID)
			align          :    "br",           // alignment (defaults to "Bl")
			singleClick    :    true
		});
		</script></td>
      <td>To:</td>
      <td><input name="to" id="to" type="text" size="15" maxlength="10" value="{TO}"/>
        <img src="/images/ico_calendar.gif" width="16" height="13" id="to_trigger" style="cursor: pointer;" title="Date selector" onMouseOver="this.style.background='red';" onMouseOut="this.style.background=''"/>
        <script type="text/javascript">
		Calendar.setup({
			inputField     :    "to",     // id of the input field
			ifFormat       :    "%d/%m/%Y",      // format of the input field
			button         :    "to_trigger",  // trigger for the calendar (button ID)
			align          :    "br",           // alignment (defaults to "Bl")
			singleClick    :    true
		});
		</script></td>
      <td><input type="submit" name="submit" value="Report" /></td>
    </tr>
  </table>
</form>
<!-- BEGIN has_events -->
<table>
  <!-- BEGIN tutor_list -->
  <tr class="obsessive">
    <td colspan="9"><h2>{TUTOR_NAME}</h2></td>
  </tr>
  <tr>
    <th>Marked</th>
    <th>Tutorial</th>
    <th>Code</th>
    <th>Type</th>
    <th>Tutorial Date</th>
    <th>Start</th>
    <th>Finish</th>
    <th>Students</th>
    <th>Hours</th>
  </tr>
  <!-- BEGIN event_list -->
  <tr class="{ON_OFF}">
    <td>{MARKED}</td>
    <td><a href="/modules/tutorial/enrolment/list.php?eventID={EVENT_ID}">{TUTORIAL}</a></td>
    <td>{CODE}</td>
    <td>{TYPE}</td>
    <td>{DATE}</td>
    <td>{START}</td>
    <td>{FINISH}</td>
    <td>{STUDENTS}</td>
    <td style="text-align: right;">{HOURS}</td>
  </tr>
  <!-- END event_list -->
  <tr>
    <td colspan="8" class="bold">Total</td>
    <td class="bold" style="text-align: right;">{TOTAL}</td>
  </tr>
  <!-- END tutor_list -->
</table>
<!-- END has_events -->
