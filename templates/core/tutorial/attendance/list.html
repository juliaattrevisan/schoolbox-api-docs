<!-- BEGIN custom_head -->

<link rel="stylesheet" href="/css/jquery.autocomplete.css" type="text/css" />
<style type="text/css">
.ruler tr td { vertical-align: middle; }

#ajax_loader { visibility: hidden; }

.reason_select { width: 140px; }
</style>
<script type="text/javascript" src="/javascript/jquery.autocomplete.js"></script>
<script type="text/javascript">
var $j = jQuery.noConflict();
$j(document).ready(function () {
	$j('.lookup').each(function () {
		var node = $j(this);
		
		$j(this).autocomplete({
			serviceUrl: '/ajax/user.php?groupID=0',
			minChars: 2,
			maxHeight: 400,
			width: node.width(),
			onSelect: function (value, data) {
				node.parents("form:first").children("input.userID").val(data);
				return false;
			}
		});
	});
	
	// disable all elements in forms with class disabled
	$j(".disabled input, .disabled select").each(function () {
		$j(this).attr("disabled", "disabled");
	});	
	
});

</script>

<!-- END custom_head -->
<h1>Tutorial Management - Attendance Week Ending {WEEK_END} </h1>
<a href="/modules/tutorial/event/modify.php" class="btn add"><span></span>Add Tutorial</a> 

<!-- BEGIN event -->
<form action="/modules/tutorial/attendance/modifyForm.php" method="post" class="{DISABLED} clearfix">
	<h2>{EVENT_NAME} - {EVENT_DATE} ({EVENT_START} - {EVENT_FINISH})</h2>
	<span class="header_option in-h2"> <a href="/modules/tutorial/event/modifyForm.php?delete={EVENT_ID}" onclick="return confirm('Delete this tutorial?')" title="Delete Event" class="btn delete"><span></span>Delete</a> <a href="/modules/tutorial/event/modify.php?eventID={EVENT_ID}" title="Modify Event" class="btn modify"><span></span>Modify</a> <a href="/modules/tutorial/enrolment/list.php?eventID={EVENT_ID}" title="Attendance history" class="btn due-work"><span></span>Attendance history</a> </span> 
	<!-- BEGIN has_students -->
	<table class="ruler">
		<col width="60" />
		<col />
		<col width="120" />
		<col width="60" />
		<thead>
			<tr>
				<th>Remove</th>
				<th>Student</th>
				<th>Reason</th>
				<th>Present</th>
			</tr>
		</thead>
		<tbody>
			<!-- BEGIN student -->
			<tr style="vertical-align: middle;" class="{ON_OFF}">
				<td style="text-align: center;"><!-- BEGIN remove --> 
					<a href="/modules/tutorial/enrolment/modifyForm.php?delete={STUDENT_ID}&eventID={EVENT_ID}" 
					onclick="return confirm('{STUDENT_NAME_ESCAPED} will be removed from this class. Press OK to continue.');" title="Remove student from class."> <img src="/images/tutorial/enrolment-delete.gif" alt="Remove enrolment" /></a><!-- END remove --> 
					<!-- BEGIN remove_grey --> 
					<img src="/images/tutorial/enrolment-delete-grey.gif" title="You cannot remove attendance" alt="" /><!-- END remove_grey --></td>
				<td><a href="/search/user/{STUDENT_ID}">{STUDENT_NAME}</a></td>
				<td><select name="reason[{STUDENT_ID}]" class="reason_select">
						<option value="">N/A</option>
						<!-- BEGIN reason_select -->
						<option value="{REASON_NAME}" {REASON_SELECTED}>{REASON_NAME}</option>
						<!-- END reason_select -->
					</select></td>
				<td><input class="present_check" type="checkbox" name="present[{STUDENT_ID}]" value="1" {ATTENDANCE_SELECTED} /></td>
			</tr>
			<!-- END student -->
		</tbody>
	</table>
	<!-- END has_students -->
	
	<input type="hidden" name="eventID" value="{EVENT_ID}" />
	<input type="hidden" name="week" value="{WEEK}" />
	<input type="submit" value="{ACTION} Attendance" class="submit-btn-plain" />
</form>
<form action="/modules/tutorial/enrolment/modifyForm.php" method="post" class="{DISABLED} clearfix" onsubmit="return this.userID.value != '' || this.userIDSelect.value != ''; ">
	<input class="lookup" type="text" name="keyword" />
	<input type="hidden" name="userID" class="userID" />
	<input type="hidden" name="eventID" value="{EVENT_ID}" />
	<input type="submit" value="Add Student" class="submit-btn-plain float-none" />
	<div class="float-fix"></div>
	<!-- BEGIN list_add --> 
	<span class="bold">&nbsp;&nbsp;or&nbsp;&nbsp;</span>
	<select name="userIDSelect">
		<option>Please Select..</option>
		<!-- BEGIN adduser -->
		<option value="{ADDUSER_ID}">{ADDUSER_NAME}</option>
		<!-- END adduser -->
	</select>
	<input type="submit" value="Add Student" class="submit-btn-plain" />
	<!-- END list_add -->
</form>
<!-- END event -->
