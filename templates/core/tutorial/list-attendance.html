<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.autocomplete.css" type="text/css" />
<style type="text/css">
.rule tr td {
	vertical-align: middle;
}
#ajax_loader {
	visibility: hidden;
}
.reason_select {
	width: 140px;
}
</style>
<script type="text/javascript" src="/javascript/jquery.js"></script>
<script type="text/javascript" src="/javascript/jquery.autocomplete.js"></script>
<script type="text/javascript">
var $j = jQuery.noConflict();
$j(document).ready(function () {
	$j('.lookup').each(function () {
		var node = $j(this);
		
		$j(this).autocomplete({
			serviceUrl: '/ajax/user.php?groupID=0',
			minChars: 2,
			maxHeight: 400,
			width: node.width(),
			onSelect: function (value, data) {
				node.parents("form:first").children("input.userID").val(data);
				return false;
			}
		});
	});
	
	// disable all elements in forms with class disabled
	$j(".disabled input, .disabled select").each(function () {
		$j(this).attr("disabled", "true");
	});	
	
});

</script>

<!-- END custom_head -->
<h1>Tutorial Management - Attendance Week Ending {WEEK_END}</h1>
<span class="header_option">
<a href="modify-event.php">Add Tutorial</a>
</span>

<div class="indent">
<!-- BEGIN event -->
