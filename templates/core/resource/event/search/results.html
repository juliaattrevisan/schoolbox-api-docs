<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Calendar <!-- BEGIN count -->({EVENT_DISP_COUNT} / {EVENT_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN event -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="/calendar/full/{EVENT_DATE_RAW}#day">
								<div class="icon-calendar icon-32"></div>
								<h3>{EVENT_TITLE}</h3>
								<p class="meta">{EVENT_DATE} {EVENT_TIME} <br />
									{EVENT_TYPE} <br />
									{EVENT_LOCATION}</p>

							</a>
						</div>
						<article>{EVENT_DETAIL}</article>
					</div>
				</li>
			<!-- END event -->
			</ul>
		</section>
	</div>
<!-- BEGIN see_more -->
<p>
	<a rel="event" id="event-more" class="float-left btn more" href="#"><span></span>See all {MORE_COUNT} results for Events</a>
</p>
<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
