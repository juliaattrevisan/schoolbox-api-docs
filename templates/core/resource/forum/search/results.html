<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Forums <!-- BEGIN count -->({FORUM_DISP_COUNT} / {FORUM_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN forum -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="/forum/thread/{FORUM_THREADID}">
								<div class="icon-forum icon-32"></div>
								<h3>{FORUM_TITLE}</h3>
								<p class="meta">{FORUM_BREADCRUMB}</p>
								<p class="meta">Posted by <a href="/search/user/{FORUM_OWNER}">{FORUM_OWNER_NAME}</a> {FORUM_CREATED}</p>
							</a>
						</div>
						<article>{FORUM_BODY}</article>
					</div>
				</li>
			<!-- END forum -->
			</ul>
		</section>
	</div>
<!-- BEGIN see_more -->
<p>
	<a rel="forum" id="forum-more" class="float-left btn more" href="#"><span></span>See all {MORE_COUNT} results for Forums</a>
</p>
<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
