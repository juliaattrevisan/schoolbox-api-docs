<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Links <!-- BEGIN count -->({LINK_DISP_COUNT} / {LINK_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			    <!-- BEGIN link -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="{LINK_URL}" rel="{LINK_TARGET}">
								<div class="icon-link icon-32"></div>
								<h3>{LINK_DESCRIPTION}</h3>
								<p class="meta">{LINK_BREADCRUMB}</p>
								<p class="meta">Created by <a href="/search/user/{LINK_OWNER}">{LINK_OWNER_NAME}</a> {LINK_CREATED}</p>
							</a>
						</div>
						<article>{LINK_COMMENT}</article>
					</div>
				</li>
			    <!-- END link -->
			</ul>

            <!-- BEGIN see_more -->
            <div class="content">
                <a id="link-more" data-more="link" class="button icon-view" href="#">See all {MORE_COUNT} results for links</a>
            </div>
            <!-- END see_more -->
		</section>
	</div>
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" data-page="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
