<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Links <!-- BEGIN count -->({LINK_DISP_COUNT} / {LINK_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN link -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="{LINK_URL}" rel="{LINK_TARGET}">
								<div class="icon-link icon-32"></div>
								<h3>{LINK_DESCRIPTION}</h3>
								<p class="meta">{LINK_BREADCRUMB}</p>
								<p class="meta">Created by <a href="/search/user/{LINK_OWNER}">{LINK_OWNER_NAME}</a> {LINK_CREATED}</p>
							</a>
						</div>
						<article>{LINK_COMMENT}</article>
					</div>
				</li>
			<!-- END link -->
			</ul>
		</section>
	</div>
<!-- BEGIN see_more -->
<p>
	<a id="link-more" class="float-left btn more" rel="link" href="#"><span></span>See all {MORE_COUNT} results for links</a>
</p>
<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
