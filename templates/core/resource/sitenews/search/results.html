<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">School News <!-- BEGIN count -->({SITENEWS_DISP_COUNT} / {SITENEWS_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
    			<!-- BEGIN sitenews -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="{SITENEWS_LINK}">
								<div class="icon-news icon-32"></div>
								<h3>{SITENEWS_HEADING}</h3>
								<p class="meta">{SITENEWS_BREADCRUMB}</p>
								<p class="meta">Written by <a href="/search/user/{SITENEWS_OWNER}">{SITENEWS_OWNER_NAME}</a> {SITENEWS_CREATED}</p>
							</a>
						</div>
						<article>{SITENEWS_BODY}</article>
					</div>
				</li>
			    <!-- END sitenews -->
			</ul>

            <!-- BEGIN see_more -->
            <div class="content">
                <a id="sitenews-more" data-more="sitenews" class="button icon-view" href="#">See all {MORE_COUNT} results for School News</a>
            </div>
            <!-- END see_more -->
		</section>
	</div>
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" data-page="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
