<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Homepage News <!-- BEGIN count -->({HOMEPAGENEWS_DISP_COUNT} / {HOMEPAGENEWS_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN homepagenews -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="{HOMEPAGENEWS_LINK}">
								<div class="icon-news icon-32"></div>
								<h3>{HOMEPAGENEWS_HEADING}</h3>
								<p class="meta">{HOMEPAGENEWS_BREADCRUMB}</p>
								<p class="meta">Written by <a href="/search/user/{HOMEPAGENEWS_OWNER}">{HOMEPAGENEWS_OWNER_NAME}</a> {HOMEPAGENEWS_CREATED}</p>

							</a>
						</div>
						<article>{HOMEPAGENEWS_BODY}</article>
					</div>
				</li>
			<!-- END homepagenews -->
			</ul>
		</section>
	</div>
	<!-- BEGIN see_more -->
	<p>
		<a id="homepagenews-more" class="float-left btn more" rel="homepagenews" href="#"><span></span>See all {MORE_COUNT} results for Homepage News</a>
	</p>
	<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
