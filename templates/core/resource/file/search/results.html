<div class="row">
	<div class="small-12 island">
		<h2 class="subheader">Files <!-- BEGIN count -->({FILE_DISP_COUNT} / {FILE_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN file -->
				<li class="row" data-equalizer>
					<div class="column no-pad small-11" data-equalizer-watch>
						<div class="avatar card">
							<a href='/send.php?id={FILE_ID}'>
								<img src="/images/mime/60x60/{FILE_ICON}" class="content" />
								<h3>{FILE_DESCRIPTION}</h3>
							</a>
							<p class="meta">{FILE_BREADCRUMB}</p>
							<p class="meta">{FILE_SIZE} | Uploaded by <a href="/search/user/{FILE_OWNER}">{FILE_OWNER_NAME}</a> {FILE_CREATED}</p>
						</div>
						<article>{FILE_COMMENT}</article>

					</div>
					<!-- BEGIN modify -->
					<div class="one actions">
						<a data-equalizer-watch data-tooltip class="icon-modify no-text" href="/cms/file/{FILE_ID}" title="Modify"></a>
					</div>
					<!-- END modify -->
				</li>
			<!-- END file -->
			</ul>
		</section>
	</div>
	<!-- BEGIN see_more -->
	<p>
		<a id="file-more" class="float-left btn more" rel="file" href="#"><span></span>See all {MORE_COUNT} results for files</a>
	</p>
	<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
