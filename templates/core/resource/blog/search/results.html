<div class="row">
	<div class="small-12 island">
	<h2 class="subheader">Blogs <!-- BEGIN count -->({BLOG_DISP_COUNT} / {BLOG_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			<!-- BEGIN blog -->
				<li class="row">
					<div class="column no-pad small-12">
						<div class="avatar card">
							<a href="/homepage/{BLOG_CID}">
								<div class="icon-blog icon-32"></div>
								<h3>{BLOG_HEADING}</h3>
								<p class="meta">{BLOG_BREADCRUMB}</p>
								<p class="meta">Written by <a href="/search/user/{BLOG_OWNER}">{BLOG_OWNER_NAME}</a> {BLOG_CREATED}</p>
							</a>
						</div>
						<article>{BLOG_BODY}</article>
					</div>
				</li>
			<!-- END blog -->
			</ul>
		</section>
	</div>
<!-- BEGIN see_more -->
<p>
	<a rel="blog" id="blog-more" class="float-left btn more" href="#"><span></span>See all {MORE_COUNT} results for Blogs</a>
</p>
<!-- END see_more -->
	<ul class="pagination">
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" rel="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
