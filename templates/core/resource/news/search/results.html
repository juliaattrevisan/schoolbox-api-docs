<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">{TPL_LOCAL_NEWS_PC} <!-- BEGIN count -->({NEWS_DISP_COUNT} / {NEWS_COUNT})<!-- END count --></h2>
        <section>
            <ul class="action-list">
                <!-- BEGIN news -->
                <li class="row">
                    <div class="list-item">
                        <div class="card small-12">
                            <a href="{NEWS_LINK}?ref=search">
                                <div class="icon-news size-32"></div>
                                <h3>{NEWS_TITLE}</h3>
                            </a>
                            <p class="meta">Written by
                                <a href="/search/user/{NEWS_AUTHOR_ID}">{NEWS_AUTHOR_NAME}</a>
                                <time title="{NEWS_PUBLISH_AT_LONG}">{NEWS_PUBLISH_AT}</time>
                            </p>
                        </div>
                    </div>
                    <article>{NEWS_BLURB}</article>
                </li>
                <!-- END news -->
            </ul>

            <!-- BEGIN see_more -->
            <div class="component-action">
                <section>
                    <a id="news-more" data-more="news" class="button" href="#">See all {MORE_COUNT} results for {TPL_LOCAL_NEWS_PC}</a>
                </section>
            </div>
            <!-- END see_more -->
        </section>
    </div>
    <ul class="pagination" data-search-pagination>
        <!-- BEGIN pagination -->
        <li class="{PAGE_CLASS}"><a href="#" data-page="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
        <!-- END pagination -->
    </ul>
</div>
