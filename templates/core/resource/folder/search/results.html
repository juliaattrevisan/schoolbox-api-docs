<div class="row">
	<div class="small-12 island">
		<h2 class="subheader">Folders <!-- BEGIN count -->({FOLDER_DISP_COUNT} / {FOLDER_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			    <!-- BEGIN folder -->
				<li class="row" data-equalizer>
					<div class="column no-pad small-11" data-equalizer-watch>
						<div class="avatar card">
							<a href="/homepage/{FOLDER_ID}">
								<div class="icon-folder icon-32"></div>
								<h3>{FOLDER_NAME}</h3>
								<p class="meta">{FOLDER_BREADCRUMB}</p>
							</a>
						</div>
					</div>
					<!-- BEGIN modify -->
					<div class="one actions">
						<a data-equalizer-watch data-tooltip class="icon-modify no-text" href="/cms/category/{FOLDER_ID}" title="Modify"></a>
					</div>
					<!-- END modify -->
				</li>
			    <!-- END folder -->
			</ul>

            <!-- BEGIN see_more -->
            <div class="content">
                <a id="category-more" data-more="folder" class="button icon-view" href="#">See all {MORE_COUNT} results for folders</a>
            </div>
            <!-- END see_more -->
        </section>
	</div>
	<ul class="pagination" data-search-pagination>
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" data-page="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
