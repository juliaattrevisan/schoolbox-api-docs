<div class="row">
	<div class="small-12 island">
		<h2 class="subheader">Folders <!-- BEGIN count -->({FOLDER_DISP_COUNT} / {FOLDER_COUNT})<!-- END count --></h2>
		<section>
			<ul class="action-list">
			    <!-- BEGIN folder -->
                <li class="actions-small-1">
                    <div class="list-item">
                        <div class="avatar card small-12">
                            <a href="/homepage/{FOLDER_ID}" title="Visit Homepage">
                                <div class="icon-folder icon-32"></div>

                                <h3>{FOLDER_NAME}</h3>
                                <p class="meta">{FOLDER_BREADCRUMB}</p>
                            </a>
                        </div>
                    </div>
                    <nav>
                        <!-- BEGIN modify -->
                        <a class="icon-modify" href="/cms/category/{FOLDER_ID}" title="Modify"></a>
                        <!-- END modify -->
                    </nav>
                </li>
			    <!-- END folder -->
			</ul>

            <!-- BEGIN see_more -->
            <div class="content">
                <a id="category-more" data-more="folder" class="button icon-view" href="#">See all {MORE_COUNT} results for folders</a>
            </div>
            <!-- END see_more -->
        </section>
	</div>
	<ul class="pagination" data-search-pagination>
		<!-- BEGIN pagination -->
		<li class="{PAGE_CLASS}"><a href="#" data-page="{PAGE_NUMBER}">{PAGE_NAME}</a></li>
		<!-- END pagination -->
	</ul>
</div>
