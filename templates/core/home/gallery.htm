<script type="text/javascript" src="/javascript/jquery.cycle.lite.min.js"></script>
<script type="text/javascript">
	$(function(){
		$('#galleryCycle').cycle({
			
			height: 	153,
			timeout: 	0,
			cleartype: true,
			before: function() {
				$('#galleryCycle span').slideUp();
			},
			after: function() {
				$('span', this).slideDown();
			}
		});
	});
</script>

<div id="galleryCycle">

  <a href="#" title=""><img src="/images/stjo/gallery/Tulips.jpg" /><span>Tulips</span></a>   
</div>
