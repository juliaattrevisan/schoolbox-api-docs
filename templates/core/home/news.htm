<script type="text/javascript">
	$j(function() {
		$j('#category li:first-child a').addClass('current');
		$j('ul.topic li:first-child').show();
		
		$j('#category a').click(function(event) {
			event.preventDefault();
			if (!$j(this).hasClass("current")) {
				$j('#category a').removeClass('current');
				$j(this).addClass('current');
				var el = $j(this).attr('title');
				$j('ul.topic > li').hide();
				$j('ul.topic > li.' + el).show();
			}
			return false;
		});
	});
</script>

<div class="box clearfix">
	<h2>News Headlines</h2>
	<div class="listing clearfix">
		<ul id="category" class="admin-nav">
			<!-- BEGIN topic_header -->
			<li><a href="#" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
			<!-- END topic_header -->
		</ul>
		<ul class="topic">
			<!-- BEGIN topic -->
			<li class="hide {TOPIC_CLEAN}">
				<ul>
					<!-- BEGIN news -->
					<li class="{ON_OFF} clearfix">
						<h4><a href="{NEWS_URL}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h4>
						<p class="interact">{NEWS_TIME}</p>
					</li>
					<!-- END news -->
				</ul>
			</li>
			<!-- END topic -->
		</ul>
	</div>
</div>
