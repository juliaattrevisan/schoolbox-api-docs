<div class="box">
  <h2>Weather</h2>
  <div class="text weather">
    <div class="weatherDay">
    	<img src="{IMAGE0}" alt="{PRECIS0}" />
      <h4>{DAY0}</h4>
      <p><span style="color:#f36f0e;">{HIGH0}&deg;C</span> | <span style="color:#0098d0;">{LOW0}&deg;C</span></p>
    </div>
    <div class="weatherDay dark">
    	<img src="{IMAGE1}" alt="{PRECIS1}" />
      <h4>{DAY1}</h4>
      <p><span style="color:#f36f0e;">{HIGH1}&deg;C</span> | <span style="color:#0098d0;">{LOW1}&deg;C</span></p>
    </div>
    <div class="weatherDay last">
    	<img src="{IMAGE2}" alt="{PRECIS2}" />
	<h4>{DAY2}</h4>
      <p><span style="color:#f36f0e;">{HIGH2}&deg;C</span> | <span style="color:#0098d0;">{LOW2}&deg;C</span></p>
    </div>
    <div class="float-fix"></div>
	 <p style="margin:0;"><a href="/weather/" title="" class="btn weather"><span></span>View weekly forecast</a></p>
	 <div class="float-fix"></div>
  </div>
</div>
