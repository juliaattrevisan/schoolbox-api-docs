<head>
<title>{TITLE}</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<meta http-equiv="Content-Language" content="en-au" />
<meta name="author" content="James Leckie, Lektec Consulting"/>
<meta name="ROBOTS" content="INDEX, FOLLOW" />

<link rel="stylesheet" type="text/css" media="screen" href="/css/mgs-default.css" />
<link rel="stylesheet" type="text/css" media="print" href="/css/mgs-print.css" />
<style type='text/css' rel='stylesheet'>
#content {
	height: 460px;
	margin: 4px 0 0 4px !important;
}
#content_text {
	height: 442px;
}

#header, #yellowStripe {
	margin-left: auto;
}
#content {
	margin: 10px 0 0 10px;
}
#daily-notices, #calendar-weather {
	width: 49.5%;
	float: left;
	margin-right: 5px;
	height: 410px;
}
#news-headlines div, #calendar-weather div {
	height: 40%;
	padding-bottom: 10px;
	
}
div#content_text {
	font-size: 85% !important;
}
#daily-notices {
	height: 480px;
	overflow:hidden;
}
.news_body {
	height: 460px;
	overflow: hidden;
}
marquee {
	height: 80%;
}
</style>
<!-- ULTIMATE DROP DOWN MENU Version 4.5 by Brothercake -->
<!-- http://www.udm4.com/ -->
</head>
<body>
<!-- BEGIN msubject -->
<!-- BEGIN msubject_block -->
<!-- END msubject_block -->
<!-- END msubject -->
<!-- BEGIN mgroup -->
<!-- BEGIN mgroup_block -->
<!-- END mgroup_block -->
<!-- END mgroup -->
<!-- BEGIN mlink_block -->
<!-- END mlink_block -->
<!-- BEGIN webmail_tab -->
<!-- END webmail_tab -->
<div id="content">
  
  <div id="content_text">
    <div id="daily-notices">
      <h1>{DAILY_TITLE}</h1>
      <marquee scrollamount="1" direction="up" loop="true">
      {DAILY_BODY} 
	  </marquee>
	</div>

    <div id="calendar-weather">
      <h1>Calendar &amp Weather</h1>
      <div class="indent">
        <table >
          <!-- BEGIN note_block -->
          <tr style="color:{NOTE_COLOUR}">
            <td class="calendarTime">{TIME}</td>
            <td>{NOTE_DESCRIPTION}</td>
          </tr>
          <!-- END note_block -->
        </table>
      </div>
    
      <table>
        <tr>
          <th>{DAY1}</th>
          <th>{DAY2}</th>
          <th>{DAY3}</th>
        </tr>
        <tr>
          <td><img src="/images/weather/{IMAGE1}" alt="{PRECIS1}" width="50" height="50" /><br />
            {PRECIS1}</td>
          <td><img src="/images/weather/{IMAGE2}" alt="{PRECIS2}" width="50" height="50" /><br />
            {PRECIS2}</td>
          <td><img src="/images/weather/{IMAGE3}" alt="{PRECIS3}" width="50" height="50" /><br />
            {PRECIS3}</td>
        </tr>
        <tr>
          <td><span style="color:#f33">{HIGH1}</span> - <span style="color:#09f">{LOW1}</span></td>
          <td><span style="color:#f33">{HIGH2}</span> - <span style="color:#09f">{LOW2}</span></td>
          <td><span style="color:#f33">{HIGH3}</span> - <span style="color:#09f">{LOW3}</span></td>
        </tr>
      </table>
    </div>

  </div>
</body>
</html>
