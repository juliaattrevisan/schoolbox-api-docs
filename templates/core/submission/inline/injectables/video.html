<h2>Video</h2>

<!-- BEGIN injectable_video_player -->
<link href="/javascript/components/video.js/video-js.css" rel="stylesheet">
<link href="/css/core/video-js/video-js.overrides.css" rel="stylesheet">
<script src="/javascript/components/video.js/video.js"></script>

<div class="videoWrapper">
	<video id="schoolbox_video_submission" class="video-js vjs-default-skin" controls="true" preload="auto" poster="/cms/videoThumb.php?type=submission&id={VIDEO_ID}&size=poster">
		<source src="/cms/sendVideo.php?type=submission&id={VIDEO_ID}" type='video/mp4'>
	</video>
	<script> var video = _V_("schoolbox_video_submission", {width: '100%', height: '400px'}); </script>
</div>
<!-- END injectable_video_player -->

<!-- BEGIN injectable_video_status -->
<img src="{INJECTABLE_VIDEO_STATUS_SRC}" />
<p>
	This video is currently being processed.
</p>
<!-- END injectable_video_status -->

<h2>Upload File</h2>
<p>
	Upload the marked submission.
</p>
<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
<script type="text/javascript">
	$(function() {
		$j('.prettify').prettyFileInput({
			inputHolderClass:'file-input not-static',
			buttonClass:'btn up-arrow',
			buttonActiveClass:'tick no-text',
			defaultText:'<span></span>Select marked work',
			defaultFileSelectedText:'<span></span>'
		});
	});
</script>
<div>
	<form action='/submission/returnWorkForm.php' id='#returnWorkUpload' method="post" enctype="multipart/form-data">
		<input type="hidden" name='uid[]' value="{OWNER_ID}"/>
		<input type="hidden" name='box_id' value="{BOX_ID}"/>
		<input type="file" name="file-return-{OWNER_ID}" class="prettify"/>
		<input type="hidden" class="mark-update" name="markUpdate" value="false">
		<input type="hidden" name="redirect" value="/submission/inline/view/{BOX_ID}/{OWNER_ID}" />
		<input type="submit" class='submit-btn-plain' value="Upload Returned Work" />
	</form>
	<div class="clearfix"></div>
</div>
