<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function(){

        var criterionSelector = $('[data-role="rubric-criterion-selector"]');
        var form              = criterionSelector.closest('form');

        // Do assessment-specific descriptors get shown?
        var isRubricAssessmentSpecificDescriptors = function() {
            return form.find('[data-relation="rubric-use-assessment-specific"]').prop('checked');
        };

        // Switch descriptors on/off
        var toggleDescriptors = function(action, element, timeout) {
            $(element).find('[data-role="criterion-descriptor"]').toggleClass('hide', (action == 'hide'));
        };

        if (isRubricAssessmentSpecificDescriptors()) {
            criterionSelector.find('[data-role="criterion"]').each(function () {
                if ($(this).find(':checked').length) {
                    toggleDescriptors('show', $(this).find('[data-role="criterion"]'), 0);
                }
            });
        }

        // trigger show or hide of descriptors when radio off
        form.on('change', 'input[name="resultset"]', function () {
            // hide the descriptors
            if (!isRubricAssessmentSpecificDescriptors()) {
                toggleDescriptors('hide', criterionSelector.find('[data-role="criterion"]'), 100);
            }
            // show them if checked
            else {
                criterionSelector.find('[data-role="criterion"]').each(function () {
                    var checked = $(this).children(':checkbox').prop('checked');
                    toggleDescriptors(checked ? 'show' : 'hide', $(this), 100)
                });
            }
        });

        // Did I check/uncheck a criterion selector?
        criterionSelector.on('change', ':checkbox', function () {
            var act = 'hide';

            // show if and only if both the descriptors radio and myself are checked
            if (isRubricAssessmentSpecificDescriptors() && this.checked) {
                act = 'show';
            }
            toggleDescriptors(act, $(this).closest('[data-role="criterion"]'), 100);
        });

        // trigger change of descriptor count when dropdown changed
        form.on('change', '[data-relation="rubric-descriptor-count"]', function () {
            var count = this.value;

            criterionSelector.find('[data-role="criterion-descriptors"]').each(function () {
                var i,
                    inputCount = $(this).find('[data-role="criterion-descriptor"]').length,
                    diff       = count - inputCount;

                if (diff < 0) {
                    // Remove trailing descriptors
                    for (i = 0; i < 0 - diff; ++i) {
                        $(this).find('[data-role="criterion-descriptor"]').last().detach();
                    }
                }
                else if (diff > 0) {
                    // Add descriptors to end
                    for (i = 0; i < diff; i++) {
                        var last    = $(this).find('[data-role="criterion-descriptor"]').last();
                        var newItem = last.clone(true);

                        // clear the descriptor value
                        newItem.find('[data-role="criterion-description"]').val('');
                        newItem.find('[data-role="criterion-value"]').val(
                            parseInt(newItem.find('[data-role="criterion-value"]').val()) + 1
                        );
                        newItem.insertAfter(last);
                    }
                }
            });
        });

        var critSelector       = '[data-role="criterion"]',
            inputSelector      = '[data-role="criterion-description"], [data-role="criterion-value"]',
            descriptorSelector = '[data-role="criterion-descriptor"]',
            editingClass       = 'editing',
            placeholderText    = 'Enter descriptor';

        criterionSelector.on('focus', inputSelector, function () {
            var input = $(this);
            input
                .closest(critSelector)
                .addClass(editingClass);
            input
                .closest(descriptorSelector)
                .addClass(editingClass)
                .find(inputSelector)
                .prop('readonly', false)
                .attr('placeholder', placeholderText);
        });

        criterionSelector.on('blur', inputSelector, function () {
            criterionSelector.find(critSelector + ', ' + descriptorSelector)
                .removeClass(editingClass)
                .find(inputSelector)
                .prop('readonly', true)
                .removeAttr('placeholder');
        });
    })
</script>
<!-- END custom_head -->
<fieldset data-role="rubric-criterion-selector" class="rubric-criterion-selector">
    <!-- BEGIN rubric_type_label -->
    <legend>{LABEL}</legend>
    <!-- END rubric_type_label -->

    <!-- BEGIN criteria_allowed -->
    <!-- BEGIN no_crit_group -->
    <div class="small-12 columns">
        <p>No criteria available.</p>
    </div>
    <!-- END no_crit_group -->

    <!-- BEGIN crit_group -->
    <div class="small-12 columns" data-role="criterion-group">
        <h5>{CRIT_GROUP}</h5>
        <!-- BEGIN criterion -->
        <div data-role="criterion" class="criterion">
            <input type="hidden" value="0" name="{CRIT_SLUG}"/>
            <input id="c-{CRIT_ID}"
                   type="checkbox"
                   value="1"
                   name="{CRIT_SLUG}"
                   {CRIT_CHECKED}
                   data-role="criterion-selector"
            />
            <label for="c-{CRIT_ID}" class="checkbox-label">{CRIT_NAME}</label>
            <table data-role="criterion-descriptors">
                <tr>
                    <!-- BEGIN crit_input -->
                    <td data-role="criterion-descriptor" class="hide no-pad criterion-descriptor">
                        <textarea name="des[{CRIT_ID}][]"
                                  data-role="criterion-description"
                                  readonly>{CRIT_INPUT_VALUE}</textarea>
                        <label class="criterion-descriptor-points">
                            <input name="value[{CRIT_ID}][]"
                                   type="text"
                                   size="3"
                                   data-role="criterion-value"
                                   value="{CRIT_INPUT_WEIGHT}"
                                   readonly
                                   data-validate-always />
                        </label>
                    </td>
                    <!-- END crit_input -->
                </tr>
            </table>
        </div>
        <!-- END criterion -->
    </div>
    <!-- END crit_group -->
    <a href="/submission/rubricCriteria/{RUBRIC_CAT_ID}" class="button icon-criteria">{MANAGE_CRITERIA_LABEL}</a>
    <!-- END criteria_allowed -->

    <!-- BEGIN no_criteria_allowed -->
    <div class="small-12 columns">
        <p>Course-level criteria are not available for this category, because it is not part of a course.</p>
    </div>
    <!-- END no_criteria_allowed -->

    <!-- Blahg -->
    <input type="text" class="hide" name="criteria" data-validate-always />
</fieldset>
