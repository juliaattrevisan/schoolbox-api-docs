<!-- BEGIN rubric_type_label -->
<em>{LABEL}:</em>
<!-- END rubric_type_label -->

<!-- BEGIN criteria_allowed -->
    <!-- BEGIN no_crit_group -->
    No criteria available.
    <!-- END no_crit_group -->

    <!-- BEGIN crit_group -->
    <div class="crit-group">
        <h5>{CRIT_GROUP}</h5>
        <!-- BEGIN criterion -->
        <div class="crit">
            <input type="hidden" value="0" name="{CRIT_SLUG}"/>
            <input id="c-{CRIT_ID}" type="checkbox" value="1" name="{CRIT_SLUG}"{CRIT_CHECKED} />
            <label for="c-{CRIT_ID}">{CRIT_NAME}</label>
            <table class="descs">
                <tr>
                    <!-- BEGIN crit_input -->
                    <td class="desc" style="display:none;">
                        <textarea name="des[{CRIT_ID}][]" readonly="readonly">{CRIT_INPUT_VALUE}</textarea>
                        <label class="crit-pts">
                            <input type="text" size="3" name="value[{CRIT_ID}][]" value="{CRIT_INPUT_WEIGHT}" readonly="readonly" />
                        </label>
                    </td>
                    <!-- END crit_input -->
                </tr>
            </table>
        </div>
        <!-- END criterion -->
    </div>
    <!-- END crit_group -->
    <a href="/submission/rubricCriteria/{RUBRIC_CAT_ID}" class="button icon-criteria">{MANAGE_CRITERIA_LABEL}</a>
<!-- END criteria_allowed -->

<!-- BEGIN no_criteria_allowed -->
    <p>Course-level criteria are not available for this category, because it is not part of a course.</p>
<!-- END no_criteria_allowed -->
