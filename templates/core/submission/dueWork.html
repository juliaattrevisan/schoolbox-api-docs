<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" href="/javascript/components/fullcalendar/dist/fullcalendar.min.css" />
<link rel="stylesheet" type="text/css" href="/javascript/components/fullcalendar/dist/fullcalendar.print.css" media="print" />
<link rel="stylesheet" type="text/css" href="/css/core/fullcalendar/fullcalendar.overrides.css" />

<script type="text/javascript" src="/javascript/jquery.calendar_export.js"></script>
<script type="text/javascript" src="/javascript/jquery.fullcalendar.js"></script>
<script type="text/javascript" src="/javascript/components/zeroclipboard/dist/ZeroClipboard.min.js"></script>
<script type="text/javascript">

    // provide page-wide access to the calendar object so the callbacks can actually use it
    var c;

    /**
     * Update event method:
     *
     * * Gives event a "loading" style
     * * Removes that style when update finishes
     *
     * @param event      The event to update
     * @param data       The data to send to the update script
     * @param revertFunc called if update failed for whatever reason.
     *                   Sets event back to original state.
     */
    var updateWrapper = function(event, data, revertFunc) {
        event.className.push('loading');
        c.cupdate(data, function (returnData) {
            event.className = event.className.filter(function (value) {
                return value != 'loading';
            });
            if (!returnData) {
                revertFunc();
            }
            c.dom.fullCalendar('rerenderEvents');
        });
    };

    // once the DOM has loaded, punch a fancy calendar into it
    $(function() {
        // Allow checking of anchor for view to display
        var anchor = '';
        var parts  = location.href.split('#');

        var calendarElement = $('#calendar');
        var calendarLoadingElement = $('#calendar-loading');

        if (parts.length > 1) {
            anchor = parts[1];
            switch (anchor) {
                case 'month':
                    anchor = 'month';
                    break;
                case 'week':
                case 'agendaWeek':
                    anchor = 'agendaWeek';
                    break;
                case 'day':
                case 'agendaDay':
                    anchor = 'agendaDay';
                    break;
                case 'basicWeek':
                    anchor = 'basicWeek';
                    break;
                case 'basicDay':
                    anchor = 'basicDay';
                    break;
                default:
                    anchor = '';
                    break;
            }
        }
        c = new Calendar('calendar', 'calendar-bubble', {
            userId: '{WORK_USER_ID}',

            // overrides and callbacks
//            taskTypeId: '{TASK_TYPE_ID}',
//            crud: {
//                c: '/calendar/ajax/create',
//                // r: don't need it
//                u: '/calendar/ajax/update',
//                d: '/calendar/ajax/delete'
//            },
            filter: {
                ajax: '/calendar/ajax/filter',
                btnSelector: false,
                exportButtonSelector: false,
                checkboxSelector: false,
                applyFiltersSelector: false,
                listViewButton: false
            },
            fullCalendar: {
                defaultDate: moment('{SELECTED_DATE}'),
                columnFormat: {
                    month:      'ddd',
                    week:       'ddd D/M',
                    agendaWeek: 'ddd D/M',
                    day:        'ddd D/M',
                    agendaDay:  'ddd D/M',
                    '':         'ddd D/M'
                },
                height: 'auto',
                defaultView: anchor || 'month',
                timeFormat: { month: 'h(:mm)a' },
                // Event limit: could be configured from session but leave global for now
                eventLimit: Boolean('{CALENDAR_COLLAPSE_EVENTS}'),
                firstDay: Number('{CALENDAR_START_DAY}'),

                /**
                 * When an event is drawn on the calendar
                 * @param calEvent
                 */
                eventRender: function(calEvent) {
                    // Always render placeholders in the most basic manner
                    if (calEvent.id === 'placeholder') {
                        return true;
                    }

                    // Ignore the phantom event that the API puts there
                    if (!calEvent.data) {
                        return false;
                    }

                    // Don't render me if I'm marked as do not render
                    if ('is_rendered' in calEvent && !(calEvent.is_rendered)) {
                        return false;
                    }
                    return true;
                },

                /**
                 * Nothing's resizable here
                 *
                 * @param event
                 * @param delta
                 * @param revertFunc
                 */
                eventResize: function(event, delta, revertFunc) {
                    revertFunc();
                },

                /**
                 * Nothing's movable here
                 *
                 * @param event
                 * @param delta
                 * @param revertFunc
                 */
                eventDrop: function(event, delta, revertFunc) {
                    revertFunc();
                },

                /**
                 * When the window is resized
                 * @param view
                 */
                windowResize: function(view) {
                    var wHeight = $(window).height();
                    var calTop = c.dom.offset().top;
                    c.dom.fullCalendar('option','contentHeight',wHeight - calTop - 60)
                },

                /**
                 * When external data is being fetched
                 * @param isLoading
                 * @param view
                 */
                loading: function(isLoading, view) {

                    /* Show loading div right in the middle
                     */
                    if (isLoading === true) {
                        calendarLoadingElement.removeClass('hide');
                    }
                    /* Has finished loading
                     */
                    else {
                        /* Hide loading div
                         */
                        console.log(calendarLoadingElement);
                        calendarLoadingElement.addClass('hide');
                        var d = c.dom.fullCalendar('getDate');
                        $('#datepicker').datepicker('setDate', d.format('DD-MM-YYYY'));
                    }
                },

                // Stream location
                events: function(start, end, timezone, callback) {
                    $.ajax({
                        dataType: 'json',
                        url:      '/submission/ajax/events',
                        data: {
                            start: Calendar.reOffsetTimestamp(start.unix()),
                            end:   Calendar.reOffsetTimestamp(end.unix()),
                            userId: Number('{WORK_USER_ID}')
                        },
                        success: function(data) {
                            callback(data.filter(function(v) {
                                return 'start' in v;
                            }));
                        },
                        cache: false
                    });
                }
            },
            x: false
        }).init();
    })
</script>

<style type="text/css">
    #content > .row > .small-12 table .fc-day-header.fc-widget-header,
    #content > .row > .small-12 table .fc-head .fc-widget-header,
    #content > .row > .small-12 table .fc-body .fc-widget-content,
    #content > .row > .small-12 table .fc-day-number.fc-past,
    #content > .row > .small-12 table .fc-day-number.fc-future
    {
        padding: 0;
    }
</style>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 columns">
        <div class="actions-small-1 row">
            <div class="list-item">
                <div class="small-12 column">
                    <h1>{WORK_USER_NAME} Work</h1>
                </div>
            </div>
            <!-- BEGIN is_parent -->
            <nav>
                <a class='icon-group' data-dropdown='header-options'></a>
            </nav>
            <ul id="header-options" class="f-dropdown" data-dropdown-content>
                <!-- BEGIN child -->
                <li>
                    <div class="avatar card">
                        <a href="/submission/dueWork/0/{CHILD_ID}" title="View Profile">
                            <img src="/portrait.php?userId={CHILD_EXTERNAL_ID}&size=square64" alt="View Profile" />
                            <p>{CHILD_NAME}</p>
                        </a>
                    </div>
                </li>
                <!-- END child -->
            </ul>
            <!-- END is_parent -->
        </div>
    </div>
</div>

<div class="row">
    <div class="small-12 columns">
        <div id="calendar-loading" class="loader text-center"></div>
        <div id="calendar"></div>
    </div>
</div>

<div class="row">
    <div class="small-12 medium-6 columns">
        {UPCOMING_WORK}

        <div class="row">
            <div class="small-12 island">
                <h2 class="subheader">Recent Activity</h2>
                <section>
                    <ul class="information-list">
                        {ACTIVITY_LIST}
                    </ul>
                </section>
            </div>
        </div>
    </div>

    <div class="small-12 medium-6 columns">
        <h2 class="subheader">Subjects</h2>
        {SUBJECT_LIST}
    </div>
</div>

<div id="calendar-bubble" class="cal-bubble">
    <div class="middle">
        <div class="close">&times;</div>
        <div class="js-data clearfix">
            <!-- Edit Event Form -->
            <form id="editEvent">
                <input type="hidden" name="eventId" />
                <dl>
                    <dd><h3 class="note"></h3></dd>
                    <dd><h4><span class="date"></span></h4></dd>
                    <dd><p class="location"></p></dd>
                    <dd><p class="detail wysiwyg" data-is-html="1"></p></dd>
                    <dd class="post-by meta">Posted by <a class="author" href="#" data-is-user-link="1"></a></dd>
                    <dd class="reviewed-by">Reviewed by <a class="reviewer" href="#" data-is-user-link="1"></a></dd>
                </dl>
                <ul class="relatedBookings"></ul>
                <div class="attendance">
                    <dl>
                        <dd><p class="attendanceIcon"></p></dd>
                        <dd class="rm"><p class="attendanceStatus"></p></dd>
                    </dl>
                </div>
                <div class="actions">
                    <dl>
                        <dd>
                            <span class="homepageLink" data-is-html="1"></span>
                            <span class="modifyLink" data-is-html="1"></span>
                            <span class="deleteLink" data-is-html="1"></span>
                            <span class="attendanceListButton" data-is-html="1"></span>
                            <span class="attendanceRequestButton" data-is-html="1"></span>
                        </dd>
                    </dl>
                </div>
                <div class="bookingActions" data-is-html="1">
                </div>
            </form>
        </div>
        <div class="bottom"><strong></strong></div>
    </div>
</div>
