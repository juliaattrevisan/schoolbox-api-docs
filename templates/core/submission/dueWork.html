<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.progressbar.css" media="screen" />
<script type="text/javascript" src="/javascript/ui.core.js"></script>
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
<script type="text/javascript" src="/javascript/jquery.progressbar.js"></script>
<script type="text/javascript" src="/javascript/jquery.tmpl.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.calendar_export.js"></script>
<script type="text/javascript">
$j(function () {
    /* Subject Filter */
    $j('#subjectFilter').change(function () {
        $j('li.event').fadeTo(0, 1);

        var categoryID = $j(this).val();
        if (categoryID != '') {
            $j('li.event:not(.category-' + categoryID + ')').fadeTo(0, 0.4);
        }

    });

    $j('#childSelect').change(function () {

        window.open(window.location.pathname.replace(/\/(\d+)$/, "/"+$j(this).val()), '_self', '');
        return false;
    });

    /* Calendar Popup */
	$j('.calendarTable ul li span').live("click", function(){
		$j('.duework-popup.cal-bubble.cal-bubble').remove();
		var position = $j(this).parent().offset();
		var node = $j(this).closest('li'), ev = node.attr("id").substring(6);

		var is_assess = 0;
		if (ev.match(/^assess-/)) {
			ev = ev.substring(7);
			is_assess = 1;
		}

		$j.post('/ajax/submission.php', { id : ev , is_assess: is_assess}, function (data) {

            if (data !== null) {
				var template = is_assess ? $j('#assess-popup-template') : $j('#duework-popup-template');
				var output = template.tmpl(data);
				output.find('.comment').html(data.description);
				output.appendTo('body');
                movePopup(position);
            }

		}, "json");

		return false;
	});

    $j('.close').live("click", function() {
        $j('.duework-popup.cal-bubble.cal-bubble').remove();
    });

    function movePopup (location) {
        var annoyingHeight = ($j('duework-popup.cal-bubble .middle').height() + ($j('duework-popup.cal-bubble .top').height()) + ($j('duework-popup.cal-bubble .bottom').height()))

        $j('.duework-popup.cal-bubble').css("left", (location.left - 300));

        $j('.duework-popup.cal-bubble').css("top", (location.top - annoyingHeight - 130));

        if (($j('.duework-popup.cal-bubble').css("left")) < '0px') {
            $j('.duework-popup.cal-bubble').css("left", '0');
        }

        closeBubble();
    }

    function closeBubble () {
        $j('a.bubble-close').click(function() {
            $j(this).closest('div.bubble').remove();
            return false;
        });
    }

    $j('.datepicker').datepicker({
        dateFormat:'yy-mm-dd',
        showOn:'both',
        buttonImage:'/images/core/calendar/calendar-click.png',
        buttonImageOnly:true,
        constrainInput:false,
        onSelect: function(dateText, inst) {
            var url = '/submission/dueWork/' + dateText + '/{WORK_USER_ID}';
            window.open(url, "_self");
        }
    });

    //
    // Form listener for exporter - brings up a dialog box that offers a URL
    // to click.
    $j('#calendar-export').click(function(event) {
        event.preventDefault();
        $j('#calendar-export-dialog').dialog({
            open: function(event, ui) {
                $j(event.target).find('#calendar-export-dialog-url')
                    .text($j.getExportCalendarLink(
                        '{USER_TOKEN}',
                        {'export': 'duework'}
                    )
                );
            },
            minWidth: 400,
            modal: true
        });
    });
});
</script>
<style type="text/css">
#calendar-export {
	display: inline;
	float: none;
}
</style>
<!-- END custom_head -->

<script id="duework-popup-template" type="text/x-jquery-tmpl">
    <div class="duework-popup cal-bubble wysiwyg">
        <div class="middle">
            <div class="close">x</div>
            <div class="js-data clearfix"><h3>${name}</h3>
                <p class="bubble-name"><span><a href="/homepage/${cid}">${category}</a></span> - <em>${typeName}</em></p>
                {{if description}}
                    <p class="comment">${description}</p>
                {{/if}}
                <p class="details clearfix">
                <a class="btn modify float-left" href="/submission/submissionHistory/${id}"><span></span>${action}</a>
                </p>
            </div>
            <div class="bottom"><strong></strong></div>
        </div>
    </div>
</script>


<script id="assess-popup-template" type="text/x-jquery-tmpl">
    <div class="duework-popup cal-bubble wysiwyg">
        <div class="middle">
            <div class="close">x</div>
            <div class="js-data clearfix"><h3>${name}</h3>
                <p class="bubble-name"><span><a href="/homepage/${cid}">${category}</a></span> - <em>${typeName}</em></p>
                {{if description}}
                    <p class="comment">${description}</p>
                {{/if}}
                <p class="details clearfix">
                    <a class="btn up-arrow float-left" href="/assess/intro/${id}"><span></span>${action}</a>
                </p>
            </div>
            <div class="bottom"><strong></strong></div>
        </div>
    </div>
</script>


<h1>{WORK_USER_NAME} Work</h1>
<div class="left">
	<div id="calendar">
        <div class="calendar-controls clearfix">
            <div class="float-left clearfix">

                <a class="back" href="/submission/dueWork/{PREV_MONTH}/{WORK_USER_ID}" title="Back one month"><strong>&lt;&lt;</strong></a>
                <div class="datepicker-box">
                    <input type="hidden" class="datepicker" />
                </div>
                <a class="forward" href="/submission/dueWork/{NEXT_MONTH}/{WORK_USER_ID}" title="Forward one month"><strong>&gt;&gt;</strong></a>

            </div>
            <div class="current-date">{CURRENT_DATE}</div>
            <div class="float-right">
                <select name="subject" id="subjectFilter">
                    <option value="">Show All</option>
                    <!-- BEGIN subject -->
                    <option value="{SUBJECT_ID}">{SUBJECT_NAME}</option>
                    <!-- END subject -->
                </select>
				<!-- BEGIN is_parent -->

				<select name="child" id="childSelect">
					<!-- BEGIN child -->
					<option value="{CHILD_ID}" {CHILD_ID_SELECTED}>{CHILD_NAME}</option>
					<!-- END child -->
				</select>

				<!-- END is_parent -->

				<button id="calendar-export" class="btn translate"><span></span>Export</button>
            </div>
        </div>
		<table class="month-view duedates-calendar calendarTable">
            <thead>
            <tr>
                <th width="14%" class="dark">Sun</th>
                <th width="14%" class="dark">Mon</th>
                <th width="14%" class="dark">Tue</th>
                <th width="14%" class="dark">Wed</th>
                <th width="14%" class="dark">Thu</th>
                <th width="14%" class="dark">Fri</th>
                <th width="14%" class="dark">Sat</th>
            </tr>
            </thead>
            <tbody>
				<!-- BEGIN week -->
				<tr>
					<!-- BEGIN day -->
					<td class="{PAST} {TODAY} {ACTIVE} {RIGHTY}"><div class="dayWrap">
							<p>{DATE}</p>
						</div>
						<ul>
							<!-- BEGIN event -->
							<li id="event-{EVENT_ID}" class="event category-{EVENT_CAT_ID}"> <span class="wrapper"> <strong>{TIME}</strong> {EVENT}</span> </li>
							<!-- END event -->
						</ul></td>
					<!-- END day -->
				</tr>
				<!-- END week -->
			</tbody>
		</table>
	</div>

    <div class="box component">
        {UPCOMING_WORK}
    </div>

</div>
<div class="right">
	<div class="box component">
		<h2>Subjects</h2>
		<div class="directory listing">
			<ul class="subject-list clearfix">
                {SUBJECT_LIST}
			</ul>
		</div>
	</div>
	<div class="box component">
		<h2>Recent Activity</h2>
		<div class="listing">
			<ul class="activity-list">
                {ACTIVITY_LIST}
			</ul>
		</div>
	</div>
</div>

<!-- Dialog for export -->
<div id="calendar-export-dialog">
    <div id="calendar-export-dialog-text">
        Use the following URL as the source for your feed.
    </div>
    <textarea readonly id="calendar-export-dialog-url"></textarea>
</div>
