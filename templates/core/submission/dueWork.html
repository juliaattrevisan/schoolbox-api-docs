<div class="row">
    <div class="small-12 columns">
        <h1>{WORK_USER_NAME} Work</h1>

        <!-- BEGIN is_parent -->
        <span class='header-actions'>
            <a href='#' class='button icon-group' data-dropdown='header-options'></a>
        </span>
        <ul class='f-dropdown fadeInDown' data-dropdown-content='' id='header-options'>
            <!-- BEGIN child -->
            <li class="avatar-card">
                <a href="/submission/dueWork/0/{CHILD_ID}">
                    <img src="/portrait.php?userId={CHILD_EXTERNAL_ID}&size=square64">
                    <p>{CHILD_NAME}</p>
                </a>
            </li>
            <!-- END child -->
        </ul>
        <!-- END is_parent -->
    </div>
</div>

<div class="row">
    <div class="small-12 medium-6 columns">
        {UPCOMING_WORK}

        <div class="row">
            <div class="small-12 island">
                <h2 class="subheader">Recent Activity</h2>
                <section>
                    <div class="content">
                        <ul class="activity-list">
                            {ACTIVITY_LIST}
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div class="small-12 medium-6 columns">
        <div class="row">
            <div class="small-12 island">
                <h2 class="subheader">Subjects</h2>
                <section>
                    <div class="content">
                        <ul class="subject-list">
                            {SUBJECT_LIST}
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
