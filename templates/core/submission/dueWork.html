<!-- BEGIN custom_head -->
<script type="text/javascript">
$(function () {
    $('#childSelect').change(function () {
        window.open(window.location.pathname.replace(/\/(\d+)$/, "/"+$(this).val()), '_self', '');
        return false;
    });
});
</script>
<!-- END custom_head -->

<h1>{WORK_USER_NAME} Work</h1>
<div class="left">
                    <!-- BEGIN subject -->
                    <!-- END subject -->
				<!-- BEGIN is_parent -->
					<!-- BEGIN child -->
					<!-- END child -->
				<!-- END is_parent -->
				<!-- BEGIN week -->
					<!-- BEGIN day -->
							<!-- BEGIN event -->
							<!-- END event -->
					<!-- END day -->
				<!-- END week -->

    <div class="box component">
        {UPCOMING_WORK}
    </div>

</div>
<div class="right">
	<div class="box component">
		<h2>Subjects</h2>
		<div class="directory listing">
			<ul class="subject-list clearfix">
                {SUBJECT_LIST}
			</ul>
		</div>
	</div>
	<div class="box component">
		<h2>Recent Activity</h2>
		<div class="listing">
			<ul class="activity-list">
                {ACTIVITY_LIST}
			</ul>
		</div>
	</div>
</div>

<!-- Dialog for export -->
<div id="calendar-export-dialog">

        Use the following URL as the source for your feed.
    </div>
