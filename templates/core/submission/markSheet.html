<!-- BEGIN custom_head -->
<style>
    li.ui-menu-item, .ui-combobox input {
        width: 85px;
    }
    li.ui-menu-item {
        background: #fff;
    }
    li.ui-menu-item .ui-corner-all {
        display: block;
        padding: 2px;
    }
    li.ui-menu-item .ui-corner-all:hover {
        background: #e7e7e7;
        cursor: pointer;
        text-decoration: none;
    }
</style>
<script src="/javascript/jquery.autoellipsis-1.0.3.min.js" type="text/javascript" xmlns="http://www.w3.org/1999/html"></script>
<script src="/javascript/jquery.combobox.js" type="text/javascript"></script>
<script src="/javascript/jquery.markSheet.js" type="text/javascript"></script>
<script type="text/javascript">
    $j(function() {
        $j('.combobox').combobox({COMBO_OPTIONS});
    });
</script>
<!-- END custom_head -->
<h1>{CATEGORY}</h1>
<div class="header_option">

    <form id="time-pick" action="/submission/markSheet/{CID}" method="GET" class="fade">
        <span>
            <label for="sem">Semester</label>
            <select id="sem" name="semester">
                <!-- BEGIN semester_option -->
                <option{SEMESTER_SELECTED}>{SEMESTER_VALUE}</option>
                <!-- END semester_option -->
            </select>
            <label for="yr">,</label>
            <select id="yr" name="year">
                <!-- BEGIN year_option -->
                <option{YEAR_SELECTED}>{YEAR_VALUE}</option>
                <!-- END year_option -->
            </select>
        <input type="submit" class="btn" value="Update"/>
        </span>
    </form>

<div class="clearfix"></div>
    <a href="/submission/markSheet/{CID}/{SELECTED_YEAR}/{SELECTED_SEMESTER}/export" class="btn download"><span></span>Download Spreadsheet</a>
    <a class="btn add" href="/submission/createSubmission/new/{CID}/"><span></span>Post Due Work</a>
    <a class="btn add" href="/assess/create/{CID}/"><span></span>Create Assessment</a>

</div>
<div class="mark-sheet wrap">
<div class="mark-sheet names">
    <table>
        <thead>

        <tr>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_list -->
        <tr class="{ON_OFF}">
            <td><a href="/search/user/{UID}" title="{SURNAME}, {FIRSTNAME}">{SURNAME}, {FIRSTNAME}</a></td>
        </tr>
        <!-- END student_list -->
        </tbody>
    </table>
</div>

<div class="mark-sheet assessments">
    <table>
        <thead>
            <tr>
                <!-- BEGIN sub_headers -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                    <div class="height-control">
                        <!-- BEGIN sub_head -->
                        <a href="/submission/viewSubmission/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                        <!-- END sub_head -->
                        <!-- BEGIN assess_head -->
                        <a href="/assess/results/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                        <!-- END assess_head -->
                    </div>
                </th>
                <!-- END sub_headers -->
                <th>&nbsp;</th>
            </tr>

            <tr>
                <!-- BEGIN sub_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END sub_type_head -->
                <!-- BEGIN average_type_head -->
                <th>
                    <em>Average</em>
                </th>
                <!-- END average_type_head -->
            </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_mark_list -->
        <tr class="{ON_OFF}">
            <!-- BEGIN markItem -->
            <!-- BEGIN mark -->
            <td class="column-{BOX_ID}">
                <div class="row-fix">
                    <form method="post" action="" class="markForm clearfix">
                        {STUDENT_MARKING}
                    </form>
                </div>
            </td>
            <!-- END mark -->

            <!-- BEGIN onlineAssessmentMark -->
            <td class="column-assess-{ASSESS_ASSESS_ID}">
                <a href="/assess/review/{ASSESS_ASSESS_ID}/{ASSESS_FIRST_SECTION_ID}/{ATTEMPT_ID}">{MARK}</a>
            </td>
            <!-- END onlineAssessmentMark -->
            <!-- END markItem -->
            <!-- BEGIN mark_average -->
            <td class="mark-average">
                <div class="row-fix avg-mark" id="avg-{UID}">
                    <span>{STUDENT_AVERAGE_MARK}</span>
                </div>
            </td>
            <!-- END mark_average -->
        </tr>
        <!-- END student_mark_list -->
        </tbody>
    </table>

</div>

</div>
