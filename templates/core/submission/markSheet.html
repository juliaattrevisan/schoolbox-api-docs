<!-- BEGIN custom_head -->
<script src="/javascript/jquery.autoellipsis-1.0.3.min.js" type="text/javascript" xmlns="http://www.w3.org/1999/html"></script>
<script src="/javascript/jquery.markSheet.js" type="text/javascript"></script>
<!-- END custom_head -->

<h1>{CATEGORY}</h1>
<span class="header_option"><a href="/submission/markSheet/export/{CID}" class="btn download" ><span></span>Download Spreadsheet</a>
<a class="btn add" href="/submission/createSubmission/new/{CID}/"><span></span>Add Due Work</a>
<a class="btn add" href="/assess/create/{CID}/"><span></span>Add Online Assessment</a></span>

<div class="mark-sheet names">
    <table>
        <thead><tr>
            <th>Surname</th>
            <th>Preferred Name</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_list -->
        <tr class="{ON_OFF}">
            <td><a href="/search/user/{UID}" title="{FIRSTNAME} {SURNAME}">{SURNAME}</a></td>
            <td><a href="/search/user/{UID}" title="{FIRSTNAME} {SURNAME}">{FIRSTNAME}</a></td>
        </tr>
        <!-- END student_list -->
        </tbody>
    </table>
</div>

<div class="mark-sheet assessments">
    <table>
        <thead>
            <tr>
                <!-- BEGIN sub_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                   <div class="height-control">
                        <a href="/submission/viewSubmission/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                    </div>
                </th>
                <!-- END sub_head -->
                <!-- BEGIN assess_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                    <div class="height-control">
                        <a href="/assess/results/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                    </div>
                </th>
                <!-- END assess_head -->
            </tr>

            <tr>
                <!-- BEGIN sub_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END sub_type_head -->

                <!-- BEGIN assess_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END assess_type_head -->
                <!-- BEGIN average_type_head -->
                <th>
                    <em>Average</em>
                </th>
                <!-- END average_type_head -->
            </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_mark_list -->
        <tr class="{ON_OFF}">
            <!-- BEGIN markItem -->
            <!-- BEGIN mark -->
            <td class="column-{BOX_ID}">
                <div class="row-fix">
                    <form method="post" action="" class="markForm clearfix">
                        {STUDENT_MARKING}
                    </form>
                </div>
            </td>
            <!-- END mark -->

            <!-- BEGIN onlineAssessmentMark -->
            <td class="column-assess-{ASSESS_ASSESS_ID}">
                <a href="/assess/review/{ASSESS_ASSESS_ID}/{ASSESS_FIRST_SECTION_ID}/{ATTEMPT_ID}">{MARK}</a>
            </td>
            <!-- END onlineAssessmentMark -->
            <!-- END markItem -->
            <!-- BEGIN mark_average -->
            <td class="mark-average">
                <div class="row-fix avg-mark" id="avg-{UID}">
                    <span>{STUDENT_AVERAGE_MARK}</span>
                </div>
            </td>
            <!-- END mark_average -->
        </tr>
        <!-- END student_mark_list -->
        </tbody>
    </table>

</div>
