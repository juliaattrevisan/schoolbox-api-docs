<!-- BEGIN custom_head -->

<script src="/javascript/jquery.autoellipsis-1.0.3.min.js" type="text/javascript"></script>

<script type="text/javascript">
	$j(function(){
		$j('a.delete-btn').click(function(){
			if(confirm("Delete this assessment task?")) {
			  var workid = $j(this).closest('td').attr('id').substring(5);
			  $.post('/submission/submissionForm.php', {'delete':workid}, function(){
				$j('.column-'+workid).remove();
				  });
			}
			  return false;
		  });

		$j('.inputMark').blur(function(){
            $this = $j(this);
            if($this.val() != '')
                $j.post('/submission/returnWorkForm.php', $this.closest('form').serialize(), function() {
                $this.parent().remove('.save-notification');
                $this.closest('td').prepend('<div class="save-notification"></div>')
                    $j('.save-notification').delay(1000).fadeOut(500, function() {
                        $this.closest('.save-notification').remove();
                    });
                });
		});

        var columnCount = $j('.mark-sheet.assessments table').find('tr:first').children('th').size();

        for (i=0; i <= columnCount; i++) {
            $j('.mark-sheet.assessments table').find('tr:first').children('th:nth-child('+i+')').css({
                'width': '150px',
                'padding-bottom': 0
            });
        };

        $j('.mark-sheet.assessments table').css('width', 150 * columnCount);

        $j('.height-control').ellipsis();

        /*
        * Hovering a td should make the entire row change colour
        *
        * */
        $j('td').hover(function(evt) {
            var rowNumber = $j(evt.target).closest("tr").prevAll("tr").length + 1;

            if (!$j('.inputMark').is(':focus')) {
                $j('table').find('tr').removeClass('highlight-student');

                if (!$j('table').find('tr:nth-child('+rowNumber+')').hasClass('highlight-student')) {
                    $j('table').find('tr:nth-child('+rowNumber+')').addClass('highlight-student');
                }
            }
        }, function() {
            if (!$j('.inputMark').is(':focus')) {
                $j('table').find('tr').removeClass('highlight-student');
            }
        })

        $j(".inputMark").focus(function(evt) {
            var rowNumber = $j(evt.target).closest("tr").prevAll("tr").length + 1;
            $j('table').find('tr').removeClass('highlight-student');

            if (!$j('table').find('tr:nth-child('+rowNumber+')').hasClass('highlight-student')) {
                $j('table').find('tr:nth-child('+rowNumber+')').addClass('highlight-student');
            }
        });

        function changeHighlight(object) {

        }


	});
</script>
<!-- END custom_head -->

<h1>{CATEGORY}</h1>
<span class="header_option"><a href="/submission/markSheet/export/{CID}" class="btn download" ><span></span>Download Spreadsheet</a>
<a class="btn add" href="/submission/createSubmission/new/{CID}/"><span></span>Add Due Work</a>
<a class="btn add" href="/assess/create/{CID}/"><span></span>Add Online Assessment</a></span>

<div class="mark-sheet names">

        <thead><tr>
            <th>Surname</th>
            <th>Preferred Name</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_list -->

            <td><a href="/search/user/{UID}">{FIRSTNAME}</a></td>
        </tr>
        <!-- END student_list -->
        </tbody>
    </table>
</div>

<div class="mark-sheet assessments">
    <table>
        <thead>
            <tr>
                <!-- BEGIN sub_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                   <div class="height-control">
                        <a href="/submission/viewSubmission/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                    </div>

                <!-- END sub_head -->
                <!-- BEGIN assess_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">

            </tr>

            <tr>
                <!-- BEGIN sub_type_head -->

                    <em>{SUB_TYPE}</em>
                </th>

                <!-- BEGIN assess_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END assess_type_head -->
            </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_mark_list -->

            <!-- BEGIN markItem -->
            <!-- BEGIN mark -->
