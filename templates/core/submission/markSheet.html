<!-- BEGIN custom_head -->
<script src="/javascript/jquery.autoellipsis-1.0.3.min.js" type="text/javascript"></script>
<script src="/javascript/jquery.markSheet.js" type="text/javascript"></script>
<!-- END custom_head -->

<h1>{CATEGORY}</h1>
<span class="header_option"><a href="/submission/markSheet/export/{CID}" class="btn download" ><span></span>Download Spreadsheet</a>
<a class="btn add" href="/submission/createSubmission/new/{CID}/"><span></span>Add Due Work</a>
<a class="btn add" href="/assess/create/{CID}/"><span></span>Add Online Assessment</a></span>

<div class="mark-sheet names">
    <table>
        <thead><tr>
            <th>Surname</th>
            <th>Preferred Name</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_list -->
        <tr class="{ON_OFF}">
            <td><a href="/search/user/{UID}">{SURNAME}</a></td>
            <td><a href="/search/user/{UID}">{FIRSTNAME}</a></td>
        </tr>
        <!-- END student_list -->
        </tbody>
    </table>
</div>

<div class="mark-sheet assessments">
    <table>
        <thead>
            <tr>
                <!-- BEGIN sub_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                   <div class="height-control">
                        <a href="/submission/viewSubmission/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                    </div>
                </th>
                <!-- END sub_head -->
                <!-- BEGIN assess_head -->
                <th id="work-{BOX_ID}" class="column-{BOX_ID}">
                    <div class="height-control">
                        <a href="/assess/results/{BOX_ID}"><strong>{SUB_NAME}</strong></a>
                    </div>
                </th>
                <!-- END assess_head -->
            </tr>

            <tr>
                <!-- BEGIN sub_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END sub_type_head -->

                <!-- BEGIN assess_type_head -->
                <th>
                    <em>{SUB_TYPE}</em>
                </th>
                <!-- END assess_type_head -->
            </tr>
        </thead>
        <tbody>
        <!-- BEGIN student_mark_list -->
        <tr class="{ON_OFF}">
            <!-- BEGIN markItem -->
            <!-- BEGIN mark -->
            <td class="column-{BOX_ID}">
                <div class="save-notification"></div>
                <form method="post" onSubmit="return false;" action="" class="markForm">
                    <!-- BEGIN mark_type_percent -->
                    <input name="mark" class="inputMark" type="text" id="mark" size="3" maxlength="3" value="{MARK}"/><span>&nbsp;%</span>
                    <!-- END mark_type_percent -->
                    <!-- BEGIN mark_type_letter -->
                    <select id="mark" class="inputMark" name="mark">
                        <!-- BEGIN grade_drop -->
                        <option value="{GRADE_VALUE}" {GRADE_VALUE_SELECTED}>{GRADE_TEXT}</option>
                        <!-- END grade_drop -->
                    </select>
                    <!-- END mark_type_letter -->
                    <!-- BEGIN mark_type_raw -->
                    <input name="mark" class="inputMark" type="text" id="mark" size="4" maxlength="15" value="{MARK}"/><span>&nbsp;/ {MAX_MARK}</span>
                    <!-- END mark_type_raw -->

                    <input name="comment" id="comment" size="40" placeholder="Comment" class="comment">

                    <input type="hidden" name="uid" value="{UID}">
                    <input type="hidden" name="box_id" value="{BOX_ID}">
                    <input type="hidden" name="markUpdate" value="true">
                </form>
            </td>
            <!-- END mark -->

            <!-- BEGIN onlineAssessmentMark -->
            <td class="column-assess-{ASSESS_ASSESS_ID}">
                &nbsp;
                <a href="/assess/review/{ASSESS_ASSESS_ID}/{ASSESS_FIRST_SECTION_ID}/{ATTEMPT_ID}">{MARK}</a>
            </td>
            <!-- END onlineAssessmentMark -->
            <!-- END markItem -->
        </tr>
        <!-- END student_mark_list -->
        </tbody>
    </table>

</div>
