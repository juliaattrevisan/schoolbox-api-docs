<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/jquery.context-selector.js"></script>
<script type="text/javascript">
    $(function () {
        $.fn.contextSelector({
            href: '{PAGE_HREF}'
        });
    });
</script>
<!-- END custom_head -->

<div class="small-12 medium-9 medium-offset-3 large-7 large-offset-5 columns">
    <div class="content">
        <div class="context-switch">
            <!-- BEGIN semester_context -->
            <nav>
                <a {SEMESTER_BACK_DISABLED} href="/{PAGE_HREF}/{SUBJECT_PART}{SEMESTER_BACK}{SEMESTER_CONTEXT_CATEGORY_ID}"></a>
            </nav>
            <div class="semester">
                <select id="context-selector-semester">
                    <!-- BEGIN semester_option -->
                    <option value="{SUBJECT_PART}{SEMESTER_SLUG}" {SEMESTER_SELECTED}>{SEMESTER_VALUE}</option>
                    <!-- END semester_option -->
                </select>
            </div>
            <nav>
                <a {SEMESTER_FWD_DISABLED} href="/{PAGE_HREF}/{SUBJECT_PART}{SEMESTER_FWD}{SEMESTER_CONTEXT_CATEGORY_ID}"></a>
            </nav>
            <!-- END semester_context -->
            <!-- BEGIN subject_context -->
            <div class="subject">
                <select id="context-selector-enrolled-subjects">
                    <option disabled="disabled" selected="selected">Select a subject</option>
                    <!-- BEGIN subject_option -->
                    <option data-id="{SUBJECT_ID}" value="{SUBJECT_HREF}" {SUBJECT_SELECTED}>{SUBJECT_NAME}</option>
                    <!-- END subject_option -->
                </select>
            </div>
            <!-- END subject_context -->
            <!-- BEGIN unit_context -->
            <div class="subject">
                <!-- Unit selector is actually multiple selectors, which are shown/hidden when the semester context changes -->
                <!-- BEGIN unit_select -->
                <select data-interaction="select_unit" data-semester="{UNIT_KEY}">
                    <option disabled label="Select a unit">Select a unit</option>
                    <!-- BEGIN unit_option -->
                    <option label="{UNIT_NAME}" value="{UNIT_ID}" {UNIT_SELECTED}>
                        {UNIT_NAME}
                    </option>
                    <!-- END unit_option -->
                </select>
                <!-- END unit_select -->
            </div>
            <!-- END unit_context -->
        </div>
    </div>
</div>
