<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/submissions/jquery.context-selector.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    if (Number('{USE_PLUGIN}')) {
        $(function () {
            $.fn.contextSelector({
                href: '{PAGE_HREF}'
            });
        });
    }
</script>
<!-- END custom_head -->

<div class="small-12 medium-7 columns">
    <div class="content">
        <div class="context-switch clearfix">
            <!-- BEGIN term_context -->
            <nav>
                <a data-interaction="previous" {TERM_BACK_DISABLED} href="/{PAGE_HREF}/{SUBJECT_PART}{TERM_BACK}{TERM_CONTEXT_CATEGORY_ID}"></a>
            </nav>
            <div class="semester">
                <select id="context-selector-semester">
                    <option disabled selected label="Select a {TPL_LOCAL_TERM}">Select a {TPL_LOCAL_TERM}</option>
                    <!-- BEGIN term_option -->
                    <option value="{SUBJECT_PART}{TERM_SLUG}" {TERM_SELECTED}>{TERM_VALUE}</option>
                    <!-- END term_option -->
                </select>
            </div>
            <nav>
                <a data-interaction="next" {TERM_FWD_DISABLED} href="/{PAGE_HREF}/{SUBJECT_PART}{TERM_FWD}{TERM_CONTEXT_CATEGORY_ID}"></a>
            </nav>
            <!-- END term_context -->
            <!-- BEGIN subject_context -->
            <div class="subject">
                <select id="context-selector-enrolled-subjects">
                    <option disabled selected label="Select a subject">Select a {TPL_LOCAL_SUBJECT}</option>
                    <!-- BEGIN subject_option -->
                    <option data-id="{SUBJECT_ID}" value="{SUBJECT_HREF}" {SUBJECT_SELECTED}>{SUBJECT_NAME}</option>
                    <!-- END subject_option -->
                </select>
            </div>
            <!-- END subject_context -->
            <!-- BEGIN unit_context -->
            <div class="unit">
                <!-- Unit selector is actually multiple selectors, which are shown/hidden when the semester context changes -->
                <!-- BEGIN unit_select -->
                <select data-interaction="select_unit" data-semester="{UNIT_KEY}" class="hide">
                    <option disabled selected label="Select a {TPL_LOCAL_UNIT}">Select a {TPL_LOCAL_UNIT}</option>
                    <!-- BEGIN unit_option -->
                    <option label="{UNIT_NAME}" value="{UNIT_ID}" {UNIT_SELECTED}>
                        {UNIT_NAME}
                    </option>
                    <!-- END unit_option -->
                </select>
                <!-- END unit_select -->
            </div>
            <!-- END unit_context -->
        </div>
    </div>
</div>
