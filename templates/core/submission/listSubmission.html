<h1>Submission Box List</h1>
<div class="indent">
    <table class="ruler">
        <!-- BEGIN category_block -->
        <thead>
            <tr>
                <td colspan="9"><h2>{CATEGORY} ({STUDENTS} Students)</h2></td>
            <tr>
            <tr>
                <th>Assignment Title</th>
                <th>Type</th>
                <th>Open Date</th>
                <th>Due Date</th>
                <th class="center">Submitted</th>
                <th class="center">Returned</th>
				<th class="center">View</th>
				<th class="center">Edit</th>
                <th class="center">Delete</th>
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN submission_block -->
            <tr class="{ON_OFF}">
                <td><a href="/submission/viewSubmission/{ID}">{ASSDESC}</a></td>
                <td>{TYPE}</td>
                <td><a href="/submission/createSubmission/modify/{ID}">{OPENDATE}</a></td>
                <td><a href="/submission/createSubmission/modify/{ID}">{DUEDATE}</a></td>
                <td class="center">{TOTAL}</td>
                <td class="center">{MARKED}</td>
				<td class="center"><a href="/submission/viewSubmission/{ID}">View</a></td>
				<td class="center"><a href="/submission/createSubmission/modify/{ID}">Edit</a></td>
                <td class="center"><a href="/submission/submissionForm.php?deleteBox={ID}" onclick="return(confirm('Remove {JAVAASSDESC}?'));">Delete</a></td>
            </tr>
            <!-- END submission_block -->
        </tbody>
        <!-- END category_block -->
    </table>
</div>
