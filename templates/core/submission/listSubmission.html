<h1>Student Submissions Boxes</h1>
<div class="indent">
    <table class="ruler">
        <!-- BEGIN category_block -->
        <thead>
            <tr>
                <td colspan="7"><h2>{CATEGORY}</h2></td>
            <tr>
            <tr>
                <th>Assignment Title</th>
                <th>Type</th>
                <th>Open Date</th>
                <th>Due Date</th>
                <th class="cntr">Marked</th>
                <th class="cntr">Total</th>
                <th class="cntr">Delete</th>
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN submission_block -->
            <tr>
                <td><a href="/submission/viewSubmission/{ID}">{ASSDESC}</a></td>
                <td>{TYPE}</td>
                <td><a href="/submission/createSubmission/modify/{ID}">{OPENDATE}</a></td>
                <td><a href="/submission/createSubmission/modify/{ID}">{DUEDATE}</a></td>
                <td class="cntr">{MARKED}</td>
                <td class="cntr">{TOTAL}</td>
                <td class="cntr"><a href="/submission/submissionForm.php?deleteBox={ID}" onclick="return(confirm('Remove {JAVAASSDESC}?'));">delete</a></td>
            </tr>
            <!-- END submission_block -->
        </tbody>
        <!-- END category_block -->
    </table>
