<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>


<script language="JavaScript" type="text/javascript">
	$j(function() {
		$j('.prettify').prettyFileInput({	
			additionalButtonClasses: 'no-marg float-left',
			buttonActiveClass: 'tick',
			defaultText: '<span></span>Choose file',
			defaultFileSelectedText: '<span></span>File selected'
		});
	});
</script>
<!-- END custom_head -->

<h1>Submit Work</h1>
<form method="post" action="/submission/submitWorkForm.php" class="clearfix" enctype="multipart/form-data" >
	<table class="standardForm">
		<tr>
			<td class="formLabelWidth"><h4>Submission Box Title</h4></td>
			<td>{CATEGORY} - {FILE}</td>
		</tr>
		<tr>
			<td><h4>File</h4>
				<em>You must attach your work by locating the file on your drive. Make sure the file is saved and closed before submitting the form. </em></td>
			<td><input type="file" name="file" class="prettify"/>
				<input type="hidden" name="box_id" value="{BOX_ID}" /></td>
		</tr>
	</table>
	</td>
	</tr>
	</table>
	<input type="submit" name="Submit2" value="Submit" class="submit-btn-plain" />
</form>
