<div id="inlineform{UFID}" class="inlineform markForm clearfix">
    <!-- BEGIN mark_type_percent -->
    <span>&nbsp;%</span>
    <input name="mark[{OWNER_ID}]" class="combobox mark-input percent" type="text" size="3" value="{MARK}"/>
    <!-- END mark_type_percent -->
    <!-- BEGIN mark_type_letter -->
    <select data-marktype="letter" id="mark" class="mark-input" name="mark[{OWNER_ID}]">
        <!-- BEGIN grade_drop -->
        <option data-groupId="{GRADE_GROUP_ID}" value="{GRADE_VALUE}" {GRADE_VALUE_SELECTED}>{GRADE_TEXT}</option>
        <!-- END grade_drop -->
    </select>
    <!-- END mark_type_letter -->
    <!-- BEGIN mark_type_raw -->
    <input name="mark[{OWNER_ID}]" class="combobox mark-input out-of" type="text" size="4" maxlength="15" value="{MARK}"/>
    <span>&nbsp;/&nbsp;<strong class="validation-limit">{MAX_MARK}</strong></span>
    <!-- END mark_type_raw -->
    <!-- BEGIN mark_type_free -->
    <input name="mark[{OWNER_ID}]" class="mark-input free" type="text" size="4" maxlength="15" value="{MARK}"/>
    <!-- END mark_type_free -->
    <!-- BEGIN mark_type_none -->
    <span class="disabled">N/A</span>
    <!-- END mark_type_none -->
    <!-- BEGIN mark_type_rubric -->
	<select id="rubricmark" class="mark-input" name="mark[{OWNER_ID}]">
		<!-- BEGIN rubric_marked -->
		<option value="{MARK} / {MAX_MARK}">{MARK}&nbsp;/&nbsp;{MAX_MARK}</option>
	<!-- <a class="view" id="launchlightbox-{OWNER_ID}" title="View Rubric" href="#">{MARK}&nbsp;/&nbsp;{MAX_MARK}</a> -->
		<!-- END rubric_marked -->
		<!-- BEGIN rubric_unmarked -->
		<option value="-1">(none)</option>
	<!-- <a class="view" title="Mark Rubric" href="/submission/returnWork/{BOX_ID}/{OWNER_ID}">Mark</a> -->
		<!-- END rubric_unmarked -->
		<!-- BEGIN rubric_grade_drop -->
		<option value="{RUBRIC_GRADE_VALUE}" {RUBRIC_GRADE_VALUE_SELECTED}>{RUBRIC_GRADE_TEXT}</option>
		<!-- END rubric_grade_drop -->
	</select>

	<a class="rubric-edit" title="Mark Rubric" href="/submission/returnWork/{BOX_ID}/{OWNER_ID}"></a>

    <!-- END mark_type_rubric -->
    <div class="twolines"></div>
    <strong>Comment</strong>
	<textarea class="comment" name="comment">{COMMENT}</textarea>
    <input type="hidden" class="uid" name="uid" value="{OWNER_ID}" />
    <input type="hidden" class="box_id" name="box_id" value="{BOX_ID}" />
    <input type="hidden" class="mark-update" name="markUpdate" value="true" />
</div>
