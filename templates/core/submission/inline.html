<h1>Inline marking</h1>

<style type="text/css">
	#crocodoc {
	}
</style>
<script type='text/javascript'>
	$(function() {
		$.getJSON('/submission/crocodoc?submissionId={SUBMISSION_ID}', function(data) {
			$('#crocodoc').attr('src', data.url);
			$('#crocodoc-download').attr('href', '/submission/inline-download/' + data.uuid);
		});
	});
</script>

<iframe id="crocodoc" style="width:75%;height:800px"></iframe>

<p>
	<a id='crocodoc-download' href='#'>Download as PDF</a>
</p>
