<div id="rubric-window">
    <h2>Returned Mark Breakdown</h2>
    <table class="rubric table">
        <colgroup>
            <col class="criterion-label" />
            <!-- BEGIN rubric_rating -->
            <col />
            <!-- END rubric_rating -->
        </colgroup>
        <tbody id="rubric-tbody">
        <!-- BEGIN rubric_crit -->
        <!-- BEGIN rubric_grouping -->
        <tr>
            <td class="criterion-label pad span" colspan="{RUBRIC_GROUP_SPAN}">{RUBRIC_GROUP_LABEL}</td>
        </tr>
        <!-- END rubric_grouping -->
        <tr>
            <td class="criterion-label pad">{RUBRIC_CRIT_LABEL}</td>
            <!-- BEGIN rubric_crit_rating -->
            <td class="criterion-value {RUBRIC_CRIT_RATING_CLASS}">
                <input id="rubric{RUBRIC_CRIT_NAME}{RUBRIC_CRIT_RATING_VALUE}" class="rubric-input" type="radio"
                       name="rubric[{RUBRIC_CRIT_ID}]" data-index="{RUBRIC_CRIT_INDEX}" disabled="disabled"
                       value="{RUBRIC_CRIT_RATING_VALUE}" {RUBRIC_CRIT_RATING_SELECTED} />
                <label for="rubric{RUBRIC_CRIT_NAME}{RUBRIC_CRIT_RATING_VALUE}">
                    <span>{RUBRIC_CRIT_RATING_LABEL}<br />({RUBRIC_CRIT_RATING_VALUE} pts)</span>
                </label>
            </td>
            <!-- END rubric_crit_rating -->
        </tr>
        <!-- END rubric_crit -->
        </tbody>
    </table>
    <!-- BEGIN rubric_display -->
    <div class="rubric-display">
        <div class="rubric-grade">
            <span id="sum">{RUBRIC_GRADE_SUM}</span> / <span id="max">{RUBRIC_GRADE_MAX}</span>
        </div>
        <div id="rubric-chart"></div>
    </div>
    <!-- END rubric_display -->


    <a href="#" id="closebox" class="submit-btn-plain"><span></span>Close</a>
</div>
<script type="text/javascript">
    // listener for submit
    $('#closebox').click(function() {
        $('#rubric-lightbox').dialog('close');
    });
</script>

<script type="text/javascript">
    if ({GRAPH_DATA}.length) {
        var rubricData = setupRubricChart({GRAPH_DATA}, {GRAPH_LEGS}, {GRAPH_MAX});
        $(function() {
            var plot = $.plot($('#rubric-chart'), rubricData.spidata.points, rubricData.options);
            $(document).ready(function() {
                plot.draw();
            });

            $(document).ready(function() {
                var radios = $('#rubric-tbody :radio');
                radios.removeClass('focused').parent('td').removeClass('focused');
                $('#rubric-tbody :checked').each(function() {
                    var self = $(this);
                    self.addClass('focused').parent('td').addClass('focused');
                    self.closest('tr').children('.warning').first().children('div').css('visibility', 'hidden');
                })
            })
        })
    }
</script>
