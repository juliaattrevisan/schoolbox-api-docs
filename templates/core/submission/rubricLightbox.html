<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type="text/javascript" src="/javascript/components/highcharts/highcharts-more.js"></script>
<script type="text/javascript" src="/javascript/shared/submissions/jquery.rubric-graph.js"></script>
<script type="text/javascript" src="/javascript/shared/submissions/jquery.fraction-display.js"></script>
<script type="text/javascript">
    $(function() {
        if ({GRAPH_DATA}.length) {
            $('[data-role="rubric-chart"]').rubricGraph({
                categories: {GRAPH_LEGS},
                data: {GRAPH_DATA},
                ymax: {GRAPH_MAX},
                inputs: '[data-role="rubric-window"]'
            });
        }
        $('[data-role="rubric-sum"]').fractionDisplay({
            inputs: '[data-role="rubric-window"] :radio'
        });

//        var radios = $('#rubric-tbody :radio');
//        radios.removeClass('focused').parent('td').removeClass('focused');
//        $('#rubric-tbody :checked').each(function() {
//            var self = $(this);
//            self.addClass('focused').parent('td').addClass('focused');
//            self.closest('tr').children('.warning').first().children('div').css('visibility', 'hidden');
//        })
    });
</script>
<!-- END custom_head -->

<div data-role="rubric-window">
    <!--<h3>Marking Guide</h3>-->
    <table class="rubric">
        <colgroup>
            <col />
            <!-- BEGIN rubric_rating -->
            <col />
            <!-- END rubric_rating -->
        </colgroup>
        <tbody id="rubric-tbody">
        <!-- BEGIN rubric_crit -->
        <!-- BEGIN rubric_grouping -->
        <tr>
            <th class="row-header" colspan="{RUBRIC_GROUP_SPAN}">{RUBRIC_GROUP_LABEL}</th>
        </tr>
        <!-- END rubric_grouping -->
        <tr>
            <th>{RUBRIC_CRIT_LABEL}</th>
            <!-- BEGIN rubric_crit_rating -->
            <td class="{RUBRIC_CRIT_RATING_CLASS}">
                <input id="rubric-{RUBRIC_CRIT_ID}-{RUBRIC_CRIT_RATING_VALUE}" type="radio"
                       name="rubric[{RUBRIC_CRIT_ID}]" data-index="{RUBRIC_CRIT_INDEX}" {RUBRIC_CRIT_EDITABLE}
                       value="{RUBRIC_CRIT_RATING_VALUE}" {RUBRIC_CRIT_RATING_SELECTED} />
                <label for="rubric-{RUBRIC_CRIT_ID}-{RUBRIC_CRIT_RATING_VALUE}">
                    <span>{RUBRIC_CRIT_RATING_LABEL}<br />({RUBRIC_CRIT_RATING_VALUE} pts)</span>
                </label>
            </td>
            <!-- END rubric_crit_rating -->
        </tr>
        <!-- END rubric_crit -->
        </tbody>
    </table>
    <!-- BEGIN rubric_display -->
    <!--
    <div class="rubric-display">
        <div class="rubric-grade">
            <span id="sum">{RUBRIC_GRADE_SUM}</span> / <span id="max">{RUBRIC_GRADE_MAX}</span>
        </div>
        <div id="rubric-chart"></div>
    </div>
    -->
    <!-- END rubric_display -->


    <!--<a href="#" id="closebox" class="submit-btn-plain"><span></span>Close</a>-->
</div>

<div class="row">
    <div class="small-12 island">
        <section class="content">
            <div data-role="rubric-chart"></div>
        </section>
    </div>
</div>
