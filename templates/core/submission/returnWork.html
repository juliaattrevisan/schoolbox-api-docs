<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/excanvas.compiled.js"></script>
<script type="text/javascript">
    var is_using_canvastext = false;
</script>
<!-- Load canvasText and a typeface for IE < 9 -->
<!--[if lt IE 9]>
<script type="text/javascript" src="/javascript/canvas.text.js"></script>
<script type="text/javascript" src="/javascript/faces/helvetiker-normal-normal.js"></script>
<script type="text/javascript">
    var is_using_canvastext = true;
</script>
<![endif]-->
<script type="text/javascript" src="/javascript/flot/jquery.flot.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.highlighter.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.spider.js"></script>
<script type="text/javascript" src="/javascript/jquery.flot.rubric.js"></script>
<script type="text/javascript">

    var rubricData = setupRubricChart({GRAPH_DATA}, {GRAPH_LEGS}, {GRAPH_MAX});
    //
    // Using canvastext? Force its typeface to be used for all fonts.
    if (is_using_canvastext) {
        rubricData.options.series.spider.legs.font = '11px helvetiker';
    }

    $j(function() {
        var radios = $j('#rubric-tbody :radio');
        var plot = $j.plot($j('#rubric-chart'), rubricData.spidata.points, rubricData.options);

        $j(document).ready(function() {
            $j('#rubric-tbody td').click(function(){
                $j(this).find(':radio').attr('checked','checked');
                updateRadio();
            });
            updateRadio();
        });

        function updateRadio() {
            var sum = 0;
            radios.removeClass('focused').parent('td').removeClass('focused');
            $j('#rubric-tbody :checked').each(function() {
                var self = $j(this);
                rubricData.spidata.points[0].data[self.data('index')] = [self.data('index'), parseInt(self.val())];
                self.closest('td').addClass('focused');
                self.closest('tr').children('.warning').first().children('div').css('visibility', 'hidden');
                sum += parseInt(self.val());
            });

            $j('#sum').html(sum);

            plot.draw();
        }

        $j('#returnWorkForm').validate({
            submitHandler: function(form) {
                var success = true;
                $j('#rubric-tbody').find('tr').each(function() {
                    var tr = $j(this);
                    var radios = $j(this).find('input');
                    if(radios.length) {
                        var name = radios.first().attr('name');
                        if(tr.find('input:checked').length == 0) {
                            success = false;
                            return false;
                        }
                    }
                });
                if(!success) {
                    $j('#errnotif').removeClass('hide');
                }
                else {
                    form.submit();
                }
            }
        });
    });

</script>
<!-- END custom_head -->

        <tr>
            <td><h4>Mark</h4>

                <!-- BEGIN mark_type_percent -->

                <!-- BEGIN mark_type_letter -->
                <!-- BEGIN grade_drop -->
                <!-- END grade_drop -->
                <!-- END mark_type_letter -->
                <!-- BEGIN mark_type_raw -->
                <!-- END mark_type_raw -->
                <!-- BEGIN mark_type_free -->
                <!-- END mark_type_free -->

                <!-- END mark_type_none -->

	<input name="Submit" type="submit" id="Submit" value="Submit" class="submit-btn-plain" />
