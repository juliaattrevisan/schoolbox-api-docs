{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>Grading {ASSNAME} </h1>
        <ul class="meta">
            <li class="icon-calendar">Due <span class="{BOX_GRADIENT}">{DUEWORK_DUEDATE}</span></li>
            <li class="icon-due-work"><a href="/homepage/{CAT_ID}">{CATEGORY}</a> {DUEWORK_TYPE}</li>
            <li class="{GRADE_VISIBILITY_CSS}">Grade visible to {GRADE_VISIBILITY}</li>
        </ul>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <section>
            <div class="avatar card">
                <a href="#" title="View Profile">
                    <img src="/portrait.php?userId={SYN_ID}&size=square32" alt="View Profile" />
                    <p>{NAME}</p>
                </a>
                <p class="meta">{ROLE}</p>
            </div>
        </section>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/submission/returnWorkForm.php" name="returnWorkForm" id="returnWorkForm" method="post" class="top" enctype="multipart/form-data">
            <input name="box_id" type="hidden" id="box_id" value="{BOX_ID}" />
            <input name="uid" type="hidden" id="uid" value="{UID}" />
            <input name="redirect" type="hidden" value="{REDIRECT}" />

            <section>
                <fieldset class="content">
                    <legend>Mark <span class="hint has-tip tip-top" data-tooltip title="{MARK_TYPE_COMMENT}">?</span></legend>
                    <div class="small-12 columns">
                        <!-- BEGIN mark_type_percent -->
                        <!-- END mark_type_percent -->
                        <!-- BEGIN mark_type_letter -->
                        <!-- BEGIN grade_drop -->
                        <!-- END grade_drop -->
                        <!-- END mark_type_letter -->
                        <!-- BEGIN mark_type_raw -->
                        <!-- END mark_type_raw -->
                        <!-- BEGIN mark_type_free -->
                        <!-- END mark_type_free -->
                        <!-- BEGIN mark_type_none -->
                        <!-- END mark_type_none -->

                        <!-- BEGIN mark_type_rubric -->
                        <!-- END mark_type_rubric -->
                    </div>
                </fieldset>

                {RUBRIC}

                <fieldset class="content">
                    <legend>Comment</legend>
                    <div class="small-12 columns">
                        <textarea name="comment" rows="5">{COMMENT}</textarea>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Overall Grade <span class="hint has-tip tip-top" data-tooltip title="The Rubric Grade is automatically generated by the set criteria.">?</span></legend>
                    <div class="small-12 columns">
                        <p class="grade">
                            <span data-role="rubric-sum" class="gradient-{RUBRIC_GRADIENT}">{RUBRIC_GRADE_SUM} / {RUBRIC_GRADE_MAX}</span>
                        </p>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Submit" />
                </div>
            </div>
        </form>
    </div>
</div>
