<script type="text/javascript" src="/javascript/excanvas.compiled.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.highlighter.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.spider.js"></script>
<script language="JavaScript" type="text/javascript">
    var spidata = {
        points: [
            {
                data: {GRAPH_DATA},
                spider: {
                    show: true,
                    lineWidth: 4
                }
            }
        ],

        legs: {GRAPH_LEGS},
        ticks: {GRAPH_MAX}
    };

    var options = {
        series: {
            spider: {
                active: true,
                hightlight: {
                    mode: 'area',
                    opacity: 0.9
                },
                legs: {
                    data: spidata.legs,
                    font: '11px Arial',
                    legStartAngle: 270,
                    legScaleMin: 0,
                    legScaleMax: 1
                },
                connection: {
                    width: 2
                },
                pointSize: 3,
                scaleMode: 'others',
                legMin: 0,
                legMax: spidata.ticks,
                spiderSize: 0.9,
                lineWidth: 1,
                lineStyle: 'rgba(0,0,0,0.1)'
            }
        },
        grid: {
            hoverable: false,
            clickable: false,
            tickColor: 'rgba(0,0,0,0.15)',
            ticks: spidata.ticks,
            mode: 'radar'
        }
    };

    $j(function() {
        var radios = $j('#rubric-tbody :radio');
        var plot = $j.plot($j('#rubric-chart'), spidata.points, options);

        $j(document).ready(function() {
            radios.focus(updateRadio);
            radios.blur(updateRadio);
            radios.change(updateRadio);
            updateRadio();
        });

        function updateRadio() {
            var i = 0;
            var sum = 0;

            radios.removeClass('focused').next().removeClass('focused');

            $j('#rubric-tbody :checked').each(function() {
                var self = $j(this);
                spidata.points[0].data[self.data('index')] = [self.data('index'), parseInt(self.val())];
                ++i;
                self.addClass('focused').next().addClass('focused');
                self.closest('tr').children('.warning').first().children('div').css('visibility', 'hidden');
                sum += parseInt(self.val());
            });

            $j('#sum').html(sum);

            plot.draw();
        }

    });


</script>
<script type="text/javascript">

    $j(function() {

    });
</script>
<style>

    }

</style>
