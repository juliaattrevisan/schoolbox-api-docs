<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">

	// Autosave
	// On type, ensure that change gets saved.
	var autosaveTimeout = null
	var textBoxContent  = ''

	// Method for setting up autosave - clears existing event, and creates new one.
	var initAutosave = function() {
		clearTimeout(autosaveTimeout)
		autosaveTimeout = setTimeout(autosavePresubmit, 5*1000)
	}

	// The autosave pre-submit method - called by the autosave method.
	// Calls the actual submit method if the textbox has changed.
	var autosavePresubmit = function() {
		// Has the text box changed? If not check again later
		// (re-init the autosave counter)
		var currentContent = tinyMCE.get('textBoxBody').getContent()
		if (currentContent === textBoxContent) {
			initAutosave()
		}
		else {
			textBoxContent = currentContent
			autosaveAjaxSubmit()
		}
	}

	// The autosave submit method
	var autosaveAjaxSubmit = function() {
		var form = $('form#textBoxForm')

		// Change button's text, but keep its width the same.
		// Change it back once done.
		var formSaveButton = form.find('input[type="submit"][name="save_draft"]')
		var oldText        = formSaveButton.val()
		var buttonWidth    = formSaveButton.width()
		formSaveButton.prop('disabled', true).val('Saving...').width(buttonWidth)

		// Submit form via AJAX
		var formContents = form.serializeArray()
		formContents.push({name: 'save_draft', value: '1'})
		formContents.push({name: 'body',       value: tinyMCE.get('textBoxBody').getContent()})
		$.ajax({
			type: "POST",
			url:  form.attr('action'),
			data: formContents,
			complete: function() {
				// Re-init the autosave
				initAutosave()
				setTimeout(
					function() { formSaveButton.prop('disabled', false).val(oldText) },
					2000
				)
			},
			success: function() {
				formSaveButton.val('Saved!')
			},
			error: function() {
				formSaveButton.val('Error!')
			},
			dataType: 'json'
		});
	}

	$(function() {
		$.fn.alaressTiny({
			mode : "exact",
			elements: "textBoxBody",
			setup: function(ed) {
				initAutosave()
				ed.onChange.add(function() {
					autosavePresubmit()
				})
			}
		});

		$('form#textBoxForm input[name="save_draft"]').click(function(event) {
			event.preventDefault()
			autosaveAjaxSubmit()
		})
		$('form#textBoxForm input[name="save"]').click(function(event) {
			if (!confirm('Are you sure you are ready to send this submission for assessment?')) {
				event.preventDefault()
			}
		})
	});
</script>
<!-- END custom_head -->

<div id="submission-history">
	<div class="clearfix">
		<h2>{CATEGORY_NAME} - {BOX_NAME} <span>({BOX_TYPE})</span></h2>
		<h3>Due <span class="gradient-{BOX_DUEDATE_GRADIENT}">{BOX_DUEDATE}</span></h3>
		<div class="wysiwig">
			<form action="/submission/submitOnlineForm.php" method="post" id="textBoxForm">
				<input type="hidden" name="box_id" value="{BOX_ID}" />
				<input type="hidden" name="submission_id" value="{SUBMISSION_ID}" />
				<textarea rows="20" style="width: 100%;" name="body" id="textBoxBody">{TEXTBOX_BODY}</textarea>
				<br/>
				<p>You may save this submission as a draft, and come back to work on it later.</p>
				<input class="submit-btn-plain" type="submit" name="save_draft" value="Save as draft" />
				<input class="submit-btn-plain" type="submit" name="save" value="Submit for assessment" />
				<a href="/submission/submissionHistory/{BOX_ID}/{USER_ID}" class="submit-btn-plain">Return to submission</a>
			</form>
		</div>
	</div>
</div>
