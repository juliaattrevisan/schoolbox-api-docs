<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
	// Set up autosave plugin to do something different - AJAX submit instead of
	// local storage.
	var initTinyAutosave = function() {
		this.onPreSave = function() {
			autosaveSubmit()
			return false
		}
	}
	var autosaveSubmit = function() {
		var form = $j('form#textBoxForm')

		// Change button's text, but keep its width the same.
		// Change it back once done.
		var formSaveButton = form.find('input[type="submit"][name="save_draft"]')
		var oldText        = formSaveButton.val()
		var buttonWidth    = formSaveButton.width()
		formSaveButton.prop('disabled', true).val('Saving...').width(buttonWidth)

		// Submit form via AJAX
		var formContents = form.serializeArray()
		formContents.push({name: 'save_draft', value: '1'})
		formContents.push({name: 'body',       value: tinyMCE.get('textBoxBody').getContent()})
		$.ajax({
			type: "POST",
			url:  form.attr('action'),
			data: formContents,
			complete: function() {
				setTimeout(
					function() { formSaveButton.prop('disabled', false).val(oldText) },
					2000
				)
			},
			success: function() {
				formSaveButton.val('Saved!')
			},
			error: function() {
				formSaveButton.val('Error!')
			},
			dataType: 'json'
		});
	}
	tinyMCE.init({
		mode : "exact",
		elements: "textBoxBody",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker,tinyautosave",
		tinyautosave_oninit: 'initTinyAutosave',
		browser_spellcheck : true,
		content_css : "/css/core/tiny.css",
		media_strict : false,
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,z,spellchecker,tinyautosave",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
		accessibility_warnings : false,
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		theme_advanced_blockformats : "h3,h4,p,address,pre",
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		tabfocus_elements : ":prev,:next",
		convert_urls : false
	});
	$j(function() {
		$j('form#textBoxForm input[name="save_draft"]').click(function(event) {
			event.preventDefault()
			autosaveSubmit()
		})
		$j('form#textBoxForm input[name="save"]').click(function(event) {
			if (!confirm('Are you sure you are ready to send this submission for assessment?')) {
				event.preventDefault()
			}
		})
	});
</script>
<!-- END custom_head -->

<div id="submission-history">
	<div class="clearfix">
		<h2>{CATEGORY_NAME} - {BOX_NAME} <span>({BOX_TYPE})</span></h2>
		<h3>Due <span class="gradient-{BOX_DUEDATE_GRADIENT}">{BOX_DUEDATE}</span></h3>
		<div class="wysiwig">
			<form action="/submission/submitOnlineForm.php" method="post" id="textBoxForm">
				<input type="hidden" name="box_id" value="{BOX_ID}" />
				<input type="hidden" name="submission_id" value="{SUBMISSION_ID}" />
				<textarea rows="20" style="width: 100%;" name="body" id="textBoxBody">{TEXTBOX_BODY}</textarea>
				<br/>
				<p>You may save this submission as a draft, and come back to work on it later.</p>
				<input class="submit-btn-plain" type="submit" name="save_draft" value="Save as draft" />
				<input class="submit-btn-plain" type="submit" name="save" value="Submit for assessment" />
			</form>
		</div>
	</div>
</div>
