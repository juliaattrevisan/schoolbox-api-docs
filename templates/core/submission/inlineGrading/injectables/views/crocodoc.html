<h2>Document Preview</h2>
<section class="component-control-container">
	<a href="#" data-interaction="toggle-width" class="btn go-to no-text" title"Toggle width"><span></span></a>
</section>

<iframe id="inline-grading" class="inline-grading-iframe"></iframe>

<script>
    $(document).ready(function(){

        $('a[data-interaction="toggle-width"]').on('click', function(){
            $(this).closest('.inline-grading-column').toggleClass('fullwidth');
            $(this).toggleClass('go-to go-back');
            event.preventDefault();
        });

    });
</script>
