<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Audio</h2>
        <section>
            <!-- BEGIN injectable_audio_player -->
            <link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
            <script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
            <script type="text/javascript">
                $(function() {
                    var videoElement = $("#audio").mediaelementplayer();
                    var video        = videoElement.data('mediaelementplayer');
                });
            </script>
            <div>
                <audio id="audio" controls preload="none">
                    <source src="/cms/sendVideo.php?type=submission&id={AUDIO_ID}" type='audio/mp3'>
                </audio>
            </div>
            <!-- END injectable_audio_player -->

            <!-- BEGIN injectable_audio_status -->
            <div class="content">
                <img src="{INJECTABLE_AUDIO_STATUS_SRC}" />
                <p>
                    {INJECTABLE_AUDIO_STATUS_MSG}
                </p>
            </div>
            <!-- END injectable_audio_status -->
        </section>
    </div>
</div>
