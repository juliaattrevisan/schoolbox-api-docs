<h2>Video</h2>

<!-- BEGIN injectable_video_player -->
<link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
<script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>

<div class="videoWrapper">
	<video id="socialstream_video"
		controls
		preload="none"
		poster="/cms/videoThumb.php?type=submission&id={VIDEO_ID}&size=poster"
		width="100%"
		height="400"
	>
		<source src="/cms/sendVideo.php?type=submission&id={VIDEO_ID}" type='video/mp4'>
	</video>
	<script>
		var videoElement = $("#socialstream_video").mediaelementplayer();
		var video        = videoElement.data('mediaelementplayer');
	</script>
</div>
<!-- END injectable_video_player -->

<!-- BEGIN injectable_video_status -->
<img src="{INJECTABLE_VIDEO_STATUS_SRC}" />
<p>
	{INJECTABLE_VIDEO_STATUS_MSG}
</p>
<!-- END injectable_video_status -->
