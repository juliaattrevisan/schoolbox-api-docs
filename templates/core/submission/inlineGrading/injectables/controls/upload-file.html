<h2>Return Work</h2>
<div class='pad-it'>
	<!-- BEGIN returned_work -->
	<ul class="file-list">
		<li>
			<a href="/submission/send.php?id={MOST_RECENT_RETURN_FILE_ID}&return=1">
				<img width="32" height="32" src="/images/mime/60x60/{MOST_RECENT_RETURN_FILE_THUMB}"/>
				<span class="name">{MOST_RECENT_RETURN_FILE_NAME}
					<em>({MOST_RECENT_RETURN_FILE_SIZE})</em>
				</span>
				<span class="time">{MOST_RECENT_RETURN_FILE_DATE}</span>
				<span class="icon"></span>
			</a>
		</li>
	</ul>
	<!-- END returned_work -->
	<div class="clearfix"></div>
</div>
<div class='pad-it'>
	<p>Select and upload a file to return to the student.</p>
	<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
	<script type="text/javascript">
		$(function() {
			$j('.prettify').prettyFileInput({
				inputHolderClass:'file-input not-static',
				additionalButtonClasses: 'no-marg float-left',
				buttonActiveClass:'tick',
				defaultText:'<span></span>Choose File',
				defaultFileSelectedText:'<span></span>File selected'
			});
		});
	</script>

	<input type="file" name="file" class="prettify"/>

	<div class="clearfix"></div>
</div>
