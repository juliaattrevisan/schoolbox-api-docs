<!-- BEGIN custom_head -->
<script src="/javascript/jquery.combobox.js" type="text/javascript"></script>
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/components/flot/jquery.flot.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.highlighter.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.spider.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.rubric.js"></script>
<script src="/javascript/jquery.viewSubmission.js" type="text/javascript"></script>
<!-- END custom_head -->

<h1>{DUEWORK_DESCRIPTION}</h1>
<span class="header_option">
    <!-- BEGIN download_btn -->
    <a href="/submission/downloadAll.php?id={BOX_ID}" class="btn download"><span></span>Download All</a>
    <!-- END download_btn -->
    <!-- BEGIN modify_btn -->
    <a href="/submission/createSubmission/modify/{BOX_ID}" class="btn modify"><span></span>Modify</a>
    <!-- END modify_btn -->
	<a href="/submission/listSubmission" class="btn go-back"><span></span>Return to List</a>
    {DUEWORK_ARCHIVED}
</span>
<p>{DUEWORK_TYPE} due on <b>{DUEWORK_DUEDATE}</b></p>
<div class="view-submission">
    <form action="/submission/returnWorkForm.php" method="post" enctype="multipart/form-data" name="returnWorkForm" id="returnWorkForm">
        <table class="table">
            <colgroup>
                <col width="200px"/>
                <col />
				<col width="160px"/>
            </colgroup>
            <tbody>
            <!-- BEGIN student_row -->
            <tr class="user_{OWNER_ID} user">
                <td class="nowrap student">
                    <img class="student-icon" src="{OWNER_IMG}" alt="{OWNER_NAME}"/>

                    <p>
                        <a href="/search/user/{OWNER_ID}">{OWNER_NAME}</a>
                        <span class="student-status {OWNER_CLASS}">{OWNER_STATUS}</span>
                    </p>
                </td>
                <td class="marking">
                    <div>{OWNER_MARKING}</div>
                </td>
				<td>
					<a href="/submission/inline/view/{BOX_ID}/{OWNER_ID}" class="btn"><span></span>View work</a>
				</td>
            </tr>

            <!-- BEGIN submission_row -->
            <tr class="user_{OWNER_ID} submission file {SUBMISSION_EXPANDABLE} sub-table-row">
                <td class="{SUBMISSION_CLASS}">{SUBMISSION_TIME}{SUBMISSION_AFTER_MARK}</td>
                <td>
					<div class="table-wrap">
                    <p>
						<img class="mimetype" src="/images/mime/22x22/{SUBMISSION_MIMEICON}" alt="{SUBMISSION_FILENAME}"/>
						<!-- BEGIN plag_enabled -->
						<span class="plag-score {SUBMISSION_PLAG_CLASS}" title="{SUBMISSION_PLAG_SCORE} plagiarism - click to see report">(<a href="{SITE_ROOT}/modules/remote/{SUBMISSION_PLAG_HREF}">{SUBMISSION_PLAG_SCORE}</a>)</span>
						<!-- END plag_enabled -->
						<span class="submit-filename">{SUBMISSION_FILENAME}</span>
					</p>

					<div class="button-set">
						<a href="/submission/send.php?id={SUBMISSION_ID}&save=1" class="btn no-text download" title="Download submission"><span></span></a>
						<!-- BEGIN delete_action -->
						<a href="/submission/viewSubmissionForm.php?delete={SUBMISSION_ID}" onclick="return(confirm('Remove {OWNER_ESCAPED}\'s submission? '));" class="btn no-text delete" title="Delete submission"><span></span></a>
						<!-- END delete_action -->
					</div>
					</div>
				</td>
				<td>
				</td>
            </tr>
            <!-- END submission_row -->
            <!-- END student_row -->
            </tbody>
        </table>
    </form>
</div>
<div id="rubric-lightbox"></div>
