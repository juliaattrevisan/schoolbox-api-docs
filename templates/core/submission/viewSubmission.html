<!-- BEGIN custom_head -->
<script src="/javascript/jquery.combobox.js" type="text/javascript"></script>
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/components/flot/jquery.flot.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.highlighter.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.spider.js"></script>
<script type="text/javascript" src="/javascript/flot-plugins/jquery.flot.rubric.js"></script>
<script src="/javascript/jquery.marksheet.js" type="text/javascript"></script>
<script type="text/javascript">
	$(function() {
		$('#returnWorkForm').marksheet({
			submitOnChange: true
		});

		$('.combobox').combobox({COMBO_OPTIONS});
	});
</script>
<!-- END custom_head -->

<h1>{CATEGORY_NAME}: {DUEWORK_DESCRIPTION}</h1>
<span class="header_option">
    <!-- BEGIN report_btn -->
    <a href="/submission/overview/{BOX_ID}" class="btn report"><span></span>View Report</a>
    <!-- END report_btn -->
    <!-- BEGIN download_btn -->
    <a href="/submission/downloadAll.php?id={BOX_ID}" class="btn download"><span></span>Download All Submissions</a>
    <!-- END download_btn -->
    <!-- BEGIN modify_btn -->
    <a href="/submission/createSubmission/modify/{BOX_ID}" class="btn modify"><span></span>Modify</a>
    <!-- END modify_btn -->
    {DUEWORK_ARCHIVED}
</span>
<p class="sub-heading">{DUEWORK_TYPE} - Due: {DUEWORK_DUEDATE}</p>
<div class="listing">
    <ul class="breadcrumb">
        <li><a href="/submission/listSubmission" >Submissions</a></li>
        <li><a href="/submission/listSubmission/{DUEWORK_YEAR}/{DUEWORK_SEMESTER}/{CATEGORY_ID}" >{CATEGORY_NAME}</a></li>
        <li class="last"><a href="#">{DUEWORK_DESCRIPTION}</a></li>
    </ul>
</div>
<div class="view-submission">
    <form action="/submission/returnWorkForm.php" method="post" enctype="multipart/form-data" id="returnWorkForm">
        <table class="table ruler">
            <colgroup>
                <col width="200px"/>
                <col />
				<col width="185px"/>
            </colgroup>
            <tbody>
				<!-- BEGIN student_row -->
				<tr class="user_{OWNER_ID} user">
					<td class="nowrap student">
						<img class="student-icon" src="{OWNER_IMG}" alt="{OWNER_NAME}"/>

						<div>
							<a href="/search/user/{OWNER_ID}">{OWNER_NAME}</a>

							<div class="student-status {OWNER_CLASS}" >
                                <span title="{OWNER_TIME}">{OWNER_STATUS}</span><br />

                                <!-- BEGIN submission_after_mark -->
                                <span class="alert" title="Work has been resubmitted after grading"></span>
                                <!-- END submission_after_mark -->
                            </div>

							<!-- BEGIN submission_row -->
							<!-- BEGIN plag_enabled -->
							<!-- END plag_enabled -->
                            <!-- BEGIN plag_deleted -->
                            <!-- END plag_deleted -->
							<!-- BEGIN delete_action -->
							<!-- END delete_action -->
							<!-- END submission_row -->
						</div>
					</td>
					<td class="marking">
						<div>
							{OWNER_MARKING}
						</div>
					</td>
					<td>
                        <a href="/submission/inlineGrading/view/{BOX_ID}/{OWNER_ID}" class="btn"><span></span>View Submission</a>
                        <a href="/submission/submissionHistory/{BOX_ID}/{OWNER_ID}" class="btn clock no-text" title="View Submission History"><span></span></a>
					</td>
				</tr>

				<!-- END student_row -->
			</tbody>
        </table>
    </form>
</div>
<div id="rubric-lightbox"></div>
