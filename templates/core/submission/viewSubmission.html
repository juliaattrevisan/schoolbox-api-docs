<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css"/>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<script src="/javascript/jquery.viewSubmission.js" type="text/javascript"></script>
<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
<script type="text/javascript" src="/javascript/excanvas.compiled.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.highlighter.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.spider.js"></script>
<script type="text/javascript" src="/javascript/jquery.flot.rubric.js"></script>
<script type="text/javascript">
    $j(function () {
        // setup prettifier
        $j('.prettify').prettyFileInput({
            inputHolderClass:'file-input not-static',
            buttonClass:'btn up-arrow',
            buttonActiveClass:'tick no-text',
            defaultText:'<span></span>Select marked work',
            defaultFileSelectedText:'<span></span>',
            callback:function (e) {
                var css = {'visibility':'hidden'};
                if ($j('.btn.tick').length) {
                    css = {'visibility':'visible'};
                }
                $j('#upload-returns-submit').css(css);
            }
        });

        // Add the dark class only to even rows that are visible (skip over the hidden ones)
        $j('tbody tr:visible:even').addClass('dark');

        // Add another, darker class to th
        $j('tbody tr:hidden').addClass('sub-table-row');

        $j('tr.submission').each(function () {
            if ($j(this).next().hasClass('expandable') && !$j(this).hasClass('expandable')) {
                $j(this).addClass('drop-parent').children('td:first-child').prepend('<a href="#" class="submission-dropdown" title="Show submissions">&#9660;</a>');
            }
        });

        $j('.submission-dropdown').live('click', function () {
            var currentUnicode = $j(this).html().charCodeAt(0);

            if (currentUnicode == '9660') {
                $j(this).html('&#9650;')
            }
            else {
                $j(this).html('&#9660;')
            }

            var matchingClasses = $j(this).parents('tr').attr('class').toString().match(/user_(\d+)/);
            var expandables = '.' + matchingClasses[0] + '.expandable';

            // Clear queue and complete animation
            $j(this).parents('tbody').find(expandables).stop(true, true).fadeToggle();

            return false;
        });

        $j('.submission td span.alert').qtip({
            content:"Submission received after mark given"
        });
    });
</script>
<script src="/javascript/jquery.combobox.js" type="text/javascript"></script>
<script type="text/javascript">
    $j(function() {
        $j('.combobox').combobox({COMBO_OPTIONS});
    });
</script>
<!-- END custom_head -->

<h1>{DUEWORK_DESCRIPTION}</h1>
<span class="header_option">
    <!-- BEGIN download_btn -->
    <a href="/submission/downloadAll.php?id={BOX_ID}" class="btn download"><span></span>Download All</a>
    <!-- END download_btn -->
    <!-- BEGIN modify_btn -->
    <a href="/submission/createSubmission/modify/{BOX_ID}" class="btn modify"><span></span>Modify</a>
    <!-- END modify_btn -->
	<a href="/submission/listSubmission" class="btn go-back"><span></span>Return to List</a>
    {DUEWORK_ARCHIVED}
</span>
<p>{DUEWORK_TYPE} due on <b>{DUEWORK_DUEDATE}</b></p>
<div class="view-submission">
    <form action="/submission/returnWorkForm.php" method="post" enctype="multipart/form-data" name="returnWorkForm" id="returnWorkForm">
        <table>
            <colgroup>
                <col width="40px"/>
                <col width="200px"/>
                <col/>
            </colgroup>
            <thead>
            <tr>
                <th></th>
                <th></th>
                <th>
                    <input style="visibility:hidden;" id="upload-returns-submit" type="submit" class="submit-btn-plain up-arrow" value="Upload all"/>
                </th>
            </tr>
            </thead>
            <tbody>
            <!-- BEGIN student_row -->
            <tr class="user_{OWNER_ID} user submission">
                <td></td>
                <td class="nowrap student">
                    <img class="student-icon" src="{OWNER_IMG}" alt="{OWNER_NAME}"/>

                    <p>
                        <a href="/search/user/{OWNER_ID}">{OWNER_NAME}</a>
                        <span class="student-status {OWNER_CLASS}">{OWNER_STATUS}</span>
                    </p>
                </td>
                <td class="marking">
                    <div>{OWNER_MARKING}</div>
                    <div class="button-set">
                        <a href="/submission/submissionHistory/{BOX_ID}/{OWNER_ID}" class="btn"><span></span>View
                            History</a>
                        <input type="file" name="file-return-{OWNER_ID}" class="prettify"/>
                    </div>
                </td>
            </tr>

            <!-- BEGIN submission_row -->
            <tr class="user_{OWNER_ID} submission file {SUBMISSION_EXPANDABLE} sub-table-row">
                <td></td>
                <td class="{SUBMISSION_CLASS}">{SUBMISSION_TIME}{SUBMISSION_AFTER_MARK}</td>
                <td>
					<div class="table-wrap">
                    <p>
						<img class="mimetype" src="/images/mime/22x22/{SUBMISSION_MIMEICON}" alt="{SUBMISSION_FILENAME}"/>
						<!-- BEGIN plag_enabled -->
						<span class="plag-score {SUBMISSION_PLAG_CLASS}" title="{SUBMISSION_PLAG_SCORE} plagiarism - click to see report">(<a href="{SITE_ROOT}/modules/remote/{SUBMISSION_PLAG_HREF}">{SUBMISSION_PLAG_SCORE}</a>)</span>
						<!-- END plag_enabled -->
						<span class="submit-filename">{SUBMISSION_FILENAME}</span>
					</p>

					<div class="button-set">
						<a href="/submission/send.php?id={SUBMISSION_ID}" class="btn no-text download" title="Download submission"><span></span></a>
						<!-- BEGIN delete_action -->
						<a href="/submission/viewSubmissionForm.php?delete={SUBMISSION_ID}" onclick="return(confirm('Remove {OWNER_ESCAPED}\'s submission? '));" class="btn no-text delete" title="Delete submission"><span></span></a>
						<!-- END delete_action -->
					</div>
					</div>
				</td>
            </tr>
            <!-- END submission_row -->
            <!-- END student_row -->
            </tbody>
        </table>
    </form>
</div>
<div id="rubric-lightbox"></div>
