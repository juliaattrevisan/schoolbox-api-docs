<h1>{ASSDESC}</h1>
<span class="header_option">
   <a href="/submission/downloadAll.php?id={BOX_ID}">Download All</a> |
	<a href="/submission/listSubmission">Return to List</a>
</span>
<div class="indent">
    <p>These are the assignments that have been submitted. Deleting an assignment from here will allow the student to resubmit. Assignments in red are late.</p>
    <table class="ruler">
        <thead>
            <tr>
                <th>Submitted By</th>
                <th>Submitted Date</th>
                <th class="cntr">Download</th>
                <th class="cntr">Mark</th>
                <th class="cntr">Re-Mark</th>
                <th class="cntr">Delete</th>
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN submitted_block -->
            <tr class="{ON_OFF}">
                <td style="color:{COLOUR}; white-space: nowrap;"><a href="/search/user/{OWNER_ID}">{OWNER}</a></td>
                <!-- BEGIN mark -->
                <td style="color:{COLOUR};">{DATE}</td>
                <td class="cntr"><a href="/submission/send.php?id={SUB_ID}">Download</a></td>
                <td class="cntr">{RETURN}</td>
                <td class="cntr">{REMARK}</td>
                <td class="cntr"><a href="/submission/viewSubmissionForm.php?delete={SUB_ID}" onclick="return(confirm('Remove {OWNER_ESCAPED}\'s submission? '));">Delete</a></td>
                <!-- END mark -->
            </tr>
            <!-- END submitted_block -->
        </tbody>
    </table>
</div>
