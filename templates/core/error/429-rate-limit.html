<html lang="en">
<head>
    <link rel="shortcut icon" type="image/png" href="/static/images/core/icons/fail-whale-16x16.png"/>
    <title>Rate limit reached</title>
    <style>
        html {
            color: #0066B0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .content {
            margin: 0 auto;
            width: 600px;
        }
        @media (max-width: 650px) {
            .content {
                margin: 0 5%;
                width: 90%;
            }
        }

        .row {
            text-align: center;
        }

        .image-wrap {
            display: inline-block;
        }

        p {
            font-size: 20px;
            line-height: 30px;
        }
    </style>
</head>
<body>
<div class="content">
    <div class="row">
        <div class="image-wrap">
            <img src="/static/images/core/fail-whale.png" width="513" height="434" alt="Sad whale">
        </div>
    </div>
    <div class="row">
        <div id="message">
            <h2>You have been rate limited</h2>
            <p>
                This means that too many requests have been made to the server from your device. Please wait a minute
                before refreshing the page. If this persists, please contact your IT department to let them know.
            </p>
        </div>
    </div>
</div>
</body>
</html>
