<html lang="en">
    <head>
        <link rel="shortcut icon" type="image/png" href="/images/core/icons/fail-whale-16x16.png"/>
        <title>Schoolbox scheduled maintenance</title>
        <script>
            const MAX_TIMEOUT_PERIOD = 10;      // Don't back-off to less frequent checks than this

            // Variables
            let timeoutPeriod  = 2,            // How much time to delay before rechecking service status
                timeoutCounter = timeoutPeriod; // How much time left until next check


            // DOM elements
            let counterLabel,
                maintenanceMessage,
                refreshMessage;

            /**
             * Initial setup on page load
             */
            function init() {
                counterLabel       = document.getElementById('count_seconds');
                maintenanceMessage = document.getElementById('message');
                refreshMessage     = document.getElementById('refresh');
                timedRefresh();
            }

            /**
             * Executed every 1000ms
             */
            function timedRefresh() {
                counterLabel.innerHTML = timeoutCounter.toString(); // Update the DOM element
                if (timeoutCounter === 0) {
                    checkServiceRestored();
                } else {
                    setTimeout(timedRefresh, 1000);                 // Re-schedule
                }
                timeoutCounter--;                                   // Decrement counter
            }

            /**
             * Returns whether the server is back up
             * @return boolean
             */
            function checkServiceRestored(){
                let xHttp = new XMLHttpRequest();
                xHttp.addEventListener("load", onXHttpResponse);
                xHttp.open("GET", "/ping");
                xHttp.send();
            }

            function onXHttpResponse () {
                if(200 === this.status) {
                    // If this was a get request, this next line should reload the requested resource
                    location.reload(true);

                    // Otherwise prompt the user to refresh to re-post so they don't lose their work
                    // maintenanceMessage.className = 'hide';
                    // refreshMessage.className = '';
                    // TODO how do this automatically?

                } else if(503 === this.status){
                    // Still down. Apply exponential back-off, reset timeout counter, but not more than the max
                    timeoutPeriod *= 2;
                    timeoutPeriod = Math.min(timeoutPeriod, MAX_TIMEOUT_PERIOD);
                    timeoutCounter = timeoutPeriod;
                    timedRefresh();
                } else {
                    // Something went wrong.
                }
            }

            window.onload = init;
        </script>
        <style>
            html {
                color: #0066B0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .row{
                text-align: center;
            }
            .image-wrap{
                display: inline-block;
            }
            h1{
                /*font-size: larger;*/
            }
            #message{
                line-height: 30px;
            }
            .retry{
                font-style: italic;
                opacity: 0.5;
            }
            #refresh {
                color: forestgreen;
            }
            .hide {
                display: none;
            }

        </style>
    </head>
    <body>
<!--        <h1>503 - Service Temporarily Unavailable</h1>-->
        <div class="content">
            <div class="row">
                <div class="image-wrap">
                    <img src="/images/core/fail-whale.png" width="527" height="447" alt="Sad whale">
                </div>
            </div>
            <div class="row">
                <div id="message">
                    <h2>Don't panic!</h2>
                    <p>Schoolbox is temporarily lost in cyberspace due to maintenance.<br>Sit back an relax, we'll refresh your page automatically when ready.</p>
                    <p class="retry">Retrying in <span id="count_seconds"></span>...</p>
                </div>
                <div id="refresh" class="hide" >
                    <p>Schoolbox appears to be back up. Please refresh your browser to re-submit your request</p>
                </div>
            </div>
        </div>
    </body>
</html>
