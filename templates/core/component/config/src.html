<script type="text/javascript">
    $j(function () {
        /* Modal for URL homepage selection
         */
        $j('#resource-browser').dialog({
            width: 650,
            autoOpen: false,
            title: "Select a homepage",
            modal: true,
            resizable: false
        });

        $j('#src-{COMPONENT_HANDLE}').change(function(){
            $j('#text-{COMPONENT_HANDLE}').attr('href', this.value);
        });

        $j('#launch-browser-{COMPONENT_HANDLE}').click(function() {
            $j('#resource-browser').load(
                '/ajax/resourceBrowser',
                {
                    destination:     '#src-{COMPONENT_HANDLE}',
                    destinationText: '#text-{COMPONENT_HANDLE}',
                    triggerChange:   true
                },
                function() {
                    $j('#resource-browser').dialog('open');
                }
            );
            return false;
        });
    });
</script>
<span><a id="text-{COMPONENT_HANDLE}" href="{COMPONENT_CONFIG_SRC_ID}">{COMPONENT_CONFIG_SRC_NAME}</a> </span>
<input type="button" value="Select Alternate Source" id="launch-browser-{COMPONENT_HANDLE}" />
<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="src" id="src-{COMPONENT_HANDLE}"/>
