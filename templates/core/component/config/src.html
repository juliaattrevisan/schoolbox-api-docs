<script type="text/javascript" src="/textbox/javascript/availableByCategory.js"></script>
<script type="text/javascript">
  $(function () {
    /* Modal for URL homepage selection
     */

    $('#launch-browser-{COMPONENT_HANDLE}').on('click', function() {
      var self = $(this);

      $('#resource-browser').socialstreamBrowser({
        title: 'Choose a source',
        categoryId: '{COMPONENT_CONFIG_SRC_CID}',
        mimeFilter: false,
        submitCallback: function(url, filename) {

          var src = $('#src-{COMPONENT_HANDLE}');
          var lbl = $('#text-{COMPONENT_HANDLE}');

          src.val(url);
          lbl.attr('href', url).html(filename);

          var select = $('#src-{COMPONENT_HANDLE}').closest('form').find('div.textbox').find('select');

          if (select) {
            src.availableByCategory({
              categoryId: src.val().toString().replace('/homepage/', ''),
              target: select
            });
          }
        }
      });
    });


  });
</script>
<span>
  <a id="text-{COMPONENT_HANDLE}" href="{COMPONENT_CONFIG_SRC_ID}">
    <img src="/images/mime/22x22/folder.png" alt="{COMPONENT_CONFIG_SRC_NAME}" height="22" width="22">{COMPONENT_CONFIG_SRC_NAME}
  </a>
</span>
<a href="#" id="launch-browser-{COMPONENT_HANDLE}" class="btn folder inline-block">
    <span></span>Select Source
</a>
<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="src" id="src-{COMPONENT_HANDLE}"/>
