<script type="text/javascript" src="{CDN_PREFIX}/js/textbox/availableByCategory.js?v={SITE_VERSION}"></script>
<script>
    $(function() {
        $('#modalLinkButton-src-{COMPONENT_HANDLE}').schoolboxLink({
            allowedFiles: false,
            allowedFilesystems: 'folder',
            defaultFolderSelector: $('#src-folder-id-{COMPONENT_HANDLE}').val(),
            onSelect: function(url, name, mime, dialog) {
                const currentFolderId = parseInt('{ID}');
                const folderId = parseInt(url.replace('/homepage/', ''));
                const label = $('#text-{COMPONENT_HANDLE}');

                // If user selected current page, then set label to 'Local',
                // otherwise set to selected folder's name

                if (currentFolderId === folderId) {
                    label.text('Local');
                } else {
                    label.text(name);
                }

                label.attr('href', url);

                /* Save the actual value
                 */
                $('#src-{COMPONENT_HANDLE}').val(url);
                $('#src-folder-id-{COMPONENT_HANDLE}').val(folderId);

                // Update a select box.
                // How that's done depends on exactly what type it is: textbox or tile

                const select = $('#src-{COMPONENT_HANDLE}').closest('form').find('select[data-uses-source]');

                if (select.length) {
                    select.each(function() {
                        $('#src-{COMPONENT_HANDLE}').availableByCategory({
                            categoryId: folderId,
                            target: $(this),
                            payload: {
                                type: $(this).attr('name')
                            }
                        });
                    })
                }
            }
        });
    });
</script>
<a id="modalLinkButton-src-{COMPONENT_HANDLE}" class="button icon-link">Browse</a>
<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="src" id="src-{COMPONENT_HANDLE}"/>
<input type="hidden" value="{COMPONENT_CONFIG_SRC_CID}" name="src-folder-id" id="src-folder-id-{COMPONENT_HANDLE}"/>
<span>
  <a id="text-{COMPONENT_HANDLE}" href="{COMPONENT_CONFIG_SRC_ID}" class="src-folder" title="{COMPONENT_CONFIG_SRC_NAME}">
    {COMPONENT_CONFIG_SRC_NAME}
  </a>
</span>
