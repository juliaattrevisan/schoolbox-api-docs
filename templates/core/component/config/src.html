<script type="text/javascript" src="/component/javascript/availableByCategory.js"></script>
<script type="text/javascript">
  $(function () {
    /* Modal for URL homepage selection
     */

    $('#launch-browser-{COMPONENT_HANDLE}').on('click', function(e) {
      e.preventDefault();
      var pageFolderId = parseInt('{ID}');

      $('#resource-browser').socialstreamBrowser({
        title: 'Choose a source',
        categoryId: Number('{COMPONENT_CONFIG_SRC_CID}') || Number('{ID}'),
        mimeFilter: false,
        submitCallback: function(url, filename, metadata) {

          var src = $('#src-{COMPONENT_HANDLE}');
          var lbl = $('#text-{COMPONENT_HANDLE}');
          var nodeId = parseInt(metadata.nodeId);

          // If user selected current page, then set label to 'Local', otherwise set to selected folder's name
          src.val(nodeId === pageFolderId ? '' : url);
          lbl.attr('href', url).text(nodeId === pageFolderId ? 'Local' : filename);
          // Update a select box.
          // How that's done depends on exactly what type it is: textbox or tile
          var select = $('#src-{COMPONENT_HANDLE}').closest('form')
                  .find('select[data-uses-source]');

          if (select.length) {
              var categoryId = src.val().toString().replace('/homepage/', '');
              // No folder found in the source? Just use whatever folder this component is on
              if (categoryId === '') {
                  categoryId = nodeId;
              }
              select.each(function() {
                  var element = $(this);
                  src.availableByCategory({
                      categoryId: categoryId,
                      target: element,
                      payload: {
                          type: element.attr('name')
                      }
                  });
              })
          }
        }
      });
    });


  });
</script>

<a href="#" id="launch-browser-{COMPONENT_HANDLE}" class="button icon-folder">Select Source</a>
<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="src" id="src-{COMPONENT_HANDLE}"/>
<span>
  <a id="text-{COMPONENT_HANDLE}" href="{COMPONENT_CONFIG_SRC_ID}" class="src-folder" title="{COMPONENT_CONFIG_SRC_NAME}">
    {COMPONENT_CONFIG_SRC_NAME}
  </a>
</span>
