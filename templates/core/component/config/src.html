<script type="text/javascript" src="/textbox/javascript/availableByCategory.js"></script>
<script type="text/javascript">
  $(function () {
    /* Modal for URL homepage selection
     */

    $('#launch-browser-{COMPONENT_HANDLE}').on('click', function() {
      var self = $(this);

      $('#resource-browser').socialstreamBrowser({
        title: 'Choose a source',
        categoryId: '{COMPONENT_CONFIG_SRC_CID}',
        mimeFilter: false,
        submitCallback: function(url, filename) {

          var src = $('#src-{COMPONENT_HANDLE}');
          var lbl = $('#text-{COMPONENT_HANDLE}');

          src.val(url);
          lbl.attr('href', url).html(filename);

          // Update a select box.
          // How that's done depends on exactly what type it is: textbox or tile
          var select = $('#src-{COMPONENT_HANDLE}').closest('form')
                  .find('select[data-uses-source]');

          if (select.length) {
              var categoryId = src.val().toString().replace('/homepage/', '');
              select.each(function() {
                  var element = $(this);
                  src.availableByCategory({
                      categoryId: categoryId,
                      target: element,
                      payload: {
                          type: element.attr('name')
                      }
                  });
              })
          }
        }
      });
    });


  });
</script>
<span>
  <a id="text-{COMPONENT_HANDLE}" href="{COMPONENT_CONFIG_SRC_ID}">
    <img src="/images/mime/22x22/folder.png" alt="{COMPONENT_CONFIG_SRC_NAME}">{COMPONENT_CONFIG_SRC_NAME}
  </a>
</span>
<input type="button" value="Select Alternate Source" id="launch-browser-{COMPONENT_HANDLE}"/>
<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="src" id="src-{COMPONENT_HANDLE}"/>
