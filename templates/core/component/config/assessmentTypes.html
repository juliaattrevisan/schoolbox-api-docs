<ul class="c-chips l-gap-xs" id="component{COMPONENT_INSTANCE_ID}-assessmentTypes-chips-container">
    <!-- BEGIN assessmenttypes -->
    <li>
        <input type="hidden" name="assessmentTypes[{COMPONENT_CONFIG_FILTER_VALUE}]" value="0" />
        <input id="component{COMPONENT_INSTANCE_ID}-assessmentTypes-{COMPONENT_CONFIG_FILTER_VALUE}" type="checkbox" name="assessmentTypes[{COMPONENT_CONFIG_FILTER_VALUE}]" value="1" {COMPONENT_CONFIG_FILTER_SELECTED}  />
        <label for="component{COMPONENT_INSTANCE_ID}-assessmentTypes-{COMPONENT_CONFIG_FILTER_VALUE}">
            {COMPONENT_CONFIG_FILTER_NAME}<span class="c-chip__icon icon-tick"></span>
        </label>
    </li>
    <!-- END assessmenttypes -->
</ul>

<script>
    // Avoid toggling the first checkbox when clicking on the label or outside the checkbox
    document.getElementById('component{COMPONENT_INSTANCE_ID}-assessmentTypes-chips-container')
        .closest("label:not([for])")
        .addEventListener("click", (e) => {
            if (e.target.tagName === "LABEL" && e.target.getAttribute("for") === null) {
                e.preventDefault();
            } else if (e.target.tagName === "UL") {
                e.preventDefault();
            }
        }
    );
</script>
