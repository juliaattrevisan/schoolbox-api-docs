<!-- BEGIN tile_select -->
<select name="layoutId" data-uses-source>
    <option value="">(none)</option>
    <!-- BEGIN tile_option -->
    <option value="{COMPONENT_CONFIG_LAYOUTID_VALUE}"{COMPONENT_CONFIG_LAYOUTID_SELECTED}>{COMPONENT_CONFIG_LAYOUTID_NAME}</option>
    <!-- END tile_option -->
</select>
<!-- END tile_select -->

<!-- BEGIN link -->
<ul class="flex-list buttons">
    <li><a href="/tile/add/{COMPONENT_CONFIG_LAYOUTID}" class="button icon-add">Add Tile</a></li>
    <li><a href="/tile/layout/{COMPONENT_CONFIG_LAYOUTID}" class="button icon-modify">Modify Layout</a></li>
</ul>
<!-- END link -->

<!-- BEGIN component_link -->
<ul class="flex-list buttons">
    <li><a href="/tile/add/component/{TILE_COMPONENT_INSTANCE_ID}" class="button icon-add">Add Tile</a></li>
    <li><a href="/tile/layout/component/{TILE_COMPONENT_INSTANCE_ID}" class="button icon-modify">Modify Layout</a></li>
</ul>
<!-- END component_link -->

<!-- BEGIN no_link -->
<p class="meta">You cannot add tiles to this layout, because the layout has been deleted.</p>
<!-- END no_link -->

<!-- BEGIN permission_denied -->
<p class="meta">You don't have permission to modify this layout, or to add tiles to it.</p>
<!-- END permission_denied -->
