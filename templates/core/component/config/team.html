<script type="text/javascript">
// This HTML file is intended to be injected a page that is already loaded and ready, so $().ready() is useless to
// us here.  We want to load the scripts listed below, and only when those scripts have loaded do we want our function
// to execute.
loadScriptsThenRunFunction(
    [
        "{CDN_PREFIX}/js/vendors/selectize/selectize.min.js?v={SITE_VERSION}",
        "{CDN_PREFIX}/js/vendors/selectize/jquery.selectize-selector.js?v={SITE_VERSION}",
    ],
    initSelectizeSelectors
);

function loadScriptsThenRunFunction(jsFilenames, onAllScriptsLoaded) {
    let nScriptsLoaded = 0;

    for (let jsFilename of jsFilenames) {
        // If the file has not yet been loaded, load it, otherwise skip the loading step.
        if (document.querySelector('script[src="' + jsFilename + '"]') === null) {
            const scriptElement = document.createElement('script');
            scriptElement.addEventListener('load', onScriptLoaded);
            scriptElement.src = jsFilename;
            document.head.appendChild(scriptElement);
        } else {
            onScriptLoaded();
        }
    }

    function onScriptLoaded () {
        nScriptsLoaded++;

        if (nScriptsLoaded === jsFilenames.length) {
            onAllScriptsLoaded();
        }
    }
}

function initSelectizeSelectors() {
    let options = {
        ajax: {
            url:      '/fixtures/divisions/*/teams',
            type:     'GET',
            data:     {},
            dataType: 'json'
        }
    }

    const id = $('#team-{COMPONENT_INSTANCE_ID}').val();

    if (id != 0) {
        options.value = {
            id:   id,
            name: $('#team-placeholder-{COMPONENT_INSTANCE_ID}').val()
        }
    }

    $('#team-placeholder-{COMPONENT_INSTANCE_ID}').selectizeSelector(options)
        .on('selectize.item_add', function (event, value) {
            $('#team-{COMPONENT_INSTANCE_ID}').val(value);
        })
        .on('selectize.item_remove', function () {
            $('#team-{COMPONENT_INSTANCE_ID}').val('');
        });
}
</script>

<input type="text" id="team-placeholder-{COMPONENT_INSTANCE_ID}" value="{COMPONENT_TEAM_NAME}" placeholder="Search Teams">
<input type="hidden" id="team-{COMPONENT_INSTANCE_ID}" name="team" value="{COMPONENT_TEAM_ID}">
