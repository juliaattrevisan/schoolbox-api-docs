<script type='text/javascript' src='/javascript/components/jquery-timepicker-jt/jquery.timepicker.js'></script>
<script type="text/javascript">
    $(function() {
        $('#component{COMPONENT_INSTANCE_ID}-countdownTime').timepicker({
            'timeFormat':'H:i',
            'step':15,
            appendTo: function ($input) {
                return $input.closest('.timepick');
            }
        });
    });
</script>
<div class="timepick">
    <input id='component{COMPONENT_INSTANCE_ID}-countdownTime' name='time' type='text' value='{COMPONENT_CONFIG_TIME}' />
</div>
