<div class="row">
    <div class="small-12 columns">
        <div class="component-titlebar">
            <!-- BEGIN titlebar_write -->
            <div data-component-titlebar-container data-action-count="{COMPONENT_ACTION_COUNT}" class="actions-small-{COMPONENT_ACTION_COUNT}">
            <!-- END titlebar_write -->

            <!-- BEGIN titlebar_read -->
            <div class="actions-small-{COMPONENT_ACTION_COUNT}">
            <!-- END titlebar_read -->

                <div class="list-item">
                    <h2 title="{COMPONENT_NAME}">
                        <!-- BEGIN drag_handle -->
                        <a href="#" class="icon-grip" id="drag{COMPONENT_INSTANCE_ID}" data-component-handle {HIDE_CONTROLS_ON_WRITE}></a>
                        <!-- END drag_handle -->
                        <span id="component-title-{COMPONENT_INSTANCE_ID}" data-test="homepage-component-titlebar-name" data-test-component-instance-id="{COMPONENT_INSTANCE_ID}">{COMPONENT_NAME}</span>
                    </h2>
                </div>
                <nav>
                    <!-- BEGIN settings_link -->
                    <a {HIDE_CONTROLS_ON_WRITE} {COMPONENT_SETTINGS_DATA} data-target='settings' data-state='closed' href="#" class="icon-settings settings edit" title="Settings"></a>
                    <!-- END settings_link -->
                    <!-- BEGIN settings_collapse -->
                    <a data-collapser="true" href="#" class="{CONFIG_COLLAPSED_ICON} collapse" title="Expand/collapse content"></a>
                    <!-- END settings_collapse -->
                    <!-- BEGIN settings_close -->
                    <a {HIDE_CONTROLS_ON_WRITE} {COMPONENT_SETTINGS_DATA} data-target="delete" data-state='closed' href="#" class="icon-close" title="Close"></a>
                    <!-- END settings_close -->
                </nav>
            </div>
        </div>

        <!-- BEGIN settings_panel -->
        <div data-component-panel="settings" class="editPanel small-12">
            <section>
                <div>
                    <form action="/homepage/configForm.php" method="POST">
                        <input type="hidden" name="cid" value="{ID}" />
                        <input type="hidden" name="type" value="config" />
                        <input type="hidden" name="component" value="{COMPONENT_INSTANCE_ID}" />
                        <!-- BEGIN config_element -->
                        <div class="{CONFIG_ELEMENT_CLASS}" {CONFIG_DISPLAY}>
                            <label>
                                {CONFIG_ELEMENT_LABEL}
                                <div>{CONFIG_ELEMENT_CONTENT}</div>
                            </label>
                        </div>
                        <!-- END config_element -->
                        <input type="submit" value="Update" />
                    </form>
                </div>
            </section>
        </div>
        <!-- END settings_panel -->

        <div data-component-panel='delete' class="editPanel small-12 ">
            <section>
                <div>
                    <p>Are you sure you want to remove this component?</p>
                    <form action="#" method="post">
                        <input type="hidden" name="cid" value="{ID}" />
                        <input type="hidden" name="delete" data-remove-component-id value="{COMPONENT_INSTANCE_ID}" />
                        <input type="hidden" data-defn-id name="component" value="{COMPONENT_DEFINITION_ID}" />
                        <ul class="flex-list buttons">
                            <li><a href="#" class="button submit" data-remove="1">Remove</a></li>
                            <li><a href="#" class="button" data-remove="0">Cancel</a></li>
                        </ul>
                    </form>
                </div>
            </section>
        </div>
    </div>
</div>
