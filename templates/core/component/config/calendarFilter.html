<div class="row">
    <div class="small-12 medium-6 columns">
        <p>
            <em>Subscriptions</em><br />
            <!-- BEGIN calendarfilter_subscribe_link -->
            <a href="/adminv2/calendar/Subscribe">Manage calendar subscriptions</a>
            <!-- END calendarfilter_subscribe_link -->
        </p>

        <!-- BEGIN calendarfilter_source -->
        <div>
            <input id="component{COMPONENT_INSTANCE_ID}-calendarfilter-source-{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" type="checkbox" name="calendarFilter[source][]" value="{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" {COMPONENT_CONFIG_CALENDARFILTER_SELECTED} />
            <label for="component{COMPONENT_INSTANCE_ID}-calendarfilter-source-{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" class="checkbox-label">
                {COMPONENT_CONFIG_CALENDARFILTER_NAME}
            </label>
        </div>
        <!-- END calendarfilter_source -->
    </div>
    <div class="small-12 medium-6 columns">
        <p><em>Event Type</em></p>

        <input type="hidden" name="calendarFilter[eventType][]" />
        <input type="hidden" name="calendarFilter[source][]" />

        <!-- BEGIN calendarfilter_eventtype -->
        <div>
            <input id="component{COMPONENT_INSTANCE_ID}-calendarfilter-eventType-{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" type="checkbox" name="calendarFilter[eventType][]" value="{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" {COMPONENT_CONFIG_CALENDARFILTER_SELECTED} />
            <label for="component{COMPONENT_INSTANCE_ID}-calendarfilter-eventType-{COMPONENT_CONFIG_CALENDARFILTER_VALUE}" class="checkbox-label">
                {COMPONENT_CONFIG_CALENDARFILTER_NAME}
            </label>
        </div>
        <!-- END calendarfilter_eventtype -->
    </div>
</div>
