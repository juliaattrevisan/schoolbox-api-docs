<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript">
    $j(function () {
        var options = {
            ajax: {
                url:      '/ajax/textbox.php',
                type:     'GET',
                data:     {},
                dataType: 'json'
            }
        }
        var id = $j("#textboxSearch{COMPONENT_TEXTBOX_ID}").val()
        if (id != 0) {
            options.value = {
                id:   id,
                name: $j("#textbox_search{COMPONENT_TEXTBOX_ID}").val()
            }
        }
        $j('#textbox_search{COMPONENT_TEXTBOX_ID}').selectizeSelector(options)
        .on('selectize.item_add', function(event, value) {
            $j('#textboxSearch{COMPONENT_TEXTBOX_ID}').val(value)
        })
        .on('selectize.item_remove', function() {
            $j('#textboxSearch{COMPONENT_TEXTBOX_ID}').val('')
        })
    });
</script>


<input type="text" id="textbox_search{COMPONENT_TEXTBOX_ID}" value="{COMPONENT_TEXTBOX_NAME}" placeholder="Search Textboxes">
<input type="hidden" id="textboxSearch{COMPONENT_TEXTBOX_ID}" name="textboxSearch" value="{COMPONENT_TEXTBOX_ID}">
