<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/selectize.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/jquery.selectize-selector.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function () {
        var options = {
            ajax: {
                url:      '/ajax/textbox.php',
                type:     'GET',
                data:     {},
                dataType: 'json'
            }
        }

        var id = $('#textboxSearch{COMPONENT_INSTANCE_ID}').val();

        // @var bool isLinked
        var isLinked = {VAR_IS_LINKED};

        if (isLinked) {
            options.value = {
                id:   id,
                name: $('#textbox_search{COMPONENT_INSTANCE_ID}').val()
            }
        }

        $('#textbox_search{COMPONENT_INSTANCE_ID}').selectizeSelector(options)
            .on('selectize.item_add', function(event, value) {
                $('#textboxSearch{COMPONENT_INSTANCE_ID}').val(value);
            })
            .on('selectize.item_remove', function() {
                $('#textboxSearch{COMPONENT_INSTANCE_ID}').val('');
            });
    });
</script>

<input type="text" id="textbox_search{COMPONENT_INSTANCE_ID}" value="{COMPONENT_TEXTBOX_NAME}" placeholder="Search Text Boxes">
<input type="hidden" id="textboxSearch{COMPONENT_INSTANCE_ID}" name="textboxSearch" value="{LINKED_TEXTBOX_ID}">

<!-- BEGIN is_linked -->
<a href='{VIEW_URL}' class="button icon-view">View</a>
<!-- END is_linked -->
