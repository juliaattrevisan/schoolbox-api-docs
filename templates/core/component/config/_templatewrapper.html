<span class="actions two nodrag" data-equalizer-watch>
  <!-- BEGIN settings_link -->
  <a class="config-this icon-settings no-text" href="#" data-equalizer-watch></a>
  <!-- END settings_link -->

  <!-- BEGIN settings_collapse -->
  <a data-collapser="true" class="component-control-button collapse" href="#" data-equalizer-watch>
    {CONFIG_COLLAPSED_ICON}
  </a>
  <!-- END settings_collapse -->

  <!-- BEGIN settings_close -->
  <a class="delete-this icon-close no-text" href="#" data-equalizer-watch></a>
  <!-- END settings_close -->

  <!-- BEGIN settings_panel -->
</span>
<div class="editPanel settings">
  <form action="/homepage/configForm.php" method="GET">
    <input type="hidden" name="cid" value="{ID}" />
    <input type="hidden" name="type" value="config" />
    <input type="hidden" name="component" value="{COMPONENT_INSTANCE_ID}" />
    <!-- BEGIN config_element -->
    <div class="{CONFIG_ELEMENT_CLASS}"><span>{CONFIG_ELEMENT_LABEL}: </span>{CONFIG_ELEMENT_CONTENT}</div>
    <!-- END config_element -->
    <input type="submit" value="Update" class="submit-btn-plain update" />

  </form>
</div>
<!-- END settings_panel -->
