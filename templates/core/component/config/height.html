<input type="text" name="height" value="{COMPONENT_CONFIG_HEIGHT}" />
<script>
    // Add a tooltip to the height field to explain that it is only available when the display ratio is set to 'Auto'
    (function() {
        const currentHeightInput = document.querySelector('#component{COMPONENT_INSTANCE_ID} input[name="height"]');
        if (!currentHeightInput) {
            return;
        }
        currentHeightInput.parentNode.insertAdjacentHTML('beforeBegin',
            `<span
                class="hint has-tip tip-top"
                data-tooltip title="To customise the display height of the component. Only whole numbers are allowed."
            >?</span>`
        )

        // As we are adding a new tooltip, we need to trigger foundation to find the new one
        setTimeout(function() {
            $(document).foundation('tooltip', 'reflow');
        }, 500);

        // Add an event listener to the height input to restrict the input to whole numbers only
        currentHeightInput.addEventListener("input", (event) => {
            const value = event.target.value;
            event.target.value = value.replace(/[^0-9]/g, ""); // Remove non-numeric characters
        });
    })();
</script>
