<input type="text" name="pixel" value="{COMPONENT_CONFIG_PIXEL}" size="4"/>
<script>
    // Add a tooltip to the pixel field to explain that it is only available when the display ratio is set to 'Auto'
    (function() {
        const currentPixel = document.querySelector('#component{COMPONENT_INSTANCE_ID} input[name="pixel"]');

        currentPixel.parentNode.insertAdjacentHTML('beforeBegin',
            `<span
                data-pixel-tooltip="{COMPONENT_INSTANCE_ID}"
                class="hint has-tip tip-top"
                data-tooltip title="This option is only available when the display ratio is set to 'Auto'"
            >?</span>`
        )

        const attachedDisplayRatio = document.querySelector('#component{COMPONENT_INSTANCE_ID} select[name="imageRatio"]');
        if (attachedDisplayRatio) {
            if (attachedDisplayRatio.value === 'auto') {
                currentPixel.removeAttribute("disabled")
            } else {
                currentPixel.setAttribute("disabled", "disabled")
            }

            attachedDisplayRatio.addEventListener('change', function() {
                if (this.value === 'auto') {
                    currentPixel.removeAttribute("disabled")
                } else {
                    currentPixel.setAttribute("disabled", "disabled")
                }
            });
        }
    })();

    // As we are adding a new tooltip, we need to trigger foundation to find the new one
    // The following error occurs within Foundation if the setTimeout is not used:
    //  jquery.js:1745 Uncaught Error: Syntax error, unrecognized expression: [data-"Times New Roman"-tooltip]
    //  to prevent foundation from throwing this error, we need to wait a moment before triggering the tooltip reflow
    //  note: if this error is still thrown for some reason, it is okay to ignore. The tooltip will still work.
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
            $(document).foundation('tooltip', 'reflow');
        });
    } else {
        // Document is already loaded, so we can trigger the tooltip reflow immediately
        $(document).foundation('tooltip', 'reflow');
    }
</script>
