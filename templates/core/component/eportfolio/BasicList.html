<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$(function() {
			$('a.modify_basic').click(function() {
				var id = $(this).attr('rel');

				/* Show editor form
				 */
				$('#modify_basic_form_' + id).show();
				$('#modify_basic_form_' + id).find('.firstFocus').focus();

				/* Hide actual content
				 */
				$('#list_item_basic_content_' + id).hide();
			});

            /* Create button, swap form in
             */
            $('a.create_basic').click(function(event) {
				event.preventDefault();

                $(this).hide();
                $(this).next().show();
            });

			/* Close button
			 */
			$('a.modify_basic_close').click(function() {
				var id = $(this).attr('rel');

				/* Show actual content
				 */
				$('#list_item_basic_content_' + id).show();

				/* Hide editor form
				 */
				$('#modify_basic_form_' + id).hide();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<ul class="information-list">
	<!-- BEGIN list_item -->
		<li class="{ON_OFF}" id='list_item_basic_content_{LIST_ITEM_ID}'>
			<span class="actions">
				<!-- BEGIN has_delete_form -->
				<a title="Remove link" class="btn delete no-text" href="/eportfolio/component/basiclist/modifyForm.php?action=removeItem&userId={ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}" onclick="return confirm('Do you want to delete this item?');"><span></span></a>
				<!-- END has_delete_form -->
				<!-- BEGIN has_modify_button -->
				<a class='btn modify no-text modify_basic' title="Edit item" rel='{LIST_ITEM_ID}'><span></span></a>
				<!-- END has_modify_button -->
			</span>

			<h4>{LIST_ITEM_CONTENT}</h4>

		</li>
		<!-- BEGIN has_modify_form -->
		<div class="editPanelImitation hide" id='modify_basic_form_{LIST_ITEM_ID}'>
			<form class='modifyForm' action='/eportfolio/component/basiclist/modifyForm.php' method='post'>
				<input type='hidden' name='action' value='updateItem' />
				<input type='hidden' name='userId' value='{ID}' />
				<input type='hidden' name='pageId' value='{PAGE_ID}' />
				<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
				<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

				<div class="content"><span>Content: </span>
					<input type='text' class='firstFocus' name='content' value='{LIST_ITEM_CONTENT}' />
				</div>

				<input type='submit' value='Update' />
			</form>
		</div>
		<!-- END has_modify_form -->
		<!-- END list_item -->
	</ul>

    <!-- BEGIN has_create_form -->
	<a href="#" class="btn add create_basic"><span></span>Add to List</a>

    <div class="editPanelImitation hide">
        <form action='/eportfolio/component/basiclist/modifyForm.php' method='post'>
            <input type='hidden' name='action' value='addItem' />
            <input type='hidden' name='userId' value='{ID}' />
            <input type='hidden' name='pageId' value='{PAGE_ID}' />
            <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
            <div class="content"><span>Content: </span>
                <input type='text' name='content' value='' />
            </div>
            <input type='submit' value='Add item' />
        </form>
    </div>
    <!-- END has_create_form -->
</div>
