<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$j(function() {
			$j('a.modify_basic').click(function() {
				var id = $j(this).attr('rel');

				/* Show editor form
				 */
				$j('#modify_basic_form_' + id).show();
				$j('#modify_basic_form_' + id).find('.firstFocus').focus();

				/* Hide actual content
				 */
				$j('#list_item_basic_content_' + id).hide();
			});

            /* Create button, swap form in
             */
            $j('a.create_basic').click(function() {
                $j(this).hide();
                $j(this).next().show();

            });

			/* Close button
			 */
			$j('a.modify_basic_close').click(function() {
				var id = $j(this).attr('rel');

				/* Show actual content
				 */
				$j('#list_item_basic_content_' + id).show();

				/* Hide editor form
				 */
				$j('#modify_basic_form_' + id).hide();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}


    <div class="listing">
        <ul>
		<!-- BEGIN list_item -->
            <li class="clearfix {ON_OFF}" id='list_item_basic_content_{LIST_ITEM_ID}'>
                {LIST_ITEM_CONTENT}
                <!-- BEGIN has_modify_button -->
                <a class='btn modify no-text modify_basic' title="Edit item" rel='{LIST_ITEM_ID}'><span></span></a>
                <!-- END has_modify_button -->
                <!-- BEGIN has_delete_form -->
                <a title="Remove link" class="btn delete no-text" href="/eportfolio/component/basiclist/modifyForm.php?action=removeItem&userId={USER_ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}"><span></span></a>
                <!-- END has_delete_form -->
            </li>

			<!-- BEGIN has_modify_form -->
            <div class="editPanelImitation settings hide" id='modify_basic_form_{LIST_ITEM_ID}'>
                <form class='modifyForm' action='/eportfolio/component/basiclist/modifyForm.php' method='post'>
                    <input type='hidden' name='action' value='updateItem' />
                    <input type='hidden' name='userId' value='{USER_ID}' />
                    <input type='hidden' name='pageId' value='{PAGE_ID}' />
                    <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
                    <input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

                    <div class="content"><span>Content: </span>
                        <input type='text' class='firstFocus' name='content' value='{LIST_ITEM_CONTENT}' />
                    </div>

                    <input type='submit' value='Update' />
                </form>
            </div>
			<!-- END has_modify_form -->
		<!-- END list_item -->
		</ul>
    </div>
    <!-- BEGIN has_create_form -->
    <div class="editPanelImitation">
        <form action='/eportfolio/component/basiclist/modifyForm.php' method='post'>
            <input type='hidden' name='action' value='addItem' />
            <input type='hidden' name='userId' value='{USER_ID}' />
            <input type='hidden' name='pageId' value='{PAGE_ID}' />
            <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
            <div class="content"><span>Content: </span>
                <input type='text' name='content' value='' />
            </div>
            <input type='submit' value='Add item' />
        </form>
    </div>
    <!-- END has_create_form -->
</div>
