<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <link rel="stylesheet" href="/css/jquery.slimbox.css" type="text/css" media="screen"/>
    <script type="text/javascript" src="/javascript/jquery.slimbox.js"></script>
	<script type='text/javascript'>
		$j(function() {
			$j('a.modify_advanced').click(function() {
				var id = $j(this).attr('rel');

				/* Show editor form
				 */
				$j('#modify_advanced_form_' + id).show();
				$j('#modify_advanced_form_' + id).find('.firstFocus').focus();

				/* Hide actual content
				 */
				$j('#list_item_advanced_content_' + id).hide();
			});

            /* Create button, swap form in
             */
            $j('a.create_advanced').click(function(event) {
				event.preventDefault();

                $j(this).hide();
                $j(this).parent().next('.editPanelImitation').show();
            });

			/* Close button
			 */
			$j('a.modify_advanced_close').click(function() {
				var id = $j(this).attr('rel');

				/* Show actual content
				 */
				$j('#list_item_advanced_content_' + id).show();

				/* Hide editor form
				 */
				$j('#modify_advanced_form_' + id).hide();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<ul class="information-list">
		<!-- BEGIN list_item -->
		<li class="{ON_OFF}" id="list_item_advanced_content_{LIST_ITEM_ID}">
			<span class="actions">
				<!-- BEGIN has_delete_form -->
				<a class="btn no-text delete" title="Delete item" href="/eportfolio/component/advancedlist/modifyForm.php?action=removeItem&userId={USER_ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}"><span></span></a>
				<!-- END has_delete_form -->
				<!-- BEGIN has_modify_button -->
				<a class='btn modify no-text modify_advanced' title="Edit item" rel='{LIST_ITEM_ID}'><span></span></a>
				<!-- END has_modify_button -->
			</span>

			<!-- BEGIN has_image -->
			<a class="thumbnail" href="/storage/image.php?size=maxsize&hash={LIST_ITEM_IMAGEHASH}" rel="lightbox[portal]" alt="{LIST_ITEM_TITLE}" title="{LIST_ITEM_TITLE}">
				<img height="64" width="64" src="/storage/image.php?size=square64&hash={LIST_ITEM_IMAGEHASH}" alt="{LIST_ITEM_TITLE}" border="0" />
			</a>
			<!-- END has_image -->

			<h4>{LIST_ITEM_TITLE}</h4>
			<p>{LIST_ITEM_CONTENT}</p>

		</li>
		<!-- BEGIN has_modify_form -->
		<div class="editPanelImitation hide" id='modify_advanced_form_{LIST_ITEM_ID}'>
			<form class='modifyForm' action='/eportfolio/component/advancedlist/modifyForm.php' method='post' enctype='multipart/form-data'>
				<input type='hidden' name='action' value='updateItem' />
				<input type='hidden' name='userId' value='{USER_ID}' />
				<input type='hidden' name='pageId' value='{PAGE_ID}' />
				<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
				<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

				<div class="title"><span>Title: </span>
					<input type='text' class='firstFocus' name='title' value="{LIST_ITEM_TITLE}" />
				</div>
				<div class="content"><span>Content: </span>
					<textarea type='text' name='content' />{LIST_ITEM_CONTENT}</textarea>
				</div>
				<div class="image row"><span>Image: </span>
					<!-- BEGIN has_image_modify -->
					<img src='/storage/image.php?size=square64&hash={LIST_ITEM_IMAGEHASH}' class='floatLeft' /><br />
					<!-- END has_image_modify -->
					<input type='file' name='imagehash' value='' />
				</div>

				<input type='submit' value='Update' />
			</form>
		</div>
		<!-- END has_modify_form -->
		<!-- END list_item -->
	</ul>

    <!-- BEGIN has_create_form -->
	<p class="interact"><a href="#" class="btn add create_advanced"><span></span>Add to List</a></p>

    <div class="editPanelImitation hide">
        <form action='/eportfolio/component/advancedlist/modifyForm.php' method='post' enctype='multipart/form-data'>
            <input type='hidden' name='action' value='addItem' />
            <input type='hidden' name='userId' value='{USER_ID}' />
            <input type='hidden' name='pageId' value='{PAGE_ID}' />
            <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />

            <div class="title"><span>Title: </span>
                <input type='text' name='title' value='' />
            </div>
            <div class="content"><span>Content: </span>
                <textarea type='text' name='content' value='' /></textarea>
            </div>
            <div class="image"><span>Image: </span>
                <input type='file' name='imagehash' value='' />
            </div>
            <input type='submit' value='Add item' />
        </form>
    </div>
    <!-- END has_create_form -->
</div>
