<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
    <script type="text/javascript">
        $(function() {
            $('#component{COMPONENT_INSTANCE_ID}').find('[data-delete]').click(function(event) {
                event.preventDefault();
                var element = $(this);
                $(this).confirmDialog({
                    text: 'Do you want to delete this item?',
                    confirmEvent: function() {
                        window.location.href = element.attr('href');
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="dz-wrap">
                    <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post"></form>

                    <ul class="action-list dz-container">
                        <!-- BEGIN list_item -->
                        <li class="actions-small-1">
                            <div class="list-item">
                                <div class="avatar card small-12">
                                    <a class='{HIDDEN}' href='/cms/sendMyFile.php?id={FILE_ITEM_ID}' rel="external" title="{FILE_ITEM_TITLE}">
                                        <img src="/images/mime/60x60/{FILE_ITEM_MIMETYPE}" alt="View Profile" class="content" />
                                        <p>{FILE_ITEM_TITLE}</p>
                                    </a>
                                    <p class="meta">Published on {FILE_ITEM_CREATED_AT}</p>
                                </div>
                            </div>
                            <nav>
                                <!-- BEGIN has_unpublish_form -->
                                <a class="icon-delete" href="/eportfolio/component/filelist/modifyForm.php?action=removeItem&userId={ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}" title="Unpublish file" data-delete></a>
                                <!-- END has_unpublish_form -->
                            </nav>
                        </li>
                        <!-- END list_item -->
                    </ul>
                </div>

                <div class="content">
                    <a href='/cms/portfolio/' class='button icon-view'>Browse My Files</a>

                    <!-- BEGIN submit_file -->
                    <!-- BEGIN modify_button -->
                    <a href='/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}' class='button icon-upload'>Post Files</a>
                    <!-- END modify_button -->

                    <script type="text/javascript">
                        $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                            wrapClass: 'dragging',
                            previewsContainer: '#component{COMPONENT_INSTANCE_ID} .information-list',
                            tplWrap: '<li class="dz-preview" />',
                            dictDefaultMessage: 'You can drag files into this space',
                            refreshUrl: '/eportfolio/configForm.php',
                            refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                            refreshData: {
                                page_id: '{PAGE_ID}',
                                reload: '{COMPONENT_INSTANCE_ID}'
                            },
                            sending: function (file, xhr, formData) {
                                formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                formData.append('parent', 0);
                                formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                            },
                            complete: function (file) {
                                $(file.previewElement).find('img').remove();
                            }
                        });
                    </script>
                    <!-- END submit_file -->
                </div>
            </section>
        </div>
    </div>
</div>
