<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}" data-dz-wrap>
        <div class="small-12 island">
            <section>
                <div class="dz-wrap">
                    <!-- BEGIN dropzone -->
                    <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post">
                        <input type="hidden" name="user" value="{EPORTFOLIO_PAGE_USER_ID}" />
                    </form>
                    <ul class="hide" data-dz-template>
                        <li>
                            <div class="card small-12">
                                <img data-dz-thumbnail src="{CDN_PREFIX}/images/foundation/preloader.gif" />
                                <p data-dz-name></p>
                                <p class="meta" data-dz-status>Uploading...</p>
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </div>
                        </li>
                    </ul>
                    <!-- END dropzone -->
                    <ul class="action-list" data-dz-container>
                        <!-- BEGIN list_item -->
                        <li class="actions-small-1">
                            <div class="list-item">
                                <div class="card small-12">
                                    <a class='{HIDDEN}' href='/cms/sendMyFile.php?id={FILE_ITEM_ID}' rel="external" title="{FILE_ITEM_TITLE}">
                                        <img src="{CDN_PREFIX}/images/mime/{FILE_ITEM_MIMETYPE}" alt="{FILE_ITEM_MIMETYPE}" class="mime" height="60" width="60" />
                                        <p>{FILE_ITEM_TITLE}</p>
                                    </a>
                                    <p class="meta">Published on {FILE_ITEM_CREATED_AT}</p>
                                </div>
                            </div>
                            <nav>
                                <!-- BEGIN has_unpublish_form -->
                                <a class="icon-delete" href="/eportfolio/component/filelist/modifyForm.php?action=removeItem&userId={ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}" title="Unpublish file" data-delete></a>
                                <!-- END has_unpublish_form -->
                            </nav>
                        </li>
                        <!-- END list_item -->
                    </ul>
                </div>
                <!-- BEGIN modify_button -->
                <div class="component-action">
                    <section>
                        <a href='/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}' class='button'>Post Files</a>
                            <script type="text/javascript">
                                $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                                    wrapClass: 'dragging',
                                    previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                                    previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                                    tplWrap: '<li class="dz-preview" />',
                                    dictDefaultMessage: 'You can drag files into this space',
                                    refreshUrl: '/eportfolio/configForm.php',
                                    refreshSelector: '#component{COMPONENT_INSTANCE_ID} [data-dz-wrap]',
                                    refreshData: {
                                        page_id: '{PAGE_ID}',
                                        reload: '{COMPONENT_INSTANCE_ID}'
                                    },
                                    sending: function (file, xhr, formData) {
                                        formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                        formData.append('parent', 0);
                                        formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                                    },
                                    complete: function (file) {
                                        $(file.previewElement).find('img').remove();
                                    }
                                });
                            </script>
                    </section>
                </div>
                <!-- END modify_button -->
                <script type="text/javascript">
                    $(function() {
                        $('#component{COMPONENT_INSTANCE_ID}').find('[data-delete]').click(function(event) {
                            event.preventDefault();
                            var element = $(this);
                            $(this).confirmDialog({
                                text: 'Do you want to delete this item?',
                                confirmEvent: function() {
                                    window.location.href = element.attr('href');
                                }
                            });
                        });
                    });
                </script>
            </section>
        </div>
    </div>
</div>
