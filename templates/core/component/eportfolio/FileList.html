<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

    <div class="dz-wrap">
        <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post"></form>
        <ul class="information-list dz-container">
            <!-- BEGIN list_item -->
            <li class="{ON_OFF} clearfix">
                <!-- BEGIN has_unpublish_form -->
                <span class="actions oneline">
                    <a class="btn no-text delete" title="Unpublish file" href='/eportfolio/component/filelist/modifyForm.php?action=removeItem&userId={ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}' onclick="return confirm('Do you want to delete this file?');"><span></span></a>
                </span>
                <!-- END has_unpublish_form -->

                <h4><a class="icons {HIDDEN} {FILE_ITEM_MIMETYPE}" href="/cms/sendMyFile.php?id={FILE_ITEM_ID}" rel="external">{FILE_ITEM_TITLE}</a></h4>
                <p></p>
                <p class="footnote">
                    Published on {FILE_ITEM_CREATED_AT}
                </p>
            </li>
            <!-- END list_item -->
        </ul>
    </div>

    <p class="interact">
        <a href='/cms/portfolio/' class='btn'><span></span>Browse My Files</a>
        <!-- BEGIN submit_file -->

        <!-- BEGIN modify_button -->
        <a href='/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}' class='btn up-arrow'><span></span>Post Files</a>
        <!-- END modify_button -->

        <script type="text/javascript">
            $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                wrapClass: 'dragging',
                previewsContainer: '#component{COMPONENT_INSTANCE_ID} .information-list',
                tplWrap: '<li class="dz-preview" />',
                dictDefaultMessage: 'You can drag files into this space',
                refreshUrl: '/eportfolio/configForm.php',
                refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                refreshData: {
                    page_id: '{PAGE_ID}',
                    reload: '{COMPONENT_INSTANCE_ID}'
                },
                sending: function (file, xhr, formData) {
                    formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                    formData.append('parent', 0);
                    formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                },
                complete: function (file) {
                    $(file.previewElement).find('img').remove();
                }
            });
        </script>
        <!-- END submit_file -->
    </p>

</div>
