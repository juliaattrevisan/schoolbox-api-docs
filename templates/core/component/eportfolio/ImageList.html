<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <div class="dz-wrap clearfix">
                        <!-- BEGIN dropzone -->
                        <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post" data-accepts="image">
                            <input type="hidden" name="user" value="{EPORTFOLIO_PAGE_USER_ID}" />
                        </form>
                        <ul class="hide" data-dz-template>
                            <li>
                                <img data-dz-thumbnail src="{CDN_PREFIX}/images/foundation/preloader.gif"/>
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </li>
                        </ul>
                        <!-- END dropzone -->
                        <ul class="img-gallery" data-dz-container data-image-lightbox="lightbox[eportfolio-{COMPONENT_INSTANCE_ID}]">
                            <!-- BEGIN list_item -->
                            <li style="height:{IMAGE_HEIGHT}px; width:{IMAGE_WIDTH}px;">
                                <a href="/cms/myImage.php?id={IMAGE_ID}&key=eportfolioImageGalleryLarge" rel="lightbox[eportfolio-{COMPONENT_INSTANCE_ID}]" title='{IMAGE_DESCRIPTION}'>
                                    <img src="/cms/myImage.php?id={IMAGE_ID}&key=eportfolioImageGalleryThumbnail"alt="{IMAGE_DESCRIPTION}"/>
                                </a>
                            </li>
                            <!-- END list_item -->
                        </ul>
                        <script>
                            if (window.sbProps.lightGalleryInit) { window.sbProps.lightGalleryInit(); }
                        </script>
                    </div>
                </div>


                <!-- BEGIN modify_button -->

                <div class="component-action">
                    <section>
                        <a href='/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}' class='button'>Post Images</a>
                        <a href='/my-files/' class='button'>Browse My Files</a>
                    </section>
                </div>

                <script type="text/javascript">
                    $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                        wrapClass: 'dragging',
                        previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                        previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                        createImageThumbnails: true,
                        dictDefaultMessage: 'You can drag images into this space',
                        refreshUrl: '/eportfolio/configForm.php',
                        refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                        refreshData: {
                            page_id: '{PAGE_ID}',
                            reload: '{COMPONENT_INSTANCE_ID}'
                        },
                        sending: function (file, xhr, formData) {
                            formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                            formData.append('parent', 0);
                            formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                        },
                        complete: function (file) {
                            $(file.previewElement).find('img.dz-pending').remove();
                        },
                        contentReloaded: () => {
                            // Let masonry know we overrode the component, so it can fix the event listeners (e.g. drag or settings)
                            document.dispatchEvent(
                                new CustomEvent(
                                    "UPDATE_MASONRY__COMPONENT_UPDATED",
                                    { detail: { component: document.getElementById("component{COMPONENT_INSTANCE_ID}") } }
                                )
                            );
                        }
                    });
                </script>
                <!-- END modify_button -->
            </section>
        </div>
    </div>
</div>
