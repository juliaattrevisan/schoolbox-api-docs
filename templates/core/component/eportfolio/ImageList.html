<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <div class="dz-wrap clearfix">
                        <!-- BEGIN dropzone -->
                        <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post" data-accepts="image"></form>
                        <ul data-dz-template class="hide">
                           <li>
                               <img data-dz-thumbnail src="/images/resources/ajax.gif" />
                               <div class="progress dz-progress">
                                   <span class="meter dz-upload" style="width:0;"></span>
                               </div>
                           </li>
                        </ul>
                        <!-- END dropzone -->
                        <div data-dz-container>
                            <ul class="inline-list">
                                <!-- BEGIN list_item -->
                                <li>
                                    <a href="/cms/myImage.php?id={IMAGE_ID}&key=eportfolioImageGalleryLarge" rel="lightbox[eportfolio-{COMPONENT_INSTANCE_ID}]" title='{IMAGE_DESCRIPTION}'>
                                        <img src="/cms/myImage.php?id={IMAGE_ID}&key=eportfolioImageGalleryThumbnail" alt="{IMAGE_DESCRIPTION}" border="0" />
                                    </a>
                                </li>
                                <!-- END list_item -->
                            </ul>
                        </div>
                    </div>

                    <!-- BEGIN modify_button -->
                    <a href='/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}' class='button icon-upload'>Post Images</a>
                    <a href='/my-files/' class='button icon-view'>Browse My Files</a>
                    <script type="text/javascript">
                        $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                            wrapClass: 'dragging',
                            previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                            previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                            createImageThumbnails: true,
                            dictDefaultMessage: 'You can drag images into this space',
                            refreshUrl: '/eportfolio/configForm.php',
                            refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                            refreshData: {
                                page_id: '{PAGE_ID}',
                                reload: '{COMPONENT_INSTANCE_ID}'
                            },
                            sending: function (file, xhr, formData) {
                                formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                formData.append('parent', 0);
                                formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                            },
                            complete: function (file) {
                                $(file.previewElement).find('img.dz-pending').remove();
                            }
                        });
                    </script>
                    <!-- END modify_button -->
                </div>
            </section>
        </div>
    </div>
</div>
