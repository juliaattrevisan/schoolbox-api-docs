<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}
    <!-- BEGIN output_text -->
	<div id='textbox_content_{COMPONENT_INSTANCE_ID}' class="wysiwyg clearfix">
            {TEXTBOX_CONTENT}
	</div>
    <!-- END output_text -->

	<!-- BEGIN has_modify_form -->
    <form id='modify_textbox_form_{COMPONENT_INSTANCE_ID}' class='modifyForm' action='/eportfolio/component/textbox/modifyForm.php' method='post'>
        <input type='hidden' name='action' value='updateItem' />
        <input type='hidden' name='userId' value='{ID}' />
        <input type='hidden' name='pageId' value='{PAGE_ID}' />
        <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
        <input type='hidden' name='textboxId' value='{COMPONENT_INSTANCE_ID}' />

        <textarea name='content' class='mceEditor' rows="20" style="width: 100%;">{TEXTBOX_CONTENT}</textarea>


        <p class="interact"><a href="#" class="btn modify" onclick="$('#modify_textbox_form_{COMPONENT_INSTANCE_ID}').submit(); return false;"><span></span>Save Document</a></p>
    </form>
	<!-- END has_modify_form -->

    <p class="interact clearfix">
        <!-- BEGIN modify_text -->
        <a href="/eportfolio/{ID}/{PAGE_ID}/textbox/modify/{COMPONENT_INSTANCE_ID}#modify_textbox_form_{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Modify</a>
        <!-- END modify_text -->
    </p>

</div>
