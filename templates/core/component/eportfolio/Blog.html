<div class="box" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$j(function() {

			/* For viewing comment form
			 *
			 * When you have $j(function() inside the <body> tags the onclick
			 * event runs twice. Unbind it and rebind it is a convenient solution.
			 *
			 * By Shahbaz Saleem
			 * http://yuji.wordpress.com/2010/02/22/jquery-click-event-fires-twice/
			 */
			$j('.closeComment').unbind('click').click(function() {
				var id = $j(this).attr('rel');

				$j('#' + id).toggle();
			});

			/* For viewing comment thread
			 */
			$j('.viewCommentThread').hide();
			
			$j('.viewComments').unbind('click').click(function() {
				var id = $j(this).attr('rel');

				$j('#' + id).toggle();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<!-- BEGIN has_create_form -->
	<form id='modify_blog_form_{COMPONENT_INSTANCE_ID}' action='/eportfolio/component/blog/modifyForm.php' method='post' enctype='multipart/form-data'>
		<input type='hidden' name='action' value='addItem' />
		<input type='hidden' name='userId' value='{USER_ID}' />
		<input type='hidden' name='pageId' value='{PAGE_ID}' />

		<input type='text' name='title' value='' />
		<textarea type='text' name='content' class='mceEditor' /></textarea>
		<input type='submit' value='Add item' />
	</form>
	<!-- END has_create_form -->


		<ul class="information-list">
			<!-- BEGIN list_item -->
			<li class="{ON_OFF}" id="blog_{LIST_ITEM_ID}">
				<!-- BEGIN modify_text -->
				<span class="actions">
					<a href="/eportfolio/component/blog/modifyForm.php?action=removeItem&userId={USER_ID}&pageId={PAGE_ID}&listItemId={LIST_ITEM_ID}" class="btn no-text delete" title="Delete Blog post"><span></span></a>
					<a href="/eportfolio/{USER_ID}/{PAGE_ID}/blog/modify/{LIST_ITEM_ID}#modify_blog_form_{LIST_ITEM_ID}" class="btn no-text modify" title="Modify Blog post"><span></span></a>
				</span>
				<!-- END modify_text -->

				<h3>{LIST_ITEM_TITLE}</h3>

				<!-- BEGIN has_delete_form -->
				<!-- END has_delete_form -->

				<p class="meta">
					<a href="/search/user/{LIST_ITEM_AUTHOR_ID}" class="author">
						<img src="/portrait.php?userId={LIST_ITEM_AUTHOR_EXTERNAL_USER_ID}&size=square32">
						{LIST_ITEM_AUTHOR_FULLNAME}
					</a>
					Updated on {LIST_ITEM_UPDATED_AT}
				</p>

				<div class="wysiwyg">
					{LIST_ITEM_CONTENT}
				</div>

				<!-- BEGIN has_comments -->
				<ul class="comments" id="blogComment_{LIST_ITEM_ID}">
					<!-- BEGIN comment -->
					<li class='viewCommentThread' id='viewComments_{LIST_ITEM_ID}'>
						<!-- BEGIN has_delete_comment_form -->
						<span class="actions">
							<a class="delete-comment btn delete no-text" href="/eportfolio/component/blogcomment/modifyForm.php?action=removeComment&userId={USER_ID}&pageId={PAGE_ID}&commentId={COMMENT_ID}" title="Delete Comment"><span></span></a>
						</span>
						<!-- END has_delete_comment_form -->

						<p class="meta">
							<a href="/search/user/{COMMENT_AUTHOR_ID}" class="author">
								<img height="32" width="32" src="/portrait.php?userId={COMMENT_EXTERNAL_USER_ID}&size=square32" />
								{COMMENT_AUTHOR_FULLNAME}
							</a>
							Commented {COMMENT_CREATED_AT}
						</p>
						<p>{COMMENT_CONTENT}</p>
					</li>
					<!-- END comment -->
				</ul>

				<a href="#" class="viewComments btn chat show-comments" rel='viewComments_{LIST_ITEM_ID}'><span></span>Show comments</a>
				<!-- END has_comments -->

				<p class='interact'>
					<a rel='modify_blogcomment_form_{LIST_ITEM_ID}' class='closeComment btn add'><span></span>Add Comment</a>
				</p>

				<form id='modify_blogcomment_form_{LIST_ITEM_ID}' class='modifyForm hide' action='/eportfolio/component/blogcomment/modifyForm.php' method='post'>
					<input type='hidden' name='action' value='addComment' />
					<input type='hidden' name='userId' value='{ID}' />
					<input type='hidden' name='pageId' value='{PAGE_ID}' />
					<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

					<label>
						<input name='content' type='text' value='' />
					</label>

					<input type='submit' class='submit-btn-plain' value='Add Comment' />
				</form>

				<!-- BEGIN has_modify_form -->
				<form id='modify_blog_form_{LIST_ITEM_ID}' class='modifyForm' action='/eportfolio/component/blog/modifyForm.php' method='post'>
					<input type='hidden' name='action' value='updateItem' />
					<input type='hidden' name='userId' value='{USER_ID}' />
					<input type='hidden' name='pageId' value='{PAGE_ID}' />
					<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

					<label>
						<input type='text' class='firstFocus' name='title' value='{LIST_ITEM_TITLE}' />
					</label>
					<label>
						<textarea name='content' class='mceEditor'>{LIST_ITEM_CONTENT}</textarea>
					</label>

					<input type='submit' class='submit-btn-plain' value='Update' />
				</form>
				<!-- END has_modify_form -->
			</li>
			<!-- END list_item -->
		</ul>


	<!-- BEGIN create_text -->
	<p class="interact"><a href="/eportfolio/{USER_ID}/{PAGE_ID}/blog/create/{COMPONENT_INSTANCE_ID}#modify_blog_form_{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Post Entry</a></p>
	<!-- END create_text -->
</div>
