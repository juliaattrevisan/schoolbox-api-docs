<div class="box blog clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$j(function() {

			/* For viewing comment form
			 *
			 * When you have $j(function() inside the <body> tags the onclick
			 * event runs twice. Unbind it and rebind it is a convenient solution.
			 *
			 * By Shahbaz Saleem
			 * http://yuji.wordpress.com/2010/02/22/jquery-click-event-fires-twice/
			 */
			$j('.closeComment').unbind('click').click(function() {
				var id = $j(this).attr('rel');

				$j('#' + id).toggle();
			});

			/* For viewing comment thread
			 */
			$j('.viewCommentThread').hide();
			
			$j('.viewComments').unbind('click').click(function() {
				var id = $j(this).attr('rel');

				$j('#' + id).toggle();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<!-- BEGIN has_create_form -->
	<form id='modify_blog_form_{COMPONENT_INSTANCE_ID}' action='/eportfolio/component/blog/modifyForm.php' method='post' enctype='multipart/form-data'>
		<input type='hidden' name='action' value='addItem' />
		<input type='hidden' name='userId' value='{USER_ID}' />
		<input type='hidden' name='pageId' value='{PAGE_ID}' />

		<input type='text' name='title' value='' />
		<textarea type='text' name='content' class='mceEditor' /></textarea>
		<input type='submit' value='Add item' />
	</form>
	<!-- END has_create_form -->

	<div class='listing'>
		<ul>
			<!-- BEGIN list_item -->
			<li>
				<div id='blog_{LIST_ITEM_ID}' class='listing'>
					<h3 class="clearfix">
						{LIST_ITEM_TITLE}
					</h3>
					<!-- BEGIN modify_text -->
					<div class='small-right'>
						<p class='interact'>
							<a href="/eportfolio/{USER_ID}/{PAGE_ID}/blog/modify/{LIST_ITEM_ID}#modify_blog_form_{LIST_ITEM_ID}" class="btn no-text modify"><span></span></a>
							<a href="/eportfolio/component/blog/modifyForm.php?action=removeItem&userId={USER_ID}&pageId={PAGE_ID}&listItemId={LIST_ITEM_ID}" class="btn no-text delete"><span></span></a>
						</p>
					</div>
					<!-- END modify_text -->

					<!-- BEGIN has_delete_form -->
					<!-- END has_delete_form -->

					<div class='blog-body'>
						{LIST_ITEM_CONTENT}
					</div>
					<p class="author">
						<span class="subtitle">Last updated on {LIST_ITEM_UPDATED_AT}</span>
					</p>
					<div id='blogComment_{LIST_ITEM_ID}'>
						<!-- BEGIN has_comments -->
						<a href="#" class="viewComments btn show-comments" rel='viewComments_{LIST_ITEM_ID}'><span></span>Show comments</a>

						<ul id='viewComments_{LIST_ITEM_ID}' class='comments viewCommentThread'>
							<!-- BEGIN comment -->
							<li class='{ON_OFF}'>
								<p>
									<img src='/portrait.php?userId={COMMENT_EXTERNAL_USER_ID}&size=square32' /><br />
									{COMMENT_AUTHOR_FULLNAME}
								</p>
								<p class='comment-body'>
									{COMMENT_CONTENT}
								</p>
								<p>
									<span class="subtitle">Posted {COMMENT_CREATED_AT}</span>
								</p>
								<!-- BEGIN has_delete_comment_form -->
								<a class="delete-comment btn delete no-text" href="/eportfolio/component/blogcomment/modifyForm.php?action=removeComment&userId={USER_ID}&pageId={PAGE_ID}&commentId={COMMENT_ID}"><span></span></a>
								<!-- END has_delete_comment_form -->
							</li>
							<!-- END comment -->
						</ul>
						<!-- END has_comments -->

						<a rel='modify_blogcomment_form_{LIST_ITEM_ID}' class='closeComment btn add'><span></span>Add Comment</a>
						<form id='modify_blogcomment_form_{LIST_ITEM_ID}' class='modifyForm hide' action='/eportfolio/component/blogcomment/modifyForm.php' method='post'>
							<input type='hidden' name='action' value='addComment' />
							<input type='hidden' name='userId' value='{ID}' />
							<input type='hidden' name='pageId' value='{PAGE_ID}' />
							<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

							<label>
								<input name='content' type='text' value='' />
							</label>

							<input type='submit' value='Add Comment' />
						</form>
					</div>
				</div>

				<!-- BEGIN has_modify_form -->
				<form id='modify_blog_form_{LIST_ITEM_ID}' class='modifyForm' action='/eportfolio/component/blog/modifyForm.php' method='post'>
					<input type='hidden' name='action' value='updateItem' />
					<input type='hidden' name='userId' value='{USER_ID}' />
					<input type='hidden' name='pageId' value='{PAGE_ID}' />
					<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

					<label>
						<input type='text' class='firstFocus' name='title' value='{LIST_ITEM_TITLE}' />
					</label>
					<label>
						<textarea name='content' class='mceEditor'>{LIST_ITEM_CONTENT}</textarea>
					</label>

					<input type='submit' value='Update' />
				</form>
				<!-- END has_modify_form -->
			</li>
			<!-- END list_item -->
		</ul>
	</div>

	<!-- BEGIN create_text -->
	<a href="/eportfolio/{USER_ID}/{PAGE_ID}/blog/create/{COMPONENT_INSTANCE_ID}#modify_blog_form_{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Post Entry</a>
	<!-- END create_text -->
</div>
