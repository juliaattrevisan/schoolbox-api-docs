<div class="box" id="component{COMPONENT_INSTANCE_ID}">
	<script type="text/javascript" src="/javascript/jquery.blogCommentary.js"></script>
	<script type='text/javascript'>
		$j(function() {
			$j('#component{COMPONENT_INSTANCE_ID}').blogCommentary();
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<!-- BEGIN has_create_form -->
	<form id='modify_blog_form_{COMPONENT_INSTANCE_ID}' action='/eportfolio/component/blog/modifyForm.php' method='post' enctype='multipart/form-data'>
		<input type='hidden' name='action' value='addItem' />
		<input type='hidden' name='userId' value='{ID}' />
		<input type='hidden' name='pageId' value='{PAGE_ID}' />

        <label style="font-weight:bold;margin:4px 0 0 0;" for="blogHeading">Blog Heading</label>
        <input type="text" style="width:98%" maxlength="100" name="title" id="blogHeading" value="" />
        <label style="font-weight:bold;float:left;margin:4px 0 0 0;" for="blogBody">Blog Content</label>
		<textarea type='text' id="blogBody" name='content' class='mceEditor' style="width:100%" rows="20" /></textarea>
		<input type='submit' value='Add item' />
	</form>
	<!-- END has_create_form -->


		<ul class="information-list">
			<!-- BEGIN list_item -->
			<li class="{ON_OFF}" id="blog_{LIST_ITEM_ID}">
				<!-- BEGIN modify_text -->
				<span class="actions">
					<a href="/eportfolio/component/blog/modifyForm.php?action=removeItem&userId={ID}&pageId={PAGE_ID}&listItemId={LIST_ITEM_ID}" class="btn no-text delete" title="Delete Blog post" onclick="return confirm('Do you want to delete this comment?');"><span></span></a>
					<a href="/eportfolio/{ID}/{PAGE_ID}/blog/modify/{LIST_ITEM_ID}#modify_blog_form_{LIST_ITEM_ID}" class="btn no-text modify" title="Modify Blog post"><span></span></a>
				</span>
				<!-- END modify_text -->

				<h3>{LIST_ITEM_TITLE}</h3>

				<!-- BEGIN has_delete_form -->
				<!-- END has_delete_form -->

				<p class="meta">
					<a href="/search/user/{LIST_ITEM_AUTHOR_ID}" class="author">
						<img src="/portrait.php?userId={LIST_ITEM_AUTHOR_EXTERNAL_USER_ID}&size=square32">
						{LIST_ITEM_AUTHOR_FULLNAME}
					</a><br />
					Updated on {LIST_ITEM_UPDATED_AT}
				</p>

				<div class="wysiwyg">
					{LIST_ITEM_CONTENT}
				</div>

				<!-- BEGIN has_comments -->
				<ul class="comments" id="blogComment_{LIST_ITEM_ID}">
					<!-- BEGIN comment -->
					<li class='viewCommentThread' id='comment_{COMMENT_ID}'>
						<!-- BEGIN has_delete_comment_form -->
						<span class="actions">
							<a class="delete-comment btn delete no-text" href="/eportfolio/component/blogcomment/modifyForm.php?action=removeComment&userId={COMMENT_AUTHOR_ID}&pageId={PAGE_ID}&commentId={COMMENT_ID}" title="Delete Comment"><span></span></a>
						</span>
						<!-- END has_delete_comment_form -->

						<p class="meta">
							<a href="/search/user/{COMMENT_AUTHOR_ID}" class="author">
								<img height="32" width="32" src="/portrait.php?userId={COMMENT_EXTERNAL_USER_ID}&size=square32" />
								{COMMENT_AUTHOR_FULLNAME}
							</a>
							Commented {COMMENT_CREATED_AT}
						</p>
						<p>{COMMENT_CONTENT}</p>
					</li>
					<!-- END comment -->
				</ul>
				<!-- END has_comments -->

				<form id='modify_blogcomment_form_{LIST_ITEM_ID}' class='modifyForm hide' action='/eportfolio/component/blogcomment/modifyForm.php' method='post'>
					<input type='hidden' name='action' value='addComment' />
					<input type='hidden' name='userId' value='{ID}' />
					<input type='hidden' name='pageId' value='{PAGE_ID}' />
					<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

					<p><textarea name="content" rows="2" cols="100" placeholder="Add your comment"></textarea>
						<input type="submit" class="submit-btn-plain" name="comment" value="Add comment"/></p>
				</form>

				<p class='interact'>
					<a href="#" class="viewComments btn show-comments" rel='viewComments_{LIST_ITEM_ID}'><span></span>Show Comments</a>
					<a rel='modify_blogcomment_form_{LIST_ITEM_ID}' class='closeComment btn chat'><span></span>Add Comment</a>
				</p>

				<!-- BEGIN has_modify_form -->
				<form id='modify_blog_form_{LIST_ITEM_ID}' class='modifyForm' action='/eportfolio/component/blog/modifyForm.php' method='post'>
					<input type='hidden' name='action' value='updateItem' />
					<input type='hidden' name='userId' value='{ID}' />
					<input type='hidden' name='pageId' value='{PAGE_ID}' />
					<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />


                    <label style="font-weight:bold;margin:4px 0 0 0;" for="blogHeading">Blog Heading</label>
                    <input type="text" style="width:98%" maxlength="100" name="title" id="blogHeading" value="{LIST_ITEM_TITLE}" />
                    <label style="font-weight:bold;float:left;margin:4px 0 0 0;" for="blogBody">Blog Content</label>
                    <textarea type='text' id="blogBody" name='content' class='mceEditor' style="width:100%" rows="20" />{LIST_ITEM_CONTENT}</textarea>

					<input type='submit' class='submit-btn-plain' value='Update' />
				</form>
				<!-- END has_modify_form -->
			</li>
			<!-- END list_item -->
		</ul>

	<!-- BEGIN create_text -->
	<p class="interact"><a href="/eportfolio/{ID}/{PAGE_ID}/blog/create/{COMPONENT_INSTANCE_ID}#modify_blog_form_{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Post Entry</a></p>
	<!-- END create_text -->
</div>
