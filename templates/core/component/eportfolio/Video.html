<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <script type="text/javascript">
        $(function() {
            var component    = $('#component{COMPONENT_INSTANCE_ID}');
            var videoElement = component.find('[data-videocomponent]').mediaelementplayer();
            var video        = videoElement.data('mediaelementplayer');
            component.find('[data-media-id]').click(function(event) {
                event.preventDefault();
                var videoId = $(this).data('media-id');
                var $target = "/cms/sendVideo.php?type=myfile&id="+videoId;
                var $poster = "/cms/videoThumb.php?type=myfile&id="+videoId+"&size=poster";
                // setting video plugin's poster doesn't work as expected,
                // so set the video's poster directly
                videoElement.attr('poster', $poster);
                video.setSrc($target);
                video.setPoster($poster);
                video.load();
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}" data-dz-wrap>
        <div class="small-12 island">
            <section>
                <!-- BEGIN default_video -->
                <video data-videocomponent
                       preload="none"
                       poster="/cms/videoThumb.php?type=myfile&id={DEFAULT_VIDEO_ID}&size=poster"
                       width="100%"
                       height="400"
                       style="max-width: 100%; height: 400px;"
                       >
                    <source src="/cms/sendVideo.php?type=myfile&id={DEFAULT_VIDEO_ID}" type='video/mp4'>
                </video>
                <!-- END default_video -->

                <div class="dropzone-wrap">
                    <!-- BEGIN dropzone -->
                    <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/myFileForm.php?ajax=1" method="post" data-accepts="video">
                        <input type="hidden" name="user" value="{EPORTFOLIO_PAGE_USER_ID}" />
                    </form>
                    <ul class="hide" data-dz-template>
                        <li>
                            <div class="card small-12">
                                <img data-dz-thumbnail width="16" height="16" src="{CDN_PREFIX}/images/foundation/preloader.gif" />
                                <h3 data-dz-name></h3>
                                <p class="meta" data-dz-status>Uploading...</p>
                            </div>
                        </li>
                    </ul>
                    <!-- END dropzone -->
                    <ul class="information-list" data-dz-container>
                        <!-- BEGIN video_list -->
                        <li>
                            <div class="list-item">
                                <div class="card small-12">
                                    <a data-videolink href="#" data-media-id="{VIDEO_LIST_ID}">
                                        <img src="/cms/videoThumb.php?type=myfile&id={VIDEO_LIST_ID}" />
                                        <h3>{VIDEO_LIST_TITLE}</h3>
                                    </a>
                                    <p class="meta">{VIDEO_LIST_DURATION}</p>
                                    <p class="meta">
                                        Posted by
                                        <a href="/search/user/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a>
                                    </p>
                                </div>
                            </div>
                            <article>{VIDEO_LIST_COMMENT}</article>
                        </li>
                        <!-- END video_list -->
                        <!-- BEGIN video_pending_list -->
                        <li class="row">
                            <div class="card small-12">
                                <img src="{CDN_PREFIX}/images/core/component/video-thumbnail-{VIDEO_LIST_STATUS}.gif" title="Currently transcoding {VIDEO_LIST_TITLE}" />
                                <h3>{VIDEO_LIST_TITLE}</h3>
                                <p class="meta">
                                    Posted by
                                    <a href="/search/user/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a>
                                </p>
                            </div>
                            <article>{VIDEO_LIST_COMMENT}</article>
                        </li>
                        <!-- END video_pending_list -->
                    </ul>
                </div>

                <!-- BEGIN submit_video -->
                <div class="component-action">
                    <section>
                        <a href="/cms/myFile/new/{ID}/0/{COMPONENT_INSTANCE_ID}" class="button">Post Video</a>
                    </section>
                </div>

                <script type="text/javascript">
                    $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                        wrapClass: 'dragging',
                        previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                        previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                        tplWrap: '<li class="dz-preview" />',
                        dictDefaultMessage: 'You can drag videos into this space',
                        refreshUrl: '/eportfolio/configForm.php',
                        refreshSelector: '#component{COMPONENT_INSTANCE_ID} [data-dz-wrap]',
                        refreshData: {
                            page_id: '{PAGE_ID}',
                            reload: '{COMPONENT_INSTANCE_ID}'
                        },
                        sending: function (file, xhr, formData) {
                            formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                            formData.append('parent', 0);
                            formData.append('published[{ID}][{PAGE_ID}]', 'value_ignored');
                        },
                        complete: function (file) {
                            $(file.previewElement).find('img').remove();
                        }
                    });
                </script>
                <!-- END submit_video -->
            </section>
        </div>
    </div>
</div>
