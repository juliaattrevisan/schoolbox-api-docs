<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$j(function() {
			$j('a.modify_link').click(function() {
				var id = $j(this).attr('rel');

				/* Show editor form
				 */
				$j('#modify_link_form_' + id).show();
				$j('#modify_link_form_' + id).find('.firstFocus').focus();

				/* Hide actual content
				 */
				$j('#list_item_link_content_' + id).hide();
			});

			/* Close button
			 */
			$j('a.modify_link_close').click(function() {
				var id = $j(this).attr('rel');

				/* Show actual content
				 */
				$j('#list_item_link_content_' + id).show();

				/* Hide editor form
				 */
				$j('#modify_link_form_' + id).hide();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<!-- BEGIN has_create_form -->
	<form action='/eportfolio/component/linklist/modifyForm.php' method='post'>
		<input type='hidden' name='action' value='addItem' />
		<input type='hidden' name='userId' value='{USER_ID}' />
		<input type='hidden' name='pageId' value='{PAGE_ID}' />
		<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />

		<input type='text' name='title' value='' />
		<input type='text' name='content' value='' />

		<input type='submit' value='Add item' />
	</form>
	<!-- END has_create_form -->

	<ol>
		<!-- BEGIN list_item -->
		<li>
			<div id='list_item_link_content_{LIST_ITEM_ID}'>
				<a href='{LIST_ITEM_CONTENT}'>{LIST_ITEM_TITLE}</a>
			</div>

			<!-- BEGIN has_modify_form -->
			<p>
				<a class='modify_link' rel='{LIST_ITEM_ID}'>Edit</a>
			</p>

			<form id='modify_link_form_{LIST_ITEM_ID}' class='hide modifyForm' action='/eportfolio/component/linklist/modifyForm.php' method='post' style='padding:10px;background-color:#fdd'>
				<input type='hidden' name='action' value='updateItem' />
				<input type='hidden' name='userId' value='{USER_ID}' />
				<input type='hidden' name='pageId' value='{PAGE_ID}' />
				<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
				<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

				<a class='modify_link_close' rel='{LIST_ITEM_ID}'>Close</a>
				<label>
					<input type='text' class='firstFocus' name='title' value='{LIST_ITEM_TITLE}' />
				</label>
				<label>
					<input type='text' name='content' value='{LIST_ITEM_CONTENT}' />
				</label>

				<input type='submit' value='Update' />
			</form>
			<!-- END has_modify_form -->

			<!-- BEGIN has_delete_form -->
			<form action='/eportfolio/component/linklist/modifyForm.php' method='post'>
				<input type='hidden' name='action' value='removeItem' />
				<input type='hidden' name='userId' value='{USER_ID}' />
				<input type='hidden' name='pageId' value='{PAGE_ID}' />
				<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
				<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

				<input type='submit' value='Delete' />
			</form>
			<!-- END has_delete_form -->
		</li>
		<!-- END list_item -->
	</ol>
</div>
