<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript'>
		$(function() {
			$('a.modify_link').click(function() {
				var id = $(this).attr('rel');

				/* Show editor form
				 */
				$('#modify_link_form_' + id).show();
				$('#modify_link_form_' + id).find('.firstFocus').focus();

				/* Hide actual content
				 */
				$('#list_item_link_content_' + id).hide();
			});

            /* Create button, swap form in
             */
            $('a.create_link').click(function(event) {
				event.preventDefault();

                $(this).hide();
                $(this).next().show();
            });

			/* Close button
			 */
			$('a.modify_link_close').click(function() {
				var id = $(this).attr('rel');

				/* Show actual content
				 */
				$('#list_item_link_content_' + id).show();

				/* Hide editor form
				 */
				$('#modify_link_form_' + id).hide();
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

    <div class="listing">
		<ul>
			<!-- BEGIN list_item -->
			<li class="clearfix {ON_OFF}">
				<div id='list_item_link_content_{LIST_ITEM_ID}'>
					<h4><a class="icons link"  rel="{LIST_ITEM_TARGET}" href='{LIST_ITEM_ENCODED_URL}'>{LIST_ITEM_TITLE}</a></h4>
					<!-- BEGIN has_modify_button -->
					<a class='btn modify no-text modify_link' title="Edit link" rel='{LIST_ITEM_ID}'><span></span></a>
					<!-- END has_modify_button -->
					<!-- BEGIN has_delete_form -->
					<a title="Remove link" class="btn delete no-text" href="/eportfolio/component/linklist/modifyForm.php?action=removeItem&userId={USER_ID}&pageId={PAGE_ID}&componentInstanceId={COMPONENT_INSTANCE_ID}&listItemId={LIST_ITEM_ID}" onclick="return confirm('Do you want to delete this item?');"><span></span></a>
					<!-- END has_delete_form -->
				</div>

				<!-- BEGIN has_modify_form -->
				<div class="editPanelImitation hide" id='modify_link_form_{LIST_ITEM_ID}'>
					<form class='modifyForm' action='/eportfolio/component/linklist/modifyForm.php' method="post">
						<input type='hidden' name='action' value='updateItem' />
						<input type='hidden' name='userId' value='{ID}' />
						<input type='hidden' name='pageId' value='{PAGE_ID}' />
						<input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
						<input type='hidden' name='listItemId' value='{LIST_ITEM_ID}' />

						<div class="title"><span>Title: </span>
							<input type='text' class="firstFocus" name='title' value='{LIST_ITEM_TITLE}' />
						</div>
						<div class="content"><span>Link address: </span>
							<input type='text' name='content' value='{LIST_ITEM_URL}' />
						</div>

						<input type='submit' value='Update' />
					</form>
				</div>
				<!-- END has_modify_form -->
			</li>
			<!-- END list_item -->
		</ul>
    </div>
    <!-- BEGIN has_create_form -->
	<a href="#" class="btn add create_link"><span></span>Add to List</a>

    <div class="editPanelImitation hide">
        <form action='/eportfolio/component/linklist/modifyForm.php' method='post'>
            <input type='hidden' name='action' value='addItem' />
            <input type='hidden' name='userId' value='{ID}' />
            <input type='hidden' name='pageId' value='{PAGE_ID}' />
            <input type='hidden' name='componentInstanceId' value='{COMPONENT_INSTANCE_ID}' />
            <div class="title"><span>Title: </span>
                <input type='text' name='title' value='' />
            </div>
            <div class="content"><span>Link address: </span>
                <input type='text' name='content' value='' />
            </div>

            <input type='submit' value='Add item' />
        </form>
    </div>
    <!-- END has_create_form -->
</div>
