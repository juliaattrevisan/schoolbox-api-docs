<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-rss"></i>
                <p>No Wolfram|Alpha widget provided.</p>
                <!-- BEGIN empty_modify -->
                <p>To use this component your must first <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">copy and paste the widget embed code</a>. You can find widgets on the <a href="http://www.wolframalpha.com/widgets/gallery/" target="_blank">Wolfram Alpha</a> site.</p>
                <!-- END empty_modify -->
            </div>
            <!-- END empty_state -->

            <!-- BEGIN wolfram -->
            <section>
                <div class="content">
                    <!-- BEGIN has_wolfram -->
                    <script type='text/javascript' id="WolframAlphaScript{WIDGET_ID}" src="http://www.wolframalpha.com/widget/widget.jsp?id={WIDGET_ID}&amp;output={WIDGET_OUTPUT_TYPE}"></script>
                    <!-- END has_wolfram -->
                </div>
            </section>
            <!-- END wolfram -->

        </div>
    </div>
</div>
