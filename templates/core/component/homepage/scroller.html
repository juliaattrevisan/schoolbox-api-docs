<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component>
    <script src="/javascript/components/swiper/dist/js/swiper.min.js"></script>

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <section>
                <ul class="information-list" data-dz-container></ul>
            </section>

            <div data-dz-wrap class="dropzone-wrap">
                <div data-dz-container="">
                </div>
                <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="audio"></form>
                <div class="hide" data-dz-template>
                    <li>
                        <div class="card small-12">
                            <img data-dz-thumbnail class="mime" src="/images/foundation/preloader.gif"/>
                            <h3 data-dz-name></h3>
                            <p class="meta" data-dz-status>Uploading...</p>
                            <div class="progress dz-progress">
                                <span class="meter dz-upload" style="width:0;"></span>
                            </div>
                        </div>
                    </li>
                </div>

                <div class="empty-state">
                    <i class="icon-image-slideshow"></i>

                    <!-- BEGIN empty_read -->
                    <p>There are no images to view at this time.</p>
                    <!-- END empty_read -->

                    <!-- BEGIN empty_write -->
                    <p><a href="/cms/file/new/{IMAGESCROLLER_CATEGORY_ID}">Post an image</a> or drag and drop multiple images on this component to display as a slideshow.</p>
                    <script type="text/javascript">
                        $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                            wrapClass: 'dragging',
                            wrap: '#content',
                            showIfEmpty: false,
                            previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                            previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                            createImageThumbnails: true,
                            thumbnailHeight: 400,
                            thumbnailWidth: null,
                            dictDefaultMessage: 'You can drag an image into this space.',
                            acceptedFiles: 'image/*',
                            refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                            refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                            addedfile: function (file) {
                            },
                            sending: function (file, xhr, formData) {
                                $(file.previewElement)
                                        .addClass('category-{IMAGESCROLLER_CATEGORY_ID}')
                                        .data('node', {IMAGESCROLLER_CATEGORY_ID});

                                $('#img{COMPONENT_INSTANCE_ID}').remove();

                                formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                formData.append('category', $(file.previewElement).data('node'));
                                formData.append('comment', '');
                                formData.append('hidden', 0);
                            },
                            error: function (file) {
                                $(file.previewElement)
                                        .closest('[data-dz-container]')
                                        .find('.dz-preview').remove();
                            }
                        });
                    </script>
                    <!-- END empty_write -->
                </div>

            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_images -->
            <section class="imageslider-container">
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <script type="text/javascript">
                    // Expanded? init on load
                    // Collapsed? init on expand
                    $(function(){
                        var component = $("#component{COMPONENT_INSTANCE_ID}");
                        var init = function() {

                            var mySwiper = new Swiper (component.find('[data-imageslider]'), {
                                autoplay: {
                                    delay: {COMPONENT_CONFIG_TIMING_VALUE_MS},
                                    disableOnInteraction: false,
                                },
                                centeredSlides: true,
                                initialSlide: {COMPONENT_RANDOM_SLIDE},
                                lazy: {
                                    loadPrevNext: true,
                                    loadPrevNextAmount: 3,
                                    preloaderClass: 'loader',
                                },
                                loop: true,
                                pagination: {
                                    el: '.swiper-pagination',
                                    clickable: true,
                                },
                                navigation: {
                                    nextEl: '.swiper-button-next',
                                    prevEl: '.swiper-button-prev',
                                },
                                speed: 1000,
                            });
                        };

                        var collapser = component.find('[data-collapsable="true"]');
                        if (collapser.data('collapseState') === 'uncollapsed') {
                            init();
                        } else {
                            collapser.one('expandStop.collapsable', init);
                        }
                    });
                </script>

                <div class="dropzone-wrap no-margin">
                    <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="image"></form>
                    <div data-imageslider class="swiper-container">
                        <div class="swiper-wrapper">
                            <!-- BEGIN image_scroller -->
                            <div class="swiper-slide">
                                <!-- BEGIN linked_image -->
                                <a href="{IMAGE_URL}">
                                    <div class="{COMPONENT_CONFIG_IMAGE_RATIO}">
                                        <img data-src="/cms/image.php?id={IMAGE_ID}&height=1024&width=1024" class="swiper-lazy" />
                                    </div>
                                </a>
                                <div class="loader"></div>
                                <!-- END linked_image -->
                                <!-- BEGIN unlinked_image -->
                                <div class="{COMPONENT_CONFIG_IMAGE_RATIO}">
                                    <img data-src="/cms/image.php?id={IMAGE_ID}&height=1024&width=1024" class="swiper-lazy" />
                                    <div class="loader"></div>
                                </div>
                                <!-- END unlinked_image -->
                                <!-- BEGIN show_caption -->
                                <p class="meta">{IMAGE_NAME}</p>
                                <!-- END show_caption -->
                            </div>
                            <!-- END image_scroller -->
                        </div>
                        <div class="swiper-pagination"></div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                    </div>
                    <ul data-dz-container class="inline-list dz-container no-margin">
                        <!-- THIS TEMPLATE WILL BE DETACHED, DON'T WORRY ABOUT THE BAD DOM -->
                        <ul class="hide" data-dz-template>
                            <li>
                                <img data-dz-thumbnail src="/images/foundation/preloader.gif" />
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </li>
                        </ul>
                    </ul>
                </div>

                <!-- BEGIN submit_image_scroller -->
                <div class="component-action">
                    <section>
                        <p><a href="/cms/file/new/{IMAGESCROLLER_CATEGORY_ID}">Select an image</a> or drag and drop multiple onto this component</p>
                    </section>
                </div>

                <script type="text/javascript">
                    $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                        wrapClass: 'dragging',
                        wrap: '#content',
                        showIfEmpty: false,
                        previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                        previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                        createImageThumbnails: true,
                        thumbnailHeight: 400,
                        thumbnailWidth: null,
                        dictDefaultMessage: 'You can drag an image into this space.',
                        acceptedFiles: 'image/*',
                        refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                        refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                        addedfile: function (file) {
                        },
                        sending: function (file, xhr, formData) {
                            $(file.previewElement)
                                    .addClass('category-{IMAGESCROLLER_CATEGORY_ID}')
                                    .data('node', {IMAGESCROLLER_CATEGORY_ID});

                            $('#img{COMPONENT_INSTANCE_ID}').remove();

                            formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                            formData.append('category', $(file.previewElement).data('node'));
                            formData.append('comment', '');
                            formData.append('hidden', 0);
                        },
                        error: function (file) {
                            $(file.previewElement)
                                    .closest('[data-dz-container]')
                                    .find('.dz-preview').remove();
                        }
                    });
                </script>
                <!-- END submit_image_scroller -->

                <!-- END source_folder_exists -->
            </section>
            <!-- END has_images -->

        </div>
    </div>
</div>
