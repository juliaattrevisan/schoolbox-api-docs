<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <script type="text/javascript" src="/javascript/jquery.cycle.js"></script>
    <script type="text/javascript" src="/javascript/jquery.imagesloaded.js"></script>
    <script type="text/javascript">
        $j(function () {
            //
            // Calculate slide position and margin for elements
            var slide_position = 'left';
            var margin         = '0 auto 0 0';
            switch ('{COMPONENT_ALIGN}') {
                case 'center':
                    slide_position = 'center';
                    margin         = '0 auto';
                    break;
                case 'right':
                    slide_position = 'right';
                    margin         = '0 0 0 auto';
                    break;
                case 'left':
                default:
                    break;
            };

            //
            // Callback for when slide changes.
            var slideCallback = function() {
                $j(this).css('text-align', slide_position);
            };

            var container = $j('#galleryCycle-{COMPONENT_INSTANCE_ID}');
            container.find('.slideshow-cycle').hide().css(slide_position);
            container.find('.slideshow-cycle img').imagesLoaded(function (images) {

                //
                // Set width to widest slide.
                var width = 0;
                container.find('.slideshow-cycle').each(function() {
                    var this_width = $j(this).width();
                    if (this_width > width) {
                        width = this_width;
                    }
                });

                container.cycle({
                    timeout:{COMPONENT_CONFIG_TIMING_VALUE_MS},
                    cleartype:true,
                    height:'auto',
                    width: width,
                    fit: true,
                    before: slideCallback,
                    after: slideCallback
                }).css('margin', margin);
            });
        });
    </script>
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div id="galleryCycle-{COMPONENT_INSTANCE_ID}" class="scroller box clearfix" style="padding:0;border:0;margin:0;">
        <!-- BEGIN image_scroller -->
        <div class="slideshow-cycle">
            <img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}"
                 alt="{IMAGE_NAME}"/>
            <!-- BEGIN show_caption -->
            <div class="caption-holder">{IMAGE_NAME}</div>
            <!-- END show_caption -->
        </div>
        <!-- END image_scroller -->
    </div>
    <!-- BEGIN submit_image -->
    <p class="interact clearfix"><a href="/cms/file/multi/{IMAGESCROLLER_CATEGORY_ID}"
                                    class="btn up-arrow"><span></span>Post Images</a></p>
    <!-- END submit_image -->
</div>
