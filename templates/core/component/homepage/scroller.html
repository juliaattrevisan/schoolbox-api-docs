<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <script type="text/javascript" src="/javascript/components/jquery-cycle/jquery.cycle.all.js"></script>
    <script type="text/javascript" src="/javascript/components/eventie/eventie.js"></script>
    <script type="text/javascript" src="/javascript/components/eventEmitter/EventEmitter.js"></script>
    <script type="text/javascript" src="/javascript/components/imagesloaded/imagesloaded.js"></script>
    <script type="text/javascript">
        $(function () {
            //
            // Calculate slide position and margin for elements
            var slide_position = 'left';
            var margin         = '0 auto 0 0';
            switch ('{COMPONENT_ALIGN}') {
                case 'center':
                    slide_position = 'center';
                    margin         = '0 auto';
                    break;
                case 'right':
                    slide_position = 'right';
                    margin         = '0 0 0 auto';
                    break;
                case 'left':
                default:
                    break;
            };

            //
            // Callback for when slide changes.
            var slideCallback = function() {
                $(this).css('text-align', slide_position);
            };

            var container = $('#galleryCycle-{COMPONENT_INSTANCE_ID}');
            var slideshow = container.find('.slideshow-cycle');
            if (slideshow.length > 1) {
                slideshow.hide();
            }
            slideshow.css('text-align', slide_position);
            if (slideshow.length > 1) {
                imagesLoaded(container[0], function() {

                    //
                    // Set width to widest slide.
                    var width = 0;
                    container.find('.slideshow-cycle').each(function() {
                        var this_width = $(this).width();
                        if (this_width > width) {
                            width = this_width;
                        }
                    });

					/* Random starting slide
					 */
					var isRandomStart = {COMPONENT_CONFIG_RANDOM_STARTING_SLIDE};
					var startingSlide = 0;

					if (isRandomStart) {
						var startingSlide = Math.floor(Math.random()*slideshow.length);
					}

                    container.cycle({
                        timeout:{COMPONENT_CONFIG_TIMING_VALUE_MS},
                        cleartypeNoBg:true,
                        height:'auto',
                        width: Math.min(width, container.width()),
                        fit: true,
                        before: slideCallback,
                        after: slideCallback,
						startingSlide: startingSlide
                    }).css('margin', margin);
                });
            }
        });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div id="galleryCycle-{COMPONENT_INSTANCE_ID}" class="scroller box clearfix" style="padding:0;border:0;margin:0;">
            <!-- BEGIN image_scroller -->
            <div class="slideshow-cycle">
                <img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}"
                     alt="{IMAGE_NAME}"/>
                <!-- BEGIN show_caption -->
                <div class="caption-holder">{IMAGE_NAME}</div>
                <!-- END show_caption -->
            </div>
            <!-- END image_scroller -->
        </div>

        <!-- BEGIN submit_image -->
        <p class="interact clearfix">
            <a href="/cms/file/multi/{IMAGESCROLLER_CATEGORY_ID}" class="btn up-arrow"><span></span>Post Images</a>
        </p>
        <!-- END submit_image -->
    </div>
</div>
