<div id="component{COMPONENT_INSTANCE_ID}" class="component-container" data-component>
    <script type="text/javascript" src="/javascript/components/anyslider/dist/jquery.anyslider.min.js"></script>
    <script type="text/javascript">
        $(function(){
            $("#component{COMPONENT_INSTANCE_ID}").find("[data-imageslider]").anyslider({
                interval: {COMPONENT_CONFIG_TIMING_VALUE_MS},
                prevLabel: '',
                nextLabel: '',
                showBullets: false,
                showControls: true,
            });
        });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <div data-imageslider class="imageslider-container">
                <!-- BEGIN image_scroller -->
                <div data-imageslider-image class="text-center">
                    <img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}" alt="{IMAGE_NAME}"/>
                    <!-- BEGIN show_caption -->
                    <p class="meta">{IMAGE_NAME}</p>
                    <!-- END show_caption -->
                </div>
                <!-- END image_scroller -->
            </div>
            <section class="content">
                <!-- BEGIN submit_image -->
                <a href="/cms/file/new/{IMAGESCROLLER_CATEGORY_ID}" class="button icon-upload">Post Image</a>
                <!-- END submit_image -->
            </section>
        </div>
    </div>
</div>
