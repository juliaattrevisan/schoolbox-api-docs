<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN etherpad_pad -->
                    <li class="row" data-equalizer>
                        <div class="column small-11 no-pad" data-equalizer-watch>
                            <div class="avatar card">
                                <a href='/collabdoc/edit/{ETHERPAD_PAD_ID}/{ID}'>
                                    <h3>{ETHERPAD_NAME}</h3>
                                </a>
                                <p class="meta">Last updated on {ETHERPAD_UPDATED_AT}</p>
                            </div>
                        </div>
                        <div class="one actions">
                            <!-- BEGIN etherpad_has_modify -->
                            <a data-equalizer-watch class="icon-modify no-text" href="/collabdoc/modify/{ETHERPAD_PAD_ID}" data-tooltip title="Modify Collab Doc"></a>
                            <!-- END etherpad_has_modify -->
                        </div>
                    </li>
                    <!-- END etherpad_pad -->
                </ul>

                <div class="content">
                    <!-- BEGIN etherpad_has_create -->
                    <a href="/collabdoc/create/{ID}" class="button icon-add">Create Document</a>
                    <!-- END etherpad_has_create -->
                </div>
            </section>
        </div>
    </div>
</div>
