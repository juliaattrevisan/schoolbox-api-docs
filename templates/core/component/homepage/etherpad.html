<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-collab-docs"></i>
                <p><a href="/collabdoc/create/{SOURCE_ID}">Create a collab doc</a> for users to work collaboratively on a document.</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_docs -->
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <ul class="action-list">
                    <!-- BEGIN etherpad_pad -->
                    <li class="actions-small-2">
                        <div class="list-item">
                            <div class="card small-12">
                                <a href='/collabdoc/edit/{ETHERPAD_PAD_ID}/{ID}'>
                                    <h3>{ETHERPAD_NAME}</h3>
                                </a>
                                <p class="meta">Last updated on {ETHERPAD_UPDATED_AT}</p>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN etherpad_has_modify -->
                            <a class="icon-modify" href="/collabdoc/modify/{ETHERPAD_PAD_ID}" title="Modify Collab Doc"></a>
                            <!-- END etherpad_has_modify -->
                        </nav>
                    </li>
                    <!-- END etherpad_pad -->
                </ul>

                <!-- BEGIN etherpad_has_create -->
                <div class="component-action">
                    <section>
                        <a href="/collabdoc/create/{SOURCE_ID}" class="button">Create Document</a>
                    </section>
                </div>
                <!-- END etherpad_has_create -->

                <!-- END source_folder_exists -->
            </section>
            <!-- END has_docs -->

        </div>
    </div>
</div>
