<div data-component id="component{COMPONENT_INSTANCE_ID}">
    <script type="text/javascript" src="/javascript/chat.js"></script>
    <script type="text/javascript">
        $(function () {
            $('#component{COMPONENT_INSTANCE_ID}').chat({
                state: '{CHAT_STATE}',
                category_id: '{ID}',
                component_id: '{CHAT_COMPONENT_ID}',
                user_id: '{CHAT_USER_ID}',
                user_ext_id: '{CHAT_USER_EXT_ID}',
                user_name: '{CHAT_USER_NAME}',
                user_perm: '{CHAT_USER_PERM}',
                log_el: 'ul[data-chat-log]',
                send_el: 'a[data-interaction-send]',
                users_el: 'ul[data-chat-users]'
            });

            $('.show-users').click(function(event) {
                event.preventDefault();
                $('.chat-users').slideToggle();
                $(this).toggleClass('active')
            });

            /* IE : defer focus to the chat message box */
            $(document).on('focus', '#component{COMPONENT_INSTANCE_ID}', function() {
                var msgbox = document.getElementById('component{COMPONENT_INSTANCE_ID}-chatmessage');
                if(msgbox && msgbox.setActive) {
                    msgbox.setActive();
                }
            });
        });
    </script>
    <!-- BEGIN chat_staff_js -->
    <script type="text/javascript">
        window.check = true;
        window.onbeforeunload = function (e) {
            if(window.check) if($('#component{COMPONENT_INSTANCE_ID}').chat("get_state") == 'Active') {
                var confirm = "If you leave this page, the chat will be disabled for any students still in it.";
                var e = e || window.event;
                if (e) { e.returnValue = confirm; }
                return confirm;
            }
        };
    </script>
    <!-- END chat_staff_js -->

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="chat-users small-block-grid-2 medium-block-grid-3 large-block-grid-4" data-chat-users></ul>
                <ul class="information-list chat-messages" data-chat-log></ul>
                    <div class="content">
                        <form action="#" method="post" class="chat-send" id="chatSend">
                            <!-- BEGIN chat_state_active -->
                            <div class="chat-message-container">
                                <textarea id="component{COMPONENT_INSTANCE_ID}-chatmessage" name="message" class="chat-message-box"></textarea>
                            </div>
                            <a href="#" class="button submit" data-interaction-send>Send</a>
                            <!-- END chat_state_active -->
                            <!-- BEGIN chat_state_inactive -->
                            <p class="alert-box warning">The chat is inactive.</p>
                            <a class="button icon-comment" href="/homepage/configForm.php?cid={ID}&type=config&component={CHAT_COMPONENT_ID}&state=Active&teacher_timestamp=">Activate Chat</a>
                            <!-- END chat_state_inactive -->
                            <a href="/homepage/chatArchive/{ID}/" class="button icon-history">View Chat Archive</a>
                        </form>
                    </div>
                <div class="chat-error hide"></div>
            </section>
        </div>
    </div>
</div>
