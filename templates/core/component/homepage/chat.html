<script type="text/javascript" src="/javascript/stdfuncs.js"></script>
<script type="text/javascript" src="/javascript/jquery.color.js"></script>
<script type="text/javascript" src="/javascript/jquery.ui.js"></script>
<script type="text/javascript" src="/javascript/chat.js"></script>
<script type="text/javascript">
    $j(function () {
        $j('#component{COMPONENT_INSTANCE_ID}').chat({
            state: '{CHAT_STATE}',
            category_id: '{ID}',
            component_id: '{CHAT_COMPONENT_ID}',
            user_id: '{CHAT_USER_ID}',
            user_name: '{CHAT_USER_NAME}',
            user_perm: '{CHAT_USER_PERM}',
            log_el: 'ul.chat-messages',
            send_el: 'a.btn.chat'
        });

        $j('.show-users').click(function(event) {
            event.preventDefault();
            $j('.chat-users').slideToggle();
            $j(this).toggleClass('active')
        });
    });
</script>
<!-- BEGIN chat_staff_js -->
<script type="text/javascript">
    window.check = true;
    window.onbeforeunload = function (e) {
        if(window.check) if($j('#component{COMPONENT_INSTANCE_ID}').chat("get_state") == 'Active') {
            var confirm = "If you leave this page, the chat will be disabled for any students still in it.";
            var e = e || window.event;
            if (e) { e.returnValue = confirm; }
            return confirm;
        }
    };
</script>
<!-- END chat_staff_js -->

<div class="box chat clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>Chat<span class="light"></span></h2>
    {CONFIGURATION}
    <div class="chat-box">
        <ul class="listing chat-users">
        </ul>
        <a href="#" class="show-users"></a>
        <ul class="chat-messages">
        </ul>
        <form action="#" method="post" class="chat-send" id="chatSend">
            <!-- BEGIN chat_state_active -->
            <div class="chat-message-container">
                <textarea name="message" class="chat-message-box"></textarea>
            </div>
            <a href="#" class="btn chat float-right"><span></span>Send</a>
            <!-- END chat_state_active -->
            <!-- BEGIN chat_state_inactive -->
            <p class="bold">The chat is inactive. <a href="/homepage/configForm.php?cid={ID}&type=config&component={CHAT_COMPONENT_ID}&state=Active&teacher_timestamp=">Please click here to activate the chat.</a></p>
            <!-- END chat_state_inactive -->
        </form>
        <a href="/homepage/chatArchive/{ID}/" class="btn"><span></span>Chat Archive</a>
    </div>
    <div class="chat-error hide"></div>
</div>
