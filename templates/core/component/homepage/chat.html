<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component>
    <script type="text/javascript" src="{CDN_PREFIX}/js/chat/chat.js?v={SITE_VERSION}"></script>
    <script type="text/javascript">
        $(function () {
            var component = $('#component{COMPONENT_INSTANCE_ID}');
            component.chat({
                state: '{CHAT_STATE}',
                category_id: '{ID}',
                component_id: '{CHAT_COMPONENT_ID}',
                user_id: '{CHAT_USER_ID}',
                user_ext_id: '{CHAT_USER_EXT_ID}',
                user_name: '{CHAT_USER_NAME}',
                user_perm: '{CHAT_USER_PERM}',
                log_el: 'ul[data-chat-log]',
                send_el: 'input[data-chat-send]',
                users_el: 'ul[data-chat-users]'
            });

            $('.show-users').click(function (event) {
                event.preventDefault();
                $('.chat-users').slideToggle();
                $(this).toggleClass('active')
            });

            /* IE : defer focus to the chat message box */
            $(document).on('focus', '#component{COMPONENT_INSTANCE_ID}', function () {
                var msgbox = document.getElementById('component{COMPONENT_INSTANCE_ID}-chatmessage');
                if (msgbox && msgbox.setActive) {
                    msgbox.setActive();
                }
            });
        });
    </script>
    <!-- BEGIN chat_staff_js -->
    <script type="text/javascript">
        window.check = true;
        window.onbeforeunload = function (e) {
            if (window.check) if ($('#component{COMPONENT_INSTANCE_ID}').chat("get_state") == 'Active') {
                var confirm = "If you leave this page, the chat will be disabled for any students still in it.";
                var e = e || window.event;
                if (e) {
                    e.returnValue = confirm;
                }
                return confirm;
            }
        };
    </script>
    <!-- END chat_staff_js -->

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-chat"></i>

                <!-- BEGIN empty_read -->
                <p>There is no active chat at this time. <a href="/homepage/chatArchive/{ID}/">View the chat archive</a>.</p>
                <!-- END empty_read -->

                <!-- BEGIN empty_write -->
                <p>
                    <a href="/homepage/configForm.php?cid={ID}&type=config&component={CHAT_COMPONENT_ID}&state=Active&teacher_timestamp=">Activate the chat</a> to allow users to have conversations on this page, or <a href="/homepage/chatArchive/{ID}/">view the chat archive</a>.
                </p>
                <!-- END empty_write -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN chat -->
            <section class="discussion">
                <ul class="information-list chat-messages" data-chat-log></ul>

                <div class="content">
                    <form action="#" method="post" class="chat-send" id="chatSend">
                        <div class="chat-message-container">
                            <textarea id="component{COMPONENT_INSTANCE_ID}-chatmessage" name="message" class="chat-message-box" rows="2" placeholder="Type a message..."></textarea>
                        </div>
                        <input type="submit" value="Send Message" data-chat-send>
                    </form>
                    <div class="chat-error hide"></div>
                </div>
                <div class="component-action">
                    <section>
                        <a href="#" data-reveal-id="component{COMPONENT_INSTANCE_ID}-participants" class="button">View Participants</a>
                    </section>
                </div>
            </section>

            <!-- END chat -->

            <div data-reveal id="component{COMPONENT_INSTANCE_ID}-participants" class="reveal-modal">
                <h2>Chat Participants</h2>
                <ul class="chat-users small-block-grid-2 medium-block-grid-3 large-block-grid-4" data-chat-users></ul>
                <a class="close-reveal-modal" aria-label="Close">&#215;</a>
            </div>

        </div>
    </div>
</div>
