		   poster="/cms/videoThumb.php?hash={SOCIALSTREAM_STORAGE_HASH}&type=poster">

<script type="text/javascript">
	$j(function() {
		$j('a.video-link').click(function() {
			var $target = "/cms/sendVideo.php?hash={SOCIALSTREAM_STORAGE_HASH}";
//			var $poster = "/cms/videoThumb.php?hash={SOCIALSTREAM_STORAGE_HASH}&type=poster";
			var $video = _V_("socialstream_video", {width: '100%', height: '400px'});

			$video.ready(function(){
				this.pause();
				$j("#socialstream_video_html5_api").attr('poster', $poster);
				$j(".vjs-poster").css({ "background-image": "url("+$poster+")"});
				this.src({ type: "video/mp4", src: $target});
				this.bigPlayButton.show();
			});
			return false;
		});
	});
</script>
