<ul class='breadcrumb'>
    <li data-breadcrumb>
        <a href='#' rel='0'>Home</a>
    </li>
    <!-- BEGIN breadcrumb -->
    <li class="{BREADCRUMB_CLASS}" data-breadcrumb>
        <a href='#' rel='{BREADCRUMB_CATEGORY_ID}'>{BREADCRUMB_NAME}</a>
    </li>
    <!-- END breadcrumb -->
</ul>
<ul class="resource-list">
    <!-- BEGIN node_category -->
    <li data-node-category class="resource">
        <a href="#" rel="{NODE_CATEGORY_ID}" title="{NODE_CATEGORY_NAME}" class="icon-{NODE_CATEGORY_TYPE}">
            {NODE_CATEGORY_NAME}
        </a>
    </li>
    <!-- END node_category -->

    <!-- BEGIN node_file -->
    <li data-node-file class="resource">
        <a href="/send.php?id={NODE_FILE_ID}" title="{NODE_FILE_NAME}" data-mime="{NODE_MIME_TYPE}"

            <img src="{CDN_PREFIX}/images/mime/{NODE_FILE_ICON}" alt="{NODE_FILE_NAME}" class="compact-mime" />
            {NODE_FILE_NAME}
        </a>
    </li>
    <!-- END node_file -->
</ul>

<!-- BEGIN use_folder -->
<a href="{NODE_LINK}" class="hide" data-use-folder data-node-id="{NODE_ID}" data-filename_html="{NODE_NAME}">

</a>
