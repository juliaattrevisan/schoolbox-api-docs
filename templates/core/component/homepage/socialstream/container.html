<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
	<script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
	<script type='text/javascript' src='/socialstream/threads/threads.js'></script>
	<script type='text/javascript' src='/socialstream/browser/browser.js'></script>

	<script type='text/javascript'>
		/* Use flag to prevent double loading :(
		 */
		var hasLoaded{COMPONENT_INSTANCE_ID};

		$j(function() {
			if (hasLoaded{COMPONENT_INSTANCE_ID} !== true) {
				$j('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamThreads({
					instanceId: '{COMPONENT_INSTANCE_ID}',
					homepageId: '{HOMEPAGE_ID}',

					/* Slow
					 */
					start: 0,

					offset: '{SOCIALSTREAM_AJAX_LIMIT}',
					numPosts: '{SOCIALSTREAM_NUM_POSTS}'
				});

				hasLoaded{COMPONENT_INSTANCE_ID} = true;
			}
		});
	</script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div class="socialstream-form">
		<!-- BEGIN socialstream_has_newpost -->
		<form action='/socialstream/modifyForm.php' method='post' id='socialstream-form-default-{COMPONENT_INSTANCE_ID}' class='addPostForm {FORM_CLASS}' enctype='multipart/form-data'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />
			<input type='hidden' name='socialstreamAttachment' value=''>

			<ul class="socialstream-form">
				<li>
					<textarea rows="3" cols="50" name="body" placeholder="Share something"></textarea>
				</li>
			</ul>
			<ul class="socialstream-form">
				<li>
					<label>Link:
						<input type='text' class='url' name='url' maxlength='1024' placeholder="http://" />
					</label>
				</li>

				<li>
					<label>File:
						<input type='file' class='upload' name='file' value='' />
					</label>
				</li>

				<li>
					<label>Resource:
						<span class='socialstream-selected-file'>TS</span>
					</label>
				</li>
			</ul>
			<p class="clearfix">
				<a class='btn folder socialstream-attachment-resource socialstream-browser-button' data-value='resource'><span></span>Browse Resources</a>
				<a class='btn up-arrow socialstream-attachment-upload' data-value='upload'><span></span>Upload</a>
				<a class='btn links socialstream-attachment-url' data-value='url'><span></span>Link</a>
				<input class='submit-btn-plain' type='submit' value='Post' />
			</p>
		</form>
		<!-- END socialstream_has_newpost -->
	</div>

	<div id='socialstream-browser' class='socialstream-browser'>
	</div>

	<div id='socialstream-{COMPONENT_INSTANCE_ID}'>
		<p class="loading">
			Loading stream&hellip;
		</p>

		<ul class='socialstream-threads information-list'></ul>

		<p class="interact">
			<a class="btn update socialstreamViewMore"><span></span>Load More</a>
		</p>
	</div>
</div>
