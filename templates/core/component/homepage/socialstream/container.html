<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type='text/javascript' src='/javascript/socialstream/threads.js'></script>
	<script type='text/javascript' src='/javascript/socialstream/browser.js'></script>

	<script type='text/javascript'>
		$j(function() {
			$j('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamThreads({
				instanceId: '{COMPONENT_INSTANCE_ID}',
				homepageId: '{HOMEPAGE_ID}',

				/* Slow
				 */
				end: 0,

				offset: '{SOCIALSTREAM_AJAX_LIMIT}',
				numPosts: '{SOCIALSTREAM_NUM_POSTS}'
			});
		});
	</script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div>
		<!-- BEGIN socialstream_has_newpost -->
		<form action='/socialstream/modifyForm.php' method='post' id='socialstream-form-default-{COMPONENT_INSTANCE_ID}' class='addPostForm {FORM_CLASS}' enctype='multipart/form-data'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />
			<input type='hidden' name='socialstreamAttachment' value=''>

			<label>
				<input type="text" name="body" maxlength="255" />
			</label>

			<label>
				URL: <input type='text' class='url' name='url' maxlength='255' value='' />
			</label>

			<label>
				File: <input type='file' class='upload' name='file' value='' />
			</label>

			<label>
				Resource: <span class='socialstream-selected-file'>TS</span>
			</label>

			<a class='btn socialstream-attachment-resource socialstream-browser-button' data-value='resource'><span></span>Resource</a>
			<a class='btn up-arrow socialstream-attachment-upload' data-value='upload'><span></span>Upload</a>
			<a class='btn go-to socialstream-attachment-url' data-value='url'><span></span>URL</a>


			<input class='submit-btn-plain' type='submit' value='Post' />
		</form>
		<!-- END socialstream_has_newpost -->
	</div>

	<div id='socialstream-browser' class='socialstream-browser'>
	</div>

	<div id='socialstream-{COMPONENT_INSTANCE_ID}'>
		<p class="loading">
			Loading stream&hellip;
		</p>

		<div class="listing blog">
			<ul class='socialstream-threads'></ul>
		</div>

		<p class="interact">
			<a class="btn update socialstreamViewMore"><span></span>Load More</a>
		</p>
	</div>
</div>
