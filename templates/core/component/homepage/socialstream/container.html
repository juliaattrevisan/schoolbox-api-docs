<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<link link rel="stylesheet" type="text/css" media="screen" href='/javascript/socialstream/threads.css' />
	<script type='text/javascript' src='/javascript/socialstream/threads2.js'></script>

	<link link rel="stylesheet" type="text/css" media="screen" href='/javascript/socialstream/browser.css' />
	<script type='text/javascript' src='/javascript/socialstream/browser.js'></script>

	<script type='text/javascript'>
		$j(function() {
//			socialstream.init('{COMPONENT_INSTANCE_ID}', 0, '{SOCIALSTREAM_AJAX_LIMIT}', '{SOCIALSTREAM_NUM_POSTS}');
//			socialstream.stream();

			$j('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamThreads({
				instanceId: '{COMPONENT_INSTANCE_ID}',
				offset: '{SOCIALSTREAM_AJAX_LIMIT}',
				numPosts: '{SOCIALSTREAM_NUM_POSTS}'
			});

			/* Activate socialstream browser for new posts
			 */
			$j('.socialstream-browser-button-0').click(function() {
				$j('#socialstream-browser-0').socialstreamBrowser();
				$j('#socialstream-browser-0').socialstreamBrowser.open('{HOMEPAGE_ID}');
			});

			/* Activate socialstream browser for comments/replies (clones)
			 */
			$j('.socialstream-browser-button-{COMPONENT_INSTANCE_ID}').live('click', function() {
				$j('#socialstream-browser-{COMPONENT_INSTANCE_ID}').socialstreamBrowser();
				$j('#socialstream-browser-{COMPONENT_INSTANCE_ID}').socialstreamBrowser.open('{HOMEPAGE_ID}');
			});
		});
	</script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div>
		<form action='/socialstream/modifyForm.php' method='post' id='socialstream-form-default-{COMPONENT_INSTANCE_ID}' class='addPostForm' enctype='multipart/form-data'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />

			<label>
				Body: <input type='text' name='body' maxlength='255' value='' />
			</label>

			<label>
 				URL: <input type='text' class='url' name='url' maxlength='255' value='' />
			</label>

			<label>
				File: <input type='file' class='upload' name='file' value='' />
			</label>

			<label>
				<input type='radio' class='socialstream-attachment-url' name='socialstreamAttachment' value='url' />URL
			</label>

			<label>
				<input type='radio' class='socialstream-attachment-upload' name='socialstreamAttachment' value='upload' />Upload
			</label>

			<label>
				<input type='radio' class='socialstream-attachment-resource socialstream-browser-button-{COMPONENT_INSTANCE_ID}' name='socialstreamAttachment' value='resource' />Resource
			</label>

			<input type='submit' value='Post' />

			<!--
			Don't rename this id, because you'll have to update the init() method

			Don't rename socialstream-browser-button class as this is used to reinitialise
			these browsers after they are drag and dropped around the homepage

			The browser is cloned
			-->
			<div id='socialstream-browser-{COMPONENT_INSTANCE_ID}' class='socialstream-browser'>
			</div>
		</form>
	</div>

	<div id='socialstream-{COMPONENT_INSTANCE_ID}'>
		<div class='loading'>
			Loading stream
		</div>

		<div class='socialstream-threads'>
		</div>

		<div>
			<p>
				<a class='socialstreamViewMore hide'>View More</a>
			</p>
		</div>
	</div>
</div>
