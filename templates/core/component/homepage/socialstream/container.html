		}

		.socialstream div.avatar {

		.socialstream div.body {

		}

		.socialstream div.body span {

		}

		.socialstream li.socialstream-post div.body {

		}

		.socialstream li.socialstream-comment div.body {
			/*border: 1px solid #0f0;*/
		}

		.socialstream li.socialstream-reply div.body {
			/*border: 1px solid #00f;*/

			background-color: #f00;

	</style>

	<script type='text/javascript' src='/javascript/socialstream.js'></script>
	<script type='text/javascript'>
		$j(function() {
			socialstream.init('{COMPONENT_INSTANCE_ID}', 0, '{SOCIALSTREAM_AJAX_LIMIT}', '{SOCIALSTREAM_NUM_POSTS}');
			socialstream.stream();

			$j('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamBrowser();

			$j('#mog').click(function() {
				$j('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamBrowser.loadNode(51);
			});
		});

		(function($j) {

			/**
			 * Constructor
			 *
			 * @param options
			 */
			$j.fn.socialstreamBrowser = function(options) {
				var self = $j.fn.socialstreamBrowser;

				/* Store the config in this instance so private methods
				 * can access it
				 */
				self.config = init(options, this);

				/* Set up modal thingy
				 */
				initModal(self.config);

				/**
				 * Initialise various configured params and determine a bunch
				 * of ids and stuff that we'll probably use elsewhere
				 *
				 * @param options
				 * @param element
				 * @returns {*}
				 */
				function init(options, element) {
					var defaults = {
						url: '/socialstream/tree.php',
						elementId: $j(element).attr('id'),
						instanceId: $j(element).attr('id').substring(13),
						nodeElement: $j(element).find('.nodes')
					}

					return $j.extend(defaults, options);
				};

				/**
				 * Set up modal window
				 *
				 * @param config
				 */
				function initModal(config) {
					$j(config.nodeElement).dialog({
						width: 650,
						autoOpen: false,
						title: "Browse Resources",
						modal: true,
						resizable: false
					});
				}
			}

			/**
			 * Load a node contents
			 *
			 * @param node
			 */
			$j.fn.socialstreamBrowser.loadNode = function(node) {
				var self = $j.fn.socialstreamBrowser;

				/* The thing you clicked on
				 */
				var args = {
					relationID: node
				}

				/* Load data into the node container
				 */
				self.config.nodeElement.load(self.config.url, args, function() {
					$j(self.config.nodeElement).dialog('open');
				});
			}
		}(jQuery));


	</script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div id='socialstream-{COMPONENT_INSTANCE_ID}'>
		<a id='mog'>Le Browser</a>

		<div class='nodes'>
		</div>
	</div>

	<div class='{FORM_CLASS}'>
		<form action='/socialstream/modifyForm.php' method='post' id='originalAddPostForm' class='addPostForm' enctype='multipart/form-data'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />

			<label>
				Body: <input type='text' name='body' maxlength='255' value='' />
			</label>

			<label>
 				URL: <input type='text' name='url' maxlength='255' value='' />
			</label>

			<label>
				File: <input type='file' name='file' value='' />
			</label>

			<label>
				<input type='radio' class='socialstreamAttachment' name='socialstreamAttachment' value='url' />URL
			</label>

			<label>
				<input type='radio' class='socialstreamAttachment' name='socialstreamAttachment' value='upload' />Upload
			</label>

			<label>
				<input type='radio' class='socialstreamAttachment socialstream-browser' name='socialstreamAttachment' value='resource' />Resource
			</label>

			<input type='submit' value='Post' />
		</form>
	</div>

	<div class='socialstream'>
		<div class='loading'>
			Loading stream
		</div>
	</div>

	<div>
		<p>
			<a class='socialstreamViewMore hide'>View More</a>
		</p>
	</div>
</div>
