<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type='text/javascript' src='{CDN_PREFIX}/socialstream/threads/threads.js'></script>

    <script type='text/javascript'>
        /* Use flag to prevent double loading :(
         */
        var hasLoaded{COMPONENT_INSTANCE_ID} = false;

        $(function() {

            /**
             * Validation
             */
            $('form[data-add-post-form]').each(function() {
                $(this).alaressValidate({
                    rules: {
                        body: {
                            required: {
                                depends: function (element) {
                                    return !$(element).parents('form').find('input[name="attachment[]"]').length &&
                                            !$(element).parents('form').find('[data-ss-url]').val();
                                }
                            }
                        }
                    },
                    messages: {
                        body: "Please enter a message or attach a file."
                    }
                });
            });

            if (hasLoaded{COMPONENT_INSTANCE_ID} !== true) {
                $('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamThreads({
                    instanceId: '{COMPONENT_INSTANCE_ID}',
                    homepageId: '{HOMEPAGE_ID}',

                    /* Slow
                     */
                    start: 0,

                    offset: '{SOCIALSTREAM_AJAX_LIMIT}',
                    numPosts: '{SOCIALSTREAM_NUM_POSTS}'
                });

                hasLoaded{COMPONENT_INSTANCE_ID} = true;
            }
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <div data-socialstream-form class="editPanel socialstream-new-post">
                    <!-- BEGIN socialstream_has_newpost -->
                    <form action='/socialstream/modifyForm.php' method='post' id='socialstream-form-default-{COMPONENT_INSTANCE_ID}' data-add-post-form class='{FORM_CLASS}' enctype='multipart/form-data'>
                        <input type='hidden' name='type' value='string' />
                        <input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
                        <input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
                        <input type='hidden' name='parentId' value='0' />
                        <input type='hidden' name='rootId' value='0' />

                        <label>
                            <textarea rows="2" cols="50" name="body" placeholder="Share something"></textarea>
                        </label>
                        <div class="row post-attachment attach">
                            <div class="small-12 columns">
                                <script>
                                    $(function() {
                                        $('#modalLink-newpostbtn-{COMPONENT_INSTANCE_ID}').schoolboxLink({
                                            allowedFilesystems: 'socialstream',
                                            onBeforeOpen: function() {
                                                const preview = $('#newpost-preview-{COMPONENT_INSTANCE_ID}');

                                                preview.find('img').attr('src', '');
                                                preview.find('span').html('');
                                                preview.hide();
                                            },
                                            onSelect: function(url, name, mime, dialog) {
                                                const preview = $('#newpost-preview-{COMPONENT_INSTANCE_ID}');

                                                preview.find('img').attr('src', '/ajax/mime/' + mime);
                                                preview.find('span').html(name);
                                                preview.show();

                                                $('#modalLinkTarget-newpost-{COMPONENT_INSTANCE_ID}').val(url);
                                            }
                                        });
                                    });
                                </script>
                                <div class="input-group">
                                    <input id="modalLinkTarget-newpost-{COMPONENT_INSTANCE_ID}" type="text" name="url" placeholder="http://" data-ss-url />
                                    <a id='modalLink-newpostbtn-{COMPONENT_INSTANCE_ID}' class="button icon-link">Browse</a>
                                </div>
                                <div id="newpost-preview-{COMPONENT_INSTANCE_ID}" class="socialstream-preview" style="display:none">
                                    <img />
                                    <span></span>
                                </div>
                            </div>
                        </div>
                        <input type='submit' value='Post' />
                    </form>
                </div>

                <!-- A reveal modal version of the above -->
                <div id="socialstream-reply-{COMPONENT_INSTANCE_ID}"
                     class="reveal-modal"
                     data-reveal
                     aria-hidden="true"
                     aria-labelledby="socialstream-reply-{COMPONENT_INSTANCE_ID}-label"
                     role="dialog">
                    <h2 id="socialstream-reply-{COMPONENT_INSTANCE_ID}-label">Post Reply</h2>
                    <form action='/socialstream/modifyForm.php'
                          method='post'
                          data-add-post-form
                          enctype='multipart/form-data'>
                        <input type='hidden' name='type' value='string' />
                        <input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
                        <input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
                        <input type='hidden' name='parentId' value='0' />
                        <input type='hidden' name='rootId' value='0' />

                        <label>
                            <textarea rows="2" cols="50" name="body" placeholder="Share something"></textarea>
                        </label>
                        <div class="post-attachment attach">
                            <script>
                                $(function() {
                                    $('#modalLink-replybtn-{COMPONENT_INSTANCE_ID}').schoolboxLink({
                                        allowedFilesystems: 'socialstream',
                                        restoreModal: '#socialstream-reply-{COMPONENT_INSTANCE_ID}',
                                        onBeforeOpen: function() {
                                            const preview = $('#reply-preview-{COMPONENT_INSTANCE_ID}');

                                            preview.find('img').attr('src', '');
                                            preview.find('span').html('');
                                            preview.hide();
                                        },
                                        onSelect: function(url, name, mime, dialog) {
                                            const preview = $('#reply-preview-{COMPONENT_INSTANCE_ID}');

                                            preview.find('img').attr('src', '/ajax/mime/' + mime);
                                            preview.find('span').html(name);
                                            preview.show();

                                            $('#modalLinkTarget-reply-{COMPONENT_INSTANCE_ID}').val(url);
                                        }
                                    });
                                });
                            </script>
                            <div class="input-group">
                                <input id="modalLinkTarget-reply-{COMPONENT_INSTANCE_ID}" type="text" name="url" placeholder="http://" data-ss-url />
                                <a id="modalLink-replybtn-{COMPONENT_INSTANCE_ID}" class="button icon-link">Browse</a>
                            </div>
                            <div id="reply-preview-{COMPONENT_INSTANCE_ID}" class='socialstream-preview' style="display:none">
                                <img />
                                <span></span>
                            </div>
                        </div>
                        <input type='submit' class="expand" value='Post' />
                    </form>
                    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
                </div>
                <!-- END socialstream_has_newpost -->

                <div id='socialstream-{COMPONENT_INSTANCE_ID}' class="discussion">
                    <ul class='information-list' data-socialstream-threads>
                        <li>
                            <div data-loader class="loader"></div>
                        </li>
                    </ul>

                    <div class="component-action" data-socialstream-view-more>
                        <section>
                            <a class="button">Load More</a>
                        </section>
                    </div>
                </div>
                <!-- END source_folder_exists -->
            </section>
        </div>
    </div>
</div>
