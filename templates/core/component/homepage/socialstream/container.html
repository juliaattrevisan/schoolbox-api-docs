<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
    <script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
    <script type='text/javascript' src='/socialstream/threads/threads.js'></script>
    <script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>

    <script type='text/javascript'>
        /* Use flag to prevent double loading :(
         */
        var hasLoaded{COMPONENT_INSTANCE_ID} = false;

        $(function() {
            if (hasLoaded{COMPONENT_INSTANCE_ID} !== true) {
                $('#socialstream-{COMPONENT_INSTANCE_ID}').socialstreamThreads({
                    instanceId: '{COMPONENT_INSTANCE_ID}',
                    homepageId: '{HOMEPAGE_ID}',

                    /* Slow
                     */
                    start: 0,

                    offset: '{SOCIALSTREAM_AJAX_LIMIT}',
                    numPosts: '{SOCIALSTREAM_NUM_POSTS}'
                });

                hasLoaded{COMPONENT_INSTANCE_ID} = true;
            }
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div data-socialstream-form class="editPanel socialstream-new-post">
                    <!-- BEGIN socialstream_has_newpost -->
                    <form action='/socialstream/modifyForm.php' method='post' id='socialstream-form-default-{COMPONENT_INSTANCE_ID}' data-add-post-form class='{FORM_CLASS}' enctype='multipart/form-data'>
                        <input type='hidden' name='type' value='string' />
                        <input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
                        <input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
                        <input type='hidden' name='parentId' value='0' />
                        <input type='hidden' name='rootId' value='0' />

                        <label>
                            <textarea rows="3" cols="50" name="body" placeholder="Share something"></textarea>
                        </label>
                        <p>
                            <input type='submit' value='Post' />
                        </p>
                        <div class="row post-attachment attach">
                            <div class="small-8 large-9 columns">
                                {ATTACH_ZONE}
                            </div>
                            <div class="small-4 large-3 columns">
                                <a class='button icon-link sstream-attachment' data-value='url'>Link</a>
                            </div>
                        </div>
                        <div class="row post-attachment url" style="display:none">
                            <div class="small-8 large-9 columns">
                            <label>
                                <input type='text' class='url' name='url' maxlength='1024' placeholder="http://" />
                            </label>
                            </div>
                            <div class="small-4 large-3 columns">
                                <a class='button icon-attach sstream-attachment' data-value='attach'>Attach</a>
                            </div>
                        </div>
                    </form>

                    <!-- A reveal modal version of the above -->
                    <div id="socialstream-reply-{COMPONENT_INSTANCE_ID}"
                         class="reveal-modal"
                         data-reveal
                         aria-hidden="true"
                         aria-labelledby="socialstream-reply-{COMPONENT_INSTANCE_ID}-label"
                         role="dialog">
                        <h2 id="socialstream-reply-{COMPONENT_INSTANCE_ID}-label">Post Reply</h2>
                        <form action='/socialstream/modifyForm.php'
                              method='post'
                              data-add-post-form
                              enctype='multipart/form-data'>
                            <input type='hidden' name='type' value='string' />
                            <input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
                            <input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
                            <input type='hidden' name='parentId' value='0' />
                            <input type='hidden' name='rootId' value='0' />

                            <label>
                                <textarea rows="3" cols="50" name="body" placeholder="Share something"></textarea>
                            </label>

                            <p>
                                <input type='submit' class="expand" value='Post' />
                            </p>

                            <div class="row post-attachment attach">
                                <div class="small-8 large-9 columns no-pad">
                                    {ATTACH_ZONE}
                                </div>
                                <div class="small-4 large-3 columns">
                                    <a class='button icon-link sstream-attachment' data-value='url'>Link</a>
                                </div>
                            </div>
                            <div class="row post-attachment url" style="display:none">
                                <div class="small-8 large-9 columns">
                                    <label>
                                        <input type='text' class='url' name='url' maxlength='1024' placeholder="http://" />
                                    </label>
                                </div>
                                <div class="small-4 large-3 columns">
                                    <a class='button icon-attach sstream-attachment' data-value='attach'>Attach</a>
                                </div>
                            </div>
                        </form>
                        <a class="close-reveal-modal" aria-label="Close">&#215;</a>
                    </div>
                    <!-- END socialstream_has_newpost -->
                </div>

                <div data-socialstream-browser></div>

                <div id='socialstream-{COMPONENT_INSTANCE_ID}'>
                    <ul class='information-list social-stream' data-socialstream-threads>
                        <li>
                            <div data-loader class="loader"></div>
                        </li>
                    </ul>

                    <div class="content">
                        <a class="button icon-comment" data-socialstream-view-more>Load More</a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
