<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>RSS Feed - {RSS_NAME}</h2>
    {CONFIGURATION}
    <div class="listing">
        <ul>
            <!-- BEGIN rss_stories -->
            <li class="clearfix {ON_OFF}">
                <div class="clearfix">
                    <h4><a href="/redir.php?url={RSS_URL}">{RSS_TITLE}</a></h4>
                    <div class="{COMPONENT_COMPACTMODE} small-right">
                        <!-- BEGIN rss_date -->
                        <p class="small summ">Posted {RSS_POSTED_DATE}</p>
                        <!-- END rss_date -->
                    </div>
                </div>
                <div class='{COMPONENT_COMPACTMODE}'>
                    <p class="summ hide-on-small">{RSS_BRIEF}</p>
                </div>
            </li>
            <!-- END rss_stories -->
        </ul>
    </div>
</div>
