<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-rss"></i>

                <!-- BEGIN empty_config -->
                <p>To use the RSS component you must first <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">enter a URL for the RSS feed</a>.</p>
                <!-- END empty_config -->

                <!-- BEGIN empty_results -->
                <p>No feed found.</p>
                <!-- END empty_results -->

                <!-- BEGIN empty_results_write -->
                <p>No feed has been found with the URL provided. Try <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">setting a different URL</a>.</p>
                <!-- END empty_results_write -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN rss -->
            <section>
                <ul class="action-list">
                    <!-- BEGIN rss_stories -->
                    <li>
                        <div class="list-item">
                            <div class="card small-12">
                                <h3><a href="/redir.php?url={RSS_URL}">{RSS_TITLE}</a></h3>
                                <!-- BEGIN rss_date -->
                                <p class="meta">Posted {RSS_POSTED_DATE}</p>
                                <!-- END rss_date -->
                            </div>
                        </div>
                        <!-- BEGIN rss_brief_output -->
                        <article>{RSS_BRIEF}</article>
                        <!-- END rss_brief_output -->
                    </li>
                    <!-- END rss_stories -->
                </ul>
            </section>
            <!-- END rss -->

        </div>
    </div>
</div>
