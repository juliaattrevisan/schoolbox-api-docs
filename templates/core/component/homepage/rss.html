<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-rss"></i>

                <!-- BEGIN empty_config -->
                <p><a href="#" class="edit empty-edit" data-target="settings" data-state="closed">Enter a URL for an RSS feed</a> to display a summary of frequently published information from the source.</p>
                <!-- END empty_config -->

                <!-- BEGIN empty_invalid -->
                <p>We couldn't find a feed with the URL provided. Try <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">checking your URL is correct</a> or <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">entering a different URL</a>.</p>
                <!-- END empty_invalid -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_feed -->
            <section>
                <ul class="action-list">
                    <!-- BEGIN rss_stories -->
                    <li>
                        <div class="list-item">
                            <div class="card small-12">
                                <h3><a href="/redir.php?url={RSS_URL}" target="_blank">{RSS_TITLE}</a></h3>
                                <!-- BEGIN rss_date -->
                                <p class="meta">Posted {RSS_POSTED_DATE}</p>
                                <!-- END rss_date -->
                            </div>
                        </div>
                        <!-- BEGIN rss_brief_output -->
                        <article>{RSS_BRIEF}</article>
                        <!-- END rss_brief_output -->
                    </li>
                    <!-- END rss_stories -->
                </ul>
            </section>
            <!-- END has_feed -->

        </div>
    </div>
</div>
