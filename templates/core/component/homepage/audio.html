<!-- BEGIN custom_head -->
<script type="text/javascript">
function loadSWF(audioID, url){
	var flashvars = {
		filename: url
	};
	var params = {
		movie: "/flash/player_mp3.swf",
		wmode: "transparent"
	};
	swfobject.embedSWF("/flash/mp3small.swf", "audio-player-"+audioID, "22", "22", "9.0.0", "/flash/expressInstall.swf", flashvars, params);
}
</script>
<!-- END custom_head -->

<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<h2>Audio</h2>
	{CONFIGURATION}
	<ul class="information-list">
		<!-- BEGIN audio_list -->
		<li class="{ON_OFF}">
			<div class="play-button actions">
				<div id="audio-player-{AUDIO_ID}"><a onclick="loadSWF({AUDIO_ID}, '{AUDIO_URL}'); return false;"></a></div>
			</div>

			<h4><a class="icons {AUDIO_MIME_IMAGE}" href="{AUDIO_URL}">{AUDIO_DESCRIPTION}</a></h4>

			<p class="{COMPONENT_COMPACTMODE}">{AUDIO_COMMENT}</p>
		</li>
		<!-- END audio_list -->
	</ul>
	<!-- BEGIN submit_file -->
	<p class="interact">
		<a href="/cms/file/new/{ID}" class="btn up-arrow"><span></span>Post File</a>
	</p>
	<!-- END submit_file -->
</div>
