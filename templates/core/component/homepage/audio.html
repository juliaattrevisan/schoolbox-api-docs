<div id="component{COMPONENT_INSTANCE_ID}" data-component>
    <link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet" property="stylesheet">
    <script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
    <script src="/javascript/shared/jquery.media-playlist.js"></script>
    <script type="text/javascript">
        $(function() {
            $('#component{COMPONENT_INSTANCE_ID}').mediaPlaylist();
            $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                wrapClass: 'dragging',
                previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                dictDefaultMessage: 'You can drag audio files into this space.',
                refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                tplWrap: '<li class="dz-preview" />',
                addedfile: function (file) {
                    $(file.previewElement).addClass('category-{ID}').data('node', {ID});
                },
                sending: function (file, xhr, formData) {
                    formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                    formData.append('category', $(file.previewElement).data('node'));
                    formData.append('comment', '');
                    formData.append('hidden', 0);
                },
                complete: function (file) {
                    $(file.previewElement).find('img').remove();
                },
                error: function (file, response) {
                    $(file.previewElement).removeClass('dz-processing').find('[data-dz-status]').text(response.error);
                }
            });
        });
    </script>

	{CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN default_audio -->
                <div class="content">
                    <h3 class="mejs-player-title" data-role="media-playlist-title">{DEFAULT_AUDIO_TITLE}</h3>
                </div>
                <audio id="schoolbox_audio{COMPONENT_INSTANCE_ID}"
                       data-role="media-playlist-player"
                       controls
                       preload="none"
                       width="100%">
                    <source src="/cms/sendVideo.php?type=sbfs&id={DEFAULT_AUDIO_ID}" type="audio/mpeg" />
                </audio>
                <!-- END default_audio -->

                <div data-dz-wrap class="dropzone-wrap">
                    <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="audio"></form>
                    <ul data-dz-template class="hide">
                        <li>
                            <div class="avatar card small-12">
                                <div class="icon-audio icon-32"></div>
                                <h3 data-dz-name></h3>
                                <p class="meta" data-dz-status>Uploading...</p>
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </div>
                        </li>
                    </ul>
                    <ul data-dz-container class="action-list">
                        <!-- BEGIN audio_list -->
                        <li>
                            <div class="avatar card small-12" >
                                <a href="/cms/sendVideo.php?type=sbfs&id={AUDIO_LIST_ID}" data-role="media-playlist-track">
                                    <div class="icon-audio icon-32"></div>
                                    <h3>{AUDIO_LIST_TITLE}</h3>
                                </a>

                                <p class="meta">
                                    ({AUDIO_LIST_DURATION}) Posted by <a href="/search/user/{AUDIO_LIST_POSTER_ID}">{AUDIO_LIST_POSTER}</a>
                                </p>
                            </div>
                            <article class="{COMPONENT_COMPACTMODE}">
                                <p>{AUDIO_LIST_COMMENT}</p>
                            </article>
                        </li>
                        <!-- END audio_list -->

                        <!-- BEGIN audio_pending_list -->
                        <li>
                            <div class="avatar card small-12" >
                                <img src="{AUDIO_LIST_STATUSIMG}" title="Currently transcoding {AUDIO_LIST_TITLE}" />
                                <h3>{AUDIO_LIST_TITLE}</h3>
                                <p class="meta">Posted by <a href="/search/user/{AUDIO_LIST_POSTER_ID}">{AUDIO_LIST_POSTER}</a></p>
                            </div>
                            <article class="{COMPONENT_COMPACTMODE}">
                                <p>{AUDIO_LIST_COMMENT}</p>
                            </article>
                        </li>
                        <!-- END audio_pending_list -->
                    </ul>
                </div>
                <!-- BEGIN submit_file -->
                <div class="content">
                    <a href="/cms/file/new/{ID}" class="button icon-upload">Post Audio File</a>
                </div>
                <!-- END submit_file -->
            </section>
        </div>
    </div>
</div>
