<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <ul class="action-list">
                    <!-- BEGIN folders -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="compact card small-12">
                                <a href="/homepage/{FOLDER_ID}/">
                                    <div class="icon-{FOLDER_ICON}"></div>
                                    <h3>{FOLDER_NAME}</h3>
                                </a>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_folder -->
                            <a class="icon-modify" href="/resource/folder/modify/{FOLDER_ID}" title="Modify"></a>
                            <!-- END modify_folder -->
                        </nav>
                    </li>
                    <!-- END folders -->
                </ul>
                <!-- BEGIN submit_folder -->
                <div class="component-action">
                    <section>
                        <a href="/resource/folder/create/{FOLDER_CAT_ID}" class="button">Add Folder</a>
                    </section>
                </div>
                <!-- END submit_folder -->
                <!-- END source_folder_exists -->
            </section>
        </div>
    </div>
</div>
