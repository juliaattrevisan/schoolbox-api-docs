<div id='component{COMPONENT_INSTANCE_ID}' data-component>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN folders -->
                    <li class="row" data-equalizer>
                        <div class="one-column">
                            <img src="/images/icons/60x60/{FOLDER_ICON}.png" />
                        </div>
                        <div class="ten-column" data-equalizer-watch>
                            <h3>
                                <a href="/homepage/{FOLDER_ID}/">{FOLDER_NAME}</a>
                            </h3>
                        </div>
                        <div class="one actions">
                            <!-- BEGIN modify_folder -->
                            <a class="icon-modify no-text" href="/cms/category/{FOLDER_ID}" title="Modify"></a>
                            <!-- END modify_folder -->
                        </div>
                    </li>
                    <!-- END folders -->
                </ul>

                <div class="content">
                    <!-- BEGIN submit_folder -->
                    <a href="/cms/category/new/{FOLDER_CAT_ID}" class="button icon-add">Add Folder</a>
                    <!-- END submit_folder -->
                </div>
            </section>
        </div>
    </div>
</div>
