<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN folders -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="small avatar card small-12">
                                <a href="/homepage/{FOLDER_ID}/">
                                    <div class="icon-{FOLDER_ICON} icon-24"></div>
                                    <h3>{FOLDER_NAME}</h3>
                                </a>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_folder -->
                            <a class="icon-modify" href="/cms/category/{FOLDER_ID}" title="Modify"></a>
                            <!-- END modify_folder -->
                        </nav>
                    </li>
                    <!-- END folders -->
                </ul>

                <div class="content">
                    <!-- BEGIN submit_folder -->
                    <a href="/cms/category/new/{FOLDER_CAT_ID}" class="button icon-add">Add Folder</a>
                    <!-- END submit_folder -->
                </div>
            </section>
        </div>
    </div>
</div>
