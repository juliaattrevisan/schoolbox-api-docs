<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-folder"></i>

                <!-- BEGIN empty_read -->
                <p>There are no folders to display at this time.</p>
                <!-- END empty_read -->

                <!-- BEGIN empty_write -->
                <p><a href="/resource/folder/{FOLDER_CAT_ID}/create">Add a folder or page</a> underneath this page to organise related content.</p>
                <!-- END empty_write -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_folder -->
            <section>

                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->

                    <!-- BEGIN grid_view -->
                        <!-- BEGIN grid_folders -->
                        <div class="columns small-6 medium-6 large-4 left">
                            <div class="row">
                                <div class="card-new small-12">
                                    <a href="/homepage/{FOLDER_ID}">
                                        <div class="card-feature-image" style="background-color:{FOLDER_COLOUR}; border-bottom: 10px solid {FOLDER_COLOUR}; {FOLDER_COVER_IMAGE}"></div>
                                    </a>
                                    <div class="card-content actions-small-1">
                                        <div class="list-item">
                                            <h3><a href="/homepage/{FOLDER_ID}" title="{FOLDER_NAME}">{FOLDER_NAME}</a></h3>
                                        </div>

                                        <!-- BEGIN modify_folder -->
                                        <nav>
                                            <a class="icon-modify" href="/resource/folder/{FOLDER_ID}/modify" title="Modify"></a>
                                        </nav>
                                        <!-- END modify_folder -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- END grid_folders -->
                    <!-- END grid_view -->

                    <!-- BEGIN list_view -->
                        <ul class="action-list">
                            <!-- BEGIN list_folders -->
                            <li class="actions-small-1">
                                <div class="list-item">
                                    <div class="compact card small-12">
                                        <a href="/homepage/{FOLDER_ID}/" title="{FOLDER_NAME}">
                                            <div class="icon-{FOLDER_ICON}"></div>
                                            <h3>{FOLDER_NAME}</h3>
                                        </a>
                                    </div>
                                </div>
                                <nav>
                                    <!-- BEGIN modify_folder -->
                                    <a class="icon-modify" href="/resource/folder/{FOLDER_ID}/modify" title="Modify"></a>
                                    <!-- END modify_folder -->
                                </nav>
                            </li>
                            <!-- END list_folders -->
                        </ul>
                    <!-- END list_view -->

                    <!-- BEGIN submit_folder -->
                    <div class="columns">
                        <div class="row">
                            <div class="component-action">
                                <section>
                                    <a href="/resource/folder/{FOLDER_CAT_ID}/create" class="button">Add Folder</a>
                                </section>
                            </div>
                        </div>
                    </div>
                    <!-- END submit_folder -->

                <!-- END source_folder_exists -->

            </section>
            <!-- END has_folder -->

        </div>
    </div>
</div>
