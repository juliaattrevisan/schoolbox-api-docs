<div id='component{COMPONENT_INSTANCE_ID}' class="component-container {COMPONENT_CLASS} course_task_list" data-component>
    <script type="text/javascript" src="/javascript/shared/course/jquery.course-builder.js"></script>
    <script type='text/javascript' src='/javascript/resource/jquery.resourceAttach.js'></script>
    <script type="text/javascript">
        // Addition of an AJAX form submission - need to add here because
        // the session name and ID have to be passed.
        (function($) {
            $(function() {

                var component = $('#component{COMPONENT_INSTANCE_ID}');

                component.setupCourseBuilder({
                    units:            {UNIT_LIST},
                    previewSelector: '[data-plugin=preview]'
                });

            });
        })(jQuery);
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul class="breadcrumb">
                        <!-- BEGIN category_breadcrumb -->
                        <li>
                            <a href="/homepage/{PARENT_CATEGORY_ID}/">{PARENT_CATEGORY_NAME}</a>
                        </li>
                        <!-- END category_breadcrumb -->
                    </ul>
                </div>

                <ul class="information-list sortable" data-task_list>
                    <!-- BEGIN task -->{TASK_ITEM}<!-- END task -->
                </ul>

                <div class="content">
                    <ul class="flex-list buttons">
                        <li><a href="/task/create/{ID}" class="button icon-task" data-reveal-id="createTask-component{COMPONENT_INSTANCE_ID}">New Task</a></li>
                        <li><a href="/submission/createSubmission/new/{ID}/task?return_url={RETURN_URL}" class="button icon-due-work">New Due Work</a></li>
                        <li><a href="/assess/create/{ID}/task?return_url={RETURN_URL}" class="button icon-quiz">New Quiz</a></li>
                    </ul>
                </div>

                <!-- This is the form for inline creation of tasks -->
                {CREATE_MODAL}
            </section>
        </div>

        <!-- Form for reodering tasks -->
        <div class="hide">
            <form action="/task/saveForm.php" method="post" data-interaction="reorder-tasks">
                <input type="hidden" name="action"    value="reorder"/>
                <input type="hidden" name="category"  value="{ID}"/>
                <input type="hidden" name="component" value="{COMPONENT_INSTANCE_ID}"/>
                <input type="hidden" name="return_url" value="{RETURN_URL}"/>
            </form>
        </div>

        <!-- Dialog for resource browser -->
        <div class="resource_browser hide">
        </div>

        <!--
            Dialog for asking:
            When adding a new task - does it get copied into classes that use this unit?
        -->
        <div class="reveal-modal" data-reveal role="dialog" data-interaction="copy_task_dialog">
            <h2>This unit is in use by one or more classes</h2>
            <p>Do you want to add this task to the classes which are currently using this unit?</p>
            <a href="#" class="button submit" data-action="copy_task">Yes</a>
            <a href="#" class="button" data-action="no_copy_task">No</a>
            <a href="#" class="button" data-action="cancel">Don't create task</a>
        </div>
    </div>
</div>
