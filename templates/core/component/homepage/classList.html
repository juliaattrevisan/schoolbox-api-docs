<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="grid small-block-grid-1 {GRID_VIEW_CLASSES}">
                    <!-- BEGIN person -->
                    <li>
                        <div class="avatar card small-12">
                            <a href="/search/user/{PERSON_UID}" title="View Profile">
                                <!-- BEGIN has_thumbnail -->
                                <img src="/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                <!-- END has_thumbnail -->
                                <!-- BEGIN has_icon -->
                                <img src="/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                <!-- END has_icon -->

                                <p>{PERSON_NAME}</p>
                            </a>
                            <p class="meta">{PERSON_GROUP}</p>
                        </div>
                    </li>
                    <!-- END person -->
                </ul>

                <div class="content">
                    <ul class="inline-list">
                        <!-- BEGIN student_email -->
                        <li>
                            <form action="/mail/createMail.php" method="post" name="form2">
                                <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
                                <input type="hidden" name="bcc" value="{EMAIL_ALL_STUDENTS}"/>
                                <input type="submit" value="Email Students" />
                            </form>
                        </li>
                        <!-- END student_email -->

                        <!-- BEGIN parent_email -->
                        <li>
                            <form action="/mail/createMail.php" method="post" name="form2">
                                <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
                                <input type="hidden" name="bcc" value="{EMAIL_ALL_PARENTS}"/>
                                <input type="submit" value="Email Parents" />
                            </form>
                        </li>
                        <!-- END parent_email -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
