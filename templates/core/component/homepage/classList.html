<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-group"></i>
                <p>No students in this class</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN class_list -->
            <section>
                <ul class="grid small-block-grid-1 {GRID_VIEW_CLASSES}">
                    <!-- BEGIN person -->
                    <li>
                        <div class="card small-12">
                            <a href="/search/user/{PERSON_UID}" title="View Profile">
                                <!-- BEGIN has_thumbnail -->
                                <img src="/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                <!-- END has_thumbnail -->
                                <!-- BEGIN has_icon -->
                                <img src="/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                <!-- END has_icon -->

                                <p>{PERSON_NAME}</p>
                            </a>
                            <p class="meta">{PERSON_GROUP}</p>
                        </div>
                    </li>
                    <!-- END person -->
                </ul>


                <div class="component-action">
                    <section>
                        <!-- BEGIN student_email -->
                            <form id='form-students' action="/mail/createMail.php" method="post" class="no-margin">
                                <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
                                <input type="hidden" name="bcc" value="{EMAIL_ALL_STUDENTS}"/>
                            </form>
                            <script>
                                $(function() {
                                    $('[data-students-email]').click(function() {
                                        $('#form-students').submit();
                                    });
                                })
                            </script>
                            <a href="#" data-students-email class="button">Email Students</a>
                        <!-- END student_email -->
                        <!-- BEGIN parent_email -->
                            <a href="#" data-parents-email class="button">Email Parents</a>
                            <form id='form-parents' action="/mail/createMail.php" method="post" class="no-margin">
                                <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
                                <input type="hidden" name="bcc" value="{EMAIL_ALL_PARENTS}"/>
                            </form>
                        <script>
                            $(function() {
                                $('[data-parents-email]').click(function() {
                                    $('#form-parents').submit();
                                });
                            })
                        </script>
                        <!-- END parent_email -->
                    </section>
                </div>
            </section>
            <!-- END class_list -->

        </div>
    </div>
</div>
