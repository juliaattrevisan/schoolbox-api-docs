<div id="component{COMPONENT_INSTANCE_ID}" data-component>
    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">
            <section>
                <ul class="action-list">
                    <!-- BEGIN assess -->
                    <li class="actions-small-4" data-equalizer>
                        <div class="list-item">
                            <div class="small-12 info card">
                                <!-- BEGIN assessLink -->
                                <h3><a href="/assess/intro/{ASSESS_ASSESS_ID}">{ASSESS_TITLE}</a></h3>
                                <!-- END assessLink -->

                                <!-- BEGIN resumeLink -->
                                <h3><a href="/assess/attempt/{ASSESS_ASSESS_ID}/{ASSESS_SECTION_ID}">{ASSESS_TITLE}</a></h3>
                                <!-- END resumeLink -->

                                <!-- BEGIN assessNoLink -->
                                <h3>{ASSESS_TITLE}</h3>
                                <!-- END assessNoLink -->

                                <!-- BEGIN assessDue -->
                                <p class="meta">
                                    <span class="gradient-{ASSESS_FINISH_URGENCY}">Due {ASSESS_FINISH_RELATIVE_DATE}</span>
                                    <!-- BEGIN assess_finish_date -->
                                    on {ASSESS_FINISH_DATE}
                                    <!-- END assess_finish_date -->
                                </p>
                                <!-- END assessDue -->

                                <p class="list-item-content {COMPONENT_COMPACTMODE}">
                                    Created by <a href='/search/user/{ASSESS_USER_ID}'>{ASSESS_USER_FIRSTNAME} {ASSESS_USER_LASTNAME}</a>
                                    {ASSESS_CREATED}
                                </p>
                            </div>

                            <article class="{COMPONENT_COMPACTMODE}">{ASSESS_DESCRIPTION}</article>
                        </div>
                        <nav>
                            <!-- BEGIN teacherLink -->
                            <a data-equalizer-watch class="icon-delete" href="/assess/delete/{ASSESS_ASSESS_ID}" title="Delete Quiz"></a>
                            <a data-equalizer-watch class="icon-modify" href="/assess/modify/{ASSESS_ASSESS_ID}" title="Modify Quiz"></a>
                            <!-- END teacherLink -->

                            <!-- BEGIN resultLink -->
                            <a data-equalizer-watch class="icon-poll" href="/assess/results/{ASSESS_ASSESS_ID}" title="View Results"></a>
                            <!-- END resultLink -->

                            <!-- BEGIN has_previous_attempts -->
                            <a data-equalizer-watch class="icon-list" href="/assess/attempts/{ASSESS_ASSESS_ID}/{ASSESS_RESPONDENT_ID}" title="See previous attempts"></a>
                            <!-- END has_previous_attempts -->
                        </nav>
                    </li>
                    <!-- END assess -->
                </ul>
                <div class="content">
                    <!-- BEGIN createAssessment -->
                    <a href="/assess/create/{ID}" class="button icon-add">Create Quiz</a>
                    <!-- END createAssessment -->
                </div>
            </section>
        </div>
    </div>
</div>
