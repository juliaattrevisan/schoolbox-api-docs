<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<style type='text/css'>

		.socialstream ul li.socialstream-post {
			border-top: 1px solid #eee;
			border-bottom: 1px solid #eee;
			padding: 20px 0px;
		}

		.socialstream ul li {
			margin-left: 24px;
		}

		.socialstream div.avatar {
			width: 32px;
			margin-right: 8px;
			float: left;
		}

		.socialstream div.body {
			float: left;
		}

		.socialstream div.body span {
			color: #aaa;
		}

		.socialstream li.socialstream-post div.body {
			/*border: 1px solid #f00;*/
		}

		.socialstream li.socialstream-comment div.body {
			/*border: 1px solid #0f0;*/
		}

		.socialstream li.socialstream-reply div.body {
			/*border: 1px solid #00f;*/
		}

		.socialstream .addPostLink {
			border-left: 1px solid #aaa;
			padding-left: 6px;
			margin-left: 4px;
		}
	</style>

	<!-- BEGIN has_comments_javascript -->
	<script type='text/javascript'>
		$j(function() {

			/* Ajax in first threads
			 */
			$j.get('/socialstream/threads.php?instanceId={COMPONENT_INSTANCE_ID}&limit={SOCIALSTREAM_AJAX_LIMIT}', function(responseText) {
				$j('div.socialstream').append(responseText);
			});

			$j('.socialstream').find('.addPostLink').click(function() {

				/* Clear out all instances of .addPostForm in the socialstream
				 */
				$j('.socialstream').find('.addPostForm').remove();

				/* Get the ids for this node
				 */
				var parentId = $j(this).attr('data-parentid');
				var rootId = $j(this).attr('data-rootid');

				/* Clone an instance of .addPostForm and inject ids
				 */
				var clone = $j('#originalAddPostForm').clone();
				clone.attr('id', '');
				clone.find('input[name=body]').val('').focus();
				clone.find('input[name=parentId]').val(parentId);
				clone.find('input[name=rootId]').val(rootId);

				/* Send In The Clones
				 */
				$j(this).parent('p').append(clone);
			});
		});
	</script>
	<!-- END has_comments_javascript -->

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div class='{FORM_CLASS}'>
		<form action='/socialstream/modifyForm.php' method='post' id='originalAddPostForm' class='addPostForm'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />

			<input type='text' name='body' maxlength='255' value='' />
			<input type='submit' value='Post' />
		</form>
	</div>

	<div class='socialstream'>
	</div>
</div>
