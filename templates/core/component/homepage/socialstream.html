<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<style type='text/css'>

		.socialstream ul li.socialstream-post {
			border-top: 1px solid #eee;
			border-bottom: 1px solid #eee;
			padding: 20px 0px;
		}

		.socialstream ul li {
			margin-left: 24px;
		}

		.socialstream div.avatar {
			width: 32px;
			margin-right: 8px;
			float: left;
		}

		.socialstream div.body {
			float: left;
		}

		.socialstream div.body span {
			color: #aaa;
		}

		.socialstream li.socialstream-post div.body {
			/*border: 1px solid #f00;*/
		}

		.socialstream li.socialstream-comment div.body {
			/*border: 1px solid #0f0;*/
		}

		.socialstream li.socialstream-reply div.body {
			/*border: 1px solid #00f;*/
		}

		.socialstream .addPostLink {
			border-left: 1px solid #aaa;
			padding-left: 6px;
			margin-left: 4px;
		}

		.socialstream .loading {
			background-color: #f00;
			text-align: center;
			font-weight: bold;
			color: #fff;
			padding: 20px;
		}
	</style>

	<script type='text/javascript' src='/javascript/socialstream.js'></script>
	<script type='text/javascript'>
		$j(function() {
			socialstream.init('{COMPONENT_INSTANCE_ID}', 0, '{SOCIALSTREAM_AJAX_LIMIT}', '{SOCIALSTREAM_NUM_POSTS}');
			socialstream.stream();
		});
	</script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<div class='{FORM_CLASS}'>
		<form action='/socialstream/modifyForm.php' method='post' id='originalAddPostForm' class='addPostForm'>
			<input type='hidden' name='type' value='string' />
			<input type='hidden' name='instanceId' value='{COMPONENT_INSTANCE_ID}' />
			<input type='hidden' name='homepageId' value='{HOMEPAGE_ID}'/>
			<input type='hidden' name='parentId' value='0' />
			<input type='hidden' name='rootId' value='0' />

			<label>
				Body: <input type='text' name='body' maxlength='255' value='' />
			</label>
			<label>
				URL: <input type='text' name='url' maxlength='255' value='' />
			</label>

			<input type='submit' value='Post' />
		</form>
	</div>

	<div class='socialstream'>
		<div class='loading'>
			Loading stream
		</div>
	</div>

	<div>
		<p>
			<a class='socialstreamViewMore'>View More</a>
		</p>
	</div>
</div>
