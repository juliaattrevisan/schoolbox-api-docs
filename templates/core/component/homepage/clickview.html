<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <script type="text/javascript" src="//static.clickview.com.au/cv-events-api/1.0.1/cv-events-api.min.js?v={SITE_VERSION}"></script>
    <script type="text/javascript">
        $(function() {
            $('#plugin{COMPONENT_INSTANCE_ID}').on('opened.fndtn.reveal', function() {
                let clickviewModalUrl = '//{CLICKVIEW_URL}/v3/plugins/base?consumerKey=79fph239f0b7&sizeSelector=false&schoolId={CLICKVIEW_SCHOOL_ID}';
                let clickviewFrameId = 'plugin-frame{COMPONENT_INSTANCE_ID}';
                let clickviewFrame = $('#' + clickviewFrameId);
                let self = $(this);

                /* Update loader and frame
                 */
                $('#plugin-loader{COMPONENT_INSTANCE_ID}').show();

                $(clickviewFrame).css({
                    'display': 'none',
                    'height': 0
                });

                /* Load iframe src on demand, but only do it once
                 */
                if (clickviewFrame.attr('src') === '' || clickviewFrame.attr('src') === undefined) {
                    clickviewFrame.attr('src', clickviewModalUrl);
                }

                // Use the ClickView Events API to catch the cv-lms-addvideo event
                let eventsApi = new CVEventsApi(document.getElementById(clickviewFrameId).contentWindow);
                eventsApi.on("cv-lms-addvideo", function (event, args) {
                    $('#videohere{COMPONENT_INSTANCE_ID}').html('<div class="flex-video widescreen">' + args.embedHtml + '</div>').removeClass('hide');
                    $('#videohere{COMPONENT_INSTANCE_ID}').children('iframe');
                    $('#clickview-empty-state-{COMPONENT_INSTANCE_ID}').addClass('hide');

                    $.ajax({
                        url: '/homepage/configForm.php',
                        type: 'POST',
                        data: { cid: '{ID}',
                            type: 'config',
                            component: '{COMPONENT_INSTANCE_ID}',
                            url: args.embedLink
                        }
                    });

                    $('#component{COMPONENT_INSTANCE_ID}').find("input[name~='url']").val(args.embedLink);

                    /* Clear all handlers for this
                     */
                    let eventsApi = new CVEventsApi(document.getElementById(clickviewFrameId).contentWindow);
                    eventsApi.off('cv-lms-addvideo');

                    self.foundation('reveal', 'close');
                });
            });

            $('#plugin-frame{COMPONENT_INSTANCE_ID}').on('load', function() {
                let clickviewFrameHeight = 401;

                /* Update loader and frame
                 */
                $('#plugin-loader{COMPONENT_INSTANCE_ID}').hide();

                $(this).css({
                    'display': 'block',
                    'height': clickviewFrameHeight
                });
            });

            $('#plugin{COMPONENT_INSTANCE_ID}').on('closed.fndtn.reveal', function() {
                let clickviewFrameId = 'plugin-frame{COMPONENT_INSTANCE_ID}';
                let clickviewFrame = $('#' + clickviewFrameId);

                /* Update loader and frame
                 */
                $('#plugin-loader{COMPONENT_INSTANCE_ID}').show();

                $(clickviewFrame).css({
                    'display': 'none',
                    'height': 0
                });

                /* Clear all handlers for this
                 */
                let eventsApi = new CVEventsApi(document.getElementById(clickviewFrameId).contentWindow);
                eventsApi.off('cv-lms-addvideo');
            });
        })
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div id="clickview-empty-state-{COMPONENT_INSTANCE_ID}" class="empty-state">
                <i class="icon-click-view"></i>

                <!-- BEGIN empty_config -->
                <p><a href="#" id="videoadd{COMPONENT_INSTANCE_ID}" data-reveal-id="plugin{COMPONENT_INSTANCE_ID}">Choose a ClickView video</a> to display and play in this component.</p>
                <!-- END empty_config -->

                <!-- BEGIN empty_invalid -->
                <p>We couldn't find a ClickView video with the URL provided. Try <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">checking your URL is correct</a> or <a href="#" id="videoadd{COMPONENT_INSTANCE_ID}" data-reveal-id="plugin{COMPONENT_INSTANCE_ID}">selecting the video</a> again.</p>
                <!-- END empty_invalid -->
            </div>
            <!-- END empty_state -->

            <section>
                <div id="videohere{COMPONENT_INSTANCE_ID}" class="{HIDE_CLICKVIEW}">
                    <!-- BEGIN has_clickview -->
                        <script type='text/javascript' src="//webplayer.clickview.com.au/e.aspx?p={VIDEO_ID}"></script>
                    <!-- END has_clickview -->
                    <!-- BEGIN online_clickview -->
                        <script type="text/javascript" src="//{CLICKVIEW_URL}/scripts/cv-online.view_player_embedding.js?e=1&i={VIDEO_ID}"></script>
                    <!-- END online_clickview -->
                    <!-- BEGIN iframe_clickview -->
                        <div class="flex-video widescreen">
                            <iframe frameborder="0" allowfullscreen webkitallowfullscreen mozallowfullscreen width="640" height="360" src="//{CLICKVIEW_URL}"></iframe>
                        </div>
                    <!-- END iframe_clickview -->
                </div>
            </section>
        </div>
    </div>

    <div id="plugin{COMPONENT_INSTANCE_ID}" class="reveal-modal" data-reveal aria-hidden="true" role="dialog">
        <section class="content" id="plugin-loader{COMPONENT_INSTANCE_ID}"><div class="loader"></div></section>
        <iframe frameborder="0" id="plugin-frame{COMPONENT_INSTANCE_ID}" width="100%" style="border: 0; display:none"></iframe>
    </div>
</div>
