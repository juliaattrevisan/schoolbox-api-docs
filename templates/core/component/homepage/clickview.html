<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <script type="text/javascript" src="//az523909.vo.msecnd.net/cv-events-api/1.0.0/cv-events-api.min.js"></script>
    <script type="text/javascript">
        $(function() {
            var dialog = $('#plugin{COMPONENT_INSTANCE_ID}');
            dialog.on('opened.fndtn.reveal', function() {

                // Use the ClickView Events API to catch the cv-lms-addvideo event
                var eventsApi = new CVEventsApi(document.getElementById('plugin-frame{COMPONENT_INSTANCE_ID}').contentWindow);
                eventsApi.on("cv-lms-addvideo", function (event, args) {
                    $('#videohere{COMPONENT_INSTANCE_ID}').html(args.embedHtml);
                    $('#videohere{COMPONENT_INSTANCE_ID}').children('iframe').width('100%');

                    $.ajax({
                        url: '/homepage/configForm.php',
                        type: 'GET',
                        data: { cid: '{ID}',
                            type: 'config',
                            component: '{COMPONENT_INSTANCE_ID}',
                            url: args.embedLink
                        }
                    });

                    dialog.foundation('reveal', 'close');
                    //The plugin should be reinitialised to be used again, to do this simply reload the iframe.
                    $('#plugin-frame{COMPONENT_INSTANCE_ID}').attr('src', $('#plugin-frame{COMPONENT_INSTANCE_ID}').attr('src'));

                    // We are done with this listener
                    eventsApi.off("cv-lms-addvideo");
                });
            });
        })
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="flex-video widescreen" id="videohere{COMPONENT_INSTANCE_ID}">
                    <!-- BEGIN has_clickview -->
                    <script type='text/javascript' src="//webplayer.clickview.com.au/e.aspx?p={VIDEO_ID}"></script>
                    <!-- END has_clickview -->
                    <!-- BEGIN online_clickview -->
                    <script type="text/javascript" src="//online.clickview.com.au/scripts/cv-online.view_player_embedding.js?e=1&i={VIDEO_ID}"></script>
                    <!-- END online_clickview -->
                    <!-- BEGIN iframe_clickview -->
                    <iframe frameborder="0" allowfullscreen webkitallowfullscreen mozallowfullscreen width="600" height="338" src="//online.clickview.com.au/Share/PlayEmbed?shareCode={VIDEO_ID}&a=false"></iframe>
                    <!-- END iframe_clickview -->
                </div>
                <div class="content">
                    <!-- BEGIN select_video -->
                    <a href="#" class="button icon-add" id="videoadd{COMPONENT_INSTANCE_ID}" data-reveal-id="plugin{COMPONENT_INSTANCE_ID}">Select Video</a>
                    <!-- END select_video -->
                </div>
            </section>
        </div>
    </div>

    <div id="plugin{COMPONENT_INSTANCE_ID}" class="reveal-modal" data-reveal aria-hidden="true" role="dialog">
        <iframe frameborder="0" id="plugin-frame{COMPONENT_INSTANCE_ID}" src="//online.clickview.com.au/v3/plugins/base?consumerKey=79fph239f0b7&sizeSelector=false&amp;schoolId={CLICKVIEW_SCHOOL_ID}" width="100%" height="401" style="border: 0;"></iframe>
    </div>
</div>
