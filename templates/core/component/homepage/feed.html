<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>Homepage Feed</h2>
    {CONFIGURATION}
    <div class="listing long">
        <ul>
            <!-- BEGIN feed -->
            <li class="{ON_OFF} clearfix">
                <h4>{FEED_MESSAGE}</h4>

            <!-- END feed -->
        </ul>

    </div>
</div>
