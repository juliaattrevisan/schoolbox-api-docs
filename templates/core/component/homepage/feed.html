<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component>
    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-homepagefeed"></i>
                <p>There is no activity to view at this time.</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_activity -->
            <section>
                <ul class="information-list">
                    <!-- BEGIN event -->
                    <li class="row">
                        <div class="card small-12 wrap-down">
                            <a href="{EVENT_HREF}">
                                <img src="{EVENT_ICON}" alt="" />
                            </a>
                            <p>{EVENT_BODY}</p>
                            <p class="meta">
                                <time title="{EVENT_LONGTIME}">{EVENT_TIME}</time>
                            </p>
                        </div>
                    </li>
                    <!-- END event -->
                </ul>
            </section>
            <!-- END has_activity -->
            
        </div>
    </div>
</div>
