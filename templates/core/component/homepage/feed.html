<div id="component{COMPONENT_INSTANCE_ID}" class="component-container" data-component>
    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">
            <section>
                <ul class="information-list">
                    <!-- BEGIN event -->
                    <li class="row">
                        <div class="columns small-12 no-pad">
                            <div class="avatar card wrap-down">
                                <a href="{EVENT_HREF}">
                                    <img src="{EVENT_ICON}" alt="" />
                                </a>
                                <h3>{EVENT_BODY}</h3>
                                <p class="meta">
                                    <time title="{EVENT_LONGTIME}">{EVENT_TIME}</time>
                                </p>
                            </div>
                        </div>
                    </li>
                    <!-- END event -->
                </ul>
            </section>
        </div>
    </div>
</div>
