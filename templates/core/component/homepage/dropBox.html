<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
    <script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
    <script type="text/javascript">
        $(function() {
            $('input[type=file].pretty-file-input').prettyFileInput({
                additionalButtonClasses: 'no-marg float-left',
                buttonActiveClass: 'tick',
                defaultText: '<span></span>Choose file',
                defaultFileSelectedText: '<span></span>File selected'
            });

            $('.dropBox').validate();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN drop_student -->
                <form action="/subject/modDropBox.php" method="post" enctype="multipart/form-data" class="dropBox" >
                    <input type="hidden" name="category" value="{ID}" />

                    <!-- BEGIN drop_success -->
                    <fieldset>
                        <p>File upload completed successfully.</p>
                    </fieldset>
                    <!-- END drop_success -->
                    <fieldset>
                        <label>
                            Description
                            <input name="description" class="required" type="text" />
                        </label>
                    </fieldset>
                    <fieldset>
                        {ATTACH_ZONE}
                    </fieldset>
                    <fieldset>
                        <input type="submit" value="Upload" class="secondary"/>
                    </fieldset>
                </form>
                <!-- END drop_student -->
                <!-- BEGIN drop_staff -->
                <ul class="action-list">
                    <!-- BEGIN drop_file -->
                    <li class="row" data-equalizer>
                        <div class="eleven-column" data-equalizer-watch>
                            <div class="avatar-card clearfix">
                                <a href="#" title="View Profile">
                                    {DROPBOX_MIME_IMAGE}
                                    <h3>
                                        <a href="/subject/modDropBox.php?id={DROPBOX_ID}" rel="external">{DROPBOX_DESCRIPTION}</a>
                                    </h3>
                                </a>
                                <p class="meta">
                                    By {DROP_SUBMITTED_BY} on {DROP_SUBMITTED_TIME}
                                </p>
                            </div>
                        </div>
                        <div class="one actions">
                            <a class="icon-delete no-text" href="/subject/modDropBox.php?delete={DROPBOX_ID}" title="Delete"></a>
                        </div>
                    </li>
                    <!-- END drop_file -->
                </ul>
                <!-- END drop_staff -->
            </section>
        </div>
    </div>
</div>
