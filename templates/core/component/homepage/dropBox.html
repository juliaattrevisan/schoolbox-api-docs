<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript">
        $(function() {

            $('#component{COMPONENT_INSTANCE_ID}-dropBox').alaressValidate();

            $('#component{COMPONENT_INSTANCE_ID}').find('[data-delete]').click(function(event) {
                event.preventDefault();

                var element = $(this);
                $(this).confirmDialog({
                    text: 'Are you sure you want to delete this file?',
                    confirmLabel: 'Delete',
                    confirmEvent: function() {
                        window.location.href = element.attr('href');
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <!-- BEGIN drop_student -->
            <section class="content">
                <form action="/subject/modDropBox.php" method="post" enctype="multipart/form-data" id="component{COMPONENT_INSTANCE_ID}-dropBox" >
                    <input type="hidden" name="category" value="{ID}" />

                    <!-- BEGIN drop_success -->
                    <div data-alert="" class="alert-box success">
                        File upload completed successfully
                        <a href="" class="close">×</a>
                    </div>
                    <!-- END drop_success -->
                    <label for="description" class="required">Description</label>
                    <input name="description" id="description" type="text" required />

                    {ATTACH_ZONE}
                    <input type="submit" value="Upload" />
                </form>
            </section>
            <!-- END drop_student -->
            <!-- BEGIN drop_staff -->
            <section>
            <ul class="action-list">
                <!-- BEGIN drop_file -->
                <li class="actions-small-1">
                    <div class="list-item">
                        <div class="card small-12">
                            <a href="/subject/modDropBox.php?id={DROPBOX_ID}" title="View File" rel="external">
                                <img src="{CDN_PREFIX}/images/mime/{DROPBOX_MIME_IMAGE}" class="mime" />
                                <h3>{DROPBOX_DESCRIPTION}</h3>
                            </a>
                            <p class="meta">
                                By {DROP_SUBMITTED_BY} on {DROP_SUBMITTED_TIME}
                            </p>
                        </div>
                    </div>
                    <nav>
                        <a class="icon-delete" href="/subject/modDropBox.php?delete={DROPBOX_ID}" title="Delete" data-delete></a>
                    </nav>
                </li>
                <!-- END drop_file -->
            </ul>
            </section>
            <!-- END drop_staff -->
            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-drop-box"></i>
                <p>There are no uploaded files to view at this time.</p>
            </div>
            <!-- END empty_state -->
        </div>
    </div>
</div>
