<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
    <script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
    <script type="text/javascript">
        $(function() {
            $('input[type=file].pretty-file-input').prettyFileInput({
                additionalButtonClasses: 'no-marg float-left',
                buttonActiveClass: 'tick',
                defaultText: '<span></span>Choose file',
                defaultFileSelectedText: '<span></span>File selected'
            });

            $('#component{COMPONENT_INSTANCE_ID}-dropBox').alaressValidate();

            $('#component{COMPONENT_INSTANCE_ID}').find('[data-delete]').click(function(event) {
                event.preventDefault();

                var element = $(this);
                $(this).confirmDialog({
                    text: 'Are you sure you want to delete this file?',
                    confirmEvent: function() {
                        window.location.href = element.attr('href');
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN drop_student -->
                <form action="/subject/modDropBox.php" method="post" enctype="multipart/form-data" id="component{COMPONENT_INSTANCE_ID}-dropBox" >
                    <input type="hidden" name="category" value="{ID}" />

                    <!-- BEGIN drop_success -->
                    <p>File upload completed successfully.</p>
                    <!-- END drop_success -->
                    <label>
                        Description
                        <input name="description" class="required" type="text" />
                    </label>
                    {ATTACH_ZONE}
                    <input type="submit" value="Upload" />
                </form>
                <!-- END drop_student -->
                <!-- BEGIN drop_staff -->
                <ul class="action-list">
                    <!-- BEGIN drop_file -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="avatar card small-12">
                                <a href="/subject/modDropBox.php?id={DROPBOX_ID}" title="View File" rel="external">
                                    <img src="/images/mime/60x60/{DROPBOX_MIME_IMAGE}" class="mime"/>
                                    <h3>{DROPBOX_DESCRIPTION}</h3>
                                </a>
                                <p class="meta">
                                    By {DROP_SUBMITTED_BY} on {DROP_SUBMITTED_TIME}
                                </p>
                            </div>
                        </div>
                        <nav>
                            <a class="icon-delete" href="/subject/modDropBox.php?delete={DROPBOX_ID}" title="Delete" data-delete></a>
                        </nav>
                    </li>
                    <!-- END drop_file -->
                </ul>
                <!-- END drop_staff -->
            </section>
        </div>
    </div>
</div>
