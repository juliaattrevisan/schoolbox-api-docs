<div id="component{COMPONENT_INSTANCE_ID}">
	<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
	<script type="text/javascript" src="/javascript/jquery.blogCommentary.js"></script>
	<script type="text/javascript">

    $(function() {

        var comp = $('#component{COMPONENT_INSTANCE_ID}');

        comp.find('[data-interaction=deletecomment]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({text:'Delete this comment?'});
        });
        comp.blogCommentary();

    });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">
            <ul class="information-list">
                <!-- BEGIN blog -->
                <li class="row header" id="blog_{BLOG_ID}">
                    <div class="column small-11">
                        <h3>{BLOG_HEADING}</h3>
                        <div class="avatar-card">
                            <a href="/search/user/{BLOG_AUTHOR_ID}">
                                <img width="64" height="64" src="{BLOG_AUTHOR_THUMB}" />
                                <p>{BLOG_AUTHOR_NAME}</p>
                            </a>
                            <p class="meta">Posted {BLOG_CREATED}</p>
                        </div>
                    </div>

                    <!-- BEGIN modify_blog -->
                    <div class="one actions">
                        <a class="no-text icon-modify" href="/blog/modify/{BLOG_ID}" title="Modify Blog post"></a>
                    </div>
                    <!-- END modify_blog -->

                    <div class="column small-12">
                        <article>{BLOG_BODY}</article>
                    </div>

                    <div class="column small-12">
                        <ul class="information-list" id="blogComment_{BLOG_ID}">
                            <!-- BEGIN has_comments -->
                            <!-- BEGIN comment -->
                            <li class="row" data-thread>
                                <div class="column small-11">
                                    <div class="avatar-card">
                                        <a href="/search/user/{COMMENT_AUTHOR_ID}">
                                            <img width="64" height="64" src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square64" />
                                            <p>{COMMENT_AUTHOR_NAME}</p>
                                        </a>
                                        <p class="meta">Commented {COMMENT_CREATED}</p>
                                    </div>
                                </div>
                                <!-- BEGIN has_comment_delete -->
                                <div class="one actions">
                                    <a data-interaction="deletecomment" class="icon-delete no-text" href="/blog/comment/delete/{COMMENT_COMMENT_ID}"></a>
                                </div>
                                <!-- END has_comment_delete -->
                                <div class="column small-12">
                                    <p>{COMMENT_BODY}</p>
                                </div>
                            </li>
                            <!-- END comment -->
                            <!-- END has_comments -->
                        </ul>
                    </div>
                    <div class="column small-12">
                        <p>
                            <a data-interaction="showcomments" class="button icon-chat" data-numcomments="{BLOG_TOTAL_COMMENTS}">Show Comments ({BLOG_TOTAL_COMMENTS})</a>
                            <a data-toggle="commentform-{BLOG_ID}" class='button icon-add'>Add Comment</a>
                        </p>
                    </div>
                </li>
                <li class="row" id="commentform-{BLOG_ID}" style="display:none;">
                    <div class="column small-12">
                        <form action="/blog/comment/new/{BLOG_ID}" method="post">
                            <textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
                            <input type="submit" name="comment" value="Add comment"/>
                        </form>
                    </div>
                </li>

                <!-- END blog -->
                <li class="row">
                    <div class="content">
                        <a href="/homepage/blogArchive/{BLOG_CATEGORY_ID}" class="button">View Blog Archive</a>
                        <!-- BEGIN create_blog -->
                        <a href="/blog/modify/new/{BLOG_CATEGORY_ID}" class="button icon-up">Post Blog</a>
                        <!-- END create_blog -->
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
