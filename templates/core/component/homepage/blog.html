<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $j(function(){
        $j('a.delete-comment').click(function(event) {
            event.preventDefault();
            $j(this).confirmDialog({text:'Delete this comment?'});
        });

        $j(document).on('click', "#component{COMPONENT_INSTANCE_ID} a.show-comments", function(e) {
            $j(this).siblings('ul.comments').show(100);
            $j(this).siblings('form').show(100);
            $j(this).hide();
            e.preventDefault();
        });
    });
</script>

<div class="box component blog clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}

	<ul class="information-list">
		<!-- BEGIN blog -->
		<li class="{BLOG_SHADING}">
			<span class="actions">
				{MODIFY_BLOG}
			</span>

			<h3>{BLOG_HEADING}</h3>

			<p class="meta">
				<a href="/search/user/{BLOG_AUTHOR_ID}" class="author">
					<img width="32" height="32" src="{BLOG_AUTHOR_THUMB}" />
					{BLOG_AUTHOR_NAME}
				</a><br />
				Posted {BLOG_CREATED}
			</p>

			<div class="wysiwyg">{BLOG_BODY}</div>

			<ul class="comments" style="display: none;">
				<!-- BEGIN comment -->
				<li class="{ON_OFF}">
					<span class="actions">
						<!-- BEGIN has_comment_delete -->
						<a class="delete-comment btn delete no-text" href="/blog/comment/delete/{COMMENT_COMMENT_ID}"><span></span></a>
						<!-- END has_comment_delete -->
					</span>

					<p class="meta">
						<a href="/search/user/{COMMENT_AUTHOR_ID}" class="author">
							<img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square32"/>
							{COMMENT_AUTHOR_NAME}
						</a>
						Commented {COMMENT_CREATED}
					</p>

					<p class="comment-body">{COMMENT_BODY}</p>
				</li>
				<!-- END comment -->
			</ul>
			<form method="post" action="/blog/comment/new/{BLOG_ID}" style="display: none;">
				<p><textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
					<input type="submit" class="submit-btn-plain" name="comment" value="Add comment"/></p>
			</form>
			<a href="#" class="btn chat show-comments"><span></span>Show comments ({BLOG_TOTAL_COMMENTS})</a>
		</li>
		<!-- END blog -->
	</ul>

    <p class="interact">
        <a href="/homepage/blogArchive/{BLOG_CATEGORY_ID}" class="btn"><span></span>View Blog Archive</a>
        <!-- BEGIN submit -->
        <a href="/blog/modify/new/{BLOG_CATEGORY_ID}" class="btn up-arrow"><span></span>Post Blog</a>
        <!-- END submit -->
    </p>
</div>
