<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
    $j(function(){
/*
        $j('a.show_comments').click(function(){
            $j(this).closest('li').find('.comments').toggle();
            $j(this).children('span').toggle();
            return false;
        });
*/
        $j('a.post_comment').click(function(){
            $j(this).closest('li').find('form').toggle();
            $j(this).hide();
            return false;
        });
        $j('a.delete-comment').click(function(){
            location.href = $j(this).attr('href');
        }).confirm({
            msg: 'Delete this comment? ',
            buttons: {
                wrapper:'<button></button>',
                separator:'  '
            }
        });

        /* Modal for URL homepage selection
         */
        $j('#resource-browser').dialog({
            width:650,
            autoOpen:false,
            title:"Select a homepage",
            modal:true,
            resizable:false
        });

        $j('#launch-browser-{COMPONENT_HANDLE}').click(function () {
            $j('#resource-browser').load('/ajax/resourceBrowser', {destination:'#homepage-blog-{COMPONENT_HANDLE}'}, function () {
                $j('#resource-browser').dialog('open');
            });

            return false;
        });
    });
</script>
<!-- END custom_head -->

<div class="box component blog clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div class="listing">
        <ul>
            <!-- BEGIN blog -->
            <li class="{BLOG_SHADING} clearfix">
                <h3 class="clearfix">{BLOG_HEADING}</h3>
                <div class="small-right">
                    <p class="interact">{MODIFY_BLOG}</p>
                </div>
                <div class="blog-body">{BLOG_BODY}</div>
                <a href="/search/user/{BLOG_AUTHOR_ID}" class="author profile-card bar short" data-icon="email">
                    <img src="{BLOG_AUTHOR_THUMB}"/>
                    <span class="name">{BLOG_AUTHOR_NAME}</span>
                    <span class="subtitle">Posted {BLOG_CREATED}</span>
                </a>


                <div class="comments">
                    <!-- BEGIN comment -->
                    <div class="box clearfix">
                        <p class="interact">{DELETE_COMMENT}</p>
                        <a href="/search/user/{COMMENT_AUTHOR_ID}" class="author profile-card bar short" data-icon="email">
                            <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square32"/>
                            <span class="name">{COMMENT_AUTHOR_NAME}</span>
                            <span class="subtitle">Commented {COMMENT_CREATED}</span>
                        </a>
                        <p class="comment-body">{COMMENT_BODY}</p>
                    </div>
                    <!-- END comment -->
                </div>
                <p class="links-house">
                    <a class="interact post_comment" href="javascript:void();">Post comment</a>
                </p>

                <form class="hide" method="post" action="/blog/comment/new/{BLOG_ID}">
                    <p><textarea name="body" style="width: 100%; border-color: #aaa;"></textarea></p>
                    <p><input type="submit" class="submit-btn-plain" name="comment" value="Comment"/></p>
                </form>
<!--
                <p class="interact hide-on-small">
                    <img src='/portrait.php?userId={BLOG_AUTHOR_EXTERNAL_ID}&size=square32' alt="{BLOG_AUTHOR_NAME}"
                         title="{BLOG_AUTHOR_NAME}"/>
                    Posted by {BLOG_OWNER} {BLOG_CREATED}
                </p>
-->
            </li>
            <!-- END blog -->
        </ul>
    </div>
    <p class="interact">
        <!-- BEGIN submit -->
        <a href="/blog/modify/new/{BLOG_CATEGORY_ID}" class="btn up-arrow"><span></span>Post Entry</a>
        <!-- END submit -->
        <a href="/homepage/blogArchive/{ID}" class="btn"><span></span>Blog Archive</a>
    </p>
</div>
