<div id="component{COMPONENT_INSTANCE_ID}" data-component>
    <script type="text/javascript" src="/javascript/shared/jquery.blog-commentary.js"></script>
	<script type="text/javascript">
        $(function() {
            var comp = $('#component{COMPONENT_INSTANCE_ID}');

            comp.find('[data-interaction=deletecomment]').click(function(event) {
                event.preventDefault();
                $(this).confirmDialog({text:'Delete this comment?'});
            });

            comp.blogCommentary();
        });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">
            <section>
                <ul class="information-list">
                    <!-- BEGIN blog -->
                    <li class="actions-small-1" id="blog_{BLOG_ID}">
                        <div class="list-item">
                            <div class="avatar card small-12">
                                <a href="/blog/{BLOG_ID}">
                                    <img src="{BLOG_AUTHOR_THUMB}" />
                                    <h3>{BLOG_HEADING}</h3>
                                </a>
                                <p class="meta">Posted by <a href="/search/user/{BLOG_AUTHOR_ID}">{BLOG_AUTHOR_NAME}</a> {BLOG_CREATED}</p>
                            </div>
                            <article>{BLOG_BODY}</article>

                            <div class="content">
                                <a data-interaction="showcomments" class="button icon-chat" data-numcomments="{BLOG_TOTAL_COMMENTS}">Show Comments ({BLOG_TOTAL_COMMENTS})</a>
                                <a data-toggle="commentform-{BLOG_ID}" class='button icon-add'>Add Comment</a>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_blog -->
                            <a class="icon-modify" href="/blog/modify/{BLOG_ID}" title="Modify Blog post"></a>
                            <!-- END modify_blog -->
                        </nav>

                        <ul class="information-list reply" id="blogComment_{BLOG_ID}">
                            <!-- BEGIN has_comments -->
                            <!-- BEGIN comment -->
                            <li class="actions-small-1" id="blog_{BLOG_ID}" data-thread>
                                <div class="list-item">
                                    <div class="avatar card small-12">
                                        <a href="/search/user/{COMMENT_AUTHOR_ID}">
                                            <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square64" />
                                            <p>{COMMENT_AUTHOR_NAME}</p>
                                        </a>
                                        <p class="meta">Commented {COMMENT_CREATED}</p>
                                    </div>
                                    <article>
                                        <p class="list-item-content">{COMMENT_BODY}</p>
                                    </article>
                                </div>
                                <nav>
                                    <!-- BEGIN has_comment_delete -->
                                    <a data-interaction="deletecomment" class="icon-delete" href="/blog/comment/delete/{COMMENT_COMMENT_ID}"></a>
                                    <!-- END has_comment_delete -->
                                </nav>
                            </li>
                            <!-- END comment -->
                            <!-- END has_comments -->
                            <li class="row hide" id="commentform-{BLOG_ID}">
                                <div class="column small-12 no-pad">
                                    <form action="/blog/comment/new/{BLOG_ID}" method="post">
                                        <div class="avatar card">
                                            <img src="/portrait.php?userId={EXTERNAL_ID}&size=square64" />
                                            <textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
                                        </div>
                                        <input type="submit" name="comment" value="Add comment"/>
                                    </form>
                                </div>
                            </li>
                        </ul>
                    </li>
                    <!-- END blog -->
                </ul>
                <div class="content">
                    <a href="/homepage/blogArchive/{BLOG_CATEGORY_ID}" class="button icon-view">View Blog Archive</a>
                    <!-- BEGIN create_blog -->
                    <a href="/blog/modify/new/{BLOG_CATEGORY_ID}" class="button icon-upload">Post Blog</a>
                    <!-- END create_blog -->
                </div>
            </section>
        </div>
    </div>
</div>
