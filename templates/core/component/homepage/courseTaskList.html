<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div class="course_task_listing listing box clearfix">
        <script type="text/javascript" src="/javascript/jquery.courseTaskList.js"></script>
        <dl class="clearfix course_definition">
            <dt>These tasks are part of course:</dt>
            <dd>
                <!-- BEGIN category_breadcrumb -->
                <span class="category"><a href="/homepage/{PARENT_CATEGORY_ID}/">{PARENT_CATEGORY_NAME}</a></span>
                <!-- END category_breadcrumb -->
            </dd>
        </dl>
        <ul class="task-list">
        <!-- BEGIN task -->
            <li class="task interact {DARK}">
                <span class="icon {TASK_CLASS}" title="{TASK_TYPE}"><span></span></span>
                <h3>{TASK_TITLE}</h3>
                <!-- BEGIN edit_task -->
                <span class="interact">
                    <a href="/task/modify/{TASK_ID}" class="btn modify" title="Modify this task"><span></span></a>
                    <a href="#" class="btn delete" title="Delete this task"><span></span></a>
                </span>
                <!-- END edit_task -->

                <div class="delete_task_form_container">
                    <p class="notice">Are you sure you wish to delete this task?</p>
                    <form action="/task/saveForm.php" method="post" class="delete_form">
                        <input type="hidden" name="action" value="delete" />
                        <input type="hidden" name="id"     value="{TASK_ID}" />
                        <button type="submit" class="btn delete"><span></span> Yes</button>
                        <a href="#" class="btn go-to delete-reject"><span></span> No</a>
                    </form>
                </div>

                <!-- Form for changing this task (inline: only for link and assess tasks -->
                <!-- BEGIN edit_task_form -->
                <div class="edit_task_form_container">
                    <form action="/task/saveForm.php" method="post" class="edit_task_form">
                        <input type="hidden" name="id"       value="{TASK_ID}"/>
                        <input type="hidden" name="category" value="{ID}"/>

                        <dl>
                            <dt><label for="title-{TASK_ID}">Task:</label></dt>
                            <dd><input id="title-{TASK_ID}" name="title" type="text" value="{TASK_TITLE}" /></dd>

                            <!-- BEGIN link_input -->
                            <dt><label for="link-{TASK_ID}">Link:</label></dt>
                            <dd><input id="link-{TASK_ID}" name="link" type="text" value="{TASK_LINK}" /></dd>
                            <!-- END link_input -->

                            <!-- BEGIN task_input -->
                            <dt>Assess method:</dt>
                            <dd>
                                <input id="assess_method_self-{TASK_ID}" type="radio" name="assess_method" value="self" {TASK_CHECK_ASSESS_SELF} />
                                <label for="assess_method_self-{TASK_ID}">Self assessed</label>
                                <input id="assess_method_teacher-{TASK_ID}" type="radio" name="assess_method" value="teacher" {TASK_CHECK_ASSESS_TEACHER} />
                                <label for="assess_method_teacher-{TASK_ID}">Teacher only</label>
                            </dd>
                            <!-- END task_input -->
                        </dl>

                        <input type="submit" name="Submit" value="Update" class="submit-btn-plain" />

                    </form>
                </div>
                <!-- END edit_task_form -->
            </li>
        <!-- END task -->
        </ul>
        <p class="interact add_buttons">
            <a href="/submission/createSubmission/new/{ID}/task" class="btn up-arrow" data-form_class="for_due_work"><span></span>Add Due Work</a>
            <a href="/assess/create/{ID}/task" class="btn create" data-form_class="for_assessment"><span></span>Add Assessment</a>
            <a href="/task/create/{ID}/task" class="btn tick" data-form_class="for_task"><span></span>Add Task</a>
            <a href="/task/create/{ID}/link" class="btn translate" data-form_class="for_link"><span></span>Add Link</a>
        </p>
    </div>

    <!-- This is the form for inline creation of links -->
    <div class="create_task_form_container for_link">
        <form action="/task/saveForm.php" method="post" class="create_task_form">
            <input type="hidden" name="id"       value=""/>
            <input type="hidden" name="category" value="{ID}"/>
            <input type="hidden" name="type"     value="link"/>

            <dl>
                <dt><label for="title-new_link">Task:</label></dt>
                <dd><input id="title-new_link" name="title" type="text" value="" /></dd>

                <dt><label for="link-new_link">Link:</label></dt>
                <dd><input id="link-new_link" name="link" type="text" value="" /></dd>
            </dl>

            <input type="submit" name="Submit" value="Create" class="submit-btn-plain" />

        </form>
    </div>

    <!-- This is the form for inline creation of tasks -->
    <div class="create_task_form_container for_task">
        <form action="/task/saveForm.php" method="post" class="create_task_form">
            <input type="hidden" name="id"       value=""/>
            <input type="hidden" name="category" value="{ID}"/>
            <input type="hidden" name="type"     value="link"/>

            <dl>
                <dt><label for="title-new_task">Task:</label></dt>
                <dd><input id="title-new_task" name="title" type="text" value="" /></dd>

                <dt>Assess method:</dt>
                <dd>
                    <input id="assess_method_self-new_task" type="radio" name="assess_method" value="self" />
                    <label for="assess_method_self-new_task">Self assessed</label>
                    <input id="assess_method_teacher-new_task" type="radio" name="assess_method" value="teacher" />
                    <label for="assess_method_teacher-new_task">Teacher only</label>
                </dd>
            </dl>

            <input type="submit" name="Submit" value="Create" class="submit-btn-plain" />

        </form>
    </div>
</div>
