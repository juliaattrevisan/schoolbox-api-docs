<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN duework -->
                    <li class="row" data-equalizer>
                        <div class="small-10 columns" data-equalizer-watch>
                            <h3>
                                <a href='/submission/submissionHistory/{DUE_ID}'>{DUE_NAME}</a>
                            </h3>

                            <!-- BEGIN duework_due_date -->
                            <p class="meta">
                                <span class="gradient-{WORK_URGENCY}">Due {DUE_DATE_RELATIVE}</span> on {DUE_DATE}
                            </p>
                            <!-- END duework_due_date -->

                            <article class="{COMPONENT_COMPACTMODE}">{DUE_COMMENT}</article>
                        </div>
                        <div class="two actions">
                            <!-- BEGIN has_actions -->
                            <!-- BEGIN duework_result_link -->
                            <a class="icon-poll no-text" href="/submission/viewSubmission/{DUE_ID}" title="View Results"></a>
                            <!-- END duework_result_link -->

                            <!-- BEGIN duework_actions -->
                            <a class="icon-{DUE_ACTION_ICON} no-text" href="{DUE_ACTION}" title="{DUE_ACTION_NAME}"></a>
                            <!-- END duework_actions -->
                            <!-- END has_actions -->
                        </div>
                    </li>
                    <!-- END duework -->
                </ul>

                <div class="content">
                    <!-- BEGIN allwork_button -->
                    <a href="/submission/allWork/{USER_ID}/{WORK_YEAR}/{WORK_SEMESTER}/{ID}" title="View grades" class="button icon-approve">View Grades</a>
                    <!-- END allwork_button -->
                    <!-- BEGIN submit_dw -->
                    <a href="/submission/createSubmission/new/{ID}/" class="button icon-due-work">Post Due Work</a>
                    <!-- END submit_dw -->
                </div>
            </section>
        </div>
    </div>
</div>
