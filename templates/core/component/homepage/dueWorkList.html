<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<h2>Due Work</h2>
	{CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <ul class="information-list">
            <!-- BEGIN duework -->
            <li class="{ON_OFF}">
                <!-- BEGIN has_actions -->
                <span class="actions">
                    <!-- BEGIN duework_result_link -->
                    <a class="btn statistics no-text" href="/submission/viewSubmission/{DUE_ID}" title="View Results"><span></span></a>
                    <!-- END duework_result_link -->

                    <!-- BEGIN duework_actions -->
                    <a class="btn no-text {DUE_ACTION_ICON}" href="{DUE_ACTION}" title="{DUE_ACTION_NAME}"><span></span></a>
                    <!-- END duework_actions -->
                </span>
                <!-- END has_actions -->
                <h4><a href="/submission/submissionHistory/{DUE_ID}">{DUE_NAME}</a></h4>
                <!-- BEGIN duework_due_date -->
                <span class="gradient-{WORK_URGENCY}">Due {DUE_DATE_RELATIVE}</span> on {DUE_DATE}
                <!-- END duework_due_date -->
                <div class="wysiwyg {COMPONENT_COMPACTMODE}">{DUE_COMMENT}</div>
            </li>
            <!-- END duework -->
        </ul>

        <p class="interact">
            <!-- BEGIN allwork_button -->
            <a href="/submission/allWork/{USER_ID}/{WORK_YEAR}/{WORK_SEMESTER}/{ID}" title="View grades"  class="btn tick"><span></span>View Grades</a>
            <!-- END allwork_button -->
            <!-- BEGIN submit_dw -->
            <a href="/submission/createSubmission/new/{ID}/" class="btn due-work"><span></span>Post Due Work</a>
            <!-- END submit_dw -->
        </p>
    </div>
</div>
