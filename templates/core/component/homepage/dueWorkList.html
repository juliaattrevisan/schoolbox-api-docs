<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<h2>Due Work</h2>
	{CONFIGURATION}
	<table class="table ruler">
		<tbody>
			<!-- BEGIN duework -->
			<tr>
				<td>
					<h4>
						<span class="{COMPONENT_COMPACTMODE}">{DUE_TYPE} - </span>
						<a href="/submission/submissionHistory/{DUE_ID}/{ID}">{DUE_NAME}</a>
					</h4>

					<div class="wysiwyg {COMPONENT_COMPACTMODE}">{DUE_COMMENT}</div>
				</td>
				<td class="text-align-right">
					<!-- BEGIN duework_due_date -->
					<span class="gradient-{WORK_URGENCY}">Due {DUE_DATE_RELATIVE}</span> on {DUE_DATE}
					<!-- END duework_due_date -->
				</td>
				<!-- BEGIN has_actions -->
				<td width="1">
					<span class="actions two-buttons">
						<!-- BEGIN duework_result_link -->
						<a class="btn no-text go-to" href="/submission/viewSubmission/{DUE_ID}" title="View Results"><span></span></a>
						<!-- END duework_result_link -->

						<!-- BEGIN duework_actions -->
						<a class="btn no-text {DUE_ACTION_ICON}" href="{DUE_ACTION}" title="{DUE_ACTION_NAME}"><span></span></a>
						<!-- END duework_actions -->
					</span>
				</td>
				<!-- END has_actions -->
			</tr>
			<!-- END duework -->
		</tbody>
	</table>

	<p class="interact">
		<!-- BEGIN allwork_button -->
		<a href="/submission/allWork/{USER_ID}/{WORK_YEAR}/{WORK_SEMESTER}/{ID}" title="View grades"  class="btn tick"><span></span>Grades</a>
		<!-- END allwork_button -->
		<!-- BEGIN submit_dw -->
		<a href="/submission/createSubmission/new/{ID}/" class="btn due-work"><span></span>Post Due Work</a>
        <a href="/submission/listSubmission/{WORK_YEAR}/{WORK_SEMESTER}/{ID}/" class="btn"><span></span>View All Work</a>
		<a href="/submission/rubricCriteria/{ID}" class="btn modify"><span></span>Edit Rubric Criteria</a>
		<!-- END submit_dw -->
	</p>
</div>
