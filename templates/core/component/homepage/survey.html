<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN survey -->
                    <li class="actions-small-2">
                        <div class="list-item">
                            <div class="info card small-12">
                                <!-- BEGIN surveyLink -->
                                <h3>
                                    <a href="/survey/intro/{SURVEY_ASSESS_ID}">{SURVEY_TITLE}</a>
                                </h3>
                                <!-- END surveyLink -->

                                <!-- BEGIN surveyNoLink -->
                                <h3>{SURVEY_TITLE}</h3>
                                <!-- END surveyNoLink -->

                                <!-- BEGIN resumeLink -->
                                <h3>
                                    <a href="/survey/attempt/{SURVEY_ASSESS_ID}/{SURVEY_SECTION_ID}">{SURVEY_TITLE}</a>
                                </h3>
                                <!-- END resumeLink -->

                                <p class="meta">{SURVEY_FINISH_DATE}</p>

                                <p class="meta">
                                    Created by
                                    <a href='/search/user/{SURVEY_USER_ID}'>{SURVEY_USER_FIRSTNAME} {SURVEY_USER_LASTNAME}</a>
                                    {SURVEY_CREATED}
                                </p>
                            </div>
                            <article class="{COMPONENT_COMPACTMODE}">
                                {SURVEY_DESCRIPTION}
                            </article>
                        </div>
                        <nav>
                            <!-- BEGIN teacherLink -->
                            <a class="icon-poll" href="/survey/results/{SURVEY_ASSESS_ID}" title="View Results"></a>
                            <a class="icon-modify" href="/survey/summary/{SURVEY_ASSESS_ID}" title="Modify Survey"></a>
                            <!-- END teacherLink -->

                            <!-- BEGIN reviewLink -->
                            <a class="icon-quiz" href="/survey/studentReview/{SURVEY_ASSESS_ID}/{SURVEY_SECTION_ID}/{SURVEY_ATTEMPT_ID}" title="Review"></a>
                            <!-- END reviewLink -->
                        </nav>
                    </li>
                    <!-- END survey -->
                </ul>

                <div class="content">
                    <!-- BEGIN createSurvey -->
                    <a href="/survey/create/{ID}" class="button icon-add">Create Survey</a>
                    <!-- END createSurvey -->
                </div>
            </section>
        </div>
    </div>
</div>
