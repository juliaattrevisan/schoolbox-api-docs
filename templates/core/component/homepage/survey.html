<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-surveys"></i>
                <p><a href="/survey/create/{ID}">Create a form or survey</a> to collect ideas, preferences, and other information from users.</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_survey -->
            <section>
                <ul class="action-list">
                    <!-- BEGIN survey -->
                    <li class="actions-small-2">
                        <div class="list-item">
                            <div class="card small-12">
                                <!-- BEGIN surveyLink -->
                                <h3>
                                    <a href="/survey/intro/{SURVEY_ASSESS_ID}">{SURVEY_TITLE}</a>
                                </h3>
                                <!-- END surveyLink -->

                                <!-- BEGIN surveyNoLink -->
                                <h3>{SURVEY_TITLE}</h3>
                                <!-- END surveyNoLink -->

                                <!-- BEGIN resumeLink -->
                                <h3>
                                    <a href="/survey/attempt/{SURVEY_ASSESS_ID}/{SURVEY_SECTION_ID}">{SURVEY_TITLE}</a>
                                </h3>
                                <!-- END resumeLink -->

                                <p class="meta">{SURVEY_FINISH_DATE}</p>

                                <p class="meta">
                                    Created by
                                    <!-- BEGIN authorLinkOpen -->
                                        <a href='/search/user/{SURVEY_USER_ID}'>
                                    <!-- END authorLinkOpen -->
                                    {SURVEY_USER_FULLNAME}
                                    <!-- BEGIN authorLinkClose -->
                                        </a>
                                    <!-- END authorLinkClose -->
                                    {SURVEY_CREATED}
                                </p>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN teacherLink -->
                            <a class="icon-poll" href="/survey/results/{SURVEY_ASSESS_ID}" title="View Results"></a>
                            <a class="icon-modify" href="/survey/summary/{SURVEY_ASSESS_ID}" title="Modify Survey"></a>
                            <!-- END teacherLink -->

                            <!-- BEGIN reviewLink -->
                            <a class="icon-quiz" href="/survey/studentReview/{SURVEY_ASSESS_ID}/{SURVEY_SECTION_ID}/{SURVEY_ATTEMPT_ID}" title="Review"></a>
                            <!-- END reviewLink -->
                        </nav>
                        <article class="{COMPONENT_COMPACTMODE_HIDE}">
                            {SURVEY_DESCRIPTION}
                        </article>
                    </li>
                    <!-- END survey -->
                </ul>

                <!-- BEGIN createSurvey -->
                <div class="component-action">
                    <section>
                        <a href="/survey/create/{ID}" class="button">Create Survey</a>
                    </section>
                </div>
                <!-- END createSurvey -->
            </section>
            <!-- END has_survey -->

        </div>
    </div>
</div>
