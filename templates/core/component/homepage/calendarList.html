<div class="box calendar clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <script type='text/javascript'>
        $(function () {
            $(document).on('click', 'a.attendance-request', function (event) {
                event.preventDefault();

                var button = $(this);

                var data = button.parent('form').serialize();

                $.post('/service/attendance/processToggleAttendance', data, function (data) {

                    if (data.error == undefined) {
                        if (button.text() == 'RSVP') {
                            button.html('<span></span>Unattend');
                        }
                        else {
                            button.html('<span></span>RSVP');
                        }
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <!-- BEGIN campus_event_day -->
        <h3>{LIST_DATE}</h3>
        <div class="listing clearfix">
            <ul class="js_happening">

                <!-- BEGIN campus_events -->
                    <!-- twig data goes here -->
                <!-- END campus_events -->
            </ul>
        </div>
        <!-- END campus_event_day -->
        <!-- BEGIN submit_event -->
        <p class="interact"><a href="/calendar/modify.php?level=3&homepageId={ID}&returnTo=homepage" class="btn add"><span></span>Add Event</a></p>
        <!-- END submit_event -->
    </div>
</div>
