<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type="text/javascript" src="/javascript/components/zeroclipboard/dist/ZeroClipboard.min.js"></script>
    <script type="text/javascript" src="/javascript/shared/calendar/jquery.calendar.js"></script>
    <script type='text/javascript'>
        $(function () {
            $('#component{COMPONENT_INSTANCE_ID}').calendarAttendance();

            $('#component{COMPONENT_INSTANCE_ID}').calendarExport({
                userToken: '{USER_TOKEN}',
                groupId: '{ID}'
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="information-list">
                    <!-- BEGIN campus_event_day -->
                    <li>
                        <div class="small-12 columns">
                            <h3>{LIST_DATE}</h3>
                            <ul class="action-list" data-calendar-bubble-activator>
                                <!-- BEGIN campus_events -->
                                <!-- twig data goes here -->
                                <!-- END campus_events -->
                            </ul>
                        </div>
                    </li>
                    <!-- END campus_event_day -->
                </ul>

                <div class="content">
                    <!-- BEGIN submit_event -->
                    <a href="/calendar/modify.php?level=3&homepageId={ID}&returnTo=homepage" class="button icon-add">Add Event</a>
                    <!-- END submit_event -->
                </div>
            </section>
        </div>
    </div>

    <!--
    Dialog for export. There's only one calendar component per homepage, so it's
    okay to add item with ID here?
    -->
    <div id="calendar-export-dialog" class="reveal-modal" data-reveal>
        <div id="calendar-export-dialog-text">
            Use the following address to subscribe your favourite calendar application to a live feed.
        </div>

        <textarea readonly id="calendar-export-dialog-url" rows="6"></textarea>

        <a class="button icon-copy" id="copy-button" data-clipboard-target="calendar-export-dialog-url" title="Click to copy me.">Copy to Clipboard</a>
    </div>
</div>
