<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<script type="text/javascript" src="/javascript/pinterest/pinterest.js"></script>

	<h2>{COMPONENT_NAME}</h2>
	{CONFIGURATION}

	<!-- BEGIN has_pinterest_user -->
	<a data-pin-do="embedUser" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
	<script type="text/javascript">
		$(function() {
			$('#pinterest{COMPONENT_INSTANCE_ID}').pinterestUser();
		});
	</script>
	<!-- Please call pinit.js only once per page -->
	<script type="text/javascript" async src="//assets.pinterest.com/js/pinit.js"></script>
	<!-- END has_pinterest_user -->

	<!-- BEGIN has_pinterest_board -->
	<a data-pin-do="embedBoard" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
	<script type="text/javascript">
		$(function() {
			$('#pinterest{COMPONENT_INSTANCE_ID}').pinterestBoard();
		});
	</script>
	<!-- Please call pinit.js only once per page -->
	<script type="text/javascript" src="//assets.pinterest.com/js/pinit.js"></script>
	<!-- END has_pinterest_board -->
</div>
