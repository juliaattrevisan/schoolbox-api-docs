<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript" src="/javascript/shared/pinterest/jquery.pinterest.js"></script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-pinterest"></i>

                <!-- BEGIN empty_config -->
                <p>To use this component your must first <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">enter a URL</a> of a Pinterest user or board.</p>
                <!-- END empty_config -->

                <!-- BEGIN empty_results -->
                <p>No posts found.</p>
                <!-- END empty_results -->

                <!-- BEGIN empty_results_write -->
                <p>No posts found with the URL provided. Try <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">setting a different URL</a>.</p>
                <!-- END empty_results_write -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN pinterest -->
            <section class="content" data-pinterest-content>

                <!-- BEGIN has_pinterest_user -->
                <a data-pin-do="embedUser" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
                <script type="text/javascript">
                    $(function() {
                        $('#pinterest{COMPONENT_INSTANCE_ID}').pinterestUser();

                        $.getScript('//assets.pinterest.com/js/pinit.js');
                    });
                </script>
                <!-- END has_pinterest_user -->

                <!-- BEGIN has_pinterest_board -->
                <a data-pin-do="embedBoard" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
                <script type="text/javascript">
                    $(function() {
                        $('#pinterest{COMPONENT_INSTANCE_ID}').pinterestBoard();

                        $.getScript('//assets.pinterest.com/js/pinit.js');
                    });
                </script>
                <!-- END has_pinterest_board -->

            </section>
            <!-- END pinterest -->

        </div>
    </div>
</div>
