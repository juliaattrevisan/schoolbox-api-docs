<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript" src="{CDN_PREFIX}/js/pinterest/jquery.pinterest.js?v={SITE_VERSION}"></script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-pinterest"></i>

                <!-- BEGIN empty_config -->
                <p><a href="#" class="edit empty-edit" data-target="settings" data-state="closed">Enter a Pinterest user or board URL</a> to display Pinterest content in this component.</p>
                <!-- END empty_config -->

                <!-- BEGIN empty_invalid -->
                <p>We couldn't find a Pinterest user or board with the details provided. Try <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">checking your user or board URL is correct</a> or <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">entering a different user or board URL</a>.</p>
                <!-- END empty_invalid -->

            </div>
            <!-- END empty_state -->

            <!-- BEGIN pinterest -->
            <section class="content" data-pinterest-content>

                <!-- BEGIN has_pinterest_user -->
                <a data-pin-do="embedUser" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
                <script type="text/javascript">
                    $(function() {
                        $('#pinterest{COMPONENT_INSTANCE_ID}').pinterestUser();

                        $.getScript('//assets.pinterest.com/js/pinit.js');
                    });
                </script>
                <!-- END has_pinterest_user -->

                <!-- BEGIN has_pinterest_board -->
                <a data-pin-do="embedBoard" href="{PINTEREST_URL}" id="pinterest{COMPONENT_INSTANCE_ID}"></a>
                <script type="text/javascript">
                    $(function() {
                        $('#pinterest{COMPONENT_INSTANCE_ID}').pinterestBoard();

                        $.getScript('//assets.pinterest.com/js/pinit.js');
                    });
                </script>
                <!-- END has_pinterest_board -->

            </section>
            <!-- END pinterest -->

        </div>
    </div>
</div>
