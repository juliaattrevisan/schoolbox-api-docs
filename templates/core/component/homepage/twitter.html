<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>Twitter</h2>
    {CONFIGURATION}
	<ul class="information-list">
		<!-- BEGIN tweet -->
		<li class="{ON_OFF}">
			<p class="meta">
				<span class="author">
					<img height="32" width="32" src="{TWEET_AVATAR}" />
					<a href="https://twitter.com/{TWEET_AUTHOR}">{TWEET_FULLNAME}</a> @{TWEET_AUTHOR}
				</span>
				Tweeted on {TWEET_DATE}
			</p>
			<p>{TWEET_TEXT}<p>
		</li>
		<!-- END tweet -->
	</ul>
</div>
