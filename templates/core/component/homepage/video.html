<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <link href="/javascript/video-js/video-js.css" rel="stylesheet">
    <link href="/css/core/video-js/video-js.overrides.css" rel="stylesheet">
    <script src="/javascript/video-js/video.js"></script>
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
<!-- BEGIN default_video -->
<div class="videoWrapper">
    <video id="schoolbox_video{COMPONENT_INSTANCE_ID}" class="video-js vjs-default-skin" controls="true" preload="auto"
           poster="/cms/videoThumb.php?id={DEFAULT_VIDEO_ID}&type=poster">
      <source src="/cms/sendVideo.php?id={DEFAULT_VIDEO_ID}" type='video/mp4'>
    </video>
    <script> var video = _V_("schoolbox_video{COMPONENT_INSTANCE_ID}", {width: '100%', height: '400px'}); </script>
</div>
<!-- END default_video -->
<ul class="information-list">
    <!-- BEGIN video_list -->
    <li class="{ON_OFF}">
        <a class="video-link" href="#" rel="{VIDEO_LIST_ID}">
			<img class="thumbnail" width="64" height="64" src="/cms/videoThumb.php?id={VIDEO_LIST_ID}" />
			<h4>{VIDEO_LIST_TITLE}</h4>
		</a>
        <p class="meta">{VIDEO_LIST_DURATION} | Posted by <a href="/user/search/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a></p>
        <p>{VIDEO_LIST_COMMENT}</p>
    </li>
    <!-- END video_list -->
    <!-- BEGIN video_pending_list -->
    <li class="{ON_OFF}">
        <img class="thumbnail" width="64" height="64" src="{VIDEO_LIST_STATUSIMG}" title="Currently transcoding {VIDEO_LIST_TITLE}" />
        <h4>{VIDEO_LIST_TITLE}</h4>
        <p class="meta">Posted by <a href="/user/search/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a></p>
        <p>{VIDEO_LIST_COMMENT}</p>
    </li>
    <!-- END video_pending_list -->
</ul>
<script type="text/javascript">
    $j('a.video-link').click(function() {
        var $target = "/cms/sendVideo.php?id="+$j(this).attr("rel");
        var $poster = "/cms/videoThumb.php?id="+$j(this).attr("rel")+"&type=poster";
        var $video = _V_("schoolbox_video{COMPONENT_INSTANCE_ID}", {width: '100%', height: '400px'});

        $video.ready(function(){
            this.pause();
            $j("#schoolbox_video{COMPONENT_INSTANCE_ID}_html5_api").attr('poster', $poster);
            $j(".vjs-poster").css( { "background-image": "url("+$poster+")"});
            this.src({ type: "video/mp4", src: $target});
            this.bigPlayButton.show();
        });
        return false;
    });
</script>
<!-- BEGIN submit_video -->
<p class="interact">
<a href="/cms/file/new/{FILE_CAT_ID}" class="btn up-arrow"><span></span>Post Video</a>
</p>
<!-- END submit_video -->
</div>
