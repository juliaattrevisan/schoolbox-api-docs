<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <link href="/javascript/video-js/video-js.css" rel="stylesheet">
    <script src="/javascript/video-js/video.js"></script>
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
<!-- BEGIN default_video -->
<div class="videoWrapper">
    <video id="schoolbox_video{COMPONENT_INSTANCE_ID}" class="video-js vjs-default-skin" controls="true" preload="auto" width="100%" height="400"
           poster="/cms/videoThumb.php?id={DEFAULT_VIDEO_ID}&type=poster">
      <source src="/cms/sendVideo.php?id={DEFAULT_VIDEO_ID}" type='video/mp4'>
    </video>
    <script> var video = _V_("schoolbox_video{COMPONENT_INSTANCE_ID}"); </script>
</div>
<!-- END default_video -->
<ul class="news-list">
    <!-- BEGIN video_list -->
    <li class="clearfix {ON_OFF}">
        <a class="video-link" href="#" rel="{VIDEO_LIST_ID}"><img width=64 height=64 src="/cms/videoThumb.php?id={VIDEO_LIST_ID}" title="{VIDEO_LIST_TITLE}"><a/>
        <h3><a class="video-link" href="#" rel="{VIDEO_LIST_ID}">{VIDEO_LIST_TITLE}</a></h3>
        <span class="time">{VIDEO_LIST_DURATION} | Posted by <a href="/user/search/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a></span>
        <p>{VIDEO_LIST_COMMENT}</p>
    </li>
    <!-- END video_list -->
    <!-- BEGIN video_pending_list -->
    <li class="clearfix {ON_OFF}">
        <img width=64 height=64 src="{VIDEO_LIST_STATUSIMG}" title="{VIDEO_LIST_TITLE}">
        <h3>{VIDEO_LIST_TITLE}</h3>
        <span class="time">Posted by <a href="/user/search/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a></span>
        <p>{VIDEO_LIST_COMMENT}</p>
    </li>
    <!-- END video_pending_list -->
</ul>
<script type="text/javascript">
    $j('a.video-link').click(function() {
        var $target = "/cms/sendVideo.php?id="+$j(this).attr("rel");
        var $video = _V_("schoolbox_video{COMPONENT_INSTANCE_ID}");

        $video.ready(function(){
            this.pause();
            this.src({type: "video/mp4", src: $target});
            this.bigPlayButton.show();
        });
        return false;
    });
</script>
<!-- BEGIN submit_video -->
<p class="interact">
<a href="/cms/file/new/{FILE_CAT_ID}" class="btn up-arrow"><span></span>Post Video</a>
</p>
<!-- END submit_video -->
</div>
