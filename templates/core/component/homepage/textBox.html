<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{TEXTBOX_HEADING}</h2>
    {CONFIGURATION}
    <!-- BEGIN text_editable -->
    <script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
    <script type="text/javascript">
        tinyMCE.init({
            mode : "exact",
            elements: "textBoxBody",
            theme : "advanced",
            skin : "cirkuit",
            plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
            content_css : "/css/core/tiny.css",
            media_strict : false,
            theme_advanced_toolbar_location : "top",
            theme_advanced_toolbar_align : "left",
            theme_advanced_statusbar_location : "bottom",
            theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
            theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,z,spellchecker",
            theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
            theme_advanced_buttons4 : "tablecontrols",
            pdw_toggle_on : 1,
            pdw_toggle_toolbars : '2, 3, 4',
            extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
            theme_advanced_blockformats : "p,address,h4,h5",
            file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
            file_browser_category_id : {ID},
            tabfocus_elements : ":prev,:next",
            convert_urls : false
        });

    </script>
    <div class="wysiwig">
        <a name="go-to{COMPONENT_INSTANCE_ID}"></a>
        <form action="/homepage/textBoxForm.php" method="post" id="textBoxForm" >
            <label style="font-weight:bold;margin:4px 0 0 0;" for="textBoxHeading">Textbox Heading</label>
            <input type="text" style="width:98%" maxlength="255" name="textBoxHeading" id="textBoxHeading" value="{TEXTBOX_HEADING}" />
            <br />
            <br />
            <label style="font-weight:bold;float:left;margin:4px 0 0 0;" for="textBoxBody">Textbox Content</label>
            <textarea rows="20" style="width: 100%;" name="textBoxBody" id="textBoxBody">{TEXTBOX_BODY}</textarea>
            <input type="hidden" name="categoryID" value="{ID}" />
            <input type="hidden" name="textBoxID" value="{TEXTBOX_ID}" />
            <input type="hidden" name="componentID" value="{COMPONENT_INSTANCE_ID}" />
        </form>
    </div>
    <p class="interact"><a href="#" class="btn modify" onclick="$j('#textBoxForm').submit(); return false;"><span></span>Save Document</a></p>
    <!-- END text_editable -->

    <!-- BEGIN text_locked -->
    <div class="wysiwyg clearfix">
        {TEXTBOX_BODY}
    </div>


    <p class="interact clearfix">
        <!-- BEGIN modify_text -->
        <a href="/homepage/textBoxForm.php?delete={TEXTBOX_ID}" onclick="return confirm('Are you sure you want to delete this text box?');" class="btn delete"><span></span>Delete</a>
        <a href="/homepage/{ID}/textBoxModify/{COMPONENT_INSTANCE_ID}#go-to{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Modify</a>
        <!-- END modify_text -->
        <!-- BEGIN create_text -->
        <a href="/homepage/{ID}/textBoxCreate/{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Modify</a> </p>
    <!-- END create_text -->

    <!-- END text_locked -->
</div>
