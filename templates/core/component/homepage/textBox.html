<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <a id="textbox{TEXTBOX_ID}"></a>
    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <!-- BEGIN text_editable -->
        <script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
        <script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
        <script type="text/javascript">
            $(function() {
                $.fn.alaressTiny({
                    mode : "exact",
                    elements: "textBoxBody",
                    file_browser_category_id : {ID}
                });
            });
        </script>
        <div class="wysiwig">
            <a name="go-to{COMPONENT_INSTANCE_ID}"></a>
            <form action="/textbox/textBoxForm.php" method="post" id="textBoxForm" >
                <label style="font-weight:bold;margin:4px 0 0 0;" for="textBoxHeading">Textbox Heading</label>
                <input type="text" style="width:98%" maxlength="100" name="textBoxHeading" id="textBoxHeading" value="{TEXTBOX_HEADING}" />
                <br />
                <br />
                <label style="font-weight:bold;float:left;margin:4px 0 0 0;" for="textBoxBody">Textbox Content</label>
                <textarea rows="20" style="width: 100%;" name="textBoxBody" id="textBoxBody">{TEXTBOX_BODY}</textarea>
                <input type="hidden" name="originID" value="{ID}" />
                <input type="hidden" name="categoryID" value="{TEXTBOX_CATEGORY_ID}" />
                <input type="hidden" name="textBoxID" value="{TEXTBOX_ID}" />
                <input type="hidden" name="componentID" value="{COMPONENT_INSTANCE_ID}" />
            </form>
        </div>
        <p class="interact"><a href="#" class="btn modify" onclick="$('#textBoxForm').submit(); return false;"><span></span>Save Document</a></p>
        <!-- END text_editable -->

        <!-- BEGIN text_locked -->
        <div class="wysiwyg clearfix">
            {TEXTBOX_BODY}
        </div>

        <p class="interact clearfix">
            <!-- BEGIN modify_text -->
            <a href="/textbox/textBoxForm.php?delete={TEXTBOX_ID}&originID={ID}" onclick="return confirm('Are you sure you want to delete this text box?');" class="btn delete"><span></span>Delete</a>
            <a href="/homepage/{ID}/textBoxModify/{COMPONENT_INSTANCE_ID}#go-to{COMPONENT_INSTANCE_ID}" class="btn modify"><span></span>Modify</a>
            <!-- END modify_text -->
            <!-- BEGIN create_text -->
            <a href="/homepage/{ID}/textBoxCreate/{COMPONENT_INSTANCE_ID}" class="btn add"><span></span>Create</a>
            <!-- END create_text -->
        </p>
        <!-- END text_locked -->
    </div>
</div>
