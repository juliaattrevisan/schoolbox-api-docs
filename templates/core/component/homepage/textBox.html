<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <a id="textbox{TEXTBOX_ID}"></a>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <!-- BEGIN text_editable -->
                <script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
                <script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
                <script type="text/javascript">
                    $(function() {
                        $.fn.alaressTiny({
                            mode : "exact",
                            elements: "textBoxBody",
                            file_browser_category_id : {ID}
                        });
                    });
                </script>

                <form action="/textbox/textBoxForm.php" method="post" id="textBoxForm{TEXTBOX_ID}">
                    <input type="hidden" name="originID" value="{ID}" />
                    <input type="hidden" name="categoryID" value="{TEXTBOX_CATEGORY_ID}" />
                    <input type="hidden" name="textBoxID" value="{TEXTBOX_ID}" />
                    <input type="hidden" name="componentID" value="{COMPONENT_INSTANCE_ID}" />

                    <div class="content">
                        <a name="go-to{COMPONENT_INSTANCE_ID}"></a>

                        <label for="textBoxHeading{TEXTBOX_ID}">
                            Textbox Heading
                            <input type="text" maxlength="100" name="textBoxHeading" id="textBoxHeading{TEXTBOX_ID}" value="{TEXTBOX_HEADING}" />
                        </label>

                        <label for="textBoxBody{TEXTBOX_ID}">
                            Textbox Content
                            <textarea rows="20" name="textBoxBody" id="textBoxBody{TEXTBOX_ID}">{TEXTBOX_BODY}</textarea>
                        </label>

                        <input type="submit" value="Save Content" />
                    </div>
                </form>
                <!-- END text_editable -->

                <!-- BEGIN text_locked -->
                <div class="content">
                    <article>{TEXTBOX_BODY}</article>
                </div>

                <div class="content">
                    <!-- BEGIN modify_text -->
                    <a href="/textbox/textBoxForm.php?delete={TEXTBOX_ID}&originID={ID}" onclick="return confirm('Are you sure you want to delete this text box?');" class="button icon-delete">Delete</a>
                    <a href="/homepage/{ID}/textBoxModify/{COMPONENT_INSTANCE_ID}#go-to{COMPONENT_INSTANCE_ID}" class="button icon-modify">Modify</a>
                    <!-- END modify_text -->
                    <!-- BEGIN create_text -->
                    <a href="/homepage/{ID}/textBoxCreate/{COMPONENT_INSTANCE_ID}" class="button icon-add">Create</a>
                    <!-- END create_text -->
                </div>
                <!-- END text_locked -->
            </section>
        </div>
    </div>
</div>
