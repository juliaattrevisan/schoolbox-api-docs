<!-- BEGIN custom_head -->
<link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
<script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
<!-- END custom_head -->
<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
	<h2>{PODCAST_COMPONENT_TITLE}</h2>
	{CONFIGURATION}
	<ul class="information-list">
		<!-- BEGIN podcast_list -->
		<li class="{ON_OFF}">
			<div class="clearfix">
				<h4 class="float-left"><a class="icons soundmp3" href="{PODCAST_URL}">{PODCAST_TITLE}</a></h4>
				<audio id="audio-player-{PODCAST_ID}" controls preload="none" class="float-right">
					<source src="{PODCAST_URL}" type="audio/mp3" />
				</audio>
			</div>
			<div class="wysiwyg {COMPONENT_COMPACTMODE}">{PODCAST_DESCRIPTION}</div>
		</li>
		<!-- END podcast_list -->
	</ul>
	<script type="text/javascript">
		// Turn all audio components into media elements
		$("#component{COMPONENT_INSTANCE_ID} audio").mediaelementplayer();
	</script>
</div>
