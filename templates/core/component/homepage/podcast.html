<!-- BEGIN custom_head -->
<script type="text/javascript">
    function loadPodcastSWF(audioID, url){
        var flashvars = {
            filename: url
        };
        var params = {
            movie: "/flash/player_mp3.swf",
            wmode: "transparent"
        };

        swfobject.embedSWF("/flash/mp3small.swf", "podcast-player-"+audioID, "22", "22", "9.0.0", "/flash/expressInstall.swf", flashvars, params);
    }
</script>
<!-- END custom_head -->
<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{PODCAST_COMPONENT_TITLE}</h2>
    {CONFIGURATION}
	<ul class="information-list">
		<!-- BEGIN podcast_list -->
		<li class="{ON_OFF}">
			<div class="play-button actions">
				<div id="podcast-player-{PODCAST_ID}"><a onclick="loadPodcastSWF('{PODCAST_ID}', '{PODCAST_URL}'); return false;"></a></div>
			</div>

			<h4><a class="icons soundmp3" href="{PODCAST_URL}">{PODCAST_TITLE}</a></h4>

			<div class="wysiwyg {COMPONENT_COMPACTMODE}">{PODCAST_DESCRIPTION}</div>
		</li>
		<!-- END podcast_list -->
	</ul>
</div>
