<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script src="/javascript/shared/jquery.media-playlist.js"></script>
    <script type="text/javascript">
        $(function() {
            // Turn all audio components into media elements
            $('#component{COMPONENT_INSTANCE_ID}').mediaPlaylist();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-podcast"></i>
                <p>No podcast feed provided.</p>
                <!-- BEGIN empty_modify -->
                <p>To use this component your must first <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">enter a podcast URL</a>.</p>
                <!-- END empty_modify -->
            </div>
            <!-- END empty_state -->

            <!-- BEGIN podcast -->
            <section>
                <ul class="action-list">
                    <!-- BEGIN default_podcast -->
                    <li>
                        <div class="list-item content">
                            <h3 data-role="media-playlist-title">{DEFAULT_PODCAST_TITLE}</h3>

                            <audio id="schoolbox_audio{COMPONENT_INSTANCE_ID}" class="media-player" data-role="media-playlist-player" controls preload="none" style='width:100%;'>
                                <source src="{DEFAULT_PODCAST_URL}" type="audio/mp3" />
                            </audio>
                        </div>
                    </li>
                    <!-- END default_podcast -->

                    <!-- BEGIN podcast_list -->
                    <li>
                        <div class="list-item content">
                            <a href="{PODCAST_URL}" data-role="media-playlist-track">{PODCAST_TITLE}</a>
                        </div>
                        <article class="{COMPONENT_COMPACTMODE_HIDE}">
                            {PODCAST_DESCRIPTION}
                        </article>
                    </li>
                    <!-- END podcast_list -->
                </ul>
            </section>
            <!-- END podcast -->

        </div>
    </div>
</div>
