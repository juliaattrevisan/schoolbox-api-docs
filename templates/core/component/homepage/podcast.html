<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <link href="/javascript/components/mediaelement/build/mediaelementplayer.min.css" rel="stylesheet">
    <script src="/javascript/components/mediaelement/build/mediaelement-and-player.min.js"></script>
    <script src="/javascript/shared/jquery.media-playlist.js"></script>
    <script type="text/javascript">
        $(function() {
            // Turn all audio components into media elements
            $('#component{COMPONENT_INSTANCE_ID}').mediaPlaylist();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN default_podcast -->
                    <li>
                        <div class="list-item content">
                            <h3 data-role="media-playlist-title">{DEFAULT_PODCAST_TITLE}</h3>

                            <audio id="schoolbox_audio{COMPONENT_INSTANCE_ID}" class="media-player" data-role="media-playlist-player" controls preload="none" style='width:100%;'>
                                <source src="{DEFAULT_PODCAST_URL}" type="audio/mp3" />
                            </audio>
                        </div>
                    </li>
                    <!-- END default_podcast -->

                    <!-- BEGIN podcast_list -->
                    <li>
                        <div class="list-item content">
                            <a href="{PODCAST_URL}" data-role="media-playlist-track">{PODCAST_TITLE}</a>

                            <article class="{COMPONENT_COMPACTMODE}">
                                {PODCAST_DESCRIPTION}
                            </article>
                        </div>
                        <nav>
                        </nav>
                    </li>
                    <!-- END podcast_list -->
                </ul>
            </section>
        </div>
    </div>
</div>
