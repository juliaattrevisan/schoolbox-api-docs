<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <ul class="information-list {LIST_STYLE}">
            <!-- BEGIN person -->
            <li class="{ON_OFF}">
                <a href="/search/user/{PERSON_UID}" alt="{PERSON_NAME}" class="author" title="{PERSON_NAME}">
                    <!-- BEGIN has_thumbnail -->
                    <img class="thumbnail" height="64" width="64" src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64'/>
                    <!-- END has_thumbnail -->
                    <!-- BEGIN has_icon -->
                    <img class="icon" height="32" width="32" src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square32'/>
                    <!-- END has_icon -->
                    <h4>{PERSON_NAME}</h4>
                </a>
                <p class="meta">{PERSON_GROUP}</p>
            </li>
            <!-- END person -->
        </ul>
    </div>
</div>
