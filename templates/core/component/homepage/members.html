<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>Members</h2>
    {CONFIGURATION}
	<ul class="information-list {LIST_STYLE}">
		<!-- BEGIN person -->
		<li class="{ON_OFF}">
			<a href="/search/user/{PERSON_UID}" alt="{PERSON_NAME}" class="author" title="{PERSON_NAME}">
				<!-- BEGIN has_thumbnail -->
				<img class="thumbnail" height="64" width="64" src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64'/>
				<!-- END has_thumbnail -->
				<!-- BEGIN has_icon -->
				<img class="icon" height="32" width="32" src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square32'/>
				<!-- END has_icon -->
				<h4>{PERSON_NAME}</h4>
			</a>
			<p class="meta">{PERSON_GROUP}</p>
		</li>
		<!-- END person -->
	</ul>
    <!-- BEGIN member_email -->
    <form action="/mail/createMail.php" method="post" name="form2">
        <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLYTO}&gt;"/>
        <input type="hidden" name="bcc" value="{EMAILALL}"/>
        <a href="#" class="btn submit-this email"><span></span>Email all</a>
    </form>
    <!-- END member_email -->
</div>
