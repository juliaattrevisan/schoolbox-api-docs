<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <!-- BEGIN empty_state -->

    <div class="empty-state">
        <i class="icon-group"></i>
        <p>There are no members in this group</p>
    </div>

    <!-- END empty_state -->

    <!-- BEGIN members -->

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="grid small-block-grid-1 {GRID_VIEW_CLASSES}">
                    <!-- BEGIN person -->
                    <li>
                        <div class="card small-12">
                            <a href="/search/user/{PERSON_UID}" title="View Profile">
                                <!-- BEGIN has_thumbnail -->
                                <img src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64' alt="View Profile" />
                                <!-- END has_thumbnail -->
                                <!-- BEGIN has_icon -->
                                <img src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64' alt="View Profile" />
                                <!-- END has_icon -->
                                <p>{PERSON_NAME}</p>
                            </a>
                            <p class="meta">{PERSON_GROUP}</p>
                        </div>
                    </li>
                    <!-- END person -->
                </ul>

                <!-- BEGIN people_hidden -->
                <div class="content">
                    <p class="meta">Showing the first {MAX_MEMBERS} members. A further {HIDDEN_COUNT} member(s) are not shown.</p>
                </div>
                <!-- END people_hidden -->
            </section>
            <!-- BEGIN member_email -->
            <div class="component-action">
                <section>
                    <a href="#" data-email class="button">Email All</a>
                </section>
            </div>
            <form id="email-all" action="/mail/createMail.php" method="post">
                <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLYTO}&gt;"/>
                <input type="hidden" name="bcc" value="{EMAILALL}"/>
            </form>
            <script>
                $(function() {
                    $('[data-email]').click(function() {
                        $('#email-all').submit();
                    });
                });
            </script>
            <!-- END member_email -->
        </div>
    </div>

    <!-- END members -->
</div>
