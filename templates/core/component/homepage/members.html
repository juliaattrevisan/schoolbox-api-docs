<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="grid small-block-grid-1 {GRID_VIEW_CLASSES}">
                    <!-- BEGIN person -->
                    <li>
                        <div class="avatar card">
                            <a href="/search/user/{PERSON_UID}" title="View Profile">
                                <!-- BEGIN has_thumbnail -->
                                <img src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64' alt="View Profile" />
                                <!-- END has_thumbnail -->
                                <!-- BEGIN has_icon -->
                                <img src='/portrait.php?userId={PERSON_EXTERNAL_ID}&size=square64' alt="View Profile" />
                                <!-- END has_icon -->
                                <p>{PERSON_NAME}</p>
                            </a>
                            <p class="meta">{PERSON_GROUP}</p>
                        </div>
                    </li>
                    <!-- END person -->
                </ul>

                <!-- BEGIN member_email -->
                <div class="content">
                    <form action="/mail/createMail.php" method="post">
                        <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLYTO}&gt;"/>
                        <input type="hidden" name="bcc" value="{EMAILALL}"/>
                        <button type="submit" class="button icon-email">Email All</button>
                    </form>
                </div>
                <!-- END member_email -->
            </section>
        </div>
    </div>
</div>
