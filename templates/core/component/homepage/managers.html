<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>Group Managers</h2>
    {CONFIGURATION}
    <div class="listing">
        <!-- BEGIN person -->
        <a href='/search/user/{PERSON_UID}' class='button {LIST_STYLE}' alt='{PERSON_NAME}' title='{PERSON_NAME}'>
            <!-- BEGIN has_portrait -->
            <img src='/portrait?userId={PERSON_EXTERNAL_ID}&size=square64' />
            <!-- END has_portrait -->

            <span class='name'>{PERSON_NAME}</span>

            <!-- BEGIN has_group -->
            <span class='group'>{PERSON_GROUP}</span>
            <!-- END has_group -->
        </a>
        <!-- END person -->
    </div>
    <!-- BEGIN member_email -->
    <form action="/mail/createMail.php" method="post" class="clearfix" name="form2">
        <input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLYTO}&gt;" />
        <input type="hidden" name="bcc" value="{EMAILALL}" />
        <a href="#" class="btn submit-this float-right up-arrow "><span></span>Email all</a>
    </form>
    <!-- END member_email -->
</div>
