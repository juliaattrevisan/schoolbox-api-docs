<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <!-- BEGIN source_folder_deleted -->
            {SOURCE_FOLDER_UNAVAILABLE}
            <!-- END source_folder_deleted -->

            <!-- BEGIN source_folder_exists -->
            <ul class="breadcrumb">
                <!-- BEGIN category_breadcrumb -->
                <li class="{BREADCRUMB_CATEGORY_CLASS}">
                    <!-- BEGIN category_with_link -->
                    <a href="/homepage/{BREADCRUMB_CATEGORY_ID}/" >{BREADCRUMB_CATEGORY_NAME}</a>
                    <!-- END category_with_link -->
                    <!-- BEGIN category_no_link -->
                    <span>{BREADCRUMB_CATEGORY_NAME}</span>
                    <!-- END category_no_link -->
                </li>
                <!-- END category_breadcrumb -->
            </ul>
            <!-- END source_folder_exists -->
        </div>
    </div>
</div>
