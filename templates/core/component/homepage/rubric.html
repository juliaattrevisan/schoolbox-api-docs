<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="information-list">
                    <!-- BEGIN rubric_criterion -->
                    <li class="row">
                        <div class="twelve-column">
                            <h3>{CRITERION_GROUP}</h3>
                            <ul>
                                <!-- BEGIN rubric_descriptor -->
                                <li class="row">
                                    <div class="twelve-column">
                                        {CRITERION_NAME}
                                    </div>
                                </li>
                                <!-- END rubric_descriptor -->
                            </ul>
                        </div>
                    </li>
                    <!-- END rubric_criterion -->
                </ul>

                <!-- BEGIN modify_rubric -->
                <div class="content">
                    <a href="/submission/rubricCriteria/{ID}" class="button icon-modify">Edit Rubrics</a>
                </div>
                <!-- END modify_rubric -->
            </section>
        </div>
    </div>
</div>
