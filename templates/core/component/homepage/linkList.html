<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <script type='text/javascript' src='/javascript/preview/preview.js'></script>
    <script type="text/javascript">
        $(function() {
            $('[data-plugin="preview"]','#component{COMPONENT_INSTANCE_ID}').preview();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN link -->
                    <li class="actions-small-1">
                        <div class="list-item {HIDDEN}">
                            <div class="info card small-12">
                                <h3><a data-plugin="preview" rel="{LINK_TARGET}" href="/redir.php?id={LINK_ID}">{LINK_NAME}</a></h3>

                                <p class="meta">
                                    Posted by
                                    <a href="/search/user/{LINK_POSTED_BY_ID}">{LINK_POSTED_BY}</a>
                                    on {LINK_POSTED_DATE}
                                </p>
                            </div>

                            <p class="list-item-content {COMPONENT_COMPACTMODE}">
                                {LINK_COMMENT}
                            </p>
                        </div>
                        <nav>
                            <!-- BEGIN modify_link -->
                            <a class="icon-modify" href="/cms/link/{LINK_ID}" title="Edit link"></a>
                            <!-- END modify_link -->
                        </nav>
                    </li>
                    <!-- END link -->
                </ul>

                <div class="content">
                    <a href="/resources/{LINK_CAT_ID}" class="button icon-view">View All Links</a>

                    <!-- BEGIN submit_link -->
                    <a href="/cms/link/new/{LINK_CAT_ID}" class="button icon-add">Add Link</a>
                    <!-- END submit_link -->
                </div>
            </section>
        </div>
    </div>
</div>
