<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript">
        $(function() {
            $('[data-plugin="preview"]','#component{COMPONENT_INSTANCE_ID}').not('[rel="external"]').preview();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-link"></i>

                <!-- BEGIN empty_read -->
                <p>There are no links to access at this time.</p>
                <!-- END empty_read -->

                <!-- BEGIN empty_write -->
                <p><a href="/cms/link/new/{LINK_CAT_ID}">Add a link</a> to provide quick access to other pages.</p>
                <!-- END empty_write -->
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_link -->
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <ul class="action-list">
                    <!-- BEGIN link -->
                    <li class="actions-small-1">
                        <div class="list-item {HIDDEN}">
                            <div class="card small-12">
                                <h3><a data-plugin="preview" rel="{LINK_TARGET}" href="/redir.php?id={LINK_ID}">{LINK_NAME}</a></h3>

                                <p class="meta {COMPONENT_COMPACTMODE_HIDE}" >
                                    Posted by
                                    <!-- BEGIN owner_exists -->
                                    <a href="/search/user/{LINK_POSTED_BY_ID}">{LINK_POSTED_BY}</a>
                                    <!-- END owner_exists -->
                                    <!-- BEGIN owner_deleted -->
                                    {LINK_POSTED_BY}
                                    <!-- END owner_deleted -->
                                    on {LINK_POSTED_DATE}
                                </p>
                                <p class="{COMPONENT_COMPACTMODE_HIDE}">{LINK_COMMENT}</p>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_link -->
                            <a class="icon-modify" href="/cms/link/{LINK_ID}" title="Edit link"></a>
                            <!-- END modify_link -->
                        </nav>
                    </li>
                    <!-- END link -->
                </ul>

                <div class="component-action">
                    <section>
                        <!-- BEGIN view_all_links -->
                        <a href="/resources/{LINK_CAT_ID}" class="button">View All Links</a>
                        <!-- END view_all_links -->

                        <!-- BEGIN submit_link -->
                        <a href="/cms/link/new/{LINK_CAT_ID}" class="button">Add Link</a>
                        <!-- END submit_link -->
                    </section>
                </div>

                <!-- END source_folder_exists -->
            </section>
            <!-- END has_link -->

        </div>
    </div>
</div>
