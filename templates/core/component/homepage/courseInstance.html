<div class="box clearfix component course_instance" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div class="box clearfix">
        <link rel="stylesheet" type="text/css" media="screen" href="/css/tree.css" />
        <script type="text/javascript" src="/javascript/jquery.tree.js"></script>
        <script type="text/javascript">
            // Addition of an AJAX form submission - need to add here because
            // the session name and ID have to be passed.
            (function($) {
                $(function() {
                    var browser = $('#resource-browser');
                    browser.dialog({
                        width: 650,
                        autoOpen: false,
                        title: "Select a homepage",
                        modal: true,
                        resizable: false
                    });
                    var browser_options = {
                        destination:     '#component{COMPONENT_INSTANCE_ID} input[name="homepage"]',
                        base:            '{COURSE_HOMEPAGE}',
                        start:           '{COURSE_HOMEPAGE}',
                        triggerChange:   true,
                        destinationText: '#component{COMPONENT_INSTANCE_ID} span[data-resource_text]'
                    }
                    $('#component{COMPONENT_INSTANCE_ID} input[name="homepage"]').change(function(event) {
                        // console.log(event);
                    })
                    $('#component{COMPONENT_INSTANCE_ID} a[data-interaction="homepage_selector"]').click(function(event) {
                        event.preventDefault();
                        browser.load(
                            '/ajax/resourceBrowser',
                            browser_options,
                            function() { browser.dialog('open'); }
                        );
                    });
                });
            })(jQuery);
        </script>

        <!-- BEGIN course_selector -->
        <h3>This is the course instance component, so please choose a course.</h3>
        <form method="post" action="/homepage/{ID}/course/{COMPONENT_INSTANCE_ID}">
            <span data-resource_text></span>
            <a href="#" class="btn submit-this float-right translate">
                <span></span>Import
            </a>
            <a href="#" class="btn float-right up-arrow" data-interaction="homepage_selector">
                <span></span>Select Source
            </a>
        </form>
        <!-- END course_selector -->

        <!-- BEGIN unit_list -->
        <ul class="unit-list">
            <!-- BEGIN unit -->
            <li class="unit interact" data-unit_id="{UNIT_ID}">
                <h3>{UNIT_NAME}</h3>
                <ul class="unit-task-list">
                    <!-- BEGIN unit_task -->
                    <li class="unit-task interact" data-unit_task_id="{UNIT_TASK_ID}">
                        <h3>{UNIT_TASK_NAME}</h3>
                    </li>
                    <!-- END unit_task -->
                </ul>
            </li>
            <!-- END unit -->
        </ul>
        <!-- END unit_list -->
    </div>
</div>
