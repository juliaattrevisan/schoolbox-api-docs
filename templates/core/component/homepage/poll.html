<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type='text/javascript' src='/javascript/components/flot/jquery.flot.js'></script>
    <script type='text/javascript' src='/javascript/components/flot/jquery.flot.resize.js'></script>
    <script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
    <script type="text/javascript">
        $(function() {

            /* Delete a poll
             */
            $('#component{COMPONENT_INSTANCE_ID}').find('[data-poll-delete]').click(function(event) {
                event.preventDefault();

                var self = $(this);

                self.confirmDialog({
                    text: 'Delete this poll and all of the results?',
                    confirmEvent: function() {
                        window.location.href = self.attr('href');
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN poll_question -->
                    <li class="row" data-equalizer>
                        <div class="column small-11" data-equalizer-watch>
                            <h3>
                                {POLL_QUESTION}
                            </h3>

                            <div class="avatar-card clearfix">
                                <a href="/search/user/{POLL_AUTHOR_ID}" title="View Profile">
                                    <img src="{POLL_AUTHOR_THUMB}" alt="View Profile" />
                                    <p>{POLL_AUTHOR_NAME}</p>
                                </a>
                                <p class="meta">Posted {POLL_CREATED}</p>
                            </div>

                            <!-- BEGIN poll_vote -->
                            <script type="text/javascript">
                                $(function() {

                                    /* Vote validate on a per-poll basis
                                     */
                                    $('[data-component-poll={COMPONENT_INSTANCE_ID}]').submit(function(event) {
                                        var valid = false;

                                        $(this).find('[data-poll-option]').each(function(index, element) {
                                            if ($(this).prop('checked')) {
                                                valid = true;
                                            }
                                        });

                                        if (!valid) {
                                            alert('Please select an option.');
                                        }

                                        return valid;
                                    });
                                });
                            </script>

                            <form data-component-poll="{COMPONENT_INSTANCE_ID}" action="/poll/modifyForm.php" method="post">
                                <input type="hidden" name="pollID" value="{POLL_ID}" />
                                <input type="hidden" name="categoryID" value="{ID}" />

                                <!-- BEGIN poll_options -->
                                <input type="radio" name="vote" data-poll-option id="component{COMPONENT_INSTANCE_ID}-poll-option-{POLL_OPTION_INDEX}" value="{POLL_OPTION_INDEX}" />
                                <label for="component{COMPONENT_INSTANCE_ID}-poll-option-{POLL_OPTION_INDEX}" class="radio-label">{POLL_OPTION}</label>
                                <!-- END poll_options -->

                                <input type="submit" value="Vote" data-poll-validate="{COMPONENT_INSTANCE_ID}" />
                            </form>
                            <!-- END poll_vote -->

                        </div>
                        <div class="one actions">
                            <a class="icon-modify no-text" href="#" title=""></a>
                        </div>
                    </li>
                    <!-- END poll_question -->
                </ul>

                <div class="content">
                    <!-- BEGIN modify_poll -->
                    <a href="/poll/modifyForm.php?delete={POLL_ID}&amp;homepageComponentID={COMPONENT_INSTANCE_ID}" data-poll-delete class="button icon-delete">Delete</a>
                    <a href="/poll/modify/{POLL_ID}" class="button icon-modify">Modify</a>
                    <!-- END modify_poll -->

                    <!-- BEGIN new_poll -->
                    <a href="/poll/modify/new/{ID}/{COMPONENT_INSTANCE_ID}" class="button icon-add">Create Poll</a>
                    <!-- END new_poll -->

                    <!-- BEGIN show_results -->
                    <a href="/homepage/{ID}/pollResults" class="button icon-poll">Show results</a>
                    <!-- END show_results -->
                </div>
            </section>
        </div>

        <div id='poll_legend{POLL_ID}'></div>
    </div>
</div>
