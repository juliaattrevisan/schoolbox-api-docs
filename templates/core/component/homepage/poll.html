<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript">
        $(function() {

            /* Delete a poll
             */
            $('#component{COMPONENT_INSTANCE_ID}').find('[data-poll-delete]').click(function(event) {
                event.preventDefault();

                let self = $(this);
                let href = "/poll/modifyForm.php";

                self.confirmDialog({
                    text: 'Delete this poll and all of the results?',
                    confirmEvent: function() {
                        // A toast
                        let $toast = $('[data-poll-toast]');
                        $toast.toastActivate({text: 'Deleting Poll...'});
                        $.post(href, {delete: true, id: self.data().id, componentId: self.data().componentid})
                                .done(function() {
                                    window.location.reload();
                                    // Toast success
                                    $toast.toastTimeout({text: 'Poll deleted.', css: 'success'});
                                })
                                .fail(function() {
                                    // Toast fail
                                    $toast.toastTimeout({text: 'Delete failed.', css: 'alert'});
                                });
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-poll"></i>
                <p><a href="/poll/modify/new/{ID}/{COMPONENT_INSTANCE_ID}">Create a poll</a> to ask users their opinion or preference on a given topic.</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_poll -->
            <section>
                <ul class="action-list">
                    <!-- BEGIN poll_question -->
                    <li class="actions-small-1">
                        <div>
                            <div class="card wrap-down small-12">
                                <img src="{POLL_AUTHOR_THUMB}" alt="View Profile" />
                                <h3>{POLL_QUESTION}</h3>
                                <p class="meta">Posted by
                                    <!-- BEGIN owner_exists -->
                                    <a href="/search/user/{POLL_AUTHOR_ID}">{POLL_AUTHOR_NAME}</a>
                                    <!-- END owner_exists -->
                                    <!-- BEGIN owner_deleted -->
                                    {POLL_AUTHOR_NAME}
                                    <!-- END owner_deleted -->
                                    {POLL_CREATED}
                                </p>
                            </div>
                        </div>
                        <!-- BEGIN poll_vote -->
                        <div class="row content">
                            <div class="small-12 column">
                                <form data-component-poll="{COMPONENT_INSTANCE_ID}" action="/poll/modifyForm.php"
                                      method="post">
                                    <script type="text/javascript">
                                        $(function () {
                                            /* Vote validate on a per-poll basis
                                             */
                                            $('[data-component-poll={COMPONENT_INSTANCE_ID}]').alaressValidate({
                                                rules: {
                                                    'vote': {
                                                        required: true
                                                    }
                                                },
                                                messages: {
                                                    vote: "Please choose an option"
                                                }
                                            });

                                        });
                                    </script>

                                    <input type="hidden" name="id" value="{POLL_ID}"/>
                                    <input type="hidden" name="folder_id" value="{ID}"/>
                                    <fieldset class="radiolist">
                                        <ul class="option-list">
                                            <!-- BEGIN poll_options -->
                                            <li>
                                                <input type="radio" name="vote" data-poll-option
                                                    id="component{COMPONENT_INSTANCE_ID}-poll{POLL_ID}-option-{POLL_OPTION_INDEX}"
                                                    value="{POLL_OPTION_INDEX}"/>
                                                <label for="component{COMPONENT_INSTANCE_ID}-poll{POLL_ID}-option-{POLL_OPTION_INDEX}"
                                                    class="radio-label">{POLL_OPTION}</label>
                                            </li>
                                            <!-- END poll_options -->
                                        </ul>
                                    </fieldset>
                                    <input type="submit" value="Vote" data-poll-validate="{COMPONENT_INSTANCE_ID}"/>
                                </form>
                            </div>
                        </div>
                        <!-- END poll_vote -->
                        <!-- BEGIN poll_actions -->
                        <nav>
                            <a href="#" class="icon-more" data-dropdown="poll-options{POLL_ID}" aria-expanded="false" title="Actions"></a>
                        </nav>
                        <ul data-dropdown-content class="f-dropdown" id="poll-options{POLL_ID}">
                            <!-- BEGIN show_results -->
                            <li><a href="/homepage/{ID}/pollResults" class="icon-poll">Show Results</a></li>
                            <!-- END show_results -->
                            <!-- BEGIN modify_poll -->
                            <li><a href="/poll/modify/{POLL_ID}" class="icon-modify">Modify</a></li>
                            <li><a href="#" data-id="{POLL_ID}" data-componentid="{COMPONENT_INSTANCE_ID}" data-poll-delete class="icon-delete">Delete</a></li>
                            <!-- END modify_poll -->
                        </ul>
                        <!-- END poll_actions -->
                    </li>
                    <!-- BEGIN poll_chart -->
                    <li>
                        <script type='text/javascript'>
                            $(function() {

                                /**
                                 * Build a graph for the pol
                                 *
                                 * @param identifier
                                 * @param data
                                 */
                                function componentPollGraph(identifier, data) {
                                    $(identifier).highcharts({
                                        chart: {
                                            height: 300,
                                            type: 'column'
                                        },
                                        title: {
                                            text: ''
                                        },
                                        xAxis: {
                                            labels: {
                                                enabled: false
                                            }
                                        },
                                        yAxis: {
                                            allowDecimals: false,
                                            min: 0,
                                            title: {
                                                text: ''
                                            }
                                        },
                                        credits: {
                                            enabled: false
                                        },
                                        series: data
                                    });
                                }

                                /* Only load highcharts once otherwise error 16
                                 * Highcharts can only load once, but you can't tell which Poll component loads it successfully
                                 * Use the fail case which occurs when error 16 occurs to just go for it
                                 */
                                $.getScript("{CDN_PREFIX}/js/bundle/highcharts.js?v={SITE_VERSION}", function() {
                                    componentPollGraph('#component-poll{POLL_ID}-graph', {POLL_DATA});
                                }).fail(function(jqxhr, settings, exception) {
                                    componentPollGraph('#component-poll{POLL_ID}-graph', {POLL_DATA});
                                });
                            });
                        </script>
                        <div id='component-poll{POLL_ID}-graph'></div>
                    </li>
                    <!-- END poll_chart -->
                    <!-- END poll_question -->
                </ul>
                <!-- BEGIN new_poll -->
                <div class="component-action">
                    <section>
                        <a href="/poll/modify/new/{ID}/{COMPONENT_INSTANCE_ID}" class="button">Create Poll</a>
                    </section>
                </div>
                <!-- END new_poll -->
            </section>
            <!-- END has_poll -->

        </div>
    </div>
</div>
<div class="toast" data-poll-toast></div>
