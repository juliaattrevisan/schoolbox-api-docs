<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
    <script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
    <script type="text/javascript">
        $(function() {

            /* Delete a poll
             */
            $('#component{COMPONENT_INSTANCE_ID}').find('[data-poll-delete]').click(function(event) {
                event.preventDefault();

                var self = $(this);

                self.confirmDialog({
                    text: 'Delete this poll and all of the results?',
                    confirmEvent: function() {
                        window.location.href = self.attr('href');
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN poll_question -->
                    <li class="actions-small-3" data-equalizer>
                        <div class="list-item">
                            <div class="avatar card small-12" data-equalizer-watch>
                                <a>
                                    <img src="{POLL_AUTHOR_THUMB}" alt="View Profile" />
                                    <h3>{POLL_QUESTION}</h3>
                                </a>
                                <p class="meta">Posted by <a href="/search/user/{POLL_AUTHOR_ID}">{POLL_AUTHOR_NAME}</a> {POLL_CREATED}</p>
                            </div>

                            <div class="list-item-content">
                                <!-- BEGIN poll_vote -->
                                <script type="text/javascript">
                                    $(function() {

                                        /* Vote validate on a per-poll basis
                                         */
                                        $('[data-component-poll={COMPONENT_INSTANCE_ID}]').submit(function(event) {
                                            var valid = false;

                                            $(this).find('[data-poll-option]').each(function(index, element) {
                                                if ($(this).prop('checked')) {
                                                    valid = true;
                                                }
                                            });

                                            if (!valid) {
                                                alert('Please select an option.');
                                            }

                                            return valid;
                                        });
                                    });
                                </script>

                                <form data-component-poll="{COMPONENT_INSTANCE_ID}" action="/poll/modifyForm.php" method="post">
                                    <input type="hidden" name="pollID" value="{POLL_ID}" />
                                    <input type="hidden" name="categoryID" value="{ID}" />

                                    <!-- BEGIN poll_options -->
                                    <input type="radio" name="vote" data-poll-option id="component{COMPONENT_INSTANCE_ID}-poll{POLL_ID}-option-{POLL_OPTION_INDEX}" value="{POLL_OPTION_INDEX}" />
                                    <label for="component{COMPONENT_INSTANCE_ID}-poll{POLL_ID}-option-{POLL_OPTION_INDEX}" class="radio-label">{POLL_OPTION}</label>
                                    <!-- END poll_options -->

                                    <input type="submit" value="Vote" data-poll-validate="{COMPONENT_INSTANCE_ID}" />
                                </form>
                                <!-- END poll_vote -->
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN show_results -->
                            <a data-equalizer-watch data-tooltip href="/homepage/{ID}/pollResults" class="icon-poll" title="Show Results"></a>
                            <!-- END show_results -->

                            <!-- BEGIN modify_poll -->
                            <a data-equalizer-watch data-tooltip href="/poll/modify/{POLL_ID}" class="icon-modify" title="Modify Poll"></a>
                            <a data-equalizer-watch data-tooltip href="/poll/modifyForm.php?delete={POLL_ID}&amp;homepageComponentID={COMPONENT_INSTANCE_ID}" data-poll-delete class="icon-delete" title="Delete Poll"></a>
                            <!-- END modify_poll -->
                        </nav>
                    </li>
                    <!-- BEGIN poll_chart -->
                    <li>
                        <script type='text/javascript'>
                            $(function() {
                                $('#component-poll{POLL_ID}-graph').highcharts({
                                    chart: {
                                        height: 300,
                                        type: 'column'
                                    },
                                    title: {
                                        text: ''
                                    },
                                    xAxis: {
                                        labels: {
                                            enabled: false
                                        }
                                    },
                                    yAxis: {
                                        allowDecimals: false,
                                        min: 0,
                                        title: {
                                            text: ''
                                        }
                                    },
                                    credits: {
                                        enabled: false
                                    },
                                    series: {POLL_DATA}
                                });
                            });
                        </script>
                        <div id='component-poll{POLL_ID}-graph'></div>
                    </li>
                    <!-- END poll_chart -->
                    <!-- END poll_question -->
                </ul>

                <div class="content">
                    <!-- BEGIN new_poll -->
                    <a href="/poll/modify/new/{ID}/{COMPONENT_INSTANCE_ID}" class="button icon-add">Create Poll</a>
                    <!-- END new_poll -->
                </div>
            </section>
        </div>
    </div>
</div>
