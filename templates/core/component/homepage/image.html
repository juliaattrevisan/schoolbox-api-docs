<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="dz-wrap">
            <form class="dropzone" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="image">
                <div class="text dz-preview dz-file-preview" style="text-align:{IMAGE_ALIGN};">
                    <span class="dz-details">
                        <img class="dz-pending" width="16" height="16" src="/images/resources/ajax.gif" style="top:50%;left:50%;"/>
                        <img data-dz-thumbnail border="0" style="position:static;height:{COMPONENT_CONFIG_PIXEL};opacity:0.5">
                    </span>

                    <div class="dz-progress">
                        <span class="dz-upload" style="position:absolute;top:0;left:0;height:100%;"></span>
                    </div>
                </div>
            </form>

            <div class="dz-container">
                <!-- BEGIN previewimage -->
                <div class="text" style="text-align:{IMAGE_ALIGN};">
                    {CONTENT_URL_START}
                    <img src="{PREVIEW_IMAGE_URL}" alt="{PREVIEW_IMAGE_DESC}"/>
                    {CONTENT_URL_END}
                </div>
                <!-- END previewimage -->
            </div>
        </div>

        <!-- BEGIN submit_image -->
        <p class="interact"><a href="/cms/file/new/{ID}" class="btn up-arrow"><span></span>Post Image</a></p>

        <script type="text/javascript">
            $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                wrapClass: 'dragging',
                previewsContainer: '#component{COMPONENT_INSTANCE_ID} .dz-container',
                createImageThumbnails: true,
                thumbnailHeight: {COMPONENT_CONFIG_PIXEL},
                thumbnailWidth: null,
                dictDefaultMessage: 'You can drag images into this space.',
                acceptedFiles: 'image/*',
                refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                tplWrap: '<li class="dz-preview" />',
                addedfile: function (file) {
                },
                sending: function (file, xhr, formData) {
                    $(file.previewElement)
                        .addClass('category-{ID}')
                        .data('node', {ID})
                        .closest('.dz-container')
                        .find('div.text:not(.dz-preview)').remove();

                    formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                    formData.append('category', $(file.previewElement).data('node'));
                    formData.append('comment', '');
                    formData.append('hidden', 0);
                },
                error: function (file) {
                    $(file.previewElement)
                        .closest('.dz-container')
                        .find('.dz-preview').remove();
                },
                success: function (file, response) {
                    var el = $(file.previewElement);

                    el.attr('data-file', response.id)
                        .removeClass('dz-processing')
                        .find('span.dz-upload')
                        .addClass('complete');

                    el.find('img.dz-pending').detach();

                    var frm = $('#' + this.element.id.replace('dropzone', 'component') + ' > .settings > form');
                    frm.find('select[name=image]').remove();
                    frm.append($('<input/>').attr('name', 'image').val(file.name.substr(0, file.name.lastIndexOf('.'))));

                    $.ajax({
                        type: frm.attr('method'),
                        url: frm.attr('action'),
                        data: frm.serialize()
                    });
                }
            });
        </script>
        <!-- END submit_image -->
    </div>
</div>
