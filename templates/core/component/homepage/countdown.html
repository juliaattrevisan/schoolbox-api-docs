<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <script type='text/javascript' src='/javascript/jquery.lwtCountdown-1.0-modified.js'></script>
    <script type='text/javascript'>
        $j(function () {
            //
            // Date and time picker plugins aren't guaranteed to exist.
            if ($j().timepicker) {
                $j('#countdownTime{COMPONENT_INSTANCE_ID}').timepicker({
                    'timeFormat':'H:i',
                    'step':15
                });
            }
            if ($j().datepicker) {
                $j('#countdownDate{COMPONENT_INSTANCE_ID}').datepicker({
                    dateFormat:'dd M yy'
                });
            }
            $j('#countdown{COMPONENT_INSTANCE_ID}').countDown({
                targetDate:{
                    'day':{DEADLINE_DAY},
                    'month':{DEADLINE_MONTH},
                    'year':{DEADLINE_YEAR},
                    'hour':{DEADLINE_HOUR},
                    'min':{DEADLINE_MIN},
                    'sec':{DEADLINE_SEC}
                }
            });
        });
    </script>
    <div id='countdown{COMPONENT_INSTANCE_ID}'>
        <div class="dash weeks_dash">
            <span class="dash_title">weeks</span>

            <div class="digit">0</div>
            <div class="digit">0</div>
        </div>

        <div class="dash days_dash">
            <span class="dash_title">days</span>

            <div class="digit">0</div>
            <div class="digit">0</div>
        </div>

        <div class="dash hours_dash">
            <span class="dash_title">hours</span>

            <div class="digit">0</div>
            <div class="digit">0</div>
        </div>

        <div class="dash minutes_dash">
            <span class="dash_title">minutes</span>

            <div class="digit">0</div>
            <div class="digit">0</div>
        </div>

        <div class="dash seconds_dash">
            <span class="dash_title">seconds</span>

            <div class="digit">0</div>
            <div class="digit">0</div>
        </div>
    </div>
</div>
