<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <script type="text/javascript" src="/javascript/components/jquery.countdown/dist/jquery.countdown.js"></script>
    <script type='text/javascript'>
        $(function () {
            var endTime = new Date({DEADLINE_YEAR}, ({DEADLINE_MONTH}-1), {DEADLINE_DAY}, {DEADLINE_HOUR}, {DEADLINE_MIN}, {DEADLINE_SEC});

            $('#component{COMPONENT_INSTANCE_ID}-countdown').countdown(endTime).on('update.countdown', function(event) {
                    var format = '%-H:%M:%S';
                    if(event.offset.days > 0) {
                        format = '%-d day%!d ' + format;
                    }
                    if(event.offset.weeks > 0) {
                        format = '%-w week%!w ' + format;
                    }
                $(this).html(event.strftime(format));
            })
            .on('finish.countdown', function(event) {
                $(this).html('Countdown has been reached!').parent().addClass('disabled');
            });

        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <div id='component{COMPONENT_INSTANCE_ID}-countdown'></div>
                </div>
            </section>
        </div>
    </div>
</div>
