<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>

                <!-- BEGIN empty_state -->
                <div class="empty-state">
                    <sbx-icon name="countdown" size="2.5rem"></sbx-icon>

                    <!-- BEGIN empty_config -->
                    <p><a href="#" class="edit empty-edit" data-target="settings" data-state="closed">Set a date and time</a> to display a countdown to an event.</p>
                    <!-- END empty_config -->

                    <!-- BEGIN empty_invalid -->
                    <p>The date and time entered is not in the correct format. Please <a href="#" class="edit empty-edit" data-target="settings" data-state="closed">try again</a>.</p>
                    <!-- END empty_invalid -->

                </div>
                <!-- END empty_state -->

                <!-- BEGIN countdown -->
                <div class="content">
                    <ul id='component{COMPONENT_INSTANCE_ID}-countdown' class="countdown-timer flex-list" data-countdown="elements" data-target-date="{DEADLINE_ISO}" data-finish-animation="{COMPONENT_CONFIG_FINISHANIMATION}"></ul>
                </div>
                <script src="{CDN_PREFIX}/js/bundle/countdown.js?v={SITE_VERSION}"></script>
                <!-- END countdown -->

            </section>
        </div>
    </div>
</div>
