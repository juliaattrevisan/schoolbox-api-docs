<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <script type="text/javascript" src="/javascript/components/jquery.countdown/dist/jquery.countdown.js"></script>
    <script type='text/javascript'>
        $(function () {
            var element       = $('#countdown{COMPONENT_INSTANCE_ID}');
            var weekDisplay   = element.find('.weeks_dash   .digit');
            var dayDisplay    = element.find('.days_dash    .digit');
            var hourDisplay   = element.find('.hours_dash   .digit');
            var minuteDisplay = element.find('.minutes_dash .digit');
            var secondDisplay = element.find('.seconds_dash .digit');
            var endTime = new Date({DEADLINE_YEAR}, ({DEADLINE_MONTH}-1), {DEADLINE_DAY}, {DEADLINE_HOUR}, {DEADLINE_MIN}, {DEADLINE_SEC});

            $('#countdown{COMPONENT_INSTANCE_ID}').countdown(endTime)
                .on('update.countdown', function(event) {
                    // Parse time into weeks, days, hours, minutes, seconds
                    weekDisplay.text(event.strftime('%w'));
                    dayDisplay.text(event.strftime('%d'));
                    hourDisplay.text(event.strftime('%H'));
                    minuteDisplay.text(event.strftime('%M'));
                    secondDisplay.text(event.strftime('%S'));
                })
                .on('finish.countdown', function() {
                    weekDisplay.text('00');
                    dayDisplay.text('00');
                    hourDisplay.text('00');
                    minuteDisplay.text('00');
                    secondDisplay.text('00');
                });
        });
    </script>

    {CONFIGURATION}

    <div data-collapsable='true' class="{CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div id='countdown{COMPONENT_INSTANCE_ID}'>
            <div class="dash weeks_dash">
                <span class="dash_title">weeks</span>
                <div class="digit">00</div>
            </div>

            <div class="dash days_dash">
                <span class="dash_title">days</span>
                <div class="digit">00</div>
            </div>

            <div class="dash hours_dash">
                <span class="dash_title">hours</span>
                <div class="digit">00</div>
            </div>

            <div class="dash minutes_dash">
                <span class="dash_title">minutes</span>
                <div class="digit">00</div>
            </div>

            <div class="dash seconds_dash">
                <span class="dash_title">seconds</span>
                <div class="digit">00</div>
            </div>
        </div>
    </div>
</div>
