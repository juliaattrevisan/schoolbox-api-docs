<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
    <script type="text/javascript">
        $j(function () {
            /* Modal for URL homepage selection
             */
            $j('#resource-browser').dialog({
                width: 650,
                autoOpen: false,
                title: "Select a homepage",
                modal: true,
                resizable: false
            });

            $j('#launch-browser-{COMPONENT_HANDLE}').click(function() {
                $j('#resource-browser').load('/ajax/resourceBrowser', {destination : '#homepage-news-{COMPONENT_HANDLE}'}, function() {
                    $j('#resource-browser').dialog('open');
                });

                return false;
            });
        });
    </script>
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div class="listing ">
        <ul>
            <!-- BEGIN news -->
            <li class="{ON_OFF} clearfix">
                <a name="news-{NEWS_ID}"></a>
                <h5 id="news-header">{NEWS_HEADING}<span>{MOD_NEWS}</span></h5>
                <div class="wysiwyg">
                    {NEWS_BODY}
                </div>
                <p class="interact hide-on-small">Posted by {EMAIL_CONTACT} {POSTED_DATE}</p>
            </li>
            <!-- END news -->
        </ul>
    </div>
    <p class="interact"> <a href="/homepage/newsArchive/{NEWS_CATEGORY_ID}" class="btn"><span></span>News Archive</a>
        <!-- BEGIN submit_news --> <a href="/news/homepage/new/{NEWS_CATEGORY_ID}" class="btn up-arrow"><span></span>Post News</a><!-- END submit_news -->
    </p>
</div>
