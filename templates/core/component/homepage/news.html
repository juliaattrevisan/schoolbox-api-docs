<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN news -->
                    <li class="row" data-equalizer>
                        <div class="small-11 columns" data-equalizer-watch>
                            <h3>
                                {NEWS_HEADING}
                            </h3>

                            <div class="avatar-card clearfix">
                                <a href="/search/user/{AUTHOR_ID}" title="View Profile">
                                    <img src="/portrait.php?userId={AUTHOR_EXTERNAL_ID}&size=square32" alt="View Profile" />
                                    <p>{AUTHOR}</p>
                                </a>

                                <p class="meta">
                                    Posted {POSTED_DATE}
                                    <!-- BEGIN has_publish_date -->
                                    (Published on {NEWS_PUBLISH_DATE})
                                    <!-- END has_publish_date -->
                                </p>
                            </div>
                        </div>
                        <div class="one actions">
                            {MOD_NEWS}
                            <a class="icon-modify no-text" href="#" title=""></a>
                        </div>

                        <div class="small-12 columns">
                            <article>
                                {NEWS_BODY}
                            </article>
                        </div>
                    </li>
                    <!-- END news -->
                </ul>

                <div class="content">
                    <a href="/homepage/newsArchive/{NEWS_CATEGORY_ID}" class="button icon-view">View News Archive</a>
                    <!-- BEGIN submit_news -->
                    <a href="/news/homepage/new/{NEWS_CATEGORY_ID}" class="button icon-upload">Post News</a>
                    <!-- END submit_news -->
                </div>
            </section>
        </div>
    </div>
</div>
