<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="information-list">
                    <!-- BEGIN news -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="avatar card small-12">
                                <a href="/search/user/{AUTHOR_ID}">
                                    <img src="/portrait.php?userId={AUTHOR_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                </a>
                                <h3>{NEWS_HEADING}</h3>
                                <p class="meta">Posted by <a href="/search/user/{AUTHOR_ID}">{AUTHOR}</a> {POSTED_DATE}</p>

                                <!-- BEGIN has_publish_date -->
                                <p class="meta">(Published on {NEWS_PUBLISH_DATE})</p>
                                <!-- END has_publish_date -->
                            </div>

                            <article>
                                {NEWS_BODY}
                            </article>
                        </div>
                        <nav>
                            <!-- BEGIN can_modify_news -->
                            <a class="icon-modify" href="/news/homepage/{NEWS_ID}" title="Modify News"></a>
                            <!-- END can_modify_news -->
                        </nav>
                    </li>
                    <!-- END news -->
                </ul>

                <div class="content">
                    <a href="/homepage/newsArchive/{NEWS_CATEGORY_ID}" class="button icon-view">View Archive</a>
                    <!-- BEGIN submit_news -->
                    <a href="/news/homepage/new/{NEWS_CATEGORY_ID}" class="button icon-upload">Post News</a>
                    <!-- END submit_news -->
                </div>
            </section>
        </div>
    </div>
</div>
