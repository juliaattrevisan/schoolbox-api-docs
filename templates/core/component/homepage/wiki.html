<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN wiki_row -->
                    <li class="actions-small-1" data-equalizer>
                        <div class="list-item">
                            <div class="avatar card small-12" data-equalizer-watch>
                                <a href='/wiki/{WIKI_CATEGORYID}/{WIKI_SLUG}' title="View Wiki">
                                    <img class="content" src="/images/mime/60x60/document.png">
                                    <h3>{WIKI_HEADING}</h3>
                                </a>
                                <p class="meta">
                                    Last edited by
                                    <a href="/search/user/{WIKI_AUTHOR_ID}" title="View Profile">{WIKI_AUTHOR}</a>
                                    {WIKI_MODIFIED}
                                </p>
                                <!-- BEGIN compact_hide -->
                                <!-- END compact_hide -->
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_wiki -->
                            <a data-equalizer-watch class="icon-modify" href="/wiki/modify/{WIKI_ID}" title="Modify Wiki"></a>
                            <!-- END modify_wiki -->
                        </nav>
                    </li>
                    <!-- END wiki_row -->
                </ul>

                <!-- BEGIN submit_wiki -->
                <div class="content">
                    <a href="/wiki/modify/new/{WIKI_CATEGORY_ID}/{COMPONENT_INSTANCE_ID}" class="button icon-add">Create Document</a>
                </div>
                <!-- END submit_wiki -->
            </section>
        </div>
    </div>
</div>
