<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <h2>{COMPONENT_NAME}</h2>
    {CONFIGURATION}
    <div class="listing">
        <ul>
            <!-- BEGIN wiki_row -->
            <li class="{ON_OFF} clearfix">
                <h4><a class="icons textfile" href="/wiki/{WIKI_CATEGORYID}/{WIKI_SLUG}">{WIKI_HEADING}</a></h4>
                <!-- BEGIN compact_hide -->
                <div class="small-right">
                    <p class="interact">
                        <!-- BEGIN modify_wiki -->
                        <a href="/wiki/modify/{WIKI_ID}">Modify</a>
                        <!-- END modify_wiki -->
                    </p>
                </div>
                <p class="interact {COMPONENT_COMPACTMODE}">Created by <a href="/search/user/{WIKI_AUTHOR_ID}">{WIKI_AUTHOR}</a> {WIKI_MODIFIED}</p>
                <!-- END compact_hide -->
            </li>

            <!-- END wiki_row -->
        </ul>
    </div>
    <!-- BEGIN submit_wiki -->
    <p class="interact"><a href="/wiki/modify/new/{WIKI_CATEGORY_ID}" class="btn add"><span></span>Create Document</a></p>
    <!-- END submit_wiki -->
</div>
