<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN wiki_row -->
                    <li class="row" data-equalizer>
                        <div class="small-11 columns" data-equalizer-watch>
                            <h3>
                                <a href='/wiki/{WIKI_CATEGORYID}/{WIKI_SLUG}'>{WIKI_HEADING}</a>
                            </h3>

                            <!-- BEGIN compact_hide -->
                            <p class="meta {COMPONENT_COMPACTMODE}">
                                Last edited by
                                <a href="/search/user/{WIKI_AUTHOR_ID}">{WIKI_AUTHOR}</a>
                                {WIKI_MODIFIED}
                            </p>
                            <!-- END compact_hide -->
                        </div>
                        <div class="one actions">
                            <!-- BEGIN modify_wiki -->
                            <a class="icon-modify no-text" href="/wiki/modify/{WIKI_ID}" title="Modify Wiki"></a>
                            <!-- END modify_wiki -->
                        </div>
                    </li>
                    <!-- END wiki_row -->
                </ul>

                <!-- BEGIN submit_wiki -->
                <div class="content">
                    <a href="/wiki/modify/new/{WIKI_CATEGORY_ID}/{COMPONENT_INSTANCE_ID}" class="button icon-add">Create Document</a>
                </div>
                <!-- END submit_wiki -->
            </section>
        </div>
    </div>
</div>
