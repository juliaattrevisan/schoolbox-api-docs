<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <div class="empty-state">
                <i class="icon-wiki"></i>
                <p><a href="/wiki/modify/new/{WIKI_CATEGORY_ID}/{COMPONENT_INSTANCE_ID}">Create a wiki</a> to allow users to collaborate on a page with tracked revisions and version control.</p>
            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_wiki -->
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <ul class="action-list">
                    <!-- BEGIN wiki_row -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="{WIKI_COMPACT} card small-12">
                                <a href='/wiki/{WIKI_CATEGORYID}/{WIKI_SLUG}' title="View Wiki">
                                    <img class="mime" src="{CDN_PREFIX}/images/mime/application-document.svg">
                                    <h3>{WIKI_HEADING}</h3>
                                </a>
                                <p class="meta {COMPONENT_COMPACTMODE_HIDE}">
                                    Last edited by
                                    <a href="/search/user/{WIKI_AUTHOR_ID}" title="View Profile">{WIKI_AUTHOR}</a>
                                    {WIKI_MODIFIED}
                                </p>
                            </div>
                        </div>
                        <nav>
                            <!-- BEGIN modify_wiki -->
                            <a class="icon-modify" href="/wiki/modify/{WIKI_ID}" title="Modify Wiki"></a>
                            <!-- END modify_wiki -->
                        </nav>
                        <!-- BEGIN compact_hide -->
                        <article>{WIKI_BODY}</article>
                        <!-- END compact_hide -->
                    </li>
                    <!-- END wiki_row -->
                </ul>

                <!-- BEGIN submit_wiki -->
                <div class="component-action">
                    <section>
                        <a href="/wiki/modify/new/{WIKI_CATEGORY_ID}/{COMPONENT_INSTANCE_ID}" class="button">Create Document</a>
                    </section>
                </div>
                <!-- END submit_wiki -->
                <!-- END source_folder_exists -->
            </section>
            <!-- END has_wiki -->

        </div>
    </div>
</div>
