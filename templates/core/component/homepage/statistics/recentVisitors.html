<div class="small-12 island">
    <h2 class="subheader">Recent Visitors</h2>
    <section>
        <!-- BEGIN has_recent_visitor -->
        <ul class="grid small-block-grid-1 medium-block-grid-2">
            <!-- BEGIN recent_visitor -->
            <li>
                <div class="avatar card">
                    <a href="/search/user/{VISITOR_ID}" title="View Profile">
                        <img src="{VISITOR_THUMB}" alt="View Profile" />

                        <p>{VISITOR_NAME}</p>
                    </a>
                    <p class="meta">{VISITOR_GROUP}</p>
                </div>
            </li>
            <!-- END recent_visitor -->
        </ul>
        <!-- END has_recent_visitor -->
        <!-- BEGIN no_recent_visitor -->
        <ul class="information-list">
            <li class="content">
                No recent {NO_VISITOR_GROUP_NAME} visitors in this time period.
            </li>
        </ul>
        <!-- END no_recent_visitor -->
    </section>
</div>
