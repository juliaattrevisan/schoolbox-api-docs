<h2>Top Files</h2>
<div class="module">
    <!-- BEGIN top_file -->

        <img src="{FILE_THUMB}"/>

        <span class="group">{FILE_DATE}</span>
        <span class="prog" style="width:{FILE_PROGRESS}%"></span>

    <!-- END top_file -->
</div>
