<div class="small-12 island">
    <h2 class="subheader">Top Visitors</h2>
    <section>
        <ul class="information-list">
            <!-- BEGIN top_visitor -->
            <li class="row">
                <div class="avatar card">
                    <a href="/search/user/{VISITOR_ID}" title="View Profile">
                        <img src="{VISITOR_THUMB}" alt="View Profile" />

                        <p>{VISITOR_NAME}</p>
                    </a>
                    <p class="meta">{VISITOR_HITS}</p>
                    <p class="meta">{VISITOR_GROUP}</p>
                </div>

                <div class="progress">
                    <span class="meter" style="width: {VISITOR_PROGRESS}%"></span>
                </div>
            </li>
            <!-- END top_visitor -->
            <!-- BEGIN no_top_visitor -->
            <li class="content">
                No {NO_TOP_VISITOR_GROUP_NAME} visitors in this time period.
            </li>
            <!-- END no_top_visitor -->
        </ul>
    </section>
</div>
