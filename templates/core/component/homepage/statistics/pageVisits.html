<!-- BEGIN custom_head -->
<style>
    .page-visits {
        border: solid 1px #eee;
        border-top: none;
        -webkit-border-bottom-right-radius: 4px;
        -webkit-border-bottom-left-radius: 4px;
        -moz-border-radius-bottomright: 4px;
        -moz-border-radius-bottomleft: 4px;
        border-bottom-right-radius: 4px;
        border-bottom-left-radius: 4px;
        min-height: 100px;
    }
    #visit-chart {
        width: 100%;
        height: 200px;
    }
</style>
<script type="text/javascript" src="/javascript/excanvas.compiled.js"></script>
<script type="text/javascript" src="/javascript/flot/jquery.flot.js"></script>

<!-- END custom_head -->
<h2 class="square-bottom">Page Visits</h2>
<div class="page-visits">
    <div id="visit-chart"></div>
</div>
<script type="text/javascript">
    var data = {GRAPH_JSON};
    var options = {
        series: {
            points: {
                show: true,
                fill: true,
                lineWidth: 6
            },
            lines: {
                show: true,
                lineWidth: 4
            }
        },
        colors: {GRAPH_COLOURS},
        xaxis:  {
            mode: "time",
            min: {GRAPH_XMIN},
            max: {GRAPH_XMAX}
        },
        yaxis:  {
            min: 0
        },
        grid:   {
            borderWidth: 0,
            show: true
        }
    };
    $j(function() {
        $j.plot($j('#visit-chart'), data, options);
    });
</script>
