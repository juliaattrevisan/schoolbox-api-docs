<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type="text/javascript">
    $(function () {
        $('#page-visit-graph').highcharts({
            title: {
                text: ''
            },
            colors: {GRAPH_COLOURS},
            xAxis: {
                min: {GRAPH_XMIN},
                max: {GRAPH_XMAX},
                type: 'datetime'
            },
            yAxis: {
                title: {
                    text: 'Visits'
                },
                allowDecimals: false,
                min: 0
            },
            series: {GRAPH_JSON},
            credits: {
                enabled: false
            }
        });
    });
</script>

<div class="small-12 island">
    <h2 class="subheader">Page Visits</h2>
    <section class="content">
        <div id="page-visit-graph"></div>
    </section>
</div>
