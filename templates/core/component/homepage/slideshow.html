<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}" data-dz-wrap>
        <div class="small-12 island">

            <!-- BEGIN empty_state -->
            <section>
                <ul class="information-list" data-dz-container></ul>
            </section>

            <div data-dz-wrap class="dropzone-wrap">
                <div data-dz-container="">
                </div>
                <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="audio"></form>
                <div class="hide" data-dz-template>
                    <li>
                        <div class="card small-12">
                            <img data-dz-thumbnail class="mime" src="{CDN_PREFIX}/images/foundation/preloader.gif"/>
                            <h3 data-dz-name></h3>
                            <p class="meta" data-dz-status>Uploading...</p>
                            <div class="progress dz-progress">
                                <span class="meter dz-upload" style="width:0;"></span>
                            </div>
                        </div>
                    </li>
                </div>

                <div class="empty-state">
                    <i class="icon-image-slideshow"></i>
                    <p><a href="/cms/file/new/{IMAGESLIDESHOW_CATEGORY_ID}">Post an image</a> or drag and drop multiple images on this component to display as a slideshow.</p>
                    <script type="text/javascript">
                        $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                            wrapClass: 'dragging',
                            wrap: '#content',
                            showIfEmpty: false,
                            previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                            previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                            createImageThumbnails: true,
                            thumbnailHeight: 400,
                            thumbnailWidth: null,
                            dictDefaultMessage: 'You can drag an image into this space.',
                            acceptedFiles: 'image/*',
                            refreshSelector: '#component{COMPONENT_INSTANCE_ID} [data-dz-wrap]',
                            refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                            sending: function (file, xhr, formData) {
                                $('#img{COMPONENT_INSTANCE_ID}').remove();

                                formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                formData.append('category', {IMAGESLIDESHOW_CATEGORY_ID});
                                formData.append('comment', '');
                                formData.append('hidden', 0);
                            },
                            error: function (file) {
                                $(file.previewElement)
                                        .closest('[data-dz-container]')
                                        .find('.dz-preview').remove();
                            },
                            success: function (file, response) {
                                // Set a localStorage item to check when the component is reloaded
                                localStorage.setItem("refreshComponent{COMPONENT_INSTANCE_ID}", "true");
                            }
                        });
                    </script>
                </div>

            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_images -->
            <section class="imageslideshow-container">
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <div class="dropzone-wrap no-margin">
                    <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="image"></form>
                    <div class="swiper" id="component{COMPONENT_INSTANCE_ID}-imageslideshow">
                        <div class="swiper-wrapper">
                            <!-- BEGIN image_slideshow -->
                            <div class="swiper-slide">
                                <div class="{COMPONENT_CONFIG_IMAGE_RATIO}">
                                    <!-- BEGIN linked_image -->
                                    <a href="{IMAGE_URL}">
                                        <img src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" loading="lazy" data-max-height="{IMAGE_DIMENSION}"/>
                                    </a>
                                    <!-- END linked_image -->
                                    <!-- BEGIN unlinked_image -->
                                    <img src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" loading="lazy" data-max-height="{IMAGE_DIMENSION}"/>
                                    <!-- END unlinked_image -->
                                    <div class="loader"></div>
                                </div>
                                <!-- BEGIN show_caption -->
                                <p class="meta">{IMAGE_NAME}</p>
                                <!-- END show_caption -->
                            </div>
                            <!-- END image_slideshow -->
                        </div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                    <script src="{CDN_PREFIX}/js/bundle/slideshow.js"></script>
                    <script>
                        (function () {
                            var init = function() {
                                let transitionConfig = {
                                    effect: 'slide',
                                };

                                switch ('{COMPONENT_CONFIG_SLIDESHOWTRANSITION}') {
                                    case 'fade':
                                        transitionConfig = {
                                            effect: 'fade',
                                            fadeEffect: {
                                                crossFade: true
                                            }
                                        };
                                        break;
                                    case 'flip':
                                        transitionConfig = {
                                            effect: 'flip',
                                            flipEffect: {
                                                slideShadows : false,
                                                limitRotation: true,
                                            }
                                        };
                                        break;
                                    case 'cube':
                                        transitionConfig = {
                                            effect: 'cube',
                                            cubeEffect: {
                                                slideShadows : false,
                                                shadow: false,
                                            }
                                        };
                                        break;
                                    case 'creative':
                                        transitionConfig = {
                                            effect: 'creative',
                                            creativeEffect: {
                                                prev: {
                                                    translate: [0, 0, -400]
                                                },
                                                next: {
                                                    translate: ['100%', 0, 0],
                                                }
                                            }
                                        };
                                        break;
                                }

                                document.dispatchEvent(
                                    new CustomEvent("swiperInitialize", {
                                        detail : {
                                            target: document.getElementById("component{COMPONENT_INSTANCE_ID}-imageslideshow"),
                                            options: Object.assign({
                                                initialSlide: {COMPONENT_RANDOM_SLIDE},
                                                autoplay: {
                                                    delay: {COMPONENT_CONFIG_TIMING_VALUE_MS}
                                                }
                                            }, transitionConfig)
                                        }
                                    })
                                );
                            }

                            const component = document.getElementById("component{COMPONENT_INSTANCE_ID}");
                            const collapser = component.querySelector('[data-collapsable="true"]');
                            if (collapser.dataset.collapseState === 'uncollapsed') {
                                init();
                            } else {
                                collapser.addEventListener('expandStop.collapsable', init);
                            }
                        })();
                    </script>
                    <ul data-dz-container class="inline-list dz-container no-margin">
                        <!-- THIS TEMPLATE WILL BE DETACHED, DON'T WORRY ABOUT THE BAD DOM -->
                        <ul class="hide" data-dz-template>
                            <li>
                                <img data-dz-thumbnail src="{CDN_PREFIX}/images/foundation/preloader.gif" />
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </li>
                        </ul>
                    </ul>
                </div>

                <!-- BEGIN image_slideshow_action -->
                <div class="component-action">
                    <section>
                        <!-- BEGIN image_slideshow_action_select_image -->
                        <p><a href="/cms/file/new/{IMAGESLIDESHOW_CATEGORY_ID}">Select an image</a> or drag and drop multiple onto this component</p>
                        <!-- END image_slideshow_action_select_image -->
                        <!-- BEGIN image_slideshow_action_view_gallery -->
                        <a href="/cms/imageGallery/{IMAGESLIDESHOW_CATEGORY_ID}?returnId={ID}" class="button">View Full Gallery</a>
                        <!-- END image_slideshow_action_view_gallery -->
                    </section>
                </div>
                <!-- END image_slideshow_action -->

                <!-- BEGIN submit_image_slideshow -->
                <script type="text/javascript">
                    $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                        wrapClass: 'dragging',
                        wrap: '#content',
                        showIfEmpty: false,
                        previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                        previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                        createImageThumbnails: true,
                        thumbnailHeight: 400,
                        thumbnailWidth: null,
                        dictDefaultMessage: 'You can drag an image into this space.',
                        acceptedFiles: 'image/*',
                        refreshSelector: '#component{COMPONENT_INSTANCE_ID} [data-dz-wrap]',
                        refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                        sending: function (file, xhr, formData) {
                            $('#img{COMPONENT_INSTANCE_ID}').remove();

                            formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                            formData.append('category', {IMAGESLIDESHOW_CATEGORY_ID});
                            formData.append('comment', '');
                            formData.append('hidden', 0);
                        },
                        error: function (file) {
                            $(file.previewElement)
                                    .closest('[data-dz-container]')
                                    .find('.dz-preview').remove();
                        },
                        success: function (file, response) {
                            // Set a localStorage item to check when the component is reloaded
                            localStorage.setItem("refreshComponent{COMPONENT_INSTANCE_ID}", "true");
                        }
                    });
                    </script>
                <!-- END submit_image_slideshow -->

                <!-- END source_folder_exists -->
            </section>
            <!-- END has_images -->

        </div>
    </div>
    <script>
        // This checks when the component reloaded so the component can still move moved on the page
        if (localStorage.getItem("refreshComponent{COMPONENT_INSTANCE_ID}") === "true") {
            localStorage.removeItem("refreshComponent{COMPONENT_INSTANCE_ID}");
            document.dispatchEvent(new CustomEvent("UPDATE_HOMEPAGE__COMPONENT_UPDATED", { detail: { component: document.getElementById("component{COMPONENT_INSTANCE_ID}") } }))
        }
    </script>
</div>
