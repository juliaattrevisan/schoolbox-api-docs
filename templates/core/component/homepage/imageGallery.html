<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    {CONFIGURATION}

    <div data-collapsable='true' class="row {CONFIG_COLLAPSED_CLASS}" data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="island small-12">

            <!-- BEGIN empty_state -->
            <div class="row">
                <div class="small-12 island">
                    <section>
                        <ul class="img-gallery information-list" data-dz-container></ul>
                    </section>
                </div>
            </div>

            <div data-dz-wrap class="dropzone-wrap">
                <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post" data-accepts="audio"></form>
                <div class="hide" data-dz-template>
                    <li>
                        <img data-dz-thumbnail src="{CDN_PREFIX}/images/foundation/preloader.gif"/>
                        <div class="progress dz-progress">
                            <span class="meter dz-upload" style="width:0;"></span>
                        </div>
                    </li>
                </div>

                <div class="empty-state" id="empty-state{COMPONENT_INSTANCE_ID}">
                    <i class="icon-image-gallery"></i>
                    <p><a href="/cms/file/new/{IMAGEGALLERY_CATEGORY_ID}">Post an image</a> or drag and drop multiple images on this component to display as clickable thumbnails in an image gallery.</p>

                    <script type="text/javascript">
                        $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                            wrapClass: 'dragging',
                            previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                            previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                            acceptedFiles: 'image/*',
                            createImageThumbnails: true,
                            dictDefaultMessage: 'You can drag images into this space.',
                            refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                            refreshData: {cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}'},
                            showIfEmpty: false,
                            sending: function (file, xhr, formData) {

                                $('#empty-state{COMPONENT_INSTANCE_ID}').hide();

                                formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                formData.append('category', {IMAGEGALLERY_CATEGORY_ID});
                                formData.append('comment', '');
                                formData.append('hidden', 0);
                            },
                            complete: function (file) {
                                $(file.previewElement).find('img.dz-pending').remove();
                            },
                            contentReloaded: () => {
                                // Let masonry know we overrode the component, so it can fix the event listeners (e.g. drag or settings)
                                document.dispatchEvent(
                                    new CustomEvent(
                                        "UPDATE_MASONRY__COMPONENT_UPDATED",
                                        { detail: { component: document.getElementById("component{COMPONENT_INSTANCE_ID}") } }
                                    )
                                );
                            }
                        });
                    </script>
                </div>

            </div>
            <!-- END empty_state -->

            <!-- BEGIN has_images -->
            <section>
                <!-- BEGIN source_folder_deleted -->
                {SOURCE_FOLDER_UNAVAILABLE}
                <!-- END source_folder_deleted -->

                <!-- BEGIN source_folder_exists -->
                <div class="dropzone-wrap">

                    <div class="content">
                        <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post"
                              data-accepts="image"></form>
                        <ul class="hide" data-dz-template>
                            <li>
                                <img data-dz-thumbnail src="{CDN_PREFIX}/images/foundation/preloader.gif"/>
                                <div class="progress dz-progress">
                                    <span class="meter dz-upload" style="width:0;"></span>
                                </div>
                            </li>
                        </ul>
                        <ul class="img-gallery" data-dz-container data-image-lightbox="lightbox[gallery-{COMPONENT_INSTANCE_ID}]">
                            <!-- BEGIN image_gallery -->
                            <li>
                                <a href="/cms/image.php?id={THUMBNAIL_ID}&height=2048&width=2048" rel="lightbox[gallery-{COMPONENT_INSTANCE_ID}]" title="{THUMBNAIL_DESCRIPTION}">
                                    <img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0"alt="{THUMBNAIL_DESCRIPTION}"/>
                                </a>
                            </li>
                            <!-- END image_gallery -->
                        </ul>
                        <script>
                            if (window.sbProps.lightGalleryInit) { window.sbProps.lightGalleryInit(); }
                        </script>
                    </div>

                    <div class="component-action">
                        <section>
                            <!-- BEGIN submit_image_gallery -->
                            <script type="text/javascript">
                                $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                                    wrapClass: 'dragging',
                                    previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                                    previewTemplate: '#component{COMPONENT_INSTANCE_ID} [data-dz-template]',
                                    acceptedFiles: 'image/*',
                                    createImageThumbnails: true,
                                    dictDefaultMessage: 'You can drag images into this space.',
                                    refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                                    refreshData: {cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}'},
                                    showIfEmpty: false,
                                    sending: function (file, xhr, formData) {
                                        formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                        formData.append('category', {IMAGEGALLERY_CATEGORY_ID});
                                        formData.append('comment', '');
                                        formData.append('hidden', 0);
                                    },
                                    complete: function (file) {
                                        $(file.previewElement).find('img.dz-pending').remove();
                                    },
                                    contentReloaded: () => {
                                        // Let masonry know we overrode the component, so it can fix the event listeners (e.g. drag or settings)
                                        document.dispatchEvent(
                                            new CustomEvent(
                                                "UPDATE_MASONRY__COMPONENT_UPDATED",
                                                { detail: { component: document.getElementById("component{COMPONENT_INSTANCE_ID}") } }
                                            )
                                        );
                                    }
                                });
                            </script>
                            <p><a href="/cms/file/new/{IMAGEGALLERY_CATEGORY_ID}">Select an image</a> or drag and drop multiple onto this component</p>
                            <!-- END submit_image_gallery -->
                            <a href="/cms/imageGallery/{IMAGEGALLERY_CATEGORY_ID}?returnId={ID}" class="button">View Full Gallery</a>
                        </section>
                    </div>

                </div>
                <!-- END source_folder_exists -->
            </section>
            <!-- END has_images -->

        </div>
    </div>
</div>
