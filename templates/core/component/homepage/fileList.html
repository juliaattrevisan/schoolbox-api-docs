<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type='text/javascript' src='/javascript/preview/preview.js'></script>
    <script type="text/javascript">
        $(function() {
            $('[data-plugin="preview"]').preview();
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="dropzone-wrap">
                    <form class="dropzone overlay" id="dropzone{COMPONENT_INSTANCE_ID}" action="/cms/fileForm.php?ajax=1" method="post"></form>

                    <ul data-dz-container class="action-list">
                        <!-- BEGIN files -->
                        <li class="actions-small-1" data-equalizer>
                            <div class="list-item {HIDDEN}">
                                <div class="avatar card small-12" data-equalizer-watch>
                                    <!-- BEGIN file_url -->
                                    <a data-plugin="preview" href="{FILE_URL}" rel="external">
                                        <img class="content" src="/images/mime/60x60/{FILE_MIME_IMAGE}" />
                                        <h3>{FILE_DESCRIPTION}</h3>
                                    </a>
                                    <!-- END file_url -->
                                    <!-- BEGIN file_no_url -->
                                    <img src="/images/mime/60x60/{FILE_MIME_IMAGE}" />
                                    <h3>{FILE_DESCRIPTION}</h3>
                                    <!-- END file_no_url -->

                                    <p class="meta">
                                        Posted by
                                        <a href="/search/user/{FILE_POSTED_BY_ID}">{FILE_POSTED_BY}</a>
                                        {FILE_POSTED_RELATIVE}
                                    </p>
                                </div>
                                <div class="list-item-content {COMPONENT_COMPACTMODE}">
                                    <p>{FILE_COMMENT}</p>
                                </div>
                            </div>
                            <nav>
                                <!-- BEGIN modify_file -->
                                <a data-equalizer-watch class="icon-modify" href="/cms/file/{FILE_ID}" title="Modify File"></a>
                                <!-- END modify_file -->
                            </nav>
                        </li>
                        <!-- END files -->
                    </ul>
                </div>

                <div class="content">
                    <a href="/resources/{FILE_CAT_ID}" class="button icon-view">View All Files</a>

                    <!-- BEGIN submit_file -->
                    <a href="/cms/file/new/{FILE_CAT_ID}" class="button icon-upload">Post File</a>
                    <a href="/cms/file/multi/{FILE_CAT_ID}" class="button icon-upload">Post Multiple Files</a>
                    <script type="text/javascript">
                        $(function() {
                            $('#dropzone{COMPONENT_INSTANCE_ID}').fileDrop({
                                wrapClass: 'dragging',
                                previewsContainer: '#component{COMPONENT_INSTANCE_ID} [data-dz-container]',
                                tplWrap: '<li class="dz-preview" />',
                                refreshSelector: '#component{COMPONENT_INSTANCE_ID}',
                                refreshData: { cid: '{ID}', reload: '{COMPONENT_INSTANCE_ID}' },
                                dictDefaultMessage: 'You can drag files into this space.',
                                addedfile: function (file) {
                                    $(file.previewElement).addClass('category-{FILE_CAT_ID}').data('node', {FILE_CAT_ID});
                                },
                                sending: function (file, xhr, formData) {
                                    formData.append('description', file.name.substr(0, file.name.lastIndexOf('.')));
                                    formData.append('category', $(file.previewElement).data('node'));
                                    formData.append('comment', '');
                                    formData.append('hidden', 0);
                                },
                                complete: function (file) {
                                    $(file.previewElement).find('img').remove();
                                }
                            });
                        });
                    </script>
                    <!-- END submit_file -->
                </div>
            </section>
        </div>
    </div>
</div>
