<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN forum -->
                    <li class="row" data-equalizer>
                        <div class="ten-column" data-equalizer-watch>
                            <h3>
                                <a href='/forum/thread/{THREAD_ID}'>{THREAD_TITLE}</a>
                            </h3>

                            <div class="avatar-card clearfix">
                                <a href="/search/user/{THREAD_USER_ID}" title="View Profile">
                                    <img src="/portrait.php?userId={THREAD_USER_EXTERNAL_ID}&size=square32" alt="View Profile" />
                                    <p>{THREAD_USER}</p>
                                </a>
                                <p class="meta">Posted on {THREAD_DATE}</p>
                            </div>
                        </div>
                        <div class="two actions">
                            <!-- BEGIN forum_reply -->
                            <a class="icon-forum no-text" href="/forum/modify/{ID}/{THREAD_ID}" title="Post a reply"></a>
                            <!-- END forum_reply -->

                            <a class="icon-next no-text" href="/forum/{COMPONENT_CONFIG_SRC_ID}" title="Go to Forum"></a>
                        </div>
                    </li>
                    <!-- END forum -->
                </ul>

                <div class="content">
                    <!-- BEGIN forum_post -->
                    <a class="button icon-add" href="/forum/modify/{COMPONENT_CONFIG_SRC_ID}">Post Thread</a>
                    <!-- END forum_post -->
                </div>
            </section>
        </div>
    </div>
</div>
