<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <ul class="action-list">
                    <!-- BEGIN forum -->
                    <li class="row" data-equalizer>
                        <div class="ten-column no-pad" data-equalizer-watch>
                            <div class="avatar card">
                                <a href='/forum/thread/{THREAD_ID}'>
                                    <img src="/portrait.php?userId={THREAD_USER_EXTERNAL_ID}&size=square64" alt="{THREAD_USER}" />
                                    <h3>
                                        {THREAD_TITLE}
                                    </h3>
                                </a>
                                <p class="meta">Posted by {THREAD_USER} {THREAD_DATE}</p>
                            </div>
                        </div>
                        <div class="two actions">
                            <!-- BEGIN forum_reply -->
                            <a data-equalizer-watch class="icon-forum no-text" href="/forum/modify/{ID}/{THREAD_ID}" data-tooltip title="Post a reply"></a>
                            <!-- END forum_reply -->

                            <a data-equalizer-watch class="icon-next no-text" href="/forum/{COMPONENT_CONFIG_SRC_ID}" data-tooltip title="Go to Forum"></a>
                        </div>
                    </li>
                    <!-- END forum -->
                </ul>

                <div class="content">
                    <!-- BEGIN forum_post -->
                    <a class="button icon-add" href="/forum/modify/{COMPONENT_CONFIG_SRC_ID}">Post Thread</a>
                    <!-- END forum_post -->
                </div>
            </section>
        </div>
    </div>
</div>
