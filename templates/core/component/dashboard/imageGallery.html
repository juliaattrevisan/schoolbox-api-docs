<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section class="content">
                <ul class="inline-list img-gallery" data-image-gallery>
                    <!-- BEGIN image_gallery -->
                    <li>
                        <a href="/cms/image.php?id={THUMBNAIL_ID}&height=2048&width=2048"
                           rel="lightbox[homepage-{COMPONENT_INSTANCE_ID}]" style="height:{IMAGE_HEIGHT}px;"
                           alt="{THUMBNAIL_DESCRIPTION}" title="{THUMBNAIL_DESCRIPTION}">
                            <img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0" alt="{THUMBNAIL_DESCRIPTION}" />
                        </a>
                    </li>
                    <!-- END image_gallery -->
                </ul>
                <script type="text/javascript">
                    $('[data-image-gallery] li').magnificPopup({
                        delegate: 'a',
                        type: 'image'
                    });
                </script>
            </section>
        </div>
    </div>
</div>
