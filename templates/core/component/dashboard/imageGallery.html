<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section class="content">
                <ul class="img-gallery" data-image-lightbox>
                    <!-- BEGIN image_gallery -->
                    <li href="/cms/image.php?id={THUMBNAIL_ID}&height=2048&width=2048">
                        <a><img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0" alt="{THUMBNAIL_DESCRIPTION}" /></a>
                    </li>
                    <!-- END image_gallery -->
                </ul>
                <script>
                    if (window.sbProps.lightGalleryInit) { window.sbProps.lightGalleryInit(); }
                </script>
            </section>
            <div class="component-action">
                <section>
                    <a href="/cms/imageGallery/{IMAGEGALLERY_CATEGORY_ID}" class="button">View Full Gallery</a>
                </section>
            </div>
        </div>
    </div>
</div>
