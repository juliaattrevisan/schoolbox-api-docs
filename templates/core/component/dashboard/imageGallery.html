<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul class="clearing-thumbs" data-clearing>
                        <!-- BEGIN image_gallery -->
                        <li>
                            <a class="th"
                               href="/cms/image.php?id={THUMBNAIL_ID}&height=600&width=800"
                               style="height:{IMAGE_HEIGHT}px;"
                               title="{THUMBNAIL_DESCRIPTION}"
                            >
                                <img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0" alt="{THUMBNAIL_DESCRIPTION}" border="0"/>
                            </a>
                        </li>
                        <!-- END image_gallery -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
