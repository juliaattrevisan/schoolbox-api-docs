<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <!-- BEGIN student_block -->
                    <div class="row">
                        <div class="small-12 columns avatar-card">
                            <a href="/search/user/{STUDENT_ID}" title="View Profile">
                                <img src="/portrait.php?userId={STUDENT_EXTERNAL_ID}&size=constrain64" alt="{STUDENT_NAME}"/>
                                <p>{STUDENT_NAME}</p>
                            </a>
                            <p class="meta">Year {STUDENT_YEAR}</p>
                        </div>
                    </div>

                    <ul class="action-list">
                        <!-- BEGIN subject_block -->
                        <li class="row">
                            <div class="small-11 columns">
                                <a href="/homepage/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a>
                            </div>
                            <div class="small-1 columns">
                                <a href="/homepage/{STUDENT_SUBJECT_CODE}">
                                    <i class="icon-next no-text"></i>
                                </a>
                            </div>
                        </li>
                        <!-- END subject_block -->
                    </ul>

                    <div class="row">
                        <div class="small-12 columns">
                            <a href="/timetable/{STUDENT_ID}" class="button icon-timetable">Timetable</a>

                            <a href="/calendar/full/{CAL_TODAY_DATE}/{STUDENT_ID}" class="button icon-calendar">Calendar</a>

                            <!-- BEGIN due_work -->
                            <a href="/submission/dueWork/0/{STUDENT_ID}" class="button icon-due-work">Due Work</a>
                            <!-- END due_work -->

                            <!-- BEGIN grades_button -->
                            <a href="/submission/allWork/{STUDENT_ID}" class="button icon-poll" title="View grades">Grades</a>
                            <!-- END grades_button -->

                            <!-- BEGIN eportfolio -->
                            <a href="/eportfolio/{STUDENT_ID}/profile" class="button icon-eportfolio">ePortfolio</a>
                            <!-- END eportfolio -->
                        </div>
                    </div>

                    <!-- END student_block -->
                </div>
            </section>
        </div>
    </div>
</div>
