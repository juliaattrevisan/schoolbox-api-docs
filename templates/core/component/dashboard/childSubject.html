<div id='component{COMPONENT_INSTANCE_ID}' class='{COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <!-- Custom javascript -->

    {CONFIGURATION}
    <h2 class="subheader">{COMPONENT_NAME}</h2>

    <!-- BEGIN student_block -->
    <div class="row">
        <div class="small-12 island">
            <section>
                <div class="card small-12">
                    <a href="/search/user/{STUDENT_ID}">
                        <img src="/portrait.php?id={STUDENT_ID}&size=square64" title="View Profile" />
                        <h3>{STUDENT_NAME}</h3>
                    </a>
                    <p class="meta">{STUDENT_YEAR}</p>
                </div>

                <ul class="action-list">
                    <!-- BEGIN subject_block -->
                    <li>
                        <div class="compact card small-12">
                            <div class="icon-home" title="Visit Homepage"></div>
                            <a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a>
                        </div>
                    </li>
                    <!-- END subject_block -->
                </ul>

                <div class="small-12 columns no-pad">
                    {BUTTON_ISLAND}
                </div>
            </section>
        </div>
    </div>
    <!-- END student_block -->
</div>
