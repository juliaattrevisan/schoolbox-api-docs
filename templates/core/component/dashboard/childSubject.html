<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul class="listing">
                        <!-- BEGIN student_block -->
                        <li class="avatar-card">
                            <a href="/search/user/{STUDENT_ID}" title="View Profile">
                                <img src="/portrait.php?userId={STUDENT_EXTERNAL_ID}&size=constrain64" alt="{STUDENT_NAME}"/>
                                <p>{STUDENT_NAME}</p>
                            </a>
                            <p class="meta">Year {STUDENT_YEAR}</p>
                        </li>

                        <li class="image-height clearfix">
                            <div class="student-details">
                                <ul class="listing subjects">
                                    <!-- BEGIN subject_block -->
                                    <li><a href="/homepage/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a></li>
                                    <!-- END subject_block -->
                                </ul>
                                <a href="/timetable/{STUDENT_ID}" class="btn float-left time-table"><span></span>Timetable</a>

                                <a href="/calendar/full/{CAL_TODAY_DATE}/{STUDENT_ID}" class="btn float-left calendar"><span></span>Calendar</a>

                                <!-- BEGIN due_work -->
                                <a href="/submission/dueWork/0/{STUDENT_ID}" class="btn float-left due-work"><span></span>Due Work</a>
                                <!-- END due_work -->

                                <!-- BEGIN grades_button -->
                                <a href="/submission/allWork/{STUDENT_ID}" class="btn float-left tick" title="View grades"><span></span>Grades</a>
                                <!-- END grades_button -->

                                <!-- BEGIN eportfolio -->
                                <a href="/eportfolio/{STUDENT_ID}/profile" class="btn float-left eportfolio"><span></span>ePortfolio</a>
                                <!-- END eportfolio -->

                            </div>
                        </li>
                        <!-- END student_block -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
