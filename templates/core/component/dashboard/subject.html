<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <!-- Custom javascript -->
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section>
                <ul class="dashboard-subject-list grid small-block-grid-1 medium-block-grid-2">
                    <!-- BEGIN subject -->
                    <li class="subject subject-{SUBJECT_CODE}">
                        <div class="card small-12">
                            <a href="/homepage/code/{SUBJECT_CODE_URL}" title="{SUBJECT_NAME}">
                                <sbx-icon name="home" size="2rem"></sbx-icon>
                                <h3>{SUBJECT_NAME}</h3>
                                <p class="meta">{SUBJECT_CODE}</p>
                            </a>
                        </div>
                    </li>
                    <!-- END subject -->
                </ul>
            </section>
        </div>
    </div>
</div>
