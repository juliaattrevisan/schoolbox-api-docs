<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->
    <script type="text/javascript">
        $(function () {
            // Show all news in first category
            var component     = $('#component{COMPONENT_INSTANCE_ID}');
            var categoryLinks = component.find('[data-relation]');
            var newsItems     = component.find('[data-news-topic]');
            var firstCategory = categoryLinks.first();

            var newsFilter = function(topic) {
                var comparator = function() {
                    return $(this).data('news-topic') == topic;
                };
                newsItems.filter(comparator).removeClass('hide');
                newsItems.not(comparator).addClass('hide');
            };
            newsFilter(firstCategory.data('relation'));

            // Switch titles
            categoryLinks.click(function (event) {
                event.preventDefault();
                newsFilter($(this).data('relation'));
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul>
                        <!-- BEGIN topic_header -->
                        <li><a href="#" data-relation="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
                        <!-- END topic_header -->
                    </ul>

                    <ul class="action-list">
                        <!-- BEGIN topic -->
                        <!-- BEGIN news -->
                        <li class="row" data-news-topic="{TOPIC_CLEAN}">
                            <!-- BEGIN news_image -->
                            <a class="thumbnail" href="{NEWS_URL}" title="{NEWS_TITLE}">
                                <img width="64" height="64" src="/storage/image.php?hash={NEWS_IMAGE}&size=square64"/>
                            </a>
                            <!-- END news_image -->

                            <h3><a href="{NEWS_URL}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
                            <p class="meta">Posted {NEWS_TIME}</p>
                            <p>{NEWS_SHORT}</p>
                        </li>
                        <!-- END news -->
                        <!-- END topic -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
