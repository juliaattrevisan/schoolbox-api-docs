<script type="text/javascript">
    $j(function () {
        $j('#category li:first-child a').addClass('current');
        $j('ul.topic li:first-child').show();

        $j('#category a').click(function (event) {
            event.preventDefault();
            if (!$j(this).hasClass("current")) {
                $j('#category a').removeClass('current');
                $j(this).addClass('current');
                var el = $j(this).attr('title');
                $j('ul.topic > li').hide();
                $j('ul.topic > li.' + el).show();
            }
            return false;
        });
    });
</script>

<div class="box">
    <h2>News Headlines</h2>

    <ul id="category" class="admin-nav">
        <!-- BEGIN topic_header -->
        <li><a href="#" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
        <!-- END topic_header -->
    </ul>
	<ul class="topic">
		<!-- BEGIN topic -->
		<li class="hide {TOPIC_CLEAN}">
			<ul class="information-list">
				<!-- BEGIN news -->
				<li class="{ON_OFF} clearfix">
					<!-- BEGIN news_image -->
					<a class="thumbnail" href="{NEWS_URL}" title="{NEWS_TITLE}">
						<img width="64" height="64" src="/storage/image.php?hash={NEWS_IMAGE}&size=square64"/>
					</a>
					<!-- END news_image -->

					<h3><a href="{NEWS_URL}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
					<p class="meta">Posted {NEWS_TIME}</p>
					{NEWS_SHORT}
					<a class="read-more" href="{NEWS_URL}">Read more&hellip;</a>
				</li>
				<!-- END news -->
			</ul>
		</li>
		<!-- END topic -->
	</ul>
</div>
