<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->
    <script type="text/javascript">
        $(function () {
            // Show all news in first category
            var firstCategory = $('#category li:first-child a').addClass('current');
            $('ul.topic li').filter('.'+firstCategory.attr('title')).removeClass('hide');

            // Switch titles
            $('#category a').click(function (event) {
                event.preventDefault();
                if (!$(this).hasClass("current")) {
                    $('#category a').removeClass('current');
                    $(this).addClass('current');
                    var el = $(this).attr('title');
                    $('ul.topic > li').addClass('hide');;
                    $('ul.topic > li.' + el).removeClass('hide');;
                }
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul id="category" class="admin-nav">
                        <!-- BEGIN topic_header -->
                        <li><a href="#" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
                        <!-- END topic_header -->
                    </ul>
                    <ul class="topic">
                        <!-- BEGIN topic -->
                        <li class="hide {TOPIC_CLEAN}">
                            <ul class="information-list">
                                <!-- BEGIN news -->
                                <li class="{ON_OFF} clearfix">
                                    <!-- BEGIN news_image -->
                                    <a class="thumbnail" href="{NEWS_URL}" title="{NEWS_TITLE}">
                                        <img width="64" height="64" src="/storage/image.php?hash={NEWS_IMAGE}&size=square64"/>
                                    </a>
                                    <!-- END news_image -->

                                    <h3><a href="{NEWS_URL}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
                                    <p class="meta">Posted {NEWS_TIME}</p>
                                    <p>{NEWS_SHORT}</p>
                                </li>
                                <!-- END news -->
                            </ul>
                        </li>
                        <!-- END topic -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
