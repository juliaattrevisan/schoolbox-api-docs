<div id='component{COMPONENT_INSTANCE_ID}' data-component>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul class="tabs" data-tab>
                        <!-- BEGIN topic_header -->
                        <li class="tab-title">
                            <a href="#component{COMPONENT_INSTANCE_ID}-{TOPIC_CLEAN}">{NEWS_TOPIC}</a>
                        </li>
                        <!-- END topic_header -->
                    </ul>

                    <div class="tabs-content">
                        <!-- BEGIN topic -->
                        <ul class="action-list content" id="component{COMPONENT_INSTANCE_ID}-{TOPIC_CLEAN}">
                            <!-- BEGIN news -->
                            <li class="row" data-news-topic="{TOPIC_CLEAN}">
                                <div class="avatar-card">
                                    <a href="{NEWS_URL}" title="{NEWS_TITLE}">
                                        <!-- BEGIN news_image -->
                                        <img src="/storage/image.php?hash={NEWS_IMAGE}&size=square64"/>
                                        <!-- END news_image -->
                                        <!-- BEGIN news_no_image -->
                                        <div class="icon-news icon-64"></div>
                                        <!-- END news_no_image -->
                                        <h3>{NEWS_TITLE}</h3>
                                    </a>
                                    <p class="meta">
                                        Posted by <a href="/user/profile/{NEWS_AUTHOR_ID}">{NEWS_AUTHOR_NAME}</a> {NEWS_TIME}
                                    </p>
                                </div>
                                <article>{NEWS_SHORT}</article>
                            </li>
                            <!-- END news -->
                        </ul>
                        <!-- END topic -->
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
