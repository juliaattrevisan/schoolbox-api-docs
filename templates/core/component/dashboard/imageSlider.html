<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->
    <script type="text/javascript" src="/javascript/components/anyslider/dist/jquery.anyslider.min.js"></script>
    <script type="text/javascript">
        $(function(){
            $("#imageSlider").AnySlider({
                interval: {COMPONENT_CONFIG_TIMING_VALUE_MS}
            });
        });
    </script>

    <!-- BEGIN has_header -->
    {CONFIGURATION}
    <!-- END has_header -->

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content" id="imageSlider">
                    <!-- BEGIN image_scroller -->
                    <div>
                        <a href="{IMAGE_URL}">
                            <img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}" alt="{IMAGE_NAME}"/>
                        </a>
                    </div>
                    <!-- END image_scroller -->
                </div>
            </section>
        </div>
    </div>
</div>
