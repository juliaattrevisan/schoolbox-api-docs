<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script src="{CDN_PREFIX}/js/vendors/swiper/dist/js/swiper.min.js?v={SITE_VERSION}"></script>
    <script src="{CDN_PREFIX}/js/gallery/jquery.alaressSlider.js?v={SITE_VERSION}"></script>
    <script>
        $(function() {
            $('#component{COMPONENT_INSTANCE_ID}-imageslider').alaressSlider({
                pagination: {
                    el: '#component{COMPONENT_INSTANCE_ID}-imageslider-pagination'
                },
                navigation: {
                    nextEl: '#component{COMPONENT_INSTANCE_ID}-imageslider-button-next',
                    prevEl: '#component{COMPONENT_INSTANCE_ID}-imageslider-button-prev'
                },
                alaress: {
                    autoplayDelay: {COMPONENT_CONFIG_TIMING_VALUE_MS}
                }
            });
        });
    </script>

    {CONFIGURATION}

    <!-- BEGIN has_header -->
    <h2 class="subheader">{COMPONENT_NAME}</h2>
    <!-- END has_header -->

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 columns">
            <div class="swiper-container" id="component{COMPONENT_INSTANCE_ID}-imageslider">
                <div class="swiper-wrapper">
                    <!-- BEGIN image_scroller -->
                    <div class="swiper-slide">
                        <!-- BEGIN linked_image -->
                        <a href="{IMAGE_URL}">
                            <img data-src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" class="swiper-lazy" />
                        </a>
                        <div class="loader"></div>
                        <!-- END linked_image -->
                        <!-- BEGIN unlinked_image -->
                        <img data-src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" class="swiper-lazy" />
                        <div class="loader"></div>
                        <!-- END unlinked_image -->
                    </div>
                    <!-- END image_scroller -->
                </div>
                <div class="swiper-button-next" id="component{COMPONENT_INSTANCE_ID}-imageslider-button-next"></div>
                <div class="swiper-button-prev" id="component{COMPONENT_INSTANCE_ID}-imageslider-button-prev"></div>
            </div>
            <div class="swiper-pagination" id="component{COMPONENT_INSTANCE_ID}-imageslider-pagination"></div>
        </div>
    </div>
</div>
