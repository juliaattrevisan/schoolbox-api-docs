<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">
                {COMPONENT_NAME}
            </h2>
            <section>
                <!-- BEGIN default_video -->
                <video data-role="media-player"
                       controls
                       preload="none"
                       poster="/cms/videoThumb.php?type=sbfs&id={DEFAULT_VIDEO_ID}&size=poster"
                       width="100%"
                       height="400"
                       style="max-width: 100%; height: 400px;"
                >
                    <source src="/cms/sendVideo.php?type=sbfs&id={DEFAULT_VIDEO_ID}" type='video/mp4'>
                </video>
                <!-- END default_video -->

                <ul class="information-list">
                    <!-- BEGIN video_list -->
                    <li class="row">
                        <div class="list-item">
                            <div class="card small-12">
                                <a href="#" data-media-id="{VIDEO_LIST_ID}">
                                    <img src="/cms/videoThumb.php?type=sbfs&id={VIDEO_LIST_ID}" />
                                    <p>{VIDEO_LIST_TITLE}</p>
                                </a>
                                <p class="meta">{VIDEO_LIST_DURATION} | Posted by

                                    <!-- BEGIN owner_exists -->
                                    <a href="/search/user/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a>
                                    <!-- END owner_exists -->

                                    <!-- BEGIN owner_deleted -->
                                    {VIDEO_LIST_POSTER}
                                    <!-- END owner_deleted -->

                                </p>
                            </div>
                        </div>
                        <!-- BEGIN video_list_comment -->
                        <article>{VIDEO_LIST_COMMENT}</article>
                        <!-- END video_list_comment -->
                    </li>
                    <!-- END video_list -->
                    <!-- BEGIN video_pending_list -->
                    <li class="row">
                        <div class="list-item">
                            <div class="card small-12">
                                <img src="{CDN_PREFIX}/images/core/component/video-thumbnail-{VIDEO_LIST_STATUS}.gif" title="Currently transcoding {VIDEO_LIST_TITLE}" />
                                <p>{VIDEO_LIST_TITLE}</p>
                                <p class="meta">Posted by <a href="/search/user/{VIDEO_LIST_POSTER_ID}">{VIDEO_LIST_POSTER}</a></p>
                            </div>
                        </div>
                        <!-- BEGIN video_pending_comment -->
                        <article>{VIDEO_PENDING_COMMENT}</article>
                        <!-- END video_pending_comment -->
                    </li>
                    <!-- END video_pending_list -->
                </ul>
            </section>
        </div>
    </div>

    <script type="text/javascript">
        $(function() {
            var component    = $('#component{COMPONENT_INSTANCE_ID}');
            var videoElement = component.find('[data-role="media-player"]').mediaelementplayer();
            var video        = videoElement.data('mediaelementplayer');
            component.find('[data-media-id]').click(function(event) {
                event.preventDefault();
                var videoId = $(this).data('media-id');
                var $target = "/cms/sendVideo.php?type=sbfs&id="+videoId;
                var $poster = "/cms/videoThumb.php?type=sbfs&id="+videoId+"&size=poster";
                // setting video plugin's poster doesn't work as expected,
                // so set the video's poster directly
                videoElement.attr('poster', $poster);
                video.setSrc($target);
                video.setPoster($poster);
                video.load();
            });
        });
    </script>
</div>
