<div id='component{COMPONENT_INSTANCE_ID}' data-component class="top">
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section>
                <ul class="information-list">
                    <!-- BEGIN tweet -->
                    <li class="row" data-equalizer>
                        <div class="avatar-card clearfix">
                            <a href="https://twitter.com/{TWEET_AUTHOR}" title="View Profile">
                                <img src="{TWEET_AVATAR}" alt="View Profile" />
                                <p>{TWEET_FULLNAME}</p>

                                <p class="meta">@{TWEET_AUTHOR}</p>
                            </a>

                            <p class="meta">Tweeted on {TWEET_DATE}</p>
                        </div>

                        <article>
                            <p>
                                {TWEET_TEXT}
                            </p>

                            <!-- BEGIN tweet_media -->
                            <p>
                                <img src="{TWEET_MEDIA_URL}:small" />
                            </p>
                            <!-- END tweet_media -->
                        </article>
                    </li>
                    <!-- END tweet -->
                </ul>

                <div class="content">
                    <a class="button icon-twitter" href="{SEARCH_URL}">Search on Twitter</a>
                </div>
            </section>
        </div>
    </div>
</div>
