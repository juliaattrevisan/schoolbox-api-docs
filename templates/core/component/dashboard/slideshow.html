<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    {CONFIGURATION}

    <!-- BEGIN has_header -->
    <h2 class="subheader">{COMPONENT_NAME}</h2>
    <!-- END has_header -->

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 columns">
            <div class="swiper" id="component{COMPONENT_INSTANCE_ID}-imageslideshow">
                <div class="swiper-wrapper">
                    <!-- BEGIN image_slideshow -->
                    <div class="swiper-slide">
                        <div class="{COMPONENT_CONFIG_IMAGE_RATIO}">
                            <!-- BEGIN linked_image -->
                            <a href="{IMAGE_URL}">
                                <img src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" loading="lazy" data-max-height="{IMAGE_DIMENSION}"/>
                            </a>
                            <!-- END linked_image -->
                            <!-- BEGIN unlinked_image -->
                            <img src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" loading="lazy" data-max-height="{IMAGE_DIMENSION}"/>
                            <!-- END unlinked_image -->
                            <div class="loader"></div>
                        </div>
                        <!-- BEGIN show_caption -->
                        <p class="meta">{IMAGE_NAME}</p>
                        <!-- END show_caption -->
                    </div>
                    <!-- END image_slideshow -->
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </div>
    <script src="{CDN_PREFIX}/js/bundle/slideshow.js"></script>
    <script>
        (function() {
            let transitionConfig = {
                effect: 'slide',
            };

            switch ('{COMPONENT_CONFIG_SLIDESHOWTRANSITION}') {
                case 'fade':
                    transitionConfig = {
                        effect: 'fade',
                        fadeEffect: {
                            crossFade: true
                        }
                    };
                    break;
                case 'flip':
                    transitionConfig = {
                        effect: 'flip',
                        flipEffect: {
                            slideShadows : false,
                            limitRotation: true,
                        }
                    };
                    break;
                case 'cube':
                    transitionConfig = {
                        effect: 'cube',
                        cubeEffect: {
                            slideShadows : false,
                            shadow: false,
                        }
                    };
                    break;
                case 'creative':
                    transitionConfig = {
                        effect: 'creative',
                        creativeEffect: {
                            prev: {
                                translate: [0, 0, -400]
                            },
                            next: {
                                translate: ['100%', 0, 0],
                            }
                        }
                    };
                    break;
            }

            document.dispatchEvent(
                new CustomEvent("swiperInitialize", {
                    detail : {
                        target: document.getElementById("component{COMPONENT_INSTANCE_ID}-imageslideshow"),
                        options: Object.assign({
                            initialSlide: {COMPONENT_RANDOM_SLIDE},
                            autoplay: {
                                delay: {COMPONENT_CONFIG_TIMING_VALUE_MS}
                            }
                        }, transitionConfig)
                    }
                })
            );
        })();
    </script>
</div>
