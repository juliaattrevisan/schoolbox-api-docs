<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <!-- BEGIN has_header -->
    <h2 class="subheader">{COMPONENT_NAME}</h2>
    <!-- END has_header -->

    <section class="swiper" id="component{COMPONENT_INSTANCE_ID}-imageslider">
        <div class="swiper-wrapper">
            <!-- BEGIN image_scroller -->
            <div class="swiper-slide">
                <div class="{COMPONENT_CONFIG_IMAGE_RATIO}">
                    <img src="/cms/image.php?id={IMAGE_ID}&height=2048&width=2048" loading="lazy" />
                    <div class="loader"></div>
                </div>
                <!-- BEGIN show_caption -->
                <p class="meta">{IMAGE_NAME}</p>
                <!-- END show_caption -->
            </div>
            <!-- END image_scroller -->
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </section>
    <script src="{CDN_PREFIX}/js/bundle/slideshow.js"></script>
    <script>
        document.dispatchEvent(
            new CustomEvent("swiperInitialize", {
                detail : {
                    target: document.getElementById("component{COMPONENT_INSTANCE_ID}-imageslider"),
                    options: {
                        initialSlide: {COMPONENT_RANDOM_SLIDE},
                        autoplay: {
                            delay: {COMPONENT_CONFIG_TIMING_VALUE_MS}
                        }
                    }
                }
            })
        );
    </script>
</div>
