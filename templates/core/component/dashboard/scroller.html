<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script src="/javascript/components/swiper/dist/js/swiper.min.js"></script>
    <script type="text/javascript">
        $(function(){
            var component = $("#component{COMPONENT_INSTANCE_ID}");
            var swiper = new Swiper (component.find('div[data-imageslider]'), {
                autoplay: {
                    delay: {COMPONENT_CONFIG_TIMING_VALUE_MS},
                    disableOnInteraction: false,
                },
                centeredSlides: true,
                initialSlide: {COMPONENT_RANDOM_SLIDE},
                lazy: {
                    loadPrevNext: true,
                    loadPrevNextAmount: 3,
                    preloaderClass: 'loader',
                },
                loop: true,
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
                speed: 1000,
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <!-- BEGIN has_header -->
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <!-- END has_header -->

            <div data-imageslider class="swiper-container">
                <div class="swiper-wrapper">
                    <!-- BEGIN image_scroller -->
                    <div class="swiper-slide {COMPONENT_CONFIG_IMAGE_RATIO}">
                        <img data-src="/cms/image.php?id={IMAGE_ID}&height=1024&width=1024" class="swiper-lazy" />
                        <div class="loader"></div>
                        <!-- BEGIN show_caption -->
                        <p class="meta">{IMAGE_NAME}</p>
                        <!-- END show_caption -->
                    </div>
                    <!-- END image_scroller -->
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </div>
</div>
