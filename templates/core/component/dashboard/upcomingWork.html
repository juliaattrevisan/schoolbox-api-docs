<h2><a href="/submission/dueWork/">Upcoming Due Work</a>
    <!-- BEGIN view_all_due_work -->
    <a href="/submission/allWork/{WORK_USER_ID}" title="View grades"  class="btn tick"><span></span>Grades</a>
    <!-- END view_all_due_work -->
</h2>
<div class="listing">
    <table class="upcoming-work table ruler">
        <tbody>
        <!-- BEGIN upcoming_work -->
        <tr class="{ON_OFF}">
            <td>
                <!-- BEGIN upcoming_work_link -->
                <a class="title" href="{UPCOMING_HREF}">{UPCOMING_TITLE}</a>
                <!-- END upcoming_work_link -->
                <!-- BEGIN upcoming_work_nolink -->
                <span class="title">{UPCOMING_TITLE}</span>
                <!-- END upcoming_work_nolink -->
                <br />
                <a href="/homepage/{UPCOMING_SUBJ_ID}">{UPCOMING_SUBJ_NAME}</a> {UPCOMING_TYPE}</td>
            <td><span class="gradient-{UPCOMING_URGENCY}">Due {UPCOMING_DATE}</span> on {UPCOMING_TIME}</td>
            <td>
				<Span class="actions one-button">
				<!-- BEGIN upcoming_work_actionable -->
				<a href="{UPCOMING_BUTTON_HREF}" class="btn {UPCOMING_BTN_ICON} no-text"><span></span></a>
				<!-- END upcoming_work_actionable -->
				</span>
            </td>
        </tr>
        <!-- END upcoming_work -->
        </tbody>
    </table>
</div>
