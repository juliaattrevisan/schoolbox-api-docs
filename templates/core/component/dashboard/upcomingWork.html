<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <h2>
                        <a href="/submission/dueWork/">Upcoming Due Work</a>
                    </h2>

                    <!-- BEGIN view_all_due_work -->
                    <a href="/submission/allWork/{WORK_USER_ID}" title="View grades" class="button icon-tick">Grades</a>
                    <!-- END view_all_due_work -->
                </div>

                <ul class="action-list">
                    <!-- BEGIN upcoming_work -->
                    <li class="row" data-equalizer>
                        <div class="small-11 columns" data-equalizer-watch>
                            <!-- BEGIN upcoming_work_link -->
                            <h3>
                                <a class="title" href="{UPCOMING_HREF}">{UPCOMING_TITLE}</a>
                            </h3>
                            <!-- END upcoming_work_link -->

                            <!-- BEGIN upcoming_work_nolink -->
                            <h3>
                                {UPCOMING_TITLE}
                            </h3>
                            <!-- END upcoming_work_nolink -->

                            <p class="meta">
                                <a href="/homepage/{UPCOMING_SUBJ_ID}">{UPCOMING_SUBJ_NAME}</a> {UPCOMING_TYPE}
                            </p>

                            <p class="meta">
                                <span class="gradient-{UPCOMING_URGENCY}">Due {UPCOMING_DATE}</span> on {UPCOMING_TIME}
                            </p>
                        </div>
                        <div class="one actions">
                            <!-- BEGIN upcoming_work_actionable -->
                            <a href="{UPCOMING_BUTTON_HREF}" class="{UPCOMING_BTN_ICON} no-text"></a>
                            <!-- END upcoming_work_actionable -->
                        </div>
                    </li>
                    <!-- END upcoming_work -->
                </ul>
            </section>
        </div>
    </div>
</div>
