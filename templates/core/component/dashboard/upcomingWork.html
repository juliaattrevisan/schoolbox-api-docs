<h2>Upcoming Due Work</h2>
<div class="listing">
    <table class="due-dates">
        <thead>
        <tr>
            <th width="22%">Due Date</th>
            <th width="20%">Subject</th>
            <th width="25%">Assessment Title</th>
            <th width="15%"></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN work -->
        <tr class="{ROW_COLOR}">
            <td>{WORK_DATE}</td>
            <td>{WORK_SUBJECT}</td>
            <td>{WORK_DESCRIPTION}</td>
            <td nowrap="nowrap"><a href="/submission/submissionHistory/{WORK_BOX_ID}/{WORK_USER_ID}">{WORK_ACTION}</a></td>
        </tr>
        <!-- END work -->
        </tbody>
    </table>
</div>
