<h2>Upcoming Due Work
    <!-- BEGIN view_all_due_work -->
    <a href="/submission/allWork/{WORK_USER_ID}" class="btn"><span></span>View all work</a>
    <!-- END view_all_due_work -->
</h2>
<div class="listing">
    <table class="upcoming-work">
        <tbody>
        <!-- BEGIN upcoming_work -->
        <tr class="{ON_OFF}">
            <td><a class="title" href="/{UPCOMING_HREF}{UPCOMING_ID}/{UPCOMING_UID}">{UPCOMING_TITLE}</a><br />
                <a href="/homepage/{UPCOMING_SUBJ_ID}">{UPCOMING_SUBJ_NAME}</a> {UPCOMING_TYPE}</td>
            <td><span class="gradient-{UPCOMING_URGENCY}">Due {UPCOMING_DATE}</span> on {UPCOMING_TIME}</td>
            <td class="text-align-right">
                <!-- BEGIN upcoming_work_actionable -->
                <a href="/{UPCOMING_HREF}{UPCOMING_ID}/{UPCOMING_UID}" class="btn {UPCOMING_BTN_ICON}"><span></span> {UPCOMING_BTN_LABEL}</a>
                <!-- END upcoming_work_actionable -->
            </td>
        </tr>
        <!-- END upcoming_work -->
        </tbody>
    </table>
</div>
