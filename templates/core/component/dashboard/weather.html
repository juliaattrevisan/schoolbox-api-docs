<div class="box">
	<h2>Weather{WEATHER_LOCATION}</h2>
    <div class="weather clearfix">
    <!-- BEGIN weather_forecast -->
		<div class="weatherDay {FC_CLASS}">
            <div class="image">
                <img src="{FC_IMAGE}" title="{FC_PRECIS}" alt="{FC_PRECIS}" />
            </div>
            <div class="data">
                <h4>{FC_DAY}</h4>
                <!-- BEGIN temp_now -->
                <span class="temp-actual">{FC_ACTUAL}&deg;</span>
                <!-- END temp_now -->
                <!-- BEGIN temp_range -->
                <span class="temp-h">{FC_HIGH}&deg;</span> | <span class="temp-l">{FC_LOW}&deg;</span>
                <!-- END temp_range -->
            </div>
		</div>
    <!-- END weather_forecast -->
    </div>
    <!-- BEGIN weather_unavailable -->
    <br />
    <p class="information-notification">Weather service is temporarily unavailable.</p>
    <!-- END weather_unavailable -->
	<p class="interact"><a href="/weather/" title="" class="btn weather"><span></span>View weekly forecast</a></p>
</div>
