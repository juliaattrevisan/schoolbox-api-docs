<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/weather/">Weather{WEATHER_LOCATION}</a>
            </h2>
            <section>
                <ul class="information-list">
                    <!-- BEGIN weather_forecast -->
                    <li>
                        <div class="list-item">
                            <div class="small-2 large-3 columns no-pad">
                                <img src="{FC_IMAGE}" class='content' title="{FC_PRECIS}" alt="{FC_PRECIS}" />
                            </div>
                            <div class="small-2 large-3 columns content">
                                {FC_DAY}
                            </div>
                            <div class="small-8 large-6 columns content">
                                <div class="row">
                                    <!-- BEGIN temp_now -->
                                    <div class="small-12 columns no-pad">
                                        <span class="label neutral full-width">{FC_ACTUAL}&deg;</span>
                                    </div>
                                    <!-- END temp_now -->
                                    <!-- BEGIN temp_range -->
                                    <div class="small-6 columns no-pad">
                                        <span class="label hot full-width">{FC_HIGH}&deg;</span>
                                    </div>
                                    <div class="small-6 columns no-pad">
                                        <span class="label cold full-width">{FC_LOW}&deg;</span>
                                    </div>
                                    <!-- END temp_range -->
                                </div>
                            </div>
                        </div>
                    </li>
                    <!-- END weather_forecast -->
                </ul>

                <div class="content">
                    <!-- BEGIN weather_unavailable -->
                    <p class="meta">Weather service is temporarily unavailable.</p>
                    <!-- END weather_unavailable -->

                    <a href="/weather/" title="View Weekly Forecast" class="button icon-weather">View Weekly Forecast</a>
                </div>
            </section>
        </div>
    </div>
</div>
