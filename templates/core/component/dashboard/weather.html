<div class="box">
	<h2>Weather</h2>
    <div class="text weather clearfix">
    <!-- BEGIN weather_forecast -->
		<div class="weatherDay {FC_CLASS}">
            <div style="width:50%;float:left;text-align:right;height:50px;">
                <img style="position:relative;right:8px;" src="{FC_IMAGE}" title="{FC_PRECIS}" alt="{FC_PRECIS}" />
            </div>
            <div style="width:50%;float:left;text-align:left;height:50px;color:#aaa;">
                <h4 style="height:25px;line-height:25px;">{FC_DAY}</h4>
                <!-- BEGIN temp_now -->
                <span style="color:#000;">{FC_ACTUAL}&deg;</span>
                <!-- END temp_now -->
                <!-- BEGIN temp_range -->
                <span style="color:#f33;">{FC_HIGH}&deg;</span> | <span style="color:#09f;">{FC_LOW}&deg;</span>
                <!-- END temp_range -->
            </div>
		</div>
    <!-- END weather_forecast -->
    </div>
    <!-- BEGIN weather_unavailable -->
    <br />
    <p class="information-notification">Weather service is temporarily unavailable.</p>

    <!-- END weather_unavailable -->
	<p style="margin:0 8px 0 0;" class="clearfix"><a href="/weather/" title="" class="btn weather"><span></span>View weekly forecast</a></p>
</div>
