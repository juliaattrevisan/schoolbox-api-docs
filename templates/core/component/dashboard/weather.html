<div id='component{COMPONENT_INSTANCE_ID}' class='component-container' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/weather/">Weather{WEATHER_LOCATION}</a>
            </h2>
            <section>
                <ul class="weather-list-summary">
                    <!-- BEGIN weather_forecast -->
                    <li class="{FC_CURRENT}" data-equalizer>
                        <div class="list-item">
                            <div class="info card small-3" data-equalizer-watch>
                                <img src="{FC_IMAGE}" class='mime' title="{FC_PRECIS}" alt="{FC_PRECIS}" />
                            </div>
                            <div class="info card small-3 content temperature">
                                {FC_DAY}
                            </div>
                            <div class="info card small-5 content temperature">
                                <!-- BEGIN temp_now -->
                                <span class="meta">{FC_ACTUAL}&deg;</span>
                                <!-- END temp_now -->
                                <!-- BEGIN temp_range -->
                                <span class="hot">{FC_HIGH}&deg;</span>
                                <span class="cold">{FC_LOW}&deg;</span>
                                <!-- END temp_range -->
                            </div>
                        </div>
                    </li>
                    <!-- END weather_forecast -->
                </ul>

                <div class="content">
                    <!-- BEGIN weather_unavailable -->
                    <p class="meta">Weather service is temporarily unavailable.</p>
                    <!-- END weather_unavailable -->

                    <a href="/weather/" title="View Weekly Forecast" class="button icon-weather">View Weekly Forecast</a>
                </div>
            </section>
        </div>
    </div>
</div>
