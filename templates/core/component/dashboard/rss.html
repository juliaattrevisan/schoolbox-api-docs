<div id='component{COMPONENT_INSTANCE_ID}' data-component class="">
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/redir.php?url={RSS_URL}">{COMPONENT_NAME}</a>
            </h2>
            <section>
                <ul class="information-list">
                    <!-- BEGIN rss_stories -->
                    <li class="row" data-equalizer>
                        <div class="twelve-column" data-equalizer-watch>
                            <h3>
                                <a href="/redir.php?url={RSS_URL}">{RSS_TITLE}</a>
                            </h3>

                            <!-- BEGIN rss_date -->
                            <p class="meta">
                                Posted {RSS_POSTED_DATE}
                            </p>
                            <!-- END rss_date -->

                            <!-- BEGIN rss_brief_output -->
                            <article>
                                {RSS_BRIEF}
                            </article>
                            <!-- END rss_brief_output -->
                        </div>
                    </li>
                    <!-- END rss_stories -->
                </ul>
            </section>
        </div>
    </div>
</div>
