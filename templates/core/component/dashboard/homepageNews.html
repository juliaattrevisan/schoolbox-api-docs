<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section>
                <ul class="information-list">
                    <!-- BEGIN activity_item -->
                    <li>
                        <div class="list-item">
                            <div class="card small-12 wrap-down">
                                <div class="{ACTLIST_ICON} size-32"></div>
                                <p>
                                    {ACTLIST_CONTENT}
                                </p>
                                <p class="meta"><time>{ACTLIST_TIME}</time></p>
                            </div>
                        </div>
                    </li>
                    <!-- END activity_item -->
                </ul>
            </section>
        </div>
    </div>
</div>
