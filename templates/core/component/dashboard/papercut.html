<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <script type="text/javascript">
        var pcUsername = '{PAPERCUT_USERNAME}';
        var pcServerURL = '{PAPERCUT_SERVER}';

        var url = '{PAPERCUT_SERVER}/rpc/api/web/user/' + pcUsername + '/details.js';

        $.getScript(url, function(script, textStatus, jqXHR) {
            if (pcUserDetails.balanceFormatted != undefined) {
                var component = $('#component{COMPONENT_INSTANCE_ID}');
                component.find('[data-relation="userBalance"]').text(pcUserDetails.balanceFormatted);
                component.find('[data-relation="userPages"]').text(pcUserDetails.printStats.pages);
                component.find('[data-relation="userJobs"]').text(pcUserDetails.printStats.jobs);
                component.find('[data-relation="userCO2"]').text(pcUserDetails.environmentalImpact.gramsCO2Formatted);
                component.find('[data-relation="userTrees"]').text(pcUserDetails.environmentalImpact.treesFormatted);
            }
        });
    </script>

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section>
                <table>
                    <tr>
                        <th>Balance:</th>
                        <td data-relation="userBalance"></td>
                    </tr>
                    <tr>
                        <th>Jobs:</th>
                        <td data-relation="userJobs"></td>
                    </tr>
                    <tr>
                        <th>Pages:</th>
                        <td data-relation="userPages"></td>
                    </tr>
                    <tr>
                        <th>CO2:</th>
                        <td data-relation="userCO2"></td>
                    </tr>
                    <tr>
                        <th>Trees:</th>
                        <td data-relation="userTrees"></td>
                    </tr>
                </table>
            </section>
        </div>
    </div>
</div>
