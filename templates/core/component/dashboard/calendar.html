<div id="component{COMPONENT_INSTANCE_ID}" data-component>
    <script type="text/javascript" src="/javascript/shared/calendar/jquery.calendar.js"></script>
    <script type="text/javascript">
        $(function() {
            $('#component{COMPONENT_INSTANCE_ID}').calendarAttendance();
        });
    </script>

    {CONFIGURATION}

    <div class="row">
        <!-- BEGIN day -->
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/calendar/full/{CALENDAR_DATE}/#week">{LIST_DATE}</a>
            </h2>
            <section>
                <!-- BEGIN has_events -->
                <ul class="calendar-list">
                    <!-- BEGIN event -->
                    <!-- twig calendar events go here -->
                    <!-- END event -->
                </ul>
                <!-- END has_events -->

                <!-- BEGIN no_events -->
                <div class="alert-box">
                    There are no upcoming events.
                </div>
                <!-- END no_events -->
            </section>
        </div>
        <!-- END day -->
    </div>
</div>
