<div class="box text clearfix calendar">
    <!-- BEGIN day -->
    <h2><a href="/calendar/full/{CALENDAR_DATE}/#week">{DATE}</a></h2>
    <div class="listing">
        <ul class="js_happening">
            <!-- BEGIN note_block -->
                <!-- twig calendar events go here -->
            <!-- END note_block -->
        </ul>

        <!-- BEGIN no_events -->
        <div class="no_events">
            <em>There are no upcoming events.</em>
        </div>
        <!-- END no_events -->
    </div>
    <!-- END day -->
</div>

<script type="text/javascript">
    $(function () {
        $(document).on('click', 'a.attendance-request', function (event) {
            event.preventDefault();

            var button = $(this);

            var data = button.parent('form').serialize();

            $.post('/service/attendance/processToggleAttendance', data, function (data) {
                if (data.error == undefined) {
                    if (button.text() == 'RSVP') {
                        button.html('<span></span>Unattend');
                    }
                    else {
                        button.html('<span></span>RSVP');
                    }
                }
            });
        });
    });
</script>
