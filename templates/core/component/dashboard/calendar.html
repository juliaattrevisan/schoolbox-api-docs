<style type="text/css">
    .hidden-fields {
        display: none;
    }
</style>

<div id="component{COMPONENT_INSTANCE_ID}" data-component="{COMPONENT_INSTANCE_ID}">
    {CONFIGURATION}

    <div class="row">
        <div class="small-12 island">
            <section>
                <!-- BEGIN day -->
                <ul class="activity-list">
                    <li class="row">
                        <div class="small-12 columns">
                            <h3><a href="/calendar/full/{CALENDAR_DATE}/#week">{LIST_DATE}</a></h3>
                        </div>
                    </li>
                    <!-- BEGIN note_block -->
                    <!-- twig calendar events go here -->
                    <!-- END note_block -->
                </ul>

                <!-- BEGIN no_events -->
                <div class="row">
                    <div class="small-12 columns">
                        <em>There are no upcoming events.</em>
                    </div>
                </div>
                <!-- END no_events -->
                <!-- END day -->
            </section>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(function () {
        $(document).on('click', 'a.attendance-request', function (event) {
            event.preventDefault();

            var button = $(this);

            var data = button.parent('form').serialize();

            $.post('/service/attendance/processToggleAttendance', data, function (data) {
                if (data.error == undefined) {
                    if (button.text() == 'RSVP') {
                        button.html('<span></span>Unattend');
                    }
                    else {
                        button.html('<span></span>RSVP');
                    }
                }
            });
        });
    });
</script>
