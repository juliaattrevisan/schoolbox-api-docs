<div id="component{COMPONENT_INSTANCE_ID}" data-component class="top">
    {CONFIGURATION}

    <div class="row">
        <div class="small-12 island">
            <!-- BEGIN day -->
            <h2 class="subheader">
                <a href="/calendar/full/{CALENDAR_DATE}/#week">{LIST_DATE}</a>
            </h2>
            <section>
                <ul class="activity-list">
                    <!-- BEGIN note_block -->
                    <!-- twig calendar events go here -->
                    <!-- END note_block -->
                    <!-- BEGIN no_events -->
                    <li class="row">
                        <div class="row">
                            <div class="twelve-column">
                                <em>There are no upcoming events.</em>
                            </div>
                        </div>
                    </li>
                    <!-- END no_events -->
                </ul>
                <!-- END day -->
            </section>
        </div>
        <!-- END day -->
    </div>
</div>

<script type="text/javascript">
    $(function () {
        $(document).on('click', 'a.attendance-request', function (event) {
            event.preventDefault();

            var button = $(this);

            var data = button.parent('form').serialize();

            $.post('/service/attendance/processToggleAttendance', data, function (data) {
                if (data.error == undefined) {
                    if (button.text() == 'RSVP') {
                        button.html('<span></span>Unattend');
                    }
                    else {
                        button.html('<span></span>RSVP');
                    }
                }
            });
        });
    });
</script>
