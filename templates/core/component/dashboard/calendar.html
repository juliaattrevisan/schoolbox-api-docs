<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component>
    <script type="text/javascript">
        $(function() {
            /* Attendance
            */
            var allEvents = $('.calendar-list').find('[data-reveal-id]');

            $.each(allEvents, function(index, element) {
                $('#' + $(element).attr('data-reveal-id')).calendarAttendance();
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row">
        <!-- BEGIN day -->
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/calendar/full/{CALENDAR_DATE}/#week">{LIST_DATE}</a>
            </h2>
            <!-- BEGIN has_events -->
            <section>
                <ul class="calendar-list">
                    <!-- BEGIN event -->
                    {EVENT_CONTENT}
                    <!-- END event -->
                </ul>
            </section>
            <!-- END has_events -->
            <!-- BEGIN no_events -->
            <div class="empty-state">
                <p>There are no upcoming events</p>
            </div>
            <!-- END no_events -->
        </div>
        <!-- END day -->
    </div>
</div>
