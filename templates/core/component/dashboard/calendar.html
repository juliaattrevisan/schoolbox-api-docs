<!-- event/booking list - dashboard calendar component -->
<div id="component{COMPONENT_INSTANCE_ID}" class="component-container {COMPONENT_CLASS}" data-component>
    <script>
        $(function() {
            // Attach rsvp/unattend functionality to rsvp butttons
            $('form[data-rsvp-form]').calendarAttendance();
            $('a[data-delete-single]').on('click', function () {
                $('[data-reveal]').hide();
                var eventId = $(this).attr('data-event-id');
                var eventName = $(this).attr('data-event-type');
                $(this).confirmDialog({
                    text: 'Are you sure you wish to delete this '+eventName+'?',
                    confirmEvent: function() {
                        $.post($('#delete-single-'+eventId).val(), {
                            action: 'Delete',
                            id: eventId
                        }).done(function (response) {
                            window.location.href = response.callbackUrl;
                        });
                    }
                });
            });
        });
    </script>

    {CONFIGURATION}

    <div class="row">
        <!-- BEGIN day -->
        <div class="small-12 island">
            <h2 class="subheader">
                <a href="/calendar/{CALENDAR_DATE}/#week">{LIST_DATE}</a>
            </h2>
            <!-- BEGIN has_events -->
            <section>
                <ul class="calendar-list">
                    <!-- BEGIN event -->
                    {EVENT_CONTENT}
                    <!-- END event -->
                </ul>
            </section>
            <!-- END has_events -->
            <!-- BEGIN no_events -->
            <div class="empty-state">
                <p>There are no upcoming events</p>
            </div>
            <!-- END no_events -->
        </div>
        <!-- END day -->
    </div>
    <!-- BEGIN has_series -->
    <script>
        $(function() {
            $('a[data-delete-series]').on('click', function (event) {
                event.preventDefault();
                var dialog = $('[data-dialog="bulk-delete"]');
                var eventId = $(this).attr('data-event-id');
                var eventName = $(this).attr('data-event-type');
                dialog.html(dialog.html().replace(/booking/g, eventName));
                dialog.foundation('reveal', 'open');
                dialog.find('[data-action="self"]')
                    .off('click')
                    .on('click', function(e) {
                        e.preventDefault();
                        dialog.foundation('reveal', 'close');
                        $.post($('#delete-series-self-'+eventId).val(), {
                            action: 'Delete',
                            id: eventId
                        }).done(function (response) {
                            window.location.href = response.callbackUrl;
                        });
                    });
                dialog.find('[data-action="series"]')
                    .off('click')
                    .on('click', function(e) {
                        e.preventDefault();
                        dialog.foundation('reveal', 'close');
                        $.post($('#delete-series-all-'+eventId).val(), {
                            action: 'Delete',
                            id: eventId
                        }).done(function (response) {
                            window.location.href = response.callbackUrl;
                        });
                    });
                dialog.find('[data-action="cancel"]')
                    .off('click')
                    .on('click', function(e) {
                        e.preventDefault();
                        dialog.foundation('reveal', 'close');
                        dialog.html(dialog.html().replace(/event/g, 'booking'));
                    });
            });
        });
    </script>
    <div class="reveal-modal" data-reveal data-dialog="bulk-delete">
        <h2>This booking is part of a series</h2>
        <p class="icon-alert">
            Would you like to delete only this booking, or all in the series?
        </p>
        <ul class="flex-list buttons">
            <li><a href="#" class="button" data-action="self">Only this booking</a></li>
            <li><a href="#" class="button" data-action="series">All bookings in the series</a></li>
            <li><a href="#" class="button" data-action="cancel">Cancel</a></li>
        </ul>
    </div>
    <!-- END has_series -->
</div>
