<script type="text/javascript">
$j(function(){
	$j('#timetable th:odd').addClass('colour');
	$j('#timetable td:odd').addClass('colour');
	$j('#container').css('width', $j('.timetable').outerWidth());
});
</script>

<div class="box tt">
	<h2>Timetable <span>- Day {DAYNUMBER}</span></h2>
	<table id="timetable">
		<thead>
			<tr>
				<!-- BEGIN timetable_header -->
				<th>{PERIOD_NAME}</th>
				<!-- END timetable_header -->
			</tr>
		</thead>
		<tbody>
			<tr>
				<!-- BEGIN timetable_period -->
				<td class="{PERIOD_CLASS}">
					<p>
						<a href="#">{PERIOD_DESC}</a><br/>
						{PERIOD_CODE}<br/>
						{PERIOD_ROOM} {PERIOD_ABSENTEES}
					</p>

					<!-- BEGIN has_attendances -->
					<p>
						<a href='/modules/attendance/modify/{ATTENDANCE_CLASS_CODE}/{ATTENDANCE_ATTENDANCE_DATE}/{ATTENDANCE_ATTENDANCE_PERIOD}'>Attendance Records</a>
					</p>
					<!-- END has_attendances -->
				</td>
				<!-- END timetable_period -->
			</tr>
		</tbody>
	</table>
</div>
