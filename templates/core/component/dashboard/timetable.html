<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <script type="text/javascript" src="/javascript/shared/timetable/jquery.timetable-resize.js"></script>
    <script type="text/javascript" src="/javascript/shared/timetable/jquery.timetable-dashboard.js"></script>
    <script type="text/javascript" src="/javascript/components/jquery.scrollTo/jquery.scrollTo.min.js"></script>
    <script type="text/javascript">
        $(function() {
            $.fn.timetableStart();

            // Scroll to current period
            var timetable = $('#component{COMPONENT_INSTANCE_ID}').find('[data-timetable]');
            if(timetable.find('.timetable-subject-active').length) {
                timetable.closest('.scrollable').scrollTo(
                        timetable.find('.timetable-subject-active'),
                        {scrollX: true, scrollY: false, duration: 0, offsetLeft: 0}
                );
            }
        });
    </script>
    <!-- Probably doesn't have a configuration -->
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 columns">
            <!-- BEGIN campus_timetable -->
            <div data-timetable-container>
                <h2 class="subheader" data-timetable-header>
                    <!-- BEGIN timetable_campus_name -->
                    {CAMPUS_NAME} -
                    <!-- END timetable_campus_name -->
                    {DAYNAME}
                </h2>
                <section>
                    <div class="scrollable show-for-medium-up">
                        <table class="timetable" data-timetable>
                            <thead>
                                <tr>
                                    <!-- BEGIN timetable_header -->
                                    <th class='{PERIOD_TH_CLASS}' style='width:{TIMETABLE_FIELD_WIDTH}%'>
                                        {PERIOD_NAME}
                                        <time class="meta">{PERIOD_START}&ndash;{PERIOD_END}</time>
                                    </th>
                                    <!-- END timetable_header -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <!-- BEGIN timetable_period -->
                                    <td style="width:{TIMETABLE_FIELD_WIDTH}%">
                                        <div class="{PERIOD_CLASS}">
                                            <!-- BEGIN period_class_link -->
                                            <div class="timetable-subject" style="background:{PERIOD_COLOUR};" data-timetable-subject>
                                                <a href="{PERIOD_URL}" class="{CLASS_CANCELLED}">
                                                    {PERIOD_DESC}
                                                </a>
                                                <div>{PERIOD_CODE}<br />
                                                {PERIOD_ROOM}</div>
                                                <!-- BEGIN period_class_link_attendance_synergetic -->
                                                <br />
                                                <span class="{ATTENDANCE_ICON}">
                                                    <a href='/modules/attendance/modify/{ATTENDANCE_CLASS_CODE}/{ATTENDANCE_ATTENDANCE_DATE}/{ATTENDANCE_ATTENDANCE_PERIOD}/{ATTENDANCE_TIMETABLE_CODE}'
                                                    title="Mark Attendance">Attendance</a>
                                                </span>
                                                <!-- END period_class_link_attendance_synergetic -->
                                                <!-- BEGIN period_class_link_attendance_tass -->
                                                <br />
                                                <span class="{ATTENDANCE_ICON}">
                                                <a href='/modules/tassportal/teacherkiosk?link=kiosk/index.cfm%3Fdo%3Dkiosk.curriculum.TIACurAttndBasic%26tt_id%3D{ATTENDANCE_TIMETABLE_CODE}%26classes%3D{ATTENDANCE_CLASS_CODE}%26yeargroupsandclasses%3D%7C{ATTENDANCE_CLASS_CODE}%26bfromtimetable%3Dtrue%26amp%3Bcurrenttchcode%3D{EXTERNAL_ID}%26mode%3DAttend%26subjectcode%3D{ATTENDANCE_SUBJECT_CODE}%26ttdate%3D{ATTENDANCE_ATTENDANCE_DATE}%26periodcode%3D{ATTENDANCE_ATTENDANCE_PERIOD}%26dayCode%3D{ATTENDANCE_ATTENDANCE_DAY}%26tchCode%3D{EXTERNAL_ID}'
                                                   title="Mark Attendance">Attendance</a>
                                            </span>
                                                <!-- END period_class_link_attendance_tass -->
                                            </div>
                                            <!-- END period_class_link -->

                                            <!-- BEGIN period_class -->
                                            <div class="timetable-subject" style="background:{PERIOD_COLOUR};" data-timetable-subject>
                                                {PERIOD_DESC}
                                                <div>{PERIOD_CODE}<br />
                                                {PERIOD_ROOM}</div>
                                                <!-- BEGIN period_class_attendance_synergetic -->
                                                <br />
                                                <span class="{ATTENDANCE_ICON}">
                                                    <a href='/modules/attendance/modify/{ATTENDANCE_CLASS_CODE}/{ATTENDANCE_ATTENDANCE_DATE}/{ATTENDANCE_ATTENDANCE_PERIOD}/{ATTENDANCE_TIMETABLE_CODE}'
                                                    title="Mark Attendance">Attendance</a>
                                                </span>
                                                <!-- END period_class_attendance_synergetic -->
                                                <!-- BEGIN period_class_attendance_tass -->
                                                <br />
                                                <span class="{ATTENDANCE_ICON}">
                                                <a href='/modules/tassportal/teacherkiosk?link=kiosk/index.cfm%3Fdo%3Dkiosk.curriculum.TIACurAttndBasic%26tt_id%3D{ATTENDANCE_TIMETABLE_CODE}%26classes%3D{ATTENDANCE_CLASS_CODE}%26yeargroupsandclasses%3D%7C{ATTENDANCE_CLASS_CODE}%26bfromtimetable%3Dtrue%26amp%3Bcurrenttchcode%3D{EXTERNAL_ID}%26mode%3DAttend%26subjectcode%3D{ATTENDANCE_SUBJECT_CODE}%26ttdate%3D{ATTENDANCE_ATTENDANCE_DATE}%26periodcode%3D{ATTENDANCE_ATTENDANCE_PERIOD}%26dayCode%3D{ATTENDANCE_ATTENDANCE_DAY}%26tchCode%3D{EXTERNAL_ID}'
                                                   title="Mark Attendance">Attendance</a>
                                            </span>
                                                <!-- END period_class_attendance_tass -->
                                            </div>
                                            <!-- END period_class -->
                                        </div>
                                    </td>
                                    <!-- END timetable_period -->
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                <div class="row timetable-small show-for-small-only" data-smaller></div>
            </div>
            <!-- END campus_timetable -->
        </div>
    </div>
</div>
