<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    <!-- Probably doesn't have a configuration -->
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <!-- BEGIN campus_timetable -->
            <h2 class="subheader">
                <a href="/timetable/">
                    <!-- BEGIN timetable_campus_name -->
                    {CAMPUS_NAME} -
                    <!-- END timetable_campus_name -->
                    {DAYNAME}
                </a>
            </h2>
            <section>
                <table class="timetable">
                    <thead>
                        <tr>
                            <!-- BEGIN timetable_header -->
                            <th style='width:{TIMETABLE_FIELD_WIDTH}%'>
                                {PERIOD_NAME}
                                <time class="meta">{PERIOD_START}&ndash;{PERIOD_END}</time>
                            </th>
                            <!-- END timetable_header -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <!-- BEGIN timetable_period -->
                            <td style="width:{TIMETABLE_FIELD_WIDTH}%">
                                <!-- BEGIN period_class_link -->
                                <!-- BEGIN period_class_link_attendance -->
                                <a class="attendance-link {ATTENDANCE_ICON} no-text"
                                   href='/modules/attendance/modify/{ATTENDANCE_CLASS_CODE}/{ATTENDANCE_ATTENDANCE_DATE}/{ATTENDANCE_ATTENDANCE_PERIOD}'
                                   title="Mark Attendance"></a>
                                <!-- END period_class_link_attendance -->
                                <div class="timetable-subject" style="background:{PERIOD_COLOUR};" data-timetable-subject>
                                    <a href="{PERIOD_URL}">
                                        {PERIOD_DESC}
                                        <p class="meta">{PERIOD_CODE}</p>
                                        <p class="meta">{PERIOD_ROOM}</p>
                                    </a>
                                </div>
                                <!-- END period_class_link -->

                                <!-- BEGIN period_class -->
                                <!-- BEGIN period_class_attendance -->
                                <a class="attendance-link {ATTENDANCE_ICON} no-text"
                                   href='/modules/attendance/modify/{ATTENDANCE_CLASS_CODE}/{ATTENDANCE_ATTENDANCE_DATE}/{ATTENDANCE_ATTENDANCE_PERIOD}'
                                   title="Mark Attendance"></a>
                                <!-- END period_class_attendance -->
                                <div class="timetable-subject" style="background:{PERIOD_COLOUR};" data-timetable-subject>
                                    {PERIOD_DESC}
                                    <p class="meta">{PERIOD_CODE}</p>
                                    <p class="meta">{PERIOD_ROOM}</p>
                                </div>
                                <!-- END period_class -->
                            </td>
                            <!-- END timetable_period -->
                        </tr>
                    </tbody>
                </table>
            </section>
            <!-- END campus_timetable -->
        </div>
    </div>
</div>
