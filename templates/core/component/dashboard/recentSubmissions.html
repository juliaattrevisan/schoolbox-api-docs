<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <section>
                <div class="content">
                    <ul class="information-list">
                        <!-- BEGIN work -->
                        <li class="{ROW_COLOR}">
                            <span class="icon text">{WORK_COUNT}</span>
                            <!-- BEGIN submission -->
                            <h4><a href="/submission/viewSubmission/{WORK_BOX_ID}">{WORK_DESCRIPTION}</a></h4>
                            <!-- END submission -->
                            <!-- BEGIN assess -->
                            <h4><a href="/assess/results/{WORK_BOX_ID}">{WORK_DESCRIPTION}</a></h4>
                            <!-- END assess -->
                            <p class="meta">Last submission {WORK_DATE} in <a href="/homepage/{WORK_SUBJECT_ID}">{WORK_SUBJECT}</a></p>
                        </li>
                        <!-- END work -->
                    </ul>
                </div>
            </section>
        </div>
    </div>
</div>
