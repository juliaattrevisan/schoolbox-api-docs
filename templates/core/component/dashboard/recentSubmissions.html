<div id='component{COMPONENT_INSTANCE_ID}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <section>
                <ul class="information-list">
                    <!-- BEGIN work -->
                    <li>
                        <div class="small-1 columns text-center">
                            <span title="{WORK_COUNT} new submission(s)">{WORK_COUNT}</span>
                        </div>
                        <div class="small-11 columns">
                            <!-- BEGIN submission -->
                            <h3><a href="/submission/viewSubmission/{WORK_BOX_ID}">{WORK_DESCRIPTION}</a></h3>
                            <!-- END submission -->

                            <!-- BEGIN assess -->
                            <p><a href="/assess/results/{WORK_BOX_ID}">{WORK_DESCRIPTION}</a></p>
                            <!-- END assess -->

                            <p class="meta">
                                Last submission {WORK_DATE} in
                                <a href="/homepage/{WORK_SUBJECT_ID}">{WORK_SUBJECT}</a>
                            </p>
                        </div>
                    </li>
                    <!-- END work -->
                </ul>
            </section>
        </div>
    </div>
</div>
