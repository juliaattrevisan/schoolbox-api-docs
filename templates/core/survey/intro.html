{BREADCRUMB}

<div class="row">
    <div class="small-12 column">
        <h1>{ASSESS_TITLE}</h1>
        <ul class="meta">
            <li class="icon-calendar"><time>{ASSESS_FINISH}</time></li>
            <li class="icon-time-value">Time allowed: <time>{ASSESS_DURATION}</time></li>
            <li class="icon-home" title="Homepage"><a href="/homepage/{ASSESS_FOLDER_ID}">{ASSESS_FOLDER}</a> ({ASSESS_FOLDER_CODES})</li>
            <li class="icon-staff-students" title="Author">
                <a href="/search/user/{ASSESS_AUTHOR_ID}">{ASSESS_AUTHOR}</a>
            </li>
        </ul>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <section class="content">
            <article>
                {ASSESS_DESCRIPTION}
            </article>
        </section>

        <div class="scrollable">
            <table>
                <thead>
                    <tr>
                        <th>Section</th>
                        <th>Number of questions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN section -->
                    <tr>
                        <td>{SECTION_TITLE}</td>
                        <td>{SECTION_NUMQUESTIONS}</td>
                    </tr>
                    <!-- END section -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- BEGIN startTest -->
<div class="row">
    <div class="small-12 column">
        <p>
            <a href="/survey/init/{ASSESS_ASSESS_ID}/{FIRST_SECTION}" class="button expand secondary">Begin Survey</a>
        </p>
    </div>
</div>
<!-- END startTest -->
