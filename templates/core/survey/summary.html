<h1>Survey Summary
    <a class="btn go-back marg tiny" href="/homepage/{ASSESS_CATEGORY_ID}"><span></span>Return to Homepage</a>
</h1>
<div class="evaluation-content">
    <h2>{ASSESS_TITLE}</h2>
    <div class="wysiwyg">{ASSESS_DESCRIPTION}</div>
    <p class="clearfix">
        <strong>Survey open:</strong><br />
        {ASSESS_START}
        <span class="edit-assess-arrow"></span>
        {ASSESS_FINISH}
    </p>
    <table class="table ruler">
        <thead>
        <tr>
            <th>Section</th>
            <th>Number of questions</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN section -->
        <tr><td>{SECTION_TITLE}</td>
            <td>{SECTION_NUMQUESTIONS}</td>
            <td><span class="actions">
                <a href="/survey/section/modify/{SECTION_SECTION_ID}" class="btn modify no-text float-left" title="Modify"><span></span></a>
                </span>
            </td>
        </tr>
        <!-- END section -->
        </tbody>
    </table>
</div>
