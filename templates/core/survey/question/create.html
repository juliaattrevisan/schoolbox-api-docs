<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
$j(document).ready(function() {

    var section_id = '{SECTION_ID}';

	/* Set current state of dropdown
	 * Can't get val() of a disabled option element
	 */
	if ($j('.question-type-select :selected').text() == '-- Select Type --') {
		$j('.next-stepm,.question-holder,.marks-holder, #importQuestion').hide();
	}
	else {
		if ($j('#type_id').val() == 'import') {
			$j('.next-step,.question-holder,.marks-holder,#create').hide();
			$j('#importQuestion').show();
		}
		else {
			$j('.next-step, .question-holder, .marks-holder').show();
			$j('#importQuestion').hide();
		}
	}

	/* Change state
	 */
	$j('#type_id').change(function() {
		var url = '/survey/question/create/' + section_id + '/' + $j('#type_id').val();
		window.location = url;
	});

	$.fn.alaressTiny({
		mode : "exact",
		elements: "question"
	});
});
</script>

<!-- END custom_head -->
<h1>Create Question in Section {CURRENT_SECTION_TITLE}
    <a class="btn go-back marg tiny" href="/homepage/{ASSESS_CATEGORY_ID}"><span></span>Return to Homepage</a>
</h1>
<div class="evaluation-content">
	<h2>Question Details</h2>
	<form id="createQuestionForm" action="/survey/question/create" class="clearfix" method="post">
		<input type="hidden" name="marks" />
		<p class="help">
			Now that you've created a section for the test, use the drop down below to select a question type.
		</p>
		
		<label class="hide">
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</label>
		
		<label><strong>Type</strong>
			<select name="type_id" id="type_id" class="question-type-select">
				<option disabled {DISABLED_SELECTED} value='-1'>-- Select Type --</option>
				<!-- BEGIN questionType -->
				<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
				<!-- END questionType -->
			</select>
		</label>

		<label class="question-holder">Question
			<div class="textarea-container" id="question_container">
				<input name="question" class="mceSimple tinyValidate" id="question" type="text" size="35" value="{QUESTION}" />	
			</div>
		</label>

		<!-- BEGIN has_answer_configuration -->
		<label>Configuration Options
			<!-- BEGIN answer_configuration -->

			<!-- END answer_configuration -->
		</label>
		<!-- END has_answer_configuration -->

		<div id="answer">
			<!-- BEGIN answerInputs -->

			<!-- END answerInputs -->
		</div>
		
		<p class="clearfix">
			<input type="submit" name="create" id="create" value="Add Question" class="submit-btn-plain"/>
		</p>
	</form>
</div>
