<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/editor/jquery.editor.js?v={SITE_VERSION}"></script>

<script type="text/javascript">
    $(function() {
        $.fn.alaressEditor({
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        $('#createSection').alaressValidate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                }
            },
            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form name="create" action="/survey/section/create" id="createSection" method="post" class="top">
            <h2 class="subheader">Create Section</h2>
            <section class="content">
                <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
                <input name="section_id" type="hidden" value="{SECTION_ID}" />
                <input name="sequence" type="hidden" value="{SEQUENCE}" />

                <label>
                    Section Title
                    <input name="title" type="text" size="35" class="required"/>
                </label>

                <label>
                    Description
                    <textarea name="description"></textarea>
                </label>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Create Section" />
                </div>
            </div>
        </form>
    </div>
</div>
