<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/editor.js?v={SITE_VERSION}"></script>

<script type="text/javascript">
    $(function() {
        document.dispatchEvent(new CustomEvent("EDITOR__CREATE", {
            detail: {
                targetElements: ['#description'],
                fileBrowserCategoryId: '{ASSESS_CATEGORY_ID}',
            }
        }));

        $('#createSection').alaressValidate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                }
            },
            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form name="create" action="/survey/section/create" id="createSection" method="post" class="top">
            <h2 class="subheader">Create Section</h2>
            <section class="content">
                <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
                <input name="section_id" type="hidden" value="{SECTION_ID}" />
                <input name="sequence" type="hidden" value="{SEQUENCE}" />

                <label>
                    Section Title
                    <input name="title" type="text" maxlength="255" size="35" class="required"/>
                </label>

                <label for="description">Description</label>
                <textarea name="description" id="description"></textarea>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Create Section" />
                </div>
            </div>
        </form>
    </div>
</div>
