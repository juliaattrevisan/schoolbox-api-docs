<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/javascript/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/javascript/shared/editor/jquery.editor.js?v={SITE_VERSION}"></script>

<script type="text/javascript">
    $(function() {
        $.fn.alaressEditor({
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        $('#modifySection').alaressValidate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                }
            },

            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SECTION_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form name="create" action="/survey/section/modify" id="modifySection" method="post" class="top">
            <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
            <input name="section_id" type="hidden" value="{SECTION_ID}" />
            <input name="sequence" type="hidden" value="{SEQUENCE}" />

            <h2 class="subheader">Modify Section</h2>
            <section class="content">
                <label>
                    Section Title
                    <input name="title" type="text" maxlength="50" value="{SECTION_TITLE}" />
                </label>

                <label>
                    Description
                    <textarea name="description">{DESCRIPTION}</textarea>
                </label>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Modify Section" />
                </div>
            </div>
        </form>
    </div>
</div>
