<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/highcharts.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.graphs.js?v={SITE_VERSION}"></script>

<ul class="breadcrumb">
    <!-- BEGIN breadcrumb -->
    <li class="{BREADCRUMB_ACTIVE}"><a href="/homepage/{BREADCRUMB_FOLDER_ID}">{BREADCRUMB_FOLDER_NAME}</a></li>
    <!-- END breadcrumb -->
</ul>

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{SURVEY_NAME}</h1>
        </div>
    </div>
    <nav>
        <a class="icon-more" data-dropdown="header-options" title="Actions"></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li><a href="/survey/attempts/{ASSESS_ID}" class="icon-view">View All Attempts</a></li>
        <li><a href="/survey/export/csv/{ASSESS_ID}" class="icon-download">Export Result CSV</a></li>
    </ul>
</div>

<!-- BEGIN section -->
<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">{SECTION_NAME}</h2>
        <!-- BEGIN question -->
        <section>
            <div class="content">
                <h3>Q{QUESTION_INDEX})</h3>
                <article>{QUESTION_QUESTION}</article>

                <!-- BEGIN graph -->
                <!-- END graph -->
            </div>
            <div class="component-action">
                <section>
                    <a href='/survey/export/csv/{ASSESS_ID}/{QUESTION_QUESTION_ID}/{QUESTION_INDEX}' class="button">Export CSV</a>
                    <a href='/survey/resultsForQuestion/{ASSESS_ID}/{QUESTION_QUESTION_ID}/{QUESTION_INDEX}' class="button">View All Responses</a>
                </section>
            </div>
        </section>
        <!-- END question -->
    </div>
</div>
<!-- END section -->
