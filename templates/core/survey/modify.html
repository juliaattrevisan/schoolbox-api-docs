<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/editor/jquery.editor.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressEditor({
            file_browser_category_id : '{ASSESS_CATEGORY_ID}'
        });

        $('#createAssess').alaressValidate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                },
                "start[date]": {
                    required: true,
                    datepickerDate: true
                },
                "finish[date]": {
                    required: true,
                    datepickerDate: true
                }
            },
            messages: {
                title: "Please enter a title"
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ASSESS_ACTION} {ASSESS_KIND}</h1>
        </div>
    </div>
    <!-- BEGIN importXML -->
    <nav>
        <a class="icon-more" data-dropdown="header-options" title="Actions"></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li><a href="#" id="import" data-reveal-id="import-modal" class="icon-import">Import from XML file</a></li>
    </ul>
    <!-- END importXML -->
</div>

<div class="row">
    <div class="small-12 island">
        <form name="create" action="/survey/{ACTION}/{ASSESS_ASSESS_ID}" id="createAssess" method="post">
            <input name="category_id" type="hidden" value="{ASSESS_CATEGORY_ID}" />
            <input type="hidden" name="max_attempts" value="1" />
            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Title
                            <input name="title" type="text" maxlength="100" value="{ASSESS_TITLE}" id="title"/>
                        </label>
                    </div>
                </fieldset>
                    <!-- BEGIN assess_timespan -->
                    <!-- Available from this time -->
                <fieldset class="content">
                    <div class="small-12 large-6 columns">
                        <label>
                            Open Date
                            <span class="hint has-tip tip-top" data-tooltip title="The date and time from when the survey will be available.">?</span>
                            <input name="start[date]" id="start_date" type="text" size="15" maxlength="30" value="{ASSESS_START_DATE}" data-datepicker data-datepicker-time data-datesync-enddate="#finish_date" />
                        </label>
                    </div>
                    <!-- Available until this time -->
                    <div class="small-12 large-6 columns">
                        <label>
                            Due Date
                            <span class="hint has-tip tip-top" data-tooltip title="Actual date and time the survey is due. Respondents will not be able to take the survey after this date.">?</span>
                            <input name="finish[date]" id="finish_date" type="text" size="15" maxlength="30" value="{ASSESS_FINISH_DATE}" data-datepicker data-datepicker-time data-datesync-startdate="#start_date" />
                        </label>
                    </div>
                </fieldset>
                <!-- END assess_timespan -->
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Description
                            <textarea id='description' name="description">{ASSESS_DESCRIPTION}</textarea>
                        </label>
                    </div>
                    <div class="small-12 columns">
                        <label>
                            Completion Message
                            <textarea id='completion-message' name="completion_message">{ASSESS_COMPLETION_MESSAGE}</textarea>
                        </label>
                    </div>
                    <div class="small-12 columns">
                        <fieldset>
                            <legend>Options</legend>
                            <ul class="option-list">
                                <li>
                                    <input id="max_attempts" name="max_attempts" type="checkbox" value="0" {MAX_ATTEMPTS_CHECKED} />
                                    <label for="max_attempts" class="checkbox-label">
                                        Participants can submit multiple responses
                                    </label>
                                </li>
                                <li>
                                    <input id='anonymous_result' name="anonymous_result" type="checkbox" value="1" {ASSESS_ANONYMOUS_RESULT_CHECKED} />
                                    <label for="anonymous_result" class="checkbox-label">
                                        Anonymise results
                                    </label>
                                </li>
                                <li>
                                    <input id='notify_author' name="notify_author" type="checkbox" value="1" {ASSESS_NOTIFY_AUTHOR_CHECKED} />
                                    <label for="notify_author" class="checkbox-label">
                                        Notify creator via email when response received
                                    </label>
                                </li>
                            </ul>
                        </fieldset>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="{ASSESS_ACTION}" />
                </div>
            </div>
        </form>
    </div>
</div>

<div id="import-modal" class="reveal-modal" data-reveal>
    <form action="/survey/import/xml/{ASSESS_CATEGORY_ID}" method="post" enctype="multipart/form-data">
        <input type='hidden' name="is_task" value="{ASSESS_IS_TASK}" />
        <input type="hidden" name="unit_id" value="{ASSESS_UNIT_ID}" />
        {ASSESS_IMPORT_ATTACH_ZONE}
        <label>
            <input type="submit" value="Import from XML file" />
        </label>
    </form>
</div>
