{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ASSESS_HEADING}</h1>
        </div>
    </div>
    <!-- BEGIN importXML -->
    <nav>
        <a class="icon-more" title="" data-dropdown="header-options"><span></span></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li><a href="#" id="import" data-reveal-id="import-modal" class="icon-upload">Import from XML file</a></li>
    </ul>
    <!-- END importXML -->
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">{ASSESS_ACTION} {ASSESS_KIND}</h2>

        <form name="create" action="/survey/{ACTION}/{ASSESS_ASSESS_ID}" id="createAssess" method="post">
            <input name="category_id" type="hidden" value="{ASSESS_CATEGORY_ID}" />
            <input type="hidden" name="max_attempts" value="1" />

            <section class="content">
                <label>
                    Title
                    <input name="title" type="text" maxlength="100" value="{ASSESS_TITLE}" id="title"/>
                </label>

                <!-- BEGIN assess_timespan -->
                <!-- Available from this time -->
                <div class="row">
                    <div class="small-12 large-6 columns">
                        <label>
                            Open Date
                            <span class="hint has-tip tip-top" data-tooltip title="The date and time from when the survey will be available.">?</span>
                            <input name="start[date]" id="start_date" type="text" size="15" maxlength="30" value="{ASSESS_START_DATE}" />
                        </label>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Hour
                                <input name="start[hour]" type="text" class='timeField' value="{START_HOUR_VALUE}" data-timepicker="hour" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Minute
                                <input name="start[minute]" type="text" class='timeField' value="{START_MINUTE_VALUE}" data-timepicker="minute" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <label>
                            Period
                            <select name="start[meridiem]">
                                <!-- BEGIN startMeridiem -->
                                <option value="{START_MERIDIEM_VALUE}" {START_MERIDIEM_SELECTED}>{START_MERIDIEM_VALUE}</option>
                                <!-- END startMeridiem -->
                            </select>
                        </label>
                    </div>
                </div>

                <!-- Available until this time -->
                <div class="row">
                    <div class="small-12 large-6 columns">
                        <label>
                            Due Date
                            <span class="hint has-tip tip-top" data-tooltip title="Actual date and time the survey is due. Respondents will not be able to take the survey after this date.">?</span>
                            <input name="finish[date]" id="finish_date" type="text" size="15" maxlength="30" value="{ASSESS_FINISH_DATE}" />
                        </label>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Hour
                                <input name="finish[hour]" type="text" class='timeField' value="{FINISH_HOUR_VALUE}" data-timepicker="hour" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Minute
                                <input name="finish[minute]" type="text" class='timeField' value="{FINISH_MINUTE_VALUE}" data-timepicker="minute" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <label>
                            Period
                            <select name="finish[meridiem]">
                                <!-- BEGIN finishMeridiem -->
                                <option value="{FINISH_MERIDIEM_VALUE}" {FINISH_MERIDIEM_SELECTED}>{FINISH_MERIDIEM_VALUE}</option>
                                <!-- END finishMeridiem -->
                            </select>
                        </label>
                    </div>
                </div>
                <!-- END assess_timespan -->

                <label>
                    Description
                    <textarea id='description' name="description">{ASSESS_DESCRIPTION}</textarea>
                </label>

                <label>
                    Completion Message
                    <textarea id='completion-message' name="completion_message">{ASSESS_COMPLETION_MESSAGE}</textarea>
                </label>

                <fieldset>
                    <legend>Options</legend>

                    <input id="max_attempts" name="max_attempts" type="checkbox" value="0" {MAX_ATTEMPTS_CHECKED} />
                    <label for="max_attempts" class="checkbox-label">
                        Participants can submit multiple responses
                    </label>

                    <input id='anonymous_result' name="anonymous_result" type="checkbox" value="1" {ASSESS_ANONYMOUS_RESULT_CHECKED} />
                    <label for="anonymous_result" class="checkbox-label">
                        Anonymise results
                    </label>

                    <input id='notify_author' name="notify_author" type="checkbox" value="1" {ASSESS_NOTIFY_AUTHOR_CHECKED} />
                    <label for="notify_author" class="checkbox-label">
                        Notify creator via email when response received
                    </label>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="{ASSESS_ACTION} {ASSESS_KIND}" />
                </div>
            </div>
        </form>
    </div>
</div>

<div id="import-modal" class="reveal-modal" data-reveal>
    <form action="/survey/import/xml/{ASSESS_CATEGORY_ID}" method="post" enctype="multipart/form-data">
        <input type='hidden' name="is_task" value="{ASSESS_IS_TASK}" />
        <input type="hidden" name="unit_id" value="{ASSESS_UNIT_ID}" />
        <label>
            <input name="importXML" type="file" />
        </label>
        <label>
            <input type="submit" value="Import from XML file" />
        </label>
    </form>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.syncDates.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/components/jquery-timepicker-jt/jquery.timepicker.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.hourpicker.js"></script>
<script type="text/javascript" src="/javascript/jquery.minutepicker.js"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode : "exact",
            elements: "description, completion-message",
            file_browser_category_id : '{ASSESS_CATEGORY_ID}'
        });

        /* date picker */
        $('#start_date, #finish_date').datepicker({
            constrainInput: false,
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        $('#start_date').syncDates({endDate: $('#finish_date')});

        /* Timepicker
         */
        $('input[data-timepicker="hour"]').hourpicker({
            hours: 12,
            appendTo: function ($input) {
                return $input.closest('.timepick');
            }
        });
        $('input[data-timepicker="minute"]').minutepicker({
            appendTo: function ($input) {
                return $input.closest('.timepick');
            }
        });

        $('#createAssess').validate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                },
                "finish[hour]": {
                    required: true,
                    '12hour': true
                },
                "finish[minute]": {
                    required: true,
                    minute: true
                },
                "start[hour]": {
                    required: true,
                    '12hour': true
                },
                "start[minute]": {
                    required: true,
                    minute: true
                }
            },
            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            },
            errorPlacement: function(error, element) {
                var fieldset = element.closest('fieldset');
                if (fieldset.length) {
                    error.appendTo(fieldset);
                } else {
                    error.insertAfter(element);
                }
            }
        });
    });
</script>
