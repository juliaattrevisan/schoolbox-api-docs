<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.syncDates.js"></script>
<script type="text/javascript">
tinyMCE.init({
	mode : "exact",
	elements: "description",
	theme : "advanced",
	skin : "cirkuit",
	plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
    browser_spellcheck : true,
	content_css : "/css/core/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
	theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
	theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
	theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
	theme_advanced_buttons4 : "tablecontrols",
    accessibility_warnings : false,
	pdw_toggle_on : 1,
	pdw_toggle_toolbars : '2, 3, 4',
	extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
    theme_advanced_blockformats : "h3,h4,p,address,pre",
    file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
	file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
	file_browser_category_id : '{ASSESS_CATEGORY_ID}',
	tabfocus_elements : ":prev,:next",
	convert_urls : false,
	force_br_newlines : false,
	force_p_newlines : true
});

$j(document).ready(function() {
	/* date picker */
	$j('#start_date, #finish_date').datepicker({
		dateFormat: 'dd/mm/yy',
		showOn: 'both',
		buttonImage: '/images/core/calendar/calendar-click.png',
		buttonImageOnly: true,
		constrainInput: false,
		onClose: function (string) {
			var input = $j(this);
			$j.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
				input.val(data.time);
			})
		}
	});
	$j('#start_date').syncDates({endDate: $j('#finish_date')});
	/* date picker */


	var actionPlace = '{ACTION}';

	$j('#createAssess').validate({
		rules: {
			title: {
				required: true,
				minlength: 2
			}
		},
		messages: {
			title: "Please enter a title",
			description: "Please enter a description"
		}
    });

    /* Create dialog for importing XML survey */
    $( "#importForm" ).dialog({
        autoOpen: false,
        modal: true
    });

    $('#import').click(function() {
        $( '#importForm').dialog("open");
    });

});
</script>
<!-- END custom_head -->
<h1>{ASSESS_ACTION}</h1>
<div class="evaluation-content">
	<h2>Initial Details</h2>
	<form name="create" action="/survey/{ACTION}/{ASSESS_ASSESS_ID}" id="createAssess" method="post">
		<input name="category_id" type="hidden" value="{ASSESS_CATEGORY_ID}" />
		<table class="standardForm table" width="100%">
			<tr>
				<td class="formLabelWidth">
					<label>
                    <strong>Title</strong>
						<input name="title" type="text" size="35" maxlength="100" value="{ASSESS_TITLE}" id="title"/>
					</label>
				</td>
			</tr>
			<tr>
				<!-- Available from this time -->
				<td>
					<strong>Start</strong>
					<fieldset>
						<input name="start[date]" id="start_date" type="text" size="15" maxlength="30" value="{ASSESS_START_DATE}" />

						<input name="start[hour]" type="text" class='timeField' value="{START_HOUR_VALUE}" /> :
						<input name="start[minute]" type="text" class='timeField' value="{START_MINUTE_VALUE}" />
						<select name="start[meridiem]">
							<!-- BEGIN startMeridiem -->
							<option value="{START_MERIDIEM_VALUE}" {START_MERIDIEM_SELECTED}>{START_MERIDIEM_VALUE}</option>
							<!-- END startMeridiem -->
						</select>
					</fieldset>
				</td>
			</tr>
			<tr>
				<!-- Available until this time -->
				<td>
					<strong>Finish</strong>
					<fieldset>
						<input name="finish[date]" id="finish_date" type="text" size="15" maxlength="30" value="{ASSESS_FINISH_DATE}" />

						<input name="finish[hour]" type="text" class='timeField' value="{FINISH_HOUR_VALUE}" /> :
						<input name="finish[minute]" type="text" class='timeField' value="{FINISH_MINUTE_VALUE}" />
						<select name="finish[meridiem]">
							<!-- BEGIN finishMeridiem -->
							<option value="{FINISH_MERIDIEM_VALUE}" {FINISH_MERIDIEM_SELECTED}>{FINISH_MERIDIEM_VALUE}</option>
							<!-- END finishMeridiem -->
						</select>
					</fieldset>
				</td>
			</tr>
			<tr>
				<td>
					<strong>Description</strong>
					<div class="textarea-container">
						<textarea id='description' name="description">{ASSESS_DESCRIPTION}</textarea>
					</div>
				</td>
			</tr>
			<tr>
				<td>
                    <strong>Options</strong>
					<div class="textarea-container">
						<input type="hidden" name="max_attempts" value="1" />
						<input type="checkbox" name="max_attempts" value="0" {MAX_ATTEMPTS_CHECKED}>Participants can submit multiple responses<br />
                        <input name="anonymous_result" type="checkbox" value="1" {ASSESS_ANONYMOUS_RESULT_CHECKED}/>Anonymise results<br />
                        <input name="notify_author" type="checkbox" value="1" {ASSESS_NOTIFY_AUTHOR_CHECKED}/>Notify creator via email when result received<br />
                    </div>
				</td>
			</tr>
		</table>
		<label class="clearfix">
			<input type="submit" value="Continue" class="submit-btn-plain no-marg" />
		</label>
        <!-- BEGIN importXML -->
        <a href="#importForm"  id="import">Import from XML file</a>
        <!-- END importXML -->
	</form>

    <div id="importForm" class="hide" title="Import survey from an XML file">
        <form action="/survey/import/xml/{ASSESS_CATEGORY_ID}" method="post" enctype="multipart/form-data">
            <label>
                <input name="importXML" type="file" />
            </label>
            <label class="clearfix">
                <input type="submit" value="Import from XML file"  class="submit-btn-plain no-marg"/>
            </label>
        </form>
    </div>

</div>
