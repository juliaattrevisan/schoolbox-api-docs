<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/select-all/attacher.select-all.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/dataTables.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        $('[data-sortable]').DataTable({
            "info": false,
            "paging": false,
            "searching": false,
            "order": [1, "asc"]
        });

        $('#delete-attempts').alaressValidate({
            rules: {
                'attemptIds[]': 'required'
            },
            messages: {
                'attemptIds[]': 'You must select at least at least one attempt to delete.'
            },
            errorPlacement: function(error, element) {
                // insert the error after the section containing the table
                error.insertAfter($(element).closest('section'));
            },
            submitHandler: function(form) {
                $(this).confirmDialog({
                    text: 'Are you sure you want to delete the selected attempts?',
                    confirmLabel: 'Delete',
                    confirmEvent: function() {
                        form.submit();
                    }
                });
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SURVEY_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Attempts</h2>

        <form action="/survey/deleteAttempt" method="post" id="delete-attempts">

            <section>
                <div class="scrollable">
                    <table data-sortable>
                        <thead>
                        <tr>
                            <th data-orderable="false">
                                <!-- BEGIN checkbox -->
                                <div>
                                    <span title="Select all attempts" class="show-for-medium-up">
                                        <input data-selectall="attemptIds[]" id="review-all" type="checkbox" data-select-all data-select-all-for-group="attempts">
                                        <label for="review-all" class="checkbox-label" title="Toggle All Reviewed"></label>
                                    </span>
                                </div>
                                <!-- END checkbox -->
                            </th>
                            <!-- BEGIN respondent_heading -->
                            <th>Lastname</th>
                            <th>Firstname</th>
                            <!-- END respondent_heading -->
                            <th>Start</th>
                            <th>Finish</th>
                            <th data-orderable="false"></th>

                        </tr>
                        </thead>
                        <tbody>
                        <!-- BEGIN attempt -->
                        <tr>
                            <td>
                                <input type='checkbox' id='attempt-{ATTEMPT_ATTEMPT_ID}' name='attemptIds[]' value='{ATTEMPT_ATTEMPT_ID}' data-select-all-group="attempts">
                                <label for="attempt-{ATTEMPT_ATTEMPT_ID}" class="checkbox-label"></label>
                            </td>
                            <!-- BEGIN respondent_name -->
                            <td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_LASTNAME}</a></td>
                            <td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_FIRSTNAME}</a></td>
                            <!-- END respondent_name -->
                            <!-- BEGIN respondent_name_no_link -->
                            <td>{ATTEMPT_LASTNAME}</td>
                            <td>{ATTEMPT_FIRSTNAME}</td>
                            <!-- END respondent_name_no_link -->
                            <td data-order="{ATTEMPT_START_TIMESTAMP}">{ATTEMPT_START}</td>
                            <td data-order="{ATTEMPT_FINISH_TIMESTAMP}">{ATTEMPT_FINISH}</td>
                            <!-- BEGIN attempt_review_link -->
                            <td><a href='/survey/review/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}' class="icon-view no-text"></a></td>
                            <!-- END attempt_review_link -->
                            <!-- BEGIN attempt_review_no_link -->
                            <td></td>
                            <!-- END attempt_review_no_link -->
                        </tr>
                        <!-- END attempt -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- BEGIN buttons -->
            <div class="row">
                <div class="small-12 column">
                    <!-- BEGIN delete -->
                    <button type="submit" class="submit" href="#">Delete selected</button>
                    <!-- END delete -->
                </div>
            </div>
            <!-- END buttons -->

        </form>

    </div>
</div>
