<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/select-all/attacher.select-all.js"></script>
<script type="text/javascript">
    $(function() {
        $('[data-sortable]').DataTable({
            "info": false,
            "paging": false,
            "searching": false,
            "order": [1, "asc"]
        });


        // Delete all checked attempts

        $("[delete-selected]").click(function(event) {
            event.preventDefault();

            if ($('input[name="attemptIds[]"]:checked').length === 0) {
                alert('You must select at least at least one attempt to delete');
            } else {
                $(this).confirmDialog({
                    text:         'Are you sure you want to delete the selected attempts?',
                    confirmEvent: function() {
                        var attemptIds = $('input[name="attemptIds[]"]:checked').map(function() {
                            return $(this).val();
                        }).get();

                        $.post('/survey/deleteAttempt', {attemptIds: attemptIds})
                                .always(function() {
                                    location.reload();
                                });
                    }
                });
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SURVEY_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Attempts</h2>
        <section>
            <div class="scrollable">
                <table data-sortable>
                    <thead>
                    <tr>
                        <th data-orderable="false">
                            <!-- BEGIN checkbox -->
                            <div>
                                <span title="Select all attempts" class="show-for-medium-up">
                                    <input data-selectall="attemptIds[]" id="review-all" type="checkbox" data-select-all data-select-all-for-group="attempts">
                                    <label for="review-all" class="checkbox-label" title="Toggle All Reviewed"></label>
                                </span>
                            </div>
                            <!-- END checkbox -->
                        </th>
                        <!-- BEGIN respondent_heading -->
                        <th>Lastname</th>
                        <th>Firstname</th>
                        <!-- END respondent_heading -->
                        <th>Start</th>
                        <th>Finish</th>
                        <th data-orderable="false"></th>

                    </tr>
                    </thead>
                    <tbody>
                    <!-- BEGIN attempt -->
                    <tr>
                        <td>
                            <input type='checkbox' id='attempt-{ATTEMPT_ATTEMPT_ID}' name='attemptIds[]' value='{ATTEMPT_ATTEMPT_ID}' data-select-all-group="attempts">
                            <label for="attempt-{ATTEMPT_ATTEMPT_ID}" class="checkbox-label"></label>
                        </td>
                        <!-- BEGIN respondent_name -->
                        <td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_LASTNAME}</a></td>
                        <td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_FIRSTNAME}</a></td>
                        <!-- END respondent_name -->
                        <td>{ATTEMPT_START}</td>
                        <td>{ATTEMPT_FINISH}</td>
                        <td><a href='/survey/review/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}' class="icon-view no-text"></a></td>
                    </tr>
                    <!-- END attempt -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- BEGIN buttons -->
        <div class="row">
            <div class="small-12 column">
                <!-- BEGIN delete -->
                <a class="button submit expand" delete-selected href="#">Delete selected</a>
                <!-- END delete -->
            </div>
        </div>
        <!-- END buttons -->

    </div>
</div>
