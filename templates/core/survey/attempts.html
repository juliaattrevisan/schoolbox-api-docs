<h1>{SURVEY_NAME}</h1>

<div class="header_option clearfix">
	<a href="/homepage/{CID}" class="btn go-back"><span></span>Back to Homepage</a>
    <a href="/survey/results/{SURVEY_ID}" class="btn go-back"><span></span>Back to Survey Results</a>
</div>

<div class="evaluation-question-section">
	<form action='/survey/deleteAttempt' method='post'>
		<table>
			<tr>
				<!-- BEGIN respondent_heading -->
				<th>Student</th>
				<!-- END respondent_heading -->
				<th>Start</th>
				<th>Finish</th>
				<th>Review</th>
				<th>Action</th>
			</tr>
			<!-- BEGIN attempt -->
			<tr class='{ON_OFF}'>
				<!-- BEGIN respondent_name -->
				<td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_LASTNAME}, {ATTEMPT_FIRSTNAME}</a></td>
				<!-- END respondent_name -->
				<td>{ATTEMPT_START}</td>
				<td>{ATTEMPT_FINISH}</td>
				<td><a href='/survey/review/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}'>Review</a></td>
				<td><input type='checkbox' name='attemptIds[]' value='{ATTEMPT_ATTEMPT_ID}'></td>
			</tr>
			<!-- END attempt -->
		</table>

		<input class='submit-btn-plain' type='submit' value='Delete selected' />
	</form>
</div>
