<!-- BEGIN answerOption -->
<label>
    <script type='text/javascript'>
        $(function() {
            $('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
                id: {QUESTION_ID}
            });
        });
    </script>
    <span data-mandatory="{CONFIGURATION_MANDATORY}"></span>
    <textarea name="answer" class="{CONFIGURATION_MANDATORY}">{ANSWER}</textarea>
</label>
<!-- END answerOption -->
