<script type='text/javascript'>
	$(function() {
		$('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
			id: {QUESTION_ID}
		});
	});
</script>
<span data-mandatory="{CONFIGURATION_MANDATORY}"></span>
<fieldset class="checkboxes">
	<!-- BEGIN answerOption -->
	<label class="checkboxes">{ANSWER_VALUE_FACADE})
		<input name="answer[]" class="answerCorrect checkbox" type="checkbox" value="{ANSWER_VALUE}" {ANSWER_CHECKED}/><span>{ANSWER_DESCRIPTION}</span>
	</label>
	<!-- END answerOption -->

	<label class="checkboxes">
		<input name="answer[other]" class="answerCorrect" type="text" value="{ANSWER_OTHER}" />
	</label>
</fieldset>
