<script type='text/javascript'>
    $(function() {
        $('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
            id: {QUESTION_ID}
        });
    });
</script>

<span data-mandatory="{CONFIGURATION_MANDATORY}"></span>
<!-- BEGIN answerOption -->
<input id='questionForm-{QUESTION_ID}-{ANSWER_VALUE}' name="answer[]" type="checkbox" value="{ANSWER_VALUE}" {ANSWER_CHECKED} />
<label for="questionForm-{QUESTION_ID}-{ANSWER_VALUE}" class="checkbox-label">{ANSWER_VALUE_FACADE}) {ANSWER_DESCRIPTION}</label>
<!-- END answerOption -->
<input name="answer[other]" class="answerCorrect" type="text" value="{ANSWER_OTHER}" />
