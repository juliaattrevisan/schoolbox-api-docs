<script type="text/javascript" src="/javascript/jquery.form.2.43.js"></script>
<script type="text/javascript">
$j(document).ready(function() {

   	var validator = $j("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();

	}).validate({

		submitHandler: function() {
   		    var theForm = $j('#createQuestionForm');

        	/* Form preprocessing
             */
			var answerCollection = new Array();

			var content = tinyMCE.activeEditor.getContent(); // get the content
   			$j('#question').val(content); // put it in the textarea

			/* Collate possible answers and their correctness status
			 */
			$j.each($j('#answerCollection').find('li'), function(index, element) {
				var elem = $j(element);

				var description = elem.find('.answerDescription').val();
				var code = elem.find('.answerCode').attr('value');

				/* Ignore empty answers that weren't removed
				 */
				if (($j.trim(description) != '') && ($j.trim(code) != '')) {
					answerCollection.push({
						description: description,
						value: code,
						correct: elem.find('.answerCorrect').attr('checked')
					});
				}
			});

			/* Collate the usual fields containing ids.
			 * Collate the checkboxes too but append all the possibilities as well!
			 */
			var data = {
				section_id: theForm.find('input[name=section_id]').val(),
				question_id: theForm.find('input[name=question_id]').val(),
				sequence: theForm.find('input[name=sequence]').val(),
				type_id: theForm.find('input[name=type_id]').val(),
				question: tinyMCE.get('question').getContent(),
				marks: theForm.find('input[name=marks]').val(),
				allAnswers: JSON.stringify(answerCollection)
			};

			/* Submit via POST and redirect to question creation screen upon done
			 */
			$j.post(theForm.attr('action'), data, function(responseText) {
				window.location = '/survey/question/modify/' + data.question_id;
			});

			//tinyMCE.triggerSave();

			return false;
		},

		rules: {
			question: {
				required: true,
				minlength: 2
			},
			marks: {
				required: true,
				minlength: 1,
				number:true
			},
			'answerDescription[]': {
				emptyInputs: true
			},
			/* Removed mandatory correct answer
			 */
			'answer[]':{
				nothingChecked:true
			}

		},

        errorPlacement: function(error, element) {
            offset = element.offset();
            error.insertAfter(element)
            error.addClass('message');  // add a class to the wrapper
            error.css('position', 'absolute');
            error.css('left', 0);
            error.css('top',  element.parent().outerHeight() );

			if (element.hasClass("tinyValidate")) {
				var pos = $j('#question_container').position();
				error.css('left', pos.left);
           		error.css('top',  pos.top + $j('#question_container').outerHeight());
			}

			if (element.hasClass("answerDescription")) {
				error.addClass("list-items");
				var pos = $j('ul#answerCollection').height();
				var lefty = element.position();
				$j('.list-items').css('left', 115);
           		$j('.list-items').css('top',  pos);
			}

			if (element.hasClass("answerCorrect")) {
				error.addClass("wrong-checkbox");
				var pos = $j('ul#answerCollection').height();
				var lefty = element.position();
				$j('.wrong-checkbox').css('left', 115);
           		$j('.wrong-checkbox').css('top',  pos + 20);

			}

		}
	});

    jQuery.validator.addMethod('emptyInputs', function(value, element) {
        var fieldsAreFilled = true;

        $j.each($j('#answerCollection').find('li'), function(index, element) {
            var elem = $j(element);

            var description = elem.find('.answerDescription').val();
            var code = elem.find('.answerCode').attr('value');

            /* Ignore empty answers that weren't removed
             */
            if ($j.trim(description) == '') {
                fieldsAreFilled = false;
            }
	    });

        /* Reposition bubble here somewhere
         */
        return fieldsAreFilled;
    }, 'Please fill out all answers');


	jQuery.validator.addMethod('nothingChecked', function(value, element) {
        var countDracula = 0;

	    var oneFieldChecked = true;

        $j.each($j('#answerCollection').find('li'), function(index, element) {
            var elem = $j(element);

            var checkit = elem.find('.answerCorrect').is(':checked');

			// if the element isn't checked add to the count
            if (checkit == true) {
                countDracula++
            }

        });

		if (countDracula == 0) {
			oneFieldChecked = false;
		}

		return oneFieldChecked;

    }, 'Tick at least one checkbox');


    /* Add a new answer option
     */
    $j('#makeNewAnswer').live('click', function() {
		var thing = $j('.hidden-clone ul:first-child').clone();
		$j('ul#answerCollection').append(thing);

		var pos = $j('ul#answerCollection').height();

		$j('.list-items').css('left', 115);
		$j('.list-items').css('top',  pos);

		$j('.wrong-checkbox').css('left', 115);
		$j('.wrong-checkbox').css('top',  pos + 30);

		refreshList();
    });

	$j('.answerCorrect').each(function(){
		if ($j(this).is(':checked')) {
			$j(this).parent().parent().addClass("highlight");
		}
	});

	$j('.answerCorrect').live('click', function() {
		$j(this).parent().parent().toggleClass("highlight");
	});

	/* Remove an answer option
	 */
	$j('.delete').live('click', function(){
		if (($j('.inputs').length) !== 1) {
			$j(this).parent().remove();
			var pos = $j('ul#answerCollection').height();

			$j('.list-items').css('left', 115);
			$j('.list-items').css('top',  pos);

			$j('.wrong-checkbox').css('left', 115);
			$j('.wrong-checkbox').css('top',  pos + 30);

			refreshList()
		}
    });

	function refreshList() {

		var alphabetStart = 65;
		$j('li.inputs > div.list-item').each(function() {
		  var $this = $j(this);
		  $this.children('span').html('&#' + alphabetStart + ';)');
		  var convert = String.fromCharCode(alphabetStart);
		  $this.children('input').val(convert);
		  alphabetStart++;

		});
	}
});
</script>
<fieldset>
    <label>Answer</label>
	<div class="answerCollection">
		<ul id="answerCollection" >
		<!-- BEGIN answerOption -->
			<li class="inputs clearfix">
				<div class="list-item">
					<input name="answerCode[]" class="answerCode text-box" type="hidden" value="{ANSWER_VALUE}" />

					<span>{ANSWER_VALUE})</span>
				</div>
				<div class="check-it"><input name="answer[]" {ANSWER_CHECKED} class="answerCorrect" type="checkbox" /></div>
				<div class="answer-value"><input name="answerDescription[]" class="answerDescription text-box" type="text" value="{ANSWER_DESCRIPTION}" /></div>
				<div class="delete"></div>
			</li>
		<!-- END answerOption -->
		</ul>
		<a class="add-answer" id="makeNewAnswer">Add answer option</a>
	</div>

	<div class="hidden-clone">
		<ul>
			<li class="inputs clearfix">
				<div class="list-item">
					<input name="answerCode[]" class="answerCode text-box" type="hidden" value="" />
					<span>{ANSWER_VALUE})</span>
				</div>
				<div class="check-it"><input name="answer[]" class="answerCorrect"  type="checkbox" /></div>
				<div class="answer-value"><input name="answerDescription[]" class="answerDescription text-box" type="text" value="" /></div>
				<div class="delete"></div>
			</li>
		</ul>
		<a class="add-answer" id="makeNewAnswer">Add answer option</a>
	</div>
</fieldset>
