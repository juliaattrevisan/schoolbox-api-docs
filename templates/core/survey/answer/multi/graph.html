<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type="text/javascript" src="/javascript/evaluation/jquery.bargraph.js"></script>
<script type='text/javascript'>
    $(function() {
        $('#{GRAPH_ID}').evaluationBarchart({
            series: [
                <!-- BEGIN series -->
                {
                    name: "{SERIES_LABEL}",
                    data: [[{SERIES_INDEX}, {SERIES_DATA}]],
                }<!-- BEGIN series_separator -->,<!-- END series_separator -->
                <!-- END series -->
            ]
        });
    });
</script>

<div id='{GRAPH_ID}'></div>
