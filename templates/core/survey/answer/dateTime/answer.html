<script type='text/javascript'>
    $(function() {
        $('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
            id: {QUESTION_ID}
        });
    });
</script>

<span data-mandatory="{CONFIGURATION_MANDATORY}"></span>
<input type="text"
       id="questionForm-{QUESTION_ID}"
       name="answer"
       data-datepicker
       data-datepicker-time
       value="{ANSWER}"
/>
