<script type='text/javascript' src='/javascript/components/flot/jquery.flot.stack.js'></script>
<script type='text/javascript'>
$(function() {
	$.plot($("#{GRAPH_ID}"), [
        <!-- BEGIN series -->
        {label: "{SERIES_NAME}", data: [{SERIES_DATA}]}<!-- BEGIN series_separator -->,<!-- END series_separator -->
        <!-- END series -->
    ], {
        series: {
            stack: true,
            bars: {
                show: true,
                align: 'center'
            }
        },

        legend: {
            container: $('#legend_{GRAPH_ID}')
        },
        xaxis: {
            ticks: [[1, 'First'], [2, 'Second'], [3, 'Third']]
        },
        yaxis: {
            tickDecimals: 0
        }
    });
});
</script>
<div class="evaluation-graph-holder clearfix">
	<div id='{GRAPH_ID}' class="graph"></div>
	<div id='legend_{GRAPH_ID}' class="legend"></div>
</div>
