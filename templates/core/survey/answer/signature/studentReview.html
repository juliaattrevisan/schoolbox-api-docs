<script src="/javascript/signature/jquery.signaturepad.min.js"></script>
<script src="/javascript/shared/evaluation/type/jquery.signature-pad.js"></script>
<link rel="stylesheet" href="/javascript/signature/signaturepad.css">

<script type='text/javascript'>
    $(function() {
        // {RESPONSE} can be empty - function wrapper caters for that possibility.
        (function (response) {
            $('[data-signature="{RESPONSE_ID}"]').alaressSignaturePad({
                displayOnly: true,
                rescale: true,
                init: response
            });
        })({ANSWER});
    });
</script>

<tr class="row content">
    <td>
    <h4>Answer Given</h4>
    <div class="sigPad row readonly" data-signature="{RESPONSE_ID}">
        <div class="sigPadWrapper small-12 columns no-pad">
            <canvas class="pad" data-role="signatureCanvas" height="142"></canvas>
        </div>
    </div>
    </td>
</tr>
