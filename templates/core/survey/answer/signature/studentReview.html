<script src="{CDN_PREFIX}/js/signature/jquery.signaturepad.min.js?v={SITE_VERSION}"></script>
<script src="{CDN_PREFIX}/js/evaluation/type/jquery.signature-pad.js?v={SITE_VERSION}"></script>
<link rel="stylesheet" href="{CDN_PREFIX}/js/signature/signaturepad.css">

<script type='text/javascript'>
    $(function() {
        // {RESPONSE} can be empty - function wrapper caters for that possibility.
        (function (response) {
            $('[data-signature="{RESPONSE_ID}"]').alaressSignaturePad({
                displayOnly: true,
                rescale: true,
                init: response
            });
        })({ANSWER});
    });
</script>

<tr class="row content">
    <td>
        <h4>Answer Given</h4>
        <div class="sigPad readonly" data-signature="{RESPONSE_ID}">
            <div class="sigPadWrapper">
                <canvas class="pad" data-role="signatureCanvas" height="142"></canvas>
            </div>
        </div>
    </td>
</tr>
