<script type='text/javascript'>
    $(function() {
        $('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
            id: {QUESTION_ID}
        });
    });
</script>

<span data-mandatory="{CONFIGURATION_MANDATORY}"></span>
<ul class="option-list">
    <!-- BEGIN answerOption -->
    <li>
        <input id='questionForm-{QUESTION_ID}-{ANSWER_VALUE}'
               name="answer"
               type="radio"
               value="{ANSWER_VALUE}"
               {ANSWER_CHECKED}
        />
        <label for="questionForm-{QUESTION_ID}-{ANSWER_VALUE}"
               class="radio-label"
        >{ANSWER_DESCRIPTION}</label>
    </li>
    <!-- END answerOption -->
</ul>

<!-- BEGIN emptyAnswerState -->
<div class="empty-state">
    <sbx-icon name="staff-students" size="2.5rem"></sbx-icon>
    <p>You have no enrolled children: please skip to the next question, or the end of the survey.</p>
</div>
<!-- END emptyAnswerState -->
