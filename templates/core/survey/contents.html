<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
$j(function() {

	$j('a.delete').click(function() {
		location.href = $j(this).attr('href');
	}).confirm({
		buttons: {
			wrapper:'<button></button>',
			separator:'  '
  		}
	});

    $j('p.tiny-btns a').each(function() {
        $j(this).css({
            'width': '2px !important',
            'padding': '0 14px',
            'text-indent': '-9999em'
        })
    });


    $j('p.tiny-btns a').hover(function() {
        $j(this).removeAttr('style');
    }, function() {
        $j(this).css({
            'width': '2px !important',
            'padding': '0 14px',
            'text-indent': '-9999em'
        });
    });



    $j('.show-section-options').click(function() {
		$j(this).parent().siblings('.question-list').children(":first-child").slideToggle();
		$j(this).toggleClass('active')
		return false;
	});

	$j(".show-survey-options, .show-section-options").hover(
	function () {
		$j(this).children('span').stop(true, true).fadeIn("fast");
		$j(this).css('background-image', "none");
	},
	function () {
		var $this = $j(this)
		$this.children('span').stop(true, true).fadeOut("fast", function() {
			$this.removeAttr('style');
		});

	});

	
});
</script>

<h2>Manage Survey</h2>
	<div class="pad-it ">

		<p class="clearfix tiny-btns">
            <a href="/survey/modify/{ASSESS_ASSESS_ID}" class="btn modify float-left marg" ><span></span>Modify</a>
            <a href="/survey/export/{ASSESS_ASSESS_ID}" class="btn go-to float-left marg" ><span></span>Export</a>
            <a href="/survey/delete/{ASSESS_ASSESS_ID}" class="btn delete float-left marg" ><span></span>Delete</a>
            <a class="btn add marg" href="/survey/section/create/{ASSESS_ASSESS_ID}"><span></span>Add section</a>
		</p>
		
		<!-- BEGIN section -->
		<div class="evaluation-section">
			<h3>Section {SECTION_SEQUENCE}: {SECTION_TITLE}<a class="drop-arrow show-section-options" href="#">&#x25BC;</a></h3>

			<ul class="question-list">
			
				<li class="hide evaluation-section-options clearfix">
					<a href="/survey/section/modify/{SECTION_SECTION_ID}" class="btn modify float-left"><span></span>Edit</a>
					<a href="/survey/section/delete/{SECTION_SECTION_ID}" class="btn delete float-left"><span></span>Delete</a>
				</li>
			
				<!-- BEGIN question -->
				<li>
					<strong>Q{QUESTION_SEQUENCE})</strong> 
					{QUESTION_QUESTION}
					<a href="/survey/question/modify/{QUESTION_QUESTION_ID}">Edit</a> | 
					<a class="delete" href="/survey/question/delete/{QUESTION_QUESTION_ID}">Delete</a>
				</li>
				<!-- END question -->
				<li class="clearfix">
					<p class="clearfix no-marg">
						<a class="btn add marg" href="/survey/question/create/{SECTION_SECTION_ID}"><span></span>New Question</a>
                        <a class="btn download marg" href="/survey/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}"><span></span>Import Question</a>
					</p>
				</li>
			</ul>

		</div>
		<!-- END section -->
	</div>
