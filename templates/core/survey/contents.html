<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
$(function() {

	$('a.delete').click(function(event) {
		event.preventDefault();
		$(this).confirmDialog();
	});

	/* Make questions sortable
	 */
	$(".question-list").sortable({
		placeholder: "sortable-placeholder",
		forcePlaceholderSize: true,
		stop: function(event, ui) {
			var allQuestions = $(this).find('li');
			var section = $(this).attr('id');
			var data = new Array();

			$.each(allQuestions, function(index, element) {
				data.push(element.id);
			});

			/* Reorder questions upon reorder completion
			 */
			$.post('/survey/reorderQuestions/{ASSESS_ASSESS_ID}', {ids: data}, function(data) {
				var sequence = 1;

				$.each($('#' + section).find('li'), function(index, element) {
					$(element).find('strong').html('Q' + sequence);
					sequence++;
				});
			});
		}
	});

	$(".question-list" ).disableSelection();
});
</script>

<h2>Manage Survey</h2>
<div class="pad-it">
	<p class="clearfix tiny-btns no-marg">
		<a class="btn add float-left marg" href="/survey/section/create/{ASSESS_ASSESS_ID}"><span></span>Add Section</a>
        <a href="/survey/modify/{ASSESS_ASSESS_ID}" class="btn modify float-left marg" ><span></span>Modify</a>
        <a href="/survey/delete/{ASSESS_ASSESS_ID}" class="btn delete float-left marg" ><span></span>Delete</a>
		<a href="/survey/export/xml/{ASSESS_ASSESS_ID}" class="btn go-to float-left marg" ><span></span>Export</a>
    </p>

	<!-- BEGIN section -->
	<div class="evaluation-section">
		<h3>{SECTION_TITLE}
            <a href="/survey/section/delete/{SECTION_SECTION_ID}" class="btn delete no-text"><span></span></a>
            <a href="/survey/section/modify/{SECTION_SECTION_ID}" class="btn modify no-text"><span></span></a>
        </h3>
		<ul class="question-list" id='section{SECTION_SECTION_ID}'>
			<!-- BEGIN question -->
			<li id='question_{QUESTION_QUESTION_ID}'>
				<strong>Q{QUESTION_SEQUENCE})</strong>
                <div class="wysiwyg">{QUESTION_QUESTION}</div>
				<a href="/survey/question/modify/{QUESTION_QUESTION_ID}">Modify</a> |
				<a class="delete" href="/survey/question/delete/{QUESTION_QUESTION_ID}">Delete</a>
			</li>
			<!-- END question -->
		</ul>

		<ul>
			<li class="clearfix">
				<p class="clearfix no-marg">
					<a class="btn add marg" href="/survey/question/create/{SECTION_SECTION_ID}"><span></span>New Question</a>
					<a class="btn download marg" href="/survey/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}"><span></span>Add from Question Bank</a>
				</p>
			</li>
		</ul>
	</div>
	<!-- END section -->
</div>
