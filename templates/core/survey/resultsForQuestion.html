<!-- BEGIN custom_head -->
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.pie.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.stack.js'></script>

<!--[if lt IE 9]><script src="/javascript/signature/assets/flashcanvas.js"></script><![endif]-->
<script src="/javascript/signature/jquery.signaturepad.min.js"></script>
<script src="/javascript/signature/assets/json2.min.js"></script>
<link rel="stylesheet" href="/javascript/signature/signaturepad.css">

<script type="text/javascript">
$(function() {
	if ($('.evaluation-legend').length > 0) {
		$('.information-notification.hide').removeClass('hide');
	}
});
</script>
<style type="text/css">
    .graph-block {
        float: left;
        margin-top: 30px;
    }

    .evaluation-question-result .evaluation-results {
        width: 46%;
    }

    .graph-block .legend {
        float: left;
        clear: both;
        margin-left: 10%;
    }

    .evaluation-results th {
        text-align: left;
    }
</style>
<!-- END custom_head -->

<h1>{SURVEY_NAME}</h1>
<span class="header_option clearfix"><a class="btn go-back" href="/survey/results/{SURVEY_ID}"><span></span>Return to Survey</a></span>

<h2>Responses</h2>
<div class="evaluation-question-result pad-it clearfix">

	<div class="evaluation-results">
		<div class='wysiwyg'>
			{QUESTION_QUESTION}
		</div>

		<h3>Results</h3>
		<p class="information-notification clearfix hide">Click on a response letter to see the other students who selected that answer.</p>
		<table class="table ruler">
			<thead>
				<tr>
					<!-- BEGIN respondent_heading -->
					<th>Respondent</th>
					<!-- END respondent_heading -->
					<th>Response</th>
				</tr>
			</thead>
			<tbody>
				<!-- BEGIN respondent -->
				<tr>
					<!-- BEGIN respondent_name -->
					<td>{RESPONDENT_NAME}</td>
					<!-- END respondent_name -->
					<td class="evaluation-response"><ul><li><a class="response-item">{RESPONDENT_RESPONSE}</a></li></ul></td>
				</tr>
				<!-- END respondent -->
			</tbody>
		</table>
	</div>
    <div class="graph-block">
    <!-- BEGIN graph -->
    <!-- END graph -->
    </div>

</div>
