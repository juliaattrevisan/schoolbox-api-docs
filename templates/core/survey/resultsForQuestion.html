<style type="text/css">
    .graph-block {
        float: left;
        margin-top: 30px;
    }

    .evaluation-question-result .evaluation-results {
        width: 46%;
    }

    .graph-block .legend {
        float: left;
        clear: both;
        margin-left: 10%;
    }
    
    .evaluation-results th {
        text-align: left;
    }

<h1>{SURVEY_NAME}</h1>
<span class="header_option clearfix"><a class="btn go-back" href="/survey/results/{SURVEY_ID}"><span></span>Return to Survey</a></span>

<h2>Responses</h2>
<div class="evaluation-question-result pad-it clearfix">

	<div class="evaluation-results">
		<div class='evaluation-question'>
			{QUESTION_QUESTION}
		</div>

		<h3>Results</h3>
		<p class="information-notification clearfix hide">Click on a response letter to see the other students who selected that answer.</p>
		<table>
			<thead>
				<tr>
					<th><strong>Respondent</strong></th>
					<th><strong>Response</strong></th>
				</tr>
			</thead>
			<tbody>
				<!-- BEGIN respondent -->
				<tr>
					<td>{RESPONDENT_NAME}</td>
					<td class="evaluation-response"><ul><li><a class="response-item">{RESPONDENT_RESPONSE}</a></li></ul></td>
				</tr>
				<!-- END respondent -->
			</tbody>
		</table>
	</div>
    <div class="graph-block">
    <!-- BEGIN graph -->
    <!-- END graph -->
    </div>

</div>
