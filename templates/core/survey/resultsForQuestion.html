<!-- BEGIN custom_head -->
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.pie.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.stack.js'></script>

<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type="text/javascript" src="/javascript/evaluation/jquery.bargraph.js"></script>

<!--[if lt IE 9]><script src="/javascript/signature/assets/flashcanvas.js"></script><![endif]-->
<script src="/javascript/signature/jquery.signaturepad.min.js"></script>
<script src="/javascript/signature/assets/json2.min.js"></script>
<link rel="stylesheet" href="/javascript/signature/signaturepad.css">

<script type="text/javascript">
$(function() {
    $('[data-response-item]').click(function(event) {
        event.preventDefault();

        var data = $(this).attr('data-response-item');
        var css = 'callout panel';

        $('[data-response]').removeClass(css);
        $('[data-response="'+data+'"]').addClass(css);
    });
});
</script>

<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SURVEY_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Responses</h2>
        <section>
            <div class="content">
                <div class="row">
                    <div class="small-12 large-6 columns">
                        <article>{QUESTION_QUESTION}</article>

                        <table>
                            <thead>
                                <tr>
                                    <!-- BEGIN respondent_heading -->
                                    <th>Respondent</th>
                                    <!-- END respondent_heading -->
                                    <th>
                                        Response
                                        <span class="hint has-tip tip-top" data-tooltip title="Click on a response letter to see the other respondents who selected that answer.">?</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                            <!-- BEGIN respondent -->
                            <tr>
                                <!-- BEGIN respondent_name -->
                                <td>
                                    <span data-response="">{RESPONDENT_NAME}</span>
                                </td>
                                <!-- END respondent_name -->
                                <td>
                                    <ul class="inline-list">
                                        <li>
                                            <a href="#" data-response-item="">{RESPONDENT_RESPONSE}</a>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                            <!-- END respondent -->
                            </tbody>
                        </table>
                    </div>
                    <div class="small-12 large-6 columns">
                        <!-- BEGIN graph -->
                        <!-- END graph -->
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
