<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/highcharts.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.graphs.js?v={SITE_VERSION}"></script>
<script src="{CDN_PREFIX}/js/signature/jquery.signaturepad.min.js?v={SITE_VERSION}"></script>
<script src="{CDN_PREFIX}/js/evaluation/type/jquery.signature-pad.js?v={SITE_VERSION}"></script>
<link rel="stylesheet" href="{CDN_PREFIX}/js/signature/signaturepad.css?v={SITE_VERSION}">

<script type="text/javascript">
$(function() {
    $('[data-response-item]').click(function(event) {
        event.preventDefault();

        var data = $(this).attr('data-response-item');
        var css = 'respondent-indicator';

        $('[data-response]').removeClass(css);
        $('[data-response="'+data+'"]').addClass(css);
    });
});
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SURVEY_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Responses</h2>
        <section>
            <div class="row">
                <div class="small-12 columns">
                    <article class="content">
                        {QUESTION_QUESTION}
                    </article>
                </div>
            </div>
        </section>
        <!-- BEGIN respondent -->
        <section>
            <div class="row">
                <div class="small-12 columns">
                    <article class="content">
                        <!-- BEGIN respondent_name -->
                        <h3>Respondent</h3>
                        <p data-response="{RESPONDENT_RESPONSE_DATA}">{RESPONDENT_NAME}</p>
                        <!-- END respondent_name -->

                        <h3>Response <span class="hint has-tip tip-top" data-tooltip title="Click on a response letter to see the other respondents who selected that answer.">?</span></h3>
                        <a href="#" data-response-item="{RESPONDENT_RESPONSE_DATA}">{RESPONDENT_RESPONSE}</a>
                    </article>
                </div>
            </div>
        </section>
        <!-- END respondent -->
        <section>
            <div class="row">
                <div class="small-12 columns">
                    <article class="content">
                        <!-- BEGIN graph -->
                        <!-- END graph -->
                    </article>
                </div>
            </div>
        </section>
    </div>
</div>
