<!-- BEGIN custom_head -->
<link rel="stylesheet" href="{CDN_PREFIX}/js/vendors/jstree/dist/themes/default/style.css?v={SITE_VERSION}" />
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/jstree/dist/jstree.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/editor/jquery.editor.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressEditor({
            targetElements: $('textarea[name=question]'),
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        /* Category tree
         */
        $("#categoryTree")
                .on('select_node.jstree', function(event, jstree) {
                    $('#question_category').val(jstree.selected[0].replace(/^node_/, ''));
                })
                .on('deselect_node.jstree', function() {
                    $('#question_category').val('');
                })
                .jstree({
                    "animation":50,
                    "core":{
                        force_text: true,
                        multiple:false,
                        "themes": {
                            "variant" : "schoolbox",
                            "dots" : true,
                            "icons" : false
                        }
                    }
                });
    });

    /* For overriding plugin redirection destination when modifying
     * questions inside the QuestionBank
     *
     * This must appear before injected html fragments
     */
    var questionBank = {
        url: '{QUESTION_BANK_REDIRECT_URL}'
    }
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>Survey Questionbank</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form id="createQuestionForm" action="/survey/questionbank/question/modify" method="post" class="top">
            <input name="question_bank_id" type="hidden" value="{QUESTION_BANK_ID}" />
            <input type="hidden" name="type_id" value="{QUESTIONTYPE_TYPE_ID}" />
            <input type="hidden" name="question_category_id" value="{QUESTION_CATEGORY_ID}" />
            <input type="hidden" name="section_id" value="{SECTION_ID}" />
            <input type="hidden" name="assess_id" value="{CATEGORY_LIST_ITEM_ASSESS_ID}" />

            <h2 class="subheader">Modify Question</h2>
            <section class="content">
                <h3>{QUESTIONTYPE_DESCRIPTION}</h3>

                <label>
                    Question
                    <textarea name="question">{QUESTION}</textarea>
                </label>

                <!-- BEGIN has_answer_configuration -->
                <fieldset>
                    <legend>Configuration Options</legend>
                    <div class="small-12 column">
                    <!-- BEGIN answer_configuration -->

                    <!-- END answer_configuration -->
                    </div>
                </fieldset>
                <!-- END has_answer_configuration -->

                <div>
                    <!-- BEGIN answerInputs -->

                    <!-- END answerInputs -->
                </div>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" name="create" value="Modify" />
                </div>
            </div>
        </form>
    </div>
</div>
