<script type='text/javascript'>
$j(function() {
	$j('#deleteButton').mouseup(function() {
		var allQuestions = $j('#questionBankForm').find('input[name="delete_question_bank_id[]"]:checked');

		if (allQuestions.length && confirm('Do you want to remove the selected questions from the Question Bank?')) {
			$j.post('/assess/questionbank/delete', $j('#questionBankForm').serialize(), function(response) {
				alert(response);

				location.reload();
			});
		}
	});
});

</script>

<h2>Online Assessment Question Bank</h2>
	<form id='questionBankForm' action='/assess/questionbank/addToSection' method='post'>
		<input name='section_id' type='hidden' value='{SECTION_ID}' />
		<ul>
		<!-- BEGIN question_category -->
			<li>
				<h2>{QUESTION_CATEGORY_NAME}</h2>
				<ul>
					<!-- BEGIN question -->
					<li>
						<!-- BEGIN show_input -->
						<input name='question_bank_id[]' type='checkbox' value='{QUESTION_BANK_ID}' /> Copy into assess
						<!-- END show_input -->

						<input name='delete_question_bank_id[]' type='checkbox' value='{QUESTION_BANK_ID}' /> Delete from QuestionBank

						<p>
							{QUESTION}
						</p>
						({QUESTION_TYPE}, {MARKS} marks)
						<hr />
					</li>
					<!-- END question -->
				</ul>
			</li>
		<!-- END question_category -->
		</ul>

		<!-- BEGIN show_submit -->
		<input type='submit' value='Copy to section' />
		<!-- END show_submit -->

		<!-- BEGIN show_delete -->
		<input id='deleteButton' type='button' value='Remove from QuestionBank' />
		<!-- END show_delete -->

		<!-- BEGIN no_questions -->
		<p>There are no questions in the Question Bank.</p>
		<!-- END no_questions -->
	</form>
</div>
