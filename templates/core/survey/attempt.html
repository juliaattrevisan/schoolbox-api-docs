<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/jquery.countdown/dist/jquery.countdown.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/jquery.alphanumeric.js"></script>

<script type="text/javascript" src="/javascript/shared/evaluation/jquery.evaluation.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/countdown.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/richtext.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/multiplechoice.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/radio.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/matchingpairs.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/fillgap.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/short.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/exact.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/numeric.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/multiplechoiceother.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/signature.js"></script>
<script type="text/javascript" src="/javascript/shared/evaluation/type/ranking.js"></script>

<script type="text/javascript">
	$(function() {

		/* Start all the navigation controls
		 */
		$.fn.evaluation.initNavigators();

	});
</script>
<!-- END custom_head -->

<div class="row">
	<div class="small-12 island">
		<h1>{ASSESS_TITLE}</h1>
		<section>
			<ul class="information-list">
				<!-- BEGIN sectionPercentageComplete -->
				<li class="row" id="evaluation-percentage-bar-{SECTION_PERCENTAGE_COMPLETE_SECTION_ID}">
					<div class="info card">
                        <p class="meta title">
                            {SECTION_PERCENTAGE_COMPLETE_TITLE}
                        </p>
						<p class="meta">
							<span data-perc-complete>{SECTION_PERCENTAGE_COMPLETE_PERCENTAGE_COMPLETE}</span>% Complete
						</p>
					</div>
					<div class="progress">
						<div class="meter" data-meter style="width:{SECTION_PERCENTAGE_COMPLETE_PERCENTAGE_COMPLETE}%"></div>
					</div>
				</li>
				<!-- END sectionPercentageComplete -->
			</ul>
		</section>
	</div>
</div>
<div class="row">
	<div class="small-12 island">
		<h2 class="subheader">{SECTION_TITLE}</h2>
		<div class="content panel">{SECTION_DESCRIPTION}</div>
		<!-- BEGIN question -->
		<section>
			<form id="questionForm-{QUESTION_QUESTION_ID}" data-plugin="{QUESTION_PLUGIN}" action="/survey/saveResponse/{QUESTION_QUESTION_ID}" method="post" data-question="{QUESTION_QUESTION_ID}">
				<ul class="information-list">
					<li class="row content">
						<h3>Q{QUESTION_SEQUENCE}) <span class="alert">{QUESTION_MANDATORY}</span></h3>
						<article>{QUESTION_QUESTION}</article>
						<!-- error messages for radio/checkbox questions -->
						<div data-evaluationerrors="1"></div>
					</li>
					<li class="row content">
						<!-- BEGIN answerInputs -->
						<!-- END answerInputs -->
					</li>
				</ul>
			</form>
		</section>
		<!-- END question -->
	</div>
</div>

<div class="row">
	<div class="small-12 column">
		<!-- BEGIN prevSection -->
		<a href="/survey/attempt/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}" class="button icon-previous" data-evaluation-navigator>Previous Section</a>
		<!-- END prevSection -->

		<!-- BEGIN nextSection -->
		<a href="/survey/attempt/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}" class="button icon-next" data-evaluation-navigator>Next Section</a>
		<!-- END nextSection -->

		<!-- BEGIN endAssess -->
		<a href="/survey/end/{ASSESS_ASSESS_ID}" class="button secondary expand" data-evaluation-finish>Finish</a>
		<!-- END endAssess -->

        <div id='evaluation-saving' class="loader text-center hide">
            <span class="success label full-width hide" data-evaluation-progress-saved>Progress Saved</span>
        </div>
    </div>
</div>
