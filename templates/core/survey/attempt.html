<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/countdown/jquery.countdown.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/jquery.alphanumeric.js?v={SITE_VERSION}"></script>

<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.countdown.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.richtext.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.multiplechoice.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.radio.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.matchingpairs.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.fillgap.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.short.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.exact.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.numeric.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.multiplechoiceother.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.signature.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/evaluation/type/jquery.evaluation.ranking.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/promise/jquery.retry-promise.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/browser/jquery.keep-alive.js?v={SITE_VERSION}"></script>

<script type="text/javascript">
	$(function() {

		$.keepAlive();

		/* Start all the navigation controls
		 */
		$.fn.evaluation.initNavigators();

	});
</script>
<!-- END custom_head -->

<div class="row">
	<div class="small-12 island">
		<h1>{ASSESS_TITLE}</h1>
		<section>
			<ul class="information-list">
				<!-- BEGIN sectionPercentageComplete -->
				<li class="row" id="evaluation-percentage-bar-{SECTION_PERCENTAGE_COMPLETE_SECTION_ID}">
					<div class="card small-12">
                        <p class="meta title">
                            {SECTION_PERCENTAGE_COMPLETE_TITLE}
                        </p>
						<p class="meta">
							<span data-perc-complete>{SECTION_PERCENTAGE_COMPLETE_PERCENTAGE_COMPLETE}</span>% Complete
						</p>
					</div>
					<div class="progress">
						<div class="meter" data-meter style="width:{SECTION_PERCENTAGE_COMPLETE_PERCENTAGE_COMPLETE}%"></div>
					</div>
				</li>
				<!-- END sectionPercentageComplete -->
			</ul>
		</section>
	</div>
</div>
<div class="row">
	<div class="small-12 island">
		<h2 class="subheader">{SECTION_TITLE}</h2>
		<!-- BEGIN sectionDescription -->
		<section class="content">
			<article>{SECTION_DESCRIPTION}</article>
		</section>
		<!-- END sectionDescription -->
		<!-- BEGIN question -->
		<section>
			<form id="questionForm-{QUESTION_QUESTION_ID}" data-plugin="{QUESTION_PLUGIN}" action="/survey/saveResponse/{QUESTION_QUESTION_ID}" method="post" data-question="{QUESTION_QUESTION_ID}">
				<ul class="information-list">
					<li class="row content">
						<h3>Q{QUESTION_SEQUENCE}) {QUESTION_MANDATORY}</h3>
						<article>{QUESTION_QUESTION}</article>
						<!-- error messages for radio/checkbox questions -->
						<div data-evaluationerrors="1"></div>
					</li>
					<li class="row content">
						<!-- BEGIN answerInputs -->
						<!-- END answerInputs -->
					</li>
				</ul>
				<input type="hidden" name="attempt_id" value="{ATTEMPT_ID}">
			</form>
		</section>
		<!-- END question -->

        <ul class="flex-list buttons">
            <!-- BEGIN prevSection -->
            <li>
                <a href="/survey/attempt/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}" class="button icon-previous" data-evaluation-navigator>Previous Section</a>
            </li>
            <!-- END prevSection -->

            <!-- BEGIN nextSection -->
            <li>
                <a href="/survey/attempt/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}" class="button icon-next" data-evaluation-navigator>Next Section</a>
            </li>
            <!-- END nextSection -->

            <!-- BEGIN endAssess -->
            <li>
                <button data-href="/survey/end/{ASSESS_ASSESS_ID}/{ATTEMPT_ID}" class="submit" data-evaluation-finish>Finish</button>
			</li>
            <!-- END endAssess -->
        </ul>
	</div>
	<div class="toast" data-alert data-relation="save-label"></div>
</div>
