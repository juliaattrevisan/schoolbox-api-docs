<form action="/collabdoc/modifyForm" method="post">
    <input type="hidden" name='homepageId' value="{HOMEPAGE_ID}" />

	<table class="standardForm table">
		<tr>
			<td>
				<h4>Collab Doc Name</h4>
                <!--[if lt IE 10]><em>The name of the Collab Doc<em><![endif]-->
                <label>
                    <input type="text" maxlength='255' name='name' value="" placeholder="The name of the Collab Doc" />
                </label>
			</td>
		</tr>
	</table>

    <input type="submit" value="Create Collab Doc" class="submit-btn-plain no-marg" />
</form>
