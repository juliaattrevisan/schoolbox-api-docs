    $(function() {
        $('[data-form="edit"]').validate();
    });
</script>

<ul class="breadcrumb">
    <li><a href="/homepage/{HOMEPAGE_ID}/">{FOLDER_NAME}</a></li>
    <li class="active"><a href="#">Create Collab Doc</a></li>
</ul>

<div class="row">
    <div class="small-12 island">
        <h1>Create Collab Doc</h1>

        <form data-form='edit' action="/collabdoc/editForm" method="post" class="top">
            <input type="hidden" name='homepageId' value="{HOMEPAGE_ID}" />

            <section>
                <fieldset class="content">
                    <div class="small-12 column">
                        <label>
                            Name
                            <input type="text" maxlength='255' name='name' class='required' value="" />
                        </label>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" value="Create Collab Doc" />
                </div>
            </div>
        </form>
    </div>
</div>
