<h1>{ETHERPAD_NAME}</h1>

<!-- BEGIN etherpad_lock -->
<a href='/collabdoc/lock/{ETHERPAD_PAD_ID}/{HOMEPAGE_ID}' class='button icon-locked'>Lock</a>
<!-- END etherpad_lock -->

<!-- BEGIN etherpad_unlock -->
<a href='/collabdoc/lock/{ETHERPAD_PAD_ID}/{HOMEPAGE_ID}' class='button icon-locked'>Unlock</a>
<!-- END etherpad_unlock -->

<a href='/homepage/{HOMEPAGE_ID}' class='button icon-folder'>Return to Homepage</a>

<div>
<iframe data-collabdoc src='{ETHERPAD_URL}'></iframe>
</div>

<script type="text/javascript">
    $(function() {

        $(window).resize(function() {
            $('[data-collabdoc]').css({
                width: '100%',
                height: $(window).height()-200
            });
        });

        $('[data-collabdoc]').css({
            width: '100%',
            height: $(window).height()-200
        });

        $('[data-deleteButton="1"]').click(function(event) {
            event.preventDefault();

            if (confirm('Are you sure you want to delete this Collab Doc?')) {
                window.location.href = $(this).attr('href');
            }
        });
    });
</script>
