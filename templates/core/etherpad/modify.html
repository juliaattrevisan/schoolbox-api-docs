<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function() {
        var form = $('[data-form="modify"]');
        form.alaressValidate();

        $('[data-delete]').on("click", function(event) {
            event.preventDefault();

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this Collab Doc?',
                confirmLabel: 'Delete',
                confirmEvent: function() {
                    form.find('input[name="type"]').val('delete');
                    form.trigger('submit');
                }
            });
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>Modify Collab Doc</h1>
        </div>
    </div>
    <nav>
        <sbx-pop-out content-id="header-options"></sbx-pop-out>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <!-- BEGIN etherpad_delete -->
        <li><a class="icon-delete" data-delete>Delete Collab Doc</a></li>
        <!-- END etherpad_delete -->
    </ul>
</div>

<div class="row">
    <div class="small-12 island">
        <form data-form='modify' action="/collabdoc/modifyForm" method="post" class="top">
            <input type="hidden" name='padId' value="{ETHERPAD_PAD_ID}" />
            <input type="hidden" name="homepageId" value="{HOMEPAGE_ID}"  />
            <input type="hidden" name="type" value="update" />

            <section>
                <fieldset class="content">
                    <div class="small-12 column">
                        <label for="name" class="required">Name</label>
                        <input type="text" maxlength='255' name='name' id="name" value="{ETHERPAD_PAD_NAME}" required />
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" value="Update Collab Doc" />
                </div>
            </div>
        </form>
    </div>
</div>
