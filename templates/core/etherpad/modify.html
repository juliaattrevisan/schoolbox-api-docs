<script type="text/javascript">
	$j(function() {
		$j('[data-deleteButton="1"]').click(function(event) {
			event.preventDefault();

			if (confirm('Are you sure you want to delete this Collab Doc?')) {
				window.location.href = $(this).attr('href');
			}
		});
	});
</script>
