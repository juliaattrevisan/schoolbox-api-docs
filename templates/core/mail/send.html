<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/shared/selectize/jquery.selectize-selector.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
$(function() {
    $.fn.alaressTiny({
        mode: 'textareas'
    });

    var options = {
        ajax: {
            url:      '/ajax/user.php',
            type:     'GET',
            data:     {groupID: 0, email: 1},
            dataType: 'json'
        },
        multiple: true,
        selectize: {
            plugins: ['remove_button', 'restore_on_backspace'],
            create: function(input) {
                var freeEntry = {};
                freeEntry[this.settings.valueField]  = input;
                freeEntry[this.settings.searchField] = input;
                return freeEntry;
            }
        }
    }
    $('#to').selectizeSelector($.extend({}, options, {value: {REPLYTO}}))
    $('#cc').selectizeSelector(options)
    $('#bcc').selectizeSelector($.extend({}, options, {value: {BCC}}))

    // dialogs for copying email fields
    $('label[data-role="copy-emails"]').click(function(event) {
        event.preventDefault();
        var element = $(this);
        var target  = $('#'+element.attr('for'));
        // get html-escaped version of text, really annoying
        var text = $('<div />').text(target.val()).html();
        if (text.length > 0) {
            element
                .qtip({
                    content: {
                        title: target.attr('name'),
                        text: text,
                        button: true
                    },
                    position: {
                        my: 'top right',
                        at: 'bottom left'
                    },
                    style: {
                        classes: 'qtip-light qtip-shadow'
                    },
                    show: {
                        event: 'click'
                    },
                    hide: {
                        event: 'unfocus'
                    },
                    events: {
                        hide: function(event, api) {
                            api.destroy();
                        }
                    }
                })
                .qtip('show');
        }
    })
});

function verify()
{
        var msg = ""
        if(document.getElementById('mailForm').to.value == ""){
                msg += "You need to have a recipient\n";
        }
        if(msg != ""){
                alert(msg);
                return false;
        }
        else
	{
                return true;
	}
}
</script>
<script type="text/javascript" src="/javascript/multifile.js"></script>
<!-- END custom_head -->

<h1>Compose Email</h1>
<form class="standardForm" action="send.php" method="post" enctype="multipart/form-data" name="mailForm" id="mailForm">
  <table class="table">
    <tr>
      <td class="formLabelWidth"><h4>To:</h4></td>
	  <td>
          <input name="to" id="to" size="90" class="email-input" />
          <label for="to" data-role="copy-emails" class="btn modify no-text" title="Show addresses for copy"><span></span></label>
      </td>
    </tr>
    <tr>
      <td><h4>CC:</h4></td>
	  <td>
          <input name="cc" id="cc" size="90" class="email-input" />
          <label for="cc" data-role="copy-emails" class="btn modify no-text" title="Show addresses for copy"><span></span></label>
      </td>
    </tr>
    <tr>
      <td><h4>BCC:</h4>
	  </td>
	  <td>
          <input name="bcc" id="bcc" size="90" class="email-input" />
          <label for="bcc" data-role="copy-emails" class="btn modify no-text" title="Show addresses for copy"><span></span></label>
      </td>
    </tr>
    <tr>
      <td><h4>Subject:</h4>
	  </td>
	  <td><input type="text" name="subject" size="90" value="{SUBJECT}" /></td>
    </tr>
    <tr>
      <td colspan="2"><textarea name="message" style="width:100%;height:350px">{BODY}</textarea></td>
    </tr>
    <tr>
      <td><h4>Attachments:</h4>
	 </td>
	 <td>
        {ATTACH_ZONE}
     </td>
    </tr>
    <tr>
      <td></td>
    </tr>
  </table>
  <input type="submit" name="submit" class="submit-btn-plain" value="Send" />
</form>
