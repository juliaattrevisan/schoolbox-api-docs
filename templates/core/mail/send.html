<link rel="stylesheet" href="/css/jquery.autocomplete.css" type="text/css" />
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.autocomplete.js"></script>
<script type="text/javascript">
$j(document).ready(function () {
	$j('#to').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
        delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()

	});

	$j('#cc').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
        delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()
	});

	$j('#bcc').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
        delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()
	});
});

tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
	plugins : "table,paste",
	content_css : "/css/core/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
	theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,outdent,indent,separator,sub,sup,separator,link,unlink,image,charmap,hr,separator,undo,redo",
	theme_advanced_buttons2 : "forecolor,tablecontrols,separator,pastetext,pasteword,selectall,separator,removeformat,cleanup,code",
	theme_advanced_buttons3 : "",
	extended_valid_elements : "a[name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]"
});


function verify()
{
        var msg = ""
        if(document.getElementById('mailForm').to.value == ""){
                msg += "You need to have a recipient\n";
        }
        if(msg != ""){
                alert(msg);
                return false;
        }
        else
	{
                return true;
	}
}
</script>
<script type="text/javascript" src="/javascript/multifile.js"></script>
<!-- END custom_head -->

<h1>Compose Email</h1>
<form class="standardForm" action="send.php" method="post" enctype="multipart/form-data" name="mailForm" id="mailForm">
  <table>
    <tr>
      <td><h3>To:</h3></td>
      <td><input type="text" name="to" id="to" size="90" value="{REPLYTO}" />
    </tr>
    <tr>
      <td><h3>CC:</h3></td>
      <td><input type="text" name="cc" id="cc" size="90" />
      </td>
    </tr>
    <tr>
      <td><h3>BCC:</h3></td>
      <td><input type="text" name="bcc" id="bcc" size="90" value="{BCC}" />
      </td>
    </tr>
    <tr>
      <td><h3>Subject:</h3></td>
      <td><input type="text" name="subject" size="90" value="{SUBJECT}" /></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td><textarea name="message" style="width:100%;height:350px">{BODY}</textarea></td>
    </tr>
    <tr>
      <td><h3>Attachments:</h3></td>
      <td><input id="attachment" type="file" name="file[]" />
        <div id="files_list"></div>
        <script type="text/javascript">
						<!-- Create an instance of the multiSelector class, pass it the output target and the max number of files -->
						var multi_selector = new MultiSelector( document.getElementById( 'files_list' ), 5 );
						<!-- Pass in the file element -->
						multi_selector.addElement( document.getElementById( 'attachment' ) );
						</script></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td><input type="submit" name="submit" value="Send" /></td>
    </tr>
  </table>
</form>
