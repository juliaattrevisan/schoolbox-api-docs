<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.autocomplete.css" type="text/css" />
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.autocomplete.js"></script>
<script type="text/javascript">
$j(document).ready(function () {
	$j('#to').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
        delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()

	});

	$j('#cc').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
        delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()
	});

	$j('#bcc').autocomplete({
		serviceUrl: '/ajax/user.php?groupID=0&email=1',
                delimiter: /(,|;)\s*/, // regex or character
		minChars: 2,
		maxHeight: 400,
		width: $j('#addUser').width()
	});
});

tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
    skin : "cirkuit",
	plugins : "pdw,table,tabfocus,inlinepopups,,paste,spellchecker",
	content_css : "/css/{SITE_LOCATION}/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
    theme_advanced_buttons1 : "formatselect,fontsizeselect,forecolor,separator,bold,italic,underline,separator,justifyleft,justifycenter,justifyright,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
    theme_advanced_buttons2 : "spellchecker,separator,selectall,pastetext,pasteword,separator,removeformat,cleanup,code,separator,outdent,indent,sub,sup,separator,hr,charmap,tablecontrols",
    theme_advanced_buttons3 : "",
    pdw_toggle_on : 1,
    pdw_toggle_toolbars : '2',
	tabfocus_elements : ":prev,:next",
	convert_urls : false
});


function verify()
{
        var msg = ""
        if(document.getElementById('mailForm').to.value == ""){
                msg += "You need to have a recipient\n";
        }
        if(msg != ""){
                alert(msg);
                return false;
        }
        else
	{
                return true;
	}
}
</script>
<script type="text/javascript" src="/javascript/multifile.js"></script>
<!-- END custom_head -->

<h1>Compose Email</h1>
<form class="standardForm" action="send.php" method="post" enctype="multipart/form-data" name="mailForm" id="mailForm">
  <table>
    <tr>
      <td class="formLabelWidth"><h4>To:</h4></td>
	  <td><input type="text" name="to" id="to" size="90" value="{REPLYTO}" /></td>
    </tr>
    <tr>
      <td><h4>CC:</h4></td>
	  <td><input type="text" name="cc" id="cc" size="90" /></td>
    </tr>
    <tr>
      <td><h4>BCC:</h4>
	  </td>
	  <td><input type="text" name="bcc" id="bcc" size="90" value="{BCC}" /></td>
    </tr>
    <tr>
      <td><h4>Subject:</h4>
	  </td>
	  <td><input type="text" name="subject" size="90" value="{SUBJECT}" /></td>
    </tr>
    <tr>
      <td colspan="2"><textarea name="message" style="width:100%;height:350px">{BODY}</textarea></td>
    </tr>
    <tr>
      <td><h4>Attachments:</h4>
	 </td>
	 <td> <input id="attachment" type="file" name="file[]" />
        <div id="files_list"></div>
        <script type="text/javascript">
						<!-- Create an instance of the multiSelector class, pass it the output target and the max number of files -->
						var multi_selector = new MultiSelector( document.getElementById( 'files_list' ), 5 );
						<!-- Pass in the file element -->
						multi_selector.addElement( document.getElementById( 'attachment' ) );
						</script></td>
    </tr>
    <tr>
      <td></td>
    </tr>
  </table>
  <input type="submit" name="submit" class="submit-btn-plain" value="Send" />
</form>
