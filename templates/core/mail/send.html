<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/shared/selectize/jquery.selectize-selector.js"></script>
<script type="text/javascript" src="/javascript/ckeditor/ckeditor.js"></script>
<script type="text/javascript" src="/javascript/shared/editor/jquery.editor.js"></script>
<script type="text/javascript" src="/javascript/components/zeroclipboard/dist/ZeroClipboard.min.js"></script>
<script type="text/javascript" src="/javascript/shared/jquery.clipboard-selector.js"></script>
<script type="text/javascript">
$(function() {

    // Disable iFrame embed on mail content
    $.fn.alaressEditor({
        targetElements: $('#body'),
        removePlugins: 'autoembed,uploadimage,schoolboxresource,schoolboxiframe'
    });

    var options = {
        ajax: {
            url:      '/ajax/user.php',
            type:     'GET',
            data:     {groupID: 0, email: 1},
            dataType: 'json'
        },
        multiple: true,
        selectize: {
            plugins: ['remove_button', 'restore_on_backspace'],
            create: function(input) {
                var freeEntry = {};
                freeEntry[this.settings.valueField]  = input;
                freeEntry[this.settings.searchField] = input;
                return freeEntry;
            },
            onItemAdd: function(key, $item) {
                if (validateEmail(key) === false) {
                    $item.addClass('error');
                    var closeTab = '<a href="javascript:void(0)" class="remove" tabindex="-1" title="Remove">×</a>';
                    $item.text(key + ' - Invalid email format').append(closeTab);
                }
            }
        }
    }

    function validateEmail(email) {
        // Source: https://www.w3.org/TR/2012/WD-html-markup-20120329/input.email.html
        // Replaced ’ character with ' as ’ is not even a valid email character for input type email.
        // Seems like it's a typo from the source.
        var validEmailFilter = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/;
        var emailIsInBetweenRegex = /\<([^)]+)\>/; // Is email string in between <>? E.g <alaress@alaress.com.au>

        if (emailIsInBetweenRegex.test(email)) {
            var matches = emailIsInBetweenRegex.exec(email);
            email = matches[1];
        }

        if (validEmailFilter.test(email)) {
            return true;
        }

        return false;
    }

    $('#to').selectizeSelector($.extend({}, options, {value: {REPLYTO}}))
    $('#cc').selectizeSelector($.extend({}, options, {value: {CC}}))
    $('#bcc').selectizeSelector($.extend({}, options, {value: {BCC}}))

    // dialogs for copying email fields

    $('[data-role="copy-emails"]').each(function(index, element) {
        $.fn.clipboardSelector({
            exportActivator: $(element),
            onReady: function() {

                // get html-escaped version of text, really annoying
                var target = $('#'+$(element).parent('label').attr('for'));
                var text = $('<div />').text(target.val()).html();

                var dialog = $('#email-modal');
                var dialogUrl = $('#copy-email-text');

                dialogUrl.html(text);
                dialog.foundation('reveal','open');

                /* Bypass foundation bug
                 * https://github.com/zurb/foundation/issues/4746
                 */
                dialog.on('opened', function() {
                    dialogUrl.select();

                    $('#copy-button').show();
                });
            }
        });
    });

    $.validator.addMethod('mailHasRecipient', function(value, element) {
        if ($("#to").val() || $("#cc").val() || $("#bcc").val()) {
            return true;
        }
        return false;
    }, 'A valid recipient must be provided')

    $('#mailForm').alaressValidate({
        ignore: ':hidden:not([class~=selectized]),:hidden > .selectized, .selectize-control .selectize-input input',
        rules: {
            to: {
                mailHasRecipient: true
            }
        },
        submitHandler: function(mailForm) {
            if (!CKEDITOR.instances['body'].getData().length) {
                $(this).confirmDialog({
                    text: 'Message body is empty. Are you sure you want to send this message?',
                    confirmEvent: function() {
                        submitForm(mailForm);
                    }
                });
            } else {
                submitForm(mailForm);
            }

            /**
             * Submit the form, disabling the submit button while it's working
             * @param form
             */
            function submitForm(form) {
                var $submitButton = $('#mailSubmit');
                $submitButton.prop('disabled', true).val($submitButton.attr('data-working'));
                form.submit();
            }
        }
    });

    $('input[type=radio][name=separator]').change(function() {

        var text = $('#copy-email-text').text();
        var replaceText = '';

        if (this.value == 'comma') {
            replaceText = text.replace(/\;/g, ',');
        }
        else if (this.value == 'colon') {
            replaceText = text.replace(/\,/g, ';');
        }

        $('#copy-email-text').text(replaceText);

    });

});
</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 island">
        <h1>Compose Email</h1>
        <!-- BEGIN alert_box -->
        <div data-alert class="alert-box alert">
            <p>The following email addresses are invalid and could not be added.</p>
            <a href="#" class="close">&times;</a>
            <ul>
                <!-- BEGIN invalid_address -->
                <li>
                    {INVALID_EMAIL}
                </li>
                <!-- END invalid_address -->
            </ul>
        </div>
        <!-- END alert_box -->
        <form action="send.php" method="post" enctype="multipart/form-data" id="mailForm">
            <section>
                <fieldset class="content">
                    <div class="small-10 large-11 columns">
                        <label for="to" class="required">To</label>
                        <input name="to" id="to"/>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label for="to">
                            Copy
                            <a data-role="copy-emails" class="button icon-copy" title="Show addresses for copy"></a>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <div class="small-10 large-11 columns">
                        <label>CC
                            <input name="cc" id="cc" />
                        </label>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label for="cc">
                            Copy
                            <a data-role="copy-emails" class="button icon-copy" title="Show addresses for copy"></a>
                        </label>
                    </div>
                    <div class="small-10 large-11 columns">
                        <label>
                            BCC
                            <input name="bcc" id="bcc" />
                        </label>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label for="bcc">
                            Copy
                            <a data-role="copy-emails" class="button icon-copy" title="Show addresses for copy"></a>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label for="subject" class="required">Subject</label>
                        <input type="text" name="subject" id="subject" value="{SUBJECT}" required />
                        <label>
                            <textarea name="message" id="body">{BODY}</textarea>
                        </label>
                        <label>
                            Attachments
                        </label>
                        {ATTACH_ZONE}
                    </div>
                </fieldset>
            </section>
            <input type="submit" id="mailSubmit" value="Send" data-working="Sending..." />
        </form>
    </div>
</div>

<div id="email-modal" class="reveal-modal" data-reveal aria-labelledby="modalTitle" aria-hidden="true" role="dialog">
    <p>Use this to copy the addresses to your clipboard for use in other email programs</p>
    <textarea readonly id="copy-email-text" rows="6"></textarea>
    <fieldset class="radiolist" >
        <input type="radio" name="separator" value="comma" id="commaSep" checked><label for="commaSep" >Comma Separated</label>
        <input type="radio" name="separator" value="colon" id="colonSep"><label for="colonSep" >Semi-Colon Separated</label>
    </fieldset>
    <button id="copy-button" data-clipboard-target="copy-email-text" class="icon-copy">Copy to Clipboard</button>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>
