<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
	$(function() {
		$.fn.alaressTiny({
			mode: 'textareas'
		});

		var options = {
			ajax: {
				url:      '/ajax/user.php',
				type:     'GET',
				data:     {groupID: 0, email: 1},
				dataType: 'json'
			},
			multiple: true,
			selectize: {
				plugins: ['remove_button', 'restore_on_backspace'],
				create: function(input) {
					var freeEntry = {};
					freeEntry[this.settings.valueField]  = input;
					freeEntry[this.settings.searchField] = input;
					return freeEntry;
				}
			}
		}
		$j('#to').selectizeSelector($j.extend({}, options, {value: {REPLYTO}}))
		$j('#cc').selectizeSelector(options)
		$j('#bcc').selectizeSelector($j.extend({}, options, {value: {BCC}}))
	});

function verify()
{
        var msg = ""
        if(document.getElementById('mailForm').to.value == ""){
                msg += "You need to have a recipient\n";
        }
        if(msg != ""){
                alert(msg);
                return false;
        }
        else
	{
                return true;
	}
}
</script>
<script type="text/javascript" src="/javascript/multifile.js"></script>
<!-- END custom_head -->

<h1>Compose Email</h1>
<form class="standardForm" action="send.php" method="post" enctype="multipart/form-data" name="mailForm" id="mailForm">
  <table class="table">
    <tr>
      <td class="formLabelWidth"><h4>To:</h4></td>
	  <td><input name="to" id="to" size="90" /></td>
    </tr>
    <tr>
      <td><h4>CC:</h4></td>
	  <td><input name="cc" id="cc" size="90" /></td>
    </tr>
    <tr>
      <td><h4>BCC:</h4>
	  </td>
	  <td><input name="bcc" id="bcc" size="90" /></td>
    </tr>
    <tr>
      <td><h4>Subject:</h4>
	  </td>
	  <td><input type="text" name="subject" size="90" value="{SUBJECT}" /></td>
    </tr>
    <tr>
      <td colspan="2"><textarea name="message" style="width:100%;height:350px">{BODY}</textarea></td>
    </tr>
    <tr>
      <td><h4>Attachments:</h4>
	 </td>
	 <td> <input id="attachment" type="file" name="file[]" />
        <div id="files_list"></div>
        <script type="text/javascript">
						<!-- Create an instance of the multiSelector class, pass it the output target and the max number of files -->
						var multi_selector = new MultiSelector( document.getElementById( 'files_list' ), 5 );
						<!-- Pass in the file element -->
						multi_selector.addElement( document.getElementById( 'attachment' ) );
						</script></td>
    </tr>
    <tr>
      <td></td>
    </tr>
  </table>
  <input type="submit" name="submit" class="submit-btn-plain" value="Send" />
</form>
