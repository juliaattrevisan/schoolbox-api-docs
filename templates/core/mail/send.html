<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
$(function() {
    $.fn.alaressTiny({
        mode: 'textareas'
    });

    var options = {
        ajax: {
            url:      '/ajax/user.php',
            type:     'GET',
            data:     {groupID: 0, email: 1},
            dataType: 'json'
        },
        multiple: true,
        selectize: {
            plugins: ['remove_button', 'restore_on_backspace'],
            create: function(input) {
                var freeEntry = {};
                freeEntry[this.settings.valueField]  = input;
                freeEntry[this.settings.searchField] = input;
                return freeEntry;
            }
        }
    }
    $('#to').selectizeSelector($.extend({}, options, {value: {REPLYTO}}))
    $('#cc').selectizeSelector(options)
    $('#bcc').selectizeSelector($.extend({}, options, {value: {BCC}}))

    // dialogs for copying email fields
    $('label[data-role="copy-emails"]').click(function(event) {
        event.preventDefault();
        var element = $(this);
        var target  = $('#'+element.attr('for'));
        // get html-escaped version of text, really annoying
        var text = $('<div />').text(target.val()).html();
        if (text.length > 0) {
            element
                .qtip({
                    content: {
                        title: target.attr('name'),
                        text: text,
                        button: true
                    },
                    position: {
                        my: 'top right',
                        at: 'bottom left'
                    },
                    style: {
                        classes: 'qtip-light qtip-shadow'
                    },
                    show: {
                        event: 'click'
                    },
                    hide: {
                        event: 'unfocus'
                    },
                    events: {
                        hide: function(event, api) {
                            api.destroy();
                        }
                    }
                })
                .qtip('show');
        }
    })

    $('#mailForm').validate({
        ignore: ':hidden:not([class~=selectized]),:hidden > .selectized, .selectize-control .selectize-input input'
    });
});


</script>
<!-- END custom_head -->
<div class="row">
    <div class="small-12 island">
        <h1>Compose Email</h1>
        <form action="send.php" method="post" enctype="multipart/form-data" id="mailForm">
            <section>
                <fieldset class="content">
                    <div class="small-10 large-11 columns">
                        <label>To
                        <input name="to" id="to" required />
                        </label>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label>Copy</label>
                        <label for="to" data-role="copy-emails" class="button icon-modify" title="Show addresses for copy"></label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <div class="small-10 large-11 columns">
                        <label>CC
                            <input name="cc" id="cc" />
                        </label>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label>Copy</label>
                        <label for="cc" data-role="copy-emails" class="button icon-modify" title="Show addresses for copy"></label>
                    </div>
                    <div class="small-10 large-11 columns">
                        <label>
                            BCC
                            <input name="bcc" id="bcc"  />
                        </label>
                    </div>
                    <div class="small-2 large-1 columns">
                        <label>Copy</label>
                        <label for="bcc" data-role="copy-emails" class="button icon-modify" title="Show addresses for copy"></label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Subject
                            <input type="text" name="subject" value="{SUBJECT}" required />
                        </label>
                        <label>
                            <textarea name="message" style="width:100%;height:350px">{BODY}</textarea>
                        </label>
                        <label>
                            Attachments
                            {ATTACH_ZONE}
                        </label>
                    </div>
                </fieldset>
            </section>
            <input type="submit" name="submit" value="Send" />
        </form>
    </div>

</div>
