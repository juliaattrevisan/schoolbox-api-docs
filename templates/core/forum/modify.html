<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
    tinyMCE.init({
        mode:"textareas",
        theme:"advanced",
        skin:"cirkuit",
        plugins:"pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
        content_css:"/css/core/tiny.css",
        theme_advanced_toolbar_location:"top",
        theme_advanced_toolbar_align:"left",
        theme_advanced_statusbar_location:"bottom",
        theme_advanced_buttons1:"bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
        theme_advanced_buttons2:"forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
        theme_advanced_buttons3:"outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
        theme_advanced_buttons4:"tablecontrols",
        pdw_toggle_on:1,
        pdw_toggle_toolbars:'2, 3, 4',
        extended_valid_elements:"a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
        file_browser_callback:'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
        file_browser_category_id : '{CATEGORY_ID}',
        tabfocus_elements:":prev,:next",
        convert_urls:false,
        force_br_newlines:false,
        force_p_newlines:true
    });

    $j(function(){

        $j('#forumForm').submit(function () {

            tinyMCE.triggerSave();

            if ($j('#forumTitle') && $j('#forumTitle').val() == '') {
                alert('You need to enter a title');
                return false;
            }
            else if ($j('#forumBody').val() == '') {
                alert('You need to enter a message');
                return false;
            }

            return true;
        });

        $j('#quote').click(function(){
            if(getSelectedText()) {
                $j('#body').html(getSelectedText());
                var quote = '', byline = '';
                if ($j('#byline').attr('checked') == true)
                    byline = '{QUOTE_USER}';

                quote = '<cite>'+byline+'</cite><blockquote><p>'+getSelectedText()+'</p></blockquote>';
                tinyMCE.execCommand('mceInsertContent',false,quote);
                return false;
            } else
                alert('Please highlight the passage you wish to quote and try again.');
        });

        function getSelectedText(){
            if(window.getSelection){
                return window.getSelection().toString();
            }
            else if(document.getSelection){
                return document.getSelection();
            }
            else if(document.selection){
                return document.selection.createRange().text;
            }
        }

    });
</script>
<!-- END custom_head -->

<div class="breadcrumbs navhelp">
	<p><a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a> > <a href="/forum/{CATEGORY_ID}/">Forum</a> 
		<!-- BEGIN thread_link --> &gt; <a href="/forum/thread/{THREAD_ID}">{THREAD_TITLE}</a> <!-- END thread_link --></p>
</div>
<h1>{ACTION} {THREAD_POST}</h1>
<form id="forumForm"  method="post" enctype="multipart/form-data" action="/forum/modifyForm.php" class="clearfix">
	<input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
	<input type="hidden" name="threadID" value="{THREAD_ID}" />
	<input type="hidden" name="postID" value="{POST_ID}" />
	<table class="standardForm">
		<!-- BEGIN title -->
		<tr>
			<td class="formLabelWidth"><h4>Title</h4>
				<em>The name of this forum thread.</em></td>
			<td><input type="text" name="title" id="forumTitle" size="35" maxlength="100" value="{THREAD_TITLE}" /></td>
		</tr>
		<!-- END title --> 
		<!-- BEGIN quote -->
		<tr>
			<td><h4>Quote</h4>
				<em>{QUOTE_USER}'s post.</em></td>
			<td><div class="cite-it">{QUOTE_BODY}</div>
				<input type="button" id="quote" class="submit-btn-plain" value="Quote" />
				<input type="checkbox" value="1" name="byline" id="byline" />
				With byline</td>
		</tr>
		<!-- END quote -->
		<tr>
			<td><h4>Post</h4>
				<em>This is the main portion of your forum post.</em></td>
			<td><textarea id="forumBody" name="body" style="width:100%;height:350px">{BODY}</textarea></td>
		</tr>
	</table>
	<input class="submit-btn-plain" type="submit" name="submit" value="Post" />
</form>
