<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/editor.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function () {
        document.dispatchEvent(new CustomEvent("EDITOR__CREATE", {
            detail: {
                targetElements: ['#body'],
                fileBrowserCategoryId: '{CATEGORY_ID}',
            }
        }));

        jQuery.validator.addMethod("textMaxLength", function () {
            let bodyData = window.sbProps.editors['body'].getData();
            return bodyData.length < 65535;
        }, jQuery.validator.format("Message is too long."));
        $('form[data-validatable]').alaressValidate({
            ignore: false,
            rules: {
                'body': {
                    'textMaxLength': true
                },
            }

        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <h1>{ACTION} {THREAD_POST}</h1>

        <form method="post" enctype="multipart/form-data" action="/forum/modifyForm.php" class="top" data-validatable>
            <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
            <input type="hidden" name="threadID" value="{THREAD_ID}" />
            <input type="hidden" name="postID" value="{POST_ID}" />
            <input type="hidden" name="quoteID" value="{QUOTE_ID}" />

            <section>
                <fieldset class="content">
                    <!-- BEGIN title -->
                    <div class="small-12 columns">
                        <label for="title" class="required">Title</label>
                        <input type="text" name="title" id="title" maxlength="100" value="{THREAD_TITLE}" required />
                    </div>
                    <!-- END title -->

                    <div class="small-12 columns">
                        <label for="body">Message</label>
                        <textarea id="body" name="body" style="height: 16rem;">
                            <!-- BEGIN quote -->
                            <blockquote class="mceNonEditable">
                                {QUOTE_BODY}
                                <cite data-author="{QUOTE_AUTHOR_ID}">{QUOTE_AUTHOR}</cite>
                            </blockquote>
                            <p></p>
                            <!-- END quote -->
                            {BODY}
                        </textarea>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" name="btnSubmit" value="{ACTION}" />
                </div>
            </div>
        </form>
    </div>
</div>
