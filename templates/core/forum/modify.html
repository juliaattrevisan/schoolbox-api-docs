{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <h1>{ACTION} {THREAD_POST}</h1>

        <form method="post" enctype="multipart/form-data" action="/forum/modifyForm.php" class="top" data-validatable>
            <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
            <input type="hidden" name="threadID" value="{THREAD_ID}" />
            <input type="hidden" name="postID" value="{POST_ID}" />
            <input type="hidden" name="quoteID" value="{QUOTE_ID}" />

            <section>
                <fieldset class="content">
                    <!-- BEGIN title -->
                    <div class="small-12 columns">
                        <label for="forumTitle">
                            Title
                            <input type="text" name="title" id="forumTitle" maxlength="100" value="{THREAD_TITLE}" class="required" />
                        </label>
                    </div>
                    <!-- END title -->

                    <div class="small-12 columns">
                        <label for="forumBody">
                            Message
                            <textarea id="forumBody" name="body">
                                <!-- BEGIN quote -->
                                <blockquote class="mceNonEditable">
                                    {QUOTE_BODY}
                                    <cite data-author="{QUOTE_AUTHOR_ID}">{QUOTE_AUTHOR}</cite>
                                </blockquote>
                                <!-- END quote -->
                                {BODY}
                            </textarea>
                        </label>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" name="submit" value="{ACTION}" />
                </div>
            </div>
        </form>
    </div>
</div>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
    $(function(){
        $.fn.alaressTiny({
            mode: "textareas",
            file_browser_category_id : '{CATEGORY_ID}'
        });

        $('form[data-validatable]').validate({ignore:false});
    });
</script>
