<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
    $j(function(){
		$.fn.alaressTiny({
			mode: "textareas",
			file_browser_category_id : '{CATEGORY_ID}'
		});

        $j('#forumForm').validate({ignore:false});

    });
</script>
<!-- END custom_head -->


<h1>{ACTION} {THREAD_POST}</h1>
<ul class="breadcrumb">
    <li><a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a></li>
    <li><a href="/forum/{CATEGORY_ID}/">Forum</a></li>
    <!-- BEGIN thread_link -->
    <li class="last"><a href="/forum/thread/{THREAD_ID}">{THREAD_TITLE}</a></li>
    <!-- END thread_link -->
</ul>
<form id="forumForm"  method="post" enctype="multipart/form-data" action="/forum/modifyForm.php" class="clearfix">
	<input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
	<input type="hidden" name="threadID" value="{THREAD_ID}" />
	<input type="hidden" name="postID" value="{POST_ID}" />
	<table class="standardForm table">
		<!-- BEGIN title -->
		<tr>
			<td class="formLabelWidth"><h4>Title</h4></td>
			<td><label><input type="text" name="title" id="forumTitle" maxlength="100" value="{THREAD_TITLE}" class="required" /></label></td>
		</tr>
		<!-- END title -->
		<tr>
			<td class="formLabelWidth"><h4>Post</h4></td>
			<td><textarea id="forumBody" name="body" style="width:100%;height:350px">{BODY}</textarea></td>
		</tr>
	</table>
	<input class="submit-btn-plain" type="submit" name="submit" value="Post" />
</form>
