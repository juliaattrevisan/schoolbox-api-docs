<div class="row">
    <ul class="breadcrumb">
        <li><a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a></li>
        <li><a href="/forum/{CATEGORY_ID}/">Forum</a></li>
        <li class="active"><a href="#">{THREAD_TITLE}</a></li>
    </ul>
</div>



<div class="row">
    <div class="small-12 island">
        <span class="header-actions">
            <!-- BEGIN reply -->
            <a class="button icon-reply" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}">Post Reply</a>
            <!-- END reply -->
            <!-- BEGIN modify_thread -->
            <a class="button icon-locked" href="/forum/modifyForm.php?toggleLock={THREAD_ID}">{LOCK_UNLOCK} Thread</a>
            <a class="button icon-delete" href="/forum/modifyForm.php?deleteThread={THREAD_ID}" data-action="delete" data-relation="thread">Delete Thread</a>
            <!-- END modify_thread -->
        </span>

        <h1>{THREAD_TITLE} {LOCKED}</h1>

        <section>
            <ul class="information-list">
                <!-- BEGIN post -->
                <li id="{POST_ID}">
                    <span class="header-actions">
                        <!-- BEGIN reply_post -->
                        <a class="button icon-reply no-text" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/0/{POST_ID}" data-tooltip title="Reply" aria-haspopup="true"></a>
                        <!-- END reply_post -->
                        <!-- BEGIN modify -->
                        <a class="button icon-modify no-text" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/{POST_ID}" title="Modify Post"></a>
                        <a class="button icon-delete no-text" href="/forum/modifyForm.php?deletePost={POST_ID}" data-action="delete" data-relation="post" title="Delete Post"></a>
                        <!-- END modify -->
                    </span>

                    <div class="row">
                        <div class="avatar-card">
                            <a href="/search/user/{POST_USER_ID}" title="View Profile">
                                <img src="/portrait.php?userId={POST_AUTHOR_EXTERNAL_ID}&size=square64"/>
                                <p>{POST_AUTHOR}</p>
                            </a>
                            <p class="meta">Posted {POST_TIME}</p>
                            <!-- BEGIN modified -->
                            <p class="meta">
                                Edited {POST_MODIFIED} {POST_CENSORED}
                            </p>
                            <!-- END modified -->
                        </div>
                    </div>
                    <div class="row">
                        <article class="content">
                            {POST_BODY}
                        </article>
                    </div>
                </li>
                <!-- END post -->
            </ul>
            </section>
        </div>
</div>

<ul class="pagination">
    <!-- BEGIN previous_button -->
    <li><a href="/forum/thread/{THREAD_ID}/{PREVIOUS_PAGE}">&lsaquo;</a></li>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
    <li class="{CURRENT}"><a href="/forum/thread/{THREAD_ID}/{PAGE_INDEX}">{PAGE_INDEX}</a></li>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
    <li><a href="/forum/thread/{THREAD_ID}/{NEXT_PAGE}">&rsaquo;</a></li>
    <!-- END next_button -->
</ul>

<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('a[data-action="delete"][data-relation="post"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({text:'Are you sure you want to delete this post?'});
        });
        $('a[data-action="delete"][data-relation="thread"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({text:'Are you sure you want to delete this thread?'});
        });
    });
</script>
