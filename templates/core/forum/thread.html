<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('a[data-action="delete"][data-relation="post"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({text:'Are you sure you want to delete this post?'});
        });
        $('a[data-action="delete"][data-relation="thread"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({text:'Are you sure you want to delete this thread?'});
        });
    });
</script>
<!-- END custom_head -->
        
{BREADCRUMB}

<div class="actions-small-3 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{THREAD_TITLE} {LOCKED}</h1>
        </div>
    </div>
    <nav>
        <!-- BEGIN reply -->
        <a class="icon-reply" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}" title="Post Reply"></a>
        <!-- END reply -->
        <!-- BEGIN modify_thread -->
        <a class="icon-locked" href="/forum/modifyForm.php?toggleLock={THREAD_ID}" title="{LOCK_UNLOCK} Thread"></a>
        <a class="icon-delete" href="/forum/modifyForm.php?deleteThread={THREAD_ID}" data-action="delete" data-relation="thread" title="Delete Thread"></a>
        <!-- END modify_thread -->
    </nav>
</div>
<div class="row">
    <div class="small-12 island">
        <section>
            <ul class="information-list">
                <!-- BEGIN post -->
                <li class="actions-small-3" id="{POST_ID}">
                    <div class="list-item">
                        <div class="avatar-card small-12">
                            <a href="/search/user/{POST_USER_ID}" title="View Profile">
                                <img src="/portrait.php?userId={POST_AUTHOR_EXTERNAL_ID}&size=square64"/>
                                <p>{POST_AUTHOR}</p>
                            </a>
                            <p class="meta">Posted {POST_TIME}</p>
                            <!-- BEGIN modified -->
                            <p class="meta">
                                Edited {POST_MODIFIED} {POST_CENSORED}
                            </p>
                            <!-- END modified -->
                        </div>
                        <article>
                            {POST_BODY}
                        </article>
                    </div>
                    <nav>
                        <!-- BEGIN reply_post -->
                        <a class="icon-reply no-text" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/0/{POST_ID}"title="Reply" ></a>
                        <!-- END reply_post -->
                        <!-- BEGIN modify -->
                        <a class="icon-modify no-text" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/{POST_ID}" title="Modify Post"></a>
                        <a class="icon-delete no-text" href="/forum/modifyForm.php?deletePost={POST_ID}" data-action="delete" data-relation="post" title="Delete Post"></a>
                        <!-- END modify -->
                    </nav>
                </li>
                <!-- END post -->
            </ul>
        </section>
    </div>
</div>

<ul class="pagination">
    <!-- BEGIN previous_button -->
    <li><a href="/forum/thread/{THREAD_ID}/{PREVIOUS_PAGE}">&lsaquo;</a></li>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
    <li class="{CURRENT}"><a href="/forum/thread/{THREAD_ID}/{PAGE_INDEX}">{PAGE_INDEX}</a></li>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
    <li><a href="/forum/thread/{THREAD_ID}/{NEXT_PAGE}">&rsaquo;</a></li>
    <!-- END next_button -->
</ul>
