<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" href="/css/core/forum.css" />
<script type="text/javascript">
	$j(function(){
	
		$j('#forum-topic tbody tr:even td').css('background-color', '#f4f4f4');
		
		$j('button.reply').click(function () {
			window.open('/forum/modify/{CATEGORY_ID}/{THREAD_ID}', '_self', '');
			return false;
		});
		
		$j('button.lock').click(function () {
			window.open('/forum/modifyForm.php?toggleLock={THREAD_ID}', '_self', '');
			return false;			
		});

		$j('button.delete').click(function () {
			if (confirm('Are you sure you want to delete this thread?'))
				window.open('/forum/modifyForm.php?deleteThread={THREAD_ID}', '_self', '');
			return false;			
		});
		
		$j('a.delete').click(function () {
			if (confirm('Are you sure you want to delete this post?'))
				window.open($(this).attr('href'), '_self', '');
			return false;
		});
		
	});
</script>
<!-- END custom_head -->
<div class="breadcrumbs navhelp">
	<a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a> > <a href="/forum/{CATEGORY_ID}/">Forum</a> > {THREAD_TITLE} {LOCKED}
</div>
<!-- BEGIN reply -->
<button class="reply">Post Reply</button> 
<!-- END reply -->
<!-- BEGIN modify_thread -->
<button class="lock">{LOCK_UNLOCK} Thread</button> <button class="delete">Delete Thread</button>
<!-- END modify_thread -->
<table id="forum-post">
  <tbody>
  	<!-- BEGIN post -->
  	<tr>
    	<td class="user" width="20%">
        <a name="{POST_ID}"></a>
      	<h3><a href="/search/user/{POST_USER_ID}">{POST_AUTHOR}</a></h3>
        {POST_GROUP}
      </td>
      <td rowspan="2" class="post" width="80%">
        {POST_BODY}
      </td>
    </tr>
    <tr>
    	<td class="reply">
        <!-- BEGIN reply_post -->
      	<a href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/0/{POST_ID}">Reply to this post</a><br /><!-- END reply_post -->
        <!-- BEGIN modify -->
        <a href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/{POST_ID}">Edit post</a> |
        <a href="/forum/modifyForm.php?deletePost={POST_ID}" class="delete">Delete post</a><br /> <!-- END modify -->
        Posted {POST_TIME}
        <!-- BEGIN modified --><br /> edited {POST_MODIFIED} {POST_CENSORED}<!-- END modified -->
      </td>
    </tr>
    <!-- END post -->
    
   
  </tbody>
</table>
<a name="bottom"></a>

{reply_block}
{modify_thread_block}


<div class="pagination navhelp">
	<!-- BEGIN previous_button -->
    <a href="/forum/thread/{THREAD_ID}/{PREVIOUS_PAGE}">&lt; Prev</a>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
    <a class="{CURRENT}" href="/forum/thread/{THREAD_ID}/{PAGE_INDEX}">{PAGE_INDEX}</a>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
    <a href="/forum/thread/{THREAD_ID}/{NEXT_PAGE}">Next &gt;</a>
	<!-- END next_button -->
</div>
