<!-- BEGIN custom_head -->
<script type="text/javascript">
    $j(function () {

        $j('#forum-topic tbody tr:even td').css('background-color', '#f4f4f4');

        $j('a.delete.float-left').click(function () {
            if (confirm('Are you sure you want to delete this thread?'))
                window.open($j(this).attr('href'), '_self', '');
            return false;
        });

        $j('a.delete.no-text').click(function () {
            if (confirm('Are you sure you want to delete this post?'))
                window.open($j(this).attr('href'), '_self', '');
            return false;
        });

        if ($j('.post').length !== 1) {
            $j('.post:last').css("border", "0")
        }

    });
</script>
<!-- END custom_head -->
<div class="breadcrumbs navhelp">
    <p><a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a> > <a href="/forum/{CATEGORY_ID}/">Forum</a> > {THREAD_TITLE}
        {LOCKED}
        <a href="/homepage/{CATEGORY_ID}" class="btn go-back"><span></span>Return to homepage</a></p>
</div>
<p class="clearfix">

    <!-- BEGIN reply -->
    <a class="btn reply float-left" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}"><span></span>Post Reply</a>
    <!-- END reply -->
    <!-- BEGIN modify_thread -->

    <a href="/forum/modifyForm.php?toggleLock={THREAD_ID}" class="btn weather float-left"><span></span>{LOCK_UNLOCK}
        Thread</a>
    <a href="/forum/modifyForm.php?deleteThread={THREAD_ID}" class="btn delete float-left"><span></span>Delete
        Thread</a>
    <!-- END modify_thread -->


</p>
<div class="forum listing">
    <ul class="comments">
        <!-- BEGIN post -->
        <li id="{POST_ID}" class="{ON_OFF}">
            <!-- BEGIN modify -->
            <a class="btn delete no-text" title="Delete post" href="/forum/modifyForm.php?deletePost={POST_ID}" class="delete"><span></span></a>
            <a class="btn modify no-text" title="Edit post" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/{POST_ID}"><span></span></a>
            <!-- END modify -->
            <a href="/search/user/{POST_USER_ID}" class="author">
                <img width="32" height="32" src="/portrait.php?userId={POST_AUTHOR_EXTERNAL_ID}&size=square32"/>
                <span class="name">{POST_AUTHOR}</span>
            </a>
            <span class="subtitle">Posted {POST_TIME}</span>

            <div class="post-content wysiwyg">
                {POST_BODY}
            </div>
            <p>
                <!-- BEGIN reply_post -->
                <a class=" btn reply" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/0/{POST_ID}"><span></span>Reply</a>
                <!-- END reply_post -->

                <!-- BEGIN modified -->
                <br/> edited {POST_MODIFIED} {POST_CENSORED}
                <!-- END modified -->
            </p>
        </li>
        <!-- END post -->
    </ul>
</div>
<p class="clearfix"><a name="bottom"></a>
    <!-- BEGIN reply -->
    <a class="btn reply float-left" href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}"><span></span>Post Reply</a>
    <!-- END reply -->
    <!-- BEGIN modify_thread -->
    <button class="lock submit-btn-plain">{LOCK_UNLOCK} Thread</button>
    <button class="delete submit-btn-plain">Delete Thread</button>
    <!-- END modify_thread -->
</p>

<ul class="admin-nav foot">
    <!-- BEGIN previous_button -->
	<li><a href="/forum/thread/{THREAD_ID}/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
	<li><a class="{CURRENT}" href="/forum/thread/{THREAD_ID}/{PAGE_INDEX}">{PAGE_INDEX}</a></li>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
	<li><a href="/forum/thread/{THREAD_ID}/{NEXT_PAGE}">Next &rsaquo;</a></li>
    <!-- END next_button -->
</ul>
