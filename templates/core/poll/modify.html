<!-- BEGIN custom_head -->
<script type="text/javascript">
$(function() {
	$('#cal_date').datepicker({
		buttonImageOnly: true,
		constrainInput: false,
		onClose: function (string) {
			var input = $(this);
	
			$.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
				input.val(data.time);
			})
		}
	});
	
	$('#modPoll').validate();
});
</script>
<!-- END custom_head -->

{BREADCRUMB}
        
<div class="row">
    <div class="small-12 columns">
        <h1>{ACTION} Poll</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/poll/modifyForm.php" method="post" class="top" id="modPoll">
            <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
            <input type="hidden" name="pollID" value="{POLL_ID}" />
            <input type="hidden" name="homepageComponentID" value="{COMPONENT_HOMEPAGE_ID}" />

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Question
                            <span class="hint has-tip tip-top" data-tooltip title="What the poll is for.">?</span>

                            <input class="required" type="text" name="question" value="{POLL_QUESTION}" size="50" />
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>
                        Options
                        <span class="hint has-tip tip-top" data-tooltip title="You can have a maximum of ten options to vote on. You must fill in at least two.">?</span>
                    </legend>
                    <div class="small-12 columns">
                        <label><input type="text" class="required" name="option_0" value="{OPTION_0}"/></label>
                        <label><input type="text" class="required" name="option_1" value="{OPTION_1}"/></label>
                        <label><input type="text" name="option_2" value="{OPTION_2}"/></label>
                        <label><input type="text" name="option_3" value="{OPTION_3}"/></label>
                        <label><input type="text" name="option_4" value="{OPTION_4}"/></label>
                        <label><input type="text" name="option_5" value="{OPTION_5}"/></label>
                        <label><input type="text" name="option_6" value="{OPTION_6}"/></label>
                        <label><input type="text" name="option_7" value="{OPTION_7}"/></label>
                        <label><input type="text" name="option_8" value="{OPTION_8}"/></label>
                        <label><input type="text" name="option_9" value="{OPTION_9}"/></label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <div class="small-12 large-6 columns">
                        <label>
                            Close Date
                            <span class="hint has-tip tip-top" data-tooltip title="No votes can be cast after this date.">?</span>
                            <input name="close" id="cal_date" type="text" size="15" maxlength="30" value="{CLOSE}"/>
                        </label>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label>
                            Voting Frequency
                            <span class="hint has-tip tip-top" data-tooltip title="Selected how often users can place a new vote.">?</span>

                            <select name="frequency">
                                <option value="once" {FREQUENCY_ONCE_SELECTED}>Once</option>
                                <option value="hourly" {FREQUENCY_HOURLY_SELECTED}>Hourly</option>
                                <option value="daily" {FREQUENCY_DAILY_SELECTED}>Daily</option>
                            </select>
                        </label>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Save" />
                </div>
            </div>
        </form>
    </div>
</div>
