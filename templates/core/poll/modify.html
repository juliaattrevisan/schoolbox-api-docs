<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<script type="text/javascript">

$j(function() {
	$j('#cal_date').datepicker({ 
		dateFormat: 'dd/mm/yy',
		showOn: 'both',
		buttonImage: '/images/core/calendar/calendar-click.png',
		buttonImageOnly: true,
		constrainInput: false,
		onClose: function (string) {
			var input = $j(this);
	
			$j.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
				input.val(data.time);
			})
		}
	});
	
	$j('#modPoll').validate();
	
});
</script>
<!-- END custom_head -->

<h1>{ACTION} Poll</h1>
<form class="standardForm" id="modPoll" action="/poll/modifyForm.php" method="post">
	<table>
		<tr>
			<td class="formLabelWidth">
				<h4>Title</h4>
			</td>
			<td>
				<label><input class="required" type="text" name="title" value="{POLL_TITLE}" size="50" /></label>
			</td>
		</tr>
		<tr>
			<td>
				<h4>Question</h4>
				<em>What is the poll for</em>
			</td>
			<td>
				<label><input class="required" type="text" name="question" value="{QUESTION}" size="50" /></label>
			</td>
		</tr>
		<tr>
			<td>
				<h4>Options</h4>
				<em>You can have a maximum of
				ten options<br />
				to vote on. You must fill in at least two.</em>
			</td>
			<td>
				<label><input type="text" class="required" name="option_0" value="{OPTION_0}" /></label>

				<label><input type="text" class="required" name="option_1" value="{OPTION_1}" /></label>

				<label><input type="text" name="option_2" value="{OPTION_2}" /></label>

				<label><input type="text" name="option_3" value="{OPTION_3}" /></label>

				<label><input type="text" name="option_4" value="{OPTION_4}" /></label>

				<label><input type="text" name="option_5" value="{OPTION_5}" /></label>

				<label><input type="text" name="option_6" value="{OPTION_6}" /></label>

				<label><input type="text" name="option_7" value="{OPTION_7}" /></label>
				<label><input type="text" name="option_8" value="{OPTION_8}" /></label>
				<label><input type="text" name="option_9" value="{OPTION_9}" /></label>
			</td>
		</tr>
		<tr>
			<td>
				<h4>Close Date</h4>
				<em>No votes can be cast after this date.</em>
			</td>
			<td>
				<input name="close" id="cal_date" type="text" size="15" maxlength="30" value="{CLOSE}"/>
			</td>
		</tr>
		<tr>
			<td>
				<h4>Voting Frequency</h4>
				<em>Selected how often users can place a new vote.</em>
			</td>
			<td>
				<select name="frequency">
					<option value="once" {FREQUENCY_ONCE_SELECTED}>Once</option>
					<option value="hourly" {FREQUENCY_HOURLY_SELECTED}>Hourly</option>
					<option value="daily" {FREQUENCY_DAILY_SELECTED}>Daily</option>
				</select>

				<input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
				<input type="hidden" name="pollID" value="{POLL_ID}" />
				<input type="hidden" name="homepageComponentID" value="{COMPONENT_HOMEPAGE_ID}" />
			</td>
		</tr>
	</table>
	<input type="submit" class="submit-btn-plain" value="Save" />
</form>
