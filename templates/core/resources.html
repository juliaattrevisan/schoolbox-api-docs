<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/css/jquery.contextmenu.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/tree.css" />
<script type="text/javascript">
	var date1 = new Date;
</script>
<script type="text/javascript" src="/min/index.php?f=javascript/jquery.ui.js,javascript/jquery.simplemodal.js,javascript/jquery.contextmenu.js,javascript/jquery.tree.js,javascript/jquery.scrollTo.js"></script>
<script type="text/javascript">
$j(function() {
	
	// define file context menu 
	var fileMenu = [
		{"Open": {
			onclick: function () { 
				if ($j(this).hasClass("link"))
					window.open("/redir.php?id="+$j(this).attr("id").substring(5),"_blank"); 
				else
					window.open("/send.php?id="+$j(this).attr("id").substring(5),"_blank"); 
			},
			icon: '/images/famicons/page_go.png'
		}},
		{"Save As": {
			onclick: function () { window.open("/send.php?save=1&id="+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/disk.png'
		}},
		$j.contextMenu.separator,
		{"Modify": {
			onclick: function () {
				if ($j(this).hasClass("link"))
					window.open("/cms/link/"+$j(this).attr("id").substring(5),"_self"); 
				else
					window.open("/cms/file/"+$j(this).attr("id").substring(5),"_self"); 
			},
			icon: '/images/famicons/page_edit.png'
		}},
		{"Delete": {
			onclick: function () {
				
				
				var selected = $j('#file-list tr.selected'), fileList, linkList;
				if (selected.length > 1) {
					
					var fileList = '', linkList = '';
					selected.each(function () {
						if ($j(this).hasClass('link'))
							linkList += $j(this).attr("id").substring(5) + ',';
						else
							fileList += $j(this).attr("id").substring(5) + ',';
					});
					
					if (confirm("Are you sure you want to delete this selection?")) 
						window.open("/cms/fileForm.php?fileList="+fileList+"&linkList="+linkList+"&deleteList=1","_self");
						
				} else {
					var _name = $j(this).find(".file").text();
					
					if ($j(this).hasClass("link")) {
						if (confirm("Are you sure you want to delete "+_name+"?")) 
							window.open("/cms/linkForm.php?delete="+$j(this).attr("id").substring(5),"_self");
					} else {
						if (confirm("Are you sure you want to delete "+_name+"?")) 
							window.open("/cms/fileForm.php?delete="+$j(this).attr("id").substring(5),"_self");
					}
				}
			},
			icon: '/images/famicons/page_delete.png'
			
		}},
		$j.contextMenu.separator,
		{"Add File": {
			onclick: function () { 
				var categoryID = $j(this)[0].className.match(/category-([\d]+)/)[1].toString();
				window.open("/cms/file/new/"+categoryID,"_self"); 
			},
			icon: '/images/famicons/page_add.png'
		}},
		{"Add Multiple Files": function () { window.open("/cms/file/multi/"+$j(this).data("category"),"_self"); }},
		{"Add Link": {
			onclick: function () { 
				var categoryID = $j(this)[0].className.match(/category-([\d]+)/)[1].toString();
				window.open("/cms/link/new/"+categoryID,"_self"); 
			},
			icon: '/images/famicons/link_add.png'
		}},
		{"Add Folder": {
			onclick: function () { window.open("/cms/category/new/"+$j(this).data("category"),"_self"); },
			icon: '/images/famicons/folder_add.png'
		}},
		$j.contextMenu.separator,
		{"Properties": function () { 
			var ajaxURL;
			if ($j(this).hasClass("link"))
				ajaxURL = "/cms/properties.php?linkID="+$j(this).attr("id").substring(5);
			else
				ajaxURL = "/cms/properties.php?fileID="+$j(this).attr("id").substring(5);
			
			$j.get(ajaxURL, function (data) {
				
				$j(data).modal({
					position: ["15%"],
					overlayId: 'properties-overlay',
					containerId: 'properties-container',
					containerCss: {height: 'auto'},
					onOpen: function (dialog) { 
						dialog.overlay.fadeIn(200, function () { 
							dialog.container.fadeIn(200, function () {
								dialog.data.show();
							}); 
						}); 
					},
					onClose: function (dialog) { 
						dialog.container.fadeOut(200, function () { 
							dialog.overlay.fadeOut(200, function () { 
									$j.modal.close(); 
							});  
						}); 
					}					
				});
			});
		}}
	];
	
	// define folder context menu
	var folderMenu = [
		{"View Homepage": {
			onclick: function () { window.open("/homepage/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/house.png'
		}},
		{"Image Gallery": {
			onclick: function () { window.open("/cms/imageGallery/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/images.png'
		}},
		$j.contextMenu.separator,
		{"Modify": { 
			onclick: function () { window.open("/cms/category/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/folder_edit.png'
		}},
		{"Delete": {
			onclick: function () { 
				var _name = $j(this).find(".folder").text();
				if (confirm("Are you sure you want to delete "+_name+"?")) window.open("/cms/categoryForm.php?delete="+$j(this).attr("id").substring(5),"_self"); 
			},
			icon: '/images/famicons/folder_delete.png'
		}},
		<!-- BEGIN delete_all -->
		{"Delete All": {
			onclick: function () { 
				var _name = $j(this).find(".folder").text();
				if (confirm("Are you sure you want to delete "+_name+" and all its contents?")) window.open("/cms/categoryForm.php?deleteAll="+$j(this).attr("id").substring(5),"_self"); 
			}
		}},
		<!-- END delete_all -->
		$j.contextMenu.separator,
		{"Add File": {
			onclick: function () { window.open("/cms/file/new/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/page_add.png'
		}},
		{"Add Multiple Files": function () { window.open("/cms/file/multi/"+$j(this).attr("id").substring(5),"_self"); }},
		{"Add Link": {
			onclick: function () { window.open("/cms/link/new/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/link_add.png'
		}},
		{"Add Folder": {
			onclick: function () { window.open("/cms/category/new/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/folder_add.png'
		}},
		<!-- BEGIN zip_file_upload -->
		{'Upload zip file': {
			onclick: function() {
				window.open('/cms/zipFile/'+$j(this).attr("id").substring(5), '_self');
			},
			icon: '/images/famicons/page_white_compressed.png'
		}},
		<!-- END zip_file_upload -->
		$j.contextMenu.separator,
		{"Download": {
			onclick: function () { window.open("/cms/fetchFolder.php?folder="+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/page_white_compressed.png'
		}},
	];
	
	/* left tree navigation */
	$j('#tree').tree({
		type	 : 'table',
		node 	 : 'tr',
		onOff	 : 'dark',
		sequencing	: false
	});

	/* load right panel file list */
	$j('#tree tr:not(.server)').live('click', function () {
		
		/* select folder */
		$j('#tree .selected').removeClass('selected');
		$j(this).addClass('selected');
		
		/* hide all files */
		$j('#file-list tbody tr').hide();
		
		var relationID = $j(this).attr('id').substring(5);
		var files = $j('tr.category-' + relationID);
		
		if (files.length > 0) {
			/* files exist, show them */
			files.show();
			
			/* re-apply on off */
			$j('#file-list tbody tr').removeClass('dark');
			$j('#file-list tbody tr:visible:odd:not(.empty)').addClass('dark');
			
			/* remember tree branch */
			$j.post('/ajax/tree.php', {resourcesID : relationID});
				
		} else {
		
			/* ajax load files */
			$j.post('/ajax/file.php', {categoryID : relationID}, function (data) {
				
				if (data.error) {
					alert(data.error);
				} else if (data.length == 0) {
					/* display empty message */
					$j('<tr class="category-' + relationID + ' empty"><td>No files to display</td></tr>').appendTo($j('#file-list'));
					
				} else {
					var template = $j('#file-template');
					for (i in data) {
						var row = data[i];
						
						/* build new file (row) */
						var clone = template.clone();
						clone.attr('id', 'file-' + row.id);
						clone.find('span.file').text(row.description);
						clone.find('td:eq(1)').text(row.user);
						clone.find('td:eq(2)').text(row.relative);
						clone.addClass('category-' + relationID);
						clone.addClass(row.mimeClass);
						
						if (row.url)
							clone.addClass('link');
						
						if (row.hidden == 1)
							clone.addClass('hidden');
						
						clone.appendTo($j('#file-list')).show();
					}			
				}
				
				/* re-apply on off */
				$j('#file-list tbody tr').removeClass('dark');
				$j('#file-list tbody tr:visible:odd:not(.empty)').addClass('dark');
				
				
				initialiseFiles(relationID);
				
			}, 'json');
		}
	
	});
	
	var initialiseFiles = function (relationID) {
		
		var newChildren = $j('tr.category-' + relationID + ':not(.empty)'), categoryNode = $j('#node-' + relationID);
		
		/* apply file context menus */
		newChildren.contextMenu(fileMenu, {
			theme: 'vista',
			beforeShow: function (event) {
				
				/* un-select selection if clicked outside */
				if (!$j(this.target).hasClass('selected'))
					$j(this.target).triggerHandler('click', event);
				
				var categoryID = $j(this.target)[0].className.match(/category-([\d]+)/), folder = $j('#node-' + categoryID[1].toString())
				
				/* enable all options */
				$j(this.menu).find('.context-menu-item').removeClass('context-menu-item-disabled');
				
				if ($j(this.target).hasClass("link"))
					$j($j(this.menu).find('.context-menu-item')[1]).toggleClass("context-menu-item-disabled", true); 
	
				if (!folder.hasClass("write") && !folder.hasClass("full")) {
					// disable from modify to new folder
					for (var i = 2; i <= 7; i++)
						$j($j(this.menu).find('.context-menu-item')[i]).toggleClass("context-menu-item-disabled", true); 
				} 
				else if ($j('#file-list tr.selected').length > 1) {
					$j(this.menu).find('.context-menu-item').addClass('context-menu-item-disabled');
					$j(this.menu).find('.context-menu-item:eq(3)').removeClass('context-menu-item-disabled');
				}
				
			}
		});
		
		/* double click files, default action */
		newChildren.dblclick(function () {
			if ($j(this).hasClass("link"))
				window.open("/redir.php?id="+$j(this).attr("id").substring(5),"_blank"); 
			else
				window.open("/send.php?id="+$j(this).attr("id").substring(5),"_blank"); 
		});	
		
		/* select files */
		newChildren.click(function (event) {
		
			/* allow multiple select */
			if (!event.ctrlKey && !event.shiftKey)
				$j('#file-list tr.selected').removeClass('selected');
			
			if (event.ctrlKey)
				$j(this).toggleClass('selected');
			else
				$j(this).addClass('selected');
			
			/* select range */
			if (event.shiftKey) {
				
				var node1 = $j('#file-list tr').index($j('#file-list tr.current'));
				var node2 = $j('#file-list tr').index(this);
				
				if (node1 > node2)
					$j('#file-list tr').slice(node2, node1).addClass('selected');
				else
					$j('#file-list tr').slice(node1, node2).addClass('selected');
			}
			
			$j('#file-list tr.current').removeClass('current');
			$j(this).addClass('current');
			
		});
		
		/* drag files */
		if (categoryNode.hasClass('full') || categoryNode.hasClass('write')) {
			
			newChildren.find('span.file').draggable({
				cursor: 'move',
				cursorAt: {top: 5, left: 5},
				helper: function (event) {
					return $j(event.currentTarget).clone().addClass('accept').css('z-index', 100);
				},
				opacity: 1,
				revert: "invalid",
				revertDuration: 300,
				scroll: true
				
			});	
		}
	};
	
	
	/* get resourcesID */
	var resourcesID = 0, selected = $j('#tree tbody tr.selected');
	if (selected.length > 0)
		resourcesID = selected.attr('id').substring(5);
		
	initialiseFiles(resourcesID);
	
	/* triggered after a new branch is loaded */
	$j('#tree').bind('loaded', function () {
		var table = $j(this), scroller = $j('#category-window div.scroller');
		
		/* fix left panel width */
		var scrollerWidth = parseInt(scroller.width()) - 1;
		if (table.height() > scroller.height())
			scrollerWidth -= 16; // scroller width
		
		if (table.width() < scrollerWidth)
			table.width(scrollerWidth);
		else {
			var maxWidth = 0, width;
			table.find('tr').each(function () {
				width = 0;
				$j(this).find('span').each(function () {
					width += $j(this).width();
				});
				width += 39 ; // cell padding, highlight border
				if (width > maxWidth)
					maxWidth = width;
			});
			if (maxWidth > scrollerWidth)
				table.width(maxWidth);
		}
		
		/* apply folder context menus */
		var newRows = table.find('tbody tr:not(.context)').addClass('context');
		newRows.contextMenu(folderMenu, {
			theme: 'vista',
			beforeShow: function () {
				
				/* enable all options */
				$j(this.menu).find('.context-menu-item').removeClass('context-menu-item-disabled');
				
				/* homepage */
				if ($j(this.target).hasClass("homepage") == 0)
					$j($j(this.menu).find('.context-menu-item')[0]).toggleClass("context-menu-item-disabled", true); 
	
				if ($j(this.target).hasClass("write") == 0 && $j(this.target).hasClass("full") == 0) {
					// disable from modify onwards
					for (var i = 2; i <= 9; i++)
						$j($j(this.menu).find('.context-menu-item')[i]).toggleClass("context-menu-item-disabled", true); 
				} 
				
				if ($j(this.target).hasClass('server')) {
					// disable from modify / delete
					for (var i = 0; i <= 7; i++)
						$j($j(this.menu).find('.context-menu-item')[i]).toggleClass("context-menu-item-disabled", true); 
					
					$j(this.menu).find('.context-menu-item:eq(9)').addClass("context-menu-item-disabled"); 
				}
				
			}
		});
		
	});
	
	$j('#tree').triggerHandler('loaded');
	
	/* resize left column on window resize */
	$j(window).resize(function () {
		$j('#tree').triggerHandler('loaded');
	});

	$j("div.loading").hide();
	
	/* auto scroll to open branch */
	$j("#category-window div.scroller").scrollTo($j("#node-{OPEN}"), 200);
	
	var date2 = new Date;
	
	if (window.location.href.indexOf('debug') != -1)
		alert((date2.getTime() - date1.getTime()) / 1000);
	
});
</script>

<!-- END custom_head -->
<div class="template2">
  <div class="left">
    <div id="category-window">
    <div class="loading"></div>
      <table id="category-head">
      	<thead>
        	<th>Folders</th>
        </thead>
      </table>
      <div class="scroller">
      <table id="tree">
        <tbody>
          <tr id="node-0" class="server expanded loaded {FULL} {WRITE}">
            <td><span class="server label">Resources</span></td>
          </tr>
          <!-- BEGIN category_list -->
          <tr id="node-{CATEGORY_ID}" class="{CLASS}">
            <td><span class="elbow"></span><span class="label">{CATEGORY_NAME}</span></td>
          </tr>
          <!-- END category_list -->
        </tbody>
        <tfoot>
          <tr id="node-template">
            <td><span class="elbow"></span><span class="label"></span></td>
          </tr>         
        </tfoot>
      </table>
      </div>
    </div>
  </div>
  
  <div class="right">
    <div id="file-window">
      <div class="loading"></div>
      <table id="file-head">
        <col width="55%" />
        <col width="23%" />
        <col width="22%" />   
      	<thead>
          <th>Name</th>
          <th>Submitted By</th>
          <th>Modified</th>
        </thead>
      </table>
      <div class="scroller">
      <table id="file-list">  
      	<col width="55%" />
        <col width="23%" />
        <col width="22%" /> 
     
        <tbody>     
          <!-- BEGIN file_list -->
          <tr id="{TYPE}-{FILE_ID}" class="category-{CATEGORY_ID} {CLASS}">
            <td><span class="file">{FILE_NAME}</span></td>
            <td>{FILE_OWNER}</td>
            <td>{FILE_MODIFIED}</td>
          </tr>
          <!-- END file_list -->
         </tbody>
         <tfoot>
          <tr id="file-template">
            <td><span class="file"></span></td>
            <td></td>
            <td></td>
          </tr>         
         </tfoot>
      </table>
      </div>
    </div>
  </div>

</div>
