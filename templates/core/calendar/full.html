<script type="text/javascript">

    // provide page-wide access to the calendar object so the callbacks can actually use it
    var c;

    /**
     * Update event method:
     *
     * * Gives event a "loading" style
     * * Removes that style when update finishes
     *
     * @param event      The event to update
     * @param data       The data to send to the update script
     * @param revertFunc called if update failed for whatever reason.
     *                   Sets event back to original state.
     */
    var updateWrapper = function(event, data, revertFunc) {
        // Srsly?
        var oldClassNames = Array.from(event.classNames),
            newClassNames = Array.from(event.classNames);
        newClassNames.push('loading');
        event.setProp('classNames', newClassNames);
        c.cupdate(data, function (returnData) {
            event.setProp('classNames', oldClassNames);
            if (!returnData) {
                revertFunc();
            }
        });
    };


    // Which view gets shown?
    var anchorView = '',
        parts      = location.href.split('#');

    if (parts.length > 1) {
        anchorView = parts[1];
        switch (anchorView) {
            case 'month':
                anchorView = 'dayGridMonth';
                break;
            case 'week':
            case 'agendaWeek':
            case 'basicWeek':
                anchorView = 'timeGridWeek';
                break;
            case 'day':
            case 'agendaDay':
            case 'basicDay':
                anchorView = 'timeGridDay';
                break;
            default:
                anchorView = '';
                break;
        }
    }

        userId:             Number('{CALENDAR_USER_ID}'),
        token:              '{USER_TOKEN}',
        taskTypeId:         Number('{TASK_TYPE_ID}'),

        eventTypes:         {EVENT_TYPES_JSON},
        groups:             {GROUPS_JSON},
        campuses:           {CAMPUSES_JSON},
        selectedFilters:    {SELECTED_FILTERS_JSON},
        defaultDate:        '{SELECTED_DATE}',
        eventLimit:         Boolean('{CALENDAR_COLLAPSE_EVENTS}'),
        firstDay:           Number('{CALENDAR_START_DAY}'),

        // TODO This must be moved to Twig so these can be guaranteed to be escaped
        translations:       {
            eotc: {

                /**
                 * When an event is drawn on the calendar
                 * @param info
                 */
                eventRender: function (info) {
                    var calEvent = info.event,
                        $element = $(info.el);

                    // Always render placeholders in the most basic manner
                    if (calEvent.id === 'placeholder') {
                        return true;
                    }

                    // Ignore the phantom event that the API puts there
                    if (!calEvent.extendedProps.data) {
                        return false;
                    }

                    // Don't render me if I'm marked as do not render
                    if ('is_rendered' in calEvent && !(calEvent.is_rendered)) {
                        return false;
                    }

                    var inner = $element.find('.fc-content');
                    var title = $element.find('.fc-title');

                    // We no longer escape title
                    title.text(calEvent.title);

                    // If appropriate, indicate this event can be attended
                    var span = '<span class="att">(A)</span>';

                    if (Boolean(calEvent.extendedProps.data.attendance.icon)) {
                        if ((content = $element.find('.fc-event-content')).length === 1) {
                            content.append(span)
                        } else {
                            inner.append(span)
                        }
                    }

                    // If this event is a task, alter the state of the checkbox accordingly
                    if (Number(calEvent.extendedProps.data.meta.eventTypeId) === taskTypeId) {
                        inner.prepend(
                            $('<input type="checkbox" name="completed" class="plain" />')
                                .attr('id', 't' + calEvent.extendedProps.data.meta.eventId)
                        );
                        if (Boolean(calEvent.extendedProps.data.meta.completed)) {
                            title.addClass('strike');
                            inner.find(':checkbox').prop('checked', true)
                        }
                    }

                    $element.addClass(calEvent.extendedProps.data.styles.visible);
                },

                /**
                 * When you finish resizing an event, update it
                 * Note the difference between eventResize() and eventResizeStop()
                 * @param eventResizeInfo
                 */
                eventResize: function (eventResizeInfo) {
                    var event = eventResizeInfo.event,
                        start = FullCalendarMoment.toMoment(event.start, this),
                        end = FullCalendarMoment.toMoment(event.end, this),
                        data = {
                            eventId: event.extendedProps.data.meta.eventId,
                            resize: true,
                            start: start.format(),
                            end: end.format()
                        };
                    updateWrapper(event, data, eventResizeInfo.revert);
                },

                /**
                 * When you finish dragging an event to its new home
                 * @param eventDropInfo
                 */
                eventDrop: function (eventDropInfo) {
                    var event = eventDropInfo.event,
                        delta = FullCalendarMoment.toDuration(eventDropInfo.delta),
                        data = {
                            eventId: event.extendedProps.data.meta.eventId,
                            minuteDelta: delta.asMinutes(),
                            allDay: event.allDay
                        };
                    updateWrapper(event, data, eventDropInfo.revert);
                },

                /**
                 * When you click on a day to add a new event
                 * @param dateClickInfo
                 */
                dateClick: function (dateClickInfo) {
                    bubbleFactory
                        .buildForNewEvent(dateClickInfo.date, dateClickInfo.allDay)
                        .display();
                },


                /**
                 * Generic action for when an event is clicked
                 * @param eventInfo
                 */
                eventClick: function(eventInfo) {

                    var calEvent = eventInfo.event,
                        jsEvent  = eventInfo.jsEvent;

                    // Did this event come from a checkbox?
                    // If so do nothing, those events are handled elsewhere.
                    if ($(jsEvent.target).is(':checkbox')) {
                        return;
                    }

                    bubbleFactory
                        .build(calEvent)
                        .display();
                },

                /**
                 * When external data is being fetched
                 * @param isLoading
                 * @param view
                 */
                loading: function (isLoading, view) {
                    /* Show loading div right in the middle
                     */
                    if (isLoading === true) {
                        $.magnificPopup.open({
                            showCloseBtn: false,
                            items: {
                                src: "<div class='preview loader'></div>",
                                type: 'inline'
                            }
                        });
                    }
                    /* Has finished loading
                     */
                    else {
                        /* Hide loading div
                         */
                        $.magnificPopup.close();

                        // update any tasks that have been completed by strikethrough-ing them
                        $(this).find('input[type=checkbox]').each(function () {
                            var self = $(this);

                            if (self.prop('checked')) {
                                self.siblings('.fc-title').addClass('strike')
                            }
                        });

                        // // reapply filters
                        // c.filters.organise(c, ["campus", "groups", "sources"], false);

                        // update datepicker
                        $('#datepicker').datepicker('setDate', FullCalendarMoment.toMoment(this.getDate(), this).format('DD-MM-YYYY'))
                    }
                },

                //  * @param info
                //  */

                            //  */
                            // // TODO restore this
                            // $.post('/calendar/changeState', {calendarView: fc.view.type});
                        },
                        cache: false
                    });
                }
