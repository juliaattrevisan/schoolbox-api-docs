<!-- BEGIN custom_head -->
<script type="text/javascript">
    // Which view gets shown?
    var anchorView = '',
        parts      = location.href.split('#');

    if (parts.length > 1) {
        anchorView = parts[1];
        switch (anchorView) {
            case 'month':
                anchorView = 'dayGridMonth';
                break;
            case 'week':
            case 'agendaWeek':
            case 'basicWeek':
                anchorView = 'timeGridWeek';
                break;
            case 'day':
            case 'agendaDay':
            case 'basicDay':
                anchorView = 'timeGridDay';
                break;
            default:
                anchorView = '';
                break;
        }
    }

    window.fullCalendarConfig = {
        userId:             Number('{CALENDAR_USER_ID}'),
        token:              '{USER_TOKEN}',
        taskTypeId:         Number('{TASK_TYPE_ID}'),
        sources:            {SOURCES_JSON},
        eventTypes:         {EVENT_TYPES_JSON},
        groups:             {GROUPS_JSON},
        campuses:           {CAMPUSES_JSON},
        selectedFilters:    {SELECTED_FILTERS_JSON},
        defaultDate:        '{SELECTED_DATE}',
        eventLimit:         Boolean('{CALENDAR_COLLAPSE_EVENTS}'),
        firstDay:           Number('{CALENDAR_START_DAY}'),
        defaultView:        anchorView || '{CALENDAR_VIEW}',
        dateDisplayFormats: dateDisplayFormats,
        // TODO This must be moved to Twig so these can be guaranteed to be escaped
        translations:       {
            eotc: {
                proper: '{TPL_LOCAL_EOTC_PC}'
            },
            dueWork: {
                proper: '{TPL_LOCAL_DUEWORK_PC}'
            }
        }
    };
</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 columns">
        <h1>{TPL_LOCAL_CALENDAR_PC} for {USER_FULLNAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <section>
            <div id="calendar"></div>
            <script type="text/javascript" src="/javascript/components/fullCalendar.bundle.js?v={SITE_VERSION}"></script>
        </section>
    </div>
</div>
