<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" href="/css/core/fullcalendar/fullcalendar.css" />
<link rel="stylesheet" type="text/css" href="/css/core/fullcalendar/fullcalendar.print.css" media="print" />
<script type="text/javascript">

    // specify and cache each bubble element
    var eventBubbleElems = ['Title', 'Location', 'Author', 'AuthorId', 'StartTime', 'EndTime', 'Color', 'ModifyLink',
                       'AttendanceIcon', 'AttendanceStatus', 'AttendanceListButton', 'AttendanceRequestButton']
    var taskBubbleElems = ['Note', 'Detail']

    var eventBubbleElemCache = {}
    var taskBubbleElemCache = {}

	bubble = {
		allBubbles: ['#calendarBubble',  '#createEventBubble', '#modifyTaskBubble'],

		/**
		 * Initialise
		 */
		init: function() {

            $j.each(eventBubbleElemCache, function(i, elem) {
                if(i == 'Color') {
                    this.css('backgroundColor', 'transparent')
                }
                else {
                    this.html('')
                }
            })
            $j.each(taskBubbleElemCache, function(i, elem) {
                if(i == 'Color') {
                    this.css('backgroundColor', 'transparent')
                }
                else {
                    this.html('')
                }
            })

        },
        
        /**
         * Hide all bubbles
         */
        hideAllBubbles: function() {
            for (i = 0; i < this.allBubbles.length; i++) {
                $j(this.allBubbles[i]).hide();
            }
        }
	}

	$j(function() {

        // load up the bubble elements that will be holding the datumzes
        $j.each(eventBubbleElems, function(i, val) {
            eventBubbleElemCache[val] = $j('#calendarBubble' + val)
        })

        $j.each(taskBubbleElems, function(i, val) {
            taskBubbleElemCache[val] = $j('#modifyTaskBubble' + val)
        })

        var calendarBubble =  $j(bubble.allBubbles[0])
        var eventCreateBubble = $j(bubble.allBubbles[1])
        var taskModifyBubble = $j(bubble.allBubbles[2])

        var createEventForm = $j('#createEventForm');
        var createTaskForm = $j('#createTaskForm');

        var fullCalendar = $j('#calendar')
        var dateExtract = /[ :]/

        /**
         * Transform
         *   "Mon Dec 10 2012 14:13:00 GMT+1100 (EST)"
         * into
         *   "Mon, 10th Dec, 2:13pm"
         * @param stamp
         */
        function calendarDate(stamp) {
            var S,
                p = stamp.toString().split(dateExtract),
                hm = calendarTime(stamp)

            if(p[2] == 11 || p[2] == 12) { S = 'th'; }
            else { var i = p[2].charAt(p[2].length - 1)
                if(i == 1) { S = 'st' }
                else if(i == 2) { S = 'nd' }
                else if(i == 3) { S = 'rd' }
                else { S = 'th' }
            }
            return p[0] + ', ' + parseInt(p[2]) + S + ' ' + p[1] + ', ' + hm
        }

        function calendarTime(stamp) {
            var p = stamp.toString().split(dateExtract)
            if(p[4] == 0) { return '12:00am' }
            else if(p[4] > 12) { return (p[4] - 12) + ':' + p[5] + 'pm' }
            else { return parseInt(p[4]) + ':' + p[5] + 'am' }

        }

        eventCreateBubble.hide()
        calendarBubble.hide()

		fullCalendar.fullCalendar({

			/**
             * When an event is drawn on the calendar
			 */
			eventRender: function(calEvent, jsEvent, view) {

				/* Indicate this event can be attended
				 */
				if (calEvent.data.attendance.icon.toString() == 'true') {
					$j(jsEvent).append('<span>(A)</span>')

				}
			},

			/**
             * When you click on an event in the calendar, populate the bubble
			 */
			eventClick: function(calEvent, jsEvent, view) {

                eventCreateBubble.hide()

				// Burst bubble
				bubble.init()

                if (calEvent.data.meta.eventTypeId == '{TASK_TYPE_ID}') {

                    /* Prefill with task info
                     */
                    taskBubbleElems.Note.val(calEvent.title);
                    taskBubbleElems.Detail.val(calEvent.data.meta.detail);

                    /* Show special modify dialog -_-
                     */
                    taskModifyBubble.show();

                    $j('#modifyTaskForm').submit(function() {
                        var data = {
                            eventId: calEvent.data.meta.eventId,
                            note: $j('#modifyTaskBubbleNote').val(),
                            detail: $j('#modifyTaskBubbleDetail').val(),
                            completed: $j('#modifyTaskBubbleCompleted').checked
                        };

                        $j.post('/calendar/ajax/update.php', data, function(responseText) {
                        });

                        return false;
                    });
                }
                else {
    
                    // The usual event and description
                    eventBubbleElemCache.Title.html(calEvent.title)
                    eventBubbleElemCache.Location.html(calEvent.data.meta.location)
    
                    // Event author
                    eventBubbleElemCache.Author.html(calEvent.data.meta.author)
                    eventBubbleElemCache.Author.attr('href', '/search/user/' + calEvent.data.meta.authorId)
    
                    // Start time
                    if (calEvent.start != null) {
                        eventBubbleElemCache.StartTime.html(calEvent.data.meta.type + ': ' + calendarDate(calEvent.start))
                    }
    
                    // End time
                    if (calEvent.end != null) {
                        eventBubbleElemCache.EndTime.html(" &ndash; " + calendarTime(calEvent.end))
                    }
    
                    // Links to Modify Screen
                    if (calEvent.editable == true) {
                        eventBubbleElemCache.ModifyLink.html('<a class="btn modify float-right" href="/calendar/modify.php?eventID='
                                + calEvent.data.meta.eventId + '&returnTo=week"><span></span>Modify</a>')
                    }
    
                    // Attendances
                    eventBubbleElemCache.AttendanceStatus.html(calEvent.data.attendance.status.toString())
    
                    // Attendance List butonye
                    if (calEvent.data.attendance.listButton.toString() == 'true') {
                        eventBubbleElemCache.AttendanceIcon.html("This event can be attended.")
                        eventBubbleElemCache.AttendanceListButton.html('<a class="btn float-right" href="/calendar/attendance/list/'
                                + calEvent.data.meta.eventId + '"><span></span>Attendance List</a>')
                    }
                    else {
        
                        // Attend/Unattend butonye
                        if (calEvent.data.attendance.requestButton.toString() != 'false') {
                            eventBubbleElemCache.AttendanceRequestButton.html("<span></span>" + calEvent.data.attendance.requestButton.toString())
        
                            // Start time
                            if (calEvent.start != null) {
                                eventBubbleElemCache.StartTime.html(calendarDate(calEvent.start));
                            }
        
                            // Bugalug shenanigans
                            eventBubbleElemCache.AttendanceRequestButton.live('click', function(event) {
                                $j.post('/service/attendance/processToggleAttendance', data, function (data) {
                                    if (data.error == undefined) {
                                        if (eventBubbleElemCache.AttendanceRequestButton.text() == 'Attend') {
                                            eventBubbleElemCache.AttendanceRequestButton.html('<span></span>Unattend')
                                        }
                                        else {
                                            eventBubbleElemCache.AttendanceRequestButton.html('<span></span>Attend')
                                        }
                                    }
                                })
                            })
                        }
                    }
                }

                // position the popup in the right spot!!
                var mid = calendarBubble.find('.middle')
                var evt = $j(this)

                // unfortunately dimension-related things don't work when elements are not displayed
                calendarBubble.css('visibility', 'hidden')
                calendarBubble.show()

                var bubbleHeight = mid.outerHeight() + mid.find('.bottom').outerHeight()
                var bottomEdge = evt.offset().top + 10
                var topEdge = bottomEdge - bubbleHeight

                var leftEdge = evt.offset().left - (calendarBubble.width() - 75)
                var pos = {top: topEdge, left: leftEdge}

                calendarBubble.offset(pos)
                calendarBubble.css('visibility', 'visible')

			},

			// When you finish resizing an event
			eventResizeStop: function(calEvent, jsEvent, ui, view) {
				alert('mort: respecify times');
			},

			// When you finish dragging an event to its new home
			eventDrop: function(event, dayDelta, minuteDelta, allDay, revertFunc) {
				var data = {
					eventId: event.data.meta.eventId,
					dayDelta: dayDelta,
					minuteDelta: minuteDelta,
					allDay: allDay
				};

				/* TODO: Event re-render
				 *
				 * If an event's length exceeds the threshold of the current day
				 * (e.g. a five-hour event got dragged to 11pm) the back-end changes
				 * its end date to be 23:59:59 of the current day. However this
				 * doesn't update the DOM until you reload the page. I haven't found
				 * a re-render method for individual events.
				 */
				$j.post('/calendar/ajax/update.php', data, function(responseText) {
				});
			},

			/**
             *  When you click on a day to add a new event
			 */
			dayClick: function(date, allDay, jsEvent, view) {

                // Date formatting
                var weekday = [ "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat" ]

                var month = [ "January", "February", "March", "April", "May", "June",
                              "July", "August", "September", "October", "November", "December" ]

                var displayDate = weekday[date.getDay()] + ', ' + date.getDate() + ' ' + month[date.getMonth()];

                eventCreateBubble.find('input[name=date]').val(date.getTime());
                eventCreateBubble.find('span').html(displayDate);

                // Gotta hide them all
                bubble.hideAllBubbles();

                var cell = $j(this)

                eventCreateBubble.find('input[name=date]').val(date.getTime())
                calendarBubble.hide()

                eventCreateBubble.css('visibility', 'hidden')
                eventCreateBubble.show()

                // get the dimensions of the bubble
                var bubbleMiddle = eventCreateBubble.find('.middle')
                var bw = bubbleMiddle.outerWidth()
                var bh = bubbleMiddle.outerHeight()

                // get the offset of the date on which the user clicked
                var cos = cell.offset()

                var topEdge = cos.top - (bh + 5)
                var leftEdge = cos.left + cell.width() - bw

                eventCreateBubble.offset({top: topEdge, left: leftEdge})

                eventCreateBubble.css('visibility', 'visible')
			},

			// Butonye
			header: {
				left: 'prev,today,next ',
				center: 'title',
				right: 'month,agendaWeek,agendaDay'
			},

            contentHeight: $j(window).height() - fullCalendar.offset().top - 60,

            windowResize: function(view) {
                var wHeight = $j(window).height()
                var calTop = fullCalendar.offset().top
                fullCalendar.fullCalendar('option','contentHeight',wHeight - calTop - 60)
            },

			// Stream location
			events: '/calendar/ajax/full'
		});

		/* Event creation forms
		 */
		$j('#createEventForm, #createTaskForm').submit(function(event) {
			var data = $j(this).serialize();

			$j.post('/calendar/ajax/create', data, function(responseText) {
				if (responseText.length) {
					var responseData = new Function('return ' + responseText)
					var newEvent = responseData()

					if (newEvent.data.meta.type == '{TASK_TYPE_ID}') {
                        createTaskForm.find('input[name=completed]').checked = newEvent.data.meta.completed
					}
					fullCalendar.fullCalendar('renderEvent', newEvent)
				}
			})
			return false;
		});

		/* Hide Task forms by default
		 */
		$j('#createTaskForm').hide();

		/* Event/Task form control. This switches between
		 * which event type you are creating (event or task)
		 */
		$j('#showCreateTaskForm').click(function(e) {
			e.preventDefault();

            $j(this).addClass('selected');
            $j('#showCreateEventForm').removeClass('selected');

			createEventForm.hide();
			createTaskForm.show();
		});

		$j('#showCreateEventForm').click(function(e) {
			e.preventDefault()

            $j(this).addClass('selected')
            $j('#showCreateTaskForm').removeClass('selected')

            createEventForm.show()
			createTaskForm.hide()
		})

        $j('#edit-full').click(function(e) {
            var getstring = $j(this).closest('form').serialize()
            var l = window.location
            window.location = l.protocol + '//' + l.hostname + '/calendar/modify.php?from=inline&' + getstring
        })

        $j('#calendar .fc-header').live('click', 'span.fc-button', function(e) {
            eventCreateBubble.hide()
            calendarBubble.hide()
        })
	});
</script>
<!-- END custom_head -->

<div id="createEventBubble" class="cal-bubble">
    <div class="middle">
        <div class="close">&times;</div>
        <div class="js-data clearfix">
            <ul id="createSwitch">
                <li><a href='#' id='showCreateEventForm' class="selected">Event</a></li>
                <li><a href='#' id='showCreateTaskForm'>Task</a></li>
            </ul>
            <form id='createEventForm' method='post' action='#'>
                <h1>Quick Create Event</h1>
                <input name='date' type='hidden' value='' />
                <label>When<span><!-- Date gets shoved in here --></span></label>
                <label>Event Title<input name='note' type='text' value='' /></label>
                <label>Event Type<select name='type'>
                    <!-- BEGIN event_type -->
                    <option value='{EVENT_TYPE_ID}' />{EVENT_TYPE_NAME}</option>
                    <!-- END event_type -->
                </select></label>
                <a href="#" id="edit-full">Edit event &raquo;</a>
                <input class="btn modify float-right no-icon" type='submit' value='Create Event' />
            </form>
            <form id='createTaskForm' method='post' action='#'>
                <h1>Quick Create Task</h1>
                <input name='date' type='hidden' value='' />
                <input name='type' type='hidden' value='{TASK_TYPE_ID}' />
                <label>Task<input name='note' type='text' value='' /></label>
                <label>Due Date<span><!-- Date gets shoved in here --></span></label>
                <label class="note">Note<textarea name='detail'></textarea></label>
                <input class="btn modify float-right no-icon" type='submit' value='Create Task' />
            </form>
        </div>
        <div class="bottom"><strong></strong></div>
    </div>
</div>

<div id='modifyTaskBubble'>
	<h1>Modify Task</h1>
	<form id='modifyTaskForm'>
		<label>
            <input id='modifyTaskBubbleCompleted' type='checkbox' value='1' />
            Task
            <input id='modifyTaskBubbleNote' type='text' value='' />
        </label>
        <label class="note">Note<textarea id='modifyTaskBubbleDetail' name='detail'></textarea></label>
		<input type='submit' value='Update Task' />
	</form>
</div>
<div id="calendarBubble" class="cal-bubble">
    <div class="middle">
        <div class="close">&times;</div>
        <div class="js-data clearfix">
            <dl>
                <dd class="title"><h3 id="calendarBubbleTitle"></h3></dd>
                <dd class="datetime"><h4><span id="calendarBubbleStartTime"></span><span id="calendarBubbleEndTime"></span></h4></dd>
                <dd><p id="calendarBubbleLocation"></p></dd>
                <dd class="post-by">Posted by <a id="calendarBubbleAuthor" href="#"></a></dd>
            </dl>
            <div class="attendance">
                <dl>
                    <dd><p id="calendarBubbleAttendanceIcon"></p></dd>
                    <dd class="rm"><p id="calendarBubbleAttendanceStatus"></p></dd>
                </dl>
            </div>
            <div class="actions">
                <dl>
                    <dd><p id="calendarBubbleModifyLink"></p></dd>
                    <dd><p id="calendarBubbleAttendanceListButton"></p></dd>
                    <dd><p id="calendarBubbleAttendanceRequestButton"></p></dd>
                </dl>
            </div>
        </div>
        <div class="bottom"><strong></strong></div>
    </div>
</div>
<div id="calendar"></div>
