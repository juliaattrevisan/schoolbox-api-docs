<!-- BEGIN custom_head -->
<link rel='stylesheet' type='text/css' href='/css/core/fullcalendar/fullcalendar.css' />
<link rel='stylesheet' type='text/css' href='/css/core/fullcalendar/fullcalendar.print.css' media='print' />
<script type='text/javascript'>
	bubble = {
		init: function() {
			$j('#calendarBubbleTitle').html('');
			$j('#calendarBubbleLocation').html('');
			$j('#calendarBubbleAuthor').html('');
			$j('#calendarBubbleAuthorId').html('');
			$j('#calendarBubbleStartTime').html('');
			$j('#calendarBubbleEndTime').html('');
			$j('#calendarBubbleColor').css('backgroundColor', 'transparent');
			$j('#calendarBubbleModifyLink').html('');

			/* Attendances
			 */
			$j('#calendarBubbleAttendanceIcon').html('');
			$j('#calendarBubbleAttendanceStatus').html('');
			$j('#calendarBubbleAttendanceListButton').html('');
			$j('#calendarBubbleAttendanceRequestButton').html('');
		}
	};

	$j(function() {
		$j('#createEvent').hide();

		$j('#calendar').fullCalendar({

			/* When an event is drawn on the calendar
			 */
			eventRender: function(calEvent, jsEvent, view) {

				/* Indicate this event can be attended
				 */
				if (calEvent.data.attendance.icon.toString() == 'true') {
					$j(jsEvent).append('<span>(A)</span>');
					$j('#calendarBubbleAttendanceIcon').html("[A]");
				}
			},

			/* When you click on an event in the calendar, populate the bubble
			 */
			eventClick: function(calEvent, jsEvent, view) {

				/* Burst bubble
				 */
				bubble.init();

				/* The usual event and description
				 */
				$j('#calendarBubbleTitle').html(calEvent.title);
				$j('#calendarBubbleLocation').html(calEvent.data.description);

				/* Event author
				 */
				$j('#calendarBubbleAuthor').html(calEvent.data.meta.author);
				$j('#calendarBubbleAuthor').attr('href', '/search/user/' + calEvent.data.meta.authorId);

				/* Start time
				 */
				if (calEvent.start != null) {
					$j('#calendarBubbleStartTime').html(calEvent.start.toString());
				}

				/* End time
				 */
				if (calEvent.end != null) {
					$j('#calendarBubbleEndTime').html(calEvent.end.toString());
				}

				/* Links to Modify Screen
				 */
				if (calEvent.editable == true) {
					$j('#calendarBubbleModifyLink').html("<a class='btn modify float-left' href='/calendar/modify.php?eventID=" + calEvent.data.meta.eventId + "&returnTo=week'><span></span>Modify</a>");
				}

				/* Attendances
				 */
				$j('#calendarBubbleAttendanceStatus').html(calEvent.data.attendance.status.toString());

				/* Attendance List butonye
				 */
				if (calEvent.data.attendance.listButton.toString() == 'true') {
					$j('#calendarBubbleAttendanceListButton').html("<a href='/calendar/attendance/list/" + calEvent.data.meta.eventId + "'>Attendance List</a>");
				}

				/* Attend/Unattend butonye
				 */
				if (calEvent.data.attendance.requestButton.toString() != 'false') {
					$j('#calendarBubbleAttendanceRequestButton').html("<span></span>" + calEvent.data.attendance.requestButton.toString());

					var data = {
						eventId: calEvent.data.meta.eventId
					}

					/* Bugalug shenanigans
					 */
					$j('#calendarBubbleAttendanceRequestButton').live('click', function(event) {
						$j.post('/service/attendance/processToggleAttendance', data, function (data) {
							if (data.error == undefined) {
								if ($j('#calendarBubbleAttendanceRequestButton').text() == 'Attend') {
									$j('#calendarBubbleAttendanceRequestButton').html('<span></span>Unattend');
								}
								else {
									$j('#calendarBubbleAttendanceRequestButton').html('<span></span>Attend');
								}
							}
						});
					});
				}
			},

			/* When you finish resizing an event
			 */
			eventResizeStop: function(calEvent, jsEvent, ui, view) {
				alert('mort: respecify times');
			},

			/* When you finish dragging an event to its new home
			 */
			eventDrop: function(event, dayDelta, minuteDelta, allDay, revertFunc) {
				var data = {
					eventId: event.data.meta.eventId,
					dayDelta: dayDelta,
					minuteDelta: minuteDelta,
					allDay: allDay
				};

				/* TODO: Event re-render
				 *
				 * If an event's length exceeds the threshold of the current day
				 * (e.g. a five-hour event got dragged to 11pm) the back-end changes
				 * its end date to be 23:59:59 of the current day. However this
				 * doesn't update the DOM until you reload the page. I haven't found
				 * a re-render method for individual events.
				 */
				$j.post('/calendar/ajax/update.php', data, function(responseText) {
				});
			},

			/* When you click on a day to add a new event
			 */
			dayClick: function(date, allDay, jsEvent, view) {
				$j('#createEvent').show();
			},

			/* Butonye
			 */
			header: {
				left: 'prev,today,next ',
				center: 'title',
				right: 'month,agendaWeek,agendaDay'
			},

			/* Stream location
			 */
			events: '/calendar/ajax/full'
		});
	});
</script>

<style type='text/css'>
	body {
		margin-top: 40px;
		text-align: center;
		font-size: 14px;
		font-family: "Lucida Grande",Helvetica,Arial,Verdana,sans-serif;
		}

	#calendar {
		width: 900px;
		margin: 0 auto;
		}

</style>
<!-- END custom_head -->

<div id='createEvent' style='border: 1px solid #f0f;width:500px;height:200px;float:right;'>
	<h1>Quick Create Event</h1>
	<form method='post' action='/calendar/ajax/create.php'>
		<input name='id' type='text' value='{USER_ID}' /><br />
		<input name='level' type='text' value='(insert level)' /><br />
		<input name='group' type='text' value='(insert group)' /><br />

		<label>Note
			<input name='note' type='text' value='' />
		</label>

		<input type='submit' value='Create Event' />
	</form>
</div>

<div id='calendarBubble' style='border: 1px solid #f00;width:500px;height:500px;float:left;'>
	<div style='width:100%;display:block;clear:both;'>
		<h1>Event Details</h1>

		<dl>
			<dt>
				Event Title
			</dt>
			<dd>
				<p id='calendarBubbleTitle'></p>
			</dd>

			<dt>
				Event Time
			</dt>
			<dd>
				<p><span id='calendarBubbleStartTime'></span> - <span id='calendarBubbleEndTime'></span></p>
			</dd>

			<dt>
				Location
			</dt>
			<dd>
				<p id='calendarBubbleLocation'></p>
			</dd>
			<dt>
				Posted by
			</dt>
			<dd>
				<a id='calendarBubbleAuthor' href='#'></a>
			</dd>
		</dl>
	</div>

	<div style='width:100%;display:block;clear:both;'>
		<h1>Links</h1>

		<dl>
			<dt>
				Modify
			</dt>
			<dd>
				<p id='calendarBubbleModifyLink'></p>
			</dd>
		</dl>
	</div>

	<div style='width:100%;display:block;clear:both;'>
		<h1>Attendance</h1>

		<dl>
			<dt>
				Icon
			</dt>
			<dd>
				<p id='calendarBubbleAttendanceIcon'></p>
			</dd>
			<dt>
				Status
			</dt>
			<dd>
				<p id='calendarBubbleAttendanceStatus'></p>
			</dd>
			<dt>
				List Button
			</dt>
			<dd>
				<p id='calendarBubbleAttendanceListButton'>
				</p>
			</dd>
			<dt>
				Request Button
			</dt>
			<dd>
				<p id='calendarBubbleAttendanceRequestButton'></p>
			</dd>
		</dl>
	</div>

</div>

<div id='calendar'></div>
