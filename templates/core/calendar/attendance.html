<h1>Attendance for {EVENT_NAME}</h1>

<!-- BEGIN no_attendees -->
<p>Currently no one has RSVP.</p>
<!-- END no_attendees -->

<!-- BEGIN pending_attendee_list -->
<form name="modifyListForm" action="/calendar/attendance/processModifyAttendanceList" method="post">
    <h2>Pending Attendees</h2>
    <span class="header_option in-h2"><a href="/calendar/attendance/exportPending/{EVENT_ID}" class="btn download"><span></span>Export To CSV</a></span>
    <table id="pendingAttendeeList" class="ruler table">
        <thead>
            <tr>
                <th></th>
                <th>Name</th>
                <th>Role</th>
                <th class="center">Remove</th>
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN pending_attendee -->
            <tr class="{CLASS}">
                <td><input name="attendanceList[][id]" type="checkbox" value="{ATTENDANCE_ID}" /></td>
                <td><a href="/search/user/{USER_ID}">{USER_NAME}</a></td>
                <td>{USER_ROLE}</td>
                <td><span class="actions one-button"><a href="/calendar/attendance/processRemoveAttendance/{ATTENDANCE_ID}" class="btn delete no-text float-left" title="Delete"><span></span></a></span></td>
            </tr>
            <!-- END pending_attendee -->
        </tbody>
    </table>

    <div class="clearfix">
        <input type="hidden" name="event[id]" value="{EVENT_ID}">
        <input type="submit" name="approve" value="Approve Selected" class="submit-btn-plain">
        <input type="submit" name="reject" value="Reject Selected" class="submit-btn-plain">
    </div>
</form>
<!-- END pending_attendee_list -->

<!-- BEGIN approved_attendee_list -->

        <!-- END approved_attendee -->
    </tbody>
</table>
<!-- END approved_attendee_list -->
