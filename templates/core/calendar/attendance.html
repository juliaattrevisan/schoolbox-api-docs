<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 columns">
            <h1>Attendance for {EVENT_NAME}</h1>
        </div>
    </div>
    <nav>
        <a class="icon-export" title="Export To CSV" href="/calendar/attendance/exportPending/{EVENT_ID}"></a>
    </nav>
</div>

<!-- BEGIN no_attendees -->
<div class="row">
    <div class="small-12 column">
        <section class="empty-state">
            <i class="icon-info"></i>
            <p>Nobody has responded to this event.</p>
        </section>
    </div>
</div>
<!-- END no_attendees -->

<!-- BEGIN pending_attendee_list -->
<div class="row">
    <form action="/calendar/attendance/processModifyAttendanceList" method="post" class="top">
    <input type="hidden" name="event[id]" value="{EVENT_ID}">
        <div class="small-12 island">
            <div class="row">
                <div class="small-12 columns">
                    <h2 class="subheader">Pending Attendees</h2>
                </div>
            </div>

            <div class="row">
                <div class="small-12 columns">
                    <table id="pendingAttendeeList">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Name</th>
                                <th>Role</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- BEGIN pending_attendee -->
                            <tr>
                                <td>
                                    <input id='attendanceList[{ATTENDING_USER_ID}][id]' name="attendanceList[{ATTENDING_USER_ID}][id]" type="checkbox" value="{ATTENDANCE_ID}" />
                                    <label for="attendanceList[{ATTENDING_USER_ID}][id]" class="checkbox-label"></label>
                                </td>
                                <td>
                                    <a href="/search/user/{ATTENDING_USER_ID}" title="View Profile">{USER_NAME}</a>
                                </td>
                                <td>
                                    {USER_ROLE}
                                </td>
                                <td class="actions-small-1">
                                    <nav>
                                        <a href="/calendar/attendance/processRemoveAttendance/{EVENT_ID}/{ATTENDING_USER_ID}" class="icon-delete" title="Delete"></a>
                                    <nav>
                                </td>
                            </tr>
                            <!-- END pending_attendee -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="small-12 medium-6 columns right">
            <ul class="flex-list">
                <li><input type="submit" name="approve" value="Approve Selected"></li>
                <li><input type="submit" name="reject" value="Reject Selected"></li>
            </ul>
        </div>
    </form>
</div>
<!-- END pending_attendee_list -->

<!-- BEGIN approved_attendee_list -->
<div class="row">
    <div class="small-12 columns">
        <form action="/calendar/attendance/processModifyAttendanceList" method="post" class="top">
            <input type="hidden" name="event[id]" value="{EVENT_ID}">

            <div class="actions-small-1 row">
                <div class="list-item">
                    <div class="small-12 columns">
                        <h2 class="subheader">Approved Attendees</h2>
                    </div>
                </div>
                <nav>
                    <a class="icon-export" title="Export To CSV" href="/calendar/attendance/exportAttending/{EVENT_ID}"></a>
                </nav>
            </div>
            <div class="row">
                <div class="small-12 columns">
                    <table id="approvedAttendeeList">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- BEGIN approved_attendee -->
                        <tr>
                            <td>
                                <a href="/search/user/{ATTENDING_USER_ID}" title="View Profile">{USER_NAME}</a>
                            </td>
                            <td>
                                {USER_ROLE}
                            </td>
                            <td class="actions-small-1">
                                <nav>
                                    <a href="/calendar/attendance/processRemoveAttendance/{EVENT_ID}/{ATTENDING_USER_ID}" class="icon-delete" title="Delete"></a>
                                </nav>
                            </td>
                        </tr>
                        <!-- END approved_attendee -->
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- END approved_attendee_list -->

<!-- BEGIN rejected_attendee_list -->
<div class="row">
    <div class="small-12 columns">
        <div class="actions-small-1 row">
            <div class="list-item">
                <div class="small-12 columns">
                    <h2 class="subheader">Rejected Attendees</h2>
                </div>
            </div>
            <nav>
                <a class="icon-export" title="Export To CSV" href="/calendar/attendance/exportRejected/{EVENT_ID}"></a>
            </nav>
        </div>

        <div class="row">
            <div class="small-12 columns">
                <table id="rejectedAttendeeList">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- BEGIN rejected_attendee -->
                        <tr>
                            <td>
                                <a href="/search/user/{ATTENDING_USER_ID}" title="View Profile">{USER_NAME}</a>
                            </td>
                            <td>
                                {USER_ROLE}
                            </td>
                            <td class="actions-small-1">
                                <nav>
                                    <a href="/calendar/attendance/processRemoveAttendance/{EVENT_ID}/{ATTENDING_USER_ID}" class="icon-delete" title="Delete"></a>
                                </nav>
                            </td>
                        </tr>
                        <!-- END rejected_attendee -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>


<!-- END rejected_attendee_list -->
