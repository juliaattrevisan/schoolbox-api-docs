     <link rel="stylesheet" type="text/css" href="/css/mgs-calendar.css" />
      <h1>{MONTH} - {YEAR}</h1>
       <span class="header_option"><a href="/calendar/week/{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}">Week View</a></span>
      <center>
          <table id="month-nav">
            <tr>
              <td><a class="back" href="/calendar/month/{BACK}" title="Back one month"><strong>&lt;&lt;</strong></a></td>
              <td colspan="3">
                <select name="Month" onchange="window.open('/calendar/month/{SELECTED_DAY}-'+this.value+'-{SELECTED_YEAR}', '_self', '');">
                  <!-- BEGIN month_drop -->
                  <option value="{DROP_MONTH_NUMBER}" {DROP_MONTH_NUMBER_SELECTED}>{DROP_MONTH_NAME}</option>
                  <!-- END month_drop -->
                </select>
              </td>
              <td colspan="2"><select name="Year" onchange="window.open('/calendar/month/{SELECTED_DAY}-{SELECTED_MONTH}-'+this.value, '_self', '');">
                  <!-- BEGIN year_drop -->
                  <option value="{DROP_YEAR_NUMBER}" {DROP_YEAR_NUMBER_SELECTED}>{DROP_YEAR_NUMBER}</option>
                  <!-- END year_drop -->
                </select>
              </td>
              <td><a class="forward" href="/calendar/month/{FORWARD}" title="Forward one month"><strong>&gt;&gt;</strong></a></td>
            </tr>
          </table>
      </center>
      
     
      <table id="month-view">
      	<thead>
      	<tr>
        	<td>Sunday</td>
            <td>Monday</td>
            <td>Tuesday</td>
            <td>Wednesday</td>
            <td>Thursday</td>
            <td>Friday</td>
            <td>Saturday</td>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN month_week -->
        <tr class="month-week">
        	<!-- BEGIN day_block -->
        	<td class="day-block{OTHER_MONTH}">
           <p class="header_option">{ADD}</p>
            <p class="day-num">{DATE}</p>
             <div class='float-fix'></div> 
              <!-- BEGIN note_block -->
              <p style="color:{PRIORITY};">{TIME}
              {MODIFY_START}{NOTE}{MODIFY_END}</p>
              <!-- END note_block -->
              
            </td>
        	<!-- END day_block -->
        </tr>
        <!-- END month_week -->
        </tbody>
      </table>
