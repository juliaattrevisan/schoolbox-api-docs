<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
<script type="text/javascript">
      $j(function () {
 
        /* date picker */		 
        $j('.datepicker').datepicker({ 
			dateFormat: 'dd-mm-yy',
			onSelect: function(dateText, inst) {window.open('/calendar/month/'+dateText, "_self")},
			defaultDate: $j.datepicker.parseDate("dd-mm-yy", "{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}"),
			showOn: 'button',
			buttonImage: '/images/core/calendar/calendar-click.png',
			buttonImageOnly: true,
			showAnim: 'slideDown'
        });
		
		$j('#calendar').prepend('<a class="btn report print-it" href="#"><span></span>Print</a>');
		 $j('.print-it').click(function() {
			  window.print();
			  return false;
		});

});

</script>
<!-- END custom_head -->
     <div id="calendar">
     
      <table id="month-view" cellpadding="0" cellspacing="0">
      	<thead>
		<tr>
			<td colspan="2" class="cal-left" valign="baseline">
				<a class="back" href="/calendar/month/{BACK}" title="Back one month"><strong>&lt;&lt;</strong></a>
				<div class="datepicker-box"><input type="hidden" class="datepicker" /></div>
				<a class="forward" href="/calendar/month/{FORWARD}" title="Forward one month"><strong>&gt;&gt;</strong></a>
			</td>
			
			<td colspan="2" class="cal-mid"><h3>{MONTH} {YEAR}</h3></td>
			
			<td colspan="3" class="cal-right" valign="baseline">
				<div class="link-case">
				
				
				
				<a class="filter-change filters" href="#"><span></span>Filters</a>
				<a class="filter-change week " href="/calendar/week/{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}"><span></span>Week</a>
				<a class="filter-change month current" href="#"><span></span>Month</a>
					<div class="filter-drop">
						<div class="filter-list">
							<form class="clearfix">	
								<div class="filter-cat groups">
									<span>Groups</span>
									<!-- BEGIN group -->
									<label title="{GROUP_NAME}">
										<input type="checkbox" name="group" id="{GROUP_ID}" value="group{GROUP_ID}" checked="checked" class="checkbox"/>{GROUP_NAME}
									</label>
								<!-- END group -->
								</div>
								<div class="filter-cat campus">
									<span>Campus</span>
									<!-- BEGIN campus -->
									<label title="{CAMPUS_NAME}">
										<input type="checkbox" name="campus" id="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="campus{CAMPUS_ID}" class="checkbox"/>{CAMPUS_NAME}
									</label>
								<!-- END campus -->
								</div>
								<div class="filter-cat events last">
									<span>Event</span>
									<!-- BEGIN event_type -->
									<label title="{EVENT_TYPE_NAME}">
										<input type="checkbox" name="events" id="{EVENT_TYPE_ID}" checked="checked" value="type{EVENT_TYPE_ID}" class="checkbox"/><span style="background-color:#{EVENT_TYPE_COLOUR};">{EVENT_TYPE_NAME}</span>
									</label>
									<!-- END event_type -->
								</div><!--/filter-list-->
								
							<a href="#" id="applyFilters" class="btn float-right"><span></span>Apply Filters</a>
						</form>
					</div><!--/filter-drop-->
				</div>
				</div>
			</td>
		</tr>
		<tr>
        	<td class="dark border-left">Sun</td>
            <td class="dark">Mon</td>
            <td class="dark">Tue</td>
            <td class="dark">Wed</td>
            <td class="dark">Thu</td>
            <td class="dark">Fri</td>
            <td class="dark">Sat</td>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN month_week -->
        <tr class="month-week ">
        	<!-- BEGIN day_block -->
        	<td class="day-block {OTHER_MONTH} {MONTABLE_CSS}">
				<div class="dayWrap clearfix">
					<p class="header_option">{ADD}</p>
					<p class="day-num">{DATE}</p>
				</div> 
				<div class="noteWrap">
					<ul class="js_happening">
						<!-- BEGIN note_block -->
                        <li class="{EVENT_TYPE} {EVENT_LEVEL} ">
                            <span style="background-color:{COLOUR}; border:1px solid {COLOUR};">{NOTE}<br/></span>

                            <div class="hidden-fields clearfix">

                                <h4><!-- BEGIN time -->
                                    <div class="time"><strong>{TIME}</strong></div>
                                    <!-- END time -->{NOTE}
                                </h4>
                                <p class="meta">Event Type: {TYPE}<br/>
									Created by: <a href="/search/user/{AUTHOR_ID}">{AUTHOR}</a><br/>
                                    {LOCATION} {DETAIL}</p>
                                <div class="modify-event">{MODIFY}</div>
                            </div>
                        </li>
						<!-- END note_block -->
					</ul>
				</div>
          </td>
        	<!-- END day_block -->
        </tr>
        <!-- END month_week -->
        </tbody>
      </table>
	<div class="cal-bubble">
		<div class="middle">
			<div class="close">x</div>
			<div class="js-data clearfix"></div>
			<div class="bottom"><strong></strong></div>
		</div>
	</div>
</div>
