<script>
    $(function() {
        $('#uploadForm').alaressValidate({
            rules: {
                attachedFile: {
                    required: {
                        depends: function (element) {
                            return !$(element).parents('form').find('input[name="attachment[]"]').length;
                        }
                    }
                }
            },
            messages: {
                attachedFile: "Please attach a file."
            }
        });

        $('#upload-calendar-zone').on('success.attachzone', function(event, file) {
            $('#attachedFile-error').remove();
        });
    });
</script>
{BREADCRUMB}
<div class="row actions-small-1">
    <div class="list-item">
        <div class="small-12 island">
            <h1>Import Calendar Events</h1>
        </div>
    </div>
    <nav>
        <a href="#" class="icon-more" data-dropdown="header-options"></a>
    </nav>
    <ul class="f-dropdown fadeInDown" data-dropdown-content="" id="header-options" title="Actions">
        <li><a href="{CDN_PREFIX}/adminv2/csv/calendarBulkAdd.csv" class="icon-download">Download Sample CSV</a></li>
    </ul>
</div>
<div class="row">
    <div class="small-12 island">
        <form id='uploadForm' action="/calendar/importForm" method="post" enctype="multipart/form-data">
            <input type="hidden" name="homepageId" value="{HOMEPAGE_ID}" />

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label class="required">
                            Import File
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Upload a Microsoft Outlook .ics file or a CSV file, sample available in heading menu">?</span>
                        </label>
                        <input type="hidden" name="attachedFile">
                        {ATTACHZONE}
                    </div>
                </fieldset>
            </section>
            <input type="submit"  value="Submit" />
        </form>
    </div>
</div>
