<script type="text/javascript">
	(function() {
		$.fn.filterSelector = function(options) {
			options = options || {};

			var config = init(options, this);

			/* All checkboxes on by default
			 */
			applyDefaultCheckboxState();

			applyPopupToggle();
			applyCheckboxToggle();

			/**
			 * Init
			 *
			 * @param options
			 * @param element
			 * @returns {*}
			 */
			function init(options, element) {
				var defaults = {

					/* The Filter button we just clicked on
					 */
					element: element,

					/* The element containing all the filter options
					 */
					filterContainer: null,

					/* The element containing all the events
					 */
					eventContainer: null
				}

				var derived = {
				}

				var merged = $.extend(defaults, derived, options);

				return merged;
			}

			/**
			 * Add ability to toggle popup on/off
			 */
			function applyPopupToggle() {
				$(config.element).click(function(event) {
					event.preventDefault();

					$(config.filterContainer).toggle();
				});
			}

			/**
			 * Turn events on/off based on checkbox selection
			 */
			function applyDefaultCheckboxState() {
				$.each($(config.filterContainer).find('.applyFilters'), function(index, element) {
					var attribute = $(this).val();

					$(element).attr('checked', true);
					$(config.eventContainer).find('.'+attribute).show();
				});
			}

			/**
			 * Turn events on/off based on checkbox selection
			 */
			function applyCheckboxToggle() {
				$.each($(config.filterContainer).find('.applyFilters'), function(index, element) {
					$(element).click(function(event) {
						var attribute = $(this).val();

						if ($(this).is(':checked')) {
							$(config.eventContainer).find('.'+attribute).show();
						}
						else {
							$(config.eventContainer).find('.'+attribute).hide();
						}
					});
				});
			}
		}
	})(jQuery);

	$(function() {
		$('[data-filters="true"]').filterSelector({
			filterContainer: '.filter-drop',
			eventContainer: $('[data-eventlist="true"]')
		});
	});
</script>

<h1>Calendar for {USER_FULLNAME}</h1>

<a href="#" class='btn list' data-filters="true"><span></span>Filters</a>

<div class="clearfix"></div>

<div class='printEventList' data-eventlist="true">
	<div class="calendar-controls no-height clearfix">
		<div class="link-case">
			<div class="filter-drop clearfix">
				<div class="filter-list">
					<form class="clearfix">
						<div class="filter-cat groups clearfix">
							<span class="filter-title">Groups</span>
							<!-- BEGIN filter_group -->
							<label title="{GROUP_NAME}">
								<input type="checkbox" name="group" id="{GROUP_ID}" value="group{GROUP_ID}" {GROUP_ID_SELECTED} class="checkbox applyFilters"/>
								{GROUP_NAME}
							</label>
							<!-- END filter_group -->
						</div>
						<div class="filter-cat campus">
							<span class="filter-title">Campus</span>
							<!-- BEGIN filter_campus -->
							<label title="{CAMPUS_NAME}">
								<input type="checkbox" name="campus" id="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="campus{CAMPUS_ID}" class="checkbox applyFilters"/>
								{CAMPUS_NAME}
							</label>
							<!-- END filter_campus -->
						</div>
						<div class="filter-cat events last">
							<span class="filter-title">Event</span>
							<!-- BEGIN filter_event_type -->
							<label title="{EVENT_TYPE_NAME}">
								<input type="checkbox" name="events" id="{EVENT_TYPE_ID}" {EVENT_TYPE_ID_SELECTED} value="type{EVENT_TYPE_ID}" class="checkbox applyFilters"/>
								<span style="background-color:#{EVENT_TYPE_COLOUR};">{EVENT_TYPE_NAME}</span>
							</label>
							<!-- END filter_event_type -->
						</div>
						<!--/filter-list-->
					</form>
					<p class="clearfix">
						<a href="#" id="applyFilters" class="btn float-right"><span></span>Apply Filters</a>
					</p>
					<!--/filter-drop-->
				</div>
			</div>
		</div>
	</div>

	<!-- BEGIN date -->
	<h2>{EVENT_DATE}</h2>
	<ul>
		<!-- BEGIN event -->
		<li>
			<p class="type{EVENT_TYPE}" style="background-color:{EVENT_COLOUR}">
				<!-- BEGIN event_allday -->
				<span class="duration">All Day</span>
				<!-- END event_allday -->

				<!-- BEGIN event_timed -->
				<span class="duration">{EVENT_START}&ndash;{EVENT_END}</span>
				<!-- END event_timed -->

				{EVENT_TITLE}
			</p>
		</li>
		<!-- END event -->
	</ul>
	<br/>
	<!-- END date -->
</div>
