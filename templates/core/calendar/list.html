<script type="text/javascript" src="/javascript/jquery.syncDates.js"></script>
<script type="text/javascript" src="/calendar/js/jquery.filterSelector.js"></script>
<script type="text/javascript" src="/javascript/jquery.calendar_export.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectAll.js"></script>
<script type="text/javascript" src="/javascript/components/zeroclipboard/dist/ZeroClipboard.min.js"></script>
<script type="text/javascript">
	$(function() {

		var exportForm = $('#calendar-export .filter-drop');

		$('[data-filters="true"]').filterSelector({
			filterContainer: '#calendar-list .filter-drop',
			eventContainer: $('[data-eventlist="true"]'),
			exportContainer: exportForm
		})

        /* Calendar controls
         */
        $('[data-type=calendar-controls]').submit(function(event) {
            event.preventDefault();

            var id = $('[data-type=calendar-controls]').find('input[name=userKey]').val();
            var start_date = $('[data-type=calendar-controls]').find('input[name=start_date]').val();
            var finish_date = $('[data-type=calendar-controls]').find('input[name=finish_date]').val();

            var url = '/calendar/list/' + id + '/' + start_date + '/' + finish_date;

            window.location.href = url;
        });

		/* date picker */
		$('#start_date').datepicker({
			showOn: 'both',
			buttonImage: '/images/core/calendar/calendar-click.png',
			buttonImageOnly: true,
			constrainInput: false,
            altField: '#start_date_alt',
            altFormat: 'dd-mm-yy',
			onClose: function (string) {
				var input = $(this);
				$.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
					input.val(data.time);
				})
			}
		});
        
        /* date picker */
        $('#finish_date').datepicker({
            showOn: 'both',
            buttonImage: '/images/core/calendar/calendar-click.png',
            buttonImageOnly: true,
            constrainInput: false,
            altField: '#finish_date_alt',
            altFormat: 'dd-mm-yy',
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });
        
		$('#start_date').syncDates({
			endDate: $('#finish_date')
		});

		$('.btn.export').click(function(event) {
			event.preventDefault();
			$('.filter-drop').not(exportForm).hide();
			exportForm.toggle();
		});

//		exportControls.find(cal.options.filter.boxSelector).toggle()
		//
		// Form listener for exporter - brings up a dialog box that offers a URL
		// to click.
        $('#download-calendar-export').click(function(event) {
            event.preventDefault();
            var form = $(event.target).closest('form');
            window.location = $.getExportCalendarLink('{USER_TOKEN}', form.serializeArray())+'&format=csv';
        });


		$('#calendar-export form').submit(function(event) {
			event.preventDefault();

            // Copy and paste button - show only when ready
            var button = $('#copy-button').hide();
            var client = new ZeroClipboard(button);
            client.on('ready', function() {
                button.show();
            });

            var form = $(this);
			$('#calendar-export-dialog').dialog({
				open: function(event, ui) {
					$(event.target).find('#calendar-export-dialog-url')
							.text($.getExportCalendarLink('{USER_TOKEN}', form.serializeArray()));
				},
				minWidth: 400,
				modal: true
			});
		});


		$('.filter-cat.sources').selectAll({
			key: 'selectallsources',
			checkboxName: 'source',
			change: function() {
				$('input[name=source]').change();
			}
		});

		$('.filter-cat.groups').selectAll({
			key: 'selectallgroups',
			checkboxName: 'group',
			change: function() {
				$('input[name=group]').change();
			}
		});

		$('.filter-cat.campus').selectAll({
			key: 'selectallcampuses',
			checkboxName: 'campus',
			change: function() {
				$('input[name=campus]').change();
			}
		});

		$('.filter-cat.events').selectAll({
			key: 'selectalleventtypes',
			checkboxName: 'events',
			change: function() {
				$('input[name=events]').change();
			}
		});

        $(document).on('click', 'a.attendance-request', function (event) {
            event.preventDefault();

            var button = $(this);

            var data = button.parent('form').serialize();

            $.post('/service/attendance/processToggleAttendance', data, function (data) {
                if (data.error == undefined) {
                    if (button.text() == 'RSVP') {
                        button.html('<span></span>Unattend');
                    }
                    else {
                        button.html('<span></span>RSVP');
                    }
                }
            });
        });

	});
</script>

<div class="navHelp">
	<h1>Calendar for {USER_FULLNAME}</h1>
</div>

<div id="calendar-export" class="calendar-controls no-height clearfix">
	<div class="link-case">
        <div class="filter-drop clearfix">
            <div class="filter-list">
                <form class="clearfix">
                    <div class="export-cat all-events">
                        <label title="All events" for="export-all">
                            <input type="radio" name="export" value="all" id="export-all" checked />
                            All events
                        </label>
                    </div>
                    <div class="export-cat personal-events">
                        <label title="Personal events only" for="export-personal">
                            <input type="radio" name="export" value="personal" id="export-personal" />
                            Personal events only
                        </label>
                    </div>
                    <div class="export-cat group-events">
                        <label title="Events for group" for="export-group">
                            <input type="radio" name="export" value="group" id="export-group" />
                            Events for group:
                            <select name="group">
                                <option value="">-- select --</option>
                                <!-- BEGIN export_group -->
                                <option label="{EXPORT_GROUP_NAME}" value="{EXPORT_GROUP_ID}">{EXPORT_GROUP_NAME}</option>
                                <!-- END export_group -->
                            </select>
                        </label>
                    </div>
                    <div class="export-cat campus-events">
                        <label title="Events for campus" for="export-campus">
                            <input type="radio" name="export" value="campus" id="export-campus" />
                            Events for campus:
                            <select name="campus">
                                <option value="">-- select --</option>
                                <!-- BEGIN export_campus -->
                                <option label="{EXPORT_CAMPUS_NAME}" value="{EXPORT_CAMPUS_ID}">{EXPORT_CAMPUS_NAME}</option>
                                <!-- END export_campus -->
                            </select>
                        </label>
                    </div>
                    <div class="export-cat timetable-events">
                        <label title="Timetable Classes" for="export-timetable">
                            <input type="radio" name="export" value="timetable" id="export-timetable" />
                            Timetable Classes
                        </label>
                    </div>
                    <div class="export-cat timetableday-events">
                        <label title="Timetable days" for="export-timetableday">
                            <input type="radio" name="export" value="timetabledays" id="export-timetableday" />
                            Timetable Days
                        </label>
                    </div>
                    <div class="export-cat duework-events">
                        <label title="Due Work" for="export-duework">
                            <input type="radio" name="export" value="duework" id="export-duework" />
                            Due Work
                        </label>
                    </div>
                    <input type="submit" id="open-calendar-export-dialog" value="Generate URL" class="submit-btn-plain" />
                    <input type="submit" id="download-calendar-export" value="Download CSV" class="submit-btn-plain" />
                </form>
            </div>
        </div>
	</div>
</div>
<div id="calendar-export-dialog">
    <div id="calendar-export-dialog-text">
        Use the following address to subscribe your favourite calendar application to a live feed.
    </div>
    <textarea readonly id="calendar-export-dialog-url" rows="6"></textarea>
    <button class="btn no-icon" id="copy-button" data-clipboard-target="calendar-export-dialog-url" title="Click to copy me.">Copy to Clipboard</button>
</div>
<div id="calendar-list" class='printEventList' data-eventlist="true">
	<div class="calendar-controls">
		<div class="link-case">
			<div class="filter-drop clearfix">
				<div class="filter-list">
					<form class="clearfix">
						<div class="filter-cat sources clearfix checkboxes"><span class="filter-title">Sources</span>
							<label>
								<input data-selectallsources='true' type="checkbox" class="checkbox" checked/>Select all
							</label>
							<!-- BEGIN filter_source -->
							<label title="{SOURCE_NAME}">
                                <input type="checkbox" name="source" id="{SOURCE_ID}" value="source{SOURCE_ID}" {SOURCE_ID_SELECTED} class="checkbox applyFilters"/>
                                {SOURCE_NAME}
							</label>
							<!-- END filter_source -->
						</div>
						<div class="filter-cat groups clearfix checkboxes"><span class="filter-title">Groups</span>
							<label>
								<input data-selectallgroups='true' type="checkbox" class="checkbox" checked/>Select all
							</label>
							<!-- BEGIN filter_group -->
							<label title="{GROUP_NAME}">
								<input type="checkbox" name="group" id="{GROUP_ID}" value="group{GROUP_ID}" {GROUP_ID_SELECTED} class="checkbox applyFilters"/>
								{GROUP_NAME}
							</label>
							<!-- END filter_group -->
						</div>
						<div class="filter-cat campus checkboxes"><span class="filter-title">Campus</span>
							<label>
								<input data-selectallcampuses='true' type="checkbox" class="checkbox" checked/>Select all
							</label>
							<!-- BEGIN filter_campus -->
							<label title="{CAMPUS_NAME}">
								<input type="checkbox" name="campus" id="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="campus{CAMPUS_ID}" class="checkbox applyFilters"/>
								{CAMPUS_NAME}
							</label>
							<!-- END filter_campus -->
						</div>
						<div class="filter-cat events checkboxes last"><span class="filter-title">Event</span>
							<label>
								<input data-selectalleventtypes='true' type="checkbox" class=" checkbox" checked/>Select all
							</label>
							<!-- BEGIN filter_event_type -->
							<label title="{EVENT_TYPE_NAME}">
								<input type="checkbox" name="events" id="{EVENT_TYPE_ID}" {EVENT_TYPE_ID_SELECTED} value="type{EVENT_TYPE_ID}" class="checkbox applyFilters"/>
								<span style="background-color:#{EVENT_TYPE_COLOUR};">{EVENT_TYPE_NAME}</span>
							</label>
							<!-- END filter_event_type -->
						</div>
						<!--/filter-list-->
					</form>
					<!--/filter-drop-->
				</div>
			</div>
		</div>
        <div class="float-right">
        <a href="#" class="btn list" data-filters="true"><span></span>Filters</a>
        <a href="#" class='active'><span></span>List</a>
        <a href="/calendar/full/{CALENDAR_PARAMS}#month" class='btn small no-icon'><span></span>Month</a>
        <a href="/calendar/full/{CALENDAR_PARAMS}#agendaWeek" class='btn small no-icon'><span></span>Week</a>
        <a href="/calendar/full/{CALENDAR_PARAMS}#agendaDay" class='btn small no-icon'><span></span>Day</a>
        <a href="#" class='btn export'><span></span>Export</a>
        </div>
        <form data-type='calendar-controls' action="/calendar/list" method="post">
			<input type="hidden" name='userKey' value='{USER_ID}' />
            <input id="start_date_alt" name='start_date' type="hidden" value="{SELECTED_FORMATTED_START}" />
            <input id="finish_date_alt" name='finish_date' type="hidden" value="{SELECTED_FORMATTED_FINISH}" />

            <div class="float-left dateSelector">
                <input id='start_date' type="text" size="9" value="{SELECTED_START}" />
                to <input id='finish_date' type="text" size="9" value="{SELECTED_FINISH}" />
            </div>

            <input type="submit" class="submit-btn-plain" value="Update" />
        </form>
    </div>
	<div class="clearfix"></div>

	<!-- BEGIN date -->
	<h2>{EVENT_DATE}</h2>
	<ul class="js_happening calendar">
		<!-- BEGIN event -->
            {TWIG_EVENT}
		<!-- END event -->
	</ul>
	<!-- END date -->

	<!-- BEGIN has_no_events -->
	<p>
		There are no events.
	</p>
	<!-- END has_no_events -->
</div>
