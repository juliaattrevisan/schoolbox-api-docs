<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/datetime/jquery.sync-dates.js"></script>
<script type="text/javascript" src="/calendar/js/jquery.filterSelector.js"></script>
<script type="text/javascript" src="/javascript/shared/select-all/jquery.select-all.js"></script>
<script type="text/javascript" src="/javascript/components/zeroclipboard/dist/ZeroClipboard.min.js"></script>
<script type="text/javascript" src="/javascript/shared/jquery.clipboard-selector.js"></script>
<script type="text/javascript" src="/javascript/shared/calendar/jquery.calendar.js"></script>
<script type="text/javascript">
	$(function() {
		var exportForm = $('#calendar-export-form-container');

		$('[data-filters="true"]').filterSelector({
			filterContainer: '#calendar-controls',
			eventContainer: $('[data-eventlist="true"]'),
			exportContainer: exportForm
		})

        /* Calendar controls
         */
        $('[data-filters]').click(function() { $('#calendar-controls').foundation('reveal','open') });
        $('[data-export]').click(function() { $('#calendar-export-form-container').foundation('reveal','open') });

        $('[data-type=calendar-controls]').submit(function(event) {
            event.preventDefault();

            var id = $('[data-type=calendar-controls]').find('input[name=userKey]').val();
            var start_date = $('[data-type=calendar-controls]').find('input[name=start_date]').val();
            var finish_date = $('[data-type=calendar-controls]').find('input[name=finish_date]').val();

            var url = '/calendar/list/' + id + '/' + start_date + '/' + finish_date;

            window.location.href = url;
        });

		/* date picker */
		$('#start_date').datepicker({
			constrainInput: false,
            altField: '#start_date_alt',
            altFormat: 'dd-mm-yy',
			onClose: function (string) {
				var input = $(this);
				$.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
					input.val(data.time);
				})
			}
		});
        
        /* date picker */
        $('#finish_date').datepicker({
            constrainInput: false,
            altField: '#finish_date_alt',
            altFormat: 'dd-mm-yy',
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });
        
		$('#start_date').syncDates({
			endDate: $('#finish_date')
		});

		//
		// Form listener for exporter - brings up a dialog box that offers a URL
		// to click.
        $('#download-calendar-export').click(function(event) {
            event.preventDefault();
            var form = $(event.target).closest('form');
            window.location = $.fn.getExportCalendarLink('{USER_TOKEN}', form.serializeArray())+'&format=csv';
        });

        //select all clicked
        $('#calendar-controls').on('change','.select_all', function(e) {
            $(this).parent().find(':checkbox').prop('checked', $(this).prop('checked'));
        });

        /* Export calendar
         */
        $.fn.clipboardSelector({
            exportActivator: '#open-calendar-export-dialog',
            onReady: function() {
                var form = $('#calendar-export-form');
                var url = $.fn.getExportCalendarLink('{USER_TOKEN}', form.serializeArray());

                var dialog = $('#calendar-export-dialog');
                var dialogUrl = $('#calendar-export-dialog-url');

                /* Bypass foundation bug
                 * https://github.com/zurb/foundation/issues/4746
                 */
                dialogUrl.val(url);
                dialog.foundation('reveal', 'open');

                dialog.on('opened.fndtn.reveal', function() {
                    dialogUrl.select();
                });
            },
            onZeroClipboardReady: function() {
                $('#copy-button').show();
            }
        });

        /* Attendance
         */
        $('#calendar-list').calendarAttendance();
	});
</script>
<!-- END custom_head -->

<div id="calendar-export-form-container" class="reveal-modal small" data-reveal aria-hidden="true" role="dialog">
    <form class="top" action="#" id="calendar-export-form">
        <section>
            <fieldset class="content radiolist">
                <input type="radio" name="export" value="all" id="export-all" checked />
                <label for="export-all" class="c">All events</label>
                <input type="radio" name="export" value="personal" id="export-personal" />
                <label for="export-personal">Personal events only</label>
                <input type="radio" name="export" value="timetable" id="export-timetable" />
                <label for="export-timetable">Timetable Classes</label>
                <input type="radio" name="export" value="timetabledays" id="export-timetableday" />
                <label for="export-timetableday">Timetable Days</label>
                <input type="radio" name="export" value="duework" id="export-duework" />
                <label for="export-duework">Due Work</label>
                <input type="radio" name="export" value="campus" id="export-campus" />
                <label for="export-campus">Events for campus:
                    <select name="campus">
                        <option value="">-- select --</option>
                        <!-- BEGIN export_campus -->
                        <option label="{EXPORT_CAMPUS_NAME}" value="{EXPORT_CAMPUS_ID}">{EXPORT_CAMPUS_NAME}</option>
                        <!-- END export_campus -->
                    </select>
                </label>
                <input type="radio" name="export" value="group" id="export-group" />
                <label for="export-group">Events for group:
                    <select name="group">
                        <option value="">-- select --</option>
                        <!-- BEGIN export_group -->
                        <option label="{EXPORT_GROUP_NAME}" value="{EXPORT_GROUP_ID}">{EXPORT_GROUP_NAME}</option>
                        <!-- END export_group -->
                    </select>
                </label>
            </fieldset>
        </section>
        <input type="submit" id="open-calendar-export-dialog" value="Generate URL"  />
        <input type="submit" id="download-calendar-export" value="Download CSV"/>
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div class="reveal-modal" data-reveal aria-labelledby="firstModalTitle" aria-hidden="true" role="dialog" id="calendar-export-dialog">
    <div id="calendar-export-dialog-text">
        Use the following address to subscribe your favourite calendar application to a live feed.
    </div>
    <textarea readonly id="calendar-export-dialog-url" rows="6"></textarea>
    <button id="copy-button" data-clipboard-target="calendar-export-dialog-url" class="button icon-copy">Copy to Clipboard</button>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="calendar-controls" class="reveal-modal large" data-reveal aria-hidden="true" role="dialog">
    <form class="clearfix">
        <section>
            <fieldset class="content filter-list">
                <div class="small-6 large-3 columns">
                    <fieldset class="checklist sources">
                        <legend>Sources</legend>
                        <input type="checkbox" class="select_all" id="sourceSelectAll"/>
                        <label for="sourceSelectAll">Select all</label>
                        <!-- BEGIN filter_source -->
                        <input type="checkbox" name="source" id="source{SOURCE_ID}" value="source{SOURCE_ID}" {SOURCE_ID_SELECTED} class="applyFilters"/>
                        <label for="source{SOURCE_ID}">{SOURCE_NAME}</label>
                        <!-- END filter_source -->
                    </fieldset>
                </div>
                <div class="small-6 large-3 columns">
                    <fieldset class="checklist groups">
                        <legend>Groups</legend>
                        <input type="checkbox" class="select_all" id="groupsSelectAll" checked />
                        <label for="groupsSelectAll">Select all</label>
                        <!-- BEGIN filter_group -->
                        <input type="checkbox" name="group" id="group{GROUP_ID}" value="group{GROUP_ID}" {GROUP_ID_SELECTED} class="applyFilters"/>
                        <label for="group{GROUP_ID}">{GROUP_NAME}</label>
                        <!-- END filter_group -->
                    </fieldset>
                </div>
                <div class="small-6 large-3 columns">
                    <fieldset class="checklist campus">
                        <legend>Campus</legend>
                        <input type="checkbox" class="select_all"  id="campusSelectAll" checked />
                        <label for="campusSelectAll">Select all</label>
                        <!-- BEGIN filter_campus -->
                        <input type="checkbox" name="campus" id="campus{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="campus{CAMPUS_ID}" class="applyFilters"/>
                        <label for="campus{CAMPUS_ID}">{CAMPUS_NAME}</label>
                        <!-- END filter_campus -->
                    </fieldset>
                </div>
                <div class="small-6 large-3 columns">
                    <fieldset class="checklist events">
                        <legend>Event</legend>
                        <input type="checkbox" id="eventTypeSelectAll" class="select_all" checked />
                        <label for="eventTypeSelectAll">Select all</label>
                        <!-- BEGIN filter_event_type -->
                        <input type="checkbox" name="events" id="eventType{EVENT_TYPE_ID}" {EVENT_TYPE_ID_SELECTED} value="type{EVENT_TYPE_ID}" class="applyFilters"/>
                        <label for="eventType{EVENT_TYPE_ID}"><span style="background-color:#{EVENT_TYPE_COLOUR};">{EVENT_TYPE_NAME}</span></label>
                        <!-- END filter_event_type -->
                    </fieldset>
                </div>
            </fieldset>
        </section>
    </form>
    <a href="#" id="applyFilters" class="button icon-tick">Apply Filters</a>
    <!--/filter-drop-->
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div class="row">
    <div class="small-12 columns">
        <h1>Calendar for {USER_FULLNAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form data-type='calendar-controls' action="/calendar/list" method="post">
            <input type="hidden" name='userKey' value='{USER_ID}' />
            <section class="content">
                <fieldset>
                    <div class="small-12 large-6 column">
                        <div class="row">
                            <div class="small-4 columns">
                                <input id="start_date_alt" type="hidden" name='start_date' value="{SELECTED_FORMATTED_START}" />
                                <input id='start_date' type="text" size="9" value="{SELECTED_START}" />
                            </div>
                            <div class="small-4 columns">
                                <input id="finish_date_alt" name='finish_date' type="hidden" value="{SELECTED_FORMATTED_FINISH}" />
                                <input id='finish_date' type="text" size="9" value="{SELECTED_FINISH}" />
                            </div>
                            <div class="small-4 columns">
                                <input type="submit" value="Update" />
                            </div>
                        </div>
                    </div>
                    <div class="small-12 large-6 column">
                        <ul class="sub-nav">
                            <li><a href="#" class="button icon-filter" data-filters>Filters</a></li>
                            <li><a href="#" class='button active'>List</a></li>
                            <li><a href="/calendar/full/{CALENDAR_PARAMS}#month" class='button'>Month</a></li>
                            <li><a href="/calendar/full/{CALENDAR_PARAMS}#agendaWeek" class='button'>Week</a></li>
                            <li><a href="/calendar/full/{CALENDAR_PARAMS}#agendaDay" class='button'>Day</a></li>
                            <li><a href="#" class='button icon-export' data-export>Export</a></li>
                        </ul>
                    </div>
                </fieldset>
            </section>
        </form>
    </div>
</div>

<div class="row" data-eventlist="true">
    <div class="small-12 island">
        <!-- BEGIN date -->
        <h2 class="subheader">{EVENT_DATE}</h2>
        <section>
            <ul class="calendar-list">
            <!-- BEGIN event -->
                {TWIG_EVENT}
            <!-- END event -->
            </ul>
        </section>
        <!-- END date -->

        <!-- BEGIN has_no_events -->
        <div class="alert-box">
            There are no upcoming events.
        </div>
        <!-- END has_no_events -->
    </div>
</div>
