<div class="box">
<h2>Calendar <!-- BEGIN count -->({EVENT_DISP_COUNT} / {EVENT_COUNT})<!-- END count --></h2>
<ul class="information-list">
<!-- BEGIN event -->
	<li>
		<a href="/calendar/full/{EVENT_DATE}">
        	<img class="thumbnail" height="64" width="64" src="images/icons/60x60/event.png" />
			<h4>{EVENT_TITLE}</h4>
		</a>
		<p class="meta">{EVENT_DATE} {EVENT_TIME}</p>
		<p class="meta">{EVENT_LOCATION}</p>
		<p>{EVENT_TYPE}: {EVENT_DETAIL}</p>
	</li>
<!-- END event -->
</ul>
<!-- BEGIN see_more -->
<p class="interact">
	<a rel="event" id="event-more" class="btn more" href="#"><span></span>See all {MORE_COUNT} results for Events</a>
</p>
<!-- END see_more -->
<div class="archive">
    <div class="pagination">
        <!-- BEGIN pagination -->
        <a href="javascript:void(0);" rel="{PAGE_NUMBER}" class="{PAGE_CLASS}">{PAGE_NAME}</a>
        <!-- END pagination -->
    </div>
</div>
</div>
