<head>
<title>{TITLE}</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Content-Language" content="en-au" />
<meta name="author" content="Alaress Pty Ltd"/>
<meta name="application-name" content="Schoolbox" />
<meta name="msapplication-TileColor" content="#0066b0" />
<meta name="msapplication-square70x70logo" content="/images/{SITE_LOCATION}/smalltile.png" />
<meta name="msapplication-square150x150logo" content="/images/{SITE_LOCATION}/mediumtile.png" />
<meta name="msapplication-wide310x150logo" content="/images/{SITE_LOCATION}/widetile.png" />
<meta name="msapplication-square310x310logo" content="/images/{SITE_LOCATION}/largetile.png" />
<meta name="viewport" content="initial-scale=1, maximum-scale=1">
<link rel="apple-touch-icon" sizes="57x57" href="/images/{SITE_LOCATION}/apple-touch-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="/images/{SITE_LOCATION}/apple-touch-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="/images/{SITE_LOCATION}/apple-touch-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="/images/{SITE_LOCATION}/apple-touch-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/images/{SITE_LOCATION}/apple-touch-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="/images/{SITE_LOCATION}/apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/images/{SITE_LOCATION}/apple-touch-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="/images/{SITE_LOCATION}/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/{SITE_LOCATION}/apple-touch-icon-180x180.png">
{MAIN_HEADER_REGION}
{CUSTOM_HEADER_REGION}
</head>
<body>
	<div class="off-canvas-wrap" data-offcanvas>
	  <div class="inner-wrap">

		<!-- The Schoolbox Hybrid Bar -->
		<div class="hybrid-bar">
		    <nav class="tab-bar">
				<section class="left-small">
					<a class="left-off-canvas-toggle menu-icon" href="#"><span></span></a>
				</section>

				<section class="middle tab-bar-section">
					<h1 class="title">Schoolbox</h1>
				</section>

				<section class="right-small">
					<a class="right-off-canvas-toggle menu-icon" href="#"><span></span></a>
				</section>
		    </nav>
	    </div>

	    <aside class="left-off-canvas-menu">
	    	<a href="/" class="logo">
	    		<img src="/images/{SITE_LOCATION}/logo.png" height="34" width="172" alt="{SITE_NAME}"/>
    		</a>
	    	{MAIN_NAV_REGION}
	    </aside>

	    <aside class="right-off-canvas-menu">
			<ul class="off-canvas-list">
				<li><label>Notifications</label></li>
				<li><a href="#">Notification 1</a></li>
				<li><a href="#">Notification 2</a></li>
				<li><a href="#">Notification 3</a></li>
			</ul>
	    </aside>

		<!-- START CONTAINER -->
	    <section class="main-section">
			<div id="header" class="core">
				{MAIN_BANNER_REGION}
			</div>

			<div id="container" class="clearfix">
				<div id="content" class="clearfix"> {MAIN_CONTENT_REGION} </div>
			</div>

			<div class="cal-bubble wysiwyg">
				<div class="middle">
					<div class="close">x</div>
					<div class="js-data clearfix"></div>
					<div class="bottom"><strong></strong></div>
				</div>
			</div>
			{MAIN_FOOTER_REGION}
			{DEBUGBAR_HEAD}
			{DEBUGBAR}
	    </section>
		<!-- END CONTAINER -->
		
		<a class="exit-off-canvas"></a>

	  </div>
	</div>
</body>
</html>
