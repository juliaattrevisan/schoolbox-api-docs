<aside class="right-off-canvas-menu island no-pad" id="msgs" data-unread="{WEBSOCKET_UNREAD_COUNT}">
    <ul class="off-canvas-list" id="message-list">
        <li>
            <label>Notifications</label>
        </li>
        <li>
            <a id="msg-mar" class="mark-all-read button icon-approve" href="#">Mark all read</a>
        </li>
        <li>
            <section>
                <ul id="msg-content" class="action-list no-pad">
                    <!-- messages generated by js: this is the template -->
                    <li class="row" data-msgitem data-equalizer>
                        <div class="column small-10 no-pad">
                            <div class="avatar card wrap-down">
                                <a class="no-pad" data-msgitem-href>
                                    <img data-msgitem-thumb />
                                    <p data-msgitem-title></p>
                                    <p class="meta spaced" data-msgitem-time></p>
                                </a>
                            </div>
                        </div>
                        <div class="one actions">
                            <a data-msgitem-ack class="icon-approve no-text" title="Mark as read"></a>
                        </div>
                    </li>
                    <!-- /template -->
                </ul>
            </section>
        </li>
        <li>
            <a href="/messages" class="button" data-msgfooter-action>
                <span class="connecting"></span>&nbsp;Connecting&hellip;
            </a>
        </li>
    </ul>
</aside>
<div id="alert-dialog" class="open content" style="display:none;">
  <div class="msg-tray">
    <ul class="messages content">
      <li class="msg tpl" id="m">
        <a class="action" href="#">
          <img width="32" height="32" src="">
          <span class="descript"></span>
        </a>
      </li>
    </ul>
  </div>
</div>
<script type="text/javascript">
  $(function () {
    // launch the notifier
    $('#msgs').notifier({
      host:     '{WEBSOCKET_HOST}',
      port:     '{WEBSOCKET_PORT}',
      path:     '{WEBSOCKET_PATH}',
      secure:   '{PAGE_SECURE}',
      maxstack: '{WEBSOCKET_STACK_LIMIT}'
    });

    $('#alert-dialog').on('click', 'a.action', function (e) {
      e.preventDefault();
    })
  });
</script>
