<!-- BEGIN banner_logged_in -->
<ul id="infoPanel">
  <li class="user first">
    <a href="/search/user/{USER_ID}" title="View Profile" data-menu="account-menu">
      <span>{SITE_LOGINNAME}</span>
      <img height="32" width="32" alt="View Profile" src="/portrait.php?userId={EXTERNAL_ID}&size=square32"/>
    </a>
    <ul id="account-menu" class="flyout-menu">
      <li>
        <a href="/search/user/{USER_ID}">Profile</a>
      </li>
      <li>
        <a href="/settings/messages">Settings</a>
      </li>
      <li>
        <a href="/logout.php">Logout</a>
      </li>
    </ul>
  </li>
  {INSTANTMESSAGE_BLOCK}
</ul>
<script type="text/javascript">
  $j(document).ready(function() {

    // when an infopanel flyout link is clicked
    $j('#infoPanel').on('click', 'a[data-menu]', function(e) {
      e.preventDefault();

      var html = $j('html');
      var btn = $j(this);
      var menuref = '#' + btn.attr('data-menu');
      var menu = $j(menuref);
      var list = btn.parent('li');

      var fn = function(event) {
        // if we clicked somewhere on the menu, just reattach the listener
        if($j(event.target).closest(menuref).length == 1) {
          html.one('click', fn);
        }
        // we clicked elsewhere (including the button itself), so close the flyout
        else {
          list.removeClass('open');
        }
      }

      // is already open
      if(list.hasClass('open')) {
        // we've clicked on the button, which is already open - the html listener should close it for us.....
        return true;
      }

      // trigger a click on the document, so that if a flyout is open it gets closed
      html.trigger('click');

      // is not open: attach a close listener for this
      html.one('click', fn);

      // open it
      list.addClass('open');
      return false;
    });
  });
</script>
<form id="search" action="/search.php" method="get">
    <fieldset>
        <input id="search-field" type="text" name="keyword" placeholder="Search"/>
        <input id="search-button" type="submit" value="Search"/>
    </fieldset>
</form>
<!-- END banner_logged_in -->
<a href="/" class="logo"><img src="/images/{SITE_LOCATION}/logo.png" alt="{SITE_NAME}"/></a>
