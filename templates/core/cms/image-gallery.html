{BREADCRUMB}

<div class="row">
	<div class="small-12 island">
		<h1>Image Gallery for {FOLDER_NAME}</h1>
		<section class="content">
			<ul class="img-gallery" data-image-lightbox="lightbox[image-gallery]">
				<!-- BEGIN image_gallery -->
				<li>
                    <a href="/cms/image.php?id={THUMBNAIL_ID}&height=2048&width=2048" rel="lightbox[image-gallery]" title="{THUMBNAIL_DESCRIPTION}">
                        <img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0" alt="{THUMBNAIL_DESCRIPTION}" />
                    </a>
				</li>
				<!-- END image_gallery -->
			</ul>
            <script>
                if (window.sbProps.lightGalleryInit) { window.sbProps.lightGalleryInit(); }
            </script>
		</section>
	</div>
</div>
