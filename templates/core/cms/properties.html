<script type="text/javascript" src="/javascript/jquery.js"></script>
<script type="text/javascript">
	$(function() {
		$('#properties tr:even').css({'background-color':'#eeeeee'});				 
	});
</script>
<style type="text/css">
#properties td {
	width: 50%;
	font-family: Verdana, Geneva, sans-serif;
	font-size: 12px;
	padding: 5px;
}
#properties td.bold {
	font-weight: bold;
}
</style>
  <table id="properties">
    <tr>
      <td class='bold'>Description</td>
      <td>{DESCRIPTION}</td>
    </tr>
    <tr>
      <td class='bold'>Category</td>
      <td>{CATEGORY}</td>
    </tr>
    <!-- BEGIN realname -->
    <tr>
      <td class='bold'>Filename</td>
      <td>{REALNAME}</td>
    </tr>
    <!-- END realname -->
    <!-- BEGIN link -->
    <tr>
      <td class='bold'>URL</td>
      <td>{URL}</td>
    </tr>
    <!-- END link -->
    <tr>
      <td class='bold'>Owner</td>
      <td><a href="/search/user/{OWNER_ID}">{OWNER}</a></td>
    </tr>
    <tr>
      <td class='bold'>Created</td>
      <td>{CREATED}</td>
    </tr>
    <!-- BEGIN file -->
    <tr>
      <td class='bold'>Size</td>
      <td>{SIZE} KB</td>
    </tr>
    <tr>
      <td class='bold'>Mime Type</td>
      <td>{MIME_TYPE}</td>
    </tr>
    <!-- END file -->
    <tr>
      <td class='bold'>Hidden</td>
      <td>{HIDDEN}</td>
    </tr>
    <tr>
      <td class='bold'>Comment</td>
      <td>{COMMENT}</td>
    </tr>
	<tr><td class="bold">Direct Link</td><td><a href="{LINK}">Click Here</a></td></tr>
  </table>
