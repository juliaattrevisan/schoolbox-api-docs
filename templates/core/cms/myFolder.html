<!-- BEGIN custom_head -->
<script language="JavaScript" type="text/javascript">
function verify(){
	var msg = ""
	//check that description, url, location have been entered
	if(document.getElementById('folderForm').name.value == ""){
		msg += "You need to enter a name\n";
	}
	if(document.getElementById('folderForm').parent.value == "" || isNaN(document.getElementById('folderForm').parent.value)) {
		msg += "You need to select a proper location";
	}
	if(msg != ""){
		alert(msg);
		return false;
	}
	else
		return true;
}
</script>
<!-- END custom_head -->

<h1>{ACTION} Folder</h1>
<form action="/cms/myFolderForm.php" method="post" class="standardForm" id="folderForm" onSubmit="return(verify());">
  <table>
    <tr>
      <td class="formLabelWidth"><h2>Folder Name</h2></td>
      <td><input type="text" name="name" maxlength="250" size="40" value="{NAME}" />
      </td>
    </tr>
    <tr>
      <td><h2>Folder Parent</h2>
        <em>Location at which this folder should be placed</em></td>
      <td><select name="parent">
          <!-- BEGIN parent_list -->
          <option value="{PARENT_ID}" {PARENT_ID_SELECTED}>{PARENT_NAME}</option>
          <!-- END parent_list -->
        </select></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td> <input type="hidden" name="folderID" value="{FOLDER_ID}" /> 
        <input type="submit" label="Submit" name="submit" value="{ACTION} Folder" class="btn"/>
      </td>
    </tr>
  </table>
</form>
