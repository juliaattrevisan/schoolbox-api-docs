<!-- BEGIN custom_head -->
<script language="JavaScript" type="text/javascript">
$(function() {
	$('#folderForm').alaressValidate();
});
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <h1>{ACTION} Folder</h1>

        <form action="/cms/myFolderForm.php" method="post" class="clearfix" id="folderForm" >
            <input type="hidden" name="parent" id="parent" value="{PARENT_ID}" />
            <input type="hidden" name="folderID" value="{FOLDER_ID}" />
            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label for="folder-name">Folder Name</label>
                        <input id="folder-name" type="text" name="name" class="required" maxlength="100" size="40" value="{NAME}" />
                    </div>

                    <!-- BEGIN location -->
                    <div class="small-12 columns">
                        <label for="folder-parent">Parent</label>
                        <select id="folder-parent" name="parent">
                            <!-- BEGIN parent_list -->
                            <option value="{PARENT_ID}" {PARENT_SELECTED}>{PARENT_INDENT}&gt; {PARENT_NAME}</option>
                            <!-- END parent_list -->
                        </select>
                    </div>
                    <!-- END location -->
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" name="submit" value="{ACTION} Folder" />
                </div>
            </div>
        </form>
    </div>
</div>
