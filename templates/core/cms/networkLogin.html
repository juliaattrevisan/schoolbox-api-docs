<h1>Network Drives Login</h1>

<p>
	Please enter your password to access Network Drives.
</p>

<form action="{SELF}" method="post" id="network-login">
	<table class="standardForm table">
		<tr>
			<td class="formLabelWidth">
				<h4>Username</h4>
			</td>
			<td>
				{NETWORK_DRIVES_USERNAME}
			</td>
		</tr>
		<tr>
			<td class="formLabelWidth">
				<h4>Password</h4>
			</td>
			<td>
				<input type="password" name="password" value="" />
			</td>
		</tr>
	</table>

	<input type="submit" class='submit-btn-plain' value="Submit" />
</form>
<!-- BEGIN lite -->
<script type="text/javascript">
    $(function () {

        $('#network-login').on('submit', function (e) {
            var form = $(this),
                data = form.serialize();

            e.preventDefault();

            form.find('input').attr('disabled', 'disabled');

            $.post(this.action, data, function () {
                var explorer = form.closest('.explorer');
                explorer.load(explorer.data('url'));
            });
        });

    });
</script>
<!-- END lite -->
