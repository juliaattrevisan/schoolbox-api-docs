<div class="row">
    <div class="small-12 columns">
        <h1>Network Drives Login</h1>

        <div class="alert-box">
            <p>
                Please enter your password to access Network Drives.
            </p>
        </div>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="{SELF}" method="post" id="network-login">
            <section>
                <fieldset class="content">
                    <legend></legend>
                    <div class="small-12 columns">
                        <label>
                            Username
                        </label>

                        <p>{NETWORK_DRIVES_USERNAME}</p>

                        <label>
                            Password
                            <input type="password" name="password" value="" />
                        </label>
                    </div>
                </fieldset>
            </section>

            <input type="submit" value="Submit" />
        </form>
    </div>
</div>

<!-- BEGIN lite -->
<script type="text/javascript">
    $(function () {
        $('#network-login').on('submit', function (e) {
            e.preventDefault();

            var form = $(this),
                data = form.serialize();

            form.find('input').attr('disabled', true);

            $.post(this.action, data, function () {
                var explorer = form.closest('.explorer');
                explorer.load(explorer.data('url'));
            });
        });
    });
</script>
<!-- END lite -->
