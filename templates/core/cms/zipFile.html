<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<!-- END custom_head -->
<ul class="breadcrumb">
	<li><a href="/homepage/{ID}/">{CATEGORY_NAME}</a></li>
	<li class="active"><a href="#">Upload Zip</a></li>
</ul>

<div class="row">
	<div class="small-12 island">
		<h1>Upload Zip</h1>
		<form action="/cms/zipFileForm.php" method="post" id="zipUpload" enctype="multipart/form-data" class="top">
			<section>
				<fieldset class="content">
					<div class="small-12 columns">
						<label>Upload
							<span data-tooltip class="hint has-tip tip-top" data-width="200" title="Upload a zip file and it will be extracted into folders and files">?</span>
							{ATTACH_ZONE}
						</label>
					</div>
				</fieldset>
				<fieldset class="content">
					<legend>Default Permissions
						<span data-tooltip class="hint has-tip tip-top" data-width="200" title="Allow predefined roles of users access folders created by this extraction">?</span>
					</legend>
					<div class="small-12 columns">
						<table>
								<tr>
									<th>Role</th>
									<th>None</th>
									<th>Read</th>
									<th>Write</th>
								</tr>
								<!-- BEGIN perm_table -->
								<tr>
									<td>{GROUP_NAME}</td>
									<td>
										<input type="radio" class="no_permission" name="group[{GROUP_ID}]" id="groupNone{GROUP_ID}" value="0" {PERM_0_SELECTED} />
										<label for="groupNone{GROUP_ID}" class="radio-label"></label>
									</td>
									<td>
										<input type="radio" name="group[{GROUP_ID}]" id="groupRead{GROUP_ID}" value="1" {PERM_1_SELECTED} />
										<label for="groupRead{GROUP_ID}" class="radio-label"></label>
									</td>
									<td>
										<input type="radio" name="group[{GROUP_ID}]" id="groupWrite{GROUP_ID}" value="2" {PERM_2_SELECTED} />
										<label for="groupWrite{GROUP_ID}" class="radio-label"></label>
									</td>
								</tr>
								<!-- END perm_table -->
						</table>
					</div>
				</fieldset>
			</section>
			<div class="row">
				<div class="small-12 column">
					<input type="hidden" name="category" value="{CID}" />
					<input type="submit" value="Upload" />
				</div>
			</div>
		</form>
	</div>
</div>
