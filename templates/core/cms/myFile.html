<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">

$(function() {
	$('#fileForm').validate();
});
</script>
<!-- END custom_head -->

{BREADCRUMB}

<h1>{ACTION} File </h1>
<form method="post" action="/cms/myFileForm.php" enctype="multipart/form-data" id="fileForm" class="clearfix">
	<input type="hidden" name="parent" value="{PARENT_ID}"/>
  <input type="hidden" name="user" value="{USER_ID}" />
	<input type="hidden" name="component_instance_id" value="{COMPONENT_INSTANCE_ID}" />

	<table class="standardForm table">
        <tr>
            <td class="formLabelWidth">
                <h4>Description</h4>
                <em>One line description of the file for use as the title</em>
            </td>
            <td>
                <label>
                    <input type="text" name="description" maxlength="100" size="40" class="required" value="{DESCRIPTION}"/>
                </label>
            </td>
        </tr>
		<!-- BEGIN browse_row -->
		<tr>
			<td>
				<h4>File</h4>
			</td>
			<td>
				{ATTACH_ZONE}
			</td>
		</tr>
		<!-- END browse_row -->
		<tr>
			<td>
				<h4>Location</h4>
				<em>Select an appropriate location within the system that reflects the use of the file</em>
			</td>
			<td>
				<select name="parent">
					<!-- BEGIN folder_list -->
					<option value="{FOLDER_ID}"
					{FOLDER_SELECTED}>{FOLDER_INDENT}&gt; {FOLDER_NAME}</option>
					<!-- END folder_list -->
				</select>
			</td>
		</tr>
		<tr>
			<td class="formLabelWidth">
				<h4>Published</h4>
				<em>Your file will also be published on the selected pages.</em>
			</td>
			<td>
				<!-- BEGIN publish_page -->
				<label>
					<input type="checkbox" value="true" name="published[{PUBLISH_PAGE_PAGE_OWNER_ID}][{PUBLISH_PAGE_PAGE_ID}]" {PUBLISHED} />{PUBLISH_PAGE_PAGE_NAME}
				</label>
				<!-- END publish_page -->
			</td>
		</tr>
	</table>
	<input type="hidden" name="fileID" value="{FILE_ID}"/>
	<input type="submit" name="Submit" value="{ACTION} File" class="submit-btn-plain"/>
</form>
