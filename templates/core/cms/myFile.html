<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
<script type="text/javascript">

$j(function() {
	$j('.prettify').prettyFileInput({
		additionalButtonClasses: 'no-marg float-left',
		buttonActiveClass: 'tick',
		defaultText: '<span></span>Choose file',
		defaultFileSelectedText: '<span></span>File selected'
	});
	
	$j('#fileForm').validate();
});
</script>
<!-- END custom_head -->

<h1>{ACTION} File </h1>
<form method="post" action="/cms/myFileForm.php" enctype="multipart/form-data" id="fileForm" class="clearfix">
	<input type="hidden" name="parent" value="{PARENT_ID}"/>
  <input type="hidden" name="user" value="{USER_ID}" />

	<table class="standardForm">
		<!-- BEGIN browse_row -->
		<tr>
			<td>
				<h4>File</h4>
			</td>
			<td>
				<input type="file" name="file" class="prettify"/>
				<input type="hidden" name="MAX_FILE_SIZE" value="{MAX_FILE_SIZE}"/>
			</td>
		</tr>
		<!-- END browse_row -->
		<tr>
			<td class="formLabelWidth">
				<h4>Description</h4>
				<em>One line description of the file for use as the title</em>
			</td>
			<td>
				<label>
					<input type="text" name="description" maxlength="100" size="40" class="required" value="{DESCRIPTION}"/>
				</label>
			</td>
		</tr>
		<tr>
			<td>
				<h4>Location</h4>
				<em>Select an appropriate location within the system that reflects the use of the file</em>
			</td>
			<td>
				<select name="parent">
					<!-- BEGIN folder_list -->
					<option value="{FOLDER_ID}"
					{FOLDER_SELECTED}>{FOLDER_INDENT}&gt; {FOLDER_NAME}</option>
					<!-- END folder_list -->
				</select>
			</td>
		</tr>
		<tr>
			<td class="formLabelWidth">
				<h4>Published</h4>
				<em>Your file will also be published in the selected locations.</em>
			</td>
			<td>
				<!-- BEGIN publish_page -->
				<label>
					<input type="checkbox" value="true" name="published[{PUBLISH_PAGE_PAGE_OWNER_ID}][{PUBLISH_PAGE_PAGE_ID}][{PUBLISH_PAGE_COMPONENT_INSTANCE_ID}]" {PUBLISHED} />{PUBLISH_PAGE_PAGE_NAME}/{PUBLISH_PAGE_COMPONENT_NAME}
				</label>
				<!-- END publish_page -->
			</td>
		</tr>
	</table>
	<input type="hidden" name="fileID" value="{FILE_ID}"/>
	<input type="submit" name="Submit" value="{ACTION} File" class="submit-btn-plain"/>
</form>
