<!-- BEGIN custom_head -->
<script type="text/javascript">
$(function() {
    // Form validation
    $(document).on('open.fndtn.reveal', '[data-reveal]', function() {
        $(this).find('form[data-role="link-form"]').alaressValidate({
            rules: {
                url: {
                    isURL: true,
                    required: true
                },
                description: {
                    required: true
                }
            }
        });
    });

    // Delete confirmation
    $(document).on('click', '[data-interaction="delete"]', function(e) {
        e.preventDefault();
        $(this).confirmDialog({
            text: 'Are you sure you wish to delete this link?',
            confirmEvent: function (e) {
                $.post(e.attr('href'), {linkID: e.attr('data-delete')}).done(function () {
                    location.reload();
                });
            }
        })
    })
});

</script>
<!-- END custom_head -->
<div class="row">
    <div class="small-12 island">
        <div class="actions-small-1 row">
            <div class="list-item">
                <div class="small-12 columns">
                    <h1>Manage My Links</h1>
                </div>
            </div>
            <nav>
                <a href="#" data-reveal-id="add-link" class="sbx-icon-only-button" title="Add new link"><sbx-icon name="add"></sbx-icon></a>
            </nav>
        </div>
    </div>

    <!-- BEGIN empty_state -->
    <div class="small-12 island">
        <div class="empty-state">
            <i class="icon-link"></i>
            <p>Customise your side navigation with links for quick and easy access to your favourite pages.<br />
                To get started <a href="#" data-reveal-id="add-link">add your first link</a> now.</p>
        </div>
    </div>
    <!-- END empty_state -->
</div>

<div class="row">
    <div class="small-12 island">
        <section>
            <ul class="information-list">
                <!-- BEGIN myLink -->
                <li class="actions-small-2">
                    <div class="list-item">
                        <div class="card small-12">
                            <a href="{MYLINK_URL}">
                                <sbx-icon name="link" size="2rem"></sbx-icon>
                                <p>{MYLINK_DESCRIPTION}</p>
                                <p class="meta">{MYLINK_URL}</p>
                            </a>
                        </div>
                    </div>
                    <nav>
                        <a href="/cms/myLinksForm.php?delete=1"
                           data-delete="{MYLINK_ID}"
                           class="sbx-icon-only-button no-text"
                           data-interaction="delete"
                           title="Delete this link"
                           aria-label="Delete this link">
                            <sbx-icon name="delete"></sbx-icon>
                        </a>
                        <a href="#" data-reveal-id="modify-link-{MYLINK_ID}" data-interaction="show-open-form" title="Modify this link" class="sbx-icon-only-button"><sbx-icon name="modify"></sbx-icon></a>
                    </nav>
                    <div id="modify-link-{MYLINK_ID}" data-reveal class="reveal-modal" aria-labelledby="modify-link-label-{MYLINK_ID}" aria-hidden="true" role="dialog">
                        <h2 id="modify-link-label-{MYLINK_ID}">Modify Link</h2>
                        <form method="post" action="/cms/myLinksForm.php" data-role="link-form">
                            <input type="hidden" readonly="readonly" name="linkID" value="{MYLINK_ID}" />
                            <div class="row">
                                <div class="small-12 medium-6 columns">
                                    <script>
                                        $(function() {
                                            $('#modifyLinkButton-{MYLINK_ID}').schoolboxLink({
                                                allowedFiles: false,
                                                allowedFilesystems: 'folder',
                                                restoreModal: '#modify-link-{MYLINK_ID}',
                                                onSelect: function(url, name, mime, dialog) {
                                                    $('#url-{MYLINK_ID}').val(url);
                                                },
                                                onAfterClose: function () {
                                                    $('#file-picker').remove();
                                                }
                                            });
                                        });
                                    </script>
                                    <label for="url-{MYLINK_ID}" class="required">Link</label>
                                    <div class="input-group">
                                        <input id="url-{MYLINK_ID}" name="url" type="text" maxlength="2048" class="required" value="{MYLINK_URL}" />
                                        <a id="modifyLinkButton-{MYLINK_ID}" class="button sbx-button--has-icon"><sbx-icon name="link"></sbx-icon>Browse</a>
                                    </div>
                                </div>
                                <div class="small-12 medium-6 columns">
                                    <label for="description-{MYLINK_ID}" class="required">Title</label>
                                    <input id="description-{MYLINK_ID}" name="description" type="text" class="required" placeholder="Name (Schoolbox LMS)" value="{MYLINK_DESCRIPTION}" maxlength="255" />
                                </div>
                                <div class="small-12 columns">
                                    <input type="submit" value="Modify" class="full-width" />
                                </div>
                            </div>
                        </form>
                        <a class="close-reveal-modal" aria-label="Close">&#215;</a>
                    </div>
                </li>
                <!-- END myLink -->
            </ul>
        </section>

        <div id="add-link" data-reveal class="reveal-modal" aria-labelledby="add-link-label" aria-hidden="true" role="dialog">
            <h2 id="add-link-label">Add Link</h2>
            <form method="post" action="/cms/myLinksForm.php" data-role="link-form">
                <div class="row">
                    <div class="small-12 medium-6 columns">
                        <script>
                            $(function() {
                                $('#addLinkButton').schoolboxLink({
                                    allowedFiles: false,
                                    allowedFilesystems: 'folder',
                                    restoreModal: '#add-link',
                                    onSelect: function(url, name, mime, dialog) {
                                        $('#url-new').val(url);
                                    },
                                    onAfterClose: function () {
                                        $('#file-picker').remove();
                                    }
                                });
                            });
                        </script>
                        <label for="url-new" class="required">Link</label>
                        <div class="input-group">
                            <input id="url-new" name="url" type="text" maxlength="2048" class="required" />
                            <a id="addLinkButton" class="button sbx-button--has-icon"><sbx-icon name="link"></sbx-icon>Browse</a>
                        </div>
                    </div>
                    <div class="small-12 medium-6 columns">
                        <label for="description-new" class="required">Title</label>
                        <input id="description-new" name="description" type="text" class="required" maxlength="255" />
                    </div>
                    <div class="small-12 columns">
                        <input type="submit" value="Add" class="full-width" />
                    </div>
                </div>
            </form>
            <a class="close-reveal-modal" aria-label="Close">&#215;</a>
        </div>
    </div>
</div>
