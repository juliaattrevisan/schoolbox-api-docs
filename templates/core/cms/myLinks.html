<!-- BEGIN custom_head -->
<script type="text/javascript">

$j(function() {
	$j('#form').validate();
});

</script>
<!-- END custom_head -->

<h1>Manage My Links</h1>

<form id="form" method="post" action="/cms/myLinksForm.php" class="standardForm">
	<table>
		<thead>
			<tr>
				<th width="38%" title="e.g. http://www.yahoo.com.au">Hyperlink</th>
				<th width="38%"title="e.g. Yahoo Search Directory">Name</th>
				<th width="24%">Actions</th>
			</tr>
		</thead>
		<tbody>
			<!-- BEGIN myLink -->
			<tr>
				<td><a href="{MYLINK_URL}">{MYLINK_URL}</a></td>
				<td>{MYLINK_DESCRIPTION}</td>
				<td>
					<a href="/cms/myLinksForm.php?delete={MYLINK_ID}" class="btn delete float-left"><span></span>Delete</a>
					
					<!-- BEGIN myLink_exists -->
					<div class="shared-success">Shared in ePortfolio</div>
					<!-- END myLink_exists -->

					<!-- BEGIN myLink_share -->
					<a href="/cms/myLinksForm.php?share={MYLINK_ID}" class="btn eportfolio float-left shared-btn"><span></span>Share in ePortfolio</a>
					<!-- END myLink_share -->
				</td>
			</tr>
			<!-- END myLink -->
			<tr>
				<td><label><input name="url" type="text" class="required"/></label></td>
				<td><label><input name="description" class="required" type="text" /></label></td>
				<td><input name="submit" type="submit" value="Add" class="submit-btn-plain" /></td>
			</tr>
		</tbody>
	</table>
</form>
