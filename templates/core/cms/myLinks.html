<!-- BEGIN custom_head -->
<script type="text/javascript">

$(function() {
	$('#form').validate({
		rules: {
			url: {
				isURL:true
			}
		}
	});

	/* Dropdown inline editor for rows
	 */
	$(document).on('click', '.modify', function(event) {
		event.preventDefault();
		$(this).closest('.row-holder').siblings('.row-holder').show();
		$(this).closest('.row-holder').hide();
		// Disable any form inputs in other rows, enable ones in this row
		$(this).closest('.row-holder').siblings('.form-holder').hide()
				.find(':input').prop('disabled', true);
		$(this).closest('.row-holder').next('.form-holder').show()
				.find(':input').prop('disabled', false);
	});
});

</script>
<!-- END custom_head -->

<h1>Manage My Links</h1>

<form id="form" method="post" action="/cms/myLinksForm.php" class="standardForm">
	<table class="table">
		<thead>
			<tr>
				<th width="38%" title="e.g. http://schoolbox.com/">Hyperlink</th>
				<th width="38%"title="e.g. Schoolbox LMS">Name</th>
				<th width="24%">Actions</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td><label><input name="url" type="text" class="required" placeholder="Hyperlink (http://schoolbox.com/)" /></label></td>
				<td><label><input name="description" class="required " type="text" placeholder="Name (Schoolbox LMS)" /></label></td>
				<td><input name="submit" type="submit" value="Add" class="submit-btn-plain" /></td>
			</tr>
		</tbody>
	</table>
</form>

<form id='mylinks' class="clearfix" action='/cms/myLinksForm.php' method='post'>
<table width="100%" class="table">
	<!-- BEGIN myLink -->
	<tr class="row-holder">
        <td width="38%"><a href="{MYLINK_URL}">{MYLINK_URL}</a></td>
        <td width="38%">{MYLINK_DESCRIPTION}</td>
        <td width="24%"><a href="#" class="btn modify no-marg"><span></span>Modify</a></td>
    </tr>
    <tr class="row form-holder">
        <td width="38%"><label><input class="text-input" type="text" name="url" size="40" maxlength="250" value="{MYLINK_URL}" /></label></td>
        <td width="38%"><label><input class="text-input" type="text" name="description" size="40" maxlength="100" value="{MYLINK_DESCRIPTION}" /></label></td>
        <td width="24%">
            <input type="hidden" readonly="readonly" name="linkID" value="{MYLINK_ID}" />
            <a href="#" class="btn tick submit no-marg"><span></span>Save</a>
            <a href="/cms/myLinksForm.php?delete={MYLINK_ID}" title="Delete link" class="btn delete no-marg no-text"><span></span></a>
        </td>
	</tr>
    <!-- END myLink -->
</table>
</form>
