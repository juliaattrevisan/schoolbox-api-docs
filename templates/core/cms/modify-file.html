<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
    $(function () {
        $('[data-delete]').click(function(event) {
            event.preventDefault();

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this file?',
                confirmEvent: function() {
                    window.location = '/cms/fileForm.php?delete={FILE_ID}&redirect=/homepage/{CATEGORY_ID}';
                }
            });
        });

        $('#fileForm').alaressValidate(
            {

                rules: {
                    description: {
                        required: true,
                        minlength: 2
                    },
                    attachedFile: {
                        required: {
                            depends: function (element) {
                                return !($(element).parents('form').find('input[name="attachment[]"]').length);
                            }
                        }
                    }
                },
                messages: {
                    description: "Please enter a title.",
                    attachedFile: "Please attach a file."
                },
            });

        $(document).on('click', '#upload', function () {
            $('#attachedFile-error').remove();
        })

    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <div class="actions-small-1">
            <div class="list-item">
                <h1>{ACTION} File</h1>
            </div>
            <!-- BEGIN delete_button -->
            <nav>
                <a href='#' class='icon-more' data-dropdown='header-options' title="Actions"></a>
            </nav>
            <ul class='f-dropdown fadeInDown' data-dropdown-content id='header-options'>
                <li><a class="icon-delete" data-delete>Delete File</a></li>
            </ul>
            <!-- END delete_button -->
        </div>
        <form method="post" enctype="multipart/form-data" id="fileForm" action="/cms/fileForm.php" class="top">
            <input type='hidden' name='fileID' value='{FILE_ID}'  />
            <input type='hidden' name='category' value='{CATEGORY_ID}'  />
            <input type='hidden' name='component' value='{COMPONENT_ID}' />

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label for="description" class="required">Title</label>
                        <span data-tooltip class="hint has-tip tip-top" data-width="200" title="One line description of the file, this will be used for display and search">?</span>
                        <input type="text" name="description" id="description" maxlength="100" value="{DESCRIPTION}" required />
                        <label for="cms-zone" class="required">
                            Attach File
                        </label>
                        <input type="hidden" name="attachedFile">
                        {ATTACH_ZONE}
                        <label>
                            Description
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Any further details you wish to make about the file, useful for enhancing search results">?</span>
                            <textarea name="comment" cols="40" rows="4">{COMMENT}</textarea>
                        </label>
                        <label for="visible">
                            Visibility
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Hide this file from anyone with read-only access">?</span>
                        </label>
                        <div class="switch long">
                            <input name="visible" type="hidden" value="0">
                            <input name="visible" id="visible" type="checkbox" value="1" {VISIBLE_SELECTED}>
                            <label for="visible">
                                <span>Visible</span>
                                <span>Hidden</span>
                            </label>
                        </div>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" name="Submit" value="{ACTION} File" />
                </div>
            </div>
        </form>
    </div>
</div>
