<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
    $(function() {
        $('form[data-role="upload"]').validate();
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <h1>{ACTION} File</h1>

        <form method="post" action="/cms/networkFileForm.php" enctype="multipart/form-data" id="fileForm" class="clearfix">
            <input type="hidden" name="parent" value="{PARENT_ID}"/>
            <input type="hidden" name="fileID" value="{FILE_ID}"/>

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <!-- BEGIN browse_row -->
                        <label>
                            Attach File
                            {ATTACH_ZONE}
                        </label>
                        <!-- END browse_row -->
                        <!-- BEGIN desc -->
                        <label>
                            Description
                            <input type="text" name="description" required value="{DESCRIPTION}"/>
                        </label>
                        <!-- END desc -->
                        <!-- BEGIN location -->
                        <label>
                            Location
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select an appropriate location within the system that reflects the use of the file">?</span>
                            <select name="parent">
                                <!-- BEGIN folder_list -->
                                <option value="{FOLDER_ID}" {FOLDER_SELECTED}>{FOLDER_INDENT}&gt; {FOLDER_NAME}</option>
                                <!-- END folder_list -->
                            </select>
                        </label>
                        <!-- END location -->
                    </div>
                </fieldset>
            </section>
            <input type="submit" name="Submit" value="{ACTION} File" />
        </form>
    </div>
</div>
