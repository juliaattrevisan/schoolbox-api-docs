<!-- BEGIN custom_head -->
<script type="text/javascript">
$(document).ready(function() {

	// define file context menu 
	var fileMenu = [
		{"Open": function () { 
			window.open("/send.php?id="+$(this).attr("id").substring(5),"_blank"); 
		}},
		{"Save As": function () { window.open("/send.php?save=1&id="+$(this).attr("id").substring(5),"_self"); }},
		$.contextMenu.separator,
		{"Modify": function () {
			window.open("/cms/myFile/"+$(this).attr("id").substring(5),"_self"); 
		}},
		{"Delete": function () {
			var _file = $(this).find(".file");
			if (confirm("Delete this file?")) 
				window.open("/cms/myFileForm.php?delete="+$(this).attr("id").substring(5),"_self");
		}},
		$.contextMenu.separator,
		{"New File": function () { window.open("/cms/myFile/new/"+$(this).data("category"),"_self"); }},
		{"New Folder": function () { window.open("/cms/myFolder/new/"+$(this).data("category"),"_self"); }},

	];
	// define folder context menu
	var folderMenu = [
		{"Modify": function () { window.open("/cms/myFolder/"+$(this).attr("id").substring(5),"_self"); }},
		{"Delete": function () { if (confirm("Delete this folder?")) window.open("/cms/myFolderForm.php?delete="+$(this).attr("id").substring(5),"_self"); }},
		$.contextMenu.separator,
		{"New File": function () { window.open("/cms/myFile/new/"+$(this).attr("id").substring(5),"_self"); }},
		{"New Folder": function () { window.open("/cms/myFolder/new/"+$(this).attr("id").substring(5),"_self"); }},
		$.contextMenu.separator,
		{"Download": function () { window.open("/cms/fetchFolder.php?folder="+$(this).attr("id").substring(5),"_self"); }},
	];

  function addContext(node) {
	if ($(node).hasClass("folder"))
		$($(node).parents("tr")[0]).contextMenu(folderMenu);

	else if ($(node).hasClass("file"))
		$($(node).parents("tr")[0]).contextMenu(fileMenu);
  }; 

	$("#category-list, #file-list").treeTable({
		initialState: "collapsed",
		ajaxURL: "/cms/portfolioForm.php",
		resourcesID: "portfolioID",
		ajaxFileURL: "/cms/myFileForm.php",
		ajaxCategoryURL: "/cms/myFolderForm.php",
		addContext: addContext
	});
	
});
</script>
<style type="text/css">
	
	/* wrap mimetypes in classes */
	<!-- BEGIN allowed_files -->
	.treeTable span.file.{NAME} {
		background-image: url(/images/mime/{ICON});
	}
	<!-- END allowed_files -->
	
</style>

<!-- END custom_head -->
<div id="container">
<div id="column-1">
  <table id="category-list">
    <thead>
    <th>Folders</th>
      </thead>
    <tbody>
      <tr id="node-0" class="expanded populated">
      	<td><span class="top">Top</span></td>
      </tr>
      <!-- BEGIN folder_list -->
      <tr id="node-{FOLDER_ID}" class="{CLASS}">
        <td><span class="folder">{FOLDER_NAME}</span></td>
      </tr>
      <!-- END folder_list -->
    </tbody>
  </table>
</div>
<div id="column-2">
  <table id="file-list">
    <thead>
      <th>Name</th>
      <th>Size</th>
      <th>Modified</th>
    </thead>
    <tbody>
      <!-- BEGIN file_list -->
      <tr id="{TYPE}-{FILE_ID}" class="category-{CATEGORY_ID}">
        <td><span class="file ui-draggable {CLASS}">{FILE_NAME}</span></td>
        <td>{FILE_SIZE}</td>
        <td>{FILE_MODIFIED}</td>
      </tr>
      <!-- END file_list -->
    </tbody>
  </table>
</div>
</div>
