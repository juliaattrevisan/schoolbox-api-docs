<!-- BEGIN custom_head -->
<script type="text/javascript">
$j(document).ready(function() {

	// define file context menu 
	var fileMenu = [
		{"Open": {
			onclick: function () { 
				window.open("/send.php?myFile=1&id="+$j(this).attr("id").substring(5),"_blank"); 
			},
			icon: '/images/famicons/page_go.png'
		}},
		{"Save As": {
			onclick: function () { window.open("/send.php?myFile=1&save=1&id="+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/disk.png'
		}},
		$j.contextMenu.separator,
		{"Modify": {
			onclick: function () {
				window.open("/cms/myFile/"+$j(this).attr("id").substring(5),"_self"); 
			},
			icon: '/images/famicons/page_edit.png'
		}},
		{"Delete": {
			onclick: function () {
				var _name = $j(this).find(".file").text();
				if (confirm("Are you sure you want to delete "+_name+"?")) 
					window.open("/cms/myFileForm.php?delete="+$j(this).attr("id").substring(5),"_self");
			},
			icon: '/images/famicons/page_delete.png'
		}},
		$j.contextMenu.separator,
		{"New File": {
			onclick: function () { window.open("/cms/myFile/new/"+$j(this).data("category"),"_self"); },
			icon: '/images/famicons/page_add.png'
		}},
		{"New Folder": {
			onclick: function () { window.open("/cms/myFolder/new/"+$j(this).data("category"),"_self"); },
			icon: '/images/famicons/folder_add.png'
		}}

	];
	// define folder context menu
	var folderMenu = [
		{"Modify": {
			onclick: function () { window.open("/cms/myFolder/"+$j(this).attr("id").substring(5),"_self"); },
			icon :'/images/famicons/folder_edit.png'
		}},
		{"Delete": {
			onclick: function () { 
				var _name = $j(this).find(".folder").text();
				if (confirm("Are you sure you want to delete "+_name+"?")) window.open("/cms/myFolderForm.php?delete="+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/folder_delete.png'
		}},
		$j.contextMenu.separator,
		{"New File": {
			onclick: function () { window.open("/cms/myFile/new/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/page_add.png'
		}},
		{"New Folder": {
			onclick: function () { window.open("/cms/myFolder/new/"+$j(this).attr("id").substring(5),"_self"); },
			icon: '/images/famicons/folder_add.png'
		}}
	];

  function addContext(node) {
	if ($j(node).hasClass("folder") || $j(node).is("#top"))
		$j($j(node).parents("tr")[0]).contextMenu(folderMenu, {theme: "vista"});

	else if ($j(node).hasClass("file")) {
		$j($j(node).parents("tr")[0]).contextMenu(fileMenu, {theme: "vista"});
		$j($j(node).parents("tr")[0]).dblclick(function () {
			window.open("/send.php?myFile=1&id="+$j(this).attr("id").substring(5),"_blank"); 
		});  	
	}
  }; 

	$j("#category-list, #file-list").treeTable({
		initialState: "collapsed",
		ajaxURL: "/cms/portfolioForm.php",
		resourcesID: "portfolioID",
		ajaxFileURL: "/cms/myFileForm.php",
		ajaxCategoryURL: "/cms/myFolderForm.php",
		addContext: addContext
	});
	
});
</script>
<style type="text/css">
	
	/* wrap mimetypes in classes */
	<!-- BEGIN allowed_files -->
	.treeTable span.file.{NAME} {
		background-image: url(/images/mime/22x22/mimetypes/{ICON});
	}
	<!-- END allowed_files -->
	
</style>

<!-- END custom_head -->
<div class="template4">
<div class="left">
  <div id="category-window">
    <table id="category-head">
      <thead>
        <th>Folders</th>
      </thead>
    </table>
    <div class="scroller">
    <table id="category-list">
      <tbody>
        <tr id="node-0" class="expanded populated">
          <td><span id="top">Top</span></td>
        </tr>
        <!-- BEGIN folder_list -->
        <tr id="node-{FOLDER_ID}" class="{CLASS}">
          <td><span class="folder">{FOLDER_NAME}</span></td>
        </tr>
        <!-- END folder_list -->
      </tbody>
    </table>
    </div>
  </div>
</div>
  
<div class="right">
  <div id="file-window">
    <table id="file-head">
      <col width="55%" />
      <col width="23%" />
      <col width="22%" />   
      <thead>
        <th>Name</th>
        <th>Size</th>
        <th>Modified</th>
      </thead>
    </table>
    <div class="scroller">
    <table id="file-list">  
      <col width="55%" />
      <col width="23%" />
      <col width="22%" />      
        <!-- BEGIN file_list -->
        <tr id="{TYPE}-{FILE_ID}" class="category-{FOLDER_ID}">
          <td><span class="file ui-draggable {CLASS}">{FILE_NAME}</span></td>
          <td>{FILE_SIZE}</td>
          <td>{FILE_MODIFIED}</td>
        </tr>
        <!-- END file_list -->
    </table>
    </div>
  </div>
</div>
  
</div>
