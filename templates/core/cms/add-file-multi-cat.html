<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
$(function() {
	$('#fileForm').validate({
		rules: {
			'category[]': {
				required: true,
				minlength: 1
			}
		},
		messages: {
			'category[]': "Please tick at least one location"
		},
		errorPlacement: function(error, element) {
            if (element.parent().parent().hasClass('checkboxes')) {
				error.insertAfter(element.parent().parent().parent().children(':last-child'));
			} else {
				error.insertAfter(element);
			}
		}
	});

	$(':checkbox').each(function() {
		if ($(this).is(':checked')) {
			$(this).parent().addClass('active-checkbox');
		}
	});

	$(':checkbox').click(function() {
		if ($(this).parent().hasClass('active-checkbox')) {
			$(this).parent().removeClass('active-checkbox')
		} else {
			$(this).parent().addClass('active-checkbox');
		}
	});
});

</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 columns">
        <h1>Post File to Multiple Locations</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/cms/fileForm.php" method="post" enctype="multipart/form-data" id="fileForm">
            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Title
                            <span class='hint has-tip tip-top' data-tooltip title="One line description of the file for use as the title">?</span>
                            <input type="text" name="description" maxlength="250" size="40" class="required" />
                        </label>

                        <label>
                            File
                            <span class='hint has-tip tip-top' data-tooltip title="Select a file to post">?</span>
                        </label>

                        {ATTACH_ZONE}

                        <label>
                            Description
                            <span class='hint has-tip tip-top' data-tooltip title="Any further details you wish to make about the file, useful for enhancing search results">?</span>
                            <textarea name="comment" cols="40" rows="4"></textarea>
                        </label>

                        <label>
                            Location
                            <span class='hint has-tip tip-top' data-tooltip title="Select the locations where this file should be placed">?</span>
                        </label>

                        <div class="checkboxes">
                            <!-- BEGIN category_list -->
                            <input type="checkbox" id="category-{CATEGORY_ID}" class="category" name="category[]" value="{CATEGORY_ID}">
                            <label for="category-{CATEGORY_ID}" class="checkbox-label">{CATEGORY_NAME}</label>
                            <!-- END category_list -->
                            <!-- BEGIN no_categories -->
                            <p class="alert-box">You must be involved in a Class/Group prior to using this.</p>
                            <!-- END no_categories -->
                        </div>

                        <label>
                            Hidden
                            <span class='hint has-tip tip-top' data-tooltip title="Hide this file from students">?</span>
                        </label>

                        <input type='checkbox' id='hidden-checkbox' name='hidden' value='1' {HIDDEN_SELECTED} />
                        <label for="hidden-checkbox" class="checkbox-label">Hide this file from students</label>
                    </div>
                </fieldset>
            </section>

            <input type="submit" value="Add File" />
        </form>

    </div>
</div>
