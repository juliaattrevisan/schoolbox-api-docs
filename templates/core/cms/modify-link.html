<!-- BEGIN custom_head -->
<script language="JavaScript" type="text/javascript">
function verify()
{
	var msg = ""
	//check that description, url, location have been entered
	if(document.getElementById('urlForm').description.value == ""){
		msg += "You need to enter a description\n";
	}
	if(document.getElementById('urlForm').url.value == ""){
		msg += "You need to enter a URL\n";
	}
	//maybe write a test to validate url?
	if(document.getElementById('urlForm').category.value == "" || isNaN(document.getElementById('urlForm').category.value)){
		msg += "You need to select a proper location";
	}
	
	if(msg != ""){
		alert(msg);
		return false;
	}
	else
		return true;
}
</script>
<!-- END custom_head -->

<h1>{ACTION} URL</h1>
<form action="" method="post" id="urlForm" class="standardForm" onSubmit="return(verify());" action="linkForm.php">
  <table>
    <tr>
      <td class="formLabelWidth"><h2>URL</h2></td>
      <td><input type="text" name="url" size="40" maxlength="250" value="{URL}" />
      </td>
    </tr>
    <tr>
      <td><h2>Description</h2>
        <em>One line description of the URL for the title </em> </td>
      <td ><input type="text" name="description" maxlength="250" size="40" value="{DESCRIPTION}" />
      </td>
    </tr>
    <tr>
      <td><h2>Comments</h2>
        <em>Any further details you wish to make about the URL, useful for enhancing search results</em> </td>
      <td><textarea name="comment" cols="40" rows="4">{COMMENT}</textarea>
      </td>
    </tr>
    <tr>
      <td><h2>Location</h2>
        <em>The link will be located in this folder</em></td>
      <td>{CATEGORY_NAME}</td>
    </tr>
    <tr>
      <td><h2>Hidden</h2>
        <em>Hide this URL from students.</em></td>
      <td><input type='checkbox' name='hidden' value='1' {HIDDEN_SELECTED} /></td>
    </tr>
    <tr>
      <td >&nbsp;</td>
      <td><input type='hidden' name='linkID' value='{LINK_ID}'  />
        <input type="submit" name="Submit" value="{ACTION} URL" class="btn" />
      </td>
    </tr>
  </table>
</form>
