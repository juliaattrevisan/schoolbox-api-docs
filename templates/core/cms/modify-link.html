<!-- BEGIN custom_head -->
<script language="JavaScript" type="text/javascript">
    $(function() {
        $('[data-delete]').click(function(event) {
            event.preventDefault();

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this link?',
                confirmLabel: 'Delete',
                confirmEvent: function() {
                    window.location = '/cms/linkForm.php?delete={LINK_ID}&redirect=/homepage/{CATEGORY_ID}';
                }
            });
        });

        $('#urlForm').alaressValidate({
            rules:{
                url:{
                    isURL:true
                }
            }
        });
    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">
        <div class="actions-small-1">
            <div class="list-item">
                <h1>{ACTION} Link</h1>
            </div>
            <!-- BEGIN delete_button -->
            <nav>
                <a href='#' class='icon-more' data-dropdown='header-options' title="Actions"></a>
            </nav>
            <ul class='f-dropdown fadeInDown' data-dropdown-content id='header-options'>
                <li><a class="icon-delete" data-delete>Delete Link</a></li>
            </ul>
            <!-- END delete_button -->
        </div>
        <form method="post" id="urlForm" class="top" action="/cms/linkForm.php">
            <input type='hidden' name='linkID' value='{LINK_ID}'/>
            <input type='hidden' name='category' value='{CATEGORY_ID}'/>

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label for="description">
                            <span class="required-with-tip">Title</span>
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="One line description of the link, this will be used for display and search">?</span>
                        </label>
                        <input type="text" name="description" id="description" maxlength="100" size="40" value="{DESCRIPTION}" required />
                    </div>
                    <div class="small-12 columns">
                        <label for="url">
                            <span class="required-with-tip">URL</span>
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="The internet address for the website, eg. http://www.google.com. Relative URLs are allowed, and will resolve relative to this domain">?</span>
                        </label>
                        <script>
                            $(function() {
                                $('#modalLinkButton').schoolboxLink({
                                    onSelect: function(url, name, mime, dialog) {
                                        $('#url').val(url);
                                    }
                                });
                            });
                        </script>
                        <div class="input-group">
                            <input type="text" name="url" id="url" size="40" maxlength="2048" value="{URL}" required />
                            <a id="modalLinkButton" class="button icon-link">Browse</a>
                        </div>
                    </div>
                    <div class="small-12 columns">
                        <label>
                            Description
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Any further details you wish to make about the link, useful for enhancing search results">?</span>
                            <textarea name="comment" cols="40" rows="4">{COMMENT}</textarea>
                        </label>
                        <label>Open In</label>
                            <select name="target">
                                <option value="">Same Window</option>
                                <option value="_blank" {BLANK_SELECTED}>New Window</option>
                            </select>
                        <label for="visible" class="inline-block">
                            Visibility
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Hide this link from anyone with read-only access">?</span>
                        </label>
                        <div class="switch long">
                            <input name="visible" id="visible" type="checkbox" {VISIBLE_SELECTED}>
                            <label for="visible">
                                <span>Visible</span>
                                <span>Hidden</span>
                            </label>
                        </div>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" name="Submit" value="{ACTION} Link"/>
                </div>
            </div>
        </form>
    </div>
</div>
