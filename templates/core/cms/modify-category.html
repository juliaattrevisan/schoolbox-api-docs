<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/shared/selectize/jquery.selectize-selector.js"></script>
<script type="text/javascript" src="/curriculum/javascript/jquery.curriculumSelector.js"></script>
<script type="text/javascript">
    $(function() {

        $('[data-checkbox-inherit]').change(function(event) {
            if ($(event.target).prop('checked')) {
                $('#permissions').hide();
                $("input[name^='group']").removeClass('required');
            } else {
                $('#permissions').show();
                $("input[name^='group']").addClass('required');
            }
        });

        var form = $('#folderForm');
        form.alaressValidate({
            submitHandler: function(form) {
                var hasDefaultPerms = $("input[name='group[{REQUIRED_PERMS}]']:checked").val();
                var individualPerms = $('input[name=groupcheck]').is(':checked');
                if ((hasDefaultPerms < {ACCESS_WRITE}) && !individualPerms && !$('[data-checkbox-inherit]').prop('checked')) {
                    $(form).confirmDialog({
                        text: 'You do not currently have write access to this folder. Do you wish to continue?',
                        confirmEvent: function() {
                            form.submit();
                    }
                    });
                } else {
                    form.submit();
                }
            }
        });

        $('[data-interaction="delete"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this folder?',
                confirmEvent: $.confirmDialog.followHref
            });
        });
        
        $('[data-reset-homepage-content]').click(function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete all content from this homepage? This includes:\n - Assessments\n - Blogs\n - Calendar events\n - News\n - Chats\n - Dropbox\n - Files\n - Forums\n - Polls\n - Due Work\n - Surveys\n - TextBoxes\n - Wikis',
                confirmEvent: function() {
                    window.location.href = element.attr('href');
                }
            });
        });

        var categoryId = form.find('input[name="categoryID"]').val();
        if (categoryId) {
            $('[data-template]').change(function(event) {
                if ($('[data-template]').val() != 0) {
                    $('[data-template-warning]').removeClass('hide');
                } else {
                    $('[data-template-warning]').addClass('hide');
                }
            });
        }

        // If the folder is inheriting permissions need to remove the required attribute from group fields

        if ($('[data-checkbox-inherit]').prop('checked')) {
            $("input[name^='group']").removeClass('required');
        }

    });
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row actions-small-1">
	<div class="list-item small-12 columns">
		<h1>{ACTION} Folder</h1>
    </div>
    <nav>
        <a href="#" class="icon-more" data-dropdown="folder-options" title="Actions"></a>
    </nav>
    <ul class="f-dropdown" data-dropdown-content id="folder-options">
        <!-- BEGIN indiv_modify -->
        <li>
            <a class="icon-group" href="/group/modify/{CATEGORY_ID}" title="Manage individual user access to this folder">Modify Group</a>
        </li>
        <!-- END indiv_modify -->
        <!-- BEGIN reset_content -->
        <li>
            <a class="icon-delete" href="/cms/categoryForm.php?delete={CATEGORY_ID}" data-interaction="delete">Delete Folder</a>
        </li>
        <li>
            <a class="icon-refresh" href="/cms/category/reset/{CATEGORY_ID}" data-reset-homepage-content>Reset Content</a>
        </li>
        <!-- END reset_content -->
    </ul>
</div>
<div class="row">
    <div class="list-item small-12 island">
		<form action="/cms/categoryForm.php" method="post" id="folderForm" class="top">
            <input type="hidden" id="parent" name="parent" value="{PARENT_ID}" />
            <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />

            <section>
				<fieldset class="content">
					<div class="small-12 columns">
						<label>
                            Folder Name
							<input type="text" id="name" class="required" name="name" maxlength="100" size="40" value="{NAME}" />
						</label>
						<label>
                            Homepage Template
							<span data-tooltip class="hint has-tip tip-top" data-width="200" title="If you would like a homepage associated with this folder select a basic layout to get started with">?</span>
							<select data-template name="template">
								<!-- BEGIN template_list -->
								<option value="{TEMPLATE_ID}" {TEMPLATE_ID_SELECTED}>{TEMPLATE_NAME}</option>
								<!-- END template_list -->
							</select>
						</label>
                        <div class="alert-box warning hide" data-template-warning>
                            Warning! Changing the folders template will remove all existing components and content.
                        </div>
					</div>
				</fieldset>

                <fieldset class="content {HIDE_INHERIT}">
                    <div class="small-12 columns">
                        <label>Access Permissions
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select user roles which have access to this folder">?</span>
                        </label>
                    </div>

                    <div class="small-12 columns">
                        <input data-checkbox-inherit type="checkbox" id="inherit" name="inherit" value="1" {INHERIT_SELECTED} />
                        <label for="inherit" class="checkbox-label">Inherit permissions from parent folder</label>
                    </div>
                </fieldset>

                <div id="permissions {HIDE_PERMISSIONS}">
                    <table class="scrollable">
                        <thead>
                            <tr>
                                <th>Role</th>
                                <th>None</th>
                                <th>Read</th>
                                <th>Write</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- BEGIN perm_table -->
                            <tr>
                                <td>{GROUP_NAME}</td>
                                <td>
                                    <input type="radio" class="no_permission required" id="groupNone{GROUP_ID}" name="group[{GROUP_ID}]" value="0" {PERM_0_SELECTED} />
                                    <label class="radio-label" for="groupNone{GROUP_ID}"></label>
                                </td>
                                <td>
                                    <input type="radio" name="group[{GROUP_ID}]" id="groupRead{GROUP_ID}" value="1" {PERM_1_SELECTED} />
                                    <label class="radio-label" for="groupRead{GROUP_ID}"></label>
                                </td>
                                <td>
                                    <input type="radio" name="group[{GROUP_ID}]" id="groupWrite{GROUP_ID}" value="2" {PERM_2_SELECTED} />
                                    <label class="radio-label" for="groupWrite{GROUP_ID}"></label>
                                </td>
                            </tr>
                            <!-- END perm_table -->
                        </tbody>
                    </table>

                    <div class="content small-12 columns">
                        <!-- BEGIN recursive -->
                        <input type="checkbox" id="recursive" name="recursive" value="1" />
                        <label for="recursive" class="checkbox-label">Apply these permissions to all subfolders</label>
                        <!-- END recursive -->
                        <!-- BEGIN indiv_perms -->
                        <label for="groupcheck">
                            Create Group
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Manage individual user access to this folder. You will automatically be assigned administration rights">?</span>
                        </label>
                        <div class="switch">
                            <input type="checkbox" id="groupcheck" name="groupcheck" value="1" />
                            <label for="groupcheck"></label>
                        </div>
                        <!-- END indiv_perms -->
                    </div>
                    <fieldset class="content">
                        <div class="small-12 columns">
                            <!-- BEGIN synergy_input -->
                            <label>
                                {DATABASE_TYPE} Subject Codes
                                <span data-tooltip class="hint has-tip tip-top" data-width="200" title="If you want this category to be a subject enter its code here. You may enter multiple codes by separating them with a comma">?</span>
                                <input type="text" name="code" size="40" value="{CODE}" />
                            </label>
                            <!-- END synergy_input -->
                        </div>

                        <!-- BEGIN curriculum_code_input -->
                        <div class="small-12 large-10 columns">
                            <label>
                                Curriculum Codes
                                <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Link this folder with a corresponding curriculum area, you can link multiple curriculum areas to this folder">?</span>
                            </label>
                            {CURRICULUM_CODE_INPUT}
                        </div>
                        <div class="small-12 large-2 columns">
                            <label>Browse</label>
                            {CURRICULUM_BROWSE_BUTTON}
                        </div>
                        <!-- END curriculum_code_input -->
				    </fieldset>
                </div>
			</section>
			<div class="row">
				<div class="small-12 column">
					<input type="submit" value="{ACTION} Folder" />
				</div>
			</div>
		</form>
	</div>
</div>
