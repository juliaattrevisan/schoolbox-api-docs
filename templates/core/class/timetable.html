<style type="text/css">
    .timetable td,
    .timetable th,
    .timetable-small td,
    .timetable-small th {
        border: 1px solid #eee;
    }

    .timetable-small table th,
    .timetable-small table td {
        width: 50%;
    }
</style>

<!-- BEGIN timetable -->
<div class="row">
    <div class="small-12 columns">
        <h1>Timetable for {PERSON}{YEAR}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 columns no-pad">
        <div class="overflow show-for-medium-up">
            <table class="timetable" data-timetable>
                <thead>
                <tr>
                    <th></th>
                    <!-- BEGIN day_header -->
                    <th class="{TIMETABLE_CLASS}" style="width:{TIMETABLE_FIELD_WIDTH}%;">{DAY_NAME}</th>
                    <!-- END day_header -->
                </tr>
                </thead>
                <tbody>
                <!-- BEGIN period -->
                <tr>
                    <th class="{PERIOD_CLASS}">
                        {PERIOD_NAME}
                        <time>{PERIOD_START}&ndash;{PERIOD_END}</time>
                    </th>
                    <!-- BEGIN day -->
                    <td class="{TIMETABLE_CLASS}" style="background-color: {PERIOD_COLOUR};">
                        <!-- BEGIN period_class_link -->
                        <a href="{PERIOD_URL}" >
                            {PERIOD_DESC}
                            <p class="meta">
                                {PERIOD_CODE}<br />
                                {PERIOD_ROOM} {PERIOD_STAFF}
                            </p>
                        </a>
                        <!-- END period_class_link -->
                        <!-- BEGIN period_class -->
                        {PERIOD_DESC}
                        <p class="meta">
                            {PERIOD_CODE}<br />
                            {PERIOD_ROOM} {PERIOD_STAFF}
                        </p>
                        <!-- END period_class -->
                    </td>
                    <!-- END day -->
                </tr>
                <!-- END period -->
                </tbody>
            </table>
        </div>
        <!-- END timetable -->
    </div>
</div>

<div class="row timetable-small show-for-small-only" data-smaller></div>

<script type="text/javascript" src="/javascript/shared/jquery.timetable.js"></script>
<script type="text/javascript">
    $(function() {
        $('[data-timetable]').timetable();
    });
</script>
