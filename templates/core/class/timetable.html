<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/timetable/jquery.timetable-resize.js"></script>
<script type="text/javascript" src="/javascript/shared/timetable/jquery.timetable-grid.js"></script>
<script type="text/javascript">
    $(function() {
        $.fn.timetableStart();
    });
</script>
<!-- END custom_head -->

<div class="row {NUM_PEOPLE_CLASS}">
    <div class="small-12 columns">
        <dl class="sub-nav">
            <!-- BEGIN timetable_person -->
            <dd><a data-timetable-selector="{USER_ID}">{PERSON}</a></dd>
            <!-- END timetable_person -->
        </dl>
    </div>
</div>

<!-- BEGIN timetable -->
<div class="row hide" data-timetable-wrapper="{USER_ID}">
    <div class="small-12 columns">
        <h1 data-timetable-title>Timetable for {PERSON}{YEAR}</h1>
    </div>

    <div class="small-12 columns">
        <div class="overflow show-for-medium-up">
            <table class="timetable no-hover" data-timetable="{USER_ID}">
                <thead>
                    <tr>
                        <th></th>
                        <!-- BEGIN day_header -->
                        <th class="{DAY_CLASS}" style="width:{TIMETABLE_FIELD_WIDTH}%;">{DAY_NAME}</th>
                        <!-- END day_header -->
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN period -->
                    <tr>
                        <th class="{PERIOD_CLASS}">
                            {PERIOD_NAME}
                            <time class="meta">{PERIOD_START}&ndash;{PERIOD_END}</time>
                        </th>
                        <!-- BEGIN day -->
                        <td>
                            <div class="{DAY_CLASS}">
                                <!-- BEGIN period_class_link -->
                                <div class='timetable-subject' style="background-color: {PERIOD_COLOUR};" data-timetable-subject>
                                    <a href="{PERIOD_URL}">
                                        {PERIOD_DESC}
                                        <p class="meta">{PERIOD_CODE}</p>
                                        <p class="meta">{PERIOD_ROOM} {PERIOD_STAFF}</p>
                                    </a>
                                </div>
                                <!-- END period_class_link -->
                                <!-- BEGIN period_class -->
                                <div class='timetable-subject' style="background-color: {PERIOD_COLOUR};" data-timetable-subject>
                                    {PERIOD_DESC}
                                    <p class="meta">{PERIOD_CODE}</p>
                                    <p class="meta">{PERIOD_ROOM} {PERIOD_STAFF}</p>
                                </div>
                                <!-- END period_class -->
                            </div>
                        </td>
                        <!-- END day -->
                    </tr>
                    <!-- END period -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- END timetable -->
<!-- BEGIN no_timetable -->
<div class="row">
    <div class="small-12 column">
        <div class="alert-box">There is currently no timetable available.</div>
    </div>
</div>
<!-- END no_timetable -->

<div class="row timetable-small show-for-small-only" data-smaller></div>
