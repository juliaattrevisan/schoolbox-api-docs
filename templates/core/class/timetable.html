<style type="text/css">
    .timetable th,
    .timetable td {
        border: 1px solid #eee;
    }

    .timetable-small table th,
    .timetable-small table td {
        width: 50%;
    }
</style>

<!-- BEGIN timetable -->
<h1>Timetable for {PERSON}{YEAR}</h1>

<div class="overflow">
    <table class="timetable" data-timetable>
        <thead>
            <tr>
                <th></th>
                <!-- BEGIN day_header -->
                <th class="{TIMETABLE_CLASS}" style="width:{TIMETABLE_FIELD_WIDTH}%;">{DAY_NAME}</th>
                <!-- END day_header -->
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN period -->
            <tr>
                <th class="{PERIOD_CLASS}">
                    {PERIOD_NAME}
                    <time>{PERIOD_START}&ndash;{PERIOD_END}</time>
                </th>
                <!-- BEGIN day -->
                <td class="{TIMETABLE_CLASS}" style="background-color: {PERIOD_COLOUR};">
                    <!-- BEGIN period_class_link -->
                    <a href="{PERIOD_URL}" >
                        {PERIOD_DESC}
                        <p class="meta">
                            {PERIOD_CODE}<br />
                            {PERIOD_ROOM} {PERIOD_STAFF}
                        </p>
                    </a>
                    <!-- END period_class_link -->
                    <!-- BEGIN period_class -->
                    {PERIOD_DESC}
                    <p class="meta">
                        {PERIOD_CODE}<br />
                        {PERIOD_ROOM} {PERIOD_STAFF}
                    </p>
                    <!-- END period_class -->
                </td>
                <!-- END day -->
            </tr>
            <!-- END period -->
        </tbody>
    </table>
</div>
<!-- END timetable -->



<div class="timetable-small" data-smaller>
</div>

<script type="text/javascript">
    (function() {

        /**
         * Plugin
         *
         * @param options
         */
        $.fn.plugin = function(options) {
            options = options || {};

            var config = init(options, $(this));

            /**
             * Init
             *
             * @param options
             * @param element
             * @returns {*}
             */
            function init(options, element) {
                var defaults = {
                    element: element
                }

                var derived = {
                }

                var merged = $.extend(defaults, derived, options);

                return merged;
            }
        }
    }(jQuery));

    $(function() {
        var periodNames = $('[data-timetable] tbody th');
        var numDays = $('[data-timetable] thead th').length;

        /* For every day, assemble a two column timetable
         */
        for (var i = 1; i < numDays; i++) {
            var table = $('<table>');

            /* Generate table rows
             */
            $.each(periodNames, function(index, element) {
                var tr = $('<tr></tr>');
                tr.append($(element).clone());
                tr.append($('[data-timetable] tbody tr:nth-child('+(index+1)+') td:nth-child('+i+')').first().clone());

                table.append(tr);
            });

            /* Assemble island
             */
            var header = $('<h2 class="subheader"></h2>');
            header.append($('[data-timetable] thead tr:first() th:nth-child('+i+')').first().html());

            var html = $('<div></div>').append(header);

            html.append(table);

            $('[data-smaller]').append(html);
        }
    });
</script>
