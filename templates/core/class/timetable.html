<dl class="sub-nav">
    <!-- BEGIN timetable_selector -->
    <dd><a data-timetable-selector="{USER_ID}">{PERSON}</a></dd>
    <!-- END timetable_selector -->
</dl>

<!-- BEGIN timetable -->
<div class="row hide" data-timetable-wrapper="{USER_ID}">
    <div class="small-12 columns">
        <h1>Timetable for {PERSON}{YEAR}</h1>
    </div>

    <div class="small-12 columns no-pad">
        <div class="overflow show-for-medium-up">
            <table class="timetable" data-timetable="{USER_ID}">
                <thead>
                    <tr>
                        <th></th>
                        <!-- BEGIN day_header -->
                        <th class="{TIMETABLE_CLASS}" style="width:{TIMETABLE_FIELD_WIDTH}%;">{DAY_NAME}</th>
                        <!-- END day_header -->
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN period -->
                    <tr>
                        <th class="{PERIOD_CLASS}">
                            {PERIOD_NAME}
                            <time class="meta">{PERIOD_START}&ndash;{PERIOD_END}</time>
                        </th>
                        <!-- BEGIN day -->
                        <td class="{TIMETABLE_CLASS}">
                            <!-- BEGIN period_class_link -->
                            <div class='timetable-subject' style="background-color: {PERIOD_COLOUR};" data-timetable-subject>
                                <a href="{PERIOD_URL}">
                                    {PERIOD_DESC}
                                    <p class="meta">{PERIOD_CODE}</p>
                                    <p class="meta">{PERIOD_ROOM} {PERIOD_STAFF}</p>
                                </a>
                            </div>
                            <!-- END period_class_link -->
                            <!-- BEGIN period_class -->
                            <div class='timetable-subject' style="background-color: {PERIOD_COLOUR};" data-timetable-subject>
                                {PERIOD_DESC}
                                <p class="meta">{PERIOD_CODE}</p>
                                <p class="meta">{PERIOD_ROOM} {PERIOD_STAFF}</p>
                            </div>
                            <!-- END period_class -->
                        </td>
                        <!-- END day -->
                    </tr>
                    <!-- END period -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- END timetable -->

<div class="row timetable-small show-for-small-only" data-smaller></div>

<script type="text/javascript" src="/javascript/shared/jquery.timetable.js"></script>
<script type="text/javascript">
    $(function() {

        /* Show first timetable
         */
        var firstTimetable = $('[data-timetable-wrapper]').first();
        firstTimetable.removeClass('hide');

        $('[data-timetable-selector]').parent().removeClass('active');
        $('[data-timetable-selector]').first().parent().addClass('active');

        firstTimetable.find('[data-timetable]').timetable({
            target: '[data-smaller]'
        });

        $('[data-timetable-selector]').click(function(event) {
            event.preventDefault();

            /* Unselect all menu items
             * Reselect this one
             */
            $('[data-timetable-selector]').parent().removeClass('active');
            $(this).parent().addClass('active');

            /* Hide all large timetables
             * Clear existing small timetables
             */
            $('[data-timetable-wrapper]').addClass('hide');
            $('[data-smaller]').html('')

            /* Show selected large timetable
             * Show selected small timetable
             */
            var selected = $(this).attr('data-timetable-selector');

            $('[data-timetable-wrapper='+selected+']').removeClass('hide').timetable({
                target: '[data-smaller]'
            });

            /* Adjust heights
             */
            $.fn.timetableResize({
                timetable: $('[data-timetable-wrapper='+selected+']').find('[data-timetable]')
            });
        });
    });
</script>
