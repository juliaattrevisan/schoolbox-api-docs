<style type="text/css">
    .timetable th,
    .timetable td {
        border: 1px solid #eee;
    }

    .timetable-small table th,
    .timetable-small table td {
        width: 50%;
    }
</style>

<!-- BEGIN timetable -->
<h1>Timetable for {PERSON}{YEAR}</h1>

<div class="overflow">
    <table class="timetable" data-timetable>
        <thead>
            <tr>
                <th></th>
                <!-- BEGIN day_header -->
                <th class="{TIMETABLE_CLASS}" style="width:{TIMETABLE_FIELD_WIDTH}%;">{DAY_NAME}</th>
                <!-- END day_header -->
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN period -->
            <tr>
                <th class="{PERIOD_CLASS}">
                    {PERIOD_NAME}
                    <time>{PERIOD_START}&ndash;{PERIOD_END}</time>
                </th>
                <!-- BEGIN day -->
                <td class="{TIMETABLE_CLASS}" style="background-color: {PERIOD_COLOUR};">
                    <!-- BEGIN period_class_link -->
                    <a href="{PERIOD_URL}" >
                        {PERIOD_DESC}
                        <p class="meta">
                            {PERIOD_CODE}<br />
                            {PERIOD_ROOM} {PERIOD_STAFF}
                        </p>
                    </a>
                    <!-- END period_class_link -->
                    <!-- BEGIN period_class -->
                    {PERIOD_DESC}
                    <p class="meta">
                        {PERIOD_CODE}<br />
                        {PERIOD_ROOM} {PERIOD_STAFF}
                    </p>
                    <!-- END period_class -->
                </td>
                <!-- END day -->
            </tr>
            <!-- END period -->
        </tbody>
    </table>
</div>
<!-- END timetable -->

<div class="row timetable-small" data-smaller></div>

<script type="text/javascript">
    (function() {

        /**
         * Plugin
         *
         * @param options
         */
        $.fn.timetable = function(options) {
            options = options || {};

            var config = init(options, $(this));

            assemble();

            /**
             * Init
             *
             * @param options
             * @param element
             * @returns {*}
             */
            function init(options, element) {
                var defaults = {
                    element: element,

                    /* Reforged timetables end up inside this element
                     */
                    target: '[data-smaller]'
                }

                var derived = {

                    /* Island html
                     * Sorry, Doctor
                     */
                    header: '<h2 class="subheader"></h2>',
                    island: '<div class="small-12 island"></div>',
                    section: '<section></section>'
                }

                var merged = $.extend(defaults, derived, options);

                return merged;
            }

            /**
             * Assemble a timetable
             */
            function assemble() {
                var periodNames = $(config.element).find('tbody th');
                var numDays = $(config.element).find('thead th').length;
                var i;

                /* For every day, assemble a two column timetable
                 */
                for (i = 1; i < numDays; i++) {
                    var table = $('<table>');

                    /* Generate table rows
                     */
                    $.each(periodNames, function(index, element) {
                        var tr = $('<tr></tr>');
                        tr.append($(element).clone());
                        tr.append(dataCellSelector(index+1, i+1).clone());

                        table.append(tr);
                    });

                    /* Assemble island
                     */
                    var header = $(config.header).append(headerCellSelector(i+1).html());
                    var section = $(config.section).append(table);
                    var island = $(config.island).append(header).append(section)

                    /* Inject
                     */
                    $(config.target).append(island);
                }
            }

            /**
             * Select a cell in main timetable
             *
             * @param row
             * @param column
             */
            function dataCellSelector(row, column) {
                return $(config.element).find('tbody tr:nth-child('+row+') td:nth-child('+column+')').first();
            }

            /**
             * Select a header column
             *
             * @param column
             * @returns {*|jQuery}
             */
            function headerCellSelector(column) {
                return $(config.element).find('thead tr:first() th:nth-child('+column+')').first();
            }
        }
    }(jQuery));

    $(function() {
        $('[data-timetable]').timetable();
    });
</script>
