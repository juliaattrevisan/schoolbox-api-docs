<!-- BEGIN custom_head -->
<script type="text/javascript" src="/subject/classList/javascript/emailSelected.js"></script>
<script type="text/javascript">
$(function() {

	/* Add "select all" functionality
	 */
	$('#select-all').addSelectAll({
		source: $('#contact-table')
	});

	var form = $('#contact-table-form');

	// Validators for if no student or parent emails were found
	$.validator.addMethod(
		'remote.noStudentEmails',
		function() {
			return !(form.data('noStudentEmails'));
		},
		'No email addresses were found for the selected students.'
	)
	$.validator.addMethod(
		'remote.noParentEmails',
		function() {
			return !(form.data('noParentEmails'));
		},
		'No email addresses were found for the parents of the selected students.'
	)

	/* Validate checkbox selections
	 */
	form.validate({
		rules: {
			"selected[]": {
				required: true,
				minlength: 1,
				'remote.noStudentEmails': true,
				'remote.noParentEmails': true
			}
		},
		messages: {
			"selected[]": {
				required: "Please select at least one student before sending email",
				minlength: "Please select at least one student before sending email"
			}
		},
		errorPlacement: function(error, element) {
			$('#errors').html(error);
		}
	});
});
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="small-12 island">

        <table id="contact-table">

                    <th class="show-for-medium-up">House</th>

                    <th></th>

            </thead>
            <tbody>
            <!-- BEGIN student_list -->

                    <input type="checkbox" name="selected[]" id='id-{SYNERGYID}' value="{SYNERGYID}" />

                <td>

                    {SURNAME}, {FIRSTNAME}
                    <!-- END name_without_link -->
                    <span class="meta">({SYNERGYID})</span>
                    <p class="meta">

                    </p>

                    <!-- This is here because if its in the small column it inherits its width and doesnt have enough room -->
                    <ul class="f-dropdown" data-dropdown-content="" id="overflow{ID}">
                        <li>
                            <!-- BEGIN eportfolio_small -->
                            <a href="/eportfolio/{ID}/profile" class="icon-eportfolio">View ePortfolio</a>
                            <!-- END eportfolio_small -->
                        </li>
                        <li><a href="/submission/dueWork/{ID}" class="icon-timetable">View Due Work</a></li>
                        <li><a href="/submission/allWork/{ID}" class="icon-approve">View Grades</a></li>
                        <li>
                            <!-- BEGIN pastoral_care_small -->
                            <a href="{SYNWEB_URL}/stud.aspx?id={SYNERGYID}" class="icon-modify" target="_blank">View Pastoral</a>
                            <!-- END pastoral_care_small -->
                        </li>
                        <li>
                            <!-- BEGIN has_email_small -->
                            <a href="{HAS_EMAIL_URL}" class="icon-mail" title="Send Email">Email</a>
                            <!-- END has_email_small -->
                        </li>
                    </ul>

                </td>
                <td class="show-for-large-up">{YEARLEVEL}</td>
                <td class="show-for-medium-up">{HOUSE}</td>
                <td class="show-for-medium-up">{LASTVISIT}

                </td>
                <td class="actions-small-1 actions-large-4">
                    <!-- BEGIN actions -->
                    <nav class="hide-for-medium-down">
                                <!-- BEGIN eportfolio -->
                                <a href="/eportfolio/{ID}/profile" class="icon-eportfolio" title="View ePortfolio"></a>
                                <!-- END eportfolio -->

                                <a href="/submission/dueWork/{ID}" class="icon-timetable" title="View Due Work"></a>
                                <a href="/submission/allWork/{ID}" class="icon-approve" title="View Grades"></a>

                                <!-- BEGIN pastoral_care -->
                                <a href="{SYNWEB_URL}/stud.aspx?id={SYNERGYID}" class="icon-modify" title="View Pastoral Care" target="_blank"></a>
                                <!-- END pastoral_care -->
                                <!-- BEGIN has_email -->
                                <a href="{HAS_EMAIL_URL}" class="icon-mail" title="Send Email"></a>
                                <!-- END has_email -->
                    </nav>
                    <nav class="show-for-medium-down">
                        <a href="#" data-dropdown="overflow{ID}" class="icon-more"></a>
                    </nav>
                    <!-- END actions -->

            </tr>
            <!-- END student_list -->
            </tbody>
        </table>
    </div>
</div>
<div class="row">
    <div class="small-12 columns">

        <div class="content">
            <script type="text/javascript">
                $(function() {
                    $('#email-selected-students').click(function(event) {
                        event.preventDefault();
                        var form = $('#contact-table-form');
                        form.data('noStudentEmails', false).data('noParentEmails', false)
                        if (form.valid()) {
                            $('#email-selected-students')
                                    .emailSelected({
                                        source: $('#contact-table'),
                                        url: '/subject/classList/ajax/emailStudentsById.php',
                                        classCode: '{CLASS_CODE}',
                                        target: $(this).find('input[name=bcc]')
                                    })
                                    .on('emailSelected.noEmail', function() {
                                        // Trigger the no student email error
                                        form.data('noStudentEmails', true).valid();
                                    })
                        }
                    });

                    $('#email-selected-parents').click(function(event) {
                        event.preventDefault();
                        var form = $('#contact-table-form');
                        form.data('noStudentEmails', false).data('noParentEmails', false)
                        if (form.valid()) {
                            $('#email-selected-parents')
                                    .emailSelected({
                                        source: $('#contact-table'),
                                        url: '/subject/classList/ajax/emailParentsById.php',
                                        classCode: '{CLASS_CODE}',
                                        target: $(this).find('input[name=bcc]')
                                    })
                                    .on('emailSelected.noEmail', function() {
                                        // Trigger the no parent email error
                                        form.data('noParentEmails', true).valid();
                                    })
                        }
                    });
                });
            </script>
            <ul class="inline-list no-margin">
                <!-- BEGIN email_class -->
                <li class="no-margin">
                    <form id="email-selected-students" action="/mail/createMail.php" method="post" class="no-margin">
                        <input type="hidden" name="replyto" value="&quot;{SUBJECTNAME}&quot; &lt;{REPLYTO}&gt;"/>
                        <input type="hidden" name="bcc" value=""/>
                        <button type="submit" class="button icon-email">Email Selected Students</button>
                    </form>
                </li>
                <!-- END email_class -->

                <!-- BEGIN parent_email -->
                <li class="no-margin">
                    <form id="email-selected-parents" action="/mail/createMail.php" method="post" class="no-margin">
                        <input type="hidden" name="replyto" value="&quot;{SUBJECTNAME}&quot; &lt;{REPLYTO}&gt;"/>
                        <input type="hidden" name="bcc" value="" />
                        &nbsp;<button type="submit" class="button icon-email">Email Parents of Selected Students</button>
                    </form>
                </li>
                <!-- END parent_email -->
            </ul>
        </div>
    </div>
</div>

<div id="errors"></div>
