<!-- BEGIN custom_head -->
<script type="text/javascript" src="/subject/classList/javascript/emailSelected.js"></script>
<script type="text/javascript">
$(function() {

	/* Add "select all" functionality
	 */
	$('#select-all').addSelectAll({
		source: $('#contact-table')
	});

	var form = $('#contact-table-form');

	// Validators for if no student or parent emails were found
	$.validator.addMethod(
		'remote.noStudentEmails',
		function() {
			return !(form.data('noStudentEmails'));
		},
		'No email addresses were found for the selected students.'
	)
	$.validator.addMethod(
		'remote.noParentEmails',
		function() {
			return !(form.data('noParentEmails'));
		},
		'No email addresses were found for the parents of the selected students.'
	)

	/* Validate checkbox selections
	 */
	form.validate({
		rules: {
			"selected[]": {
				required: true,
				minlength: 1,
				'remote.noStudentEmails': true,
				'remote.noParentEmails': true
			}
		},
		messages: {
			"selected[]": {
				required: "Please select at least one student before sending email",
				minlength: "Please select at least one student before sending email"
			}
		},
		errorPlacement: function(error, element) {
			$('#errors').html(error);
		}
	});
});
</script>
<!-- END custom_head -->

<h1>{SUBJECTNAME}</h1>
<form id="contact-table-form">
	<table id='contact-table' class="table">
		<thead>
			<tr>
				<!-- BEGIN select_all -->
				<th width="16px"><input type="checkbox" id='select-all' value="" /></th>
				<!-- END select_all -->
				<th width="60px"></th>
				<th>Name</th>
				<th>Student ID</th>
				<th>Year Level</th>
				<th>House</th>
				<th>Last Visited</th>
			</tr>
		</thead>
		<tbody>
			<!-- BEGIN student_list -->
			<tr class="no-bdr {ON_OFF}">
                <!-- BEGIN select_student -->
				<td class="check"><input type="checkbox" name="selected[]" value="{SYNERGYID}" /></td>
                <!-- END select_student -->
				<td rowspan="2"><img src="/portrait?userId={SYNERGYID}&size=square64" alt="{FIRSTNAME} {SURNAME}"/></td>
				<!-- BEGIN name_with_link -->
				<td class="firstrow"><a href="/search/user/{ID}">{SURNAME}, {FIRSTNAME}</a></td>
				<!-- END name_with_link -->
				<!-- BEGIN name_without_link -->
				<td class="firstrow">{SURNAME}, {FIRSTNAME}</td>
				<!-- END name_without_link -->
				<td class="firstrow">{SYNERGYID}</td>
				<td class="firstrow">{YEARLEVEL}</td>
				<td class="firstrow">{HOUSE}</td>
				<td class="firstrow" nowrap="nowrap">{LASTVISIT}</td>
			</tr>
			<tr class="{ON_OFF}">
				<!-- BEGIN select_student_below -->
				<td>&nbsp;</td>
				<!-- END select_student_below -->
				<td colspan="4" valign="top" style="vertical-align:top;">
					<!-- BEGIN actions -->
					<div class="clearfix action-wrap">
						<!-- BEGIN eportfolio -->
						<a href="/eportfolio/{ID}/profile" title="View ePortfolio" class="btn eportfolio float-left"><span></span>ePortfolio</a>
						<!-- END eportfolio -->
						<a href="/submission/dueWork/{ID}" title="View due work" class="btn time-table float-left"><span></span>Due Work</a>
						<a href="/submission/allWork/{ID}" class="btn tick float-left" title="View grades" ><span></span>Grades</a>

						{EMAIL_BTN}
					</div>
					<!-- END actions -->
				</td>
				<td valign="top" style="vertical-align:top;">
					<div class="alert-wrap">
						<!-- BEGIN special -->
						<img src="/images/famicons/bell.png" title="Special Needs"/>
						<!-- END special -->
						<!-- BEGIN medical -->
						<img src="/images/famicons/exclamation.png" alt="{MEDICAL_ALERT}" title="Medical Alert: {MEDICAL_ALERT}"/>
						<!-- END medical -->
					</div>
				</td>
			</tr>
			<!-- END student_list -->
		</tbody>
	</table>
</form>

<div id="errors"></div>

<!-- BEGIN email_class -->
<script type="text/javascript">
$(function() {
	$('#email-selected-students').click(function(event) {
		event.preventDefault();

		var form = $('#contact-table-form');
		form.data('noStudentEmails', false).data('noParentEmails', false)
		if (form.valid()) {
			$('#email-selected-students').emailSelected({
				source: $('#contact-table'),
				url: '/subject/classList/ajax/emailStudentsById.php',
				classCode: '{CLASS_CODE}',
				target: $(this).find('input[name=bcc]')
			})
			.on('emailSelected.noEmail', function() {
				// Trigger the no student email error
				form.data('noStudentEmails', true).valid();
			})
		}
	});
});
</script>
<form id="email-selected-students" action="/mail/createMail.php" method="post">
	<input type="hidden" name="replyto" value="&quot;{SUBJECTNAME}&quot; &lt;{REPLYTO}&gt;"/>
	<input type="hidden" name="bcc" value=""/>
	<input type="submit" class="submit-btn-plain" value="Email Selected Students"/>
</form>
<!-- END email_class -->
