<!-- BEGIN custom_head -->
<script type="text/javascript" src="/subject/classList/javascript/emailSelected.js"></script>
<script type="text/javascript">
$(function() {

	/* Add "select all" functionality
	 */
	$('#select-all').addSelectAll({
		source: $('#contact-table')
	});

	var form = $('#contact-table-form');

	// Validators for if no student or parent emails were found
	$.validator.addMethod(
		'remote.noStudentEmails',
		function() {
			return !(form.data('noStudentEmails'));
		},
		'No email addresses were found for the selected students.'
	)
	$.validator.addMethod(
		'remote.noParentEmails',
		function() {
			return !(form.data('noParentEmails'));
		},
		'No email addresses were found for the parents of the selected students.'
	)

	/* Validate checkbox selections
	 */
	form.validate({
		rules: {
			"selected[]": {
				required: true,
				minlength: 1,
				'remote.noStudentEmails': true,
				'remote.noParentEmails': true
			}
		},
		messages: {
			"selected[]": {
				required: "Please select at least one student before sending email",
				minlength: "Please select at least one student before sending email"
			}
		},
		errorPlacement: function(error, element) {
			$('#errors').html(error);
		}
	});
});
</script>
<!-- END custom_head -->



<div class="row">
    <div class="small-12 columns">
        <h1>{SUBJECTNAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 columns">
        <form id="contact-table-form" class="top">
            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <table id='contact-table'>
                            <thead>
                            <tr>
                                <th>
                                    <!-- BEGIN select_all -->
                                    <input type="checkbox" id='select-all' value="" />
                                    <label for="select-all" class="checkbox-label"></label>
                                    <!-- END select_all -->
                                </th>
                                <th>Name</th>
                                <th>ID</th>
                                <th>House</th>
                                <th>Last Visited</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- BEGIN student_list -->
                            <tr>
                                <td>
                                    <!-- BEGIN select_student -->
                                    <input type="checkbox" name="selected[]" value="{SYNERGYID}" />
                                    <!-- END select_student -->
                                </td>
                                <td>
                                    <div class="avatar card">
                                        <a href="#" title="View Profile">
                                            <img src="/portrait?userId={SYNERGYID}&size=square64" alt="{FIRSTNAME} {SURNAME}"/>
                                            <!-- BEGIN name_with_link -->
                                            <p><a href="/search/user/{ID}">{SURNAME}, {FIRSTNAME}</a></p>
                                            <!-- END name_with_link -->
                                            <!-- BEGIN name_without_link -->
                                            <p>{SURNAME}, {FIRSTNAME}</p>
                                            <!-- END name_without_link -->
                                        </a>
                                        <p class="meta">{YEARLEVEL}</p>
                                        <p class="meta"></p>
                                    </div>
                                    <div>
                                        <!-- BEGIN special -->
                                        <img src="/images/famicons/bell.png" title="Special Needs"/>
                                        <!-- END special -->
                                        <!-- BEGIN medical -->
                                        <img src="/images/famicons/exclamation.png" alt="{MEDICAL_ALERT}" title="Medical Alert: {MEDICAL_ALERT}"/>
                                        <!-- END medical -->
                                    </div>
                                </td>
                                <td>{SYNERGYID}</td>
                                <td>{HOUSE}</td>
                                <td>{LASTVISIT}</td>
                                <td>
                                    <!-- BEGIN actions -->
                                    <div>
                                        <!-- BEGIN eportfolio -->
                                        <a href="/eportfolio/{ID}/profile" class="button icon-eportfolio" title="View ePortfolio">ePortfolio</a>
                                        <!-- END eportfolio -->
                                        <a href="/submission/dueWork/{ID}" class="button icon-timetable" title="View Due Work">Due Work</a>
                                        <a href="/submission/allWork/{ID}" class="button icon-approve" title="View Grades">Grades</a>
                                        <!-- BEGIN pastoral_care -->
                                        <a href="{SYNWEB_URL}/stud.aspx?id={SYNERGYID}" class="button icon-modify" target="_blank">Pastoral Care</a>
                                        <!-- END pastoral_care -->
                                        {EMAIL_BTN}
                                    </div>
                                    <!-- END actions -->
                                </td>
                            </tr>
                            <!-- END student_list -->
                            </tbody>
                        </table>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Submit" />
                </div>
            </div>
        </form>
    </div>
</div>

<div id="errors"></div>

<!-- BEGIN email_class -->
<script type="text/javascript">
$(function() {
	$('#email-selected-students').click(function(event) {
		event.preventDefault();

		var form = $('#contact-table-form');
		form.data('noStudentEmails', false).data('noParentEmails', false)
		if (form.valid()) {
			$('#email-selected-students').emailSelected({
				source: $('#contact-table'),
				url: '/subject/classList/ajax/emailStudentsById.php',
				classCode: '{CLASS_CODE}',
				target: $(this).find('input[name=bcc]')
			})
			.on('emailSelected.noEmail', function() {
				// Trigger the no student email error
				form.data('noStudentEmails', true).valid();
			})
		}
	});
});
</script>
<form id="email-selected-students" action="/mail/createMail.php" method="post">
	<input type="hidden" name="replyto" value="&quot;{SUBJECTNAME}&quot; &lt;{REPLYTO}&gt;"/>
	<input type="hidden" name="bcc" value=""/>
	<input type="submit" class="submit-btn-plain" value="Email Selected Students"/>
</form>
<!-- END email_class -->
