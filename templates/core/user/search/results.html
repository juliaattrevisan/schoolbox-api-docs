							<a href='/search/user/{USER_SEARCH_ID}'>

							</a>
							<p class="meta">{USER_SEARCH_YEAR} {USER_SEARCH_CAMPUS} {USER_SEARCH_GROUP}</p>
						</div>
					</div>
					<div class="actions one">
						<a href="#" data-dropdown="overflow{USER_SEARCH_ID}" class="no-text icon-more" data-equalizer-watch></a>
					</div>
					<!-- Dropdown -->
					<ul class="f-dropdown" data-dropdown-content="" id="overflow{USER_SEARCH_ID}">
						<!-- BEGIN modify -->
						<li><a href="/adminv2/modify-user/{USER_SEARCH_ID}" class="icon-modify" title="Modify User"><span>Modify</span></a></li>
						<!-- END modify -->

						<!-- BEGIN boarder_leave -->
						<li><a href="/modules/leave/student/{USER_SEARCH_ID}" class="icon-boarder-leave"><span></span>Boarding Leave</a></li>
						<!-- END boarder_leave -->

						<!-- BEGIN timetable -->
						<li><a href="/timetable/{USER_SEARCH_ID}" class="icon-timetable"><span></span>Timetable</a></li>
						<!-- END timetable -->

						<!-- BEGIN user_calendar -->
						<li><a href='/calendar/full/{USER_CALENDAR_CURRENTDATE}/{USER_SEARCH_ID}' class="icon-calendar"><span></span>Calendar</a></li>
						<!-- END user_calendar -->

						<!-- BEGIN eportfolio -->
						<li><a href="/eportfolio/{USER_SEARCH_ID}/profile" class="icon-eportfolio"><span></span>ePortfolio</a></li>
						<!-- END eportfolio -->

						<li><a href="/submission/allWork/{USER_SEARCH_ID}" class="icon-approve"><span></span>Grades</a></li>
						<!-- END grades_button -->

						<!-- BEGIN due_work -->
						<li><a href="/submission/dueWork/0/{USER_SEARCH_ID}" class="icon-due-work"><span></span>Due Work</a></li>
						<!-- END due_work -->

					</ul>
				</li>
			<!-- END user -->
			</ul>
		</section>

<!-- BEGIN see_more -->
<p>
