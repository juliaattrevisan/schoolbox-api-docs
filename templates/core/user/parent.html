<div class="row">
    <div class="small-12 column">
        <h1>{NAME}</h1>
        <span class='header-actions'>
            <!-- BEGIN modify -->
            <a href="/adminv2/modify-user/{ID}" class="button icon-modify" title="Modify User"></a>
            <!-- END modify -->
        </span>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <section class="no-pad">
            <div class="content no-pad">
                <div class="row no-margin">
                    <div class="small-12 medium-6 large-4 columns no-pad">
                        <!-- BEGIN portrait -->
                        <img src="/portrait.php?userId={SYNERGY_ID}&amp;size=profile" class="full-width"/>
                        <!-- END portrait -->
                    </div>

                    <div class="small-12 medium-6 large-8 columns no-pad">
                        <dl class="inline-dl no-margin">
                            <dt class="no-margin small-6 medium-3">Email</dt>
                            <dd class="no-margin small-6 medium-9">{EMAIL}</dd>
                            <!-- BEGIN parent_synergy_form -->
                            <dt class="no-margin small-6 medium-3">Home Phone</dt>
                            <dd class="no-margin small-6 medium-9">{HOME_PHONE}</dd>
                            <dt class="no-margin small-6 medium-3">Mobile Phone</dt>
                            <dd class="no-margin small-6 medium-9">{MOBILE_PHONE}</dd>

                            <!-- BEGIN parent_spouse -->
                            <dt class="no-margin small-12">Partner</dt>
                            <dd class="no-margin small-12">
                                <div class="avatar-card">
                                    <a href="#" title="View Profile">
                                        <img src="/portrait.php?userId={SPOUSE_EXTERNAL_ID}&amp;size=square64">
                                        <p>{SPOUSE_NAME}</p>
                                    </a>
                                    <p class="meta">{SPOUSE_EMAIL}</p>
                                    <p class="meta">{SPOUSE_MOBILE}</p>
                                </div>
                            </dd>
                            <!-- END parent_spouse -->
                            <!-- END parent_synergy_form -->
                        </dl>
                    </div>
                </div>
                <ul class="no-margin small-block-grid-2 medium-block-grid-4 large-block-grid-6 xlarge-block-grid-8" data-equalizer>

                    <!-- BEGIN eportfolio -->
                    <li class="no-pad">
                        <a href="/eportfolio/{ID}/profile"
                           class="no-margin fat button icon-fat icon-32 icon-eportfolio"
                           data-equalizer-watch>ePortfolio</a>
                    </li>
                    <!-- END eportfolio -->

                    <!-- BEGIN user_calendar -->
                    <li class="no-pad">
                        <a href='/calendar/full/{USER_CALENDAR_CURRENTDATE}/{ID}'
                           class="no-margin fat button icon-fat icon-32 icon-calendar"
                           data-equalizer-watch>Calendar</a>
                    </li>
                    <!-- END user_calendar -->
                </ul>
            </div>
        </section>
    </div>
</div>
