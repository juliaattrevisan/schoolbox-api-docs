<div class="box manage" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2 class="hide">Manage Folder</h2>
	<!-- BEGIN config --> 
	<!--<a class="close-delete folder-manage hide" href="#"><span>X</span></a>-->
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="text"> 
		<!-- BEGIN subscribedModerated -->
		<div class="subscribe awaiting-auth clearfix"> <a href="/group/joinForm.php?leave={ID}&return=true" class="btn delete margin-left-right"><span></span>Unsubscribe</a>
			<p>You are being moderated and <br />
				awaiting authorisation. </p>
		</div>
		<!-- END subscribedModerated --> 
		
		<!-- BEGIN subscribed -->
		<div class="subscribe subscribed clearfix"> <a href="/group/joinForm.php?leave={ID}&return=true" class="btn delete margin-left-right"><span></span>Unsubscribe</a>
			<p>You are subscribed to this group. </p>
		</div>
		<!-- END subscribed --> 
		
		<!-- BEGIN unsubscribed -->
		<div class="subscribe not-subscribed  clearfix"> <a href="/group/joinForm.php?join={ID}&return=true" class="btn add margin-left-right"><span></span>Subscribe</a>
			<p>You are not subscribed yet. </p>
		</div>
		<!-- END unsubscribed -->
		
<p class="interact">
			<a href="/resources/{ID}" class="btn"><span></span>Browse Resources</a>
            <!-- BEGIN addmylinks -->
            <a href="/cms/myLinksForm.php?url={HOMEPAGE_URL}&description={HEADING}" class="btn"><span></span>Add to My Links</a>
            <!-- END addmylinks -->
			<!-- BEGIN manage_page -->
			<a href="/group/modify/{ID}" class="btn groups"><span></span>Manage Group</a>
			<!-- END manage_page -->
			<!-- BEGIN stats_data -->
			<a href="/cms/category/{ID}" class="btn modify"><span></span>Modify Folder</a></p><div class="float-fix"></div>
			<!-- END stats_data -->
		</p>
	</div>

</div>
