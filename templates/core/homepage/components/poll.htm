<div class="box clearfix poll" id="component{COMPONENT_HOMEPAGE_ID}">
<!-- BEGIN custom_head -->
<script type='text/javascript' src='/javascript/flot/excanvas.min.js'></script>
<script type='text/javascript' src='/javascript/flot/jquery.flot.js'></script>
<script type='text/javascript' src='/javascript/flot/jquery.flot.resize.js'></script>
<!-- END custom_head-->
	<h2>{POLL_TITLE}</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
			<label for="size">Poll: </label>
			<select name="pollID">
				<!-- BEGIN select -->
				<option value="{COMPONENT_CONFIG_SELECT_VALUE}"{COMPONENT_CONFIG_SELECT_SELECTED}>{COMPONENT_CONFIG_SELECT_NAME}</option>
				<!-- END select -->
			</select>
			<input type="submit" value="Update" class="submit-btn update" />
		</form>
	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<!-- BEGIN poll_vote -->
	<script type="text/javascript">
    function validatePoll () {
		var valid = false;
		$j('input.pollOption').each(function () {
			if ($j(this).attr('checked'))
				valid = true;
			}
		);
		if (valid)
			return valid;

		alert('Please select an option.');
		return valid;
	}
    </script>
	<div class="text">
		<h3>{POLL_QUESTION}</h3>
		<br />
		<form action="/poll/modifyForm.php" method="post" class="clearfix" id="pollForm">
			<input type="hidden" name="pollID" value="{POLL_ID}" />
			<input type="hidden" name="categoryID" value="{ID}" />
			<!-- BEGIN poll_options -->
			<label for="{POLL_OPTION_INDEX}">
				<input type="radio" name="vote" class="pollOption" id="{POLL_OPTION_INDEX}" value="{POLL_OPTION_INDEX}" />
				{POLL_OPTION}</label>
			<!-- END poll_options -->
			<input type="submit" value="Vote" onclick="return validatePoll();" class="submit-btn-plain"/>
		</form>
	</div>
	<!-- END poll_vote -->
	<!-- BEGIN poll_chart -->
	<script type='text/javascript'>
	$j(function() {
		$j.plot($j("#poll-graph{POLL_ID}"),
			[
				<!-- BEGIN poll_responses -->
				{
					label: "{POLL_OPTION}",
					data: [[{POLL_OPTION_INDEX}, {VALUE}]],
					bars: {show:true}
				}<!-- BEGIN series_separator -->,<!-- END series_separator -->
				<!-- END poll_responses -->
			],
				{
					legend: {container: '#poll_legend{POLL_ID}'},
					xaxis: {show:false}
				}
		);

	});
	</script>
	<div class="pad-it">
		<div id='poll-graph{POLL_ID}' style="width:100%; height:300px; "></div>
	</div>
	<!-- END poll_chart -->
	<p class="interact">
		<!-- BEGIN show_results -->
			<a href="/homepage/{ID}/pollResults" class="btn"><span></span>Show results</a>
		<!-- END show_results -->
		<!-- BEGIN modify_poll -->
			<a href="/poll/modifyForm.php?delete={POLL_ID}" onclick="return confirm('Delete Poll?');" class="btn delete"><span></span>Delete</a>
			<a href="/poll/modify/{POLL_ID}" class="btn modify"><span></span>Modify</a>
        <!-- END modify_poll -->
			<a href="/poll/modify/new/{ID}/{COMPONENT_HOMEPAGE_ID}" class="btn create"><span></span>Create New Poll</a>
    </p>

	<div id='poll_legend{POLL_ID}'></div>
	
</div>
