<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Drop Box</h2>
	<!-- BEGIN config --> 
    <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel delete-it hide">
	<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
		  <input type="hidden" name="cid" value="{ID}" />
		  <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
                  <input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	<div class="float-fix"></div>
	</div>

	<!-- END config -->
	<div class="text listing"> 
		<!-- BEGIN drop_student -->
		<form action="/subject/modDropBox.php" method="post" enctype="multipart/form-data" class="dropBox" >
			<!-- BEGIN drop_success -->
			<fieldset>
				<p class="icons success pad">File upload completed successfully.</p>
			</fieldset>
			<!-- END drop_success -->
			<fieldset class="drop-left">
				<h3>Description</h3>
				<input name="description" type="text" />
				<input type="hidden" name="category" value="{ID}" />
			</fieldset>
			<div class="float-fix"></div>
			<fieldset class="drop-right">
				<h3>File</h3>
				<input name="file" type="file" />
			</fieldset>
			<div class="float-fix"></div>
			<fieldset class="submit">
				<input type="submit" value="Upload" class="drop-submit"/>
			</fieldset>
		</form>
		<!-- END drop_student --> 
		<!-- BEGIN drop_staff -->
		<ul>
			<!-- BEGIN drop_file -->
			<li class="{ON_OFF}">
				<h4><a class="icons {DROPBOX_MIME_IMAGE}" href="/subject/modDropBox.php?id={DROPBOX_ID}">{DROPBOX_DESCRIPTION}</a></h4>
				<div class="small-right">
					<p class="interact"><a href="/subject/modDropBox.php?delete={DROPBOX_ID}">Delete</a></p>
					
				</div>
				<p class="interact hide-on-small">By {DROP_SUBMITTED_BY} on {DROP_SUBMITTED_TIME}</p>
				<div class="float-fix"></div>
			</li>
			<!-- END drop_file -->
		</ul>
		<!-- END drop_staff -->
		<div class="float-fix"></div>
	</div>
</div>
