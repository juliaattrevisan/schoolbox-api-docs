<div class="box" id="component{ID}">
  <h2>Drop Box</h2>
  <div class="text listing">
  <!-- BEGIN drop_student -->
  <form action="/subject/modDropBox.php" method="post" enctype="multipart/form-data" class="standardForm" >
    <table cellspacing="0">
      <tr>
        <td class="small_text"><h3>Description</h3></td>
        <td class="small_text"><input name="description" type="text" /><input type="hidden" name="category" value="{ID}" /></td>
      </tr>
      <tr>
        <td class="small_text"><h3>File</h3></td>
        <td class="small_text"><input name="file" type="file" /></td>
      </tr>
      <tr><td class="small_text">&nbsp;</td><td class="small_text"><input type="submit" name="submit" value="Upload" /></td></tr>
    </table>
  </form>
  <!-- END drop_student -->
  <!-- BEGIN drop_staff -->
  <ul>
    <!-- BEGIN drop_file -->
    <li class="{ON_OFF}">
    	<h3 class="icons {DROPBOX_MIME_IMAGE}"><a href="/subject/modDropBox.php?id={DROPBOX_ID}">{DROPBOX_DESCRIPTION}</a></h3>
      <p class="interact"><a href="/subject/modDropBox.php?delete={DROPBOX_ID}">Delete</a></p>
      <p class="small">By {DROP_SUBMITTED_BY} on {DROP_SUBMITTED_TIME}</p>
      <div class="float-fix"></div>
    </li>
    <!-- END drop_file -->
  </ul>
  <!-- END drop_staff -->
  <div class="float-fix"></div>
  </div>
</div>
