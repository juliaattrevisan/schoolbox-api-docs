<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="large_head">News</h2>
  </div>
    <!-- BEGIN config -->
  <a class="config" onclick="toggleConfig('component{COMPONENT_ID}');"></a>
  <div class="componentConfig">
    <form action="/subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table cellspacing="0px" class="componentContent" style="border-bottom:1px solid #666;">
    <!-- BEGIN news -->
    <tr>
      <td class="large_text"><h3>{NEWS_HEADING}</h3></td>
      <td class="large_text" style="text-align:right;">{MOD_NEWS}</td>
    </tr>
    <tr>
      <td class="large_text" colspan="2">{NEWS_BODY}</td>
    </tr>
    <tr>
      <td class="large_text" style="text-align:right; border-bottom:1px solid #666;" colspan="2"><span class="element_footer">Posted by {EMAIL_CONTACT} on {POSTED_DATE}</span></td>
    </tr>
    <!-- END news -->
  </table>
  <div class="componentNav" style="text-align:right;"><a href="/subject/newsArchive.php?category={ID}">VIEW ARCHIVE</a></div>
  <!-- BEGIN submit_news -->
  <div class="componentNav" style="text-align:right;"><a href="/subject/modSubNews.php?category={ID}">POST NEWS</a></div>
  <!-- END submit_news -->
</div>
