<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
	<link rel="stylesheet" href="/css/jquery.slimbox.css" type="text/css" media="screen" />
	<script type="text/javascript" src="/javascript/jquery.slimbox.js"></script>
	<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
	<script type="text/javascript">
		$j(function(){
			/* Modal for URL homepage selection
			 */
			$j('#resource-browser').dialog({
				width:650,
				autoOpen:false,
				title:"Select a homepage",
				modal:true,
				resizable:false
			});

			$j('#launch-browser-{COMPONENT_HANDLE}').click(function () {
				$j('#resource-browser').load('/ajax/resourceBrowser', {destination:'#homepage-imagegallery-{COMPONENT_HANDLE}'}, function () {
					$j('#resource-browser').dialog('open');
				});

				return false;
			});
		});
	</script>
	<h2>{COMPONENT_NAME}</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />

			<label for="componentname">Name: </label>
			<input id="componentname" type="text" name="componentname" value="{COMPONENT_NAME}" />

			<label for="size">Image Rows: </label>
			<select name="size">
				<!-- BEGIN size -->
				<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
				<!-- END size -->
			</select>

			<span>Displaying: <a href="{COMPONENT_CONFIG_SRC_ID}">{COMPONENT_CONFIG_SRC_NAME}</a> </span>
			<input type="button" value="Select Alternate Source" id="launch-browser-{COMPONENT_HANDLE}" />
			<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="homepage-imagegallery" id="homepage-imagegallery-{COMPONENT_HANDLE}"/>

			<input type="submit" value="Update" class="submit-btn update" />
		</form>
	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="clearfix">
		<!-- BEGIN image_gallery -->
		<div class="float-left image-thumbnail" >
			<a class="thumb" href="/cms/image.php?id={THUMBNAIL_ID}&height=600&width=800" rel="lightbox[portal]" style="height:{IMAGE_HEIGHT}px;" alt="{THUMBNAIL_DESCRIPTION}" title="{THUMBNAIL_DESCRIPTION}">
				<img src="/cms/image.php?id={THUMBNAIL_ID}&height={THUMBNAIL_SIZE}&width={THUMBNAIL_SIZE}&resample=0" alt="{THUMBNAIL_DESCRIPTION}" border="0" />
			</a>
		</div>
		<!-- END image_gallery -->
	</div>
	<!-- BEGIN submit_image -->
	<a href="/cms/file/multi/{IMAGEGALLERY_CATEGORY_ID}" class="btn up-arrow"><span></span>Post Images</a>
	<!-- END submit_image -->
	<p class="interact"><a href="/cms/imageGallery/{IMAGEGALLERY_CATEGORY_ID}" class="btn"><span></span>Full Gallery</a> </p>
</div>
