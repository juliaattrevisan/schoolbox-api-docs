<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
	<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
	<script type="text/javascript" src="/javascript/jquery.cycle.js"></script>
	<script type="text/javascript">
	$j(function () {
        if ($j('#image-scroller-{COMPONENT_HOMEPAGE_ID} img').length > 1) {
            $j('#image-scroller-{COMPONENT_HOMEPAGE_ID}').delay(2000).cycle({
                timeout: {COMPONENT_CONFIG_TIMING_VALUE_MS},
                cleartype: true,
                after: function(curr)
                 {
                    var append = $j(this).attr('alt');
                    $j('#caption-holder-{COMPONENT_HOMEPAGE_ID}').text(append);
                }
            });
        }
		else {
            var append = $j('#image-scroller-{COMPONENT_HOMEPAGE_ID} img').attr('alt');
            $j('#caption-holder-{COMPONENT_HOMEPAGE_ID}').text(append);
        }

		/* Modal for URL homepage selection
		 */
		$j('#resource-browser').dialog({
			width:650,
			autoOpen:false,
			title:"Select a homepage",
			modal:true,
			resizable:false
		});

		$j('#launch-browser-{COMPONENT_HANDLE}').click(function () {
			$j('#resource-browser').load('/ajax/resourceBrowser', {destination:'#homepage-imagescroller-{COMPONENT_HANDLE}'}, function () {
				$j('#resource-browser').dialog('open');
			});

			return false;
		});
	});
	</script>
    <h2>{COMPONENT_NAME}</h2>
    <!-- BEGIN config -->
    <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
	<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />

			<label for="componentname">Name: </label>
			<input id="componentname" type="text" name="componentname" value="{COMPONENT_NAME}" />

			<label>Pixels:</label>

			<input id='url' type="text" name="pixel" value="{COMPONENT_PIXEL}" size="4"/>

			<label for="caption">
				Captions:
				<select id='caption' name="captionState">
					<!-- BEGIN caption_state -->
					<option value="{COMPONENT_CONFIG_CAPTION_STATE_VALUE}" {COMPONENT_CONFIG_CAPTION_STATE_SELECTED}>{COMPONENT_CONFIG_CAPTION_STATE_NAME}</option>
					<!-- END caption_state -->
				</select>
			</label>
			<label for="timing">
				Timing:
				<select id='timing' name="timing">
					<!-- BEGIN timing -->
					<option value="{COMPONENT_CONFIG_TIMING_VALUE}" {COMPONENT_CONFIG_TIMING_SELECTED}>{COMPONENT_CONFIG_TIMING_VALUE} seconds</option>
					<!-- END timing -->
				</select>
			</label>

			<span>Displaying: <a href="{COMPONENT_CONFIG_SRC_ID}">{COMPONENT_CONFIG_SRC_NAME}</a> </span>
			<input type="button" value="Select Alternate Source" id="launch-browser-{COMPONENT_HANDLE}" />
			<input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="homepage-imagescroller" id="homepage-imagescroller-{COMPONENT_HANDLE}"/>

			<input type="submit" value="Update" class="submit-btn update" />
    	</form>
  	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
    <!-- END config -->

    <div id="galleryCycle" class="box clearfix">
		<div id='image-scroller-{COMPONENT_HOMEPAGE_ID}' class="cycle-content">
			<!-- BEGIN image -->
			<img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}" alt="{IMAGE_NAME}"/>
			<!-- END image -->
		</div>
		<!-- BEGIN show_caption -->
		<div id='caption-holder-{COMPONENT_HOMEPAGE_ID}' class="caption-holder"></div>
		<!-- END show_caption -->
    </div>

	<!-- BEGIN submit_image -->
	<p class="interact clearfix"><a href="/cms/file/multi/{IMAGESCROLLER_CATEGORY_ID}" class="btn up-arrow"><span></span>Post Images</a></p>
	<!-- END submit_image -->
</div>
