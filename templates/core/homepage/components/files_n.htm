<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>{COMPONENT_NAME}</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
			<label for="componentname">Name: </label>
			<input id="componentname" type="text" name="componentname" value="{COMPONENT_NAME}" />

			Compact Mode:
			<label for="files{COMPONENT_HOMEPAGE_ID}">
				<input type="hidden" name="compactMode" value="0" />
				<input id="files{COMPONENT_HOMEPAGE_ID}" type="checkbox" name="compactMode" value="1" {COMPONENT_CONFIG_COMPACTMODE_SELECTED} />
			</label>

			<!-- BEGIN filter -->
			<label for="{COMPONENT_CONFIG_FILTER_VALUE}">
				<input type="checkbox" name="filter[]" value="{COMPONENT_CONFIG_FILTER_VALUE}" {COMPONENT_CONFIG_FILTER_SELECTED} />
				{COMPONENT_CONFIG_FILTER_NAME} </label>
			<!-- END filter -->
			<label for="sort">Sort: </label>
			<select name="sort">
				<!-- BEGIN sort -->
				<option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
				<!-- END sort -->
			</select>
			<select name="sortdir">
				<!-- BEGIN sortdir -->
				<option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
				<!-- END sortdir -->
			</select>
			<label for="size">Item Limit: </label>
			<select name="size">
				<!-- BEGIN size -->
				<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
				<!-- END size -->
			</select>
			<input type="submit" value="Update" class="submit-btn update" />
		</form>
	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="listing clearfix">
		<ul>
			<!-- BEGIN files -->
			<li class="{ON_OFF} clearfix">

				<!-- BEGIN file_url -->
				<h4><a class="icons {HIDDEN} {FILE_MIME_IMAGE}" href="{FILE_URL}" rel="external">{FILE_DESCRIPTION}</a></h4>
				<!-- END file_url -->
				<!-- BEGIN file_no_url -->
				<h4 class="hide-on-small">{FILE_DESCRIPTION}</h4>
				<!-- END file_no_url -->

				<div class="small-right">
					<!-- BEGIN modify_file -->
					<p class="interact"> <a href="/cms/file/{FILE_ID}">Modify</a> </p>
					<!-- END modify_file -->
				</div>
				<span class="{COMPONENT_COMPACTMODE} hide-on-small">{FILE_COMMENT}</span>
				<p class="{COMPONENT_COMPACTMODE} interact hide-on-small">Posted by <a href="/search/user/{FILE_POSTED_BY_ID}">{FILE_POSTED_BY}</a> on {FILE_POSTED_DATE}</p>
			</li>
			<!-- END files -->
		</ul>
	</div>
    <p class="interact"><a href="/resources/{ID}" class="btn"><span></span>View All Files</a>
	<!-- BEGIN submit_file -->
	<a href="/cms/file/new/{ID}" class="btn up-arrow"><span></span>Post File</a>
    <a href="/cms/file/multi/{ID}" class="btn up-arrow"><span></span>Post Multiple Files</a>
	<!-- END submit_file -->
    </p>
</div>
