<div class="box" id="component{COMPONENT_ID}">
  <h2>Files</h2>
  <!-- BEGIN config -->
  <a class="edit">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="filter">Show</label>
      <select name="filter">
        <!-- BEGIN filter -->
        <option value="{COMPONENT_CONFIG_FILTER_VALUE}"{COMPONENT_CONFIG_FILTER_SELECTED}>{COMPONENT_CONFIG_FILTER_NAME}</option>
        <!-- END filter -->
      </select>
      <label for="sort">Sort: </label>
      <select name="sort">
        <!-- BEGIN sort -->
        <option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
        <!-- END sort -->
      </select>
      <select name="sortdir">
        <!-- BEGIN sortdir -->
        <option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
        <!-- END sortdir -->
      </select>
      <label for="size">Item Limit: </label>
      <select name="size">
        <!-- BEGIN size -->
        <option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
        <!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
  <!-- END config -->
  <div class="text listing">
    <ul>
      <!-- BEGIN files -->
      <li class="{ON_OFF}">
        <!-- BEGIN file_url -->
        <h3><a class="icons {FILE_MIME_IMAGE}" href="{FILE_URL}" target="{FILE_TARGET}" >{FILE_DESCRIPTION}</a></h3>
        <!-- END file_url -->
        <!-- BEGIN file_no_url -->
        <h3>{FILE_DESCRIPTION}</h3>
        <!-- END file_no_url -->
        <p class="interact">
          <!-- BEGIN modify_file -->
          <a href="/cms/file/{FILE_ID}">Modify</a>
          <!-- END modify_file -->
        </p>
        <p class="summ">{FILE_COMMENT}</p>
        <p class="small summ">Posted by <a href="/search/user/{FILE_POSTED_BY_ID}">{FILE_POSTED_BY}</a> on {FILE_POSTED_DATE}</p>
        <div class="float-fix"></div>
      </li>
      <!-- END files -->
    </ul>
    <div class="float-fix"></div>
  </div>
  <!-- BEGIN submit_file -->
  <p class="interact"><a href="/cms/file/new/{ID}">Post File</a></p>
  <!-- END submit_file -->
</div>
