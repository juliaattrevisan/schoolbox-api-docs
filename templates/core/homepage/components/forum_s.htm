<div class="box" id="component{COMPONENT_ID}">
  <h2>Hot Topics</h2>
<!-- BEGIN config -->
  <a class="edit">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <div class="text listing">
  	<ul>
    	<!-- BEGIN forum -->
      <li class="{ON_OFF}">
      <p><a href="/forum/viewForum.php?cid={ID}&msgid={FORUM_ID}">{FORUM_HEAD}</a></p>
      <p class="interact"><a href="/forum/modpost.php?cid={ID}&parent={FORUM_ID}">Reply</a></p>
      <div class="float-fix"></div>
      <p class="small summ">Posted by <a href="/search/user/{FORUM_POSTER_ID}">{FORUM_POSTER}</a> {FORUM_POSTED_DATE}</p>
      <div class="float-fix"></div>
      </li>
      <!-- END forum -->
    </ul>
  </div>
  <p class="interact"><a href="/forum/viewForum.php?cid={ID}">Goto Forum</a></p>
</div>
