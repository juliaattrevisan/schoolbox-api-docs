<div class="box" id="component{COMPONENT_ID}">
    <h2>Online Assessments</h2>
	<!-- BEGIN config -->

	<!-- END config -->
	<div class="text listing">
		<ul class="pad-it">
			<!-- BEGIN assess -->
			<li class="{ON_OFF}">
				<h4><em>{ASSESS_TITLE}</em>
                <p>
                    Starts on {ASSESS_START_DATE}<br />
                    Due by {ASSESS_FINISH_DATE}
                </p>
                <p>{ASSESS_DESCRIPTION}</p></h4>

				<div class="small-right">
					<!-- BEGIN studentLink --> 
					<p class="interact">
                        <a href="/assess/intro/{ASSESS_ASSESS_ID}" class="take-test-btn">Take test</a>
						<div class="float-fix"></div>
					</p>

					<!-- END studentLink -->
					<!-- BEGIN teacherLink -->
					<p class="interact">
						<a href="/assess/modify/{ASSESS_ASSESS_ID}">Modify</a> |
						<a href="/assess/results/{ASSESS_ASSESS_ID}">View Results</a>
					</p>
					<!-- END teacherLink -->

                        
					</p>
				</div>

                <div class="float-fix"></div>
			</li>
			<!-- END assess -->
		</ul>

        <!-- BEGIN createAssessment -->
        <p class="interact pad-it">
            <a href="/assess/create/{ASSESS_CATEGORY_ID}">Create Assessment</a>
        </p>
        <!-- END createAssessment -->
	</div>
</div>
