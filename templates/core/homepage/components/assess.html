<div class="box" id="component{COMPONENT_ID}">
    <h2>Online Assessments</h2>
	<div>
		<ul>
			<!-- BEGIN assess -->
			<li>
				<h4><em>{ASSESS_TITLE}</em></h4>
                <p>Due by {ASSESS_FINISH_DATE}</p>
                <p>{ASSESS_DESCRIPTION}</p>

				<div class="small-right">
                    <!-- BEGIN teacherLink -->
                    <p class="interact">
                        <a href="/assess/modify/{ASSESS_ASSESS_ID}">Modify</a> |
                        <a href="/assess/results/{ASSESS_ASSESS_ID}">View Results</a>
                    </p>
                    <!-- END teacherLink -->

                    <!-- BEGIN studentLink -->
                    <p class="interact">
                        <a href="/assess/intro/{ASSESS_ASSESS_ID}">Take test</a>
                    </p>
                    <!-- END studentLink -->
				</div>

                <div class="float-fix"></div>
			</li>
			<!-- END assess -->
		</ul>

        <!-- BEGIN createAssessment -->
        <p class="interact">
            <a href="/assess/create/{ASSESS_CATEGORY_ID}">Create Assessment</a>
        </p>
        <!-- END createAssessment -->
	</div>
</div>
