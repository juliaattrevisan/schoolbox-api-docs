<div class="box" id="component{COMPONENT_ID}">
    <h2>Online Assessments</h2>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Due Date</th>
                <!-- BEGIN teacherHeader -->
                <th>Edit</th>
                <th>View Results</th>
                <!-- END teacherHeader -->
                <!-- BEGIN studentHeader -->
                <th>Take test</th>
                <!-- END studentHeader -->
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN assess -->
            <tr>
                <td>{ASSESS_TITLE}</td>
                <td>{ASSESS_FINISH_DATE}</td>
                <!-- BEGIN teacherLink -->
                <td><a href="/assess/modify/{ASSESS_ASSESS_ID}">Edit</a></td>
                <td><a href="/assess/results/{ASSESS_ASSESS_ID}">View Results</a></td>
                <!-- END teacherLink -->
                <!-- BEGIN studentLink -->
                <td><a href="/assess/intro/{ASSESS_ASSESS_ID}">Take test</a></td>
                <!-- END studentLink -->
            </tr>
            <!-- END assess -->
        </tbody>
    </table>

    <!-- BEGIN createAssessment -->
    <a href="/assess/create/{ASSESS_CATEGORY_ID}">Create Assessment</a>
    <!-- END createAssessment -->
</div>
