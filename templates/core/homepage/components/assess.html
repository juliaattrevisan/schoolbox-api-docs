<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
    <h2>Online Assessments</h2>
	<!-- BEGIN config -->
    <a class="close-delete" href="#"><span>X</span></a>

	<div class="editPanel delete-it hide">
	<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
		  <input type="hidden" name="cid" value="{ID}" />
		  <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
                  <input type="hidden" name="component" value="{COMPONENT_ID}" />
		  <a href="#" class="delete-accept btn delete"><span></span>Yes</a>
		  <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	<div class="float-fix"></div>
	</div>

	<!-- END config -->
	<div class="text listing">
		<ul>
			<!-- BEGIN assess -->
			<li class="{ON_OFF}">
				<h4>{ASSESS_TITLE}</h4>
				<div class="float-fix"></div>
                <p>
                    Starts on {ASSESS_START_DATE}<br />
                    Due by {ASSESS_FINISH_DATE}<br />

					<!-- BEGIN hasCompleted -->
					<strong>Completed</strong>
					<!-- END hasCompleted -->
                </p>

                <p>{ASSESS_DESCRIPTION}</p>

				<div class="small-right">
					<!-- BEGIN resumeLink -->
					<p class="interact">
                        <a href="/assess/attempt/{ASSESS_ASSESS_ID}/{ASSESS_SECTION_ID}" class="btn go-to"><span></span>Resume Test</a>
						<div class="float-fix"></div>
					</p>
					<!-- END resumeLink -->

					<!-- BEGIN studentLink -->
					<p class="interact">
                        <a href="/assess/intro/{ASSESS_ASSESS_ID}" class="btn go-to"><span></span>Take test</a>
						<div class="float-fix"></div>
					</p>
					<!-- END studentLink -->

					<!-- BEGIN teacherLink -->
					<p class="interact">
						<a href="/assess/results/{ASSESS_ASSESS_ID}" class="btn go-to"><span></span>View Results</a>
						<a href="/assess/modify/{ASSESS_ASSESS_ID}" class="btn go-to"><span></span>Modify</a>
					</p>
					<!-- END teacherLink -->

					<!-- BEGIN resultsLink -->
					<p class="interact">
						<a href="/submission/dueWork" class="btn go-to"><span></span>View Results</a>
					</p>
					<!-- END resultsLink -->
				</div>

                <div class="float-fix"></div>
			</li>
			<!-- END assess -->
		</ul>

        <!-- BEGIN createAssessment -->
		<a href="/assess/create/{ID}" class="btn create"><span></span>Create Assessment</a>
        <!-- END createAssessment -->
	</div>
</div>
