<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Online Assessments</h2>
	<!-- BEGIN config --> 
	<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	
	<!-- END config -->
	<div class="listing">
		<ul>
			<!-- BEGIN assess -->
			<li class="{ON_OFF} clearfix">
				<h4><strong>{ASSESS_TITLE}</strong><br />
					Starts on {ASSESS_START_DATE}<br />
					Due by {ASSESS_FINISH_DATE}<br />
					<br />
					<em>{ASSESS_DESCRIPTION}</em></h4>
				<p class="small-right"> 
					<!-- BEGIN resumeLink --> 
					<a href="/assess/attempt/{ASSESS_ASSESS_ID}/{ASSESS_SECTION_ID}" >Resume Test</a><br />
					<!-- END resumeLink --> 
					
					<!-- BEGIN studentLink --> 
					<a href="/assess/intro/{ASSESS_ASSESS_ID}" >Take test</a><br />
					<!-- END studentLink --> 
					
					<!-- BEGIN teacherLink --> 
					
					<a href="/assess/results/{ASSESS_ASSESS_ID}">View Results</a><br />
					<a href="/assess/modify/{ASSESS_ASSESS_ID}">Modify</a><br />
					<!-- END teacherLink --> 
					
					<!-- BEGIN resultsLink --> 
					<a href="/submission/dueWork" >View Results</a><br />
					<!-- END resultsLink --> 
					
					<!-- BEGIN hasCompleted --> 
					<strong>Completed</strong> 
					<!-- END hasCompleted --> 
				</p>
			</li>
			<!-- END assess -->
		</ul>
		
		<!-- BEGIN createAssessment --> 
		<a href="/assess/create/{ID}" class="btn create"><span></span>Create Assessment</a> 
		<!-- END createAssessment --> 
	</div>
</div>
