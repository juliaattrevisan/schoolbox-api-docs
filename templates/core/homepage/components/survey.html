<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Surveys</h2>
	<!-- BEGIN config -->
	<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->

	<div class="listing">
		<ul>
			<!-- BEGIN survey -->
			<li class="{ON_OFF} clearfix">
				<h4><strong>{SURVEY_TITLE}</strong><br />
					Starts on {SURVEY_START_DATE}<br />
					Due by {SURVEY_FINISH_DATE}<br />
					<br />
					<em>{SURVEY_DESCRIPTION}</em></h4>
				<p class="small-right">
					<!-- BEGIN resumeLink -->
					<a href="/survey/attempt/{SURVEY_ASSESS_ID}/{SURVEY_SECTION_ID}" >Resume Test</a><br />
					<!-- END resumeLink -->

					<!-- BEGIN studentLink -->
					<a href="/survey/intro/{SURVEY_ASSESS_ID}" >Take test</a><br />
					<!-- END studentLink -->

					<!-- BEGIN teacherLink -->
					<a href="/survey/results/{SURVEY_ASSESS_ID}">View Results</a><br />
					<a href="/survey/modify/{SURVEY_ASSESS_ID}">Modify</a><br />
					<!-- END teacherLink -->

					<!-- BEGIN resultsLink -->
					<a href="/submission/dueWork" >View Results</a><br />
					<!-- END resultsLink -->

					<!-- BEGIN hasCompleted -->
					<strong>Completed</strong>
					<!-- END hasCompleted -->
				</p>
			</li>
			<!-- END survey -->
		</ul>

		<!-- BEGIN createSurvey -->
		<a href="/survey/create/{ID}" class="btn create"><span></span>Create Survey</a>
		<!-- END createSurvey -->
	</div>
</div>
