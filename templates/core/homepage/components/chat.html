<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/stdfuncs.js"></script>
<script type="text/javascript" src="/javascript/jquery.color.js"></script>
<script type="text/javascript" src="/javascript/jquery.ui.js"></script>
<script type="text/javascript" src="/javascript/chat.js"></script>
<script type="text/javascript">
	$j(function () {

        $j('#component{COMPONENT_HOMEPAGE_ID}').chat({
            state: '{CHAT_STATE}',
            category_id: '{ID}',
            component_id: '{CHAT_COMPONENT_ID}',
            user_id: '{CHAT_USER_ID}',
            user_name: '{CHAT_USER_NAME}',
            user_perm: '{CHAT_USER_PERM}',
            log_el: 'ul.chat-messages',
            send_el: 'a.btn'
        });

		$j('.show-users').click(function(event) {
			event.preventDefault();
			$j('.chat-users').slideToggle();
			$j(this).toggleClass('active')
		});
	});
	
	</script>
<!-- END custom_head -->

<div class="box chat" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Chat<span class="light"></span></h2>
	<!-- BEGIN config --> 
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form class="component-config" action="/homepage/configForm.php" id="configForm" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="state" value="{COMPONENT_CONFIG_STATE}" id="chat-status"/>
			Control chat availability:
            <select name="state" id="state-dropdown">
				<!-- BEGIN chat_state -->
				<option value="{COMPONENT_CONFIG_CHAT_STATE}"{COMPONENT_CONFIG_CHAT_STATE_SELECTED}>{COMPONENT_CONFIG_CHAT_STATE}</option>
				<!-- END chat_state -->
			</select>
			<input type="hidden" name="teacher_timestamp" value="{COMPONENT_CONFIG_TEACHER_TIMESTAMP}" />
			<input type="submit" value="Update" class="submit-btn update" />
		</form>
	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="chat-box">
		<ul class="listing chat-users">
		</ul>
		<a href="#" class="show-users"></a>
		<ul class="chat-messages">
		</ul>
		<form action="#" method="post" class="chat-send" id="chatSend">
            <!-- BEGIN chat_state_active -->
			<div class="chat-message-container">
				<textarea name="message" class="chat-message-box"></textarea>
			</div>
			<a href="#" class="btn chat float-right"><span></span>Send</a>
            <!-- END chat_state_active -->
            <!-- BEGIN chat_state_inactive -->
            <p class="bold">The chat is inactive. <a href="/homepage/configForm.php?cid={ID}&type=config&component={CHAT_COMPONENT_ID}&state=Active&teacher_timestamp=">Please click here to activate the chat.</a></p>
            <!-- END chat_state_inactive -->
		</form>
	</div>
	<div class="chat-error hide"></div>
</div>
