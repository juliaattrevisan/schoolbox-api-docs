<div class="box" id="component{COMPONENT_ID}">
  <h2>Homepage Feed</h2>
<!-- BEGIN config -->
  <a class="edit">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
	<div class="text listing">
  	<ul>
    	<!-- BEGIN feed -->
    	<li class="{ON_OFF}">
        <h4>{FEED_MESSAGE}</h4>
        <p class="interact summ">{FEED_DATE}</p>
        <div class="float-fix"></div>
        </li>
      <!-- END feed -->
    </ul>
  </div>
</div>
