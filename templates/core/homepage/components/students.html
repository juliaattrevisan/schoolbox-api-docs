<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Students</h2>
	<!-- BEGIN config -->
	<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="listing">
		<ul>
			<!-- BEGIN student -->
			<li class='{ON_OFF}'>
				<img src='/portrait?userId={STUDENT_EXTERNAL_ID}&size=square64' alt="{STUDENT_NAME}" title="{STUDENT_NAME}" />
				<a href="/search/user/{STUDENT_ID}">{STUDENT_NAME}</a>
			</li>
			<!-- END student -->
		</ul>

		<!-- BEGIN student_email -->
		<form action="/mail/createMail.php" method="post" class="clearfix" name="form2">
			<input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
			<input type="hidden" name="bcc" value="{EMAIL_ALL_STUDENTS}"/>
			<a href="#" class="btn submit-this float-right up-arrow "><span></span>Email all</a>
		</form>
		<!-- END student_email -->

		<!-- BEGIN parent_email -->
		<form action="/mail/createMail.php" method="post" class="clearfix" name="form2">
			<input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLY_TO}&gt;"/>
			<input type="hidden" name="bcc" value="{EMAIL_ALL_PARENTS}"/>
			<a href="#" class="btn submit-this float-right up-arrow "><span></span>Email all parents</a>
		</form>
		<!-- END parent_email -->
	</div>
</div>
