<div class="box" id="component{COMPONENT_ID}">
  <h2>{CALENDAR_TITLE}</h2>
  <!-- BEGIN config -->
  <a class="edit">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Upcoming days to show: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
	<div class="text listing">
  	<ul>
    	<!-- BEGIN group_events -->
    	<li class="{ON_OFF}">
      	<h4><a href="/calendar/week/{CAL_DAY}-{CAL_MONTH}-{CAL_YEAR}">{CAL_NOTE}</a></h4>
		<div class="small-right">	
			
			<p class="interact"><!-- BEGIN modify --> <a href="/calendar/modify.php?eventID={CAL_ID}">Modify</a><!-- END modify --></p>
			<p class="small">On {CAL_DATE} {CAL_TIME}</p>
		</div>
        <div class="float-fix"></div>
      </li>
      <!-- END group_events -->
    </ul>
    <div class="float-fix"></div>
  </div>
  <!-- BEGIN submit_event -->
  <p class="interact"><a href="/calendar/modify.php?level=2&sid={ID}">Add Event</a></p>
  <!-- END submit_event -->
</div>
