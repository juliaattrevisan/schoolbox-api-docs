<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="cont-head">Assignments</h2>
  </div>
<!-- BEGIN config -->
  <a class="config" onclick="toggleConfig('component{COMPONENT_ID}');">edit</a>
  <div class="componentConfig">
    <form action="/subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table>
    <!-- BEGIN assign -->
    <tr>
      <td style="border-bottom:1px solid #666;" class="small_text"><strong>{ASS_DATE}</strong></td>
      <td style="border-bottom:1px solid #666;" class="small_text"><strong>{ASS_NAME}</strong></td>
    </tr>
    <!-- END assign -->
    <tr style="height:1px;">
      <td colspan="2" style="border-bottom:1px solid #666;"></td>
    </tr>
    <!-- BEGIN submit_ass -->
    <tr>
      <td style="text-align:right;" colspan="2"><a href="/submission/createSubmission.php?category={ID}&type=2">POST ASSIGNMENT</a></td>
    </tr>
    <!-- END submit_ass -->
  </table>
</div>
