<div class="box" id="component{COMPONENT_ID}">
  <h2>Links</h2>
<!-- BEGIN config -->
  <a class="edit" onclick="toggleConfig('component{COMPONENT_ID}');">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="sort">Sort: </label>
      <select name="sort">
      	<!-- BEGIN sort -->
      	<option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
      	<!-- END sort -->
      </select>
      <select name="sortdir">
      	<!-- BEGIN sortdir -->
      	<option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
      	<!-- END sortdir -->
      </select>        
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
	<div class="text listing">
  	<ul>
    	<!-- BEGIN link -->
    	<li class="{ON_OFF}">
      	<h3><a class="icons httpurl" href="{LINK_URL}">{LINK_NAME}</a></h3>
        <p class="interact"><!-- BEGIN modify_link --><a href="/cms/link/{LINK_ID}">Modify</a><!-- END modify_link --></p>
        <p class="summ">{LINK_COMMENT}</p>
        <p class="small summ">Posted by <a href="/search/user/{LINK_POSTED_BY_ID}">{LINK_POSTED_BY}</a> on {LINK_POSTED_DATE}</p>
        <div class="float-fix"></div>
      </li>
    	<!-- END link -->
    </ul>
    
    <div class="float-fix"></div>
  </div>
  <!-- BEGIN submit_link -->
    <p class="interact"><a href="/cms/link/new/{ID}">Post Link</a></p>
    <!-- END submit_link -->
</div>
