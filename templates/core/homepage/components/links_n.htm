<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
    <link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css"/>
    <script type="text/javascript">
        $j(function () {
            /*
             * Modal for URL homepage selection
             * */

            $j('#resource-browser').dialog({
                width:650,
                autoOpen:false,
                title:"Select a homepage",
                modal:true,
                resizable:false
            });

            $j('#launch-browser-{COMPONENT_HANDLE}').click(function () {
                $j('#resource-browser').load('/ajax/resourceBrowser', {destination:'#import-links-{COMPONENT_HANDLE}'}, function () {
                    $j('#resource-browser').dialog('open');
                });

                return false;
            });
        });
    </script>
    <h2>{COMPONENT_NAME}</h2>
    <!-- BEGIN config -->
    <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>

    <div class="editPanel settings hide">
        <form action="/homepage/configForm.php" method="get">
            <input type="hidden" name="cid" value="{ID}"/>
            <input type="hidden" name="type" value="config"/>
            <input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}"/>
            <label for="componentname">Name: </label>
            <input id='componentname' name="componentname" type="text" value="{COMPONENT_NAME}"/>

            <label for="links{COMPONENT_HOMEPAGE_ID}">Compact Mode:
                <input type="hidden" name="compactMode" value="0"/>
                <input id="links{COMPONENT_HOMEPAGE_ID}" type="checkbox" name="compactMode" value="1"
                {COMPONENT_CONFIG_COMPACTMODE_SELECTED} />
            </label>
            <label for="sort">Sort: </label>
            <select name="sort">
                <!-- BEGIN sort -->
                <option value="{COMPONENT_CONFIG_SORT_VALUE}"
                {COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
                <!-- END sort -->
            </select>
            <select name="sortdir">
                <!-- BEGIN sortdir -->
                <option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"
                {COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
                <!-- END sortdir -->
            </select>

            <span>Displaying: <a href="{COMPONENT_CONFIG_SRC_ID}">{COMPONENT_CONFIG_SRC_NAME}</a> </span>
            <input type="button" value="Select Alternate Source" id="launch-browser-{COMPONENT_HANDLE}"/>
            <input type="hidden" value="{COMPONENT_CONFIG_SRC_ID}" name="import-links"
                   id="import-links-{COMPONENT_HANDLE}"/>

            <label for="size">Item Limit: </label>
            <select name="size">
                <!-- BEGIN size -->
                <option value="{COMPONENT_CONFIG_SIZE_VALUE}"
                {COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
                <!-- END size -->
            </select>
            <input type="submit" value="Update" class="submit-btn update"/>
        </form>
    </div>
    <div class="editPanel delete-it hide clearfix">
        <p>Are you sure you want to remove component?</p>

        <form action="#" method="post">
            <input type="hidden" name="cid" value="{ID}"/>
            <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}"/>
            <input type="hidden" name="component" value="{COMPONENT_ID}"/>
            <a href="#" class="delete-accept btn delete"><span></span>Yes</a>
            <a href="#" class="delete-reject btn go-to"><span></span>No</a>
        </form>
    </div>
    <!-- END config -->
    <div class="listing clearfix">
        <ul>
            <!-- BEGIN link -->
            <li class="{ON_OFF} clearfix">
                <h4><a class="icons link" rel="{LINK_TARGET}" href="{LINK_URL}">{LINK_NAME}</a></h4>

                <div class="small-right">
                    <!-- BEGIN modify_link -->
                    <p class="interact"><a href="/cms/link/{LINK_ID}">Modify</a></p>
                    <!-- END modify_link -->
                </div>
                <p class="{COMPONENT_COMPACTMODE} hide-on-small">{LINK_COMMENT}</p>

                <p class="{COMPONENT_COMPACTMODE} interact hide-on-small">
                    Posted by <a href="/search/user/{LINK_POSTED_BY_ID}">{LINK_POSTED_BY}</a> on {LINK_POSTED_DATE}
                </p>
            </li>
            <!-- END link -->
        </ul>
    </div>
    <p class="interact"><a href="/resources/{LINK_CAT_ID}" class="btn"><span></span>View All Links</a>
        <!-- BEGIN submit_link -->
        <a href="/cms/link/new/{LINK_CAT_ID}" class="btn up-arrow"><span></span>Post Link</a>
        <!-- END submit_link -->
    </p>
</div>
