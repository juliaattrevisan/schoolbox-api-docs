<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="large_head">Links</h2>
  </div>
<!-- BEGIN config -->
  <a class="config large_head" onclick="toggleConfig('component{COMPONENT_ID}');">edit</a>
  <div class="componentConfig">
    <form action="/subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="sort">Sort: </label>
      <select name="sort">
      	<!-- BEGIN sort -->
      	<option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
      	<!-- END sort -->
      </select>
      <select name="sortdir">
      	<!-- BEGIN sortdir -->
      	<option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
      	<!-- END sortdir -->
      </select>        
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table>
    <!-- BEGIN link -->
    <tr>
      <td class="large_text titleColumn"><h3>{LINK_NAME}</h3></td>
      <td style="border-bottom:1px solid #666;" class="large_text">{LINK_COMMENT}</td>
    </tr>
    <!-- END link -->
    <tr style="height:1px;">
      <td colspan="2" style="border-bottom:1px solid #666;"></td>
    </tr>
    <!-- BEGIN submit_link -->
    <tr>
      <td style="text-align:right;" colspan="2" class="navbar"><a href="/cms/modResource.php?type=url&cid={ID}">POST LINK</a></td>
    </tr>
    <!-- END submit_link -->
  </table>
</div>
