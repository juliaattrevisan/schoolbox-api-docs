<div class="box clearfix" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Group Managers</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a> <a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />

			Display Portraits:
			<label for="managerList{COMPONENT_HOMEPAGE_ID}">
				<select id='managerList{COMPONENT_HOMEPAGE_ID}' name='displayPortraits'>
					<!-- BEGIN displayportraits -->
					<option value='{COMPONENT_CONFIG_DISPLAYPORTRAITS_VALUE}' {COMPONENT_CONFIG_DISPLAYPORTRAITS_SELECTED}>{COMPONENT_CONFIG_DISPLAYPORTRAITS_NAME}</option>
					<!-- END displayportraits -->
				</select>
			</label>

			<input type="submit" value="Update" class="submit-btn update" />
		</form>
	</div>
	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->
	<div class="listing">
		<!-- BEGIN person -->
		<a href='/search/user/{PERSON_UID}' class='button {LIST_STYLE}' alt='{PERSON_NAME}' title='{PERSON_NAME}' />
			<!-- BEGIN has_portrait -->
			<img src='/portrait?userId={PERSON_EXTERNAL_ID}&size=square64' />
			<!-- END has_portrait -->

			<span class='name'>{PERSON_NAME}</span>

			<!-- BEGIN has_group -->
			<span class='group'>{PERSON_GROUP}</span>
			<!-- END has_group -->
		</a>
		<!-- END person -->
	</div>
    <!-- BEGIN member_email -->
	<form action="/mail/createMail.php" method="post" class="clearfix" name="form2">
		<input type="hidden" name="replyto" value="&quot;{HEADING}&quot; &lt;{REPLYTO}&gt;" />
		<input type="hidden" name="bcc" value="{EMAILALL}" />
		<a href="#" class="btn submit-this float-right up-arrow "><span></span>Email all</a>
	</form>
    <!-- END member_email -->
</div>
