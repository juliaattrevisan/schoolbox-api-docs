<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
	$j(function() {
		$j('a.post_comment').click(function() {
			$j(this).closest('li').find('form').toggle();
            $j(this).hide();
			return false;
		});
		$j('a.delete-comment').click(function() {
            location.href = $j(this).attr('href');
        }).confirm({
            msg: 'Delete this comment? ',
            wrapper: '<span class="confirm"></span>',
            buttons: {
                wrapper:'<button></button>',
                separator:'  '
            }
        });
	});
</script>
<!-- END custom_head -->
<div class="archive blog clearfix">
	<h1>Blog Archive for {CATEGORY_NAME}</h1>
	<span class="header_option">
	<!-- BEGIN submit_blog -->
	<a href="/blog/modify/new/{ID}" class="btn up-arrow"><span></span>Post Blog</a>
	<!-- END submit_blog -->
	<a href="/homepage/{ID}" class="btn go-back"><span></span>Return to Homepage</a>
	</span>
	<div class="menu">
		<ul>
			<!-- BEGIN year -->
			<li class="{YEAR_ClASS}"><h3>{YEAR}</h3>
				<ul>
				<!-- BEGIN month -->
					<li><a class="{MONTH_ClASS}"
						href="/homepage/blogArchive/{ID}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
					</li>
				<!-- END month -->
				</ul>
			</li>
			<!-- END year -->
		</ul>
	</div>

	<ul class="posts blog listing">
		<!-- BEGIN blog -->
		<li class="clearfix {BLOG_SHADING}">
			<a name="{BLOG_ID}"></a>
			<h3>{BLOG_HEADING}</h3>
                {MOD_BLOG}
                <p class="author">
                    <a href="/search/user/{BLOG_AUTHOR_ID}" class="author">
                        <img src="{BLOG_AUTHOR_THUMB}"/>
                        <span class="name">{BLOG_AUTHOR_NAME}</span>
                    </a>
                    <span class="subtitle">Posted {BLOG_AUTHOR_GROUP}</span>
                </p>

				<div class="wysiwyg">
				{BLOG_BODY}
				</div>

                <ul class="comments">
                    <!-- BEGIN comment -->
                    <li class="{ON_OFF}">{DELETE_COMMENT}
                        <a href="/search/user/{COMMENT_AUTHOR_ID}" class="author">
                            <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square32"/>
                            <span class="name">{COMMENT_AUTHOR_NAME}</span>
                        </a>
                        <span class="subtitle">Commented {COMMENT_CREATED}</span>
                        <p class="comment-body">{COMMENT_BODY}</p>
                    </li>
                    <!-- END comment -->
                </ul>

                <form method="post" action="/blog/comment/new/{BLOG_ID}">
                    <p><textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
                        <input type="submit" class="submit-btn-plain" name="comment" value="Add comment"/></p>
                </form>
		</li>
		<!-- END blog -->
	</ul>
</div>
