<span class="header-actions">
    <!-- BEGIN submit_blog -->
    <a href="/blog/modify/new/{ID}" class="button icon-add">Post Blog</a>
    <!-- END submit_blog -->
    <a href="/homepage/{ID}" class="button icon-folder">Return to Homepage</a>
</span>

<h1>Blog Archive for {CATEGORY_NAME}</h1>

<div class="large-2 columns">
    <ul>
        <li>
            <!-- BEGIN year -->
            {YEAR}
            <ul>
                <!-- BEGIN month -->
                <li>
                    <a href="/homepage/blogArchive/{ID}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                </li>
                <!-- END month -->
            </ul>
            <!-- END year -->
        </li>
    </ul>
</div>

<div class="large-10 columns">
    <ul>
        <!-- BEGIN blog -->
        <li>
            <a name="{BLOG_ID}"></a>

            <span class="header-actions">
                <!-- BEGIN can_modify -->
                <a class="button icon-modify" href="/blog/modify/{BLOG_ID}">Modify</a>
                <!-- END can_modify -->
            </span>

            <h2>{BLOG_HEADING}</h2>

            <ul class="grid small-block-grid-2 large-block-grid-4">
                <li>
                    <div class="row collapse full-width">
                        <div class="thumbnail columns">
                            <a href="/search/user/{BLOG_AUTHOR_ID}">
                                <img src="/portrait.php?userId={BLOG_AUTHOR_EXTERNAL_ID}&size=square64"/>
                            </a>
                        </div>
                        <div class="content">
                            {BLOG_AUTHOR_NAME}
                            <p class="meta">
                                Posted {BLOG_POSTED_DATE}
                            </p>
                        </div>
                    </div>
                </li>
            </ul>

            <div>
                {BLOG_BODY}
            </div>

            <ul>
                <!-- BEGIN comment -->
                <li>
                    {DELETE_COMMENT}
                    <a href="/search/user/{COMMENT_AUTHOR_ID}">
                        <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square32"/>
                        {COMMENT_AUTHOR_NAME}
                    </a>
                    Commented {COMMENT_CREATED}
                    <p>
                        {COMMENT_BODY}
                    </p>
                </li>
                <!-- END comment -->
            </ul>

            <form method="post" action="/blog/comment/new/{BLOG_ID}">
                <textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
                <input type="submit" name="comment" value="Add comment"/>
            </form>
        </li>
        <!-- END blog -->
    </ul>
</div>
