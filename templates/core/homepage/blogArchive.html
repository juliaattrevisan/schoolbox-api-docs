<h1>Blog Archive for {CATEGORY_NAME}</h1>

<!-- BEGIN submit_blog -->
<a href="/blog/modify/new/{ID}" class="btn up-arrow"><span></span>Post Blog</a>
<!-- END submit_blog -->
<a href="/homepage/{ID}" class="btn go-back"><span></span>Return to Homepage</a>

<ul>
    <!-- BEGIN year -->
    <li class="{YEAR_ClASS}"><strong>{YEAR}</strong>
        <!-- BEGIN month -->
        <p class="{MONTH_ClASS}"><a class="blogArchiveNav" href="/homepage/blogArchive/{ID}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a></p>
        <!-- END month -->
    </li>
    <!-- END year -->
</ul>

<ul class="blogPost">
    <!-- BEGIN blog -->
    <li>
        <a name="{BLOG_ID}"></a>
        <h2>{BLOG_HEADING}</h2>
        <div class="pad-it">
            {BLOG_BODY}
            <hr>
            <span class="element_footer">Posted by {EMAIL_CONTACT} on {POSTED_DATE} {MOD_BLOG}</span>
        </div>
    </li>
    <!-- END blog -->
</ul>
