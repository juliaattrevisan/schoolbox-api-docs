<h1>News Archive for {CATEGORY_NAME}</h1>

<!-- BEGIN submit_news -->
<a href="/news/homepage/new/{ID}" class="btn up-arrow"><span></span>Post News</a>
<!-- END submit_news -->
<a href="/homepage/{ID}" class="btn go-back"><span></span>Return to Homepage</a>
<div class="blog listing">

<ul>
    <!-- BEGIN news -->
    <li class="{ON_OFF} clearfix">
        <h3 class="clearfix">{NEWS_HEADING}</h3>
        <div class="small-right">
            <p class="interact">{MOD_NEWS}</p>
        </div>
        <p class="author">
            <a href="/search/user/{AUTHOR_ID}" class="author">
                <img width="32" height="32" src="/portrait.php?userId={AUTHOR_EXTERNAL_ID}&size=square32"/>
                <span class="name">{AUTHOR}</span>
            </a>
                    <span class="subtitle">Posted {POSTED_DATE}</span>
        </p>
        <div class="blog-body">{NEWS_BODY}</div>
    </li>
    <!-- END news -->
</ul>

</div>
