<span class="header-actions">
    <!-- BEGIN submit_news -->
    <a href="/news/homepage/new/{ID}" class="button icon-news">Post News</a>
    <!-- END submit_news -->
    <a href="/homepage/{ID}" class="button icon-folder">Return to Homepage</a>
</span>

<h1>News Archive for {CATEGORY_NAME}</h1>

<div class="row">
    <ul>
        <!-- BEGIN news -->
        <li>
            <span class="header-actions">
                <!-- BEGIN can_modify -->
                <a href="/news/homepage/{NEWS_ID}" class="button icon-modify" >Modify</a>
                <!-- END can_modify -->
            </span>

            <h2>{NEWS_HEADING}</h2>

            <ul class="grid small-block-grid-2 large-block-grid-4">
                <li>
                    <div class="row collapse full-width">
                        <div class="thumbnail columns">
                            <a href="/search/user/{AUTHOR_ID}" class="author">
                                <img src="/portrait.php?userId={AUTHOR_EXTERNAL_ID}&size=square64"/>
                            </a>
                        </div>
                        <div class="content">
                            {AUTHOR}
                            <p class="meta">
                                Posted {POSTED_DATE}
                            </p>
                        </div>
                    </div>
                </li>
            </ul>

            <div>
                {NEWS_BODY}
            </div>
        </li>
        <!-- END news -->
    </ul>
</div>
