<ul class="breadcrumb">
    <li><a href="/homepage/{ID}/">{CATEGORY_NAME}</a></li>
    <li class="active"><a href="#">News Archive</a></li>
</ul>

<div class="row">
    <div class="small-12 island">
        <h1>News Archive</h1>
        <!-- BEGIN submit_news -->
        <!-- END submit_news -->
        <section>
            <ul class="information-list">
                <!-- BEGIN news -->
                <li class="row" data-equalizer>
                    <div class="small-11 columns" data-equalizer-watch>
                        <h2>{NEWS_HEADING}</h2>
                        <div class="avatar card">
                            <a href="/search/user/{AUTHOR_ID}" title="View Profile">
                                <img src="/portrait.php?userId={AUTHOR_EXTERNAL_ID}&size=square64" alt="View Profile" />
                                <p>{AUTHOR}</p>
                            </a>
                            <p class="meta">Posted {POSTED_DATE}</p>
                        </div>
                    </div>
                    <div class="one actions">
                        <!-- BEGIN can_modify -->
                        <a class="icon-modify no-text" href="/news/homepage/{NEWS_ID}" title="Modify News"></a>
                        <!-- END can_modify -->
                    </div>

                    <div class="small-12 columns">
                        <article>
                            {NEWS_BODY}
                        </article>
                    </div>
                </li>
                <!-- END news -->
            </ul>
        </section>
    </div>
</div>
