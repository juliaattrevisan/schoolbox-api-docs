<span class="header-actions">
    <a href="/homepage/{CATEGORY_ID}" class="button icon-folder">Return to Homepage</a>
</span>

<h1>Chat Archive for {CATEGORY_TITLE}</h1>

<div class="large-2 columns">
    <ul>
        <li>
            <!-- BEGIN year -->
            {YEAR}
            <ul>
                <!-- BEGIN month -->
                <li>
                    <a href="/homepage/chatArchive/{MENU_CATEGORY_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                </li>
                <!-- END month -->
            </ul>
            <!-- END year -->
        </li>
    </ul>
</div>

<div class="large-10 columns">
    <!-- BEGIN chat_date -->
    <h2>{CHAT_DATE}</h2>
    <ul class="information-list">
        <!-- BEGIN chat -->
        <li>
            <div class="large-12 columns">
                <div class="row">
                    <div class="avatar-card">
                        <a href="/search/user/{BLOG_AUTHOR_ID}" title="View Profile">
                            <img src="/portrait.php?userId={CHAT_USER_SYNERGY_ID}&size=square32" alt="View Profile">
                            <p>{POSTER}</p>
                        </a>
                        <p class="meta">Posted {DATETIME}</p>
                    </div>
                </div>

                {CHAT_BODY}
            </div>
        </li>
        <!-- END chat -->
    </ul>
    <!-- END chat_date -->

    <ul class="pagination">
        <!-- BEGIN previous_button -->
        <li>
            <a class="arrow" href="/homepage/chatArchive/{PREVIOUS_PAGE}">‹</a>
        </li>
        <!-- END previous_button -->
        <!-- BEGIN page_number -->
        <li>
            <a class="{CURRENT}" href="/homepage/chatArchive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
        </li>
        <!-- END page_number -->
        <!-- BEGIN next_button -->
        <li>
            <a class="arrow" href="/homepage/chatArchive/{NEXT_PAGE}">›</a>
        </li>
        <!-- END next_button -->
    </ul>
</div>
