<span class="header-actions">
    <a href="/homepage/{CATEGORY_ID}" class="button icon-folder">Return to Homepage</a>
</span>

<h1>Chat Archive for {CATEGORY_TITLE}</h1>

<div class="large-2 columns">
    <ul>
        <li>
            <!-- BEGIN year -->
            {YEAR}
            <ul>
                <!-- BEGIN month -->
                <li>
                    <a href="/homepage/chatArchive/{MENU_CATEGORY_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                </li>
                <!-- END month -->
            </ul>
            <!-- END year -->
        </li>
    </ul>
</div>

<div class="large-10 columns">
    <!-- BEGIN chat_date -->
    <h2>{CHAT_DATE}</h2>
    <ul>
        <!-- BEGIN chat -->
        <ul class="grid small-block-grid-2 large-block-grid-4">
            <li>
                <div class="row collapse full-width">
                    <div class="thumbnail columns">
                        <img src="/portrait.php?userId={CHAT_USER_SYNERGY_ID}&size=square32"/>
                    </div>
                    <div class="content">
                        {POSTER}
                        <p class="meta">
                            Posted {DATETIME}
                        </p>

                        {CHAT_BODY}
                    </div>
                </div>
            </li>
        </ul>

        <!-- END chat -->
    </ul>
    <!-- END chat_date -->

    <ul class="pagination">
        <!-- BEGIN previous_button -->
        <li>
            <a class="arrow" href="/homepage/chatArchive/{PREVIOUS_PAGE}">‹</a>
        </li>
        <!-- END previous_button -->
        <!-- BEGIN page_number -->
        <li>
            <a class="{CURRENT}" href="/homepage/chatArchive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
        </li>
        <!-- END page_number -->
        <!-- BEGIN next_button -->
        <li>
            <a class="arrow" href="/homepage/chatArchive/{NEXT_PAGE}">›</a>
        </li>
        <!-- END next_button -->
    </ul>
</div>
