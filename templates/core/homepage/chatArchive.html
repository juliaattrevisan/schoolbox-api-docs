{BREADCRUMB}

<div class="row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>Chat Archive</h1>
        </div>
    </div>
</div>

<div class="row">
    <div class="small-12 large-3 island">
        <h2 class="subheader">Archive</h2>
        <section class="content">
            <ul class="information-list">
                <li>
                    <!-- BEGIN year -->
                    {YEAR}
                    <ul class="information-list">
                        <!-- BEGIN month -->
                        <li>
                            <a href="/homepage/chatArchive/{MENU_CATEGORY_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                        </li>
                        <!-- END month -->
                    </ul>
                    <!-- END year -->
                </li>
            </ul>
        </section>
    </div>

    <div class="small-12 large-9 island">
        <!-- BEGIN chat_date -->
        <h2 class="subheader">{CHAT_DATE}</h2>
        <section>
            <ul class="information-list">
                <!-- BEGIN chat -->
                <li>
                    <div class="list-item">
                        <div class="card small-12">
                            <a href="/search/user/{BLOG_AUTHOR_ID}" title="View Profile">
                                <img src="/portrait.php?id={BLOG_AUTHOR_ID}&size=square64" alt="View Profile" />
                                <p>{POSTER}</p>
                            </a>
                            <p class="meta">Posted {DATETIME}</p>
                        </div>
                    </div>

                    <article>{CHAT_BODY}</article>
                </li>
                <!-- END chat -->
            </ul>
        </section>
        <!-- END chat_date -->

        <ul class="pagination">
            <!-- BEGIN previous_button -->
            <li>
                <a class="arrow" href="/homepage/chatArchive/{PREVIOUS_PAGE}">‹</a>
            </li>
            <!-- END previous_button -->
            <!-- BEGIN page_number -->
            <li class="{CURRENT}" >
                <a href="/homepage/chatArchive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
            </li>
            <!-- END page_number -->
            <!-- BEGIN next_button -->
            <li>
                <a class="arrow" href="/homepage/chatArchive/{NEXT_PAGE}">›</a>
            </li>
            <!-- END next_button -->
        </ul>
    </div>
</div>
