<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/jquery-validation/additional-methods.js"></script>
<script type="text/javascript" src="/javascript/shared/jquery.validate.extensions.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressValidate.js"></script>
<script type="text/javascript">
    $(document).ready(function () {
        $('#accountForm').alaressValidate({
            rules: {
                new_password: {
                    // Regex: must contain [a-z], \d and ^[a-z\d] (case-insensitive)
                    pattern: /^(?=.*[a-z])(?=.*\d)(?=.*[^a-z\d])/i
                },
                confirm_password: {
                    equalsOtherField: $('#new_password')
                }
            },
            messages: {
                new_password: {
                    pattern: 'Your new password must be at least 6 characters in length and contain at least one letter, one number and one symbol or punctuation character.'
                },
                confirm_password: {
                    equalsOtherField: 'New Password and Confirm New Password must match.'
                }
            }
        });
    });
</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 island">
        <h1>Change Password</h1>
        <!-- BEGIN success -->
        <div class="alert-box success">Your password was changed successfully</div>
        <!-- END success -->

        <form id="accountForm" method="post" action="/account/modifyForm.php">
            <section>
                <fieldset class="content">
                    <div class="small-12 column">
                        <div class="alert-box">
                            <p>Your new password must be at least 6 characters in length and contain at least one
                                letter, one number and one symbol or punctuation character.<br/>
                                (examples of symbol characters: $, #, _, &amp;)</p>
                        </div>

                        <label>
                            Current Password
                            <input type="password"
                                   name="current_password"
                                   id="current_password"
                                   size="35"
                                   data-rule-minlength="6"
                                   maxlength="50"
                                   required/>
                        </label>
                        <label>
                            New Password
                            <input type="password"
                                   name="new_password"
                                   id="new_password"
                                   size="35"
                                   data-rule-minlength="6"
                                   maxlength="50"
                                   required/>
                        </label>
                        <label>
                            Confirm New Password
                            <input type="password"
                                   name="confirm_password"
                                   id="confirm_password"
                                   size="35"
                                   data-rule-minlength="6"
                                   maxlength="50"
                                   required/>
                        </label>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" name="submit" value="Update Password"/>
                </div>
            </div>
        </form>
    </div>
</div>
