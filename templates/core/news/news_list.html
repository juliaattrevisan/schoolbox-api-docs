<!-- BEGIN custom_head -->
<link rel="alternate" type="application/rss+xml" title="School News" href="http://{SCHOOL_NEWS_RSS_FEED_URL}" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/foundation/chrome.css?v={SITE_VERSION}" />
<script type="text/javascript">
    $(function() {
        $('#container').addClass('foundation').foundation();
    });
</script>
<!-- END custom_head -->
<div class="row full-width">
    <div class="large-12 columns no-pad">
        <h1>
            News
            <span class="header-actions">
                <a class="button icon-menu"href="#" data-dropdown="newsOptions">Options</a>
            </span>
            <ul class="f-dropdown fadeInDown" data-dropdown-content="" id="newsOptions">
                <!-- BEGIN add_news -->
                <li><a class="icon-add" href="/news/modify">Add News</a></li>
                <!-- END add_news -->
                <!-- BEGIN allnews_button -->
                <li><a class="icon-view" href="/news-archive/{TOPIC_CLEAN}">View Archived News</a></li>
                <!-- END allnews_button -->
                <li><a class="icon-rss" href="/news-archive/{TOPIC_CLEAN}">RSS</a></li>
            </ul>
        </h1>

        <dl class="tabs">
            <!-- BEGIN topic_list -->
            <dd class="{LIST_TOPIC_SELECTED}">
                <a href="/news/{LIST_TOPIC_CLEAN}">{LIST_TOPIC_NAME}</a>
            </dd>
            <!-- END topic_list -->
        </dl>
    </div>
</div>
<div class="row full-width">
    <div class="island">
        <ul class="information-list">
            <!-- BEGIN news -->
            <li>
                <!-- BEGIN news_image -->
                <a class="thumbnail" href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}"><img width="128" height="128" src="/storage/image.php?hash={NEWS_IMAGE}&size=square128"/></a>
                <!-- END news_image -->
                <div class="content">
                    <h3><a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
                    <p class="meta">{DATETIME}<span class="author"> | Posted by {POSTER}</span></p>
                    <p>{NEWS_SHORT}</p>
                </div>
            </li>
            <!-- END news -->
        </ul>

    	<ul class="admin-nav foot">
    		<!-- BEGIN previous_button -->
    		<li><a class="prev" href="/news/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
    		<!-- END previous_button -->
    		<!-- BEGIN page_number -->
    		<li><a class="number {CURRENT}" href="/news/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
    		<!-- END page_number -->
    		<!-- BEGIN next_button -->
    		<li><a class="next" href="/news/{NEXT_PAGE}">Next &rsaquo;</a></li>
    		<!-- END next_button -->
    	</ul>
    </div>
</div>
