<!-- BEGIN custom_head -->
<link rel="alternate" type="application/rss+xml" title="School News" href="http://{SCHOOL_NEWS_RSS_FEED_URL}" />
<!-- END custom_head -->
<div class="row">
    <div class="small-12 columns no-pad">
        <h1>News</h1>
        <span class="header-actions">
            <!-- BEGIN add_news -->
            <a class="button icon-add no-text" href="/news/modify" data-tooltip title="Add News"></a>
            <!-- END add_news -->
            <!-- BEGIN allnews_button -->
            <a class="button icon-view no-text" href="/news-archive/{TOPIC_CLEAN}" data-tooltip title="View Archived News"></a>
            <!-- END allnews_button -->
            <a class="button icon-rss no-text" href="/news-archive/{TOPIC_CLEAN}" data-tooltip title="RSS"></a>
        </span>

        <dl class="tabs">
            <!-- BEGIN topic_list -->
            <dd class="{LIST_TOPIC_SELECTED}">
                <a href="/news/{LIST_TOPIC_CLEAN}">{LIST_TOPIC_NAME}</a>
            </dd>
            <!-- END topic_list -->
        </dl>
    </div>
</div>
<!-- BEGIN news -->
<div class="row">
    <div class="small-12 island">
        <section>
            <!-- BEGIN news_image -->
            <a class="thumbnail" href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">
                <img src="/storage/image.php?hash={NEWS_IMAGE}&size=rectangle" />
            </a>
            <!-- END news_image -->
            <div class="content">
                <h3><a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
                <p class="meta">{DATETIME}<span class="author"> | Posted by {POSTER}</span></p>
                <p>{NEWS_SHORT}</p>
            </div>
        </section>
    </div>
</div>
<!-- END news -->

<ul class="admin-nav foot">
    <!-- BEGIN previous_button -->
    <li><a class="prev" href="/news/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
    <li><a class="number {CURRENT}" href="/news/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
    <li><a class="next" href="/news/{NEXT_PAGE}">Next &rsaquo;</a></li>
    <!-- END next_button -->
</ul>
