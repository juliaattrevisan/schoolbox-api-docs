<!-- BEGIN custom_head -->
<link rel="alternate" type="application/rss+xml" title="{TPL_LOCAL_NEWS_PC}" href="{SCHOOL_NEWS_RSS_FEED_URL}" />
<!-- END custom_head -->

<ul class="breadcrumb">
    <li><a href="/news">{TPL_LOCAL_NEWS_PLURAL_PC}</a></li>
    <li class="active"><a href="/news/{TOPIC_CLEAN}">{TOPIC_TITLE}</a></li>
</ul>
<div class="row actions-small-3">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{TPL_LOCAL_NEWS_PLURAL_PC}</h1>
        </div>
    </div>
    <nav>
        <!-- BEGIN add_news -->
        <a class="icon-add" href="/news/modify" title="Add {TPL_LOCAL_NEWS_PC}"></a>
        <!-- END add_news -->
        <!-- BEGIN allnews_button -->
        <a class="icon-view" href="/news-archive/{TOPIC_CLEAN}" title="View Archived {TPL_LOCAL_NEWS_PC}"></a>
        <!-- END allnews_button -->
        <a class="icon-rss" href="{SCHOOL_NEWS_RSS_FEED_URL}" title="RSS"></a>
    </nav>

    <div class="column small-12">
        <dl class="tabs">
            <!-- BEGIN topic_list -->
            <dd class="{LIST_TOPIC_SELECTED}">
                <a href="/news/{LIST_TOPIC_CLEAN}">{LIST_TOPIC_NAME}</a>
            </dd>
            <!-- END topic_list -->
        </dl>
    </div>
</div>
<div class="row">
    <div class="small-12 island">
        <section>
            <!-- BEGIN has_news -->
            <ul class="information-list">
                <!-- BEGIN news -->
                <li>
                    <div class="column no-pad small-12">
                        <div class="avatar card">
                            <a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">
                                <!-- BEGIN news_image -->
                                <img src="/storage/image.php?hash={NEWS_IMAGE}&size=square64" />
                                <!-- END news_image -->
                                <h3>{NEWS_TITLE}</h3>
                            </a>
                            <p class="meta">Posted by {POSTER}</p>
                            <p class="meta">{DATETIME}</p>
                        </div>
                        <article>
                            <p>{NEWS_SHORT}</p>
                        </article>
                    </div>
                </li>
                <!-- END news -->
            </ul>
            <!-- END has_news -->

            <!-- BEGIN no_news -->
            <div class="content">
                <p>No current {TPL_LOCAL_NEWS} in this topic.</p>
            </div>
            <!-- END no_news -->
        </section>

        <ul class="pagination">
            <!-- BEGIN previous_button -->
            <li><a class="arrow" href="/news/{PREVIOUS_PAGE}">&lsaquo;</a></li>
            <!-- END previous_button -->
            <!-- BEGIN page_number -->
            <li class="{CURRENT}"><a href="/news/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
            <!-- END page_number -->
            <!-- BEGIN next_button -->
            <li><a class="arrow" href="/news/{NEXT_PAGE}">&rsaquo;</a></li>
            <!-- END next_button -->
        </ul>
    </div>
</div>
