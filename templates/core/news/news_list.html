<h1>News</h1>
<span class="header_option">
    <!-- BEGIN add_news -->
    <a class="btn add" href="/news/modify"><span></span>Add News</a>
    <!-- END add_news -->
</span>
<div class="news-wrapper left clearfix">
    <ul class="news-list">
        <!-- BEGIN news -->
        <li class="{ON_OFF}">
            <!-- BEGIN news_image -->
            <a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}"><img width="64" height="64" src="/storage/image.php?hash={NEWS_IMAGE}&size=square64"/></a>
            <!-- END news_image -->
            <h3><a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h3>
            <span class="time">{DATETIME}<span class="author"> | Posted by {POSTER}</span></span>
            <p>{NEWS_SHORT}</p>
        </li>
        <!-- END news -->
    </ul>

	<ul class="admin-nav foot">
		<!-- BEGIN previous_button -->
		<li><a class="prev" href="/news/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
		<!-- END previous_button -->
		<!-- BEGIN page_number -->
		<li><a class="number {CURRENT}" href="/news/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
		<!-- END page_number -->
		<!-- BEGIN next_button -->
		<li><a class="next" href="/news/{NEXT_PAGE}">Next &rsaquo;</a></li>
		<!-- END next_button -->
	</ul>
    </div>

<div class="right">
    <ul class="topic-list">
        <!-- BEGIN topic_list -->
        <li><a href="/news/{LIST_TOPIC_CLEAN}" class="{LIST_TOPIC_SELECTED}">{LIST_TOPIC_NAME}</a></li>
        <!-- END topic_list -->
    </ul>
    <!-- BEGIN allnews_button -->
    <p><a href="/news-archive/{TOPIC_CLEAN}" class="btn"><span></span>View Archived News</a></p>
    <!-- END allnews_button -->

</div>
