<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script language="JavaScript" type="text/javascript">
$(function() {
	$.fn.alaressTiny({
		mode: 'textareas',
		file_browser_category_id : {CATEGORY_ID}
	});

	$('#newsForm').validate();

    $('#datetime_published, #datetime_expires').datepicker({
        onClose: function (string) {
            var input = $(this);

            $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                input.val(data.time);
            })
        }
    });

});
</script>
<!-- END custom_head -->

<ul class="breadcrumb">
    <li><a href="/homepage/{CATEGORY_ID}/">{CATEGORY_NAME}</a></li>
    <li class="active"><a href="#">News</a></li>
</ul>

<div class="row">
    <div class="small-12 island">
        <h1>{ACTION} Homepage News</h1>
        <form class="top" action="/news/homepageForm.php" method="post" enctype="multipart/form-data" id="newsForm">
            <section>
                <input type="hidden" name="newsID" value="{NEWS_ID}"/>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>Headline
                            <input type="text" class="required" name="heading" size="35" maxlength="100" value="{HEADING}" />
                        </label>
                        <label>Article
                            <textarea id="body" name="body">{BODY}</textarea>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <legend>Availability</legend>
                    <div class="small-12 columns">
                        <label for="datetime_published" class="advanced">
                            Publish Date
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this news item will become available">?</span>
                            <input type="text" class="required" name="datetime_published" id="datetime_published" maxlength="50" value="{DATETIME_PUBLISHED}"/>
                        </label>
                    </div>
                    <div class="small-12 columns">
                        <label for="datetime_published">
                            Expiry Date
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this item will expire">?</span>
                        </label>
                        <input type="text" class="required" name="datetime_expires" id="datetime_expires" maxlength="50" value="{DATETIME_EXPIRES}"/>
                    </div>

                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" name="submit" value="{ACTION} News"/>
                </div>
                <!-- BEGIN delete_button -->
                <div class="small-12 column">
                    <input type="submit" name="delete" value="Delete News" class="button alert icon-delete expand" />
                </div>
                <!-- END delete_button -->
            </div>

            <input type="hidden" name="id" value="{NEWS_ID}" />
            <input type="hidden" name="code" value="{CATEGORY_ID}" />

        </form>
    </div>
</div>
