<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/ckeditor/ckeditor.js"></script>
<script type="text/javascript" src="/javascript/shared/editor/jquery.editor.js"></script>
<script language="JavaScript" type="text/javascript">
    $(function() {
        $.fn.alaressEditor({
            file_browser_category_id : {CATEGORY_ID}
        });
        
        /* Check if a required field is blank/contains only whitespace */
        $.validator.addMethod('requiredNotBlank', function(value, element) {
            /**
             * Call the Required method first, which displays an error message
             * only if field is completely blank (no whitespace or other chars).
             * We are doing this in order to display a different error message
             * depending on whether the field contains any chars or not.
             */
            jQuery.validator.methods.required.call(this, value, element);

            if (($.trim(value)).length) {
                return true;
            }
            return false;
        }, 'This field cannot be blank')

        $('#newsForm').alaressValidate({
            rules: {
                'heading': {
                    requiredNotBlank: true
                }
            }
        });

        $('[data-delete]').click(function(event) {
            event.preventDefault();

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this item?',
                confirmEvent: function() {
                    $('[data-type]').val('delete');

                    $('#newsForm').trigger('submit');
                }
            });
        });
    });
</script>
<!-- END custom_head -->

<ul class="breadcrumb">
    <li><a href="/homepage/{CATEGORY_ID}/">{CATEGORY_NAME}</a></li>
    <li class="active"><a href="#">News</a></li>
</ul>

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ACTION} Homepage News</h1>
        </div>
    </div>
    <!-- BEGIN delete_button -->
    <nav>
        <a class="icon-more" title="Actions" data-dropdown="header-options"></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li><a class="icon-delete" title="Delete News" data-delete>Delete News</a></li>
    </ul>
    <!-- END delete_button -->
</div>

<div class="row">
    <div class="small-12 island">
        <form class="top" action="/news/homepageForm.php" method="post" enctype="multipart/form-data" id="newsForm">
            <input type="hidden" name="id" value="{NEWS_ID}" />
            <input type="hidden" name="code" value="{CATEGORY_ID}" />
            <input type="hidden" name="type" value="modify" data-type />

            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Headline
                            <input type="text" class="required" name="heading" size="35" maxlength="100" value="{HEADING}" />
                        </label>

                        <label>
                            Article
                            <textarea id="body" name="body">{BODY}</textarea>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <legend>Availability</legend>
                    <div class="small-6 columns">
                        <label for="datetime_published" class="advanced">
                            Publish Date
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this news item will become available">?</span>
                            <input type="text" class="required" name="datetime_published" id="datetime_published" data-datepicker data-datepicker-time data-datesync-enddate="#datetime_expires" maxlength="50" value="{DATETIME_PUBLISHED}"/>
                        </label>
                    </div>
                    <div class="small-6 columns">
                        <label for="datetime_expires">
                            Expiry Date
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this item will expire">?</span>
                        </label>
                        <input type="text" class="required" name="datetime_expires" id="datetime_expires" data-datepicker data-datepicker-time data-datesync-startdate="#datetime_published" maxlength="50" value="{DATETIME_EXPIRES}"/>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" value="{ACTION} News"/>
                </div>
            </div>
        </form>
    </div>
</div>
