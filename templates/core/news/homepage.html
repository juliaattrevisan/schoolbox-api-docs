<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
	plugins : "table",
	content_css : "/css/mgs-tiny.css",
	theme_advanced_layout_manager : "RowLayout",
	theme_advanced_containers_default_align : "left",
	theme_advanced_container_default_class : "mceToolbar",
	theme_advanced_containers : "row1,row2,mceEditor,mceElementpath",
	theme_advanced_container_row1_class : "mceToolbarTop",
	theme_advanced_container_row2_class : "mceToolbarTop",
	theme_advanced_container_row1 : "bold,italic,underline,separator,bullist,numlist,outdent,indent,separator,sub,sup,separator,link,unlink,image,charmap,hr,separator,undo,redo",
	theme_advanced_container_row2 : "forecolor,tablecontrols,separator,removeformat,cleanup,code"
});

function verify()
{
        var msg = ""
        if(document.getElementById('newsForm').heading.value == ""){
                msg += "You need to enter a heading\n";
        }
        if(msg != ""){
                alert(msg);
                return false;
        }
        else
	{
                return true;
	}
}
</script>
<!-- END custom_head -->

<h1>{ACTION} Homepage News</h1>
<form action="/news/homepageForm.php" method="post" enctype="multipart/form-data" id="newsForm" class="standardForm" onSubmit="return(verify());">
  <table>
    <tr>
      <td class="formLabelWidth"><h2>News heading</h2></td>
      <td><input type="text" name="heading" size="35" maxlength="50" value="{HEADING}" />
      </td>
    </tr>
    <tr>
      <td><h2>Expires</h2>
        <em>Select a period for which the news will remain on your page</em></td>
      <td><select name="expires">
          {LEAVE_OPTION}						
          <option value="0.5">In 30 minutes</option>
          <option value="1">In 1 hour</option>
          <option value="2">In 2 hours</option>
          <option value="5">In 5 hours</option>
          <option value="12">In 12 hours</option>
          <option value="24">In 24 hours</option>
          <option value="36">In 36 hour</option>
          <option value="48">In 2 days</option>
          <option value="120" {DEFAULT_TIME_SELECTED}>In 5 days</option>
          <option value="168" >In 1 week</option>
          <option value="336">In 2 weeks</option>
          <option value="672">In 1 month</option>
          <option value="8760">In 1 year</option>
          <option value="99999">Never</option>
        </select>
      </td>
    </tr>
    <tr>
      <td valign="top"><h2>News Body</h2>
        <em>This is the main portion of your news.</em></td>
      <td><textarea id="body" name="body" style="width:100%;height:350px">{BODY}</textarea>
      </td>
    </tr>
    <tr>
      <td>&nbsp;<input type="hidden" name="id" value="{NEWS_ID}" />
      <input type="hidden" name="code" value="{CATEGORY_ID}" /> </td>
      
      <td><input type="submit" name="submit" value="{ACTION} News" class="btn"/>
        <!-- BEGIN delete_button -->
        <input type="submit" name="delete" value="Delete News" class="btn">
        <!-- END delete_button -->
      </td>
    </tr>
  </table>
</form>
