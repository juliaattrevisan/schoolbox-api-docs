<!-- BEGIN custom_head -->

<script type="text/javascript" src="/javascript/jquery.treeview.min.js"></script>
<script type="text/javascript">
    $j(function() {
        $j(".tree").treeview({
            persist: "location",
            unique: false,
            animated: "fast"
        });

    });
</script>

<!-- END custom_head -->



<!-- BEGIN modify_news -->
<a class="btn modify" href="/news/modify/{NEWS_ID}"><span></span>Modify Article</a>
<!-- END modify_news -->
<h1>News Article</h1>
<div class="news-wrapper clearfix">
    <!-- BEGIN news -->
    <div class="news-item clearfix">
        <h2>{NEWS_TITLE}</h2>

        <div class="wysiwyg">{NEWS_BODY}</div>
    </div>
    {PREVIOUS_ARTICLE}
    {NEXT_ARTICLE}
</div>
<div class="right">
    <h2>Article Information</h2>

    <div class="pad-it">

        <ul class="meta">
            <li>Topic: <a href="/news/archive/{TOPIC_CLEAN}/">{TOPIC_NAME}</a></li>
            <li>Publisher: {POSTER}</li>
            <li>Publish Date: {DATETIME}</li>
            <li>{EXPIRY}</li>
        </ul>
    </div>
    <h2>News Index</h2>

    <div class="pad-it">
        <ul class="tree">
            <!-- BEGIN topic_list -->
            <li><a href="/news/{LIST_TOPIC_CLEAN}">{LIST_TOPIC_NAME}</a>
                <ul class="topic">
                    <!-- BEGIN article_list -->
                    <li class="icon">{LIST_TOPIC_ARTICLE}</li>
                    <!-- END article_list -->
                </ul>
            </li>
            <!-- END topic_list -->
        </ul>
    </div>
    <!-- BEGIN allnews_button -->
    <p class="interact clearfix"><a href="/news/" class="btn"><span></span>View All News</a></p>
    <!-- END allnews_button -->
</div>
<!-- END news -->
