<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.treeview.min.js"></script>
<script type="text/javascript">
    $j(function() {
        $j(".tree").treeview({
            persist: "location",
            unique: true,
            animated: "fast",
            collapsed: true
        });

    });
</script>
<!-- END custom_head -->

<!-- BEGIN modify_news -->
<a class="btn modify" href="/news/modify/{NEWS_ID}"><span></span>Modify Article</a>
<!-- END modify_news -->
<!-- BEGIN news -->
<h1>{NEWS_TITLE}</h1>




<div class="news-wrapper left clearfix">
    <p class="meta">
        by {POSTER}<br> Active: {DATETIME} {EXPIRY}
    </p>
    <!-- BEGIN news -->
    <div class="wysiwyg clearfix">
        {NEWS_BODY}
    </div>

    <!-- BEGIN previous_article -->
    <a class="btn no-icon float-left" href="/news/item/{PREVIOUS_ARTICLE_ID}">&laquo; {PREVIOUS_ARTICLE_TITLE}</a>
    <!-- END previous_article -->
    <!-- BEGIN next_article -->
    <a class="btn no-icon"  href="/news/item/{NEXT_ARTICLE_ID}">{NEXT_ARTICLE_TITLE} &raquo;</a>
    <!-- END next_article -->
</div>

<div class="right">

    <h2>News Index</h2>

    <div class="pad-it">
        <ul class="tree news-index-tree">
            <!-- BEGIN topic_list -->
            <li><a href="/news/item/{LIST_TOPIC_RECENT_ARTICLE_ID}">{LIST_TOPIC_NAME}</a>
                <!-- BEGIN article_list -->
                <ul class="topic">
                    <!-- BEGIN article_list_item -->
                    <li class="{LIST_TOPIC_ARTICLE_CURRENT}"><a href="/news/item/{LIST_TOPIC_ARTICLE_ID}">{LIST_TOPIC_ARTICLE_NAME}</a></li>
                    <!-- END article_list_item -->
                </ul>
                <!-- END article_list -->
            </li>
            <!-- END topic_list -->
        </ul>
    </div>
    <!-- BEGIN allnews_button -->
    <p class="interact clearfix"><a href="/news/archive/{TOPIC_CLEAN}" class="btn"><span></span>View Archived News</a></p>
    <!-- END allnews_button -->
</div>
<!-- END news -->
