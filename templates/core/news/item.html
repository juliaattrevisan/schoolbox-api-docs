<h1>{NEWS_TITLE}</h1>
<span class="header_option">

    <!-- BEGIN add_news -->
    <a class="btn add" href="/news/modify"><span></span>Add News</a>
    <!-- END add_news -->

    <!-- BEGIN modify_news -->
    <a class="btn modify" href="/news/modify/{NEWS_ID}"><span></span>Modify Article</a>
    <!-- END modify_news -->
</span>
<div class="news left clearfix">
    <p class="author">
        <a href="/search/user/{POSTER_ID}" class="author">
            <img width="32" height="32" src="/portrait.php?userId={POSTER_EXTERNAL_ID}&size=square32"/>
            <span class="name">{POSTER}</span>
        </a>
        <span class="subtitle">{DATETIME}</span>
    </p>
    <!-- BEGIN featured_image -->
    <img class="featured_image" src="/storage/image.php?hash={NEWS_IMAGE}&size=constrain200"/>
    <!-- END featured_image -->
	<div class="wysiwyg">
		{NEWS_BODY}
	</div>

    <p class="clear">
        <!-- BEGIN previous_article -->
        <a class="btn no-icon float-left" href="/news/item/{PREVIOUS_ARTICLE_ID}">&laquo; {PREVIOUS_ARTICLE_TITLE}</a>
        <!-- END previous_article -->
        <!-- BEGIN next_article -->
        <a class="btn no-icon" href="/news/item/{NEXT_ARTICLE_ID}">{NEXT_ARTICLE_TITLE} &raquo;</a>
        <!-- END next_article -->
    </p>
</div>

<div class="right">
    <ul class="admin-nav vertical">
        <!-- BEGIN topic_list -->
        <li><a href="/news/{LIST_TOPIC_CLEAN}" class="{LIST_TOPIC_SELECTED}">{LIST_TOPIC_NAME}</a></li>
        <!-- END topic_list -->
    </ul>
    <!-- BEGIN allnews_button -->
    <p><a href="/news-archive/{TOPIC_CLEAN}" class="btn"><span></span>View Archived News</a></p>
    <!-- END allnews_button -->
</div>
