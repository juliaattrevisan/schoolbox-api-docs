<!-- BEGIN custom_head -->

<link rel="stylesheet" type="text/css" media="screen" href="/css/foundation/chrome.css?v={SITE_VERSION}" />
<script type="text/javascript">
    $(function() {
        $('#container').addClass('foundation').foundation();
    });
</script>
<!-- END custom_head -->
<div class="row full-width">
    <div class="large-12 columns no-pad">
        <h1>
            {ACTION} News
            <a class="customise" href="#">
                <span{ADV_OFF}>Show Advanced Options</span>
                <span{ADV_ON}>Close Advanced Options</span>
            </a>
        </h1>
    </div>
</div>
<div class="row full-width">
    <div class="island">
        <form id="newsForm" method="post" enctype="multipart/form-data" action="/news/modifyForm.php">
            <input type="hidden" name="newsID" value="{NEWS_ID}"/>

            <h2>Headline</h2>
            <label>
                <input type="text" class="required" name="heading" size="35" maxlength="100" value="{HEADING}"/>
            </label>

            <h2>
                Article          
                <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="This is the main portion of your news.">?</span>
            </h2>
            <textarea id="body" name="body" style="width:100%;height:350px">{BODY}</textarea>

            <h2>
                Feature Image
                <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="The feature image to be attached to your news post">?</span>
            </h2>
            {ATTACH_ZONE}

            <h2>Topic</h2>
            <select name="item_topic_id">
            <!-- BEGIN topic_list -->
            <option value="{TOPIC_ID}" {TOPIC_ID_SELECTED}>{TOPIC_NAME}</option>
            <!-- END topic_list -->
            </select>

            <h2>
                Roles
                <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="This news item will only be visible to the roles you select.">?</span>
            </h2>
            <div>
                <!-- BEGIN group_selection -->              
                <input id="checkbox1" type="checkbox" value="{GROUP_ID}" name="group[]" {GROUP_ID_SELECTED}><label for="checkbox1" class="checkbox-label">{GROUP_NAME}</label>
                <!-- END group_selection -->
                <input id="checkbox2" type="checkbox" value="{GROUP_ID}" name="" class="select_all" /><label for="checkbox2" class="checkbox-label">Select all</label>     
            </div>

            <!-- BEGIN campus_row -->
            <h2>
                Campus
                <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="This news item will only be visible to users that are within this campus.">?</span>
            </h2>
			<!-- BEGIN campus_selection -->
            <label>
                <input type="checkbox" value="{CAMPUS_ID}" name="campus[]" {CAMPUS_ID_SELECTED} />{CAMPUS_NAME}
			</label>
            <!-- END campus_selection -->
            <label>
                <input type="checkbox" value="{GROUP_ID}" name="" class="select_all" /> Select all
            </label>
            <!-- END campus_row -->
            <div class="advanced" {SHOW_ADVANCED}>
                <div {OPAC_ADVANCED}>
                    <h2>
                        Add users
                        <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="You may add users individually by typing their name and selecting from the list.">?</span>
                    </h2>
                </div>
                <div {OPAC_ADVANCED}>
                    <select id="addUser" name="userList[]" multiple placeholder="Search Users"></select>
                </div>
            </div>
            <div class="advanced" {SHOW_ADVANCED}>
                <div {OPAC_ADVANCED}>
                    <h2>
                        Publish Date
                        <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="Select a date for when this news item will become available.">?</span>
                    </h2>
                </div>
                <div {OPAC_ADVANCED}>
                <input type="text" class="required" name="item_datetime_published" id="item_datetime_published" size="12"
                       maxlength="50" value="{ITEM_DATETIME_PUBLISHED}"/>
                </div>
            </div>

            <h2>
                Expiry Date
                <span data-tooltip="right" class="has-tip tip-right secondary label" data-width="200" title="Select a date for when this item will expire.">?</span>
            </h2>
            <input type="text" class="required" name="item_datetime_expires" id="item_datetime_expires" size="12"
                   maxlength="50" value="{ITEM_DATETIME_EXPIRES}"/>
            <input class="submit-btn-plain" type="submit" name="submit" value="{ACTION} News"/>
            <!-- BEGIN delete_button -->
            <input type="button" name="delete" value="Delete News" class="submit-btn-plain" onclick="confirmDelete({NEWS_ID});"/>
            <!-- END delete_button -->
        </form>
    </div>
</div>
