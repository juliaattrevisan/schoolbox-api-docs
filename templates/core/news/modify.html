<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
    function confirmDelete(newsID) {
        if (confirm('Delete this news item?')) {
            window.open('/news/modifyForm.php?delete=' + newsID, '_self', '');
        }
    }
    $(function () {
        $.fn.alaressTiny({
            mode: 'textareas'
        });
        $('#item_datetime_published, #item_datetime_expires').datepicker({
            showOn:'both',
            buttonImage:'/images/core/calendar/calendar-click.png',
            buttonImageOnly:true,
            constrainInput:false,
            onClose:function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string:string}, function (data) {
                    input.val(data.time);
                })
            }
        });
        $('#addUser')
            .selectizeSelector({
                multiple: true,
                value: {USER_LIST},
                ajax: {
                    url:      '/ajax/user.php',
                    type:     'GET',
                    data:     {groupID: 0},
                    dataType: 'json'
                }
            })
        $('#type_form input').each(function () {
            $(this).click(function () {
                $.get('/group/modifyForm.php', {categoryID:'{CATEGORY_ID}', type:$(this).val()});
            });
        });
        $(document).on('click', '.delete-from-list', function (event) {
            event.preventDefault();
            $(this).parent().remove();
            $('#addUser').val("").focus();
        });
        $('.customise').click(function (event) {
            event.preventDefault();
            $(this).children('span').toggle();
            $('.form-advanced').toggleClass('show');
            if ($('.form-advanced').is(':visible')) {
                $('.form-advanced').children('td').delay(1000).animate({opacity:'1'});
            } else {
                $('.form-advanced').queue('fx', []);
            }
        });
        jQuery.validator.addMethod("groupCheck", function (value, element) {
            console.log($(element).prop("checked"));
            if (($('.visible-users').children('li').length < 1) && ($('.groups input:checked').length < 1 )) {
                return false;
            } else {
                return true;
            }
        }, "Please tick at least one group");
        $('#newsForm').validate({
            rules:{
                'group[]':{
                    groupCheck:true
                },
                'campus[]':{
                    required:true,
                    minlength:1
                }
            },
            messages:{
                'group[]':"Please tick at least one group",
                'campus[]':"Please tick at least one campus"
            },
            errorPlacement:function (error, element) {
                if (element.parent().parent().hasClass('checkboxes')) {
                    error.insertAfter(element.parent().parent().parent().children(':last-child'));
                } else {
                    error.insertAfter(element);
                }
            }
        });
    });
</script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/foundation/chrome.css?v={SITE_VERSION}" />
<script type="text/javascript">
    $(function() {
        $('#container').addClass('foundation').foundation();
    });
</script>
<!-- END custom_head -->
<div class="row full-width">
    <div class="large-12 columns no-pad">
        <h1>
            {ACTION} News
            <span class="header-actions">
                <a class="customise button" href="#">
                    <span{ADV_OFF}>Show Advanced Options</span>
                    <span{ADV_ON}>Close Advanced Options</span>
                </a>            
            </span>
        </h1>
    </div>
</div>
<div class="row full-width">
    <div class="island">
        <form id="newsForm" method="post" enctype="multipart/form-data" action="/news/modifyForm.php">
            <input type="hidden" name="newsID" value="{NEWS_ID}"/>
            <label>
                Headline
                <input type="text" class="required" name="heading" size="35" maxlength="100" value="{HEADING}"/>
            </label>
            
            <label>
                Article     
                <span class="header-actions">
                    <span data-tooltip="article" class="has-tip tip-left hint icon-help no-text" data-width="240" title="This is the main portion of your news."></span>
                </span>  
                <textarea id="body" name="body" style="width:100%;height:350px">{BODY}</textarea>
            </label>
            
            <label>
                Feature Image
                <span class="header-actions">
                    <span data-tooltip="feat-img" class="has-tip tip-left hint icon-help no-text icon-help no-text" data-width="250" title="The feature image to be attached to your news post"></span>
                </span>
                {ATTACH_ZONE}
            </label>
            
            <label>
                Topic
                <select name="item_topic_id">
                <!-- BEGIN topic_list -->
                <option value="{TOPIC_ID}" {TOPIC_ID_SELECTED}>{TOPIC_NAME}</option>
                <!-- END topic_list -->
                </select>
            </label>

            <label>
                Roles
                <span class="header-actions">
                    <span data-tooltip="roles" class="has-tip tip-left hint icon-help no-text" data-width="250" title="This news item will only be visible to the roles you select."></span>
                </span>
                <div>
                    <!-- BEGIN group_selection -->              
                    <input id="role_checkbox{GROUP_ID}" type="checkbox" value="{GROUP_ID}" name="group[]" {GROUP_ID_SELECTED}><label for="role_checkbox{GROUP_ID}" class="checkbox-label">{GROUP_NAME}</label>
                    <!-- END group_selection -->
                    <input id="role_checkbox_all" type="checkbox" value="" name="" class="select_all" /><label for="role_checkbox_all" class="checkbox-label">Select all</label>     
                </div>
            </label>
            
            <!-- BEGIN campus_row -->
            <label>
                Campus
                <span class="header-actions">
                    <span data-tooltip="campus" class="has-tip tip-left hint icon-help no-text" data-width="250" title="This news item will only be visible to users that are within this campus."></span>
                </span>
            
    			<!-- BEGIN campus_selection -->
                <input type="checkbox" value="{CAMPUS_ID}" name="campus[]" id="campus_{CAMPUS_ID}" {CAMPUS_ID_SELECTED} /><label for="campus_{CAMPUS_ID}" class="checkbox-label">{CAMPUS_NAME}</label>
                <!-- END campus_selection -->
                <input type="checkbox" value="" name="" id="select_all" /><label for="select_all" class="checkbox-label">Select all</label>
                <!-- END campus_row -->
            </label>
            <div class="form-advanced" {SHOW_ADVANCED}>
                <div {OPAC_ADVANCED}>

                <label>
                    Add users
                    <span class="header-actions">
                        <span data-tooltip="add-users" class="has-tip tip-left hint icon-help no-text" data-width="250" title="You may add users individually by typing their name and selecting from the list."></span>
                    </span>
                    </div>
                    <div {OPAC_ADVANCED}>
                        <select id="addUser" name="userList[]" multiple placeholder="Search Users"></select>
                    </div>
                </label>
            </div>
            <div class="form-advanced" {SHOW_ADVANCED}>
                <label>
                    <div {OPAC_ADVANCED}>
                        Publish Date
                        <span class="header-actions">
                            <span data-tooltip="publish-date" class="has-tip tip-left hint icon-help no-text" data-width="250" title="Select a date for when this news item will become available."></span>
                        </span>
                    </div>
                    <div {OPAC_ADVANCED}>
                        <input type="text" class="required" name="item_datetime_published" id="item_datetime_published" size="12" maxlength="50" value="{ITEM_DATETIME_PUBLISHED}"/>
                    </div>
                </label>
            </div>
            
            <label>
                Expiry Date
                <span class="header-actions">
                    <span data-tooltip="exp-date" class="has-tip tip-left hint icon-help no-text" data-width="250" title="Select a date for when this item will expire."></span>
                </span>
            
                <input type="text" class="required" name="item_datetime_expires" id="item_datetime_expires" size="12" maxlength="50" value="{ITEM_DATETIME_EXPIRES}"/>
            </label>
            
            <input class="button success" type="submit" name="submit" value="{ACTION} News"/>
            <!-- BEGIN delete_button -->
            <input class="button alert" type="button" name="delete" value="Delete News" onclick="confirmDelete({NEWS_ID});"/>
            <!-- END delete_button -->
        </form>
    </div>
</div>
