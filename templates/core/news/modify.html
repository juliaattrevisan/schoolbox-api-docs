<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/resource/jquery.resourceAttach.js"></script>
<script type="text/javascript">
    $(function () {
        $.fn.alaressTiny({
            mode: 'textareas'
        });

        $('#item_datetime_published, #item_datetime_expires').datepicker({
            onClose:function (string) {
                var input = $(this);

                $.getJSON('/ajax/strtotime.php', {string:string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        $('#addUser')
            .selectizeSelector({
                multiple: true,
                value: {USER_LIST},
                ajax: {
                    url:      '/ajax/user.php',
                    type:     'GET',
                    data:     {groupID: 0},
                    dataType: 'json'
                }
            })

        $('.customise').click(function (event) {
            event.preventDefault();
            $(this).children('span').toggle();
            $('.advanced').toggle();
            if ($('.advanced').is(':visible')) {
            } else {
                $('.advanced').queue('fx', []);
            }
        });

        $('.select_all').change(function(){
            if($(this).is(':checked')){
                $(this).closest('fieldset').find(':checkbox').not('.select_all').prop('checked', true);
            } else {
                $(this).closest('fieldset').find(':checkbox').not('.select_all').prop('checked', false);
            }
        });

        $('#newsForm').validate({
            rules:{
                'group[]':{
                    required:true,
                    minlength:1
                },
                'campus[]':{
                    required:true,
                    minlength:1
                }
            },
            messages:{
                'group[]':"Please tick at least one role",
                'campus[]':"Please tick at least one campus"
            },
            errorPlacement:function (error, element) {
                if (element.parent().parent().hasClass('checkboxes')) {
                    error.insertAfter(element.parent().parent().parent().children(':last-child'));
                } else {
                    error.insertAfter(element);
                }
            }
        });

        $('[data-delete]').click(function(event) {
            event.preventDefault();

            var element = $(this);

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this item?',
                confirmEvent: function() {
                    window.location.href = $(element).attr('href');
                }
            });
        });
    });
</script>
<!-- END custom_head -->

<div class="actions-small-2 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ACTION} News</h1>
        </div>
    </div>
    <nav>
        <a class="icon-advanced-list customise" href="#" title="Toggle Advanced Options"></a>
        <!-- BEGIN delete_button -->
        <a class="icon-delete" href='/news/modifyForm.php?delete={NEWS_ID}' title="Delete News" data-delete></a>
        <!-- END delete_button -->
    </nav>
</div>

<div class="row">
    <div class="small-12 island">
        <form class="top" id="newsForm" method="post" enctype="multipart/form-data" action="/news/modifyForm.php">
            <section>
                <input type="hidden" name="newsID" value="{NEWS_ID}"/>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>
                            Headline
                            <input type="text" class="required" name="heading" size="35" maxlength="100" value="{HEADING}"/>
                        </label>

                        <label>
                            Article
                            <textarea id="body" name="body">{BODY}</textarea>
                        </label>

                        <label>
                            Feature Image
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="The feature image to be attached to your news post">?</span>
                            {ATTACH_ZONE}
                        </label>

                        <label>
                            Topic
                            <select name="item_topic_id">
                                <!-- BEGIN topic_list -->
                                <option value="{TOPIC_ID}" {TOPIC_ID_SELECTED}>{TOPIC_NAME}</option>
                                <!-- END topic_list -->
                            </select>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <div class="small-12 medium-6 columns">
                        <legend>
                            Roles
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="This news item will only be visible to the roles you select">?</span>
                        </legend>
                        <!-- BEGIN group_selection -->
                        <input type="checkbox" id="role{GROUP_ID}" value="{GROUP_ID}" name="group[]" {GROUP_ID_SELECTED}/>
                        <label for="role{GROUP_ID}" class="checkbox-label">{GROUP_NAME}</label>
                        <!-- END group_selection -->
                        <input type="checkbox" id="roleAll" value="{GROUP_ID}" name="" class="select_all" />
                        <label for="roleAll" class="checkbox-label">Select all</label>
                    </div>
                    <!-- BEGIN campus_row -->
                    <div class="small-12 medium-6 columns">
                        <legend>Campus
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="This news item will only be visible to users that are within this campus">?</span>
                        </legend>
                        <!-- BEGIN campus_selection -->
                        <input type="checkbox" id="campus{CAMPUS_ID}" value="{CAMPUS_ID}" name="campus[]" {CAMPUS_ID_SELECTED} />
                        <label for="campus{CAMPUS_ID}" class="checkbox-label">{CAMPUS_NAME}</label>
                        <!-- END campus_selection -->
                        <input type="checkbox" id="campusAll" value="{GROUP_ID}" name="" class="select_all" />
                        <label for="campusAll" class="checkbox-label">Select all</label>
                    </div>
                    <!-- END campus_row -->
                    <div class="small-12 columns">
                        <label class="advanced" {SHOW_ADVANCED}>
                            Add users
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="You may add users individually by typing their name and selecting from the list">?</span>
                            <select id="addUser" name="userList[]" multiple placeholder="Search Users"></select>
                        </label>
                    </div>
                </fieldset>
                <fieldset class="content">
                    <legend>Availability</legend>
                        <div class="small-12 large-6 columns">
                            <label for="item_datetime_published" class="advanced" {SHOW_ADVANCED}>
                                Publish Date
                                <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this news item will become available">?</span>
                                <input type="text" class="required" name="item_datetime_published" id="item_datetime_published" maxlength="50" value="{ITEM_DATETIME_PUBLISHED}"/>
                            </label>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label class="advanced" {SHOW_ADVANCED}>
                                Hour
                                <input name="publish_hour" type="text" maxlength="2" value="{PUBLISH_HOUR}" class="timeField"/>
                            </label>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label class="advanced" {SHOW_ADVANCED}>
                                Minute
                                <input name="publish_minute" type="text" maxlength="2" value="{PUBLISH_MIN}" class="timeField"/>
                            </label>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label class="advanced" {SHOW_ADVANCED}>
                                Period
                                <select name="publish_period" class="short">
                                    <option value="am">AM</option>
                                    <option value="pm"
                                    {PUBLISH_PM}>PM</option>
                                </select>
                            </label>
                        </div>
                        <div class="small-12 large-6 columns">
                            <label for="item_datetime_expires">
                                Expiry Date
                                <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Select a date for when this item will expire">?</span>
                            </label>
                            <input type="text" class="required" name="item_datetime_expires" id="item_datetime_expires" maxlength="50" value="{ITEM_DATETIME_EXPIRES}"/>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label>
                                Hour
                                <input name="expires_hour" type="text" maxlength="2" value="{EXPIRES_HOUR}" class="timeField"/>
                            </label>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label>
                                Minute
                                <input name="expires_minute" type="text" maxlength="2" value="{EXPIRES_MIN}" class="timeField"/>
                            </label>
                        </div>
                        <div class="small-4 large-2 columns">
                            <label>
                                Period
                                <select name="expires_period" class="short">
                                    <option value="am">AM</option>
                                    <option value="pm" {EXPIRES_PM}>PM</option>
                                </select>
                            </label>
                        </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 column">
                    <input type="submit" value="{ACTION} News"/>
                </div>
            </div>
        </form>
    </div>
</div>
