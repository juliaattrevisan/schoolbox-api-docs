<div class="attachzone s{AZ_THUMB_SIZE}" id="{AZ_ID}-zone">
  <span class="az-label">{AZ_ATTACHMENTS_LABEL}</span>
  <ul class="az-list">
    <!-- BEGIN attachment_list -->
    <li class="dz-success">
      <!-- BEGIN attachment_editable -->

        <a href="#" data-dz-remove title="Detach" class="button alert icon-delete">Remove</a>

      <input type="hidden" name="{AZ_FILE_VAR}" value="{AZ_FILE_HASH}" data-az-attachment />
      <!-- END attachment_editable -->
      <img alt="{AZ_FILE_NAME}" src="{AZ_FILE_PREVIEW}" />
      <p class="filename" data-dz-name>{AZ_FILE_NAME}</p>
    </li>
    <!-- END attachment_list -->
  </ul>
  <!-- BEGIN can_drop -->
  <div class="dzone" id="{AZ_ID_CAMEL}Zone">
    <ul data-template>
      <li>
        <div class="dz-progress"><span class="dz-upload" data-dz-uploadprogress></span></div>

          <a title="Detach" data-dz-remove class="button alert icon-delete">Remove</a>

        <img data-dz-thumbnail src="/images/emails/spacer.gif" />
        <p class="filename" data-dz-name></p>
        <input type="hidden" data-az-attachment name="{AZ_FILE_VAR}" value="" />
      </li>
    </ul>
  </div>
  <ul class="az-error-list"></ul>
  <script type="text/javascript">
        $(function () {
            $('#{AZ_ID}-zone').resourceAttach({
                url: '/storage/asyncUpload',
                paramName: 'upload',
                trigger: 'div.dzone',
                dropzoneSelector: 'div.dzone',
                dictDefaultMessage: '{AZ_ATTACH_PROMPT}',
                allowedFiles: {AZ_MIME_FILTER},
                multi: {AZ_MULTI},
                title: '{AZ_MODAL_TITLE}',
                thumbnailSize: '{AZ_THUMB_SIZE}',
                fallbackButtonSelector: 'a[data-attach-fallback]',
                onSelect: function (attachments) {
                    /* `this` will refer to $(element_that_was_clicked) */
                    /* multi or not, you will ALWAYS receive a [LIST] of documents to parse for attachment */
                }
            });
        });
  </script>
  <!-- END can_drop -->
</div>
