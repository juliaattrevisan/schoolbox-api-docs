<script type="text/javascript" src="/javascript/getusermedia-js-shim-only/dist/getUserMedia.js"></script>
<script type="text/javascript">
    $(function () {

        var abUpload          = $('#ab-upload'),
            abUploadForm      = abUpload.find('form.dzone'),
            abUploadControls  = abUpload.siblings('div.ctrl'),
            abUploadSubmitBtn = abUploadControls.children('a[data-interaction="file-upload"]'),
            abUploadCancelBtn = abUploadControls.children('a.cancel'),
            maxFiles           = {MAX_FILES};

        // Setup of the user media recorder
        var userMediaOptions  = {
            audio: true,
            video: false
        };

        // States:
        // before recording
        // recording

        var recorderButtons = {
            start:     'a[data-interaction="audio-record-start"]',
            recording: 'a[data-interaction="audio-record-recording"]',
//            pause:     'a[data-interaction="audio-record-pause"]',
            stop:      'a[data-interaction="audio-record-stop"]',
            upload:    'a[data-interaction="audio-record-upload"]',
            disabled:  'a[data-interaction="audio-record-disabled"]'
        };
        var onDisableRecording = function () {
            abUploadControls.find(recorderButtons.start).hide().prop('disabled', true);
            abUploadControls.find(recorderButtons.recording).hide().prop('disabled', true);
//            abUploadControls.find(recorderButtons.pause).show();
            abUploadControls.find(recorderButtons.stop).hide().prop('disabled', true);
            abUploadControls.find(recorderButtons.upload).hide().prop('disabled', true);
            abUploadControls.find(recorderButtons.disabled).show();
        };
        var onStartRecording = function () {
            abUploadControls.find(recorderButtons.start).hide().prop('disabled', true);
            abUploadControls.find(recorderButtons.recording).show().prop('disabled', false);
//            abUploadControls.find(recorderButtons.pause).show();
            abUploadControls.find(recorderButtons.stop).show().prop('disabled', false);
            abUploadControls.find(recorderButtons.upload).show().prop('disabled', false);
            abUploadControls.find(recorderButtons.disabled).hide();
        };
        var onStopRecording = function () {
            abUploadControls.find(recorderButtons.start).show().prop('disabled', false);
            abUploadControls.find(recorderButtons.recording).hide().prop('disabled', true);
//            abUploadControls.find(recorderButtons.pause).show();
            abUploadControls.find(recorderButtons.stop).hide().prop('disabled', true);
            abUploadControls.find(recorderButtons.upload).show().prop('disabled', false);
            abUploadControls.find(recorderButtons.disabled).hide();
        };
        // Hide controls by default
        onStopRecording();

        var stream;
        var playbacker = $('#playback');
        var recorder;
        var dz;
        abUploadControls.on(
            'click',
            recorderButtons.start,
            function (event) {
                event.preventDefault();
                getUserMedia(
                    userMediaOptions,
                    function (s) {
                        onStartRecording();
                        stream = s;
                        // success callback
                        if (userMediaOptions.context === 'webrtc') {
                            // WebRTC
//                            video.src = window.URL.createObjectURL(stream);
                            recorder  = RecordRTC(s);
                            recorder.startRecording();
                        } else {
                            // Flash - do something else, I know not what
                            // Use https://github.com/michalstocki/FlashWavRecorder
                            // has a getBlob() method, which is good
                        }
                    },
                    function (error) {
                        // error callback
                        // Show some message saying no recording devices are available,
                        // or alternately open upload screen.
                        onDisableRecording();
                    }
                );
            }
        );

        abUploadControls.on(
            'click',
            recorderButtons.pause,
            function (event) {
                event.preventDefault();
                // on next play, append stream onto end
                recorder.pause();
            }
        );

        var formData;
        var blob;
        abUploadControls.on(
            'click',
            recorderButtons.stop,
            function (event) {
                event.preventDefault();
                onStopRecording();
                stream.stop();
                recorder.stopRecording(function (audioVideoWebMURL) {
                    console.log(audioVideoWebMURL);
                    formData = new FormData();
                    blob     = recorder.getBlob();
                    playbacker
                            .attr('src', window.URL.createObjectURL(blob))
                            .attr('width', '100%')
                    ;
                    formData.append('upload', blob, 'blob.wav');
                });

//                video.pause();
//                stream.stop();
//                recorder.clear();
                // remove contents of video completely
            }
        );
        abUploadControls.on(
            'click',
            recorderButtons.upload,
            function (event) {
                event.preventDefault();

                // async upload
                $.ajax(
                    {
                        url: abUploadForm.attr('action'),
                        type: 'post',
                        data: formData,
                        contentType: false,
                        processData: false
                    }
                )
                .done(function(response) {
                    // dropzone
                    var data = {
                        title: 'blob.wav',
                        mimeType: blob.type,
                        filesize: blob.size,
                        hash: response.hash
                    };
                    window.top.postMessage(JSON.stringify({ data: [data] }), location.origin);
                });

                // Get the contents of stream blob or src.
//                var reader = new FileReader();
//                reader.addEventListener('loadend', function() {
//                    // blobby
//                    console.log(reader.result);
//                });
//                console.log(stream);
//                console.log(window.URL.createObjectURL(stream));
//                reader.readAsArrayBuffer(new Blob([stream]));
//                abUploadForm.dropzone.addFile({
//                    name: 'recordedVideo.mp4',
//                    type: 'video/mp4',
//                    size: 'something',
//                    hash: 'brownhole'
//                });
            }
        );

        abUploadForm.dropzone({
            paramName: 'upload',
            parallelUploads: {MAX_FILES},
            dictDefaultMessage: 'Click or drag here to upload',
            dictFallbackText: 'Your browser does not support drag and drop. Please select a file to upload.',
            maxFiles: maxFiles,
            maxFilesize: 2048,
            autoProcessQueue: false,
            addRemoveLinks: true,
            acceptedFiles: {ACCEPTED_FILES},

            accept: function (file, done) {
                done();
                checkState.call(this);
            },

            fallback: function () {

                // pull in the manual upload fallback
                abUpload.load('/ajax/resource/internal/upload-fallback.html', function () {
                    var ff = $('#fileform'),
                        fr = $('#fallup'),
                        lb = 'label.file-input',
                        fi = 'input.prettify[type=file]',
                        cf = {
                            additionalButtonClasses: 'up-arrow no-marg float-left',
                            buttonActiveClass: 'tick',
                            defaultText: '<span></span>Select file',
                            defaultFileSelectedText: '<span></span>File selected'
                        };

                    ff.find(fi).prettyFileInput(cf);

                    abUploadSubmitBtn.one('click', function () {
                        // cleanup any empty inputs
                        ff.find(fi).filter(function () {
                            return !$(this).val();
                        }).closest(lb).detach();

                        ff.submit();
                    });

                    ff.on('submit', function (e) {
                        abUploadSubmitBtn.attr('disabled', 'disabled').html('Uploading');
                    });

                    ff.on('change', fi, function (e) {

                        // cleanup any empty inputs
                        ff.find(fi).filter(function () {
                            return !$(this).val();
                        }).closest(lb).detach();

                        var len = ff.find(fi).length;

                        if (!maxFiles || len < maxFiles) {
                            var newInput = $('<input class="prettify" type="file" name="upload[]" />');
                            ff.children('p').append(newInput);
                            newInput.prettyFileInput(cf);
                        }

                        if (len) {
                            abUploadSubmitBtn
                                .html('Upload (' + len + ')')
                                .removeAttr('disabled');
                        } else {
                            abUploadSubmitBtn
                                .html('Upload')
                                .attr('disabled', 'disabled');
                        }


                    });

                    fr.load(function () {
                        var uploads, i,
                            data = [],
                            str  = fr.contents().find('body').text();

                        try {
                            uploads = JSON.parse(str);

                            for (i = 0; i < uploads.hash.length; ++i) {
                                // this will include upload failures
                                data.push({
                                    title: uploads.meta[i].name,
                                    mimeType: uploads.meta[i].type,
                                    filesize: uploads.meta[i].size,
                                    hash: uploads.hash[i]
                                });
                            }

                            window.top.postMessage(JSON.stringify({ data: data }), location.origin);

                        } catch (e) {
                            // noop
                        }

                    });
                });
            },

            init: function () {
                dz = this;

                abUpload.data('dropzone', this);

                abUploadCancelBtn.on('click', function (e) {
                    dz.removeAllFiles(true);
                });

                this.on('addedfile', function (file) {
                    var img = $(file.previewElement).find('img[data-dz-thumbnail]');
                    img.attr('src', '/ajax/mime/' + file.type);
                });

                this.on('removedfile', function (file) {
                    checkState.call(this);
                });

                this.on('error', function (file, msg, xhr) {
                    if (xhr) {
                        try {
                            msg = JSON.parse(msg);
                        } catch (err) {
                            // noop
                        }
                        file.hash = msg.hash;

                        $(file.previewElement).find('span[data-dz-errormessage]').html(msg.hash.split(':')[1]);
                    }
                    checkState.call(this);
                });

                this.on('maxfilesreached', function (file) {
                    checkState.call(this);
                });

                this.on('sending', function (file, xhr, formData) {
                    $(file.previewElement).find('a[data-dz-remove]').detach()
                });

                this.on('success', function (file, xhr) {
                    try {
                        data = JSON.parse(xhr);
                    }
                    catch (err) {
                        data = xhr;
                    }
                    file.hash = data.hash;
                });

                this.on('queuecomplete', function () {
                    var accepted = this.getAcceptedFiles(),
                        data = [],
                        i;

                    if (!abUploadSubmitBtn.data('uploading')) {
                        return;
                    }

                    $.extend(accepted, this.getRejectedFiles());

                    if (accepted.length) {
                        for (i = 0; i < accepted.length; ++i) {
                            if (accepted[i].hash) {
                                data.push({
                                    title: accepted[i].name,
                                    mimeType: accepted[i].type,
                                    filesize: accepted[i].size,
                                    hash: accepted[i].hash
                                });
                            }
                        }

                        setTimeout(function () {
                            window.top.postMessage(JSON.stringify({ data: data }), location.origin);
                        }, 1000);
                    }
                });
            }
        });

        function checkState() {
            var ql, dz;

            if (abUploadSubmitBtn.data('uploading')) {
                return;
            }

            ql = this.getQueuedFiles().length;
            if (ql == 0) {
                abUploadSubmitBtn
                    .html('Upload')
                    .attr('disabled', 'disabled')
                    .off('click');
            }
            else {
                dz = this;

                abUploadSubmitBtn
                    .html('Upload (' + ql + ')')
                    .removeAttr('disabled')
                    .one('click', function (e) {
                        abUploadSubmitBtn
                            .data('uploading', dz.getQueuedFiles())
                            .html('Uploading')
                            .attr('disabled', 'disabled');
                        abUploadCancelBtn.attr('disabled', 'disabled');
                        dz.processQueue();
                    });
            }

          }


    });
</script>

<div id="ab-upload" class="ab-pane">
  <form class="dzone" action="/storage/asyncUpload">
    <div class="dz-default"><span>Click or drag here to upload</span></div>
  </form>
</div>
<div class="ctrl">
  <a role="button" class="submit-btn-plain" data-interaction="file-upload" disabled="disabled" href="#">Upload</a>
  <a role="button" class="submit-btn-plain record" data-interaction="audio-record-start" href="#">Record Audio</a>
  <a role="button" class="submit-btn-plain recording hide" data-interaction="audio-record-recording" disabled href="#">Recording...</a>
  <a role="button" class="submit-btn-plain disabled" data-interaction="audio-record-disabled" disabled href="#">No recording devices available</a>
  <!--<a role="button" class="submit-btn-plain pause hide" data-interaction="audio-record-pause" href="#">Pause</a>-->
  <a role="button" class="submit-btn-plain stop hide" data-interaction="audio-record-stop" href="#">Stop</a>
  <a role="button" class="submit-btn-plain stop hide" data-interaction="audio-record-upload" href="#">Upload Audio</a>
  <a role="button" class="btn no-icon float-left cancel" href="#">Cancel</a>
</div>
<audio id="playback" controls width="100%"></audio>
<div id="recordingContainer">
    <!--
    <audio id="microphone"></audio>
    <video id="playback" style="transform: scaleX(-1)"></video>
    -->
</div>
