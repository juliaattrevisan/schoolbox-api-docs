<!-- includes for recorder -->
<script type="text/javascript" src="/javascript/recorder/getusermedia-shim/getUserMedia.js"></script>
<script type="text/javascript" src="/javascript/recorder/webrtc/recorder.js"></script>
<script type="text/javascript" src="/javascript/recorder/flash/recorder.js"></script>
<script type="text/javascript" src="/javascript/components/swfobject/swfobject/swfobject.js"></script>
<script type="text/javascript" src="/javascript/recorder/jquery.recorder.js"></script>
<script type="text/javascript">
    $(function () {

        var abUpload           = $('#ab-upload'),
            abUploadForm       = abUpload.find('form.dzone'),
            abUploadControls   = abUpload.siblings('div.ctrl'),
            abUploadSubmitBtn  = abUploadControls.children('a[data-interaction="file-upload"]'),
            abUploadCancelBtn  = abUploadControls.children('a.cancel'),
            recorderContainer  = $('#recorder'),
            recorderNameDialog = $('#recorderNameDialog'),
            recorderNameInput  = $('#recorderNameDialog input[name="name"]'),
            maxFiles           = {MAX_FILES},
            recorderInterface, // Recording plugin
            dz; // Dropzone

        var uploadRecorded = function() {
            recorderNameInput.blur();
            recorderInterface.uploadRecorded(recorderNameInput.val() + '.wav');
            recorderNameDialog.dialog('close');
        };

        // Set up the recorder's dialog
        recorderNameDialog.dialog({
            modal: true,
            autoOpen: false,
            buttons: [
                {
                    text:  'Upload',
                    click: function() {
                        uploadRecorded();
                    }
                },
                {
                    text:  'Cancel',
                    click: function() {
                        $(this).dialog('close');
                    }
                }
            ]
        }).on('open', function() {
            recorderNameInput.focus();
        });
        // Did I press enter on the recorder name?
        recorderNameInput.on('keypress', function(event) {
            if (event.which == 13) {
                uploadRecorded();
            }
        });

        // Set up the recorder
        var recorderButtons = {
            start:     abUploadControls.find('a[data-interaction="audio-record-start"]'),
            recording: abUploadControls.find('a[data-interaction="audio-record-recording"]'),
            play:      abUploadControls.find('a[data-interaction="audio-record-play"]'),
            stop:      abUploadControls.find('a[data-interaction="audio-record-stop"]'),
            upload:    abUploadControls.find('a[data-interaction="audio-record-upload"]'),
            uploading: abUploadControls.find('a[data-interaction="audio-record-uploading"]'),
            disabled:  abUploadControls.find('a[data-interaction="audio-record-disabled"]')
        };

        // Switch off buttons by default
        recorderButtons.start.show().prop('disabled', false);
        recorderButtons.recording.hide().prop('disabled', true);
        recorderButtons.play.hide().prop('disabled', true);
        recorderButtons.stop.hide().prop('disabled', true);
        recorderButtons.upload.hide().prop('disabled', true);
        recorderButtons.disabled.hide();
        recorderButtons.uploading.hide();

        recorderContainer.recorder({
            upload: {
                url: abUploadForm.attr('action')
            },
            flash: {
                flashContainer: $('#flashContainer')[0],
                session: {
                    name: '{SESSION_NAME}',
                    id:   '{SESSION_ID}'
                }
            }
        });
        recorderInterface = recorderContainer.data('recorder');
        recorderContainer.on('setupFailed.recorder', function(event, recorder) {
            // Disable all buttons
            recorderButtons.start.hide().prop('disabled', true);
            recorderButtons.recording.hide().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.hide().prop('disabled', true);
            recorderButtons.disabled.show();
        });
        recorderContainer.on('recordingReady.recorder', function(event, recorder) {
            // Allow record button to show
            recorderButtons.start.show().prop('disabled', false);
        });
        recorderContainer.on('recordingStart.recorder', function(event, recorder) {
            // Show stop button only
            recorderButtons.start.hide().prop('disabled', true);
            recorderButtons.recording.show().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.show().prop('disabled', false);
            recorderButtons.upload.hide().prop('disabled', true);
        });
        recorderContainer.on('recordingStop.recorder', function(event, recorder) {
            recorderButtons.start.show().prop('disabled', false);
            recorderButtons.recording.hide().prop('disabled', true);
            recorderButtons.play.show().prop('disabled', false);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.show().prop('disabled', false);
        });
        recorderContainer.on('playbackStart.recorder', function(event, recorder) {
            recorderButtons.start.show().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.show().prop('disabled', false);
            recorderButtons.upload.show().prop('disabled', false);
        });
        recorderContainer.on('playbackStop.recorder', function(event, recorder) {
            recorderButtons.start.show().prop('disabled', false);
            recorderButtons.play.show().prop('disabled', false);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.show().prop('disabled', false);
        });
        recorderContainer.on('uploadStart.recorder', function(event, recorder) {
            recorderButtons.start.hide().prop('disabled', true);
            recorderButtons.recording.hide().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.hide().prop('disabled', true);
            recorderButtons.uploading.show();
        });
        recorderContainer.on('uploadComplete.recorder', function(event, recorder, filename, response) {
            // inform any listeners that a file was uploaded.
            // put it in the dropzone, and inform the dropzone opener
            // that a file was posted to it.
            var data = {
                title:    filename,
                mimeType: response.meta.type,
                filesize: response.meta.size,
                hash:     response.hash
            };
            window.top.postMessage(JSON.stringify({ data: [data] }), location.origin);

            // Go back to recordingReady state
            recorderButtons.start.show().prop('disabled', false);
            recorderButtons.recording.hide().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.show().prop('disabled', false);
            recorderButtons.uploading.hide();
        });
        recorderContainer.on('uploadFailed.recorder', function(event, recorder) {
            // Show some sort of failed message?
            recorderButtons.start.hide().prop('disabled', true);
            recorderButtons.recording.hide().prop('disabled', true);
            recorderButtons.play.hide().prop('disabled', true);
            recorderButtons.stop.hide().prop('disabled', true);
            recorderButtons.upload.hide().prop('disabled', true);
            recorderButtons.uploading.show();
        });

        // Button events
        recorderButtons.start.click(function(event) {
            event.preventDefault();
            recorderInterface.startRecording();
        });
        recorderButtons.play.click(function(event) {
            event.preventDefault();
            recorderInterface.startPlaying();
        });
        recorderButtons.stop.click(function(event) {
            event.preventDefault();
            if (recorderInterface.isRecording()) {
                recorderInterface.stopRecording();
            } else if (recorderInterface.isPlaying()) {
                recorderInterface.stopPlaying();
            }
        });
        recorderButtons.upload.click(function(event) {
            event.preventDefault();
            // prompt for a name
            recorderNameDialog.dialog('open');
        });

        // Init dropzone
        abUploadForm.dropzone({
            paramName: 'upload',
            parallelUploads: {MAX_FILES},
            dictDefaultMessage: 'Click or drag here to upload',
            dictFallbackText: 'Your browser does not support drag and drop. Please select a file to upload.',
            maxFiles: maxFiles,
            maxFilesize: 2048,
            autoProcessQueue: false,
            addRemoveLinks: true,
            acceptedFiles: {ACCEPTED_FILES},

            accept: function (file, done) {
                done();
                checkState.call(this);
            },

            fallback: function () {

                // pull in the manual upload fallback
                abUpload.load('/ajax/resource/internal/upload-fallback.html', function () {
                    var ff = $('#fileform'),
                        fr = $('#fallup'),
                        lb = 'label.file-input',
                        fi = 'input.prettify[type=file]',
                        cf = {
                            additionalButtonClasses: 'up-arrow no-marg float-left',
                            buttonActiveClass: 'tick',
                            defaultText: '<span></span>Select file',
                            defaultFileSelectedText: '<span></span>File selected'
                        };

                    ff.find(fi).prettyFileInput(cf);

                    abUploadSubmitBtn.one('click', function () {
                        // cleanup any empty inputs
                        ff.find(fi).filter(function () {
                            return !$(this).val();
                        }).closest(lb).detach();

                        ff.submit();
                    });

                    ff.on('submit', function (e) {
                        abUploadSubmitBtn.attr('disabled', 'disabled').html('Uploading');
                    });

                    ff.on('change', fi, function (e) {

                        // cleanup any empty inputs
                        ff.find(fi).filter(function () {
                            return !$(this).val();
                        }).closest(lb).detach();

                        var len = ff.find(fi).length;

                        if (!maxFiles || len < maxFiles) {
                            var newInput = $('<input class="prettify" type="file" name="upload[]" />');
                            ff.children('p').append(newInput);
                            newInput.prettyFileInput(cf);
                        }

                        if (len) {
                            abUploadSubmitBtn
                                .html('Upload (' + len + ')')
                                .removeAttr('disabled');
                        } else {
                            abUploadSubmitBtn
                                .html('Upload')
                                .attr('disabled', 'disabled');
                        }


                    });

                    fr.load(function () {
                        var uploads, i,
                            data = [],
                            str  = fr.contents().find('body').text();

                        try {
                            uploads = JSON.parse(str);

                            for (i = 0; i < uploads.hash.length; ++i) {
                                // this will include upload failures
                                data.push({
                                    title: uploads.meta[i].name,
                                    mimeType: uploads.meta[i].type,
                                    filesize: uploads.meta[i].size,
                                    hash: uploads.hash[i]
                                });
                            }

                            window.top.postMessage(JSON.stringify({ data: data }), location.origin);

                        } catch (e) {
                            // noop
                        }

                    });
                });
            },

            init: function () {
                dz = this;

                abUpload.data('dropzone', this);

                abUploadCancelBtn.on('click', function (e) {
                    dz.removeAllFiles(true);
                });

                this.on('addedfile', function (file) {
                    var img = $(file.previewElement).find('img[data-dz-thumbnail]');
                    img.attr('src', '/ajax/mime/' + file.type);
                });

                this.on('removedfile', function (file) {
                    checkState.call(this);
                });

                this.on('error', function (file, msg, xhr) {
                    if (xhr) {
                        try {
                            msg = JSON.parse(msg);
                        } catch (err) {
                            // noop
                        }
                        file.hash = msg.hash;

                        $(file.previewElement).find('span[data-dz-errormessage]').html(msg.hash.split(':')[1]);
                    }
                    checkState.call(this);
                });

                this.on('maxfilesreached', function (file) {
                    checkState.call(this);
                });

                this.on('sending', function (file, xhr, formData) {
                    $(file.previewElement).find('a[data-dz-remove]').detach()
                });

                this.on('success', function (file, xhr) {
                    try {
                        data = JSON.parse(xhr);
                    }
                    catch (err) {
                        data = xhr;
                    }
                    file.hash = data.hash;
                });

                this.on('queuecomplete', function () {
                    var accepted = this.getAcceptedFiles(),
                        data = [],
                        i;

                    if (!abUploadSubmitBtn.data('uploading')) {
                        return;
                    }

                    $.extend(accepted, this.getRejectedFiles());

                    if (accepted.length) {
                        for (i = 0; i < accepted.length; ++i) {
                            if (accepted[i].hash) {
                                data.push({
                                    title: accepted[i].name,
                                    mimeType: accepted[i].type,
                                    filesize: accepted[i].size,
                                    hash: accepted[i].hash
                                });
                            }
                        }

                        setTimeout(function () {
                            window.top.postMessage(JSON.stringify({ data: data }), location.origin);
                        }, 1000);
                    }
                });
            }
        });

        function checkState() {
            var ql, dz;

            if (abUploadSubmitBtn.data('uploading')) {
                return;
            }

            ql = this.getQueuedFiles().length;
            if (ql == 0) {
                abUploadSubmitBtn
                    .html('Upload')
                    .attr('disabled', 'disabled')
                    .off('click');
            }
            else {
                dz = this;

                abUploadSubmitBtn
                    .html('Upload (' + ql + ')')
                    .removeAttr('disabled')
                    .one('click', function (e) {
                        abUploadSubmitBtn
                            .data('uploading', dz.getQueuedFiles())
                            .html('Uploading')
                            .attr('disabled', 'disabled');
                        abUploadCancelBtn.attr('disabled', 'disabled');
                        dz.processQueue();
                    });
            }

          }


    });
</script>

<div id="ab-upload" class="ab-pane">
  <form class="dzone" action="/storage/asyncUpload">
    <div class="dz-default"><span>Click or drag here to upload</span></div>
  </form>
</div>
<div class="ctrl">
  <a role="button" class="submit-btn-plain" data-interaction="file-upload" disabled="disabled" href="#">Upload</a>

  <a role="button" class="submit-btn-plain record" data-interaction="audio-record-start" href="#">Record Audio</a>
  <a role="button" class="submit-btn-plain recording hide" data-interaction="audio-record-recording" disabled href="#">Recording...</a>
  <a role="button" class="submit-btn-plain disabled" data-interaction="audio-record-disabled" disabled href="#">No recording devices available</a>
  <!--<a role="button" class="submit-btn-plain pause hide" data-interaction="audio-record-pause" href="#">Pause</a>-->
  <a role="button" class="submit-btn-plain play hide" data-interaction="audio-record-play" href="#">Play</a>
  <a role="button" class="submit-btn-plain stop hide" data-interaction="audio-record-stop" href="#">Stop</a>
  <a role="button" class="submit-btn-plain upload hide" data-interaction="audio-record-upload" href="#">Upload Audio</a>
  <a role="button" class="submit-btn-plain uploading hide" data-interaction="audio-record-uploading" disabled href="#">Uploading...</a>

  <a role="button" class="btn no-icon float-left cancel" href="#">Cancel</a>
</div>
<div id="recorder"></div>
<div id="flashContainer"></div>
<div id="recorderNameDialog" title="Please enter a name for this recording" class="hide">
    <input name="name" type="text" value="recording" />
</div>
