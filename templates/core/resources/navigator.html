<script type="application/javascript">
  $(function () {
    $('#ab-{SOURCE_SLUG}').socialstreamBrowser({
      url: '/ajax/resource/tree/{SOURCE_SLUG}',
      modal: false,
      isolate: true,
      mimeFilter: {MIME_FILTER},
      useFolder: {USE_FOLDER},
      categoryId: {FOLDER_ID},
      submitCallback: function (url, filename, meta) {
        var i, hash, data;

        i = url.match(/\/(?:homepage\/([0-9]+))?$/);

        if (i) {
            hash = '{SOURCE_SLUG}.folder:' + (i[1] || 0);
            meta = {
                mime: 'folder',
                size: 0
            }
        } else {
            hash = '{SOURCE_SLUG}:' + url.split('?id=')[1];
        }

        data = [{
          title:    filename,
          mimeType: meta.mime,
          filesize: meta.size,
          hash:     hash
        }];

        window.top.postMessage(JSON.stringify({ data: data }), location.origin);
      }
    });
  });

  $('#ab-{SOURCE_SLUG}').on('click', 'a[data-gettoken]', function (e) {
      e.preventDefault();
      var w = window.open(this.href, '1396330261396', 'width=720,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1,left=0,top=0');

      var winClosed = setInterval(function () {
                  if (w.closed) {
                      clearInterval(winClosed);
                      var ab = $('#attachment-browser'),
                              li = ab.children('dd.active');
                      ab.data(li.data('source'), false);
                      ab.foundation('accordion', 'close');
                      $('a.icon-office-365').click();
                  }
              },500
      )

    return false;

  });
</script>
<div id="ab-{SOURCE_SLUG}" class="ab-pane preload"> </div>
<div class="component-action ctrl">
    <section>
        <!-- BEGIN use_this_folder_component_action -->
        <a class="button" data-use-this-folder-component-action>Use This Folder</a>
        <script>
            $(function() {

                /* This button pushes the other button
                 */
                $('[data-use-this-folder-component-action]').on('click', function() {
                    $('[data-use-folder]').trigger('click');
                });
            });
        </script>
        <!-- END use_this_folder_component_action -->

        <a role="button" class="cancel button" href="#">Cancel</a>
    </section>
</div>
