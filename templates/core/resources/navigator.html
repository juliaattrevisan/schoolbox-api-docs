<script type="application/javascript">
  $(function () {
    $('#ab-{SOURCE_SLUG}').socialstreamBrowser({
      url: '/ajax/resource/tree/{SOURCE_SLUG}',
      modal: false,
      isolate: true,
      mimeFilter: {MIME_FILTER},
      loadedCallback: function () {
          this.removeClass('preload');
      },
      submitCallback: function (url, filename, meta) {
        var i, hash, data;

        i = url.match(/\/(?:homepage\/([0-9]+))?$/);

        if (i) {
            hash = '{SOURCE_SLUG}.folder:' + (i[1] || 0);
            meta = {
                mime: 'folder',
                size: 0
            }
        } else {
            hash = '{SOURCE_SLUG}:' + url.split('?id=')[1];
        }

        data = [{
          title:    $(filename).text(),
          mimeType: meta.mime,
          filesize: meta.size,
          hash:     hash
        }];

        window.top.postMessage(JSON.stringify({ data: data }), location.origin);
      }
    });
  });

  $('#ab-{SOURCE_SLUG}').on('click', 'a[data-gettoken]', function (e) {
    e.preventDefault();

    var w = window.open(this.href,'1396330261396','width=720,height=500,toolbar=0,menubar=0,location=0,status=1,scrollbars=1,resizable=1,left=0,top=0');

    $(w).on('unload', function (e) {
      var ab = $('#attachment-browser'),
          li = ab.children('li.browsing');

      ab.data(li.data('source'), false);

      li.find('a.src-select').trigger('click');
    });

    return false;

  });
</script>
<div id="ab-{SOURCE_SLUG}" class="ab-pane preload"> </div>
<div class="ctrl">
  <a role="button" class="cancel button" href="#">Cancel</a>
</div>
