<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/mootools.js"></script>
<script type="text/javascript" src="/javascript/behaviour.js"></script>
<script type="text/javascript" src="/javascript/rightcontext.js"></script>
<script type="text/javascript" src="/javascript/resources.js"></script>
<script type="text/javascript" src="/javascript/windoo.r114.js"></script>

<link rel="stylesheet" type="text/css" media="screen" href="/css/resources.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/rightcontext.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/windoo/windoo.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/windoo/windoo.alphacube.css" />

<h1>{TITLE}</h1>
<div id='resources'>
    <div id='resources-nav'>{NAV_CONTENT} </div>
    <div id='resources-window'>{WINDOW_CONTENT} </div>
</div>

<div id="ajax-load"><img src="/images/resources/loading.gif" /></div>

<p style="height: 200px;"></p>

<script type='text/javascript'>
	
	menu1 = { attributes: "afileid,acatid,ainline,aurl,alink,acomments,aowner,asubmitted,afilename,aadmin" ,
	
		items: [ 
			   {type:RightContext.TYPE_MENU,
				text:"Preview",
				requires: ["ainline", "Y"],
				frame:"_blank",
				url:"/sendframe.php?id=[afileid]"},
	
			   {type:RightContext.TYPE_MENU,
				text:"Save As",
				requires: ["aurl", "N"],
				url:"/send.php?id=[afileid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Open",
				requires: ["aurl", "Y"],
				url:"/redir.php?url=[alink]"},
			  
			   {type: RightContext.TYPE_SEPERATOR,
			    requires: ["aadmin", "Y"] },
			   
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				requires: ["aurl", "N"],
				requires2: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=modfile&id=[afileid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				requires: ["aurl", "Y"],
				requires2: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=modurl&id=[afileid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Delete",
				requires: ["aurl", "N"],
				requires2: ["aadmin", "Y"],
				onclick:function() { if (confirm('Are you sure you want to delete [afilename]?')) { window.open("/cms/delResource.php?fileid=[afileid]",'_self',''); }} },
			  
			  {type:RightContext.TYPE_MENU,
				text:"Delete",
				requires: ["aurl", "Y"],
				requires2: ["aadmin", "Y"],
				onclick:function() { if (confirm('Are you sure you want to delete [afilename]?')) { window.open("/cms/delResource.php?linkid=[afileid]",'_self',''); }} },
			  
			   {type: RightContext.TYPE_SEPERATOR,
			    requires: ["aadmin", "Y"] },
			   
			   {type:RightContext.TYPE_MENU,
				text:"New File",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=file&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Add Multiple Files",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=files&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Link",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=url&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Folder",
				requires: ["aadmin", "Y"],
				url:"/cms/modFolder.php?action=add&cid=[acatid]"},
			   
			   {type: RightContext.TYPE_SEPERATOR },
				
			   {type:RightContext.TYPE_MENU,
			   	text:"Properties",
				onclick:function(e) { Resources.openDetails([afileid], e); }}
			   ]
	};			   
	
	menu2 = { attributes: "acatid,ahomepage,acatname,aadmin" ,
	
		items: [ 
			   {type:RightContext.TYPE_MENU,
				text:"View Homepage",
				requires: ["ahomepage", "Y"],
				url:"/homepage.php?category=[acatid]"},
	
			  {type:RightContext.TYPE_MENU,
				text:"Image Gallery",
				url:"/cms/imageGallery.php?category=[acatid]"},						
			  
			   {type: RightContext.TYPE_SEPERATOR,
				requires: ["ahomepage", "Y"],
				requires2: ["aadmin", "Y"]},
			   
				
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				requires: ["aadmin", "Y"],
				url:"/cms/modFolder.php?action=mod&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Delete",
				requires: ["aadmin", "Y"],
				onclick:function() { if (confirm('Are you sure you want to delete [acatname]?')) { window.open("/cms/modFolder.php?delete=[acatid]",'_self',''); }} },
			  
			   {type: RightContext.TYPE_SEPERATOR,
			    requires: ["aadmin", "Y"] },
			   
			   {type:RightContext.TYPE_MENU,
				text:"New File",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=file&cid=[acatid]"},
			   
			   {type:RightContext.TYPE_MENU,
				text:"Add Multiple Files",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=files&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Link",
				requires: ["aadmin", "Y"],
				url:"/cms/modResource.php?type=url&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Folder",
				requires: ["aadmin", "Y"],
				url:"/cms/modFolder.php?action=add&cid=[acatid]"},
			   
			   {type:RightContext.TYPE_MENU,
				text:"Download",
				requires: ["aadmin", "Y"],
				url:"/cms/fetchFolder.php?folder=[acatid]"} 
			   ]
			
	};	
	
	RightContext.addMenu("menuFile", menu1);
	RightContext.addMenu("menuCategory", menu2);
	RightContext.initialize();

</script>
