<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/jquery/dist/jquery.min.js?v={SITE_VERSION}"></script>

<script>
    $(function() {
        $('#microsoft-teams').on('load', function () {
            let meetingUrl = $(this).contents().find('#meetingUrl').html();

            window.top.postMessage(JSON.stringify({data: {meetingUrl: meetingUrl} }), location.origin);
        });
    });
</script>

<iframe id='microsoft-teams' src="{TEAMS_URL}?instance=https://{DOMAIN}" style="width:100%;height:100%;border:0;"></iframe>
