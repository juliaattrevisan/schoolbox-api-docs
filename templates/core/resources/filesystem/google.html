<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
  <title>Google Drive Picker</title>
  <style type="text/css">
    div.picker-dialog {
      box-shadow: none;
      -o-box-shadow: none;
      -moz-box-shadow: none;
      -webkit-box-shadow: none;
      border: none;
      min-width: 566px;
      width: 100%;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
      display: block !important;
    }
    div.picker-dialog-content {
      min-height: 350px;
      width: 100% !important;
      height: 100% !important;
    }
    #content {
      text-align: center;
    }
    #auth-btn {
      padding: 8px 12px;
      background: #0066b0;
      color: #fff;
      position: relative;
      top: 0;
    }
    #auth-btn.hide {
      display: none;
    }
  </style>
  <script type="text/javascript" src="{CDN_PREFIX}/js/vendors/jquery/dist/jquery.min.js?v={SITE_VERSION}"></script>
  <script type="text/javascript" src="{CDN_PREFIX}/js/google/apiloader.js?v={SITE_VERSION}"></script>
  <script type="text/javascript" src="{CDN_PREFIX}/js/google/picker.js?v={SITE_VERSION}"></script>
  <script type="text/javascript">

      // get a fix on your IE9 origin
      if(typeof window.location.origin == 'undefined') {
          window.location.origin = window.location.protocol + '//' + window.location.hostname;
      }

      if (window.top && window.top.postMessage) {
          window.top.postMessage(JSON.stringify({text: 'Connecting to your Google Drive...'}), location.origin);
      }

      $.fn.setupGapi({
          clientId: '{CLIENT_ID}',
          modules: ['client:auth2', 'picker'],
          scope: '{SCOPES}',
          callback: function () {
              $('#content').googlePicker({
                  listener: false,
                  modalId: null,
                  views: [{VIEWS}],
                  features: [{FEATURES}],
                  authBtn: '#auth-btn',

                  onSelect: function (docs, token) {
                      window.top.postMessage(JSON.stringify({text: 'Collecting files from Google, please wait...'}), location.origin);
                      jQuery.ajax({
                          type: 'POST',
                          url: '/ajax/resource/filesystem/google',
                          data: {
                              docs: docs,
                              tokenType: token.token_type,
                              accessToken: token.access_token
                          },
                          success: function (data) {
                              window.top.postMessage(JSON.stringify({data: data}), location.origin);
                          },
                          error: function (data) {
                              window.top.postMessage(JSON.stringify({data: data}), location.origin);
                          }
                      });
                  },
                  onCancel: function () {
                      window.top.postMessage(JSON.stringify({data: []}), location.origin);
                  },
                  onLoaded: function (picker) {
                      picker.setVisible(true);
                  }
              });
          }
      });
  </script>
</head>
<body class="gframe">
<pre id="result"></pre>
<div id="content">
  <a href="#" role="button" id="auth-btn" class="hide">Authorize Google account</a>
</div>
<!-- The Google API Loader script. -->
</body>
</html>
