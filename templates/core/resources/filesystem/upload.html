<script type="text/javascript">

$(function () {

    var abUpload          = $('#ab-upload'),
        abUploadForm      = abUpload.find('form.dzone'),
        abUploadControls  = abUpload.siblings('div.ctrl'),
        abUploadAddBtn    = abUploadControls.find('[data-add]'),
        abUploadSubmitBtn = abUploadControls.find('[data-submit]'),
        abUploadCancelBtn = abUploadControls.find('[data-cancel]'),
        maxFiles          = {MAX_FILES};

        try {

            abUploadForm.dropzone({
            paramName: 'upload',
            parallelUploads: {MAX_FILES},
            dictDefaultMessage: 'Click or drag here to upload',
            dictFallbackText: 'Your browser does not support drag and drop. Please select a file to upload.',
            maxFiles: maxFiles,

            /* TODO this is an admin config
            */
            maxFilesize: 2048,

            autoProcessQueue: false,
            addRemoveLinks: false,
            previewTemplate: $('#ab-preview-template').html(),
            acceptedFiles: {ACCEPTED_FILES},
            timeout: 1800000,

            /**
             * Initialise this dropzone implementation
             */
            init: function () {
                var dz = this;

                /* Prepare a dropzone
                */
                abUpload.data('dropzone', this);

                /* Add Files by triggering whatever .dz-clickable did
                 */
                abUploadAddBtn.on('click', function(event) {
                    event.preventDefault();

                    $('.dz-clickable').trigger('click');
                });

                /* Clear the upload queue if you jump ship via the Cancel button
                */
                abUploadCancelBtn.on('click', function (e) {
                    dz.removeAllFiles(true);
                });

                /* Show a little preview in the modal's staging area after you select it from the browser
                */
                this.on('addedfile', function (file) {
                    var img = $(file.previewElement).find('img[data-dz-thumbnail]');
                    img.attr('src', '{CDN_PREFIX}/images/mime'.concat('/', file.type.replaceAll('/','-')).concat('.','svg'));
                    //when the image errors out, if the mimetype does not exist (exactly), then don't error just show the default image
                    img.attr('onerror', "this.onerror=null;this.src='{CDN_PREFIX}/images/mime/none.svg';");
                });

                /* Remove a file from the staging area
                */
                this.on('removedfile', function (file) {
                    checkState.call(this);
                });

                /* Just update quantity of files you're allowed to have if
                * you selected more than what was allowed in maxFiles
                */
                this.on('maxfilesreached', function (file) {
                    checkState.call(this);
                });

                /* When you click the Upload button to begin the transmission:
                * hide but don't detach the remove button
                */
                this.on('sending', function (file, xhr, formData) {
                    $(file.previewElement).find('a[data-dz-remove]').addClass('hide')
                });

                /* When a file was successfully uploaded
                * Parse the json response and get the file hash
                *
                * TODO Relies on an exception being thrown wth
                * TODO sometimes xhr is already a javascript literal and you can't re-parse it
                */
                this.on('success', function (file, xhr) {
                    var data;

                    try {
                        data = JSON.parse(xhr);
                    } catch (err) {
                        data = xhr;
                    }

                    file.hash = data.hash;
                    file.imageUrl = data.meta.file._links.icon;

                });

                /* When you finish processing the queue of files you chose to upload
                */
                this.on('queuecomplete', onQueueComplete.bind(this));

                this.on('error', function (file, msg, xhr) {
                    if (xhr) {
                        try {
                            msg = JSON.parse(msg);
                        } catch (err) {
                            // noop
                        }

                        //to pass through into #jquery.resourceAttach.js to notify of file failure
                        file.errorMessage = msg;

                        if (msg.hash) {
                            file.hash = msg.hash;
                            $(file.previewElement).find('span[data-dz-errormessage]').html(msg.hash.split(':')[1]);
                        }

                        // Don't need to show the progress bar once it's broken
                        $(file.previewElement).find('.dz-progress').hide();

                    }
                    checkState.call(this);
                });

                this.on('complete', function (file) {
                    // Restore the remove button
                    $(file.previewElement).find('a[data-dz-remove]').removeClass('hide');
                });
            },

            /**
             * See https://www.dropzonejs.com/#config-accept
             *
             * @param file
             * @param done
             */
            accept: function (file, done) {
                done();
                checkState.call(this);
            }
        });

    } catch (error) {
        //noop
    }


    /**
     * Decide how many files were being prepared for upload and inject
     * the count into the Upload button's label text. This also reenables
     * the button if it was previously disabled
     */
    function checkState() {
        let queueLength   = this.getQueuedFiles().length,
            successFiles  = this.getFilesWithStatus(Dropzone.SUCCESS),
            uploadLength  = queueLength + successFiles.length,
            uploadEnabled = uploadLength > 0;

        // Is upload feasible right now?
        // * At least one queued file? Yes
        // * Otherwise? No
        if (!uploadEnabled) {
            abUploadSubmitBtn
                .html('Upload')
                .attr('disabled', 'disabled')
                .off('click');
            abUploadCancelBtn.removeAttr('disabled');
        } else {
            let dz = this;

            abUploadSubmitBtn
                .html('Upload (' + uploadLength + ')')
                .removeAttr('disabled')
                .one('click', function (e) {
                    e.preventDefault();

                    abUploadSubmitBtn
                        .data('uploading', dz.getQueuedFiles())
                        .html('Uploading')
                        .attr('disabled', 'disabled');
                    abUploadCancelBtn.attr('disabled', 'disabled');

                    // Is the queue complete anyway?
                    // Trigger the message that queueComplete would send
                    if (queueLength === 0) {
                        onQueueComplete.call(dz);
                    } else {
                        dz.processQueue();
                    }
                });
        }

        /* Remove the height:100% css attribute
         *
         * This lets you scroll to see the rest of your file uploads
         * if you added more than your modal permits
         *
         * Otherwise you have to zoom out with your browser to see it
         */
        abUpload.css({
            'height': 'auto'
        });
    }


    /**
     * When the queue is completely processed, call this method.
     */
    function onQueueComplete() {

        let successFiles = this.getFilesWithStatus(Dropzone.SUCCESS),
            errorFiles   = this.getFilesWithStatus(Dropzone.ERROR),
            data         = [];

        // Does the button say we're uploading? return
        if (!abUploadSubmitBtn.data('uploading')) {
            return;
        }

        // Any queued files? return
        if (this.getQueuedFiles().length) {
            return;
        }

        // Cancel button is no longer disabled, even if there's error files
        abUploadCancelBtn.removeAttr('disabled');

        successFiles.forEach(function (successFile) {
            if (successFile.hash) {
                data.push({
                    status: successFile.status,
                    file: successFile,
                    title: successFile.name,
                    mimeType: successFile.type,
                    filesize: successFile.size,
                    hash: successFile.hash
                });
            }
        });

        //when returning from the modal, display those failed files that have either timed out or are beyond the max file size
        //these are the only errors I can see that return an errorMessage
        //other issues like 'max files reached' or 'incorrect file type' are already displayed in the modal,
        //so no need to return them from the modal when it's alredy clear they won't be added
        errorFiles.forEach(function (errorFile) {
            if (errorFile.errorMessage) {
                let errorMessage;
                if (typeof errorFile.errorMessage === 'string') { //timed out message
                    errorMessage = errorFile.errorMessage;
                } else { //assumed it's an object, with a max file size note
                    errorMessage = errorFile.errorMessage.hash.replace('exception:', ''); //already has file.jpg failed: (so no need to say exception:)
                }
                data.push({
                    status: errorFile.status,
                    name: errorFile.name,
                    errorMessage: errorMessage
                });
            }
        });

        /* Send a list of file data to message receiver in modal.js
            */
        setTimeout(function () {
            window.top.postMessage(JSON.stringify({ data: data }), location.origin);
        }, 1000);
    }
});
</script>

<div id="ab-upload" class="ab-pane">
  <form class="dzone" action="/storage/asyncUpload.php">
    <div class="dz-default dz-message">Click or drag here to upload</div>
  </form>
</div>
<div class="ctrl component-action">
    <section>
        <a role="button" data-add class="button" href="#">Add Files</a>
        <a role="button" data-submit class="button" disabled="disabled" href="#">Upload</a>
        <a role="button" data-cancel class="button cancel" href="#">Cancel</a>
    </section>
</div>
<div id="ab-preview-template" class="hide">
    <div class="dz-preview dz-file-preview">
        <div class="dz-image"><img data-dz-thumbnail /></div>
        <div class="dz-details">
            <div class="dz-size"><span data-dz-size></span></div>
            <div class="dz-filename"><span data-dz-name></span></div>
            <div class="dz-error-message"><span data-dz-errormessage></span></div>

            <div class="dz-progress">
                <span class="dz-upload" data-dz-uploadprogress></span>
            </div>

            <div class="dz-success-mark">
                <span class="icon-approve"></span>
            </div>
            <div class="dz-error-mark">
                <span class="icon-close"></span>
            </div>
        </div>
        <div class="dz-close">
            <a class="button dz-remove no-margin" data-dz-remove>&#215;</a>
        </div>
    </div>
</div>
