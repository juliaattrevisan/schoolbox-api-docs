<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
  <title>Google Drive Picker</title>
  <style type="text/css">
    div.picker-dialog {
      box-shadow: none;
      -o-box-shadow: none;
      -moz-box-shadow: none;
      -webkit-box-shadow: none;
      border: none;
      min-width: 566px;
      width: 100%;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
    }
    div.picker-dialog-content {
      min-height: 350px;
      width: 100% !important;
      height: 100% !important;
    }
    #content {
      text-align: center;
    }
    #auth-btn {
      padding: 8px 12px;
      background: #0066b0;
      color: #fff;
      display: none;
      position: relative;
      top: 295px;
    }
    #auth-btn.need-auth {
      display: inline;
    }
  </style>
  <script type="text/javascript" src="/javascript/components/jquery/jquery.min.js"></script>
  <script type="text/javascript" src="/javascript/shared/google/apiloader.js"></script>
  <script type="text/javascript">

      // get a fix on your IE9 origin
      if(typeof window.location.origin == 'undefined') {
          window.location.origin = window.location.protocol + '//' + window.location.hostname;
      }

      if (window.top && window.top.postMessage) {
          window.top.postMessage(JSON.stringify({text: 'Connecting to your Google Drive...'}), location.origin);
      }

      loadGoogleApi(['auth', 'picker'], function () {
          jQuery
          .ajax({
              url: '/javascript/resource/jquery.gpick.js',
              dataType: 'script',
              cache: true
          })
          .then(function () {
              $('#content').gpick({
                  developerKey: '{API_KEY}',
                  clientId: '{CLIENT_ID}',
                  scopes: ['{SCOPES}'],
                  views: [{VIEWS}],
                  features: [{FEATURES}],
                  title: null,
                  authBtn: '#auth-btn',
                  authNeededClass: 'need-auth',

                  onSelect: function (docs, token) {
                      window.top.postMessage(JSON.stringify({text: 'Collecting files from Google, please wait...'}), location.origin);
                      jQuery.ajax({
                          type: 'POST',
                          url: '/ajax/resource/external/google',
                          headers: {
                            'Authorization': token.token_type + ' ' + token.access_token
                          },
                          data: {docs: docs},
                          success: function(data) {
                              window.top.postMessage(JSON.stringify({data: data}), location.origin);
                          }
                      });
                  },
                  onCancel: function () {
                      window.top.postMessage(JSON.stringify({data: []}), location.origin);
                  },
                  onLoaded: function (picker) {
                      picker.setVisible(true);
                  }
              });
          });
      });
  </script>
</head>
<body class="gframe">
<pre id="result"></pre>
<div id="content">
  <a href="#" role="button" id="auth-btn">Authorize Google account</a>
</div>
<!-- The Google API Loader script. -->
</body>
</html>
