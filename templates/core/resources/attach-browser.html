<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
</head>
<body>
    <div class="attachment-browser-container">
        <div class="attachment-browser-filesystems">
            <ul id="attachment-browser-filesystems" class="side-nav" data-tab>
                <!-- BEGIN source -->
                <li class="tab-title" data-source="{SRC_SLUG}" data-url="{SRC_URL}" data-method="{SRC_METHOD}">
                    <a class="icon-{SRC_ICON}" href="#{SRC_SLUG}-panel">{SRC_LABEL}</a>
                </li>
                <!-- END source -->
            </ul>
        </div>

        <div id="attachment-browser-panel-container" class="attachment-browser-panel-container tabs-content">
            <!-- BEGIN source_panel -->
            <div id="{SRC_SLUG}-panel" class="content">
                <div class="loader"></div>
            </div>
            <!-- END source_panel -->
        </div>
    </div>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</body>
</html>
