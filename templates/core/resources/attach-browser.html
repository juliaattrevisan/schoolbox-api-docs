<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <style type="text/css">
    .browsing .explorer[data-text]:before {
      content: attr(data-text);
      display: block;
      position: absolute;
      bottom: 53%;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: -1;
    }
    #attachment-browser .explorer.preload {
      background-position: 50% 50%;
      background-attachment: initial;
    }
  </style>
  <script type="text/javascript">
    window.gpick = {
      picked: function (docs) {
        var i;
        for(i = 0; i < docs.length; ++i) {
          var doc = docs[i];
          fiil();

        }
      },
      cancel: function () { /* noop */ },
      needAuth: function () { /* noop */ },
      loaded: function () {
        $('#attachment-browser')
            .find('li[data-source="external/google"]')
            .find('div.explorer')
            .removeClass('preload');
      }
    };

    $(function() {
      var ab = $('#attachment-browser');

      $('li[data-source]').on('click', 'a.src-select', function (e) {
        e.preventDefault();
        var li  = $(e.delegateTarget),
            src = li.attr('data-source');

        li.addClass('browsing').siblings().removeClass('browsing');

        if (!ab.data(src)) {

          // load this tab
          ab.data(src, {loaded: true});

          var tab = li.children('.explorer'),
              url = tab.attr('data-url'),
              mth = tab.attr('data-method');

          if (mth == 'inline') {
            tab.load(url, null, function() {
              tab.removeClass('preload');
            });
          }
          else if (mth == 'iframe') {
            tab.html($('<iframe/>').attr('src', url));
          }
        }
      });

      $('li[data-source="{DEFAULT_VIEW}"] a').trigger('click');
    });


  </script>
</head>
<body>
<ul id="attachment-browser">
  <!-- BEGIN source -->
  <li data-source="{SRC_SLUG}">
    <h3>
      <a class="src-select" href="#{SRC_SLUG}">{SRC_LABEL}</a>
    </h3>
    <div class="explorer preload" data-url="{SRC_URL}" data-method="{SRC_METHOD}"></div>
  </li>
  <!-- END source -->
</ul>
</body>
</html>
