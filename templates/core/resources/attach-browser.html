<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <script type="text/javascript">
    window.gpick = {
      picked: function (docs) {
        var i;
        for(i = 0; i < docs.length; ++i) {
          var doc = docs[i];
          fiil();

        }
      },
      cancel: function () { /* noop */ },
      needAuth: function () { /* noop */ },
      loaded: function () {
        $('#attachment-browser')
            .find('li[data-source="external-google"]')
            .find('div.explorer')
            .removeClass('preload');
      }
    };

    $(function() {
      var ab = $('#attachment-browser');

      ab.on('toggled', function (e, panel) {

        panel = $(panel);

        var src = panel.closest('[data-source]').attr('data-source');

        if (!ab.data(src)) {

          // load this tab
          ab.data(src, {loaded: true});

          var url = panel.attr('data-url'),
              mth = panel.attr('data-method');

          if (mth == 'inline') {
            panel.load(url, null, function() {
              panel.removeClass('preload');
            });
          }
          else if (mth == 'iframe') {
            panel.html($('<iframe/>').attr('src', url));
          }
        }
      });

      $('dd[data-source="{DEFAULT_VIEW}"] a').trigger('click');
    });

    $(document).foundation();

    $('#attachment-browser').on('click', '[data-toggle]', function (e) {

      var oldPanel = $('div.active'),
          newPanel = $(this).closest('[data-source]').find('.content');

      // hide the current panel
      oldPanel.slideUp();

      // open the new one
      if (!oldPanel.is(newPanel)) {
        newPanel.slideDown();
      }

    });

  </script>
</head>
<body>
<dl id="attachment-browser" class="accordion" data-accordion>
  <!-- BEGIN source -->
  <dd class="accordion-navigation" data-source="{SRC_SLUG}">
    <a data-toggle class="icon-{SRC_ICON}" href="#{SRC_SLUG}">{SRC_LABEL}</a>
    <div id="{SRC_SLUG}" class="preload content" data-url="{SRC_URL}" data-method="{SRC_METHOD}"></div>
  </dd>
  <!-- END source -->
</dl>
</body>
</html>
