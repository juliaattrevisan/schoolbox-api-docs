<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <script type="text/javascript">
        $(document).foundation();

        $(function () {
            let filesystems = $('#attachment-browser-filesystems');
            const MAX_IFRAME_HEIGHT = 550;

            filesystems.find('[data-source]').on('click', function (event) {

                let source = $(this).attr('data-source');
                let panel = $('#' + source + '-panel');

                let url = $(this).attr('data-url');
                let method = $(this).attr('data-method');

                /* Use the $method var to decide whether this is inline content
                * such as all our internal file upload dropzone options, recorder
                * my files, resources, etc.
                *
                * or whether it should be loaded into an iframe, such as with third
                * parties like ms teams, goggle drive, office 365 etc.
                *
                * Inline content starts with a preloader class which should be removed
                * once content has loaded
                */

                if (method === 'inline') {
                    fetch(url).then((response) => {
                        response.text().then((text) => {
                            panel.html(text);
                        });
                    });
                } else if (method === 'iframe') {
                    panel.html($('<iframe></iframe>').attr('src', url).height(MAX_IFRAME_HEIGHT));
                }

            });

            /* Activate default tab
             */
            $('#attachment-browser-filesystems a').first().trigger('click');

        });
    </script>
</head>
<body>
    <div class="attachment-browser-container">
        <div class="attachment-browser-filesystems">
            <ul id="attachment-browser-filesystems" class="tabs vertical" data-tab>
                <!-- BEGIN source -->
                <li class="tab-title" data-source="{SRC_SLUG}" data-url="{SRC_URL}" data-method="{SRC_METHOD}">
                    <a href="#{SRC_SLUG}-panel" data-attach-option>
                        <sbx-icon name="{SRC_ICON}"></sbx-icon>
                        <span>{SRC_LABEL}</span>
                    </a>
                </li>
                <!-- END source -->
            </ul>
        </div>
        <div id="attachment-browser-panel-container" class="attachment-browser-panel-container tabs-content">
            <!-- BEGIN source_panel -->
            <div id="{SRC_SLUG}-panel" class="content" data-test="{SRC_SLUG}-panel">
                <div class="loader"></div>
            </div>
            <!-- END source_panel -->
        </div>
    </div>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</body>
</html>
