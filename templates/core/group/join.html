<div class="row">
    <div class="list-item">
        <h1>Join Groups</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/group/joinForm.php" method="post">
            <section>
                <fieldset class="content">
                    <legend>
                        Free Access
                        <span data-tooltip
                              class="has-tip tip-top hint"
                              title="These groups are free to join.
                                     Once you have selected the group you will have access to the content available in the group.">?</span>
                    </legend>
                    <div class="small-12 columns">
                        <fieldset class="checklist">
                            <!-- BEGIN free_list -->
                            <input name="group[{GROUP_ID}]" value="0" type="hidden" />
                            <input id="freeList-{GROUP_ID}" name="group[{GROUP_ID}]" value="1" type="checkbox" {GROUP_CHECKED} />
                            <label for="freeList-{GROUP_ID}">{GROUP_NAME}</label>
                            <!-- END free_list -->
                        </fieldset>
                    </div>
                </fieldset>
            </section>

            <section>
                <fieldset class="content">
                    <legend>
                        Moderated Access
                        <span data-tooltip
                              class="has-tip tip-top hint"
                              title="These groups are moderated.
                              Once you have selected the group you must wait for the group admin to authorise your application.">?</span>
                    </legend>
                    <div class="small-12 columns">
                        <fieldset class="checklist">
                            <!-- BEGIN moderated_list -->
                            <input name="group[{GROUP_ID}]" value="0" type="hidden" />
                            <input id="moderatedList-{GROUP_ID}" name="group[{GROUP_ID}]" value="1" type="checkbox" {GROUP_CHECKED} />
                            <label for="moderatedList-{GROUP_ID}">
                                {GROUP_NAME}
                                <!-- BEGIN waiting -->
                                <em>(Waiting on authorisation)</em>
                                <!-- END waiting -->
                            </label>
                            <!-- END moderated_list -->
                        </fieldset>
                    </div>
                </fieldset>
            </section>

            <div class="row">
                <div class="small-12 column">
                    <input type="submit" value="Join Selected Groups" />
                </div>
            </div>
        </form>
    </div>
</div>
