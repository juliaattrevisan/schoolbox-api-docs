<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript">
$(document).ready(function() {
    /**
     * Add to this group from people in an existing system group
     */
    $('#addUsersBySystemGroup').selectizeSelector({
        ajax: {
            url:      '/ajax/addUserByGroup.php',
            type:     'GET',
            data:     {type: 'system'},
            dataType: 'json'
        }
    })
    .on('selectize.item_add', function(event, value) {
        $('#systemGroupID').val(value)
    })
    .on('selectize.item_remove', function() {
        $('#systemGroupID').val('')
    })

    /**
     * Add to this group from people in an existing system group
     */
    $('#addUsersByIndividualGroup').selectizeSelector({
        ajax: {
            url:      '/ajax/addUserByGroup.php',
            type:     'GET',
            data:     {type: 'individual'},
            dataType: 'json'
        }
    })
    .on('selectize.item_add', function(event, value) {
        $('#individualGroupID').val(value)
    })
    .on('selectize.item_remove', function() {
        $('#individualGroupID').val('')
    })
});
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="list-item">
        <h1>Add Bulk Members</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <ul class="tabs" data-tab>
            <li class="tab-title active"><a href="#userGroups">From Group</a></li>
            <li class="tab-title"><a href="#userRoles">From Role</a></li>
            <li class="tab-title"><a href="#userList">From List</a></li>
        </ul>
        <div class="tabs-content">
            <section class="content active" id="userGroups">
                <fieldset class="content">
                    <legend>
                        From Group
                        <span data-tooltip class="has-tip tip-top hint" title="Add all users that belong to another group.">?</span>
                    </legend>
                    <form action="/group/addUserByGroup.php?type=individual&destinationID={CATEGORY_ID}" method="post">
                        <input id="addUsersByIndividualGroup" type="text" size="30" placeholder="Search User Groups" />
                        <input type="hidden" name="individualGroupID" id="individualGroupID" />
                    </form>
                </fieldset>
                <input type="submit" value="Add Individual Group" class="submit-btn-plain" />
            </section>

            <section class="content" id="userRoles">
                <fieldset class="content">
                    <legend>
                        From Role
                        <span data-tooltip class="has-tip tip-top hint" title="Add all users of a particular role in the system.">?</span>
                    </legend>
                    <form action="/group/addUserByGroup.php?type=system&destinationID={CATEGORY_ID}" class="clearfix" method="post">
                        <input id="addUsersBySystemGroup" type="text" size="30" placeholder="Search User Roles" />
                        <input type="hidden" name="systemGroupID" id="systemGroupID" />
                    </form>
                </fieldset>
                <input type="submit" value="Add System Role" class="submit-btn-plain" />
            </section>

            <section class="content" id="userList">
                <fieldset class="content">
                    <legend>
                        User List
                        <span data-tooltip class="has-tip tip-top hint" title="Add a list of users (either external user IDs or Schoolbox usernames).">?</span>
                    </legend>
                    <form action="/group/modifyForm.php" method="post" id="form" class="clearfix" >
                        <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
                        <textarea name="bulkAdd" cols="30" rows="20"></textarea>
                    </form>
                </fieldset>
                <input type="submit" name="Submit" value="Submit" class="submit-btn-plain" />
            </section>
        </div>
    </div>
</div>
