            targetElements: $('textarea[name=green]')
        });

        /* Spawn a pseudo plugin
         * http://stackoverflow.com/questions/1957156/how-to-add-a-custom-button-to-the-toolbar-that-calls-a-javascript-function

         */
        $.fn.alaressTiny({
            targetElements: $('#mort'),
            start: function(element) {

                /* Add special unique buttons
                 */
                CKEDITOR.instances['mort'].addCommand("exampleCommand", { // create named command
                    exec: function(editorInstance) {
                        alert(editorInstance.getData());
                    }
                });

                CKEDITOR.instances['mort'].ui.addButton('SomeGenericIdentifier', { // add new button and bind our command
                    label: "Example Label",
                    command: 'exampleCommand',
                    toolbar: 'schoolbox',
