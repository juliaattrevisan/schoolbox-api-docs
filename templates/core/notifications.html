<div class="row notification-list">
    <div class="small-12 island">
        <h1>Notifications</h1>
        <!-- BEGIN days -->
        <!-- BEGIN day -->
        <h2 class="subheader">{DAY}</h2>
        <section>
            <ul class="information-list">
            <!-- BEGIN events -->
                <!-- BEGIN event -->
                <li class="row {EVENT_CLASS}">
                    <div class="card small-12 wrap-down">
                        <a href="{EVENT_HREF}">
                            <img src="{EVENT_ICON}" alt="" width="48" height="48" />
                        </a>

                        <p class="body" data-test="notification-list-notification-body">
                            {EVENT_BODY}
                            <!-- BEGIN abstract -->: "{EVENT_ABSTRACT}"<!-- END abstract -->
                        </p>

                        <p class="meta">
                            <time title="{EVENT_LONGTIME}">{EVENT_TIME}</time>
                        </p>
                    </div>
                </li>
                <!-- END event -->
            <!-- END events -->
            </ul>
        </section>
        <!-- END day -->
        <!-- END days -->

        <!-- BEGIN no_messages -->
        <div class="alert-box">You have no notifications.</div>
        <!-- END no_messages -->
    </div>
</div>
