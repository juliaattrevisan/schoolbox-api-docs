<h2>Edit Awards</h2>
<form action="/eportfolio/objective/award/modifyForm.php" method="post" id="modifyForm" class="standardForm">

	<input type="hidden" name="objectiveAwardID" value="{OBJECTIVE_AWARD_ID}" />
	<input type="hidden" name="componentLocationID" value="{COMPONENT_LOCATION_ID}" />

</form>
