
<link rel="stylesheet" href="/css/jquery.slimbox.css" type="text/css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.slimbox.js"></script>
<div class="box" id="component{COMPONENT_ID}">
  <h2>Image Gallery</h2>
    <!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
	<a class="close-delete" href="#"><span>X</span></a>
  <div class="editPanel settings hide">
    <form action="/eportfolio/configForm.php" method="get">
      <input type="hidden" name="uid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Image Rows: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
  	<div class="editPanel delete-it hide">
		<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
		<div class="float-fix"></div>
	</div>
<!-- END config -->
  <div class="text">
  	<!-- BEGIN thumb_row -->
      <!-- BEGIN thumb_cell -->
      {THUMBNAIL}
      <!-- END thumb_cell -->
    <!-- END thumb_row -->
    <div class="float-fix"></div>
  </div>
    <p class="interact">
        <a href="/cms/eportfolioImageGallery/{ID}" class="btn"><span></span>Full Gallery</a>
    </p>
</div>
