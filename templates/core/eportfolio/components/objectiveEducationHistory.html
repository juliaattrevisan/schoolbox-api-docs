<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
	<h2>Education History</h2>

	<script type='text/javascript'>
	$j(function() {
		$j('#component{COMPONENT_HOMEPAGE_ID}').find('a.delete-accept').mouseup(function() {
			$j.post('/eportfolio/objective/educationhistory/modifyForm.php', {'delete':'{COMPONENT_HOMEPAGE_ID}'});
		});
	});
	</script>

	<!-- BEGIN config -->
	<a class="close-delete" href="#"><span>&times;</span></a>

	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="uid" value="{ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->

	<div class="wysiwyg clearfix">
	{OBJECTIVE_EDUCATIONHISTORY}
	</div>

	<!-- BEGIN modify_text -->
	<p class="interact">
		<a href="/eportfolio/objective/educationhistory/modify/{ID}/{COMPONENT_HOMEPAGE_ID}" class="btn modify"><span></span>Modify</a>
	</p>
	<!-- END modify_text -->
</div>
