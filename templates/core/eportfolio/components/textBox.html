<div class="box" id="component{COMPONENT_ID}">
	<h2>{TEXTBOX_HEADING}</h2>
	<!-- BEGIN config --> 
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
	<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/eportfolio/configForm.php" method="get">
			<input type="hidden" name="uid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<label for="size">Text Box: </label>
			<select name="textBoxID">
				<!-- BEGIN select -->
				<option value="{COMPONENT_CONFIG_SELECT_VALUE}"{COMPONENT_CONFIG_SELECT_SELECTED}>{COMPONENT_CONFIG_SELECT_NAME}</option>
				<!-- END select -->
			</select>
			<input type="submit" value="Update" />
		</form>
	</div>
	<div class="editPanel delete-it hide">
		<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
		<div class="float-fix"></div>
	</div>
	<!-- END config --> 
	<!-- BEGIN text_editable --> 
	<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script> 
	<script type="text/javascript">
	  tinyMCE.init({
		mode : "exact",
		elements: "textBoxBody",
		theme : "advanced",
		plugins : "table,inlinepopups,assetmanager,advimage,media,paste",
		content_css : "/css/{SITE_LOCATION}/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,outdent,indent,separator,sub,sup,separator,link,unlink,image,media,charmap,hr,separator,undo,redo",
		theme_advanced_buttons2 : "forecolor,tablecontrols,separator,pastetext,pasteword,selectall,separator,removeformat,cleanup,code",
		theme_advanced_buttons3 : "",
		extended_valid_elements : "a[name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_browser_category_id : {ID},
		convert_urls : false
	});
  </script>
	<div class="text">
		<form action="/eportfolio/textBoxForm.php" method="post" id="textBoxForm" class="standardForm">
			<p>
				<input type="text"  style="width: 99%;" name="textBoxHeading" value="{TEXTBOX_HEADING}" />
			</p>
			<p>
				<textarea rows="20" style="width: 100%;" name="textBoxBody" id="textBoxBody">{TEXTBOX_BODY}</textarea>
			</p>
			<input type="hidden" name="userID" value="{ID}" />
			<input type="hidden" name="textBoxID" value="{TEXTBOX_ID}" />
		</form>
	</div>
	<p class="interact"><a href="#" class="btn save" onclick="$j('#textBoxForm').submit(); return false;"><span></span>Saveawfe Document</a></p>
	<!-- END text_editable --> 
	
	<!-- BEGIN text_locked -->
	<div class="text"> {TEXTBOX_BODY}
		<div class="float-fix"></div>
	</div>
	
	<!-- BEGIN modify_text -->
	<p class="interact"><a href="/eportfolio/{ID}/textBoxCreate" class="btn create"><span></span>Create</a> <a href="/eportfolio/{ID}/textBoxModify" class="btn modify"><span></span>Modify</a> <a class="btn delete" href="/eportfolio/textBoxForm.php?delete={TEXTBOX_ID}" onclick="return confirm('Are you sure you want to delete this text box?');"><span></span>Delete</a></p>
	<!-- END modify_text --> 
	
	<!-- END text_locked --> 
</div>
