<div class="box" id="component{COMPONENT_ID}">
	<h2>Files</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
	<a class="close-delete" href="#"><span>X</span></a>

	<div class="editPanel settings hide">
		<form action="/eportfolio/configForm.php" method="get">
			<input type="hidden" name="uid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
			<input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
			<!-- BEGIN filter -->
			<label for="{COMPONENT_CONFIG_FILTER_VALUE}"><input type="checkbox" name="filter[]" value="{COMPONENT_CONFIG_FILTER_VALUE}" {COMPONENT_CONFIG_FILTER_SELECTED} />{COMPONENT_CONFIG_FILTER_NAME}</label>
			<!-- END filter -->

			<label for="sort">Sort: </label>

			<select id='sort'name="sort">
				<!-- BEGIN sort -->
				<option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
				<!-- END sort -->
			</select>

			<select name="sortdir">
				<!-- BEGIN sortdir -->
				<option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
				<!-- END sortdir -->
			</select>

			<label for="size">Item Limit: </label>

			<select id='size' name="size">
				<!-- BEGIN size -->
				<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
				<!-- END size -->
			</select>
			<input type="submit" value="Update"  class="submit-btn update" />
		</form>
	</div>
  	<div class="editPanel delete-it hide clearfix">
		<p>Are you sure you want to remove component?</p>
		<form action="#" method="post">
			<input type="hidden" name="uid" value="{ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
	</div>
	<!-- END config -->

	<div class="listing clearfix">
		<ul>
			<!-- BEGIN files -->
			<li class="{ON_OFF} clearfix">
				<!-- BEGIN file_url -->
				<h4><a class="icons {HIDDEN} {FILE_MIME_IMAGE}" href="{FILE_URL}" target="{FILE_TARGET}" >{FILE_DESCRIPTION}</a></h4>
				<!-- END file_url -->

				<!-- BEGIN file_no_url -->
				{FILE_DESCRIPTION}
				<!-- END file_no_url -->

				<div class="small-right">
					<p class="interact">
						<!-- BEGIN unpublish -->
						<a href="/cms/myFileForm.php?unpublish={FILE_ID}" onclick="return confirm('Do you want to unpublish this file?');">Unpublish</a>
						<!-- END unpublish -->
					</p>
					<p class="hide-on-small">{FILE_COMMENT}</p>
					<p class="small hide-on-small">Published on {FILE_PUBLISHED_DATE}</p>
				</div>
			</li>
			<!-- END files -->
		</ul>
		<p class="interact">
			<a href="/cms/portfolio" class="btn add"><span></span>Add file</a>
		</p>
	</div>
</div>
