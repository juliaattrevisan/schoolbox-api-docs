<div class="box imageComp" id="component{COMPONENT_ID}">
  <h2>Feature Image</h2>
  <!-- BEGIN config -->
    <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
    <a class="close-delete" href="#"><span>X</span></a>
    <div class="editPanel hide">
      <form action="/eportfolio/configForm.php" method="get">
        <input type="hidden" name="uid" value="{ID}" />
        <input type="hidden" name="type" value="config" />
        <input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
        <label for="url">URL:</label>
        <input type="text" name="url" value="{COMPONENT_CONFIG_URL}" size="25"/>
        <label for="image">Image: </label>
        <select name="image">
          <!-- BEGIN image -->
          <option value="{COMPONENT_CONFIG_IMAGE}"{COMPONENT_CONFIG_IMAGE_SELECTED}>{COMPONENT_CONFIG_IMAGE}</option>
          <!-- END image -->
        </select>
        <label for="url">Pixels:</label>
      	<input type="text" name="pixel" value="{COMPONENT_CONFIG_PIXEL}" size="4"/>
        <input type="submit" value="Update" />
      </form>
    </div>
    <div class="editPanel delete-it hide">
		<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
			<input type="hidden" name="uid" value="{ID}" />
			<input type="hidden" name="component" value="{COMPONENT_ID}" />
			<input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a> <a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
		<div class="float-fix"></div>
	</div>
  <!-- END config -->
  <div class="text feat-image">
  <!-- BEGIN previewimage -->
    {CONTENT_URL_START}<img src="{PREVIEW_IMAGE_URL}" alt="{PREVIEW_IMAGE_DESC}" />{CONTENT_URL_END}
  <!-- END previewimage -->
  </div>
</div>
