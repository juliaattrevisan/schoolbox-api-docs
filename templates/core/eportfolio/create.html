<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/shared/selectize/jquery.selectize-selector.js"></script>
<script type='text/javascript'>
    $(function() {
        $('#addIndividualPermission').selectizeSelector({
            multiple: true,
            ajax: {
                url:      '/eportfolio/search.php',
                type:     'GET',
                data:     {groupID: '{STUDENT_GROUP_IDS}'},
                dataType: 'json'
            }
        });

        $('#folderForm').alaressValidate({
            rules: {
                'page_title': {requiredNotBlank: true},
            },
            messages: {
                'page_title': {required: 'You must enter a page name before you can proceed.'},
            }
        });


    });
</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 columns">
        <h1>Create new ePortfolio page</h1>

        <ul class='sub-nav'>
            <li><a href='/eportfolio/{EPORTFOLIO_PAGE_USER_ID}/profile'>Home</a></li>
            <!-- BEGIN showcase_page -->
            <li><a href='/eportfolio/{EPORTFOLIO_PAGE_USER_ID}/showcase'>Showcased Work</a></li>
            <!-- END showcase_page -->
            <!-- BEGIN eportfolio_page -->
            <li><a href='/eportfolio/{EPORTFOLIO_PAGE_USER_ID}/{EPORTFOLIO_PAGE_ID}'>{EPORTFOLIO_PAGE_NAME}</a></li>
            <!-- END eportfolio_page -->
            <!-- BEGIN can_add_page -->
            <li class="active"><a href='/eportfolio/{EPORTFOLIO_PAGE_USER_ID}/create' class="icon-add">Add page</a></li>
            <!-- END can_add_page -->
        </ul>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/eportfolio/configForm.php" method="post" id="folderForm" class="top">
            <input type='hidden' name='userId' value='{EPORTFOLIO_PAGE_USER_ID}' />
            <input type="hidden" name="parent_permission" value="0" />

            <h2 class="subheader">Add Page</h2>
            <section>
                <fieldset class="content">
                    <div class="small-12 large-6 columns">
                        <label class="required" for="page_title">
                            Page Name
                        </label>
                        <input type="text" id="page_title" class="required" name="page_title" maxlength="250" size="40" value='' required />
                    </div>
                    <div class="small-12 large-6 columns">
                        <label>
                            ePortfolio Template
                            <select name="page_template">
                                <!-- BEGIN page_template_list -->
                                <option value="{PAGE_TEMPLATE_ID}">{PAGE_TEMPLATE_NAME}</option>
                                <!-- END page_template_list -->
                            </select>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <div class="small-12 large-4 columns">
                        <label>
                            Group Permissions
                            <span class="hint has-tip tip-top" data-tooltip title="Allow predefined groups to view your ePortfolio page.">?</span>
                        </label>

                        <!-- BEGIN has_group_permissions -->
                        <!-- BEGIN group_permission -->
                        <div>
                            <input type="checkbox" id="group-permission-{GROUP_PERMISSION_GROUP_ID}" name="group_permission[]" value="{GROUP_PERMISSION_GROUP_ID}" />
                            <label for="group-permission-{GROUP_PERMISSION_GROUP_ID}" class="checkbox-label">{GROUP_PERMISSION_NAME}</label>
                        </div>
                        <!-- END group_permission -->
                        <!-- END has_group_permissions -->
                    </div>
                    <div class="small-12 large-4 columns">
                        <label>
                            Student Permissions
                            <span class="hint has-tip tip-top" data-tooltip title="Allow certain students to view your ePortfolio page.">?</span>

                            <select id='addIndividualPermission' name="individual_permission[]" multiple  placeholder="Search Students"></select>
                        </label>
                    </div>
                    <div class="small-12 large-4 columns">
                        <label>
                            Allow Parents
                            <span class="hint has-tip tip-top" data-tooltip title="Allow your parents to view your ePortfolio page.">?</span>
                        </label>
                        <div class="switch">
                            <input type="checkbox" id='parent-permission' name="parent_permission" value="1" />
                            <label for='parent-permission'>
                                <span>On</span>
                                <span>Off</span>
                            </label>
                        </div>
                    </div>
                </fieldset>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Create Page" />
                </div>
            </div>
        </form>
    </div>
</div>
