<!-- BEGIN custom_head -->
<link rel="alternate" type="application/rss+xml" title="RSS" href="/homepage/rss/{ID}" />
<script type="text/javascript" src="/javascript/mootools.js"></script>
<script type="text/javascript" src="/javascript/jquery.ui.js"></script>
<script type="text/javascript" src="/javascript/jquery.eportfoliocomponent.js"></script>
<!-- BEGIN modify_layout -->


<!-- END modify_layout -->
<style type="text/css">
		
.left h2 { color: #{left_head_font}; background-color: #{left_head_bg};	}
.left p, .left h3, .left .listing p.small { color: #{left_font}; }
.left a, .left .listing p.small a { color: #{left_link}; }
.left a.edit { background-color: #{left_link}; }
.left .box a.edit:hover { color: #fff; background-color: #{left_hover}; }
.left .box a:hover, .left .listing p.small a:hover { color: #{left_hover};  }
.left .text { background: #{left_bg_primary}; }
.left .text.listing .dark { background: #{left_bg_secondary}; }

.right h2 { color: #{right_head_font}; background-color: #{right_head_bg};	}
.right p, .right h3, .right .listing p.small { color: #{right_font}; }
.right a, .right .listing p.small a { color: #{right_link}; }
.right a.edit { background-color: #{right_link}; }
.right .box a.edit:hover { color: #fff; background-color: #{right_hover}; }
.right .box a:hover, .right .listing p.small a:hover { color: #{right_hover};  }
.right .text { background: #{right_bg_primary}; }
.right .text.listing .dark { background: #{right_bg_secondary}; }

/* wrap mimetypes in classes */
<!-- BEGIN allowed_files -->
.{NAME} { background-image: url(/images/mime/22x22/{ICON}); }<!-- END allowed_files -->

</style>
<!-- END custom_head -->

<h1>
	<span>{HEADING}</span>
    <!-- BEGIN edit_page -->
    <a class="customise" href="/eportfolio/config/{ID}">customise page</a>
    <!-- END edit_page -->
</h1>

<div class="{TEMPLATE} privateBlock">
    <div class="left">

		<div class="box permanent">
			<h2>My Profile</h2>
			<div class="pad-it">
				<img src="/search/portrait.php?id={SYNERGY_ID}&width=150&height=150" alt="{PERSON_NAME}" title="{PERSON_NAME}" />
				<p>
					<strong>{PERSON_NAME}</strong><br />
					House: {HOUSE}<br />
					Campus: {CAMPUS}<br />
					Year: {YEAR_LEVEL}
				</p>
				<div class="float-fix"></div>
			</div>
    </div>
    <!-- BEGIN privateNotes -->
    <div class="private-notes box">
        <h2>Teacher Notes</h2>
		<div class="pad-it">
			{PRIVATE_NOTES}
			<!-- BEGIN modify_link -->
			<p class="interact">
				<a href="/eportfolio_privateNotes/modify/{ID}">Modify</a>
			</p>
			<!-- END modify_link -->
		</div>
    </div>
    <div class="float-fix"></div>
    <!-- END privateNotes -->
    {COLUMN1}</div>
    <div class="right">{COLUMN2}</div>
	<div class="float-fix"></div>
</div>
<input type="hidden" id="userID" value="{ID}" />
