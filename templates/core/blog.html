<script type="text/javascript">
$(function() {
    $('[data-interaction="delete"]').click(function(event) {
        event.preventDefault();
        $(this).confirmDialog({text:'Delete this comment?'});
    })
});
</script>

{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{BLOG_HEADING}</h1>
        </div>
    </div>
    <nav>
        <!-- BEGIN modify_link -->
        <a class="icon icon-modify" href="/blog/modify/{BLOG_ID}" title="Modify"></a>
        <!-- END modify_link -->
    </nav>
</div>

<div class="row">
    <div class="small-12 island">
        <section>
            <div class="avatar card">
                <a href="/search/user/{BLOG_AUTHOR_ID}">
                    <img src="/portrait.php?userId={BLOG_AUTHOR_EXTERNAL_ID}&size=square64" />
                    <p>{BLOG_AUTHOR_NAME}</p>
                </a>
                <p class="meta">{BLOG_CREATED}</p>
            </div>
        </section>

        <section>
            <div class="content">
                <article>{BLOG_BODY}</article>
            </div>
        </section>

        <h2 class="subheader">{BLOG_COMMENTS}</h2>

        <section>
            <div class="content no-pad">
                <ul class="information-list">
                    <!-- BEGIN comment -->
                    <li class="actions-small-1">
                        <div class="list-item">
                            <div class="avatar card">
                                <a href="/search/user/{COMMENT_AUTHOR_ID}">
                                    <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square64" />
                                    <p>{COMMENT_OWNER}</p>
                                </a>
                                <p class="meta">{COMMENT_CREATED}</p>
                            </div>
                            <article>{COMMENT_BODY}</article>
                        </div>
                        <nav>
                            <!-- BEGIN comment_delete_link -->
                            <a class="icon icon-delete" href="/blog/comment/delete/{COMMENT_ID}" data-interaction="delete"></a>
                            <!-- END comment_delete_link -->
                        </nav>
                    </li>
                    <!-- END comment -->
                    <li>
                        <form method="post" action="/blog/comment/new/{BLOG_ID}" class="no-pad">
                            <textarea name="body" class="no-margin" rows="2" cols="100" placeholder="Add your comment"></textarea>
                            <input type="submit" class="no-margin" name="comment" value="Add comment"/>
                        </form>
                    </li>
                </ul>
            </div>
        </section>
    </div>
</div>
