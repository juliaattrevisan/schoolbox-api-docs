<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
$j(function() {
		$j('a.delete-comment').click(function(){
			location.href = $j(this).attr('href');
		}).confirm({
		buttons: {
			wrapper:'<button></button>',
			separator:'  '
		}
	});

});


</script>

<h1>{BLOG_HEADING}</h1>
<span class="header_option">{MODIFY_BLOG}<a href="/homepage/{BLOG_CID}" class="btn go-back"><span></span>Back to Homepage</a></span>
<div class="clearfix"></div>
<div class="blog-detail">
	<p>{BLOG_BODY}</p>
	<div class="blog-comments">
		<h3>{BLOG_COMMENTS}</h3>
		<!-- BEGIN comment -->
		<div class="box">
			<p>{COMMENT_BODY}</p>
			<p class="interact">{DELETE_COMMENT} {COMMENT_OWNER} {COMMENT_CREATED}</p>
		</div>
		<!-- END comment -->
	</div>
	<form class="" method="post" action="/blog/comment/new/{BLOG_ID}">
		<p><textarea name="body" style="width: 100%;"></textarea></p>
		<p><input type="submit" class="submit-btn-plain" name="comment" value="Comment"/></p>
	</form>
</div>
