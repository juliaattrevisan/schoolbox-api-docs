<script type="text/javascript">
$(function() {
    $('a.delete-comment').click(function(event) {
        event.preventDefault();
        $(this).confirmDialog({text:'Delete this comment?'});
    })
});
</script>

{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{BLOG_HEADING}</h1>
        </div>
    </div>
    <nav>
        <!-- BEGIN modify_link -->
        <a class="icon icon-modify" href="/blog/modify/{BLOG_ID}" title="Modify"></a>
        <!-- END modify_link -->
    </nav>
</div>

<div class="row">
    <div class="small-12 island">
        <section>
            <div class="avatar card">
                <a href="/search/user/{BLOG_AUTHOR_ID}">
                    <img src="/portrait.php?userId={BLOG_AUTHOR_EXTERNAL_ID}&size=square64" />
                    <p>{BLOG_AUTHOR_NAME}</p>
                </a>
                <p class="meta">{BLOG_CREATED}</p>
            </div>
        </section>

        <section>
            <div class="content">
                <article>{BLOG_BODY}</article>
            </div>
        </section>
    </div>
</div>

<div class="blog blog-detail">
    <ul class="comments">
        <!-- BEGIN comment -->
        <li>
            <!-- BEGIN comment_delete_link -->
            <a class="icon icon-delete" href="/blog/comment/delete/{COMMENT_ID}"></a>
            <!-- END comment_delete_link -->

            <a href="/search/user/{COMMENT_AUTHOR_ID}" class="author">
                <img src="/portrait.php?userId={COMMENT_AUTHOR_EXTERNAL_ID}&size=square32"/>
                <span class="name">{COMMENT_OWNER}</span>
            </a>
            <span class="subtitle">Commented {COMMENT_CREATED}</span>
            <p class="comment-body">{COMMENT_BODY}</p>
        </li>
        <!-- END comment -->
    </ul>

    <form method="post" action="/blog/comment/new/{BLOG_ID}">
        <p><textarea name="body" rows="2" cols="100" placeholder="Add your comment"></textarea>
            <input type="submit" class="submit-btn-plain" name="comment" value="Add comment"/></p>
    </form>
</div>
