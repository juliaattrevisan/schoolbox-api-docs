<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.scrollTo.js"></script>
<!-- END custom_head -->
<div class="row">
    <div class="column small-12">
        <div class="actions-small-1 row">
            <div class="list-item">
                <div class="small-12 columns">
                    <h1>{PAGE_TITLE}</h1>
                </div>
            </div>
            <nav>
                <!-- BEGIN add_news -->
                <a class="icon-add" href="/news/modify" title="Add News"></a>
                <!-- END add_news -->
            </nav>
        </div>

        <dl class="tabs">
            <!-- BEGIN topic_header -->
            <dd><a {TOPIC_CLASS} href="/news-archive/{TOPIC_CLEAN}" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></dd>
            <!-- END topic_header -->
        </dl>

        <div class="row">
            <div class="small-12 island">
                <section class="content">
                    <h3>Filter By Month</h3>

                    <!-- BEGIN year -->
                    <a class="button dropdown {YEAR_CLASS}" data-dropdown="drop{YEAR}">{YEAR}</a>
                    <ul class="f-dropdown" data-dropdown-content="" id="drop{YEAR}">
                        <!-- BEGIN month -->
                        <li>
                            <a class="{MONTH_CLASS}" href="/news-archive/{MENU_TOPIC_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                        </li>
                        <!-- END month -->
                    </ul>
                <!-- END year -->
                </section>
            </div>
        </div>

        <div class="row">
            <div class="small-12 island">
                <section>
                    <ul class="information-list">
                        <!-- BEGIN topic -->
                        <!-- BEGIN news -->
                        <li id="a{NEWS_ID}">
                            <!-- BEGIN has_modify_button -->
					        <!-- END has_modify_button -->
                            <div class="column no-pad small-12" data-equalizer-watch>
                                <div class="avatar card">
                                    <a href="/news/item/{NEWS_ID}" title="{NEWS_TITLE}">
                                        <!-- BEGIN news_image -->
                                        <img src="/storage/image.php?hash={NEWS_IMAGE}&size=square64" />
                                        <!-- END news_image -->
                                        <h3>{NEWS_TITLE}</h3>
                                    </a>
                                    <p class="meta">Posted by {POSTER} {DATETIME}
                                        <!-- BEGIN has_expiry -->
                                        | {EXPIRY_VERB} on {EXPIRY_DATE}
                                        <!-- END has_expiry -->
                                        <!-- BEGIN has_publish_date -->
                                        | Published on {PUBLISH_DATE}
                                        <!-- END has_publish_date -->
                                    </p>
                                </div>
                                <article>
                                    <p>{NEWS_BODY}</p>
                                </article>
                            </div>
                        </li>
                        <!-- END news -->
                        <!-- END topic -->
                    </ul>
                </section>
            </div>
        </div>

        <ul class="pagination">
            <!-- BEGIN previous_button -->
            <li><a class="arrow" href="/news-archive/{PREVIOUS_PAGE}">&laquo;</a></li>
            <!-- END previous_button -->
            <!-- BEGIN page_number -->
            <li><a class="{CURRENT}" href="/news-archive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
            <!-- END page_number -->
            <!-- BEGIN next_button -->
            <li><a class="arrow" href="/news-archive/{NEXT_PAGE}">&raquo;</a></li>
            <!-- END next_button -->
        </ul>
    </div>
</div>
