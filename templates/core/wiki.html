<!-- BEGIN custom_head -->
<!-- END custom_head -->
  <h1>{HEADING} {LOCKED}</h1>
  
  <span class="header_option">
  <!-- BEGIN modify_link -->
  <a href="/wiki/modify/{WIKI_ID}">Modify</a> | <!-- END modify_link -->
  <!-- BEGIN delete_link -->
  <a href="/wiki/modifyForm.php?delete={WIKI_ID}" onclick="return confirm('Are you sure you want to delete the entire wiki?');">Delete</a> | <!-- END delete_link -->
  <!-- BEGIN revert_link -->
  <a href="/wiki/modifyForm.php?wikiID={WIKI_ID}&revert={CURRENT_REVISION}" onclick="return confirm('Revert to this revision?');">Revert to this revision</a> | <!-- END revert_link -->
  <!-- BEGIN lock_link -->
  <a href="/wiki/modifyForm.php?toggleLock={WIKI_ID}">{LOCK_UNLOCK}</a> | <!-- END lock_link -->

  <a href="/homepage/{CATEGORY_ID}">Return to homepage</a>
  </span>
  <div class="float-fix"></div>
  
  <div class="left">
  	<div class="box">
    {BODY}
    </div>
    <p>Modified by <a href="/search/user/{AUTHOR_ID}">{AUTHOR}</a> on {MODIFIED}</p>
	</div>
  <div class="right">
      <h2>Revisions</h2>
      <table>
        <tr>
          <th>Date</th>
          <th>Author</th>
        </tr>
        <!-- BEGIN revision_list -->
        <tr>
          <td><a href="/wiki/{WIKI_ID}/{REVISION_ID}">{REVISION_DATE}</a></td>
          <td>{REVISION_AUTHOR}</td>
        </tr>
        <!-- END revision_list -->
      </table>
    </div>
