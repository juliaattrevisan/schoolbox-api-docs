tinyMCE.init({
	 mode : "textareas",
	 theme : "advanced",
	 plugins : "table,tabfocus,media,inlinepopups,advimage,assetmanager,paste,spellchecker",
	 content_css : "/css/core/tiny.css",
	 theme_advanced_toolbar_location : "top",
	 theme_advanced_toolbar_align : "left",

<div class="privateBlock">

    <form action="/eportfolio_privateNotes/modifyForm.php" method="post">

            <input name="uid" type="hidden" id="userID" value="{ID}" />

        </fieldset>
        <fieldset>
            <input type="submit" value="Save Notes" />
        </fieldset>
