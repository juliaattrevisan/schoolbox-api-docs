<table width="100%" bgcolor="#cccccc" cellpadding="0" cellspacing="0">

        <table bgcolor="#FFFFFF" width="506" cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            
            <td width="20"><img SRC="http://{SITE_DOMAIN}/images/emails/spacer.gif" WIDTH="20" HEIGHT="1" BORDER="0"></td>
            <td width="456">
