<link rel="stylesheet" type="text/css" media="screen" href="/css/tree.css" />
<style type="text/css">
    #resource-browser .submit-btn-plain {
        float: right;
    }

    #resource-browser .left {
        float: none;
        width: 100%;
    }
</style>
<div class="left">
    <div id="category-window">
        <div class="loading"></div>
        <table id="category-head">
            <thead>
            <th>Folders</th>
            </thead>
        </table>
        <div class="scroller">
            <table id="tree">
                <tbody>
                <tr id="node-0" class="server expanded loaded {FULL} {WRITE}">
                    <td><span class="server label">Resources</span></td>
                </tr>
                <!-- BEGIN category_list -->
                <tr id="node-{CATEGORY_ID}" class="{CLASS}">
                    <td><span class="elbow"></span><span class="label">{CATEGORY_NAME}</span></td>
                </tr>
                <!-- END category_list -->
                </tbody>
                <tfoot>
                <tr id="node-template">
                    <td><span class="elbow"></span><span class="label"></span></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
    <input id="destination" type="hidden" readonly="readonly" value="" />
    <a href="#" id="select-resource" class="submit-btn-plain"><span></span>Select</a>
</div>
<script type="text/javascript">
    // listener for submit
    $j('#destination').val($j('{DESTINATION}').val());
    $j('#select-resource').click(function() {
        // set the contents of the nominated field to the destination value, then bug out
        if($j('#destination').val().indexOf('homepage/') == -1) {
            var dest = "/homepage/" + $j('#destination').val();
            $j('{DESTINATION}').val(dest);
        }
        // kbye
        $j('#resource-browser').dialog('close');
    });
</script>
<script type="text/javascript" src="/javascript/jquery.resourcebrowser.js"></script>
