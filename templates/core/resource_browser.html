<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript" src="/javascript/jquery.resourceTree.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/tree.css" />
<link rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<div class="left">
    <div id="category-window">
        <div class="loading"></div>
        <table id="category-head" class="table">
            <thead>
            <th>Folders</th>
            </thead>
        </table>
        <div class="scroller">
            <div id="tree" class="table">
            </div>
        </div>
    </div>
    <input id="destination" type="hidden" readonly="readonly" value="" />
    <input id="destination-text" type="hidden" readonly="readonly" value="" />
    <a href="#" id="select-resource" class="submit-btn-plain"><span></span>Select</a>
</div>
<script type="text/javascript">

    $(function(){

        /* left tree navigation */
        $j('#tree')
            .resourceTree({
                data: {
                    cache: {TREEDATA}
                }
            })
            .on('select_node.jstree', function(event, jstree) {
                var relationID = jstree.node.id;

                $j.post('/ajax/tree.php', {resourcesID : relationID});

                $j('#destination').val(relationID);
                $j('#destination-text').val($j(this).find('.label').text());
            });

        $j("div.loading").hide();

        $j('#category-window, #file-window').height($j(window).height()-$j('#header').height()-$j('#footer').height()-50);

        $j(window).resize(function() {
            $j('#category-window, #file-window').height($j(window).height()-$j('#header').height()-$j('#footer').height()-50)
        });
    })
    // listener for submit
    $j('#destination').val($j('{DESTINATION}').val());
    $j('#select-resource').click(function(event) {
        event.preventDefault();

        // In case the currently selected node was never clicked:
        // trigger the select node event on it
        $j('#tree tr.selected').trigger('selectNode.tree');

        // set the contents of the nominated field to the destination value, then bug out
        var v = $j('#destination').val();
        if(v.length > 0 && v.indexOf('homepage/') == -1) {
            var dest = "/homepage/" + $j('#destination').val();
            $j('{DESTINATION}').val(dest);
            // Trigger change on destination if it was asked for
            if ('{TRIGGER}') {
                $j('{DESTINATION}').trigger(
                    'change',
                    [{from:'resourceBrowser', name: $j('#destination-text').val()}]
                );
            }
            if ('{DESTINATION_TEXT}') {
                $j('{DESTINATION_TEXT}').text($j('#destination-text').val());
            }
        }
        // kbye
        $j('#resource-browser').dialog('close');
    });
</script>
