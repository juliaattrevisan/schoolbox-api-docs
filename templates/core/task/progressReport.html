<h1>Unit Progress Report - {CATEGORY}</h1>
<div class="header_option">
    <div class="mark-sheet wrap">
        <table>
            <thead>
                <tr>
                    <th rowspan="2">Name</th>
                    <!-- BEGIN header_unit -->
                    <th colspan="{HEADER_UNIT_COUNT}">{HEADER_UNIT_NAME}</th>
                    <!-- END header_unit -->
                </tr>
                <tr>
                    <!-- BEGIN subheader_unit -->
                    <!-- BEGIN subheader_unit_task -->
                    <th>{SUBHEADER_UNIT_TASK_NAME}</th>
                    <!-- END subheader_unit_task -->
                    <!-- END subheader_unit -->
                </tr>
            </thead>
            <tbody>
                <!-- BEGIN student -->
                <tr>
                    <td>
                        <img height="32" width="32" src="/portrait.php?userId={STUDENT_SYNERGY_ID}&amp;size=square32">
                        <a href="/search/user/{STUDENT_ID}" title="{STUDENT_SURNAME}, {STUDENT_FIRSTNAME}">
                            {STUDENT_SURNAME}, {STUDENT_FIRSTNAME}
                        </a>
                    </td>
                    <!-- BEGIN student_unit -->
                    <!-- BEGIN student_unit_task -->
                    <td>
                        <!--
                        If an online assessment:
                            Show mark, and allow review
                        If due work:
                            Show mark
                        Otherwise:
                            Show pending/complete/incomplete, and form for modifying
                        -->
                        <!-- BEGIN student_unit_task_check -->
                            <form action="/task/progressReportForm.php" method="POST">
                                <input type="hidden" name="student_id" value="{STUDENT_ID}" />
                                <input type="hidden" name="task_id"    value="{STUDENT_UNIT_TASK_ID}" />
                                <select name="status">
                                    <!-- BEGIN student_unit_task_check_status -->
                                    <option label="{STUDENT_UNIT_TASK_STATUS_TEXT}" value="{STUDENT_UNIT_TASK_STATUS_VALUE}" {STUDENT_UNIT_TASK_STATUS_SELECTED}>{STUDENT_UNIT_TASK_STATUS_TEXT}</option>
                                    <!-- END student_unit_task_check_status -->
                                </select>
                            </form>
                        <!-- END student_unit_task_check -->
                        <!-- BEGIN student_unit_task_submission_box -->
                            {STUDENT_UNIT_TASK_SUBMISSION_MARK}
                        <!-- END student_unit_task_submission_box -->
                        <!-- BEGIN student_unit_task_online_assess -->
                            {STUDENT_UNIT_TASK_ASSESS_TOTAL_MARKS} / {STUDENT_UNIT_TASK_ASSESS_TOTAL_AVAILABLE_MARKS}
                        <!-- END student_unit_task_online_assess -->
                    </td>
                    <!-- END student_unit_task -->
                    <!-- END student_unit -->
                </tr>
                <!-- END student -->
            </tbody>
        </table>
    </div>
</div>
