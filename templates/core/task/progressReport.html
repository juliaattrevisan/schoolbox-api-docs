<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/jquery.label-timeout.js"></script>
<script type="text/javascript">
    (function($) {
        $(function(){
            // Save form for updating a student's progress
            $('a[data-interaction="update_progress"]').on('click', function(event){
                event.preventDefault()

                var label = $('[data-save-progress-state]');
                label.labelActivate();

                var element = $(this);
                var form    = element.closest('form');
                $.post(
                    form.attr('action'),
                    form.serialize(),
                    function(data) {
                        // Update something.
                        // I guess add the same class the update submission has.
                        element.removeClass('progress-tick pending complete').addClass('ajax-updated');
                        form.find('input[name="current_status"]').val(data.status);
                        // Update name and class as well
                        switch (data.status) {
                            case 1: // incomplete
                                element.addClass('progress-tick').attr('title', 'Incomplete - click to update');
                                break;
                            case 2: // pending
                                element.addClass('progress-tick pending').attr('title', 'Self Assessed - click to update');
                                break;
                            case 3: // complete
                                element.addClass('progress-tick complete').attr('title', 'Complete - click to update');
                                break;
                        }

                        label.labelTimeout({
                            text: 'Saved',
                            css: 'success'
                        });

                        setTimeout(function() {
                            element.removeClass('ajax-updated');
                        }, 1000)
                    },
                    'json'
                )
            })
        });
    })(jQuery);
</script>
<!-- END custom_head -->
