<!-- BEGIN create_header -->
<h1>Add a Task</h1>
<!-- END create_header -->
<!-- BEGIN modify_header -->
<h1>Modify Task</h1>
<!-- END modify_header -->
<form action="/task/saveForm.php" method="post" name="form">
    <input type="hidden" name="id"       value="{TASK_ID}"/>
    <input type="hidden" name="category" value="{TASK_CATEGORY}"/>
    <input type="hidden" name="type"     value="{TASK_TYPE}"/>

    <dl>
        <dt><label for="title">Task:</label></dt>
        <dd><input id="title" name="title" type="text" value="{TASK_TITLE}" /></dd>

        <dt><label for="link">Link:</label></dt>
        <dd><input id="link" name="link" type="text" value="{TASK_LINK}" /></dd>

        <dt><label for="requires_confirmation">Requires confirmation?</label></dt>
        <dd>
            <input name="requires_confirmation" value="0" type="hidden" />
            <input name="requires_confirmation" value="1" type="checkbox" id="requires_confirmation" {TASK_CONF_REQUIRED} />
        </dd>
    </dl>

    <!-- BEGIN create_button -->
    <input type="submit" name="Submit" value="Post" class="submit-btn-plain" />
    <!-- END create_button -->
    <!-- BEGIN modify_button -->
    <input type="submit" name="Submit" value="Update" class="submit-btn-plain" />
    <!-- END modify_button -->
</form>
