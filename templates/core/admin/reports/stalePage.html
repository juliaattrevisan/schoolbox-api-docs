<h1>Stale Page Report</h1>

<form method="POST">
    <select name="age">
        <option value="1" {1_SELECTED}>1 Months</option>
        <option value="2" {2_SELECTED}>2 Months</option>
        <option value="3" {3_SELECTED}>3 Months</option>
        <option value="6" {6_SELECTED}>6 Months</option>
        <option value="12" {12_SELECTED}>12 Months</option>
        <option value="24" {24_SELECTED}>24 Months</option>
    </select>
    <input type="submit" name="Submit" value="Go" class="submit-btn-plain"/>
</form>

<table>
    <thead>
        <tr>
            <td>Page</td>
        </tr>
    </thead>
    <tbody>
        <!-- BEGIN stale -->
        <tr><td>{BREADCRUMB}</td></tr>
        <!-- END stale -->
    </tbody>
</table>
