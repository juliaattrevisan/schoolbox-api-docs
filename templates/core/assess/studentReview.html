<!-- BEGIN custom_head -->
<script type="text/javascript">

$j(function() {
	$j('.textarea-container').each(function() {
		if ($j(this).html() == "") {
				$j(this).parent().remove();
		}
	});
});

</script>
<!-- END custom_head -->
