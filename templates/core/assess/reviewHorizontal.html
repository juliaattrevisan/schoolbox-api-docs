<h1>Mark the test results for {RESPONDENT_NAME}</h1>

<p class="information-notification review-submitted hide">Please note: You are currently editing an already submitted review.</p>
<div class="evaluation-content mark-test">

	<!-- BEGIN attempt -->
	<script type='text/javascript'>
		$j(function() {
			$j('questionForm-{RESPONSE_ID}').evaluationShortReview({
				id: {RESPONSE_ID}
			});
		});
	</script>
	<form id='questionForm-{RESPONSE_ID}' action="/assess/saveReviewedResponse/{QUESTION_QUESTION_ID}/{RESPONSE_ID}" class='validation_{RESPONSE_ID} questionForm' method="post">
		<div class="wysiwyg no-pad clearfix">
			<h3><strong>Q{QUESTION_SEQUENCE})</strong> {QUESTION_QUESTION}<span> - ({QUESTION_MARKS} marks)</span></h3>
		</div>
		<div class="evaluation-answer clearfix">
			<!-- BEGIN answerInputs -->
			<!-- END answerInputs -->
		</div>
		<!-- BEGIN writable_update -->
		<label class="alert-holder clearfix">
			<div class="assess-alert">
				<span>In order to finalise your review, please click the "Finalise Review" button at the bottom of the page.</span>
			</div>
			<input type="submit" value="Update Marks" class="submit-btn-plain float-right"/>
		</label>
		<!-- END writable_update -->
	</form>
	<!-- END attempt -->

	<p class="clearfix text-align-right">
		<!-- BEGIN prevSection -->
		<a class="btn go-back float-left" href="/assess/review/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Previous Section</a>
		<!-- END prevSection -->

		<!-- BEGIN nextSection -->
		<a class="btn go-to" href="/assess/review/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Next Section</a>
		<!-- END nextSection -->

		<!-- BEGIN endAssess -->
		<!-- BEGIN writable_finalise -->
		<a class="btn tick finish-review" href="/assess/finishReview/{ASSESS_ASSESS_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Finalise Review</a>
		<!-- END writable_finalise -->
		<!-- END endAssess -->
	</p>
</div>
