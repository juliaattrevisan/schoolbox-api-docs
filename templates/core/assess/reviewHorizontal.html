<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.countdown.css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.countdown.js"></script>
<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript" src="/javascript/evaluation/review.js"></script>
<style>
	form input[type=text] {
		border: solid 1px #DBDBDB;
	}
</style>
<!-- END custom_head -->
<h1>Horizontal Marking for {ASSESS_TITLE}</h1>

<div  style='border:3px dashed #f00;'>
	<div class="wysiwyg no-pad clearfix">
		<h3><strong>Q{QUESTION_SEQUENCE})</strong> {QUESTION_QUESTION}</h3>
	</div>

	<div class="evaluation-content mark-test">

		<!-- BEGIN attempt -->
		<script type='text/javascript'>
			$j(function() {
				$j('questionForm-{RESPONSE_ID}').evaluationResponseReview({
					id: {RESPONSE_ID}
				});
			});
		</script>
		<form id='questionForm-{RESPONSE_ID}' action="/assess/saveReviewedResponse/{QUESTION_QUESTION_ID}/{RESPONSE_ID}" class='validation_{RESPONSE_ID} questionForm' method="post">
			<h1>{USER_LASTNAME}, {USER_FIRSTNAME}</h1>

			<div class="evaluation-answer clearfix">
				<!-- BEGIN answerInputs -->
				<!-- END answerInputs -->
			</div>
			<!-- BEGIN writable_update -->
			<label class="alert-holder clearfix">
				<div class="assess-alert">
					<span>In order to finalise your review, please click the "Finalise Review" button at the bottom of the page.</span>
				</div>
				<input type="submit" value="Update Marks" class="submit-btn-plain float-right"/>
			</label>
			<!-- END writable_update -->
		</form>
		<!-- END attempt -->

		<p class="clearfix text-align-right">
			<!-- BEGIN previous_question -->
			<a href='/assess/reviewHorizontal/{ASSESS_ASSESS_ID}/{PREVIOUS_ID}'>Previous</a>
			<!-- END previous_question -->

			<!-- BEGIN next_question -->
			<a href='/assess/reviewHorizontal/{ASSESS_ASSESS_ID}/{NEXT_ID}'>Next</a>
			<!-- END next_question -->

			<!-- BEGIN writable_finalise -->
			<a href='/assess/reviewHorizontal/{ASSESS_ASSESS_ID}/finalise'>Finalise all attempts</a>
			<!-- END writable_finalise -->
		</p>
	</div>
</div>
