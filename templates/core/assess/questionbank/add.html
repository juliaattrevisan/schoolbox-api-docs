<h2>Import into Question Bank</h2>

<form action="/{ASSESS_KIND_LC}/questionbank/addQuestion" method="post">
    <input name="question_id" type="hidden" value="{CATEGORY_LIST_ITEM_ASSESS_ID}" />
    <input name="question_category" type="hidden" value="" />
    <input name="{RETURN_URL_NAME}" type="hidden" value="{RETURN_URL}" />

    <div class="row">
        <div class="small-12 column no-pad">
            <p class="alert-box">
                Put this question into the Question Bank so you can import it into other {ASSESS_KIND_PLURAL}.
            </p>
        </div>
        <div class="small-12 island no-pad">
            <h3>Question Category</h3>
            <div id='category-tree' class="content">
                <!-- BEGIN category_list_start -->
                <ul>
                    <!-- END category_list_start -->

                    <!-- BEGIN category_list_item_start -->
                    <ul>
                        <!-- END category_list_item_start -->

                        <!-- BEGIN category_list_item -->
                        <li id='{CATEGORY_LIST_ITEM_NODE}' class='{CATEGORY_LIST_ITEM_SELECTED}'>
                            <a href='#'>
                                {CATEGORY_LIST_ITEM_NAME}
                                <!-- BEGIN item_count -->
                                    ({CATEGORY_LIST_ITEM_NUMQUESTIONS})
                                <!-- END item_count -->
                            </a>
                            <!-- END category_list_item -->

                            <!-- BEGIN category_list_item_end -->
                    </ul>
                    </li>
                    <!-- END category_list_item_end -->
                </ul>
            </div>
        </div>
        <div class="small-12 column no-pad">
            <input class="expand" type="submit" value="Add To Question Bank" disabled="disabled" />
        </div>
    </div>
</form>
<a class="close-reveal-modal" aria-label="Close">&#215;</a>
<script>

    /**
     * As this file is loaded dynamically within a modal, we need to ensure 
     * its script files are fully loaded on the CDN before we call any methods contained within
     * the files. This is because these script files will not be loaded with render blocking, 
     * so $('#category-tree').jstree() could be called before jstree.js is loaded
     */

    //check if one of the scripts is already loaded so we don't load it again
    if (Boolean(document.querySelector(`script[src="{CDN_PREFIX}/js/vendors/jstree/dist/jstree.min.js?v={SITE_VERSION}"]`))) {
        initJsTree();
    } else {
        loadScripts();
    }

    function loadScripts () {

        let scriptsLoaded = 0;
        const jsFiles = ['{CDN_PREFIX}/js/vendors/jstree/dist/jstree.min.js?v={SITE_VERSION}'];

        function loadScript () {
            const scriptElement = document.createElement('script');
            scriptElement.addEventListener('load', onScriptLoaded);
            scriptElement.src = jsFiles[scriptsLoaded];
            document.head.appendChild(scriptElement);
        }

        //keep loading scripts sequentially until all are loaded
        function onScriptLoaded () {
            if (scriptsLoaded === (jsFiles.length-1)) {
                initJsTree();
            } else {
                scriptsLoaded++;
                loadScript();
            }
        }

        loadScript();

    }

    function initJsTree () {

        var form = $('#question-bank').children('form'),
            qid  = form.children('input[name=question_id]'),
            cid  = form.children('input[name=question_category]');

        // reinit foundation to account for ajax'd content
        $(document).foundation();


        $("#category-tree")
            .on('select_node.jstree', function(event, jstree) {
                cid.val(jstree.selected[0].replace(/^node_/, ''));
                $('#question-bank').find('input[type=submit]').prop('disabled', cid.val() == 0);
            })
            .on('deselect_node.jstree', function() {
                $('#question_category').val('');
            })
            .jstree({
                "animation":50,
                "core":{
                    force_text: true,
                    multiple:false,
                    "themes": {
                        "variant" : "schoolbox",
                        "dots" : true,
                        "icons" : false
                    }
                },
            });

        // Open root node by default

        $("#category-tree").jstree('open_node', '#node_0', function(e, data) {

            // After the tree opens select the root node by default

            $('#category-tree').jstree('select_node', '#node_0');
        });

        form.on('submit', function (e) {
            e.preventDefault();

            var catName = $('#category-tree').data('jstree')._data.core.last_clicked.text.trim().replace(/ \([0-9]*\)/, '');

            form.find('input[type=submit]').val('Adding to ' + catName).prop('disabled', true);

            $.post(form[0].action, form.serialize(), function () {
                var href = window.location.origin + '/{ASSESS_KIND_LC}/questionbank/added/' + qid.val();

                $('#bank-success').foundation('reveal').foundation('reveal', 'open', href);
            });
        });

    }

</script>
