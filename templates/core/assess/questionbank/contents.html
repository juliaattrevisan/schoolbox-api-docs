<script type='text/javascript'>
$j(function() {
	$j('#deleteButton').mouseup(function() {
		var allQuestions = $j('#questionBankForm').find('input[name="delete_question_bank_id[]"]:checked');

		if (allQuestions.length && confirm('Do you want to remove the selected questions from the Question Bank?')) {
			$j.post('/assess/questionbank/delete', $j('#questionBankForm').serialize(), function(response) {
				alert(response);

				location.reload();
			});
		}
	});
});

</script>
<div class="evaluation-content question-bank">
<h2>Online Assessment Question Bank</h2>
	<form id='questionBankForm' action='/assess/questionbank/addToSection' method='post'>
		<input name='section_id' type='hidden' value='{SECTION_ID}' />

		<!-- BEGIN question_category -->

				<h3><strong>{QUESTION_CATEGORY_NAME}</strong></h3>

					<!-- BEGIN question -->
					<div class="question">

						{QUESTION}({QUESTION_TYPE}, {MARKS} marks)

						<!-- BEGIN show_input -->
						<label><input name='question_bank_id[]' type='checkbox' value='{QUESTION_BANK_ID}' /> Add to Assessment</label>
						<!-- END show_input -->
						<label><input name='delete_question_bank_id[]' type='checkbox' value='{QUESTION_BANK_ID}' />Delete from QuestionBank</label>
					</div>

					<!-- END question -->


		<!-- END question_category -->

		<p class="clearfix">
		<!-- BEGIN show_submit -->
		<input type='submit' value='Copy to section' class="submit-btn-plain"/>
		<!-- END show_submit -->

		<!-- BEGIN show_delete -->
		<input id='deleteButton' type='submit' value='Remove from QuestionBank' class="submit-btn-plain"/>
		<!-- END show_delete -->

		<!-- BEGIN no_questions -->
		There are no questions in the Question Bank.
		<!-- END no_questions -->
		</p>
	</form>
</div>
