<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
    tinyMCE.init({
		mode : "exact",
		elements: "question",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
        browser_spellcheck : true,
		content_css : "/css/core/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
        accessibility_warnings : false,
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		file_browser_category_id : '{ASSESS_CATEGORY_ID}',
		tabfocus_elements : ":prev,:next",
		convert_urls : false,
		force_br_newlines : false,
		force_p_newlines : true
	});

	tinyMCE.init({
		mode : "textareas",
		editor_selector: "richtext-answer",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
        browser_spellcheck : true,
		content_css : "/css/core/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
        accessibility_warnings : false,
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		file_browser_category_id : 0,
		tabfocus_elements : ":prev,:next",
		convert_urls : false,
		force_br_newlines : false,
		force_p_newlines : true
	});

	$j(function() {
		/* Enforce two decimal places
		 */
		$j('input[name=marks]').change(function() {
			$j(this).val(parseFloat($j(this).val()).toFixed(2));
		});

		/* Category tree
		 */
        $j("#categoryTree")
            .on('select_node.jstree', function(event, jstree) {
                $j('#question_category').val(jstree.selected[0].replace(/^node_/, ''));
            })
            .on('deselect_node.jstree', function() {
                $j('#question_category').val('');
            })
            .jstree({
                "animation":50,
                "core":{
                    multiple:false,
                    "themes": {
                        "variant" : "schoolbox",
                        "dots" : true,
                        "icons" : false
                    }
                }
            });
    });

	/* For overriding plugin redirection destination when modifying
	 * questions inside the QuestionBank
	 */
	var questionBank = {
		url: '{QUESTION_BANK_REDIRECT_URL}'
	}
</script>
<!-- END custom_head -->
<h1>Modify Question</h1>
<div class="evaluation-content">
	<h2>Question Details</h2>

	<form id="createQuestionForm" action="/assess/questionbank/question/modify" class="" method="post">
		<label class="hide">
			<input name="question_bank_id" type="hidden" value="{QUESTION_BANK_ID}" />
		</label>

		<label>Type
			<input type="hidden" name="type_id" value="{QUESTIONTYPE_TYPE_ID}" />
			<span>{QUESTIONTYPE_DESCRIPTION}</span>
		</label>

		<label>Question
			<div class="textarea-container" id="question_container"><textarea name="question" class="mceSimple tinyValidate" id="question" />{QUESTION}</textarea></div>
		</label>

		<!-- BEGIN has_answer_configuration -->
		<label>Configuration Options
			<!-- BEGIN answer_configuration -->

			<!-- END answer_configuration -->
		</label>
		<!-- END has_answer_configuration -->

		<label>Marks
			<input name="marks" type="text" size="3" value="{MARKS}"/>
		</label>

		<div id="answer">
			<!-- BEGIN answerInputs -->

			<!-- END answerInputs -->
		</div>

		<p class="clearfix">
			<input type="submit" name="create" id="create" value="Modify" class="submit-btn-plain"/>
		</p>
	</form>
</div>
