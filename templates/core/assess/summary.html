<div id="assess">
	<div class="assess-header">
		<h2>{ASSESS_TITLE}<a class="edit-assess" href="/assess/modify/{ASSESS_ASSESS_ID}">Edit</a></h2>
		<div class="assess-body">
				<div class="duration">
					<h2>Duration</h2>
					<p>{ASSESS_DURATION}</p>
				</div>

				<p>{ASSESS_DESCRIPTION}</p>

				<p>
					<strong>Test open:</strong><br />
					{ASSESS_START}
					<span class="edit-assess-arrow"></span>
					{ASSESS_FINISH}
				</p>
				<div class="float-fix"></div>
				<hr />
				<ul>
					<!-- BEGIN section -->
					<li>
						<a class="summary" href="/assess/section/modify/{SECTION_SECTION_ID}">
							<strong>Section {SECTION_SEQUENCE}: {SECTION_TITLE}</strong> ({SECTION_NUMQUESTIONS} questions)
						</a>
					</li>
					<!-- END section -->
				</ul>
		</div>

		<div class="float-fix"></div>

	</div>
</div>
