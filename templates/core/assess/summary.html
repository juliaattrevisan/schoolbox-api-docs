<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        {ASSESS_START}
        {ASSESS_FINISH}
        <section>
            <div class="content">
                <h3>Time allowed: {ASSESS_DURATION}</h3>

                <article>{ASSESS_DESCRIPTION}</article>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Section</th>
                        <th>Number of questions</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                <!-- BEGIN section -->
                <tr>
                    <td>{SECTION_TITLE}</td>
                    <td>{SECTION_NUMQUESTIONS}</td>
                    <td><a href="/assess/section/modify/{SECTION_SECTION_ID}" class="icon-modify no-text" title="Modify"></a></td>
                </tr>
                <!-- END section -->
                </tbody>
            </table>
        </section>
    </div>
</div>
