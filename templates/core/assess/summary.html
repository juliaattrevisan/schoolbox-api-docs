<h1>Summary of your Quiz<a class="btn modify" href="/assess/modify/{ASSESS_ASSESS_ID}"><span></span>Modify</a></h1>
<div class="evaluation-content">
<h2>{ASSESS_TITLE}</h2>
	<div class="pad-it">
		<p>{ASSESS_DESCRIPTION}</p>
	
		<p class="clearfix">
			<strong>Quiz open:</strong>
			{ASSESS_START}
			<span class="edit-assess-arrow"></span>
			{ASSESS_FINISH}
		</p>

		<ul class="summary-sections">
			<!-- BEGIN section -->
			<li>
				<a href="/assess/section/modify/{SECTION_SECTION_ID}">
					Section {SECTION_SEQUENCE}: {SECTION_TITLE} ({SECTION_NUMQUESTIONS} questions) - <span>Modify</span>
				</a>
			</li>
			<!-- END section -->
		</ul>
	</div>
</div>
<div class="evaluation-menu duration">

	<h2><span></span>Duration</h2>
	<p class="pad-it">{ASSESS_DURATION}</p>

</div>
