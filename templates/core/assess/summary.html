<!-- BEGIN custom_head -->
<link rel="stylesheet" href="{CDN_PREFIX}/js/vendors/jstree/dist/themes/default/style.css?v={SITE_VERSION}" />
<!-- END custom_head -->

{BREADCRUMB}
<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ASSESS_TITLE}</h1>
        </div>
    </div>
    <nav>
        <a class="icon-more" title="Actions" data-dropdown="header-options"></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li class="separator">{ASSESS_KIND}</li>
        <li><a class="icon-modify" href="{MODIFY_URL}{RETURN_URL_MODIFY}">Modify</a></li>
        <!-- BEGIN view_results_link -->
        <li><a class="icon-poll" href="/{ASSESS_KIND_LC}/results/{ASSESS_ASSESS_ID}{RETURN_URL}">View Results</a></li>
        <!-- END view_results_link -->
        <li><a class="icon-quiz" href="/{ASSESS_KIND_LC}/intro/{ASSESS_ASSESS_ID}">Preview</a></li>
        <!--
            This template is shared by Quiz and Survey.
            Survey will continue to use the old GET delete page.
            Quiz will use the new POST delete route, with subsequent redirect.
         -->

        <!-- BEGIN delete_survey -->
        <li><a class="icon-delete" href="/survey/delete/{ASSESS_ASSESS_ID}{RETURN_URL}" data-delete>Delete</a></li>
        <!-- END delete_survey -->

        <!-- BEGIN delete_quiz -->
        <script>
            $(function() {
                $('[data-post-delete]').on('click', function (event) {
                    event.preventDefault();
                    var $element = $(this);
                    $element.confirmDialog({
                        text: 'Are you sure you want to delete this Quiz?',
                        confirmLabel: 'Delete',
                        confirmEvent: function () {
                            $.post($element.attr('href'), {returnUrl: '{RETURN_URL}'}, function (data) {
                                if('string' == typeof data.returnUrl){
                                    window.location.href = data.returnUrl;
                                }
                            });
                        }
                    });
                });
            });
        </script>
        <li><a class="icon-delete" href="/learning/assessments/{ASSESSMENT_ID}/delete{RETURN_URL}" data-post-delete>Delete</a></li>
        <!-- END delete_quiz -->

        <li><a class="icon-export" href="/{ASSESS_KIND_LC}/export/xml/{ASSESS_ASSESS_ID}">Export</a></li>
        <li class="separator">Section</li>
        <li><a class="icon-add" href="/{ASSESS_KIND_LC}/section/create/{ASSESS_ASSESS_ID}{RETURN_URL}">Add Section</a></li>
    </ul>
</div>

<div class="row">
    <div class="small-12 island">
        <ul class="meta">
            <!-- BEGIN has_due_date -->
            <li class="icon-calendar">
                <time>{ASSESS_START}</time>&ndash;<time>{ASSESS_FINISH}</time>
            </li>
            <!-- END has_due_date -->
            <li class="icon-time-value">Allowed Time: {ASSESS_DURATION}</li>
        </ul>
        <!-- BEGIN has_description -->
        <section class="content">
            <article>{ASSESS_DESCRIPTION}</article>
        </section>
        <!-- END has_description -->
        <!-- BEGIN allQuestions -->
        <!-- END allQuestions -->
        <a href="{RETURN_URL_DECODED}" class="button submit">Finish Modifying</a>
    </div>
</div>
