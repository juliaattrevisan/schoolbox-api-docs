<h2>{ASSESS_TITLE}</h2>
    <div class="wysiwyg">
        {ASSESS_DESCRIPTION}
    </div>

    <p><strong>Created by</strong><br />
        {ASSESS_AUTHOR}
    </p>
    <p><strong>Time allowed: </strong><br />
        {ASSESS_DURATION}
    </p>
    <p><strong>Due Date: </strong><br />
        {ASSESS_FINISH}
    </p>
    <table class="table ruler">
         <thead>
         <tr><th>Section</th><th>Number of questions</th></tr>
         </thead>
        <tbody>
        <!-- BEGIN section -->
        <tr><td>{SECTION_TITLE}</td><td>{SECTION_NUMQUESTIONS}</td></tr>
        <!-- END section -->
    </tbody>
    </table>

    <!-- BEGIN startTest -->
    <br>

    <p class="clearfix">
        <a href="/assess/init/{ASSESS_ASSESS_ID}/{FIRST_SECTION}" class="btn go-to float-left"><span></span>Begin quiz</a>
    </p>
    <!-- END startTest -->
