{BREADCRUMB}

<div class="row">
    <div class="small-12 column">
        <h1>{ASSESS_TITLE}</h1>
        <ul class="meta">
            <!-- BEGIN has_assess_due -->
            <li class="icon-calendar" title="Due">Due <time>{ASSESS_FINISH}</time></li>
            <!-- END has_assess_due -->
            <li class="icon-time-value" title="Allowed Time">Allowed time: <time>{ASSESS_DURATION}</time></li>
            <li class="icon-home" title="Homepage"><a href="/homepage/{ASSESS_FOLDER_ID}">{ASSESS_FOLDER}</a></li>
            <li class="icon-staff-students" title="Author"><!-- BEGIN author_link_open --><a href="/search/user/{ASSESS_AUTHOR_ID}"><!-- END author_link_open -->{ASSESS_AUTHOR}<!-- BEGIN author_link_close --></a><!-- END author_link_close --></li>
        </ul>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <!-- BEGIN has_assess_description -->
        <section class="content">
            <article>{ASSESS_DESCRIPTION}</article>
        </section>
        <!-- END has_assess_description -->

        <div class="scrollable">
            <table>
                <thead>
                    <tr>
                        <th>Section</th>
                        <th>Number of questions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN section -->
                    <tr>
                        <td>{SECTION_TITLE}</td>
                        <td>{SECTION_NUMQUESTIONS}</td>
                    </tr>
                    <!-- END section -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- BEGIN startTest -->
<div class="row">
    <div class="small-12 column">
        <p>
            <a href="/assess/init/{ASSESS_ASSESS_ID}/{FIRST_SECTION}{RETURN_URL_SUFFIX}" class="button expand submit">Begin Quiz</a>
        </p>
    </div>
</div>
<!-- END startTest -->
