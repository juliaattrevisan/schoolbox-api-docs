<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
$j(function() {

	$j('a.delete').click(function() {
		location.href = $j(this).attr('href');
	}).confirm({
		buttons: {
			wrapper:'<button></button>',
			separator:'  '
  		}
	});

	$j('.show-assess-options').click(function() {
		$j('.assessment-options').slideToggle("fast");
		$j(this).toggleClass('active')
		return false;
	});

	$j('.show-section-options').click(function() {
		$j(this).parent().siblings('.question-list').children(":first-child").slideToggle();
		$j(this).toggleClass('active')
		return false;
	});

	$j(".show-assess-options, .show-section-options").hover(
	function () {
		$j(this).children('span').stop(true, true).fadeIn("fast");
		$j(this).css('background-image', "none");
	},
	function () {
		var $this = $j(this)
		$this.children('span').stop(true, true).fadeOut("fast", function() {
			$this.removeAttr('style');
		});

	});
	
	$j('.show-options').click(function() {
		$j(this).parent().siblings('p').slideToggle("fast");
		return false;
	});
	
});
</script>

<h2>Manage Assessment</h2>
	<div class="pad-it ">
		<div class="hide assessment-options pad-it clearfix"> <a href="/assess/modify/{ASSESS_ASSESS_ID}" class="btn modify float-left no-marg" ><span></span>Modify</a> <a href="/assess/export/{ASSESS_ASSESS_ID}" class="btn go-to float-left no-marg" ><span></span>Export</a> <a href="/assess/delete/{ASSESS_ASSESS_ID}" class="btn delete float-left no-marg" ><span></span>Delete</a> </div>
		<a class="drop-arrow show-assess-options" href="#">&#x25BC;</a>
		
		<p class="clearfix">
			<a class="btn add" href="/assess/section/create/{ASSESS_ASSESS_ID}"><span></span>Add section</a> 
		</p>
		
		<!-- BEGIN section -->
		<div class="assess-section">
			<h3>Section {SECTION_SEQUENCE}: {SECTION_TITLE}<a class="drop-arrow show-section-options" href="#">&#x25BC;</a></h3>

			<ul class="question-list">
			
				<li class="hide section-options clearfix">
					<a href="/assess/section/modify/{SECTION_SECTION_ID}" class="btn modify float-left"><span></span>Edit</a>
					<a href="/assess/section/delete/{SECTION_SECTION_ID}" class="btn delete float-left"><span></span>Delete</a>
				</li>
			
				<!-- BEGIN question -->
				<li>
					<strong>Q{QUESTION_SEQUENCE})</strong>

					<a href="/assess/question/modify/{QUESTION_QUESTION_ID}">Edit</a> | 
					<a class="delete" href="/assess/question/delete/{QUESTION_QUESTION_ID}">Delete</a>
				</li>

					</p>
				</li>
			</ul>

		</div>
		<!-- END section -->
	</div>
