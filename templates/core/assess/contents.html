<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('a.delete').click(function (event) {
            event.preventDefault();
            $(this).confirmDialog();
        });

        /* Make questions sortable
         */
        $(".question-list").sortable({
            placeholder: "sortable-placeholder",
            forcePlaceholderSize: true,
            stop: function () {
                var allQuestions = $(this).children('li'),
                    data         = [];

                $.each(allQuestions, function (index, element) {
                    data.push(element.id);
                });

                /* Reorder questions upon reorder completion
                 */
                $.post('/{ASSESS_KIND_LC}/reorderQuestions/{ASSESS_ASSESS_ID}', {ids: data}, function () {
                    var sequence = 1;

                    allQuestions.each(function (index, element) {
                        var strong = $(element).children('strong[data-seq]');

                        strong.html(strong.text().trim().replace(/^Q\d+/, 'Q' + sequence));
                        sequence++;
                    });
                });
            }
        })
        .disableSelection();
    });
</script>

<h2>Manage {ASSESS_KIND}</h2>
<div class="pad-it">

	<p class="clearfix tiny-btns">
		<a class="btn add float-left marg" href="/{ASSESS_KIND_LC}/section/create/{ASSESS_ASSESS_ID}"><span></span>Add Section</a>
		<a href="/{ASSESS_KIND_LC}/modify/{ASSESS_ASSESS_ID}" class="btn modify float-left marg" ><span></span>Modify</a>
		<a href="/{ASSESS_KIND_LC}/export/xml/{ASSESS_ASSESS_ID}" class="btn export float-left marg" ><span></span>Export</a>
		<a href="/{ASSESS_KIND_LC}/delete/{ASSESS_ASSESS_ID}" class="btn delete float-left marg" ><span></span>Delete</a>
    </p>

	<!-- BEGIN section -->
	<div class="evaluation-section">
		<h3>{SECTION_TITLE}
            <a href="/{ASSESS_KIND_LC}/section/delete/{SECTION_SECTION_ID}" class="btn delete no-text"><span></span></a>
            <a href="/{ASSESS_KIND_LC}/section/modify/{SECTION_SECTION_ID}" class="btn modify no-text"><span></span></a>

        </h3>
		<ul class="question-list" id='section{SECTION_SECTION_ID}'>
			<!-- BEGIN question -->
			<li id='question_{QUESTION_QUESTION_ID}'>
				<strong data-seq>
          Q{QUESTION_SEQUENCE})
          <!-- BEGIN has_mark -->
          ({QUESTION_MARKS} marks)
          <!-- END has_mark -->
        </strong>
        <div class="wysiwyg">{QUESTION_QUESTION}</div>
				<a href="/{ASSESS_KIND_LC}/question/modify/{QUESTION_QUESTION_ID}">Modify</a> |
				<a class="delete" href="/{ASSESS_KIND_LC}/question/delete/{QUESTION_QUESTION_ID}">Delete</a>
			</li>
			<!-- END question -->
		</ul>

		<ul>
			<li class="clearfix">
				<p class="clearfix no-marg">
					<a class="btn add marg" href="/{ASSESS_KIND_LC}/question/create/{SECTION_SECTION_ID}"><span></span>New Question</a>
					<a class="btn download marg" href="/{ASSESS_KIND_LC}/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}"><span></span>Add from Question Bank</a>
				</p>
			</li>
		</ul>
	</div>
	<!-- END section -->
</div>
