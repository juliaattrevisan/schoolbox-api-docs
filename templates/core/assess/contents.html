<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function () {
        $('[data-delete-section]').on("click", function (event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: 'Are you sure you want to delete this section?',
                confirmLabel: 'Delete',
            });
        });
        $('[data-delete-question]').on("click", function (event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: 'Are you sure you want to delete this question?',
                confirmLabel: 'Delete',
            });
        });

        /* Make questions sortable
         */
        $('[data-question-list]').sortable({
            handle: '.grip',
            axis: 'y',
            stop: function () {
                let allQuestions = $(this).children('li'),
                        sectionId = $(this).attr('data-section-id'),
                        data = [];

                $.each(allQuestions, function (index, element) {
                    data.push($(element).attr('data-question-id'));
                });

                /* Reorder questions upon reorder completion
                 */
                $.post('/{ASSESS_KIND_LC}/reorderQuestions/{ASSESS_ASSESS_ID}', {ids: data, sectionId: sectionId}, function () {
                    let sequence = 1;

                    allQuestions.each(function (index, element) {
                        let seq = $(element).find('[data-seq]');

                        seq.html(seq.text().trim().replace(/^Q\d+/, 'Q' + sequence));
                        sequence++;
                    });
                });
            }
        });
    });
</script>
<!-- END custom_head -->

<!-- BEGIN section -->
<div class="row actions-small-1">
    <div class="list-item">
        <div class="small-12 columns">
            <h2 class="subheader"><a name="section-{SECTION_SECTION_ID}"></a>{SECTION_TITLE}</h2>
        </div>
    </div>
    <nav>
        <sbx-pop-out content-id="section{SECTION_SECTION_ID}-options" data-test="sbx-pop-out-section{SECTION_SECTION_ID}-options"></sbx-pop-out>
    </nav>
    <ul class="f-dropdown" data-dropdown-content id="section{SECTION_SECTION_ID}-options">
        <li class="separator">Section</li>
        <li><a href="/{ASSESS_KIND_LC}/section/modify/{SECTION_SECTION_ID}{RETURN_URL}"><sbx-icon name="modify"></sbx-icon>Modify</a></li>
        <li><a class="sbx-icon-only-button no-text"
               href="/{ASSESS_KIND_LC}/section/delete/{SECTION_SECTION_ID}{RETURN_URL}"
               data-delete-section
               title="Delete section"
               aria-label="Delete section">
            <sbx-icon name="delete"></sbx-icon>
            Delete
        </a></li>
        <li class="separator">Question</li>
        <li><a class="sbx-button--has-icon" href="/{ASSESS_KIND_LC}/question/create/{SECTION_SECTION_ID}{RETURN_URL}"><sbx-icon name="add"></sbx-icon>New Question</a></li>
        <li><a href="/{ASSESS_KIND_LC}/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}{RETURN_URL}"><sbx-icon name="download"></sbx-icon>Add from Question Bank</a></li>
    </ul>
</div>
<!-- BEGIN has_section_description -->
<div class="row">
    <div class="small-12 island">
        <section class="content">
            <article>{SECTION_DESCRIPTION}</article>
        </section>
    </div>
</div>
<!-- END has_section_description -->
<!-- BEGIN empty_description -->
<div class="empty-state">
    <p>There's no description for this section. <a href="/{ASSESS_KIND_LC}/section/modify/{SECTION_SECTION_ID}{RETURN_URL}">Add a description</a> to this section.</p>
</div>
<!-- END empty_description -->

<section>
    <ul class="action-list sortable-card" id="section{SECTION_SECTION_ID}" data-section-id="{SECTION_SECTION_ID}" data-question-list>
        <!-- BEGIN question -->
        <li class="actions-small-3" id="question_{QUESTION_QUESTION_ID}" data-question-id="{QUESTION_QUESTION_ID}">
            <div>
                <div class="grip"></div>
                <div class="list-item">
                    <div class="card small-12 wrap-down">
                        <h4>
                            <span data-seq>Q{QUESTION_SEQUENCE}</span>
                            <!-- BEGIN has_mark -->
                            <span class="meta">({QUESTION_MARKS} marks)</span>
                            <!-- END has_mark -->
                        </h4>
                    </div>
                    <article>{QUESTION_QUESTION}</article>
                </div>
            </div>
            <nav>
                <a class="sbx-icon-only-button no-text"
                   href="/{ASSESS_KIND_LC}/question/delete/{QUESTION_QUESTION_ID}{RETURN_URL}"
                   title="Delete"
                   data-delete-question
                   aria-label="Delete question">
                    <sbx-icon name="delete"></sbx-icon>
                </a>
                <a href="/{ASSESS_KIND_LC}/question/modify/{QUESTION_QUESTION_ID}{RETURN_URL}" title="Modify"><sbx-icon name="modify"></sbx-icon></a>
                <a href="/{ASSESS_KIND_LC}/questionbank/addQuestion/{QUESTION_QUESTION_ID}{RETURN_URL}" data-reveal-id="question-bank" data-reveal-ajax="true" title="Import into Question Bank"><sbx-icon name="download"></sbx-icon></a>
            </nav>
        </li>
        <!-- END question -->
    </ul>
</section>
<!-- END section -->

<div id="question-bank" class="reveal-modal" data-reveal></div>
<div id="bank-success" class="reveal-modal" data-reveal></div>
