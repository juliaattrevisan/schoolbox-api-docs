<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('[data-delete]').click(function (event) {
            event.preventDefault();
            $(this).confirmDialog();
        });

        /* Make questions sortable
         */
        $('[data-question-list]').sortable({
            handle: '.grip',
            axis: 'y',
            stop: function () {
                var allQuestions = $(this).children('li'),
                        data         = [];

                $.each(allQuestions, function (index, element) {
                    data.push(element.id);
                });

                /* Reorder questions upon reorder completion
                 */
                $.post('/{ASSESS_KIND_LC}/reorderQuestions/{ASSESS_ASSESS_ID}', {ids: data}, function () {
                    var sequence = 1;

                    allQuestions.each(function (index, element) {
                        var seq = $(element).find('[data-seq]');

                        seq.html(seq.text().trim().replace(/^Q\d+/, 'Q' + sequence));
                        sequence++;
                    });
                });
            }
        });
    });
</script>
<!-- END custom_head -->
        
<!-- BEGIN section -->
<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 columns">
            <h2 class="subheader">{SECTION_TITLE}</h2>
        </div>
    </div>
    <nav>
        <a href="#" class="icon-more" data-dropdown="section{SECTION_SECTION_ID}-options"></a>
    </nav>
    <ul class="f-dropdown" data-dropdown-content id="section{SECTION_SECTION_ID}-options">
        <li class="separator">Section</li>
        <li><a class="icon-modify" href="/{ASSESS_KIND_LC}/section/modify/{SECTION_SECTION_ID}">Modify</a></li>
        <li><a class="icon-delete" href="/{ASSESS_KIND_LC}/section/delete/{SECTION_SECTION_ID}" data-delete>Delete</a></li>
        <li class="separator">Question</li>
        <li><a class="icon-add" href="/{ASSESS_KIND_LC}/question/create/{SECTION_SECTION_ID}">New Question</a></li>
        <li><a class="icon-download" href="/{ASSESS_KIND_LC}/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}">Add from Question Bank</a></li>
    </ul>
</div>

<div class="content panel">
    <article>{SECTION_DESCRIPTION}</article>
</div>

<section>
    <ul class="action-list sortable" id="section{SECTION_SECTION_ID}" data-question-list>
        <!-- BEGIN question -->
        <li class="actions-small-3" id="question_{QUESTION_QUESTION_ID}" data-equalizer>
            <div class="list-item">
                <div class="grip"></div>
                <div class="avatar card small-11" data-equalizer-watch>
                    <h4>
                        <span data-seq>Q{QUESTION_SEQUENCE}</span>
                        <!-- BEGIN has_mark -->
                        <span class="meta">({QUESTION_MARKS} marks)</span>
                        <!-- END has_mark -->
                    </h4>
                </div>
                <article>{QUESTION_QUESTION}</article>
            </div>
            <nav>
                <a class="icon-delete" href="/{ASSESS_KIND_LC}/question/delete/{QUESTION_QUESTION_ID}" title="Delete" data-delete data-equalizer-watch></a>
                <a class="icon-modify" href="/{ASSESS_KIND_LC}/question/modify/{QUESTION_QUESTION_ID}" title="Modify" data-equalizer-watch></a>
                <a class="icon-download" href="/{ASSESS_KIND_LC}/questionbank/addQuestion/{QUESTION_QUESTION_ID}" data-reveal-id="question-bank" data-reveal-ajax="true" data-equalizer-watch title="Import into Question Bank"></a>
            </nav>
        </li>
        <!-- END question -->
    </ul>
</section>
<!-- END section -->

<div id="question-bank" class="reveal-modal" data-reveal></div>
<div id="bank-success" class="reveal-modal" data-reveal></div>
