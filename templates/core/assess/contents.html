<script type="text/javascript" src="/javascript/jquery.confirm.1.3.js"></script>
<script type="text/javascript">
$j(function() {

	$j('a.delete-question').click(function() {
		location.href = $j(this).attr('href');
	}).confirm({
		buttons: {
			wrapper:'<button></button>',
			separator:'  '
  		}
	});

	$j('.show-assess-options').click(function() {
		$j('.assessment-options').slideToggle();
		$j(this).toggleClass('active')
		return false;
	});
	
	$j('.show-section-options').click(function() {
		$j('.section-options').slideToggle();
		$j(this).toggleClass('active')
		return false;
	});

	
	$j(".show-assess-options, .show-section-options").hover(
	function () {
		$j(this).children('span').stop(true, true).fadeIn("fast");
		$j(this).css('background-image', "none");
	},
	function () {
		var $this = $j(this)
		$this.children('span').stop(true, true).fadeOut("fast", function() {
			$this.removeAttr('style');
		});
		
	});

});
</script>
<h2>Assessment Content</h2>
<div class="hide assessment-options pad-it clearfix">
<a href="/assess/modify/{ASSESS_ASSESS_ID}" class="btn modify float-left no-marg" ><span></span>Modify</a>
<a href="/assess/export/{ASSESS_ASSESS_ID}.xml" class="btn go-to float-left no-marg" ><span></span>Export</a>
<a href="/assess/delete/{ASSESS_ASSESS_ID}" onclick="return confirm('Are you sure you want to delete this assessment?');" class="btn delete float-left no-marg" ><span></span>Delete</a>
</div>
<a class="drop-arrow show-assess-options" href="#">&#x25BC;</a>	

<div class="allQuestions">
	<div class="assess-body">
	<a class="add-section" href="/assess/section/create/{ASSESS_ASSESS_ID}">Add sections to this assessment</a>
        <!-- BEGIN section -->
		<div class="section-box">
			<h3>Section {SECTION_SEQUENCE}: {SECTION_TITLE}<a class="drop-arrow show-section-options" href="#">&#x25BC;</a></h3>
			
			
			<div class="hide section-options pad-it clearfix">
				<a href="/assess/section/modify/{SECTION_SECTION_ID}" class="btn modify float-left"><span></span>Edit</a></li>
				<a onclick="return confirm('Are you sure you want to delete the section?');" href="/assess/section/delete/{SECTION_SECTION_ID}" class="btn delete float-left"><span></span>Delete</a>
			</div>

			<ul class="section-question">
				<!-- BEGIN question -->
				<li>
						<p><span>Q{QUESTION_SEQUENCE})</span> {QUESTION_QUESTION} - ({QUESTION_MARKS} marks)</p>
						<p class="pad-it"><a href="/assess/question/export/{QUESTION_QUESTION_ID}">Export</a> |
						<a href="/assess/question/modify/{QUESTION_QUESTION_ID}">Edit</a> |
						<a class="delete-question" href="/assess/question/delete/{QUESTION_QUESTION_ID}">Delete</a></p>
				</li>
				<!-- END question -->
			</ul>
	
            <a class="add-questions" href="/assess/question/create/{SECTION_SECTION_ID}"><span>Add a Question</span></a>
		</div>
        <!-- END section -->
	</div>
</div>
