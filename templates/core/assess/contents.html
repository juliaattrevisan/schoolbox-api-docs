<span class='header-actions'>
    <a href='#' class='button icon-more' data-dropdown='header-options'>Options</a>
</span>
<ul class='f-dropdown fadeInDown' data-dropdown-content='' id='header-options'>
    <li><a class="icon-add" href="/{ASSESS_KIND_LC}/section/create/{ASSESS_ASSESS_ID}">Add Section</a></li>
    <li><a class="icon-modify" href="/{ASSESS_KIND_LC}/modify/{ASSESS_ASSESS_ID}">Modify</a></li>
    <li><a class="icon-export" href="/{ASSESS_KIND_LC}/export/xml/{ASSESS_ASSESS_ID}">Export</a></li>
    <li><a class="icon-delete" href="/{ASSESS_KIND_LC}/delete/{ASSESS_ASSESS_ID}" data-delete>Delete</a></li>
</ul>

<h2 class="subheader">Sections</h2>

<!-- BEGIN section -->
<section>
    <ul class='information-list'>
        <li class="row">
            <div class="twelve-column">
                <span class='header-actions'>
                    <a class="icon-delete" href="/{ASSESS_KIND_LC}/section/delete/{SECTION_SECTION_ID}" data-delete></a>
                    <a class="icon-modify" href="/{ASSESS_KIND_LC}/section/modify/{SECTION_SECTION_ID}"></a>
                </span>

                <h3>{SECTION_TITLE}</h3>
            </div>
        </li>
    </ul>
    <ul class='information-list' id='section{SECTION_SECTION_ID}' data-question-list>
        <!-- BEGIN question -->
        <li class='row' id='question_{QUESTION_QUESTION_ID}'>
            <div class="twelve-column">
                <strong data-seq>
                    Q{QUESTION_SEQUENCE})
                    <!-- BEGIN has_mark -->
                    ({QUESTION_MARKS} marks)
                    <!-- END has_mark -->
                </strong>

                <article>{QUESTION_QUESTION}</article>

                <a class="button icon-delete" href="/{ASSESS_KIND_LC}/question/delete/{QUESTION_QUESTION_ID}" data-delete>Delete</a>
                <a class='button icon-modify' href="/{ASSESS_KIND_LC}/question/modify/{QUESTION_QUESTION_ID}">Modify</a>
            </div>
        </li>
        <!-- END question -->
    </ul>

    <a class="button icon-add" href="/{ASSESS_KIND_LC}/question/create/{SECTION_SECTION_ID}">New Question</a>
    <a class="button icon-download" href="/{ASSESS_KIND_LC}/questionbank/contents/0/{ASSESS_ASSESS_ID}/{SECTION_SECTION_ID}">Add from Question Bank</a>
</section>
<!-- END section -->

<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('[data-delete]').click(function (event) {
            event.preventDefault();
            $(this).confirmDialog();
        });

        /* Make questions sortable
         */
        $("[data-question-list]").sortable({
            placeholder: "sortable-placeholder",
            forcePlaceholderSize: true,
            stop: function () {
                var allQuestions = $(this).children('li'),
                        data         = [];

                $.each(allQuestions, function (index, element) {
                    data.push(element.id);
                });

                /* Reorder questions upon reorder completion
                 */
                $.post('/{ASSESS_KIND_LC}/reorderQuestions/{ASSESS_ASSESS_ID}', {ids: data}, function () {
                    var sequence = 1;

                    allQuestions.each(function (index, element) {
                        var strong = $(element).children('strong[data-seq]');

                        strong.html(strong.text().trim().replace(/^Q\d+/, 'Q' + sequence));
                        sequence++;
                    });
                });
            }
        })
        .disableSelection();
    });
</script>
