{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_SECTION_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Modify Question</h2>

        <form id="createQuestionForm" action="/assess/question/modify" class="top" method="post">
            <input name="section_id" type="hidden" value="{SECTION_ID}" />
            <input name="question_id" type="hidden" value="{QUESTION_ID}" />
            <input name="answer_id" type="hidden" value="{ANSWER_ID}" />
            <input name="sequence" type="hidden" value="{SEQUENCE}" />
            <input name="type_id" type="hidden" value="{QUESTIONTYPE_TYPE_ID}" />

            <section class="content">
                <h3>{QUESTIONTYPE_DESCRIPTION}</h3>

                <label>
                    Question
                    <textarea name="question" id="question">{QUESTION}</textarea>
                </label>

                <!-- BEGIN has_answer_configuration -->
                <fieldset>
                    <legend>Configuration Options</legend>
                    <!-- BEGIN answer_configuration -->

                    <!-- END answer_configuration -->
                </fieldset>
                <!-- END has_answer_configuration -->

                <label>
                    Marks
                    <input name="marks" type="text" size="3" value="{MARKS}"/>
                </label>

                <div>
                    <!-- BEGIN answerInputs -->

                    <!-- END answerInputs -->
                </div>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Modify" />
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
    $(function() {
        /* For the question part itself
         */
        $.fn.alaressTiny({
            mode: 'exact',
            elements: 'question',
            file_browser_category_id: '{ASSESS_CATEGORY_ID}',
            removeformat_selector: 'b,strong,em,i,span,ins',
            width: "100%"
        });

        /* Enforce two decimal places
         */
        $('input[name=marks]').change(function() {
            var val;

            /* Empty string is classified as a number
             */
            if (isNaN($(this).val()) || $(this).val() == '') {
                val = 0;
            }
            else {
                val = $(this).val();
            }

            $(this).val(parseFloat(val).toFixed(2));
        });
    });

    /* For overriding plugin redirection destination when modifying
     * questions inside the QuestionBank
     *
     * This must appear before injected html fragments
     */
    var questionBank = false;
</script>
