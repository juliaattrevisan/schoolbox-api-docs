<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jstree/jquery.jstree.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
    tinyMCE.init({
		mode : "exact",
		elements: "question",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
		content_css : "/css/core/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		file_browser_category_id : '{ASSESS_CATEGORY_ID}',
		tabfocus_elements : ":prev,:next",
		convert_urls : false,
		force_br_newlines : false,
		force_p_newlines : true
	});

	$j(function() {
		/* Enforce two decimal places
		 */
		$j('input[name=marks]').change(function() {
			$j(this).val(parseFloat($j(this).val()).toFixed(2));
		});

		/* Category tree
		 */
		$j("#categoryTree").jstree({
			"animation": 50,
			"plugins":["themes", "html_data", "dnd", "crrm"],
			"themes":{
				"theme":"schoolbox",
				"dots":true,
				"icons":false
			}
		});

        $j(".jstree a").click(function() {
            $this = $j(this),
            categoryFullID = $this.closest('li').attr('ID'),
            categoryStrippedID = parseInt(categoryFullID.substr(5));
            $j('#question_category').val(categoryStrippedID);
            $j(".jstree a").removeClass('active');
            $this.addClass('active');
            return false;
        });

    });
</script>
<!-- END custom_head -->
<h1>Modify Question</h1>
<div class="evaluation-content">
	<h2>Question Details</h2>

	<form id="createQuestionForm" action="/assess/question/modify" class="" method="post">
		<label class="hide">
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="question_id" type="hidden" value="{QUESTION_ID}" />
			<input name="answer_id" type="hidden" value="{ANSWER_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</label>

		<label>Type
			<input type="hidden" name="type_id" value="{QUESTIONTYPE_TYPE_ID}" />
			<span>{QUESTIONTYPE_DESCRIPTION}</span>
		</label>

		<label>Question
			<div class="textarea-container" id="question_container"><textarea name="question" class="mceSimple tinyValidate" id="question" />{QUESTION}</textarea></div>
		</label>

		<label>Marks
			<input name="marks" type="text" size="3" value="{MARKS}"/>
		</label>

		<div id="answer">
			<!-- BEGIN answerInputs -->

			<!-- END answerInputs -->
		</div>

		<p class="clearfix">
			<input type="submit" name="create" id="create" value="Modify" class="submit-btn-plain"/>
		</p>
	</form>

	<h2>Import into Question Bank</h2>

	<form action='/assess/questionbank/addQuestion' class='' method='post'>
		<p>
			Puts this question into the Question Bank so you can import
			them into other Online Assessments.
		</p>
		<label class="hide">
			<input name='type_id' type='hidden' value='{QUESTIONTYPE_TYPE_ID}' />
			<input name='question_id' type='hidden' value='{QUESTION_ID}' />
			<input name='answer_id' type='hidden' value='{ANSWER_ID}' />
			<input name='marks' type='hidden' value='{MARKS}' />
		</label>
		<label>
			Question Category
			<div id='categoryTree'>
				<!-- BEGIN category_list_start -->
				<ul>
				<!-- END category_list_start -->

					<!-- BEGIN category_list_item_start -->
					<ul>
					<!-- END category_list_item_start -->

						<!-- BEGIN category_list_item -->
						<li id='{CATEGORY_LIST_ITEM_NODE}' class='{CATEGORY_LIST_ITEM_SELECTED}'>
							<a href='#'>
								{CATEGORY_LIST_ITEM_NAME} ({CATEGORY_LIST_ITEM_NUMQUESTIONS})
							</a>
						<!-- END category_list_item -->

					<!-- BEGIN category_list_item_end -->
					</ul>
					</li>
					<!-- END category_list_item_end -->
				</ul>
			</div>
			<input type='hidden' name='question_category' type='hidden' id="question_category"/>
		</label>

		<p class="clearfix">
			<input type='submit' class='submit-btn-plain' value='Add To Question Bank' />
		</p>
	</form>
</div>
