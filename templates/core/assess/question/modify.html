<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
	tinyMCE.init({
        mode : "exact",
		elements: "question",
        theme : "advanced",
        skin : "cirkuit",
        plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,paste,spellchecker",
        content_css : "/css/core/tiny.css",
        theme_advanced_toolbar_location : "top",
        theme_advanced_toolbar_align : "left",
        theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "separator,bold,italic,underline,separator,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
        theme_advanced_buttons2 : "spellchecker,separator,selectall,pastetext,pasteword,separator,removeformat,cleanup,code,separator,outdent,indent,sub,sup,separator,hr,charmap,tablecontrols",
		theme_advanced_buttons3 : "",
        pdw_toggle_on : 1,
        pdw_toggle_toolbars : '2',
        extended_valid_elements : "img[src|border|alt=|title|hspace|vspace|width|height|align|style]",
        theme_advanced_blockformats : "p,address,h4,h5",
        tabfocus_elements : ":prev,:next",
        convert_urls : false,
		width:"100%",
		force_p_newlines : false,
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
        file_browser_category_id : 0
	});
</script>
<!-- END custom_head -->
	<h1>Modify Question</h1>
	<div class="evaluation-content">
		<h2>Question Details</h2>
		<form id="createQuestionForm" action="/assess/question/modify" class="" method="post">

		<label class="hide">
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="question_id" type="hidden" value="{QUESTION_ID}" />
			<input name="answer_id" type="hidden" value="{ANSWER_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</label>

		<label>Type
			<input type="hidden" name="type_id" value="{QUESTIONTYPE_TYPE_ID}" />
			<span>{QUESTIONTYPE_DESCRIPTION}</span>
		</label>

		<label>Question
			<div class="textarea-container" id="question_container"><textarea name="question" class="mceSimple tinyValidate" id="question" />{QUESTION}</textarea></div>
		</label>

		<label>Marks
			<input name="marks" type="text" size="3" value="{MARKS}"/>
		</label>

		<div id="answer">
			<!-- BEGIN answerInputs -->

			<!-- END answerInputs -->
		</div>

		<p class="clearfix">
			<input type="submit" name="create" id="create" value="Modify" class="submit-btn-plain"/>
		</p>
	</form>
	
	
	<h2>Import into Question Bank</h2>

	
	<form action='/assess/questionbank/create' class='' method='post'>
	
	<p>
		Puts this question into the Question Bank so you can import
		them into other Online Assessments.
	</p>
		<label class="hide">
			<input name='type_id' type='hidden' value='{QUESTIONTYPE_TYPE_ID}' />
			<input name='question_id' type='hidden' value='{QUESTION_ID}' />
			<input name='answer_id' type='hidden' value='{ANSWER_ID}' />
			<input name='marks' type='hidden' value='{MARKS}' />
		</label>
		<label>Question Category
				<select name='question_category'>
					<!-- BEGIN question_category -->
					<option value='{QUESTION_CATEGORY_ID}'>{QUESTION_CATEGORY_NAME}</option>
					<!-- END question_category -->
				</select>
		</label>

		<p class="clearfix">
			<input type='submit' class='submit-btn-plain' value='Add To Question Bank' />
		</p>
		
	</form>
	</div>
	<div class="evaluation-menu">

	<!-- END allQuestions -->
	</div>
