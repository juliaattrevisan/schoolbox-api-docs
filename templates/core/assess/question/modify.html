<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<!-- END custom_head -->

<h1>Modify Question</h1>
<form name="create" action="/assess/question/modify" class="standardForm" method="post">
    <fieldset>
        <input name="section_id" type="hidden" value="{SECTION_ID}" />
        <input name="question_id" type="hidden" value="{QUESTION_ID}" />
        <input name="sequence" type="hidden" value="{SEQUENCE}" />
    </fieldset>

    <fieldset>
        <label>Type</label>
        <input type="hidden" name="type_id" value="{QUESTIONTYPE_TYPE_ID}" />
        <input type="text" readonly="readonly" value="{QUESTIONTYPE_DESCRIPTION}" />
    </fieldset>

    <fieldset>
        <label>Question</label>
        <input name="question" type="text" size="35" value="{QUESTION}" />
    </fieldset>

    <fieldset>
        <label>Marks</label>
        <input name="marks" type="text" size="3" value="{MARKS}"/>
    </fieldset>

    <div id="answer">
        {ANSWER_INPUTS}
    </div>

    <fieldset>
        <input type="submit" name="create" id="create" value="Modify Question" class="btn"/>
    </fieldset>
</form>

<h2>Questions</h2>
<div class="allQuestions">
    <!-- BEGIN section -->
    <div>
        <h3><a href="/assess/section/modify/{SECTION_SECTION_ID}"> Section {SECTION_SEQUENCE}: {SECTION_TITLE}</a></h3>
        <ul>
            <!-- BEGIN question -->
            <li>
                <p>
                    <span>Q{QUESTION_SEQUENCE})</span>
                    {QUESTION_QUESTION}<br />
                    <a href="/assess/question/modify/{QUESTION_QUESTION_ID}">Edit</a>
                </p>
            </li>
            <!-- END question -->
        </ul>
    </div>
    <!-- END section -->
</div>
