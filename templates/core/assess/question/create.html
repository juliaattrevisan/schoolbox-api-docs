{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{CURRENT_SECTION_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form id="createQuestionForm" action="/{ASSESS_KIND_LC}/question/create" method="post">
            <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
            <input name="section_id" type="hidden" value="{SECTION_ID}" />
            <input name="sequence" type="hidden" value="{SEQUENCE}" />
            <input name="{RETURN_URL_NAME}" type="hidden" value="{RETURN_URL}" />

            <h2 class="subheader">Create Question</h2>
            <section>
                <fieldset class="content">
                    <div class="column small-12">
                        <legend>Question Type</legend>
                        <select name="type_id" id="type_id" data-question-type-select>
                            <option disabled {DISABLED_SELECTED} value='-1'>-- Select Type --</option>
                            <!-- BEGIN questionType -->
                            <option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
                            <!-- END questionType -->
                        </select>
                    </div>
                </fieldset>

                <!-- BEGIN type_selected -->
                <fieldset class="content">
                    <div class="column small-12">
                        <legend>Question</legend>
                        <textarea name="question" id="question">{QUESTION}</textarea>
                    </div>
                </fieldset>

                <!-- BEGIN has_answer_configuration -->
                <fieldset class="content">
                    <div class="small-12 column">
                        <legend>Configuration Options</legend>
                        <!-- BEGIN answer_configuration -->
                        <!-- END answer_configuration -->
                    </div>
                </fieldset>
                <!-- END has_answer_configuration -->

                <!-- BEGIN has_marks -->
                <fieldset class="content">
                    <div class="column small-12">
                        <legend>Marks</legend>
                        <input data-marks name="marks" type="text" size="3" value="{MARKS}" />
                    </div>
                </fieldset>
                <!-- END has_marks -->

                <!-- BEGIN answerInputs -->
                <!-- END answerInputs -->

                <!-- END type_selected -->
            </section>
            <label>
                <input class='expand' type="submit" value="Add Question" {SUBMIT_DISABLED} />
            </label>
        </form>
    </div>
</div>

<script type="text/javascript" src="{CDN_PREFIX}/js/ckeditor/ckeditor.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/editor/jquery.editor.js?v={SITE_VERSION}"></script>

<script type="text/javascript">
    $(function() {
        var section_id = '{SECTION_ID}';

        /* For the question part itself
         */
        $.fn.alaressEditor({
            targetElements: $('#question'),
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        /* Change state
         */
        $('#type_id').change(function() {
            window.location = '/{ASSESS_KIND_LC}/question/create/' + section_id + '/' + $('#type_id').val() + '?{RETURN_URL_NAME}={RETURN_URL}';
        });

        /* Enforce two decimal places
         * and limit mark upper limit to 10000
         */
        $('[data-marks]').change(function() {
            var marks = parseFloat($(this).val()).toFixed(2);

            /* limit mark to 10000
             */
            if (10000 <= marks) {
                marks = 10000;
            }

            if (isNaN(marks)) {
                marks = '';
            }

            $(this).val(marks);
        });
    });
</script>
