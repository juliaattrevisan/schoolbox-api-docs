<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.prettyFileInput.js"></script>
<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
$j(document).ready(function() {

	$j('.prettify').prettyFileInput({
		additionalButtonClasses: 'no-marg float-left',
		buttonActiveClass: 'tick',
		defaultText: '<span></span>Choose file',
		defaultFileSelectedText: '<span></span>File selected'
	});

    var section_id = '{SECTION_ID}';

	/* Set current state of dropdown
	 * Can't get val() of a disabled option element
	 */
	if ($j('.question-type-select :selected').text() == '-- Select Type --') {
		$j('.next-stepm,.question-holder,.marks-holder, #importQuestion').hide();
	}
	else {
		if ($j('#type_id').val() == 'import') {
			$j('.next-step,.question-holder,.marks-holder,#create').hide();
			$j('#importQuestion').show();
		}
		else {
			$j('.next-step, .question-holder, .marks-holder').show();
			$j('#importQuestion').hide();
		}
	}


	if ($j('.question-type-select :selected').text() == 'Import Question') {
		$j('.xml-add').show();
	}

	/* Change state
	 */
	$j('#type_id').change(function() {
		var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
		window.location = url;
	});

    tinyMCE.init({
		mode : "exact",
		elements: "question",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
		content_css : "/css/core/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		file_browser_category_id : 0,
		tabfocus_elements : ":prev,:next",
		convert_urls : false,
		force_br_newlines : false,
		force_p_newlines : true
	});

	tinyMCE.init({
		mode : "textareas",
		editor_selector: "richtext-answer",
		theme : "advanced",
		skin : "cirkuit",
		plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
		content_css : "/css/core/tiny.css",
		theme_advanced_toolbar_location : "top",
		theme_advanced_toolbar_align : "left",
		theme_advanced_statusbar_location : "bottom",
		theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
		theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
		theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
		theme_advanced_buttons4 : "tablecontrols",
		pdw_toggle_on : 1,
		pdw_toggle_toolbars : '2, 3, 4',
		extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
		file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
		file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
		file_browser_category_id : 0,
		tabfocus_elements : ":prev,:next",
		convert_urls : false,
		force_br_newlines : false,
		force_p_newlines : true
	});

	/* Enforce two decimal places
	 */
	$j('input[name=marks]').change(function() {
		$j(this).val(parseFloat($j(this).val()).toFixed(2));
	});
});
</script>

<!-- END custom_head -->
<h1>Create Question in Section {CURRENT_SECTION_TITLE}</h1>
<div class="evaluation-content">
	<h2>Question Details</h2>
	<form id="createQuestionForm" action="/assess/question/create" class="clearfix" method="post">

		<p class="help">
			Now that you've created a section for the test, use the drop down below to select a question type.
		</p>

		<label class="hide">
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</label>

		<label><strong>Type</strong>
			<select name="type_id" id="type_id" class="question-type-select">
				<option disabled {DISABLED_SELECTED} value='-1'>-- Select Type --</option>
				<!-- BEGIN questionType -->
				<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
				<!-- END questionType -->
				<option value="import" {IMPORT_SELECTED}>Import Question</option>
			</select>
		</label>

		<label class="question-holder">Question
			<div class="textarea-container" id="question_container">
				<input name="question" class="mceSimple tinyValidate" id="question" type="text" size="35" value="{QUESTION}" />
			</div>
		</label>

		<label class="marks-holder">Marks
			<input name="marks" type="text" size="3" value="{MARKS}"/>
		</label>

		<div id="answer">
			<!-- BEGIN answerInputs -->

			<!-- END answerInputs -->
		</div>

		<p class="clearfix">
			<input type="submit" name="create" id="create" value="Add Question" class="submit-btn-plain"/>
		</p>
	</form>
	<div class="hide xml-add">
		<h2>Import a question and answer from an XML file</h2>
		<form action="/assess/question/import/{SECTION_ID}" method="post" class="clearfix" enctype="multipart/form-data">
			<p>Select an Assess Question XML file to import.</p>
			<label class="clearfix"><strong>File</strong>
				<input name="importXML" type="file" class="prettify"/>
			</label>

			<p class="clearfix">
				<input type="submit" value="Import from XML file"  class="submit-btn-plain float-none no-marg"/>
			</p>
		</form>
	</div>
</div>

<div class="evaluation-menu">

</div>
