<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<script type="text/javascript">
$j(document).ready(function() {
    var section_id = '{SECTION_ID}';

    $j('#type_id').change(function() {
        var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
        window.location = url;
    });
});
</script>

<!-- END custom_head -->
<div id="assess">
<h1>Create Question in Section {CURRENT_SECTION_TITLE}</h1>

<div class="col-1">
	<div class="assess-header">
		<h2>Question Details</h2>
		<div class="assess-body">
		<form id="createQuestionForm" action="/assess/question/create" class="standardForm" method="post">
			<fieldset class="hidden">
				<input name="section_id" type="hidden" value="{SECTION_ID}" />
				<input name="sequence" type="hidden" value="{SEQUENCE}" />
			</fieldset>
		
			<fieldset>
				<label>Type</label>
				<select name="type_id" id="type_id">
					<option disabled {DISABLED_SELECTED}>-- Select Type --</option>
					<!-- BEGIN questionType -->
					<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
					<!-- END questionType -->
				</select>
			</fieldset>
		
			<fieldset>
				<label>Question</label>
				<input name="question" type="text" size="35" value="{QUESTION}" />
			</fieldset>
		
			<fieldset>
				<label>Marks</label>
				<input name="marks" type="text" size="3" value="{MARKS}"/>
			</fieldset>
		
			<div id="answer">
				<!-- BEGIN answerInputs -->
		
				<!-- END answerInputs -->
			</div>
		
			<fieldset>
				<input type="submit" name="create" id="create" value="Add Question" class="add-question"/>
			</fieldset>
		</form>
		</div>
	</div>
</div>
<div class="col-2">
<!-- BEGIN allQuestions -->

<!-- END allQuestions -->
</div>
</div>
