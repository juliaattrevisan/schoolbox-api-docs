<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    var section_id = '{SECTION_ID}';

	if (($j('.question-type-select :selected').text()) == "-- Select Type --") {
		$j('.next-step').hide();
		$j('.question-holder').hide();
		$j('.marks-holder').hide();
		$j('#create').hide();
	}

	if (($j('.question-type-select :selected').text()) !== "-- Select Type --") {
		$j('#type_id').change(function() {
			var answer = confirm ("If you change the question type any text you've entered will be lost. Proceed?")
			if (answer) {
				var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
				window.location = url;			
				$j('.next-step').show();
				$j('.question-holder').show();
				$j('.marks-holder').show();
			} 
		});
	} else {
		$j('#type_id').change(function() {
			var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
			window.location = url;			
			$j('.next-step').show();
			$j('.question-holder').show();
			$j('.marks-holder').show();

		});	
	}


	
	
	tinyMCE.init({
        mode : "exact",
		elements: "question",
        theme : "advanced",
        skin : "cirkuit",
        plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,paste,spellchecker",
        content_css : "/css/{SITE_LOCATION}/tiny.css",
        theme_advanced_toolbar_location : "top",
        theme_advanced_toolbar_align : "left",
        theme_advanced_statusbar_location : "bottom",
        theme_advanced_buttons1 : "formatselect,fontsizeselect,forecolor,separator,bold,italic,underline,separator,justifyleft,justifycenter,justifyright,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
        theme_advanced_buttons2 : "spellchecker,separator,selectall,pastetext,pasteword,separator,removeformat,cleanup,code,separator,outdent,indent,sub,sup,separator,hr,charmap,tablecontrols",
        theme_advanced_buttons3 : "",
        pdw_toggle_on : 1,
        pdw_toggle_toolbars : '2',
        extended_valid_elements : "img[src|border|alt=|title|hspace|vspace|width|height|align|style]",
        theme_advanced_blockformats : "p,address,h4,h5",
        tabfocus_elements : ":prev,:next",
        convert_urls : false,
		width:"100%",
		force_p_newlines : false
	});	
	
	
	
	
	
	
	
	
	

	
	
});
</script>

<!-- END custom_head -->
<div id="assess" class="create-test">
<h1>Create Question in Section {CURRENT_SECTION_TITLE}</h1>

<div class="col-1">
	<div class="assess-header">
		<h2>Question Details</h2>
		<div class="assess-body">
		
			<p class="help">
				Now that you've created a section for the test, use the drop down below to select a question type.
			</p>
			
			<form id="createQuestionForm" action="/assess/question/create" class="standardForm" method="post">
				<fieldset class="hidden">
					<input name="section_id" type="hidden" value="{SECTION_ID}" />
					<input name="sequence" type="hidden" value="{SEQUENCE}" />
				</fieldset>
			
				<fieldset>
					<label>Type</label>
					<select name="type_id" id="type_id" class="question-type-select">
						<option disabled {DISABLED_SELECTED}>-- Select Type --</option>
						<!-- BEGIN questionType -->
						<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
						<!-- END questionType -->
					</select>
				</fieldset>
			
				<fieldset class="question-holder">
					<label>Question</label>
					<div class="textarea-container">
						<input name="question" class="mceSimple tinyValidate" id="question" type="text" size="35" value="{QUESTION}" />
					</div>
				</fieldset>
			
				<fieldset class="marks-holder">
					<label>Marks</label>
					<input name="marks" type="text" size="3" value="{MARKS}"/>
				</fieldset>
			
				<div id="answer">
					<!-- BEGIN answerInputs -->
			
					<!-- END answerInputs -->
				</div>
				<input type="submit" name="create" id="create" value="Add Question" class="submit-btn-plain"/>
				<div class="float-fix"></div>
			</form>
		</div>

		<br><br>

		<h2>Import a question and answer from an XML file</h2>
		<div class="assess-body">
			<p class="help">
				Select an Assess Question XML file to import.
			</p>

			<form action="/assess/question/import/{SECTION_ID}" method="post" class="standardForm" enctype="multipart/form-data">
				<fieldset>
					<label>File</label>
					<input name="importXML" type="file" />
				</fieldset>

				<input type="submit" value="Import from XML file"  class="submit-btn-plain float-none"/>
				<div class="float-fix"></div>
			</form>
		</div>
	</div>
</div>
<div class="col-2">
<!-- BEGIN allQuestions -->

<!-- END allQuestions -->
</div>
</div>
