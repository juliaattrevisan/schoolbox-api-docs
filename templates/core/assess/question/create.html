<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    var section_id = '{SECTION_ID}';

    $j('#type_id').change(function() {
        var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
        window.location = url;
    });
	
	if (($j('.question-type-select :selected').text()) == "-- Select Type --") {
	$j('.add-question').hide();
	}
	
	
	
	$j('.question-type-select').change(function() {
		$j('.add-question').show();
	});
	

tinyMCE.init({
		mode : "exact",
		elements: "question",
		theme : "simple",
		content_css : "/css/core/screen.css",
		editor_selector : "mceSimple",
		width : "100%",
		forced_root_block : "",
		force_p_newlines : false,
		// update validation status on change
		 onchange_callback: function(editor) {
			 tinyMCE.triggerSave();
			 $j("#" + editor.id).valid();
		 } 
	});

	$j(".standardForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 });
	
});
</script>

<!-- END custom_head -->
<div id="assess">
<h1>Create Question in Section {CURRENT_SECTION_TITLE}</h1>

<div class="col-1">
	<div class="assess-header">
		<h2>Question Details</h2>
		<div class="assess-body">
		<form id="createQuestionForm" action="/assess/question/create" class="standardForm" method="post">
			<fieldset class="hidden">
				<input name="section_id" type="hidden" value="{SECTION_ID}" />
				<input name="sequence" type="hidden" value="{SEQUENCE}" />
			</fieldset>
		
			<fieldset>
				<label>Type</label>
				<select name="type_id" id="type_id" class="question-type-select">
					<option disabled {DISABLED_SELECTED}>-- Select Type --</option>
					<!-- BEGIN questionType -->
					<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
					<!-- END questionType -->
				</select>
			</fieldset>
		
			<fieldset>
				<label>Question</label>
				<div class="textarea-container"><input name="question" class="mceSimple" id="question" type="text" size="35" value="{QUESTION}" /></div>
			</fieldset>
		
			<fieldset>
				<label>Marks</label>
				<input name="marks" type="text" size="3" value="{MARKS}"/>
			</fieldset>
		
			<div id="answer">
				<!-- BEGIN answerInputs -->
		
				<!-- END answerInputs -->
			</div>
		
			<fieldset>
				<input type="submit" name="create" id="create" value="Add Question" class="add-question"/>
			</fieldset>
		</form>
		</div>
	</div>
</div>
<div class="col-2">
<!-- BEGIN allQuestions -->

<!-- END allQuestions -->
</div>
</div>
