<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    var section_id = '{SECTION_ID}';

	if (($j('.question-type-select :selected').text()) == "-- Select Type --") {
		$j('.next-step').hide();
		$j('.question-holder').hide();
		$j('.marks-holder').hide();
	}

	if (($j('.question-type-select :selected').text()) !== "-- Select Type --") {
		$j('#type_id').change(function() {
			var answer = confirm ("If you change the section any text you've entered will be lost. Proceed?")
			if (answer) {
				var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
				window.location = url;			
				$j('.next-step').show();
				$j('.question-holder').show();
				$j('.marks-holder').show();
			} 
		});
	} else {
		$j('#type_id').change(function() {
			var url = '/assess/question/create/' + section_id + '/' + $j('#type_id').val();
			window.location = url;			
			$j('.next-step').show();
			$j('.question-holder').show();
			$j('.marks-holder').show();

		});	
	}

	tinyMCE.init({
		mode : "exact",
		elements: "question",
		theme : "simple",
		content_css : "/css/core/screen.css",
		editor_selector : "mceSimple",
		width : "100%",
		forced_root_block : "",
		force_p_newlines : false
	});
	
});
</script>

<!-- END custom_head -->
<div id="assess" class="create-test">
<h1>Create Question in Section {CURRENT_SECTION_TITLE}</h1>

<div class="col-1">
	<div class="assess-header">
		<h2>Question Details</h2>
		<div class="assess-body">
		
		<p class="help">
		Now that you've created a section for the test, use the drop down below to select a question type.
		</p>
		
		<form id="createQuestionForm" action="/assess/question/create" class="standardForm" method="post">
			<fieldset class="hidden">
				<input name="section_id" type="hidden" value="{SECTION_ID}" />
				<input name="sequence" type="hidden" value="{SEQUENCE}" />
			</fieldset>
		
			<fieldset>
				<label>Type</label>
				<select name="type_id" id="type_id" class="question-type-select">
					<option disabled {DISABLED_SELECTED}>-- Select Type --</option>
					<!-- BEGIN questionType -->
					<option value="{QUESTIONTYPE_TYPE_ID}" {QUESTIONTYPE_SELECTED}>{QUESTIONTYPE_DESCRIPTION}</option>
					<!-- END questionType -->
				</select>
			</fieldset>
		
			<fieldset class="question-holder">
				<label>Question</label>
				<div class="textarea-container"><input name="question" class="mceSimple tinyValidate" id="question" type="text" size="35" value="{QUESTION}" /></div>
			</fieldset>
		
			<fieldset class="marks-holder">
				<label>Marks</label>
				<input name="marks" type="text" size="3" value="{MARKS}"/>
			</fieldset>
		
			<div id="answer">
				<!-- BEGIN answerInputs -->
		
				<!-- END answerInputs -->
			</div>
		
			<fieldset>
				<input type="submit" name="create" id="create" value="Add Question" class="next-step"/>
			</fieldset>
		</form>
		</div>
	</div>
</div>
<div class="col-2">
<!-- BEGIN allQuestions -->

<!-- END allQuestions -->
</div>
</div>
