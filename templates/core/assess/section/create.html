{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Create Section</h2>
        <form name="create" action="/assess/section/create" id="createSection" method="post" class="top">
            <section class="content">
                <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
                <input name="section_id" type="hidden" value="{SECTION_ID}" />
                <input name="sequence" type="hidden" value="{SEQUENCE}" />

                <label>
                    Section Title
                    <input name="title" type="text" size="35" class="required"/>
                </label>

                <label>
                    Shuffle Questions
                    <span class="hint has-tip tip-top" data-tooltip title="Questions should be selected randomly">?</span>
                </label>
                <div class="switch">
                    <input name="random" id="random" type="checkbox" value="1" data-shuffle />
                    <label for="random"></label>
                </div>

                <label class="hide" data-max-questions-prompt>
                    Maximum number of questions to show
                    <input name="pool" disabled="disabled" type="text" data-max-questions />
                </label>

                <label>
                    Description
                    <textarea name="description"></textarea>
                </label>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Create Section" />
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>

<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode: 'exact',
            elements: 'description',
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        $('[data-shuffle]').change(function() {
            var prompt = $('[data-max-questions-prompt]');
            var input = prompt.find('[data-max-questions]');

            if (prompt.hasClass("hide")) {
                input.prop('disabled', false);
            }
            else {
                input.prop('disabled', true);
            }

            prompt.toggleClass('hide');
        });

        jQuery.validator.addMethod("combo", function(value, element)
            {
                if (($('[data-shuffle]').is(':checked')) && ($('[data-max-questions]').val() == ""))
                {
                    return false;
                }
                else return true;
            },
            "You've selected random selection of questions. Please enter the number of questions to put in the pool."
        );

        $('#createSection').alaressValidate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                },
                pool: {
                    number:true,
                    combo: true
                }
            },
            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            }
        });
    });
</script>
