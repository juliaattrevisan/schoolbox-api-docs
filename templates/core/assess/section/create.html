<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript">

$j(function() {

	$j('.checkbox').click(function() {	
		if ($j('.hide-this').is(":visible")) {
			$j('.hide-this :input').attr('disabled', 'true');
		} else {
			$j('.hide-this :input').removeAttr('disabled');	
		}
		$j('.hide-this').toggle();
	});
	
	jQuery.validator.addMethod("combo", function(value, element) 
		{
		if (($j('.checkbox').is(':checked')) && ($j('.pool').val() == ""))
		{
		  return false;
		}
		else return true;
	  },
	  "You've selected random selection of questions. Please enter the number of questions to put in the pool."
	);	
	
	$j('#createSection').validate({
		rules: {
			title: {
				required: true,
				minlength: 2
			},
			pool: {
				number:true,
				combo: true
			}
		},
		
		messages: {
			title: "Please enter a title",
			description: "Please enter a description"
		}
	});
});
</script>
<!-- END custom_head -->
<div id="assess">
<h1>Create Section in {ASSESS_TITLE}</h1>
<div class="col-1">

	<div class="assess-header">
		<h2>Section Details</h2>
		<div class="assess-body">
		
		<form name="create" action="/assess/section/create" id="createSection" method="post">
		<fieldset class="hidden">
			<input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</fieldset>
			<fieldset>
				<label>Section Title</label>
				<label><input name="title" type="text" size="35" class="required"/></label>
			</fieldset>
			<hr />
			<fieldset>
				<label>Shuffle Questions</label>
				<input name="random" type="checkbox" value="1" class="checkbox"/> Questions should be selected randomly
			</fieldset>
			<hr />
			<fieldset class="hide-this">
				<label>Total Questions Displayed</label>
				<input name="pool" disabled="disabled" type="text" class="pool" /> Maximum number of questions to show
			<hr />
			</fieldset>

			<fieldset>
				<label>Description</label>
				<div class="textarea-container">
				<textarea name="description"></textarea>
				</div>
			</fieldset>
			
					<fieldset>
			<input type="submit" id="create" value="Create Section" class="submit-btn-plain float-right"/>
		</fieldset>
	</form>
		</div>
		</div>
		</div>
<div class="col-2">

<!-- BEGIN allQuestions -->

<!-- END allQuestions -->
</div>
</div>
