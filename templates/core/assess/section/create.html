<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<!-- END custom_head -->

<h1>Create Section in {ASSESS_TITLE}</h1>
<form name="create" action="/assess/section/create" class="standardForm" method="post">
    <fieldset>
        <input name="assess_id" type="hidden" value="{ASSESS_ID}" />
        <input name="section_id" type="hidden" value="{SECTION_ID}" />
        <input name="sequence" type="hidden" value="{SEQUENCE}" />
    </fieldset>

    <fieldset>
        <label>Section Title</label>
        <input name="title" type="text" size="35" />
    </fieldset>

    <fieldset>
        <label>Random</label>
        <input name="random" type="checkbox" value="1"/> Questions should be selected randomly
    </fieldset>

    <fieldset>
        <label>Pool</label>
        <input name="pool" type="text" /> Maximum number of questions to show
    </fieldset>

    <fieldset>
        <label>Description</label>
        <textarea name="description"></textarea>
    </fieldset>

    <fieldset>
        <input type="submit" id="create" value="Create Section" class="btn"/>
    </fieldset>
</form>

<h2>Questions</h2>
<div class="allQuestions">
    <!-- BEGIN section -->
    <div>
        <h3><a href="/assess/section/modify/{SECTION_SECTION_ID}"> Section {SECTION_SEQUENCE}: {SECTION_TITLE}</a></h3>
        <ul>
            <!-- BEGIN question -->
            <li>
                <p>
                    <span>Q{QUESTION_SEQUENCE})</span>
                    {QUESTION_QUESTION}<br />
                    <a href="/assess/question/modify/{QUESTION_QUESTION_ID}">Edit</a>
                </p>
            </li>
            <!-- END question -->
        </ul>
    </div>
    <!-- END section -->
</div>
