{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>{SECTION_TITLE}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Modify Section</h2>
        <form name="create" action="/assess/section/modify" id="modifySection" method="post" class="top">
            <input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
            <input name="section_id" type="hidden" value="{SECTION_ID}" />
            <input name="sequence" type="hidden" value="{SEQUENCE}" />

            <section class="content">
                <label>
                    Section Title
                    <input name="title" type="text" maxlength="50" value="{TITLE}" />
                </label>

                <label>
                    Shuffle Questions
                    <span class="hint has-tip tip-top" data-tooltip title="Questions should be selected randomly">?</span>
                </label>
                <div class="switch">
                    <input name="random" id="random" type="checkbox" value="1" {RANDOM_SELECTED} data-shuffle />
                    <label for="random"></label>
                </div>

                <label class="hide" data-max-questions-prompt>
                    Maximum number of questions to show
                    <input name="pool" disabled="disabled" type="text" data-max-questions value="{POOL}" />
                </label>

                <label>
                    Description
                    <textarea name="description">{DESCRIPTION}</textarea>
                </label>
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Modify Section" />
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>

<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode: 'exact',
            elements: 'description',
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        if ($('[data-shuffle]').prop("checked")) {
            var prompt = $('[data-max-questions-prompt]');
            var input = prompt.find('[data-max-questions]');

            prompt.removeClass('hide');
            input.prop('disabled', false);
        }

        $('[data-shuffle]').change(function() {
            if (prompt.hasClass("hide")) {
                input.prop('disabled', false);
            }
            else {
                input.prop('disabled', true);
            }

            prompt.toggleClass('hide');
        });

        $('#modifySection').validate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                }
            },

            messages: {
                title: "Please enter a title",
                description: "Please enter a description"
            }
        });
    });
</script>
