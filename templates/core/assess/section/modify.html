<!-- BEGIN custom_head -->
<script type="text/javascript">

$j(function() {
		
	if ($j('.checkbox').attr("checked")) {
		$j('.hide-this').show();
		$j('.hide-this :input').removeAttr('disabled');	
	}
	
	$j('.checkbox').click(function() {	
		if ($j('.hide-this').css("display") == "block") {
			$j('.hide-this').hide();
			$j('.hide-this :input').attr('disabled', 'true');
		} else {
			$j('.hide-this').show();
			$j('.hide-this :input').removeAttr('disabled');	
		}
		
	});
	
	jQuery.validator.addMethod(
	  "combo",
	  function(value, element) {
		if ($j('.checkbox').is(':checked'))
		{
		  return false;
		}
		else return true;
	  },
	  "You've selected random selection of questions. Please enter the amount of questions to put in the pool."
	);	
	
	$j('#modifySection').validate({
		rules: {
			title: {
				required: true,
				minlength: 2
			},
			pool: {
				combo: true
			}
		},
		
		messages: {
			title: "Please enter a title",
			description: "Please enter a description"
		}
	});
});
</script>
<!-- END custom_head -->

<h1>Modify Section {TITLE} in {ASSESS_TITLE}</h1>
<div class="evaluation-content">
	<h2>Section Details</h2>
	
	<form name="create" action="/assess/section/modify" class="" id="modifySection" method="post">
		<label class="hide">
			<input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
			<input name="section_id" type="hidden" value="{SECTION_ID}" />
			<input name="sequence" type="hidden" value="{SEQUENCE}" />
		</label>

		<label>Section Title
			<input name="title" type="text" size="35" value="{TITLE}" />
		</label>
		

		<label><strong>Shuffle Questions</strong>
			<input name="random" type="checkbox" class="checkbox" value="1" {RANDOM_SELECTED} /><span>Questions should be selected randomly</span>
		</label>
	
		<label class="hide">
			Total Questions Displayed
			<input name="pool" type="text" disabled="disabled" class="pool" value="{POOL}"/> Maximum number of questions to show
		</label>
	
		<label>Description
			<div class="textarea-container"><textarea name="description">{DESCRIPTION}</textarea></div>
		</label>
	
		<label class="clearfix ">
			<input type="submit" id="create" value="Modify" class="submit-btn-plain no-marg">
		</label>
	</form>
</div>
