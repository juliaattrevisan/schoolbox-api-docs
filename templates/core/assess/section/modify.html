<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<script type="text/javascript">

$j(function() {
		
	if ($j('.checkbox').attr("checked")) {
		$j('.hide-this').show();
		$j('.hide-this :input').removeAttr('disabled');	
	}
	
	$j('.checkbox').click(function() {	
		if ($j('.hide-this').css("display") == "block") {
			$j('.hide-this').hide();
			$j('.hide-this :input').attr('disabled', 'true');
		} else {
			$j('.hide-this').show();
			$j('.hide-this :input').removeAttr('disabled');	
		}
		
	});
	
	jQuery.validator.addMethod(
	  "combo",
	  function(value, element) {
		if ($j('.checkbox').is(':checked'))
		{
		  return false;
		}
		else return true;
	  },
	  "You've selected random selection of questions. Please enter the amount of questions to put in the pool."
	);	
	
	$j('#modifySection').validate({
		rules: {
			title: {
				required: true,
				minlength: 2
			},
			pool: {
				combo: true
			}
		},
		
		messages: {
			title: "Please enter a title",
			description: "Please enter a description"
		}
	});
});
</script>
<!-- END custom_head -->

<div id="assess">
	<h1>Modify Section {TITLE} in {ASSESS_TITLE}</h1>
	<div class="col-1">
		<div class="assess-header">
			<h2>Section Details</h2>
			<div class="assess-body">
				<form name="create" action="/assess/section/modify" class="standardForm" id="modifySection" method="post">
					<fieldset class="hidden">
						<input name="assess_id" type="hidden" value="{ASSESS_ASSESS_ID}" />
						<input name="section_id" type="hidden" value="{SECTION_ID}" />
						<input name="sequence" type="hidden" value="{SEQUENCE}" />
					</fieldset>
				
					<fieldset>
						<label>Section Title</label>
						<input name="title" type="text" size="35" value="{TITLE}" />
					</fieldset>
				
					<fieldset>
						<label>Shuffle Questions</label>
						<input name="random" type="checkbox" class="checkbox" value="1" {RANDOM_SELECTED} /> Questions should be selected randomly
					</fieldset>
				
					<fieldset class="hide-this">
						<label>Total Questions Displayed</label>
						<input name="pool" type="text" disabled="disabled" class="pool" value="{POOL}"/> Maximum number of questions to show
					</fieldset>
				
					<fieldset>
						<label>Description</label>
						<div class="textarea-container"><textarea name="description">{DESCRIPTION}</textarea></div>
					</fieldset>
				
					<fieldset>
						<input type="submit" id="create" value="Modify" class="submit-btn-plain">
					</fieldset>
				</form>
			</div>
		</div>
	</div>
	<div class="col-2">
	<!-- BEGIN allQuestions -->
	
	<!-- END allQuestions -->
	</div>
</div>
