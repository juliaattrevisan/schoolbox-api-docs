<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<link rel="stylesheet" href="/css/jquery.countdown.css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.countdown.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    $j('.question form').submit(function() {
        $j.post($j(this).attr('action'), $j(this).serialize(), function(responseText) {
            var dataFunction = new Function('return ' + responseText);
            var result = dataFunction();

            /* Save successful, so hide form and disable submit butan
             */
            if (result.response_id != '') {
                $j('#question_status_' + result.question_id).html('Response saved. This message should probably fade away into nothingness...');
            }
            else {
                alert ('An error occurred while saving your answer.');
            }
        });

        return false;
    });

    $j('#countdown').countdown({
        until: '+{ASSESS_TIME_REMAINING}',
        alwaysExpire: true,
        onExpiry: function() {
            window.location = '/assess/end/{ASSESS_ASSESS_ID}';
        }
    });
});
</script>
<!-- END custom_head -->

<div class="countdownSummary">
    <div class='countdownSummaryInner'>
        <h1>Assessment: {ASSESS_TITLE}</h1>
        <dl>
            <dt>You started this assessment on</dt>
            <dd>{ATTEMPT_START}</dd>

            <dt>You must finish this assessment by:</dt>
            <dd>{ATTEMPT_END}</dd>

            <dt>Time remaining</dt>
            <dd><div id="countdown"></div></dd>
        </dl>
        <div class="float-fix"><!-- --></div>
    </div>
</div>

<h2>{SECTION_TITLE}</h2>
<p>{SECTION_DESCRIPTION}</p>

<!-- BEGIN question -->
<div class='question'>
    <form action="/assess/saveAnswer/{QUESTION_QUESTION_ID}" method="post">
        <h3>Q{QUESTION_SEQUENCE}) {QUESTION_QUESTION}</h3>
        <!-- BEGIN answerInputs -->

        <!-- END answerInputs -->
        <input type="submit" value="Save Answer" />
    </form>
    <div id="question_status_{QUESTION_QUESTION_ID}"></div>
</div>
<!-- END question -->

<!-- BEGIN continueAssess -->
<a href="/assess/attempt/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}">Continue</a>
<!-- END continueAssess -->

<!-- BEGIN endAssess -->
<a href="/assess/end/{ASSESS_ASSESS_ID}">Finish</a>
<!-- END endAssess -->
