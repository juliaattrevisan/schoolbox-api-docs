<!-- BEGIN answerOption -->
<li class="row content evaluation-answer-option matching-pairs no-pad"
    data-response-id="{RESPONSE_ID}"
>
    <div class="small-6 medium-4 columns">
        <p>{ANSWER_LEFT_VALUE}</p>
    </div>
    <div class="small-6 medium-4 columns sortable">
        <p>
            {ANSWER_RIGHT_VALUE}
            <a href="#" class="hide-for-medium-up close no-text icon-add" data-collapser="true"></a>
        </p>
    </div>
    <!-- correct response is too small to show for small screens -->
    <div class="hide-for-small medium-4 columns sortable">
        <p>
            {ANSWER_CORRECT_RESPONSE_VALUE}
            <span class="close {ANSWER_ICON}"></span>
        </p>
    </div>

    <!-- copy to show for small screens -->
    <div class="hide small-6 small-offset-6 columns sortable"
         data-collapsable="true"
         data-collapse-state="collapsed"
    >
        <p>
            {ANSWER_CORRECT_RESPONSE_VALUE}
            <span class="close no-text {ANSWER_ICON}"></span>
        </p>
    </div>

    <!-- required because there's a last-child style on columns -->
    <div class="hide small-6 columns"></div>
</li>
<!-- END answerOption -->

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>

    <em>{REVIEWED_COMMENT}</em>
</li>

<script type="text/javascript" src="/javascript/jquery.collapsable.js"></script>
<script type="text/javascript">
    $(function() {
        // Collapse incorrect responses on small screens
        $('[data-response-id="{RESPONSE_ID}"]').find('[data-collapser="true"]').collapsable({
            container: '[data-response-id="{RESPONSE_ID}"]'
        });
    });
</script>
