<fieldset>
    <legend>Answer</legend>

    <ul id="answerCollection" class="information-list">
    </ul>

    <a class="button icon-add" href="#" data-add-answer>Add answer option</a>
</fieldset>

<ul class="hide" data-clone>
    <li class="row" data-input>
        <div class="small-5 columns" data-answer-code>
            <input name="answerCode[]" type="hidden" value="" data-answer-code-value />
            <label class="answer-value">
                <input name="answerLeft[]" type="text" value="" data-answer-field="answerLeft" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            matches
        </div>
        <div class="small-5 columns">
            <label class="answer-value">
                <input name="answerRight[]" type="text" value="" data-answer-field="answerRight" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            <a class="button icon-delete no-text" data-delete></a>
        </div>
    </li>
</ul>

<script type='text/javascript' src="/javascript/shared/evaluation/type/evaluation.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/type/evaluation-creator.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.validation.js"></script>
<script type="text/javascript">
    $(function() {
        $('#createQuestionForm').multiRadioCreate({
            availability: 'assess',
            mode: 'create',
            questionBank: false,
            answerName: 'answerRight',
            rules: {
                question: {
                    required: true,
                    minlength: 2
                },
                marks: {
                    required: true,
                    minlength: 1,
                    greaterThanZero:true
                },
                'answerLeft[]': {
                    required: true,
                    minlength: 1,
                    emptyInputs: true
                },
                'answerRight[]': {
                    required: true,
                    minlength: 1,
                    emptyInputs: true
                }
            },
            generateAnswer: function(config) {
                var answerCollection = [];
                $(config.answerCollectionList).find('[data-input]').each(function() {
                    var elem    = $(this);
                    var answer  = {};
                    var isEmpty = true;
                    elem.find('[data-answer-field]').each(function() {
                        isEmpty                              = false;
                        answer[$(this).data('answer-field')] = this.value;
                    });
                    if (!isEmpty) {
                        answerCollection.push(answer);
                    }
                });
                return answerCollection;
            },
            customValidationRules: function(config) {
                $.fn.addCustomRules_greaterThanZero(config);
                $.fn.addCustomRules_emptyInputs(config);
            }
        });
    });
</script>
