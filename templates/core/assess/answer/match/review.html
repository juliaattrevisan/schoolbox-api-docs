<fieldset>
    <label>Answer</label>
    <div>
        <ul class="matchPairs">
            <!-- BEGIN answerOptionLeft -->
            <li><strong>{ANSWER_LEFT_VALUE}</strong></li>
            <!-- END answerOptionLeft -->
        </ul>

        <ul class="matchPairs">
            <!-- BEGIN answerOptionRight -->
            <li class="{CORRECT}">
                {ANSWER_RIGHT_VALUE}
            </li>
            <!-- END answerOptionRight -->
        </ul>

        <ul class="matchPairs">
            <!-- BEGIN answerOptionCorrectResponse -->
            <li>
                {ANSWER_CORRECT_RESPONSE_VALUE}
            </li>
            <!-- END answerOptionCorrectResponse -->
        </ul>
    </div>
</fieldset>
<fieldset>
    <input name="reviewedMarks" type="text" value="{REVIEWED_MARKS}" /> / {QUESTION_MARKS}
</fieldset>
