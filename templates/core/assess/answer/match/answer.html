<script type="text/javascript" src="/javascript/jquery.ui.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    $j("#matchPairs_{MATCHPAIRS_QUESTION_ID}").sortable();
    $j("#matchPairs_{MATCHPAIRS_QUESTION_ID}").disableSelection();
});
</script>

<fieldset>
    <label>Answer</label>
        <ul class="left-answer option">
            <!-- BEGIN answerOptionLeft -->
            <li class="left-answer"><strong>{ANSWER_LEFT_VALUE}</strong><div class="arrow"><span></span></div></li>
            <!-- END answerOptionLeft -->
        </ul>
		
		

        <ul id="matchPairs_{MATCHPAIRS_QUESTION_ID}" class=" option">
            <!-- BEGIN answerOptionRight -->
            <li class="right-answer">
               <strong> <input name="answerRight[]" class="answerRight" type="hidden" readonly="readonly" value="{ANSWER_RIGHT_VALUE}" />
                {ANSWER_RIGHT_VALUE}
				</strong>
            </li>
			<div class="float-fix"></div>
            <!-- END answerOptionRight -->
        </ul>
</fieldset>
