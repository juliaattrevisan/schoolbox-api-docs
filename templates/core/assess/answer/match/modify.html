<fieldset class="content">
    <div class="column small-12">
        <legend>Answer</legend>

        <ul id="answerCollection" class="information-list no-pad">
            <!-- BEGIN answerOption -->
            <li data-input>
                <div class="small-12 medium-5 columns" data-answer-code>
                    <label class="answer-value">
                        <input name="answerLeft[]" type="text" value="{ANSWER_LEFT_VALUE}" data-answer-field="answerLeft" data-answer-description />
                    </label>
                </div>
                <div class="small-12 medium-1 columns text-center">
                    Matches
                </div>
                <div class="small-11 medium-5 columns">
                    <label class="answer-value">
                        <input name="answerRight[]" type="text" value="{ANSWER_RIGHT_VALUE}" data-answer-field="answerRight" data-answer-description />
                    </label>
                </div>
                <div class="small-1 columns">
                    <a class="icon-delete" data-delete title="Remove"></a>
                </div>
            </li>
            <!-- END answerOption -->
        </ul>

        <a class="button icon-add" href="#" data-add-answer>Add answer option</a>
    </div>
</fieldset>


<ul class="hide" data-clone>
    <li class="row" data-input>
        <div class="small-12 medium-5 columns" data-answer-code>
            <input name="answerCode[]" type="hidden" value="" data-answer-code-value />
            <label class="answer-value">
                <input name="answerLeft[]" type="text" value="" data-answer-field="answerLeft" data-answer-description />
            </label>
        </div>
        <div class="small-12 medium-1 columns text-center">
            Matches
        </div>
        <div class="small-11 medium-5 columns">
            <label class="answer-value">
                <input name="answerRight[]" type="text" value="" data-answer-field="answerRight" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            <a class="icon-delete" data-delete title="Remove"></a>
        </div>
    </li>
</ul>

<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation-creator.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.validation.js"></script>
<script type="text/javascript">
    $(function() {
        $('#createQuestionForm').multiRadioCreate({
            availability: 'assess',
            mode: 'modify',
            questionBank: questionBank,
            answerName: 'answerRight',
            rules: {
                question: {
                    required: true,
                    minlength: 2
                },
                marks: {
                    required: true,
                    minlength: 1,
                    greaterThanZero:true
                },
                'answerLeft[]': {
                    emptyInputs: true
                },
                'answerRight[]': {
                    emptyInputs: true
                }
            },
            generateAnswer: function(config) {
                var answerCollection = [];
                $(config.answerCollectionList).find('[data-input]').each(function() {
                    var elem    = $(this);
                    var answer  = {};
                    var isEmpty = true;
                    elem.find('[data-answer-field]').each(function() {
                        isEmpty                              = false;
                        answer[$(this).data('answer-field')] = this.value;
                    });
                    if (!isEmpty) {
                        answerCollection.push(answer);
                    }
                });
                return answerCollection;
            },
            customValidationRules: function(config) {
                $.fn.addCustomRules_greaterThanZero(config);
                $.fn.addCustomRules_emptyInputs(config);
            }
        });
    });
</script>
