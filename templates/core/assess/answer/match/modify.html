<script type="text/javascript">
$j(document).ready(function() {
var validator = $j("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 
		}).validate({

			submitHandler: function() {
			
				var theForm = $j('#createQuestionForm');
				var answerCollection = new Array();
				
				var content = tinyMCE.activeEditor.getContent(); // get the content
   				$j('#question').val(content); // put it in the textarea
		
				/* Collate possible answers and their correctness status
				 */
				$j.each($j('#answerCollection').find('li'), function(index, element) {
					var elem = $j(element);
		
					var answerLeft = elem.find('.answerLeft').val();
					var answerRight = elem.find('.answerRight').val();
		
					/* Ignore empty answers that weren't removed
					 */
					if (($j.trim(answerLeft) != '') && ($j.trim(answerRight) != '')) {
						answerCollection.push({
							answerLeft: answerLeft,
							answerRight: answerRight
						});
					}
				});
		
				/* Collate the usual fields containing ids.
				 * Collate the checkboxes too but append all the possibilities as well!
				 */
				var data = {
					section_id: theForm.find('input[name=section_id]').val(),
					question_id: theForm.find('input[name=question_id]').val(),
					sequence: theForm.find('input[name=sequence]').val(),
					type_id: theForm.find('input[name=type_id]').val(),
					question: tinyMCE.get('question').getContent(),
					marks: theForm.find('input[name=marks]').val(),
					allAnswers: JSON.stringify(answerCollection)
				}
		
				/* Submit via POST and redirect to question creation screen upon done
				 */
				$j.post(theForm.attr('action'), data, function(responseText) {
					window.location = '/assess/question/modify/' + data.question_id;
				});
		
				return false;
			},
			
			rules: { 
				question: {
					required: true,
					minlength: 2
				},
				marks: {
					required: true,
					minlength: 1,
					number:true
				},
				'answerLeft[]': {
					emptyLeftInputs: true
				},
				'answerRight[]': {
					emptyRightInputs: true
				}
			},

			
			errorPlacement: function(error, element) {
				offset = element.offset();
				error.insertAfter(element)
				error.addClass('message');  // add a class to the wrapper
				error.css('top',  element.outerHeight());
				
				var pos = $j('ul#answerCollection').height();
				var lefty = element.position();

				
				if (element.hasClass("answerLeft")) {
					var pos = $j('ul#answerCollection').height();
					
					error.addClass("leftError");

					error.width(300);
					error.css('position', 'absolute');
					$j('.leftError').css('left', lefty.left + 100);
					$j('.leftError').css('top',  pos);
					$j('.leftError').css('z-index',  1000);
				}
				
				if (element.hasClass("answerRight")) {
					var pos = $j('ul#answerCollection').height();
					
					error.addClass("rightError");
					
					error.width(300);
					error.css('position', 'absolute');
					$j('.rightError').css('left', lefty.left);
					$j('.rightError').css('top',  pos);
					$j('.rightError').css('z-index',  1000);
				}

			}			

		});
	
		jQuery.validator.addMethod('emptyLeftInputs', function(value, element) {     
			   var fieldsAreFilled = true;
			   $j.each($j('#answerCollection').find('li'), function(index, element) {
					var elem = $j(element);
		
					var answerLeft = elem.find('.answerLeft').val();
		
					/* Ignore empty answers that weren't removed
					 */
					if ($j.trim(answerLeft) == '') {
						fieldsAreFilled = false;
					}
				});	
	
			/* Reposition bubble here somewhere
			 */
			 
			return fieldsAreFilled;
			
		}, 'You\'ve missed a an item on the left');
		
	
		 jQuery.validator.addMethod('emptyRightInputs', function(value, element) {     
			   var fieldsAreFilled = true;
			   $j.each($j('#answerCollection').find('li'), function(index, element) {
					var elem = $j(element);
		
					var answerRight = elem.find('.answerRight').val();
		
					/* Ignore empty answers that weren't removed
					 */
					if ($j.trim(answerRight) == '') {
						fieldsAreFilled = false;
					}
				});	
	
			/* Reposition bubble here somewhere
			 */
			 
			return fieldsAreFilled;
			
		}, 'You\'ve missed a an item on the right');

		/* Add a new answer option
		 */
		$j('#makeNewAnswer').live('click', function() {
			var thing = $j('.hidden-clone li:first-child').clone();
			$j('ul#answerCollection').append(thing);
			
				var pos = $j('ul#answerCollection').height();
				
           		$j('.leftError').css('top',  pos);
				$j('.rightError').css('top',  pos);
			
		});
	
	/* Remove an answer option
	 */
	$j('.delete').live('click', function(){
		if (($j('.inputs').length) !== 2) {
			$j(this).parent().remove();
		}	
		var pos = $j('ul#answerCollection').height();
				
       $j('.leftError').css('top',  pos);
		$j('.rightError').css('top',  pos);
    });
});
</script>
<fieldset>
    <label>Answer</label>
    <div class="answerCollection">
        <ul id="answerCollection">			
		<!-- BEGIN answerOption -->
			<li class="answerTemplate inputs">
				<div class="drag-me left-option"><input name="answerLeft[]" class="answerLeft text-box" type="text" value="{ANSWER_LEFT_VALUE}" /></div>
				<div class="arrow"><span>MATCHES</span></div>
				<div class="drag-me right-option"><input name="answerRight[]" class="answerRight text-box" type="text" value="{ANSWER_RIGHT_VALUE}" /></div>
				<div class="delete"></div>
				<div class="float-fix"></div>
			</li>
			<!-- END answerOption -->
		</ul>
    </div>
	<p><a class="add-answer" id="makeNewAnswer">Add answer option</a></p>
	
	<div class="hidden-clone">
	    <ul>			
			<li class="answerTemplate inputs">
				<div class="drag-me left-option"><input name="answerLeft[]" class="answerLeft text-box" type="text" value="" /></div>
				<div class="arrow"><span>MATCHES</span></div>
				<div class="drag-me right-option"><input name="answerRight[]" class="answerRight text-box" type="text" value="" /></div>
				<div class="delete"></div>
				<div class="float-fix"></div>
			</li>
		</ul>
	</div>
</fieldset>
