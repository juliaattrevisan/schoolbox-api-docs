<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
$(function() {
	$.fn.alaressTiny({
		mode: 'exact',
        elements: 'richtext-answer',
		file_browser_category_id: '{ASSESS_CATEGORY_ID}',
		removeformat_selector: 'b,strong,em,i,span,ins',
		width: "100%",
		disable_toolbars: [2, 3, 4]
	});

	$(document).on('click', '#create', function() {
		var content = tinyMCE.activeEditor.getContent(); // get the content
   		$('#question').val(content); // put it in the textarea
	});

	var validator = $("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 }).validate({
		rules: {
			question: {
				required: true,
				minlength: 2
			},
			marks: {
				required: true,
				minlength: 1,
				greaterThanZero:true
			}

		},

		messages: {
			question: "Please enter a question.",
			answer: "Please fill out an answer."
		},

        errorPlacement: function(error, element) {
         	error.insertAfter(element.parent().children(':last-child'))
		}

	});

	jQuery.validator.addMethod("greaterThanZero", function(value, element) {
   		return this.optional(element) || (parseFloat(value) > 0);
	}, "Amount must be greater than zero");
});
</script>

<label>
    Suggested Answer
    <textarea name="answer" id="richtext-answer">{ANSWER}</textarea>
</label>
