<script type='text/javascript' src="{CDN_PREFIX}/js/evaluation/jquery.evaluation-creator.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.validation.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        document.dispatchEvent(new CustomEvent("EDITOR__CREATE", {
            detail: {
                targetElements: ['#richtext-answer'],
                fileBrowserCategoryId: '{ASSESS_CATEGORY_ID}',
            }
        }));

        $('#createQuestionForm').shortCreate({
            customValidationRules: function(config) {
                $.fn.addCustomRules_greaterThanZero(config);
                $.fn.addCustomRules_emptyAnswer(config);
            }
        });
    });
</script>

<fieldset class="content">
    <div class="column small-12">
        <legend>Suggested Answer</legend>
        <textarea name="answer" id="richtext-answer" data-answer-description>{ANSWER}</textarea>
    </div>
</fieldset>
