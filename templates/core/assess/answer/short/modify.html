
<script type="text/javascript">
$j(function() {

	var validator = $j(".standardForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 }).validate({
		rules: { 
			question: {
				required: true,
				minlength: 2
			},
			marks: {
				required: true,
				minlength: 1
			},
			answer: {
				required: true,
				minlength: 1
			}
		},
		
		messages: {
			question: "Please enter a question.",
			marks: "Please allocate some marks to the question.",
			answer: "Please fill out an answer."
		},
		errorPlacement: function(label, element) {
			// position error label after generated textarea
			if (element.is("textarea")) {
				label.insertAfter(element.next());
			} else {
				label.insertAfter(element)
			}
		} 
	
	});
	
	validator.focusInvalid = function() {
		// put focus on tinymce on submit validation
		if( this.settings.focusInvalid ) {
		try {
			var toFocus = $j(this.findLastActive() || this.errorList.length && this.errorList[0].element || []);
		if (toFocus.is("textarea")) {
			tinyMCE.get(toFocus.attr("id")).focus();
		} else {
			toFocus.filter(":visible").focus();
		}
	} catch(e) {
		// ignore IE throwing errors when focusing hidden elements
	}
	}
	} 
	
	
	
});
</script>

<fieldset>
    <label>Answer</label>
    <div class="textarea-container"><textarea id="answerBox" name="answer">{ANSWER}</textarea></div>
</fieldset>
