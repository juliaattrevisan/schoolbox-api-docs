<div>
    <label>Answer Given</label>
    {ANSWER}
</div>

<!-- BEGIN answerOption -->
<div class="highlight-panel">
    <label>Suggested Answer</label>
    {CORRECT_ANSWER}
</div>
<!-- END answerOption -->

<!-- BEGIN writable_comment -->
<label>
    Enter your comments
    <textarea name="comment">{REVIEWED_COMMENT}</textarea>
</label>
<!-- END writable_comment -->

<!-- BEGIN readonly_comment -->
<label>
    <p>{REVIEWED_COMMENT}</p>
</label>
<!-- END readonly_comment -->

<div class="row">
    <!-- BEGIN writable_mark -->
    <div class="small-6 columns">
        <input name="reviewedMarks" type="text" value="{REVIEWED_MARKS}" class="required number"/>
    </div>
    <div class="small-6 columns">
        <span class="grade">/ {QUESTION_MARKS}</span>
    </div>
    <!-- END writable_mark -->

    <!-- BEGIN readonly_mark -->
    <div class="small-12 columns">
        <p class="grade">{REVIEWED_MARKS} / {QUESTION_MARKS}</p>
    </div>
    <!-- END readonly_mark -->
</div>
