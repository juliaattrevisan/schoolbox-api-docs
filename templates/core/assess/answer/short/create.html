<script type="text/javascript">
$j(function() {
	
	var validator = $j("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave(); 
		 
	}).validate({
		rules: { 
			question: {
				required: true,
				minlength: 1
			},
			marks: {
				required: true,
				minlength: 1,
				greaterThanZero:true
			}
		},
		
		messages: {
			question: "Please enter a question.",
			answer: "Please fill out an answer."
		},
		
        errorPlacement: function(error, element) {
            offset = element.offset();
            error.insertAfter(element.parent().children(':last-child'))
            error.addClass('message');  // add a class to the wrapper
		}
	});
	
	jQuery.validator.addMethod("greaterThanZero", function(value, element) {
   		return this.optional(element) || (parseFloat(value) > 0);
	}, "Amount must be greater than zero");
	
});
</script>

<label>Suggested Answer
<div class="textarea-container"><textarea id="answer"  name="answer">{ANSWER}</textarea></div>
</label>
