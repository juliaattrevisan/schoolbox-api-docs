<fieldset class="content">
    <div class="column small-12">
        <legend>Answer Options</legend>

        <ul id="answerCollection" class="information-list no-pad">
        </ul>

        <a class="button icon-add" href="#" data-add-answer>Add answer option</a>
    </div>
</fieldset>

<ul class="hide" data-clone>
    <li class="row" data-input>
        <div class="small-3 medium-2 columns" data-answer-code>
            <input name="answerCode[]" type="hidden" value="" data-answer-code-value />

            <input name="answer[]" type="radio" value="" data-answer-option />
            <label class="radio-label">
                <span data-answer-code-representation></span>
            </label>
        </div>
        <div class="small-8 medium-9 columns">
            <label class="answer-value">
                <input name="answerDescription[]" type="text" value="" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            <a class="button icon-delete" data-delete title="Remove"></a>
        </div>
    </li>
</ul>

<script type='text/javascript' src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src="{CDN_PREFIX}/js/evaluation/jquery.evaluation-creator.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src="{CDN_PREFIX}/js/evaluation/jquery.evaluation.validation.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        $('#createQuestionForm').multiRadioCreate({
            availability: 'assess',
            mode: 'create',
            questionBank: false,
            rules: {
                'answer[]': {
                    somethingChecked: true
                }
            },
            messages:{
                'answer[]': {
                    somethingChecked: "Please select the correct answer"
                }
            }
        });
    });
</script>
