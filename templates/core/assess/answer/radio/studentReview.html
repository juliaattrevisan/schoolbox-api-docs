<li class="row">
    <table>
        <tbody>
        <!-- BEGIN answerOption -->
        <tr class="evaluation-answer-option {ANSWER_OPTION_STATUS}">
            <td>
                <input type="radio" {ANSWER_CHECKED} readonly />
                <label class="radio-label"></label>
            </td>
            <td class="full-width align-middle">{ANSWER_DESCRIPTION}</td>
            <td class="text-center">
                <span class="size-32 no-text {ANSWER_ICON_CLASS}" title="{ANSWER_ICON_TITLE}"></span>
            </td>
        </tr>
        <!-- END answerOption -->
        </tbody>
    </table>
</li>

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>
    <em>{REVIEWED_COMMENT}</em>
</li>
