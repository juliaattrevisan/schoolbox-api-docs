<li class="row">
    <table>
        <thead>
        <tr>
            <th class="full-width"><h4>Option</h4></th>
            <th><h4>Your answer</h4></th>
            <th><h4>The correct answer</h4></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN answerOption -->
        <tr class="evaluation-answer-option {ANSWER_CHECKED}">
            <td>{ANSWER_DESCRIPTION}</td>
            <td><span class="icon-16 {ANSWER_GIVEN_ICON}"></span></td>
            <td><span class="icon-16 {ANSWER_CORRECT_ICON}"></span></td>
        </tr>
        <!-- END answerOption -->
        </tbody>
    </table>
</li>

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>
    <em>{REVIEWED_COMMENT}</em>
</li>
