<script type='text/javascript'>
    $(function() {
        $('#questionForm-{QUESTION_ID}').{QUESTION_PLUGIN}({
            id: {QUESTION_ID}
        });
    });
</script>

<!-- BEGIN answerOption -->
<input id='questionForm-{QUESTION_ID}-{ANSWER_VALUE}'
       name="answer"
       type="radio"
       value="{ANSWER_VALUE}"
       {ANSWER_CHECKED}
       autocomplete="off"
/>
<label for="questionForm-{QUESTION_ID}-{ANSWER_VALUE}"
       class="radio-label"
>{ANSWER_VALUE_FACADE}) {ANSWER_DESCRIPTION}</label>
<!-- END answerOption -->
