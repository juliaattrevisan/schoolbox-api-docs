<fieldset>
    <legend>Answer</legend>

    <ul id="answerCollection" class="information-list">
    </ul>

    <a class="button icon-add" href="#" data-add-answer>Add answer option</a>

    <label class="alert label">Please fill out all answers</label>
    <label class="alert label">Tick at least one checkbox</label>
</fieldset>

<ul class="hide" data-clone>
    <li class="row" data-input>
        <div class="small-1 columns" data-answer-code>
            <input name="answerCode[]" type="hidden" value="" data-answer-code-value />

            <input name="answer[]" type="checkbox" value="" data-answer-option />
            <label class="checkbox-label">
                <span class="content" data-answer-code-representation></span>
            </label>
        </div>
        <div class="small-10 columns">
            <label class="answer-value">
                <input name="answerDescription[]" type="text" value="" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            <a class="button icon-delete no-text" data-delete></a>
        </div>
    </li>
</ul>

<script type='text/javascript' src="/javascript/evaluation/evaluation.js"></script>
<script type="text/javascript">
$(document).ready(function() {

    /* Add initial options
     */
    var minOptions = 2;

    for (var i = 0; i < minOptions; i++) {
        $('#answerCollection').append($('[data-clone] [data-input]').clone());
    }

    refreshList();

    /* Add a new answer option
     */
    $(document).on('click', '[data-add-answer]', function(e) {
        e.preventDefault();

        var maxItems = 702;

        /* Obey limit
         */
        if ($('[data-input]').length < maxItems) {
            $('#answerCollection').append($('[data-clone] [data-input]').clone());

            refreshList();
        }

        return false;
    });

    /* Remove an answer option
     */
    $(document).on('click', '[data-delete]', function(event) {
        event.preventDefault();

        /* Only remove when greater than three
         */
        if (($('#answerCollection [data-input]').length) > minOptions) {
            $(this).parents('[data-input]').remove();
        }

        refreshList();
    });

    var validator = $("#createQuestionForm").submit(function() {
        // update underlying textarea before submit validation
        tinyMCE.triggerSave();
    }).validate({
        submitHandler: function() {
            var theForm = $('#createQuestionForm');

            /* Form preprocessing
             */
            var answerCollection = [];
            tinyMCE.triggerSave();

            var content = tinyMCE.activeEditor.getContent(); // get the content
            $('#question').val(content); // put it in the textarea

            /* Collate possible answers and their correctness status
             */
            $.each($('[data-input]'), function(index, element) {
                var elem = $(element);

                var description = $.trim(elem.find('[data-answer-description').val());
                var code = $.trim(elem.find('[data-answer-code]').val());

                /* Ignore empty answers that weren't removed
                 */
                if ((description != '') && (code != '')) {
                    answerCollection.push({
                        description: description,
                        value: code,
                        correct: elem.find('[data-answer-option]').prop('checked')
                    });
                }
            });

            /* Collate the usual fields containing ids.
             * Collate the checkboxes too but append all the possibilities as well!
             */
            var data = {
                section_id: theForm.find('input[name=section_id]').val(),
                sequence: theForm.find('input[name=sequence]').val(),
                type_id: theForm.find('select[name=type_id]').val(),
                question: tinyMCE.get('question').getContent(),
                marks: theForm.find('input[name=marks]').val(),
                allAnswers: JSON.stringify(answerCollection),
                configuration: JSON.stringify($('#configuration').find('input, textarea, select').serializeArray())
            };

            /* Submit via POST and redirect to question creation screen upon done
             */
            $.post(theForm.attr('action'), data, function(responseText) {
                window.location = '/assess/question/create/' + data.section_id;
            });

            tinyMCE.triggerSave();

            return false;
        },

        rules: {
            question: {
                required: true,
                minlength: 2
            },
            marks: {
                required: true,
                minlength: 1,
                greaterThanZero:true
            },
            'answerDescription[]': {
                emptyInputs: true
            },
            'answer[]':{
                nothingChecked:true
            }
        },

        errorPlacement: function(error, element) {

//            error.addClass('message');  // add a class to the wrapper
//
//            if (element.hasClass("answerDescription")) {
//                error.insertAfter(element.closest('#answerCollection'))
//            } else if (element.hasClass("answerCorrect") ) {
//                error.insertAfter(element.closest('#answerCollection'))
//            } else {
//                error.insertAfter(element.parent().children(':last-child'))
//            }
        }
    });

    /* Enforce multiple answer options
     */
    jQuery.validator.addMethod('emptyInputs', function(value, element) {
        var fieldsAreFilled = true;

        $.each($('[data-input]'), function(index, element) {
            var description = $.trim($(element).find('[data-answer-description]').val());

            /* Ignore empty answers that weren't removed
             */
            if (description == '') {
                fieldsAreFilled = false;
            }
        });

        return fieldsAreFilled;
    }, 'Please fill out all answers');

    /* Removed mandatory correct answer from multiple choice
     */
    jQuery.validator.addMethod('nothingChecked', function(value, element) {
        $.each($('[data-input]'), function(index, element) {
            if ($(element).find('[data-answer-option]').is(':checked')) {
                return true;
            }
        });

        return false;
    }, 'Tick at least one checkbox');

    /* Marks must be greater than zero
     */
    jQuery.validator.addMethod("greaterThanZero", function(value, element) {
        return this.optional(element) || (parseFloat(value) > 0);
    }, "Amount must be greater than zero");

    /**
     * Reindex letter index
     */
    function refreshList() {
        var i = 1;

        $('[data-answer-code]').each(function(index, element) {
            $(element).find('[data-answer-code-representation]').html($.fn.evaluation.findLetterIndex(i) + ')');
            $(element).find('[data-answer-code-value]').val(i);

            /* Update checkbox id and label target, due to custom styles
             */
            var id = 'answer-option-'+i;

            $(element).find('[data-answer-code-representation]').parent('label').attr('id', id);
            $(element).find('[data-answer-option]').attr('id', id);

            i++;
        });
    }
});
</script>
