<fieldset class="content">
    <div class="column small-12">
        <legend>Answer</legend>

        <ul id="answerCollection" class="information-list no-pad">
        </ul>

        <a class="button icon-add" href="#" data-add-answer>Add answer option</a>
    </div>
</fieldset>

<ul class="hide" data-clone>
    <li class="row" data-input>
        <div class="small-3 medium-2 columns" data-answer-code>
            <input name="answerCode[]" type="hidden" value="" data-answer-code-value />

            <input name="answer[]" type="checkbox" value="" data-answer-option />
            <label class="checkbox-label">
                <span data-answer-code-representation></span>
            </label>
        </div>
        <div class="small-8 medium-9 columns">
            <label class="answer-value">
                <input name="answerDescription[]" type="text" value="" data-answer-description />
            </label>
        </div>
        <div class="small-1 columns">
            <a class="icon-delete" data-delete></a>
        </div>
    </li>
</ul>

<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation-creator.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.validation.js"></script>
<script type="text/javascript">
$(function() {
    $('#createQuestionForm').multiRadioCreate({
        availability: 'assess',
        mode: 'create',
        questionBank: false,
        customValidationRules: function(config) {
            $.fn.addCustomRules_greaterThanZero(config);
            $.fn.addCustomRules_emptyInputs(config);
            $.fn.addCustomRules_somethingChecked(config);
        }
    });
});
</script>
