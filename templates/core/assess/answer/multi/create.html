<script type="text/javascript" src="/javascript/jquery.json2.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    var theForm = $j('#createQuestionForm');

    /* Form preprocessing
     */
    theForm.submit(function() {
        var answerCollection = new Array();

        /* Collate possible answers and their correctness status
         */
        $j.each($j('#answerCollection').find('li'), function(index, element) {
            var elem = $j(element);

            var description = elem.find('.answerDescription').val();
            var code = elem.find('.answerCode').attr('value');

            /* Ignore empty answers that weren't removed
             */
            if (($j.trim(description) != '') && ($j.trim(code) != '')) {
                answerCollection.push({
                    description: description,
                    value: code,
                    correct: elem.find('.answerCorrect').attr('checked')
                });
            }
        });

        /* Collate the usual fields containing ids.
         * Collate the checkboxes too but append all the possibilities as well!
         */
        var data = {
            section_id: theForm.find('input[name=section_id]').val(),
            sequence: theForm.find('input[name=sequence]').val(),
            type_id: theForm.find('select[name=type_id]').val(),
            question: theForm.find('input[name=question]').val(),
            marks: theForm.find('input[name=marks]').val(),
            allAnswers: JSON.stringify(answerCollection)
        }

        /* Submit via POST and redirect to question creation screen upon done
         */
        $j.post(theForm.attr('action'), data, function(responseText) {
            window.location = '/assess/question/create/' + data.section_id;
        });

        return false;
    });

    /* Add a new answer option
     */
    $j('#makeNewAnswer').live('click', function() {
		var thing = $j('.hidden-clone ul:first-child').clone();
		$j('ul#answerCollection').append(thing);
		refreshList()
    });
	
	/* Remove an answer option
	 */
	$j('.delete').live('click', function(){
		if (($j('.inputs').length) !== 2) {
			$j(this).parent().remove();
			refreshList()
		}	
    });
	
	$j('.checkbox').live('click', function() {
		if ($j(this).is(':checked')) {
			$j(this).parent().css("background-color", "#e0f2df");
		} else {
			$j(this).parent().css("background-color", "#EDEDED");
		}
	});
	
	
	function refreshList() {
		var alphabetStart = 65;
		$j('li.inputs > div.list-item').each(function() {	
		  var $this = $j(this);
		  $this.children('span').html('&#' + alphabetStart + ';)'); 
		  var convert = String.fromCharCode(alphabetStart);
		  $this.children('input').val(convert);
		  alphabetStart++;
		});
	}
	
});
</script>

<fieldset>
    <label>Answer</label>
    <div class="answerCollection">
        <ul id="answerCollection" >
			<li class="inputs">
				<div class="list-item"><input name="answerCode[]" class="answerCode text-box" type="hidden" value="A)" /><span>A)</span></div>
				<input name="answer[]" class="answerCorrect checkbox" checkbox="checkbox" type="checkbox" value="" />
				<div class="answer-value"><input name="answerDescription[]" class="answerDescription text-box" type="text" value="" /></div>
				<div class="delete"></div>
				<div class="float-fix"></div>
			</li>		
        </ul>
        <a class="add-answer" id="makeNewAnswer">Add answer option</a>
    </div>
	
	<div class="hidden-clone">
        <ul>
			<li class="inputs">
				<div class="list-item"><input name="answerCode[]" class="answerCode text-box" type="hidden" value="A)" /><span>A)</span></div>
				<input name="answer[]" class="answerCorrect checkbox" checkbox="checkbox" type="checkbox" value="" />
				<div class="answer-value"><input name="answerDescription[]" class="answerDescription text-box" type="text" value="" /></div>
				<div class="delete"></div>
				<div class="float-fix"></div>
			</li>		
        </ul>
        <a class="add-answer" id="makeNewAnswer">Add answer option</a>
    </div>

</fieldset>
