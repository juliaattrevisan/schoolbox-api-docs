<li class="row">
    <table>
        <thead>
        <tr>
            <th class="full-width"><h4>Option</h4></th>
            <th><h4>Your answer</h4></th>
            <th><h4>The correct answer</h4></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN answerOption -->
        <tr>
            <td>{ANSWER_DESCRIPTION}</td>
            <td>
                <input type="checkbox" readonly {ANSWER_GIVEN_CHECKED} />
                <label class="checkbox-label"></label>
            </td>
            <td>
                <input type="checkbox" readonly {ANSWER_CORRECT_CHECKED} />
                <label class="checkbox-label"></label>
            </td>
        </tr>
        <!-- END answerOption -->
        </tbody>
    </table>
</li>

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>
    <em>{REVIEWED_COMMENT}</em>
</li>
