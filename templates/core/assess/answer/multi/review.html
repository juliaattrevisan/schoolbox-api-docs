<li class="row">
    <table>
        <thead>
        <tr>
            <th class="full-width"><h4>Option</h4></th>
            <th><h4>Answer given</h4></th>
            <th><h4>Suggested answer</h4></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN answerOption -->
        <tr class="evaluation-answer-option {ANSWER_CHECKED}">
            <td>{ANSWER_DESCRIPTION}</td>
            <td>
                <input type="checkbox" readonly {ANSWER_GIVEN_CHECKED} />
                <label class="checkbox-label"></label>
            </td>
            <td>
                <input type="checkbox" readonly {ANSWER_CORRECT_CHECKED} />
                <label class="checkbox-label"></label>
            </td>
        </tr>
        <!-- END answerOption -->
        </tbody>
    </table>
</li>

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>

    <em>{REVIEWED_COMMENT}</em>
</li>

<li class="row content">
    <!-- BEGIN writable_comment -->
    <div class="small-12 columns no-pad">
        <h4>Enter your comments</h4>
        <textarea name="comment">{REVIEWED_COMMENT}</textarea>
    </div>
    <!-- END writable_comment -->

    <!-- BEGIN readonly_comment -->
    <div class="small-12 columns no-pad">
        <em>{REVIEWED_COMMENT}</em>
    </div>
    <!-- END readonly_comment -->

    <!-- BEGIN writable_mark -->
    <div class="small-6 columns no-pad">
        <input name="reviewedMarks" type="text" value="{REVIEWED_MARKS}" class="required number"/>
    </div>
    <div class="small-6 columns">
        <p class="grade">
            <span> / {QUESTION_MARKS}</span>
        </p>
    </div>
    <!-- END writable_mark -->

    <!-- BEGIN readonly_mark -->
    <div class="small-12 columns no-pad">
        <p class="grade">
            <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
        </p>
    </div>
    <!-- END readonly_mark -->
</li>
