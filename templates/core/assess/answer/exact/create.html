<script type='text/javascript' src="/javascript/evaluation/validation.js"></script>
<script type="text/javascript">
$(function() {
	
	var validator = $("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave(); 
		 
	}).validate({
		rules: { 
			question: {
				required: true,
				minlength: 1
			},
			marks: {
				required: true,
				minlength: 1,
				greaterThanZero:true
			}
		},
		
		messages: {
			question: "Please enter a question.",
			answer: "Please fill out an answer."
		},
		
        errorPlacement: function(error, element) {
            offset = element.offset();
            error.insertAfter(element.parent().children(':last-child'))
            error.addClass('message');  // add a class to the wrapper
		}
	});

    $.fn.addCustomRules_greaterThanZero({});
});
</script>

<label>
    Suggested Answer
    <input name="answer" type='text' value="{ANSWER}" />
</label>
