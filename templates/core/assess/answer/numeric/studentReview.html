<li class="row content evaluation-answer-option">
    <h4>Your answer</h4>
    {ANSWER}
    <span class="close {ANSWER_CORRECT}"></span>
</li>

<li class="row content highlight">
    <h4>The correct answer</h4>
    <!-- BEGIN answerOption -->
    {CORRECT_ANSWER}
    <!-- END answerOption -->
</li>

<li class="row content">
    <p class="grade">
        <span>{REVIEWED_MARKS} / {QUESTION_MARKS}</span>
    </p>
    <em>{REVIEWED_COMMENT}</em>
</li>
