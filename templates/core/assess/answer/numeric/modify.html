<script type='text/javascript' src="/javascript/shared/evaluation/type/evaluation-creator.js"></script>
<script type='text/javascript' src="/javascript/shared/evaluation/jquery.evaluation.validation.js"></script>
<script type="text/javascript">
    $(function() {
        $('#createQuestionForm').shortCreate({
            rules: {
                question: {
                    required: true,
                    minlength: 2
                },
                marks: {
                    required: true,
                    minlength: 1,
                    greaterThanZero: true
                },
                answer: {
                    required: true,
                    minlength: 1,
                    isNumber: true
                }
            },
            messages: {
                question: "Please enter a question.",
                answer: "Please fill out a numeric answer."
            },
            customValidationRules: function(config) {
                $.fn.addCustomRules_greaterThanZero(config);
                $.fn.addCustomRules_isNumber(config);
            }
        });
    });
</script>

<label>
    Suggested Answer
    <input type='text' name="answer" value='{ANSWER}' data-answer-description />
</label>
