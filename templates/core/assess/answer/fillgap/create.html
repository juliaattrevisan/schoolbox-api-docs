<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
	tinyMCE.init({
		mode : "exact",
		theme : "advanced",
		theme_advanced_buttons1 : "addSpans,removeformat",
        theme_advanced_buttons2 : '',
		theme_advanced_buttons3 : '',
		elements: "answerBox",
		content_css : "/css/core/core2.css",
		width : "100%",
        removeformat_selector: 'b,strong,em,i,span,ins',
//        valid_child_elements: 'span[]',
//        valid_elements: 'span',
//        validate_children: true,
//        cleanup_on_startup: true,
		setup : function(ed) {
			ed.addButton('addSpans', {
				title : 'wraps selected text with custom tag',
				image : 'img/icons.gif',
				'class' : 'make-blank',
				onclick : (function() {
					var sel = ed.selection.getContent();

					if (sel !== '') {
               		 	ed.selection.setContent('<span>' + sel + '</span>');
					};
           		})
			});
		}
	});
	

	var validator = $j("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 }).validate({
		rules: { 
			question: {
				required: true,
				minlength: 2
			},
			marks: {
				required: true,
				minlength: 1,
				number:true
			},
			question : {
				required:true,
				minlength: 1
				
				
			},
			answer: {
				required: true,
				minlength: 1
			}
		},
		
		messages: {
			question: "Please enter a question.",
			
			answer: "Please fill out an answer."
		},
		
		errorElement: "div",
        wrapper: "div",  // a wrapper around the error message
        errorPlacement: function(error, element) {
            offset = element.offset();
            error.insertBefore(element);
            error.addClass('message');  // add a class to the wrapper
            error.css('position', 'absolute');
            error.css('left', offset.left);
            error.css('top',  offset.top + element.outerHeight() +5);

			if (element.hasClass("tinyValidate")) {
				var pos = element.siblings('#question_container').position();
				error.css('left', pos.left);
           		error.css('top',  pos.top + element.siblings('#question_container').outerHeight() +5);
			};
			
			if (element.hasClass("tinyValidate2")) {
				var pos2 = element.siblings('#answerBox_parent').position();
				error.css('left', pos2.left);
           		error.css('top',  pos2.top + element.siblings('#answerBox_parent').outerHeight() +5);
			};
		}
	
	});	
	
	
	

	
});
</script>
<fieldset>
    <label>Answer</label>
    <div class="textarea-container"><textarea id="answerBox" name="answer" class="tinyValidate2">{ANSWER}</textarea></div>
</fieldset>

<fieldset>
    <label>Answer List</label>
    <p>The following words/phrases are answers:</p>
    <div class="answerList">
        <ul>
            <!-- BEGIN answer_list_items -->
            <li>{ANSWER_LIST_ITEM}</li>
            <!-- END answer_list_items -->
        </ul>
    </div>
</fieldset>
