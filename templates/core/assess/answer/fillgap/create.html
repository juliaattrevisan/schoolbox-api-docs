<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
	tinyMCE.init({
		mode : "exact",
		theme : "advanced",
		theme_advanced_buttons1 : "addSpans,removeformat",
        theme_advanced_buttons2 : '',
		theme_advanced_buttons3 : '',
		elements: "answerBox",
		content_css : "/css/core/tiny.css",
		width : "100%",
        removeformat_selector: 'b,strong,em,i,span,ins',
//        valid_child_elements: 'span[]',
//        valid_elements: 'span',
//        validate_children: true,
//        cleanup_on_startup: true,
		setup : function(ed) {
			ed.addButton('addSpans', {
				title : 'wraps selected text with custom tag',
				image : '/javascript/tiny_mce/themes/advanced/img/icons.gif',
				'class' : 'make-blank',
				onclick : (function() {
					var sel = ed.selection.getContent();
					if (sel !== '') {
               		 	ed.selection.setContent('<span>' + sel + '</span>');
					};
           		})
			});
		}
	});
	

	var validator = $j("#createQuestionForm").submit(function() {
		 // update underlying textarea before submit validation
		 tinyMCE.triggerSave();
	 }).validate({
		rules: { 
			question: {
				required: true,
				minlength: 2
			},
			marks: {
				required: true,
				minlength: 1,
				greaterThanZero:true
			},
			answer: {
				required: true,
				minlength: 1
			}
		},
		
		messages: {
			question: "Please enter a question.",
			answer: "Please fill out an answer."
		},
		
                errorPlacement: function(error, element) {
			offset = element.offset();
            error.insertAfter(element.parent().children(':last-child'))
            error.addClass('message');  // add a class to the wrapper
		}
	
	});	
	
	jQuery.validator.addMethod("greaterThanZero", function(value, element) {
   		return this.optional(element) || (parseFloat(value) > 0);
	}, "Amount must be greater than zero");
	
});
</script>

<label>Answer
    <div class="textarea-container" id="answerBox_parent"><textarea id="answerBox" name="answer" class="tinyValidate2">{ANSWER}</textarea></div>
</label>

<label>Answer List
    <p>The following words/phrases are answers:</p>
    <div class="answerList">
        <ul>
            <!-- BEGIN answer_list_items -->
            <li>{ANSWER_LIST_ITEM}</li>
            <!-- END answer_list_items -->
        </ul>
    </div>
</label>
