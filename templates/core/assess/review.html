<!-- BEGIN custom_head -->
<link rel="stylesheet" media="screen" href="/css/core/assess.css" />
<link rel="stylesheet" href="/css/jquery.countdown.css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.countdown.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
    $j('.question form').submit(function() {
        $j.post($j(this).attr('action'), $j(this).serialize(), function(responseText) {
            var dataFunction = new Function('return ' + responseText);
            var result = dataFunction();

            /* Save successful, so hide form and disable submit butan.
             * Update section completion value
             */
            if (result.response_id != '') {
                $j('#question_status_' + result.response_id).html('Response saved. This message should probably fade away into nothingness...');
            }
            else {
                alert ('An error occurred while saving your answer.');
            }
        });

        return false;
    });
});
</script>
<!-- END custom_head -->

<h2>{SECTION_TITLE}</h2>
<p>{SECTION_DESCRIPTION}</p>

<!-- BEGIN question -->
<div class='question'>
    <form action="/assess/saveReviewedResponse/{QUESTION_QUESTION_ID}/{RESPONSE_ID}" method="post">
        <h3>Q{QUESTION_SEQUENCE}) {QUESTION_QUESTION} </h3>
        ({QUESTION_MARKS} marks)

        <!-- BEGIN answerInputs -->
        <!-- END answerInputs -->

        <input type="submit" value="Update Marks" />
    </form>
    <div id="question_status_{RESPONSE_ID}"></div>
</div>
<!-- END question -->

<!-- BEGIN prevSection -->
<a href="/assess/review/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}">Previous Section</a> |
<!-- END prevSection -->

<!-- BEGIN nextSection -->
<a href="/assess/review/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}">Next Section</a> |
<!-- END nextSection -->

<!-- BEGIN endAssess -->
<a href="/assess/finishReview/{ASSESS_ASSESS_ID}/{ATTEMPT_ATTEMPT_ID}">Finish</a>
<!-- END endAssess -->
