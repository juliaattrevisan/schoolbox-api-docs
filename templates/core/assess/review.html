<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.countdown.css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.countdown.js"></script>
<script type="text/javascript" src="/javascript/jquery.validate.min.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
   var currentForm = '';
	$j('.assess-header form').each(function(index, formElement) {
   		 $j(formElement).validate({
			submitHandler: function() {
				showAlert(formElement);
				$j.post($j(formElement).attr('action'), $j(formElement).serialize(), function(responseText) {
					var dataFunction = new Function('return ' + responseText);
					var result = dataFunction();
				});
				return false;
			},
			rules: {
				reviewedMarks: { 
					number:true
				}	
			},
			messages: {
				reviewedMarks: "Please enter a decimal number"
			},
			errorPlacement: function(error, element) {
                            offset = element.offset();
                            error.insertBefore(element)
			}
   		});
	});  	   
		
	$j('.textarea-container textarea').blur(function() {

		if ($j(this).val() !== '') {
			$j.post($j(this).parents('.assess-header form').attr('action'), 
			$j(this).parents('.assess-header form').serialize(), 
			function(responseText) {
				var dataFunction = new Function('return ' + responseText);
				var result = dataFunction();
			});
			return false;			
		}
	});
	
	$j('.marks-amount input').blur(function() {
		
		showAlert($j(this));
		
		$j.post($j(this).parents('.assess-header form').attr('action'), 
		$j(this).parents('.assess-header form').serialize(), 
		function(responseText) {
			var dataFunction = new Function('return ' + responseText);
			var result = dataFunction();
		});
		return false;	
	});

	var assessAttempted = '{ASSESS_PREVIOUSLY_REVIEWED}';
	
	if (assessAttempted == 'true') {
		$j('.tick').html('<span></span>Resubmit Review')
	}
	
	function showAlert(target) {
		var relevantLabel = $j(target).closest('form').find('.assess-alert');
		if (assessAttempted == "false") {
			relevantLabel.fadeIn(200);
		}
		if (assessAttempted == "true") {
			relevantLabel.html('<span>In order to finish your edits to this finalised review, click \'Resubmit Review\' at the bottom of the page\</span>').fadeIn(200);
		}
	}

});
</script>
<!-- END custom_head -->
<div id="assess" class="mark-test">
	<h1>Mark the test results</h1>
	<h2>Section: {SECTION_TITLE}</h2>
	<div class="assess-body margin-bottom-10">
		<p>{SECTION_DESCRIPTION}</p>
	</div>
	<!-- BEGIN question -->
	<div class='assess-header'>
		<form action="/assess/saveReviewedResponse/{QUESTION_QUESTION_ID}/{RESPONSE_ID}" name="question-submit" class='validation_{RESPONSE_ID}' method="post">
			<h3><strong>Q{QUESTION_SEQUENCE})</strong> {QUESTION_QUESTION}<span> - ({QUESTION_MARKS} marks)</span></h3>
			<div class="assess-body clearfix">

				<!-- BEGIN answerInputs -->
				<!-- END answerInputs -->
			  <label class="alert-holder clearfix">
			  	<div class="assess-alert">
					<span>In order to finalise your assessment, please click the "Finalise Review" button at the bottom of the page.</span>
				</div>
			    <input type="submit" value="Update Marks" class="submit-btn-plain float-right"/>
			</label>
               
			</div>
		</form>

	</div>
	<!-- END question -->

	<!-- BEGIN prevSection -->
	<a class="btn go-back float-left" href="/assess/review/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Previous Section</a>
	<!-- END prevSection -->

	<!-- BEGIN nextSection -->
	<a class="btn go-to" href="/assess/review/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Next Section</a>
	<!-- END nextSection -->

	<!-- BEGIN endAssess -->
	<a class="btn tick" href="/assess/finishReview/{ASSESS_ASSESS_ID}/{ATTEMPT_ATTEMPT_ID}"><span></span>Finalise Review</a>
	<!-- END endAssess -->
</div>
