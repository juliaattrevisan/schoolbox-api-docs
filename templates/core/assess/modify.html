{BREADCRUMB}

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>{ASSESS_HEADING}</h1>
        </div>
    </div>
    <!-- BEGIN importXML -->
    <nav>
        <a class="icon-more" title="" data-dropdown="header-options"></a>
    </nav>
    <ul id="header-options" class="f-dropdown" data-dropdown-content>
        <li><a href="#" id="import" data-reveal-id="import-modal" class="icon-upload">Import from XML file</a></li>
    </ul>
    <!-- END importXML -->
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">{ASSESS_ACTION} {ASSESS_KIND}</h2>

        <form name="create" action="/assess/{ACTION}/{ASSESS_ASSESS_ID}" id="createAssess" class="top" method="post">
            <input name="category_id" type="hidden" value="{ASSESS_CATEGORY_ID}" />
            <input name="is_task" type="hidden" value="{ASSESS_IS_TASK}" />
            <input name="unit_id" type="hidden" value="{ASSESS_UNIT_ID}" />

            <section class="content">
                <label>
                    Title
                    <input name="title" type="text" maxlength="100" value="{ASSESS_TITLE}" id="title"/>
                </label>

                <!-- BEGIN assess_timespan -->
                <!-- Available from this time -->
                <div class="row">
                    <div class="small-12 large-6 columns">
                        <label>
                            Open Date
                            <span class="hint has-tip tip-top" data-tooltip title="The date and time from when the quiz will be available.">?</span>
                            <input name="start[date]" id="start_date" type="text" size="15" maxlength="30" value="{ASSESS_START_DATE}" />
                        </label>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Hour
                                <input name="start[hour]" type="text" class='timeField' value="{START_HOUR_VALUE}" data-timepicker="hour" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Minute
                                <input name="start[minute]" type="text" class='timeField' value="{START_MINUTE_VALUE}" data-timepicker="minute" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <label>
                            Period
                            <select name="start[meridiem]">
                                <!-- BEGIN startMeridiem -->
                                <option value="{START_MERIDIEM_VALUE}" {START_MERIDIEM_SELECTED}>{START_MERIDIEM_VALUE}</option>
                                <!-- END startMeridiem -->
                            </select>
                        </label>
                    </div>
                </div>

                <!-- Available until this time -->
                <div class="row">
                    <div class="small-12 large-6 columns">
                        <label>
                            Due Date
                            <span class="hint has-tip tip-top" data-tooltip title="Actual date and time the quiz is due. Students will not be able to take the quiz after this date.">?</span>
                            <input name="finish[date]" id="finish_date" type="text" size="15" maxlength="30" value="{ASSESS_FINISH_DATE}" />
                        </label>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Hour
                                <input name="finish[hour]" type="text" class='timeField' value="{FINISH_HOUR_VALUE}" data-timepicker="hour" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <div class="timepick">
                            <label>
                                Minute
                                <input name="finish[minute]" type="text" class='timeField' value="{FINISH_MINUTE_VALUE}" data-timepicker="minute" />
                            </label>
                        </div>
                    </div>
                    <div class="small-4 large-2 columns">
                        <label>
                            Period
                            <select name="finish[meridiem]">
                                <!-- BEGIN finishMeridiem -->
                                <option value="{FINISH_MERIDIEM_VALUE}" {FINISH_MERIDIEM_SELECTED}>{FINISH_MERIDIEM_VALUE}</option>
                                <!-- END finishMeridiem -->
                            </select>
                        </label>
                    </div>
                </div>
                <!-- END assess_timespan -->

                <label>
                    Duration
                    <span class="hint has-tip tip-top" data-tooltip title="To set a quiz duration, tick the box and fill out a time.">?</span>
                </label>
                <div class="switch">
                    <input type="hidden" name="durationSelected" value="0" />
                    <input type="checkbox" id='durationSelected' name='durationSelected' data-show-duration value='1' {ASSESS_DURATION_CHECKED} />
                    <label for="durationSelected"></label>
                </div>
                <div data-edit-duration class="row hide">
                    <div class="small-6 columns">
                        <label>
                            Hours
                            <input name='duration[hour]' type='text' class="timeField" value='{DURATION_HOUR_VALUE}' maxlength='1'>
                        </label>
                    </div>
                    <div class="small-6 columns">
                        <label>
                            Minutes
                            <input name='duration[minute]' type='text' class="timeField" value='{DURATION_MINUTE_VALUE}' maxlength='2'>
                        </label>
                    </div>
                </div>

                <label>
                    Description
                    <textarea id='description' name="description">{ASSESS_DESCRIPTION}</textarea>
                </label>

                <label>
                    Completion Message
                    <textarea id='completion-message' name="completion_message">{ASSESS_COMPLETION_MESSAGE}</textarea>
                </label>

                <label>
                    Maximum Attempts
                    <span class="hint has-tip tip-top" data-tooltip title="The maximum number of times someone can attempt this quiz.">?</span>

                    <select name='max_attempts'>
                        <option value='0'>Unlimited</option>
                        <!-- BEGIN max_attempts -->
                        <option value='{MAX_ATTEMPTS_VALUE}' {MAX_ATTEMPTS_CHECKED}>{MAX_ATTEMPTS_VALUE}</option>
                        <!-- END max_attempts -->
                    </select>
                </label>

                <label>
                    Visibility
                    <span class="hint has-tip tip-top" data-tooltip title="Control who can view marks for this quiz.">?</span>

                    <!-- BEGIN marktype -->
                    <select name="mark_visibility" id="marktype">
                        <!-- BEGIN mark_visibility_drop -->
                        <option value="{MARK_VISIBILITY_VALUE}" {MARK_VISIBILITY_VALUE_SELECTED}>{MARK_VISIBILITY_TEXT}</option>
                        <!-- END mark_visibility_drop -->
                    </select>
                    <!-- END marktype -->
                </label>

                <!-- BEGIN mark_weight -->
                <label>
                    Weight
                    <span class="hint has-tip tip-top" data-tooltip title="Control the weight of this quiz towards the student's overall grade average (default is 0).">?</span>
                    <input name="weight" type="text" size="3" maxlength="3" value="{ASSESS_WEIGHT}" id="weight"/>
                </label>
                <!-- END mark_weight -->

                <!-- BEGIN curriculum_code_input -->
                <label>
                    Curriculum Codes
                    <span class="hint has-tip tip-top" data-tooltip title="If you want to associate curriculum codes with this assessment, enter them here. (By default, it will be associated with the same codes that its folder is.)">?</span>
                    {CURRICULUM_CODE_INPUT}
                </label>
                <!-- END curriculum_code_input -->
            </section>
            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="{ASSESS_ACTION} {ASSESS_KIND}" />
                </div>
            </div>
        </form>
    </div>
</div>

<div id="import-modal" class="reveal-modal" data-reveal>
    <form action="/assess/import/xml/{ASSESS_CATEGORY_ID}" method="post" enctype="multipart/form-data">
        <input type='hidden' name="is_task" value="{ASSESS_IS_TASK}" />
        <input type="hidden" name="unit_id" value="{ASSESS_UNIT_ID}" />
        <label>
            <input name="importXML" type="file" />
        </label>
        <label>
            <input type="submit" value="Import from XML file" />
        </label>
    </form>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.syncDates.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript" src="/javascript/components/selectize/dist/js/standalone/selectize.min.js"></script>
<script type="text/javascript" src="/javascript/jquery.selectizeSelector.js"></script>
<script type="text/javascript" src="/curriculum/javascript/jquery.curriculumSelector.js"></script>
<script type="text/javascript" src="/javascript/components/jquery-timepicker-jt/jquery.timepicker.min.js"></script>
<script type="text/javascript" src="/javascript/shared/datetime/jquery.hourpicker.js"></script>
<script type="text/javascript" src="/javascript/shared/datetime/jquery.minutepicker.js"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode: 'exact',
            elements: "description, completion-message",
            file_browser_category_id: '{ASSESS_CATEGORY_ID}'
        });

        /* date picker */
        $('#start_date, #finish_date').datepicker({
            constrainInput: false,
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        $('#start_date').syncDates({endDate: $('#finish_date')});

        /* Timepicker
         */
        $('input[data-timepicker="hour"]').hourpicker({
            hours: 12,
            appendTo: function ($input) {
                return $input.closest('.timepick');
            }
        });
        $('input[data-timepicker="minute"]').minutepicker({
            appendTo: function ($input) {
                return $input.closest('.timepick');
            }
        });

        $('[data-show-duration]').change(function() {
            $('[data-edit-duration]').toggleClass('hide');

            if ($('[data-edit-duration]').hasClass('hide')) {
                $('#minDuration').val('15');
            } else {
                $('#minHours').val('0');
                $('#minDuration').val('00');
            }
        });

        if ($('[data-show-duration]').is(':checked')) {
            $('[data-edit-duration]').show();
        }

        $('#createAssess').validate({
            rules: {
                title: {
                    required: true,
                    minlength: 2
                },
                weight: {
                    required: true,
                    maxlength: 3,
                    digits: true
                },
                "finish[hour]": {
                    required: true,
                    '12hour': true
                },
                "finish[minute]": {
                    required: true,
                    minute: true
                },
                "start[hour]": {
                    required: true,
                    '12hour': true
                },
                "start[minute]": {
                    required: true,
                    minute: true
                }
            },
            messages: {
                title: "Please enter a title",
                description: "Please enter a description",
                weight: "Please add a numeric weight"
            },
            errorPlacement: function(error, element) {
                var fieldset = element.closest('fieldset');
                if (fieldset.length) {
                    error.appendTo(fieldset);
                } else {
                    error.insertAfter(element);
                }
            }
        });
    });
</script>
