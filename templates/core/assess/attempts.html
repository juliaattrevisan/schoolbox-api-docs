<div class="row">
    <div class="small-12 columns">
        <h1>{ASSESS_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">Attempts</h2>
        <section>
            <form action='/survey/deleteAttempt' method='post'>
                <table class="table ruler">
                    <thead>
                        <tr>
                            <th>Start</th>
                            <th>Finish</th>
                            <th>Time Taken</th>
                            <th>Reviewed</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- BEGIN attempt -->
                        <tr>
                            <td>{ATTEMPT_START}</td>
                            <td>{ATTEMPT_FINISH}</td>
                            <td>{ATTEMPT_TIME_TAKEN}</td>
                            <td>{ATTEMPT_REVIEWED_AT}</td>
                            <td>{ATTEMPT_MARKS}</td>
                            <td>
                                <!-- BEGIN attempt_review -->
                                <a href='/assess/studentReview/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}' class="icon-view no-text" alt="Review" title="Review"></a>
                                <!-- END attempt_review -->
                                <!-- BEGIN attempt_resume -->
                                <a href='/assess/attempt/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}' class="icon-next no-text" alt="Resume" title="Resume"></a>
                                <!-- END attempt_resume -->
                            </td>
                        </tr>
                        <!-- END attempt -->
                    </tbody>
                </table>
            </form>
        </section>
    </div>
</div>
