<h1>{SURVEY_NAME}</h1>

<div class="header_option clearfix">
	<!--<a href="/homepage/{CID}" class="btn go-back"><span></span>Back to Homepage</a>-->
    <!--<a href="/survey/results/{SURVEY_ID}" class="btn go-back"><span></span>Back to Survey Results</a>-->
</div>

<form action='/survey/deleteAttempt' method='post'>
	<table class="table  ruler-fix">
		<thead>
			<tr>
				<th>Student</th>
				<th>Start</th>
				<th>Finish</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody>
			<!-- BEGIN attempt -->
			<tr>
				<td><a href='/search/user/{ATTEMPT_USER_ID}'>{ATTEMPT_LASTNAME}, {ATTEMPT_FIRSTNAME}</a></td>
				<td>{ATTEMPT_START}</td>
				<td>{ATTEMPT_FINISH}</td>
				<!-- BEGIN attempt_review -->
				<td><a href='/assess/studentReview/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}'>Review</a></td>
				<!-- END attempt_review -->
				<!-- BEGIN attempt_resume -->
				<td><a href='/assess/attempt/{ATTEMPT_ASSESS_ID}/{ATTEMPT_SECTION_ID}'>Resume</a></td>
				<!-- END attempt_resume -->
			</tr>
			<!-- END attempt -->
		</tbody>
	</table>
</form>
