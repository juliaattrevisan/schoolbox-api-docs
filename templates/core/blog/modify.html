<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
	plugins : "table,tabfocus,media",
	content_css : "/css/{SITE_LOCATION}/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
	theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,outdent,indent,separator,sub,sup,separator,link,unlink,image,media,charmap,hr,separator,undo,redo",
	theme_advanced_buttons2 : "forecolor,tablecontrols,separator,removeformat,cleanup,code",
	theme_advanced_buttons3 : "",
	extended_valid_elements : "a[name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
	tabfocus_elements : ":prev,:next"
});

function verify() {
	if(document.getElementById('blogForm').heading.value == ""){
        alert("You need to enter a heading\n");
        return false;
	} else {
		return true;
	}
}
</script>
<!-- END custom_head -->

<h1>{ACTION} Blog Entry</h1>
<form method="post" enctype="multipart/form-data" id="blogForm" class="standardForm" action="/blog/modifyForm.php" onSubmit="return(verify());">
	<table>
		<tr>
			<td class="formLabelWidth"><h3>Title</h3></td>
			<td><input type="text" name="heading" size="35" maxlength="50" value="{ENTRY_HEADING}" /></td>
		</tr>
		<tr>
			<td><h3>Body</h3></td><td><textarea id="body" name="body" style="width:100%;height:350px">{ENTRY_BODY}</textarea></td>
		</tr>
		<tr>
			<td>&nbsp</td>
			<td >
				<input type="hidden" name="cid" value="{CID}" />
				<input type="hidden" name="blogID" value="{ID}" />
				<input type="submit" name="submit" value="{ACTION} Entry" class="btn"/>
				<!-- BEGIN delete -->
				<input type="submit" name="delete" value="Delete Entry" class="btn">
				<!-- END delete -->
			</td>
		</tr>
	</table>
</form>
