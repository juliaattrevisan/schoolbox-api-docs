<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode: 'textareas',
            file_browser_category_id : {CID}
        });

        $('#blogForm').alaressValidate();

        $('[data-delete]').click(function(event) {
            event.preventDefault();

            $(this).confirmDialog({
                text: 'Are you sure you want to delete this blog post?',
                confirmEvent: function() {
                     $('<input>').attr({
                     type: 'hidden',
                     name: 'delete',
                     value: '1'
                     }).appendTo('#blogForm');

                     $('#blogForm').submit();
                }
            });
        });
    })
</script>
<!-- END custom_head -->

{BREADCRUMB}

<div class="row">
    <div class="column small-12">
        <div class="actions-small-1 row">
            <div class="list-item">
                <div class="small-12 columns">
                    <h1>{ACTION} Blog</h1>
                </div>
            </div>
            <!-- BEGIN delete -->
            <nav>
                <a class="icon-more" title="" data-dropdown="header-options" aria-expanded="false"></a>
            </nav>
            <ul id="header-options" class="f-dropdown" data-dropdown-content="" aria-hidden="true">
                <li>

                    <a class="icon-delete" title="Delete Blog" data-delete />Delete Blog</a>
                </li>
            </ul>
            <!-- END delete -->
        </div>
    </div>
</div>
<div class="row">
	<div class="small-12 island">
		<form method="post" id="blogForm" action="/blog/modifyForm.php">
            <input type="hidden" name="cid" value="{CID}" />
            <input type="hidden" name="blogID" value="{ID}" />

			<section>
				<fieldset class="content">
					<div class="small-12 columns">
						<label>
                            Title
    						<input type="text" name="heading" maxlength="100" class="required" value="{ENTRY_HEADING}" />
                        </label>
						<label>
                            Body
							<textarea id="body" name="body">{ENTRY_BODY}</textarea>
						</label>
					</div>
				</fieldset>
			</section>
			<div class="row">
				<div class="small-12 column">
                    <input type="submit" name="submits" value="{ACTION} Blog" />
				</div>
			</div>
		</form>
	</div>
</div>
