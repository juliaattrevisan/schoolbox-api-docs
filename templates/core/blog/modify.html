<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
	$(function() {
		$.fn.alaressTiny({
			mode: 'textareas',
			file_browser_category_id : {CID}
		});

		$('#blogForm').validate();
	})
</script>
<!-- END custom_head -->

<h1>{ACTION} Blog Entry</h1>
<form method="post" enctype="multipart/form-data" id="blogForm"  action="/blog/modifyForm.php" class="clearfix" onSubmit="return(verify());">
	<table class="standardForm table">
		<tr>
			<td class="formLabelWidth"><h4>Title</h4></td>
			<td><label><input type="text" name="heading" size="35" maxlength="100" class="required" value="{ENTRY_HEADING}" /></label></td>
		</tr>
		<tr>
			<td><h4>Body</h4></td>
			<td>
				<textarea id="body" name="body" style="width:100%;height:350px">{ENTRY_BODY}</textarea>
				<input type="hidden" name="cid" value="{CID}" />
				<input type="hidden" name="blogID" value="{ID}" />
			</td>
		</tr>
	</table>

	<input type="submit" name="submit" value="{ACTION} Entry" class="submit-btn-plain"/>
	<!-- BEGIN delete -->
	<input type="submit" name="delete" value="Delete Entry" class="submit-btn-plain">
	<!-- END delete -->
</form>
