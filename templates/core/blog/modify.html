{BREADCRUMB}

<div class="row">
	<div class="small-12 island">
		<h1>{ACTION} Blog Entry</h1>
		<form method="post" enctype="multipart/form-data" id="blogForm" action="/blog/modifyForm.php" class="top">
            <input type="hidden" name="cid" value="{CID}" />
            <input type="hidden" name="blogID" value="{ID}" />

			<section>
				<fieldset class="content">
					<div class="small-12 columns">
						<label>Title
    						<input type="text" name="heading" size="35" maxlength="100" class="required" value="{ENTRY_HEADING}" /></label>
						<label>
                            Body
							<textarea id="body" name="body">{ENTRY_BODY}</textarea>
						</label>
					</div>
				</fieldset>
			</section>
			<div class="row">
				<div class="small-12 column">
                    <input type="submit" name="submit" value="{ACTION} Entry" />
					<!-- BEGIN delete -->
					<input type="submit" name="delete" value="Delete Entry" class="alert" />
					<!-- END delete -->
				</div>
			</div>
		</form>
	</div>
</div>

<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
    $(function() {
        $.fn.alaressTiny({
            mode: 'textareas',
            file_browser_category_id : {CID}
        });

        $('#blogForm').validate();
    })
</script>
