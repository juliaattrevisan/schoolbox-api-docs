<!-- BEGIN custom_head -->
<style>
    .homepage-statistics .left, .homepage-statistics .right {
        width: 49.5%;
    }
    h2 {
        margin-top: 20px;
    }
    .homepage-statistics .module {
        overflow: hidden;
    }
    .homepage-statistics .module p {
        padding: 8px;
    }
    .homepage-statistics h2.square-bottom {
        -webkit-border-bottom-right-radius: 0;
        -webkit-border-bottom-left-radius: 0;
        -moz-border-radius-bottomright: 0;
        -moz-border-radius-bottomleft: 0;
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
    }

    /* COMMON TO ALL BUTTON TYPES */
    .homepage-statistics .button {
        display: block;
        margin:  0;
        background: #fff;
    }
    .homepage-statistics .button:hover {
        text-decoration: none;
        background-color: #E9F6FF;
    }
    .homepage-statistics .button span {
        display: block;
    }
    .homepage-statistics .button .name {
        color: #000;
    }
    .homepage-statistics .button .name em {
        font-style: normal;
        color: #797979;
    }
    .homepage-statistics .button .group {
        color: #797979;
    }
    .homepage-statistics .button .prog {
        height: 2px;
        background: #76C4F9;
        border: solid 1px #44AEFF;
        margin: 6px 0 0 0;
    }

    /* BUTTON THUMB */
    .homepage-statistics .button.thumb {
        width: 64px;
        float: left;
        margin: 0;
        border-top: solid 1px #DEDEDE;
        border-left: solid 1px #DEDEDE;
        position: relative;
        top: -1px;
        left: -1px;
        padding: 5px;
    }
    .homepage-statistics .button.thumb img {
        width: 64px;
        height: 64px;
        margin: 0;
    }
    .homepage-statistics .button.thumb .name {
        margin-left: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .homepage-statistics .button.thumb .group {
        margin: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* BUTTON BAR */
    .homepage-statistics .button.bar {
        height: 40px;
        padding: 4px;
        border-bottom: solid 1px #dedede;
    }
    .homepage-statistics .button.bar .name {
        margin-left: 44px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .homepage-statistics .button.bar .name.single {
        height: 30px;
        line-height: 32px;
    }
    .homepage-statistics .button.bar .group {
        margin: 2px 0 0 44px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .homepage-statistics .button.bar:before {
        content: "\203a";
        float: right;
        line-height: 40px;
        margin-right: 24px;
        font-size: 24px;
    }
    .homepage-statistics .button.bar img {
        float: left;
        width: 32px;
        height: 32px;
        border: none;
    }

        /* BUTTON LIST */
    .homepage-statistics .button.list {
        height: 16px;
        padding: 6px 4px 4px 4px;
        border-bottom: solid 1px #dedede;
    }
    .homepage-statistics .button.list .name {
        margin-left: 4px;
    }
    .homepage-statistics .button.list:before {
        content: "\203a";
        float: right;
        line-height: 14px;
        margin-right: 24px;
        font-size: 24px;
    }
</style>
<!-- END custom_head -->
<h1 data-icon="feed">{CATEGORY_NAME}</h1>
<div class="homepage-statistics clearfix">
    <div class="top clearfix">{component_position_top}</div>
    <div class="left clearfix">{component_position_left}</div>
    <div class="right clearfix">{component_position_right}</div>
</div>
<input type="hidden" id="categoryID" value="{ID}" />
