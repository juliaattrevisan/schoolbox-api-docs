<input type="hidden" id="categoryID" value="{ID}" />

<div class="row">
    <div class="small-12 columns">
        <span class='header-actions'>
            <a href='/homepage/{ID}' class='button icon-previous'>Return to Homepage</a>
            <a class="button icon-calendar" data-dropdown="statistics-date-range" href="#" title="Change Date Range">Change Date Range</a>
        </span>

        <h1>{CATEGORY_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 columns">
        {component_position_top}
    </div>
    <div class="small-12 large-6 columns">
        {component_position_left}
    </div>
    <div class="small-12 large-6 columns">
        {component_position_right}
    </div>
</div>
