<h1>{HEADING} {LOCKED} (Comparing Revision {FROM_ID} to {TO_ID})</h1>
<span class="header_option"> <a href="/wiki/{CATEGORY_ID}/{SLUG}" class="btn go-back"><span></span>Return to latest</a> </span>

<div class="left">
	<div class="wysiwyg revision-box">
	{DIFF}
	</div>
	<p>Modified by <a href="/search/user/{AUTHOR_ID}">{AUTHOR}</a> on {MODIFIED}</p>
</div>

<div class="right">
	<h2>Revisions</h2>
	<table width="100%">
		<tr>
			<th>Date</th>
			<th>Author</th>
		</tr>
		<!-- BEGIN revision_list -->
		<tr class="{REVISION_CURRENT}">
			<td><a href="/wiki/revision/{WIKI_ID}/{REVISION_COMPARE}" >{REVISION_DATE}</a></td>
			<td>{REVISION_AUTHOR}</td>
			<td><!-- BEGIN revision_comparison --><a href="/wiki/diff/{WIKI_ID}/{REVISION_ID}/{REVISION_COMPARE}">Compare</a><!-- END revision_comparison --></td>
		</tr>
		<!-- END revision_list -->
	</table>
</div>
