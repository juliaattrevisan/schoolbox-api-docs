<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
    skin : "cirkuit",
	plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,paste,spellchecker",
	content_css : "/css/{SITE_LOCATION}/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
    theme_advanced_buttons1 : "formatselect,fontsizeselect,forecolor,separator,bold,italic,underline,separator,justifyleft,justifycenter,justifyright,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
    theme_advanced_buttons2 : "spellchecker,separator,selectall,pastetext,pasteword,separator,removeformat,cleanup,code,separator,outdent,indent,sub,sup,separator,hr,charmap,tablecontrols",
    theme_advanced_buttons3 : "",
    pdw_toggle_on : 1,
    pdw_toggle_toolbars : '2',
    extended_valid_elements : "img[src|border|alt=|title|hspace|vspace|width|height|align|style]",
    theme_advanced_blockformats : "p,address,h4,h5",
	file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
	file_browser_category_id : {CATEGORY_ID},
	tabfocus_elements : ":prev,:next",
	convert_urls : false
});
</script>

</script>
<!-- END custom_head -->
<h1>{ACTION} Wiki</h1>
<span class="header_option"><a href="/homepage/{CATEGORY_ID}" class="btn go-back"><span></span>Return to Homepage</a></span>
<form  action="/wiki/modifyForm.php" method="post">
    <input type="hidden" name="wikiID" value="{WIKI_ID}" />
    <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
    
  <table width="100%" class="standardForm">
    <tr>
      <td class="formLabelWidth"><h4>Heading</h4></td>
	  <td><input type="text" name="heading" size="60" value="{HEADING}" /></td>
    </tr>
    <tr>
      <td><h4>Body</h4></td>
	  <td><textarea name="body" style="width:100%;height:350px" >{BODY}</textarea></td>
    </tr>
  </table>
    <input type="hidden" name="revision" value="{REVISION}" />
  <input type="submit" class="submit-btn-plain" value="Save" />
  <div class="float-fix"></div>
</form>
