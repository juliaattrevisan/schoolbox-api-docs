<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
tinyMCE.init({
	mode : "textareas",
	theme : "advanced",
	plugins : "table,inlinepopups,media,advimage,assetmanager",
	content_css : "/css/{SITE_LOCATION}/tiny.css",
	theme_advanced_toolbar_location : "top",
	theme_advanced_toolbar_align : "left",
	theme_advanced_statusbar_location : "bottom",
	theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,outdent,indent,separator,sub,sup,separator,link,unlink,image,media,charmap,hr,separator,undo,redo",
	theme_advanced_buttons2 : "forecolor,tablecontrols,separator,removeformat,cleanup,code",
	theme_advanced_buttons3 : "",
	extended_valid_elements : "a[name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
	file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
	file_browser_category_id : {CATEGORY_ID},
	convert_urls : false
});

</script>
<!-- END custom_head -->
<h1>{ACTION} Wiki</h1>
<span class="header_option"><a href="/homepage/{CATEGORY_ID}">Return to Homepage</a></span>
<form class="standardForm" action="/wiki/modifyForm.php" method="post">
  <table>
    <tr>
      <td class="formLabelWidth"><h3>Heading</h3></td>
      <td><input type="text" name="heading" size="60" value="{HEADING}" /></td>
    </tr>
    <tr>
      <td><h3>Body</h3></td>
      <td><textarea name="body" style="width:100%;height:350px" >{BODY}</textarea></td>
    </tr>
    <tr>
    <td>&nbsp;</td>
    <td>
    <input type="hidden" name="wikiID" value="{WIKI_ID}" />
    <input type="hidden" name="categoryID" value="{CATEGORY_ID}" />
    <input type="submit" class="btn" value="Save" /></td>
    </tr>
  </table>
</form>
