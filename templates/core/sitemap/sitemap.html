<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/mootools.js"></script>
<script type="text/javascript" src="/javascript/behaviour.js"></script>
<script type="text/javascript" src="/javascript/rightcontext.js"></script>
<script type="text/javascript" src="/javascript/sitemap.js"></script>
<script type="text/javascript" src="/javascript/windoo/windoo.svn.js"></script>

<link rel="stylesheet" type="text/css" media="screen" href="/css/sitemap.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/rightcontext.css" />
<link rel="stylesheet" type="text/css" media="screen" href="/css/windoo/windoo.alphacube.css" />

<!-- END custom_head -->




<h1>{TITLE}</h1>
<div id='sitemap'>
    <div id='sitemap-nav'>{NAV_CONTENT} </div>
    <div id='sitemap-window'>{WINDOW_CONTENT} </div>
</div>



<script type='text/javascript'>
	
	menu1 = { attributes: "afileid,acatid,ainline,aurl,alink,acomments,aowner,asubmitted" ,
	
		items: [ 
			   {type:RightContext.TYPE_MENU,
				text:"Preview",
				requires: ["ainline", "Y"],
				url:"/sendframe.php?id=[afileid]"},
	
			   {type:RightContext.TYPE_MENU,
				text:"Save As",
				requires: ["aurl", "N"],
				url:"/send.php?id=[afileid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Open",
				requires: ["aurl", "Y"],
				url:"/redir.php?url=[alink]"},
			  
			   {type: RightContext.TYPE_SEPERATOR },
			   
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				requires: ["aurl", "N"],
				url:"/cms/modResource.php?type=modfile&id=[afileid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				requires: ["aurl", "Y"],
				url:"/cms/modResource.php?type=modurl&id=[afileid]"},
			  
			   {type: RightContext.TYPE_SEPERATOR },
			   
			   {type:RightContext.TYPE_MENU,
				text:"New File",
				url:"/cms/modResource.php?type=file&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Link",
				url:"/cms/modResource.php?type=url&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Folder",
				url:"/cms/modFolder.php?action=add&cid=[acatid]"},
			   
			   {type: RightContext.TYPE_SEPERATOR },
				
			   {type:RightContext.TYPE_MENU,
			   	text:"Properties",
				onclick:function(e) { Sitemap.openDetails([afileid], e); }
				}]
	};			   
	
	menu2 = { attributes: "acatid,ahomepage,acatname" ,
	
		items: [ 
			   {type:RightContext.TYPE_MENU,
				text:"View Homepage",
				requires: ["ahomepage", "Y"],
				url:"/homepage.php?category=[acatid]"},
	
			  {type:RightContext.TYPE_MENU,
				text:"Image Gallery",
				url:"/cms/imageGallery.php?category=[acatid]"},						
			  
			   {type: RightContext.TYPE_SEPERATOR,
				requires: ["ahomepage", "Y"]},
			   
				
			   {type:RightContext.TYPE_MENU,
				text:"Modify",
				url:"/cms/modFolder.php?action=mod&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"Delete",
				onclick:function() { if (confirm('Are you sure you want to delete [acatname]?')) { window.open("/cms/modFolder.php?delete=[acatid]",'_blank',''); }} },
			  
			   {type: RightContext.TYPE_SEPERATOR },
			   
			   {type:RightContext.TYPE_MENU,
				text:"New File",
				url:"/cms/modResource.php?type=file&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Link",
				url:"/cms/modResource.php?type=url&cid=[acatid]"},
				
			   {type:RightContext.TYPE_MENU,
				text:"New Folder",
				url:"/cms/modFolder.php?action=add&cid=[acatid]"} ]
			
	};	
	
	RightContext.addMenu("menuFile", menu1);
	RightContext.addMenu("menuCategory", menu2);
	RightContext.initialize();

</script>
