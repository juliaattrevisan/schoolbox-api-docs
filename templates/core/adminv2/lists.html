<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function() {
        $('[data-button=add-row]').click(function(event) {
            event.preventDefault();

            var newRow = $('[data-clone]').find('tr').clone();

            $('[data-list]').find('tbody').append(newRow).find('input[name="name[{ROW_NUMBER}]"]').last().focus();

            return false;
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_NAV}

<div class="row">
    <div class="small-12 island">
        <dl class="sub-nav">
            <!-- BEGIN table_tab -->
            <dd class="{TABLE_CURRENT}"><a href="/adminv2/list/{TABLE_NAME}">{TABLE_TITLE}</a></dd>
            <!-- END table_tab -->
        </dl>

        <form method="post" action="/adminv2/listForm.php">
            <!-- BEGIN table_schema -->
            <input name="tableName" type="hidden" value="{TABLE_CURRENT_NAME}" />
            <input name="tableIndex" type="hidden" value="{TABLE_CURRENT_INDEX}" />

            <section>
                <!-- END table_schema -->
                <table data-list>
                    <thead>
                        <tr>
                            <!-- BEGIN table_heading -->
                            <th>{TABLE_HEAD}</th>
                            <!-- END table_heading -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- BEGIN table_row -->
                        <tr>
                            <!-- BEGIN table_cell_static -->
                            <td>
                                {TABLE_DATA}
                                <input name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="hidden" value="{TABLE_DATA}" />
                            </td>
                            <!-- END table_cell_static -->
                            <!-- BEGIN table_cell -->
                            <td>
                                <input class="required {NULLABLE_CLASS}" name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="text" value="{TABLE_DATA}" />
                                <!-- BEGIN table_cell_null -->
                            </td>
                            <td>
                                <input id="{TABLE_COLUMN}-{ROW_NUMBER}-null" type="checkbox" name="{TABLE_COLUMN}[{ROW_NUMBER}]" value="NULL" {TABLE_DATA_NULL_CHECKED} />
                                <label for="{TABLE_COLUMN}-{ROW_NUMBER}-null" class="checkbox-label">Null?</label>
                                <!-- END table_cell_null -->
                            </td>
                            <!-- END table_cell -->
                            <!-- BEGIN table_cell_select -->
                            <td>
                                <select name="{TABLE_COLUMN}[{ROW_NUMBER}]">
                                    <!-- BEGIN table_cell_select_option -->
                                    <option value="{OPTION_VALUE}" {OPTION_VALUE_SELECTED}>{OPTION_LABEL}</option>
                                    <!-- END table_cell_select_option -->
                                </select>
                            </td>
                            <!-- END table_cell_select -->
                            <!-- BEGIN table_cell_checkbox -->
                            <td>
                                <input name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="hidden" value="0" />
                                <input id="{TABLE_COLUMN}-{ROW_NUMBER}-default" name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="checkbox" value="1" {TABLE_DATA_CHECKED}/>
                                <label for="{TABLE_COLUMN}-{ROW_NUMBER}-default" class="checkbox-label"></label>
                            </td>
                            <!-- END table_cell_checkbox -->
                        </tr>
                        <!-- END table_row -->
                    </tbody>
                </table>

                <!-- BEGIN create_new -->
                <div class="content">
                    <a href="#" data-button="add-row" class="button icon-add">New Row</a>
                </div>
                <!-- END create_new -->
            </section>
            <input type="submit" value="Save"/>
        </form>
    </div>
</div>

<table data-clone class="hide">
	<tbody>
		<tr>
			<!-- BEGIN newInput -->
			<td>
                <input class="{NULLABLE_CLASS}" name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="{TYPE}" {READONLY} value="{VALUE}" />
                <!-- BEGIN newInput_null -->
            </td>
            <td>
                <input id="{TABLE_COLUMN}-new-null" type="checkbox" name="{TABLE_COLUMN}[{ROW_NUMBER}]" value="NULL" />
                <label for="{TABLE_COLUMN}-new-null" class="checkbox-label">Null?</label>
                <!-- END newInput_null -->
            </td>
			<!-- END newInput -->
            <!-- BEGIN newSelect -->
            <td>
                <select name="{TABLE_COLUMN}[{ROW_NUMBER}]">
                    <!-- BEGIN newSelect_option -->
                    <option value="{OPTION_VALUE}">{OPTION_LABEL}</option>
                    <!-- END newSelect_option -->
                </select>
            </td>
			<!-- END newSelect -->
            <!-- BEGIN newCheckbox -->
            <td>
                <input name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="hidden" value="0" />
                <input name="{TABLE_COLUMN}[{ROW_NUMBER}]" type="checkbox" {READONLY} value="1" class="checkbox-label" />
            </td>
            <!-- END newCheckbox -->
		</tr>
	</tbody>
</table>
