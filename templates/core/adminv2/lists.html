<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.autoresize.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>


<script type="text/javascript">

$j(function() {
		
	$j.fn.qtip.defaults.position.corner = {
		target: 'topLeft',
		tooltip: 'bottomLeft'
	}
	
	$j.fn.qtip.defaults.style = {
		tip: 'bottomLeft',
		name: 'green'
	}
		
	$j('label span').each(function() {
		activeContent = $j(this).siblings('em').html();
		$j(this).qtip({
			content: activeContent,
			api: {
					// Retrieve the content when tooltip is first rendered
					 onRender: function()
					 {
						var self = this;
					 }
				 }
		});
	});
	
	$j('#settings').validate();
	
});

</script>


<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h2>Lists</h2>
	
	<div class="level green hide-it clearfix">	
		You've successfully updated your settings.
	</div>
	
	<div class="settings-nav-holder">
		<ul class="settings-nav">
            <!-- BEGIN table_tab -->
			<li><a href="/adminv2/list/{TABLE_NAME}" class="{TABLE_CURRENT}">{TABLE_TITLE}<span></span></a></li>
            <!-- END table_tab -->
		</ul>
	</div>
	<div class="settings">
		<form id="settings" class="admin-form level clearfix" method="post" action="/adminv2/listForm.php">
			<!-- BEGIN table_schema -->
			<input name="tableName" type="hidden" value="{TABLE_CURRENT_NAME}" />
			<input name="tableIndex" type="hidden" value="{TABLE_CURRENT_INDEX}" />
			<!-- END table_schema -->
			<table id="tableData">
				<colgroup>
					<col width="10%" />
				</colgroup>
				<thead>
					<tr>
						<!-- BEGIN table_heading -->
						<th scope="col">{TABLE_HEAD}</th>
						<!-- END table_heading -->
					</tr>
				</thead>
				<tbody>
					<!-- BEGIN table_row -->
					<tr class="{ROW_COLOR}">
						<!-- BEGIN table_cell_static -->
						<td>
							{TABLE_DATA}
							<input name="{TABLE_COLUMN}[]" type="hidden" value="{TABLE_DATA}" />
						</td>
						<!-- END table_cell_static -->
						<!-- BEGIN table_cell -->
						<td><input class="required" name="{TABLE_COLUMN}[]" type="text" value="{TABLE_DATA}" /></td>
						<!-- END table_cell -->
                        <!-- BEGIN table_cell_select -->
                            <td><select name="{TABLE_COLUMN}[]">
                                <!-- BEGIN table_cell_select_option -->
                                    <option value="{OPTION_VALUE}" {OPTION_VALUE_SELECTED}>{OPTION_VALUE}</option>
                                <!-- END table_cell_select_option -->
                            </select></td>
                        <!-- END table_cell_select -->
					</tr>
					<!-- END table_row -->
				</tbody>
			</table>
            <!-- BEGIN create_new -->
			<a href="#" id="addNewRow" class="btn add float-left"><span></span>New row</a>
            <!-- END create_new -->
			<input type="submit" class="submit-btn-plain" value="Save"/>
		</form>
	</div>
</div>

<table id="newData" class="hide-it">
	<tbody>
		<tr>
			<!-- BEGIN newInput -->
			<td><input name="{TABLE_COLUMN}[]" type="{TYPE}" {READONLY} value="" /></td>
			<!-- END newInput -->
            <!-- BEGIN newSelect -->
                <td><select name="{TABLE_COLUMN}[]">
                    <!-- BEGIN newSelect_option -->
                        <option value="{OPTION_VALUE}">{OPTION_VALUE}</option>
                    <!-- END newSelect_option -->
                </select></td>
			<!-- END newSelect -->
		</tr>
	</tbody>
</table>

<script type="text/javascript">
$j(function() {
	$j('#addNewRow').click(function() {
		var newRow = $j('#newData').find('tr').clone();
		$j('#tableData').find('tbody').append(newRow);
		return false;
	});
});
</script>
