<input type="hidden" name="record[{CONNECTOR_ID}][eventType]" value='{EVENTTYPE_NAME}' />
<input type="hidden" name="record[{CONNECTOR_ID}][connectorClass]" value='{CONNECTOR_CLASS}' />

<fieldset class='calendarOptions'>
	<label class='medium'>
		<h4>URL</h4>
		<p>
			<input type='text' id='update_{CONNECTOR_ID}' class='updateConfig' name="record[{CONNECTOR_ID}][url]" value='{URL}' />
		</p>
	</label>

	<label>
		<h4>Event Type</h4>
		<p>
			<select name="record[{CONNECTOR_ID}][luEventType]">
				<!-- BEGIN luEventType -->
				<option value='{LUEVENTTYPE_VALUE}' {LUEVENTTYPE_SELECTED}>{LUEVENTTYPE_NAME}</option>
				<!-- END luEventType -->
			</select>
		</p>
	</label>

	<label>
		<h4>Level</h4>
		<p>
			<select name="record[{CONNECTOR_ID}][level]">
				<!-- BEGIN level_drop -->
				<option value="{LEVEL_ID}" {LEVEL_ID_SELECTED}>{LEVEL_NAME}</option>
				<!-- END level_drop -->
			</select>
		</p>
	</label>
	<label>
		<h4>Campus</h4>
		<p>
			<!-- BEGIN campus_list -->
			<input type="checkbox" class="campusCheck" name="record[{CONNECTOR_ID}][campus][]" value="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} /> {CAMPUS_NAME}<br />
			<!-- END campus_list -->
		</p>
	</label>

	<label>
		<h4>Group</h4>
		<p>
			<!-- BEGIN group_list -->
			<input type="checkbox" name="record[{CONNECTOR_ID}][groupCheck][]" value="{GROUP_ID}" {GROUP_ID_SELECTED} /> {GROUP_NAME}<br />
			<!-- END group_list -->
		</p>
	</label>

	<label class='control'>
		<a id="remove_{CONNECTOR_ID}" class='removeConfig submit-btn-plain' />&ndash;</a>
	</label>
</fieldset>
