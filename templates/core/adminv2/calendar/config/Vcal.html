<li class="row">
    <input type="hidden" name="record[{CONNECTOR_ID}][eventType]" value="{EVENTTYPE_NAME}" />
    <input type="hidden" name="record[{CONNECTOR_ID}][connectorClass]" value="{CONNECTOR_CLASS}" />
    <div class="column medium-6">
        <div class="content">
            <!-- BEGIN error_message -->
            <div class="alert-box alert">
                This calendar subscription has failed {ERROR_COUNT} times, please fix.
            </div>
            <!-- END error_message -->
        <label>Label
            <input type='text' name="record[{CONNECTOR_ID}][label]" value="{CONNECTOR_LABEL}" />
        </label>

        <label>URL
            <input type='text' id="update_{CONNECTOR_ID}" class='updateConfig' name="record[{CONNECTOR_ID}][url]" value="{URL}" />
        </label>
        <label>Authorisation
            <input type='text' name="record[{CONNECTOR_ID}][authorization]" value="{AUTHORIZATION}" />
        </label>

        <!-- BEGIN event_type_list -->
        <label>Event Type
            <select name="record[{CONNECTOR_ID}][luEventType]">
                <!-- BEGIN luEventType -->
                <option value="{LUEVENTTYPE_VALUE}" {LUEVENTTYPE_SELECTED}>{LUEVENTTYPE_NAME}</option>
                <!-- END luEventType -->
            </select>
        </label>
        <!-- END event_type_list -->
        </div>
    </div>
    <div class="column medium-6">
        <div class="content">
            <label>Campus</label>
            <ul class="option-list">
            <!-- BEGIN campus_list -->
                <li>
                    <input id="campus-{CAMPUS_ID}-{CONNECTOR_ID}" type="checkbox" class="campusCheck" name="record[{CONNECTOR_ID}][campus][]" value="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} />
                    <label for="campus-{CAMPUS_ID}-{CONNECTOR_ID}" class="checkbox-label">{CAMPUS_NAME}</label>
                </li>
            <!-- END campus_list -->
            </ul>
            <label>Role</label>
            <ul class="option-list">
            <!-- BEGIN group_list -->
                <li>
                    <input id="role-{GROUP_ID}-{CONNECTOR_ID}" type="checkbox" name="record[{CONNECTOR_ID}][groupCheck][]" value="{GROUP_ID}" {GROUP_ID_SELECTED} />
                    <label for="role-{GROUP_ID}-{CONNECTOR_ID}" class="checkbox-label">{GROUP_NAME}</label>
                </li>
            <!-- END group_list -->
            </ul>
        </div>
    </div>
    <div class="column small-12">
        <div class="content">
            <a id="remove_{CONNECTOR_ID}" data-removesource class='button icon-delete'>Remove source</a>
        </div>
    </div>
</li>
