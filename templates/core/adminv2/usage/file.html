<tr data-location="{FILE_LOCATION}" data-filehash="{FILE_HASH}" data-fileid="{FILE_ID}">

	<td><a href="/storage/fetch.php?hash={FILE_HASH}">{FILE_FILENAME}</a></td>
    <!-- END file_storage -->

    <!-- BEGIN file_sbfs -->

    <!-- END file_sbfs -->

    <!-- BEGIN file_myfile -->
    <td><a href="/cms/sendMyFile.php?id={FILE_ID}">{FILE_FILENAME}</a></td>
    <!-- END file_myfile -->

    <!-- BEGIN file_submission -->

    <!-- END file_submission -->

    <!-- BEGIN file_return -->
    <td><a href="/submission/send.php?id={FILE_ID}&amp;save=1&amp;return=1">{FILE_FILENAME}</a></td>

    <!-- END file_unlinked -->

    <!-- BEGIN no_category -->

        <a href="{FILE_DELETE_URL}" data-action="delete">x</a>
        <!-- END is_deletable -->
