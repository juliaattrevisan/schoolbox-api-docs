<h1>Schoolbox Administration</h1>

<dl class="sub-nav">
    <!-- BEGIN admin_nav_item -->
    <dd class="{ADMNAV_CURRENT}"><a href="/adminv2/{ADMNAV_HREF}">{ADMNAV_LABEL}</a></dd>
    <!-- END admin_nav_item -->
</dl>

<h2>Usage for <a href="/search/user/{USAGE_USER_ID}">{USAGE_USER_FULLNAME}</a></h2>

<div class="row">
	<div class="large-4 columns">
		<div data-panel='total' class='loader'>Loading data...</div>
		<div data-panel='group' class='loader'>Loading data...</div>
	</div>
	<div class="large-8 columns">
		<div data-panel='type' class='loader'>Loading data...</div>
	</div>
    <div class="large-12 columns">
	    <div data-panel='user' class='loader'>Loading data...</div>
    </div>
</div>

<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type='text/javascript' src='/javascript/shared/jquery.number-format.js'></script>
<script type='text/javascript' src='/javascript/shared/bargraph/bargraph.js'></script>
<script type='text/javascript' src='/javascript/jquery.confirmDialog.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/total.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/group.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/type.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/tabulator.js'></script>

<script type='text/javascript'>
    $(function() {
        $('[data-panel=total]').usageTotalPlain({
            url: '/adminv2/usage/ajax/specificAjax?type=total&userId={USAGE_USER_ID}',
            title: 'Total'
        });

        $('[data-panel=group]').usageGroup({
            url: '/adminv2/usage/ajax/specificAjax?type=group&userId={USAGE_USER_ID}',
            title: 'Type'
        });

        $('[data-panel=type]').usageType({
            url: '/adminv2/usage/ajax/specificAjax?type=type&userId={USAGE_USER_ID}',
            title: 'Category'
        });

        var usageTable = $('[data-panel=user]');
        usageTable.usageTabulator({
            url: '/adminv2/usage/ajax/specificAjax?type=files&userId={USAGE_USER_ID}',
            title: 'Files',
            orderBy: 'bytes',
            order: 'DESC',
            index: 0,
            numPerPage: 25,
            numTotal: {USAGE_NUM_TOTAL},
            columns: [
                {column: 'name', label: 'Filename'},
                {column: 'bytes', label: 'Size'},
                {column: 'groupName', label: 'Location'},
                {column: 'categoryName', label: 'Category'},
                {column: 'mime_type', label: 'Type'},
                {column: '', label: 'Delete'}
            ]
        });

        usageTable.on('click', '[data-action=delete]', function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this file?',
                confirmEvent: function() {
                    $.get(element.attr('href')).done(function() {
                        window.location.reload();
                    });
                }
            });
        });
    });
</script>
