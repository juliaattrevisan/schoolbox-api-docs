<link href='/javascript/bargraph/bargraph.css' media='screen' rel='stylesheet' />
<script type='text/javascript' src='/javascript/bargraph/bargraph.js'></script>

<script type='text/javascript' src='/javascript/flot/jquery.flot.js'></script>
<script type='text/javascript' src='/javascript/flot/jquery.flot.stack.js'></script>
<script type='text/javascript' src='/javascript/flot/jquery.flot.pie.js'></script>
<script type='text/javascript' src='/javascript/usage/total.js'></script>
<script type='text/javascript' src='/javascript/usage/group.js'></script>
<script type='text/javascript' src='/javascript/usage/type.js'></script>
<script type='text/javascript' src='/javascript/usage/tabulator.js'></script>

<script type='text/javascript'>
	$j(function() {
		$j('#group-usage').usageGroup({
			url: '/adminv2/usage/specificAjax?type=group&userId={USAGE_USER_ID}',
			title: 'Type'
		});

		$j('#type-usage').usageType({
			url: '/adminv2/usage/specificAjax?type=type&userId={USAGE_USER_ID}',
			title: 'Category'
		});

		$j('#user-usage').usageTabulator({
			url: '/adminv2/usage/specificAjax?type=files&userId={USAGE_USER_ID}',
			title: 'Files',
			orderBy: 'lastname',
			order: 'ASC',
			index: 0,
			numPerPage: 25,
			numTotal: {USAGE_NUM_TOTAL},
			columns: [
				{column: 'name', label: 'Filename'},
				{column: 'bytes', label: 'Size'},
				{column: 'groupName', label: 'Group'},
				{column: 'mime_type', label: 'Type'}
			]
		});
	});
</script>

<style type='text/css'>
	.graph {
		width:500px;
		height:500px;
	}

	.loader {
		background-image: url('/images/loading-bar.gif');
		background-repeat: no-repeat;
		background-position: center center;
	}

	/* For the user usage table
	 */
	ul.paginator {
		margin-top: 16px;
	}

	ul.paginator li {
		display: block;
		float: left;
		margin-right: 8px;
		margin-bottom: 16px;
		cursor: pointer;
	}

</style>

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
	<!-- BEGIN admin_nav_item -->
	<li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
	<!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h1>Global Usage</h1>
	<div id='group-usage' class='graph loader'></div>
	<div id='type-usage' class='graph loader'></div>
	<div id='user-usage' class='graph loader'></div>
</div>
