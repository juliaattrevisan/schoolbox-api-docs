<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/highcharts.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/number/jquery.number-format.js'></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/server-usage/jquery.server-usage.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/total.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/group.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/type.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/tabulator.js'></script>

<script type='text/javascript'>
    $(function() {
        $('[data-panel=total]').usageTotalPlain({
            url: '/adminv2/usage/ajax/specificAjax?type=total&userId={USAGE_USER_ID}',
            title: 'Total'
        });

        $('[data-panel=group]').usageGroup({
            url: '/adminv2/usage/ajax/specificAjax?type=group&userId={USAGE_USER_ID}',
            title: 'Type'
        });

        $('[data-panel=type]').usageType({
            url: '/adminv2/usage/ajax/specificAjax?type=type&userId={USAGE_USER_ID}',
            title: 'Category'
        });

        var usageTable = $('[data-panel=user]');
        usageTable.usageTabulator({
            url: '/adminv2/usage/ajax/specificAjax?type=files&userId={USAGE_USER_ID}',
            title: 'Files',
            orderBy: 'bytes',
            order: 'DESC',
            index: 0,
            numPerPage: 25,
            numTotal: {USAGE_NUM_TOTAL},
            columns: [
                {column: 'name', label: 'Filename'},
                {column: 'bytes', label: 'Size'},
                {column: 'groupName', label: 'Location'},
                {column: 'categoryName', label: 'Category'},
                {column: 'mime_type', label: 'Type'},
                {column: '', label: 'Delete'}
            ]
        });

        usageTable.on('click', '[data-action=delete]', function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this file?',
                confirmEvent: function() {
                    $.get(element.attr('href')).done(function() {
                        window.location.reload();
                    });
                }
            });
        });
    });
</script>
<!-- END custom_head -->

<div class="admin-container row">

    {ADMIN_NAV}

    <div class="admin-content">
        <div class="small-12 columns">
            <h2 class="subheader">Usage for <a href="/search/user/{USAGE_USER_ID}">{USAGE_USER_FULLNAME}</a></h2>
        </div>
        <div class="small-12 island">
            <section>
                <div class="row">
                    <div class="small-12 large-4 columns">
                        <div class="content">
                            <div data-panel='total'>
                                <div class="loader"></div>
                            </div>
                        </div>
                        <div data-panel='group'>
                            <div class="loader"></div>
                        </div>
                    </div>
                    <div class="small-12 large-8 columns">
                        <div data-panel='type'>
                            <div class="loader"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <div class="small-12 columns">
            <div data-panel='user'>
                <div class="loader"></div>
            </div>
        </div>
    </div>
</div>
