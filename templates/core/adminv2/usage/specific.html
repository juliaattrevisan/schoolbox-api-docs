<link href='/javascript/bargraph/bargraph.css' media='screen' rel='stylesheet' />
<script type='text/javascript' src='/javascript/bargraph/bargraph.js'></script>

<script type='text/javascript' src='/javascript/components/flot/jquery.flot.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.stack.js'></script>
<script type='text/javascript' src='/javascript/components/flot/jquery.flot.pie.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/total.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/group.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/type.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/tabulator.js'></script>

<script type='text/javascript'>
	$(function() {
		$('#total-usage').usageTotalPlain({
			url: '/adminv2/usage/ajax/specificAjax?type=total&userId={USAGE_USER_ID}',
			title: 'Total'
		});

		$('#group-usage').usageGroup({
			url: '/adminv2/usage/ajax/specificAjax?type=group&userId={USAGE_USER_ID}',
			title: 'Type'
		});

		$('#type-usage').usageType({
			url: '/adminv2/usage/ajax/specificAjax?type=type&userId={USAGE_USER_ID}',
			title: 'Category'
		});

        var usageTable = $('#user-usage');
		usageTable.usageTabulator({
			url: '/adminv2/usage/ajax/specificAjax?type=files&userId={USAGE_USER_ID}',
			title: 'Files',
			orderBy: 'bytes',
			order: 'DESC',
			index: 0,
			numPerPage: 25,
			numTotal: {USAGE_NUM_TOTAL},
			columns: [
				{column: 'name', label: 'Filename'},
				{column: 'bytes', label: 'Size'},
				{column: 'groupName', label: 'Location'},
                {column: 'categoryName', label: 'Category'},
				{column: 'mime_type', label: 'Type'},
                {column: '', label: 'Delete'}
			]
		});

        usageTable.on('click', '[data-action="delete"]', function(event) {
            event.preventDefault();
            if (confirm('Are you sure you wish to delete this file?')) {
                $.get(this.href)
                    .done(function() {
                        window.location.reload();
                    });
            }
        });
	});
</script>

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
	<!-- BEGIN admin_nav_item -->
	<li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
	<!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h1>Usage for <a href="/search/user/{USAGE_USER_ID}">{USAGE_USER_FULLNAME}</a></h1>
	<div class="one-third clearfix">
		<div id='total-usage' class='level loader'>Loading data...</div>
		<div id='group-usage' class='level loader'>Loading data...</div>
	</div>
	<div class="two-thirds no-margin clearfix">
		<div id='type-usage' class='level loader'>Loading data...</div>
	</div>
	<div class="clearfix"></div>
	<div id='user-usage' class='level loader'>Loading data...</div>
</div>
