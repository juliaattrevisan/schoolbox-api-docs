<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/components/highcharts/highcharts.js"></script>
<script type='text/javascript' src='/javascript/shared/jquery.number-format.js'></script>
<script type="text/javascript" src="/javascript/admin/jquery.serverUsage.js"></script>
<script type='text/javascript' src='/adminv2/usage/javascript/total.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/group.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/type.js'></script>
<script type='text/javascript' src='/adminv2/usage/javascript/tabulator.js'></script>

<script type='text/javascript'>
    $(function() {
        $('[data-panel=global]').usageTotal({
            url: '/adminv2/usage/ajax/allAjax?type=total',
            title: 'Total'
        });

        $('[data-panel=group]').usageGroup({
            url: '/adminv2/usage/ajax/allAjax?type=group',
            title: 'Roles'
        });

        $('[data-panel=type]').usageType({
            url: '/adminv2/usage/ajax/allAjax?type=type',
            title: 'Category'
        });

        $('[data-panel=user]').usageTabulator({
            url: '/adminv2/usage/ajax/allAjax?type=user',
            title: 'Users',
            orderBy: 'bytes',
            order: 'DESC',
            index: 0,
            numPerPage: 25,
            numTotal: {USAGE_NUM_TOTAL}
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_NAV}

<div class="row">
    <div class="small-12 columns">
        <h2 class="subheader">Global Usage</h2>
    </div>
    <div class="small-12 island">
        <section>
            <div class="row">
                <div class="small-12 large-4 column">
                    <div data-panel='global' class='loader'></div>
                    <div data-panel='group' class='loader'></div>
                </div>
                <div class="small-12 large-8 column">
                    <section>
                        <div data-panel='type' class='loader'></div>
                    </section>
                </div>
            </div>
        </section>
    </div>
    <div class="small-12 columns">
        <div data-panel='user' class='loader'></div>
    </div>
</div>
