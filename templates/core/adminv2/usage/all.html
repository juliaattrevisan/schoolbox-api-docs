<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/highcharts.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/number/jquery.number-format.js'></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/server-usage/jquery.server-usage.js?v={SITE_VERSION}"></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/total.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/group.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/type.js'></script>
<script type='text/javascript' src='{CDN_PREFIX}/js/admin/usage/tabulator.js'></script>

<script type='text/javascript'>
    $(function() {
        $('[data-panel=global]').usageTotal({
            url: '/adminv2/usage/ajax/allAjax?type=total',
            title: 'Total'
        });

        $('[data-panel=group]').usageGroup({
            url: '/adminv2/usage/ajax/allAjax?type=group',
            title: 'Roles'
        });

        $('[data-panel=type]').usageType({
            url: '/adminv2/usage/ajax/allAjax?type=type',
            title: 'Category'
        });

        $('[data-panel=user]').usageTabulator({
            url: '/adminv2/usage/ajax/allAjax?type=user',
            title: 'Users',
            orderBy: 'bytes',
            order: 'DESC',
            index: 0,
            numPerPage: 25,
            numTotal: {USAGE_NUM_TOTAL}
        });
    });
</script>
<!-- END custom_head -->

<div class="admin-container row">

    {ADMIN_NAV}

    <div class="admin-content">
        <div class="small-12 columns">
            <h2 class="subheader">Global Usage</h2>
        </div>
        <div class="small-12 island">
            <section>
                <div class="row">
                    <div class="small-12 large-4 column">
                        <div data-panel='global'>
                            <div class="loader"></div>
                        </div>
                        <div data-panel='group'>
                            <div class="loader"></div>
                        </div>
                    </div>
                    <div class="small-12 large-8 column">
                        <section>
                            <div data-panel='type'>
                                <div class="loader"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </section>
        </div>
        <div class="small-12 columns">
            <div data-panel='user'>
                <div class="loader"></div>
            </div>
        </div>
    </div>
</div>
