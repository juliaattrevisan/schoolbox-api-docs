<!-- BEGIN custom_head -->
<style type="text/css">

  .wd-rule > a {
    display: block;
    transition: all 200ms ease-out;
    border-left: solid 4px transparent;
    padding-left: 4px;
  }
  .wd-rule > a:hover {
    text-decoration: none;
    color: #000;
    border-left-color: #000;
  }
  .wd-rule > a em {
    white-space: pre;
    font-family: monospace;
  }

</style>
<!-- END custom_head -->
<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
  <!-- BEGIN admin_nav_item -->
  <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
  <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
  <h2>WebDAV Configuration</h2>

  <div class="two-thirds">
    <div class="level clearfix">
      <h3>Mapping Rules</h3>
      <!-- BEGIN rule -->
      <div class="wd-rule">
        <hr/>
        <a href="#">
          <em>{WD_RULE_SUMMARY}</em>
        </a>
        <div style="display: none;">
          <ul class="wd-conditions">
            <!-- BEGIN condition -->
            <li class="wd-condition">
              Condition: <a href="#">{WD_CONDITION}</a>
            </li>
            <!-- END condition -->
          </ul>
          <div class="wd-effect">
            <!-- BEGIN effect -->
            <fieldset>
              <label>{WD_EFFECT_KEY}
                <input type="checkbox" name="effect[{RULE_ID}][baseUri]" />
              </label>
              <textarea style="width:100%;">{WD_EFFECT}</textarea>
            </fieldset>
            <!-- END effect -->
          </div>
        </div>
      </div>
      <!-- END rule -->
      <a class="submit-btn-plain">New Rule</a>
    </div>
  </div>

  <div class="one-third">
    <div class="level clearfix">
      <form action="/adminv2/webdav-config" method="POST">
        <h3>System Defaults</h3>
        <p>These are the default values used for any fields that are not populated by a mapping rule for a user.</p>
        <label>URI
          <input type="text" name="baseUri" placeholder="http://" value="{WD_DEF_BASE_URI}" />
        </label>
        <label>Username
          <input type="text" name="baseUri" placeholder="{:username}" value="{WD_DEF_USERNAME}" />
        </label>
        <label>Password
          <input type="text" name="baseUri" placeholder="{:password}" value="{WD_DEF_PASSWORD}" />
        </label>
        <input value="Save" type="submit" class="submit-btn-plain" />
      </form>
    </div>
  </div>

</div>
