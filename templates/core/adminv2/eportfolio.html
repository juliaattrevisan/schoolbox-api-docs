<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/selectize.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/jquery.selectize-selector.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/masonry.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/loadLayout.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    // Set the selected layout in the template selector if a URL hash is present
    function setSelectedLayout() {
        if (window.location.hash) {
            const templateHash = window.location.hash.substr(1);
            if (document.getElementById("templateSelector").querySelector(`option[value="${templateHash}"]`)) {
                document.getElementById("templateSelector").value = templateHash;
            }
        }
        return document.getElementById("templateSelector").value;
    }

    document.addEventListener("DOMContentLoaded", async () => {
        if (!document.getElementById("templateSelector")) {
            return;
        }
        // When the template selector changes, reload the page to get the new layout
        document.getElementById("templateSelector").addEventListener("change", () => {
            window.location.replace("#" + document.getElementById("templateSelector").value);
            window.location.reload();
        });

        const layoutId = setSelectedLayout(); // Ensure the correct layout is selected
        // Load the selected layout and insert it into the page
        document.dispatchEvent(new CustomEvent("MASONRY__LOAD_LAYOUT", {
            detail: {
                templateSelectURL:  "/adminv2/component/get/eportfolio/" + layoutId,
            }
        }));

        // Initialise the masonry layout once the layout has been loaded
        document.addEventListener("MASONRY__LAYOUT_LOADED", () => {
            document.dispatchEvent(new CustomEvent("MASONRY__CREATE", {
                detail: {
                    settings: {
                        allowEditing: true, // Whether the user has full edit control, or is read-only
                        existingComponentSelector: "[data-component]",
                        layoutSelector: "#component-layout",
                        updateUrl: "/adminv2/component/configForm.php",
                        refreshPaletteCountsOnLoad: true,
                        formData: {
                            pageInfo: {
                                type: "cid",
                                id: layoutId,
                                context: "eportfolio_template",
                            },
                            newComponentAddAttribute: "data-component-definition-id",
                        },
                    },
                }
            }));
        });

        $('[data-button=delete]').on("click", function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this template?',
                confirmEvent: function() {
                    // Build a hidden input with the delete button's name/val,
                    // then submit
                    var form = element.closest('form');
                    form.trigger('submit');
                }
            });
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_BREADCRUMBS}

<div class="admin-container row">

    {ADMIN_NAV}

    <div class="admin-content">
        <div class="small-12 island">
            <div class="actions-small-1">
                <div class="list-item">
                    <h2 class="subheader">ePortfolio Templates</h2>
                </div>
                <nav>
                    <a data-reveal-id="newDialog" class="sbx-icon-only-button" href="#" title="Create"><sbx-icon name="add"></sbx-icon></a>
                </nav>
            </div>
            <!-- BEGIN content -->
            <section>
                <div class="content">
                    <form id="template-action" class="no-margin" action="/adminv2/eportfolio/eportfolioForm.php" method="POST">
                        <div class="actions-small-2">
                            <div class="list-item">
                                <input type="hidden" name="action" value="delete" />
                                <select id="templateSelector" class="no-margin" data-template-select name="template">
                                    <!-- BEGIN template -->
                                    <option value="{template.id}">{template.name}</option>
                                    <!-- END template -->
                                </select>
                                <script>
                                    setSelectedLayout(); // Running this here prevents the template selector briefly showing the wrong value
                                </script>
                            </div>
                            <nav>
                                <a data-reveal-id="renameDialog" href="#" title="Rename"><sbx-icon name="modify"></sbx-icon></a>
                                <a data-button="delete"
                                   class="sbx-icon-only-button no-text"
                                   href="#"
                                   title="Delete"
                                   aria-label="Delete">
                                    <sbx-icon name="delete"></sbx-icon>
                                </a>
                            </nav>
                        </div>
                    </form>
                </div>
                <div data-definition-palette>
                    <ul data-component-list class="component-palette grid small-block-grid-1 medium-block-grid-2 large-block-grid-3 {COMPONENT_CATEGORY_CLASS}">
                        <!-- BEGIN component -->
                        <li>
                            <div class="card small-12 {COMPONENT_MULTIPLE_STATE}"
                                 data-count="{COMPONENT_COUNT}"
                                 data-multi="{COMPONENT_MULTIPLE_STATE}"
                                 data-component-palette>
                                <a href="#" data-component-definition-id="{COMPONENT_ID}" title="{COMPONENT_DESCRIPTION}">
                                    <span class="size-32 icon-masonry icon-masonry-{COMPONENT_CLASS}"></span>
                                    <p>{COMPONENT_NAME}</p>
                                    <p class="meta">(<span data-relation="count">{COMPONENT_COUNT}</span>)</p>
                                </a>
                            </div>
                        </li>
                        <!-- END component -->
                    </ul>
                </div>
            </section>
            <!-- END content -->
            <!-- BEGIN empty -->
            <div class="empty-state">
                <p>No ePortfolio templates have been created. Start by <a data-reveal-id="newDialog" title="Create">adding the first template</a>.
            </div>
            <!-- END empty -->
        </div>
        <div id="layoutContainer"></div>
    </div>
</div>

<div id="newDialog" class="reveal-modal" data-reveal aria-labelledby="newDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="newDialogLabel">Add new ePortfolio template</h2>
    <form action="/adminv2/eportfolio/eportfolioForm.php" method="POST" onsubmit="this.onsubmit = () => { return false }">
        <label>
            Template name
            <input type="text" name="name" required/>
        </label>
        <input type="submit" name="action" value="Create" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="renameDialog" class="reveal-modal" data-reveal aria-labelledby="renameDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="renameDialogLabel">Modify ePortfolio template</h2>
    <form action="/adminv2/eportfolio/eportfolioForm.php" method="POST">
        <label>
            Existing Template
            <select id="template-select" name="template" >
                <!-- BEGIN template -->
                <option value="{template.id}">{template.name}</option>
                <!-- END template -->
            </select>
        </label>
        <label>
            New name
            <input type="text" name="name" required/>
        </label>
        <input type="submit" name="action" value="Rename" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>
