<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.component.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.configurator.js"></script>
<script type="text/javascript">
	$(function() {
		$('#definition-palette').configurator({
            context: 'eportfolio',
            dropDownSelector: '#template-select',
            disabledMsg: 'This component can only be used once, and is already active for the template selected.'
        }).start();

        $( "#newForm" ).dialog({
            autoOpen: false,
            modal: true
        });

        $('#newHomepage').click(function() {
            $( '#newForm').dialog("open");
        });

        $( "#renameForm" ).dialog({
            autoOpen: false,
            modal: true
        });

        $('#renameHomepage').click(function() {
            $( '#renameForm').dialog("open");
        });


        $('#deleteTemplate').click(function() {
            if(confirm('Are you sure you wish to delete this template?')) {
                $(this).closest('form').submit();
            }
        });
	});
</script>
<!-- END custom_head-->

<h1>Schoolbox Administration</h1>
<dl class="sub-nav">
    <!-- BEGIN admin_nav_item -->
    <dd class="{ADMNAV_CURRENT}"><a href="/adminv2/{ADMNAV_HREF}">{ADMNAV_LABEL}</a></dd>
    <!-- END admin_nav_item -->
</dl>
<div class="admin-contents eportfolio clearfix">
	<h2>ePortfolio Templates<span class="question">?</span>
    <em>
        You can drag and reorder the main components of the ePortfolio template here. Grab one from the left column and
        move it to the right boxes or just reorganise the components that are already active.
    </em>
    </h2>

    <div id="definition-palette">
        <form id="template-action" action="/adminv2/eportfolio/eportfolioForm.php" method="POST">
            <select id="template-select" name="template" class="float-left" style="width: 68%" >
                <!-- BEGIN template -->
                <option value="{template.id}">{template.name}</option>
                <!-- END template -->
            </select>
            <input type="hidden" name="action" value="delete" />
            <a class="btn no-text delete" href="#" id="deleteTemplate" ><span></span></a>

            <div class="clearfix"></div>
            <a id="newHomepage" class="btn add" href="#"><span></span>Create</a>
            <a id="renameHomepage" class="btn modify" href="#"><span></span>Rename</a>
            <div class="clearfix"></div>
        </form>

        <div id="newForm" title="Add new ePortfolio template">
            <form id="template-action" action="/adminv2/eportfolio/eportfolioForm.php" method="POST" class="standard-form">
                <label><strong>Template name</strong></strong><input type="text" name="name" /></label>
                <input type="submit" class="submit-btn-plain" name="action" value="Create" />
            </form>
        </div>

        <div id="renameForm" title="Rename existing ePortfolio template">
            <form id="template-action" action="/adminv2/eportfolio/eportfolioForm.php" method="POST" class="standard-form">
                <label><strong>Existing Template</strong>
                    <select id="template-select" name="template" style="width:100%" >
                        <!-- BEGIN template -->
                        <option value="{template.id}">{template.name}</option>
                        <!-- END template -->
                    </select></label>
                <label><strong>New name<strong></strong><input type="text" name="name"/></label>
                <input type="submit" class="submit-btn-plain" name="action" value="Rename" />
            </form>
        </div>


        <!-- BEGIN definition -->
        <div class="component definition-id-{definition.id} {definition.singleton}">{definition.name}</div>
        <!-- END definition -->

    </div>

    <div id="eportfolio-layout" class="clearfix">
        <!-- BEGIN layout --><!-- END layout -->
    </div>
</div>
