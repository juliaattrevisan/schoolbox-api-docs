<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents dashboard clearfix">
	<h3>Dashboard<span>?</span>
    <em>
        You can drag and reorder the main components of the dashboard here. Grab one
        from the left column and move it to the right boxes or just re organise the components that are already active.
    </em>
    </h3>

    <div id="definition-palette">
        <select id="group-select">
            <!-- BEGIN group -->
            <option value="{group.id}">{group.name}</option>
            <!-- END group -->
        </select>

        <!-- BEGIN definition -->
        <div class="component definition-id-{definition.id} {definition.singleton}">{definition.name}</div>
        <!-- END definition -->

    </div>

    <div id="dashboard-layout" class="clearfix">
        <!-- BEGIN layout --><!-- END layout -->
    </div>

</div>
