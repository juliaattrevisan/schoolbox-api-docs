<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.component.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.configurator.js"></script>
<script type="text/javascript">
    $j(function() {
        $j('#definition-palette').configurator().start();
    });
</script>
<!-- END custom_head-->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents dashboard clearfix">
	<h2>Dashboard<span class="question">?</span>
    <em>
        You can drag and reorder the main components of the dashboard here. Grab one
        from the left column and move it to the right boxes or just re organise the components that are already active.
    </em>
    </h2>

    <div id="definition-palette">
        <select id="group-select">
            <!-- BEGIN group -->
            <option value="{group.id}">{group.name}</option>
            <!-- END group -->
        </select>

        <!-- BEGIN definition -->
        <div class="component definition-id-{definition.id} {definition.singleton}">{definition.name}</div>
        <!-- END definition -->
    </div>

    <div id="dashboard-layout" class="clearfix">
        <!-- BEGIN layout --><!-- END layout -->
    </div>
</div>

<div id="resource-browser" class="hide"></div>
