<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/admin/jquery.component.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.configurator.js"></script>
<script type="text/javascript">
    $(function() {
        $('[data-definition-palette]').configurator().start();
    });
</script>
<!-- END custom_head -->

{ADMIN_NAV}
        
<h2>
    Dashboard
    <span data-tooltip class="hint has-tip tip-top" data-width="200" title="You can drag and reorder the main components of the dashboard here. Grab one
        from the left column and move it to the right boxes or just reorganise the components that are already active.">?</span>
</h2>

<div class="row">
    <div class="small-12 large-3 columns">
        <div data-definition-palette>
            <select data-group-select>
                <!-- BEGIN group -->
                <option value="{group.id}">{group.name}</option>
                <!-- END group -->
            </select>

            <!-- BEGIN definition -->
            <div class="component definition-id-{definition.id} {definition.singleton}">{definition.name}</div>
            <!-- END definition -->
        </div>
    </div>

    <div class="small-12 large-9 columns">
        <div class="dashboard" data-dashboard-layout>
            <!-- BEGIN layout --><!-- END layout -->
        </div>
    </div>
</div>

<div id="resource-browser" class="hide"></div>
