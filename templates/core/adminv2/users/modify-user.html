	<div class="level last">
		<h3>User Details<span class="question">?</span></h3>
		<form class="admin-form">
			<div class="split-container">
				<div class="split">
					<label for ="preferred" class="preferred">
					Preferred
					<fieldset>
						<label>
							<select>
								<option value="Mr">Mr</option>
								<option value="Hon Dr"></option>
							</select>
							<input type="text" />
						</label>

					</fieldset>
					</label>
					<label for ="username" class="width2">Username
						<input type="text" />
					</label>
					<label for ="synergetic" class="">Synergetic ID
						<input type="text" />
					</label>
					<label for ="preferred" class="width2 ">Superuser
						<input type="checkbox" />
					</label>
					<div class="float-fix"></div>
					<table cellpadding="0" width="50%">
						<colgroup>
						<col width="33%" />
						<col width="33%" />
						<col width="33%" />
						</colgroup>
						<thead>
							<tr>
								<td>Campus</td>
								<td>Set default</td>
								<td>Enabled</td>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>Main</td>
								<td><input type="radio" /></td>
								<td><input type="checkbox" /></td>
							</tr>
							<tr>
								<td>Other</td>
								<td><input type="radio" /></td>
								<td><input type="checkbox" /></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="split-container">
				<div class="split last">
					<label for="surname">Surname
						<input type="text" />
					</label>
					<label for="password">Password
						<input type="text" />
					</label>
					<label for="e-portfolio">E-Portfolio
						<input type="checkbox" />
					</label>
					<label for="group">Group
						<select>
							<option value="Mr">Mr</option>
							<option value="Hon Dr"></option>
						</select>
					</label>
					<label for="year">Year
						<input type="text" />
					</label>
				</div>
