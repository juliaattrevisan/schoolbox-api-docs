<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/masonry.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        var url = '/adminv2/component/configForm.php';
        $('[data-homepage-layout]').masonry({
            // Only create action goes through masonry
            context: function(masonry) {
                return {
                    context: 'homepage_template',
                    cid: $(masonry.options.templateSelector.selector).val()
                }
            },
            component: {
                url: url,
                calcSequenceData: function (columns) {
                    var masonry = this,
                        data    = { type: 'components', cid: $(masonry.options.templateSelector.selector).val() },
                        order   = ['left','right','top','bottom'];

                    $.each(columns, function (position, column) {
                        var key = 'column' + (order.indexOf(position) + 1);

                        data[key] = column.find(masonry.options.component.selector).map(function () {
                            /*
                             * Two components in ePorfolio have no id's (My Profile, Teacher Notes)
                             * and always appear in the same positions. So we do a check to see if
                             * an id is set. If it isn't, and we don't do the check, the script breaks
                             * and components cannot be relocated successfully
                             */
                            if (this.id) {
                                return this.id.substr(9);
                            }
                        }).toArray().join(',');
                    });

                    return data;
                }
            },
            column: {
                leftColumnWidth: 6,
                selector: '[data-position]',
                position: {
                    top: '[data-position=top]',
                    left: '[data-position=left]',
                    right: '[data-position=right]'
                },
                placeholderTpl: '<p class="masonry-placeholder alert-box" />'
            },
            palette: {
                url: url,
                selector: '[data-definition-palette]',
                containerSelector: '.tabs-content',
                handleSelector: '[data-component-palette]',
                refreshItem: function () {
                    this.find('[data-relation="count"]').text(this.data('count'));
                }
            },
            templateSelector: {
                selector: '[data-template-select]',
                url: '/adminv2/component/get/homepage'
            }
        });

        $('[data-button=delete]').click(function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this template?',
                confirmEvent: function() {
                    // Build a hidden input with the delete button's name/val,
                    // then submit
                    var form = element.closest('form');
                    form.submit();
                }
            });
        });

        // Rename template
        var NO_TEMPLATE     = -1;
        var $templateSelect = $('#templateSelector');
        var $editButton     = $('[data-reveal-id="renameDialog"]');
        var $modal          = $('#' + $editButton.data('reveal-id'));
        var $inputLabel     = $modal.find('[data-existing-label]');
        var $inputValue     = $modal.find('[data-existing-value]');
        var $modalSubmit    = $modal.find('input[type=submit]');
        var $renameForm     = $modal.find('form');
        var $newNameInput   = $modal.find('[name=name]');
        var $toastDiv       = $('[data-relation="ajax-action"]');

        // Disable 'Rename Template' when 'No Template' is selected
        $templateSelect.on('change', function(){
            if(NO_TEMPLATE == $templateSelect.val()){
                $editButton.prop('disabled', true);
                $editButton.addClass('disabled');
            } else {
                $editButton.prop('disabled', false);
                $editButton.removeClass('disabled');
            }
        });
        $templateSelect.trigger('change');

        // Copy selected Template details to modal when opened
        $editButton.on('click', function(){
            $inputLabel.val($templateSelect.find('option:selected').text());
            $inputValue.val($templateSelect.val());
        });

        // Submit using AJAX so we can preserve location hash
        $modalSubmit.on('click', function(event){
            event.preventDefault();
            var data = $renameForm.serialize();
            var action = $renameForm.attr('action');
            $modal.foundation('reveal', 'close');
            $modal.find('input').prop('disabled', true);
            $toastDiv.toastActivate({text: 'Renaming template...'});

            $.post(action, data, function(){
                $modal.find('input').prop('disabled', false);
                $templateSelect.find('option:selected').text($newNameInput.val());
                $modal.foundation('reveal', 'close');
                $toastDiv.toastTimeout({text: 'Template renamed.', css: 'success'});
            }).fail(function() {
                $modal.find('input').prop('disabled', false);
                $modal.foundation('reveal', 'close');
                $toastDiv.toastTimeout({text: 'Template rename failed.', css: 'alert'});
            });
        });

    });
</script>
<!-- END custom_head -->

{ADMIN_BREADCRUMBS}

<div class="admin-container row">

    {ADMIN_NAV}

    <div class="admin-content">
        <div class="small-12 island">
            <div class="actions-small-1">
                <div class="list-item">
                    <h2 class="subheader">Homepage Templates</h2>
                </div>
                <nav>
                    <a data-reveal-id="newDialog" class="icon-add" href="#" title="Create"></a>
                </nav>
            </div>

            <section>
                <div class="content">
                    <form id="template-action" class="no-margin" action="/adminv2/homepage/homepageForm.php" method="POST">
                        <div class="actions-small-2">
                            <div class="list-item">
                                <input type="hidden" name="action" value="delete" />
                                <select id="templateSelector" class="no-margin" data-template-select name="template">
                                    <!-- BEGIN template -->
                                    <option value="{template.id}">{template.name}</option>
                                    <!-- END template -->
                                </select>
                            </div>
                            <nav>
                                <a data-reveal-id="renameDialog" class="icon-modify" href="#" title="Rename"></a>
                                <a data-button="delete" class="icon-delete" href="#" title="Delete"></a>
                            </nav>
                        </div>
                    </form>
                </div>
                <div data-definition-palette>
                    <!-- Homepage editor style tabs -->
                    <dl class="tabs" data-tab>
                        <!-- BEGIN component_tab -->
                        <dd class="{COMPONENT_CATEGORY_CLASS}">
                            <a href="#tabs-sub-{COMPONENT_CATEGORY_ID}">
                                {COMPONENT_CATEGORY_NAME} ({COMPONENT_CATEGORY_COUNT})
                            </a>
                        </dd>
                        <!-- END component_tab -->
                    </dl>
                    <div class="tabs-content">
                        <!-- BEGIN component_page -->
                        <ul class="component-palette content grid small-block-grid-1 medium-block-grid-2 large-block-grid-3 {COMPONENT_CATEGORY_CLASS} no-pad" id="tabs-sub-{COMPONENT_CATEGORY_ID}">
                            <!-- BEGIN component -->
                            <li>
                                <div class="card small-12 {COMPONENT_MULTIPLE_STATE} no-margin"
                                     data-count="{COMPONENT_COUNT}"
                                     data-multi="{COMPONENT_MULTIPLE_STATE}"
                                     data-component-palette>
                                    <a href="#" rel="{COMPONENT_ID}" title="{COMPONENT_DESCRIPTION}">
                                        <span class="size-32 icon-masonry icon-masonry-{COMPONENT_CLASS}"></span>
                                        <p>{COMPONENT_NAME}</p>
                                        <p class="meta">(<span data-relation="count">{COMPONENT_COUNT}</span>)</p>
                                    </a>
                                </div>
                            </li>
                            <!-- END component -->
                        </ul>
                        <!-- END component_page -->
                    </div>

                </div>
            </section>
        </div>
        <!-- BEGIN layout --><!-- END layout -->
    </div>
</div>

<div id="newDialog" class="reveal-modal" data-reveal aria-labelledby="newDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="newDialogLabel">Add new homepage template</h2>
    <form action="/adminv2/homepage/homepageForm.php" method="POST">
        <label>
            Template name
            <input type="text" name="name" />
        </label>
        <input type="submit" name="action" value="Create" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="renameDialog" class="reveal-modal" data-reveal aria-labelledby="renameDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="renameDialogLabel">Rename homepage template</h2>
    <form action="/adminv2/homepage/homepageForm.php" method="POST">
        <label>
            Current name
            <input type="text" data-existing-label readonly/>
        </label>
        <input type="hidden" name="template" data-existing-value/>
        <input type="hidden" name="action" value="Rename" />

        <label>
            New name
            <input type="text" name="name"/>
        </label>
        <input type="submit" value="Rename" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="resource-browser" class="hide"></div>

<div class="toast" data-alert data-relation="ajax-action"></div>
