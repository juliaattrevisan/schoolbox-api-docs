<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/admin/jquery.component.js"></script>
<script type="text/javascript" src="/javascript/admin/jquery.configurator.js"></script>
<script type="text/javascript">
    $(function() {
        $('[data-definition-palette]').configurator({
            context: 'homepage',
            dropDownSelector: '[data-template-select]',
            disabledMsg: 'This component can only be used once, and is already active for the template selected.'
        }).start();

        $('[data-button=delete]').click(function(event) {
            event.preventDefault();

            var element = $(this);
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this template?',
                confirmEvent: function() {
                    // Build a hidden input with the delete button's name/val,
                    // then submit
                    var form = element.closest('form');
                    form.submit();
                }
            });
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_NAV}
        
<div class="row">
    <div class="small-12 island">
        <section>
            <div data-definition-palette class="content">
                <form id="template-action" action="/adminv2/homepage/homepageForm.php" method="POST">
                    <div class="actions-small-3">
                        <div class="list-item">
                            <input type="hidden" name="action" value="delete" />

                            <label for="templateSelector">Template</label>
                            <select id="templateSelector" data-template-select name="template">
                                <!-- BEGIN template -->
                                <option value="{template.id}">{template.name}</option>
                                <!-- END template -->
                            </select>
                        </div>
                        <nav>
                            <a data-reveal-id="newDialog" class="icon-add" href="#" title="Create"></a>
                            <a data-reveal-id="renameDialog" class="icon-modify" href="#" title="Rename"></a>
                            <a data-button="delete" class="icon-delete" href="#" title="Delete"></a>
                        </nav>
                    </div>
                </form>

                <!-- BEGIN definition -->
                <div class="component definition-id-{definition.id} {definition.singleton}">{definition.name}</div>
                <!-- END definition -->
            </div>
        </section>
    </div>
</div>

<div class="row">
    <div class="small-12 columns">
        <div data-homepage-layout>
            <!-- BEGIN layout --><!-- END layout -->
        </div>
    </div>
</div>

<div id="newDialog" class="reveal-modal" data-reveal aria-labelledby="newDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="newDialogLabel">Add new homepage template</h2>
    <form action="/adminv2/homepage/homepageForm.php" method="POST">
        <label>
            Template name
            <input type="text" name="name" />
        </label>
        <input type="submit" name="action" value="Create" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="renameDialog" class="reveal-modal" data-reveal aria-labelledby="renameDialogLabel" aria-hidden="true" role="dialog">
    <h2 id="renameDialogLabel">Add new homepage template</h2>
    <form action="/adminv2/homepage/homepageForm.php" method="POST">
        <label>
            Existing Template
            <select id="template-select" name="template" >
                <!-- BEGIN template -->
                <option value="{template.id}">{template.name}</option>
                <!-- END template -->
            </select>
        </label>
        <label>
            New name
            <input type="text" name="name"/>
        </label>
        <input type="submit" name="action" value="Rename" />
    </form>
    <a class="close-reveal-modal" aria-label="Close">&#215;</a>
</div>

<div id="resource-browser" class="hide"></div>
