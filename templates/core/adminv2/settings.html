<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript" src="/javascript/jquery.alaressTiny.js"></script>
<script type="text/javascript">
	$(function() {
    var settings = $('#settings');

		$.fn.alaressTiny({
			mode: "specific_textareas",
			editor_selector: "mceEditor"
		});

		$('label span').each(function() {
			var activeContent = $(this).siblings('em').html();
			$(this).qtip({
				content: activeContent,
				style: {
					classes: 'qtip-green qtip-shadow'
				},
				position: {
					my: 'bottom left',
					at: 'top right'
				}
			});
		});

		settings.validate();

		// Homepage selector and its event
        settings.on('click', ':button[data-interaction="homepage_selector"]', function() {

        $('#resource-browser').socialstreamBrowser({
            title: 'Choose a folder',
            mimeFilter: false,
            categoryId: 0,
            submitCallback: function(url, filename) {
                settings.find('input[name=course_homepage]').val(url);
            }
        });
    });

    settings.validate();

    /* Force submission of checkboxes regardless of whether they are ticked
     * or not.
     */
    $('input[type=checkbox]').change(function() {
        var name = 'input[name=' + $(this).attr('name') + ']';

        if ($(this).val() == 0) {
            $(name).val(1);
        }
        else {
            $(name).val(0);
        }
    });

  });
</script>

<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
    <h2>Settings</h2>

    <div class="level green hide-it clearfix">
        You've successfully updated your settings.
    </div>

    <div class="settings-nav-holder">
        <ul class="admin-nav vertical">
            <!-- BEGIN setting_tab -->
            <li><a href="/adminv2/setting/{SETTING_TAB_URL}" class="{SETTING_TAB_CURRENT}">{SETTING_TAB_NAME}<span></span></a></li>
            <!-- END setting_tab -->
        </ul>
    </div>
    <div class="settings">
        <!-- BEGIN setting_group -->
        <form id="settings" class="admin-form level clearfix" method="post" action="/adminv2/settingForm.php">

            <!-- BEGIN setting -->
            <label for="{SETTING_NAME}">{SETTING_TITLE}<span class="question">?</span> <em>{SETTING_DESC}</em>
                <!-- BEGIN setting_type_noneditable -->
                <p>{SETTING_VALUE}</p>
                <!-- END setting_type_noneditable -->

                <!-- BEGIN setting_type_input -->
                <input class="{OPTION_REQUIRED}" type="text" name="{SETTING_NAME}" value="{SETTING_VALUE}" />
                <!-- END setting_type_input -->

                <!-- BEGIN setting_type_textarea -->
                <textarea id="{SETTING_NAME}" class="{OPTION_REQUIRED}" name="{SETTING_NAME}">{SETTING_VALUE}</textarea>
                <!-- END setting_type_textarea -->

                <!-- BEGIN setting_type_html -->
                <textarea id="{SETTING_NAME}" class="mceEditor {OPTION_REQUIRED}" name="{SETTING_NAME}">{SETTING_VALUE}</textarea>
                <!-- END setting_type_html -->

                <!-- BEGIN setting_type_resource -->
                <input type="text" name="{SETTING_NAME}" value="{SETTING_VALUE}" />
                <input type="button" value="Select Source" data-interaction="homepage_selector" data-input_name="{SETTING_NAME}" />
                <!-- END setting_type_resource -->

                <!-- BEGIN setting_type_boolean -->
                <br />
                <input name="{SETTING_NAME}" type="checkbox" value="{SETTING_VALUE}" {SETTING_CHECKED} />
                <input name="{SETTING_NAME}" type="hidden" value="{SETTING_VALUE}" />
                <!-- END setting_type_boolean -->

                <!-- BEGIN setting_type_select -->
                <br />
                <select name="{SETTING_NAME}">
                    <!-- BEGIN setting_select -->
                    <option value="{SELECT_VALUE}" {SETTING_OPTION_SELECTED}>{SELECT_OPTION}</option>
                    <!-- END setting_select -->
                </select>
                <!-- END setting_type_select -->

                <!-- BEGIN setting_type_check -->
                <fieldset>
                    <!-- BEGIN setting_checkbox -->
                    <label>
                        <input type="checkbox" name="check[]" value="one" />
                        One </label>
                    <!-- END setting_checkbox -->
                </fieldset>
                <!-- END setting_type_check -->
            </label>
            <!-- END setting -->

            <!-- BEGIN setting_save -->
            <input type="submit" class="submit-btn-plain" value="Save"/>
            <!-- END setting_save -->
        </form>
        <!-- END setting_group -->
    </div>
</div>


<div id="resource-browser" class="hide"></div>
