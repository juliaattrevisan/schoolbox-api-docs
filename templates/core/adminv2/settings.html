<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.autoresize.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />


<script type="text/javascript">

$j(function() {
		
	$j.fn.qtip.defaults.position.corner = {
		target: 'topLeft',
		tooltip: 'bottomLeft'
	}
	
	$j.fn.qtip.defaults.style = {
		tip: 'bottomLeft',
		name: 'green'
	}
		
	$j('label span').each(function() {
		activeContent = $j(this).siblings('em').html();
		$j(this).qtip({
			content: activeContent,
			api: {
					// Retrieve the content when tooltip is first rendered
					 onRender: function()
					 {
						var self = this;
					 }
				 }
		});
	});
	
	$j('#settings').validate();
	
}); 

</script>

<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
	<li><a href="/adminv2/home">Home</a></li>
	<li><a href="/adminv2/user" >Users</a></li>
	<li><a href="/adminv2/side-menu">Side Menu</a></li>
	<li><a href="/adminv2/allowed-file">Allowed Files</a></li>
	<li><a href="/adminv2/setting"  class="current">Settings</a></li>
	<li><a href="/adminv2/calendar">Calendar</a></li>
	<li><a href="/adminv2/category">Category</a></li>
	<li><a href="/adminv2/list">Lists</a></li>
	<li><a href="/adminv2/rollover">Rollover</a></li>
</ul>
<div class="admin-contents clearfix">
	<h2>Settings</h2>
	
	<div class="level green hide-it clearfix">	
		You've successfully updated your settings.
	</div>
	
	<div class="settings-nav-holder">
		<ul class="settings-nav">
            <!-- BEGIN setting_tab -->
			<li><a href="/adminv2/setting/{SETTING_TAB_URL}" class="{SETTING_TAB_CURRENT}">{SETTING_TAB_NAME}<span></span></a></li>
            <!-- END setting_tab -->
		</ul>
	</div>
	<div class="settings">
        <!-- BEGIN setting_group -->
		<div class="split-container">
			<form id="settings" class="admin-form level clearfix" method="post" action="/adminv2/settingForm.php">
				
				<!-- BEGIN setting_type_noneditable -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em>
					<p>{SETTING_VALUE}</p>
				</label>
				<!-- END setting_type_noneditable -->

                <!-- BEGIN setting_type_input -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em>
					<input class="required" type="text" name="{SETTING_NAME}" value="{SETTING_VALUE}" />
				</label>
                <!-- END setting_type_input -->
				
                <!-- BEGIN setting_type_textarea -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em>
					<textarea class="required" name="{SETTING_NAME}">{SETTING_VALUE}</textarea>
				</label>
                <!-- END setting_type_textarea -->
				
                <!-- BEGIN setting_type_boolean -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em><br />
					<input name="{SETTING_NAME}" type="checkbox" value="{SETTING_VALUE}" {SETTING_CHECKED} />
					<input name="{SETTING_NAME}" type="hidden" value="{SETTING_VALUE}" />
				</label>
                <!-- END setting_type_boolean -->

                <!-- BEGIN setting_type_select -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em><br />
					<select name="{SETTING_NAME}">
                        <!-- BEGIN setting_select -->
						<option value="{SELECT_OPTION}" {SETTING_OPTION_SELECTED}>{SELECT_OPTION}</option>
                        <!-- END setting_select -->
					</select>
				</label>
                <!-- END setting_type_select -->
				
                <!-- BEGIN setting_type_check -->
				<label for="{SETTING_NAME}">
				{SETTING_TITLE}<span>?</span> <em>{SETTING_DESC}</em>
					<fieldset>
                        <!-- BEGIN setting_checkbox -->
						<label>
							<input type="checkbox" name="check[]" value="one" />
							One </label>
                        <!-- END setting_checkbox -->
					</fieldset>
				</label>
                <!-- END setting_type_check -->
				<input type="submit" class="submit-btn-plain" value="Save"/>
			</form>
		</div>
        <!-- END setting_group -->
	</div>
</div>

<script type="text/javascript">
	$j(function() {

		/* Force submission of checkboxes regardless of whether they are ticked
		 * or not.
		 */
		$j('input[type=checkbox]').change(function() {
			var name = 'input[name=' + $j(this).attr('name') + ']';

			if ($j(this).attr('checked')) {
				$j(name).val(1);
			}
			else {
				$j(name).val(0);
			}
		});
	});
</script>
