<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.autoresize.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css" />
<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>
<script type="text/javascript">
	tinyMCE.init({
        mode : "specific_textareas",
        editor_selector : "mceEditor",
        theme : "advanced",
        skin : "cirkuit",
        plugins : "pdw,table,tabfocus,media,inlinepopups,advimage,assetmanager,directionality,paste,spellchecker",
        content_css : "/css/core/tiny.css",
       theme_advanced_toolbar_location : "top",
        theme_advanced_toolbar_align : "left",
        theme_advanced_statusbar_location : "bottom",
        theme_advanced_buttons1 : "bold,italic,underline,separator,bullist,numlist,separator,link,unlink,image,media,separator,undo,redo,separator,pdw_toggle",
        theme_advanced_buttons2 : "forecolor,formatselect,fontsizeselect,separator,justifyleft,justifycenter,justifyright,spellchecker",
        theme_advanced_buttons3 : "outdent,indent,sub,sup,separator,hr,charmap,separator,seperator,ltr,rtl,selectall,pastetext,pasteword,separator,removeformat,cleanup,code",
        theme_advanced_buttons4 : "tablecontrols",
        pdw_toggle_on : 1,
        pdw_toggle_toolbars : '2, 3, 4',
        extended_valid_elements : "a[class|name|href|target|title|onclick],img[class|src|border=0|alt|title|hspace|vspace|width|height|align|onmouseover|onmouseout|name|style],hr[class|width|size|noshade],font[face|size|color|style],span[class|align|style]",
        file_browser_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileBrowser',
        file_uploader_callback : 'tinyMCE.activeEditor.plugins.assetmanager.fileUploader',
        file_browser_category_id : 0,
        tabfocus_elements : ":prev,:next",
        convert_urls : false,
		force_br_newlines : false,
        force_p_newlines : true
	});


$j(function() {

	$j.fn.qtip.defaults.position.corner = {
		target: 'topLeft',
		tooltip: 'bottomLeft'
	}

	$j.fn.qtip.defaults.style = {
		tip: 'bottomLeft',
		name: 'green'
	}

	$j('label span').each(function() {
		activeContent = $j(this).siblings('em').html();
		$j(this).qtip({
			content: activeContent,
			api: {
					// Retrieve the content when tooltip is first rendered
					 onRender: function()
					 {
						var self = this;
					 }
				 }
		});
	});

	$j('#settings').validate();

	

});

</script>

<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h2>Settings</h2>

	<div class="level green hide-it clearfix">
		You've successfully updated your settings.
	</div>

	<div class="settings-nav-holder">
		<ul class="settings-nav">
            <!-- BEGIN setting_tab -->
			<li><a href="/adminv2/setting/{SETTING_TAB_URL}" class="{SETTING_TAB_CURRENT}">{SETTING_TAB_NAME}<span></span></a></li>
            <!-- END setting_tab -->
		</ul>
	</div>
	<div class="settings">
        <!-- BEGIN setting_group -->
		<div class="split-container">
			<form id="settings" class="admin-form level clearfix" method="post" action="/adminv2/settingForm.php">

				<!-- BEGIN setting_type_noneditable -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em>
					<p>{SETTING_VALUE}</p>
				</label>
				<!-- END setting_type_noneditable -->

                <!-- BEGIN setting_type_input -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em>
					<input class="{OPTION_REQUIRED}" type="text" name="{SETTING_NAME}" value="{SETTING_VALUE}" />
				</label>
                <!-- END setting_type_input -->

                <!-- BEGIN setting_type_textarea -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em>
					<textarea id="{SETTING_NAME}" class="{OPTION_REQUIRED}" name="{SETTING_NAME}">{SETTING_VALUE}</textarea>
				</label>
                <!-- END setting_type_textarea -->

				<!-- BEGIN setting_type_html -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em>
					<textarea id="{SETTING_NAME}" class="mceEditor {OPTION_REQUIRED}" name="{SETTING_NAME}">{SETTING_VALUE}</textarea>
				</label>
				<!-- END setting_type_html -->

                <!-- BEGIN setting_type_boolean -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em><br />
					<input name="{SETTING_NAME}" type="checkbox" value="{SETTING_VALUE}" {SETTING_CHECKED} />
					<input name="{SETTING_NAME}" type="hidden" value="{SETTING_VALUE}" />
				</label>
                <!-- END setting_type_boolean -->

                <!-- BEGIN setting_type_select -->
				<label for="{SETTING_NAME}">{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em><br />
					<select name="{SETTING_NAME}">
                        <!-- BEGIN setting_select -->
						<option value="{SELECT_VALUE}" {SETTING_OPTION_SELECTED}>{SELECT_OPTION}</option>
                        <!-- END setting_select -->
					</select>
				</label>
                <!-- END setting_type_select -->

                <!-- BEGIN setting_type_check -->
				<label for="{SETTING_NAME}">
				{SETTING_TITLE}<span class="help">?</span> <em>{SETTING_DESC}</em>
					<fieldset>
                        <!-- BEGIN setting_checkbox -->
						<label>
							<input type="checkbox" name="check[]" value="one" />
							One </label>
                        <!-- END setting_checkbox -->
					</fieldset>
				</label>
                <!-- END setting_type_check -->

                <!-- BEGIN setting_type_list -->

                <!-- END setting_type_list -->

                <!-- BEGIN setting_save -->
				<input type="submit" class="submit-btn-plain" value="Save"/>
                <!-- END setting_save -->
			</form>
		</div>
        <!-- END setting_group -->
	</div>
</div>

<script type="text/javascript">
	$j(function() {

		/* Force submission of checkboxes regardless of whether they are ticked
		 * or not.
		 */
		$j('input[type=checkbox]').change(function() {
			var name = 'input[name=' + $j(this).attr('name') + ']';

			if ($j(this).val() == 0) {
				$j(name).val(1);
			}
			else {
				$j(name).val(0);
			}
		});
	});
</script>
