<!-- BEGIN custom_head -->

<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<script type="text/javascript">

$j(function() {
	
	$j('table tr:nth-child(2n)').addClass('dark')




	$j('h3 span').qtip({
		content: 'Edit the user\'s details.',
		show: 'mouseover',
		hide: 'mouseout',
		style: {
			 tip: 'bottomLeft',
			name: 'green'
		},
		position: {
		  corner: {
			 target: 'topRight',
			 tooltip: 'bottomLeft'
		  }
  		}
	});
	
	///this function for the access ticks need to be recondigured.
	$j('.accessGranted').each(function () {
		$j(this).click(function () {
			if ($j(this).attr('src').indexOf('greentick') != -1) {
				$j(this).attr('src', '/images/emptybox.gif');
				$j.get('/group/modifyForm.php', {categoryID: $j(this).attr('rel'), userID: '{ID}', write: 1});
			} else {
				$j(this).attr('src', '/images/greentick.gif');
				$j.get('/group/modifyForm.php', {categoryID: $j(this).attr('rel'), userID: '{ID}', write: 2});
			}		
		});
		$j(this).css('cursor','pointer');
	});
	
	
	$j('.admin-form').validate({
		rules: {
			year: {
			  	customValid : true
			},
			alt_email: {
				email:true	
			}
		},
		messages: {
			defaultCampus: "Please select a default campus",
			alt_email: "If you are entering an alternative email, please ensure it's a valid address"
		},
		errorPlacement: function(error, element) {
      
			if (element.hasClass("campus-radio")) {
				error.css('margin', 0);
				error.insertAfter(element.closest('table'));
			} else {
							
			error.insertAfter(element)
			}
		 }
		
	});
	
	$j.validator.addMethod("customValid", function(value, element) {
		inputValue = (parseInt(value));
		if (isNaN(inputValue)) {

			value = String(value);

			if ((value == '') || (value == 'k') || (value == 'elc') || (value == 'ELC') || (value == 'K')) {
				console.log(value);
				return true
			} else {
				return false;
			}
		} else {
			if ((inputValue > 13) || (inputValue < 0)) {
				return false
			}
			return true;
		} 

	}, "Please enter one a number in between 0 and 13 OR the letter 'K' OR the the phrase 'ELC'");

})

</script>

<!-- END custom_head-->

<div class="admin-contents clearfix">
	<h2><span><a href="/adminv2/user">&laquo; Back to users</a></span>Create a user</h2>
	<div class="level clearfix">
		<h3>User Details<span class="question">?</span></h3>
		<form class="admin-form" method="POST" action="/adminv2/userForm.php" >
			<div class="split-container">
				<div class="split">
					<label for ="title" class="title">
					Title
						<select name="title">
							<!-- BEGIN title -->
							<option value="{NAME_TITLE}" {TITLE_SELECTED}>{NAME_TITLE}</option>
							<!-- END title -->
						</select>
                        </label>
					<label class="first">First Name
						<input type="text" name="firstname" class="required" value="" />
					</label>
					<label for="lastname">Surname
						<input type="text" class="required"name="lastname" value=""/>
					</label>

					<label for ="database" class="">{DATABASE_TYPE} ID
						<input type="text" name="database_id" value=""/>
					</label>
					
					<table cellpadding="0" width="50%" class="float-left campus-select">
						<colgroup>
						<col width="33%" />
						<col width="33%" />
						<col width="33%" />
						</colgroup>
						<thead>
							<tr>
								<td>Campus</td>
								<td>Set default</td>
								<td>Involved</td>
							</tr>
						</thead>
						<tbody>
							<!-- BEGIN campus -->
							<tr>
								<td>{CAMPUS_NAME}</td>
								<td><input type="radio" name="defaultCampus" value="{CAMPUS_ID}" {CAMPUS_DEFAULT_CHECKED} class="campus-radio required" /></td>
								<td><input type="checkbox" name="campus[]" value="{CAMPUS_ID}" {CAMPUS_ID_CHECKED} /></td>
							</tr>
							<!-- END campus -->
						</tbody>
					</table>
					
				</div>
			</div>
			<div class="split-container">
				<div class="split last">
                    <label for ="username" class="width2">Username
						<input type="text" class="required" name="modusername" value="" />
					</label>
					<label for="password">Password
						<input type="password"  name="modpassword"/>
					</label>
                <label for="alt_email">Alternate Email
					<input type="text" name="alt_email" value="" class="email" />
				</label>
					<label for="group">Group
						<select name="group">
							<!-- BEGIN system_group -->
							<option value="{GROUP_ID}" {GROUP_ID_SELECTED}>{SYSTEM_GROUP_NAME}</option>
							<!-- END system_group -->
						</select>
					</label>
                    <label for="house">House</label>
                    <select id="house" name="house">
                        <option value="">Not Set</option>
                        <!-- BEGIN house -->
                        <option value="{HOUSE_ID}" {HOUSE_ID_SELECTED}>{HOUSE_NAME}</option>
                        <!-- END house -->
                    </select>
                    <div class="clearfix"></div>
                    <label for="residential_house">Residential House</label>
                    <select id="residential_house" name="residential_house">
                        <option value="">Not Set</option>
                        <!-- BEGIN residential_house -->
                        <option value="{RESIDENT_HOUSE_ID}" {RESIDENT_HOUSE_ID_SELECTED}>{RESIDENT_HOUSE_NAME}</option>
                        <!-- END residential_house -->
                    </select>
                    <label for="e-portfolio">E-Portfolio
						<input type="checkbox" name="eportfolio" value="1" />
					</label>
					<label for ="superuser" class="width2 ">Superuser
						<input type="checkbox" name="superuser" value="1" />
					</label>
                    <label for ="local_email" class="width2 ">Local Email
						<input type="checkbox" name="local_email" value="1" />
					</label>
					<label for="year">Year
						<input type="text" name="year" value="" />
					</label>
				</div>
			</div>

			<input type="submit" class="submit-btn-plain" name="submit" value="Add User" />
		</form>

	</div>
</div>
