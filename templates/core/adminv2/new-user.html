<!-- BEGIN custom_head -->

<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<script type="text/javascript">

$j(function() {
	
	$j('table tr:nth-child(2n)').addClass('dark')




	$j('h3 span').qtip({
		content: 'Edit the user\'s details.',
		show: 'mouseover',
		hide: 'mouseout',
		style: {
			 tip: 'bottomLeft',
			name: 'green'
		},
		position: {
		  corner: {
			 target: 'topRight',
			 tooltip: 'bottomLeft'
		  }
  		}
	});
	
	///this function for the access ticks need to be recondigured.
	$j('.accessGranted').each(function () {
		$j(this).click(function () {
			if ($j(this).attr('src').indexOf('greentick') != -1) {
				$j(this).attr('src', '/images/emptybox.gif');
				$j.get('/group/modifyForm.php', {categoryID: $j(this).attr('rel'), userID: '{ID}', write: 1});
			} else {
				$j(this).attr('src', '/images/greentick.gif');
				$j.get('/group/modifyForm.php', {categoryID: $j(this).attr('rel'), userID: '{ID}', write: 2});
			}		
		});
		$j(this).css('cursor','pointer');
	});
	
	
	
	
	
})

</script>

<!-- END custom_head-->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
	<li><a href="/adminv2/home">Home</a></li>
	<li><a href="/adminv2/user" class="current">Users</a></li>
	<li><a href="/adminv2/side-menu">Side Menu</a></li>
	<li><a href="/adminv2/allowed-file">Allowed Files</a></li>
	<li><a href="/adminv2/setting">Settings</a></li>
	<li><a href="/adminv2/calendar">Calendar</a></li>
	<li><a href="/adminv2/list">Lists</a></li>
	<li><a href="/adminv2/rollover">Rollover</a></li>
</ul>
<div class="admin-contents">
	<h2><span><a href="/adminv2/user">&laquo; Back to users</a></span>Create a user</h2>
	<div class="level">
		<h3>User Details<span class="question">?</span></h3>
		<form class="admin-form" method="POST" action="/adminv2/userForm.php" >
			<div class="split-container">
				<div class="split">
					<label for ="preferred" class="preferred">
					Preferred Title
					<label>
						<select name="title">
							<!-- BEGIN title -->
							<option value="{NAME_TITLE}" {TITLE_SELECTED}>{NAME_TITLE}</option>
							<!-- END title -->
						</select>
					</label>
					<label class="first">First Name
						<input type="text" name="firstname" value="" />
					</label>
					</label>
					<label for ="username" class="width2">Username
						<input type="text" name="username" value="" />
					</label>
					<label for ="database" class="">{DATABASE_TYPE} ID
						<input type="text" name="database_id" value=""/>
					</label>
					<div class="float-fix"></div>
					<table cellpadding="0" width="50%">
						<colgroup>
						<col width="33%" />
						<col width="33%" />
						<col width="33%" />
						</colgroup>
						<thead>
							<tr>
								<td>Campus</td>
								<td>Set default</td>
								<td>Enabled</td>
							</tr>
						</thead>
						<tbody>
							<!-- BEGIN campus -->
							<tr>
								<td>{CAMPUS_NAME}</td>
								<td><input type="radio" name="defaultCampus" value="{CAMPUS_ID}" {DEFAULT_CAMPUS_CHECKED} /></td>
								<td><input type="checkbox" name="campus[]" value="{CAMPUS_ID}" {CAMPUS_CHECKED} /></td>
							</tr>
							<!-- END campus -->
						</tbody>
					</table>
				</div>
			</div>
			<div class="split-container">
				<div class="split last">
					<label for="lastname">Surname
						<input type="text" name="lastname" value=""/>
					</label>
					<label for="password">Password
						<input type="password" name="password"/>
					</label>
					<label for="e-portfolio">E-Portfolio
						<input type="checkbox" name="eportfolio" value="1" />
					</label>
					<label for ="superuser" class="width2 ">Superuser
						<input type="checkbox" name="superuser" value="1" />
					</label>
					<label for="group">Group
						<select name="group">
							<!-- BEGIN system_group -->
							<option value="{GROUP_ID}" {GROUP_ID_SELECTED}>{SYSTEM_GROUP_NAME}</option>
							<!-- END system_group -->
						</select>
					</label>
					<label for="year">Year
						<input type="text" name="year" value="" />
					</label>
				</div>
			</div>
			<input type="submit" name="submit" value="Add User" />
		</form>
		<div class="float-fix"></div>
	</div>
</div>
