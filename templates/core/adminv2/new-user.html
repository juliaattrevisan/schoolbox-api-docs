<!-- BEGIN custom_head -->
<script type="text/javascript">

$(function() {
	///this function for the access ticks need to be recondigured.
	$('.accessGranted').each(function () {
		$(this).click(function () {
			if ($(this).attr('src').indexOf('greentick') != -1) {
				$(this).attr('src', '/images/emptybox.gif');
				$.get('/group/modifyForm.php', {categoryID: $(this).attr('rel'), userID: '{ID}', write: 1});
			} else {
				$(this).attr('src', '/images/greentick.gif');
				$.get('/group/modifyForm.php', {categoryID: $(this).attr('rel'), userID: '{ID}', write: 2});
			}		
		});
		$(this).css('cursor','pointer');
	});
	
	
	$('.admin-form').validate({
		rules: {
			year: {
			  	customValid : true
			},
			alt_email: {
				email:true	
			}
		},
		messages: {
			defaultCampus: "Please select a default campus",
			alt_email: "If you are entering an alternative email, please ensure it's a valid address"
		},
		errorPlacement: function(error, element) {
      
			if (element.hasClass("campus-radio")) {
				error.css('margin', 0);
				error.insertAfter(element.closest('table'));
			} else {
							
			error.insertAfter(element)
			}
		 }
		
	});
	
	$.validator.addMethod("customValid", function(value, element) {
		inputValue = (parseInt(value));
		if (isNaN(inputValue)) {

			value = String(value);

			if ((value == '') || (value == 'k') || (value == 'elc') || (value == 'ELC') || (value == 'K')) {
				console.log(value);
				return true
			} else {
				return false;
			}
		} else {
			if ((inputValue > 13) || (inputValue < 0)) {
				return false
			}
			return true;
		} 

	}, "Please enter one a number in between 0 and 13 OR the letter 'K' OR the the phrase 'ELC'");

})

</script>

<!-- END custom_head-->

{ADMIN_NAV}

<h2>Create New User</h2>

<form method="POST" action="/adminv2/userForm.php" >
    <fieldset>
        <legend>User Detail</legend>
        <div class="row">
            <div class="small-6 columns">
                <label for="title">Title</label>
                <select id="title" name="title">
                    <!-- BEGIN title -->
                    <option value="{NAME_TITLE}" {TITLE_SELECTED}>{NAME_TITLE}</option>
                    <!-- END title -->
                </select>
                <label for="firstname">First Name</label>
                <input id="firstname" type="text" name="firstname" class="required" value="" />

                <label for="lastname">Surname</label>
                <input id="lastname" type="text" class="required"name="lastname" value=""/>

                <label for="database" class="">{DATABASE_TYPE} ID</label>
                <input id="database" type="text" name="database_id" value=""/>

                <label for="group">Role</label>
                <select id="group" name="group">
                    <!-- BEGIN system_group -->
                    <option value="{GROUP_ID}" {GROUP_ID_SELECTED}>{SYSTEM_GROUP_NAME}</option>
                    <!-- END system_group -->
                </select>

                <label>Campus</label>
                <dl>
                    <!-- BEGIN campus -->
                    <dt>{CAMPUS_NAME}</dt>
                    <dd>
                        <input id="defaultCampus-{CAMPUS_ID}" type="radio" name="defaultCampus" value="{CAMPUS_ID}" {CAMPUS_DEFAULT_CHECKED} class="campus-radio required" />
                        <label for="defaultCampus-{CAMPUS_ID}" class="radio-label">Default?</label>

                        <input id="campus-{CAMPUS_ID}" type="checkbox" name="campus[]" value="{CAMPUS_ID}" {CAMPUS_ID_CHECKED} />
                        <label for="campus-{CAMPUS_ID}" class="checkbox-label">Involved?</label>
                    </dd>
                    <!-- END campus -->
                </dl>
            </div>

            <div class="small-6 columns">
                <label for ="username">Username</label>
                <input id="username" type="text" class="required" name="modusername" value="" />

                <label for="password">Password</label>
                <input id="password" type="password"  name="modpassword"/>

                <label for="alt_email">Alternate Email</label>
                <input id="alt_email" type="text" name="alt_email" value="" class="email" />

                <label for="year">Year</label>
                <input id="year" type="text" name="year" value="" />

                <label for="house">House</label>
                <select id="house" name="house">
                    <option value="">Not Set</option>
                    <!-- BEGIN house -->
                    <option value="{HOUSE_ID}" {HOUSE_ID_SELECTED}>{HOUSE_NAME}</option>
                    <!-- END house -->
                </select>

                <label for="residential_house">Residential House</label>
                <select id="residential_house" name="residential_house">
                    <option value="">Not Set</option>
                    <!-- BEGIN residential_house -->
                    <option value="{RESIDENT_HOUSE_ID}" {RESIDENT_HOUSE_ID_SELECTED}>{RESIDENT_HOUSE_NAME}</option>
                    <!-- END residential_house -->
                </select>

                <input id="eportfolio" type="checkbox" name="eportfolio" value="1" />
                <label for="eportfolio" class="checkbox-label">E-Portfolio</label>

                <input id="local_email" type="checkbox" name="local_email" value="1" />
                <label for="local_email" class="checkbox-label">Email Address from Username</label>

                <input id="mail_handler" type="checkbox" name="mail_handler" value="1"/>
                <label for="mail_handler" class="checkbox-label">Use External Mail Client</label>

                <input id="webmail" type="checkbox" name="webmail" value="1" />
                <label for="webmail" class="checkbox-label">Enable Webmail Tab</label>

                <input id="superuser" type="checkbox" name="superuser" value="1" onclick="return(confirm('Change superuser status?'));" />
                <label for="superuser" class="checkbox-label">Superuser</label>
            </div>
        </div>
    </fieldset>

    <input type="submit" name="submit" value="Add User" />
</form>
