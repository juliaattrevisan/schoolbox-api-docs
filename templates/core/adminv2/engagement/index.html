<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function() {

        /* Calendar controls
         */
        $('[data-type=calendar-controls]').on("submit", function(event) {
            event.preventDefault();

            var id = $('[data-type=calendar-controls]').find('input[name=userKey]').val();
            var start_date = dayjs($('[data-type=calendar-controls]').find('input[name=start_date]').val(), dateDisplayFormats.dayjs).format('DD-MM-YYYY');
            var finish_date = dayjs($('[data-type=calendar-controls]').find('input[name=finish_date]').val(), dateDisplayFormats.dayjs).format('DD-MM-YYYY');
            var url = '/adminv2/engagement/index/{CURRENT_PAGE}/' + start_date + '/' + finish_date;
            window.location.href = url;
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_BREADCRUMBS}

<div class="admin-container row">

    {ADMIN_NAV}

    <div class="admin-content">
        <div class="small-12 island">
            {REPORT_DATA}
        </div>

        <div class="small-12 island">
            <form data-type='calendar-controls' action="#" method="post">
                <section>
                    <fieldset>
                        <legend>Report Range</legend>
                        <div class="column small-12 medium-6">
                            <input id="start_date" placeholder="Start Date" name='start_date' value="{SELECTED_START}" data-datepicker data-datesync-enddate="#finish_date" />
                        </div>
                        <div class="column small-12 medium-6">
                            <input id="finish_date" placeholder="End Date" name='finish_date'  value="{SELECTED_FINISH}" data-datepicker data-datesync-startdate="#start_date" />
                        </div>
                    </fieldset>
                </section>
                <input type="submit" class="submit-btn-plain" value="Update" />
            </form>
        </div>
    </div>
</div>
