<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript">
$j(function () {

    $j("#side-menu").jstree({
        "animation": 50,
        "core" : {
            check_callback: true,
            "themes" : {
                "variant" : "schoolbox",
                "dots" : true,
                "icons" : false
            }
        },
        "plugins" : ["dnd", 'state'],
        dnd: {
            copy: false
        }

    }).bind('move_node.jstree', function(e, data) {
        var pos = data.position;
        var tid = data.parent.split('_').pop();
        var oid = data.node.id.split('_').pop();
        $j.ajax({
            url: '/adminv2/side-menuForm.php',
            data: {pos:pos, tid:tid, oid:oid}
        });
    });

    $j("#side-menu").bind('open_node.jstree close_node.jstree', function() {
        setCookie();
    });

    function setCookie() {
        $j.cookie("open-tree-nodes", null);
        var openNodes = "";
        $j('.jstree-open').each(function() {
            openNodes += ($j(this).attr('id').substr(5)+',')
        });
        $j.cookie('open-tree-nodes', openNodes, { expires: 1 });
    }

});

</script>
<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h2>Side Menu</h2>
	<p>Drag and drop the menu items to reorder the core left navigation side menu.</p>
  	<p class="clearfix"><a class="btn add float-left" href="/adminv2/modify-side-menu/"><span></span>Add New</a></p>
	<div id="side-menu">
	{MENU_TREE}
	</div>
</div>
