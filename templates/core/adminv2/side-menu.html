<script type="text/javascript" src="/javascript/tree/jquery.jstree.js"></script>
<script type="text/javascript">

$j(function() {
		$j('ul.sortable').nestedSortable({
			disableNesting: 'no-nest',
			forcePlaceholderSize: true,
			handle: 'div',
			helper:	'clone',
			items: 'li',
			opacity: .6,
			placeholder: 'placeholder',
			tabSize: 32,
			tolerance: 'pointer',
			toleranceElement: '> div',
			listType: 'ul',
			drop: function(event, ui) {
				//runs when the thing is dropped.
					
			}
		});
	

});

</script>
