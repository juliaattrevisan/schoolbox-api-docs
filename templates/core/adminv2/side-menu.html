<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jstree/jquery.jstree.js"></script>
<script type="text/javascript" src="/javascript/jquery.cookie.js"></script>
<script type="text/javascript">
$j(function () {

    var nodeArray = new Array();

    if ($j.cookie("open-tree-nodes") == null) {
        nodeArray = [ "node_0" ]
    } else {
        var originalArray = $j.cookie("open-tree-nodes").split(',');
        for (i=0; i < originalArray.length; i++) {
            nodeArray.push("node_" + originalArray[i])
        }
    }

	$j("#side-menu").jstree({
		"animation": 50,
        "core" : { "initially_open" : nodeArray },
		"plugins" : [ "themes", "html_data", "dnd","crrm"],
        "themes" : {
			"theme" : "schoolbox",
			"dots" : true,
			"icons" : false
		}
        
	}).bind('move_node.jstree', function(e, data) {
        var pos = data.rslt.p;
        var tid = data.rslt.r[0].id.split('_').pop();
        var oid = data.rslt.o[0].id.split('_').pop();
          $j.ajax({ url: '/adminv2/side-menuForm.php',
                    data: {pos:pos, tid:tid, oid:oid}});

    });

    console.log($j("#side-menu").jstree("get_theme"), "egg")

    $j("#side-menu").bind('open_node.jstree close_node.jstree', function() {
        setCookie();
    });

    function setCookie() {
        $j.cookie("open-tree-nodes", null);
        var openNodes = "";
        $j('.jstree-open').each(function() {
            openNodes += ($j(this).attr('id').substr(5)+',')
        });
        $j.cookie('open-tree-nodes', openNodes, { expires: 1 });
    }

});

</script>
<!-- END custom_head -->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents clearfix">
	<h2>Side Menu</h2>
	<p>Drag and drop the menu items to reorder the core left navigation side menu.</p>
  	<p class="clearfix"><a class="btn add float-left" href="/adminv2/modify-side-menu/"><span></span>Add New</a></p>
	<div id="side-menu">
	{MENU_TREE}
	</div>
</div>
