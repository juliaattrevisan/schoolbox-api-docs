{ADMIN_NAV}

<div class="row">
    <div class="small-12 island">
        <h2 class="subheader">
            Side Menu
            <span data-tooltip class="hint has-tip tip-top" data-width="200"  title="Drag and drop the menu items to reorder the core left navigation side menu.">?</span>
        </h2>
        <section class="content">
            <a class="button icon-add" href="/adminv2/modify-side-menu/">Add New</a>
            <section data-role="sideMenuTree">
                {MENU_TREE}
            </section>
        </section>
    </div>
</div>

<link type="text/css" rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript">
    $(function () {

        $('section[data-role="sideMenuTree"]')
                .on('ready.jstree', function(event, jstree) {
                    jstree.instance.open_node(jstree.instance.get_node('node_0'));
                })
                .on('click', 'a[href]', function() {
                    // Listen on click, instead of select_node, because select_node
                    // fires on initial page load.
                    window.location.href = this.href;
                })
                .jstree({
                    "animation": 50,
                    "core" : {
                        force_text: true,
                        check_callback: true,
                        "themes" : {
                            "variant" : "schoolbox",
                            "dots" : true,
                            "icons" : false
                        }
                    },
                    "plugins" : ["dnd", 'state'],
                    dnd: {
                        copy: false
                    }
                })
                .on('move_node.jstree', function(e, data) {
                    var pos = data.position;
                    var tid = data.parent.split('_').pop();
                    var oid = data.node.id.split('_').pop();
                    $.ajax({
                        url: '/adminv2/side-menuForm.php',
                        data: {pos:pos, tid:tid, oid:oid}
                    });
                });
    });

</script>
