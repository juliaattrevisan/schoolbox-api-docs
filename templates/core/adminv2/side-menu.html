<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jstree/jquery.jstree.js"></script>

<script type="text/javascript">
$j(function () {
	$j("#side-menu").jstree({
		"animation": 50,
        "core" : { "initially_open" : [ "node_0" ] },
		"plugins" : [ "themes", "html_data", "dnd","crrm"],
        "themes" : {
			"theme" : "core",
			"dots" : true,
			"icons" : false
		}
        
	}).bind('move_node.jstree', function(e, data) {
        var pos = data.rslt.p;
        var tid = data.rslt.r[0].id.split('_').pop();
        var oid = data.rslt.o[0].id.split('_').pop();
          $j.ajax({ url: '/adminv2/side-menuForm.php',
                    data: {pos:pos, tid:tid, oid:oid}});

    });
});

</script>
<!-- END custom_head -->
