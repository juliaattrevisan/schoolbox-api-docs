<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<div class="directory staff">
    <table class="sort-it" width="100%">
        <thead>
        <tr>
            <th width="45px">Title</th>
            <th width="" class="{SORT_FIRSTNAME}"><a href="/adminv2/reports/{SORT_BASE}/firstname/{SORT_FIRSTNAME_DIR}">First name</a></th>
            <th width="" class="{SORT_LASTNAME}"><a href="/adminv2/reports/{SORT_BASE}/lastname/{SORT_LASTNAME_DIR}">Surname</a></th>
            <th width="" class="{SORT_USERNAME}"><a href="/adminv2/reports/{SORT_BASE}/username/{SORT_USERNAME_DIR}">Username</a></th>
            <th width="" class="{SORT_SYNERGY_ID}"><a href="/adminv2/reports/{SORT_BASE}/synergy_id/{SORT_SYNERGY_ID_DIR}">External ID</a></th>
            <th width="" class="{SORT_CAMPUS}"><a href="/adminv2/reports/{SORT_BASE}/campus/{SORT_CAMPUS_DIR}">Campus</a></th>
            <th width="" class="{SORT_YEAR}"><a href="/adminv2/reports/{SORT_BASE}/year/{SORT_YEAR_DIR}">Year</a></th>
            <th width="" class="{SORT_ALT_EMAIL}"><a href="/adminv2/reports/{SORT_BASE}/alt_email/{SORT_ALT_EMAIL_DIR}">Email</a></th>
            <th width="27px"></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN user -->
        <tr class="{DARK}">
            <td>{USER_TITLE}</td>
            <td><a href="/search/user/{USER_ID}">{USER_FIRSTNAME}</a></td>
            <td><a href="/search/user/{USER_ID}">{USER_SURNAME}</a></td>
            <td>{USER_USERNAME}</td>
            <td>{USER_SYNERGY_ID}</td>
            <td>{USER_CAMPUS}</td>
            <td>{USER_YEAR}</td>
            <td>{USER_EMAIL}</td>
            <td>
                <div class="ssearch-functions clearfix">
                    <!-- BEGIN modify -->
                    <a href="/adminv2/modify-user/{USER_ID}" class="btn modify no-text" title="Modify User"><span></span></a>
                    <!-- END modify -->
                </div>
            </td>
        </tr>
        <!-- END user -->
        </tbody>
    </table>
</div>
