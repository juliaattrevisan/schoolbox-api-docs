<div class="directory staff">

        <tr>
            <th class="{SORT_DATE}"><a href="/adminv2/reports/{SORT_BASE}/date/{SORT_DATE_DIR}">Date</a></th>
            <th class="{SORT_USER}"><a href="/adminv2/reports/{SORT_BASE}/user/{SORT_USER_DIR}">User</a></th>
            <th class="{SORT_LOGIN}"><a href="/adminv2/reports/{SORT_BASE}/login/{SORT_LOGIN_DIR}">Action</a></th>
            <th class="{SORT_IP}"><a href="/adminv2/reports/{SORT_BASE}/ip/{SORT_IP_DIR}">Originating IP</a></th>
            <th class="{SORT_ROLETYPE}"><a href="/adminv2/reports/{SORT_BASE}/roletype/{SORT_ROLETYPE_DIR}">Role Type</a></th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN activity -->
        <tr>
            <td>{DATE}</td>
            <td><a href="/search/user/{UID}">{USERNAME}</a></td>
            <td>{ACTION}</td>
            <td>{IP}</td>
            <td>{ROLETYPE}</td>
        </tr>
        <!-- END activity -->
        </tbody>
    </table>
</div>
