<!-- BEGIN custom_head -->
<style type="text/css">
    .orderby:after {
        content: ' {DIR}';
    }
</style>
<!-- END custom_head-->
<h1>Schoolbox Administration</h1>
<dl class="sub-nav">
    <!-- BEGIN admin_nav_item -->
    <dd class="{ADMNAV_CURRENT}"><a href="/adminv2/{ADMNAV_HREF}">{ADMNAV_LABEL}</a></dd>
    <!-- END admin_nav_item -->
</dl>
<div class="admin-contents reporting clearfix">
    <h2>Reports</h2>
    <div class="clearfix">
        <!-- BEGIN filter -->
        <div class="level green clearfix">
            <h3>Filter</h3>
            <form class="filter" action="/adminv2/reportsForm.php" method="POST">
                <ul>
                <!-- BEGIN search_options -->
                    <li><label for="{FILTER_ID}">{FILTER_NAME}<input id="{FILTER_ID}" name="{FILTER_ID}" type="text" value="{FILTER_VALUE}" placeholder="{FILTER_PLACEHOLDER}" /></label></li>
                <!-- END search_options -->
                <input type="hidden" readonly="readonly" name="bounce" value="{RETURN}" />
                <input class="submit-btn-plain" id="filtersubmit" type="submit" value="Filter" />
                </ul>
            </form>
        </div>
        <!-- END filter -->
        <!-- BEGIN result_table -->
        <div class="level last clearfix">
            <h3>{REPORT_TITLE}<!-- BEGIN count -->: {COUNTABLE_COUNT} {COUNTABLE}<!-- END count --></h3>
            <!-- BEGIN download_report -->
            <span class="header_option">
                <a href="/adminv2/reports/{REPORT_FILTER}exportToCSV" class="btn download"><span></span>Download Report</a>
            </span>
            <!-- END download_report -->
            <!-- BEGIN result -->
            <div class="{RESULT_CLASS}" id="report-result">
                {RESULT}
            </div>
            <!-- END result -->

			<ul class="admin-nav foot">
				<!-- BEGIN previous_button -->
				<li><a class="prev" href="/adminv2/reports/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
				<!-- END previous_button -->

				<!-- BEGIN first_page -->
				<li><a href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
				<li>&hellip;</li>
				<!-- END first_page -->

				<!-- BEGIN page_number -->
				<li><a class="{CURRENT}" href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
				<!-- END page_number -->

				<!-- BEGIN last_page -->
				<li>&hellip;</li>
				<li><a href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
				<!-- END last_page -->

				<!-- BEGIN next_button -->
				<li><a class="next" href="/adminv2/reports/{NEXT_PAGE}">Next &rsaquo;</a></li>
				<!-- END next_button -->
			</ul>
        </div>
        <!-- END result_table -->
    </div>
</div>
