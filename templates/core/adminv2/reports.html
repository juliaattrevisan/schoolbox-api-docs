{ADMIN_NAV}

<div class="row">
    <div class="small-12 columns">
        <!-- BEGIN filter -->
        <div class="panel">
            <h3>Filter</h3>

            <form action="/adminv2/reportsForm.php" method="POST">
                <input type="hidden" readonly="readonly" name="bounce" value="{RETURN}" />

                <dl class="row">
                    <!-- BEGIN search_options -->
                    <dd class="column medium-4 end">
                        <label for="{FILTER_ID}">
                            {FILTER_NAME}
                            <input id="{FILTER_ID}" name="{FILTER_ID}" type="text" value="{FILTER_VALUE}" placeholder="{FILTER_PLACEHOLDER}" />
                        </label>
                    </dd>
                    <!-- END search_options -->
                </dl>

                <input id="filtersubmit" type="submit" value="Filter" />
            </form>
        </div>
        <!-- END filter -->
    </div>
</div>

<!-- BEGIN result_table -->
<div class="row">
    <div class="small-12 columns">
        <h2 class="subheader">{REPORT_TITLE}<!-- BEGIN count -->: {COUNTABLE_COUNT} {COUNTABLE}<!-- END count --></h2>
        <!-- BEGIN download_report -->
        <span class="header-actions">
            <a href="/adminv2/reports/{REPORT_FILTER}exportToCSV" class="button icon-download no-text" data-tooltip title="Download Report"></a>
        </span>
        <!-- END download_report -->

        <!-- BEGIN result -->
        {RESULT}
        <!-- END result -->

        <ul class="pagination">
            <!-- BEGIN previous_button -->
            <li class="arrow">
                <a href="/adminv2/reports/{PREVIOUS_PAGE}">&lsaquo;</a>
            </li>
            <!-- END previous_button -->

            <!-- BEGIN first_page -->
            <li>
                <a href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
            </li>
            <li class="unavailable"><a>&hellip;</a></li>
            <!-- END first_page -->

            <!-- BEGIN page_number -->
            <li class="{CURRENT}">
                <a href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
            </li>
            <!-- END page_number -->

            <!-- BEGIN last_page -->
            <li class="unavailable"><a>&hellip;</a></li>
            <li>
                <a href="/adminv2/reports/{PAGE_INDEX_REF}">{PAGE_INDEX}</a>
            </li>
            <!-- END last_page -->

            <!-- BEGIN next_button -->
            <li class="arrow">
                <a href="/adminv2/reports/{NEXT_PAGE}">&rsaquo;</a>
            </li>
            <!-- END next_button -->
        </ul>
    </div>
</div>
<!-- END result_table -->
