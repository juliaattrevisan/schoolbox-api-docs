<script type="text/javascript" src="/javascript/jquery.autoresize.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>

<script type="text/javascript">

$j(function() {
		
	$j.fn.qtip.defaults.position.corner = {
		target: 'topLeft',
		tooltip: 'bottomLeft'
	}
	
	$j.fn.qtip.defaults.style = {
		tip: 'bottomLeft',
		name: 'green'
	}

	$j('.allowed-files tr:first td:first').qtip({
		content: 'blah'});
		
	$j('.allowed-files tr:first td:nth-child(2)').qtip({
		content: 'desc'});
		
	$j('.allowed-files tr:first td:nth-child(3)').qtip({
		content: 'mimeymimey'});
	
	$j('.allowed-files tr:first td:nth-child(4)').qtip({
		content: 'extensionardo'});
	
	$j('.allowed-files tr:first td:nth-child(5)').qtip({
		content: 'inliney kk <3'});
		
	var target;
	var checkedEdit ;
	var descriptionEdit;
	var mimeEdit;
	var extensionsEdit;
	var inlineEdit;
	var clone;

	function editTheRow(target) {
		
		checkedEdit = target.children('td:first').children('span').text();
			if (checkedEdit == "Yes") {checkedEdit = true;} else {checkedEdit = false;}
		descriptionEdit = target.children('td:nth-child(2)').text();
		mimeEdit = target.children('td:nth-child(3)').text();
		extensionsEdit = target.children('td:nth-child(4)').text();
		inlineEdit = target.children('td:nth-child(5)').children('em').text();
		
		clone =	
			'<tr class="hidden-clone"> \
						<td><input type="checkbox" name="enabled" '
				
			if 	(checkedEdit == true) {
				clone+= 'checked="checked'	
			}
				
		clone+=	'/><button class="float-right" id="icon-choice"></button></td> \
				<td><textarea class="text-input textarea" name="description">'+descriptionEdit+'</textarea></td> \
				<td><textarea class="text-input textarea" name="mime" >'+mimeEdit+'</textarea></td> \
				<td><input type="text" class="text-input" name="extensions" value="'+extensionsEdit+'" /></td> \
				<td><select name="inline" id="inline">'	
				
		if (inlineEdit == "Inline") {
			clone+=	'<option value="Inline" selected="selected">Inline</option><option value="External">External</option>'
		} else {
			clone+=	'<option value="Inline" >Inline</option><option value="External" selected="selected">External</option>'
		}
		
			clone += '</select> \
				<a href="#" class="btn delete no-marg"><span></span>Delete</a> \
				<a href="#" class="btn tick submit no-marg"><span></span>Save</a> \
				</td> \
			</tr> \ '

		target.hide().after(clone); 	
		
	}

	$j('.modify').live('click',function() {
		
		local = $j(this).parent().parent();

		if ($j('tbody').children('.hidden-clone').size() < 1) {			
			
			editTheRow(local);
		
		} else {
			
			var activeClone = $j('tbody').children('.hidden-clone');
			
			if (activeClone.find('input[type=checkbox]').is(":checked")) { checked = "Yes" } else { checked = "No" } 
			
			var description = activeClone.find('textarea[name=description]').html(description);
			var mime = activeClone.find('textarea[name=mime]').html();
			var extensions = activeClone.find('input[name=extensions]').val();
			var inline = activeClone.find('#inline').val();

			activeClone.replaceWith($j('tfoot').children('.replacement').clone()); 	
			
			var activeReplacement = $j('tbody').children('.replacement');
		
			activeReplacement.children('td:nth-child(1)').children('span').html(checked);
			activeReplacement.children('td:nth-child(2)').html(description);
			activeReplacement.children('td:nth-child(3)').html(mime);
			activeReplacement.children('td:nth-child(4)').html(extensions);
			activeReplacement.children('td:nth-child(5)').children('em').html(inline);

			$j('tbody').children('.replacement').removeClass('replacement');
			
			editTheRow(local);
		}
		
		$j('tbody').children(":nth-child(2n)").addClass('dark');
			 
		return false;
	});
	
});

</script>
 
<!-- END custom_head-->
