<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript">

    $(function () {

        // setup tree structure
        $("#side-menu")
            .on('ready.jstree', function(event, jstree) {
                jstree.instance.open_node(jstree.instance.get_node('node_0'));
            })
            .on('select_node.jstree', function(event, jstree) {
                $('#prent').val(jstree.selected[0].replace(/^node_/, ''));
            })
            .on('deselect_node.jstree', function() {
                $('#prent').val('');
            })
            .jstree({
                "animation":50,
                "core":{
                    force_text: true,
                    multiple:false,
                    "themes": {
                        "variant" : "schoolbox",
                        "dots" : true,
                        "icons" : false
                    }
                }
            });

        /*
         * Modal for URL homepage selection
         * */

      $('#form').on('click', '.open-modal', function() {

        $('#resource-browser').socialstreamBrowser({
          title: 'Choose a folder',
          categoryId: 0,
          mimeFilter: false,
          submitCallback: function(url, filename) {
            $('#url').val(url);
          }
        });
      });


		//greenerising the checkboxes if they're ticked.
		$(':checkbox').each(function () {
			if ($(this).is(':checked')) {
				$(this).parent().addClass('active-checkbox');
			}
		});

		$(':checkbox').click(function () {
			if ($(this).parent().hasClass('active-checkbox')) {
				$(this).parent().removeClass('active-checkbox')
				if($(this).closest('.checkboxes').find('.select_all').is(':checked')){
					$(this).closest('.checkboxes').find('.select_all').prop('checked', false).parent().removeClass('active-checkbox');
				}
			}
			else {
				$(this).parent().addClass('active-checkbox');
			}
		});

		$('.select_all').change(function(){
			if($(this).is(':checked')){
				$(this).closest('.checkboxes').find(':checkbox').not('.select_all').prop('checked', true).parent().addClass('active-checkbox');
			} else {
				$(this).closest('.checkboxes').find(':checkbox').not('.select_all').prop('checked', false).parent().removeClass('active-checkbox');
			}
		});

    });

</script>
<!-- END custom_head -->

<h1>Schoolbox Administration</h1>

<dl class="sub-nav">
    <!-- BEGIN admin_nav_item -->
    <dd class="{ADMNAV_CURRENT}"><a href="/adminv2/{ADMNAV_HREF}">{ADMNAV_LABEL}</a></dd>
    <!-- END admin_nav_item -->
</dl>

<h2>{ACTION} Side Menu Item</h2>

<form action="/adminv2/side-menuForm.php" method="post" name="form" id="form">
    <div class="row">
        <div class="small-12 medium-6 columns">
            <label>
                Name
                <span data-tooltip class="has-tip"
                      title="This is the text that will be displayed on the menu">?</span>
                <input type="text" name="txt" class="required" maxlength="100" size="40" value="{TEXT}"/>
            </label>
        </div>

        <div class="small-8 medium-4 columns">
            <label>
                URL
                <span data-tooltip class="has-tip"
                      title="Either enter in a URL or use the browse button to link to folders created in the resource system">?</span>
                <input type="text" name="url" id="url" size="40" class="required" maxlength="250" value="{URL}"/>
            </label>
            <a href="#" class="button open-modal">Browse Resources</a>
            <div id="resource-browser" class="hide"></div>
        </div>

        <div class="small-4 medium-2 columns">
            <label>
                Link Target
            <span data-tooltip class="has-tip"
                  title="Where does this link open? (Generally, links to offsite resources open in a new tab/window, while local resources open in the existing one.)">?</span>
                <select name="target">
                    <option value="">Existing tab/window</option>
                    <option value="_blank" {BLANK_SELECTED}>New tab/window</option>
                </select>
            </label>
        </div>
    </div>

    <div class="row">
        <div class="small-12 medium-6 columns">
            <label>
                Campus
                <span data-tooltip class="has-tip"
                      title="Select the campuses that should be able to view
                        this link. Note that this link will only be viewable
                        by people in both the campuses and roles selected">?</span>
            </label>
            <ul>
                <li>
                    <input id="campusSelectAll" type="checkbox" class="select_all" />
                    <label for="campusSelectAll" class="checkbox-label">Select all</label>
                </li>
                <!-- BEGIN campus -->
                <li>
                    <input id="campusSelect-{CAMPUS_ID}" type="checkbox" name="campus[]" value="{CAMPUS_ID}" {CAMPUS_ID_SELECTED}/>
                    <label for="campusSelect-{CAMPUS_ID}" class="checkbox-label">{CAMPUS_NAME}</label>
                </li>
                <!-- END campus -->
            </ul>
        </div>

        <div class="small-12 medium-6 columns">
            <label>Roles</label>
            <ul>
                <li>
                    <input id="roleSelectAll" type="checkbox" class="select_all" />
                    <label for="roleSelectAll" class="checkbox-label">Select all</label>
                </li>
                <!-- BEGIN group -->
                <li>
                    <input id="roleSelect-{CAMPUS_ID}" type="checkbox" name="group[]" value="{GROUP_ID}" {GROUP_ID_SELECTED}/>
                    <label for="roleSelect-{CAMPUS_ID}" class="checkbox-label">{GROUP_NAME}</label>
                </li>
                <!-- END group -->
            </ul>
        </div>
    </div>

    <!-- BEGIN parent_select -->
    <div class="row">
        <div class="small-12 columns">
            <label>
                Parent
                <span data-tooltip class="has-tip"
                      title="This is where in the menu the new item will be inserted. Simply click on a menu item to allow it
                        to be the parent.">?</span>
            </label>
            <div id="side-menu">
                {MENU_TREE}
            </div>
        </div>
    </div>
    <!-- END parent_select -->

    <input type="hidden" name="id" value="{ID}"/>
    <input id="prent" name="parent" type="hidden" value="{PARENT_ID}"/>
    <input type="submit" name="Submit" value="{ACTION}" />
    <!-- BEGIN delete -->
    <input type="submit" name="delete" value="Delete" />
    <!-- END delete -->
</form>
