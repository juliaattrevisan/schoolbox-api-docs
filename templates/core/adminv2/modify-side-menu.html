<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/javascript/components/jstree/dist/themes/default/style.css" />
<script type="text/javascript" src="/javascript/components/jstree/dist/jstree.js"></script>
<script type="text/javascript" src="/javascript/shared/select-all/jquery.select-all.js"></script>
<script type="text/javascript">
    $(function () {

        /**
         * setup tree browser
         */
        $('section[data-role="sideMenuTree"]')
            .on('ready.jstree', function(event, jstree) {
                jstree.instance.open_node(jstree.instance.get_node('node_0'));
            })
            .on('select_node.jstree', function(event, jstree) {
                $('input[data-relation="selectedParent"]').val(jstree.selected[0].replace(/^node_/, ''));
            })
            .on('deselect_node.jstree', function() {
                $('input[data-relation="selectedParent"]').val('');
            })
            .jstree({
                "animation":50,
                "core":{
                    force_text: true,
                    multiple:false,
                    "themes": {
                        "variant" : "schoolbox",
                        "dots" : true,
                        "icons" : false
                    }
                }
            });

        /**
         * Modal for URL homepage selection
         */
        $('[data-role="openResourceBrowser"]').click(function(e) {
            e.preventDefault();
            $('[data-role="resourceBrowser"]').socialstreamBrowser({
                title: 'Choose a folder',
                categoryId: 0,
                mimeFilter: false,
                submitCallback: function(url, filename) {
                    $('input[name="url"]').val(url);
                }
            });
        });

        $('[data-role="campusSelector"]').selectAll({
            key: 'selectall',
            checkboxName: 'campus[]'
        });
        $('[data-role="roleSelector"]').selectAll({
            key: 'selectall',
            checkboxName: 'group[]'
        });
    });
</script>
<!-- END custom_head -->

{ADMIN_NAV}

<div class="row">
    <div class="large-12 island">
        <h2 class="subheader">{ACTION} Side Menu Item</h2>
        <section class="content">
            <form action="/adminv2/side-menuForm.php" method="post" name="form" id="form">
                <input type="hidden" name="id" value="{ID}"/>
                <input type="hidden" data-relation="selectedParent" name="parent" value="{PARENT_ID}"/>

                <fieldset>
                    <legend>Link</legend>
                    <div class="small-12 medium-4 columns">
                        <label>
                            Name
                    <span data-tooltip class="hint has-tip tip-top" data-width="200"
                          title="This is the text that will be displayed on the menu">?</span>
                            <input type="text" name="txt" class="required" maxlength="100" size="40" value="{TEXT}"/>
                        </label>
                    </div>

                    <div class="small-12 medium-4 large-5 columns">
                        <label>
                            URL
                    <span data-tooltip class="hint has-tip tip-top" data-width="200"
                          title="Either enter in a URL or use the browse button to link to folders created in the resource system">?</span>
                            <input type="text" name="url" id="url" size="40" class="required" maxlength="250" value="{URL}"/>
                        </label>
                        <a href="#" class="button" data-role="openResourceBrowser">Browse Resources</a>
                    </div>

                    <div class="small-12 medium-4 large-3 columns">
                        <label>
                            Link Target
                    <span data-tooltip class="hint has-tip tip-top" data-width="200"
                          title="Where does this link open? (Generally, links to offsite resources open in a new tab/window, while local resources open in the existing one.)">?</span>
                            <select name="target">
                                <option value="">Existing tab/window</option>
                                <option value="_blank" {BLANK_SELECTED}>New tab/window</option>
                            </select>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>
                        Permissions
                <span data-tooltip class="hint has-tip tip-top" data-width="200"
                      title="Select the campuses that should be able to view
                        this link. Note that this link will only be viewable
                        by people in both the campuses and roles selected">?</span>
                    </legend>
                    <div data-role="campusSelector" class="small-12 medium-6 columns">
                        <h3>Campus</h3>
                        <input id="campusSelectAll" type="checkbox" class="select_all" data-selectall="true" />
                        <label for="campusSelectAll" class="checkbox-label">Select all</label>
                        <!-- BEGIN campus -->
                        <input id="campusSelect-{CAMPUS_ID}" type="checkbox" name="campus[]" value="{CAMPUS_ID}" {CAMPUS_ID_SELECTED}/>
                        <label for="campusSelect-{CAMPUS_ID}" class="checkbox-label">{CAMPUS_NAME}</label>
                        <!-- END campus -->
                    </div>

                    <div data-role="roleSelector" class="small-12 medium-6 columns">
                        <h3>Roles</h3>
                        <input id="roleSelectAll" type="checkbox" class="select_all" data-selectall="true" />
                        <label for="roleSelectAll" class="checkbox-label">Select all</label>
                        <!-- BEGIN group -->
                        <input id="roleSelect-{GROUP_ID}" type="checkbox" name="group[]" value="{GROUP_ID}" {GROUP_ID_SELECTED}/>
                        <label for="roleSelect-{GROUP_ID}" class="checkbox-label">{GROUP_NAME}</label>
                        <!-- END group -->
                    </div>
                </fieldset>

                <!-- BEGIN parent_select -->
                <fieldset>
                    <legend>Location</legend>
                    <div class="small-12 columns">
                        <label>
                            Parent
                    <span data-tooltip class="hint has-tip tip-top" data-width="200"
                          title="This is where in the menu the new item will be inserted. Simply click on a menu item to allow it
                            to be the parent.">?</span>
                        </label>
                        <section data-role="sideMenuTree">
                            {MENU_TREE}
                        </section>
                    </div>
                </fieldset>
                <!-- END parent_select -->

                <input type="submit" name="Submit" value="{ACTION}" />
                <!-- BEGIN delete -->
                <input type="submit" name="delete" value="Delete" />
                <!-- END delete -->
            </form>
        </section>
    </div>
</div>

<div data-role="resourceBrowser" class="hide"></div>
