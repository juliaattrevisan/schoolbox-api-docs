<!-- BEGIN custom_head -->
<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript">

    $(function () {

        $.extend(
            true,
            $.fn.qtip.defaults,
            {
                style: {
                    classes: 'qtip-green qtip-shadow',
                    tip: { corner: false }
                },
                position: {
                    my: 'bottom left',
                    at: 'top left'
                }
            }
        );

        $('.allowed-files tr:first th:first').qtip({
            content:'Controls if files of this type can be uploaded'});

        $('.allowed-files tr:first th:nth-child(2)').qtip({
            content:'A simple name for the type of file'});

        $('.allowed-files tr:first th:nth-child(3)').qtip({
            content:'The mime type for a file can be found by searching google'});

        $('.allowed-files tr:first th:nth-child(4)').qtip({
            content:'The file extension, everything after the dot. Comma seperate multiple extensions'});

        $('.allowed-files tr:first th:nth-child(5)').qtip({
            content:'The maximum file size when uploading a file of this type - defaults to system-wide max file size'});

        $('.allowed-files tr:first th:nth-child(6)').qtip({
            content:'Determines if file will be opened in the browser or by a third party application'});

        $(document).on('click', '.modify', function () {
            var trigger = 0,
                level   = $(this).closest('div.row');

            $('.form-holder').each(function () {
                if ($(this).is(':visible')) {

                    level.slideUp(function () {
                        level.siblings('.form-holder').slideDown();
                    });

                    $(this).siblings().slideDown();
                    $(this).slideUp();
                    trigger = 1;
                }
            });

            if (trigger == 0) {
                level.slideUp(function () {
                    level.siblings('.form-holder').slideDown();
                });
            }

            return false;
        });

        $('#dialog').dialog({
            modal:true,
            width:650,
            autoOpen:false

        });

        $('.open-dialog').click(function () {
            $('#dialog').dialog('open');
            $('#dialog').children('.store-here').html($(this).siblings('.chosen-one').attr('ID'));
            // /images/mime/22x22/


            return false;
        });

        $('.new-button').click(function () {

            var currentID = '#' + $(this).siblings('.store-here').html();

            $(currentID).val($(this).children('img').attr('alt'));
            $(currentID).siblings('.open-dialog').children('img').attr('src', $(this).children('img').attr('src'));

            $('#dialog').dialog('close');

        });

		$('form#newAllowedFile').validate({
			rules: {
				description: {
					required: true,
					minlength: 2
				},
				mime: {
					required: true,
					minlength: 2
				},
				extension: {
					required: true,
					minlength: 1
				}
			},
			messages: {
				title: "Please enter a title",
				mime: "Please enter a mime type",
				extension: "Please enter a file extension"
			},
			submitHandler: function (form) {
				//
				// Some sort of form validation - check for no duplicate mimetypes.
				var create_form  = $('form#newAllowedFile');
				var update_forms = $('form[id^="allowed-file"]');

				create_form.add(update_forms);

				var this_mimetype = $(this).find(':input[name="mime"]').val();

				var mimetype_list = $.map(
					update_forms.not(this).find(':input[name="mime"]'),

						function(element) {
						return $(element).val();
					}
				);

				if ($.inArray(this_mimetype, mimetype_list) >= 0) {
					alert('The mime type you have chosen for this file type is already in use.')
					event.preventDefault();
				}
				else {
					form.submit();
				}
			}
		});

        $('.delete').click(function (event) {


            event.preventDefault();
            if (confirm("Are you sure you want to delete?")) {
                var nearestAction = $(this).closest('form').attr('action');
                var nearestFID = $(this).closest('form').find('input[name=fileTypeId]').val();
                $(this).closest('form').attr('action', nearestAction + "?delete=" + nearestFID);
                $(this).closest('form').submit();
            }

            return false;
        });

    });

</script>

<!-- END custom_head-->

<h1>Schoolbox Administration</h1>
<dl class="sub-nav">
    <!-- BEGIN admin_nav_item -->
    <dd class="{ADMNAV_CURRENT}"><a href="/adminv2/{ADMNAV_HREF}">{ADMNAV_LABEL}</a></dd>
    <!-- END admin_nav_item -->
</dl>

<div class="admin-contents clearfix">
    <h2>Allowed Files</h2>

    <form id="newAllowedFile" method="post" action="/adminv2/allowed-fileForm.php">
        <input type="hidden" readonly="readonly" name="fileTypeId" value=""/>
        <table cellpadding="0" cellspacing="0" class="allowed-files table">
            <colgroup>
                <col class="enabled" />
                <col class="description" />
                <col class="mime" />
                <col class="extensions" />
                <col class="max_size" />
                <col class="inline" />
            </colgroup>
            <thead>
            <tr>
                <th scope="col">Enabled<span class="question">?</span></th>
                <th scope="col">Description<span class="question">?</span></th>
                <th scope="col">Mime<span class="question">?</span></th>
                <th scope="col">Extensions<span class="question">?</span></th>
                <th scope="col">Max Size<span class="question">?</span></th>
                <th scope="col">Inline<span class="question">?</span></th>
            </tr>
            <tr class="add-new">
                <td><input type="checkbox" name="enable" checked="checked" value="true"/>
                    <button class="float-right open-dialog" id="icon-choice"><img src="/images/mime/22x22/txt.png">
                    </button>
                    <input type="hidden" name="iconFile" id="button{FILE_ID}" class="chosen-one" value="{FILE_ICON}"/>
                </td>
                <td><input type="text" class="text-input" name="description"></textarea></td>
                <td><input type="text" class="text-input" name="mime"></textarea></td>
                <td><input type="text" class="text-input" name="extension" value=""/></td>
                <td><input type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value=""/></td>
                <td><select name="inline">
                    <option value="true">Inline</option>
                    <option value="false">External</option>
                </select>
                    <a href="#" class="submit-btn-plain float-right submit-this no-marg"><span></span>Add file</a></td>
            </tr>
            </thead>
        </table>
    </form>
    <div class="allowed-files">
        <!-- BEGIN file -->
        <div class="row-holder">
            <div class="row clearfix">
                <div class="enabled">
                    <p>{FILE_ENABLED}<img src="/images/mime/22x22/{FILE_ICON}"/></p>
                </div>
                <div class="description">
                    <p>{FILE_DESC}</p>
                </div>
                <div class="mime">
                    <p>{FILE_MIME}</p>
                </div>
                <div class="extensions">
                    <ul>{FILE_EXTENSION}</ul>
                </div>
                <div class="max_size">
                    <p>{FILE_MAXSIZE}</p>
                </div>
                <div class="inline clearfix">
                    <p>{FILE_INLINE}</p>
                    <span class="actions">
                        <a href="#" class="btn no-text modify" title="Modify"><span></span></a>
                    </span>
                </div>
            </div>
            <div class="row form-holder">

                <!--/adminv2/allowed-fileForm.php-->
                <form id="allowed-file{FILE_ID}" method="post" class="clearfix" action="/adminv2/allowed-fileForm.php">
                    <input type="hidden" readonly="readonly" name="fileTypeId" value="{FILE_ID}"/>
                    <fieldset class="enabled">
                        <fieldset>
                            <input type="checkbox" name="enable" value="true" {FILE_ENABLED_CHECKED} />
                            <button class="float-right open-dialog" id="icon-choice"><img
                                    src="/images/mime/22x22/{FILE_ICON}"/></button>
                            <input type="hidden" name="iconFile" id="button{FILE_ID}" class="chosen-one"
                                   value="{FILE_ICON}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="description">
                        <fieldset>
                            <input type="text" class="text-input" name="description" value="{FILE_DESC}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="mime">
                        <fieldset>
                            <input type="text" class="text-input" name="mime" value="{FILE_MIME}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="extensions">
                        <fieldset>
                            <input type="text" class="text-input" name="extension" value="{FILE_EXTENSION_CSV}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="max_size">
                        <fieldset>
                            <input type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value="{FILE_MAXSIZE_INPUT}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="inline">
                        <fieldset>
                            <select name="inline" id="inline">
                                <option value="true">Inline</option>
                                <option value="false"
                                {FILE_EXTERN_CHECKED}>External</option>
                            </select>
                            <a href="#" class="submit-btn-plain float-right submit-this no-marg"><span></span>Save</a> <a rel="" href="#" class="btn delete no-marg"><span></span>Delete</a>
                        </fieldset>
                    </fieldset>
                </form>
            </div>
        </div>
        <!-- END file -->
    </div>
</div>
<div id="dialog" title="Select an Icon">
    <div class="hide store-here"></div>
    <!-- BEGIN image -->
    <button class="new-button"><img src="/images/mime/22x22/{IMAGE_FILE}" alt="{IMAGE_FILE}"/></button>
    <!-- END image -->
</div>
<script type="text/javascript">
    $(function () {

        /* Force submission of checkboxes regardless of whether they are ticked
         * or not.
         */
        $('input[type=checkbox]').change(function () {
            var name = 'input[name=' + $(this).attr('name') + ']';

            if ($(this).prop('checked')) {
                $(name).val('true');
            }
            else {
                $(name).val('false');
            }
        });

        $.each($('input[type=checkbox]').is(':checked'));
    });
</script>
