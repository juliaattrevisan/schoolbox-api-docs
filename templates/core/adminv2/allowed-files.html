<!-- BEGIN custom_head -->
<script type="text/javascript">

    $(function () {

        $(document).on('click', '[data-interaction-modify]', function (event) {
            event.preventDefault();
            var container = $(this).closest('[data-interaction-container]');
            var display   = container.find('[data-interaction-display]');
            var form      = container.find('[data-interaction-inline-form]');
            display.slideUp();
            form.slideDown();
        });

        // Keep track of the file I'm selecting an icon for
        var selectingIconId = null;
        $(document).on('click', '[data-reveal-id="allowed-file-dialog"]', function(event) {
            event.preventDefault();
            selectingIconId = $(this).data('fileId');
        });

        // On choosing a new icon
        $('[data-interaction="select-icon"]').click(function () {
            // Update the button
            $('#icon-choice-'+selectingIconId).empty().append($(this).children().clone());
            // and the form
            $('#button-'+selectingIconId).val(this.value);
            // and close dialog
            $('#allowed-file-dialog').foundation('reveal', 'close');
        });

		$('form[data-action="createNewFileType"], form[data-action="updateFileType"]').each(function() {
            $(this).validate({
                rules: {
                    description: {
                        required: true,
                        minlength: 2
                    },
                    mime: {
                        required: true,
                        minlength: 2
                    },
                    extension: {
                        required: true,
                        minlength: 1
                    }
                },
                messages: {
                    title: "Please enter a title",
                    mime: "Please enter a mime type",
                    extension: "Please enter a file extension"
                },
                submitHandler: function (form) {
                    //
                    // Some sort of form validation - check for no duplicate mimetypes.
                    var create_form  = $('form[data-action="createNewFileType"]');
                    var update_forms = $('form[data-action="updateFileType"]');

                    if ($(form).is('form[data-action="createNewFileType"]')) {
                        create_form.add(update_forms);
                    }

                    var this_mimetype = $(form).find(':input[name="mime"]').val();

                    var mimetype_list = $.map(
                            update_forms.not(form).find(':input[name="mime"]'),

                            function(element) {
                                return $(element).val();
                            }
                    );

                    if ($.inArray(this_mimetype, mimetype_list) >= 0) {
                        alert('The mime type you have chosen for this file type is already in use.')
                        event.preventDefault();
                    }
                    else {
                        form.submit();
                    }
                }
            });
        });

        // row action buttons
        $(document).on('click', '[data-interaction-delete]', function (event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: "Are you sure you want to delete?",
                confirmEvent: function(element) {
                    var form = element.closest('form');
                    var nearestAction = form.attr('action');
                    var nearestFID = form.find('input[name=fileTypeId]').val();
                    form.attr('action', nearestAction + "?delete=" + nearestFID);
                    form.submit();
                }
            });
            return false;
        });

        $(document).on('click', '[data-interaction-disable],[data-interaction-enable]', function (event) {
            event.preventDefault();

            var enable = typeof $(this).attr('data-interaction-disable') == 'undefined' ? 'true' : 'false';

            var form = $(this).closest('form');

            form.find('input[name=enable]').val(enable);
            form.submit();
        });


        // form buttons

        $(document).on('click', '[data-interaction-save]', function (event) {
            event.preventDefault();
            $(this).closest('form').submit();
        });

        $(document).on('click', '[data-interaction-cancel]', function (event) {
            event.preventDefault();
            var container = $(this).closest('[data-interaction-container]');
            var display   = container.find('[data-interaction-display]');
            var form      = container.find('[data-interaction-inline-form]');
            form.slideUp();
            display.slideDown();

        });

        $(document).on('click', '[data-interaction-new]', function (event) {
            event.preventDefault();
            $('[data-action="createNewFileType"]').slideDown();
        });

    });

</script>

<!-- END custom_head-->

{ADMIN_NAV}

<div class="row">
    <div class="column small-12">
        <a href="/adminv2/allowed-file/new" data-interaction-new class="button icon-add">New file type</a>
    </div>
</div>

<form id="newAllowedFile" method="post" data-action="createNewFileType" action="/adminv2/allowed-fileForm.php" class="panel" style="display:none;">
    <input type="hidden" readonly="readonly" name="fileTypeId" value=""/>
    <h3>Create new file type</h3>
    <div class="row add-new">
        <div class="column small-6">
            <label>Icon <span data-tooltip class="hint has-tip tip-bottom" title="The icon used to represent this type of file">?</span></label>
            <a href="#" class="button no-text" id="icon-choice-new" data-reveal-id="allowed-file-dialog" data-file-id="new">
                <img src="/images/mime/22x22/txt.png">
            </a>
            <input type="hidden" name="iconFile" id="button-new" class="chosen-one" value="{FILE_ICON}"/>
        </div>
        <div class="column small-6">
            <label>Enabled<span data-tooltip class="hint has-tip tip-bottom" title="Controls if files of this type can be uploaded">?</span></label>
            <span class="switch">
                <input type="hidden" name="enable" value="false" />
                <input id="enabled-new" type="checkbox" name="enable" checked="checked" value="true" />
                <label for="enabled-new"></label>
            </span>
        </div>
        <div class="column">
            <label>Description <span data-tooltip class="hint has-tip tip-bottom" title="A simple name for the type of file">?</span></label>
            <input type="text" class="text-input" name="description">
        </div>
        <div class="column large-6">
            <label>Mime <span data-tooltip class="hint has-tip tip-bottom" title="The mime type for a file can be found by searching Google">?</span></label>
            <input type="text" class="text-input" name="mime">
        </div>
        <div class="column large-3">
            <label>Max Size <span data-tooltip class="hint has-tip tip-bottom" title="The maximum file size when uploading a file of this type - defaults to system-wide max file size">?</span></label>
            <input type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value=""/>
        </div>
        <div class="column large-3">
            <label>Inline <span data-tooltip class="hint has-tip tip-bottom" title="Determines if file will be opened in the browser or by a third party application">?</span></label>
            <select name="inline">
                <option value="true">Inline</option>
                <option value="false">External</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="column">
            <label>Extensions<span data-tooltip class="hint has-tip tip-bottom" title="The file extension, everything after the dot. Comma-separate multiple extensions">?</span></label>
            <input type="text" class="text-input" name="extension" value=""/>
        </div>
    </div>
    <div class="row">
        <div class="column">
            <input type="submit" value="Add" />
        </div>
    </div>
</form>
<div class="row">
    <div class="island small-12">
        <section>
            <ul class="action-list">
                <!-- BEGIN file -->
                <li class="actions-small-3" data-interaction-container>
                    <div class="list-item" data-interaction-display>
                        <div class="small-12 avatar card">
                            <h3>{FILE_DESC}</h3>



                            <div class="row">
                                <div class="small-12 medium-4 columns">
                                    <p class="meta">{FILE_MIME}</p>
                                </div>
                                <div class="small-12 medium-4 columns">
                                    <p class="meta">{FILE_MAXSIZE}</p>
                                </div>
                                <div class="small-12 medium-4 columns">
                                    <p class="meta">{FILE_INLINE}</p>
                                </div>
                            </div>
                        </div>

                        <!-- BEGIN enabled -->
                        <span class="label alert">Disabled</span>
                        <!-- END enabled -->

                        <!-- BEGIN file_extension -->
                        <span class="label neutral">{FILE_EXTENSION}</span>
                        <!-- END file_extension -->
                    </div>
                    <nav>
                        <a href="/adminv2/allowed-file/{FILE_ID}/{FILE_ENABLED_ACTION}" class="icon-{FILE_ENABLED_ICON}" title="{FILE_ENABLED_TITLE}" data-interaction-{FILE_ENABLED_ACTION}></a>
                        <a href="/adminv2/allowed-file/{FILE_ID}/modify" class="icon-modify" title="Modify" data-interaction-modify></a>
                        <a href="/adminv2/allowed-file/{FILE_ID}/delete" class="icon-delete" title="Delete" data-interaction-delete></a>
                    </nav>

                    <form data-action="updateFileType" id="allowed-file{FILE_ID}" method="post" action="/adminv2/allowed-fileForm.php">
                        <div style="display:none;" data-interaction-inline-form>
                            <div class="content">
                                <!--/adminv2/allowed-fileForm.php-->
                                <input type="hidden" readonly="readonly" name="fileTypeId" value="{FILE_ID}"/>
                                <input id="enabled-{FILE_ID}" type="hidden" name="enable" value="{FILE_ENABLED}" />
                                <div class="row">
                                    <div class="column">
                                        <label for="icon-choice-{FILE_ID}">Icon</label>
                                        <a href="#" class="button no-text" id="icon-choice-{FILE_ID}" data-reveal-id="allowed-file-dialog" data-file-id="{FILE_ID}">
                                            <img src="/images/mime/22x22/{FILE_ICON}" alt="{FILE_ICON}" />
                                        </a>
                                        <input type="hidden" name="iconFile" id="button-{FILE_ID}" class="chosen-one" value="{FILE_ICON}"/>
                                    </div>
                                    <div class="description column">
                                        <div>
                                            <label for="description-{FILE_ID}">Description</label>
                                            <input id="description-{FILE_ID}" type="text" class="text-input" name="description" value="{FILE_DESC}"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="mime column large-6">
                                        <div>
                                            <label for="mime-{FILE_ID}">Mime</label>
                                            <input id="mime-{FILE_ID}" type="text" class="text-input" name="mime" value="{FILE_MIME}"/>
                                        </div>
                                    </div>
                                    <div class="max_size column large-3">
                                        <div>
                                            <label for="max_file_size-{FILE_ID}">Max Size</label>
                                            <input id="max_file_size-{FILE_ID}" type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value="{FILE_MAXSIZE_INPUT}"/>
                                        </div>
                                    </div>
                                    <div class="inline column large-3">
                                        <div>
                                            <label for="inline-{FILE_ID}">Inline</label>
                                            <select name="inline" id="inline-{FILE_ID}">
                                                <option value="true">Inline</option>
                                                <option value="false" {FILE_EXTERN_CHECKED}>External</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="extensions column">
                                        <div>
                                            <label for="extension-{FILE_ID}">Extensions</label>
                                            <input id="extension-{FILE_ID}" type="text" class="text-input" name="extension" value="{FILE_EXTENSION_CSV}"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="column">
                                        <input type="submit" data-interaction-save value="Save" />
                                        <button data-interaction-cancel >Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </li>
                <!-- END file -->
            </ul>
        </section>
    </div>
</div>
