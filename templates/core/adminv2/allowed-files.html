<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.autoresize.js"></script>
<script type="text/javascript" src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<link rel="stylesheet" type="text/css" media="screen" href="/css/{SITE_LOCATION}/jquery-ui.css"/>
<script type="text/javascript">

    $j(function () {
        $j('.row-holder:nth-child(2n)').css("background-color", "#ffffff");

        $j.fn.qtip.defaults.position.corner = {
            target:'topLeft',
            tooltip:'bottomLeft'
        }

        $j.fn.qtip.defaults.style = {
            tip:'bottomLeft',
            name:'green'
        }

        $j('.allowed-files tr:first td:first').qtip({
            content:'Controls if files of this type can be uploaded'});

        $j('.allowed-files tr:first td:nth-child(2)').qtip({
            content:'A simple name for the type of file'});

        $j('.allowed-files tr:first td:nth-child(3)').qtip({
            content:'The mime type for a file can be found by searching google'});

        $j('.allowed-files tr:first td:nth-child(4)').qtip({
            content:'The file extension, everything after the dot. Comma seperate multiple extensions'});

        $j('.allowed-files tr:first td:nth-child(5)').qtip({
            content:'Determines if file will be opened in the browser or by a third party application'});

        $j('.allowed-files tr:first td:nth-child(6)').qtip({
            content:'The maximum file size when uploading a file of this type - defaults to system-wide max file size'});


        $j('.modify').live('click', function () {
            var trigger = 0;

            level = $j(this).parent().parent()

            $j('.form-holder').each(function () {
                if ($j(this).is(':visible')) {

                    level.slideUp(function () {
                        level.siblings('.form-holder').slideDown();
                    });

                    $j(this).siblings().slideDown();
                    $j(this).slideUp();
                    trigger = 1;

                }

            })

            if (trigger == 0) {
                level.slideUp(function () {
                    level.siblings('.form-holder').slideDown();
                });
            }

            return false;
        });

        $j('#dialog').dialog({

            width:650,
            autoOpen:false

        });

        $j('.open-dialog').click(function () {
            $j('#dialog').dialog('open');
            $j('#dialog').children('.store-here').html($j(this).siblings('.chosen-one').attr('ID'));
            // /images/mime/22x22/


            return false;
        });

        $j('.new-button').click(function () {

            var currentID = '#' + $j(this).siblings('.store-here').html();

            $j(currentID).val($j(this).children('img').attr('alt'));
            $j(currentID).siblings('.open-dialog').children('img').attr('src', $j(this).children('img').attr('src'));

            $j('#dialog').dialog('close');

        });

        //
        // Some sort of form validation - check for no duplicate mimetypes.
        var create_form  = $j('form#newAllowedFile');
        var update_forms = $j('form[id^="allowed-file"]');
        create_form.add(update_forms).submit(function(event) {
            var this_mimetype = $j(this).find(':input[name="mime"]').val();
            var mimetype_list = $j.map(
                update_forms.not(this).find(':input[name="mime"]'),
                function(element) { return $j(element).val(); }
            );
            if ($j.inArray(this_mimetype, mimetype_list) >= 0) {
                alert('The mime type you have chosen for this file type is already in use.')
                event.preventDefault();
            }
        });

        $j('.delete').click(function (event) {


            event.preventDefault();
            if (confirm("Are you sure you want to delete?")) {
                var nearestAction = $j(this).closest('form').attr('action');
                var nearestFID = $j(this).closest('form').find('input[name=fileTypeID]').val();
                $j(this).closest('form').attr('action', nearestAction + "?delete=" + nearestFID);
                $j(this).closest('form').submit();
            }

            return false;
        });

    });

</script>

<!-- END custom_head-->

<h1>Schoolbox Administration</h1>
<ul class="admin-nav">
    <!-- BEGIN admin_nav_item -->
    <li><a href="/adminv2/{ADMNAV_HREF}" class="{ADMNAV_CURRENT}">{ADMNAV_LABEL}</a></li>
    <!-- END admin_nav_item -->
</ul>
<div class="admin-contents">
    <h2>Allowed Files</h2>

    <form id="newAllowedFile" method="post" action="/adminv2/allowed-fileForm.php">
        <input type="hidden" readonly="readonly" name="fileTypeID" value=""/>
        <table cellpadding="0" cellspacing="0" class="allowed-files">
            <colgroup>
                <col class="enabled" />
                <col class="description" />
                <col class="mime" />
                <col class="extensions" />
                <col class="max_size" />
                <col class="inline" />
            </colgroup>
            <thead>
            <tr>
                <td><h3>Enabled<span>?</span></h3></td>
                <td><h3>Description<span>?</span></h3></td>
                <td><h3>Mime<span>?</span></h3></td>
                <td><h3>Extensions<span>?</span></h3></td>
                <td><h3>Max Size<span>?</span></h3></td>
                <td><h3>Inline<span>?</span></h3></td>
            </tr>
            <tr class="add-new">
                <td><input type="checkbox" name="enable" checked="checked" value="true"/>
                    <button class="float-right open-dialog" id="icon-choice"><img src="/images/mime/22x22/txt.png">
                    </button>
                    <input type="hidden" name="iconFile" id="button{FILE_ID}" class="chosen-one" value="{FILE_ICON}"/>
                </td>
                <td><textarea class="text-input textarea" name="description"></textarea></td>
                <td><textarea class="text-input textarea" name="mime"></textarea></td>
                <td><input type="text" class="text-input" name="extension" value=""/></td>
                <td><input type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value=""/></td>
                <td><select name="inline">
                    <option value="true">Inline</option>
                    <option value="false">External</option>
                </select>
                    <a href="#" class="btn add submit no-marg"><span></span>Add new file type</a></td>
            </tr>
            </thead>
        </table>
    </form>
    <div class="allowed-files">
        <!-- BEGIN file -->
        <div class="row-holder">
            <div class="row clearfix">
                <div class="enabled">
                    <p>{FILE_ENABLED}<img src="/images/mime/22x22/{FILE_ICON}"/></p>
                </div>
                <div class="description">
                    <p>{FILE_DESC}</p>
                </div>
                <div class="mime">
                    <p>{FILE_MIME}</p>
                </div>
                <div class="extensions">
                    <p>{FILE_EXTENSION}</p>
                </div>
                <div class="max_size">
                    <p>{FILE_MAXSIZE}</p>
                </div>
                <div class="inline clearfix">
                    <p>{FILE_INLINE}</p>
                    <a href="#" class="btn modify no-marg"><span></span>Modify</a></div>
            </div>
            <div class="row form-holder">

                <!--/adminv2/allowed-fileForm.php-->
                <form id="allowed-file{FILE_ID}" method="post" class="clearfix" action="/adminv2/allowed-fileForm.php">
                    <input type="hidden" readonly="readonly" name="fileTypeID" value="{FILE_ID}"/>
                    <fieldset class="enabled">
                        <fieldset>
                            <input type="checkbox" name="enable" value="true" {FILE_ENABLED_CHECKED} />
                            <button class="float-right open-dialog" id="icon-choice"><img
                                    src="/images/mime/22x22/{FILE_ICON}"/></button>
                            <input type="hidden" name="iconFile" id="button{FILE_ID}" class="chosen-one"
                                   value="{FILE_ICON}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="description">
                        <fieldset>
                            <textarea class="text-input textarea" name="description">{FILE_DESC}</textarea>
                        </fieldset>
                    </fieldset>
                    <fieldset class="mime">
                        <fieldset>
                            <textarea class="text-input textarea" name="mime">{FILE_MIME}</textarea>
                        </fieldset>
                    </fieldset>
                    <fieldset class="extensions">
                        <fieldset>
                            <input type="text" class="text-input" name="extension" value="{FILE_EXTENSION}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="max_size">
                        <fieldset>
                            <input type="text" class="text-input" name="max_file_size" placeholder="{FILE_MAXSIZE_PLACEHOLDER}" value="{FILE_MAXSIZE_INPUT}"/>
                        </fieldset>
                    </fieldset>
                    <fieldset class="inline">
                        <fieldset>
                            <select name="inline" id="inline">
                                <option value="true">Inline</option>
                                <option value="false"
                                {FILE_EXTERN_CHECKED}>External</option>
                            </select>
                            <a href="#" class="btn tick submit no-marg"><span></span>Save</a> <a rel="" href="#"
                                                                                                 class="btn delete no-marg"><span></span>Delete</a>
                        </fieldset>
                    </fieldset>
                </form>
            </div>
        </div>
        <!-- END file -->
    </div>
</div>
<div id="dialog" title="Select an Icon">
    <div class="hide store-here"></div>
    <!-- BEGIN image -->
    <button class="new-button"><img src="/images/mime/22x22/{IMAGE_FILE}" alt="{IMAGE_FILE}"/></button>
    <!-- END image -->
</div>
<script type="text/javascript">
    $j(function () {

        /* Force submission of checkboxes regardless of whether they are ticked
         * or not.
         */
        $j('input[type=checkbox]').change(function () {
            var name = 'input[name=' + $j(this).attr('name') + ']';

            if ($j(this).attr('checked')) {
                $j(name).val('true');
            }
            else {
                $j(name).val('false');
            }
        });

        $j.each($j('input[type=checkbox]').is(':checked'));
    });
</script>
