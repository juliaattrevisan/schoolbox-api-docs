<!-- BEGIN custom_head -->
<script type="text/javascript">

    $(function () {

        $(document).on('click', '[data-interaction-modify]', function () {

            var trigger = 0,
                level   = $(this).closest('div.row'),
                target  = '[data-interaction-inline-form]';

            $('.form-holder').each(function () {
                if ($(this).is(':visible')) {

                    level.slideUp(function () {
                        level.siblings(target).slideDown();
                    });

                    $(this).siblings().slideDown();
                    $(this).slideUp();
                    trigger = 1;
                }
            });

            if (trigger == 0) {
                level.slideUp(function () {
                    level.siblings(target).slideDown();
                });
            }

            return false;
        });

        $('#dialog').dialog({
            modal:true,
            width:650,
            autoOpen:false

        });

        $(document).on('click', '.open-dialog', function () {
            $('#dialog').dialog('open');
            $('#dialog').children('.store-here').html($(this).siblings('.chosen-one').attr('ID'));
            // /images/mime/22x22/


            return false;
        });

        $('.new-button').click(function () {

            var currentID = '#' + $(this).siblings('.store-here').html();

            $(currentID).val($(this).children('img').attr('alt'));
            $(currentID).siblings('.open-dialog').children('img').attr('src', $(this).children('img').attr('src'));

            $('#dialog').dialog('close');

        });

		$('form#newAllowedFile').validate({
			rules: {
				description: {
					required: true,
					minlength: 2
				},
				mime: {
					required: true,
					minlength: 2
				},
				extension: {
					required: true,
					minlength: 1
				}
			},
			messages: {
				title: "Please enter a title",
				mime: "Please enter a mime type",
				extension: "Please enter a file extension"
			},
			submitHandler: function (form) {
				//
				// Some sort of form validation - check for no duplicate mimetypes.
				var create_form  = $('form#newAllowedFile');
				var update_forms = $('form[id^="allowed-file"]');

				create_form.add(update_forms);

				var this_mimetype = $(this).find(':input[name="mime"]').val();

				var mimetype_list = $.map(
					update_forms.not(this).find(':input[name="mime"]'),

						function(element) {
						return $(element).val();
					}
				);

				if ($.inArray(this_mimetype, mimetype_list) >= 0) {
					alert('The mime type you have chosen for this file type is already in use.')
					event.preventDefault();
				}
				else {
					form.submit();
				}
			}
		});

        // row action buttons

        $(document).on('click', '[data-interaction-delete]', function (event) {

            event.preventDefault();
            if (confirm("Are you sure you want to delete?")) {
                var nearestAction = $(this).closest('form').attr('action');
                var nearestFID = $(this).closest('form').find('input[name=fileTypeId]').val();
                $(this).closest('form').attr('action', nearestAction + "?delete=" + nearestFID);
                $(this).closest('form').submit();
            }

            return false;
        });

        $(document).on('click', '[data-interaction-disable],[data-interaction-enable]', function (event) {
            event.preventDefault();

            var enable = typeof $(this).attr('data-interaction-disable') == 'undefined' ? 'true' : 'false';

            var form = $(this).closest('form');

            form.find('input[name=enable]').val(enable);
            form.submit();
        });


        // form buttons

        $(document).on('click', '[data-interaction-save]', function (event) {
            event.preventDefault();
            $(this).closest('form').submit();
        });

        $(document).on('click', '[data-interaction-cancel]', function (event) {
            event.preventDefault();
            $(this).closest('[data-interaction-inline-form]').slideUp().siblings().slideDown();

        });

        $(document).on('click', '[data-interaction-new]', function (event) {
            event.preventDefault();
            $('#newAllowedFile').slideDown();
        });

    });

</script>

<!-- END custom_head-->

<script type="text/javascript">
    $(function () {

        /* Force submission of checkboxes regardless of whether they are ticked
         * or not.
         */
        $('input[type=checkbox]').change(function () {
            var name = 'input[name=' + $(this).attr('name') + ']';

            if ($(this).prop('checked')) {
                $(name).val('true');
            }
            else {
                $(name).val('false');
            }
        });

        $.each($('input[type=checkbox]').is(':checked'));
    });
</script>
