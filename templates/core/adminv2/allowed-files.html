<!-- BEGIN custom_head -->
<script type="text/javascript">

    $(function () {

        $(document).on('click', '[data-interaction-modify]', function (event) {
            event.preventDefault();

            //Slide up all other forms first
            $(document).find('[data-interaction-container]').each( function() {
                var display = $(this).find('[data-interaction-display]');
                var form = $(this).find('[data-interaction-inline-form]');
                form.slideUp();
                display.slideDown();
            });


            var container = $(this).closest('[data-interaction-container]');
            var display   = container.find('[data-interaction-display]');
            var form      = container.find('[data-interaction-inline-form]');

            display.slideUp();
            form.slideDown();
        });

        // Keep track of the file I'm selecting an icon for
        var selectingIconId = null;
        $(document).on('click', '[data-reveal-id="allowed-file-dialog"]', function(event) {
            event.preventDefault();
            selectingIconId = $(this).data('fileId');
        });

        // On choosing a new icon
        $('[data-interaction="select-icon"]').click(function () {
            // Update the button
            $('#icon-choice-'+selectingIconId).empty().append($(this).children().clone());
            // and the form
            $('#button-'+selectingIconId).val(this.value);
            // and close dialog
            $('#allowed-file-dialog').foundation('reveal', 'close');
        });

        jQuery.validator.addMethod("mimeNotUsed", function(value, element) {
            //
            // Some sort of form validation - check for no duplicate mimetypes.

            var form = element.closest("form");
            var create_form  = $('form[data-action="createNewFileType"]');
            var update_forms = $('form[data-action="updateFileType"]');

            if ($(form).is('form[data-action="createNewFileType"]')) {
                create_form.add(update_forms);
            }

            var this_mimetype = value;

            var mimetype_list = $.map(
                update_forms.not(form).find(':input[name="mime"]'),

                function(element) {
                    return $(element).val();
                }
            );


            if ($.inArray(this_mimetype, mimetype_list) >= 0) {
                return false;
            }
            else {
                return true;
            }
        });

		$('form[data-action="createNewFileType"], form[data-action="updateFileType"]').each(function() {
            $(this).alaressValidate({
                rules: {
                    description: {
                        required: true,
                        minlength: 2
                    },
                    mime: {
                        required: true,
                        mimeNotUsed: true,
                        minlength: 2
                    },
                    extension: {
                        required: true,
                        minlength: 1
                    }
                },
                messages: {
                    title: "Please enter a title",
                    mime: {
                        required: "Please enter a mime type",
                        mimeNotUsed: "The mime type you have chosen for this file type is already in use."
                    },
                    extension: "Please enter a file extension"
                }
            });
        });

        // row action buttons
        $(document).on('click', '[data-interaction-delete]', function (event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: "Are you sure you want to delete?",
                confirmLabel: 'Delete',
                confirmEvent: function(element) {
                    var deleteId = event.target.getAttribute('data-interaction-delete');
                    window.location.href = '/adminv2/allowed-fileForm.php?delete=' + deleteId
                }
            });
            return false;
        });

        $(document).on('click', '[data-interaction-disable],[data-interaction-enable]', function (event) {
            event.preventDefault();

            var enable = typeof $(this).attr('data-interaction-disable') == 'undefined' ? 'true' : 'false';

            var form = $(this).closest('[data-interaction-container]').find('form');
            form.find('input[name=enable]').val(enable);
            form.submit();
        });

        // form buttons
        $(document).on('click', '[data-interaction-cancel]', function (event) {
            event.preventDefault();
            var container = $(this).closest('[data-interaction-container]');
            var display   = container.find('[data-interaction-display]');
            var form      = container.find('[data-interaction-inline-form]');
            form.slideUp();
            display.slideDown();
        });

        $(document).on('click', '[data-interaction-new]', function (event) {
            event.preventDefault();
            $('[data-action="createNewFileType"]').slideDown();
        });

    });

</script>
<!-- END custom_head-->

<div class="admin-container row">

    {ADMIN_NAV}

                                    </label>
                                </span>

                    <fieldset class="content">
                        <div class="small-12 columns">

                            <input type="text" class="text-input" name="extension" value=""/>
                        </div>
                    </fieldset>
                </section>
                <input type="submit" value="Add" />
            </form>
        </div>
        <div class="island small-12">
            <section>
                <ul class="action-list">
                    <!-- BEGIN file -->
                    <li class="actions-small-3" data-interaction-container>
                        <div class="list-item" data-interaction-display>
                            <div class="small-12 card">
                                <img class="mime" src="{CDN_PREFIX}/images/mime/{FILE_ICON}"/>

                                <div class="row">
                                    <div class="small-12 medium-4 columns no-pad no-overflow">
                                        <span class="meta">{FILE_MIME}</span>
                                    </div>
                                    <div class="small-12 medium-2 columns no-pad">
                                        <span class="meta">{FILE_MAXSIZE}</span>
                                    </div>
                                    <!-- BEGIN enabled -->

                                </div>

                                            <span class="label neutral">{FILE_EXTENSION}</span>

                                        </div>
                                    </div>
                                </div>

                        </div>
                        <nav data-interaction-display>

                        </nav>
