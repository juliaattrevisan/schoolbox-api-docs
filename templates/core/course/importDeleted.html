<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/shared/course/jquery.course-import.js"></script>
<script type="text/javascript" src="/javascript/shared/datetime/jquery.sync-dates.js"></script>
<script type="text/javascript">
(function($) {
    $(function() {
        $('form#importForm').setupCourseImport();
    });
})(jQuery);
</script>
<!-- END custom_head -->
{BREADCRUMB}

<div class="row">
    <div class="small-12 columns">
        <h1>Import Units from Deleted Courses</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form method="post" action="/course/importDeletedForm.php" id="importForm">
            <input type="hidden" name="homepage"  value="{HOMEPAGE_ID}" />
            <input type="hidden" name="component" value="{COMPONENT_ID}" />

            <section>
                <fieldset class="content">
                    <legend>Units</legend>
                    <!-- BEGIN unimportable -->
                    <div class="small-12 columns">
                        <div class="alert-box">
                            This class contains no units that belong to deleted courses.
                        </div>
                    </div>
                    <!-- END unimportable -->
                    <!-- BEGIN importable -->
                    <div class="small-12 columns no-pad">
                        <ul class="information-list">
                            <!-- BEGIN unit -->
                            <li class="actions-small-1">
                                <div class="list-item">
                                    <div class="avatar card small-12">
                                        <input name="unit[{UNIT_ID}]" type="hidden" value="0" />
                                        <input id="import-{UNIT_ID}" name="unit[{UNIT_ID}]" type="checkbox" value="1" {UNIT_ENABLED_CHECKED} />
                                        <label for="import-{UNIT_ID}" class="checkbox-label">{UNIT_NAME}</label>
                                        <p class="meta">
                                            Open <time datetime="{UNIT_OPEN_DATE}" title="{UNIT_OPEN_DATE_LABEL}">{UNIT_OPEN_DATE_REL}</time>,
                                            due <time datetime="{UNIT_DUE_DATE}" title="{UNIT_DUE_DATE_LABEL}">{UNIT_DUE_DATE_REL}</time>
                                        </p>
                                    </div>
                                </div>
                                <nav>
                                    <a href="/task/progressReport/{HOMEPAGE_ID}/{UNIT_ID}" class="icon icon-progress" title="Progress Report"></a>
                                </nav>
                            </li>
                            <!-- END unit -->
                        </ul>
                    </div>
                    <!-- END importable -->
                </fieldset>
            </section>

            <!-- BEGIN submit -->
            <input type="submit" value="Import" />
            <!-- END submit -->
        </form>
    </div>
</div>
