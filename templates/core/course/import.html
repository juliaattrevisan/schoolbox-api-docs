<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<script type="text/javascript">
(function($) {
    $(function() {
        // Setup datepickers
        $('input[data-interaction="datepicker"]').datepicker({
            dateFormat:'dd/mm/yy',
            showOn:'both',
            buttonImage:'/images/core/calendar/calendar-click.png',
            buttonImageOnly:true,
            constrainInput:false,
            onClose:function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string:string}, function (data) {
                    input.val(data.time);
                })
            }
        });
    });
})(jQuery);
</script>
<!-- END custom_head -->

<h1>Import a course</h1>

<form method="post" action="/course/importForm.php">

    <table class="standardForm">

        <tr>
            <td class="formLabelWidth">
                <h4>Course</h4>
            </td>
            <td colspan="2">

            </td>
        </tr>

        <tr>
            <td class="formLabelWidth">
                <h4>Destination Class</h4>
            </td>
            <td colspan="2"></td>
        </tr>

        <tr>
            <td class="formLabelWidth">
                <h4>Unit Name</h4>
            </td>
            <td><h4>Open Date</h4></td>
            <td><h4>Due Date</h4></td>
        </tr>

        <!-- BEGIN unit -->
        <tr>
            <td class="formLabelWidth">
                <h4><a href="/homepage/{UNIT_ID}">{UNIT_NAME}</a></h4>
            </td>
            <td>
                <input id="open_date-{UNIT_ID}" name="open_date[{UNIT_ID}]" type="text" size="15" maxlength="30" value="{UNIT_OPEN_DATE}" data-interaction="datepicker" />
            </td>
            <td>
                <input id="due_date-{UNIT_ID}" name="due_date[{UNIT_ID}]" type="text" size="15" maxlength="30" value="{UNIT_DUE_DATE}" data-interaction="datepicker" />
            </td>
        </tr>
        <!-- END unit -->
    </table>

    <input type="submit" value="Import" class="submit-btn-plain" />
</form>
