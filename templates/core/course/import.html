<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<script type="text/javascript">
(function($) {
    $(function() {
        // Setup datepickers
        $('input[data-interaction="datepicker"]').datepicker({
            dateFormat:'dd/mm/yy',
            showOn:'both',
            buttonImage:'/images/core/calendar/calendar-click.png',
            buttonImageOnly:true,
            constrainInput:false,
            onClose:function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string:string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        var form = $('form#importForm');
        form.delegate('input[data-interaction="enable"]', 'click', function(event) {
            var element = $(this);
            var row     = element.closest('[data-type="unit_row"]');
            if (!element.is(':checked')) {
                row.find(':input').not(this).prop('disabled', true);
                row.data('enabled', false);
            }
            else {
                row.find(':input').not(this).prop('disabled', false);
                row.data('enabled', true);
            }
        });

        // Form for validation: on any blur event on a form field, it's validated.
        form.validate();
        form.delegate('input', 'blur', function() { form.valid(); })

        // Date validation
        form.find('input.open_date').each(function() {
            $(this).rules('add', {
                datepickerDate: true,
                messages: {
                    datepickerDate: 'Please enter a valid date.'
                }
            });
        });
        form.find('input.due_date').each(function() {
            $(this).rules('add', {
                datepickerDate: true,
                datepickerDateNotBefore: {
                    param: function(this_element) {
                        return $(this_element).closest('[data-type="unit_row"]').find('input.open_date');
                    }
                },
                messages: {
                    datepickerDate: 'Please enter a valid date.',
                    datepickerDateNotBefore: 'Please enter a valid date not before the open date.'
                }
            });
        });
    });
})(jQuery);
</script>
<!-- END custom_head -->

<h1>Import a course</h1>

<form method="post" action="{FORM_ACTION}" id="importForm">

    <input type="hidden" name="homepage"        value="{HOMEPAGE_ID}" />
    <input type="hidden" name="course_homepage" value="{COURSE_HOMEPAGE_ID}" />
    <input type="hidden" name="component"       value="{COMPONENT_ID}" />

    <table class="standardForm">

        <tr>
            <td class="formLabelWidth">
                <h4>Course</h4>
                <em>The course that is being imported.</em>
            </td>
            <td>
                <!-- BEGIN course_breadcrumb -->
                <span class="category"><a href="/homepage/{COURSE_CATEGORY_ID}/">{COURSE_CATEGORY_NAME}</a></span>
                <!-- END course_breadcrumb -->
            </td>
        </tr>

        <tr>
            <td class="formLabelWidth">
                <h4>Destination Class</h4>
                <em>The class that the course is being imported into.</em>
            </td>
            <td class="course_definition">
                <!-- BEGIN class_breadcrumb -->
                <span class="category"><a href="/homepage/{CLASS_CATEGORY_ID}/">{CLASS_CATEGORY_NAME}</a></span>
                <!-- END class_breadcrumb -->
            </td>
        </tr>

        <tr>
            <td class="formLabelWidth">
                <h4>Units</h4>
                <em>You will need to set a start and end date for each unit that you want to import.</em>
            </td>
            <td>
                <table>
                    <tr>
                        <td>Name</td>
                        <td>Open Date</td>
                        <td>Due Date</td>
                    </tr>
                    <!-- BEGIN unit -->
                    <tr data-type="unit_row" data-enabled="1">
                        <td>
                            <input name="unit[{UNIT_ID}][import]" type="hidden" value="0" />
                            <input id="import-{UNIT_ID}" name="unit[{UNIT_ID}][import]" type="checkbox" value="1" checked="checked" data-interaction="enable" />
                            <label for="import-{UNIT_ID}">{UNIT_NAME}</label>
                            (<a href="/homepage/{UNIT_ID}" class="unit_name" data-unit_id="{UNIT_ID}">View</a>)
                            <input name="unit[{UNIT_ID}][unit_instance_id]" type="hidden" value="{UNIT_INSTANCE_ID}" />
                        </td>
                        <td>
                            <input class="open_date" id="open_date-{UNIT_ID}" name="unit[{UNIT_ID}][open_date]" type="text" size="15" maxlength="30" value="{UNIT_OPEN_DATE}" data-interaction="datepicker" />
                        </td>
                        <td>
                            <input class="due_date" id="due_date-{UNIT_ID}" name="unit[{UNIT_ID}][due_date]" type="text" size="15" maxlength="30" value="{UNIT_DUE_DATE}" data-interaction="datepicker" />
                        </td>
                    </tr>
                    <!-- END unit -->
                </table>
            </td>
        </tr>
    </table>

    <input type="submit" value="Import" class="submit-btn-plain" />
</form>
