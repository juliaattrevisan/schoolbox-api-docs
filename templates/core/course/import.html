<h1>Import a course</h1>

<form method="post" action="/course/importForm.php">

    <table class="standardForm">
        <tr>
            <td class="formLabelWidth">
                <h4>Unit Name</h4>
            </td>
            <td><h4>Open Date</h4></td>
            <td><h4>Due Date</h4></td>
        </tr>

        <!-- BEGIN unit -->
        <tr>
            <td class="formLabelWidth">
                <h4><a href="/homepage/{UNIT_ID}">{UNIT_NAME}</a></h4>
            </td>
            <td>
                <fieldset>
                    <input name="open_date[{UNIT_ID}]" type="text" value="" size="20"/>
                    <input name="open_hour[{UNIT_ID}]" type="text" value="" maxlength="2" class="timeField"/>
                    <span>:</span>
                    <input name="open_minute[{UNIT_ID}]" type="text" value="" maxlength="2" class="timeField"/>
                    <select name="open_period[{UNIT_ID}]" class="short">
                        <option value="am">AM</option>
                        <option value="pm">PM</option>
                    </select>
                </fieldset>
            </td>
            <td>
                <fieldset>
                    <input name="due_date[{UNIT_ID}]" type="text" value="" size="20"/>
                    <input name="due_hour[{UNIT_ID}]" type="text" value="" maxlength="2" class="timeField"/>
                    <span>:</span>
                    <input name="due_minute[{UNIT_ID}]" type="text" value="" maxlength="2" class="timeField"/>
                    <select name="due_period[{UNIT_ID}]" class="short">
                        <option value="am">AM</option>
                        <option value="pm">PM</option>
                    </select>
                </fieldset>
            </td>
        </tr>
        <!-- END unit -->
    </table>

    <input type="submit" value="Import" class="submit-btn-plain" />
</form>
