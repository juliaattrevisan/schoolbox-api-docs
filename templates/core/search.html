<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.scrollTo.js"></script>
<script type="text/javascript" src="/javascript/jquery.search.js"></script>
<script type="text/javascript">
$j(function() {
	$j('#type a[class!=disabled]').click(function() {

		/* Depends on what you selected
		 */
		var keyword = "{KEYWORD}";
		var section = $j(this).attr('title');
		var pageNumber = 1;

		/* Set up configuration using a parameterised config object
		 */
		search.init({
			keyword: keyword,
			section: section,
			pageNumber: pageNumber
		});

		/* Load result set via ajax into target div
		 */
		search.load();

		/* Add pagination events to links
		 */
		search.paginate();

		/* Hide all divs, and only show the current one
		 */
		search.hideTabs();

		/* Tab styling
		 */
		$j('#type a').removeClass('selected');
		$j(this).addClass('selected');
	});
});
</script>
<!-- END custom_head -->

<h1>Search Results</h1>

<ul id="type">
    <!-- BEGIN type -->
    <li>
		<a href="#" title="{TYPE_TITLE}" class="{TYPE_CLASS}">{TYPE_NAME} ({TYPE_COUNT})</a>
	</li>
    <!-- END type -->
</ul>

<div class="results">
    <!-- BEGIN result -->
    <div title="{RESULT_TITLE}" class="{RESULT_CLASS}">
		{RESULT}
	</div>
    <!-- END result -->
</div>
