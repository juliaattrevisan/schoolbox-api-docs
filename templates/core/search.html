<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.scrollTo.js"></script>
<script type="text/javascript" src="/javascript/jquery.search.js"></script>
<script type="text/javascript">

$j(function() {

	/* Set initial conditions
	 */
	var keyword = "{KEYWORD}";
	var section = 'all';
	var pageNumber = 1;

	if (window.location.hash.length > 1) {
		var params = search.fetchHash();

		if (params.length) {
			var section = params[0];
		}

		if (params.length > 1) {
			var pageNumber = params[1];
		}
	}

	search.runOnce(keyword, section, $j('#type a[title=' + section + ']'), pageNumber);

	/* Runs when you change sections
	 */
	$j('#type a[class!=disabled]').click(function(event) {
		event.preventDefault();

		search.runOnce(keyword, $j(this).attr('title'), $j(this), pageNumber);
	});
});
</script>
<!-- END custom_head -->

<h1>Search Results</h1>

<ul id="type">
    <!-- BEGIN type -->
    <li>
		<a href='#' title="{TYPE_TITLE}" class="{TYPE_CLASS}">{TYPE_NAME} ({TYPE_COUNT})</a>
	</li>
    <!-- END type -->
</ul>

<div class="results">
    <!-- BEGIN result -->
    <div title="{RESULT_TITLE}" class="{RESULT_CLASS}">
		{RESULT}
	</div>
    <!-- END result -->
</div>
