<body class="login {SIDE}">
<div id="container">
	<div id="content">
		<form id="login" method="post" action="/loginForm.php?{GET_PARAMS}">
            <input type="hidden" name="page" value="{HIDDEN}" />
            <div class="row collapse">
                <div class="small-12 column">
                    <a href="/" class="logo">
                        <img src="/images/logo.php?logo=skin_logo_login&size=normal" alt="{SITE_NAME}" />
                    </a>
                </div>
                <div class="small-12 column">
                    <!-- BEGIN terms --><!--
                    <p>Use of {SITE_TITLE} is governed by School policy which is deemed to be accepted at login time. A summary of the policy can be found <a href="/policy.php">here</a>. Staff and Students are expected to keep themselves informed of the full policy requirements which are available in {SITE_TITLE}.</p>
                    --><!-- END terms -->
                    <p id="error-msg" class="alert-box alert">{ERROR}</p>
                </div>
                <div class="small-12 column">
                    <!--[if lt IE 10]>
                    <label for="username">Username</label>
                    <![endif]-->
                    <input type="text" name="username" id="username" placeholder="Username" />
                </div>
                <div class="small-12 column">
                    <!--[if lt IE 10]>
                    <label for="password">Password</label>
                    <![endif]-->
                    <input type="password" name="password" id="password" placeholder="Password" />
                </div>
            </div>
            <div class="row collapse">
                <div class="small-7 medium-12 column">
                    <!-- BEGIN remember_me -->
                    <input id="rememberme" type="checkbox" name="rememberme" value="1" />
                    <label for="rememberme">Remember me</label>
                    <!-- END remember_me -->
                </div>
                <div class="small-5 medium-12 column">
                    <input type="submit" name="Submit" value="Sign in" alt="Sign in" />
                </div>
                <!-- BEGIN terms_acceptance --><!--
                <div class="small-12 column">
                    <input required class="required" id="tandc" name="tandc" type="checkbox" title="You must agree to the Terms and Conditions before proceeding" />
                    <label for="tandc" class="tandc">
                        I agree to be legally bound by the <a href="/policy.php"> Terms and Conditions</a> of use for this website.
                    </label>
                </div>
                <script type="text/javascript">
                    $(function () {
                        $('#login').validate({
                            errorPlacement: function(error, element) {
                                if (element.attr("name") == "tandc") {
                                    error.appendTo("#error-msg");
                                } else {
                                    error.appendTo(element);
                                }
                            }
                        });
                    });
                </script>
                --><!-- END terms_acceptance -->
            </div>
            <div class="row collapse">
                <div class="small-12 column">
                    <a href="/forgotten-password.php">Parents, forgotten your password?</a>
                </div>
            </div>
        </form>
    </div>
    <div id="footer">
        <ul>
            <li>{TEMPLATE_YEAR} &copy; Copyright <a href="{SCHOOL_ADDRESS}">{SITE_NAME}</a></li>
            <li><a href="/policy.php">Terms of Use and Privacy Policy</a></li>
            <li>Powered by <a href="http://www.schoolbox.com.au" title="Virtual Learning Environment, Learning Management System, LMS">Schoolbox</a></li>
            <li><a href="/feedback.php" title="Web Designers">Feedback and Support</a></li>
        </ul>
    </div>
</div>
<script type="text/javascript">

    var l, fy;

    $(function () {

        l = $('#login');

        fy = $('#footer').height();

        $(window).on('resize', function () {
            l.css('top', Math.max(0, ($(window).height() - l.height() - fy) / 2));
        }).trigger('resize');

        l.on('submit', function () {
            $(this).find('input[type=submit]').prop('disabled', true);
        });

    });

</script>
</body>
