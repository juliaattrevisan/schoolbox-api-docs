<div class="actions-small-3 row">
    <div class="list-item">
        <div class="small-12 column">
            <h1>Leave Request</h1>
            <ul class="meta">
                <li class="icon-staff-students">{USER_NAME}</li>
                <li class="icon-group">Year {USER_YEAR}</li>
                <li class="icon-home">{USER_HOUSE}</li>
            </ul>
        </div>
    </div>
    <nav>
        <!-- BEGIN prev_pending -->
        <a class="icon-previous" href='/modules/leave/modify/{PREV_PENDING_ID}' title="Previous Pending"></a>
        <!-- END prev_pending -->

        <!-- BEGIN next_pending -->
        <a class="icon-next" href='/modules/leave/modify/{NEXT_PENDING_ID}' title="Next Pending"></a>
        <!-- END next_pending -->

        <a class="icon-list" href='/modules/leave/house/{USER_HOUSE_ID}' title="Back to list"></a>
    </nav>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/modules/leave/processModify" method="post" class="top" data-validate>
            <input type="hidden" name="request[id]" value="{REQUEST_ID}">

            <section>
                <fieldset class="content">
                    <legend>Student</legend>
                    <div class="small-12 large-6 columns">
                        <dl>
                            <dt>Name</dt>
                            <dd>{USER_NAME}</dd>
                        </dl>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="requestuserPhone">
                            Phone
                            <input type="text" name="request[userPhone]" value="{REQUEST_USER_PHONE}" id="requestuserPhone" required />
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <div class="small-12 large-6 columns">
                        <label>
                            Status
                        </label>
                        <p>
                            {REQUEST_STATUS}
                        </p>
                    </div>

                    <div class="small-12 large-6 columns">
                        <label>
                            Requested By
                        </label>
                        <p>
                            {AUTHOR_NAME}
                        </p>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Leaving</legend>
                    <div class="small-6 columns">
                        <label for="startDate">
                            Date
                            <input name="request[start][date]" id="startDate" type="text" required data-datepicker value="{REQUEST_START_DATE}" />
                        </label>
                    </div>
                    <div class="small-6 columns">
                        <label for="startTime">
                            Time
                            <select name='request[start][time]' id="startTime">
                                <!-- BEGIN request_start_time -->
                                <option value='{REQUEST_START_TIME_VALUE}' {REQUEST_START_TIME_SELECTED}>{REQUEST_START_TIME_LABEL}</option>
                                <!-- END request_start_time -->
                            </select>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Returning</legend>
                    <div class="small-12 large-6 columns">
                        <label for="finishDate">
                            Date
                            <input name="request[finish][date]" id="finishDate" type="text" required data-datepicker value="{REQUEST_FINISH_DATE}" />
                        </label>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="finishTime">
                            Time
                            <select name='request[finish][time]' id="finishTime">
                                <!-- BEGIN request_finish_time -->
                                <option value='{REQUEST_FINISH_TIME_VALUE}' {REQUEST_FINISH_TIME_SELECTED}>{REQUEST_FINISH_TIME_LABEL}</option>
                                <!-- END request_finish_time -->
                            </select>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Host</legend>
                    <div class="small-4 large-6 columns">
                        <label for="requesthostType">
                            Type
                            <select name="request[hostType]" id="requesthostType" data-relation="host_type_selector">
                                <!-- BEGIN host_type -->
                                <option value="{HOST_TYPE_VALUE}" {HOST_TYPE_SELECTED}>{HOST_TYPE_LABEL}</option>
                                <!-- END host_type -->
                            </select>
                        </label>
                    </div>
                    <div class="small-4 large-3 columns" data-relation="host_type_field">
                        <label for="requesthostName">
                            Name
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="The host will need to confirm your leave arrangements; you can forward them the email you receive.">?</span>
                            <input type="text" name="request[hostName]" value="{REQUEST_HOST_NAME}" id="requesthostName" required />
                        </label>

                    </div>
                    <div class="small-4 large-3 columns" data-relation="host_type_field">
                        <label for="requesthostPhone">
                            Phone
                            <input type="text" name="request[hostPhone]"value="{REQUEST_HOST_PHONE}" id="requesthostPhone" required />
                        </label>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Other Information</legend>
                    <div class="small-12 large-6 columns">
                        <label for="requestTravelType">
                            Travel Method
                            <select name="request[travelType]" id="requestTravelType">
                                <!-- BEGIN travel_drop -->
                                <option value="{TRAVEL_DROP_VALUE}" label="{TRAVEL_DROP_NAME}"  {TRAVEL_DROP_VALUE_SELECTED}>{TRAVEL_DROP_NAME}</option>
                                <!-- END travel_drop -->
                            </select>
                        </label>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="requestTravelType">
                            Description
                            <span data-tooltip class="hint has-tip tip-top" title="Only complete for special leave information or travel arrangements">?</span>
                            <textarea id='description' name="request[description]" maxlength="100" data-warninglength="67">{REQUEST_DESCRIPTION}</textarea>
                        </label>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="requestNotes">
                            Notes
                            <textarea id="requestNotes" name="request[notes]">{REQUEST_NOTES}</textarea>
                        </label>
                    </div>
                </fieldset>

                <!-- BEGIN has_confirmed_by -->
                <fieldset class="content">
                    <legend>Confirmed by</legend>

                    <div class="small-12 columns">
                        <!-- BEGIN confirmed_by -->
                        <input type='radio' id="requestConfirmedBy{CONFIRMED_BY_VALUE}" name='request[confirmedBy]' value='{CONFIRMED_BY_VALUE}' {CONFIRMED_BY_SELECTED} />
                        <label for="requestConfirmedBy{CONFIRMED_BY_VALUE}" class="radio-label">{CONFIRMED_BY_LABEL}</label>
                        <!-- END confirmed_by -->
                    </div>
                </fieldset>
                <!-- END has_confirmed_by -->
            </section>
            <ul class="button-group">
                <li><button type="submit" name="modify" value="Modify">Modify</button></li>
                <li><button type="submit" name="delete" value="Delete" data-action="delete">Delete</button></li>
                <li><button type="submit" name="reject" value="Reject">Reject</button></li>
                <li><button type="submit" name="approve" value="Approve">Approve</button></li>
            </ul>
        </form>
    </div>
</div>

<script type="text/javascript" src="/javascript/jquery.warninglength.js"></script>
<script type="text/javascript" src="/javascript/jquery.confirmDialog.js"></script>
<script type="text/javascript">
    $(function () {
        $('input[data-datepicker]').datepicker({
            constrainInput: false,
            minDate: new Date(),
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        $('form[data-validate]').validate();

        // Hide host details if "self" is selected
        $('[data-relation="host_type_selector"]').change(function(){
            var details = $('[data-relation="host_type_field"]');
            if(($(this).val() == '4')){
                details.slideUp();
            } else {
                details.slideDown();
            }
        });

        $('[data-warninglength]').warninglength({
            messagePrototype: $('<label class="warning" />')
        });

        // Confirmation of delete button
        $('[data-action="delete"]').click(function(event) {
            event.preventDefault();
            var element = $(this);
            $(this).confirmDialog({
                confirmEvent: function() {
                    // Build a hidden input with the delete button's name/val,
                    // then submit
                    var form = element.closest('form');
                    form.append(
                            $('<input type="hidden" />')
                                .attr('name', element.attr('name'))
                                .val(element.val())
                    ).submit()
                }
            });
        })
    });
</script>
