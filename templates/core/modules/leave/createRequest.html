<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/selectize.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/jquery.selectize-selector.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/form/jquery.warning-length.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
	$(function() {

		$('form[data-validate]').alaressValidate({
            rules: {
                userId: {
                    required: true
                }
            }
        });

        // Hide host details if "self" is selected
		$('[data-relation="host_type_selector"]').change(function(){
            var details = $('[data-relation="host_type_field"]');
			if(($(this).val() == '4')){
                details.slideUp()
                    .find('input').prop('required', false);
			} else {
                details.slideDown()
                    .find('input').prop('required', true);
			}
		}).change();

		//<!-- BEGIN student_autocomplete_javascript -->
        //<!-- END student_autocomplete_javascript -->

		$('[data-selectizeuser]')
            .selectizeSelector({
                ajax: {
                    url:      '/ajax/user.php',
                    type:     'GET',
					data:     {
                        groupID: "{STUDENT_GROUP_IDS}",
                        residentialHouseID: "{RESIDENTIAL_HOUSE_IDS}",
                        showCampus: true
                    },
                    dataType: 'json'
                }
            })
        ;

        $('[data-warninglength]').warninglength({
            messagePrototype: $('<label class="warning" />')
        });
	});
</script>
<!-- END custom_head -->

<div class="row">
    <div class="small-12 columns">
        <h1>Create Leave Request</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form action="/modules/leave/processCreate" method="post" class="top" data-validate>
            <section>
                <fieldset class="content">
                    <legend>Student</legend>
                    <div class="small-12 large-6 columns">
                        <!-- BEGIN student_autocomplete -->
                        <label for="userId" class="required">Name</label>
                        <input id='userId' name="userId" type='text' value='' placeholder="Search Students" data-selectizeuser required />
                        <!-- END student_autocomplete -->

                        <!-- BEGIN student_selector -->
                        <label for="userIdSelect" class="required">Name</label>
                        <select id="userIdSelect" name="userId">
                            <option disabled>select a child</option>
                            <!-- BEGIN student_drop -->
                            <option value="{STUDENT_DROP_VALUE}" label="{STUDENT_DROP_NAME}" {STUDENT_DROP_VALUE_SELECTED}>{STUDENT_DROP_NAME}</option>
                            <!-- END student_drop -->
                        </select>
                        <!-- END student_selector -->

                        <!-- BEGIN student_name -->
                        <label>
                            Name<br />
                            <p>{STUDENT_NAME}</p>
                        </label>
                        <!-- END student_name -->
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="requestuserPhone" class="required">Phone</label>
                        <input type="text" name="request[userPhone]" id="requestuserPhone" required />
                    </div>
                </fieldset>
                <fieldset class="content">
                    <legend>Date</legend>
                    <div class="small-6 columns">
                        <label for="startDate" class="required">Leaving</label>
                        <input name="request[start][date]" id="startDate" type="text" required data-datepicker data-datepicker-time data-datesync-enddate="#finishDate" size="15" maxlength="30" />
                    </div>
                    <div class="small-6 columns">
                        <label for="finishDate" class="required">Returning</label>
                        <input name="request[finish][date]" id="finishDate" type="text" required data-datepicker data-datepicker-time data-datesync-startdate="#startDate" size="15" maxlength="30" />
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Host</legend>

                    <div class="small-12 large-6 columns">
                        <label for="requesthostType">
                            Type
                            <select name="request[hostType]" id="requesthostType" data-relation="host_type_selector">
                                <!-- BEGIN host_type -->
                                <option value="{HOST_TYPE_VALUE}" {HOST_TYPE_VALUE_SELECTED}>{HOST_TYPE_LABEL}</option>
                                <!-- END host_type -->
                            </select>
                        </label>
                    </div>
                    <div class="small-12 large-3 columns" data-relation="host_type_field">
                        <label for="requesthostName" class="required">
                            Name
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="The host will need to confirm your leave arrangements; you can forward them the email you receive.">?</span>
                        </label>
                        <input type="text" name="request[hostName]" id="requesthostName" required />
                    </div>
                    <div class="small-12 large-3 columns" data-relation="host_type_field">
                        <label for="requesthostPhone" class="required">Phone</label>
                        <input type="text" name="request[hostPhone]" id="requesthostPhone" required />
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Other Information</legend>
                    <div class="small-12 large-6 columns">
                        <label for="requestTravelType">
                            Travel Method
                            <select name="request[travelType]" id="requestTravelType">
                                <!-- BEGIN travel_drop -->
                                <option value="{TRAVEL_DROP_VALUE}" label="{TRAVEL_DROP_NAME}" {TRAVEL_DROP_VALUE_SELECTED}>{TRAVEL_DROP_NAME}</option>
                                <!-- END travel_drop -->
                            </select>
                        </label>
                    </div>
                    <div class="small-12 large-6 columns">
                        <label for="description">
                            Description
                            <span data-tooltip class="hint has-tip tip-top" data-width="200" title="Only complete for special leave information or travel arrangements">?</span>
                        </label>
                        <textarea id='description' name="request[description]" maxlength="100" data-warninglength="67"></textarea>
                    </div>
                </fieldset>

                <fieldset class="content">
                    <legend>Terms and Conditions</legend>

                    <div class="small-12 columns">
                        <article>{TERMS_AND_CONDITIONS}</article>

                        <input type="checkbox" id="requestTerms" name="request[terms]" required />
                        <label for="requestTerms" class="checkbox-label">
                            I Accept Terms &amp; Conditions and that this application is true and correct
                        </label>
                    </div>
                </fieldset>
            </section>

            <div class="row">
                <div class="small-12 columns">
                    <input type="submit" value="Submit Leave Application" />
                </div>
            </div>
        </form>
    </div>
</div>
