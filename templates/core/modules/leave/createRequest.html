<h1>Create Leave Request</h1>

<form method="post" action="/modules/leave/processCreate" data-validate>

    <fieldset>
        <legend>Student</legend>
        <div class="large-8 columns">
        <!-- BEGIN student_autocomplete -->
        <label for="userId">Name</label>
        <input id='userId' name="userId" type='text' value='' placeholder="Search Students" data-selectizeuser required />
        <!-- END student_autocomplete -->
        <!-- BEGIN student_selector -->
        <label for="userIdSelect">Name</label>
        <select id="userIdSelect" name="userId" class="formfield">
            <option disabled>select a child</option>
            <!-- BEGIN student_drop -->
            <option value="{STUDENT_DROP_VALUE}" label="{STUDENT_DROP_NAME}" {STUDENT_DROP_VALUE_SELECTED}>{STUDENT_DROP_NAME}</option>
            <!-- END student_drop -->
        </select>
        <!-- END student_selector -->
        </div>
        <div class="large-4 columns">
            <label for="requestuserPhone">Phone</label>
            <input type="text" name="request[userPhone]" id="requestuserPhone" required />
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Leave Date</legend>
        <div class="large-8 columns">
            <input name="request[start][date]" id="startDate" type="text" required data-datepicker />
        </div>
        <div class="large-4 columns">
            <select name='request[start][time]'>
                <!-- BEGIN request_start_time -->
                <option value='{REQUEST_START_TIME_VALUE}' {REQUEST_START_TIME_SELECTED}>{REQUEST_START_TIME_LABEL}</option>
                <!-- END request_start_time -->
            </select>
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Return Date</legend>
        <div class="large-8 columns">
            <input name="request[finish][date]" id="finishDate" type="text" required data-datepicker />
        </div>
        <div class="large-4 columns">
            <select name='request[finish][time]'>
                <!-- BEGIN request_finish_time -->
                <option value='{REQUEST_FINISH_TIME_VALUE}' {REQUEST_FINISH_TIME_SELECTED}>{REQUEST_FINISH_TIME_LABEL}</option>
                <!-- END request_finish_time -->
            </select>
        </div>
    </fieldset>

    <fieldset>
        <legend>Host</legend>
        <select name="request[hostType]" id="requesthostType" data-relation="host_type_selector">
            <!-- BEGIN host_type -->
            <option value="{HOST_TYPE_VALUE}" {HOST_TYPE_VALUE_SELECTED}>{HOST_TYPE_LABEL}</option>
            <!-- END host_type -->
        </select>
        <div class="large-6 columns" data-relation="host_type_field">
        <label for="requesthostName">Name</label>
            <input type="text" name="request[hostName]" id="requesthostName" required />
        </div>
        <div class="large-6 columns" data-relation="host_type_field">
            <label for="requesthostPhone">Phone</label>
            <input type="text" name="request[hostPhone]" id="requesthostPhone" required />
        </div>
    </fieldset>

    <fieldset>
        <legend>Travel Method</legend>
        <select name="request[travelType]">
            <!-- BEGIN travel_drop -->
            <option value="{TRAVEL_DROP_VALUE}" label="{TRAVEL_DROP_NAME}"  {TRAVEL_DROP_VALUE_SELECTED}>{TRAVEL_DROP_NAME}</option>
            <!-- END travel_drop -->
        </select>
    </fieldset>

    <fieldset>
        <legend>Description</legend>
        <em>Only complete for special leave information or travel arrangements</em>
        <textarea id='description' name="request[description]" maxlength="100"></textarea>
    </fieldset>

    <fieldset>
        <legend>Terms and Conditions</legend>

        <div class="wysiwyg">{TERMS_AND_CONDITIONS}</div>

        <input type="checkbox" id="requestTerms" name="request[terms]" required />
        <label for="requestTerms" class="checkbox-label">
            I Accept Terms &amp; Conditions and that this application is true and correct
        </label>
    </fieldset>

	<input type="submit" name="Submit" value="Submit Leave Application" class="button icon-add">
</form>
