<h1>Create Event</h1>
<form>
	<label for="title">Title</label>
	<input id="title" name="title" type="text" />

    <label for="date">Date</label>
    <input id="date" name="date" class="hasDatepicker" type="text" />
	<img class="ui-datepicker-trigger" src="/images/core/calendar/calendar-click.png" alt="..." title="...">

	<label for="days">Days</label>
	<select id="days" name="days">
		<option>1</option>
		<option>2</option>
		<option>3</option>
		<option>4</option>
		<option>5</option>
	</select>

    <label for="start_time_h">Time</label>
    <select id="start_time_h" name="start_time_h">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
    </select>
    :
    <select id="start_time_m" name="start_time_m">
        <option>00</option>
        <option>05</option>
        <option>10</option>
        <option>15</option>
        <option>20</option>
        <option>25</option>
        <option>30</option>
        <option>35</option>
        <option>40</option>
        <option>55</option>
    </select>

    <select id="start_time_t" name="start_time_t">
        <option>AM</option>
        <option>PM</option>
    </select>

    <select id="end_time_h" name="end_time_h">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
    </select>
    :
    <select id="end_time_m" name="end_time_m">
        <option>00</option>
        <option>05</option>
        <option>10</option>
        <option>15</option>
        <option>20</option>
        <option>25</option>
        <option>30</option>
        <option>35</option>
        <option>40</option>
        <option>55</option>
    </select>

    <select id="end_time_t" name="end_time_t">
        <option>AM</option>
        <option>PM</option>
    </select>

    <label for="location">Location</label>
	<input id="location" name="location" type="text" />

	<label for="details">Details</label>
	<textarea id="details" name="details" rows="3" cols="20"></textarea>

	<input id="submit" name="submit" value="Submit" type="submit" />


</form>
