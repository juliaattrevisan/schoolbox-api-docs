<h1>Boarder Leave Request</h1>
<form>
    <label for="leave_date">Leave Date</label>
    <input id="leave_date" name="leave_date" class="hasDatepicker" type="text" />
	<img class="ui-datepicker-trigger" src="/images/core/calendar/calendar-click.png" alt="..." title="...">

    <label for="leave_time_h">Leave Time</label>
    <select id="leave_time_h" name="leave_time_h">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
    </select>
    :
    <select id="leave_time_m" name="leave_time_m">
        <option>00</option>
        <option>05</option>
        <option>10</option>
        <option>15</option>
        <option>20</option>
        <option>25</option>
        <option>30</option>
        <option>35</option>
        <option>40</option>
        <option>55</option>
    </select>

    <select id="leave_time_t" name="leave_time_t">
        <option>AM</option>
        <option>PM</option>
    </select>

    <label for="return_date">Return Date</label>
    <input id="return_date" name="return_date" class="hasDatepicker" type="text" />
	<img class="ui-datepicker-trigger" src="/images/core/calendar/calendar-click.png" alt="..." title="...">


	<label for="return_time_h">Return Time</label>
    <select id="return_time_h" name="return_time_h">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
    </select>
    :
    <select id="return_time_m" name="return_time_m">
        <option>00</option>
        <option>05</option>
        <option>10</option>
        <option>15</option>
        <option>20</option>
        <option>25</option>
        <option>30</option>
        <option>35</option>
        <option>40</option>
        <option>55</option>
    </select>

    <select id="return_time_t" name="return_time_t">
        <option>AM</option>
        <option>PM</option>
    </select>

	<hr />

	<label for="host_type">Host</label>
	<select id="host_type" name="host_type">
		<option>Parents</option>
		<option>Mother</option>
		<option>Father</option>
		<option>Guardian</option>
		<option>Other</option>
	</select>

	<label for="student_phone">Student Ph</label>
	<input id="student_phone" name="student_phone" type="text" />

	<label for="host_name">Host Name</label>
	<input id="host_name" name="host_name" type="text" />

	<label for="host_phone">Host Ph</label>
	<input id="host_phone" name="host_phone" type="text" />

	<hr />

	<label for="description">Description</label>
	<textarea id="description" name="description" rows="3" cols="20"></textarea>

	<label for="tandc">Terms and Conditions</label>
		<label for="tandc">
			<input id="tandc" name="tandc" type="checkbox" />
			I agree to the terms and conditions of this leave request.<br />
			I indicate this application is true and correct.
		</label>

	<input id="apply" name="apply" value="Apply" type="submit" />


</form>
