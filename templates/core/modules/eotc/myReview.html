<ul class="breadcrumb">
    <li><a class="active" title="EOTC">EOTC</a></li>
</ul>

<div class="actions-small-1 row">
    <div class="list-item">
        <div class="small-12 columns">
            <h1>My EOTC Events</h1>
        </div>
    </div>
    <nav>
        <a href="/modules/eotc/manage/modify" class="icon-add" title="Create EOTC Event"></a>
    </nav>
</div>

<div class="row">
    <div class="small-12 columns">
        <div class="scrollable">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Teacher In Charge</th>
                        <th>Created</th>
                        <th>Students</th>
                        <th>RAMS Required</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN event -->
                    <tr>
                        <td>{EVENT_START_DATETIME}</td>
                        <td>{EVENT_TITLE}</td>
                        <td><a href="/search/user/{EVENT_TEACHER_IN_CHARGE_ID}">{EVENT_TEACHER_IN_CHARGE_FULLNAME}</a></td>
                        <td>{EVENT_CREATED_AT}</td>
                        <td>{EVENT_STUDENTS}</td>
                        <td>{EVENT_RAMS_REQUIRED}</td>
                        <td>{EVENT_STATUS_NAME}</td>
                        <td class="actions-small-1">
                            <nav>
                                <a href="/modules/eotc/manage/modify?eventID={EVENT_ID}" class="icon-modify" title="Edit"></a>
                            </nav>
                        </td>
                    </tr>
                    <!-- END event -->
                </tbody>
            </table>
        </div>
    </div>
</div>
