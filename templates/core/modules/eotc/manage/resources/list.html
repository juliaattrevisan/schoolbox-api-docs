<ul class="breadcrumb">
    <li><a href="/modules/eotc/myReview" title="{TPL_LOCAL_EOTC_PLURAL_PC}">{TPL_LOCAL_EOTC_PLURAL_PC}</a></li>
    <li><a href="/modules/eotc/manage/modify?eventID={EVENT_ID}" title="Modify {EVENT_NAME}">Modify {EVENT_NAME}</a></li>
    <li class="active"><a href="#">Resource List</a></li>
</ul>

<div class="row">
    <div class="small-12 columns">
        <h1>Allocate Resources to {EVENT_NAME}</h1>
    </div>
</div>

<div class="row">
    <div class="small-12 island">
        <form data-bookitemform action='/resource-booking/booking/bookItem/' method="get">
            <section>
                <fieldset class="content">
                    <div class="small-12 columns">
                        <label>Search for a resource</label>
                        <select data-resourcebookingsuggest name="resourcebooking[]" multiple placeholder="Start typing the name of a resource"></select>
                    </div>
                </fieldset>
            </section>

            <ul class="flex-list buttons">
                <li><a href="/modules/eotc/manage/modify?eventID={EVENT_ID}" class="button icon-previous">Back</a></li>
                <li><input type="submit" value="Submit" /></li>
            </ul>
        </form>
    </div>
</div>

<div class="row">
    <div class="small-12 columns">
        <h2 class="subheader">Current Resource Bookings</h2>

        <div class="scrollable">
            <table>
                <colgroup>
                    <col />
                    <col />
                    <col />
                    <col />
                    <col />
                </colgroup>
                <thead>
                <tr>
                    <th>Resource Name</th>
                    <th>Booking Name</th>
                    <th>Start</th>
                    <th>End</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <!-- BEGIN resourcebooking -->
                <tr>
                    <td><a href="/resource-booking/item/{RESOURCE_ID}">{RESOURCE_NAME}</a></td>
                    <td><a href="/resource-booking/booking/{RESOURCEBOOKING_ID}/edit">{RESOURCEBOOKING_NAME}</a></td>
                    <td>{RESOURCEBOOKING_START}</td>
                    <td>{RESOURCEBOOKING_END}</td>
                    <td class="actions-small-2">
                        <nav>
                            <a aria-haspopup="true" href="/resource-booking/booking/{RESOURCEBOOKING_ID}/edit?returnUrl={RETURN_URL}" class="icon-modify" alt="Remove Booking" title="Update Booking"></a>
                            <a aria-haspopup="true" href="/modules/eotc/manage/resources/bookingForm/delete/{RESOURCEBOOKING_ID}" class="icon-delete" alt="Remove Booking" title="Remove Booking" data-action="delete"></a>
                        </nav>
                    </td>
                </tr>
                <!-- END resourcebooking -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/selectize.min.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/vendors/selectize/jquery.selectize-selector.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function() {
        $('[data-resourcebookingsuggest]').selectizeSelector({
            ajax: {
                url: '/resource-booking/item/search',
                type: 'GET',
                dataType: 'json'
            },
            multiple: false
        });

        $('[data-bookitemform]').find('input[type=submit]').click(function(event) {
            event.preventDefault();

            var id = $('[data-resourcebookingsuggest]').val().pop();
            var url = $('[data-bookitemform]').attr('action') + id + '?startDate={EVENT_START_DATE}&startTime={EVENT_START_TIME}&endDate={EVENT_END_DATE}&endTime={EVENT_END_TIME}&name={EVENT_NAME_ENCODED}&returnUrl={RETURN_URL_CALLBACK}';

            window.location.href = url;

            return false;
        });

        $('a[data-action="delete"]').click(function(event) {
            event.preventDefault();
            $(this).confirmDialog({
                text: 'Are you sure you wish to delete this booking?'
            });
        })
    });
</script>
