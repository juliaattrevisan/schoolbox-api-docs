<script type="text/javascript" src="/modules/eotc/js/jquery.selectAll.js"></script>
<script type="text/javascript">
	$(function() {
		$('.table').selectAll({
			key: 'selectall',
			checkboxName: 'selected[]'
		});
	});
</script>
<link href="/modules/eotc/js/magicsuggest/magicsuggest-1.3.1.css" rel="stylesheet" />
<script type="text/javascript" src="/modules/eotc/js/magicsuggest/magicsuggest-1.3.1.js"></script>
<script type="text/javascript" src="/javascript/jquery.userSelector.js"></script>
<script type="text/javascript">
	$(function() {
		$('#student-suggest').userSelector({
			plugin: {
				data:'/ajax/user.php?groupID=3;5',
				allowFreeEntries: false,
				name: 'selected'
			},
			onePerLine: false,
			multiple: true
		});
	});
</script>

<h1>People attending {EVENT_NAME}</h1>

<form action="/modules/eotc/attendance/add" method="post">
	<input type="hidden" name="eventId" value="{EVENT_ID}" />
	<div id="student-suggest"></div>
	<input type="submit" class='submit-btn-plain' value="Add" />
</form>

<div class="clearfix"></div>

<form action="/modules/eotc/attendance/remove" method="post">
	<input type="hidden" name="eventId" value="{EVENT_ID}" />
	<table class="table">
		<thead>
			<tr>
				<th>ID</th>
				<th>Lastname</th>
				<th>Firstname</th>
				<th>Group</th>
				<th><input data-selectall="true" type="checkbox" />
			</tr>
		</thead>
		<tbody>
			<!-- BEGIN student_attendee -->
			<tr>
				<td>{STUDENT_ATTENDEE_ID}</td>
				<td>{STUDENT_ATTENDEE_LASTNAME}</td>
				<td>{STUDENT_ATTENDEE_FIRSTNAME}</td>
				<td>{STUDENT_ATTENDEE_ROLE_NAME}</td>
				<td><input name="selected[]" type="checkbox" value="{STUDENT_ATTENDEE_ID}" /></td>
			</tr>
			<!-- END student_attendee -->
		</tbody>
	</table>

	<input type="submit" class='submit-btn-plain' value="Remove Selected" />
</form>
