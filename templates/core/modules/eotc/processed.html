<ul class="breadcrumb">
	<li><a href='/modules/eotc/review' title="EOTC">EOTC</a></li>
	<li><a class="active" title="Processed Events">Processed Events</a></li>
</ul>

<div class="actions-small-1 row">
	<div class="list-item">
		<div class="small-12 columns">
			<h1>Processed EOTC Events</h1>
		</div>
	</div>
	<nav>
		<a href='/modules/eotc/review' class="icon-list" title="View all Reviewable EOTC Events"></a>
	</nav>
</div>

<!-- BEGIN event_list_group -->
<div class="row">
    <div class="small-12 columns">
		<h2 class="subheader">{EVENT_LIST_GROUP_NAME}</h2>

		<div class="scrollable">
			<table>
				<thead>
					<tr>
						<th>Date</th>
						<th>Title</th>
						<th>Teacher In Charge</th>
						<th>Created</th>
						<th>Students</th>
						<th>RAMS Required</th>
						<th>Status</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<!-- BEGIN event -->
					<tr>
						<td>{EVENT_START_DATETIME}</td>
						<td>{EVENT_TITLE}</td>
						<td><a href="/search/user/{EVENT_TEACHER_IN_CHARGE_ID}">{EVENT_TEACHER_IN_CHARGE_FULLNAME}</a></td>
						<td>{EVENT_CREATED_AT}</td>
						<td>{EVENT_STUDENTS}</td>
						<td>{EVENT_RAMS_REQUIRED}</td>
						<td>{EVENT_STATUS_NAME}</td>
						<td class="actions-small-1">
							<nav>
								<a href="/modules/eotc/status/modify/{EVENT_ID}" class="icon-view" title="View"></a>
							</nav>
						</td>
					</tr>
					<!-- END event -->
				</tbody>
			</table>
		</div>
	</div>
</div>
<!-- END event_list_group -->
