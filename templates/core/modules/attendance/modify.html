<!-- BEGIN custom_head -->
<script type='text/javascript' src='/javascript/components/jquery-timepicker-jt/jquery.timepicker.js'></script>
<script type='text/javascript'>
	$j(function() {
		/* Make the input form available for absentees when
		 * making individual modifications
		 */
        $j('.attendanceOptions').each(function(index, element) {

            var id = $j(element).val();

            /* Show form if prechecked on load */
            if ($j(element).is(':checked')) {
                $j('#attendanceOptionsForm_' + id).show();
            }

            /* Show form if checked by user */
            $j(element).click(function(event) {
                if ($j(element).is(':checked')) {
                    $j('#attendanceOptionsForm_' + id).show();
                }
                else {
                    /* Hide options form and remove link
                     */
                    $j('#attendanceOptionsForm_' + id).hide();
                    $j('#viewAttendanceOptions_' + id).remove();
                }
            });
		});

        $j('.timepicker').timepicker({
            'timeFormat':'g:ia',
            'scrollDefaultNow': true,
            'step':5,
            'minTime': '5:00am',
            'maxTime': '7:00pm'

        });
	});

</script>
<style type='text/css'>
	label {
		float: left;
	}
</style>
<!-- END custom_head -->

<h1>Student Attendances for {CLASS_CODE}</h1>
<h2>{ATTENDANCE_DATE_FORMATTED}</h2>
