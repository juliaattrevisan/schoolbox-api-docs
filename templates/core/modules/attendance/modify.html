<script type='text/javascript'>
	$j(function() {

		/* Update of absentees
		 */
		$j('.attendanceOptions').each(function(index, element) {
			$j(element).click(function() {
				var id = $j(element).val();

				if ($j(element).is(':checked')) {
					$j('#attendanceOptionsForm_' + id).show();
				}
				else {
					/* TODO: Clear Existing Data
					 * See modifyForm.php for related commentary
					 */
					var data = {
						present: true,
						externalId: id,
						classCode: '{JS_CLASS_CODE}',
						attendanceDate: '{JS_ATTENDANCE_DATE}',
						attendancePeriod: '{JS_ATTENDANCE_PERIOD}'
					};

					$j.post('/modules/attendance/modifyForm', data, function(responseText) {
					});

					/* Hide options form and remove link
					 */
					$j('#attendanceOptionsForm_' + id).hide();
					$j('#viewAttendanceOptions_' + id).remove();
				};
			});
		});

		/* Make the input form available for absentees when
		 * making individual modifications
		 */
		$j('.viewAttendanceOptions').click(function(event) {
			event.preventDefault();

			var id = $j(this).attr('id').replace(/viewAttendanceOptions_/, '');

			if ($j('#attendanceOptions_' + id).is(':checked')) {
				$j('#attendanceOptionsForm_' + id).toggle();
			}

			return false;
		});

		/* Save All (for the first time)
		 *
		 * I don't trust JSON Stringify or jquery serialize(), so I
		 * do it the Long Way
		 */
		$j('#saveAll').click(function() {
			var allPeople = new Array();

			/* Collect the contents of each form
			 */
			$j('.collectible').each(function(index, element) {
				var currentPersonId = $j(element).find('input[name=updateOne]').val();
				var AttendedFlag = 1;

				/* Find out if they are marked as absent
				 */
				if ($j('#attendanceOptions_' + currentPersonId).is(':checked')) {
					var AttendedFlag = 0;
				}

				/* Always save each guy's absentee info the first time
				 *
				 * This will allow you to fill in absentee info as you're doing it,
				 * or modify existing info retroactively
				 */
				var currentPerson = {
					externalId: currentPersonId,
					classCode: $j(element).find('input[name=classCode]').val(),
					attendanceDate: $j(element).find('input[name=attendanceDate]').val(),
					attendancePeriod: $j(element).find('input[name=attendancePeriod]').val(),
					PossibleAbsenceCode: $j(element).find('select[name=PossibleAbsenceCode]').val(),
					PossibleReasonCode: $j(element).find('select[name=PossibleReasonCode]').val(),
					PossibleReasonDescription: $j(element).find('input[name=PossibleReasonDescription]').val(),
					AttendedFlag: AttendedFlag
				}

				allPeople.push(currentPerson);
			});

			/* Compile!
			 */
			var data = {
				updateAll: 'true',
				classCode: '{JS_CLASS_CODE}',
				attendanceDate: '{JS_ATTENDANCE_DATE}',
				attendancePeriod: '{JS_ATTENDANCE_PERIOD}',
				data: allPeople
			}

			/* Send in the clones!
			 */
			$j.post('/modules/attendance/modifyForm', data, function(responseText) {
				window.location.href = window.location.href;
			});
		});
	});
</script>
<style type='text/css'>

		float: left;
	}

	.genericWidth {
		width: 200px;
	}
</style>
