<!-- BEGIN custom_head -->
<script type="text/javascript" src="{CDN_PREFIX}/js/print/jquery.artificial-print.js?v={SITE_VERSION}"></script>
<script type="text/javascript" src="{CDN_PREFIX}/js/bundle/dataTables.js?v={SITE_VERSION}"></script>
<script type="text/javascript">
    $(function(){
        $('[data-action="print"]').artificialPrint();

        $('[data-tablesorter]').DataTable({
            info: false,
            paging: false,
            order: [[2,'asc']],
            searching: false
        });
    });
</script>
<!-- END custom_head -->

<div class="row actions-small-1">
    <div class="list-item">
        <div class="small-12 columns">
            <h1>Staff Directory</h1>
        </div>
    </div>
    <nav>
        <a data-action='print' class="icon-print" title="Print" href="#"></a>
    </nav>
</div>

<div class="row">
    <div class="small-12 island">
        <!-- BEGIN department -->
        <h2>{STAFF_DEPARTMENT}</h2>

        <section>

            <ul class="information-list">
                <!-- BEGIN staff -->

                <li>
                    <div class="list-item">
                        <div class="card small-7 medium-7 columns">
                            <img src="/portrait.php?userId={STAFF_STAFFID}&size=square64">
                            <!-- BEGIN link -->
                                <a href="/search/user/{STAFF_EXTERNALID}">{STAFF_SURNAME}, {STAFF_FIRSTNAME}</a>
                            <!-- END link -->
                            <!-- BEGIN nolink -->
                                {STAFF_SURNAME}, {STAFF_FIRSTNAME}
                            <!-- END nolink -->
                            <p class="meta">{STAFF_ROLE}</p>
                        </div>
                        <div class="card medium-2 show-for-medium-up columns">{STAFF_CAMPUS}&nbsp;</div>
                        <div class="card small-5 medium-3 columns text-right">
                            <div><a href="mailto:{STAFF_EMAIL}">{STAFF_EMAIL}</a></div>
                            <div><a href="tel:{STAFF_PHONE}">{STAFF_PHONE}</a> <span class="meta">{STAFF_EXTENSION}</span></div>
                        </div>
                    </div>
                </li>
                <!-- END staff -->
            </ul>
        </section>
        <!-- END department -->
    </div>
</div>
