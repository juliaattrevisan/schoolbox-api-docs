<div class="row actions-small-1">
    <div class="list-item">
        <div class="small-12 columns">
            <h1>Staff Directory</h1>
        </div>
    </div>
    <nav>
        <a data-action='print' class="icon-print" title="Print" href="#"></a>
    </nav>
</div>

<div class="row">
    <div class="small-12 columns">
        <div class="scrollable">
            <table data-sortable>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>First name</th>
                        <th>Surname</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Campus</th>
                        <th>Phone</th>
                        <th>Ext</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BEGIN staff -->
                    <tr>
                        <td><img src="/portrait.php?userId={STAFF_STAFFID}&size=square32"></td>
                        <td>{STAFF_TITLE}</td>
                        <td>{STAFF_FIRSTNAME}</td>
                        <td>{STAFF_SURNAME}</td>
                        <td>{STAFF_DEPARTMENT}</td>
                        <td>{STAFF_ROLE}</td>
                        <td>{STAFF_CAMPUS}</td>
                        <td><a href="tel:{STAFF_PHONE}">{STAFF_PHONE}</a></td>
                        <td>{STAFF_EXTENSION}</td>
                        <td><a href="mailto:{STAFF_EMAIL}">{STAFF_EMAIL}</a></td>
                    </tr>
                    <!-- END staff -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript" src="/javascript/components/jquery.tablesorter/js/jquery.tablesorter.js"></script>
<script type="text/javascript" src="/javascript/components/jquery.tablesorter/js/jquery.tablesorter.widgets.js"></script>
<script type="text/javascript" src="/javascript/shared/jquery.artificial-print.js"></script>
<script type="text/javascript">
    $(function() {
        $('[data-action="print"]').artificialPrint();

        $('[data-sortable]').tablesorter({
            headers:{
                0:{sorter:false},
                1:{sorter:false},
                7:{sorter:false},
                8:{sorter:false}
            },
            widgets:['zebra'],
            widgetZebra:{
                css:["", "dark"]
            },
            cssHeader:"directory-sorter"
        });
    });
</script>
