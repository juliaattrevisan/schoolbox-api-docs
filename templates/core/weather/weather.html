<div class="row">
    <div class="small-12 columns">
        <h1>Weather for {LOCATION}</h1>
    </div>
</div>

<!-- BEGIN weather_unavailable -->
<div class="row">
    <div class="small-12 island">
        <div class="alert-box warning">Weather service is temporarily unavailable.</div>
    </div>
</div>
<!-- END weather_unavailable -->

<!-- BEGIN forecast -->
<div class="row">
    <div class="small-12 island scrollable">
        <h2 class="subheader">Forecast</h2>
        <div class="scrollable">
            <table>
                <tr>
                    <!-- BEGIN forecast_header -->
                    <th style="width:{FC_WIDTH}%" class="text-center">{FC_DAY}</th>
                    <!-- END forecast_header -->
                </tr>
                <tr>
                    <!-- BEGIN forecast_image -->
                    <td class="{FC_CURRENT} text-center">
                        <img src="{FC_IMAGE}" alt="{FC_PRECIS}" width="50" height="50"/><br />
                        {FC_PRECIS}
                    </td>
                    <!-- END forecast_image -->
                </tr>
                <tr>
                    <!-- BEGIN forecast_data -->
                    <td>
                        <span class="label hot full-width">{FC_HIGH}&deg;</span>
                        <span class="label cold full-width">{FC_LOW}&deg;</span>
                    </td>
                    <!-- END forecast_data -->
                </tr>
            </table>
        </div>
    </div>
</div>
<!-- END forecast -->

<div class="row">
    <!-- BEGIN current -->
    <div class="small-12 medium-6 island">
        <h2 class="subheader">Currently</h2>
        <section class="content">
            <dl class="inline-dl no-margin">
                <dt class="small-12 large-6">Temperature</dt>
                <dd class="small-12 large-6">{TEMP}&deg; (feels like {TEMP_FL}&deg;)</dd>

                <dt class="small-12 large-6">Wind</dt>
                <dd class="small-12 large-6">{WIND}</dd>

                <dt class="small-12 large-6">Humidity</dt>
                <dd class="small-12 large-6">{HUMIDITY}</dd>

                <dt class="small-12 large-6">Last updated</dt>
                <dd class="small-12 large-6">{PERIOD}</dd>
            </dl>

            <div class="content">
                <p class="meta">Weather supplied by</p>
                <a href="{SUPPLIED_BY_URL}" target="_blank"><img width="180" alt="{SUPPLIED_BY_NAME}" src="{SUPPLIED_BY_LOGO}" /></a>
            </div>
        </section>
    </div>
    <!-- END current -->

    <div class="small-12 medium-6 island">
        <h2 class="subheader">Weather around Australia</h2>
        <section>
            <ul class="information-list">
                <!-- BEGIN regions -->
                <li class="row content">
                    <a href="/weather/{LOCATION_VALUE}">{LOCATION_NAME}</a>
                </li>
                <!-- END regions -->
            </ul>
        </section>
    </div>
</div>
