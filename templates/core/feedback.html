<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/css/recaptcha.css" />
<script type="text/javascript" src="/javascript/jquery.recaptcha.js"></script>
<script language="JavaScript" type="text/javascript">
$j(function () {
	$j('#recaptcha').recaptcha();

	var justSubmit = false;
	
	$j('#feedbackForm').submit(function () {

		if (justSubmit)
			return true;
		
		var message = '', form = $j(this);
		if ($j('#name').val() == '')
			message += 'Please enter your name.\n';
		
		if ($j('#email').val() == '')
			message += 'Please enter your email address.\n';
		
		if ($j('#message').val() == '')
			message += 'Please enter a message.\n';
		
		if (message != '') {
			alert(message);
			return false;
		
		} else if ($j('#recaptcha_answer').length > 0) {
			
			$j.get('/ajax/recaptcha.php', 
				{'recaptcha_answer' : $j('#recaptcha_answer').val(), 'recaptcha_challenge' : $j('#recaptcha_challenge').val()},
				function (data) {
					if (data.verified == 'true') {
						justSubmit = true;
						form.triggerHandler('submit');
					} else {
						alert('The words you have entered do not match the image, please try again.');
						$j('#recaptcha_answer').css('background-color', 'pink').focus();
					}
				
				}, 'json'
			);
			return false;
		}
	
	});
	
	$j('input').change(function () {
		justSubmit = false;
	});
		
});
</script>
<!-- END custom_head -->

<h1>{TITLE}</h1>
<form id="feedbackForm"  method="post" action="/emailForm.php" >
  <table class="standardForm">
    <tr>
      <td><h4>Your Name</h4><input type="text" name="name" id="name" size="35" value="{NAME}" /></td>
    </tr>
    <tr>
      <td><h4>Email</h4><input type="text" name="email" id="email" size="35"  value="{EMAIL}" /></td>
    </tr>
    <tr>
      <td><h4>Type of Feedback</h4><select name="subject" id="subject" style="width: 236px;">
          <option></option>
          <option value="Technical Issue">Technical Issue</option>
          <option value="Support">Support</option>
          <option value="Enquiry">Enquiry</option>
        </select></td>
    </tr>
    <tr>
      <td><h4>Feedback</h4><textarea id="message" name="message" style="width:100%;height:250px"></textarea></td>
    </tr>
    <!-- BEGIN recaptcha -->
    <tr>
      <td><h4>Human Checker</h4>
      	<em>Please type out these two words so that we know you're not a bot </em><br />
		<div id='recaptcha'><img src="{RECAPTCHA_IMAGE}" alt="" /></div>
        
        <input type="hidden" name="recaptcha_challenge" id="recaptcha_challenge" value="{RECAPTCHA_CHALLENGE}" />
        <input type="text" name="recaptcha_answer" id="recaptcha_answer" size="35" autocomplete="off" />
        <a href="#" id="recaptcha_reload" title="Get new words">Get new words</a>
	
		</td>
    </tr>
    <!-- END recaptcha -->
    <tr class="pedantic">
      <td><input type="hidden" name="template" value="feedback.html" />
        <input type="hidden" name="confirmation" value="/thank-you.php" />
		<input type="submit" class="submit-btn-plain" value="Submit Feedback"/>
        </td>
    </tr>
  </table>
  
</form>
