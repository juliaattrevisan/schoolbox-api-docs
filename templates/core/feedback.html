<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" media="screen" href="/css/recaptcha.css" />
<script type="text/javascript" src="/javascript/jquery.recaptcha.js"></script>
<script language="JavaScript" type="text/javascript">
$j(function () {
	$j('#recaptcha').recaptcha();

	var captchaValid = false;
	
	$j('#feedbackForm').submit(function () {
		var message = '', object = $j(this);
		if ($j('#name').val() == '')
			message += 'Please enter your name.\n';
		
		if ($j('#email').val() == '')
			message += 'Please enter your email address.\n';
		
		if ($j('#message').val() == '')
			message += 'Please enter a message.\n';
		
		
		if ($j('#recaptcha_answer').length > 0 && !captchaValid) {
			
			$j.get('/ajax/recaptcha.php', 
				{'recaptcha_answer' : $j('#recaptcha_answer').val(), 'recaptcha_challenge' : $j('#recaptcha_challenge').val()},
				function (data) {
					if (data.verified == 'true') {
						captchaValid = true;
						object.submit();
					} else {
						alert('The words you have entered do not match the image, please try again.');
						$j('#recaptcha_answer').css('background-color', 'pink').focus();
					}
				
				}, 'json'
			);
			return false;
		}
		
		if (message != '') {
			alert(message);
			return false;
		} else {
			console.log('submit');
			return true;
		}
	});
		
});
</script>
<!-- END custom_head -->

<h1>{TITLE}</h1>
<form id="feedbackForm" class="standardForm" method="post" action="/emailForm.php" >
  <table>
    <tr>
      <td><h3>Your Name</h3></td>
      <td><input type="text" name="name" id="name" size="35" value="{NAME}" /></td>
    </tr>
    <tr>
      <td><h3>Email</h3></td>
      <td><input type="text" name="email" id="email" size="35"  value="{EMAIL}" /></td>
    </tr>
    <tr>
      <td><h3>Type of Feedback</h3></td>
      <td><select name="subject" id="subject" style="width: 236px;">
          <option></option>
          <option value="Technical Issue">Technical Issue</option>
          <option value="Support">Support</option>
          <option value="Enquiry">Enquiry</option>
        </select></td>
    </tr>
    <tr>
      <td><h3>Feedback</h3></td>
      <td><textarea id="message" name="message" style="width:100%;height:250px"></textarea></td>
    </tr>
    <!-- BEGIN recaptcha -->
    <tr>
      <td><h3>Human Checker</h3>
      	<em>Please type out these two words so that we know you're not a bot </em></td>
      <td><div id='recaptcha'><img src="{RECAPTCHA_IMAGE}" alt="" /></div>
        <div class="float-fix"></div>
        <input type="hidden" name="recaptcha_challenge" id="recaptcha_challenge" value="{RECAPTCHA_CHALLENGE}" />
        <input type="text" name="recaptcha_answer" id="recaptcha_answer" size="35" autocomplete="off" />
        <a href="#" id="recaptcha_reload" title="Get new words">Get new words</a></td>
    </tr>
    <!-- END recaptcha -->
    <tr class="pedantic">
      <td>&nbsp;</td>
      <td><input type="hidden" name="template" value="feedback.html" />
        <input type="hidden" name="confirmation" value="/thank-you.php" />
        <input class="btn" type="submit" name="submit" value="Send Feedback" /></td>
    </tr>
  </table>
</form>
