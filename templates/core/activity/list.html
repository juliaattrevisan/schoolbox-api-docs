<li>
    <div class="list-item">
        <div class="avatar card small-12 wrap-down" data-equalizer-watch>
            <!-- BEGIN icon -->
            <div class="{ACTLIST_ICON} icon-32"></div>
            <!-- END icon -->

            <!-- BEGIN avatar -->
            <img src="{ACTLIST_AVATAR}" title="{ACTLIST_AVATAR_TITLE}" alt="{ACTLIST_AVATAR_TITLE}" />
            <!-- END avatar -->

            <article>
                {ACTLIST_CONTENT}

                <!-- BEGIN time -->
                <p class="meta"><time>{ACTLIST_TIME}</time></p>
                <!-- END time -->
            </article>

            <p class="grade">
                <span class="gradient-{ACTLIST_GRADEIANT}">{ACTLIST_GRADE}</span>
            </p>
        </div>
    </div>
</li>
