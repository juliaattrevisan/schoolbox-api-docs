<li>
    <div class="row collapse full-width">
        <!-- BEGIN icon -->
        <div class="icon columns">
            <span class="no-text icon-{ACTLIST_ICON}"></span>
        </div>
        <!-- END icon -->

        <div class="thumbnail columns">
            <!-- BEGIN avatar -->
            <img src="{ACTLIST_AVATAR}" title="{ACTLIST_AVATAR_TITLE}" alt="{ACTLIST_AVATAR_TITLE}" />
            <!-- END avatar -->
        </div>
        <div class="content columns">
            {ACTLIST_CONTENT}

            <p class="meta">
                <!-- BEGIN time -->
                <time>{ACTLIST_TIME}</time>
                <!-- END time -->

                <span class="grade">
                    <span class="gradient-{ACTLIST_GRADEIANT}">{ACTLIST_GRADE}</span>
                </span>
            </p>
        </div>
    </div>
</li>
