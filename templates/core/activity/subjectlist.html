<li class="{DARK} {SUBJ_HAS_GRADE}">
    <span class="grade">
        <span class="gradient-{SUBJ_GRADEIANT}">{SUBJ_GRADE}</span>
        <!-- BEGIN trend -->
        {SUBJ_TREND_AMT} {SUBJ_TREND_DIR}
        <!-- END trend -->
    </span>
    <a class="subject left-bar" href="{SUBJ_SUBJECT_URL}">
        <!-- BEGIN icon -->
        <span class="avatar">
            <img src="{SUBJ_SUBJECT_ICON}" title="{SUBJ_SUBJECT_NAME}" alt="{SUBJ_SUBJECT_NAME}">
        </span>
        <!-- END icon -->
        {SUBJ_SUBJECT_NAME} {SUBJ_SUBJECT_CODE}
        <span class="icon"></span>
    </a>
    <!-- BEGIN teacher -->
    <div class="profile teacher left-bar">
      <a href="/search/user/{SUBJ_TEACHER_ID}" class="teacher-profile">
        <img src="{SUBJ_TEACHER_AVATAR}" title="{SUBJ_TEACHER_AVATAR_TITLE}" alt="{SUBJ_TEACHER_AVATAR_TITLE}" />
        <span class="name">{SUBJ_TEACHER_NAME}</span>
        <span class="role">Teacher</span>
      </a>
      <a class="mail-teacher" href="{SUBJ_TEACHER_URL}">Mail</a>
    </div>
    <!-- END teacher -->
</li>
