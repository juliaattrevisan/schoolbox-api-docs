<li class="{DARK} {SUBJ_HAS_GRADE}">
    <a class="subject" href="{SUBJ_SUBJECT_URL}">
        <!-- BEGIN icon -->
        <span class="icon">
            <img src="{SUBJ_SUBJECT_ICON}" title="{SUBJ_SUBJECT_NAME}" alt="{SUBJ_SUBJECT_NAME}">
        </span>
        <!-- END icon -->
        {SUBJ_SUBJECT_NAME} {SUBJ_SUBJECT_CODE}
    </a>
    <!-- BEGIN teacher -->
    <a class="teacher" href="{SUBJ_TEACHER_URL}">
        <!-- BEGIN avatar -->
        <span class="avatar"><img src="{SUBJ_TEACHER_AVATAR}" title="{SUBJ_TEACHER_AVATAR_TITLE}" alt="{SUBJ_TEACHER_AVATAR_TITLE}" /></span>
        <!-- END avatar -->
        <span class="name">{SUBJ_TEACHER_NAME}</span>
        {SUBJ_TEACHER_ROLE}
    </a>
    <!-- END teacher -->
    <span class="grade">
        <span class="gradient-{SUBJ_GRADEIANT}">{SUBJ_GRADE}</span>
        <!-- BEGIN trend -->
        {SUBJ_TREND_AMT} {SUBJ_TREND_DIR}
        <!-- END trend -->
    </span>
</li>
