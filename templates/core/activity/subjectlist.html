<li class="subject-group">
    <div data-equalizer>
        <div class="grade current-grade-avg gradient-{SUBJ_GRADEIENT} gradient-{SUBJ_GRADEIENT}-bg" data-equalizer-watch>
            <!-- BEGIN subject_grade -->
            <a href="/submission/allWork/{WORK_USER_ID}/{WORK_YEAR}/{WORK_SEMESTER}/{SUBJ_CAT_ID}">
                <span>{SUBJ_GRADE}</span>
                <br />
                {SUBJ_TREND_AMT} {SUBJ_TREND_DIR}
            </a>
            <!-- END subject_grade -->
        </div>
        <a href="{SUBJ_SUBJECT_URL}" title="View Subject">
            <div class="ten-column" data-equalizer-watch>
                <h3>{SUBJ_SUBJECT_NAME} {SUBJ_SUBJECT_CODE}</h3>
            </div>
        </a>
        <a href="{SUBJ_SUBJECT_URL}" title="View Subject">
            <div class="one-column text-center" data-equalizer-watch>
                <span class="no-text icon-next"></span>
            </div>
        </a>
    </div>
    <ul>
        <!-- BEGIN teacher -->
        <li data-equalizer>
            <a href="/search/user/{SUBJ_TEACHER_ID}" title="View Profile">
                <div class="one-column text-center" data-equalizer-watch>
                    <img src="{SUBJ_TEACHER_AVATAR}" alt="{SUBJ_TEACHER_AVATAR_TITLE}" title="{SUBJ_TEACHER_AVATAR_TITLE}" />
                </div>
            </a>
            <a href="/search/user/{SUBJ_TEACHER_ID}" title="View Profile">
                <div class="ten-column" data-equalizer-watch>
                    {SUBJ_TEACHER_NAME}
                    <p class="meta">Teacher</p>
                </div>
            </a>
            <a href="{SUBJ_TEACHER_URL}" title="Email Teacher">
                <div class="one-column text-center" data-equalizer-watch>
                    <span class="no-text icon-email"></span>
                </div>
            </a>
        </li>
        <!-- END teacher -->
    </ul>
</li>
