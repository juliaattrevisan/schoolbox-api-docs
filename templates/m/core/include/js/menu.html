<script>

    // Nav events
    var nav  = $('#nav');
    var menu = $('#menu');
    var menuCache = {};
    var ni   = -1;
    var mi   = -1;

/*
    var fb = new QuickTap(nav[0], function(e) {
        var elem = e.srcElement;
        if($(elem).attr('href')) {
            console.log('wendy');
            foo(elem);
            console.log('morton');
        }
    });
*/

    nav.on(clickEvent, 'a', function(e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        navigate(this);
    });
    //
    // Listening on tap events? Ignore click events
    if (clickEvent !== 'click') {
        nav.on('click', 'a', function(e) {
            e.stopImmediatePropagation();
            e.preventDefault();
        });
    }

    /**
     * Explore the navigation
     *
     * @param target
     * @return {Boolean}
     */
    function navigate(target) {
        var elem = $(target);

        if(elem.attr('href') != '#') {
            renderPage(elem.attr('href'));
            return false;
        }

        // exception for webmail: quick and nasty solution for SB-1724
        if(elem.attr('title') == 'Webmail') {
            window.location = elem.parent().find('li').find('a').eq(0).attr('href');
            return false;
        }

        // If its a new page
        if(ni != elem.parent().index()) {

            // Clear classes
            nav.find('.active').removeClass('active');

            // Kill scrollMenu to free up memory
            killScroll(scrollMenu);

            // Get index of clicked nav
            ni = elem.parent().index();

            // Build menu HTML
            var menuWrapper = $('<div />').attr('id', 'menu_wrapper').css({
                height: $(window).height() - 70,
                max_height: $(window).height() - 70
            });

            // this could probably be done during startup rather than on-demand
            if(menuCache[elem.attr('title')] === undefined) {
                menuCache[elem.attr('title')] = elem.siblings('ul').filter('[role="navigation"]').clone();
            }

            // wrap it in something arbitrary so we can get its innerHTML
            var wrap = $('<div/>').append(menuWrapper.append(menuCache[elem.attr('title')]));

            menu.html('<a href="#" class="back"></a>' + wrap.html()).addClass('active');

            // align the menu to its arrow if it's poorly position
            menu.css('padding-top', '');

            var headerPadding = 56,
                eos = elem.offset(),
                mos = menu.offset(),
                upperBound = eos.top,
                lowerBound = eos.top + eos.height;

            // if the height of the menu doesn't reach lower bound, reposition the menu as high as possible
            if(mos.height < lowerBound) {
                // compensate for default padding
                var menuHeight = mos.height - headerPadding,
                    windowHeight = $(window).height();

                //  align to the bottom edge of the nav item
                var menuTop = Math.max(headerPadding, lowerBound - mos.height + headerPadding);

                menu.css('padding-top', menuTop);
            }

            // apply scrollability to the menu
            scrollMenu = new iScroll('menu_wrapper', { vScroll: true });

            // aaaand scene.
            elem.parent().addClass('active');

        } else {
            nav.find('li[role="tab"]:nth-of-type('+ (ni + 1) +')').toggleClass('active');
            menu.toggleClass('active');
        }
        return false;
    }

    // Menu events
    menu.on(clickEvent,'a',function(e){
        // rel=alternate? loads outside the mobile framework.
        if ($(this).is('[rel="alternate"]')) {
            return true;
        }
        else {
            e.preventDefault();
            e.stopImmediatePropagation();
        }

        // Get index of clicked link
        mi = $(this).parent().index()

        // Check nothing funky's going on before proceeding
        if($(e.target).is('.parent')){
            // Active sub
            $('.parent[data-icon="minus"]').data('icon','plus')
            if($(e.target).parent().is('.active')){
                $('.parent.active').removeClass('active')
            } else {
                $('.parent.active').removeClass('active')
                $(this).parent().addClass('active')
                $(this).data('icon','minus')
                scrollMenu.refresh()
            }
        } else if($(e.target).is('.back')){
            // If its a back button, de-active-ate
            $(this).parent().removeClass('active')
        } else {
            // Clear classes
            menu.find('.current').removeClass('current')
            nav.find('.current').removeClass('current')

            // Mark currents
            menu.find('li:nth-of-type('+ (mi + 1) + ')').addClass('current')
            nav.find('ul li[role="tab"]:nth-of-type('+ (ni + 1) +') ul li:nth-of-type('+ (mi + 1) + ')').addClass('current')
            nav.find('li[role="tab"]:nth-of-type('+ (ni + 1) +')').addClass('current')

            // Link to page.
            // Is this an external link? (starts with http, or / (but not /m/))
            // Render page but don't push onto stack.
            var href = $(this).attr('href')
            if ((href.indexOf('http') === 0 || href.indexOf('/') === 0) && href.indexOf('/m/') !== 0) {
                $('#menu, #menu li, #nav li').removeClass('active')
                renderPage(href, false)
            }
            else if(href != '#' && href != 'undefined'){
                $('#menu, #menu li, #nav li').removeClass('active')
                renderPage(href, true)
            }
        }
    });

    // Listening on tap events? Ignore click events
    if (clickEvent !== 'click') {
        menu.on('click', 'a:not([rel="alternate"])', function(e) {
            e.preventDefault();
            e.stopImmediatePropagation();
        });
    }

</script>
