<script>
    function loadFile(filename, filetype){
        var fileref;
        switch (filetype){
            case "js":
                fileref=document.createElement('script');
                fileref.setAttribute("type","text/javascript");
                fileref.setAttribute("src", filename);
                break;
            case "css":
                fileref=document.createElement("link");
                fileref.setAttribute("rel", "stylesheet");
                fileref.setAttribute("type", "text/css");
                fileref.setAttribute("href", filename);
                break;
            case "less":
                fileref=document.createElement("link");
                fileref.setAttribute("rel", "stylesheet");
                fileref.setAttribute("type", "text/less");
                fileref.setAttribute("href", filename);
                break;
            default:
                debug("Unsure what to do with '"+filename+"', '"+filetype+"'");
        }
        document.getElementsByTagName("head")[0].appendChild(fileref);
    }

    function getSkin() {
        if(lStorage.getItem('skin') == null || lStorage.getItem('skin') == 'undefined') {
            $.ajax({
                url: '/m/core/settings/skin.json',
                dataType: 'json',
                async: false,
                success: function(data) {
                    lStorage.setItem('skin', data.skin);
                }
            });
        }
        return lStorage.getItem('skin');
    }

    loadFile("/m/inc/js/libs/iscroll.js",'js');
    loadFile("/css/" + getSkin() + "/mchrome.css", 'css');

</script>
