<script>
    $.fx.off = true;

    // Some variables
    var env  = { // Lets create an environment object for us to test against (if(env.ios){})
        iphone: ~navigator.userAgent.indexOf('iPhone')
                || ~navigator.userAgent.indexOf('iPod'),
        ipad:   ~navigator.userAgent.indexOf('iPad'),
        ios:    ~navigator.userAgent.indexOf('iPhone')
                || ~navigator.userAgent.indexOf('iPod')
                || ~navigator.userAgent.indexOf('iPad'),
        android:~navigator.userAgent.indexOf('Android'),
        wp:     ~navigator.userAgent.indexOf('WP7')
                || ~navigator.userAgent.indexOf('Windows Phone'),
        fullscreen: (window.navigator.standalone) ? window.navigator.standalone : localStorage.getItem('pinned'),
        loggedIn: (sessionStorage.getItem('session') || "{{ core.sessionId | default('') | e('js')}}"),
        tablet: (screen.width>=768 || screen.height>=768),
        style: window.getComputedStyle(document.body,':after').getPropertyValue('content'),
        lastWidth: 0,
        init: 0,d
        lastPage: (localStorage.getItem('lastPage')) ? localStorage.getItem('lastPage') : null,
        online: function () {
            var onLine = false;
            var xhr = new XMLHttpRequest();
                xhr.open('GET', '/m/manifest.php', false); // E.T. Phone Home
                xhr.send(null);
            onLine = (xhr.status === 200);
            return onLine;
        },
        isCurrentlyLoggedIn: function() {
            return env.loggedIn;
        },
        status: function (x) {
            if(!x){
                return null;
            } else {
                var html = '';
                var msg = '';
                switch(x){
                    case 1: msg = "loading";
                        html= '<div id="spinner">' +
                                '<div class="spinner-block" id="spinner-1"></div>' +
                                '<div class="spinner-block" id="spinner-2"></div>' +
                                '<div class="spinner-block" id="spinner-3"></div>' +
                                '<div class="spinner-block" id="spinner-4"></div>' +
                                '<div class="spinner-block" id="spinner-5"></div>' +
                                '<div class="spinner-block" id="spinner-6"></div>' +
                                '<div class="spinner-block" id="spinner-7"></div>' +
                                '<div class="spinner-block" id="spinner-8"></div>' +
                                '</div>'; break;
                    case 2: msg = "ok"; break;
                    case 3: msg = "cache"; break;
                    case 4: msg = "error"; break;
                }
                $('#status').attr("data-icon",msg);
                $('#status').html(html);
                return x;
            }
        }
    };

    var settings = {
        debug: true,
        offline: false,
        cachePages: true,
        cacheImages: false
    };


    var appCache = window.applicationCache;
    var localCache = {};
    var scrollPage;
    var scrollMenu;
    var scrollTable;

    // Make clicks eat-my-dust fast, and touch when possible
    var clickEvent = 'click';
    var touchEvent = 'click';
    var clickEnded = 'mouseup';
    if(isEventSupported('touchstart', document)) {
        touchEvent = 'touchstart';
    }

    var page = document.getElementById('app');

    if(settings.offline){
        $('html').attr('manifest','manifest.php');
    }

    $.fx.off = false
</script>
