<script>

    function renderMenu(data){
        var cache = localCache.get(data);
        var json = JSON.parse(cache);
        data = json;

        if(data) {
            if(!data.menu) {
                if(data.redirect) {
                    sessionStorage.clear();
                    return;
                }
            }
        }
        else {
            // if we attempt to render the menu and have no data, we're not logged in, so clear storage
            sessionStorage.clear();
            localStorage.clear();
            return;
        }

        var menu = '<ul role="tablist" id="tablist">'+'\n';
            menu += '<li id="nav_back" data-icon="back"></li>'

        // Each tab
        $.each(data.menu,function(k,v){
            var ref = (v.href === undefined) ? '#' : v.href;
            menu += '<li role="tab" data-icon="'+k+'">' +
                    '<a title="'+v.value+'" href="#">'+v.value+'</a>';

            // Each menu
            if (v.items){
                menu += '<ul role="navigation">'+'\n';
                $.each(v.items,function(k,v){
                    menu += '<li';

                    // If children
                    if (v.items){ menu += ' class="parent"' }
                    menu += '>'
                    if (v.href) {
                        var rel = '';
                        if (v.rel) {
                            rel = ' rel="'+ v.rel+'"';
                        }
                        if(v.id) {
                            menu += '<a id="' + v.id + '" href="' + v.href + '"'+rel+'>';
                        }
                        else {
                            menu += '<a href="'+ v.href +'"'+rel+'>';
                        }

                    } else { menu += '<h3>' }
                    menu += v.value
                    if (v.href) { menu += '</a>' } else { menu += '</h3>' }
                    // Subnav
                    if (v.items){
                        menu += '<a class="parent" data-icon="plus"></a>'+'\n';
                        menu += '<ul>'+'\n';
                        // Each subnav
                        $.each(v.items,function(k,v){
                            menu += '<li><a href="'+v.href+'">'+v.value+'</a></li>'+'\n';
                        });
                        menu += '</ul>';
                    }
                    menu += '</li>'+'\n';
                });
                menu += '</ul>';
            }
            menu += '</li>'+'\n';
        });

        // Ok. So this replace() is here after all kinds of fun.
        // The current server config has session.use_trans_sid ON, which is causing it to append "?PHPSESSID=x" to
        // the HREFs in the 30 lines above here each time it sees '<a href="'+ v.href +'">' ...*SOMETIMES* (not always).
        // It shouldn't be doing this, and the flag needs to remain enabled for uploadify (used in desktop version),
        // therefore, regex the querystring out of the links...
        var sessionless = menu.replace(/(href="[^"]*)\?PHPSESSID=[a-z0-9]*"/ig, '$1"');
        $('#nav').append(sessionless);
    }

    /**
     * data should be coming through with no extension on the URI
     * @param data
     * @param push
     */
    function renderPage(data, push){
        if(push === undefined) push = true;

        debug('render.html:54 > renderPage() url should have no extension: ' + data);

        env.status(1); // Loading

        if(env.lastPage){
            $('#logo').data('icon','back')
        }

        var p = $('#page');

        if(p.css('opacity') < 0.01) {
            p.css('opacity', 0.01);
        }

        p.animate({opacity:'0'},200,'linear',function(){

            // reset the expansion symbols to plus in case they're not
            $('#menu [data-icon="minus"]').data('icon','plus');

            // Cleanup
            $(this).html('');
            killScroll(scrollTable)

            if(data != '/m/') {
                // remove trailing slash if present
                if(data.substr(data.length - 1) == '/') {
                    data = data.substr(0, data.length - 1);
                }
                data += '.html';
            }

            // Get the page content
            debug( 'render.html:75 renderPage() requesting content for ' + data );
            data = localCache.get(data)
            var page = $(data).find('article')
            var title = $(data).find('header');

            //
            // Is there a login on the returned page? If so, reload the page
            // (which shows a login form), unless there's already a login page
            // available.
            if (page.find('#login_frm').length > 0 && $('#login_frm').length == 0) {
                sessionStorage.clear();
                window.location.reload();
                return;
            }

            $('#currentPage').html(title)
            p.html(page).prepend(title).animate({opacity:'1'},200);

            // Create scroll wrappers
            setTimeout(function () {
                // TODO probably should not be hardcoded quite like this.
                if($('#table-wrapper').length > 0){
                    scrollTable = new iScroll('table-wrapper', {
                        snap: 'th',
                        vscroll: true
                    });
                    scrollTable.scrollToElement('td.current',200);
                }
                if($('#school-news-wrapper').length > 0){
                    scrollTable = new iScroll('school-news-wrapper', {
                        snap: 'ul',
                        vscroll: true,
                        onScrollEnd: function(){
                            $('#school-news-wrapper .pagination li').removeClass('active');
                            $('#school-news-wrapper .pagination li:nth-child(' + (this.currPageX+1) + ')').addClass('active');
                            $('#school-news-wrapper').siblings('h1').html('School News <span>'+$('#school-news-wrapper ul:nth-child('+(this.currPageX+1)+')').attr('data-topic')+'</span>');
                        }
                    });
                }
                if($('#your-news-wrapper').length > 0){
                    scrollTable = new iScroll('your-news-wrapper', {
                        snap: 'ul',
                        vscroll: true,
                        momentum: false,
                        onScrollEnd: function(){
                            var el = $('#your-news-wrapper');
                            $('#your-news-wrapper .pagination li').removeClass('active');
                            $('#your-news-wrapper .pagination li:nth-child(' + (this.currPageX+1) + ')').addClass('active');
                            $('#your-news-wrapper').siblings('h1').html('My News <span>'+$('#your-news-wrapper ul:nth-child('+(this.currPageX+1)+')').attr('data-topic')+'</span>');
                        }
                    });
                }
                if($('#dashboard-timetable-wrapper').length > 0){
                    scrollTable = new iScroll('dashboard-timetable-wrapper', {
                        snap: 'li',
                        vscroll: true,
                        momentum: false
                    });
                    scrollTable.scrollToElement('li.current',200);
                }
            }, 100);
        });

        scrollTop();

        if(push && location.pathname != data && data != '/') {
            history.pushState(null, null, data);
            debug('pushed '+data);
            localStorage.setItem('lastPage', data)
        }
        else {
            debug('suppressed push of '+data);
        }
    }
</script>
