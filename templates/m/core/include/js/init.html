<script>
function init() {
    if(sessionStorage.getItem('session') && getCookie('PHPSESSID')){
        if(sessionStorage.getItem('session') != getCookie('PHPSESSID')){
            sessionStorage.removeItem('session');
        }
    }

    //
    // Install-a-bubble
    //
    if(!env.fullscreen && (env.ios || env.wp )){
        var style,
            instruction = '';

        if (env.ios) {
            style = 'ios';
            var device = '';
            if (env.ipad) {
                style += ' ipad';
                device = 'iPad';
            } else {
                style  += ' iphone';
                device += 'iPhone';
            }
            instruction = 'Intall this web app on your ' + device + ': tap &lsquo;<span>Share</span>&rsquo; ' +
                          'and then <br />&lsquo;<strong>Add to Home Screen</strong>.&rsquo;';
        }
        else if (env.wp) {
            style       = 'wp';
            instruction = '<a href="#" class="wp">Click here to install this web app to your Windows Phone</a>';
        }

        var bubble  = '<div id="bubble" class="' + style + '">' + instruction +
                      '<a href="#" class="close">&times;</a></div>';
        $('body').append(bubble);

        setTimeout(function(){
            $('#bubble').addClass('active');
        },5000);
    }

    if(msgTimeout!=undefined){
        clearTimeout(msgTimeout);
    }
    if(env.loggedIn) {
        renderMenu('/m/core/nav/sidebar.json');

        console.log(env.lastPage)

        if(env.lastPage == null ||
           env.lastPage == '/' ||
           env.lastPage == '') {
            var push = false
            env.lastPage = '/m/facade/dashboard/display'
            console.log('empty uri, send to dashboard')
        } else {
            var push = true
        }

        renderPage(env.lastPage, push)

        if($('#loading').hasClass('load')) {
            $('#spinner').remove();
            $('#loading').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
            $('#app').css({opacity:'0'});
            $('#app').animate({opacity:'1'},2000,'linear');
        } else {
            $('#loading').remove();
        }
    }
    else {
        if(env.init === 0) {

            $('#spinner').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
            $('#loading').append('<form id="login_frm"><ul>' +
                '<li><input type="text" id="username" name="username" placeholder="Username" value="jalbert" /></li>' +
                '<li><input type="password" id="password" name="password" placeholder="Password" value="password" /></li>' +
                '<li><input type="submit" id="login" name="login" value="Login" /></li>' +
                '</ul></form>');

            $('#loading').on('submit', '#login_frm', function(e) {
//                $('#login_frm').append('<input type="hidden" name="env" value="'+env+'" />')

                $.post('/m/core/auth/login_form.json', $('#login_frm').serialize() + '&env=' + JSON.stringify(env), function(data) {

                    debug($('#login_frm').serialize())

                    if($.zepto){
                        data = JSON.parse(data);
                    }

                    console.log(data);

                    if(data.session) {
                        // success
                        sessionStorage.setItem('session', data.session);
                        env.loggedIn = data.session;
                        e.preventDefault();
                        init();
                    }
                    else {
                        // failure
                        // window.location = "/m/";
                    }
                });
                e.preventDefault();

            });
        }
    }
    env.init = 1;
}

function showMessage(){
    if(document.getElementById('loading-msg')){
        document.getElementById('loading-msg').style.display = "block";
    }
}
</script>
