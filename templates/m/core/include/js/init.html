<script>
function init() {
    var session_stored = sStorage.getItem('session');
    if (!session_stored && env.isCurrentlyLoggedIn()) {
        env.loggedIn = true;
    }
    if(session_stored) {
          sStorage.removeItem('session');
          lStorage.removeItem('lastPage');
          lStorage.removeItem('skin');
          lStorage.removeItem('/m/core/nav/sidebar.json');
    }
    else {
        lStorage.removeItem('lastPage');
        lStorage.removeItem('skin');
        lStorage.removeItem('/m/core/nav/sidebar.json');
    }

    // Install-a-bubble
    env.fullscreen = (window.navigator.standalone) ? window.navigator.standalone : lStorage.getItem('pinned');
    if (env.fullscreen) {
        lStorage.setItem('pinned', true);
    }

    // clear any kind of message timeout that might be lurking around
    if(msgTimeout != undefined) {
        clearTimeout(msgTimeout);
    }

    // logged in? good. create the sidebar
    if(env.loggedIn) {
        // If this request returns a 401 unauthorized, env.loggedIn gets set to false
        renderMenu('/m/core/nav/sidebar.json');
    }

    if(env.loggedIn) {
        debug(env.lastPage);

        var push = true;

        if(env.lastPage == null || env.lastPage == '/m/' || env.lastPage == '') {
            push = false;
            env.lastPage = '/m/facade/dashboard/display';
            debug('empty uri, send to dashboard');
        }

        // this is where the action's at
        renderPage(env.lastPage, push);

        // if the loader is still spinning, make it begone
        if($('#loading').hasClass('load')) {
            $('#spinner').remove();
            $('#loading').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
            $('#app').css({opacity:'0'});
            $('#app').animate({opacity:'1'},2000,'linear');
        } else {
            $('#loading').remove();
        }
    }
    // not logged in
    else /*if(env.init === 0)*/ {

        $('#spinner').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
        if ($('#loading').find('#login_frm').length === 0) {
            $('#loading').append('<form id="login_frm"><ul>' +
                    '<li><input type="text" id="username" name="username" placeholder="Username" value="" /></li>' +
                    '<li><input type="password" id="password" name="password" placeholder="Password" value="" /></li>' +
                    '<li><input type="submit" id="login" name="login" value="Log in &rsaquo;" /></li>' +
                    '<li><label><input type="checkbox" name="rememberme" value="1" />Remember me?</label></li>' +
                    '</ul></form>');

            $('#loading').on('submit', '#login_frm', function(e) {

                var postdata = $('#login_frm').serialize() + '&env=' + JSON.stringify(env);
                var successCallback = function(data) {
                    debug($('#login_frm').serialize());
                    debug(data);
                    if (data.session) {
                        // success
                        sStorage.setItem('session', data.session);
                        env.loggedIn = data.session;
                        e.preventDefault();
                        // Go directly to the dashboard
                        window.location = '/m/'
                    }
                    else {
                        // failure
                        toast((data.message || 'Your username or password is incorrect.'), 'error');
                    }
                }
                var errorCallback = function(xhr) {
                    var data = JSON.parse(xhr.responseText);
                    toast((data.message || 'Your username or password is incorrect.'), 'error');
                };
                $.ajax({
                    url: '/m/core/auth/login_form.json',
                    type: 'POST',
                    data: postdata,
                    dataType: 'json',
                    success: successCallback,
                    error: errorCallback
                });
                e.preventDefault();

            });
        }
    }
    env.init = 1;
}

function showMessage(){
    if(document.getElementById('loading-msg')){
        document.getElementById('loading-msg').style.display = "block";
    }
}
</script>
