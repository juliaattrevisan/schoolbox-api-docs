<script>
function init() {
    // if there's a PHPSESSID but no session in storage? Use the PHPSESSID.
    // (but PHPSESSID can exist without a login. Call sessionStorage on desktop site?)
    var session_cookie = getCookie('PHPSESSID');
    var session_stored = sessionStorage.getItem('session');
    if (session_cookie && !session_stored && env.isCurrentlyLoggedIn()) {
        sessionStorage.setItem('session', session_cookie);
        session_stored = session_cookie;
        env.loggedIn = true;
    }
    // if the session var in storage doesn't match the php session cookie, ditch it
    if(session_stored && session_cookie) {
        if(session_stored != session_cookie) {
            sessionStorage.removeItem('session');
            localStorage.removeItem('lastPage');
            localStorage.removeItem('skin');
            localStorage.removeItem('/m/core/nav/sidebar.json');
        }
    }
    else {
        localStorage.removeItem('lastPage');
        localStorage.removeItem('skin');
        localStorage.removeItem('/m/core/nav/sidebar.json');
    }

    // Install-a-bubble
    if(!env.fullscreen && (env.ios || env.wp )) {
        var style,
            instruction = '';

        // load up bubble for iOS
        if (env.ios) {
            style = 'ios';
            var device = '';
            if (env.ipad) {
                style += ' ipad';
                device = 'iPad';
            } else {
                style  += ' iphone';
                device += 'iPhone';
            }
            instruction = 'Install this web app on your ' + device + ': tap &lsquo;<span>Share</span>&rsquo; ' +
                          'and then <br />&lsquo;<strong>Add to Home Screen</strong>.&rsquo;';
        }
        // load up bubble for Win (odd, since we don't officially support winmobile)
        else if (env.wp) {
            style       = 'wp';
            instruction = '<a href="#" class="wp">Click here to install this web app to your Windows Phone</a>';
        }

        var bubble  = '<div id="bubble" class="' + style + '">' + instruction +
                      '<a href="#" class="close">&times;</a></div>';


        $('body').append(bubble);

        setTimeout(function() {
            $('#bubble').addClass('active');
        }, 5000);
    }

    // clear any kind of message timeout that might be lurking around
    if(msgTimeout != undefined) {
        clearTimeout(msgTimeout);
    }

    // logged in? good. create the sidebar
    if(env.loggedIn) {
        renderMenu('/m/core/nav/sidebar.json');

        debug(env.lastPage);

        var push = true;

        if(env.lastPage == null || env.lastPage == '/m/' || env.lastPage == '') {
            push = false;
            env.lastPage = '/m/facade/dashboard/display';
            debug('empty uri, send to dashboard');
        }

        // this is where the action's at
        renderPage(env.lastPage, push);

        // if the loader is still spinning, make it begone
        if($('#loading').hasClass('load')) {
            $('#spinner').remove();
            $('#loading').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
            $('#app').css({opacity:'0'});
            $('#app').animate({opacity:'1'},2000,'linear');
        } else {
            $('#loading').remove();
        }
    }
    // not logged in
    else /*if(env.init === 0)*/ {

        $('#spinner').animate({opacity:'0'},100,'linear',function(){$(this).remove()});
        $('#loading').append('<form id="login_frm"><ul>' +
            '<li><input type="text" id="username" name="username" placeholder="Username" value="" /></li>' +
            '<li><input type="password" id="password" name="password" placeholder="Password" value="" /></li>' +
            '<li><input type="submit" id="login" name="login" value="Login" /></li>' +
            '</ul></form>');
        $('#loading').css('min-height', $('#login_frm').offset().top + $('#login_frm').height() + 96);

        $('#loading').on('submit', '#login_frm', function(e) {
//          $('#login_frm').append('<input type="hidden" name="env" value="'+env+'" />')

            var postdata = $('#login_frm').serialize() + '&env=' + JSON.stringify(env);

            $.post('/m/core/auth/login_form.json', postdata, function(data) {

                debug($('#login_frm').serialize());

                if($.zepto) {
                    data = JSON.parse(data);
                }

                debug(data);

                if(data.session) {
                    // success
                    sessionStorage.setItem('session', data.session);
                    env.loggedIn = data.session;
                    e.preventDefault();
                    init();
                }
                else {
                    // failure
                    toast('Your username or password is incorrect.', 'error');
                    // window.location = "/m/";
                }
            });
            e.preventDefault();

        });
    }
    env.init = 1;
}

function showMessage(){
    if(document.getElementById('loading-msg')){
        document.getElementById('loading-msg').style.display = "block";
    }
}
</script>
