<!doctype html>
<html lang="en">
<head>
    <title>{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="apple-touch-startup-image" media="(max-device-width: 480px) and not (-webkit-min-device-pixel-ratio: 2)" href="/images/{{ site.location }}/startup-iphone.png" />
    <link rel="apple-touch-startup-image" media="(max-device-width: 480px) and (-webkit-min-device-pixel-ratio: 2)" href="/images/{{ site.location }}/startup-iphone4.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 768px) and (orientation: portrait)" href="/images/{{ site.location }}/startup-iPad-portrait.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 768px) and (orientation: landscape)" href="/images/{{ site.location }}/startup-iPad-landscape.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 1536px) and (orientation: portrait)" href="/images/{{ site.location }}/startup-iPad3-portrait.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 1536px) and (orientation: landscape)" href="/images/{{ site.location }}/startup-iPad3-landscape.png" />

    <!-- BB must not be precomposed, Droid must be. Why not just use rel="icon" for all? -->
    <link rel="shortcut icon" href="/images/{{ site.location }}/favicon.ico" />
    <link rel="icon" type="image/png" href="/images/{{ site.location }}/apple-touch-icon-precomposed.png">
    <link rel="apple-touch-icon" href="/images/{{ site.location }}/apple-touch-icon-precomposed.png"/>
    <link rel="apple-touch-icon-precomposed" href="/images/{{ site.location }}/apple-touch-icon-precomposed.png"/>

    {% include 'loadstyle.html' %}
</head>
