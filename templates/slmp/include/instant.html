<li class="bell" data-unread="{WEBSOCKET_UNREAD_COUNT}">
  <a id="go-msg" href="/messages" data-menu="message-list">{WEBSOCKET_UNREAD_LABEL}</a>
  <ul id="message-list" class="flyout-menu msg-tray">
    <li class="messages header">
      <h4>
        <span>Messages</span>
        <a id="msg-mar" href="#">Mark all read</a>
      </h4>
    </li>
    <li class="messages content">
      <ul id="msg-content">
        <!-- messages generated by js -->
      </ul>
    </li>
    <li class="messages footer">
      <a href="/messages">
        <span class="connecting"></span>&nbsp;Connecting&hellip;
      </a>
    </li>
  </ul>
</li>
<div id="alert-dialog" class="open content" style="display:none;">
  <div class="msg-tray">
    <ul class="messages content">
      <li class="msg tpl" id="m">
        <a class="action" href="#">
          <img width="32" height="32" src="">
          <span class="descript"></span>
        </a>
      </li>
    </ul>
  </div>
</div>
<script type="text/javascript">
  $(function () {
    // launch the notifier
    $('#infoPanel').children('li.bell').notifier({
      host:     '{WEBSOCKET_HOST}',
      port:     '{WEBSOCKET_PORT}',
      path:     '{WEBSOCKET_PATH}',
      secure:   '{PAGE_SECURE}',
      maxstack: '{WEBSOCKET_STACK_LIMIT}'
    });

    $('#alert-dialog').on('click', 'a.action', function (e) {
      e.preventDefault();
    })
  });
</script>
