<!-- BEGIN custom_head -->
<style type="text/css">
    #library-links li p {
        height: 100%;
    }
    #library-header p {
        margin: 0;
    }
</style>
<!-- END custom_head -->

<script type="text/javascript" src="/javascript/components/jquery-cycle/jquery.cycle.all.js"></script>
<script type="text/javascript">
$(window).load(function(){
$('#library-books').cycle({cleartypeNoBg:true});

});
</script>

<div id="brender-moss">
    <div id="library-header">
		<h1>Brender Moss Library</h1>
		<ul>
			<li class="home current">{HOME}</li>
			<li class="catalogue">{CATALOGUE}</li>
			<li class="clickview">{CLICKVIEW}</li>
		</ul>
	</div>
	
	<ul id="library-links">
        <li class="turnitin">{TURNITIN}</li>
        <li class="database">{DATABASES}</li>
        <li class="research">{RESEARCH}</li>
        <li class="reading">{READING}</li>
        <li class="studyskills">{STUDY}</li>
        <li class="judaism">{JUDAISM}</li>
        <li class="services">{SERVICES}</li>
        <li class="blogs">{BLOGSWIKIS}</li>
        <li class="teachers">{TEACHERS}</li>
	</ul>
    <div id="aside">
        <h2>New Books</h2>
        <ul id="library-books">
            <!-- BEGIN image -->
            <li>
                <img src="/cms/image.php?id={IMAGE_ID}&amp;height=222&amp;width=222" alt="{IMAGE_NAME}">
                <span>{IMAGE_NAME}</span>
            </li>
            <!-- END image -->
        </ul>
    </div>
</div>
<script type="text/javascript">
    $('#library-links a').each( function(i) {
        $(this).html('<span>' + $(this).text() + '</span>');
    });
</script>
