<HTML>
<HEAD>
    <META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=utf-8">
</HEAD>
<BODY topmargin="0" marginheight="0">
<STYLE TYPE="text/css">
    <!--
    .im {color:#000;}
    a {color:#0066B0;text-decoration:underline;}
    a:hover {color:#176D76;}
    img {display:block;}
    -->
</STYLE>
<table style="max-width:500px;color:#000;font-family:sans-serif;" cellpadding="0" cellspacing="0" border="0" width="100%">
    <tr>
        <td width="100%">
            <div><IMG SRC="http://{SITE_DOMAIN}/images/emails/spacer.gif" WIDTH="1" HEIGHT="16" BORDER="0"></div>
            <div style="line-height:24px;text-align:left;">
                <span style="font-size:24px;color:#000000;font-weight:bold;font-family:Arial, Helvetica, sans-serif;text-align:left;">Hi {NAME},</span>
            </div>
            <div><IMG SRC="http://{SITE_DOMAIN}/images/emails/spacer.gif" WIDTH="1" HEIGHT="16" BORDER="0"/></div>
            <!-- BEGIN newslist -->
            <table cellpadding="5" cellspacing="0" border="0" width="100%" style="font-family:sans-serif;">
                <tr style="margin:0;line-height:22px;border-radius:4px;background:#EDE4A6;color:#000;font-size:18px;font-weight:bold;">
                    <td colspan="3">{NEWS_TYPE}</td>
                </tr>
            <!-- BEGIN article -->
                <tr style="line-height:18px;margin:0;background:{ARTICLE_BACKGROUND};">
                    <td colspan="2"><a href="http://{SITE_DOMAIN}/{ARTICLE_SLUG}">{ARTICLE_TITLE}</a></td>
                </tr>
                <tr style="line-height:18px;margin:0;background:{ARTICLE_BACKGROUND};">
                    <td>{ARTICLE_TOPIC}</td>
                    <td>{ARTICLE_DATE}</td>
                </tr>
                <tr style="line-height:18px;margin:0;background:{ARTICLE_BACKGROUND};font-style:italic">
                    <td colspan="2">{ARTICLE_ABSTRACT}</td>
                </tr>
            <!-- END article -->
                <tr><td colspan="3" height="20"><IMG SRC="http://{SITE_DOMAIN}/images/emails/spacer.gif" WIDTH="1" HEIGHT="20" BORDER="0"/></td></tr>
            </table>
            <!-- END newslist -->
            <div><IMG SRC="http://{SITE_DOMAIN}/images/emails/spacer.gif" WIDTH="1" HEIGHT="20" BORDER="0"/></div>
        </td>
    </tr>
</table>
</BODY>
</HTML>
