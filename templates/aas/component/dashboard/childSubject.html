<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component data-component-definition-id="{COMPONENT_DEFINITION_ID}">
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <!-- BEGIN student_block -->
            <section class="actions-small-1">
                <div class="card small-12">
                    <a href="/search/user/{STUDENT_ID}">
                        <img src="/portrait.php?id={STUDENT_ID}&size=square64" title="View Profile" />
                        <h3>{STUDENT_NAME}</h3>
                    </a>
                    <p class="meta">{STUDENT_YEAR}</p>
                </div>

                <nav>
                    <sbx-pop-out content-id="row-options-childsubject-{STUDENT_ID}"></sbx-pop-out>
                </nav>

                <ul class="action-list">
                    <!-- BEGIN subject_block -->
                    <li>
                        <div class="compact card small-12">
                            <span class="icon-home" title="Visit Homepage"></span>
                            <a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a>
                        </div>
                    </li>
                    <!-- END subject_block -->
                </ul>

                <div class="small-12 columns no-pad">
                    {BUTTON_ISLAND}
                </div>
            </section>
            <!-- END student_block -->
        </div>
    </div>
</div>
