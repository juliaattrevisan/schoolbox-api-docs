<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    {CONFIGURATION}

    <div class="row {CONFIG_COLLAPSED_CLASS}" data-collapsable='true' data-collapse-state="{CONFIG_COLLAPSED_STATE}">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>
            <dl class="tabs" data-tab>
                <!-- BEGIN topic_header -->
                <dd class="{TOPIC_ACTIVE}">
                    <a href="#component{COMPONENT_INSTANCE_ID}-{TOPIC_CLEAN}">{NEWS_TOPIC}</a>
                </dd>
                <!-- END topic_header -->
            </dl>

            <section>
                <div class="tabs-content">
                    <!-- BEGIN topic -->
                    <ul class="news-list content {TOPIC_ACTIVE}" id="component{COMPONENT_INSTANCE_ID}-{TOPIC_CLEAN}">
                        <!-- BEGIN news -->

                            <!-- BEGIN full -->
                            <li>
                                <div class="list-item">
                                    <div class="card small-12">
                                        <!-- BEGIN read_more -->
                                            <a href="{NEWS_URL}" title="{NEWS_TITLE}">
                                                <!-- BEGIN news_image -->
                                                <img src="/storage/image.php?hash={NEWS_IMAGE}&size=square64" />
                                                <!-- END news_image -->
                                                <!-- BEGIN news_no_image -->
                                                <!-- END news_no_image -->
                                                <h3>{NEWS_TITLE}</h3>
                                            </a>
                                        <!-- END read_more -->
                                        <!-- BEGIN no_read_more -->
                                            <!-- BEGIN news_image -->
                                            <img src="/storage/image.php?hash={NEWS_IMAGE}&size=square64" />
                                            <!-- END news_image -->
                                            <!-- BEGIN news_no_image -->
                                            <!-- END news_no_image -->
                                            <h3>{NEWS_TITLE}</h3>
                                        <!-- END no_read_more -->
                                </div>
                                <article>{NEWS_SHORT}</article>
                            </li>
                            <!-- END full -->

                            <!-- BEGIN compact -->
                            <li>
                                <div class="card small-12">
                                    <a href="{NEWS_URL}" title="{NEWS_TITLE}">
                                        <h3>{NEWS_TITLE}</h3>
                                    </a>
                                </div>
                            </li>
                            <!-- END compact -->

                        <!-- END news -->
                    </ul>
                    <!-- END topic -->
                </div>
            </section>
        </div>
    </div>
</div>
