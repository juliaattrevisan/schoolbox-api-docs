<div class="box student-subjects clearfix">
    <h2>My Daughter</h2>
    <ul class="listing">
        <!-- BEGIN student_block -->
        <li class="image-height clearfix">

            <a class="link-image" href="/search/user/{STUDENT_ID}">
                <img src="/portrait.php?userId={STUDENT_EXTERNAL_ID}&size=square64" alt="{STUDENT_NAME}"/>
            </a>

            <div class="student-details">
                <a class="student-name" href="/search/user/{STUDENT_ID}">{STUDENT_NAME}, Year {STUDENT_YEAR}</span></a>

                <ul class="wysiwyg">
                    <!-- BEGIN subject_block -->
                    <li><a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a></li>
                    <!-- END subject_block -->
                </ul>
				<!-- BEGIN due_work -->
                <a href="/submission/dueWork/0/{STUDENT_ID}" class="btn due-work"><span></span>Due Work</a>
				<!-- END due_work -->
                <!-- BEGIN grades_button -->
                <a href="/submission/allWork/{STUDENT_ID}" class="btn tick" title="View grades"><span></span>Grades</a>
                <!-- END grades_button -->
                <a href="/timetable/{STUDENT_ID}" class="btn time-table"><span></span>Timetable</a>
				<!-- BEGIN eportfolio -->
				<a href="/eportfolio/{STUDENT_ID}/profile" class="btn eportfolio"><span></span>ePortfolio</a>
				<!-- END eportfolio -->
                <a href="/calendar/full/{CAL_TODAY_DATE}/{STUDENT_ID}" class="btn calendar"><span></span>Calendar</a>

        </li>
        <!-- END student_block -->
    </ul>
</div>
