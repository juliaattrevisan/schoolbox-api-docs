<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/multifilecms.js"></script>
<script type="text/javascript">
	multi_selector = new MultiSelector();
</script>
<!-- END custom_head -->

<h1>Upload Multiple Files</h1>
<form method="post" enctype="multipart/form-data" id="fileForm" class="standardForm" onsubmit="return multi_selector.check();" action="/cms/fileForm.php">
    <table>
    <tr>
      <td class="formLabelWidth"><h3>Location</h3>
        <em>These files will be located in this folder</em></td>
      <td>{CATEGORY_NAME}<input name="category" value="{CATEGORY_ID}" type="hidden" /></td>
    </tr>
        <tr>
      <td><h3>Hidden</h3>
        <em>Hide these files from students.</em></td>
      <td><input type='checkbox' name='hidden' value='1' /></td>
    </tr>
        <tr>
        <td><h3>Files</h3>
        <em>Each file must have a description and location, a new row will appear when these requirements are met</em></td>
        <td>
            <table>
            <thead>
            <tr>
                <td><h3>Description</h3></td>
                <td><h3>Location</h3></td>
                <td></td>
            </tr>
            </thead>
            <tbody id="files_list">
            </tbody>
            </table>
            <script type="text/javascript">
                multi_selector.init(document.getElementById('files_list'), {FILE_max_upload});
            </script>
        </td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td><input type="submit" name="Submit" value="Upload Files" class="btn" />
            </td>
        </tr>
    </table>
</form>
