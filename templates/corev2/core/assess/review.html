<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/jquery.countdown.css" media="screen" />
<script type="text/javascript" src="/javascript/jquery.countdown.js"></script>
<script type="text/javascript">
$j(document).ready(function() {
   var currentForm = '';
	$j('.assess-header form').each(function(index, formElement) {
   		 $j(formElement).validate({
			submitHandler: function() {
				$j.post($j(formElement).attr('action'), $j(formElement).serialize(), function(responseText) {
					var dataFunction = new Function('return ' + responseText);
					var result = dataFunction();
				});
				return false;
			},
			rules: {
				reviewedMarks: { 
					number:true
				}	
			},
			messages: {
				reviewedMarks: "Please enter a decimal number"
			},
			errorPlacement: function(error, element) {
          	  offset = element.offset();
            	error.insertBefore(element)
			}

   		});
	});  	   
		
	$j('.textarea-container textarea').blur(function() {
		if ($j(this).val() !== '') {
			$j.post($j(this).parents('.assess-header form').attr('action'), $j(this).parents('.assess-header form').serialize(), function(responseText) {
				var dataFunction = new Function('return ' + responseText);
				var result = dataFunction();
			});
			return false;			
		}
	});
	
	$j('.marks-amount input').blur(function() {
		
		$j.post($j(this).parents('.assess-header form').attr('action'), $j(this).parents('.assess-header form').serialize(), function(responseText) {
				var dataFunction = new Function('return ' + responseText);
				var result = dataFunction();
			});
			return false;	

	});
	
	
});
</script>
<!-- END custom_head -->
<div id="assess" class="mark-test">
	<h1>Mark the test results</h1>
	<h2>Section: {SECTION_TITLE}</h2>
	<div class="assess-body margin-bottom-10">
		<p>{SECTION_DESCRIPTION}</p>
	</div>
	<!-- BEGIN question -->
	<div class='assess-header'>
		<form action="/assess/saveReviewedResponse/{QUESTION_QUESTION_ID}/{RESPONSE_ID}" class='validation_{RESPONSE_ID}' method="post">
			<h3><strong>Q{QUESTION_SEQUENCE})</strong> {QUESTION_QUESTION}<span> - ({QUESTION_MARKS} marks)</span></h3>
			<div class="assess-body">

				<!-- BEGIN answerInputs -->
				<!-- END answerInputs -->
                <input type="submit" value="Update Marks" class="next-step"/>
                <div class="float-fix"></div>
			</div>
		</form>

	</div>
	<!-- END question -->

	<!-- BEGIN prevSection -->
	<a class="next-step step-nav" href="/assess/review/{ASSESS_ASSESS_ID}/{PREV_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}">Previous Section</a>
	<!-- END prevSection -->

	<!-- BEGIN nextSection -->
	<a class="next-step step-nav" href="/assess/review/{ASSESS_ASSESS_ID}/{NEXT_SECTION_ID}/{ATTEMPT_ATTEMPT_ID}">Next Section</a>
	<!-- END nextSection -->

	<!-- BEGIN endAssess -->
	<a class="green-go" href="/assess/finishReview/{ASSESS_ASSESS_ID}/{ATTEMPT_ATTEMPT_ID}">Finish</a>
	<!-- END endAssess -->
</div>
