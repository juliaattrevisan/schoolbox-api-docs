<p class="help"> A green row indicates a correctly matched answer, the red indicates an incorrectly matched one.</p>

<fieldset class="float-left match-student-left">
    <label>Answer</label>
			<ul class="matchPairs match-left arrow-fix">
				<!-- BEGIN answerOptionLeft -->
				<li class="left-columns {CORRECT}"><strong>{ANSWER_LEFT_VALUE}</strong><div class="arrow"><span></span></div>
				<div class="float-fix"></div>
				</li>
				<!-- END answerOptionLeft -->
			</ul>
	
			<ul class="matchPairs match-right">
				<!-- BEGIN answerOptionRight -->
				<li class="right-columns {CORRECT}">
					<strong>{ANSWER_RIGHT_VALUE}</strong>
					<div class="mark"><span></span></div>
					<div class="float-fix"></div>
				</li>
				<!-- END answerOptionRight -->
			</ul>
</fieldset>
<fieldset class="float-left match-student-right">
    <label>Correct Answer</label>
		<ul class="matchPairs match-right correct-thing">
		<!-- BEGIN answerOptionCorrectResponse -->
			<li class="right-columns matchCorrect">
				<strong>{ANSWER_CORRECT_RESPONSE_VALUE}</strong>
				<div class="float-fix"></div>
			</li>
			<!-- END answerOptionCorrectResponse -->
		</ul>
</fieldset>
<div class="float-fix"></div>

<fieldset class="teacher-comments">
    <label>Teacher's comments:</label>
    <div class="textarea-container">{REVIEWED_COMMENT}</div>
</fieldset>
    <p class="marks-amount">
        {REVIEWED_MARKS} / {QUESTION_MARKS}
    </p>
