<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/mootools/mootools-1.2.3-core-nc.js"></script>
<script type="text/javascript" src="/javascript/mootools/carousel.js"></script>
<script type="text/javascript" src="/javascript/mootools/countdown.js"></script>
<script type="text/javascript">
window.addEvent('domready', function() {
	// setup classes
	var carousel  = new Carousel('questions');
	var countdown = new CountDown({h: {DURATION_HOURS}, m: {DURATION_MINUTES},
		onTick: function() {
			$$('#duration h1').set('text', this.text);
		},
		onDone: function() {
			$('carousel').submit();
		}
	});
	
	// setup list
	$$('#list li a').each(function(el, i) {
		el.addEvent('click', function() {
			carousel.move(i + 1);
			
			if(carousel.first)
				$$('#controls-left input').set('disabled', 'disabled');
			else
				$$('#controls-left input').set('disabled');
				
			if(carousel.last) {
				$$('#controls-right input').set('value', 'Finish Test');
			} else {
				$$('#controls-right input').set('value', 'Next');
			}
		});
	});
	
	
	// controls
	$$('#controls-left input').addEvent('click', function(event) {
		carousel.prev();
		
		if(carousel.first)
			$$('#controls-left input').set('disabled', 'disabled');
		else
			$$('#controls-left input').set('disabled');
			
		if(carousel.last) {
			$$('#controls-right input').set('value', 'Finish Test');
		} else {
			$$('#controls-right input').set('value', 'Next');
		}
	});

	$$('#controls-right input').addEvent('click', function() {
		if(carousel.last)
			$('carousel').submit();
		
		carousel.next();
		
		if(carousel.first)
			$$('#controls-left input').set('disabled', 'disabled');
		else
			$$('#controls-left input').set('disabled');
			
		if(carousel.last) {
			$$('#controls-right input').set('value', 'Finish Test');
		} else {
			$$('#controls-right input').set('value', 'Next');
		}
	});
});
</script>
<style type="text/css">
	#title {
		float: left;
		width: 50%;
	}
	
	#duration {
		float: right;
		width: 50%;
		text-align: right;
	}

	#list {
		display: block;
		float: left;
		width: 25%;
	}
	
	#list li {
		margin: 0 0 10px 0;
	}
	
	#carousel {
		display: block;
		overflow: hidden;
		width: 70%;
		float: right;
		margin: 0 0 30px 0;
	}
	
	#questions {
		margin: 0%;
		padding: 0%;
	}
	
	#questions li {
		margin: 0%;
		padding: 0%;
		float: left;
		display: inline;
	}
	
	#controls-left {
		float: right;
		width: 35%;
	}
	
	#controls-right {
		float: right;
		width: 35%;
		text-align: right;
	}
</style>
<!-- END custom_head -->

<div id="title"><h1>{TEST_TITLE}</h1></div>
<div id="duration"><h1></h1></div>

<ul id="list">
	<li><h2>Questions</h2></li>
	<!-- BEGIN list -->
	<li><a>{QUESTION_QUESTION}</a></li>
	<!-- END list -->
</ul>

<form id="carousel" method="post">
	<ul id="questions">
		{QUESTION}
	</ul>
	<input type="hidden" name="action" value="finish"/>
	<input type="hidden" name="attempt_id" value="{ATTEMPT_ID}"/>
</form>

<div id="controls-right"><input type="button" value="Next"/></div>
<div id="controls-left"><input type="button" value="Previous" disabled="disabled"/></div>
