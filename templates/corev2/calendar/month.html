<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<link rel="stylesheet" type="text/css" href="/css/core/ui/ui.css" />
<link rel="stylesheet" type="text/css" href="/css/corev2/forms.css" />
<script type="text/javascript">
      $j(function () {
 
        /* date picker */		 
        $j('.datepicker').datepicker({ 
          dateFormat: 'dd-mm-yy',
          onSelect: function(dateText, inst) {window.open('/calendar/month/'+dateText, "_self")},
          defaultDate: $j.datepicker.parseDate("dd-mm-yy", "{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}"),
					showOn: 'button',
					buttonImage: '/css/core/ui/images/calendar-icon.gif',
					buttonImageOnly: true,
					showAnim: 'slideDown'
        });
			
		//show or hide bubbles
		$j('ul.js_happening li').click(function(){
			$j('.filter-drop').hide();	
			if ($j(this).children('.cal-bubble').is(':visible')) {
				$j('.cal-bubble').hide();	
			} else {
				$j('.cal-bubble').hide();				
				$j(this).children('.cal-bubble').show();	
			}
		});
		
		//show and hide the filters drop down
		$j('a.filters').click(function(){
			
			$j('.cal-bubble').hide();
			
			if ($j('.filter-drop').is(':visible')) {
				$j('.filter-drop').hide();	
			} else { 
				$j('.filter-drop').show();		
			}

		});
		
		$j('.filter-list input:checked').checked;
		
		//run the filter checker to show and hide the items
		$j('#applyFilters').click(filterChecker);
		
		function filterChecker() {
			
			$j('.filter-list input:checked').each(function(){		 		
				var m = $j(this).attr('value');
				if ($j('ul.js_happening .' + m).is(':hidden')) {
				  $j('ul.js_happening .' + m).show();
				}
			});
			
			$j('.filter-list input:not(:checked)').each(function(){
				var n = $j(this).attr('value');
				if ($j('ul.js_happening .' + n).is('::visible')) {
				  $j('ul.js_happening .' + n).hide();
				}
			});
				
		}//end of filterchecker
});

</script>
     <div id="calendar">
     
      <table id="month-view" cellpadding="0" cellspacing="0">
      	<thead>
		<tr>
			<td colspan="2" class="cal-left" valign="baseline">
				<a class="back" href="/calendar/month/{BACK}" title="Back one month"><strong>&lt;&lt;</strong></a>
				<div class="datepicker-box"><input type="hidden" class="datepicker" /></div>
				<a class="forward" href="/calendar/month/{FORWARD}" title="Forward one month"><strong>&gt;&gt;</strong></a>
			</td>
			
			<td colspan="2" class="cal-mid"><h3>{MONTH} {YEAR}</h3></td>
			
			<td colspan="3" class="cal-right" valign="baseline">
				<div class="link-case">
					<a class="customise filters" href="#">Calendar Filters</a><a class="customise week" href="/calendar/week/{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}">Week</a><a class="customise" href="#">Month</a>
					<div class="filter-drop">
						<div class="filter-list">
							<form>	
								<div class="filter-cat">
								<span>Groups</span>
								<!-- BEGIN group -->
									<label title="{GROUP_NAME}">
										<input type="checkbox" name="campus" id="{GROUP_ID}" value="{GROUP_ID}" checked="checked" class="checkbox"/>{GROUP_NAME}
									</label>
									<div class="float-fix"></div>
								<!-- END group -->
								</div>
								<div class="filter-cat">
								<span>Campus</span>
								<!-- BEGIN campus -->
									<label title="{CAMPUS_NAME}">
										<input type="checkbox" name="campus" id="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="{CAMPUS_ID}" class="checkbox"/>{CAMPUS_NAME}
									</label>
									<div class="float-fix"></div>
								<!-- END campus -->
								</div>
								<div class="filter-cat last">
								<span>Event</span>
								<!-- BEGIN event_type -->
								<label title="{EVENT_TYPE_NAME}">
									<input type="checkbox" name="campus" id="{EVENT_TYPE_ID}" checked="checked" value="type{EVENT_TYPE_ID}" class="checkbox"/><span style="background-color:#{EVENT_TYPE_COLOUR};">{EVENT_TYPE_NAME}</span>
								</label>
								<!-- END event_type -->
								<div class="float-fix"></div>
							
								</div><!--/filter-list-->
							<a href="#" id="applyFilters">Apply</a>
						</form>
					</div><!--/filter-drop-->
				</div>
			</td>
		</tr>
		<tr>
        	<td class="dark border-left">Sun</td>
            <td class="dark">Mon</td>
            <td class="dark">Tue</td>
            <td class="dark">Wed</td>
            <td class="dark">Thu</td>
            <td class="dark">Fri</td>
            <td class="dark">Sat</td>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN month_week -->
        <tr class="month-week">
        	<!-- BEGIN day_block -->
        	<td class="day-block {OTHER_MONTH} {MONTABLE_CSS}">
				<div class="dayWrap">
					<p class="header_option">{ADD}</p>
					<p class="day-num">{DATE}</p>
				<div class='float-fix'></div>
            </div> 
            <div class="noteWrap">
				<ul class="js_happening">
					<!-- BEGIN note_block -->
					<li class="{EVENT_TYPE} {EVENT_LEVEL} ">
						<span style="background-color:{COLOUR}; border:1px solid {COLOUR};">{TIME} {NOTE}</span>
						<div class="cal-bubble">
							<div class="top"></div>
							<div class="middle">
							<h4><!-- BEGIN time --><span style="background-color:{COLOUR}; border:1px solid {COLOUR}">{TIME}</span><!-- END time -->{NOTE}</h4>
							<p class="event-type">{TYPE}</p>
							<p class="author">{AUTHOR}</p>
							{MODIFY}
							</div>
						</div>
					</li>
					<!-- END note_block -->
				</ul>
            </div>
          </td>
        	<!-- END day_block -->
        </tr>
        <!-- END month_week -->
        </tbody>
      </table>
</div>
