<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
 <link rel="stylesheet" type="text/css" href="/css/core/ui/ui.css" />
<script type="text/javascript">
	$j(function () {
       
	    /* date picker */		 
		$j('.datepicker').datepicker({ 
		  dateFormat: 'dd-mm-yy',
		  onSelect: function(dateText, inst) {window.open('/calendar/week/'+dateText, "_self")},
		  defaultDate: $j.datepicker.parseDate("dd-mm-yy", "{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}"),
					showOn: 'button',
					buttonImage: '/css/core/ui/images/calendar-icon.gif',
					buttonImageOnly: true,
					showAnim: 'slideDown'
		});
			
			
		$j('ul.js_happening li').click(function(){
			if ($j(this).children('.cal-bubble').is(':visible')) {
				$j('.cal-bubble').hide();	
			} else {
				$j('.cal-bubble').hide();
				$j(this).children('.cal-bubble').show();	
			}
		});
		
		$j('.close').click(function(){
			$j(this).hide();
		});
		
		//show and hide the filters drop down
		$j('a.filters').click(function(){
			
			$j('.cal-bubble').hide();
			
			if ($j('.filter-drop').is(':visible')) {
				$j('.filter-drop').hide();	
			} else { 
				$j('.filter-drop').show();		
			}

		});
		
		//run the filter checker to show and hide the months
		$j('#applyFilters').click(filterChecker);
		
		/*
		
		1. check to see when checkboxes are checked
		2. show/hide all the list IDs that match this	
			
		*/
		
		function filterChecker() {
			
		/* for each checked input, return the ID as an alert*/	
			$j('input:checked').each(function(){		 		
				
				var m = $j(this).attr('id');
				alert(m); 
	
			});
		}
		
		

	});
</script>
<!-- END custom_head -->

      <div id="calendar">

	  	<table cellpadding="0" class="{MONTABLE_CSS}" cellspacing="0" width="100%">
			<tr>
				<td colspan="3"class="cal-left">
					<a class="back" href="/calendar/week/{BACK}" title="Back one month"><strong>&lt;&lt;</strong></a>
					<div class="datepicker-box"><input type="hidden" class="datepicker" /></div>
					<a class="forward" href="/calendar/week/{FORWARD}" title="Forward one month"><strong>&gt;&gt;</strong></a>
				</td>
				
				<td colspan="3" class="cal-mid"><h3>{MONTH}</h3></td>
				
				<td colspan="3"class="cal-right">
				<div class="link-case">
					<a class="customise filters" href="#">Calendar Filters</a><a class="customise" href="#">Week</a><a class="customise week" href="/calendar/month/{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}">Month</a>
					<div class="filter-drop">
							<div class="filter-list">
								<form>	
									<div class="filter-cat">
									<span>Groups</span>
									<!-- BEGIN group -->
										<label title="{GROUP_NAME}">
											<input type="checkbox" name="campus" id="{GROUP_ID}" value="{GROUP_ID}" {GROUP_ID_SELECTED} class="checkbox"/>{GROUP_NAME}
										</label>
										<div class="float-fix"></div>
									<!-- END group -->
									</div>
									<div class="filter-cat">
									<span>Campus</span>
									<!-- BEGIN campus -->
										<label title="{CAMPUS_NAME}">
											<input type="checkbox" name="campus" id="{CAMPUS_ID}" {CAMPUS_ID_SELECTED} value="{CAMPUS_ID}" class="checkbox"/>{CAMPUS_NAME}
										</label>
										<div class="float-fix"></div>
									<!-- END campus -->
									</div>
									<div class="filter-cat last">
									<span>Event</span>
									<!-- BEGIN event_type -->
									<label title="{EVENT_TYPE_NAME}">
										<input type="checkbox" name="campus" id="{EVENT_TYPE_ID}" {EVENT_ID_SELECTED} value="{EVENT_TYPE_ID}" class="checkbox"/>{EVENT_TYPE_NAME}
									</label>
									<!-- END event_type -->
									<div class="float-fix"></div>
								
							</div><!--/filter-list-->
							<a href="#" id="applyFilters">Apply</a>
							</form>
						</div><!--/filter-drop-->
					</div>
				
				
				</td>
			</tr>
		</table>
		
		<table id="week-view" class="{MONTABLE_CSS}" cellpadding="0" cellspacing="0" width="100%">
			
            <tr>
                <!-- BEGIN day_header -->
				<td class="day-block">
					<div class="dayWrap">
						<p class="day-num">{DATE}</p>
						<p class="header_option">{ADD}</p>
					   <div class='float-fix'></div>
					</div> 
				</td>
                <!-- END day_header -->
			</tr>
            
            
			<tr valign="top">

                <!-- BEGIN day_block -->
				<td class="day-block">
					<ul class="js_happening">
					<!-- BEGIN note_block -->
					<li>
					<!-- BEGIN time -->
						<span class="time">{TIME}</span>
					<!-- END time -->
						<span style="background-color:{COLOUR}; border:1px solid {COLOUR};">{NOTE}</span>
					</li>
					<!-- END note_block -->
					</ul>
				</td>
                <!-- END day_block -->
			</tr>
            
		</table>
		
	<div class="cal-bubble">
		<div class="top"></div>
		<div class="middle">
			<div class="close"></div>
			<h4><!-- BEGIN time -->{TIME}<!-- END time -->{NOTE}</h4>
			<p class="author">{AUTHOR}</p>
			<p class="event-type">{TYPE]</p>
			{MODIFY}
		</div>
		<div class="bottom"></div>
	</div>
</div>
