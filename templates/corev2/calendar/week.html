      			<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
            <link rel="stylesheet" type="text/css" href="/css/core/ui/ui.css" />
            <script type="text/javascript">
      $j(function () {
        /* date picker */		 
        $j('.datepicker').datepicker({ 
          dateFormat: 'dd-mm-yy',
          onSelect: function(dateText, inst) {window.open('/calendar/week/'+dateText, "_self")},
          defaultDate: $j.datepicker.parseDate("dd-mm-yy", "{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}"),
					showOn: 'button',
					buttonImage: '/css/core/ui/images/calendar-icon.gif',
					buttonImageOnly: true,
					showAnim: 'slideDown'
        });

      });
            </script>

      <div id="calendar">
	  	  <center>
          <table id="month-nav">
            <tr>
              <td>
            <!-- BEGIN month_drop -->
            <!-- END month_drop -->
            <!-- BEGIN year_drop -->
            <!-- END year_drop -->
            <!-- BEGIN week_block -->
            <!-- END week_block -->
              </td>
            </tr>
          </table>
      </center>

	  	<table cellpadding="0" class="{MONTABLE_CSS}" cellspacing="0" width="98%">
			<tr>
				<td colspan="2"class="cal-left">
					<a class="back" href="/calendar/week/{BACK}" title="Back one month"><strong>&lt;&lt;</strong></a>
					<div class="datepicker-box"><input type="hidden" class="datepicker" /></div>
					<a class="forward" href="/calendar/week/{FORWARD}" title="Forward one month"><strong>&gt;&gt;</strong></a>
				</td>
				
				<td colspan="3"><h3>{WEEK} {MONTH}</h3></td>
				
				<td colspan="2"class="cal-right">
					<a class="customise" href="#">Week</a><a class="customise week" href="/calendar/month/{SELECTED_DAY}-{SELECTED_MONTH}-{SELECTED_YEAR}">Month</a>
				</td>
			</tr>
		</table>
		<!-- BEGIN day_block -->
		<table id="week-view" class="{MONTABLE_CSS}" cellpadding="0" cellspacing="0">

				<td class="day-block">

						<p>{DATE}</p>
						<p class="header_option">{ADD}</p>
					   <div class='float-fix'></div>
					</div> 
				</td>
			</tr>
			<tr>
				<td class="noteWrap">
					<!-- BEGIN note_block -->
					<!-- BEGIN time -->
					<span class="time">{TIME}</span>
					<!-- END time -->
					<p style="background-color:{COLOUR};">{NOTE}<span class="modify">{MODIFY}</span></p>
					<!-- END note_block -->
				</td>
			</tr>
		</table>
