<script type='text/javascript'>	
$j(function() {
    $j('#nav ul').droppy({speed: 0});
	$j('#nav li.parent > a span').each(function() {
		$j(this).append('<strong>&rsaquo;</strong>');
	});
	$j('#search-field').focus(function() {
		$j(this).attr('value', "");
	});
	$j('#search-field').blur(function() {
		if($j(this).attr('value') == "") {
			$j(this).attr('value', "search");
		}
	});
	

});
</script>
