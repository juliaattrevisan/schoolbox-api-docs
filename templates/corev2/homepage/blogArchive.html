<script type="text/javascript">
$j(document).ready(function() {
    $j('.blogPost').hide();
    
    $j('.blogArchiveNav').click(function() {
        var showClass =  $j(this).attr('rel');

        $j('.' + showClass).toggle();
    });
});
</script>
<style type="text/css">
a.blogArchiveNav {
    cursor: pointer;
}
</style>
<h1>Blog Archive for {CATEGORY_NAME}</h1>

<span class="header_option"><!-- BEGIN submit_blog --><a href="/blog/modify/new/{ID}">Post Blog</a> | <!-- END submit_blog -->
 <a href="/homepage/{ID}">Return to Homepage</a></span>

<ul class="blogArchive">
    <!-- BEGIN year -->
    <li>{YEAR}
        <ul>
            <li>
                <!-- BEGIN month -->
                <!-- BEGIN monthLink -->
                <p>
                    <a class="blogArchiveNav" rel="blog_{YEAR}_{MONTH}">{MONTH}</a>
                </p>
                <!-- END monthLink -->
                <div class="blogPost blog_{YEAR}_{MONTH}">
                    <!-- BEGIN blog -->
                    <a name="{BLOG_ID}"></a>
                    <h2>{BLOG_HEADING}</h2>
                    <div class="indent">
                        {BLOG_BODY}
                        <hr>
                        <span class="element_footer">Posted by {EMAIL_CONTACT} on {POSTED_DATE} {MOD_BLOG}</span>
                    </div>
                    <!-- END blog -->
                </div>
                <!-- END month -->
            </li>
        </ul>
    </li>
    <!-- END year -->
</ul>
