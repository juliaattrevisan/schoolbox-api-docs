<!-- BEGIN custom_head -->
<script type="text/javascript">
$j(document).ready(function () {
	$j('#accountForm').submit(function (event) {
		
		event.stopPropagation();
		
		var current = $j('#current_password').val(), password = $j('#new_password').val(), confirmp = $j('#confirm_password').val(), msg = ''; 
		if (current == '')
			msg += 'You must enter your current password.\n';
		
		if (password.length < 6)
			msg += 'Your new password must be at least 6 characters long.\n';
		
		if (password != confirmp)
			msg += 'The new and confirmation passwords you entered do not match.';
		
		if (msg == '') {
			return true;
		} else {
			alert(msg);
			return false;
		}
	});
});
</script>
<!-- END custom_head -->

<h1>Change Password</h1>

<!-- BEGIN success -->
<p>Your password was changed successfully</p>
<!-- END success -->

<form id="accountForm" class="standardForm" method="post" action="/account/modifyForm.php">
  <table>
    <tr>
      <td><h3>Current Password</h3>
        <em></em></td>
      <td><input type="password" name="current_password" id="current_password" size="35" maxlength="50" /></td>
    </tr>
    <tr>
      <td><h3>New Password</h3>
        <em>Your new password must be at least 6 characters in length.</em></td>
      <td><input type="password" name="new_password" id="new_password" size="35" maxlength="50" /></td>
    </tr>
    <tr>
      <td><h3>Confirm New Password</h3>
        <em>Enter your new password again to confirm you typed it correctly.</em></td>
      <td><input type="password" name="confirm_password" id="confirm_password" size="35" maxlength="50" /></td>
    </tr>
    <tr class="pedantic">
      <td>&nbsp;</td>
      <td><input class="btn" type="submit" name="submit" value="Modify" /></td>
    </tr>
  </table>
</form>
