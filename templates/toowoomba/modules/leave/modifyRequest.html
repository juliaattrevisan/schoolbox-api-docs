<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.warninglength.js"></script>
<script type="text/javascript">
    $(function () {
        $('input[data-datepicker]').datepicker({
            constrainInput: false,
            minDate: new Date(),
            onClose: function (string) {
                var input = $(this);
                $.getJSON('/ajax/strtotime.php', {string: string}, function (data) {
                    input.val(data.time);
                })
            }
        });

        $('form[data-validate]').validate();

        // Hide host details if "self" is selected
        $('[data-relation="host_type_selector"]').change(function(){
            var details = $('[data-relation="host_type_field"]');
            if(($(this).val() == '4')){
                details.slideUp();
            } else {
                details.slideDown();
            }
        });

        $('[data-warninglength]').warninglength({
            messagePrototype: $('<label class="warning" />')
        });

        // Confirmation of delete button
        $('[data-action="delete"]').click(function(event) {
            event.preventDefault();
            var element = $(this);
            $(this).confirmDialog({
                confirmEvent: function() {
                    // Build a hidden input with the delete button's name/val,
                    // then submit
                    var form = element.closest('form');
                    form.append(
                            $('<input type="hidden" />')
                                    .attr('name', element.attr('name'))
                                    .val(element.val())
                    ).submit()
                }
            });
        })
    });
</script>
<!-- END custom_head -->

<span class="header-actions">
    <a class="button icon-menu" href="#" data-dropdown="newsOptions">Options</a>
</span>
<ul class="f-dropdown fadeInDown" data-dropdown-content="" id="newsOptions">
    <!-- BEGIN next_pending -->
    <li/><a class="icon-next" href='/modules/leave/modify/{NEXT_PENDING_ID}'><span></span>Next Pending</a></li>
    <!-- END next_pending -->
    <!-- BEGIN prev_pending -->
    <li><a class="icon-previous" href='/modules/leave/modify/{PREV_PENDING_ID}'><span></span>Previous Pending</a></li>
    <!-- END prev_pending -->
    <li><a class="icon-up" href='/modules/leave/house/{USER_HOUSE_ID}'><span></span>Back to list</a></li>
</ul>

<h1>Leave Request: {USER_NAME}, Year {USER_YEAR}, {USER_HOUSE}</h1>

<form method="post" action="/modules/leave/processModify" data-validate>
    <fieldset>
        <legend>Student</legend>
        <div class="large-6 columns">
            <dl>
                <dt>Name</dt>
                <dd>{USER_NAME}</dd>
            </dl>
        </div>
        <div class="large-6 columns">
            <label for="requestuserPhone">Phone</label>
            <input type="text" name="request[userPhone]" value="{REQUEST_USER_PHONE}" id="requestuserPhone" required />
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Status</legend>
        <div class="large-12 columns">
            {REQUEST_STATUS}
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Requested By</legend>
        <div class="large-12 columns">
            {AUTHOR_NAME}
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Leaving</legend>
        <div class="large-8 columns">
            <label for="startDate">Date</label>
            <input name="request[start][date]" id="startDate" type="text" required data-datepicker value="{REQUEST_START_DATE}" />
        </div>
        <div class="large-4 columns">
            <label for="startTime">Time</label>
            <select name='request[start][time]' id="startTime">
                <!-- BEGIN request_start_time -->
                <option value='{REQUEST_START_TIME_VALUE}' {REQUEST_START_TIME_SELECTED}>{REQUEST_START_TIME_LABEL}</option>
                <!-- END request_start_time -->
            </select>
        </div>
    </fieldset>

    <fieldset class="large-6 columns">
        <legend>Returning</legend>
        <div class="large-8 columns">
            <label for="finishDate">Date</label>
            <input name="request[finish][date]" id="finishDate" type="text" required data-datepicker value="{REQUEST_FINISH_DATE}" />
        </div>
        <div class="large-4 columns">
            <label for="finishTime">Time</label>
            <select name='request[finish][time]' id="finishTime">
                <!-- BEGIN request_finish_time -->
                <option value='{REQUEST_FINISH_TIME_VALUE}' {REQUEST_FINISH_TIME_SELECTED}>{REQUEST_FINISH_TIME_LABEL}</option>
                <!-- END request_finish_time -->
            </select>
        </div>
    </fieldset>

    <fieldset>
        <legend>Host</legend>
        <div class="large-6 columns">
            <label for="requesthostType">Type</label>
            <select name="request[hostType]" id="requesthostType" data-relation="host_type_selector">
                <!-- BEGIN host_type -->
                <option value="{HOST_TYPE_VALUE}" {HOST_TYPE_SELECTED}>{HOST_TYPE_LABEL}</option>
                <!-- END host_type -->
            </select>
        </div>
        <div class="large-3 columns" data-relation="host_type_field">
            <label for="requesthostName">
                <span data-tooltip aria-haspopup="true" class="has-tip"
                      title="The host will need to confirm your leave arrangements; you can forward them the email you receive.">
                    Name
                </span>
            </label>
            <input type="text" name="request[hostName]" value="{REQUEST_HOST_NAME}" id="requesthostName" required />
        </div>
        <div class="large-3 columns" data-relation="host_type_field">
            <label for="requesthostAddress">
                <span data-tooltip aria-haspopup="true" class="has-tip"
                      title="The host's address during the leave period">
                    Address
                </span>
            </label>
            <textarea name="request[hostAddress]" id="requesthostAddress">{REQUEST_HOST_ADDRESS}</textarea>
        </div>
        <div class="large-6 columns" data-relation="host_type_field">
            <label for="requesthostPhone">Phone</label>
            <input type="text" name="request[hostPhone]" value="{REQUEST_HOST_PHONE}" id="requesthostPhone" required />
        </div>
        <div class="large-6 columns" data-relation="host_type_field">
            <label for="requesthostMobile">Mobile</label>
            <input type="text" name="request[hostMobile]" value="{REQUEST_HOST_MOBILE}" id="requesthostMobile" required />
        </div>
    </fieldset>

    <fieldset>
        <legend>Other Information</legend>
        <div class="large-6 columns">
            <label for="requestTravelType">Travel Method</label>
            <select name="request[travelType]" id="requestTravelType">
                <!-- BEGIN travel_drop -->
                <option value="{TRAVEL_DROP_VALUE}" label="{TRAVEL_DROP_NAME}"  {TRAVEL_DROP_VALUE_SELECTED}>{TRAVEL_DROP_NAME}</option>
                <!-- END travel_drop -->
            </select>
        </div>
        <div class="large-6 columns">
            <label for="requestTravelType">
                <span data-tooltip aria-haspopup="true" class="has-tip"
                      title="Only complete for special leave information or travel arrangements">
                    Description
                </span>
            </label>
            <textarea id='description' name="request[description]" maxlength="100" data-warninglength="67">{REQUEST_DESCRIPTION}</textarea>
        </div>
        <div class="large-6 columns">
            <label for="requestCollectorName">Collector's Name</label>
            <input type="text" name="request[collectorName]" value="{REQUEST_RETURNER_NAME}" id="requestCollectorName" required />
        </div>
        <div class="large-6 columns">
            <label for="requestreturnerName">Returner's Name</label>
            <input type="text" name="request[returnerName]" value="{REQUEST_RETURNER_NAME}" id="requestreturnerName" required />
        </div>
        <div class="large-6 columns">
            <label for="requestReason">Reason For Leave</label>
            <textarea id="requestReason" name="request[reason]">{REQUEST_REASON}</textarea>
        </div>
        <div class="large-6 columns">
            <label for="requestNotes">Notes</label>
            <textarea id="requestNotes" name="request[notes]">{REQUEST_NOTES}</textarea>
        </div>
    </fieldset>

    <!-- BEGIN has_confirmed_by -->
    <fieldset>
        <legend>Confirmed by</legend>

        <div class="large-12 columns">
            <!-- BEGIN confirmed_by -->
            <input type='radio'
                   id="requestConfirmedBy{CONFIRMED_BY_VALUE}"
                   name='request[confirmedBy]'
                   value='{CONFIRMED_BY_VALUE}' {CONFIRMED_BY_SELECTED}
                    />
            <label for="requestConfirmedBy{CONFIRMED_BY_VALUE}" class="radio-label">{CONFIRMED_BY_LABEL}</label>
            <!-- END confirmed_by -->
        </div>
    </fieldset>
    <!-- END has_confirmed_by -->

    <input type="hidden" name="request[id]" value="{REQUEST_ID}">
    <button type="submit" name="modify" value="Modify">Modify</button>
    <button type="submit" name="delete" value="Delete" data-action="delete">Delete</button>
    <button type="submit" name="reject" value="Reject">Reject</button>
    <button type="submit" name="approve" value="Approve">Approve</button>
</form>
