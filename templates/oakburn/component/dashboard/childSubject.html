<div id='component{COMPONENT_INSTANCE_ID}' class='component-container {COMPONENT_CLASS}' data-component>
    <!-- Custom javascript -->

    {CONFIGURATION}

    <div class="row">
        <div class="small-12 island">
            <h2 class="subheader">{COMPONENT_NAME}</h2>

            <!-- BEGIN student_block -->
            <section class="actions-small-1">

                <div class="list-item">
                    <div class="card small-12">
                        <a href="/search/user/{STUDENT_ID}">
                            <img src="/portrait.php?userId={STUDENT_EXTERNAL_ID}&size=square64" title="View Profile" />
                            <h3>{STUDENT_NAME}</h3>
                        </a>
                        <p class="meta">Year {STUDENT_YEAR}</p>
                    </div>
                </div>

                <nav>
                    <a href="#" class="icon-more" data-dropdown="row-options-childsubject-{STUDENT_ID}" title="Actions" aria-expanded="false"></a>
                </nav>

                <ul class="f-dropdown" data-dropdown-content="" id="row-options-childsubject-{STUDENT_ID}" aria-hidden="true">
                    <!-- BEGIN due_work -->
                    <li><a class="icon-due-work" href="/learning/due/{STUDENT_ID}">Tasks/Assessments Due</a></li>
                    <!-- END due_work -->

                    <!-- BEGIN grades_button -->
                    <li><a class="icon-approve" href="/learning/grades/{STUDENT_ID}" title="View Assessments">Assessments</a></li>
                    <!-- END grades_button -->

                    <!-- BEGIN reports -->
                    <li><a class="icon-document" href="/user/profile/documents/reports/{STUDENT_ID}">Academic Reports</a></li>
                    <!-- END reports -->

                    <!-- BEGIN timetable -->
                    <li><a class="icon-timetable" href="/timetable/{STUDENT_ID}">Timetable</a></li>
                    <!-- END timetable -->

                    <!-- BEGIN pastoral -->
                    <li><a class="icon-pastoral" href="/pastoral/student/{STUDENT_ID}">{TPL_LOCAL_PASTORALCARE_PC}</a></li>
                    <!-- END pastoral -->

                    <!-- BEGIN eportfolio -->
                    <li><a class="icon-eportfolio" href="/eportfolio/{STUDENT_ID}/profile">ePortfolio</a></li>
                    <!-- END eportfolio -->

                    <li><a class="icon-calendar" href="/calendar/full/{CAL_TODAY_DATE}/{STUDENT_ID}">{TPL_LOCAL_CALENDAR_PC}</a></li>

                </ul>

                <ul class="action-list">
                    <!-- BEGIN subject_block -->
                    <li>
                        <div class="compact card small-12">
                            <div class="icon-home" title="Visit Homepage"></div>
                            <a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a>
                        </div>
                    </li>
                    <!-- END subject_block -->
                </ul>

            </section>
            <!-- END student_block -->
        </div>
    </div>
</div>
