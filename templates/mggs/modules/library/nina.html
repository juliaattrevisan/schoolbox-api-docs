<script type="text/javascript" src="/javascript/components/jquery-cycle/jquery.cycle.all.js"></script>
<script type="text/javascript">

$(function() {
	//autoclear the catalogue search
	$('#library-search-field').placeholder();
	$('#galleryCycle').children('div:not(:first-child)').each(function() {
		$(this).hide();
	});
		
});


$(window).load(function(){
	$('#galleryCycle').cycle({
        cleartype: true,
        cleartypeNoBg: true,
        before: function() {
            $('#galleryCycle span').slideUp();
        },
        after: function() {
            $('span', this).slideDown();
        }
    });
});


$(window).resize(function() {

});

	

</script>
