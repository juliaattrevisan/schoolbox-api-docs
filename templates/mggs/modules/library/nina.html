<script type="text/javascript">
	
	$j(function() {
		//in order for the boxes to complete their height adjustments effectively.
		$j('tr td:first-child').each(function() {
			var oneHeight = $j(this).height();
			$j(this).children('.library-box').height(oneHeight - 48);
			$j(this).next().children('.library-box').height(oneHeight - 48);
		});
		
		//autoclear the catalogue search
		$j('#library-search-field').autoclear();
			
	});

</script>

<div id="nina">
	
	<table class="library-boxes" height="100%" >
