<script type="text/javascript" src="/javascript/jquery.cycle.js"></script>
<script type="text/javascript">
	
$j(function() {
    //in order for the boxes to complete their height adjustments effectively.
    $j('tr td:first-child').each(function() {
        var oneHeight = $j(this).height();
        $j(this).children('.library-box').css("min-height", oneHeight - 41);
        $j(this).next().children('.library-box').css("min-height",oneHeight - 41);
    });

    //autoclear the catalogue search
    $j('#library-search-field').autoclear();

    $j('.community').height($j('.taller').innerHeight() -41);

    $j('#galleryCycle').children('div:not(:first-child)').each(function() {
		$j(this).hide();
	});
});

$j(window).load(function(){
	$j('#galleryCycle').cycle({
        cleartype: true,
        before: function() {
            $j('#galleryCycle span').slideUp();
        },
        after: function() {
            $j('span', this).slideDown();
        }
    });
});




</script>
