<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/multifilecms.js"></script>
<script type="text/javascript">
	multi_selector = new MultiSelector();
</script>
<!-- END custom_head -->

<h1>Upload Multiple Files</h1>
<form method="post" enctype="multipart/form-data" id="fileForm"  onsubmit="return multi_selector.check();" action="/cms/fileForm.php">
	<table class="standardForm">
		<tr>
			<td class="formLabelWidth"><h4>Location</h4> <em>These files will be located in this folder</em>{CATEGORY_NAME}
				</td>
				<td><input name="category" value="{CATEGORY_ID}" type="hidden" /></td>
		</tr>
		<tr>
			<td><h4>Hidden</h4>
				<em>Hide these files from students.</em>
				</td>
			<td><input type='checkbox' name='hidden' value='1' /></td>
		</tr>
		<tr>
			<td><h4>Files</h4>
				<em>Each file must have a description and location, a new row will appear when these requirements are met</em>
				</td>
			<td><table>
					<thead>
						<tr>
							<td><h3>Description</h3></td>
							<td><h3>Location</h3></td>
							<td></td>
						</tr>
					</thead>
					<tbody id="files_list">
					</tbody>
				</table>
				<script type="text/javascript">
                multi_selector.init(document.getElementById('files_list'), {FILE_max_upload});
            </script></td>
		</tr>
	</table>
	<input type="submit" name="Submit" value="Upload Files" class="submit-btn-plain" />
	<div class="float-fix"></div>
</form>
