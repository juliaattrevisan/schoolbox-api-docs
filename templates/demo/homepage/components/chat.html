<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/stdfuncs.js"></script>
<script type="text/javascript" src="/javascript/chat.js"></script>
<script type="text/javascript">
$j(document).ready(function () {
    $j('#component{COMPONENT_HOMEPAGE_ID} form.chat-send a').click(function (event) {
        send_event(chat_obj);
    });

    $j('#component{COMPONENT_HOMEPAGE_ID} input[name="message"]').keydown(function (event) {
        if (event.keyCode == 13) {
            send_event(chat_obj);

            return false;
        }
    });

    var config = {
        category_id: '{ID}',
        component_id: '{CHAT_COMPONENT_ID}',
        user_id: '{CHAT_USER_ID}',
        name: {
            title: '{CHAT_NAME_TITLE}',
            firstname: '{CHAT_NAME_FIRSTNAME}',
            lastname: '{CHAT_NAME_LASTNAME}',
        },
        last_time: null
    }

    var render_messages = function (messages) {
        var messages_el = $j('#component{COMPONENT_HOMEPAGE_ID} ul.chat-messages');

        for (var i in messages) {
            var message_el = $j('<li></li>')

            messages[i].time = (new Date(messages[i].time)).toLocaleTimeString();

            if (messages[i].type == 'user') {
                messages[i].name = formatName(messages[i]);
                message_el.text(messages[i].name + ' [' + messages[i].time + ']: ' + messages[i].body);
            } else {
                message_el.text(messages[i].body);
            }

            console.log(this);

            message_el.addClass('chat-message-' + messages[i].type);
            messages_el.append(message_el);
        }
    }

    var render_users = function (users) {
        var chat_users_el = $j('#component{COMPONENT_HOMEPAGE_ID} ul.chat-users');

        chat_users_el.empty();

        for (var i = 0; i < users['active'].length; i++) {
            user_el = $j('<li></li>').text(formatName(users['active'][i]));

            if (users['mute'][i]) {
                user_el.addClass('chat-mute');
            }

            chat_users_el.append(user_el);
        }
    }

    var chat_obj = new Chat(config, render_messages, render_users);
});

function send_event (chat_obj) {
    var message = $j('#component{COMPONENT_HOMEPAGE_ID} input[name="message"]');

    var data = {
        messages: {
            0: {
                title: chat_obj.config.name.title,
                firstname: chat_obj.config.name.firstname,
                lastname: chat_obj.config.name.lastname,
                type: 'user',
                time: (new Date()).toString(),
                body: message.val()
            }
        }
    }

    chat_obj.send(data);
    message.val('');

    return false;
}
</script>
<!-- END custom_head -->

<div class="box chat" id="component{COMPONENT_HOMEPAGE_ID}">
    <h2>Chat</h2>
	<!-- BEGIN config -->
	<a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
<a class="close-delete" href="#"><span>X</span></a>
	<div class="editPanel settings hide">
		<form action="/homepage/configForm.php" method="get">
			<input type="hidden" name="cid" value="{ID}" />
			<input type="hidden" name="type" value="config" />
            <input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
            <input type="hidden" name="state" value="{COMPONENT_CONFIG_STATE}" />
            <select name="state">
                <!-- BEGIN chat_state -->
                <option value="{COMPONENT_CONFIG_CHAT_STATE}"{COMPONENT_CONFIG_CHAT_STATE_SELECTED}>{COMPONENT_CONFIG_CHAT_STATE}</option>
                <!-- END chat_state -->
            </select>
            <input type="hidden" name="teacher_timestamp" value="{COMPONENT_CONFIG_TEACHER_TIMESTAMP}" />
            <input type="submit" value="Update" class="submit-btn update" />
    </form>
  </div>
<div class="editPanel delete-it hide">
<p>Are you sure you want to delete?</p>
<form action="#" method="post">
  <input type="hidden" name="cid" value="{ID}" />
  <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
    <input type="hidden" name="component" value="{COMPONENT_ID}" />
    <a href="#" class="delete-accept btn delete"><span></span>Yes</a>
    <a href="#" class="delete-reject btn go-to"><span></span>No</a>
</form>
<div class="float-fix"></div>
</div>
	<!-- END config -->
    <div class="chat-box">
        <ul class="chat-users">
        </ul>
        <ul class="chat-messages">
        </ul>
        <form action="#" method="post" class="chat-send">
            <p class="interact"><input name="message" type="text"/><a href="#" class="btn up-arrow"><span></span>Send</a></p>
        </form>
    </div>
    <div class="chat-error hide"></div>
</div>
