<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
  <h2>Forum</h2>
<!-- BEGIN config -->
  <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
<a class="close-delete" href="#"><span>X</span></a>
  <div class="editPanel settings hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
      
      <label for="sort">Sort: </label>
      <select name="sort">
        <!-- BEGIN sort -->
        <option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
        <!-- END sort -->
      </select>
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>      <input type="submit" value="Update" class="submit-btn update" />
    </form>
  </div>
	<div class="editPanel delete-it hide">
		<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
		  <input type="hidden" name="cid" value="{ID}" />
		  <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
                  <input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
		<div class="float-fix"></div>
	</div>
<!-- END config -->
  <div class="text listing">
  	<ul>
    	<!-- BEGIN forum -->
      <li class="{ON_OFF}">
      <h4><a href="/forum/thread/{THREAD_ID}">{THREAD_TITLE}</a></h4>
      <!-- BEGIN forum_reply -->
      <p class="interact"><a href="/forum/modify/{ID}/{THREAD_ID}">Reply</a></p><!-- END forum_reply -->
      <div class="float-fix"></div>
      <p class="small hide-on-small">Posted by <a href="/search/user/{THREAD_USER_ID}">{THREAD_USER}</a> {THREAD_DATE}</p>
      <div class="float-fix"></div>
      </li>
      <!-- END forum -->
    </ul>
  </div>
  <p class="interact"><a href="/forum/{ID}" class="btn go-to"><span></span>Go to Forum</a></p>
</div>
