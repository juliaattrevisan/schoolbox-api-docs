<script type="text/javascript" src="/javascript/jquery.cycle.js"></script>
<script type="text/javascript">
$j(function(){
    $j('#galleryCycle').cycle({
        cleartype: true,
        before: function() {
            $j('#galleryCycle span').slideUp();
        },
        after: function() {
            $j('span', this).slideDown();
        }
    });
});
</script>

<style type="text/css">
#galleryCycle img {
	display: block;
}

#galleryCycle {
	border: 1px solid #dbdbdb;
    margin: 10px auto;
}

#galleryCycle div {
	position: relative;
}

#galleryCycle span {
	background: #576369;
	color: #fff;
	display: none;
	width: 100%;
	position: absolute;
	bottom: 0;
	left: 0;
	padding: 10px 0;
	text-decoration: none;
	opacity: 0.9;
	text-indent: 10px;
}
</style>

<div class="box" id="component{COMPONENT_HOMEPAGE_ID}">
    <h2>Image Scroller</h2>
    <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
<a class="close-delete" href="#"><span>X</span></a>
        <div class="editPanel settings hide">
            <form action="/homepage/configForm.php" method="get">
                <input type="hidden" name="cid" value="{ID}" />
                <input type="hidden" name="type" value="config" />
                <input type="hidden" name="component" value="{COMPONENT_HOMEPAGE_ID}" />
                <label for="url">Pixels:</label>
                <input type="text" name="pixel" value="{COMPONENT_PIXEL}" size="4"/>      <input type="submit" value="Update" class="submit-btn update" />
    </form>
  </div>
	<div class="editPanel delete-it hide">
		<p>Are you sure you want to delete?</p>
		<form action="#" method="post">
		  <input type="hidden" name="cid" value="{ID}" />
		  <input type="hidden" name="delete" value="{COMPONENT_HOMEPAGE_ID}" />
                  <input type="hidden" name="component" value="{COMPONENT_ID}" />
			<a href="#" class="delete-accept btn delete"><span></span>Yes</a>
			<a href="#" class="delete-reject btn go-to"><span></span>No</a>
		</form>
		<div class="float-fix"></div>
	</div>
    </a>

    <div id="galleryCycle" class="box">
        <!-- BEGIN image -->
        <div><img src="/cms/image.php?id={IMAGE_ID}&height={IMAGE_DIMENSION}&width={IMAGE_DIMENSION}" /><span>{IMAGE_NAME}</span></div>
        <!-- END image -->
    </div>

  <!-- BEGIN submit_image -->
  <p class="interact"><a href="/cms/file/new/{ID}" class="btn up-arrow"><span></span>Post Image</a></p>
  <!-- END submit_image -->
</div>
