<!-- BEGIN custom_head -->
<script type="text/javascript">
	$j(function(){
	
		$j('#forum-topic tbody tr:even td').css('background-color', '#f4f4f4');
		
		$j('button.reply').click(function () {
			window.open('/forum/modify/{CATEGORY_ID}/{THREAD_ID}', '_self', '');
			return false;
		});
		
		$j('button.lock').click(function () {
			window.open('/forum/modifyForm.php?toggleLock={THREAD_ID}', '_self', '');
			return false;			
		});

		$j('button.delete').click(function () {
			if (confirm('Are you sure you want to delete this thread?'))
				window.open('/forum/modifyForm.php?deleteThread={THREAD_ID}', '_self', '');
			return false;			
		});
		
		$j('a.delete').click(function () {
			if (confirm('Are you sure you want to delete this post?'))
				window.open($(this).attr('href'), '_self', '');
			return false;
		});
		
		if ($j('.post').length !== 1) {
			$j('.post:last').css("border", "0")
		}
		
	});
</script>
<!-- END custom_head -->
<div class="breadcrumbs navhelp">
	<p><a href="/homepage/{CATEGORY_ID}/">{CATEGORY}</a> > <a href="/forum/{CATEGORY_ID}/">Forum</a> > {THREAD_TITLE} {LOCKED}</p>
</div>
<!-- BEGIN reply -->
<button class="reply submit-btn-plain">Post Reply</button> 
<!-- END reply -->
<!-- BEGIN modify_thread -->
<button class="lock submit-btn-plain">{LOCK_UNLOCK} Thread</button>
<button class="delete submit-btn-plain">Delete Thread</button>
<!-- END modify_thread -->
<div class="float-fix"></div>
<div class="forum">
  	<!-- BEGIN post -->
	<div class="post">
    	<div class="post-left">
		<div class="post-content">
			<a name="{POST_ID}"></a>
      		<p><a href="/search/user/{POST_USER_ID}">{POST_AUTHOR}</a><br />
        	{POST_GROUP}</p>
		
		
			 <p><!-- BEGIN reply_post -->
			<a href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/0/{POST_ID}">Reply to this post</a><br />
			<!-- END reply_post -->
			<!-- BEGIN modify -->
			<a href="/forum/modify/{CATEGORY_ID}/{THREAD_ID}/{POST_ID}">Edit post</a> |
			<a href="/forum/modifyForm.php?deletePost={POST_ID}" class="delete">Delete post</a><br /> <!-- END modify -->
			Posted {POST_TIME}
			<!-- BEGIN modified --><br /> edited {POST_MODIFIED} {POST_CENSORED}<!-- END modified --></p>
		</div>
		</div>
		<div class="post-right">
			<div class="post-content">
       		 {POST_BODY}
			</div>
		</div>
		<div class="float-fix"></div>
		 </div> 
    <!-- END post -->
 </div>
<p><a name="bottom"></a>
{reply_block}
{modify_thread_block}
</p>

<div class="pagination navhelp">
	<!-- BEGIN previous_button -->
    <a href="/forum/thread/{THREAD_ID}/{PREVIOUS_PAGE}">&lt; Prev</a>
    <!-- END previous_button -->
    <!-- BEGIN page_number -->
    <a class="{CURRENT}" href="/forum/thread/{THREAD_ID}/{PAGE_INDEX}">{PAGE_INDEX}</a>
    <!-- END page_number -->
    <!-- BEGIN next_button -->
    <a href="/forum/thread/{THREAD_ID}/{NEXT_PAGE}">Next &gt;</a>
	<!-- END next_button -->
</div>
