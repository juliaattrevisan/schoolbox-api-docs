<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.datepicker.js"></script>
<link rel="stylesheet" type="text/css" href="/css/demo/jquery-ui.css" />

<script type="text/javascript">
    $j(document).ready(function() {
		
		/* date picker */		 
		$j('#start_date').datepicker({ 
			dateFormat: 'dd/mm/yy',
			showOn: 'button',
			buttonImage: '/images/demo/calendar/calendar-click.png',
			buttonImageOnly: true,
		});
		
	
		$j('#finish_date').datepicker({ 
			dateFormat: 'dd/mm/yy',
			showOn: 'button',
			buttonImage: '/images/demo/calendar/calendar-click.png',
			buttonImageOnly: true,
		});
    });
</script>
<!-- END custom_head -->

<h1>Create Assessment</h1>
<form name="create" action="/assess/create/" class="standardForm" method="post">
    <table>
        <tr>
            <td class="formLabelWidth"><h4>Title</h4><input name="title" type="text" size="35" maxlength="50" /></td>
        </tr>
        <tr>
            <td><h4>Start</h4>  <select name="start[hour]">
                    <option>12</option>
                </select>
                <select name="start[minute]">
                    <option>00</option>
                </select>
                <select name="start[meridiem]">
                    <option selected>am</option>
                    <option>pm</option>
                </select>
                <input name="start[date]" id="start_date" type="text" size="15" maxlength="10" value="{START_DATE}" />
                </td>

        </tr>
        <tr>
            <td><h4>Finish</h4> <select name="finish[hour]">
                    <option>12</option>
                </select>
                <select name="finish[minute]">
                    <option>00</option>
                </select>
                <select name="finish[meridiem]">
                    <option selected>am</option>
                    <option>pm</option>
                </select>
                <input name="finish[date]" id="finish_date" type="text" size="15" maxlength="10" value="{FINISH_DATE}" />
                </td>
        </tr>
        <tr>
            <td><h4>Duration</h4> <select name="duration[hour]">
                    <option value="0">hh</option>
                </select>
                <select name="duration[minute]">
                    <option value="0">mm</option>
                </select></td>

        </tr>
        <tr>
            <td><h4>Description</h4><textarea name="description" style="width: 100%;height: 250px;"></textarea></td>
        </tr>
    </table>
	<input type="submit" name="create" value="Create Assessment" class="submit-btn-plain"/>
</form>
