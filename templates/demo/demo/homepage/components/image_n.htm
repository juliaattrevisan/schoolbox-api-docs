<div class="box imageComp" id="component{COMPONENT_ID}">
  <h2>{IMAGE_TITLE}</h2>
  <!-- BEGIN config -->
    <a class="edit" href="#"><em>Settings</em> <span>&#9660;</span></a>
    <div class="editPanel hide">
      <form action="/homepage/configForm.php" method="get">
        <input type="hidden" name="cid" value="{ID}" />
        <input type="hidden" name="type" value="config" />
        <input type="hidden" name="component" value="{COMPONENT_ID}" />
        <label for="url">URL:</label>
        <input type="text" name="url" value="{COMPONENT_CONFIG_URL}" size="25"/>
        <label for="image">Image: </label>
        <select name="image">
          <!-- BEGIN image -->
          <option value="{COMPONENT_CONFIG_IMAGE}"{COMPONENT_CONFIG_IMAGE_SELECTED}>{COMPONENT_CONFIG_IMAGE}</option>
          <!-- END image -->
        </select>
        <label for="url">Pixels:</label>
      	<input type="text" name="pixel" value="{COMPONENT_CONFIG_PIXEL}" size="4"/>
        <input type="submit" value="Update" class="submit-btn update"/>
      </form>
    </div>
  <!-- END config -->
  <!-- BEGIN previewimage -->
  <div class="text">
    {CONTENT_URL_START}<img src="{PREVIEW_IMAGE_URL}" alt="{PREVIEW_IMAGE_DESC}" />{CONTENT_URL_END}
  </div>
  <!-- END previewimage -->
  <!-- BEGIN submit_image -->
  <p class="interact"><a href="/cms/file/new/{ID}" class="btn up-arrow"><span></span>Post Image</a></p>
  <!-- END submit_image -->
</div>
