<!-- BEGIN custom_head -->
<script language="JavaScript" type="text/javascript">
function verify(){
	var msg = ""

	/* Check that a folder name has been entered
     */
    if ($j('#folderForm').find('input[name=name]').val() == '') {
        msg += "You neeed to enter a folder name\n";
    }

    var parentFolder = $j('#folderForm').find('select[name=parent]').val();

	if (parentFolder == '' || isNaN(parentFolder)) {
		msg += 'You need to select a proper location';
	}
    
	if (msg != ''){
		alert(msg);
        
		return false;
	}
	else {
		return true;
    }
}
</script>
<!-- END custom_head -->

<h1>{ACTION} Folder</h1>
<form action="/cms/myFolderForm.php" method="post"  id="folderForm" onSubmit="return(verify());">
<input type="hidden" name="parent" id="parent" value="{PARENT_ID}" />
  <table class="standardForm">
    <tr>
      <td class="formLabelWidth"><h4>Folder Name</h4><input type="text" name="name" maxlength="250" size="40" value="{NAME}" /></td>
    </tr>
    <!-- BEGIN location -->
    <tr>
      <td><h4>Folder Parent</h4>
        <em>Location at which this folder should be placed</em>
		<select name="parent">
          <!-- BEGIN parent_list -->
          <option value="{PARENT_ID}" {PARENT_SELECTED}>{PARENT_INDENT}&gt; {PARENT_NAME}</option>
          <!-- END parent_list -->
        </select></td>
    </tr>
    <!-- END location --> 
  </table>
  <input type="hidden" name="folderID" value="{FOLDER_ID}" /> 
  <input type="submit" label="Submit" name="submit" value="{ACTION} Folder" class="submit-btn-plain"/>
  <div class="float-fix"></div>
</form>
