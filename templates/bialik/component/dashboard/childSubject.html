<div class="student-subjects">
    <div class="row">
        <div class="small-12 island">
            <!-- BEGIN student_block -->
            <h2 class="subheader"><a href="/search/user/{STUDENT_ID}">{STUDENT_NAME}, Year {STUDENT_YEAR}</a></h2>
            <section>
                <div class="avatar card wrap-down">
                    <a href="/search/user/{STUDENT_ID}">
                        <img src="/portrait.php?userId={STUDENT_EXTERNAL_ID}&size=constrain128" alt="{STUDENT_NAME}"/>
                    </a>
                    <ul class="no-bullet">
                        <!-- BEGIN subject_block -->
                        <li><h3><a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a></h3></li>
                        <!-- END subject_block -->
                    </ul>
                </div>
                <div class="content">
                    <!-- BEGIN timetable -->
                    <a href="/timetable/{STUDENT_ID}" class="button icon-timetable">Timetable</a>

                    <a href="/calendar/full/{CAL_TODAY_DATE}/{STUDENT_ID}" class="button icon-calendar">Calendar</a>

                    <!-- BEGIN due_work -->
                    <a href="/submission/dueWork/0/{STUDENT_ID}" class="button icon-due-work">Due Work</a>
                    <!-- END due_work -->

                    <!-- BEGIN grades_button -->
                    <a href="/submission/allWork/{STUDENT_ID}" class="button icon-approve" title="View grades">Grades</a>
                    <!-- END grades_button -->

                    <!-- BEGIN eportfolio -->
                    <a href="/eportfolio/{STUDENT_ID}/profile" class="button icon-eportfolio">ePortfolio</a>
                    <!-- END eportfolio -->

                    <a href="/modules/report/bialik/parents?searchYear={STUDENT_YEAR}" class="button icon-class-list">Class Lists</a>

            </section>
            <!-- END student_block -->
