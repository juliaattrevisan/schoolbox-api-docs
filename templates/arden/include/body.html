<head>
<title>{TITLE}</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Content-Language" content="en-au" />
<meta name="author" content="Alaress Pty Ltd"/>
<link rel="apple-touch-icon" href="/images/{SITE_LOCATION}/apple-touch-icon-iphone.png"/>
<link rel="apple-touch-icon" sizes="76x76" href="/images/{SITE_LOCATION}/apple-touch-icon-ipad.png">
<link rel="apple-touch-icon" sizes="120x120" href="/images/{SITE_LOCATION}/apple-touch-icon-iphone-retina.png">
<link rel="apple-touch-icon" sizes="152x152" href="/images/{SITE_LOCATION}/apple-touch-icon-ipad-retina.png">
{MAIN_HEADER_REGION}
{CUSTOM_HEADER_REGION}
</head>
<body>
<div id="wrap">
	<div id="wrap-inner">
		<div id="header">
            <div class="banner-top">
                <ul id="infoPanel">
                    <li class="user first avatar">
                        <a href="/search/user/{USER_ID}" title="View Profile" data-menu="account-menu">
                            <span>{SITE_LOGINNAME}</span>
                            <img height="32" width="32" alt="View Profile" src="/portrait.php?userId={EXTERNAL_ID}&size=square32"/>
                        </a>
                        <ul id="account-menu" class="flyout-menu">
                            <li>
                                <a href="/search/user/{USER_ID}">Profile</a>
                            </li>
                            <li>
                                <a href="/settings/messages">Settings</a>
                            </li>
                            <li>
                                <a href="/logout.php">Logout</a>
                            </li>
                        </ul>
                    </li>
                    {INSTANTMESSAGE_BLOCK}
                </ul>
                <form id="search" action="/search" method="get">
                    <fieldset>
                        <input id="search-field" type="text" name="keyword" placeholder="Search"/>
                        <input id="search-button" type="submit" value="Search"/>
                    </fieldset>
                </form>
            </div>
            {MAIN_BANNER_REGION}
			{MAIN_TAB_REGION}
        </div>
		{MAIN_NAV_REGION}
		<div id="container" class="clearfix">
			<div id="content" class="clearfix"> {MAIN_CONTENT_REGION} </div>
		</div>
	</div>
</div>
<div class="cal-bubble wysiwyg">
	<div class="middle">
		<div class="close">x</div>
		<div class="js-data clearfix"></div>
		<div class="bottom"><strong></strong></div>
	</div>
</div>
{MAIN_FOOTER_REGION}
{DEBUGBAR_HEAD}
{DEBUGBAR}
</body>
</html>
