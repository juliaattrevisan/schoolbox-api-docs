<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function () {
        $('.item:nth-child(2n)').addClass('dark');
    });
</script>
<!-- END custom_head -->


<h1>Notices</h1>

<!-- BEGIN add_news -->
<span class="header_option">
    <a class="btn add" href="/news/modify"><span></span>Add Notices</a>
</span>
<!-- END add_news -->

<div class="archive news clearfix">

    <ul class="admin-nav">
        <!-- BEGIN topic_header -->
        <li><a {TOPIC_CLASS} href="/news-archive/{TOPIC_CLEAN}" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
        <!-- END topic_header -->
    </ul>

    <div class="posts">
        <!-- BEGIN topic -->
        <div id="{TOPIC_CLEAN}">
            <ul id="a{NEWS_ID}" class="information-list">
            <!-- BEGIN news -->
                <li class="{ON_OFF}">
					<!-- BEGIN has_modify_button -->
					<span class="actions">
						<a href="/news/modify/{HAS_MODIFY_BUTTON_ITEM_ID}" class='btn no-text modify' title="Modify this News Post"><span></span></a>
					</span>
					<!-- END has_modify_button -->

					<h3><a href="/news/item/{NEWS_ID}">{NEWS_TITLE}</a></h3>

					<p class="meta">
						<a href="/search/user/{POSTER_ID}" class="author">
							<img class="icon" width="32" height="32" src="/portrait.php?userId={POSTER_EXTERNAL_ID}&size=square32" />
							{POSTER}
						</a><br />
						Posted {DATETIME}
                        <!-- BEGIN has_expiry -->
                        | {EXPIRY_VERB} on {EXPIRY_DATE}
                        <!-- END has_expiry -->
                        <!-- BEGIN has_publish_date -->
                        | Published on {PUBLISH_DATE}
                        <!-- END has_publish_date -->
					</p>
					<div class="wysiwyg">{NEWS_BODY}</div>
                </li>


            <!-- END news -->
            </ul>
        </div>
        <!-- END topic -->
    </div>


    <div class="menu">
		<!-- BEGIN year -->
		<h3 class="{YEAR_CLASS}">{YEAR}</h3>
		<ul class="admin-nav vertical">
			<!-- BEGIN month -->
			<li>
				<a class="{MONTH_CLASS}" href="/news-archive/{MENU_TOPIC_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
			</li>
			<!-- END month -->
		</ul>
		<!-- END year -->
    </div>

    <ul class="admin-nav foot">
        <!-- BEGIN previous_button -->
		<li><a class="prev" href="/news-archive/{PREVIOUS_PAGE}">&laquo; Prev</a></li>
		<!-- END previous_button -->
        <!-- BEGIN page_number -->
        <li><a class="number {CURRENT}" href="/news-archive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
		<!-- END page_number -->
        <!-- BEGIN next_button -->
		<li><a class="next" href="/news-archive/{NEXT_PAGE}">Next &raquo;</a></li>
		<!-- END next_button -->
    </ul>

</div>
