            <div class="row">

                    <a href="/search/user/{STUDENT_ID}" title="View Profile">
                        <img src="/portrait.php?id={STUDENT_ID}&size=constrain200" alt="View Profile" />
                    </a>

                    <h2 class="no-margin">{STUDENT_NAME}</h2>

                    <p class="meta">
                        Year {STUDENT_YEAR}
                    </p>

                    <ul class="information-list">

                        <li><a href="/homepage/code/{STUDENT_SUBJECT_CODE}">{STUDENT_SUBJECT_NAME}</a></li>

                    </ul>
                </div>

                <div class="small-12 large-8 columns">

                            <a class="achievement" href="/modules/custom/diocesan/achievementreport/{STUDENT_EXTERNAL_ID}">Achievement</a>

                        <!-- END grades_button -->

                            <a class="timetable" href="/timetable/{STUDENT_ID}">Timetable</a>
                        </li>
                        <!-- END timetable -->

                        <li>
                            <a class="attendance" href="/synergetic/attendances2?id={STUDENT_EXTERNAL_ID}">Attendance</a>
                        </li>

                        <!-- BEGIN due_work -->
                        <li>
                            <a class="duework" href="/learning/due/{STUDENT_ID}">{TPL_LOCAL_DUEWORK_PC}</a>
                        </li>

                        <li>
                            <a class="calendar" href="/calendar/{CAL_TODAY_DATE}/{STUDENT_ID}">Calendar</a>

                        <!-- END reports -->

                        <li>
                            <a class="pastoral" href="/pastoral/student/{STUDENT_ID}">{TPL_LOCAL_PASTORALCARE_PC}</a>
                        </li>
                        <!-- END pastoral -->

                        <li><a class="icon-{BUTTON_ICON} {BUTTON_CSS}" href="{BUTTON_HREF}" target="{BUTTON_TARGET}" title="{BUTTON_TITLE}">{BUTTON_TEXT}</a></li>
