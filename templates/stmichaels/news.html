<!-- BEGIN custom_head -->
<script type="text/javascript" src="/javascript/jquery.scrollTo.js"></script>
<script type="text/javascript">
    $j(function () {
        $j('.item:nth-child(2n)').addClass('dark');
    });
</script>
<!-- END custom_head -->

<!-- Was using {PAGE_TITLE} - SB-2689 -->
<h1>My News Feed</h1>

<!-- BEGIN add_news -->
<span class="header_option">
    <a class="btn add" href="/news/modify"><span></span>Add News</a>
</span>
<!-- END add_news -->

<div class="archive news clearfix">

    <ul id="category" class="clearfix">
        <!-- BEGIN topic_header -->
        <li><a {TOPIC_CLASS} href="/news-archive/{TOPIC_CLEAN}" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
        <!-- END topic_header -->
    </ul>

    <div class="posts">
        <!-- BEGIN topic -->
        <div id="{TOPIC_CLEAN}">
            <ul id="a{NEWS_ID}" class="blog listing">
            <!-- BEGIN news -->
                <li class="{ON_OFF}">
                <h3><a href="/news/item/{NEWS_ID}">{NEWS_TITLE}</a></h3>

                <!-- BEGIN has_modify_button -->
                <a href="/news/modify/{HAS_MODIFY_BUTTON_ITEM_ID}" class='btn modify'><span></span>Modify</a>
                <!-- END has_modify_button -->
                    <p class="author">
                        <a href="/search/user/{POSTER_ID}" class="author">
                            <img width="32" height="32" src="/portrait.php?userId={POSTER_EXTERNAL_ID}&size=square32"/>
                            <span class="name">{POSTER}</span>
                        </a>
                        <span class="subtitle">Posted {DATETIME}</span>
                        <!-- BEGIN has_expiry -->
                        <span class="subtitle">{EXPIRY_VERB} on {EXPIRY_DATE}</span>
                        <!-- END has_expiry -->
                        <!-- BEGIN has_publish_date -->
                        <span class="subtitle">Publishes on {PUBLISH_DATE}</span>
                        <!-- END has_publish_date -->
                    </p>

                    {NEWS_BODY}
                </li>


            <!-- END news -->
            </ul>
        </div>
        <!-- END topic -->
    </div>


    <div class="menu">
        <ul>
            <!-- BEGIN year -->
            <li class="{YEAR_CLASS}"><h3>{YEAR}</h3>
                <ul>
                    <!-- BEGIN month -->
                    <li>
                        <a class="{MONTH_CLASS}"
                           href="/news-archive/{MENU_TOPIC_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
                    </li>
                    <!-- END month -->
                </ul>
            </li>
            <!-- END year -->
        </ul>
    </div>

    <div class="pagination clearfix">
        <!-- BEGIN previous_button -->
        <a class="prev" href="/news-archive/{PREVIOUS_PAGE}">&laquo; Prev</a><!-- END previous_button -->
        <!-- BEGIN page_number -->
        <a class="number {CURRENT}" href="/news-archive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a><!-- END page_number -->
        <!-- BEGIN next_button -->
        <a class="next" href="/news-archive/{NEXT_PAGE}">Next &raquo;</a><!-- END next_button -->
    </div>

</div>
