<div class="box clearfix" id="component{COMPONENT_INSTANCE_ID}">
    <!-- BEGIN awardList -->
    <div class="awardList">
        <h2>My Awards</h2>
        <dl>
            <!-- BEGIN award -->
            <dt title="{AWARD_DESCRIPTION}">
                <span class="description">{AWARD_ACHIEVEMENT}</span>
                earned <time datetime="{AWARD_DATE}">{AWARD_DATE_LABEL}</time>
            </dt>
            <dd>{AWARD_COMMENT}</dd>
            <!-- END award -->
        </dl>
    </div>
    <!-- END awardList -->

    <!-- BEGIN detentionList -->
    <div class="detentionList">
        <h2>My Detentions</h2>
        <dl>
            <!-- BEGIN detention -->
            <dt>
                <span class="description">{DETENTION_DESCRIPTION}</span>
                on <time datetime="{DETENTION_DATE}">{DETENTION_DATE_LABEL}</time>
            </dt>
            <dd>{DETENTION_COMMENT}</dd>
            <!-- END detention -->
        </dl>
    </div>
    <!-- END detentionList -->

    <!-- BEGIN absenceList -->
    <div class="absenceList">
        <h2>My Absences</h2>
        <ul>
            <!-- BEGIN absence -->
            <li>
                <span class="description">{ABSENCE_DESCRIPTION}</span>
                for <span class="class" title="{CLASS_DESCRIPTION}">{CLASS_CODE}</span>
                on <time datetime="{DETENTION_DATE}">{DETENTION_DATE_LABEL}</time>
            </li>
            <!-- END absence -->
        </ul>
    </div>
    <!-- END absenceList -->
</div>
