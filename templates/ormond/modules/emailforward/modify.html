<div id="content">
	<div id="content_text">
		<h1>Change Email Forward</h1>

		<form action='modifyForm' method='post'>
			<input type='hidden' value='{UID}' name='uid'>
			<input type="hidden" name="uname" value="{USERNAME}">

			<label>
				Changing Email Address For: {USERNAME}
			</label>

			<label>
				Current Delivery Address: {EMAIL}
			</label>

			<label>
				New Address:
				<input type="text" name="emailad" size="50">(eg: {USERNAME}@ugrad.unimelb.edu.au)
			</label>

			<label>
				Ormond Password:
				<input type="password" name="password">
			</label>

			<label>
				<input type="submit" class='btn submit' value="Change Forward">
			</label>
		</form>
	</div>
</div>
