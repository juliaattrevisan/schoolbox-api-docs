<!-- BEGIN custom_head -->
<script type="text/javascript">
    $(function () {
        $('.item:nth-child(2n)').addClass('dark');
    });
</script>
<!-- END custom_head -->


<h1>Announcements</h1>

<!-- BEGIN add_news -->
<span class="header_option">
<a class="btn add" href="/news/modify"><span></span>Add News</a>
</span>
<!-- END add_news -->

<div class="archive news clearfix">

    <ul id="category" class="admin-nav">
        <!-- BEGIN topic_header -->
        <li><a {TOPIC_CLASS} href="/news-archive/{TOPIC_CLEAN}" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
        <!-- END topic_header -->
    </ul>

    <div class="menu">
		<!-- BEGIN year -->
		<h3 class="{YEAR_CLASS}">{YEAR}</h3>
		<ul class="admin-nav vertical">
			<!-- BEGIN month -->
			<li>
				<a class="{MONTH_CLASS}"
				   href="/news-archive/{MENU_TOPIC_CLEAN}/{YEAR}/{MONTH_NUMBER}">{MONTH}</a>
			</li>
			<!-- END month -->
		</ul>
		<!-- END year -->
    </div>

    <div class="posts">
        <!-- BEGIN topic -->
        <div id="{TOPIC_CLEAN}">
            <!-- BEGIN news -->
            <div id="a{NEWS_ID}" class="item">
                <h2><a href="/news/item/{NEWS_ID}">{NEWS_TITLE}</a></h2>
                
                <!-- BEGIN has_modify_button -->
                <a href="/news/modify/{HAS_MODIFY_BUTTON_ITEM_ID}" class='btn modify'><span></span>Modify</a>
                <!-- END has_modify_button -->
                
                <div class="wysiwyg"> {NEWS_BODY}
                    <p class="submitted-by">Submitted by <a href="/search/user/{POSTER_ID}" class="author"><span class="name">{POSTER}</span></a> on {DATETIME}</p>
                        <!-- BEGIN has_expiry -->
                        <span class="subtitle">{EXPIRY_VERB} on {EXPIRY_DATE}</span>
                        <!-- END has_expiry -->
                        <!-- BEGIN has_publish_date -->
                        <span class="subtitle">Publishes on {PUBLISH_DATE}</span>
                        <!-- END has_publish_date -->
                </div>
            </div>
            <!-- END news -->
        </div>
        <!-- END topic -->
    </div>

    <ul class="admin-nav foot">
        <!-- BEGIN previous_button -->
        <li><a class="prev" href="/news-archive/{PREVIOUS_PAGE}">&lsaquo; Prev</a></li>
		<!-- END previous_button -->
        <!-- BEGIN page_number -->
		<li><a class="number {CURRENT}" href="/news-archive/{PAGE_INDEX_REF}">{PAGE_INDEX}</a></li>
		<!-- END page_number -->
        <!-- BEGIN next_button -->
		<li><a class="next" href="/news-archive/{NEXT_PAGE}">Next &rsaquo;</a></li>
		<!-- END next_button -->
    </ul>

</div>
