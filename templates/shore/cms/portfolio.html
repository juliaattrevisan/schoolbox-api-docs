<!-- BEGIN custom_head -->
<script type="text/javascript">
$j(document).ready(function() {

	// define file context menu 
	var fileMenu = [
		{"Open": function () { 
			window.open("/send.php?id="+$j(this).attr("id").substring(5),"_blank"); 
		}},
		{"Save As": function () { window.open("/send.php?save=1&id="+$j(this).attr("id").substring(5),"_self"); }},
		$j.contextMenu.separator,
		{"Modify": function () {
			window.open("/cms/myFile/"+$j(this).attr("id").substring(5),"_self"); 
		}},
		{"Delete": function () {
			var _file = $j(this).find(".file");
			if (confirm("Delete this file?")) 
				window.open("/cms/myFileForm.php?delete="+$j(this).attr("id").substring(5),"_self");
		}},
		$j.contextMenu.separator,
		{"New File": function () { window.open("/cms/myFile/new/"+$j(this).data("category"),"_self"); }},
		{"New Folder": function () { window.open("/cms/myFolder/new/"+$j(this).data("category"),"_self"); }},

	];
	// define folder context menu
	var folderMenu = [
		{"Modify": function () { window.open("/cms/myFolder/"+$j(this).attr("id").substring(5),"_self"); }},
		{"Delete": function () { if (confirm("Delete this folder?")) window.open("/cms/myFolderForm.php?delete="+$j(this).attr("id").substring(5),"_self"); }},
		$j.contextMenu.separator,
		{"New File": function () { window.open("/cms/myFile/new/"+$j(this).attr("id").substring(5),"_self"); }},
		{"New Folder": function () { window.open("/cms/myFolder/new/"+$j(this).attr("id").substring(5),"_self"); }},
		$j.contextMenu.separator,
		{"Download": function () { window.open("/cms/fetchFolder.php?folder="+$j(this).attr("id").substring(5),"_self"); }},
	];

  function addContext(node) {
	if ($j(node).hasClass("folder"))
		$j($j(node).parents("tr")[0]).contextMenu(folderMenu);

	else if ($j(node).hasClass("file"))
		$j($j(node).parents("tr")[0]).contextMenu(fileMenu);
  }; 

	$j("#category-list, #file-list").treeTable({
		initialState: "collapsed",
		ajaxURL: "/cms/portfolioForm.php",
		resourcesID: "portfolioID",
		ajaxFileURL: "/cms/myFileForm.php",
		ajaxCategoryURL: "/cms/myFolderForm.php",
		addContext: addContext
	});
	
});
</script>
<style type="text/css">
	
	/* wrap mimetypes in classes */
	<!-- BEGIN allowed_files -->
	.treeTable span.file.{NAME} {
		background-image: url(/images/mime/{ICON});
	}
	<!-- END allowed_files -->
	
</style>
