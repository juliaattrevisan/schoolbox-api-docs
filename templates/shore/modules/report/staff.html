<script type="text/javascript"
        src="/javascript/jquery.qtip-1.0.0-rc3.min.js"></script>
<script type="text/javascript"
        src="/javascript/jquery.tablesorter.min.js"></script>
<script type="text/javascript">
    $j(function () {

        $j('.small-image').each(function () {
            var largerImage = $j(this).siblings('.larger-image').html()
            $j(this).qtip({
                content:largerImage,
                position:{
                    corner:{
                        tooltip:'leftMiddle',
                        target:'topRight'
                    }

                },
                style:{
                    background:'#fefefe',
                    color:'black',
                    border:{
                        width:3,
                        radius:4,
                        color:'#f1f1f1'
                    },
                    width:200,
                    height:200,
                    name:'green'
                }
            });
        });

        $j('.print').click(function () {
            window.print();
            return false;
        });

        $j('.sort-it').tablesorter({
            headers:{
                0:{sorter:false},
                1:{sorter:false},
                5:{sorter:false},
                7:{sorter:false},
                8:{sorter:false}
            },
            widgets:['zebra'],
            widgetZebra:{
                css:["", "dark"]
            },
            cssHeader:"directory-sorter"
        });
    });
</script>

<div class="directory staff">
    <h1>Staff Directory</h1>


    <table class="sort-it" width="100%">
        <thead>
        <tr>
            <th>Image</th>
            <th>Title</th>
            <th>First name</th>
            <th>Surname</th>
            <th>Department</th>
            <th>Role</th>
            <th>Campus</th>
            <th>Ext</th>
            <th>Email</th>

        </tr>
        </thead>
        <tbody>
        <!-- BEGIN staff -->
        <tr>
            <td>
                <img class="small-image" src="/portrait.php?userId={STAFF_STAFFID}&size=square32">

                <div class="larger-image"><img src="/portrait.php?userId={STAFF_STAFFID}&size=constrain200"></div>
            </td>
            <td>{STAFF_TITLE}</td>
            <td>{STAFF_FIRSTNAME}</td>
            <td>{STAFF_SURNAME}</td>
            <td>{STAFF_DEPARTMENT}</td>
            <td>{STAFF_ROLE}</td>
            <td>{STAFF_CAMPUS}</td>
            <td class="number" width="30%">{STAFF_EXTENSION}</td>
            <td><a href="mailto:{STAFF_EMAIL}">{STAFF_EMAIL}</a></td>
        </tr>
        <!-- END staff -->
        </tbody>
    </table>
</div>
