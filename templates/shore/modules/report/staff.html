<link type="text/css" rel="stylesheet" href="/javascript/components/qtip2/jquery.qtip.css" />
<script type="text/javascript" src="/javascript/components/qtip2/jquery.qtip.js"></script>
<script type="text/javascript" src="/javascript/components/jquery.tablesorter/js/jquery.tablesorter.js"></script>
<script type="text/javascript" src="/javascript/components/jquery.tablesorter/js/jquery.tablesorter.widgets.js"></script>
<script type="text/javascript">
    $(function () {

        $('.small-image').each(function () {
            var largerImage = $(this).siblings('.larger-image').html()
            $(this).qtip({
                content:largerImage,
                style: {
                    classes: 'qtip-light qtip-shadow qtip-rounded',
                    tip: {corner: false}
                },
                position: {
                    my: 'middle left',
                    at: 'top right'
                }
            });
        });

        $('.print').click(function () {
            window.print();
            return false;
        });

        $('.sort-it').tablesorter({
            headers:{
                0:{sorter:false},
                1:{sorter:false},
                5:{sorter:false},
                7:{sorter:false},
                8:{sorter:false}
            },
            widgets:['zebra'],
            widgetZebra:{
                css:["", "dark"]
            },
            cssHeader:"directory-sorter"
        });
    });
</script>

<div class="directory staff">
    <h1>Staff Directory</h1>


    <table class="sort-it table" width="100%">
        <thead>
        <tr>
            <th>Image</th>
            <th>Title</th>
            <th>First name</th>
            <th>Surname</th>
            <th>Department</th>
            <th>Role</th>
            <th>Campus</th>
            <th>Ext</th>
            <th>Email</th>

        </tr>
        </thead>
        <tbody>
        <!-- BEGIN staff -->
        <tr>
            <td>
                <img class="small-image" src="/portrait.php?userId={STAFF_STAFFID}&size=square32">

                <div class="larger-image"><img src="/portrait.php?userId={STAFF_STAFFID}&size=constrain200"></div>
            </td>
            <td>{STAFF_TITLE}</td>
            <td>{STAFF_FIRSTNAME}</td>
            <td>{STAFF_SURNAME}</td>
            <td>{STAFF_DEPARTMENT}</td>
            <td>{STAFF_ROLE}</td>
            <td>{STAFF_CAMPUS}</td>
            <td class="number" width="30%">{STAFF_EXTENSION}</td>
            <td><a href="mailto:{STAFF_EMAIL}">{STAFF_EMAIL}</a></td>
        </tr>
        <!-- END staff -->
        </tbody>
    </table>
</div>
