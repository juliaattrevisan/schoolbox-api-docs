window.addEvent('domready', function () {
	for(i = 0; i < pickers.length; i++){
	
		
		pickers[i][2] = new MooRainbow(pickers[i][0] + '_div', pickers[i][0] + '_input', {
			'id': pickers[i][0] + 'Picker',
			'imgPath': '/images/mooRainbow/',
			'onComplete': function(color, object){
				object.element.setStyle('background-color', color.hex);
				object.input.value = color.hex;
			},
			'onChange': function(color, object){
				object.element.setStyle('background-color', color.hex);
				object.input.value = color.hex;
			}
		});
		pickers[i][2].manualSet(pickers[i][1], 'hex');
		$(pickers[i][0] + '_div').setStyle('background-color', pickers[i][2].sets.hex);
		$(pickers[i][0] + '_input').value = pickers[i][2].sets.hex;
	};

	$("loadDefaults").addEvent('click', function () {
		for(i = 0; i < pickers.length; i++){
			pickers[i][2].manualSet(defaults[i][1], 'hex');
			$(pickers[i][0] + '_div').setStyle('background-color', pickers[i][2].sets.hex);
			$(pickers[i][0] + '_input').value = pickers[i][2].sets.hex;		
		}
	});
	
	$("leftRight").addEvent('click', function () {
		var half = pickers.length/2;
		for (i = 0; i < half; i++) {
			pickers[(i+half)][2].manualSet(pickers[i][1], 'hex');
			$(pickers[(i+half)][0] + '_div').setStyle('background-color', pickers[i][2].sets.hex);
			$(pickers[(i+half)][0] + '_input').value = pickers[i][2].sets.hex;		
		}
	});
	
});
	


function removeClasses() {
	var x = $$('.layouts a');
	x.each(function(l){
		l.removeClass('current');
	});
	}

function templateX(el) {
	var temp = $('template-choice');
	temp.setAttribute('value', el.getAttribute('title'));
	removeClasses();
	el.addClass('current');		
	}
