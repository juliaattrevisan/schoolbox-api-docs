function removeClasses() {
	var x = $$('.layouts a');
	x.each(function(l){
		l.removeClass('current');
	});
	}

function templateX(el) {
	var temp = $('template-choice');
	temp.setAttribute('value', el.getAttribute('title'));
	removeClasses();
	el.addClass('current');		
	}

<div class="template3">
			<h1>
      Homepage Customisation
      <a class="customise" href="/homepage/{CID}">Return to Homepage</a>
      </h1>
            
      <div class="left">
			<form method="post" name="customiseForm" id="customiseForm" class="indent" action="/homepage/configForm.php">
			
      <div class="box grey">
        <h2>Layout</h2>
        <div class="text layouts">
          <a onclick="templateX(this);" class="layout {CURRENT_1}" title="1" href="#"><img src="/images/70-30.gif" />70-30</a>
          <a onclick="templateX(this);" class="layout {CURRENT_2}" title="2" href="#"><img src="/images/50-50.gif" />50-50</a>         
          <a onclick="templateX(this);" class="layout {CURRENT_4}" title="4" href="#"><img src="/images/30-70.gif" />30-70</a>
          <a onclick="templateX(this);" class="layout {CURRENT_3}" title="3" href="#"><img src="/images/100-0.gif" />100-0</a>
          <div class="float-fix"></div>
        </div>
      </div>
      
      <div class="box grey">
				<h2>Components</h2>
      	<div class="text">
        	<ul id="component-list">
					<!-- BEGIN componentGroup -->

							<!-- BEGIN componentCol -->
              <li>
								<input type="checkbox" name="components[]" value="{componentID}" {componentChecked} />
                <p><strong>{componentName}</strong></p>
                <p><small>{componentDescription}</small></p>
              </li>
							<!-- END componentCol -->
						<!-- END componentRow -->
					<!-- END componentGroup -->
        	</ul>
          <div class="float-fix"></div>
				</div>
      </div>

    </form>
