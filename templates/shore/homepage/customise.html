<!-- BEGIN custom_head -->
<link rel="stylesheet" type="text/css" href="/css/mooRainbow.css" />
<script type="text/javascript" src="/javascript/mootools.v.1.11.js"></script>
<script type="text/javascript" src="/javascript/mooRainbow.js"></script>
<script type="text/javascript">

	var pickers = [
		['largeHeadingBackground', '#{large_head_bgcolour}'],
		['largeHeadingText', '#{large_head_fontcolour}'],
		['largeTextBackground', '#{large_text_bgcolour}'],
		['largeTextBackground2', '#{large_text_bgcolour2}'],
		['largeTextText', '#{large_text_fontcolour}'],	
	];
	window.onload = function(){
		for(i = 0; i < pickers.length; i++){
			pickers[i][2] = new MooRainbow(pickers[i][0] + 'Div', pickers[i][0] + 'Input', {
				'id': pickers[i][0] + 'Picker',
				'imgPath': '/images/mooRainbow/',
				'onComplete': function(color, object){
					object.element.setStyle('background-color', color.hex);
					object.input.value = color.hex;
				},
				'onChange': function(color, object){
					object.element.setStyle('background-color', color.hex);
					object.input.value = color.hex;
				}
			});
			pickers[i][2].manualSet(pickers[i][1], 'hex');
			$(pickers[i][0] + 'Div').setStyle('background-color', pickers[i][2].sets.hex);
			$(pickers[i][0] + 'Input').value = pickers[i][2].sets.hex;
		};
	}
	
	function removeClasses() {
		var x = $$('.layouts a');
		x.each(function(l){
			l.removeClass('current');	
		});
		}
	
	function template(el) {
		var temp = $('template-choice');
		temp.setAttribute('value', el.getAttribute('title'));
		removeClasses();
		el.addClass('current');		
		}
</script>
<!-- END custom_head -->
<div class="template3">
			<h1>Homepage Customisation</h1>
      <div class="left">
			<form method="post" name="customiseForm" id="customiseForm" class="indent" action="/homepage/configForm.php">
			
      <div class="box grey">
        <h2>Layout</h2>
        <div class="text layouts">
          <a onclick="template(this);" class="layout" title="1" href="#"><img src="/images/50-50.png" width="75" height="70" /></a>
          <a onclick="template(this);" class="layout" title="2" href="#"><img src="/images/70-30.png" width="75" height="70" /></a>
          <a onclick="template(this);" class="layout" title="3" href="#"><img src="/images/100-0.png" width="75" height="70" /></a>
        </div>
      </div>
      
      <div class="box grey">
				<h2>Components</h2>
      	<div class="text">
        	<ul id="component-list">
					<!-- BEGIN componentGroup -->
						<!-- BEGIN componentRow -->
							<!-- BEGIN componentCol -->
              <li>
								<input type="checkbox" name="components[]" value="{componentID}" {componentChecked} />
                <p><strong>{componentName}</strong></p>
                <p><small>{componentDescription}</small></p>
              </li>
							<!-- END componentCol -->
						<!-- END componentRow -->
					<!-- END componentGroup -->
        	</ul>
				</div>
      </div>
        
      <div class="box grey">
			<h2>Colours</h2>
				<div class="text">
        	<div class="colours">
      			<h3>Headings of Components</h3>            
						<div id="largeHeadingBackgroundDiv" class="colorBox"></div>
						<input id="largeHeadingBackgroundInput" name="colors[large_head_bgcolour]" type="hidden" />
            <p>Background Color</p>
            
						<div id="largeHeadingTextDiv" class="colorBox"></div>
						<input id="largeHeadingTextInput" name="colors[large_head_fontcolour]" type="hidden" />
            <p>Text Color</p>
        	</div>
          
          <div class="colours">
      			<h3>Text of Components</h3>
            
						<div id="largeTextBackgroundDiv" class="colorBox"></div>
						<input id="largeTextBackgroundInput" name="colors[large_text_bgcolour]" type="hidden" />
            <p>Primary Background Color</p>
            
            <div id="largeTextBackground2Div" class="colorBox"></div>
						<input id="largeTextBackground2Input" name="colors[large_text_bgcolour2]" type="hidden" />
            <p>Secondary Background Color</p>
            
						<div id="largeTextTextDiv" class="colorBox"></div>
						<input id="largeTextTextInput" name="colors[large_text_fontcolour]" type="hidden" />
            <p>Text Color</p>
        	</div>
        </div>
      </div>	
						
			<input id="template-choice" type="hidden" name="template" value="0" />
      <input type="hidden" name="cid" value="{CID}" />
			<input type="submit" class="float-right" name="Submit" value="Update Page" />
			</form>
                  
      </div>
      </div>
