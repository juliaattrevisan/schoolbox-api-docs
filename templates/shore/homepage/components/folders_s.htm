<div class="box">
  <h2>Folders</h2>
<!-- BEGIN config -->
  <a class="edit" onclick="toggleConfig('component{COMPONENT_ID}');">edit</a>
  <div class="editPanel">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config --> 

  <div class="text listing">
    <ul>
      <!-- BEGIN folders -->
      <li class="{ON_OFF}">
        <span class="col">{FOLDER_NAME}</span>
        <span class="col">{HOMEPAGE_LINK}</span>
        <div class="float-fix"></div>
      </li>
      <!-- END folders -->
    </ul>
    <!-- BEGIN submit_folder -->
    <p class="interact"><a href="/cms/modFolder.php?action=add&cid={ID}">Add Folder</a></p>
    <!-- END submit_folder -->
  </div>   
</div>
