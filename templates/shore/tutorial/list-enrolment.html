<!-- BEGIN custom_head -->
<link rel="stylesheet" href="/css/autocompleter.css" type="text/css" />
<script type="text/javascript" src="/javascript/mootools.js"></script>
<script type="text/javascript" src="/javascript/autocompleter.js"></script>
<script type="text/javascript" src="/javascript/observer.js"></script>
<script type="text/javascript">
window.addEvent('domready', function() {
	$$('.lookup').each(function (el) {
		new Autocompleter.Ajax.Json(el, '/ajax/user.php?groupID=3', {
			minLength: 2,
			postVar: 'keyword',
			width: '310px',
			selectFirst: true,
			//selectMode: 'type-ahead'
			selectMode: 'pick'
		});
	});
});
</script>
<!-- END custom_head -->
<h1>Class list - {EVENT_NAME}</h1>
<span class="header_option"><a href="list-attendance.php?week={WEEK}" title="Attendance history">Mark Attendance</a> | 
<a href="modify-event.php?eventID={EVENT_ID}" title="Modify Event">Modify</a> | 
<a href="modify-event.php?delete={EVENT_ID}" onclick="return confirm('Delete this tutorial?')" title="Delete Event">Delete</a></span>
<!-- BEGIN has_enrolments -->
<table class="ruler">
  <thead>
    <tr>
      <th style="width: 60px;">Remove</th>
      <th>Student</th>
      <!-- BEGIN date_list -->
      <th>{DATE}</th><!-- END date_list -->
      <th style="text-align: right;">Attendance</th>
    </tr>
  </thead>
  <tbody>
    <!-- BEGIN enrolment_list -->
    <tr>
      <td style="text-align: center;"><a href="list-enrolment.php?delete={STUDENT_ID}&code={EVENT_CODE}&eventID={EVENT_ID}" onclick="return confirm('Delete student from classlist?');"><img src="/images/famicons/delete.png" /></a></td>
      <td><a href="/search/userLookup.php?id={STUDENT_ID}">{STUDENT_NAME}</a></td>
      <!-- BEGIN attendance_list -->
      <td>
      	<!-- BEGIN image -->
        <img src="/images/famicons/{ATTENDANCE}.png" title="{REASON}" /><!-- END image --></td><!-- END attendance_list -->
      <td style="text-align: right;">{PERCENTAGE}</td>
    </tr>
    <!-- END enrolment_list -->
  </tbody>
</table>
<!-- END has_enrolments -->

<p>
<form action="list-enrolment.php" method="post">
  <input class="lookup" type="text" name="keyword" />
  <input type="hidden" name="code" value="{EVENT_CODE}" />
  <input type="hidden" name="eventID" value="{EVENT_ID}" />
  <input type="submit" value="Add Student" class="btn" />
</form>
</p>
