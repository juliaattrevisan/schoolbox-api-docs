<script type="text/javascript">
	$j(function() {
		$j('#category li:first-child a').addClass('selected');
		$j('ul.topic li:first-child').show();
		
		$j('#category a').click(function() {a
			$j('#category a').removeClass('selected');
			$j(this).addClass('selected');	
			var el = $j(this).attr('title');
			$j('ul.topic > li').hide();
			$j('ul.topic > li.' + el).show();
			return false;
		});
	});
</script>

<div class="box">
  <h2>News</h2>
  <ul id="category">
      <!-- BEGIN topic_header -->
      <li><a href="#" title="{TOPIC_CLEAN}">{NEWS_TOPIC}</a></li>
      <!-- END topic_header -->
    </ul>
  <div class="text listing">
  	
    <ul class="topic">
    <!-- BEGIN topic -->
    	<li class="hide {TOPIC_CLEAN}">
    	<ul>
      <!-- BEGIN news -->
      <li class="{ON_OFF}">
      	<h4><a href="{NEWS_URL}" title="{NEWS_TITLE}">{NEWS_TITLE}</a></h4>
        <p class="interact">{NEWS_TIME}</p>
        <div class="float-fix"></div>
      </li>
      <!-- END news -->
    </ul>
    </li>
    <!-- END topic -->
    </ul> 
  </div>      
</div>
