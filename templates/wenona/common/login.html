window.onload = init;
function init(){
	document.getElementById('username').focus();
}

<body class="login">
<div id="header">
	<div class="header-wrap">
	<a href="/" class="logo"><img src="/images/wenona/wenona-logo.png" width="324" height="101" alt="Schoolbox" /></a>
	</div>
</div>
<div id="container" class=" login">
	<div id="content" class="clearfix">
		<h1 style="text-transform:capitalize">{SITE_LOCATION} Schoolbox</h1>
		<p class="error">{ERROR}</p>
		<form id="loginForm" method="post" class="clearfix" action="/loginForm.php">
			<fieldset>
				<label for="username">Login Name:</label>
				<input type="text" name="username" id="username" />
			</fieldset>
			<fieldset>
				<label for="password">Password:</label>
				<input type="password" name="password" id="password" />
			</fieldset>
			<input type="hidden" name="page" value="{HIDDEN}" />
			<input class="login submit-btn-plain" type="submit" name="Submit" value="Login" alt="Login" />
		</form>
	</div>
</div>
<div id="footer" class="login">
	<ul>
