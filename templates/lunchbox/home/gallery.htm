<script type="text/javascript" src="/javascript/lunchbox/jquery.cycle.js"></script>
<script type="text/javascript">
	$(function(){
		$('#galleryCycle').cycle({
			cleartype: true,
			before: function() {
				$('#galleryCycle span').slideUp();
			},
			after: function() {
				$('span', this).slideDown();
			}
		});
	});
</script>

<style type="text/css">
#galleryCycle img {
	display: block;
	width: 230px;
	height: 156px;
}
#galleryCycle {
	border: 1px solid #dbdbdb;	
}
#galleryCycle div {
	position: relative;
}
#galleryCycle span {
	background: #576369;
	color: #fff;
	display: none;
	width: 100%;
	position: absolute;
	bottom: 0;
	left: 0;
	padding: 10px 0;
	text-decoration: none;
	opacity: 0.9;
	text-indent: 10px;
}
</style>

<div id="galleryCycle" class="box">
  <div><img src="/images/stjo/gallery/Chrysanthemum.jpg" /><span>Chrysanthemum</span></div>
  <div><img src="/images/stjo/gallery/Desert.jpg" /><span>Desert</span></div>
  <div><img src="/images/stjo/gallery/Tulips.jpg" /><span>Tulips</span></div> 
</div>
