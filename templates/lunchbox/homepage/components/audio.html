<div class="box" id="component{COMPONENT_ID}">
  <h2>Audio</h2>
  <!-- BEGIN config -->
  <a class="edit">edit</a>
  <div class="editPanel hide">
    <form action="/homepage/configForm.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="sort">Sort: </label>
      <select name="sort">
        <!-- BEGIN sort -->
        <option value="{COMPONENT_CONFIG_SORT_VALUE}"{COMPONENT_CONFIG_SORT_SELECTED}>{COMPONENT_CONFIG_SORT_NAME}</option>
        <!-- END sort -->
      </select>
      <select name="sortdir">
        <!-- BEGIN sortdir -->
        <option value="{COMPONENT_CONFIG_SORTDIR_VALUE}"{COMPONENT_CONFIG_SORTDIR_SELECTED}>{COMPONENT_CONFIG_SORTDIR_NAME}</option>
        <!-- END sortdir -->
      </select>
      <label for="size">Item Limit: </label>
      <select name="size">
        <!-- BEGIN size -->
        <option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
        <!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>  <!-- END config -->
  <div class="text listing" >
    <script type="text/javascript">

		function loadSWF(audioID, url){
			var flashvars = {
				filename: url
			};
			var params = {
				movie: "/flash/player_mp3.swf",
				wmode: "transparent"
			};
			
			swfobject.embedSWF("/flash/mp3small.swf", "audio-player-"+audioID, "22", "22", "9.0.0", "/flash/expressInstall.swf", flashvars, params);
		}
		
	</script>
    <ul>
      <!-- BEGIN audio_list -->
      <li class="{ON_OFF}">
        <h4><a class="icons {AUDIO_MIME_IMAGE}" href="{AUDIO_URL}">{AUDIO_DESCRIPTION}</a></h4>
        <p class="interact">
              <div class="play-button">
              <div id="audio-player-{AUDIO_ID}"><a onclick="loadSWF({AUDIO_ID}, '{AUDIO_URL}'); return false;"></a></div>
              </div>
        </p>
        <p class="summ">{AUDIO_COMMENT}</p>
        <div class="float-fix"></div>
      </li>
      <!-- END audio_list -->
    </ul>
    <div class="float-fix"></div>
  </div>
  <!-- BEGIN submit_file -->
  <p class="interact"><a href="/cms/file/new/{ID}">Post File</a></p>
  <!-- END submit_file -->
</div>
