name: Build and push to Github Container Registry

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: |
          The environment this is to be built on
          (e.g. `ubuntu-latest`, `ubuntu-arm`).
        required: true
      platform:
        type: string
        description: |
          The platform of the image to build (e.g. `linux`).
        required: true
      arch:
        type: string
        description: |
          The processor architecture of the image to build
          (e.g. `amd64`, `arm64`).
        required: true
      image:
        type: string
        description: |
          The name of the image to push.
        required: true
      context:
        type: string
        description: |
          The build context for the image.

          Also determines what is checked out in the checkout step.
        required: true
      file:
        type: string
        default: ''
        description: |
          A path to the Dockerfile to use to build the image: if not provided,
          uses the Dockerfile in `inputs.context`.
        required: false
      tags:
        type: string
        description: |
          A comma-separated list of tags for the image.
        required: true
#    secrets:
#      DOCKERHUB_USERNAME:
#        description: |
#          The username within Dockerhub.
#        required : false
#
#      DOCKERHUB_TOKEN:
#        description: |
#          The token or password to use when authenticating with Dockerhub.
#        required: false

# Separate job variants are required for AMD64 and ARM64 builds, so that the
# build runs on the same architecture as the image it's building:
# QEMU building an ARM64 image on an AMD64 arch is too slow to be acceptable.
jobs:
  build-and-push:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            ${{ inputs.context }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load ${{ inputs.image }} cache
        uses: actions/cache@v4
        id: cache-image
        with:
          path: ${{ runner.temp }}/${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}.tar
          key: ${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}

      # Not sure if pushing a same tagged image with a different platform will
      # make the image available for different platforms.
      - name: Build and push ${{ inputs.image }}
        if: steps.cache-image.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || '' }}
          # If both Dockerhub username and token are set: true, otherwise false
          push: ${{ (env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN && true) || false}}
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ inputs.platform }}/${{ inputs.arch }}
          tags: ${{ inputs.tags }}

      - name: Upload ${{ inputs.image }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}.tar
          retention-days: 1
