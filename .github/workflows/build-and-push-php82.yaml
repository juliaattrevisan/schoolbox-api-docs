name: build-and-push-php82

# Build new php82-alpine and php82-fpm-alpine images:
# * whenever docker/base-images/**/Dockerfile changes?
#   (master only: both master and develop will use the same base images)
# * manually (workflow_dispatch)
# * on a cron?
# Tag is always "latest"
on:
  workflow_dispatch:

# Separate jobs are required for AMD64 and ARM64 builds, so that the build runs
# on the same architecture as the image it's building: QEMU building an ARM64
# image on an AMD64 arch is too slow to be acceptable.
jobs:
  build-and-push-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-alpine"
          push: true
          build-args: |
            ENV=prod
          platforms: linux/amd64
          tags: alaress/php82-alpine:latest

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-fpm-alpine"
          push: true
          build-args: |
            ENV=prod
          platforms: linux/amd64
          tags: alaress/php82-fpm-alpine:latest

  build-and-push-arm64:
    runs-on: ubuntu-arm
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-alpine"
          push: true
          build-args: |
            ENV=prod
          platforms: linux/arm64
          tags: alaress/php82-alpine:latest

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-fpm-alpine"
          push: true
          build-args: |
            ENV=prod
          platforms: linux/arm64
          tags: alaress/php82-fpm-alpine:latest
