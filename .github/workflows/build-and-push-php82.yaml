name: build-and-push-php82

# Trigger the php82 rebuild:
# * whenever docker/base-images/php82 changes
# * manually
# * on a cron?
on:
  workflow_dispatch:

# What actually happens?
# * supply the Dockerhub username+token
# * just build the image
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-alpine"
#          push: true
          build-args: |
            ENV=prod
          platforms: linux/amd64,linux/arm64
          tags: alaress/php82-alpine:latest

