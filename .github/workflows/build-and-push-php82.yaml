name: build-and-push-php82

# Build new php82-alpine and php82-fpm-alpine images:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
# Tag is always "latest"
on:
  push:
    branches:
#      - master
      - develop
    paths:
      - 'docker/base-images/**'
  workflow_dispatch:
  # Testing only
  pull_request:

# Separate job variants are required for AMD64 and ARM64 builds, so that the
# build runs on the same architecture as the image it's building:
# QEMU building an ARM64 image on an AMD64 arch is too slow to be acceptable.
jobs:
  build-php82-alpine:
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-arm
            platform: linux/arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build php82-alpine
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-alpine"
          outputs: type=docker,dest=${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}
          tags: alaress/php82-alpine:latest

      - name: Upload php82-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}
          path: ${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}.tar
          retention-days: 1

  build-php82-fpm-alpine:
    needs:
      - build-php82-alpine
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-arm
            platform: linux/arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download php82-alpine artifact
        uses: actions/download-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}
          path: ${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}.tar

      - name: Load php82-alpine image
        run: |
          docker image load --input ${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}.tar

      - name: Build php82-fpm-alpine
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker/base-images/php82-fpm-alpine"
          outputs: type=docker,dest=${{ runner.temp }}/php82-fpm-alpine-${{ matrix.build.platform }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}
          tags: alaress/php82-fpm-alpine:latest

      - name: Upload php82-fpm-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}
          path: ${{ runner.temp }}/php82-fpm-alpine-${{ matrix.build.platform }}.tar
          retention-days: 1

  # Push artifacts from previous steps
  push-to-dockerhub:
    needs:
      - build-php82-alpine
      - build-php82-fpm-alpine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - platform: linux/amd64
          - platform: linux/arm64
        image:
          - php82-alpine
          - php82-fpm-alpine
    steps:
      - name: Download ${{ matrix.image }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ matrix.build.platform }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.build.platform }}.tar

      - name: Load ${{ matrix.image }} image
        run: |
          docker image load --input ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.build.platform }}.tar

      - name: Login to Dockerhub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.image }} image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push -a alaress/${{ matrix.image }} --platform ${{ matrix.build.platform }}

  push-to-ecr:
    needs:
      - build-php82-alpine
      - build-php82-fpm-alpine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - platform: linux/amd64
          - platform: linux/arm64
        image:
          - php82-alpine
          - php82-fpm-alpine
        region:
          - ap-southeast-2
#          - ap-southeast-1
#          - me-south-1
    steps:
      - name: Download ${{ matrix.image }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}-${{ matrix.build.platform }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.build.platform }}.tar

      - name: Load ${{ matrix.image }} image
        run: |
          docker image load --input ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.build.platform }}.tar

      - name: Configure AWS Credentials
        if: ${{ github.event_name != 'pull_request' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR Private
        if: ${{ github.event_name != 'pull_request' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ${{ matrix.image }} image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push -a ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }} --platform ${{ matrix.build.platform }}
