name: build-and-push-php82

# Build new php82-alpine and php82-fpm-alpine images:
# * whenever docker/base-images/**/Dockerfile changes?
#   (master only: both master and develop will use the same base images)
# * manually (workflow_dispatch)
# * on a cron?
# Tag is always "latest"
on:
  workflow_dispatch:
  pull_request:

# Separate job variants are required for AMD64 and ARM64 builds, so that the
# build runs on the same architecture as the image it's building:
# QEMU building an ARM64 image on an AMD64 arch is too slow to be acceptable.
jobs:
  build-and-push:
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-arm
            platform: linux/arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#      - name: Login to Docker Hub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKERHUB_USERNAME }}
#          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php82-alpine
#          push: true
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}
          tags: alaress/php82-alpine:latest

#      - name: build-and-push
#        uses: docker/build-push-action@v6
#        with:
#          context: docker/base-images/php82-fpm-alpine
#          push: true
#          build-args: |
#            ENV=prod
#          platforms: ${{ matrix.build.platform }}
#          tags: alaress/php82-fpm-alpine:latest
