name: build-and-push-php82

# Build new php82-alpine image:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
# Tag is always "latest"
on:
  push:
    branches:
#      - master
      - develop
    paths:
      - 'docker/base-images/**'
  workflow_dispatch:
  # Testing only
  pull_request:

jobs:
  build-and-push-php82-alpine-to-dockerhub:
    uses: ./.github/workflows/build-and-push-to-dockerhub.yaml
    with:
      image: php82-alpine
      context: docker/base-images/php82-alpine
    secrets: inherit

  push-php82-alpine-to-ecr:
    needs:
      - build-and-push-php82-alpine-to-dockerhub
    uses: ./.github/workflows/push-to-ecr.yaml
    with:
      image: php82-alpine
    secrets: inherit

  build-and-push-php82-fpm-alpine-to-dockerhub:
    needs:
      - build-and-push-php82-alpine-to-dockerhub
    uses: ./.github/workflows/build-and-push-to-dockerhub.yaml
    with:
      image: php82-fpm-alpine
      context: docker/base-images/php82-fpm-alpine
    secrets: inherit

  push-php82-fpm-alpine-to-ecr:
    needs:
      - build-and-push-php82-fpm-alpine-to-dockerhub
    uses: ./.github/workflows/push-to-ecr.yaml
    with:
      image: php82-fpm-alpine
    secrets: inherit
