name: Build PHP 8.2 Alpine artifacts

on:
  workflow_call:

jobs:
  # Build schoolbox-fpm image
  build-php82-alpine-artifacts:
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            docker/base-images

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load php82-alpine artifact cache
        uses: actions/cache@v4
        id: cache-php82-alpine-artifact
        with:
          path: ${{ runner.temp }}/artifact
          key: php82-alpine-artifact-${{ matrix.build.platform }}-${{ matrix.build.arch }}-${{ hashFiles('docker/base-images/**/*') }}

      # Build this image only if it's new:
      # otherwise, pull from cache?
      - name: Build php82-alpine
        uses: docker/build-push-action@v6
        if: steps.cache-php82-alpine-artifact.outputs.cache-hit != 'true'
        with:
          context: docker/base-images/php82-alpine/
          cache-from: type=gha
          cache-to: type=gha
          push: false
          load: true
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            php82-alpine-${{ matrix.build.arch }}

      # Extract necessary artifacts out of image:
      # /etc/odbc.ini
      # /etc/odbcinst.ini
      # /opt/microsoft
      # /opt/mssql-tools18
      # /usr/local/lib/php/extensions/no-debug-non-zts-20220829
      # /usr/local/etc/php/conf.d/
      - name: Extract artifact files from php82-alpine
        if: steps.cache-php82-alpine-artifact.outputs.cache-hit != 'true'
        run: |
          docker image ls
          image=$(docker image ls -q php82-alpine-${{ matrix.build.arch }})
          docker create --name=temp $image
          mkdir -p \
            ${{ runner.temp }}/artifact/etc/ \
            ${{ runner.temp }}/artifact/opt/microsoft/ \
            ${{ runner.temp }}/artifact/opt/mssql-tools18/ \
            ${{ runner.temp }}/artifact/usr/local/lib/php/extensions/ \
            ${{ runner.temp }}/artifact/usr/local/etc/php/
          docker cp temp:/etc/odbc.ini                                           ${{ runner.temp }}/artifact/etc/
          docker cp temp:/etc/odbcinst.ini                                       ${{ runner.temp }}/artifact/etc/
          docker cp temp:/opt/microsoft                                          ${{ runner.temp }}/artifact/opt/
          docker cp temp:/opt/mssql-tools18                                      ${{ runner.temp }}/artifact/opt/
          docker cp temp:/usr/local/lib/php/extensions/no-debug-non-zts-20220829 ${{ runner.temp }}/artifact/usr/local/lib/php/extensions/
          docker cp temp:/usr/local/etc/php/conf.d/                              ${{ runner.temp }}/artifact/usr/local/etc/php/

      - name: Upload php82-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/artifact
          retention-days: 1
