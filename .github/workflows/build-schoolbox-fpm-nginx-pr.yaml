name: Build schoolbox-fpm-nginx (pull request)

# Build a new schoolbox-fpm-nginx image for this pull request, for CI.
# Works around the fact that PRs can't use base images in repositories, by
# building the base image and copying its files as artifacts.
# Commented out for now, as CI doesn't use it yet and it costs us $:
# will be re-enabled when it's actually in use.
on:
  workflow_call:
#  pull_request:

jobs:
  # Build artifacts before building image
  build-composer-artifact:
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  build-php82-alpine-artifacts:
    uses: ./.github/workflows/helper-build-php82-alpine-artifacts.yaml

  # Build schoolbox-fpm-nginx image
  build-schoolbox-fpm-nginx:
    needs:
      - build-composer-artifact
      - build-npm-artifact
      - build-php82-alpine-artifacts
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Download php82-alpine artifact
        uses: actions/download-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/artifact

      # Build
      - name: Build schoolbox-fpm-nginx pull request image
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-fpm-nginx
          file: docker/schoolbox-fpm-nginx/deploy-image.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-alpine=${{ runner.temp }}/artifact
            code=${{ github.workspace }}
          push: false
          load: true
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
            SERVER_NAME=
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            schoolbox-fpm-nginx-${{ matrix.build.arch }}

      # Smoke test for box:
      # could attempt to run PHPUnit within the box as well?
      - name: Test schoolbox-fpm-nginx
        run: |
          docker image ls
          image=$(docker image ls -q schoolbox-fpm-nginx-${{ matrix.build.arch }})
          docker run -i $image ls -al /opt/
          docker run -i $image ls -al /etc/
          docker run -i $image ls -al /etc/nginx/sites-enabled/
          docker run -i $image ls -al /etc/nginx/sites-enabled/schoolbox.d/
          docker run -i $image ls -al /usr/local/lib/php/extensions/no-debug-non-zts-20220829/
          docker run -i $image ls -al /usr/local/etc/php/conf.d/
          docker run -i $image ls -al /usr/share/schoolbox/
          docker run -i $image ls -al /usr/share/schoolbox/vendor/
          docker run -i $image ls -al /usr/share/schoolbox/www/static/js/bundle/
