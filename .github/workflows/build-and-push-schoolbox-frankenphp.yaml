name: Build and push schoolbox-frankenphp (push, release)

# Build a new schoolbox-frankenphp image:
# * when master or develop changes (tags: master, develop, commit hash)
# * when a release is created (tags: release name (github.ref_name))
on:
  push:
    branches:
      - master
      - develop
  release:
    types:
      - prereleased
      - released

jobs:
  # Build base image before building schoolbox images,
  # but only if the build has changed, and only if the repo is the base repo.
  php82-frankenphp-diff:
    # I can't believe that this has to be set as an `if` rule on a step,
    # instead of in the `on` section.
    if: github.repository == 'alaress/schoolbox'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.diff.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            docker/base-images/php82-frankenphp/
          fetch-depth: '2'
      - name: Diff base image
        id: diff
        run: |
          echo "count=$(git diff ${{ github.sha }}^..${{ github.sha }} --name-only -- docker/base-images/php82-frankenphp/ | wc -l)" >> $GITHUB_OUTPUT

  build-and-push-php82-frankenphp:
    needs:
      - php82-frankenphp-diff
    uses: ./.github/workflows/build-and-push-php82-frankenphp.yaml
    if: needs.php82-frankenphp-diff.outputs.count > 0
    secrets: inherit

  # Build artifacts before building image
  build-composer-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-frankenphp image
  build-and-push-schoolbox-frankenphp:
    needs:
      - build-and-push-php82-frankenphp
      - build-composer-artifact
      - build-npm-artifact
    if: ${{ always() && github.repository == 'alaress/schoolbox' && (needs.build-and-push-php82-frankenphp.result == 'skipped' || needs.build-and-push-php82-frankenphp.result == 'success') }}
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      # Different build-and-push depending on trigger:
      # * push:    ${{ github.ref_name }}-latest-${{ matrix.build.arch }}
      #            (ref_name should be master or develop)
      # * release: ${{ github.ref_name }}-${{ matrix.build.arch }}
      #
      # For now this uses a remote image as its build context, later it may use
      # an artifact built in this step?
      - name: Build and push schoolbox-frankenphp deployment image (latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-frankenphp
          file: docker/schoolbox-frankenphp/deploy-image.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-frankenphp=docker-image://alaress/php82-frankenphp:latest-${{ github.ref_name }}
            code=${{ github.workspace }}
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/schoolbox-frankenphp-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/schoolbox-frankenphp:${{ github.ref_name }}-latest-${{ matrix.build.arch }}

      - name: Build and push schoolbox-frankenphp deployment image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-frankenphp
          file: docker/schoolbox-frankenphp/deploy-image.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-frankenphp=docker-image://alaress/php82-frankenphp:latest-${{ github.event.release.target_commitish }}
            code=${{ github.workspace }}
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/schoolbox-frankenphp-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/schoolbox-frankenphp:${{ github.ref_name }}-${{ matrix.build.arch }}

      - name: Upload schoolbox-frankenphp artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolbox-frankenphp-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/schoolbox-frankenphp-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          retention-days: 1

  join-schoolbox-frankenphp:
    needs:
      - build-and-push-schoolbox-frankenphp
    if: always() && needs.build-and-push-schoolbox-frankenphp.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join schoolbox-frankenphp images (latest)
        if: github.event_name == 'push'
        run: |
          docker manifest create alaress/schoolbox-frankenphp:${{ github.ref_name }}-latest \
            --amend alaress/schoolbox-frankenphp:${{ github.ref_name }}-latest-amd64 \
            --amend alaress/schoolbox-frankenphp:${{ github.ref_name }}-latest-arm64
          docker manifest push --purge alaress/schoolbox-frankenphp:${{ github.ref_name }}-latest

      - name: Join schoolbox-frankenphp images (release)
        if: github.event_name == 'release'
        run: |
          docker manifest create alaress/schoolbox-frankenphp:${{ github.ref_name }} \
            --amend alaress/schoolbox-frankenphp:${{ github.ref_name }}-amd64 \
            --amend alaress/schoolbox-frankenphp:${{ github.ref_name }}-arm64
          docker manifest push --purge alaress/schoolbox-frankenphp:${{ github.ref_name }}

      # Need artifact for the joined image too, or pull the just built image?

  push-schoolbox-frankenphp-to-ecr:
    needs:
      - join-schoolbox-frankenphp
    if: always() && needs.join-schoolbox-frankenphp.result == 'success'
    uses: ./.github/workflows/helper-push-to-ecr.yaml
    with:
      image: schoolbox-frankenphp
    secrets: inherit
