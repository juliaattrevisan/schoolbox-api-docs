name: Build and push schoolbox-frankenphp (push, release)

# Build a new schoolbox-frankenphp image:
# * when master or develop changes (tags: master, develop, commit hash)
# * when a release is created (tags: release name (github.ref_name))
on:
  release:
    types:
      - prereleased
      - released

permissions:
  id-token: write
  contents: read


# Cancel upon push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true


jobs:
  # Build artifacts before building image
  build-composer-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-frankenphp image
  build-and-push-schoolbox-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 60
    needs:
      - build-composer-artifact
      - build-npm-artifact
    if: github.repository == 'alaress/schoolbox'
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - 8.2
          - 8.4
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2


      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: alaress/schoolbox-frankenphp


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Build and push ${{ vars.SCHOOLBOX_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }} deployment image
        id: build-and-push-latest
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-frankenphp
          file: docker/schoolbox-frankenphp/deploy-image.Dockerfile
          build-contexts: |
            code=${{ github.workspace }}
          push: true
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENV=prod
            TAG=latest-php${{ matrix.phpVersion }}-${{ github.event.release.target_commitish }}
            PHP_MAJOR_VERSION=${{ matrix.phpVersion }}
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}
            ${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-and-push-latest.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload schoolbox-frankenphp artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: 'error'
          retention-days: 1

  join-schoolbox-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 15
    needs:
      - build-and-push-schoolbox-frankenphp
    if: always() && needs.build-and-push-schoolbox-frankenphp.result == 'success'
    runs-on: onprem-k3s
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download schoolbox-frankenphp artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: 'true'

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}
            ${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}
          tags: |
            type=ref,event=tag,prefix=

      - name: Join schoolbox-frankenphp images (latest)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map ("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}@sha256:%s ' *) \
            $(printf '${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}@sha256:%s ' *)
