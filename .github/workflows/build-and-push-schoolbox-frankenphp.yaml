name: Build and push schoolbox-frankenphp (push, release)

# Build a new schoolbox-frankenphp image:
# * when a release is created (tags: release name (github.ref_name))
on:
  release:
    types:
      - prereleased
      - released

permissions:
  id-token: write
  contents: read


# Cancel upon push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true


jobs:
  # Build artifacts before building image
  build-composer-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    if: github.repository == 'alaress/schoolbox'
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-frankenphp image
  build-and-push-schoolbox-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 60
    needs:
      - build-composer-artifact
      - build-npm-artifact
    if: github.repository == 'alaress/schoolbox' && (github.event.release.target_commitish == 'master' || github.event.release.target_commitish == 'develop')
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - 8.4
        # Note there's no env matrix var: only prod builds for releases
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Build and push ${{ vars.SCHOOLBOX_IMAGE_NAME }}
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-frankenphp
          load: false
          file: docker/schoolbox-frankenphp/deploy-image.Dockerfile
          build-contexts: |
            code=${{ github.workspace }}
          provenance: false
          sbom: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ENV=prod
            PHP_MAJOR_VERSION=${{ matrix.phpVersion }}
            BASE_BRANCH=${{ github.event.release.target_commitish }}
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}
            ${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${digest#sha256:}"

      - name: Upload ${{ vars.SCHOOLBOX_IMAGE_NAME }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digest-php${{ matrix.phpVersion }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/*
          if-no-files-found: 'error'
          retention-days: 1

  join-schoolbox-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 15
    strategy:
      matrix:
        phpVersion:
          - 8.4
    needs:
      - build-and-push-schoolbox-frankenphp
    if: always() && needs.build-and-push-schoolbox-frankenphp.result == 'success'
    runs-on: onprem-k3s
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download ${{ vars.SCHOOLBOX_IMAGE_NAME }} artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
          pattern: digest-php${{ matrix.phpVersion }}-*
          merge-multiple: 'true'

      - name: Join ${{ vars.SCHOOLBOX_IMAGE_NAME }} images
        working-directory: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
        run: |
          declare -a DOCKERHUB_IMAGES
          declare -a ECR_IMAGES

          # All I need is the hashes, which are in /digests/version:
          # the hashes are the same between both Dockerhub and ECR
          for file in $(ls -1 ${{ runner.temp }}/digests/${{ matrix.phpVersion }}); do
              DOCKERHUB_IMAGES+=("${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}@sha256:$file")
              ECR_IMAGES+=("${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}@sha256:$file")
          done

          docker buildx imagetools create \
            -t '${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:${{ github.ref_name }}-php${{ matrix.phpVersion }}' \
            -t '${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:${{ github.event.release.target_commitish }}-php${{ matrix.phpVersion }}' \
            "${DOCKERHUB_IMAGES[@]}"
          docker buildx imagetools create \
            -t '${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:${{ github.ref_name }}-php${{ matrix.phpVersion }}' \
            -t '${{ vars.ECR_NAMESPACE }}/${{ vars.SCHOOLBOX_IMAGE_NAME }}:${{ github.event.release.target_commitish }}-php${{ matrix.phpVersion }}' \
            "${ECR_IMAGES[@]}"

  notify-operations:
    if: always() && github.repository == 'alaress/schoolbox'
    needs:
      - build-composer-artifact
      - build-npm-artifact
      - build-and-push-schoolbox-frankenphp
      - join-schoolbox-frankenphp
    uses: ./.github/workflows/helper-notify-operations-slack.yaml
    with:
      workflow_name: ${{ github.workflow }}
      status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      ref_name: ${{ github.ref_name }}
      run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    secrets: inherit
