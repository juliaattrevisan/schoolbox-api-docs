name: Build Composer artifact

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-composer-artifact:
    timeout-minutes: 15
    runs-on: onprem-k3s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load vendor cache
        uses: actions/cache@v4
        id: cache-vendor
        with:
          path: /tmp/composer-cache
          key: vendor-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Try marking folder as safe
        run: |
          sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # The composer install runs regardless of cache hit above, because:
      # * the cache populates Composer's cache, not vendor/
      # * the autoload still needs to be built
      - name: Composer install
        uses: php-actions/composer@v6
        with:
          dev: no
          args: --profile --ignore-platform-reqs -a
          php_version: '8.4'
          # Just use whatever the latest 2.x release is: only 2.2 is an LTS
          version: '2.x'

#      - name: What's in /root/.gitconfig?
#        if: always()
#        run: |
#          sudo ls -al /root/.gitconfig
#
#      - name: Composer patches doctor
#        if: always()
#        uses: php-actions/composer@v6
#        with:
#          dev: no
#          command: patches-doctor
#          args: --profile
#          php_version: '8.4'
#          version: '2.x'

      - name: Upload composer artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/
          retention-days: 1
