name: build-composer-artifact

on:
  workflow_call:

jobs:
  build-composer-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Load vendor cache
        uses: actions/cache@v4
        id: cache-vendor
        with:
          path: /tmp/composer-cache
          key: vendor-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Composer install
        uses: php-actions/composer@v6
        with:
          dev: no
          args: --profile --ignore-platform-reqs -a
          php_version: '8.2'
          # The Composer action takes `2.2.x` but not `2.8.x`? Srsly?
          version: '2.8.6'

      - name: Upload composer artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/
          retention-days: 1
