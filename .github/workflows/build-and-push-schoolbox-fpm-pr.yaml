name: Build and push schoolbox-fpm (pull request)

# Build a new schoolbox-fpm image for this pull request, for CI.
on:
  pull_request:

jobs:
  # Build artifacts before building image
#  build-composer-artifact:
#    uses: ./.github/workflows/helper-build-composer-artifact.yaml
#
#  build-npm-artifact:
#    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-fpm image
  build-schoolbox-fpm:
#    needs:
#      - build-composer-artifact
#      - build-npm-artifact
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load base image cache
        uses: actions/cache@v4
        id: cache-base-images
        with:
          path: ${{ runner.temp }}/image-cache
          key: base-images-${{ matrix.build.platform }}-${{ matrix.build.arch }}-${{ hashFiles('docker/base-images/**/*') }}

#      - name: Create image cache folder
#        run: |
#          mkdir -p ${{ runner.temp }}/image-cache

#      - name: Load php82-alpine image cache
#        uses: actions/cache@v4
#        id: cache-php82-alpine
#        with:
#          path: ${{ runner.temp }}/php82-alpine.tar
#          key: php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}-${{ hashFiles('docker/base-images/**/*') }}

      # Build this image only if it's new:
      # otherwise, pull from cache?
      - name: Build php82-alpine
        uses: docker/build-push-action@v6
#        if: steps.cache-php82-alpine.outputs.cache-hit != 'true'
        with:
          context: docker/base-images/php82-alpine/
          push: false
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            php82-alpine

      # Extract necessary artifacts out of image:
      # /etc/odbc.ini
      # /etc/odbcinst.ini
      # /opt/microsoft
      # /opt/mssql-tools18
      # /usr/local/lib/php/extensions/no-debug-non-zts-20220829
      # /usr/local/etc/php/conf.d/
      - name: Extract artifact files from php82-alpine
        run: |
          docker create --name=temp php82-alpine
          mkdir -p \
            artifact/etc/ \
            artifact/opt/microsoft/ \
            artifact/opt/mssql-tools18/ \
            artifact/usr/local/lib/php/extensions/ \
            artifact/usr/local/etc/php/
          docker cp temp:/etc/odbc.ini                                           artifact/etc/
          docker cp temp:/etc/odbcinst.ini                                       artifact/etc/
          docker cp temp:/opt/microsoft                                          artifact/opt/
          docker cp temp:/opt/mssql-tools18                                      artifact/opt/
          docker cp temp:/usr/local/lib/php/extensions/no-debug-non-zts-20220829 artifact/usr/local/lib/php/extensions/
          docker cp temp:/usr/local/etc/php/conf.d/                              artifact/usr/local/etc/php/

      - name: Upload php82-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}
          path: artifact
          retention-days: 1

#      - name: Get php82-alpine image ID
#        id: php82-alpine-image-id
