#          docker create --name=temp $image
#          mkdir -p \
#            ${{ runner.temp }}/artifact/etc/ \
#            ${{ runner.temp }}/artifact/opt/microsoft/ \
#            ${{ runner.temp }}/artifact/opt/mssql-tools18/ \
#            ${{ runner.temp }}/artifact/usr/local/lib/php/extensions/ \
#            ${{ runner.temp }}/artifact/usr/local/etc/php/
#          docker cp temp:/etc/odbc.ini                                           ${{ runner.temp }}/artifact/etc/
