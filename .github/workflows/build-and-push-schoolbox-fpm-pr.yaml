name: Build and push schoolbox-fpm (pull request)

# Build a new schoolbox-fpm image for this pull request, for CI.
on:
  pull_request:

jobs:
  # Build artifacts before building image
#  build-composer-artifact:
#    uses: ./.github/workflows/helper-build-composer-artifact.yaml
#
#  build-npm-artifact:
#    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-fpm image
  build-and-push-schoolbox-fpm:
#    needs:
#      - build-composer-artifact
#      - build-npm-artifact
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load base image cache
        uses: actions/cache@v4
        id: cache-base-images
        with:
          path: ${{ runner.temp }}/image-cache
          key: base-images-${{ matrix.build.platform }}-${{ matrix.build.arch }}-${{ hashFiles('docker/base-images/**/*') }}

#      - name: Create image cache folder
#        run: |
#          mkdir -p ${{ runner.temp }}/image-cache

      - name: Build php82-alpine
        uses: docker/build-push-action@v6
#        if: steps.cache-base-images.outputs.cache-hit != 'true'
        with:
          context: docker/base-images/php82-alpine/
          load: true
          push: false
          cache-from: type=local,src=${{ runner.temp }}/image-cache
          cache-to: type=local,dest=${{ runner.temp }}/image-cache
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/php82-alpine:pr-${{ github.event.pull_request.number }}
            alaress/php82-alpine:latest

      - name: List images
        run: |
          docker image ls

      - name: Build php82-fpm-alpine
        uses: docker/build-push-action@v6
#        if: steps.cache-base-images.outputs.cache-hit != 'true'
        with:
          context: docker/base-images/php82-fpm-alpine/
          load: true
          push: false
          cache-from: type=local,src=${{ runner.temp }}/image-cache
          cache-to: type=local,dest=${{ runner.temp }}/image-cache
          # Try build-contexts for telling this process to use a locally built package
          build-contexts: alaress/php82-alpine=docker-image://alaress/php82-alpine
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/php82-fpm-alpine:pr-${{ github.event.pull_request.number }}
            alaress/php82-fpm-alpine:latest

