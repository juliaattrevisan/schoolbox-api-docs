#          echo "id=$(docker image ls alaress/php82-alpine:latest -q --no-trunc)" >> $GITHUB_OUTPUT

#      - name: Extract php82-alpine
#        run: |
#          cd ${{ runner.temp }}
#          mkdir php82-alpine
#          tar -tf php82-alpine.tar
#          tar -xf php82-alpine.tar -C php82-alpine
#          ls -al php82-alpine/

#      - name: List images
#        run: |
#          docker image ls
#
#      - name: List image cache
#        run: |
#          ls -al ${{ runner.temp }}/image-cache

#      - name: Load php82-fpm-alpine image cache
#        uses: actions/cache@v4
#        id: cache-php82-fpm-alpine
#        with:
#          path: ${{ runner.temp }}/output/php82-fpm-alpine.tar
#          key: php82-fpm-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}-${{ hashFiles('docker/base-images/**/*') }}

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Build schoolbox-fpm
        uses: docker/build-push-action@v6
#        if: steps.cache-base-images.outputs.cache-hit != 'true'
        with:
          context: .
          file: docker/php-fpm/pr.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-alpine=${{ runner.temp }}/artifact
            code=${{ github.workspace }}
          push: false
          load: true
#          cache-from: type=local,src=${{ runner.temp }}/image-cache
#          cache-to: type=local,dest=${{ runner.temp }}/image-cache
          # Try build-contexts for telling this process to use a locally loaded package
#          build-contexts: ghcr.io/alaress/php82-alpine:latest=docker-image://ghcr.io/alaress/php82-alpine:pr-${{ github.event.pull_request.number }}@${{ steps.php82-alpine-image-id.outputs.id }}
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            schoolbox-fpm

      - name: Test schoolbox-fpm
        run: |
          docker image ls
          image=$(docker image ls -q schoolbox-fpm)
          docker run -i $image ls -al /opt/
          docker run -i $image ls -al /etc/
          docker run -i $image ls -al /usr/local/lib/php/extensions/no-debug-non-zts-20220829/
          docker run -i $image ls -al /usr/local/etc/php/conf.d/

          docker run -i $image ls -al /usr/share/schoolbox/
          docker run -i $image ls -al /usr/share/schoolbox/vendor/
          docker run -i $image ls -al /usr/share/schoolbox/www/static/js/bundle/

