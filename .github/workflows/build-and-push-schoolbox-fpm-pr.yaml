name: Build and push schoolbox-fpm (pull request)

# Build a new schoolbox-fpm image for this pull request, for CI.
on:
  pull_request:

jobs:
  # Build artifacts before building image
  build-composer-artifact:
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  build-php82-alpine-artifacts:
    uses: ./.github/workflows/helper-build-php82-alpine-artifacts.yaml

  # Build schoolbox-fpm image
  build-schoolbox-fpm:
    needs:
      - build-composer-artifact
      - build-npm-artifact
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

#      - name: Load php82-alpine artifact cache
