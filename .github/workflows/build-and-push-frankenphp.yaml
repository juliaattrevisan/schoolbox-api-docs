name: Build and push frankenphp

# Build new frankenphp images:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
on:
  push:
   branches:
     - master
     - develop
   paths:
     - 'docker/base-images/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-frankenphp-to-dockerhub:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 60
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - 8.2
          - 8.4
        env:
          - prod
          - dev
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ vars.FRANKENPHP_IMAGE_NAME }}
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php-frankenphp
          load: true
          provenance: false
          sbom: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ENV=${{ matrix.env }}
            PHP_MAJOR_VERSION=${{ matrix.phpVersion }}
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}
            ${{ vars.ECR_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${{ matrix.env }}
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${{ matrix.env }}/${digest#sha256:}"

      - name: Upload ${{ vars.FRANKENPHP_IMAGE_NAME }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digest-php${{ matrix.phpVersion }}-${{ matrix.env }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${{ matrix.env }}/*
          if-no-files-found: 'error'
          retention-days: 1

  join-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 15
    strategy:
      matrix:
        phpVersion:
          - 8.2
          - 8.4
        env:
          - prod
          - dev
    needs:
      - build-and-push-frankenphp-to-dockerhub
    runs-on: onprem-k3s
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download ${{ vars.FRANKENPHP_IMAGE_NAME }} artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${{ matrix.env }}
          pattern: digest-php${{ matrix.phpVersion }}-${{ matrix.env }}-*
          merge-multiple: 'true'

      - name: Join ${{ vars.FRANKENPHP_IMAGE_NAME }} images
        working-directory: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${{ matrix.env }}
        run: |
          declare -a DOCKERHUB_IMAGES
          declare -a ECR_IMAGES

          # All I need is the hashes, which are a part of the /digests/version/ folder
          # the hashes are the same between both Dockerhub and CLI
          for file in $(ls -1 ${{ runner.temp }}/digests/${{ matrix.phpVersion }}); do
              DOCKERHUB_IMAGES+=("${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}@sha256:$file")
              ECR_IMAGES+=("${{ vars.ECR_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}@sha256:$file")
          done

          docker buildx imagetools create -t '${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}-${{ matrix.env }}' "${DOCKERHUB_IMAGES[@]}"
          docker buildx imagetools create -t '${{ vars.ECR_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}-${{ matrix.env }}' "${ECR_IMAGES[@]}"
