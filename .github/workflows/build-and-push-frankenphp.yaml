name: Build and push frankenphp

# Build new frankenphp images:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
on:
  push:
   branches:
     - master
     - develop
   paths:
     - 'docker/base-images/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-frankenphp-to-dockerhub:
    env:
      AWS_REGION: ap-southeast-2
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - 8.2
          - 8.4
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }}
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php-frankenphp
          load: true
          provenance: false
          sbom: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ENV=prod
            PHP_MAJOR_VERSION=${{ matrix.phpVersion }}
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}
            ${{ vars.ECR_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.phpVersion }}/${digest#sha256:}"

      - name: Upload ${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-php${{ matrix.phpVersion }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}/*
          if-no-files-found: 'error'
          retention-days: 1

  join-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    strategy:
      matrix:
        phpVersion:
          - 8.2
          - 8.4
    needs:
      - build-and-push-frankenphp-to-dockerhub
    runs-on: onprem-k3s
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download ${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }} artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
          pattern: digest-php${{ matrix.phpVersion }}-*
          merge-multiple: 'true'

      - name: Identify image names
        id: images
        run: |
          echo 'IMAGE_NAMES<<EOF' >> $GITHUB_ENV
          for file in $(ls -1 ${{ runner.temp }}/digests/${{ matrix.phpVersion }}); do
            echo "${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}:${file}" >> $GITHUB_ENV
            echo "${{ vars.ECR_NAMESPACE }}/${{ vars.FRANKENPHP_IMAGE_NAME }}:${file}" >> $GITHUB_ENV
          done
          echo 'EOF' >> $GITHUB_ENV
          cat $GITHUB_ENV

      - name: Tag ${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }} images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMES }}
          tags: |
            type=ref,event=branch,prefix=latest-php${{ matrix.phpVersion }}-
            type=raw,value=latest-php${{ matrix.phpVersion }}-${{ github.ref_name }}

      # Need to join ECR and Dockerhub images separately
      - name: Join ${{ vars.FRANKENPHP_IMAGE_NAME }}:latest-php${{ matrix.phpVersion }} images
        working-directory: ${{ runner.temp }}/digests/${{ matrix.phpVersion }}
        run: |
          declare DOCKERHUB_IMAGES
          declare ECR_IMAGES
          for image in $DOCKERHUB_METADATA_OUTPUT_TAGS; do
            if [[ $image == *"${{ vars.DOCKERHUB_NAMESPACE }}"* ]]; then
              DOCKERHUB_IMAGES="$DOCKERHUB_IMAGES $image"
            fi
            if [[ $image == *"${{ vars.ECR_NAMESPACE }}"* ]]; then
              ECR_IMAGES="$ECR_IMAGES $image"
            fi
          done
          echo docker buildx imagetools create -t '${{ vars.DOCKERHUB_NAMESPACE }}:latest-php${{ matrix.phpVersion}}' ${DOCKERHUB_IMAGES[@]}
          echo docker buildx imagetools create -t '${{ vars.ECR_NAMESPACE }}:latest-php${{ matrix.phpVersion}}' ${ECR_IMAGES[@]}
          docker buildx imagetools create -t '${{ vars.DOCKERHUB_NAMESPACE }}:latest-php${{ matrix.phpVersion}}' ${DOCKERHUB_IMAGES[@]}
          docker buildx imagetools create -t '${{ vars.ECR_NAMESPACE }}:latest-php${{ matrix.phpVersion}}' ${ECR_IMAGES[@]}
