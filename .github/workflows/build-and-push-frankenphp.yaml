name: Build and push frankenphp

# Build new frankenphp images:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
on:
  push:
   branches:
     - master
     - develop
   paths:
     - 'docker/base-images/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-frankenphp-to-dockerhub:
    env:
      AWS_REGION: ap-southeast-2
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - long: '8.2'
            short: '82'
          - long: '8.4'
            short: '84'
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            alaress/php${{ matrix.phpVersion.short }}-frankenphp
            ${{ vars.FRANKENPHP_ECR_REPO }}-php${{ matrix.phpVersion.long }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php${{ matrix.phpVersion.short }}-frankenphp
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php-frankenphp
          load: true
          provenance: false
          sbom: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ENV=prod
            PHP_MAJOR_VERSION=8.4
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            alaress/php${{ matrix.phpVersion.short }}-frankenphp
            ${{ vars.FRANKENPHP_ECR_REPO }}-php${{ matrix.phpVersion.long }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload php${{ matrix.phpVersion.short }}-frankenphp artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: 'error'
          retention-days: 1

  join-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    needs:
      - build-and-push-frankenphp-to-dockerhub
    runs-on: onprem-k3s
    steps:
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            alaress/php${{ matrix.phpVersion.short }}-frankenphp
            ${{ vars.FRANKENPHP_ECR_REPO }}-php${{ matrix.phpVersion.long }}
          tags: |
            type=ref,event=branch,prefix=latest-
            type=raw,value=latest-${{ github.ref_name }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BUILD_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download php${{ matrix.phpVersion.short }}-frankenphp artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: 'true'

      - name: Join php${{ matrix.phpVersion.short }}-frankenphp images
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map ("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'alaress/php${{ matrix.phpVersion.short }}-frankenphp@sha256:%s ' *) \
            $(printf '${{ vars.FRANKENPHP_ECR_REPO }}-php${{ matrix.phpVersion.long }}@sha256:%s ' *)
