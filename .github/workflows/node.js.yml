# This workflow will do a clean installation of node dependencies, cache/restore them, run the build if available and run the tests
# It will also run a full typecheck and ensure all linting rules are followed
# Note it will only run when changes to js, ts or vue files are added to PRs
# It will also run if changes are made to relevant config files (eslintignore, .eslintrc.js, package.json, tsconfig.json, npm-shrinkwrap.json)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Check JS

on:
  pull_request:
    branches: ["develop", "master"]
    paths: ["**.js", "**.ts", "**.vue", ".eslintignore", ".eslintrc.js", "package.json", "tsconfig.json", "npm-shrinkwrap.json"]

# Cancel on push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

  typecheck:
    timeout-minutes: 25
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check ESLint Compliance
        run: npm run lint

      - name: Check Prettier Compliance
        run: npm run prettier:check
