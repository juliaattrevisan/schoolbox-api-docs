# This workflow will do a clean installation of node dependencies, cache/restore them, run the build if available and run the tests
# It will also run a full typecheck and ensure all linting rules are followed
# Note it will only run when changes to js, ts, vue or scss files are added to PRs
# It will also run if changes are made to relevant config files (eslintignore, .eslintrc.js, package.json, tsconfig.json, npm-shrinkwrap.json)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Check JS

on:
  pull_request:
    branches: ["develop", "master"]
    paths:
      - "**.js"
      - "**.ts"
      - "**.vue"
      - "**.scss"
      - ".eslintignore"
      - ".eslintrc.js"
      - "package.json"
      - "tsconfig.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/node.js.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel on push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  install-deps:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci
      - run: tar -cf node_modules.tar node_modules

      - name: Upload node_modules tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolbox-node-modules
          path: node_modules.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build:
    needs: install-deps
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-node-modules
          path: .
      - run: tar -xf node_modules.tar
      - run: npm run build --if-present
      - run: npm test

  typecheck:
    needs: install-deps
    timeout-minutes: 25
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-node-modules
          path: .
      - run: tar -xf node_modules.tar

      - name: Typecheck
        run: npm run typecheck

  eslint:
    needs: install-deps
    timeout-minutes: 25
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-node-modules
          path: .
      - run: tar -xf node_modules.tar

      - name: Check ESLint Compliance
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

  prettier:
    needs: install-deps
    timeout-minutes: 25
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-node-modules
          path: .
      - run: tar -xf node_modules.tar

      - name: Check Prettier Compliance
        run: npm run prettier:check
