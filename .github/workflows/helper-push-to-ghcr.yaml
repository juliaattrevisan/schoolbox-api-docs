name: Build and push to Github Container Registry

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: |
          The name of the image to push.

          Must have had an artifact built for it already, named
          `{{ inputs.image }}-{{ arch }}`
        required : true

jobs:
  push-to-ghcr:
    runs-on: onprem-k3s
    strategy:
      matrix:
        build:
          - platform: linux
            arch: amd64
          - platform: linux
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            ${{ inputs.context }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download ${{ inputs.image }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}

      - name: Load ${{ inputs.image }} image
        run: |
          docker image load --input ${{ runner.temp }}/${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar

      - name: Login to Amazon ECR Private
        if: env.AWS_ECR_ROLE != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ${{ inputs.image }} image
        if: env.AWS_ECR_ROLE != ''
        run: |
          docker push -a ghcr.io/${{ inputs.image }} --platform ${{ matrix.build.platform }}/${{ matrix.build.arch }}
