name: Build schoolbox-frankenphp (pull request)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

# Cancel upon push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Build artifacts before building image
  build-composer-artifact:
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-frankenphp image
  build-schoolbox-frankenphp:
    env:
      AWS_REGION: ap-southeast-2
    timeout-minutes: 60
    needs:
      - build-composer-artifact
      - build-npm-artifact
    strategy:
      matrix:
        build:
          - runs-on: onprem-k3s
            platform: linux
            arch: amd64
          - runs-on: onprem-k3s-arm
            platform: linux
            arch: arm64
        phpVersion:
          - 8.4
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.READ_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Build schoolbox-frankenphp pull request image
        uses: docker/build-push-action@v6
        with:
          context: docker/schoolbox-frankenphp
          file: docker/schoolbox-frankenphp/deploy-image.Dockerfile
          build-contexts: |
            code=${{ github.workspace }}
          push: false
          load: true
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
            TAG=latest-${{ github.base_ref }}-${{ matrix.phpVersion }}
            PHP_MAJOR_VERSION=${{ matrix.phpVersion }}
          tags: |
            schoolbox-frankenphp-${{ matrix.build.arch }}-php${{ matrix.phpVersion }}

      # Smoke test for box:
      # could attempt to run PHPUnit within the box as well?
      - name: Test schoolbox-frankenphp
        run: |
          docker image ls
          image="$(docker image ls -q schoolbox-frankenphp-${{ matrix.build.arch }})-php${{ matrix.phpVersion }}"
          docker run -i "$image" ls -al /etc/
          docker run -i "$image" ls -al /etc/caddy
          docker run -i "$image" ls -al /usr/local/lib/php/extensions/no-debug-zts-20220829/
          docker run -i "$image" ls -al /usr/local/etc/php/conf.d/
          docker run -i "$image" ls -al /usr/share/schoolbox/
          docker run -i "$image" ls -al /usr/share/schoolbox/vendor/
          docker run -i "$image" ls -al /usr/share/schoolbox/www/static/js/bundle/
