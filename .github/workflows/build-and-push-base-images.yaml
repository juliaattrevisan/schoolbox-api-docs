name: Build and push base images (php82-alpine, php82-fpm-alpine)

# Build new php82-alpine and php82-fpm-alpine images:
# * whenever docker/base-images/** changes?
#   (develop only for now: master and develop will use the same base images)
# * manually (workflow_dispatch)?
# * on a cron?
on:
  push:
    branches:
#      - master
      - develop
    paths:
      - 'docker/base-images/**'
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push-php82-alpine-to-dockerhub:
    # TODO use helper workflow (need to add arch to every tag first)
#    uses: ./.github/workflows/helper-build-and-push-to-dockerhub.yaml
#    with:
#      image: php82-alpine
#      context: docker/base-images/php82-alpine
#    secrets: inherit
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php82-alpine to Dockerhub
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php82-alpine
          cache-from: type=gha
          cache-to: type=gha
          load: true
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          # Remove provenance and SBOM for now, as they convert the image build
          # to a manifest, which prevents the images from being merged into a
          # manifest later on.
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/php82-alpine:latest-${{ matrix.build.arch }}

      - name: Upload php82-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/php82-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          retention-days: 1

  join-php-82-alpine:
    needs:
      - build-and-push-php82-alpine-to-dockerhub
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join php82-alpine images
        run: |
          docker manifest create alaress/php82-alpine:latest \
            --amend alaress/php82-alpine:latest-amd64 \
            --amend alaress/php82-alpine:latest-arm64
          docker manifest push --purge alaress/php82-alpine:latest

      # Need artifact for the joined image too, or pull the just built image?

  build-and-push-php82-fpm-alpine-to-dockerhub:
    needs:
      - join-php-82-alpine
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php82-fpm-alpine to Dockerhub
        uses: docker/build-push-action@v6
        with:
          context: docker/base-images/php82-fpm-alpine
          cache-from: type=gha
          cache-to: type=gha
          load: true
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/php82-fpm-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          provenance: false
          sbom: false
          build-args: |
            ENV=prod
            ARCH=${{ matrix.build.arch }}
#          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/php82-fpm-alpine:latest-${{ matrix.build.arch }}

      - name: Upload php82-fpm-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-fpm-alpine-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/php82-fpm-alpine-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          retention-days: 1

  join-php-82-fpm-alpine:
    needs:
      - build-and-push-php82-fpm-alpine-to-dockerhub
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join php82-fpm-alpine images
        run: |
          docker manifest create alaress/php82-fpm-alpine:latest \
            --amend alaress/php82-fpm-alpine:latest-amd64 \
            --amend alaress/php82-fpm-alpine:latest-arm64
          docker manifest push --purge alaress/php82-fpm-alpine:latest

  push-php82-to-ecr:
    needs:
      - join-php-82-alpine
    uses: ./.github/workflows/helper-push-to-ecr.yaml
    with:
      image: php82-alpine
    secrets: inherit

  push-php82-fpm-to-ecr:
    needs:
      - join-php-82-fpm-alpine
    uses: ./.github/workflows/helper-push-to-ecr.yaml
    with:
      image: php82-fpm-alpine
    secrets: inherit
