name: build-npm-artifact

on:
  workflow_call:

jobs:
  build-npm-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        id: cache-npm-ci
        with:
          path: node_modules
          key: npm-ci-${{ runner.os }}-${{ hashFiles('**/npm-shrinkwrap.json') }}
      - run: npm ci
        if: steps.cache-npm-ci.outputs.cache-hit != 'true'

      # Cache based on any buildable files changing:
      # that includes JS, TS, Vue, CSS, SCSS.
      # Not perfect as not all JS and CSS files are compiled, but it will do.
      - uses: actions/cache@v4
        id: cache-npm-publish
        with:
          path: www/static/js/bundle
          key: npm-publish-${{ runner.os }}-${{ hashFiles('**/npm-shrinkwrap.json,babel.config.js,tsconfig.json,webpack*.js,**/*.js,**/*.ts,**/*.vue,**/*.css,**/*.scss') }}
      - run: npm run publish
        if: steps.cache-npm-publish.outputs.cache-hit != 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle
          retention-days: 1
