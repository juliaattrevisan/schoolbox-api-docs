name: push-to-ecr

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: |
          The name of the image to push.

          Also uploads an artifact for the image, which can be loaded by the
          push to ECR job.
        required: true
      context:
        type: string
        description: |
          The build context for the image.

          Also determines what is checked out in the checkout step.
        required: true
      file:
        type: string
        default: ''
        description: |
          A path to the Dockerfile to use to build the image: if not provided,
          uses the Dockerfile in `inputs.context`.
        required: false
      tags:
        type: string
        default: |
          alaress/${{ inputs.image }}:latest
        description: |
          A comma-separated list of tags for the image.
    secrets:
      DOCKERHUB_USERNAME:
        description: |
          The username within Dockerhub.
        required : false

      DOCKERHUB_TOKEN:
        description: |
          The token or password to use when authenticating with Dockerhub.
        required: false

# Separate job variants are required for AMD64 and ARM64 builds, so that the
# build runs on the same architecture as the image it's building:
# QEMU building an ARM64 image on an AMD64 arch is too slow to be acceptable.
jobs:
  push-to-ecr:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        build:
        - runs-on: ubuntu-latest
          platform: linux
          arch: amd64
        - runs-on: ubuntu-arm
          platform: linux
          arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          sparse-checkout: |
            ${{ inputs.context }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        if: env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

#      # TODO remove caching before this goes to prod
#      - name: Load ${{ inputs.image }} cache
#        uses: actions/cache@v4
#        id: cache-${{ inputs.image }}
#        with:
#          path: ${{ runner.temp }}/${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
#          key: ${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}

      # Not sure if pushing a same tagged image with a different platform will
      # make the image available for different platforms.
      - name: Build and push ${{ inputs.image }}
        uses: docker/build-push-action@v6
#        if: steps.cache-${{ inputs.image }}.outputs.cache-hit != 'true'
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || '' }}
          push: ${{ !(env.DOCKERHUB_USERNAME && env.DOCKERHUB_TOKEN)}}
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: ${{ inputs.tags }}

      - name: Upload ${{ inputs.image }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/${{ inputs.image }}-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          retention-days: 1
