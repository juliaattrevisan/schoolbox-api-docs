name: Build NPM artifact

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        description: |
          The environment this is to be built on
          (e.g. `ubuntu-latest`, `ubuntu-arm`).
        required: true
      platform:
        type: string
        description: |
          The platform of the image to build (e.g. `linux`).
        required: true
      arch:
        type: string
        description: |
          The processor architecture of the image to build
          (e.g. `amd64`, `arm64`).
        required: true

jobs:
  build-php82-alpine-artifact:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build this image only if it's new:
      # otherwise, pull from cache?
      - name: Build php82-alpine
        uses: docker/build-push-action@v6
#        if: steps.cache-php82-alpine.outputs.cache-hit != 'true'
        with:
          context: docker/base-images/php82-alpine/
#          load: true
          push: false
#          cache-from: type=local,src=${{ runner.temp }}/image-cache
#          cache-to: type=local,dest=${{ runner.temp }}/image-cache
          build-args: |
            ENV=prod
          platforms: ${{ inputs.platform }}/${{ inputs.arch }}
          tags: |
            alaress/php82-alpine:latest

      # Extract necessary artifacts out of image:
      # /etc/odbc.ini
      # /etc/odbcinst.ini
      # /opt/microsoft
      # /opt/mssql-tools18
      # /usr/local/lib/php/extensions/no-debug-non-zts-20220829
      # /usr/local/etc/php/conf.d/
      - name: Extract artifact files from php82-alpine
        run: |
          docker create --name=temp alaress/php82-alpine:latest
          mkdir -p \
            artifact/etc/ \
            artifact/opt/microsoft/ \
            artifact/opt/mssql-tools18/ \
            artifact/usr/local/lib/php/extensions/ \
            artifact/usr/local/etc/php/
          docker cp temp:/etc/odbc.ini                                           artifact/etc/
          docker cp temp:/etc/odbcinst.ini                                       artifact/etc/
          docker cp temp:/opt/microsoft                                          artifact/opt/
          docker cp temp:/opt/mssql-tools18                                      artifact/opt/
          docker cp temp:/usr/local/lib/php/extensions/no-debug-non-zts-20220829 artifact/usr/local/lib/php/extensions/
          docker cp temp:/usr/local/etc/php/conf.d/                              artifact/usr/local/etc/php/

      - name: Upload php82-alpine artifact
        uses: actions/upload-artifact@v4
        with:
          name: php82-alpine-${{ inputs.platform }}-${{ inputs.arch }}
          path: artifact
          retention-days: 1
