name: Push to AWS ECR

on:
  workflow_call:
    inputs:
      image:
        type: string
        description: |
          The name of the image to push.

          Must have had an artifact built for it already, named
          `{{ inputs.image }}`.
        required : true
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: |
          The AWS role required to call the ECR API.
        required : false

jobs:
  push-to-ecr:
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region:
          - ap-southeast-2
#          - ap-southeast-1
#          - me-south-1
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download ${{ inputs.image }} artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image }}
          path: ${{ runner.temp }}

      - name: Load ${{ inputs.image }} image
        run: |
          docker image load --input ${{ runner.temp }}/${{ inputs.image }}.tar

      - name: Configure AWS Credentials
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR Private
        if: env.AWS_ROLE_TO_ASSUME != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push ${{ inputs.image }} image
        if: env.AWS_ROLE_TO_ASSUME != ''
        run: |
          docker push -a ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image }} --platform linux/amd64,linux/arm64
