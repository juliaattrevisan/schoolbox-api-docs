# Do what needs to be done to build the PR.
name: build-and-push-schoolbox-fpm

# Trigger an artifact rebuild:
# * whenever docker/base-images/php82 changes
# * manually (workflow_dispatch)
# * on a cron?
on:
  pull_request:

jobs:
  build-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6
        with:
          dev: no
          args: --profile --ignore-platform-reqs -a
          php_version: '8.2'
          version: '2.8'

  build-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/workflows/node.js.yml@build

