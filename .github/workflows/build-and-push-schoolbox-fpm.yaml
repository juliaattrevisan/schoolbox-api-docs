name: build-and-push-schoolbox-fpm

# Build a new schoolbox-fpm image:
# * when master or develop changes (tags: master, develop, commit hash)
# * when a release is created (tags: release name)
on:
  push:
    branches:
#      - master
      - develop
  workflow_dispatch:

jobs:
  build-composer-artifact:
    uses: ./.github/workflows/build-composer-artifact.yaml

  build-npm-artifact:
    uses: ./.github/workflows/build-npm-artifact.yaml

  build-and-push-amd64:
    needs:
      - build-composer-artifact
      - build-npm-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract artifacts
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-vendor
          path: vendor/

      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/deployment-image.Dockerfile
          push: true
          build-args: |
            ENV=prod
          platforms: linux/amd64
          tags: alaress/schoolbox-fpm:latest

  build-and-push-arm64:
    needs:
      - build-composer-artifact
      - build-npm-artifact
    runs-on: ubuntu-arm
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract artifacts
      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-vendor
          path: vendor/

      - uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/deployment-image.Dockerfile
          push: true
          build-args: |
            ENV=prod
          platforms: linux/arm64
          tags: alaress/schoolbox-fpm:latest
