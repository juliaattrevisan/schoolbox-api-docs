# Do what needs to be done to build the PR.
name: build-and-push-schoolbox-fpm

# Trigger an artifact rebuild:
# * whenever docker/base-images/php82 changes
# * manually (workflow_dispatch)
# * on a cron?
on:
  pull_request:

jobs:
  build-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v4
        id: cache-vendor
        with:
          path: /tmp/composer-cache
          key: vendor-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6
        with:
          dev: no
          args: --profile --ignore-platform-reqs -a
          php_version: '8.2'
          # The Composer action takes `2.2.x` but not `2.8.x`? Srsly?
          version: '2.8.6'

      - uses: actions/upload-artifact@v4
        with:
          name: schoolbox-vendor
          path: vendor/
          retention-days: 1

  build-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        id: cache-npm-ci
        with:
          path: node_modules
          key: npm-ci-${{ runner.os }}-${{ hashFiles('**/npm-shrinkwrap.json') }}
      - run: npm ci
        if: steps.cache-npm-ci.outputs.cache-hit != 'true'

      # Cache based on any buildable files changing:
      # that includes JS, TS, Vue, CSS, SCSS.
      # Not perfect as not all JS and CSS files are compiled, but it will do.
      - uses: actions/cache@v4
        id: cache-npm-publish
        with:
          path: www/static/js/bundle
          key: npm-publish-${{ runner.os }}-${{ hashFiles('**/npm-shrinkwrap.json,**/*.{js,ts,vue,css,scss}') }}
      - run: npm run publish
        if: steps.cache-npm-publish.outputs.cache-hit != 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle
          retention-days: 1

