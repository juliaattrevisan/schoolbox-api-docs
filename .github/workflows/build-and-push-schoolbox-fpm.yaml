# Do what needs to be done to build the PR.
name: build-and-push-schoolbox-fpm

# Trigger an artifact rebuild:
# * whenever docker/base-images/php82 changes
# * manually (workflow_dispatch)
# * on a cron?
on:
  pull_request:

jobs:
  build-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v4
        id: cache-vendor
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6
        with:
          dev: no
          args: --profile --ignore-platform-reqs -a
          php_version: '8.2'
          # The Composer action takes `2.2.x` but not `2.8.x`? Srsly?
          version: '2.8.6'
        if: steps.cache-vendor.outputs.cache-hit != 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: schoolbox-vendor
          path: vendor/
          retention-days: 1
