name: Build and push schoolbox-fpm (push, release)

# Build a new schoolbox-fpm image:
# * when master or develop changes (tags: master, develop, commit hash)
# * when a release is created (tags: release name (github.ref_name))
on:
  push:
    branches:
      - master
      - develop
  release:
    types:
      - published

jobs:
  # Build artifacts before building image
  build-composer-artifact:
    uses: ./.github/workflows/helper-build-composer-artifact.yaml

  build-npm-artifact:
    uses: ./.github/workflows/helper-build-npm-artifact.yaml

  # Build schoolbox-fpm image
  build-and-push-schoolbox-fpm:
    needs:
      - build-composer-artifact
      - build-npm-artifact
    strategy:
      matrix:
        build:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
          - runs-on: ubuntu-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.build.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract artifacts
      - name: Download composer artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-composer
          path: vendor/

      - name: Download npm artifact
        uses: actions/download-artifact@v4
        with:
          name: schoolbox-npm
          path: www/static/js/bundle/

      # Different build-and-push depending on trigger:
      # push: {{ github.ref_name }}-latest, {{ github.ref_name }}-{{ github.sha }}
      #       (ref_name should be master or develop)
      # release: {{ github.ref_name }}
      # For now this uses a remote image as its build context, later it may use
      # an artifact built in this step?
      - name: Build and push schoolbox-fpm deployment image (latest)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/deploy-image.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-alpine=docker-image://alaress/php82-alpine
            code=${{ github.workspace }}
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/schoolbox-fpm-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/schoolbox-fpm:{{ github.ref_name }}-latest
            alaress/schoolbox-fpm:{{ github.ref_name }}-{{ github.sha }}

      - name: Build and push schoolbox-fpm deployment image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/deploy-image.Dockerfile
          cache-from: type=gha
          cache-to: type=gha
          build-contexts: |
            php82-alpine=docker-image://alaress/php82-alpine
            code=${{ github.workspace }}
          push: true
          outputs: type=docker,dest=${{ runner.temp }}/schoolbox-fpm-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          build-args: |
            ENV=prod
          platforms: ${{ matrix.build.platform }}/${{ matrix.build.arch }}
          tags: |
            alaress/schoolbox-fpm:{{ github.ref_name }}

      - name: Upload schoolbox-fpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image }}-${{ matrix.build.arch }}
          path: ${{ runner.temp }}/schoolbox-fpm-${{ matrix.build.platform }}-${{ matrix.build.arch }}.tar
          retention-days: 1

  push-schoolbox-fpm-alpine-to-ecr:
    needs:
      - build-and-push-schoolbox-fpm
    uses: ./.github/workflows/helper-push-to-ecr.yaml
    with:
      image: schoolbox-fpm
    secrets: inherit
