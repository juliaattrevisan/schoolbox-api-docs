name: "Notify #developers Slack channel"

on:
  workflow_call:
    inputs:
      workflow_name:
        description: Name of the workflow that just completed
        required: true
        type: string
      status:
        description: Final workflow status (success|failure)
        required: true
        type: string
      ref_name:
        description: Branch or tag name for the run
        required: true
        type: string
      run_url:
        description: URL of the GitHub Actions run
        required: true
        type: string
    secrets:
      SLACK_DEVELOPERS_WEBHOOK_URL:
        required: true
  workflow_dispatch:
    inputs:
      workflow_name:
        description: Name of the workflow that just completed
        required: true
        type: string
      status:
        description: Final workflow status (success|failure)
        required: true
        type: choice
        options:
          - success
          - failure
      ref_name:
        description: Branch or tag name for the run
        required: true
        type: string
      run_url:
        description: URL of the GitHub Actions run
        required: true
        type: string

jobs:
  notify-operations:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: "Send Slack message to #operations"
        env:
          STATUS: ${{ inputs.status }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          REF_NAME: ${{ inputs.ref_name }}
          RUN_URL: ${{ inputs.run_url }}
          SLACK_OPERATIONS_WEBHOOK_URL: ${{ secrets.SLACK_OPERATIONS_WEBHOOK_URL }}
        run: |
          if [ "${STATUS}" = "success" ]; then
            ICON=":white_check_mark:"
            RESULT="completed successfully"
          else
            ICON=":x:"
            RESULT="failed"
          fi

          MESSAGE="${ICON} Container build workflow *${WORKFLOW_NAME}* ${RESULT} on \`${REF_NAME}\`. <${RUN_URL}|View run>"
          PAYLOAD="$(jq -nc --arg channel '#developers' --arg text "${MESSAGE}" '{channel: $channel, text: $text}')"

          curl --fail-with-body --request POST \
            --header 'Content-type: application/json' \
            --data "${PAYLOAD}" \
            "${SLACK_OPERATIONS_WEBHOOK_URL}"
