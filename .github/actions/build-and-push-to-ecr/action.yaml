name: Build and push to Elastic Container Registry

inputs:
  platform:
    description: |
      The platform of the image to build (e.g. `linux`).
    required: true
  arch:
    description: |
      The processor architecture of the image to build
      (e.g. `amd64`, `arm64`).
    required: true
  image:
    description: |
      The name of the image to push.
    required: true
  region:
    description: |
      The AWS region to push to.
    required: true

runs:
  using: composite
  steps:
    - name: Download ${{ inputs.image }} artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}
        path: ${{ runner.temp }}

    - name: Load ${{ inputs.image }} image
      shell: sh
      run: |
        docker image load --input ${{ runner.temp }}/${{ inputs.image }}-${{ inputs.platform }}-${{ inputs.arch }}.tar

    - name: Configure AWS Credentials
      if: env.AWS_ECR_ROLE != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ECR_ROLE }}
        aws-region: ${{ inputs.region }}

    - name: Login to Amazon ECR Private
      if: env.AWS_ECR_ROLE != ''
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Push ${{ inputs.image }} image
      if: env.AWS_ECR_ROLE != ''
      shell: sh
      run: |
        docker push -a ${{ steps.login-ecr.outputs.registry }}/${{ inputs.image }} --platform ${{ inputs.platform }}/${{ inputs.arch }}
