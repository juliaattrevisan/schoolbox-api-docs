<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="small_head">Folders</h2>
  </div>
<!-- BEGIN config -->
  <a class="config" onclick="toggleConfig('component{COMPONENT_ID}');"></a>
  <div class="componentConfig">
    <form action="subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table>
    <!-- BEGIN folders -->
    <tr>
      <td class="small_text" style="border-bottom:1px solid #666">{FOLDER_NAME}</td>
      <td class="small_text" style="border-bottom:1px solid #666;text-align:right;">{HOMEPAGE_LINK}</td>
    </tr>
    <!-- END folders -->
    <tr style="height:1px;">
      <td colspan="3" style="border-bottom:1px solid #666;"></td>
    </tr>
    <!-- BEGIN submit_folder -->
    <tr>
      <td colspan="2" style="text-align:right"><img src="/images/mgs/arrow_bullet.gif" alt="small arrow" /><a href="/cms/modFolder.php?action=add&cid={ID}">ADD FOLDER</a></td>
    </tr>
    <!-- END submit_folder -->
  </table>
</div>
