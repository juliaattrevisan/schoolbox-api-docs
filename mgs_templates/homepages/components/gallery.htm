<script type="text/javascript" src="/javascript/mootools.js"></script>
<script type="text/javascript" src="/javascript/slimbox.js"></script>
<link rel="stylesheet" href="/css/slimbox.css" type="text/css" media="screen" />
<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="large_head">Image Gallery</h2>
  </div>
    <!-- BEGIN config -->
  <a class="config" onclick="toggleConfig('component{COMPONENT_ID}');"></a>
  <div class="componentConfig">
    <form action="subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Image Rows: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table>
    <tr>
      <td><table>
          <!-- BEGIN thumb_row -->
          <tr>
            <!-- BEGIN thumb_cell -->
            <td align="center" >{THUMBNAIL}</td>
            <!-- END thumb_cell -->
          </tr>
          <!-- END thumb_row -->
        </table></td>
    </tr>
    <tr style="height:2px;">
      <td colspan="2" style="background:#666;"></td>
    </tr>
    <tr>
      <td style="text-align:right;" colspan="2" class="navbar"><img src="/images/mgs/arrow_bullet.gif" alt="small arrow" /><a href="/cms/imageGallery.php?category={CATID}">FULL GALLERY</a></td>
    </tr>
  </table>
</div>
