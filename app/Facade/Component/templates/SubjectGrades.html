<ul>
    {% if content %}
    {% for grade in content %}
    <li title="{{ grade.name }}" class="dashbutton">
        <a href="{{ grade.href }}">{{ grade.name }}
            <p>{{ grade.date }}</p>
            <span style="font-weight: bold; text-transform: none; display: block; position: absolute; top: 0; right: 16px; height: 100%; text-align: right; color: #555; padding-top: 24px;">{{ grade.mark }}</span>
        </a>
    </li>
    {% endfor %}
    {% else %}
    <li>
        <p>No grades listed</p>
    </li>
    {% endif %}
</ul>
