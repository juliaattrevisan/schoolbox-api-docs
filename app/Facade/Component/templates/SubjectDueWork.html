<ul>
    {% if content %}
    {% for work in content %}
    <li title="{{ work.title }}" class="dashbutton">
        <a href="{{ work.href }}">{{ work.title }}
            <p>{{ work.date_relative }}</p>
        </a>
    </li>
    {% endfor %}
    {% else %}
    <li>
        <p>No due work</p>
    </li>
    {% endif %}
</ul>
