<ul>
    {% if content %}
    {% for folder in content %}
    <li title="{{ folder.name }}">
        {% if folder.template %}
        <a href="/m/facade/homepage/display/{{ folder.id }}">{{ folder.name }}</a>
        {% else %}
        <p>{{ folder.name }}</p>
        {% endif %}
    </li>
    {% endfor %}
    {% else %}
    <li><p>No folders</p></li>
    {% endif %}
</ul>
