<ul>
    {% if content %}
    {% for news in content %}
    <li title="{{ news.item_heading }}">
        <a href="/m/news/article/category/{{ news.id }}">
            {{ news.heading }}
            <p>{{ news.item_body_clean | raw }}</p>
            <p>{{ news.post_datetime_relative }} by {{ news.poster }}</p>
        </a>
    </li>
    {% endfor %}
    {% else %}
    <li><p>No news</p></li>
    {% endif %}
</ul>
