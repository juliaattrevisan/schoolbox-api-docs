<form id="login_frm" method="post" class="clearfix" action="{{ page.basedir }}/core/auth/login_form" style="padding: 2em 0 0 0">
    <label for="username"><input type="text" name="username" id="username" placeholder="username" /></label>
    <label for="password"><input type="password" name="password" id="password" placeholder="password" /></label>
    <input class="login submit-btn-plain" type="submit" name="Submit" value="Login" alt="Login" />
</form>
