# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
actor: AcceptanceTester
modules:
    enabled:
        - WebDriver:
            url: https://vagrant.dev.schoolbox.cloud
            browser: chrome
            port: 9515
            window_size: false
            capabilities:
              chromeOptions:
                args: ["--headless", "--disable-gpu", "--window-size=1920x9999", "--ignore-certificate-errors", "--use-fake-device-for-media-stream", "--use-fake-ui-for-media-stream"]
                binary: "/usr/bin/chromium-browser"
              acceptInsecureCerts: true
        - Tests\Support\Helper\Acceptance
        - Tests\Support\Helper\SchoolboxCli
        - Asserts
        - Db:
            dsn: "mysql:host=localhost;dbname=schoolbox"
            user: "root"
            password: "tnp879"
            # dump goes here
        - Cli:

extensions:
    enabled:
      - Codeception\Extension\RunProcess:
          0: '/usr/bin/chromedriver --url-base=/wd/hub'
          sleep: 5
