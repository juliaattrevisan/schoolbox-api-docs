actor: ApiTester
step_decorators:
  - \Codeception\Step\AsJson
modules:
  enabled:
    - REST:
        depends: PhpBrowser
        url: '%BASE_URL%'
        xdebug: true
        part: Json
    - Db:
        dsn: "mysql:host=%SQL_HOST%;dbname=%SQL_DB%"
        user: "%SQL_USER%"
        password: "%SQL_PASSWD%"
    - Tests\Support\Helper\Api:
    - Asserts:
    - Tests\Support\Helper\Integration:
        depends: PhpBrowser
        url: '%BASE_URL%'
        xdebug: true
        curl:
          CURLOPT_SSL_VERIFYPEER: false
