<style type="text/css">
* {
	margin:0pt;
	padding:0pt;
}
body {
	background:#182484 url(/images/mgs/background.gif) repeat scroll 0%;
	color:#666666;
	font-family:Verdana,Arial,Helvetica,sans-serif,serif;
	font-size:100%;
	margin:0pt;
	padding:0pt;
	text-align:left;
	width:100%;
}
h1 {
	background:transparent none repeat scroll 0%;
	font-weight:bold;
	letter-spacing:-1px;
	margin:10px 0pt 0pt;
	padding:1px 0pt 1px 3px;
	border-bottom:4px solid #00458C;
	border-left:20px solid #00458C;
	font-size:120%;
}
p {
	color:#000000;
	line-height:1.4em;
	margin:0.8em 0pt 0pt;
}
#content_text {
	background:#FFFFFF none repeat scroll 0%;
	border:4px solid #00458C;
	color:#000000;
	font-size:80%;
	line-height:1.4em;
	margin-right:10px;
	padding:10px;
	z-index:1;
}
table {
	margin-top: 10px;
	font-weight:normal;
	width:100%;
}
table tr {
	vertical-align:middle;
}
table th {
	background:#00458C none repeat scroll 0%;
	color:#FFFFFF;
	font-family:Verdana,arial,sans-serif,serif;
	font-size:100%;
	font-size-adjust:none;
	font-stretch:normal;
	font-style:normal;
	font-variant:normal;
	font-weight:bold;
	line-height:1em;
	padding:3px;
}
table td {
	font-size:100%;
	padding:0 3px;
	
}
.indent {
	margin:0pt;
	padding-left:20px;
}
#outline {
	display: none;
	position: absolute;
	margin: 0;
	padding: 0;
	top: 0;
	left: 0;
	border-bottom: 1px solid red;
	border-right: 1px solid red;
	width: 800px;
	height: 600px;
	z-index: 10;
}

</style>
</head>
<body>
<div id="outline"></div>
<div id="content_text" style="margin: 5px; padding: 4px;">
<h1>Ready for Owner Pickup</h1>

<div class='indent'>
    <table cellpadding="0" cellspacing="0">
    <thead>
    <tr>
        <th class="tableHeadLeft">USER</th>
        <th class="tableHeadLeft">MODEL</th>
        <th class="tableHead">READY</th>
    </tr>
    </thead>
    <tbody>
    <!-- BEGIN ready -->
    <tr>
        <td>{USER}</td>
        <td width="350">{BRAND} {MODEL}</td>  
        <td class="value" width="80"><img src="/images/button_tick.jpg" /></td>
    </tr>
    <!-- END ready -->
    </tbody>
    </table>
</div>

<h1>Currently at Dealer</h1>

<div class='indent'>
    <table cellpadding="0" cellspacing="0">
    <thead>
    <tr>
        <th class="tableHeadLeft">USER</th>
        <th class="tableHeadLeft">MODEL</th>
        <th class="tableHead">DATE</th>
    </tr>
    </thead>
    <tbody>
    <!-- BEGIN dealer -->
    <tr>
        <td>{USER}</td>
        <td width="350">{BRAND}{MODEL}</td>
        <td class="value" width="80"><img src="/images/button_cross.jpg" /></td>
    </tr>
    <!-- END dealer -->
    </tbody>
    </table>
</div>

</div>

</body>
