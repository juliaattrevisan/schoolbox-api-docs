<h2 style="margin-top:0;">Add New Event</h2>
<form method='POST' action='jobDetails.php' id="signup" name="signup">
  <table cellpadding="0" cellspacing="0">
    <tr id='trNewEvent' class='tr_hidden'>
      <td class='fieldcell'><select name='eventTypeID'>
          <!-- BEGIN OPTIONS_EventType -->
          <option value='{VALUE}'{SELECTED}>{NAME}</option>
          <!-- END OPTIONS_EventType -->
        </select>
&nbsp;
        <input name='eventDescription' type='text' size="60" >
      </td>
      <td class='fieldcell' width="100"><input type='hidden' name='jobID' value='{JOB_ID}'>
        <input type='hidden' name='action' value='newEvent'>
        <input type='submit' name='submit' value='add'>
      </td>
    </tr>
  </table>
</form>
<!-- BEGIN eventList -->
<h2>Events</h2>
<table class="ruler" cellpadding="0" cellspacing="0">
  <thead>
    <tr>
      <td class="tableHeadLeft">CREATED BY</td>
      <td class="tableHeadLeft">DESCRIPTION</td>
      <td class="tableHead">ON</td>
      <td class="tableHead">&nbsp;</td>
    </tr>
  </thead>
  <tbody>
    <!-- BEGIN item -->
    <tr>
      <td width="120">{USER}</td>
      <td >{DESCRIPTION}</td>
      <td class="value" width="140">{DATE}</td>
      <td class="value" width="50">
	  <!-- BEGIN event_delete -->
        <form method='POST' onSubmit='return confirm( "Sure you want to delete this event?");' id="signup" name="signup">
          <input type='hidden' name='jobEventID' value='{JOB_EVENT_ID}'>
          <input type='hidden' name='action' value='deleteEvent'>
          <input type='hidden' name='jobID' value='{JOB_ID}'>
          <input type='image' name='buttonDelete' src='images/button_cross.jpg' width='10px'>
        </form>
        <!-- END event_delete -->
      </td>
    </tr>
    <!-- END item -->
  </tbody>
</table>
<!-- END eventList -->
