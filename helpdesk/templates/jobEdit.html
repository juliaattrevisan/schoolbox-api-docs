<script language='JavaScript' type='text/javascript'>

		// Indicates whether the user or equipment section has been removed.
		// There's a script block within both of these sections that sets the variable to false
		// HOWEVER I think I might remove the ability to remove sections - it means that if a new  is assigned to
		// a piece of equipment it can't be re-assigned to a user and v.v.
	var sectionRemoved = true;

	function init() {
	}

	function setInactive( objActive, objInactive) {
		if( !sectionRemoved) { 
			objInactive.value = '';
			objInactive.style.background = '#bbbbbb';
			objActive.style.background = 'white';

				// If preset equipmentID, clear
			if( objInactive.name == 'serial') {
				objInactive.form.equipmentID.value = '';
			}
		}
	}


	function validateForm( form) {
		var sure;

		if( form.serial && form.associatedUser) {
			if( (form.serial.value == '') && (form.associatedUser.value == '')) {
				form.serial.focus();
				sure = confirm( "Task not for specific person or equipment?");
				return sure;
			}
			if( form.serial.value && form.associatedUser.value) {
				form.serial.focus();
				alert( "Can't associate both person and equipment to a task.\nBear in mind that people who own equipment will automatically be linked to this task if you assign that equipment to it.");
				return false;
			}
		}
	}

	function pressDelete( btnDelete) {
		var sure;
		sure = confirm( 'Delete this task?');
		if( sure) {
			btnDelete.form.doAction.value = 'delete';
		}
		return sure;
	}
</script>
<h2 style="margin-top:0;">Associate Task With</h2>
