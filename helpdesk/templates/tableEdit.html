<script language='javascript'>
        function clickAdd( button) {
                if( button.value == 'new') {
                        button.src = 'images/button_tick.jpg';
                        trNew.style.visibility = 'visible';
                        button.value = 'create';
                        return false;
                }
                return true;
}
