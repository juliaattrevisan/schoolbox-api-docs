<form action=userEdit.htm>
  <table class='table_itemcontainer'>
	<tr> 
	  <td width="138"> 
		<h3>User</h3>
	  </td>
	  <td width="166">&nbsp; </td>
	</tr>
	<tr> 
	  <td colspan=3> 
		<table class='table_user' width="100%" border="0" cellpadding="0">
		  <tr> 
			<td width='34%'> 
			  <h4>Username (as for email)</h4>
			</td>
			<td width='66%'> 
			  <input type="text" name="username" value="{USERNAME}">
			</td>
		  </tr>
		  <tr> 
			<td> 
			  <h4>First name</h4>
			</td>
			<td> 
			  <input type="text" name="surname" value="{FIRSTNAME}">

			</td>
		  </tr>
		  <tr> 
			<td> 
			  <h4>Surname</h4>
			</td>
			<td> 
			  <input type="text" name="surname" value="{SURNAME}">

			</td>
		  </tr>
		  <tr> 
			<td> 
			  <h4>Synergy ID</h4>
			</td>
			<td> 
			  <input type="text" name="synergyid" value="{SYNERGY_ID}">
			</td>
		  </tr>
	  <td width="165"> 
		<input type="submit" name="Submit" value="create" onclick="return confirm( 'Sure you want to save?');">
	  </td>

		</table>
	  </td>
	</tr>
  </table>
</form>
