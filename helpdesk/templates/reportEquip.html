<h2 style="margin-top:0;">Equipment List</h2>
<form method="get">
	<table>
		<tr>
			<td colspan="6"><strong>Filters</strong></td>
			<td><strong>Group By</strong></td>
			<td><strong>Sort By</strong></td>
		</tr>
		<tr>
			<td>Campus</td>
			<td><select name='campusID'>
					<!-- BEGIN OPTIONS_Campus -->
					<option value='{VALUE}'{SELECTED}>{NAME}</option>
					<!-- END OPTIONS_Campus -->
				</select></td>
			<td>Type</td>
			<td><select name='equipmentTypeID'>
				<!-- BEGIN OPTIONS_EquipmentType -->
				<option value='{VALUE}'{SELECTED}>{NAME}</option>
				<!-- END OPTIONS_EquipmentType -->
			</select></td>
			<td>Group</td>
            <td><select name='groupID'>
				<!-- BEGIN OPTIONS_Group -->
				<option value='{VALUE}'{SELECTED}>{NAME}</option>
				<!-- END OPTIONS_Group -->
                </select>             </td>
            <td><select name='groupBy'>
              <!-- BEGIN OPTIONS_GroupBy -->
              <option value='{VALUE}'{SELECTED}>{NAME}</option>
              <!-- END OPTIONS_GroupBy -->
            </select></td>
            <td><select name='orderBy'>
              <!-- BEGIN OPTIONS_OrderBy -->
              <option value='{VALUE}'{SELECTED}>{NAME}</option>
              <!-- END OPTIONS_OrderBy -->
            </select></td>
		</tr>
		<tr>
			<td>Brand</td>
			<td><select name='brandID'>
					<!-- BEGIN OPTIONS_Brand -->
					<option value='{VALUE}'{SELECTED}>{NAME}</option>
					<!-- END OPTIONS_Brand -->
				</select>			</td>
			<td>Model</td>
			<td><select name='modelID'>
					<!-- BEGIN OPTIONS_Model -->
					<option value='{VALUE}'{SELECTED}>{NAME}</option>
					<!-- END OPTIONS_Model -->
				</select></td>
                <td>Active Only</td>
                <td><select name='active'>
                <!-- BEGIN OPTIONS_Active -->
                 <option value='{VALUE}'{SELECTED}>{NAME}</option>
                <!-- END OPTIONS_Active -->
                </select></td>
			    <td>&nbsp;</td>
		    <td><select name='orderDir'>
              <!-- BEGIN OPTIONS_OrderDir -->
              <option value='{VALUE}'{SELECTED}>{NAME}</option>
              <!-- END OPTIONS_OrderDir -->
            </select></td>
		</tr>
		<tr><td colspan="8"><input name="Submit" type="submit" />
	</table>
</form>
<!-- BEGIN group -->
<h3>{GROUP}</h3>
<table class='ruler' cellpadding=0 cellspacing=0>
	<thead>
		<tr>
		  	<td class="tableHeadLeft">ACTIVE</td>
			<td class="tableHeadLeft">OWNER</td>
			<!-- BEGIN type_head -->
			<td class="tableHeadLeft">TYPE</td>
			<!-- END type_head -->
			<!-- BEGIN brand_head -->
			<td class="tableHeadLeft">BRAND</td>
			<!-- END brand_head -->
			<td class="tableHeadLeft">MODEL</td>
			<td class="tableHeadLeft">SERIAL</td>
			<!-- BEGIN campus_head -->
			<td class="tableHeadLeft">CAMPUS</td>
			<!-- END campus_head -->
			<td class="tableHeadLeft">LOCATION</td>
            <td class="tableHeadLeft">DoP</td>
		</tr>
	</thead>
	<tbody>
		<!-- BEGIN item -->
		<tr>
		   <td>
           <!-- BEGIN active -->
           	<a href="{CURRENT_URL}&delete={EQUIPID}"><img src="/images/accept.png"></a>
           <!-- END active -->
           <!-- BEGIN non_active --> 
           <a href="{CURRENT_URL}&undelete={EQUIPID}"><img src="/images/delete.png"></a>
           <!-- END non_active -->
           </td>
			<td>{OWNER}</td>
			<!-- BEGIN type_col -->
			<td>{TYPE}</td>
			<!-- END type_col -->
			<!-- BEGIN brand_col -->
			<td>{BRAND}</td>
			<!-- END brand_col -->
			<td>{MODEL}</td>
			<td>{SERIAL}</td>
			<!-- BEGIN campus_col -->
			<td>{CAMPUS}</td>
			<!-- END campus_col -->
			<td>{LOCATION}</td>
            <td>{DOP}</td>
		</tr>
		<!-- END item -->
	</tbody>
</table>
<!-- END group -->
<br />
