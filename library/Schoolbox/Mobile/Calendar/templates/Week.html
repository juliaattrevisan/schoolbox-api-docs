<ul class="calendar-day">
{% if content %}
    {% for i in content | keys %}
    <li class="calendar-event {{ content[i].eventType }}">
        <a href="/m/calendar/event/{{ content[i].id }}/{{content[i].events[j].connectorId}}">
            {% if content[i].startTime %}
            <time>{{ content[i].startTime }}</time>
            {% endif %}
            <p class="event-title">{{ content[i].note|raw }}</p>
        </a>
    </li>
    {% endfor %}
{% else %}
    <li><p>No events</p></li>
{% endif %}
</ul>
