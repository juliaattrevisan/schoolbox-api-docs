{% if content %}
<ul>
{% for headline in content %}
  <li>
    <a href="/m/news/article/school/{{ headline.item_id }}">
      {% if headline.item_image %}
      <img class="thumb" width="64" height="64" src="/storage/image.php?hash={{ headline.item_image }}&size=square64">
      {% endif %}
      {{ headline.item_heading }}
      <p>{{ headline.item_body_clean | raw }}</p>
      <p>{{ headline.post_datetime_relative }} by {{ headline.poster }}</p>
    </a>
  </li>
{% endfor %}
</ul>
{% else %}
<ul>
  <li>
    <p>No news</p>
  </li>
</ul>
{% endif %}
