<ul>
{% if content.events %}
    {% for event in content.events %}
    <li class="{{ event.eventType }}" style="background-color: {{ event.colour }}">
        {% include 'calendar/event.html' with {event: event} %}
    </li>
    {% endfor %}
{% else %}
    <li><p>Nothing special on today</p></li>
{% endif %}
</ul>
