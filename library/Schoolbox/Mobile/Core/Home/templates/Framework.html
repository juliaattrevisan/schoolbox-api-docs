    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="apple-touch-startup-image" media="(max-device-width: 480px) and not (-webkit-min-device-pixel-ratio: 2)" href="startup-iphone.png" />
    <link rel="apple-touch-startup-image" media="(max-device-width: 480px) and (-webkit-min-device-pixel-ratio: 2)" href="startup-iphone4.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 768px) and (orientation: portrait)" href="startup-iPad-portrait.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 768px) and (orientation: landscape)" href="startup-iPad-landscape.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 1536px) and (orientation: portrait)" href="startup-iPad3-portrait.png" />
    <link rel="apple-touch-startup-image" media="(min-device-width: 1536px) and (orientation: landscape)" href="startup-iPad3-landscape.png" />

    <!-- BB must not be precomposed, Droid must be. Why not just use rel="icon" for all? -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-precomposed.png"/>
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png"/>

    <style>
        #loading {background:-webkit-radial-gradient(center top, ellipse cover, #1d9ffc 0%, #0066b0 60%);
            background:     -o-radial-gradient(center top, ellipse cover, #1d9ffc 0%, #0066b0 60%);
            height: 100%;width: 100%;position:absolute;top:0;left:0;z-index:99999;text-shadow: 1px 1px 0 #0066b0;
            font:1em sans-serif;color:#fff;}

        #loading img {
            position: absolute; top: 50%; left: 50%;
            height: 96px;width: 227px;margin-top:-96px;margin-left:-113.5px;
        }

        #loading-msg {
            position: absolute;top:50%;margin-top: 72px;
            width:100%;text-align:center;
        }
        #spinner{
            position:absolute;top:50%;left:50%;
            width:48px;height:48px;
        }

        .spinner-block{
            position:absolute;
            background-color:#FFF;
            opacity: 0;
            width:2px;
            height:24px;
            -webkit-animation:fadeG 1.04s infinite;
            -o-animation:fadeG 1.04s infinite;
            -webkit-transform-origin:50% 100%;
            -o-transform-origin:50% 100%;
        }

        #spinner-1{
            /*background: #FF4873;*/
            -webkit-animation-delay:0.39s;
            -o-animation-delay:0.39s;
            -webkit-transform:rotate(180deg);
            -o-transform:rotate(180deg);

        }

        #spinner-2{
            /*background: #6800AF;*/
            -webkit-animation-delay:0.52s;
            -o-animation-delay:0.52s;
            -webkit-transform:rotate(-135deg);
            -o-transform:rotate(-135deg);
        }

        #spinner-3{
            /*background: #0066AF;*/
            -webkit-animation-delay:0.65s;
            -ms-animation-delay:0.65s;
            -o-animation-delay:0.65s;
            -webkit-transform:rotate(-90deg);
            -ms-transform:rotate(-90deg);
            -o-transform:rotate(-90deg);
        }

        #spinner-4{
            /*background: #1D9E1B;*/
            -webkit-animation-delay:0.78s;
            -ms-animation-delay:0.78s;
            -o-animation-delay:0.78s;

            -webkit-transform:rotate(-45deg);
            -ms-transform:rotate(-45deg);
            -o-transform:rotate(-45deg);
        }

        #spinner-5{
            /*background: #02A1F5;*/
            -webkit-animation-delay:0.9099999999999999s;
            -ms-animation-delay:0.9099999999999999s;
            -o-animation-delay:0.9099999999999999s;
            -webkit-transform:rotate(0deg);
            -ms-transform:rotate(0deg);
            -o-transform:rotate(0deg);
        }

        #spinner-6{
            /*background: #FF7D00;*/
            -webkit-animation-delay:1.04s;
            -ms-animation-delay:1.04s;
            -o-animation-delay:1.04s;
            -webkit-transform:rotate(45deg);
            -ms-transform:rotate(45deg);
            -o-transform:rotate(45deg);
        }

        #spinner-7{
            /*background: #009EB3;*/
            -webkit-animation-delay:1.1700000000000002s;
            -ms-animation-delay:1.1700000000000002s;
            -o-animation-delay:1.1700000000000002s;
            -webkit-transform:rotate(90deg);
            -ms-transform:rotate(90deg);
            -o-transform:rotate(90deg);
        }

        #spinner-8{
            -webkit-animation-delay:1.3s;
            -ms-animation-delay:1.3s;
            -o-animation-delay:1.3s;
            -webkit-transform:rotate(135deg);
            -ms-transform:rotate(135deg);
            -o-transform:rotate(135deg);
        }

        @-webkit-keyframes fadeG{
            0%  { opacity:1; }
            100% { opactiy:1; }
        }

        @-o-keyframes fadeG{
            0%  { opacity:1; }
            100%{ opactiy:0; }
        }

        @-ms-keyframes fadeG{
            0%  { opacity:1; }
            100%{ opactiy:0; }
        }

    </style>

<script>
function loadFile(filename, filetype){
    var fileref;
    switch (filetype){
        case "js":
            fileref=document.createElement('script');
            fileref.setAttribute("type","text/javascript");
            fileref.setAttribute("src", filename);
            break;
        case "css":
            fileref=document.createElement("link");
            fileref.setAttribute("rel", "stylesheet");
            fileref.setAttribute("type", "text/css");
            fileref.setAttribute("href", filename);
            break;
        case "less":
            fileref=document.createElement("link");
            fileref.setAttribute("rel", "stylesheet");
            fileref.setAttribute("type", "text/less");
            fileref.setAttribute("href", filename);
            break;
        default:
            console.log("Unsure what to do with '"+filename+"', '"+filetype+"'");
    }
    document.getElementsByTagName("head")[0].appendChild(fileref);
}

loadFile("/m/inc/js/libs/less-1.3.0.min.js",'js');
loadFile("/m/inc/css/chrome.css",'css');

// Some variables
var env  = { // Lets create an environment object for us to test against (if(env.ios){})
    iphone: ~navigator.userAgent.indexOf('iPhone')
            || ~navigator.userAgent.indexOf('iPod'),
    ipad:   ~navigator.userAgent.indexOf('iPad'),
    ios:    ~navigator.userAgent.indexOf('iPhone')
            || ~navigator.userAgent.indexOf('iPod')
            || ~navigator.userAgent.indexOf('iPad'),
    android:~navigator.userAgent.indexOf('Android'),
    fullscreen: window.navigator.standalone, // iOS launched from the homescreen
    lastWidth: 0,
    init: 0,
    online: function () {
        var onLine = false;
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', '/', false); // E.T. Phone Home
        try { xhr.send(); onLine = true; }
        catch (e) {       onLine = false; }
        return onLine
    },
    status: function (x) {
        if(!x){
            return null;
        } else {
            switch(x){
                case 0: msg = "error"; break;
                case 1: msg = "loading"; break;
                case 2: msg = "loaded"; break;
                case 3: msg = "cached"; break;
            }
            $('#status').attr("class",msg);
            $('#status').text(msg);
            return x;
        }
    }
};

var appCache = window.applicationCache;
var localCache = {};


$("#online").html(env.online()?"online":"offline");


function init(){
    if(env.init === 0) {
        render(localCache.get('/data/menu.json'));
        if($('#loading').hasClass('load')){
            $('#spinner').remove();
            $('#loading').animate({opacity:'0'},1000,'ease-out',function(){$(this).remove()});
            $('#app').css({opacity:'0'});
            $('#app').animate({opacity:'1'},2000,'ease-out');
        } else {
            $('#loading').remove();
        }
        console.log('Manifest loaded. Enjoy your stay!');
    }
    env.init = 1;
}

// Resource getter
// Get response to HTTP request and save it to localStorage
localCache.get = function(url) {
    var r = localStorage.getItem(url);

    // If online, refresh resource
    if(env.online()){
        env.status(1); // Loading
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        xhr.send(null);
        if (xhr.status != 200) {
            env.status(0); // Error
            return null;
        }
        localStorage.setItem(url, xhr.responseText);
        env.status(2); // Loaded
        return xhr.responseText;
    }

    // If not online, return cached
    if (r != null) {
        env.status(3); // Loaded from cache
        return r;
    }

    else {
        env.status = 0; // Error
        return "Resource not cached, please try again when you are connected";
    }
};



// Load JSON
localCache.json = function(url) {
    return localCache.get(url);
};

function render(data){
    data = JSON.parse(data);
    var menu = '<ul role="tablist" id="tablist">'+'\n';
    $.each(data.menu,function(k,v){
        menu += '<li role="tab"><a href="#" class="icon '+k+'" title="'+v.value+'">'+v.value+'</a>';
        if (v.items){
            menu += '<ul role="navigation">'+'\n';
            menu += '<li><h1>'+v.value+'</h1></li>';
            $.each(v.items,function(k,v){
                menu += '<li';
                if (v.items){ menu += ' class="parent"'; }
                menu += '><a href="#">'+v.value+'</a>';
                if (v.items){
                    menu += '<ul>'+'\n';
                    menu += '<li><h1>'+v.value+'</h1></li>';
                    menu += '<li class="back"><a class="back"></a></li>';
                    $.each(v.items,function(k,v){
                        menu += '<li><a href="#">'+v.value+'</a></li>'+'\n';
                    });
                    menu += '</ul>';
                }
                menu += '</li>'+'\n';
            });
            menu += '</ul>';
        }
        menu += '</li>'+'\n';
    });
    menu += '</ul>';
    $('#nav').append(menu);
}

function handleCacheEvent(e) {
    msgTimeout = setTimeout(showMessage,5000);
    var checkTimeout;
    switch (appCache.status) {
        case 0: $('#loading').addClass('load');
            appCache.update();
            break;                      // UNCACHED
        case 1: init();
            clearTimeout(msgTimeout);
            break;                      // IDLE
        /*            case 2: checkTimeout = setTimeout(function(){
         init();
         clearTimeout(msgTimeout);
         },3000);
         break;                      // CHECKING
         */            case 4: $('#loading').addClass('load');
        appCache.swapCache();       // UPDATEREADY
        if (confirm('Schoolbox has been updated. The app must restart to continue.')) {
            window.location.reload();
        }
        break;
        case 5: appCache.update(); break;
        default: console.log(appCache.status);
    }
}
function showMessage(){
    document.getElementById('loading-msg').style.display = "block";
}
function handleCacheProgress(){

}

function handleCacheError(e) {
    switch(appCache.status) {
        case 0:
            alert('Schoolbox failed to cache essential files. Please check you do not have private browsing enabled, ' +
                    'and try again.');
            break;
        default:
            console.log('Error: cache status: '+window.applicationCache.status);
            init();
            clearTimeout(msgTimeout);
    }
    console.log('Error: Cache failed to update!'+'\n'+$('html').attr('manifest')+': '+window.applicationCache.status);
}

appCache.addEventListener('cached',     handleCacheEvent, false); // First cache of the manifest
appCache.addEventListener('checking',   handleCacheEvent, false); // Checking for update
appCache.addEventListener('downloading',handleCacheEvent, false); // Fetching resources
appCache.addEventListener('error',      handleCacheError, false); // 404 || 410
appCache.addEventListener('noupdate',   handleCacheEvent, false); // First download
appCache.addEventListener('obsolete',   handleCacheEvent, false); // 404 || 410
appCache.addEventListener('progress',   handleCacheProgress, false); // Each resource
appCache.addEventListener('updateready',handleCacheEvent, false); // Has been downloaded

// Make clicks eat-my-dust fast, and touch when possible
var clickEvent = ((document.ontouchstart!==null)?'mousedown':'touchstart');

// Nav events
el = $('#nav');
el.on(clickEvent,'a',function(e){
    e.preventDefault();
    if($(this).parent('li').hasClass('current')){
        $(this).parent('li').removeClass('current');
    } else {
        $(this).parent('li').siblings('li').removeClass('current');
        $(this).parent('li').addClass('current');
    }
});
el.on('swipeLeft','ul',function(e){
    $(this).parent('li').removeClass('current');
});
el.on(clickEvent, '.back', function(e){
    e.stopPropagation();
    $('#tablist ul li').removeClass('current');
});

// Browser chrome removal
var page = document.getElementById('app');
if (env.android) {
    window.onscroll = function() {
        $('#app').height(window.innerHeight);
    }
}
var setupScroll = window.onload = function() {
    if (env.ios) {
        var height = document.documentElement.clientHeight;
        if (env.iphone && !env.fullscreen) {
            height += 60;
        }
        $('#app').height(height);
    } else if (env.android) {
        $('#app').height(window.innerHeight + 56);
    }
    setTimeout(scrollTo, 0, 0, 1);
};
(window.onresize = function() {
    var pageWidth = page.offsetWidth;
    if (env.lastWidth == pageWidth) return;
    env.lastWidth = pageWidth;
    setupScroll();
})();

// Stop craaazzzzyyy bounce on iPhail
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
