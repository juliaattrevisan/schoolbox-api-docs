{% if content.fullname %}
<ul id="user-profile">
  <li class="user-profile photo">
    <img title="{{ content.fullname }}" src="{{ content.photouri }}" />
  </li>
  <li class="user-profile fullname">{{ content.fullname }}</li>
  {% if content.workcount %}
  <li>
    <a href="/m/core/user/work/{{ content.id }}">
      <p>Upcoming Due Work ({{ content.workcount }})</p>
    </a>
  </li>
  {% endif  %}
</ul>
{% endif %}
{% if content.code %}
<ul>
  {% for teacher in content.teachers %}
  <li><a href="{{ teacher.mailto }}"><p>{{ teacher.format_name }}</p></a></li>
  {% endfor %}
</ul>
{% endif %}
