{% if content.fullname %}
<ul id="user-profile">
  <li class="user-profile photo">
    <img title="{{ content.fullname }}" src="{{ content.photouri }}" />
  </li>
  <li class="user-profile fullname">{{ content.fullname }}</li>
</ul>
{% endif %}
{% if content.code %}
<ul>
  <li><a href="/m/facade/homepage/display/{{ content.id }}">{{ content.code }}</a></li>
  {% for teacher in content.teachers %}
  <li><a href="{{ teacher.mailto }}">{{ teacher.format_name }}</a></li>
  {% endfor %}
</ul>
{% endif %}
