# Define the tools which may be run here.
tools:
  # The key is the tool's unique name:
  # clients will pass that name to the daemon to invoke the command.
  echo:
    # The actual command that is run.
    # Could possibly be an array, if the command has multiple parts,
    # or has options which are always provided
    # (e.g. `php /usr/share/schoolbox/tools/video/processor.php -p`)
    command: echo

    options:
      # Required options which must be passed to the script.
      required: []

      # Allowed options which may be passed to the script.
      # If empty, no options are allowed.
      allowed: []

      # Positional arguments (unnamed args after any flags).
      # If omitted, no positional arguments are permitted.
      positional:
        min: 0

    # Does this tool require an instance ID to be provided?
    requiresInstanceId: false

    # Is this tool idempotent?
    # This affects whether it will be retried automatically or not,
    # if the daemon dies whilst it is running.
    idempotent: true

    # If this tool fails: how many times should it be retried?
    retry:
      max: 3
      jitter: 5

    # How long should this tool be allowed to run for, before it times out?
    maxExecutionTime: 600

    # Which worker pool should run this tool?
    # Some tools should be run in different pools, so that their assigned
    # resources do not conflict with others.
    # This value must match the `TOOLSD_POOL` environment variable provided to
    # the instance of the toolsd worker pool which will run the tool.
    pool: default

    # Are multiples of the same tool allowed to run at once?
    # (Runs are de-duplicated by their parameters)
    allowDuplicates: true

    # How long is allowed after the last run finished,
    # before a duplicate of the same tool may be run again?
    cooldown: 0

    # If provided: the task should be run as this user.
    # Otherwise: runs as the same user who is running the Celery service.
    user: null

  # A clone of the echo tool, running on the `ups` pool.
  echoUps:
    command: [echo, -n]
    options:
      required: []
      allowed: []
      positional:
        min: 0
    requiresInstanceId: false
    idempotent: true
    retry:
      max: 3
      jitter: 5
    maxExecutionTime: 600
    pool: ups
    allowDuplicates: true
    cooldown: 0
    user: null

  # A simple tool which actually ties into Schoolbox.
  refreshBindingCache:
    command: [/usr/local/bin/php, /usr/share/schoolbox/tools/notif/route/refresh-binding-cache.php]
    options:
      allowed: [-v]
    requiresInstanceId: true
    idempotent: true
    retry:
      max: 3
      jitter: 5
    maxExecutionTime: 6000
    pool: default
    allowDuplicates: false
    cooldown: 0
    user: null

  # A tool for clearing external caches.
  clearExternalCache:
    # TODO try to remove need for /usr/share/schoolbox prefix
    command: /usr/share/schoolbox/tools/cache/clear-external-cache.php
    options:
      allowed: [-v]
    requiresInstanceId: true
    idempotent: true
    pool: default

