# Define the pools which may run tools here.
pools:
  # For example, the default pool might have 16 workers:
  # this means that 16 concurrent tools may be run.
  default:
    maxWorkers: 16

#  # However, there's a separate pool for UPS runs:
#  # these can run in the background for a long time,
#  # and should not be allowed to block the running of other tools.
#  ups:
#    maxWorkers: 4
