openapi: 3.0.2

info:
  title:       Schoolbox Discussion Threads API
  description: |
    Schoolbox Discussion Threads API
  x-api-id:    7786c5c6-5fc9-4613-827e-f4170f9ffe27
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au

paths:
  /posts:
    post:
      operationId: createPost
      summary: Creates a new post
      responses:
        '2XX':
          description: The post that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post'
        default:
          $ref: '#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post'

  /posts/{id}:
    delete:
      operationId: deletePost
      summary: Deletes a post
      responses:
        '2XX':
        default:
          $ref: '#/components/responses/problem'
      parameters:
        - $ref: '#/components/parameters/id'

  /threads/context/{contextType}/{contextId}:
    get:
      operationId: getThreadsByContext
      summary: Returns threads by their context
      responses:
        '2XX':
          $ref: '#/components/responses/threadList'
        default:
          $ref: '#/components/responses/problem'
      parameters:
        - name: contextType
          in:   path
          schema:
            $ref: '#/components/schemas/threadContext/properties/type'
        - name: contextId
          in:   path
          schema:
            $ref: '#/components/schemas/threadContext/properties/id'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'

  /threads/{id}/posts:
    get:
      operationId: getPostsByThread
      summary: Returns posts for a thread
      responses:
        '2XX':
          $ref: '#/components/responses/postList'
        default:
          $ref: '#/components/responses/problem'
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'


components:
  schemas:
    thread:
      title: Thread
      description: Common fields for discussion threads
      type: object
      properties:
        id:
          type: integer
          format: int32
        open:
          type: boolean
          description: Is the thread open for further comments?
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        context:
          $ref: '#/components/schemas/threadContext'

    threadContext:
      title: Thread Context
      description: The context for a thread
      type: object
      properties:
        type:
          description: |
            The type of the context for a given thread. Currently, only news is
            supported.
          type: string
          enum: [news]
        id:
          description: The identifier of the context for a given thread
          type: int

    post:
      title: Post
      description: Common fields for discussion posts
      type: object
      properties:
        id:
          type: integer
          format: int32
        thread:
          $ref: '#/components/schemas/thread'
        author:
          $ref: '#/components/schemas/user'
        content:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
      required:
        - thread
        - content

    user:
      title: User
      description: Common fields for users
      type: object
      properties:
        id:
          type: integer
          format: int32
        external_id:
          type: string
        title:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        profile_image:
          type: string
          format: uri-reference
          nullable: true

    problem:
      title: Problem Details
      description: Schema for RFC 7807 (Problem Details for HTTP APIs)
      readOnly: true
      type: object
      properties:
        type:
          type: string
          format: uri
          required: true
          description: A URI reference that identifies the problem type
          default: 'about:blank'
        title:
          type: string
          required: true
          description: A short human-readable summary of the problem type
        status:
          type: integer
          format: int32
          required: true
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem

    listMetadata:
      title: List metadata
      description: Metadata for lists of items retrieved
      readOnly: true
      type: object
      properties:
        count:
          type: int
          required: false
          description: If provided, the number of items in the collection
        cursor:
          type: object
          required: false
          properties:
            prev:
              type: string
              required: false
              description: If provided, a cursor to the previous page of results
            next:
              type: string
              required: false
              description: If provided, a cursor to the next page of results


  responses:
    problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'

    threadList:
      description: a list of threads
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/thread'
              metadata:
                $ref: '#/components/schemas/listMetadata'

    postList:
      description: a list of posts
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/post'
              metadata:
                $ref: '#/components/schemas/listMetadata'


  parameters:
    id:
      name:        id
      in:          path
      description: ID of an item to use
      required:    true
      schema:
        type: int
#    q:
#      name:        q
#      in:          query
#      description: Query (search) parameter
#    sort:
#      name:        sort
#      in:          query
#      description: Sort parameter
#    fields:
#      name:        fields
#      in:          query
#      description: Fields parameter. Use this to request a subset of a record's fields.
    limit:
      name:        sort
      in:          query
      description: Maximum number of records to return
      schema:
        type: int
#    offset:
#      name:        offset
#      in:          query
#      description: The offset of the first record to return
    cursor:
      name:        cursor
      in:          query
      description: |
        Alternative to offset. A generated but decodable pointer to the first
        record to return.
      schema:
        type: string
