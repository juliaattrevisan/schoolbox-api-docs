openapi: 3.0.2

info:
  title:       Schoolbox Discussion Threads API
  description: |
    Schoolbox Discussion Threads API
  x-api-id:    7786c5c6-5fc9-4613-827e-f4170f9ffe27
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au

paths:

  /posts/{id}:
    delete:
      operationId: deletePost
      summary: Deletes a post
      responses:
        '204':
          description: The resource was deleted successfully.
        default:
          $ref: '#/components/responses/problem'

    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/token'

  /posts/{id}/posts:
    get:
      operationId: getPostsByParent
      summary: Returns child posts for a parent post
      responses:
        '200':
          $ref: '#/components/responses/postList'
        default:
          $ref: '#/components/responses/problem'

    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/depth'

  /threads/{id}:
    get:
      operationId: getThread
      summary: Returns a thread
      responses:
        '200':
          $ref: '#/components/responses/thread'
        default:
          $ref: '#/components/responses/problem'


  /threads/{id}/posts:
    get:
      operationId: getPostsByThread
      summary: Returns posts for a thread
      responses:
        '200':
          $ref: '#/components/responses/postList'
        default:
          $ref: '#/components/responses/problem'

    post:
      operationId: createPostInThread
      summary: Creates a new post
      responses:
        '201':
          description: The post that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post'
        default:
          $ref: '#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post'

    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/depth'

  /threads/{id}/status:
    put:
      operationId: enableDisableThread
      summary: Open or Close commenting thread
      responses:
        '200':
          description: Enable / Disable the thread
        default:
          $ref: '#/components/responses/problem'
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/thread'
    parameters:
      - $ref: '#/components/parameters/id'

components:
  schemas:
    id:
      type: integer
      format: int32

    thread:
      title: Thread
      description: Common fields for discussion threads
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        open:
          type: boolean
          description: Is the thread open for further comments?
        created:
          $ref: '#/components/schemas/dateTime'
        updated:
          $ref: '#/components/schemas/dateTime'
        children:
          $ref: '#/components/schemas/postList'
          description: A list of direct child posts of this thread
      required:
        - id
        - open

    post:
      title: Post
      description: Common fields for discussion posts
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        thread:
          $ref: '#/components/schemas/thread'
          # Usually a post will be retrieved within the context of a thread
        author:
          $ref: '#/components/schemas/user'
          nullable: true
        content:
          type: string
        created:
          $ref: '#/components/schemas/dateTime'
        updated:
          $ref: '#/components/schemas/dateTime'
        parent:
          $ref: '#/components/schemas/post'
          description: |
            The direct parent of this post, if there is one.
            If there is none, this post is a top-level comment within a thread.
          nullable: true
        children:
          $ref: '#/components/schemas/postList'
          description: A list of direct children of this post
        visibility:
          description: |
            Which role types may view this comment? If not set, assume all role
            types may view it.
            This is likely to be replaced with a more sophisticated visibility
            system, which encompasses individual roles, role types, folders,
            and who knows what else?
          type: array
          items:
            type: string
            enum:
              - staff
              - parent
              - student
      required:
        - id
        - thread
        - content

    user:
      title: User
      description: Common fields for users
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        externalId:
          type: string
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        _links:
          type: object
          properties:
            profile:
              type: string
              format: uri-reference
            avatar:
              type: string
              format: uri-reference
              nullable: true
      required:
        - id

    problem:
      title: Problem Details
      description: Schema for RFC 7807 (Problem Details for HTTP APIs)
      readOnly: true
      type: object
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          default: 'about:blank'
        title:
          type: string
          description: A short human-readable summary of the problem type
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem
      required:
        - type
        - title
        - status

    listMetadata:
      title: List metadata
      description: Metadata for lists of items retrieved
      readOnly: true
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: If provided, the number of items in the result set.
        cursor:
          type: object
          properties:
            current:
              type: string
              nullable: true
              description: |
                If set, a cursor to the current page of results.
                Seems redundant, but it does generate a cursor to a request
                made without one.
            next:
              type: string
              nullable: true
              description: If set, a cursor to the next page of results.
          required:
            - current
            - next

    postList:
      title: Post list
      description: A list of posts
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/post'
        metadata:
          $ref: '#/components/schemas/listMetadata'

    dateTime:
      title: Datetime
      description: |
        A JSON representation of a datetime.
        For compatibility with existing code, can be defined as either:
        * a RFC3339 string
        * an object, which contains a datetime in several formats
      oneOf:
        - type: string
          format: date-time
        - type: object
          readOnly: true
          deprecated: true
          description: |
            This read-only object representation will be deprecated eventually:
            it exists only for compatibility with existing API endpoints.
          required:
            - json
          properties:
            database:
              type: string
              description: |
                A database representation of the date. Please use the "json"
                property instead.
            unixTimestamp:
              type: integer
              format: int64
              description: |
                The date as a Unix timestamp. Please use the "json" property
                instead.
            local:
              type: string
              description: |
                A string representation of the date, localized to the Schoolbox
                instance's settings.
                Please use the "json" property instead, and perform localization
                using libraries on the client.
            json:
              type: string
              format: date-time
              description: |
                The date as a RFC3339 string.

  responses:
    problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          examples:
            badRequestUpdate:
              $ref: '#/components/examples/problemBadRequestUpdate'
            badRequestDelete:
              $ref: '#/components/examples/problemBadRequestDelete'
            unauthorized:
              $ref: '#/components/examples/problemUnauthorized'
            forbidden:
              $ref: '#/components/examples/problemForbidden'
            notFound:
              $ref: '#/components/examples/problemNotFound'
            internalServerError:
              $ref: '#/components/examples/problemInternalServerError'

    thread:
      description: A thread
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/thread'
        text/html:
          schema:
            type: string
            description: The thread, rendered into HTML on the server.

    postList:
      description: a list of posts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/postList'
          examples:
            empty:
              $ref: '#/components/examples/postListEmpty'
            one:
              $ref: '#/components/examples/postListOne'
            many:
              $ref: '#/components/examples/postListMany'
        text/html:
          schema:
            type: string
            description: The list of posts, rendered into HTML on the server.


  parameters:
    id:
      name:        id
      in:          path
      description: ID of an item to use
      required:    true
      schema:
        type: integer
        format: int32
        minimum: 1

    limit:
      name:        sort
      in:          query
      description: Maximum number of records to return
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    cursor:
      name:        cursor
      in:          query
      description: |
        Alternative to offset. A generated but decodable pointer to the first
        record to return.
      schema:
        type: string

    token:
      name:        token
      in:          query
      description: |
        A token for user authentication.
        This is temporary, and will be replaced with oAuth/JWT authentication.
      schema:
        type: string

    depth:
      name:        depth
      in:          query
      description: |
        Number of levels to descend when retrieving child posts.
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        maximum: 3

  examples:
    postListEmpty:
      value:
        data: []
        metadata:
          cursor:
            current: bbb
            next: ccc

    postListOne:
      value:
        # Frustratingly, sub-keys of example values don't follow $ref
        data:
          - id: 1
            thread:
              id: 2
              open: false
              created: 2019-01-01T00:00:00Z
              updated:
                database: 2019-01-01 00:00:00
                json: 2019-01-01T00:00:00Z
                local: 1 Jan 2019 12:00am
                unixTimestamp: 1546300800000
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>Some HTML content goes here</p>
            created: 2019-01-01T00:00:00Z
            updated:
              database: 2019-01-01 00:00:00
              json: 2019-01-01T00:00:00Z
              local: 1 Jan 2019 12:00am
              unixTimestamp: 1546300800000
            visibility:
              - staff
              - parent
              - student
        metadata:
          cursor:
            current: bbb
            next: ccc

    postListMany:
      value:
        data:
          - id: 2
            thread:
              id: 1
              open: true
              created: 2019-01-01T00:00:00Z
              updated: 2019-01-01T00:00:00Z
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>Some HTML content goes here</p>
            created:
              database: 2019-01-01 00:00:00
              json: 2019-01-01T00:00:00Z
              local: 1 Jan 2019 12:00am
              unixTimestamp: 1546300800000
            updated: 2019-01-01T00:00:00Z
            visibility:
              - staff
              - parent
              - student

          - id: 3
            thread:
              id: 1
              open: true
              created: 2019-01-01T00:00:00Z
              updated: 2019-01-01T00:00:00Z
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>This article was modified</p>
            created: 2019-01-02T00:00:00Z
            updated: 2019-01-02T01:00:00Z
            visibility:
              - staff

          - id: 4
            thread:
              id: 1
              open: true
              created: 2019-01-01T00:00:00Z
              updated: 2019-01-01T00:00:00Z
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>This article was not modified, just the created/updated are in different timezone</p>
            created: 2019-01-04T00:00:00Z
            updated: 2019-01-04T11:00:00+1100
            visibility:
              - staff
              - student

          - id: 5
            thread:
              id: 1
              open: true
              created: 2019-01-01T00:00:00Z
              updated: 2019-01-01T00:00:00Z
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: "<p>XSS Article: you must escape this <script type=\"text/javascript\">alert('XSS')</script></p>"
            created: 2019-01-01T00:00:00Z
            updated: 2019-01-01T00:00:00Z
            visibility:
              - staff

        metadata:
          cursor:
            current: xxx
            next: yyy

    problemBadRequestUpdate:
      value:
        type:   about:blank
        title:  Bad Request
        status: 400
        detail: This resource may not have its created at time modified.

    problemBadRequestDelete:
      value:
        type:   about:blank
        title:  Bad Request
        status: 400
        detail: This resource may not be deleted.

    problemUnauthorized:
      value:
        type:   about:blank
        title:  Unauthorized Access
        status: 401
        detail: Authorization is required to access resource with ID=1.

    problemForbidden:
      value:
        type:   about:blank
        title:  Forbidden
        status: 403
        detail: You do not have permission to access resource with ID=1.

    problemNotFound:
      value:
        type:   about:blank
        title:  Not Found
        status: 404
        detail: The resource with ID=1 was not found.

    problemInternalServerError:
      value:
        type:   about:blank
        title:  Internal Server Error
        status: 500
        detail: An unexpected error occured when accessing resource with ID=1. This error has been logged.
