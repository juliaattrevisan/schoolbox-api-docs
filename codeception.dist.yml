namespace: Tests
support_namespace: Support
paths:
  tests: test/codeception
  output: test/codeception/_output
  data: test/codeception/Support/Data
  support: test/codeception/Support
  envs: test/codeception/_envs
actor_suffix: Tester

params:
    - env
    - test/codeception/env.php

gherkin: []
settings:
    shuffle: false
    lint: true

bootstrap: ./_bootstrap.php
extensions:
  enabled:
    - Codeception\Extension\Logger
    - Codeception\Extension\RunFailed
    - Codeception\Extension\Recorder
#        - Codeception\Extension\Recorder:
#            delete_successful: false
