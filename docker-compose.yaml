services:
  # Web server
  caddy:
    container_name: caddy
    restart: always
    build:
      context: ./docker/caddy
    volumes:
      - code:/usr/share/schoolbox
      - ./docker/caddy:/etc/caddy
    ports:
      - '80:80'
      - '443:443'

  # PHP-FPM server:
  # point requests from Caddy to here
  php-fpm:
    container_name: php-fpm
    restart: always
    build:
      context: ./docker/php-fpm
    volumes:
      - code:/usr/share/schoolbox
      - cache:/var/lib/schoolbox
      - ./docker/schoolbox/config:/etc/schoolbox
      # Instead include configs in image?
      - ./docker/php-fpm/config/99-xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ./docker/php-fpm/config/99-session.ini:/usr/local/etc/php/conf.d/99-session.ini
    # After building: make cache mount writable by www-data
    # (need newer docker compose)
#    post_start:
#      - command: chown -R www-data:www-data /var/lib/schoolbox/{cache,storage,twig,purifier}

  # Image intended for running command-line processes:
  # * command-line tools
  # * updates
  # * cron tasks
  #
  # Basically, anything which we haven't yet figured out how to migrate into its
  # own container will go here for now.
  schoolbox-cli:
    container_name: schoolbox-cli
    restart: always
    build:
      context: ./docker/schoolbox-cli
    tty: true
    volumes:
      - code:/usr/share/schoolbox
      - ./docker/schoolbox/config:/etc/schoolbox
#    networks:
#      - public
#      - private

  # Database services:
  # these are containers only in a development environment, they won't be on
  # staging or production envs.
  mariadb:
    container_name: mariadb
    image: mariadb:11.4
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: vagrant
#    expose:
#      - 3306
#    networks:
#      - private

  redis-storage:
    container_name: redis-storage
    image: redis:7.4
#    ports:
#      - '6379:6379'
#    networks:
#      - private

  redis-cache:
    container_name: redis-cache
    image: redis:7.4
#    ports:
#      - '6380:6379'
#    networks:
#      - private

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13
#    networks:
#      - private

  # Not-yet-essential services:
  # These will be implemented as separate containers (if they aren't already).
#  schoolbox-digestd:
#    image: ubuntu:jammy
#
#  schoolbox-scheduled:
#    image: ubuntu:jammy
#
#  schoolbox-mobiled:
#    image: ubuntu:jammy
#
#  schoolbox-socketd:
#    image : ubuntu:jammy
#
#  schoolbox-taskd:
#    image: alaress/taskd:latest
#
#  gotenberg:
#    image: gotenberg/gotenberg:7
#
#  etherpad:
#    image: schoolbox/epl:latest

volumes:
  # Volume for Schoolbox's code base
  code:
    driver_opts:
      type: none
      o: bind
      device: ./

  # Volume for database
  db-data:
    driver_opts:
      type: none
      o: bind
      device: ./data/vagrantx/db-data

  # Volume for storage
  storage:
    driver_opts:
      type: none
      o: bind
      device: ./data/vagrantx/storage

  # Volume for cache:
  # needs to be writable by www-data in php-fpm container
  cache:
    driver_opts:
      type: none
      o: bind
      device: ./data/vagrantx
