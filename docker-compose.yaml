services:
  # Web server
  caddy:
    container_name: caddy
    restart: always
    build:
      context: ./docker/caddy
    volumes:
      - code:/usr/share/schoolbox
      - caddy-config:/etc/caddy
    ports:
      - '8080:80'
      - '8443:443'
    # Make this host available across the network as docker.dev.schoolbox.cloud
    networks:
      default:
        aliases:
          - docker.dev.schoolbox.cloud

  # PHP-FPM server:
  # point requests from Caddy to here
  php-fpm:
    container_name: php-fpm
    restart: always
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    build:
      context: ./docker/php-fpm
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
      # Instead include configs in image?
      - ./docker/php-fpm/config/99-error-reporting.ini:/usr/local/etc/php/conf.d/99-error-reporting.ini
      - ./docker/php-fpm/config/99-xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
      - ./docker/php-fpm/config/99-session.ini:/usr/local/etc/php/conf.d/99-session.ini
    # After building: create data dirs, and make mount writable by www-data
    # Cannot currently use create-data-dirs.sh, as /bin/bash isn't available,
    # and /bin/sh doesn't support {} expansion
    post_start:
      - command: mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command: mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command: mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command: mkdir -p /var/lib/schoolbox/docker/files
      - command: mkdir -p /var/lib/schoolbox/docker/purifier
      - command: mkdir -p /var/lib/schoolbox/docker/twig
      - command: chown -R www-data:www-data /var/lib/schoolbox/docker/

  # Image intended for running command-line processes:
  # * command-line tools
  # * updates
  # * cron tasks
  #
  # Basically, anything which we haven't yet figured out how to migrate into its
  # own container will go here for now.
  schoolbox-cli:
    container_name: schoolbox-cli
    restart: always
    build:
      context: ./docker/schoolbox-cli
    tty: true
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
    # After building: create data dirs
    post_start:
      - command : mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command : mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command : mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command : mkdir -p /var/lib/schoolbox/docker/files
      - command : mkdir -p /var/lib/schoolbox/docker/purifier
      - command : mkdir -p /var/lib/schoolbox/docker/twig

  # Database services:
  # these are containers only in a development environment, they won't be on
  # staging or production envs.
  mariadb:
    container_name: mariadb
    image: mariadb:11.4
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1

  redis-storage:
    container_name: redis-storage
    image: redis:7.4
    volumes:
      - redis-storage-config:/usr/local/etc/redis
      - redis-storage-data:/data

  redis-cache:
    container_name: redis-cache
    image: redis:7.4
    volumes:
      - redis-cache-config:/usr/local/etc/redis
      - redis-cache-data:/data

  rabbitmq:
    container_name: rabbitmq
    build:
      context: ./docker/rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Not-yet-essential services:
  # These will be implemented as separate containers (if they aren't already).
  schoolbox-digestd:
    container_name: schoolbox-digestd
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    build:
      context: ./docker/schoolbox-digestd
    env_file: docker/default.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-scheduled:
    container_name: schoolbox-scheduled
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    build:
      context: ./docker/schoolbox-scheduled
    env_file: docker/default.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-mobiled:
    container_name: schoolbox-mobiled
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    build:
      context: ./docker/schoolbox-mobiled
    env_file: docker/default.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-socketd:
    container_name: schoolbox-socketd
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    build:
      context: ./docker/schoolbox-socketd
    env_file: docker/default.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-taskd:
    container_name: schoolbox-taskd
    depends_on:
      - redis-storage
      - caddy
    build:
      context: ./docker/schoolbox-taskd
    environment:
      REDIS_HOST: redis-storage

  schoolbox-gotenberg:
    container_name: schoolbox-gotenberg
    image: gotenberg/gotenberg:7

  schoolbox-etherpad:
    container_name: schoolbox-etherpad
    depends_on:
      - redis-storage
    image: schoolbox/epl:latest
    env_file: docker/schoolbox-etherpad/default.env

volumes:
  # Volume for Schoolbox's code base
  code:
    driver_opts:
      type: none
      o: bind
      device: ./

  # Volume for database data:
  # mounted outside of filesystem
  mariadb-data:

  redis-storage-data:

  redis-cache-data:

  rabbitmq-data:

  # Volume for storage
  storage:
    driver_opts:
      type: none
      o: bind
      device: ./data/docker/storage

  # Volumes for config
  schoolbox-config:
    driver_opts:
      type: none
      o: bind
      device: ./docker/schoolbox/config

  caddy-config:
    driver_opts:
      type: none
      o: bind
      device: ./docker/caddy/config

  # Want to overlay files in this folder over what's already in
  # /usr/local/etc/php/conf.d/, but don't yet know how
  php-fpm-config:
    driver_opts:
      type: none
      o: bind
      device: ./docker/php-fpm/config

  redis-storage-config:
    driver_opts:
      type: none
      o: bind
      device: ./docker/redis-storage/config

  redis-cache-config:
    driver_opts:
      type: none
      o: bind
      device: ./docker/redis-cache/config
