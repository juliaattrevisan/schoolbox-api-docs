# suite config
suites:
    acceptance:
        actor: AcceptanceTester
        path: .
        modules:
            enabled:
                - WebDriver:
                    url: http://192.168.36.10
                    browser: phantomjs
                    port: 4444
                    window_size: maximize
                - \Helper\Acceptance
                - Db:
                    dsn: "mysql:host=localhost;dbname=schoolbox"
                    user: "root"
                    password: "tnp879"
                    # dump goes here

extensions:
    enabled:
        - Codeception\Extension\Logger
        - Codeception\Extension\RunFailed
        - Codeception\Extension\Recorder
#        - Codeception\Extension\Recorder:
