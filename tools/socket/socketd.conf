# socketd configuration

# Min/max workers allowed
minWorkers=2
maxWorkers=20

# delay between each trigger of the queue process method, in ms
# (`\Alaress\WorkerCrew\Dispatcher::dispatch`):
# set to 20ms so that the dispatch isn't called every 1ms
queueDelay=20

# Queue warning and max (raises error) size:
# set to reasonably large values
queueWarnSize=1536000
queueMaxSize=2048000

# Flywheel:
# If the queue is empty, how many triggers of the queue process method are
# allowed before the process method is cancelled?
# Unlike other settings, 0 does not disable: instead, it cancels the queue
# immediately.
# (The queue process method is reinstated upon the daemon receiving a message.)
maxFlywheel=0

# How many requests may a worker handle, before it is retired?
# If 0, workers are never retired.
# Set to a non-zero value so as to mitigate memory leaks.
maxRequestsPerWorker=20000
workerWriteTimeout=10000
metricInterval=60000

# Option for socketd only:
# Controls how long a worker lives after it's idle, which defaults to 60000ms.
idleTimeout=1000

# Option for scheduled only:
# what's the max number of ms in the future that scheduled should queue a
# trigger for? If 0, no limit.
maxFutureTriggerTime=604800000
