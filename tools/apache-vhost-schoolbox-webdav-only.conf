<VirtualHost 127.0.0.1:87>
        ServerName localhost

        DocumentRoot /vagrant/dav

        <Directory /vagrant/dav>
                Options FollowSymLinks
                AllowOverride None
                
                Require all granted
                Satisfy all
        </Directory>

        ErrorLog /vagrant/schoolbox-webdav_error.log
        LogLevel warn
        CustomLog /vagrant/schoolbox-webdav_access.log combined

        RewriteEngine on

        # PHP Error handling
        php_value memory_limit 256M
        php_value max_execution_time 30
        php_flag display_startup_errors off
        php_flag display_errors off
        php_flag html_errors off
        php_flag log_errors on
        php_value error_reporting 30711
        php_value upload_max_filesize 2048M
        php_value post_max_size 2048M
        php_admin_value sys_temp_dir /mnt/data/php_tmp
        php_value session.gc_maxlifetime 43200
        php_flag session.cookie_httponly On
        php_value session.save_handler redis
        php_value session.save_path "tcp://127.0.0.1:6379"

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        # Next line is for Lets Encrypt webroot based challenges only
        RewriteCond %{REQUEST_URI} !^/.well-known/.*$ 
        RewriteRule ^/*(.*)$ /index.php/$1

</VirtualHost>
