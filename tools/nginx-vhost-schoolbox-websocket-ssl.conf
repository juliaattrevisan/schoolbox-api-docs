server {
    listen       8081 ssl http2;
    listen       443 ssl http2;

    server_name  vagrant.dev.schoolbox.cloud;

    ssl_certificate      /etc/nginx/certs/schoolbox-fullchain.crt;
    ssl_certificate_key  /etc/nginx/certs/schoolbox-private.key;
    include      ssl.conf;

    # Schoolbox installation directory
    set $siteRoot /vagrant;

    access_log   /vagrant/schoolbox_access.log  full;
    error_log    /vagrant/schoolbox_error.log   error;

    keepalive_timeout    1800;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$ ) {
        return 444;
    }

    # Check whether we should return a 503 maintenance page for this request.
    # Technically this should be defined per location, but that's a lot of copy/paste.
    set $isMaintenance 0;
    if (-f $siteRoot/.maintenance) {
        set $isMaintenance 1;
    }
    # Allow fail-whale image
    if ($request_filename = $document_root/images/core/fail-whale.png ) {
        set $isMaintenance 0;
    }
    # Allow fail-whale icon
    if ($request_filename = $document_root/images/core/icons/fail-whale-16x16.png ) {
        set $isMaintenance 0;
    }
    if ($isMaintenance = 1) {
        return 503;
    }

    location /.well-known/ {
        root /vagrant/www;
    }
    location /awstats {
        root /var;
        index awstats.awstats.conf.html;
        auth_request     /private/auth;
        auth_request_set $auth_status $upstream_status;
    }
    location /awstats-icon/ {
        root /var;
    }
    # Redirect from old apache version
    location /statistics/awstats.pl {
        return 301 https://$server_name/awstats/;
    }

    location / {
        if ($request_filename = $document_root/ping) {
            return 200;
        }
        root /vagrant/www;
        index index.php;
        try_files $uri @schoolbox;
    }

    location /homepage/rss {
        root /vagrant/www;
        index rss.php;
        rewrite ^/(.*) /homepage/rss.php?page=$1 last;
    }

    location /favicon.ico {
        root /vagrant/www;
        rewrite ^/(.*)$ /images/logo.php?logo=skin_logo_square&size=favicon last;
    }

    # Setup xhprof for debugging, only works if module is installed on server
    location /debugbar {
        alias /vagrant/vendor/maximebf/debugbar/src/DebugBar/Resources;
    }
    location /xhprof_html {
         root /vagrant/vendor/lox/xhprof;
         index index.php;
         location ~ \.php$ {
             try_files $uri =404;
             fastcgi_pass unix:/run/php/schoolbox.sock;
             fastcgi_index index.php;
             fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
             fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
             include fastcgi_params;
         }
    }

    location @schoolbox {
        rewrite ^(.*) /index.php?page=$1 last;
    }

    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # 503 reponses
    recursive_error_pages on;
    error_page 503 @503;
    location @503 {
        # Is server being pinged?
        if ($request_filename = $document_root/ping) {
            # Just return empty file, the response code will suffice
            root    $siteRoot;
            rewrite ^(.*)$ /templates/core/error/503-empty.html break;
        }

        # Capture POST requests here too (POSTing to static files trigger a 405)
        error_page 405 = /templates/core/error/503-maintenance.html;
        if (-f $siteRoot/.maintenance) {
            root    $siteRoot;
            rewrite ^(.*)$ /templates/core/error/503-maintenance.html break;
        }

        # Else fall back to default 50x page
        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page   500 502 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /websocket {
        keepalive_timeout 1800;
        proxy_pass http://websocks;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /pad {
        rewrite          /pad/(.*) /$1 break;
        rewrite          ^/pad$ /pad/ permanent;
        proxy_pass       http://127.0.0.1:9001/;
        proxy_redirect   / /pad/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering  off;
    }

    location = /private/auth {
        internal;
        fastcgi_pass unix:/run/php/schoolbox.sock;
        fastcgi_pass_request_body off;
        fastcgi_param X-Original-URI $request_uri;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www/private/auth.php;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }
    location ~ fail.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }
    location ~ portrait.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }
    location ~ image.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        fastcgi_read_timeout 1800;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

}

server {
    listen       8882 ssl http2;

    server_name  vagrant.dev.schoolbox.cloud;

    ssl          on;
    ssl_certificate      /etc/nginx/certs/schoolbox-fullchain.crt;
    ssl_certificate_key  /etc/nginx/certs/schoolbox-private.key;
    include      ssl.conf;

    access_log   /vagrant/schoolbox_access.log  full;
    error_log    /vagrant/schoolbox_error.log   error;

    keepalive_timeout  1800;

    location / {
        root /vagrant/dav;
        rewrite ^(.*) /index.php/$1 break;
        fastcgi_pass unix:/run/php/schoolbox-webdav.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /vagrant/dav$fastcgi_script_name;
        include fastcgi_params;
    }


    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
