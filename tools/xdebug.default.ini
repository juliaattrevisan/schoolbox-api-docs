zend_extension=xdebug.so
xdebug.remote_enable=1
# If uncommented, this will cause xdebug to ignore the value of 'remote_host' and attempt
# to connect to the request's remote host
#xdebug.remote_connect_back=1
xdebug.var_display_max_data=512
xdebug.var_display_max_depth=6
xdebug.collect_params=1
xdebug.profiler_enable=0
xdebug.profiler_enable_trigger=1
xdebug.profiler_output_dir=/vagrant/data
xdebug.remote_host=192.168.36.1
# Uncomment next line to debug scripts invoked by cron jobs
# xdebug.remote_autostart = 1
