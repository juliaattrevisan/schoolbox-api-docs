zend_extension=xdebug.so
xdebug.mode=debug
# If uncommented, this will cause xdebug to ignore the value of 'remote_host' and attempt
# to connect to the request's remote host. This is required if PHPStorm is not available at the
# address specified by 'remote_host', eg, you are debugging someone else's machine on the local network,
# or if your vagrant IP addresses are not default.
#xdebug.discover_client_host=1
xdebug.start_with_request=trigger
xdebug.profiler_enable_trigger=1
xdebug.output_dir=/vagrant/data
xdebug.client_host=192.168.36.1
# Uncomment next line to debug scripts invoked by cron jobs
# xdebug.start_with_request = yes
