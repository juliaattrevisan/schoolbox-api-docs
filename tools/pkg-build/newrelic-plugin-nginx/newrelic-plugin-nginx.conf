# newrelic-plugin-nginx Upstart Script
description "newrelic-plugin-nginx"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on started networking
stop on runlevel [!2345]

env GEM_HOME=/usr/share/newrelic-plugin-nginx
env NPNHOME=/usr/share/newrelic-plugin-nginx

respawn

script
  cd $NPNHOME/
  ./newrelic_nginx_agent \
  >> /dev/null \
  2>> /dev/null
end script
