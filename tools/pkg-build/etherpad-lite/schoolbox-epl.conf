# Etherpad Lite for Schoolbox Upstart Script
description "Etherpad Lite for Schoolbox"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on started networking
stop on runlevel [!2345]

env EPHOME=/usr/share/schoolbox-epl
env EPLOGS=/var/log/schoolbox-epl
env EPUSER=schoolboxepl

respawn

pre-start script
  chdir $EPHOME
  mkdir $EPLOGS                      ||true
  chown $EPUSER:adm $EPLOGS          ||true
  chmod 0755 $EPLOGS                 ||true
  chown -R $EPUSER:adm $EPHOME/var   ||true
  $EPHOME/bin/installDeps.sh >> $EPLOGS/error.log || { stop; exit 1; }
end script

script
  cd $EPHOME/
  exec su -s /bin/sh -c 'exec "$0" "$@"' $EPUSER -- node src/node/server.js \
  >> $EPLOGS/access.log \
  2>> $EPLOGS/error.log
end script