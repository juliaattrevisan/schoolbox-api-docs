# Mailcatcher Upstart Script
description "Mailcatcher"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on started networking
stop on runlevel [!2345]

env GEM_HOME=/usr/share/mailcatcher
env MCHOME=/usr/share/mailcatcher
env MCLOGS=/var/log/mailcatcher
env MCVERBOSITY=''
env MCIP='0.0.0.0'

respawn

pre-start script
  chdir $MCHOME
  mkdir $MCLOGS                      ||true
  chmod 0755 $MCLOGS                 ||true
end script

script
  cd $MCHOME/
  exec bin/mailcatcher -f --ip $MCIP $MCVERBOSITY \
  >> $MCLOGS/mailcatcher.log \
  2>> $MCLOGS/mailcatcher-error.log
end script
