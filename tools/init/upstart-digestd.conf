# Schoolbox digestd.php Upstart Script
description "Schoolbox Digest Server"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on (started mysql or runlevel [2345])
stop on runlevel [!2345]

env SBHOME=/usr/share/schoolbox/tools/digest
env SBLOGS=/var/log/schoolbox
env SBVERBOSITY=''

respawn

script
  cd $SBHOME/
  exec ./digestd.php $SBVERBOSITY \
  >> $SBLOGS/digestd.log \
  2>> $SBLOGS/digestd-error.log
end script
