# Schoolbox belld.php Upstart Script
description "Schoolbox Bell Server"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on (started mysql or runlevel [2345])
stop on runlevel [!2345]

env SBHOME=/usr/share/schoolbox/tools/notif/bell
env SBLOGS=/var/log/schoolbox
env SBVERBOSITY=''

respawn

pre-start script
  $SBHOME/../syscheck.php -vvv --mail >> $SBLOGS/belld.log \
    2>> $SBLOGS/belld-error.log
  if [ $? -ne 0 ]
    then exit $?
  fi
end script

script
  cd $SBHOME/
  exec nice -n5 ./belld.php $SBVERBOSITY \
  >> $SBLOGS/belld.log \
  2>> $SBLOGS/belld-error.log
end script
