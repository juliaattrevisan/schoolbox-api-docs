# Schoolbox scheduled.php Upstart Script
description "Schoolbox Scheduling Server"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on (started mysql or runlevel [2345])
stop on runlevel [!2345]

env SBHOME=/usr/share/schoolbox/tools/mq
env SBLOGS=/var/log/schoolbox
env SBVERBOSITY=''

respawn

limit nofile 10240 10240

pre-start script
  $SBHOME/../notif/syscheck.php -vvv --mail >> $SBLOGS/scheduled.log \
    2>> $SBLOGS/scheduled-error.log
  if [ $? -ne 0 ]
    then exit $?
  fi
  $SBHOME/schedule-safe-restart.php -vvv --perform \
  >> $SBLOGS/scheduled.log \
  2>> $SBLOGS/scheduled-error.log
end script

script
  cd $SBHOME/
  exec nice -n5 ./scheduled.php $SBVERBOSITY \
  >> $SBLOGS/scheduled.log \
  2>> $SBLOGS/scheduled-error.log
end script
