# Schoolbox socketd.php Upstart Script
description "Schoolbox Websocket Server"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on (started mysql or runlevel [2345])
stop on runlevel [!2345]

env SBHOME=/usr/share/schoolbox/tools/socket
env SBLOGS=/var/log/schoolbox
env SBVERBOSITY=''
env SBPORT=9081

respawn

limit nofile 10240 10240

pre-start script
  $SBHOME/../notif/syscheck.php -vvv --mail >> $SBLOGS/socketd.log \
    2>> $SBLOGS/socketd-error.log
  if [ $? -ne 0 ]
    then exit $?
  fi
end script

script
  cd $SBHOME/
  exec nice -n5 ./socketd.php -p$SBPORT $SBVERBOSITY \
  >> $SBLOGS/socketd.log \
  2>> $SBLOGS/socketd-error.log
end script
