# Schoolbox rerouted.php Upstart Script
description "Schoolbox Rerouting Server"
author "Sam Bailey <sam.bailey@alaress.com.au>"

start on (started mysql or runlevel [2345])
stop on runlevel [!2345]

env SBHOME=/usr/share/schoolbox/tools/notif/reroute
env SBLOGS=/var/log/schoolbox
env SBVERBOSITY=''

respawn

limit nofile 10240 10240

pre-start script
  $SBHOME/../syscheck.php -vvv --mail >> $SBLOGS/rerouted.log \
    2>> $SBLOGS/rerouted-error.log
  if [ $? -ne 0 ]
    then exit $?
  fi
end script

script
  cd $SBHOME/
  exec nice -n5 ./rerouted.php $SBVERBOSITY \
  >> $SBLOGS/rerouted.log \
  2>> $SBLOGS/rerouted-error.log
end script
