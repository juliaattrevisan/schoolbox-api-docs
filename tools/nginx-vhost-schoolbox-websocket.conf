upstream websocks {
    ip_hash;
    server 127.0.0.1:9081;
}

server {
    listen       8080;
    server_name  sbvagrant.alaress.com.au;

    access_log  /var/log/nginx/schoolbox_access.log  main;
    error_log   /var/log/nginx/schoolbox_error.log error;

    keepalive_timeout  300;

    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
         return 444;
    }

    location / {
        # redirect anything not handled here over to apache
        rewrite ^(.*) http://$host$1;
    }

    # Proxy for notifier websocket connections
    location /websocket {
        access_log off;
        proxy_pass http://websocks;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket support (nginx 1.4)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy for Schoolbox EPL
    location /pad {
        rewrite          /pad/(.*) /$1 break;
        rewrite          ^/pad$ /pad/ permanent;
        proxy_pass       http://127.0.0.1:9001/;
        proxy_redirect   / /pad/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering  off;
    }
}

