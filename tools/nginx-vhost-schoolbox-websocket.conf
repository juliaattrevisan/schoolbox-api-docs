upstream websocks {
    ip_hash;
    server 127.0.0.1:9081;
}

server {
    listen       8080;

    server_name  sbvagrant.alaress.com.au;

    access_log  /var/log/nginx/schoolbox_access.log  full;
    error_log   /var/log/nginx/schoolbox_error.log error;

    keepalive_timeout    1800;

    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 444;
    }

    location /.well-known/ {
        root /vagrant/www;
    }
    location /awstats/ {
        root /var;
        index awstats.awstats.conf.html;
    }
    location /awstats-icon/ {
        root /var;
    }
    # Redirect from old apache version
    location /statistics/awstats.pl {
        return 301 https://$server_name/awstats/;
    }

    location / {
        root /vagrant/www;
        index index.php;
        try_files $uri @schoolbox;
    }

    location /homepage/rss {
        root /vagrant/www;
        index rss.php;
        rewrite ^/(.*) /homepage/rss.php?page=$1 last;
    }

    # Setup xhprof for debugging, only works if module is installed on server
    # TODO - Not working for some reason
    # location /xhprof {
    #     index index.php
    #     root /usr/share/php5-xhprof/xhprof_html;
    # }
    location /debugbar {
        root /vagrant/vendor/maximebf/debugbar/src/DebugBar/Resources;
    }

    location @schoolbox {
        rewrite ^(.*) /index.php?page=$1 last;
    }

    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /websocket {
        keepalive_timeout 1800;
        proxy_pass http://websocks;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /pad {
        rewrite          /pad/(.*) /$1 break;
        rewrite          ^/pad$ /pad/ permanent;
        proxy_pass       http://127.0.0.1:9001/;
        proxy_redirect   / /pad/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering  off;
    }

    location ~ fail.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }
    location ~ portrait.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }
    location ~ image.php$ {
        access_log   /var/log/nginx/schoolbox-images_access.log  full;
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox-images.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /vagrant/www;
        add_header X-UA-Compatible "IE=Edge,chrome=1";
        rewrite ^/login.php$ $scheme://$host permanent;
        fastcgi_pass unix:/run/php/schoolbox.sock;
        fastcgi_index index.php;
        #fastcgi_cache microcache;
        fastcgi_param SCRIPT_FILENAME /vagrant/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        fastcgi_read_timeout 1800;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

}

server {
    listen       8881;

    server_name  sbvagrant.alaress.com.au;

    access_log   /var/log/nginx/schoolbox_access.log  full;
    error_log    /var/log/nginx/schoolbox_error.log   error;

    keepalive_timeout  1800;

    location / {
        root /vagrant/dav;
        index index.php;
    }
    location /.well-known/ {
        root /vagrant/dav;
    }

    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location ~ \.php$ {
        root /vagrant/dav;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/schoolbox-webdav.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /vagrant/dav$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
        fastcgi_read_timeout 1800;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}