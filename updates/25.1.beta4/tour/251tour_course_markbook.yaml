tour:
  title: '25.1 Release Course Markbook Enhancements'
  description: 'Introduce staff users to new features of the 25.1 release when they visit the course markbook'
  roles:
    - staff
  trigger:
    urlRegex: '^/learning/courseMarkbook/.*$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_InteractiveCourseMarkbook.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Interactive Course Markbook</h3>
                  <p>Save teachers hours on marking. Enter, moderate, and publish feedback for whole courses in a single workflow.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5227#textBoxBody5472'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
