tour:
  title: '25.1 Release'
  description: 'Introduce staff users to the new features of the 25.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/learning/courseMarkbook/.*$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Interactive Course Markbook</h3>
                  <p>Save teachers hours on marking. Enter, moderate, and publish feedback for whole courses in a single workflow.</p>"
        class: introjs-whatsnewmodal
