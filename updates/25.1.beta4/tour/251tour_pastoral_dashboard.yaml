tour:
  title: '25.1 Release'
  description: 'Introduce staff users to the new features of the 25.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/pastoral$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Pastoral Frequency Reports</h3>
                  <p>See behaviour and wellbeing trends as they happen, using the new Pastoral Frequency Reports for a real-time view across your school.</p>"
        class: introjs-whatsnewmodal
