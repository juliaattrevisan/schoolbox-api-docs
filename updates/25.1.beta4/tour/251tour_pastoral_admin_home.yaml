tour:
  title: '25.1 Release Admin Enhancements'
  description: 'Introduce staff users to new features of the 25.1 release when they visit the admin home page'
  roles:
    - staff
  trigger:
    urlRegex: '^/adminv2/home'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_StorageCleanup.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Automatic Storage Cleanup</h3>
                  <p>As part of v25.1, Schoolbox will no longer retain unreferenced files. These are permanently deleted each night. Soft-deleted items are unaffected and can still be restored.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502764-5674'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
