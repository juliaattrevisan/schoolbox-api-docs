tour:
  title: '26.1 Release General Enhancements'
  description: 'Introduce staff users to new features of the 26.1 release when they visit their dashboard'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_SonarUI.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Sonar UI</strong></p>
                  <p>Take a first look at the future of Schoolbox. Sonar UI introduces a cleaner, more accessible experience with updated navigation, components, typography, and visual design.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
