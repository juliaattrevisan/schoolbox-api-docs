tour:
  title: '26.1 Release General Enhancements'
  description: 'Introduce staff users to new features of the 26.1 release when they visit their dashboard'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_EnhancedRubrics.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Enhanced Rubrics</strong></p>
                  <p>Assess multiple criteria, outcomes, and capabilities within a single Due Work activity. Enhanced Rubrics provides greater flexibility while reducing duplicate activities and setup time.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_ReportingActivity.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Reporting Activity</strong></p>
                  <p>A brand new activity type designed specifically for curriculum and summative reporting. Capture reporting outcomes, reference supporting evidence, and prepare information for reports in one dedicated workflow.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_CustomParticipationLog.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Custom Participation Log</strong></p>
                  <p>Schoolbox now automatically tracks all adjustments made to student learning activities. Access complete adjustment histories on student profiles and generate filterable reports for quick, reliable auditing and insight.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_ActivityVisibility.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Activity Visibility</strong></p>
                  <p>Activity Visibility now includes more granular controls through audiences, work types, and grade visibility settings. Schools can better manage who sees assessment, reporting, and learning information while supporting a wider range of teaching and reporting workflows.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.1/26.1_WhatsNewModal_Artwork_1920x1080_ResourceBookingCapacity.png' style='width:100%;margin-bottom:16px;'>
                  <p><strong>Resource booking capacity</strong></p>
                  <p>Manage resources that can be booked by multiple people at the same time. Set a capacity for rooms, equipment, and shared resources, then track availability and bookings without creating duplicate resources.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5680' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
