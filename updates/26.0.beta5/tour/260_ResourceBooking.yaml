tour:
  title: '26.0 Release General Enhancements'
  description: 'Introduce staff users to new features of the 26.0 release when they visit their dashboard'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.0/26.0_WhatsNewModal_Artwork_BookResources.png' style='width:100%;margin-bottom:16px;'>
                  <p>Book rooms and shared resources directly within calendar events to reduce clashes, double-bookings and admin effort.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5595#component503617' target='_blank'>Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/26.0/26.0_WhatsNewModal_Artwork_OLC.png' style='width:100%;margin-bottom:16px;'>
                  <p>Learn how to use the latest Schoolbox functionality with the refreshed Online Learning Course, updated for Releases 25.0, 25.1 and 26.0.</p>
                  <p>Learn more in the <a href='/help/sso/send?returnUrl=/homepage/5580' target='_blank'>OLC Release Notes</a>.</p>"
        class: introjs-whatsnewmodal
