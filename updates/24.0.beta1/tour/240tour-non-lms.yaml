tour:
  title: '24.0 Release'
  description: 'Introduce staff to the new features of the 23.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/24_0_release_648x216.jpg' style='width:100%;margin-bottom:16px;'>
                  <h3>Web Push Notifications</h3>
                  <p>Make sure you never miss any events by subscribing to receive notifications directly to your device. To receive notifications on your Apple iPhone, make sure you install the web application.</p>
                  <p>To know more, see the <a href='TODO: Get help page URL'>release notes</a>.</p>"
        class: introjs-newsmodal
