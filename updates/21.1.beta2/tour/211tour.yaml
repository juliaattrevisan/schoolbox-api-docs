tour:
  title: '21.1 Release'
  description: 'Introduce staff to the new features of the 21.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='/static/images/tour/21_1_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Pastoral Flags</h3>
                  <p>Visible on the class list, Synergetic attendance screen, and student profile pages—pastoral flags
                  keep teachers informed of a range of student information including ILPs, medical plans, and strategy
                  sheets, at a glance.</p>
                  <h3>Class Badge Report</h6>
                  <p>Keep track of your students’ goals and achievements easily with the new class badge report.
                  Quickly assign new goals, mark off achievements, and identify next steps.</p>
                  <h3>3rd Party Assessments</h3>
                  <p>Now you can integrate your favourite online learning tools into your class work and markbook.
                  Assign students work in your favourite tool and we’ll launch that work for the student and even
                  capture their progress and results, so you can review in your markbook.</p>
                  <h3>SimCheck by TurnitIn (available 2022)</h3>
                  <p>The similarity system has been upgraded to Simcheck by Turninitin. You will now get improved
                  reports that are modifiable. The accuracy has been improved by automatically excluding your worksheets
                  and never matching the student against themselves.</p>
                  <p><a href='https://help.schoolbox.com.au/homepage/3174'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
