tour:
  title: '22.1 Release'
  description: 'Introduce staff to the new features of the 22.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='/static/images/tour/22_1_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Evidence of achievement</h3>
                  <p>Capturing evidence of how an achievement was earned can be more important than the achievement itself. Now you can capture evidence of what your students did to achieve the award and feature this alongside the badge on the profile page.</p>
                  <h3>Class Pastoral Report</h3>
                  <p>From your Class Page, you may now access an overview of the recently created pastoral records for all students in your class.</p>
                  <h3>Support for Apple photos</h3>
                  <p>We now support uploading of photos from Apple devices using the “High Efficiency” mode. </p>
                  <h3>Acknowledge submissions in your own time</h3>
                  <p>When you acknowledge you have received a student's work, you may now mark it as submitted on time, even if the due date has passed.</p>
                  <h3>New group management interface</h3>
                  <p>Managing groups can be a time consuming chore, especially at the beginning and end of each year. Quickly manage member changes, with powerful features to search and filter the group members.</p>
                  <p><a href='/help/sso/send?returnUrl=/homepage/3343'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
