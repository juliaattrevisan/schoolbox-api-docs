tour:
  title: '22.1 Release'
  description: 'Introduce staff to the new features of the 22.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/22_1_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Support for Apple Photos</h3>
                  <p>We now support uploading of photos from Apple devices using the “High Efficiency” mode. </p>
                  <h3>Improved Group Management</h3>
                  <p>Quickly manage group membership changes, with powerful features to search and filter the member list.</p>
                  <p><a href='/help/sso/send?returnUrl=/homepage/3343'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
