tour:
  title: '24.1 Release'
  description: 'Introduce staff to the new features of the 24.1 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/adminvs/home'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/24.1/1_user_profile_builder.png' style='width:100%;margin-bottom:16px;'>
                  <h3>User Profile Builder</h3>
                  <p>Customise User Profile pages with tailored fields, layouts, and role-based privacy controls.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5227#textBoxBody5472'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/24.1/2_grant_access_levels.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Grant Access Levels</h3>
                  <p>Assign different types of admin access to the relevant staff, limiting access to only what’s necessary.</p>
                  <p>For more details, see the <a href='/help/sso/send?returnUrl=/homepage/5227#textBoxBody5473' target='_blank'>release notes</a>.</p>
                  <p>To find out your access levels, contact your school's IT Admin.</p>"
        class: introjs-whatsnewmodal
