tour:
  title: 'Help Chatbot Tour'
  description: 'Introduce users to the new help chatbot'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: Meet Hercules, your new Schoolbox Help Assistant
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1.4/SupportBotLaunch_FeatureTour_1920x1080_2025.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Meet Hercules, your new Schoolbox Help assistant</h3>
                  <p>Located within Schoolbox Help only, Hercules is your 24/7 guide to finding Schoolbox-related answers, guides and troubleshooting steps faster. Try asking it a question next time you need help!</p>
                  <p>For more information, visit our <a href='/help/sso/send?returnUrl=/homepage/5499' target='_blank'>FAQs page</a>, and <a href='/help/sso/send?returnUrl=/login/' target='_blank'>log into Schoolbox Help</a> to try it out!</p>"
        class: introjs-whatsnewmodal
    - step:
        title: And as a reminder, you can easily access Schoolbox Help anytime via the top menu
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1.4/SupportBotLaunch_FeatureTour_1920x1080_2025_2.png' style='width:100%;margin-bottom:16px;'>
                  <h3>And as a reminder, you can easily access Schoolbox Help anytime via the top menu:</h3>
                  <ol class='introjs-ordered-list'>
                   <li>Click your profile photo in the top menu</li>
                   <li>Select \"Online Help\"</li>
                   <li>Click the chat icon in the bottom right corner to start asking questions!</li>
                  </ol>"
        class: introjs-whatsnewmodal
