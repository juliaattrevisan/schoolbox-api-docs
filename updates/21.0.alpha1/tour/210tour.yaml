tour:
  title: '21.0 Release'
  description: 'Introduce staff to the new features of the 21.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: " <img src='/static/images/tour/21_0_release.png' style='width:100%;margin-bottom:16px;'>
                   <h3>Share Google Files</h3>
                   <p>Quickly embed and share Google Docs with your class or group to enable real-time collaboration.
                   You get all of the features of Google, without leaving the system.</p>
                  <h3>Video Capture</h6>
                  <p>Record audio and video directly in your browser to share anywhere you can attach a file.</p>
                  <h3>Download Class Feedback</h3>
                  <p>When you download student submissions, we now include a PDF of the students’ work, rubric and grades.</p>
                  <h3>Print in Full Colour</h3>
                  <p>You can now print pages, timetables, calendars and rubrics in full colour to share with others.</p>
                  <h3>Get Online Help</h3>
                  <p>Access Schoolbox Help training and community groups by simply clicking the link under your profile photo.</p>
                  <p><a href='https://help.schoolbox.com.au/homepage/3067'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
