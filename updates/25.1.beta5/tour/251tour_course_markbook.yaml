tour:
  title: '25.1 Release Course Markbook Enhancements'
  description: 'Introduce staff users to new features of the 25.1 release when they visit the course markbook'
  roles:
    - staff
  trigger:
    urlRegex: '^/learning/courseMarkbook/[0-9]+$' # Match e.g. /learning/courseMarkbook/83.  Do not match e.g. /learning/courseMarkbook/export/83/, /learning/courseMarkbook/123/unit/456/folder/83.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_InteractiveCourseMarkbook.png' style='width:100%;margin-bottom:16px;'>
                  <p>Save hours on marking with our updated course markbook. You can now enter, moderate, and publish feedback for an entire course in one simple workflow.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textBoxBody-502752-5670' target='_blank'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
