tour:
  title: '25.1 Release General Enhancements'
  description: 'Introduce staff users to new features of the 25.1 release when they visit their dashboard'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_AIImageGen.png' style='width:100%;margin-bottom:16px;'>
                  <h3>AI Image Generation</h3>
                  <p>Customise User Profile pages with tailored fields, layouts, and role-based privacy controls.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502755-5673'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_ContentTemplates.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Content Templates</h3>
                  <p>Keep every message on-brand and easy to read. Access templates across news, feedback, activities, emails, and events.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502754-5672'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_LearningMomentModeration.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Learning Moment Moderation</h3>
                  <p>See every Learning Moment in one place. Review, approve, and share with confidence in the new report.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502753-5671'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_UpdatedEditor.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Updated Editor Features</h3>
                  <p>Edit with more focus, expression, and accuracy. The text editor now has fullscreen mode, emoji support, bookmarks, diacritics, and syntax highlighting.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502756-5675'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_Differentiation.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Improved Assessment Differentiation</h3>
                  <p>See pastoral flags inline and create adjusted assessments faster by copying or customising from the original.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textbox-502756-5675'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
