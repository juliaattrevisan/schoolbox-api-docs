tour:
  title: '25.1 Release General Enhancements'
  description: 'Introduce staff users to new features of the 25.1 release when they visit their dashboard'
  roles:
    - staff
  trigger:
    urlRegex: '^\/$' # Match the root URL only.
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_AIImageGen.png' style='width:100%;margin-bottom:16px;'>
                  <p>Bring your ideas to life in seconds. Access the all new AI Image Generator anywhere the file drop zone or file picker appears.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textBoxBody-502755-5673' target='_blank'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_ContentTemplates.png' style='width:100%;margin-bottom:16px;'>
                  <p>Keep every message on-brand and easy to read. Access templates across news, feedback, activities, emails, and events.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textBoxBody-502754-5672' target='_blank'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_LearningMomentModeration_V2.png' style='width:100%;margin-bottom:16px;'>
                  <p>See every Learning Moment in one place. Review, approve, and request updates with ease. Draft mode and autosave keep progress safe, while multiple evidence types and class or group tagging make sharing effortless.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textBoxBody-502753-5671' target='_blank'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.1/25_1_WhatsNewModal_Artwork_1920x1080_UpdatedEditor.png' style='width:100%;margin-bottom:16px;'>
                  <p>Edit with more focus, expression, and accuracy. The text editor now has fullscreen mode, bookmarks, diacritics, and syntax highlighting.</p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5460#textBoxBody-502756-5675' target='_blank'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
