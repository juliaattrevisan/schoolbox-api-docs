tour:
  title: '25.0 Admin Release'
  description: 'Introduce superusers and moderators to the new admin features of the 25.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/adminv2/home'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/25.0/1_notification_pause.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Notification Pause</h3>
                  <p>
                    Take control of notifications. Bulk reset user preferences to align with school policy, and pause overnight 
                    alerts to avoid out-of-hours disruptions - keeping communication timely, relevant, and respectful.
                  </p>
                  <p>To learn more, see the <a href='/help/sso/send?returnUrl=/homepage/5362'>release notes</a>.</p>"
        class: introjs-whatsnewmodal
