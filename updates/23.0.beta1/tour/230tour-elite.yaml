tour:
  title: '23.0 Release'
  description: 'Introduce staff to the new features of the 23.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/23_0_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Lesson Plans</h3>
                  <p>Now you can create lesson plans either in your class or course based on predefined templates. Teachers can save time, maintain consistency, and provide a more engaging and interactive learning experience for their students, while providing visibility for support staff or relief teachers.</p>
                  <h3>New Rich Text Editor</h3>
                  <p>The editor used throughout the system has been updated with a simpler interface and more powerful functions. Easily drag and drop images, embed videos, add files and create tables. Improved styling options are available to enhance the look and feel of your content.</p>
                  <h3>Class Markbook Quick Actions</h3>
                  <p>The class markbook now features a pop-out menu on each cell.  Use this to gain get insights into recent activity, access submissions, provide feedback and publish results. This also provides a quick way to exclude a student from one or multiple assessments.</p>
                  <h3>Badge Evidence</h3>
                  <p>Once you have set goals for your students, they can submit evidence of their progress towards achieving the goal.  This allows the teacher to quickly review if a student has demonstrated proficiency before awarding the achievement.</p>
                  <p><a href='/help/sso/send?returnUrl=/homepage/3695'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
