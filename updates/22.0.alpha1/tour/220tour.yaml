tour:
  title: '22.0 Release'
  description: 'Introduce staff to the new features of the 22.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='/static/images/tour/22_0_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Join Your Favourite Groups</h3>
                  <p>The groups page has been updated to allow you to quickly search, join, favourite and mute groups throughout the system.</p>
                  <h3>Recently Viewed Assessments</h3>
                  <p>You can now find out the last time a student or parent visited an assessment. Visit the submission history page to see who has visited and if they have seen the feedback provided.</p>
                  <h3>View All Files</h3>
                  <p>The files component now features dedicated view all files page. On this page you can filter, search and quickly delete multiple files.</p>
                  <h3>Redesigned Student Self-Reflection</h3>
                  <p>To simplify the due work submission process for students, the file upload and self-reflection steps have been merged into a single step.</p>
                  <h3>Rubric Markdown</h3>
                  <p>Improve the style of your rubric descriptors using markdown formatting. Add bold, underline, dot point lists and even links to other pages.</p>
                  <p><a href='/help/sso/send?returnUrl=/homepage/3299'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
