tour:
  title: '23.0 Release'
  description: 'Introduce staff to the new features of the 23.0 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: "<img src='{CDN_PREFIX}/images/tour/23_0_release.png' style='width:100%;margin-bottom:16px;'>
                  <h3>Lesson Plans</h3>
                  <p>Now you can create lesson plans either in your class or course based on predefined templates.  Align lessons with your curriculum and communicate with students and support staff your intentions for each of your lessons and make sure no one misses out on anything.</p>
                  <h3>New Rich Text Editor</h3>
                  <p>The editor used throughout the system has been updated with a simpler interface and more powerful functions. Easily drag and drop images, embed videos, files and tables. Improved styling options to bring some improved look and feel to your content.</p>
                  <h3>Class Markbook Quick Actions</h3>
                  <p>The class markbook now features a pop-out menu on every cell.  Use this to get insights into recent activity, view work, provide feedback and publish results. This also provides a quick way to exclude a student from multiple assessments.</p>
                  <h3>Badge Evidence</h3>
                  <p>Following setting badges as goals for your students, they can submit evidence of achievement to the goal.  Allowing you to quickly review if a student has demonstrated the capability before you award the badge.</p>
                  <p><a href='/help/sso/send?returnUrl=/homepage/3695'>Find out more via our release notes.</a><br />"
        class: introjs-newsmodal
