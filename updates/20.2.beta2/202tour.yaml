tour:
  title: '20.2 Release'
  description: 'Introduce staff to the new features of the 20.2 release'
  roles:
    - staff
  trigger:
    urlRegex: '^/$'
    selector: body
    event: tourReady
  steps:
    - step:
        title: What's New
        type: modal
        content: " <img src='/static/images/tour/20_2_release.png' style='width:100%;margin-bottom:16px;'>
                   <h6>Goals and Achievements</h6>
                   <p>Create engaging visual badges, and align them with your curriculum, to represent the rich individualised student journeys on offer at your school.  Engage each student’s growth mindset by encouraging them to set goals, and then celebrate their success and share with parents as they demonstrate mastery.</p>
                   <h6>Learning Moments</h6>
                   <p>Use video, photos or words to tell the story of each student's learning journey. Easily post moments across individuals, groups or classes. Quick and simple to use, even the youngest students will be sharing learning in no time.</p>
                   <h6>News Attachments</h6>
                   <p>Simple ability to drag and drop attachments onto news posts. Attach your supporting files or documents, and upload photos to quickly create an image gallery to showcase your event.</p>
                   <h6>Blind Assessment</h6>
                   <p>Ensure your assessment is without compromise. Provide feedback and grades without knowing the identity of your students.  </p>
                   <p><a href='https://help.schoolbox.com.au/homepage/3050'>Find out more via our release notes.</a><br />
                   <b>Hercules & the Schoolbox Team</b>
                   </p>"
        class: introjs-newsmodal

