---
version: "2"
checks:
 argument-count:
    enabled: false
#  complex-logic:
#    config:
#      threshold: 4
 file-lines:
  enabled: false
 method-complexity:
  enabled: false
 method-count:
  enabled: false
 method-lines:
  enabled: false
#  nested-control-flow:
#    config:
#      threshold: 4
 return-statements:
  enabled: false
 similar-code:
  enabled: false
#  identical-code:
#    config:
#      threshold: # language-specific defaults. an override will affect all languages.
plugins:
  phpcodesniffer:
    enabled: true
    checks:
      Squiz WhiteSpace ControlStructureSpacing SpacingAfterOpen:
        enabled: false
      Generic Files LineLength TooLong:
        enabled: false
  phan:
    enabled: true
    config:
      file_extensions: "php"
      ignore-undeclared: true
  scss-lint:
    enabled: true
  sonar-php:
    enabled: true
exclude_patterns:
  - "vendor/"
  - "**/tests/**/*"
  - "test/"
  - "**/Test/**/*"
  - "javascript/bundle/"
  - "node_modules/"
  - "sql/"
  - "updates/"
  - "debian/"
  - "www/"
  - "!www/static/css/**/*"
  - "tools/"
