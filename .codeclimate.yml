exclude_paths:
- "vendor/"
- "tests/"
- "test/"
- "javascript/components/"
- "node_modules/"
- "sql/"
- "updates/"
- "debian/"

engines:
  duplication:
    enabled: true
    config:
      languages:
      - javascript:
      - php:
  phpcodesniffer:
    enabled: true
  phan:
    enabled: false
    config:
      file_extensions: "php"
  phpmd:
    enabled: false
    config:
      file_extensions: "php"
      rulesets: "cleancode,naming"
  scss-lint:
    enabled: true
ratings:
  paths:
  - "**.php"
  - "**.scss"