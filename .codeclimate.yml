version: "2"

exclude_patterns:
- "vendor/"
- "**/tests/**/*"
- "test/"
- "**/Test/**/*"
- "javascript/components/"
- "node_modules/"
- "sql/"
- "updates/"
- "debian/"
- "www/"
- "!www/css/**/*"
- "tools/"

