exclude_paths:
- "vendor/"
- "**/tests/**/*"
- "test/"
- "**/Test/**/*"
- "javascript/components/"
- "node_modules/"
- "sql/"
- "updates/"
- "debian/"
- "www/"
- "!www/css/**/*"
- "tools/"

engines:
  duplication:
    enabled: true
    config:
      languages:
      - javascript:
      - php:
  phpcodesniffer:
    enabled: true
    checks:
      Squiz WhiteSpace ControlStructureSpacing SpacingAfterOpen:
        enabled: false
      Generic Files LineLength TooLong:
        enabled: false
  phan:
    enabled: true
    config:
      file_extensions: "php"
      ignore_undeclared: true
      ignore-undeclared: true
  phpmd:
    enabled: false
    config:
      file_extensions: "php"
      rulesets: "cleancode"
  scss-lint:
    enabled: true
ratings:
  paths:
  - "**.php"
  - "**.scss"
