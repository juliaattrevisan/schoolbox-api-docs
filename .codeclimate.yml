---
version: "2"
#checks:
#  argument-count:
#    config:
#      threshold: 4
#  complex-logic:
#    config:
#      threshold: 4
#  file-lines:
#    config:
#      threshold: 250
#  method-complexity:
#    config:
#      threshold: 5
#  method-count:
#    config:
#      threshold: 20
#  method-lines:
#    config:
#      threshold: 25
#  nested-control-flow:
#    config:
#      threshold: 4
#  return-statements:
#    config:
#      threshold: 4
#  similar-code:
#    config:
#      threshold: # language-specific defaults. an override will affect all languages.
#  identical-code:
#    config:
#      threshold: # language-specific defaults. an override will affect all languages.
plugins:
  phpcodesniffer:
    enabled: true
    checks:
      Squiz WhiteSpace ControlStructureSpacing SpacingAfterOpen:
        enabled: false
      Generic Files LineLength TooLong:
        enabled: false
  phan:
    enabled: true
    config:
      file_extensions: "php"
      ignore-undeclared: true
  scss-lint:
    enabled: true
  sonar-php:
    enabled: true
  tslint:
    enabled: true
    config: tslint.json
exclude_patterns:
  - "vendor/"
  - "**/tests/**/*"
  - "test/"
  - "**/Test/**/*"
  - "javascript/components/"
  - "node_modules/"
  - "sql/"
  - "updates/"
  - "debian/"
  - "www/"
  - "!www/css/**/*"
  - "tools/"
