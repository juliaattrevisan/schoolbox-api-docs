<div class="component" id="component{COMPONENT_ID}">
  <div class="componentHeader">
    <h2 class="large_head">Discussion Board</h2>
  </div>
  <!-- BEGIN config -->
  <a class="config" onclick="toggleConfig('component{COMPONENT_ID}');"></a>
  <div class="componentConfig">
    <form action="subject/customisePage.php" method="get">
      <input type="hidden" name="cid" value="{ID}" />
      <input type="hidden" name="type" value="config" />
      <input type="hidden" name="component" value="{COMPONENT_ID}" />
      <label for="size">Item Limit: </label>
      <select name="size">
      	<!-- BEGIN size -->
      	<option value="{COMPONENT_CONFIG_SIZE_VALUE}"{COMPONENT_CONFIG_SIZE_SELECTED}>{COMPONENT_CONFIG_SIZE_NAME}</option>
      	<!-- END size -->
      </select>
      <input type="submit" value="Update" />
    </form>
  </div>
<!-- END config -->
  <table>
    <!-- BEGIN large_forum -->
    <tr>
      <td class="large_text"><h3>{FORUM_HEADING}</h3></td>
      <td style="text-align:right" class="large_text">{REPLY}{MOD_FORUM}</td>
    </tr>
    <tr>
      <td class="large_text" colspan="2">{FORUM_BODY}</td>
    </tr>
    <tr>
      <td style="border-bottom:1px solid #666" class="large_text" colspan="2"><span class="element_footer">Posted by <a href="/mail/createMail.php?replyto={CONTACT}">{POSTER}</a> on {POSTED_DATE}</span></td>
    </tr>
    <!-- END large_forum -->
    <tr style="height:2px;">
      <td colspan="2" style="background:#666;"></td>
    </tr>
    <!-- BEGIN submit_forum -->
    <tr>
      <td style="text-align:right;" colspan="2" class="navbar"><a href="/forum/modpost.php?cid={CID}&parent=0">POST TOPIC</a></td>
    </tr>
    <!-- END submit_forum -->
  </table>
</div>
