# default settings for vagrant box.
# To modify, copy to vagrant.yaml and modify settings as needed.
vagrant_box: "ubuntu-1804-php74"
memory: 1568
processors: 2
public_network: true
private_network_ip: "192.168.36.10"
external_db: "synergetic"
external_db_host: "172.31.15.10"
external_db_db: "Synergetic_AUVIC_ALARESS_PRD"
provision_script: "tools/vagrant-provision.sh"
enable_xdebug: "true"
# From Sam.Bailey ~2017
# This is a caching proxy that can be used when in the Melbourne Office for faster downloads.
# It's a caching proxy, so if you're the first to download a new version it will be same speed as downloading from AWS, but the next person will be faster.
# data_source: "https://gw-mel.alaress.com.au/sandbox-data"
data_source: "https://s3-ap-southeast-2.amazonaws.com/schoolbox-data"
data_filename: "initial.tar.gz"
# If multiple network interfaces are available, select this interface automatically. If empty, prompt user.
bridged_network_interface:
# You can provide either a relative (from this file) or absolute path to your puppet-alaress repo
puppet_dir: "../puppet-alaress"
# Show debug output when provisioning?
puppet_debug: false
# By default is empty, so will fall back to real IR URL.
# Set this to your dev IR when developing integrations between IR, Puppet + Schoolbox
instance_registry_url_override: ""
# By default this is empty. When developing integrations with the IR you can add host + instance records. The host
# records API_KEY must match this value.
instance_registry_api_key: ""
# By default the INSTANCE_ID env variable is set as vagrantx
instance_id_env_var: "vagrantx"
# By default we use git pull to get the latest puppet must be either pull, gitsync, or none
puppet_sync_type: "pull"
# By default, prevent upgrading SQL data that is too old for current codebase
force_upgrade: false

# Optional extra hostnames (domain hardcoded to dev.schoolbox.cloud) that this vagrant will serve.
# eg 'aaa' will add 'aaa.dev.schoolbox.cloud' to vagrant vhost. AWS IAM credentials required to download wildcard cert
extra_hostname:
aws_iam_key: ''
aws_iam_secret: ''

# Which PHP major version should be enabled? Supported options: ['7.4','8.0']
primary_php_majver: '7.4'


# Task daemon repo settings: analogous to the Puppet repo settings.
# Note the default sync type is "gitsync": this is because the "pull" sync type
# is redundant, as the taskd image pulled from Dockerhub should be identical to
# what would be built from the most recent taskd master.
taskd_dir: "../taskd"
taskd_sync_type: "gitsync"

# Should the task daemon image be built from the local dir at all?
# If not, then the image will be pulled from Dockerhub
# (requires a valid DOCKERHUB_ACCESS_TOKEN in .env)
taskd_build_from_local: false
