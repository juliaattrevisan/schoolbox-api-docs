<script>
function loadinparent(url, closeSelf){
	self.opener.location = url;
	if(closeSelf) self.close();
	}
</script>

<body>
	<div class="headerRow">
		<div class="cell" id="home"><a href="viewTimesheet.php?id={ID}&type={TYPE}&week={LASTWEEK}">&lt;&lt;</a>&nbsp;&nbsp;<a href="viewTimesheet.php?id={ID}&type={TYPE}&week={NEXTWEEK}">&gt;&gt;</a></div>

		<!-- END col_header -->
	</div>
	<!-- BEGIN table_row -->
	<div class="row{ROW_TYPE}">

		<div class="cell"><div class="divider"></div></div>
		<!-- END table_cell -->
	</div>
	<!-- END table_row -->
	
	<!-- BEGIN booking -->
		<div class="bookCell" style="top:{START}px;left:{COLUMN}px;height:{LENGTH}px;background:{COLOUR};"><p><span>{TIME}</span><br />{CREATOR}<br />{MODIFY}</p></div>
