openapi: 3.0.2


info:
  title:       Schoolbox API Common Properties
  description: |
    Common properties shared between all Schoolbox APIs
  x-api-id:    8e6116e3-d39a-4d4c-a7a1-3e5273ed591b
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au


servers:
  - url: https://{hostname}.{domain}/
    variables:
      hostname:
        description: The subdomain of the school's domain name on which Schoolbox is hosted.
        default: demo
      domain:
        description: The school's domain name.
        default: schoolbox.com.au


# The common properties schema defines no paths:
# it acts only as a source for other documents to reference.
paths: {}


components:
  schemas:
    id:
      title: ID
      description: Identifying ID number for most objects within Schoolbox
      readOnly: true
      type: integer
      format: int32
      minimum: 1

    cursor:
      title: Cursor
      description: |
        A generated but decodable pointer to the first record to return.

        Each endpoint whose data accepts a cursor will return a cursor that
        points to the next page of the result set.
      type: string

    itemSearchRelevance:
      title: Item search relevance metadata
      description: |
        If this item is retrieved as part of a search, this field may contain
        the item's relevance to the search term.
      type: object
      properties:
        _relevance:
          type: number
          minimum: 0
          maximum: 1
          description: |
            A floating-point number between 0 and 1: the higher the number, the
            more relevant to the search this item is.

    item:
      title: Item
      description: An example of a schema for a single item.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'

    itemList:
      title: Item list
      description: |
        An example of a schema for a list of items.

        Contains metadata for the list of items, as well as the list itself.
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/item'
              - $ref: '#/components/schemas/itemSearchRelevance'
        metadata:
          $ref: '#/components/schemas/listMetadata'

    listMetadata:
      title: List metadata
      description: Metadata for lists of items retrieved
      readOnly: true
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: If provided, the number of items in the result set.
        cursor:
          type: object
          properties:
            current:
              allOf:
                - $ref: '#/components/schemas/cursor'
              nullable: true
              description: |
                If set, a cursor to the current page of results.
                Seems redundant, but it does generate a cursor to a request
                made without one.
            next:
              allOf:
                - $ref: '#/components/schemas/cursor'
              nullable: true
              description: If set, a cursor to the next page of results.
          required:
            - current
            - next

    problem:
      title: Problem Details
      description: Schema for RFC 7807 (Problem Details for HTTP APIs)
      readOnly: true
      type: object
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          default: 'about:blank'
        title:
          type: string
          description: A short human-readable summary of the problem type
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 503
          description: The HTTP status code
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem
      required:
        - type
        - title
        - status

    dateTime:
      title: Datetime
      description: |
        A JSON representation of a datetime.
        For compatibility with existing code, can be defined as either:
        * a RFC3339 string
        * an object, which contains a datetime in several formats
      oneOf:
        - type: string
          format: date-time
        - type: object
          readOnly: true
          deprecated: true
          description: |
            This read-only object representation is deprectaed and will be
            removed eventually: it exists only for compatibility with existing
            API endpoints.

            If using this object representation, please use the "json" property
            and perform localization using client-side libraries.
          required:
            - json
          properties:
            database:
              type: string
              description: |
                A database representation of the date.
            unixTimestamp:
              type: integer
              format: int64
              description: |
                The date as a Unix timestamp.
            local:
              type: string
              description: |
                A string representation of the date, localized to the Schoolbox
                instance's settings.
            json:
              type: string
              format: date-time
              description: |
                The date as a RFC3339 string.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        This API supports authentication via a JWT provided by a trusted oAuth provider.

    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        This API supports authentication via a standard session ID cookie.

    # TODO enable when/if Schoolbox implements an oAuth provider
#    # Will a separate security scheme be required per provider? Seems like it
#    schoolboxOauth:
#      type: oauth2
#      description: |
#        This API supports authentication via Schoolbox's own oAuth provider.
#      flows:
#        authorizationCode:
#          authorizationUrl: /oauth/authorize
#          tokenUrl: /oauth/token
#          refreshUrl: /oauth/refresh
#        clientCredentials:
#          tokenUrl: /oauth/token


  responses:

    item:
      description: |
        A response for a single item.

        Currently this serves only as an example of how a response for a single
        item should look: OpenAPI doesn't currently allow a response to
        reference another response, and also define its own schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/item'

    itemList:
      description: |
        A list of items.

        Currently this serves only as an example of how a response for a single
        item should look: OpenAPI doesn't currently allow a response to
        reference another response, and also define its own schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/itemList'

    problem:
      description: RFC 7807 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem'
          examples:
            badRequestUpdate:
              $ref: '#/components/examples/problemBadRequestUpdate'
            badRequestDelete:
              $ref: '#/components/examples/problemBadRequestDelete'
            unauthorized:
              $ref: '#/components/examples/problemUnauthorized'
            forbidden:
              $ref: '#/components/examples/problemForbidden'
            notFound:
              $ref: '#/components/examples/problemNotFound'
            internalServerError:
              $ref: '#/components/examples/problemInternalServerError'


  parameters:
    id:
      name:        id
      in:          path
      description: |
        The ID of an item to act upon.

        The type of item that is acted upon is dependent on the endpoint in which
        it is included.
      required:    true
      schema:
        type: integer
        format: int32
        minimum: 1

    limit:
      name:        sort
      in:          query
      description: Maximum number of records to return
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    search:
      name:        search
      in:          query
      description: |
        A search term.

        Each endpoint which accepts this parameter will have its own logic for
        determining whether an item matches this search term.

        In addition, each returned item should return how close a match it is
        for this search term.
      schema:
        type: string

    properties:
      name: properties
      in: query
      description: |
        If this is set, then only these properties are included in any items
        that this endpoint retrieves. (If not provided, all properties will be
        included.)

        This parameter is useful for if only a subset of the item's properties
        is required for an operation.
      schema:
        type: array
        items:
          type: string
      example:
        # fetch only the ID, first name and last name properties
        - [id, firstname, lastname]

    filter:
      name:        filter
      in:          query
      description: |
        A set of filters (if any) which will be used to filter out the list of
        items that this endpoint returns.

        Generally, the structure of this object will match the structure of
        the object that the endpoint returns: any object which is like the
        filter object passed in will be returned in the search.

        Values in the object may either be scalars (the field must equal this
        value), or objects with a particular key:
        * equals: the field must equal the value of this key
        * in: the field must be one of the values of this key
        * between: the field must be between the two values of this key
        * lessThan, greaterThan: the field must be one of the values of this key

        Fields of sub-objects may also be used in filters.

        Inspired by https://www.algolia.com/doc/api-reference/api-parameters/filters/
      schema:
        type: object
      example:
        # fetch an item whose ID = 5
        - id: 5
        # fetch an item whose ID = 5
        - id:
            equals: 5
        # fetch an item whose ID is 1, 3 or 5
        - id:
            in: [1, 3, 5]
        # fetch an item whose ID is less than 17
        - id:
            lessThan: 17
        # fetch an item whose ID is between 1 and 5
        - id:
            between: [1, 5]
        # fetch an item whose role ID is 1
        - role:
            id: 1
        # fetch an item whose role type is staff
        - role:
            type: staff
        # fetch an item whose role type is staff or parent
        - role:
            type:
                in: [staff, parent]
        # fetch an item whose role type is staff or parent,
        # and whose ID < 17
        - role:
            type:
                in: [staff, parent]
          id:
            lessThan: 17

    cursor:
      name:        cursor
      in:          query
      description: |
        A generated but decodable pointer to the first record to return.

        Each endpoint whose data accepts a cursor will return a cursor that
        points to the next page of the result set.
      schema:
        $ref: '#/components/schemas/cursor'

    token:
      name:        token
      in:          query
      description: |
        A token for user authentication.
        This is temporary, and will be replaced with oAuth/JWT authentication.
      schema:
        type: string


  examples:

    problemBadRequestUpdate:
      value:
        type:   about:blank
        title:  Bad Request
        status: 400
        detail: This resource may not have its created at time modified.

    problemBadRequestDelete:
      value:
        type:   about:blank
        title:  Bad Request
        status: 400
        detail: This resource may not be deleted.

    problemUnauthorized:
      value:
        type:   about:blank
        title:  Unauthorized Access
        status: 401
        detail: Authorization is required to access resource with ID=1.

    problemForbidden:
      value:
        type:   about:blank
        title:  Forbidden
        status: 403
        detail: You do not have permission to access resource with ID=1.

    problemNotFound:
      value:
        type:   about:blank
        title:  Not Found
        status: 404
        detail: The resource with ID=1 was not found.

    problemInternalServerError:
      value:
        type:   about:blank
        title:  Internal Server Error
        status: 500
        detail: An unexpected error occured when accessing resource with ID=1. This error has been logged.
