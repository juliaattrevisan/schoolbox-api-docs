openapi: 3.0.2

info:
  title:       Schoolbox Discussion Threads API
  description: |
    Schoolbox Discussion Threads API
  x-api-id:    7786c5c6-5fc9-4613-827e-f4170f9ffe27
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au


# TODO reference servers to common.yaml once this is actually possible
# See https://github.com/OAI/OpenAPI-Specification/issues/1527 for why it's not
servers:
  - url: https://{hostname}.{domain}/
    variables:
      hostname:
        description: The subdomain of the school's domain name on which Schoolbox is hosted.
        default: demo
      domain:
        description: The school's domain name.
        default: schoolbox.com.au


security:
  # Authorization is handled by Schoolbox itself once a user is authenticated:
  # therefore, no scopes are defined for any security scheme.
  - bearerAuth:     []


paths:

  /discussion/{contextType}/{contextId}/comments/{id}:
    delete:
      operationId: deleteComment
      summary: Deletes a comment
      responses:
        '204':
          description: The resource was deleted successfully.
        default:
          $ref: 'common.yaml#/components/responses/problem'

    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'

  /discussion/{contextType}/{contextId}/comments/{id}/comments:
    get:
      operationId: getCommentsByParent
      summary: Returns child comments for a parent comment
      responses:
        '200':
          $ref: '#/components/responses/commentList'
        default:
          $ref: 'common.yaml#/components/responses/problem'

    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'
      - $ref: 'common.yaml#/components/parameters/cursor'
#      - $ref: '#/components/parameters/limit'
#      - $ref: '#/components/parameters/depth'

  /discussion/{contextType}/{contextId}/threads/{id}:
    get:
      operationId: getThread
      summary: Returns a thread
      responses:
        '200':
          $ref: '#/components/responses/thread'
        default:
          $ref: 'common.yaml#/components/responses/problem'

    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'

  /discussion/{contextType}/{contextId}/threads:
    post:
      operationId: createThread
      summary: Creates a thread
      responses:
        '201':
          description: The thread that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/thread'
        default:
          $ref: 'common.yaml#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/thread'

    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'

  /discussion/{contextType}/{contextId}/threads/{id}/comments:
    get:
      operationId: getCommentsByThread
      summary: Returns comments for a thread
      responses:
        '200':
          $ref: '#/components/responses/commentList'
        default:
          $ref: 'common.yaml#/components/responses/problem'

    post:
      operationId: createCommentInThread
      summary: Creates a new comment
      responses:
        '201':
          description: The comment that was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/comment'
        default:
          $ref: 'common.yaml#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/comment'

    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'
      - $ref: 'common.yaml#/components/parameters/cursor'

  /discussion/{contextType}/{contextId}/threads/{id}/open:
    put:
      operationId: openThread
      summary: Open commenting thread
      responses:
        '200':
          description: Enable the thread
        default:
          $ref: 'common.yaml#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/thread'
    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'

  /discussion/{contextType}/{contextId}/threads/{id}/close:
    put:
      operationId: closeThread
      summary: Close commenting thread
      responses:
        '200':
          description: Disable the thread
        default:
          $ref: 'common.yaml#/components/responses/problem'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/thread'
    parameters:
      - $ref: '#/components/parameters/contextType'
      - $ref: '#/components/parameters/contextId'
      - $ref: 'common.yaml#/components/parameters/id'

components:
  schemas:
    thread:
      title: Thread
      description: Common fields for discussion threads
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        open:
          type: boolean
          description: Is the thread open for further comments?
        created:
          $ref: 'common.yaml#/components/schemas/dateTime'
        updated:
          $ref: 'common.yaml#/components/schemas/dateTime'
        children:
          allOf:
            - $ref: '#/components/schemas/commentList'
          description: A list of direct child comments of this thread
      required:
        - id
        - open

    comment:
      title: Comment
      description: Common fields for discussion comments
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        thread:
          $ref: '#/components/schemas/thread'
        author:
          allOf:
            - $ref: 'user.yaml#/components/schemas/user'
          nullable: true
        content:
          type: string
        created:
          $ref: 'common.yaml#/components/schemas/dateTime'
        updated:
          $ref: 'common.yaml#/components/schemas/dateTime'
        parent:
          allOf:
            - $ref: '#/components/schemas/comment'
          description: |
            The direct parent of this comment, if there is one.
            If there is none, this comment is a top-level comment within a thread.
          nullable: true
        children:
          allOf:
            - $ref: '#/components/schemas/commentList'
          description: A list of direct children of this comment
        visibility:
          description: |
            Which role types may view this comment? If not set, assume all role
            types may view it.
            This is likely to be replaced with a more sophisticated visibility
            system, which encompasses individual roles, role types, folders,
            and who knows what else?
          type: array
          items:
            type: string
            enum:
              - staff
              - parent
              - student
      required:
        - id
        - thread
        - content

    commentList:
      title: Comment list
      description: A list of comments
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/comment'
        metadata:
          $ref: 'common.yaml#/components/schemas/listMetadata'

  securitySchemes:
    bearerAuth:
      $ref: 'common.yaml#/components/securitySchemes/bearerAuth'

    cookieAuth:
      $ref: 'common.yaml#/components/securitySchemes/cookieAuth'

  responses:
    thread:
      description: A thread
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/thread'
        text/html:
          schema:
            type: string
            description: The thread, rendered into HTML on the server.

    commentList:
      description: a list of comments
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/commentList'
          examples:
            empty:
              $ref: '#/components/examples/commentListEmpty'
            one:
              $ref: '#/components/examples/commentListOne'
            many:
              $ref: '#/components/examples/commentListMany'
        text/html:
          schema:
            type: string
            description: The list of comments, rendered into HTML on the server.


  parameters:

    contextType:
      name:        contextType
      in:          path
      description: |
        The type of item that a thread is associated with.

        Used in conjunction with contextId to find the item with which a thread
        is associated, and then to determine whether the authenticated user has
        permission to perform the requested action.

        Currently, only comms is supported, but it is intended that other
        contexts will be introduced.
      required:    true
      schema:
        type: string
        enum: [comms]

    contextId:
      name:        contextId
      in:          path
      description: |
        The unique ID of the item that a thread is associated with.

        Used in conjunction with contextType to find the item with which a
        thread is associated, and then to determine whether the authenticated
        user has permission to perform the requested action.
      required:    true
      schema:
        $ref: 'common.yaml#/components/schemas/id'

  examples:
    commentListEmpty:
      value:
        data: []
        metadata:
          cursor:
            current: bbb
            next: ccc

    commentListOne:
      value:
        # Frustratingly, sub-keys of example values don't follow $ref
        data:
          - id: 1
            thread:
              id: 2
              open: false
              created: 2019-01-01T00:00:00Z
              updated:
                database: 2019-01-01 00:00:00
                json: 2019-01-01T00:00:00Z
                local: 1 Jan 2019 12:00am
                unixTimestamp: 1546300800000
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>Some HTML content goes here</p>
            created: 2019-01-01T00:00:00Z
            updated:
              database: 2019-01-01 00:00:00
              json: 2019-01-01T00:00:00Z
              local: 1 Jan 2019 12:00am
              unixTimestamp: 1546300800000
            visibility:
              - staff
              - parent
              - student
        metadata:
          cursor:
            current: bbb
            next: ccc

    commentListMany:
      value:
        data:
          - id: 2
            thread:
              id: 1
              open: true
              created: 2019-01-01T00:00:00Z
              updated: 2019-01-01T00:00:00Z
            author:
              id: 1
              externalId: 2
              firstName: Schoolbox
              lastName: User
              _links:
                avatar: /profile?id=1
            content: <p>Some HTML content goes here</p>
            created:
              database: 2019-01-01 00:00:00
              json: 2019-01-01T00:00:00Z
              local: 1 Jan 2019 12:00am
              unixTimestamp: 1546300800000
            updated: 2019-01-01T00:00:00Z
            visibility:
              - staff
