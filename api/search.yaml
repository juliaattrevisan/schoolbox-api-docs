openapi: 3.0.2


info:
  title:       Schoolbox Search API
  description: |
    Schoolbox Search API
  x-api-id:    4514d761-b746-4f78-b69c-42fadb0763b2
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au


servers:
  - url: https://{hostname}.{domain}/
    variables:
      hostname:
        description: The subdomain of the school's domain name on which Schoolbox is hosted.
        default: demo
      domain:
        description: The school's domain name.
        default: schoolbox.com.au


paths:
  /search:
    get:
      operationId: search
      summary: Return search results for a query
      responses:
        '200':
          $ref: '#/components/responses/searchResultList'
        default:
          $ref: 'common.yaml#/components/responses/problem'
    parameters:
      - $ref: '#/components/parameters/query'


components:
  schemas:
    searchResult:
      title: Search result
      description: Fields for search results
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        author:
          allOf:
            - $ref: 'user.yaml#/components/schemas/user'
          nullable: true
        content:
          type: string
        created:
          $ref: 'common.yaml#/components/schemas/dateTime'
        updated:
          $ref: 'common.yaml#/components/schemas/dateTime'
      required:
        - id
        - content

    searchResultList:
      title: Search result list
      description: A list of search results
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/searchResult'
        metadata:
          $ref: 'common.yaml#/components/schemas/listMetadata'

  responses:
    searchResultList:
      description: a list of search results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/searchResultList'

  parameters:
    query:
      name:        q
      in:          query
      description: The term to search for
      schema:
        type: string
