openapi: 3.0.2


info:
  title:       Schoolbox Search API
  description: |
    Schoolbox Search API
  x-api-id:    4514d761-b746-4f78-b69c-42fadb0763b2
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au


servers:
  - url: https://{hostname}.{domain}/
    variables:
      hostname:
        description: The subdomain of the school's domain name on which Schoolbox is hosted.
        default: demo
      domain:
        description: The school's domain name.
        default: schoolbox.com.au


paths:
  /search:
    get:
      operationId: search
      summary: Return search results for a query
      responses:
        '200':
          $ref: '#/components/responses/searchResultList'
        default:
          $ref: 'common.yaml#/components/responses/problem'
    parameters:
      - $ref: '#/components/parameters/query'


components:
  schemas:
    searchResult:
      title: Search result
      description: Fields for search results
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        author:
          allOf:
            - $ref: 'user.yaml#/components/schemas/user'
          nullable: true
        content:
          type: string
        relevance:
          description: |
            The relevance of this result to the search query, from 0 to 1
          type: number
          minimum: 0
          maximum: 1
        created:
          $ref: 'common.yaml#/components/schemas/dateTime'
        updated:
          $ref: 'common.yaml#/components/schemas/dateTime'
      required:
        - id
        - content

    searchResultList:
      title: Search result list
      description: A list of search results
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/searchResult'
        metadata:
          $ref: 'common.yaml#/components/schemas/listMetadata'

    searchResultType:
      title: Search result type
      description: A type of search result. May be used as a filter
      readOnly: true
      type: string
      enum:
        - user
        - event
        - folder
        - assessment
        - comms
        - file

    searchResultUser:
      title: Search result - user
      description: A search result for a user
      readOnly: true
      allOf:
        - $ref: 'user.yaml#/components/schemas/user'

    searchResultEvent:
      title: Search result - event
      description: A search result for an event
      allOf:
        - $ref: 'event.yaml#/components/schemas/event'

    searchResultAssessment:
      title: Search result assessment
      description: An assessment found as part of a search.
      # TODO move this definition to its own place
      # TODO consider adding _links (for things like completion status)
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        publish:
          $ref: '#/components/schemas/searchResultDateTime'
        open:
          $ref: '#/components/schemas/searchResultDateTime'
        due:
          $ref: '#/components/schemas/searchResultDateTime'
        close:
          $ref: '#/components/schemas/searchResultDateTime'

    searchResultComms:
      title: Search result comms article
      description: An comms article found as part of a search.
      # TODO move this definition to its own place
      # TODO consider adding _links (for things like completion status)
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        blurb:
          type: string
        publish:
          $ref: '#/components/schemas/searchResultDateTime'
        archive:
          $ref: '#/components/schemas/searchResultDateTime'

    searchResultFolder:
      title: Search result folder
      description: |
        A folder found as part of a search.

        May contain sub-results
      # TODO move this definition to its own place
      # TODO consider adding _links (for things like completion status)
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        subResults:
          type: array

    searchResultDateTime:
      title: Search result date+time
      description: A search result's date, with a time component.
      type: string
      format: date-time

  responses:
    searchResultList:
      description: a list of search results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/searchResultList'

  parameters:
    query:
      name:        q
      in:          query
      description: The term to search for
      schema:
        type: string
