openapi: 3.0.2


info:
  title:       Schoolbox Search API
  description: |
    Schoolbox Search API
  x-api-id:    4514d761-b746-4f78-b69c-42fadb0763b2
  x-audience:  external-partner
  version:     1.0.0
  contact:
    name:  Schoolbox Team
    url:   https://schoolbox.com.au
    email: developers@schoolbox.com.au


servers:
  - url: https://{hostname}.{domain}/
    variables:
      hostname:
        description: The subdomain of the school's domain name on which Schoolbox is hosted.
        default: demo
      domain:
        description: The school's domain name.
        default: schoolbox.com.au


paths:
  /search:
    get:
      operationId: search
      summary: Return search results for a query
      responses:
        '200':
          $ref: '#/components/responses/searchResultList'
        default:
          $ref: 'common.yaml#/components/responses/problem'
    parameters:
      - $ref: '#/components/parameters/query'


components:
  schemas:
    searchResult:
      title: Search result
      description: Fields for search results
      type: object
      properties:
#        id:
#          $ref: 'common.yaml#/components/schemas/id'
        creator:
          description: |
            The creator of the content which yielded this search result
            (if known).
          nullable: true
          allOf:
            - $ref: 'user.yaml#/components/schemas/user'
        summary:
          description: A brief human-readable summary of the search result.
          type: string
        type:
          oneOf:
            - $ref: '#/components/schemas/searchResultType'
        content:
          oneOf:
            - $ref: '#/components/schemas/searchResultUser'
            - $ref: '#/components/schemas/searchResultEvent'
            - $ref: '#/components/schemas/searchResultFolder'
            - $ref: '#/components/schemas/searchResultComms'
          discriminator:
            propertyName: type
            mapping:
              user: '#/components/schemas/searchResultUser'
              event: '#/components/schemas/searchResultEvent'
              folder: '#/components/schemas/searchResultFolder'
              comms: '#/components/schemas/searchResultComms'
        relevance:
          description: |
            The relevance of this result to the search query, from 0 to 1
            (higher: more relevant).
          type: number
          minimum: 0
          maximum: 1
        date:
          description: |
            The date on which this content became viewable (if known).

            If the content is publishable as a separate step from being created,
            it will be a publish date: otherwise, it will be a creation date.

            (Since the search API itself will support a date range, this field
            needs to exist on all results. Different types of results may return
            different dates.)
          allOf:
            - $ref: 'common.yaml#/components/schemas/dateTime'
      required:
        - id
        - content

    searchResultList:
      title: Search result list
      description: A list of search results
      readOnly: true
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/searchResult'
        metadata:
          $ref: 'common.yaml#/components/schemas/listMetadata'

    searchResultType:
      title: Search result type
      description: A type of search result. May be used as a filter
      readOnly: true
      type: string
      enum:
        - user
        - event
        - folder
#        - assessment
        - comms
#        - file

    searchResultUser:
      title: Search result - user
      description: A search result for a user
      readOnly: true
      allOf:
        - $ref: 'user.yaml#/components/schemas/user'

    searchResultEvent:
      title: Search result - event
      description: A search result for an event
      allOf:
        - $ref: 'event.yaml#/components/schemas/event'

    searchResultAssessment:
      title: Search result assessment
      description: An assessment found as part of a search.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        publish:
          $ref: 'common.yaml#/components/schemas/dateTime'
        open:
          $ref: 'common.yaml#/components/schemas/dateTime'
        due:
          $ref: 'common.yaml#/components/schemas/dateTime'
        close:
          $ref: 'common.yaml#/components/schemas/dateTime'

    searchResultComms:
      title: Search result comms article
      description: |
        A comms article found as part of a search.

        The full content is not included: the summary of what matches will be
        included within the "summary" property of the match.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        publish:
          $ref: 'common.yaml#/components/schemas/dateTime'
        archive:
          $ref: 'common.yaml#/components/schemas/dateTime'

    searchResultTextbox:
      title: Search result text box
      description: |
        A text box found as part of a search.

        The full content is not included: the summary of what matches will be
        included within the "summary" property of the match.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string

    searchResultFile:
      title: Search result file
      description: A file found as part of a search.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        name:
          description: The file's filename
          type: string
        mimetype:
          description: The file's mimetype
          type: string
        size:
          description: The file's size, in bytes
          type: integer
          minimum: 0
        url:
          description: The URL from which the file may be downloaded.
          type: string
          format: uri-reference

    searchResultLink:
      title: Search result link
      description: A link found as part of a search.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        url:
          description: The URL to which this link points to.
          type: string
          format: uri-reference

    searchResultTile:
      title: Search result tile
      description: A tile found as part of a search.
      type: object
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        url:
          description: The URL to which this tile points to, if any.
          type: string
          format: uri-reference
          nullable: true
        backgroundImageUrl:
          description: The URL of this tile's background image, if any.
          type: string
          format: uri-reference
          nullable: true

    searchResultFolder:
      title: Search result folder
      description: |
        A folder found as part of a search.

        May contain sub-results.
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/id'
        title:
          type: string
        subResults:
          type: array
          items:
            $ref: '#/components/schemas/searchResultFolderSubResult'

    searchResultFolderSubResult:
      title: Search result folder sub-result
      description: |
        A result found within a folder as part of a search.

        Relevance isn't included within folder contents search results: the
        folder's relevance itself is what is considered relevant.
      type: object
      properties:
        type:
          oneOf:
            - $ref: '#/components/schemas/searchResultFolderSubResultType'
        summary:
          description: A brief human-readable summary of the search result.
          type: string
        content:
          oneOf:
            - $ref: '#/components/schemas/searchResultEvent'
            - $ref: '#/components/schemas/searchResultAssessment'
            - $ref: '#/components/schemas/searchResultComms'
            - $ref: '#/components/schemas/searchResultFile'
            - $ref: '#/components/schemas/searchResultTextbox'
            - $ref: '#/components/schemas/searchResultLink'
            - $ref: '#/components/schemas/searchResultTile'
          discriminator:
            propertyName: type
            mapping:
              event: '#/components/schemas/searchResultEvent'
              assessment: '#/components/schemas/searchResultAssessment'
              comms: '#/components/schemas/searchResultComms'
              file: '#/components/schemas/searchResultFile'
              textbox: '#/components/schemas/searchResultTextbox'
              link: '#/components/schemas/searchResultLink'
              tile: '#/components/schemas/searchResultTile'

    searchResultFolderSubResultType:
      title: Search result type
      description: |
        A type of search result within a folder.

        May be used as a filter as well.
      readOnly: true
      type: string
      enum:
        - event
        - assessment
        - comms
        - file
        - textbox
        - link
        - tile

    searchResultDateTime:
      title: Search result date+time
      description: A search result's date, with a time component.
      type: string
      format: date-time

  responses:
    searchResultList:
      description: a list of search results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/searchResultList'

  parameters:
    query:
      name:        q
      in:          query
      description: The term to search for
      schema:
        type: string
