# This toolsd container contains toolsd's code within its image, with the only
# local mounted filesystem being for its configuration.
# This container is intended for:
# * testing of deployments
# * development, when the developer does not need to modify toolsd's code

services:
  # HTTP API for posting jobs to, and querying their status.
  schoolbox-toolsd-api:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [src/main.py, api, -p, '8080']

  # The default Celery queue:
  # unless otherwise specified, jobs will be sent to this queue.
  schoolbox-toolsd-celery:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [src/main.py, worker, -Q, default, --tools-config, /conf/tools.yaml, --pools-config, /conf/pools.yaml, -vv]
    configs:
      - source: toolsd
        target: /conf/

  # An example Celery queue for UPS jobs.
  schoolbox-toolsd-celery-ups:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [src/main.py, worker, -Q, ups, --tools-config, /conf/tools.yaml, --pools-config, /conf/pools.yaml, -vv]
    configs:
      - source: toolsd
        target: /conf/

  # Flower is Celery's web-based monitoring tool.
  schoolbox-toolsd-flower:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    ports:
      - ${TOOLSD_FLOWER_PUBLISHED_PORT:-5555}:5555
    command: [src/main.py, flower]
