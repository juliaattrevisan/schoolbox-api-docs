# This toolsd container contains toolsd's code within its image, with the only
# local mounted filesystem being for its configuration.
# This container is intended for:
# * testing of deployments
# * development, when the developer does not need to modify toolsd's code

services:
  # HTTP API for posting jobs to, and querying their status.
  schoolbox-toolsd-api:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    environment:
      TOOLSD_API_KEY: ${TOOLSD_API_KEY:-}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [
      src/main.py, api,
      -p, '8080',
      --working-dir, /usr/share/schoolbox,
      --tools-config, library/Schoolbox/ToolsDaemon/conf/tools.yaml,
      --pools-config, library/Schoolbox/ToolsDaemon/conf/pools.yaml,
    ]
    volumes:
      - code:/usr/share/schoolbox
    configs:
      - source: toolsd
        target: /conf/

  # The default Celery queue:
  # unless otherwise specified, jobs will be sent to this queue.
  schoolbox-toolsd-celery:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-toolsd
      args:
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [
      src/main.py, worker,
      -Q, default,
      --working-dir, /usr/share/schoolbox,
      --tools-config, library/Schoolbox/ToolsDaemon/conf/tools.yaml,
      --pools-config, library/Schoolbox/ToolsDaemon/conf/pools.yaml,
      -vv,
    ]
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox
      - source: toolsd
        target: /conf/

