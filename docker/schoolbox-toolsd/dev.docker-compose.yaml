# This toolsd container references a code base somewhere on the file system,
# thus changes made to that container are made available immediately.
# This container is intended for development of toolsd.
# Note that the container will need to mount Schoolbox's code base as well,
# and be able to run PHP, in addition to Celery's content.
services:
  # HTTP API for posting jobs to, and querying their status.
  schoolbox-toolsd-api:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ../../toolsd
      dockerfile: schoolbox.Dockerfile
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [
      src/main.py, api,
      -p, '8080',
      --working-dir, /usr/share/schoolbox,
      --tools-config, library/Schoolbox/ToolsDaemon/conf/tools.yaml,
      --pools-config, library/Schoolbox/ToolsDaemon/conf/pools.yaml,
    ]
    volumes:
      - code:/usr/share/schoolbox
      - toolsd-code:/usr/src/app
    configs:
      - source: toolsd
        target: /conf/

  # The default Celery queue:
  # unless otherwise specified, jobs will be sent to this queue.
  schoolbox-toolsd-celery:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ../../toolsd
      dockerfile: schoolbox.Dockerfile
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [
      src/main.py, worker,
      -Q, default,
      --working-dir, /usr/share/schoolbox,
      --tools-config, library/Schoolbox/ToolsDaemon/conf/tools.yaml,
      --pools-config, library/Schoolbox/ToolsDaemon/conf/pools.yaml,
      -vv,
    ]
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
      - toolsd-code:/usr/src/app
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox
      - source: toolsd
        target: /conf/

  # An example Celery queue for UPS jobs.
  schoolbox-toolsd-celery-ups:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ../../toolsd
      dockerfile: schoolbox.Dockerfile
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    command: [
      src/main.py, worker,
      -Q, ups,
      --working-dir, /usr/share/schoolbox,
      --tools-config, library/Schoolbox/ToolsDaemon/conf/tools.yaml,
      --pools-config, library/Schoolbox/ToolsDaemon/conf/pools.yaml,
      -vv,
    ]
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
      - toolsd-code:/usr/src/app
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox
      - source: toolsd
        target: /conf/

  # Flower is Celery's web-based monitoring tool.
  schoolbox-toolsd-flower:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ../../toolsd
      dockerfile: schoolbox.Dockerfile
    env_file:
      - path: ./schoolbox-toolsd/default.env
        required: true
      - path: ./../docker-toolsd.env
        required: false
    ports:
      - ${TOOLSD_FLOWER_PUBLISHED_PORT:-5555}:5555
    command: [src/main.py, flower]
    volumes:
      - toolsd-code:/usr/src/app

# Also mount toolsd's code, so that changes are available without rebuilding
volumes:
  toolsd-code:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../toolsd
