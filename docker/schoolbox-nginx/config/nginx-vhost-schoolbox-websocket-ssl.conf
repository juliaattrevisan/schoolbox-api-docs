server {
    listen       443 ssl http2;

    # TODO this can't just serve a single instance
    server_name  docker.dev.schoolbox.cloud;

    # TODO re-enable SSL certs
#    ssl_certificate      /etc/nginx/certs/schoolbox-docker_dev-fullchain.crt;
#    ssl_certificate_key  /etc/nginx/certs/schoolbox-docker_dev-private.key;
#    ssl_trusted_certificate /etc/nginx/certs/schoolbox-docker_dev-intermediate.crt;
#    include      ssl.conf;

    keepalive_timeout    1800;

    # Advise browsers that all pages should only be accessed via HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prohibits browser from mime-sniffing (inferring content-type)
    # Avoids XSS attacks
    add_header X-Content-Type-Options "nosniff" always;


    # Force redirects if not on primary domain
    if ($host != $server_name) {
        return 301 https://$server_name$request_uri;
    }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
        return 444;
    }
    # allow access to external apis, and CORS preflight from `api.schoolbox.com.au`
    # Advise the browser to allow requesting code from any origin to access the resource
    add_header "Access-Control-Allow-Origin" *;

    # Allow fail-whale image and icon
    location /static/images/core/fail-whale.png {
        proxy_pass https://schoolbox-static.cloud/images/core/fail-whale.png;
    }
    location /static/images/core/icons/fail-whale-16x16.png {
        proxy_pass https://schoolbox-static.cloud/images/core/icons/fail-whale-16x16.png;
    }

    location /awstats {
        root /var;
        index awstats.awstats.conf.html;
        auth_request     /private/auth;
        auth_request_set $auth_status $upstream_status;
    }
    location /awstats-icon/ {
        root /var;
    }

    location /favicon.ico {
        root /usr/share/schoolbox/www;
        rewrite ^/(.*)$ /images/logo.php?logo=skin_logo_square&size=favicon last;
    }

    # Setup xhprof for debugging, only works if module is installed on server
    location /debugbar {
        alias /usr/share/schoolbox/vendor/maximebf/debugbar/src/DebugBar/Resources;
    }
    location /xhprof_html {
         root /usr/share/schoolbox/vendor/lox/xhprof;
         index index.php;
         location ~ \.php$ {
             try_files $uri =404;
             fastcgi_pass 127.0.0.1:9000;
             fastcgi_index index.php;
             fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
             fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
             include fastcgi_params;
         }
    }

    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # Error response handling
    recursive_error_pages on;

    # 502 responses
    error_page 502 @502;
    location @502 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/502-bad-gateway.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/502-bad-gateway.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 503 responses
    error_page 503 @503;
    location @503 {
        # Capture POST requests here too (POSTing to static files trigger a 405)
        error_page 405 = /templates/core/error/503-maintenance.html;
        if (-f /usr/share/schoolbox/.maintenance) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/503-maintenance.html break;
        }

        # Else fall back to default 50x page
        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 504 responses
    error_page 504 @504;
    location @504 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/504-gateway-timeout.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/504-gateway-timeout.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 500 responses
    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page 500 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 429 responses
    error_page 429 @429;
    location @429 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/429-rate-limit.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/429-rate-limit.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

#    location /websocket {
#        keepalive_timeout 1800;
#        proxy_pass http://websocks;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header Host $host;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_http_version 1.1;
#        proxy_set_header Upgrade $http_upgrade;
#        proxy_set_header Connection "upgrade";
#    }

    location /pad {
        rewrite          /pad/(.*) /$1 break;
        rewrite          ^/pad$ /pad/ permanent;
        proxy_pass       http://schoolbox-etherpad:9001/;
        proxy_redirect   / /pad/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering  off;
    }

    location = /private/auth {
        internal;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass_request_body off;
        fastcgi_param X-Original-URI $request_uri;
        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/www/private/auth.php;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }

    # No separate handling for image access within the container:
    # instead, different container pools will handle container requests
#    location ~ (portrait|videoThumb|cms/(image|myImage)|images/(fail|icon|logo)|(socialstream|storage)/image)\.php$ {
#        access_log   /var/log/nginx/schoolbox-images_access.log  full;
#        root /usr/share/schoolbox/www;
#        fastcgi_pass 127.0.0.1:9002;
#        fastcgi_index index.php;
#        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/www$fastcgi_script_name;
#        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
#        include fastcgi_params;
#    }

    location ~ ^/static/ {
        root "/usr/share/schoolbox/www";
    }

    location / {
        limit_req zone=web burst=300 nodelay;
        limit_req_status 429;
        root /usr/share/schoolbox/www;
        rewrite ^/login.php$ $scheme://$host permanent;
        rewrite ^.* /index.php break;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 1800;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}
server {
    listen       443 ssl http2;

    # TODO this can't just serve a single instance
    # Alternately, the DAV server could just be removed
    server_name  docker-dav.dev.schoolbox.cloud;

#    ssl_certificate      /etc/nginx/certs/schoolbox-docker_dev-fullchain.crt;
#    ssl_certificate_key  /etc/nginx/certs/schoolbox-docker_dev-private.key;
#    ssl_trusted_certificate /etc/nginx/certs/schoolbox-docker_dev-intermediate.crt;
#    include      ssl.conf;

    keepalive_timeout    1800;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /usr/share/schoolbox/dav;
        rewrite ^(.*) /index.php/$1 break;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/dav$fastcgi_script_name;
        include fastcgi_params;
    }

    # redirect server 404 error;
    error_page   404 /index.php?page=common/404;

    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
