upstream websocks {
    ip_hash;
    server 127.0.0.1:9081;
}

server {
    listen       80;
    server_name  docker.dev.schoolbox.cloud;

#    access_log /var/log/nginx/schoolbox_access.log full;
#    error_log  /var/log/nginx/schoolbox_error.log error;

    keepalive_timeout    1800;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$ ) {
        return 444;
    }

    # TODO only required if using LE to provision certs
    location /.well-known/ {
        # respond 200 if /.well-known/ping is requested
        if ($request_filename = $document_root/.well-known/acme-challenge/ping) {
            add_header Content-Type text/plain;
            return 200 "port 80 accessible from your location\n";
        }
        root /usr/share/schoolbox/www;
    }

    location / {
        # redirect anything not handled here over to https
        rewrite ^(.*) https://$host$1;
    }
}

