# This schoolbox-cli container image has been prebuilt: this should be used
# unless the pull request being made changes the container's image definition.

# The schoolbox-cli container is intended for running command-line processes:
# * command-line tools
# * updates
# * cron tasks, via the service's overridden command
#
# Basically, anything which we haven't yet figured out how to migrate into its
# own container will go here for now.

services:
  schoolbox-cli:
    pull_policy: always
    command: cron -f -L 15
    restart: always
    image: ${SCHOOLBOX_CLI_IMAGE}
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_CREDENTIAL_EXPIRATION: ${AWS_CREDENTIAL_EXPIRATION:-}
      INSTANCE_ID: ${INSTANCE_ID:-docker}
      HOST_TYPE: docker
      XDEBUG_CONFIG: "idekey=PHPSTORM"
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      SYNERGETIC_PASSWORD_ENCRYPTION_KEY: ${SYNERGETIC_PASSWORD_ENCRYPTION_KEY:-}
      SYNERGETIC_PASSWORD_ENCRYPTION_IV: ${SYNERGETIC_PASSWORD_ENCRYPTION_IV:-}
    tty: true
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
      - caddy-ssl:/etc/nginx/certs/
      - aws-config:/root/.aws
    # Add host.docker.internal as an alias back to the host machine, so that
    # the host can debug
    extra_hosts:
      - host.docker.internal:host-gateway
    # After building: create data dirs, start cron
    post_start:
      - command: /usr/share/schoolbox/tools/create-data-dirs.sh /var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/
        user: root
      - command: /usr/share/schoolbox/tools/create-data-dirs.sh /var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/
        user: root
      - command: /usr/share/schoolbox/tools/set-data-dir-perms.sh /var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/ www-data
        user: root
      - command: /usr/share/schoolbox/tools/set-data-dir-perms.sh /var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/ www-data
        user: root
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox
