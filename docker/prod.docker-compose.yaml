# docker-compose.yaml for testing of the production image, which has been built
# by Github Actions and pushed to Dockerhub.

include:
  - base.docker-compose.yaml

services:


  # Load-balanced nginx+PHP-FPM containers:
  # regrettably copy-pasted for now
  schoolbox-fpm-nginx-1:
    container_name: schoolbox-fpm-nginx-1
    restart: always
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    image: alaress/schoolbox-fpm-nginx:develop-latest
    volumes:
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
    # After building: create data dirs, and make mount writable by www-data
    # Cannot currently use create-data-dirs.sh, as /bin/bash isn't available,
    # and /bin/sh doesn't support {} expansion
    # Also: set server_name and trigger nginx reload if possible?
    post_start:
      - command: mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command: mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command: mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command: mkdir -p /var/lib/schoolbox/docker/files
      - command: mkdir -p /var/lib/schoolbox/docker/purifier
      - command: mkdir -p /var/lib/schoolbox/docker/twig
      - command: chown -R www-data:www-data /var/lib/schoolbox/docker/
      - command: echo "server_name schoolbox-fpm-nginx-1" > /etc/nginx/sites-enabled/schoolbox.d/server_name.conf
      - command: nginx -s reload

  schoolbox-fpm-nginx-2:
    container_name: schoolbox-fpm-nginx-2
    restart: always
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    image: alaress/schoolbox-fpm-nginx:develop-latest
    volumes:
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
    post_start:
      - command: mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command: mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command: mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command: mkdir -p /var/lib/schoolbox/docker/files
      - command: mkdir -p /var/lib/schoolbox/docker/purifier
      - command: mkdir -p /var/lib/schoolbox/docker/twig
      - command: chown -R www-data:www-data /var/lib/schoolbox/docker/
      - command: echo "server_name schoolbox-fpm-nginx-2" > /etc/nginx/sites-enabled/schoolbox.d/server_name.conf
      - command: nginx -s reload
