# docker-compose.yaml for testing of the production image, which has been built
# by Github Actions and pushed to Dockerhub.

include:
  - base.docker-compose.yaml

services:
  # Load-balanced FrankenPHP containers:
  schoolbox-frankenphp:
    restart: always
    depends_on:
      - mariadb
      - rabbitmq
      - redis-cache
      - redis-storage
    image: alaress/schoolbox-frankenphp:develop-latest
    volumes:
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
    scale: 2
    deploy:
      mode: replicated
      replicas: 2
    # After building: create data dirs, and make mount writable by www-data
    post_start:
      - command: /usr/share/schoolbox/tools/create-data-dirs.sh /var/lib/schoolbox/docker/
      - command: /usr/share/schoolbox/tools/set-data-dir-perms.sh /var/lib/schoolbox/docker/ www-data
