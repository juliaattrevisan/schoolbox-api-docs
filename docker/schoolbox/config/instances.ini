[vagrantx]
;hostnames[]  = 'vagrant.localhost'
hostnames[]  = 'docker.dev.schoolbox.cloud'
hostnames[]  = 'docker-dav.dev.schoolbox.cloud'
db_host      = 'mariadb'
db_host_read = 'mariadb'
db_schema    = 'schoolbox'

# Set to root for now, as the non-root user+pwd returns a connection error:
# `cannot connect to 'schoolboxdocker'@'x.x.x.x' instead of @'mariadb'`
# Probably something to do with network settings?
db_user      = 'root'
db_pass      = ''
