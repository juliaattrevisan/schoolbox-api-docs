# docker-compose.yaml for local development.
# Its nginx container mounts Schoolbox's code folder as a local mount,
# so that changes made locally are made available immediately.

include:
  - base.docker-compose.yaml

services:
  # Base image: only needs to be built, not started
  php82-alpine:
    image: php82-alpine
    build:
      context: ./base-images/php82-alpine
      args:
        ENV: dev
    restart: no

  # nginx+PHP-FPM container
  schoolbox-nginx:
    container_name: schoolbox-nginx
    depends_on:
      - php82-alpine
    environment:
      DEBUG: "1"
    restart: always
    build:
      context: ./schoolbox-nginx
      dockerfile: dev-image.Dockerfile
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-nginx-config:/etc/nginx/sites-enabled
      - schoolbox-config:/etc/schoolbox
    # After building: create data dirs, and make mount writable by www-data
    # Cannot currently use create-data-dirs.sh, as /bin/bash isn't available,
    # and /bin/sh doesn't support {} expansion
    post_start:
      - command: mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command: mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command: mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command: mkdir -p /var/lib/schoolbox/docker/files
      - command: mkdir -p /var/lib/schoolbox/docker/purifier
      - command: mkdir -p /var/lib/schoolbox/docker/twig
      - command: chown -R www-data:www-data /var/lib/schoolbox/docker/

volumes:
  schoolbox-nginx-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./schoolbox-nginx/config
