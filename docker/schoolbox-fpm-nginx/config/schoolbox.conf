server {
    # Listen to port 80 on any server
    listen 80 http2;

    # Setting a server_name is required in order for debugging to work:
    # however, this is not always going to be the server name?
    include sites-enabled/schoolbox.d/server_name.conf;
    #server_name schoolbox-nginx.docker.localhost;

    keepalive_timeout    1800;

    # Advise browsers that all pages should only be accessed via HTTPS
    # (SSL is terminated upstream)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prohibits browser from mime-sniffing (inferring content-type)
    # Avoids XSS attacks
    add_header X-Content-Type-Options "nosniff" always;

    # Force redirects if not on primary domain?
    # (This is configurable by instance, so may need to be handled in code)
#    if ($host != $server_name) {
#        return 301 https://$server_name$request_uri;
#    }

    # Do not respond to non-accepted request methods
    # (appears to be handled upstream)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
        return 444;
    }

    # allow access to external apis, and CORS preflight from `api.schoolbox.com.au`
    # Advise the browser to allow requesting code from any origin to access the resource
    add_header "Access-Control-Allow-Origin" *;

    # AWStats: should this be handled by this container?
    # I'm guessing not, because it's unknown which container will handle the
    # request, and thus stats returned will not be reliable.
#    location /awstats {
#        root /var;
#        index awstats.awstats.conf.html;
#        auth_request     /private/auth;
#        auth_request_set $auth_status $upstream_status;
#    }
#    location /awstats-icon/ {
#        root /var;
#    }

    # Handle favicon
    location /favicon.ico {
        root /usr/share/schoolbox/www;
        rewrite ^/(.*)$ /images/logo.php?logo=skin_logo_square&size=favicon last;
    }

    # Setup xhprof for debugging, only works if module is installed on server
    location /debugbar {
        alias /usr/share/schoolbox/vendor/maximebf/debugbar/src/DebugBar/Resources;
    }
    location /xhprof_html {
         root /usr/share/schoolbox/vendor/lox/xhprof;
         index index.php;
         location ~ \.php$ {
             try_files $uri =404;
             fastcgi_pass unix:/var/run/php-fpm.sock;
             fastcgi_index index.php;
             fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
             fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
             include fastcgi_params;
         }
    }

    # Error response handling
    error_page 404 /index.php?page=common/404;
    recursive_error_pages on;

    # 502 responses
    error_page 502 @502;
    location @502 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/502-bad-gateway.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/502-bad-gateway.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 503 responses
    error_page 503 @503;
    location @503 {
        # Capture POST requests here too (POSTing to static files trigger a 405)
        error_page 405 = /templates/core/error/503-maintenance.html;
        if (-f /usr/share/schoolbox/.maintenance) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/503-maintenance.html break;
        }

        # Else fall back to default 50x page
        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 504 responses
    error_page 504 @504;
    location @504 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/504-gateway-timeout.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/504-gateway-timeout.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    # 500 responses
    # redirect server error pages to the static page /50x.html
    # TODO - specify a custom Schoolbox 50x error page
    error_page 500 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 429 responses
    error_page 429 @429;
    location @429 {
        # Does the error template exist?
        # Show it if so, otherwise fall back to the default 50x page
        if (-f /usr/share/schoolbox/templates/core/error/429-rate-limit.html) {
            root    /usr/share/schoolbox;
            rewrite ^(.*)$ /templates/core/error/429-rate-limit.html break;
        }

        root   /usr/share/nginx/html;
        rewrite ^(.*)$ /50x.html break;
    }

    location = /private/auth {
        internal;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_pass_request_body off;
        fastcgi_param X-Original-URI $request_uri;
        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/www/private/auth.php;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        include fastcgi_params;
    }

    location ~ ^/static/ {
        root "/usr/share/schoolbox/www";
    }

    location / {
        #limit_req zone=web burst=300 nodelay;
        limit_req_status 429;
        root /usr/share/schoolbox/www;
        rewrite ^/login.php$ $scheme://$host permanent;
        rewrite ^.* /index.php break;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /usr/share/schoolbox/www$fastcgi_script_name;
        fastcgi_param SCRIPT_URI $scheme://$http_host:$server_port$request_uri;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 1800;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}

