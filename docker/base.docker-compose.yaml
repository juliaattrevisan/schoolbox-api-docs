# Base docker-compose.yaml for local running of a containerised Schoolbox
# environment.
#
# This definition isn't itself enough to run the Schoolbox environment:
# it must be combined with a docker-compose which defines:
# * schoolbox-frankenphp
# * schoolbox-taskd

services:
  # Base image: only needs to be built, not started
  # By default, build with ENV=dev
  php-bookworm:
    image: php-bookworm
    build:
      context: ./base-images/php-bookworm
      args:
        ENV: ${ENV:-dev}
        PHP_MAJOR_VERSION: ${PHP_MAJOR_VERSION}
    restart: no

  # Frontend web server, mimicking a load balancer and SSL termination endpoint.
  # In the dev environment, forwards requests to one of these containers:
  # * schoolbox-frankenphp-1
  # * schoolbox-frankenphp-2
  caddy:
    container_name: caddy
    restart: always
    build:
      context: ./caddy
    volumes:
      - caddy-config:/etc/caddy
      - caddy-ssl:/etc/nginx/certs/
    ports:
      - '80:80'
      - '443:443'
    # Make this host available across the network as docker.dev.schoolbox.cloud
    networks:
      default:
        aliases:
          - docker.dev.schoolbox.cloud

  # Image intended for running command-line processes:
  # * command-line tools
  # * updates
  # * cron tasks
  #
  # Basically, anything which we haven't yet figured out how to migrate into its
  # own container will go here for now.
  schoolbox-cli:
    depends_on:
      - php-bookworm
    container_name: schoolbox-cli
    pull_policy: never
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_CREDENTIAL_EXPIRATION: ${AWS_CREDENTIAL_EXPIRATION}
      INSTANCE_ID: ${INSTANCE_ID}
      HOST_TYPE: docker
      XDEBUG_CONFIG: "idekey=PHPSTORM"
    build:
      context: ./schoolbox-cli
    tty: true
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox
      - caddy-ssl:/etc/nginx/certs/
      - aws-config:/root/.aws
    # After building: create data dirs, start cron
    post_start:
      - command : mkdir -p /var/lib/schoolbox/docker/cache/portrait
      - command : mkdir -p /var/lib/schoolbox/docker/cache/stream
      - command : mkdir -p /var/lib/schoolbox/docker/cache/zip
      - command : mkdir -p /var/lib/schoolbox/docker/files
      - command : mkdir -p /var/lib/schoolbox/docker/purifier
      - command : mkdir -p /var/lib/schoolbox/docker/twig
      - command : sudo /etc/init.d/cron start

  # Database services:
  # these are containers only in a development environment, they won't be on
  # staging or production envs.
  mariadb:
    container_name: mariadb
    image: mariadb:10.6
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1

  redis-storage:
    container_name: redis-storage
    image: redis:6.0
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redis-storage-config:/usr/local/etc/redis
      - redis-storage-data:/data

  redis-cache:
    container_name: redis-cache
    image: redis:6.0
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redis-cache-config:/usr/local/etc/redis
      - redis-cache-data:/data

  rabbitmq:
    container_name: rabbitmq
    build:
      context: ./rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Not-yet-essential services:
  # These will be implemented as separate containers (if they aren't already).
  schoolbox-digestd:
    container_name: schoolbox-digestd
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
      php-bookworm:
        condition: service_started
    build:
      context: ./schoolbox-digestd
    env_file: ./schoolbox/default-instance.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-scheduled:
    container_name: schoolbox-scheduled
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
      php-bookworm:
        condition: service_started
    build:
      context: ./schoolbox-scheduled
    env_file: ./schoolbox/default-instance.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-mobiled:
    container_name: schoolbox-mobiled
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
      php-bookworm:
        condition: service_started
    build:
      context: ./schoolbox-mobiled
    env_file: ./schoolbox/default-instance.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-socketd:
    container_name: schoolbox-socketd
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
      php-bookworm:
        condition: service_started
    build:
      context: ./schoolbox-socketd
    env_file: ./schoolbox/default-instance.env
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/docker/storage
      - schoolbox-config:/etc/schoolbox

  schoolbox-taskd:
    container_name: schoolbox-taskd
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-taskd
    env_file:
      - path: ./schoolbox-taskd/default.env
        required: true

  schoolbox-gotenberg:
    container_name: schoolbox-gotenberg
    image: gotenberg/gotenberg:8

  schoolbox-etherpad:
    container_name: schoolbox-etherpad
    depends_on:
      redis-storage:
        condition: service_healthy
    image: schoolbox/epl:latest
    env_file: ./schoolbox-etherpad/default.env

  clamav:
    container_name: clamav
    build:
      context: ./clamav
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  # Volume for Schoolbox's code base
  code:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../

  # Volume for database data:
  # mounted outside of filesystem
  mariadb-data:

  redis-storage-data:

  redis-cache-data:

  rabbitmq-data:

  # Volume for storage
  storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/docker/storage

  # Volumes for config
  schoolbox-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./schoolbox/config

  caddy-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./caddy/config

  caddy-ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/docker/ssl

  redis-storage-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis-storage/config

  redis-cache-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis-cache/config

  aws-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../.aws

  # Volume for ClamAV signatures
  clamav-data:
