# Base docker-compose.yaml for local running of a containerised Schoolbox
# environment.
#
# This definition isn't itself enough to run the Schoolbox environment:
# it must be combined with a docker-compose which defines:
# * schoolbox-frankenphp
# * schoolbox-taskd
# * schoolbox-cli

services:
  # Frontend web server, mimicking a load balancer and SSL termination endpoint.
  # In the dev environment, forwards requests to a `schoolbox-frankenphp`
  # container.
  caddy:
    restart: always
    build:
      context: ./caddy
    volumes:
      - caddy-ssl:/etc/nginx/certs/
    ports:
      - "${HTTP_PUBLISHED_PORT}:80"
      - "${HTTPS_PUBLISHED_PORT}:443"
    # Make this host available across the network as each instance hostname
    networks:
      default:
        aliases:
          - ${PRIMARY_INSTANCE_HOSTNAME}
          - ${SECONDARY_INSTANCE_HOSTNAME}
    configs:
      - source: caddy
        target: /etc/caddy/

  # Database services:
  # these are containers only in a development environment, they won't be on
  # staging or production envs.
  mariadb:
    build:
      context: ./mariadb
      args:
        MARIADB_MAJOR_VERSION : ${MARIADB_MAJOR_VERSION}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${MARIADB_PUBLISHED_PORT}:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1

  redis-storage:
    build:
      context: ./redis-storage
      args:
        REDIS_MAJOR_VERSION : ${REDIS_MAJOR_VERSION}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redis-storage-data:/data
    ports:
      - "${REDIS_STORAGE_PUBLISHED_PORT}:6379"

  redis-cache:
    build:
      context: ./redis-cache
      args:
        REDIS_MAJOR_VERSION : ${REDIS_MAJOR_VERSION}
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redis-cache-data:/data
    ports:
      - "${REDIS_CACHE_PUBLISHED_PORT}:6379"

  rabbitmq:
    build:
      context: ./rabbitmq
      args:
        RABBITMQ_MAJOR_VERSION : ${RABBITMQ_MAJOR_VERSION}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PUBLISHED_PORT}:15672"

  # Not-yet-essential services:
  # These will be implemented as separate containers (if they aren't already).
  schoolbox-digestd:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${PRIMARY_INSTANCE_ID}
    build:
      context: ./schoolbox-digestd
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
        BASE_BRANCH: ${BASE_BRANCH}
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  schoolbox-scheduled:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${PRIMARY_INSTANCE_ID}
    build:
      context: ./schoolbox-scheduled
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
        BASE_BRANCH: ${BASE_BRANCH}
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  schoolbox-mobiled:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${PRIMARY_INSTANCE_ID}
    build:
      context: ./schoolbox-mobiled
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
        BASE_BRANCH: ${BASE_BRANCH}
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  # Second instance's notif daemons:
  # These are the same as above, but use the second instance ID instead.
  schoolbox2-digestd:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${SECONDARY_INSTANCE_ID}
    build:
      context: ./schoolbox-digestd
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    volumes:
      - code:/usr/share/schoolbox
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - second-instance
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  schoolbox2-scheduled:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${SECONDARY_INSTANCE_ID}
    build:
      context: ./schoolbox-scheduled
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    volumes:
      - code:/usr/share/schoolbox
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - second-instance
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  schoolbox2-mobiled:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${SECONDARY_INSTANCE_ID}
    build:
      context: ./schoolbox-mobiled
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
    volumes:
      - code:/usr/share/schoolbox
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - second-instance
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  schoolbox-socketd:
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-storage:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=${PHPSTORM_SERVER_NAME}"
      INSTANCE_ID: ${PRIMARY_INSTANCE_ID}
    build:
      context: ./schoolbox-socketd
      args:
        BASE_PHP_IMAGE: ${BASE_PHP_IMAGE}
        PRIVATE_CONTAINER_REGISTRY: ${PRIVATE_CONTAINER_REGISTRY}
        BASE_BRANCH: ${BASE_BRANCH}
    volumes:
      - code:/usr/share/schoolbox
      - storage:/var/lib/schoolbox/${PRIMARY_INSTANCE_ID}/storage
      - storage2:/var/lib/schoolbox/${SECONDARY_INSTANCE_ID}/storage
    extra_hosts:
      - host.docker.internal:host-gateway
    configs:
      - source: frankenphp-php
        target: /usr/local/etc/php/conf.d/01-base-settings.ini
      - source: frankenphp-php-env
        target: /usr/local/etc/php/conf.d/02-env-settings.ini
      - source: schoolbox-cli-php
        target: /usr/local/etc/php/conf.d/03-cli-settings.ini
      - source: schoolbox
        target: /etc/schoolbox

  # This has the devkit mounted
  devkit-lti1p3-nginx:
    depends_on:
      redis-cache:
        condition: service_healthy
    build:
      context: ./devkit-lti1p3-nginx
    ports:
      - "${LTI_DEVKIT_PUBLISHED_PORT}:80"
    volumes:
      - ../../devkit-lti1p3:/var/www/html
      - ./devkit-lti1p3-nginx/config/nginx.conf:/etc/nginx/conf.d/default.conf
    # Make this host available across the network as LTI_DEVKIT_HOSTNAME
    networks:
      default:
        aliases:
          - ${LTI_DEVKIT_HOSTNAME}
    profiles:
      - lti

  devkit-lti1p3-phpfpm:
    depends_on:
      redis-cache:
        condition: service_healthy
    build:
      context: ./devkit-lti1p3-phpfpm
    env_file:
      - path: ./devkit-lti1p3-phpfpm/.env
#        required: true
    volumes:
      - ../../devkit-lti1p3:/var/www/html
    working_dir: /var/www/html
    profiles:
      - lti
    post_start:
      # Install Composer dependencies:
      # first without plugins to clear old dependencies, then standard install
      - command: composer install --no-plugins --no-scripts;
      - command: composer install -o
    # Add host.docker.internal as an alias back to the host machine, so that
    # the host can debug
    extra_hosts:
      - host.docker.internal:host-gateway

  schoolbox-gotenberg:
    image: gotenberg/gotenberg:8

  schoolbox-etherpad:
    depends_on:
      redis-storage:
        condition: service_healthy
    build:
      context: ./schoolbox-etherpad
      args:
        ETHERPAD_MAJOR_VERSION : ${ETHERPAD_MAJOR_VERSION}
    env_file: ./schoolbox-etherpad/default.env

  presidio-analyzer:
    build:
      context: ./presidio-analyzer

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer

  clamav:
    build:
      context: ./clamav
    volumes:
      - clamav-data:/var/lib/clamav

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "${MAILCATCHER_UI_PUBLISHED_PORT}:1080"
    restart: always
    networks:
      default:
        aliases:
          - mailcatcher.localhost

volumes:
  # Volume for Schoolbox's code base
  code:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../

  # Volume for database data:
  # mounted outside of filesystem
  mariadb-data:

  redis-storage-data:

  redis-cache-data:

  rabbitmq-data:

  # Volume for storage
  storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/${PRIMARY_INSTANCE_ID}/storage

  storage2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/${SECONDARY_INSTANCE_ID}/storage

  # Should Caddy's SSL certificate be set elsewhere?
  caddy-ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../data/${PRIMARY_INSTANCE_ID}/ssl

  aws-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../.aws

  # Volume for ClamAV signatures
  clamav-data:

# Configs may be folders, but if they are they will override existing contents:
# thus, PHP configs must be single files.
# Config files are read from the argument to `--with-config-file-scan-dir`,
# but this is provided at compile time: it can only be configured as an env.
configs:
  caddy:
    file: ./caddy/config/
  schoolbox:
    # Cron config should be built in docker/up, and timezone should come from
    # docker.env or from host:
    # readlink /etc/localtime | sed 's/\/usr\/share\/zoneinfo\///'
    file: ./schoolbox/config
  frankenphp-caddy:
    file: ./base-images/php-frankenphp/config/frankenphp/
  frankenphp-php:
    file: ./base-images/php-frankenphp/config/php/01-base-settings.ini
  frankenphp-php-env:
    file: ./base-images/php-frankenphp/config/php/${ENV}/02-env-settings.ini
  schoolbox-cli-php:
    file: ./schoolbox-cli/config/php/03-cli-settings.ini
