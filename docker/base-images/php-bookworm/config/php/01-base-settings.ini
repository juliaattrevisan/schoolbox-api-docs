[PHP]

display_startup_errors = <% if @display_startup_errors %>on<% else %>off<% end %>
display_errors = <% if @display_errors %>on<% else %>off<% end %>
html_errors = <% if @html_errors %>on<% else %>off<% end %>
log_errors = on
auto_detect_line_endings = on
docref_root = 0
docref_ext = 0
upload_max_filesize = 2048M
post_max_size = 2048M
expose_php = off
;error_log = /var/log/php-fpm/schoolbox_php_error.log
memory_limit = 1024M
;sys_temp_dir = <%= @php_tmp_dir %>
max_execution_time = 600
max_input_vars = 6000
opcache.validate_timestamps = '<% if @opcache_validate_timestamps %>1<% else %>0<% end %>'
