[PHP]
display_startup_errors = off
display_errors = off
html_errors = off
log_errors = on
;auto_detect_line_endings = on
docref_root = 0
docref_ext = 0
upload_max_filesize = 2048M
post_max_size = 2048M
expose_php = off
;error_log = /var/log/php-fpm/schoolbox_php_error.log
memory_limit = 1024M
;sys_temp_dir = <%= @php_tmp_dir %>
max_execution_time = 300
max_input_vars = 6000
error_reporting = E_ALL & ~E_NOTICE

[opcache]
opcache.validate_timestamps = off

[session]
;session.use_trans_sid = on
session.gc_maxlifetime = 86400
session.cookie_httponly = on
session.cookie_secure = on
session.save_handler = redis
session.serialize_handler = php_serialize

[xdebug]
xdebug.mode=debug
xdebug.var_display_max_data=256
xdebug.var_display_max_depth=2
xdebug.start_with_request=trigger
; host.docker.internal is also supposed to point to the host machine, but only
; on Docker Desktop:
; I've set up the alias manually in other places.
xdebug.client_host=host.docker.internal
