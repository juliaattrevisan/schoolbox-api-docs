[PHP]
display_startup_errors = off
display_errors = off
html_errors = off
log_errors = on
;auto_detect_line_endings = on
docref_root = 0
docref_ext = 0
upload_max_filesize = 2048M
post_max_size = 2048M
expose_php = off
;error_log = /var/log/php-fpm/schoolbox_php_error.log
memory_limit = 1024M
;sys_temp_dir = <%= @php_tmp_dir %>
max_execution_time = 300
max_input_vars = 6000

[opcache]
opcache.validate_timestamps = off
