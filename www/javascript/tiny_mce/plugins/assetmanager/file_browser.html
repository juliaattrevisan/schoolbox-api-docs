<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>{#assetmanager.title}</title>
<link rel="stylesheet" type="text/css" href="css/screen.css" media="screen" />
<link rel="stylesheet" type="text/css" href="css/tree.css" media="screen" />
<script type="text/javascript" src="../../tiny_mce_popup.js"></script>
<script type="text/javascript" src="/javascript/jquery.js"></script>
<script type="text/javascript" src="/javascript/jquery.tree.js"></script>
<style type="text/css">
span.file {
	white-space: nowrap;
}
</style>
<script type="text/javascript">
$(function () {
	/* setup tree */
	$('#tree').tree({
		dragDrop 	: false,
		stripeRows 	: false,
		sequencing	: false,
		label		: 'span.file',
		template	: 'li.dir-template:first'
	});

	/* triggered after a new branch is loaded */
	$('#tree').bind('loaded', function () {
		var table = $(this), scroller = $('div.left');

		/* fix left panel width */
		var scrollerWidth = parseInt(scroller.width()) - 1;
		if (table.height() > scroller.height())
			scrollerWidth -= 16; // scroller width

		if (table.width() < scrollerWidth)
			table.width(scrollerWidth);
		else {
			var maxWidth = 0, width;
			table.find('li').each(function () {
				var li = $(this);
				width = 0;
				$(this).find('span').each(function () {
					width += $(this).width();
				});

				width += 51 ; // cell padding, highlight border
				$(this).width(width);
				if (width > maxWidth)
					maxWidth = width;
			});
			if (maxWidth > scrollerWidth)
				table.width(maxWidth);
		}

	});

	$('#tree').triggerHandler('loaded');

	/* resize left column on window resize */
	$(window).resize(function () {
		$('#tree').triggerHandler('loaded');
	});


	/* validate form */
	$('#upload-form').submit(function (event) {
		event.stopPropagation();
			if ($('#description').val() == '') {
				alert('Please enter a description for the file.');
				return false;
			}

			if ($('#file').val() == '') {
				alert('Please browse for and select a file to upload.');
				return false;
			}

		return true;
	});

	/* select image */
	$('#file-list li').live('click', function () {
		var win = tinyMCEPopup.getWindowArg("window"), input = tinyMCEPopup.getWindowArg("input");
		var src = $(this).find('img').attr('src');

		var relationID = src.match(/id=([\d]+)/);

		var alt = win.document.getElementById('alt'), altValue = $(this).find('img').attr('alt');
        if (alt)
            alt.value = altValue;

        if (altValue == 'Homepage') {
            url = '/homepage/'+relationID[1].toString();
        }
        else if ('{FILTER}' == 'image') {
            url = '/cms/image.php?' + relationID[0].toString() + '&width=1024&height=2000';
        }
        else {
            url = '/send.php?' + relationID[0].toString();
        }

		win.document.getElementById(input).value = url;





		if (win.ImageDialog) {

			if (win.ImageDialog.getImageData)
				win.ImageDialog.getImageData();

			if (win.ImageDialog.showPreviewImage)
				win.ImageDialog.showPreviewImage(url);
		} else if (win.document.getElementById('width')) {
			win.document.getElementById('width').value = 425;
			win.document.getElementById('height').value = 350;
			win.document.getElementById('constrain').checked = true;
			win.window.Media.preview();
		}

		tinyMCEPopup.close();
	});

	/* open dir */
	$('#tree li').live('click', function () {
		var categoryID = $(this).attr('id').substring(5);
		$('#tree li.selected').removeClass('selected');
		$(this).addClass('selected');

		$.post('/ajax/file.php', {'filter' : '{FILTER}', 'categoryID': categoryID, 'homelink' : 1}, function (data) {
			if (data.error)
				alert(data.error);
			else {

				/* clear current images */
				$('#file-list li:not(.node-template)').remove();

				/* load in new images */
				for (i in data) {
					var row = data[i], clone = $('#file-list li.node-template').clone();

					clone.removeClass('node-template').attr('id', 'file-' + row.id);
					clone.find('.taskbar').text(row.description);
					clone.find('img').attr('alt', row.description)

					if ('{FILTER}' == 'image') {
						clone.find('img').attr('src', '/cms/image.php?id=' + row.id + '&height=100&width=75&resample=1');
					} else {
						clone.find('img').attr('src', '/images/mime/22x22/' + row.iconFile + '?id=' + row.id);
					}
					clone.find('.file-url').val();
					clone.appendTo('#file-list').show();
				}

				if (data.length == 0)
					$('<li class="empty">No files available.</li>').appendTo($('#file-list'));

				$('#categoryID').val(categoryID);
				$('#return').val($('#return').val().replace(/categoryID=[\d]+/, 'categoryID=' + categoryID));
			}
		}, 'json');
	});


});
$(window).load(function () {
	/* auto select uploaded image */
	var matched;
	if (matched = window.location.href.match(/fileID=([\d]+)/)) {
		var image = $('#file-' + matched[1].toString());
		image.click();
	}
});
</script>
<base target="_self" />
</head>
<body>

<div id="content">
  <div class="control">
    <form action="/cms/fileForm.php" method="post" enctype="multipart/form-data" id="upload-form">

        <span class="bold">UPLOAD NEW FILE:</span> <input type="file" name="file" id="file" />
        <span class="bold">DESCRIPTION:</span> <input type="text" name="description" id="description" />
        <input type="hidden" name="return" id="return" value="{REQUEST_URI}" />
        <input type="hidden" name="category" id="categoryID" value="{FILE_CATEGORY_ID}" />
        <input type="submit" class="submit" value="Upload" />
    </form>
  </div>
  <div class="left">
    <ul id="tree">
      <li id="node-0" class="server"><span class="root">Resources</span></li>
      <!-- BEGIN folder_list -->
      <li id="node-{CATEGORY_ID}" class="{CLASS}"><span class="elbow"></span><span class="file">{TITLE}</span></li>
      <!-- END folder_list -->
      <li class="dir-template"><span class="elbow"></span><span class="file"></span></li>
    </ul>
  </div>

  <div class="right">
    <ul id="file-list">
      <!-- BEGIN file -->
      <li id="file-{FILE_ID}">
        <div class="taskbar">{TITLE_SHORT}</div>
        <div class="image"> <!-- BEGIN thumbnail_image --><img alt="{DESCRIPTION}" src="/cms/image.php?id={FILE_ID}&height=80&width=75&resample=1" /> <!-- END thumbnail_image -->
        <!-- BEGIN thumbnail_flash --><img alt="{DESCRIPTION}" src="/images/mime/22x22/{FILE_ICON}?id={FILE_ID}" /> <!-- END thumbnail_flash -->
        	<input type="hidden" class="hide file-url" value="{URL}" /> </div>
      </li>
      <!-- END file -->
      <li class="node-template">
        <div class="taskbar"></div>
        <div class="image"> <img alt="" src="" /></div>
      </li>
    </ul>
