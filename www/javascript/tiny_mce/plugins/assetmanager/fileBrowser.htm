<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<title>{$lang_assetmanager_title}</title>
    <link rel="stylesheet" type="text/css" href="css/fileBrowser.css" />
	<script language="javascript" type="text/javascript" src="../../tiny_mce_popup.js"></script>
    <script language="javascript" type="text/javascript" src="jscripts/functions.js"></script>
	<base target="_self" />
</head>
<body> 

    <form action="/admin/modify-file.php" method="post" enctype="multipart/form-data">
        <div id="assetmanager_window">
        <table cellspacing="0" id="assetmanager_file_list">
        <thead>
        	<tr>
            	<td>Filename</td>
                <td>Size</td>
                <td>Type</td>
                <td>Added</td>
            </tr>
        </thead>
        <tbody>
            <!-- BEGIN file_row -->
        	<tr onClick="setCurrent(this);" {SELECTED}>
            	<td>{TITLE}<input type='hidden' name='url{FILE_ID}' id='url{FILE_ID}' value='{URL}' />
                		   <input type='hidden' name='title{FILE_ID}' id='title{FILE_ID}' value='{TITLE}' /></td>
                <td>{SIZE}kB</td>
                <td>{MIME}</td>
                <td>{DATE}</td>
            </tr>        
            <!-- END file_row -->
        </tbody>
        </table>
      </div>
   
   <div id="assetmanager_menu">
       <div style="float: left;">
            <input type="button" value="insert" onClick="insertFile();" style='float: left; margin-right: 10px;' />
            <input type="button" value="cancel" onClick="tinyMCEPopup.close();" style='float: left; margin-right: 10px;' />
       </div>
       
        <div style='float: right;'>
            <input type="file" name="file" />
            <input type='submit' value='upload' />
            
            <input type="hidden" name="redirect" value="assetFM" />
        </div> 
        
    </div>
	</form>
</body> 
</html>
