<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:m="http://www.w3.org/1998/Math/MathML">
<html>
	<head>
		<script type='text/javascript' src='javascript/jquery-1.7.1.min.js'></script>
		<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>

		<script type='text/javascript'>
			(function($) {

				/**
				 * Constructor
				 *
				 * @param options
				 */
				$.fn.evaluationRichText = function(options) {
					var config = init(options);

					initTiny();

					/**
					 * Set up options
					 *
					 * @param options
					 * @returns {*}
					 */
					function init(options) {
						var defaults = {
							id: 0
						}

						var derived = {
							editorSelector: 'richtext-' + options.id,
							questionForm: $('#questionForm-' + options.id)
						}

						return $.extend(defaults, derived, options);
					}

					/**
					 * Initialise tiny
					 */
					function initTiny() {
						tinyMCE.init({
							mode : "specific_textareas",
							editor_selector: config.editorSelector,

							setup : function(ed) {
								ed.onInit.add(function(ed) {
									var dom = ed.dom,
											doc = ed.getDoc(),
											el = doc.content_editable ? ed.getBody() : (tinymce.isGecko ? doc : ed.getWin());

									tinymce.dom.Event.add(el, 'blur', function(e) {
										$.fn.evaluationRichText.saveOne(config.questionForm);
									});
								});
							}
						});
					}
				}

				/**
				 * Save individual form contents
				 *
				 * @param element
				 */
				$.fn.evaluationRichText.saveOne = function(element) {
					tinyMCE.triggerSave();

					$.ajax({
						type: 'post',
						url: $(element).attr('action'),
						data: $(element).serialize(),

						/* Ensure all forms submit before redirecting
						 * Do not upgrade jquery to 1.9 or you'll lose this
						 */
						async: false,

						/* Callback on success
						 */
						success: function(responseText) {
							console.log(responseText);
						}
					});
				}
			}(jQuery));


			$(function() {
				$('#questionForm-1045').evaluationRichText({
					id: 1045
				});

				$('#questionForm-2234').evaluationRichText({
					id: 2234
				});

				$('#questionForm-4490').evaluationRichText({
					id: 4490
				});

				$('#trigger').click(function() {
					$('.questionForm').each(function(index, element) {
						var id = $(element).attr('id').replace('questionForm-', '');

						var hadoken = new Function("$.fn." + $(element).data('plugin') + ".saveOne($('#questionForm-" + id + "'))");
						hadoken();
					});
				});
			});
		</script>
	</head>
	<body>
		<form data-plugin='evaluationRichText' action='mort.php' method='post' class='questionForm' id='questionForm-1045'>
			<label>
				<textarea class='richtext-1045' name="answer">Red</textarea>
			</label>
		</form>

		<form data-plugin='evaluationRichText' action='mort.php' method='post' class='questionForm' id='questionForm-2234'>
			<label>
				<textarea class='richtext-2234' name="answer">Blue</textarea>
			</label>
		</form>

		<form data-plugin='evaluationRichText' action='mort.php' method='post' class='questionForm' id='questionForm-4490'>
			<label>
				<textarea class='richtext-4490' name="answer">Green</textarea>
			</label>
		</form>

		<a id='trigger'>Save it all</a>
	</body>
</html>
