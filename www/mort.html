<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:m="http://www.w3.org/1998/Math/MathML">
<html>
	<head>
		<script type='text/javascript' src='javascript/jquery-1.7.1.min.js'></script>
		<script type="text/javascript" src="/javascript/tiny_mce/tiny_mce.js"></script>

		<script type='text/javascript' src='/javascript/evaluation/evaluation.js'></script>
		<script type='text/javascript' src='/javascript/evaluation/richtext.js'></script>
		<script type='text/javascript' src='/javascript/evaluation/multiplechoice.js'></script>
		<script type='text/javascript' src='/javascript/evaluation/radio.js'></script>

		<script type='text/javascript'>
			$(function() {
				$('#questionForm-1045').evaluationRichText({
					id: 1045
				});

				$('#questionForm-1133').evaluationMultipleChoice({
					id: 1133
				});

				$('#questionForm-1134').evaluationRadio({
					id: 1134
				});
			});
		</script>
		<script type='text/javascript' src='/javascript/evaluation/evaluation.js'></script>
	</head>
	<body>
		<!-- Rich Text -->
		<form data-plugin='evaluationRichText' action='mort.php' method='post' class='questionForm' id='questionForm-1045'>
			<label>
				<textarea class='richtext-1045' name="answer">Red</textarea>
			</label>
		</form>

		<!-- Multiple Choice -->
		<form data-plugin='evaluationMultipleChoice' action='mort.php' method='post' class='questionForm' id='questionForm-1133'>
			<label class="checkboxes">
				A) <input name="answer[]" class="answerCorrect checkbox" type="checkbox" value="A"><span>First of the multiple choice</span>
			</label>
			<label class="checkboxes">
				B) <input name="answer[]" class="answerCorrect checkbox" type="checkbox" value="B"><span>Second of the multiple choice</span>
			</label>
		</form>

		<!-- Radio -->
		<form data-plugin='evaluationRadio' action='mort.php' method='post' class='questionForm' id='questionForm-1134'>
			<label class="checkboxes">
				A) <input name="answer" class="answerCorrect checkbox" type="radio" value="kitty"><span>First</span>
			</label>
			<label class="checkboxes">
				B) <input name="answer" class="answerCorrect checkbox" type="radio" value="cat"><span>Second</span>
			</label>
		</form>

		<a id='trigger'>Save it all</a>
	</body>
</html>
