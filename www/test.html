<!DOCTYPE html>
<html>
<head>
	<title></title>
	<style type="text/css">

		/* Avatar Item: a 32x32 icon with a name and a set of buttons which
		 * have optional text labels
 		 */
		.avatar-item {
			outline: 1px solid #f00;
			min-height: 32px;
			display: block;
			position: relative;
		}

		.avatar-item img {
			margin-right: 8px;
			float: left;
		}

		.avatar-item p {
			padding-left: 40px;
		}

		.avatar-item span.buttons {
			position: absolute;
			right: 0px;
			top: 0px;
			display: block;
		}

		.avatar-item span.buttons .button {
			border: 1px solid #dedede;
			background-color: #fafafa;
			padding: 8px 8px 4px 8px;
			display: inline-block;
			white-space: nowrap;
		}

		.button span {
			width: 14px;
			height: 14px;
			background: url(/images/core/icons/btn-icons.png) no-repeat;
			display: inline-block;
		}

		/* For optional labels on buttons
		 */
		.button.labelled span {
			margin-right: 8px;
		}

		/* Number of buttons, specify p width
		 */
		.avatar-item p.one-button {
			padding-right: 32px;
		}

		.avatar-item p.four-button {
			padding-right: 152px;
		}







		/* Button menagerie (same as .btn.list, .btn.star etc)
		 */
		.button.star span {
			background-position: 0 -840px;
		}

		.button.list span {
			background-position: 0 -756px;
		}

		.button.cross span {
			background-position: 0 -952px;
		}

		.button.docs span {
			background-position: 0 -980px;
		}
	</style>
</head>
<body>
	<div class="avatar-item">
		<img width="32" height="32" alt="return_ts.doc.pdf" src="/images/mime/60x60/pdf_alt.png" />
		<p class="four-button">
			return_ts.doc.pdf (117.67 KB)<br />
			Wednesday September 3rd 2014<br />
			The Greatest Mort
		</p>
		<span class="buttons">
			<a href='#' class='button cross'><span></span></a>

			<a href='#' class='button star'><span></span></a>
			<a href='#' class='button list'><span></span></a>

	</div>
